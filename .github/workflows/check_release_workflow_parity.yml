name: "Lint: release workflow parity"

# Two triggers, two behaviours, because the two situations differ:
#
#   pull_request  reports a difference as a warning and lets the PR through. A
#                 difference here is often the first half of an intentional
#                 pair -- change main, then sync the support branch -- and
#                 blocking that would only push people to skip the check.
#
#   push          fails. The branches are in their final state, so a difference
#                 is real drift and someone needs to see it.
on:
  pull_request:
    paths:
      - ".github/workflows/goreleaser.yml"
      - ".github/workflows/auto-tag-after-mql-bump.yml"
      - ".github/scripts/check-release-workflow-parity.sh"
      - ".github/workflows/check_release_workflow_parity.yml"
  push:
    branches:
      - main
      - "v[0-9]+"
    paths:
      - ".github/workflows/goreleaser.yml"
      - ".github/workflows/auto-tag-after-mql-bump.yml"
      - ".github/scripts/check-release-workflow-parity.sh"
      - ".github/workflows/check_release_workflow_parity.yml"
  workflow_dispatch:

permissions: {}

jobs:
  parity:
    name: Release workflows match across branches
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needs every release branch, not just this one.
          fetch-depth: 0
      - name: Compare release workflows
        run: |
          ./.github/scripts/check-release-workflow-parity.sh \
            "${{ github.event_name == 'pull_request' && 'report' || 'strict' }}"
