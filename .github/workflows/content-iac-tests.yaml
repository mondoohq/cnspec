name: Content IaC Variant Tests

## Validates the Terraform / CloudFormation / Bicep / Dockerfile / Kubernetes
## policy checks in content/ against their per-check pass/fail fixtures
## (content/validation/scans/fixtures/iac-variants).
##
## This suite is deliberately separate from the main "Code Test" Go job: it lives
## behind the `iac_variants` build tag, downloads extra providers (bicep), and
## runs many provider-backed scans, so it must never slow down or destabilize the
## default `go test ./...`. One matrix job per IaC type keeps wall-clock down and
## makes failures easy to attribute.
##
## The Terraform suite is by far the largest (~1,200 variants, thousands of
## provider-backed scans). Because in-process concurrency is capped at a safe
## -parallel to avoid provider-subprocess deadlocks, we cut its wall-clock by
## fanning it out across TF_SHARDS runners: each terraform matrix entry sets
## IAC_SHARD_INDEX/IAC_SHARD_TOTAL, and the harness (iacShard/inShard in
## content/validation/scans/iac_variants_test.go) runs only the scenarios that
## hash into its shard. The smaller suites (cloudformation/bicep/dockerfile/
## kubernetes) stay on one runner each.
##
## content/validation/README.md documents this workflow alongside every other
## content check.
##
## The `coverage` job runs no scans at all. It compares the IaC variants each
## policy declares against the fixtures on disk and requires every one of them to
## have both a pass and a fail fixture, so a variant added without them fails CI
## instead of merging untested.
on:
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - ".github/workflows/content-iac-tests.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "content/**"
      - ".github/workflows/content-iac-tests.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-iac-variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The terraform suite is sharded across several runners (IAC_SHARD_*); the
      # smaller suites run on a single runner. To change the terraform fan-out,
      # add/remove terraform entries and keep every `shards` value equal to the
      # number of terraform entries.
      matrix:
        include:
          # shards: 1 = run everything on one runner; the harness treats total 1
          # as "no sharding". Explicit values keep IAC_SHARD_* non-empty so
          # Actions emits no empty-env annotations.
          # The coverage job runs no scans; it enforces the fixture-coverage
          # 100% pass/fail fixture coverage, so a new variant cannot merge
          # without fixtures.
          - { iac: coverage, shard: 0, shards: 1 }
          # The closed loop runs one scan per variant that has a same-language
          # remediation snippet (~1,900), so it is sharded like terraform.
          - { iac: remediation, shard: 0, shards: 4 }
          - { iac: remediation, shard: 1, shards: 4 }
          - { iac: remediation, shard: 2, shards: 4 }
          - { iac: remediation, shard: 3, shards: 4 }
          - { iac: cloudformation, shard: 0, shards: 1 }
          - { iac: bicep, shard: 0, shards: 1 }
          - { iac: dockerfile, shard: 0, shards: 1 }
          - { iac: kubernetes, shard: 0, shards: 1 }
          - { iac: terraform, shard: 0, shards: 8 }
          - { iac: terraform, shard: 1, shards: 8 }
          - { iac: terraform, shard: 2, shards: 8 }
          - { iac: terraform, shard: 3, shards: 8 }
          - { iac: terraform, shard: 4, shards: 8 }
          - { iac: terraform, shard: 5, shards: 8 }
          - { iac: terraform, shard: 6, shards: 8 }
          - { iac: terraform, shard: 7, shards: 8 }
    name: ${{ (matrix.iac == 'terraform' || matrix.iac == 'remediation') && format('{0} (shard {1}/{2})', matrix.iac, matrix.shard, matrix.shards) || matrix.iac }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=${{ env.golang-version }}"
          check-latest: true
          cache: false
      # https://github.com/actions/cache/blob/main/examples.md#go---modules
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Make provider dir
        run: mkdir -p ${PWD}/${GITHUB_JOB}/.providers
      - name: Set provider env
        run: echo "PROVIDERS_PATH=${PWD}/${GITHUB_JOB}/.providers" >> $GITHUB_ENV

      # matrix.iac is a fixed enum (terraform|cloudformation|bicep|dockerfile|
      # kubernetes|coverage) that maps to a dedicated make target — no untrusted input
      # reaches the shell. The non-terraform suites pass shards=1, which the
      # harness treats as "run every scenario" (no sharding).
      - name: Run ${{ matrix.iac }} variant tests
        env:
          IAC_SHARD_INDEX: ${{ matrix.shard }}
          IAC_SHARD_TOTAL: ${{ matrix.shards }}
        run: make test/content/iac/${{ matrix.iac }}
