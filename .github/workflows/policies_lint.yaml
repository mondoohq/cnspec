---
name: Lint Policies

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "content/**"
      - "go.mod"
      - ".github/workflows/policies_lint.yaml"
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "go.mod"
      - ".github/workflows/policies_lint.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"

      # Lint with the cnspec this branch builds, not a published image: the
      # content here is released with this code, and a linter from the previous
      # major validates it against a schema that still has the fields the new
      # major removed.
      - name: Build cnspec
        run: go build -o "${RUNNER_TEMP}/cnspec" ./apps/cnspec

      # A source build carries no release version, so it would resolve providers
      # from the stable channel. Preview holds the providers this branch is
      # released with. Linting content/ also covers content/querypacks.
      - name: Lint cnspec policies and output SARIF
        env:
          MONDOO_UPDATE_CHANNEL: preview
          PROVIDERS_PATH: ${{ runner.temp }}/providers
        run: |
          mkdir -p "${PROVIDERS_PATH}"
          "${RUNNER_TEMP}/cnspec" policy lint ./content -o sarif --output-file results.sarif
      - name: Display SARIF file content
        run: jq . results.sarif
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
      - name: Check SARIF for errors
        run: |
          error_count=$(jq '[.runs[0].results[] | select(.level == "error")] | length' results.sarif)
          if [ "$error_count" -gt 0 ]; then
            echo "Found $error_count error(s). Check the Security tab or review the SARIF output above."
            exit 1
          fi
