name: "Test Report"
on:
  workflow_run:
    workflows: ["Code Test"] # runs after tests
    types:
      - completed

permissions:
  contents: read

jobs:
  report:
    permissions:
      actions: read # Required to read the artifact
      contents: read # Required to read the source
      checks: write # Required to write the results
      pull-requests: write # Required to write comments
    runs-on: ubuntu-latest
    steps:
      - name: Download and Extract Artifacts
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"
