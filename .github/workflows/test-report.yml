name: "Test Report"
on:
  workflow_run:
    workflows: ["Code Test"] # runs after tests
    types:
      - completed

permissions:
  contents: read

jobs:
  report:
    permissions:
      actions: read # Required to read the artifact
      contents: read # Required to read the source
      checks: write # Required to write the results
      pull-requests: write # Required to write comments
    runs-on: ubuntu-latest
    steps:
      - name: Download and Extract Artifacts
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"
