---
name: Validate Policy Remediation Content

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "content/**"

permissions:
  contents: read

jobs:
  # Guards the other jobs rather than the content: it checks that each validator
  # still *finds* the blocks it used to. Every extractor here is a regex over
  # policy YAML, and one that stops matching reports success over an empty set —
  # which looks exactly like a clean run. Needs no linters installed, so it is
  # seconds rather than minutes.
  validate-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check that no validator stopped seeing its blocks
        run: python3 content/validation/check_validation_coverage.py --check

  validate-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install AWS CLI v2
        # Official AWS installer (https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html).
        # ubuntu-latest usually has aws pre-installed, but installing explicitly
        # keeps this job independent of runner-image changes.
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Install Google Cloud SDK
        # Official tarball from dl.google.com (https://cloud.google.com/sdk/docs/install-sdk#linux).
        # ubuntu-latest has gcloud pre-installed, but installing fresh ensures
        # the validator introspects the latest command tree.
        run: |
          curl -sSL "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz" -o /tmp/gcloud.tar.gz
          tar -xzf /tmp/gcloud.tar.gz -C "$HOME"
          "$HOME/google-cloud-sdk/install.sh" --quiet --path-update false --usage-reporting false
          echo "$HOME/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/google-cloud-sdk/bin/gcloud" --version

      - name: Install OCI CLI
        # pip install always resolves to the latest oci-cli on PyPI.
        run: pip install --upgrade oci-cli

      - name: Install doctl
        # Pinned release tarball from
        # https://github.com/digitalocean/doctl/releases. Bump DOCTL_VERSION
        # and DOCTL_SHA256 in lockstep when DigitalOcean ships new commands
        # or flags — the SHA-256 is published in the per-release
        # `doctl-<version>-checksums.sha256` file. No auth needed for
        # `doctl --help` introspection.
        env:
          DOCTL_VERSION: "1.166.0"
          DOCTL_SHA256: "1596424b64091a7939bde561daf2402ca8a141966429928e688d20d17091ec89"
        run: |
          # --fail makes curl exit non-zero on HTTP 4xx/5xx (default -sSL silently
          # writes the error body to disk and trips the sha256 check below).
          # --retry handles transient GitHub release-asset blips.
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -sSL \
            "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/doctl.tar.gz
          echo "${DOCTL_SHA256}  /tmp/doctl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/doctl.tar.gz -C /tmp
          sudo mv /tmp/doctl /usr/local/bin/doctl
          doctl version

      - name: Verify kubectl and gh
        # Both ship preinstalled on ubuntu-latest runner images and are
        # kept current by the image maintainers. The Cobra-tree walkers
        # only read `__complete` / `--help` output, so any recent version
        # works; fail fast here if a future image drops them.
        run: |
          kubectl version --client
          gh --version

      - name: Install glab
        # Pinned release tarball from the gitlab-org/cli generic package
        # registry. Bump GLAB_VERSION and GLAB_SHA256 in lockstep when
        # GitLab ships new commands or flags.
        env:
          GLAB_VERSION: "1.113.0"
          GLAB_SHA256: "c265589fb2018f310b6a27df9356efee42991f858e7e3a5fa232228a13b47467"
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -sSL \
            "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${GLAB_VERSION}/glab_${GLAB_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/glab.tar.gz
          echo "${GLAB_SHA256}  /tmp/glab.tar.gz" | sha256sum -c -
          mkdir -p /tmp/glab-extract
          tar -xzf /tmp/glab.tar.gz -C /tmp/glab-extract
          sudo mv /tmp/glab-extract/bin/glab /usr/local/bin/glab
          glab --version

      - name: Install hcloud
        # Pinned release tarball from
        # https://github.com/hetznercloud/cli/releases. Bump HCLOUD_VERSION
        # and HCLOUD_SHA256 in lockstep when Hetzner ships new commands or
        # flags — the SHA-256 is published in the per-release checksums.txt.
        env:
          HCLOUD_VERSION: "1.67.0"
          HCLOUD_SHA256: "7164483e05a1abef492768db429a28c21d579dc70e807558cb140debc2971477"
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -sSL \
            "https://github.com/hetznercloud/cli/releases/download/v${HCLOUD_VERSION}/hcloud-linux-amd64.tar.gz" \
            -o /tmp/hcloud.tar.gz
          echo "${HCLOUD_SHA256}  /tmp/hcloud.tar.gz" | sha256sum -c -
          mkdir -p /tmp/hcloud-extract
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/hcloud-extract
          sudo mv /tmp/hcloud-extract/hcloud /usr/local/bin/hcloud
          hcloud version

      - name: Install databricks CLI
        # Pinned release zip from
        # https://github.com/databricks/cli/releases. Bump DATABRICKS_VERSION
        # and DATABRICKS_SHA256 in lockstep when Databricks ships new commands
        # or flags — the SHA-256 is published in the per-release
        # `databricks_cli_<version>_SHA256SUMS` file. No auth needed for the
        # `__complete` / `--help` introspection the validator performs.
        env:
          DATABRICKS_VERSION: "1.12.1"
          DATABRICKS_SHA256: "60833feee22caa98f575c4948ccbbc9473fda0dd80c9b79544dc7b079f6a9815"
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -sSL \
            "https://github.com/databricks/cli/releases/download/v${DATABRICKS_VERSION}/databricks_cli_${DATABRICKS_VERSION}_linux_amd64.zip" \
            -o /tmp/databricks.zip
          echo "${DATABRICKS_SHA256}  /tmp/databricks.zip" | sha256sum -c -
          mkdir -p /tmp/databricks-extract
          unzip -q /tmp/databricks.zip -d /tmp/databricks-extract
          sudo mv /tmp/databricks-extract/databricks /usr/local/bin/databricks
          databricks version

      - name: Validate remediation commands
        run: python3 content/validation/validate_remediation_commands.py --github-actions

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          # Keep at the latest release. Note that the `signature` attribute the
          # validator sets on ruleset plugins needs >= 0.62; v0.61.0 and earlier
          # silently ignore it.
          tflint_version: v0.64.0

      - name: Validate terraform remediation blocks
        env:
          # `tflint --init` downloads ruleset plugins from GitHub releases.
          # Without an authenticated token it uses the 60-request/hour
          # anonymous GitHub API limit, which is exhausted partway through
          # plugin init and fails the google/azurerm rulesets. The token
          # raises the limit to 5000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 content/validation/validate_terraform_remediation.py --github-actions

  validate-cloudformation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        # cfn-lint bundles the AWS resource specification, so the pinned
        # version determines which resource types and properties are known.
        # Bump it to pick up new services and fresh deprecation warnings.
        run: pipx install cfn-lint==1.55.1

      - name: Validate cloudformation remediation blocks
        run: python3 content/validation/validate_cloudformation_remediation.py --github-actions

  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bicep CLI
        # Pinned release binary from https://github.com/Azure/bicep/releases.
        # Bump BICEP_VERSION and BICEP_SHA256 in lockstep; the pinned version
        # determines which resource types and apiVersions are known, so a bump
        # can surface newly deprecated apiVersions in existing snippets.
        #
        # Installed directly rather than via `az bicep install`, which puts the
        # binary under the Azure CLI's config directory (AZURE_CONFIG_DIR, not
        # always ~/.azure on a runner) and gives nothing to checksum.
        env:
          BICEP_VERSION: "0.46.1"
          BICEP_SHA256: "3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9"
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -sSL \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64" \
            -o /tmp/bicep
          echo "${BICEP_SHA256}  /tmp/bicep" | sha256sum -c -
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Validate bicep remediation blocks
        run: python3 content/validation/validate_bicep_remediation.py --github-actions

  validate-ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pipx install ansible-lint==26.8.0

      - name: Validate ansible remediation blocks
        run: python3 content/validation/validate_ansible_remediation.py --github-actions

  validate-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Validate bash remediation blocks
        run: python3 content/validation/validate_bash_remediation.py --github-actions

  validate-chef:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install cookstyle
        # cookstyle is Chef's RuboCop distribution. The runner image ships a
        # system Ruby, so no separate toolchain setup is needed.
        run: sudo gem install cookstyle -v 8.6.10 --no-document

      - name: Validate chef remediation blocks
        run: python3 content/validation/validate_chef_remediation.py --github-actions
