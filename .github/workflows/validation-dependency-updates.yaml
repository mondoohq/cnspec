---
name: Validation Dependency Updates

## Opens pull requests for the pins the variant and remediation validators
## check against.
##
## Dependabot watches `gomod` and `github-actions`. It does not watch the
## things that actually decide what these validators accept: the linter
## releases and vendor CLIs installed by `validate-remediation.yaml`, the
## tflint rulesets and Terraform provider constraints in
## `validate_terraform_remediation.py`, the OpenAPI commit pins in
## `validators/openapi.py`, and the checked-in CLI grammars in `cmd_data/`.
## Left alone, they quietly rot: the validators keep passing while checking
## remediation against a cloud API that has moved on.
##
## `validation-upstream-drift.yaml` already *reports* that, into one long-lived
## issue. A report is easy to stop reading. This workflow does the mechanical
## half -- rewrite the pin, re-checksum the artifact, regenerate the grammar --
## and leaves exactly the part that needs a person: deciding whether a red CI
## run means the pin is wrong or the content is.
##
## One pull request per pin, on a stable branch that carries the pin's name and
## not its version. That way a bump whose CI goes red (a Terraform provider
## major usually will) never blocks the eight clean ones beside it, and next
## week's run updates the open pull request instead of opening another.
on:
  schedule:
    # Mondays 05:00 UTC, an hour before the drift report, so a maintainer
    # reading that report already has the corresponding pull requests to look at.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Bump a single pin (slug, e.g. cfn-lint or terraform-provider-aws). Empty means every pin that is behind."
        required: false
        type: string
      dry_run:
        description: "Report what would be bumped without opening pull requests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two overlapping runs would race to force-push the same deps/validation/*
  # branches. Never cancel in progress: a half-run leaves a branch pushed with
  # no pull request opened for it.
  group: validation-dependency-updates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      count: ${{ steps.pins.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Find pins that are behind
        id: pins
        env:
          # ~45 api.github.com calls. Unauthenticated those share a 60/hour
          # budget with the whole runner IP, and a throttled run reports
          # "could not reach upstream" for most pins -- which here would mean
          # silently opening no pull requests at all.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          python3 content/validation/check_upstream_versions.py --format json > /tmp/pins.json
          # `automatable` excludes the checked-in grammars, which cannot be
          # bumped by rewriting a string -- they are regenerated by the
          # dedicated jobs below, which install the tool first.
          jq -c --arg only "$ONLY" '
            [ .[]
              | select(.state == "behind" and .automatable)
              | select($only == "" or .slug == $only)
              | {name, slug, kind, pinned, latest} ]
          ' /tmp/pins.json > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.name): \(.pinned) -> \(.latest)"' /tmp/matrix.json

      - name: Summarize
        run: |
          {
            echo "### Validator pin status"
            echo
            python3 content/validation/check_upstream_versions.py --format markdown
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Serialized enough to stay polite to the release hosts each bump
      # re-downloads from, while still clearing a backlog in one run.
      max-parallel: 4
      matrix:
        pin: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: bump ${{ matrix.pin.slug }}
    steps:
      # An installation token from the mondoo-mergebot GitHub App rather than
      # GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN do not trigger
      # workflows, so the bump would sit there with no validator run against
      # it -- and CI's verdict is the entire point of opening it as a pull
      # request. Same reasoning as cnquery-update.yml.
      - name: Generate mergebot token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
          owner: mondoohq
          repositories: cnspec

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # matrix.pin.slug comes from this repo's own checker, not from anything a
      # contributor supplies, and the bumper rejects a slug it does not know.
      - name: Apply the bump
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN: ${{ matrix.pin.slug }}
        run: |
          set -euo pipefail
          python3 content/validation/bump_upstream_versions.py \
            --only "$PIN" \
            --json /tmp/bump.json \
            --pr-body /tmp/pr-body.md \
            --github-output
          cat /tmp/pr-body.md || true

      # Upstream can publish between the discover job and this one, and a pin
      # somebody bumped by hand in the meantime is already current. Either way
      # there is nothing to open.
      - name: Create pull request
        id: cpr
        if: ${{ steps.bump.outputs.applied }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          base: main
          labels: dependencies,validation-pins
          committer: "Mondoo Tools <tools@mondoo.com>"
          author: "Mondoo Tools <tools@mondoo.com>"
          commit-message: ${{ steps.bump.outputs.title }}
          title: ${{ steps.bump.outputs.title }}
          # No version in the branch name: the branch belongs to the pin, so a
          # release next week updates this pull request rather than opening a
          # second one and orphaning the first.
          branch: ${{ steps.bump.outputs.branch }}
          body-path: /tmp/pr-body.md

      - name: Report
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          OP: ${{ steps.cpr.outputs.pull-request-operation }}
        run: echo "$OP $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  # The checked-in grammars cannot be bumped by rewriting a version string: the
  # pin records which tool produced the JSON, so moving it means installing that
  # tool and re-running its dump script. Never hand-edit anything in cmd_data/.
  refresh-azure-grammar:
    if: ${{ !inputs.dry_run && (inputs.only == '' || inputs.only == 'azure-cli-grammar') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate mergebot token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
          owner: mondoohq
          repositories: cnspec

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the latest Azure CLI
        # Installed with pip rather than the apt repository so `which az` and
        # the site-packages glob dump_azure_commands.py performs both resolve
        # inside this job's Python, which is where it runs its extraction.
        run: |
          python3 -m pip install --upgrade azure-cli
          az version --output tsv | head -1

      - name: Regenerate the grammar
        # Phase 2 re-reads `az <cmd> --help` for every command the policies
        # actually use, so this is minutes rather than seconds.
        timeout-minutes: 45
        run: |
          set -euo pipefail
          python3 content/validation/dump_azure_commands.py
          git diff --stat -- content/validation/cmd_data/azure_commands.json

      - name: Validate the Azure remediation against the new grammar
        # A grammar refresh is the one case where the validator can be run
        # right here: the only tool it needs is the CLI just installed. A
        # failure means a remediation or audit step uses a command or flag the
        # new CLI dropped -- real content work, surfaced in the pull request
        # body instead of discovered after merge.
        id: validate
        continue-on-error: true
        run: python3 content/validation/validate_remediation_commands.py azure

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          base: main
          labels: dependencies,validation-pins
          committer: "Mondoo Tools <tools@mondoo.com>"
          author: "Mondoo Tools <tools@mondoo.com>"
          commit-message: "🧹 validation: regenerate the Azure CLI command grammar"
          title: "🧹 validation: regenerate the Azure CLI command grammar"
          branch: deps/validation/azure-cli-grammar
          body: |
            Regenerated `cmd_data/azure_commands.json` with
            `dump_azure_commands.py` against the latest `azure-cli`, by the
            weekly `Validation Dependency Updates` workflow.

            The grammar decides which `az` subcommands and flags the validator
            accepts in `id: cli` remediation and in `audit:` blocks, so a stale
            one silently accepts commands the CLI has since dropped.

            `validate_remediation_commands.py azure` against the new grammar:
            **${{ steps.validate.outcome }}**. A failure is the useful signal
            here -- it names the remediation steps the new CLI no longer
            supports.

  refresh-vercel-grammar:
    if: ${{ !inputs.dry_run && (inputs.only == '' || inputs.only == 'vercel-cli-grammar') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate mergebot token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
          owner: mondoohq
          repositories: cnspec

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the latest vercel CLI
        run: |
          npm install -g vercel@latest
          vercel --version

      - name: Regenerate the grammar
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python3 content/validation/dump_vercel_commands.py
          # dump_vercel_commands.py names the version it expects in its own
          # VERCEL_VERSION constant, the one place a version is written twice.
          # Left behind, the script warns about a mismatch with itself forever.
          python3 content/validation/bump_upstream_versions.py --sync-dump-pins

      - name: Validate the Vercel remediation against the new grammar
        id: validate
        continue-on-error: true
        run: python3 content/validation/validate_remediation_commands.py vercel

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          base: main
          labels: dependencies,validation-pins
          committer: "Mondoo Tools <tools@mondoo.com>"
          author: "Mondoo Tools <tools@mondoo.com>"
          commit-message: "🧹 validation: regenerate the vercel CLI command grammar"
          title: "🧹 validation: regenerate the vercel CLI command grammar"
          branch: deps/validation/vercel-cli-grammar
          body: |
            Regenerated `cmd_data/vercel_commands.json` with
            `dump_vercel_commands.py` against the latest `vercel` CLI, by the
            weekly `Validation Dependency Updates` workflow.

            `vercel` is a Node.js CLI with no completion surface, so its
            grammar is parsed out of `--help` once and checked in rather than
            introspected per run. That makes it the copy most likely to go
            stale unnoticed.

            `validate_remediation_commands.py vercel` against the new grammar
            (CLI *and* REST API checks): **${{ steps.validate.outcome }}**.

  # The Tailscale, Atlassian, and Vercel specs are served from live,
  # unversioned endpoints, so there is no version to compare and nothing for
  # the drift report to flag. "Needs updating" here means only "the bytes
  # changed", which is why this job regenerates unconditionally and lets
  # create-pull-request decide whether anything came of it.
  refresh-api-specs:
    if: ${{ !inputs.dry_run && (inputs.only == '' || inputs.only == 'api-specs') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate mergebot token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
          owner: mondoohq
          repositories: cnspec

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # Tailscale serves YAML; dump_api_specs.py converts it to JSON so the
        # validators themselves stay stdlib-only.
        run: python3 -m pip install --upgrade pyyaml

      - name: Refresh the checked-in specs
        run: python3 content/validation/dump_api_specs.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          base: main
          labels: dependencies,validation-pins
          committer: "Mondoo Tools <tools@mondoo.com>"
          author: "Mondoo Tools <tools@mondoo.com>"
          commit-message: "🧹 validation: refresh the checked-in OpenAPI specs"
          title: "🧹 validation: refresh the checked-in OpenAPI specs"
          branch: deps/validation/api-specs
          body: |
            Refreshed the Tailscale, Atlassian, and Vercel OpenAPI specs with
            `dump_api_specs.py`, by the weekly `Validation Dependency Updates`
            workflow.

            These three vendors serve their specs from live, unversioned
            endpoints, so unlike the Cloudflare/Slack/Grafana/MongoDB Atlas
            specs there is no commit SHA to pin and no version for the drift
            report to compare. The only way to notice movement is to re-fetch
            and diff.

            The validators check every `curl` call in `id: cli` / `id: api`
            remediation and in `audit:` blocks against these specs, so the
            per-pull-request `Validate Policy Remediation Content` run is what
            says whether any documented call no longer matches the API.
