---
name: Validator Upstream Drift

## Reports which upstreams the remediation validators are pinned behind.
##
## The validators are only as good as what they check against — a linter
## release, a vendor CLI grammar, an OpenAPI spec — and every one of those is
## pinned somewhere in the repo. Dependabot covers gomod and github-actions, so
## none of these pins are watched by anything.
##
## This is deliberately a *report*, not a gate. A bump is a judgement call: a
## new cfn-lint can legitimately start failing snippets that were fine, and that
## needs a person to decide whether the content or the pin is wrong. So the job
## writes a table into one long-lived issue and never fails the build.
##
## `validation-dependency-updates.yaml` runs an hour before this and opens a
## pull request per *kind* of pin that moved, so most rows below have a pull
## request behind them -- shared with the other rows of their kind, because
## each kind lives in one block of one file and a pull request per pin made
## them all conflict. The two workflows are complementary: the report is the
## whole picture including the pins that need a person, the pull requests are
## the mechanical half already done.
on:
  schedule:
    # Mondays 06:00 UTC, an hour before the validators themselves run, so the
    # "your pins are behind" table is already waiting if the run breaks.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check pinned versions against upstream
        env:
          # ~45 api.github.com calls per run. Unauthenticated that shares a
          # 60/hour budget with the whole runner IP, and a throttled run would
          # report "could not reach upstream" for most pins — a quiet false
          # all-clear. With this token the limit is 5,000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Each of these pins decides what the remediation and IaC-variant"
            echo "validators check against. \`BEHIND\` is not automatically a bug — it"
            echo "is a prompt to look."
            echo
            python3 content/validation/check_upstream_versions.py --format markdown
            echo
            echo "Most of these already have a pull request: the weekly"
            echo "\`Validation Dependency Updates\` workflow opens one per *kind* of pin"
            echo "it can bump mechanically, so rows sharing a \`Kind\` share a pull"
            echo "request. Rows marked \`(manual bump)\` do not — a checked-in"
            echo "grammar is refreshed by re-running its dump script against the new"
            echo "tool, which that workflow does in its own jobs."
            echo
            echo "The pins are declared in \`.github/workflows/validate-remediation.yaml\`,"
            echo "\`content/validation/validate_terraform_remediation.py\`,"
            echo "\`content/validation/validators/openapi.py\`, and the \`_meta\` block of"
            echo "each \`cmd_data/*.json\`. \`content/validation/upstream_pins.py\` is what"
            echo "reads them; refresh instructions live in \`content/CLAUDE.md\`."
          } > /tmp/drift.md
          cat /tmp/drift.md

      - name: Publish the report to a tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create validation-drift --force \
            --color B7791F \
            --description "Remediation validation broke without a content change"
          title="Validator upstream pins: weekly drift report"
          existing=$(gh issue list --state open --label validation-drift \
            --search "$title in:title" --json number --jq '.[0].number // empty')
          # One long-lived issue whose body is replaced each week: the table is a
          # snapshot of right now, so appending weekly comments would bury the
          # current state under stale ones.
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/drift.md
          else
            gh issue create --title "$title" --body-file /tmp/drift.md --label validation-drift
          fi
