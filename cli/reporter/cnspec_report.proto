syntax = "proto3";

package mondoo.report.cnspec.v1;

option go_package = "go.mondoo.com/cnspec/cli/reporter";

import "cli/reporter/mql_report.proto";

message Report {
  map <string, mondoo.report.mql.v1.Asset> assets = 1;
  map <string, mondoo.report.mql.v1.DataValues> data = 2;
  map <string, string> errors = 3;
  map <string, ScoreValues> scores = 4;
  // What became of each exception read from config files, keyed by asset
  // (cnspec ADR-0006). Absent when the scan read none.
  map <string, ExceptionDecisions> exceptions = 5;
}

message ScoreValues {
  map <string, ScoreValue> values = 1;
}

message ScoreValue {
  // 1 was score, replaced by riskScore below
  reserved 1;
  reserved "score";

  string status = 2;
  uint32 riskScore = 3;
}
message ExceptionDecisions {
  repeated ExceptionDecision items = 1;
}

message ExceptionDecision {
  // the check as the config names it
  string check = 1;
  string checkMrn = 2;
  // disable, risk-accepted, false-positive or workaround
  string action = 3;
  // applied, accepted, auto-accepted, pending, rejected, expired,
  // not-submitted or unknown-check
  string outcome = 4;
  string reason = 5;
  repeated string approvers = 6;
  string title = 7;
  string justification = 8;
  // RFC3339; empty when the exception does not expire
  string validUntil = 9;
  repeated string paths = 10;
  string matchedPath = 11;
  ExceptionSource source = 12;
}

message ExceptionSource {
  // user or context
  string scope = 1;
  string provider = 2;
  string repository = 3;
  string ref = 4;
  string path = 5;
}
