AWSTemplateFormatVersion: "2010-09-09"
Resources:
  S3PolicyChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/cloudtrail/logs
      FilterPattern: '{ ($.eventSource = s3.amazonaws.com) && (($.eventName = PutBucketAcl) || ($.eventName = PutBucketPolicy) || ($.eventName = PutBucketCors) || ($.eventName = DeleteBucketPolicy) || ($.eventName = DeleteBucketCors)) }'
      MetricTransformations:
        - MetricName: S3BucketPolicyChanges
          MetricNamespace: CISBenchmark
          MetricValue: "1"
  # Trail feeding the log group, and an alarm on the filter's metric. The CIS
  # control requires a metric filter plus an alarm that notifies.
  ExampleTrail:
    Type: AWS::CloudTrail::Trail
    Properties:
      TrailName: example-trail
      S3BucketName: example-cloudtrail-logs
      IsLogging: true
      IncludeGlobalServiceEvents: true
  ExampleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: example-alarm
      Namespace: CISBenchmark
      MetricName: ExampleMetric
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Sum
      Threshold: 1
      AlarmActions:
        - arn:aws:sns:us-east-1:123456789012:example-topic
