AWSTemplateFormatVersion: "2010-09-09"
Resources:
  # Encrypted with the default aws/ebs key, which the account cannot rotate on
  # its own schedule or deny access to independently.
  AppDataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 500
      VolumeType: gp3
      Encrypted: true
