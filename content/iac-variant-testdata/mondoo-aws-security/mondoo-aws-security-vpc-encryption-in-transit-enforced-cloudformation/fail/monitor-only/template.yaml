AWSTemplateFormatVersion: "2010-09-09"
Resources:
  ProdVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16

  # monitor mode reports unencrypted flows but does not block them, so traffic
  # still crosses the VPC in cleartext.
  ProdVpcEncryption:
    Type: AWS::EC2::VPCEncryptionControl
    Properties:
      VpcId: !Ref ProdVpc
      Mode: monitor
