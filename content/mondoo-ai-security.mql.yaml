  # ---------------------------------------------------------------------------
  # MCP server governance
  # ---------------------------------------------------------------------------
  - uid: mondoo-ai-security-no-unapproved-mcp-servers
    title: No unapproved MCP servers across all AI agents
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-uem-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-5
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-10
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm03
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    props:
      - uid: mondooAiSecurityApprovedMcpServers
        title: Regex matching approved MCP server names (applies to all agents)
        mql: |
          return /(?i)^$/
    mql: |
      claude.code.mcpServers.none(name != props.mondooAiSecurityApprovedMcpServers)
      openai.codex.mcpServers.none(name != props.mondooAiSecurityApprovedMcpServers)
      cursor.mcpServers.none(name != props.mondooAiSecurityApprovedMcpServers)
      github.copilot.mcpServers.none(name != props.mondooAiSecurityApprovedMcpServers)
      windsurf.mcpServers.none(name != props.mondooAiSecurityApprovedMcpServers)
      gemini.mcpServers.none(name != props.mondooAiSecurityApprovedMcpServers)
    docs:
      desc: |
        This check verifies that no unapproved Model Context Protocol server is registered with any AI agent on the endpoint.

        MCP servers give an agent tool access to systems: source control, ticketing, messaging, databases, cloud APIs. The check reads the registered server list across every agent this policy knows about, including Claude Code, OpenAI Codex, Cursor, and the others, and fails any server not named in this policy's approved-MCP property.

        **Why this matters**

        An MCP server is a capability grant, not a data path. Where a completion tool sends code to a provider, a registered MCP server lets the agent read from and act on the system behind it, with whatever credentials that server holds.

        That inverts the usual containment argument. An agent confined to a repository is a bounded problem; an agent with a registered MCP server for the ticket tracker, the internal wiki, and a cloud account is operating across the systems those servers reach, and the blast radius of a prompt injection grows accordingly.

        The credentials are the part most often missed. An MCP server is configured once with a token and then used repeatedly, so the token's scope is the agent's scope, and tokens configured for convenience during setup are rarely narrowed afterward.

        Reading across every agent at once is what makes this useful. Registrations are per-agent and per-user, so an organization checking only its standard agent misses servers registered with whatever else a developer installed. Maintain the approved-MCP property as the reviewed set, and treat a failure as a question about which credentials that server holds.
      audit: |-
        To verify that only approved MCP servers are configured:

        1. Open a terminal on the endpoint.
        2. Inspect the locations each agent reads MCP servers from:

           ```bash
           cat ~/.claude.json ~/.claude/mcp-needs-auth-cache.json
           cat ~/.cursor/mcp.json
           cat ~/.config/github-copilot/mcp.json ~/.config/github-copilot/intellij/mcp.json
           cat ~/.codeium/windsurf/mcp_config.json
           cat ~/.gemini/antigravity/mcp_config.json
           cat ~/.codex/.tmp/plugins/plugins/*/.mcp.json
           ```

        The endpoint passes when every configured MCP server name appears in the approved allow-list. Any server name outside the allow-list is a failing result.
      remediation:
        - id: cli
          desc: |
            To remove unapproved MCP servers, delete the server entry from the location each agent actually reads:

            - Claude Code: run `claude mcp remove example-server` to delete the server from the user configuration in `~/.claude.json`, and remove any project-scoped entry from the repository's `.mcp.json`. Then delete the stale cache file `~/.claude/mcp-needs-auth-cache.json` so the removed server no longer appears in the inventory; Claude Code rebuilds it on next start.
            - OpenAI Codex: Codex loads MCP servers from two places. Installed plugins declare them in a `.mcp.json` file under `~/.codex/.tmp/plugins/plugins/<plugin>/`, so uninstall the plugin that declares an unapproved server or delete its plugin directory. Servers configured directly live in `~/.codex/config.toml` under an `[mcp_servers.<name>]` table, so remove that table as well.
            - Cursor: edit `~/.cursor/mcp.json` (`%USERPROFILE%\.cursor\mcp.json` on Windows) and delete the entry under `mcpServers`.
            - GitHub Copilot: edit `~/.config/github-copilot/mcp.json` and, if present, `~/.config/github-copilot/intellij/mcp.json`, and delete the entry under `mcpServers`.
            - Windsurf: edit `~/.codeium/windsurf/mcp_config.json` (`%USERPROFILE%\.codeium\windsurf\` on Windows) and delete the entry under `mcpServers`.
            - Gemini CLI: edit `~/.gemini/antigravity/mcp_config.json` (`%USERPROFILE%\.gemini\antigravity\mcp_config.json` on Windows) and delete the entry under `mcpServers`.
        - id: ansible
          desc: |
            To surgically remove an unapproved MCP server entry from AI agent configuration files with Ansible:

            This playbook deletes a single named MCP server from each agent's top-level `mcpServers` object, leaving the rest of the configuration file intact, and removes the Claude Code MCP cache file so the deleted server no longer appears in its inventory. Set `unapproved_mcp_server` to the server name to remove, and edit `mcp_config_files` to match your environment. Each rewritten file is backed up before modification.

            The `mcpServers` path is not the same in every agent. Claude Code's `~/.claude.json` nests MCP servers per project rather than only at the top level, so a top-level rewrite leaves a project-scoped server in place. For Claude Code, prefer running `claude mcp remove <name>`, which the command-line remediation above covers, and confirm the project-scoped path for any agent whose configuration does not expose servers at top-level `mcpServers`. OpenAI Codex is absent from the list because its servers are declared in per-plugin `.mcp.json` files under `~/.codex/.tmp/plugins/plugins/`, which are removed by uninstalling the plugin rather than by editing a shared configuration file.

            ```yaml
            ---
            - name: Remove an unapproved MCP server
              hosts: workstations
              vars:
                unapproved_mcp_server: example-server
                mcp_config_files:
                  - "{{ ansible_env.HOME }}/.claude.json"
                  - "{{ ansible_env.HOME }}/.cursor/mcp.json"
                  - "{{ ansible_env.HOME }}/.config/github-copilot/mcp.json"
                  - "{{ ansible_env.HOME }}/.config/github-copilot/intellij/mcp.json"
                  - "{{ ansible_env.HOME }}/.codeium/windsurf/mcp_config.json"
                  - "{{ ansible_env.HOME }}/.gemini/antigravity/mcp_config.json"
              tasks:
                - name: Read each agent's MCP configuration
                  ansible.builtin.slurp:
                    src: "{{ item }}"
                  loop: "{{ mcp_config_files }}"
                  register: mcp_configs
                  failed_when: false

                - name: Remove the unapproved server from each agent's mcpServers object
                  vars:
                    config: "{{ item.content | b64decode | from_json }}"
                  ansible.builtin.copy:
                    dest: "{{ item.source }}"
                    content: >-
                      {{ config | combine({'mcpServers': config.mcpServers | dict2items
                         | rejectattr('key', 'equalto', unapproved_mcp_server)
                         | items2dict}) | to_nice_json }}
                    backup: true
                    mode: "0600"
                  loop: "{{ mcp_configs.results }}"
                  when:
                    - item.content is defined
                    - config.mcpServers is defined

                - name: Remove the stale Claude Code MCP cache
                  ansible.builtin.file:
                    path: "{{ ansible_env.HOME }}/.claude/mcp-needs-auth-cache.json"
                    state: absent
            ```

  # ---------------------------------------------------------------------------
  # Local LLM runtimes
  # ---------------------------------------------------------------------------
  - uid: mondoo-ai-security-no-local-llm-runtimes
    title: No local LLM runtimes are running
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-uem-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-5
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-10
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm03
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: |
      processes.where(
        executable == /(?i)\b(ollama|llama|lmstudio|lm-studio|localai|gpt4all)\b/
      ).none()
    docs:
      desc: |
        This check verifies that no local LLM inference runtime is running on the endpoint.

        The check reads the process table for the well-known local inference tools, including Ollama, LM Studio, llama.cpp, LocalAI, and GPT4All. It reports on running processes rather than installed software, so it reflects active use.

        **Why this matters**

        Local inference is often adopted specifically to avoid sending data to a provider, and that reasoning is sound as far as it goes. Prompts genuinely do not leave the machine. The exposure is different rather than absent.

        The model weights are the first concern. They are downloaded from public model hubs, they are large binaries whose contents cannot be meaningfully reviewed, and they run with the privileges of whatever loads them. Supply chain assurance for model artifacts is considerably weaker than for software packages, and the formats have had deserialization vulnerabilities.

        The second is that local inference removes the audit trail rather than the risk. Data processed through an approved provider is at least governed by a contract and, usually, by logging. Data processed by a model a developer downloaded is governed by nothing and recorded nowhere, so an organization cannot say afterward what was processed or by which model.

        The third is resource contention: inference is demanding enough to affect the endpoint's other work.

        Where local inference is the deliberate choice for sensitive material, approve specific runtimes and specific model sources, and pair this with the companion check that no inference server is listening beyond the loopback interface.
      audit: |-
        To verify that no local LLM runtime is running:

        1. Open a terminal on the endpoint.
        2. List processes whose executables match known LLM runtime names:

           ```bash
           ps aux | grep -iE 'ollama|llama|lmstudio|lm-studio|localai|gpt4all'
           ```

        The endpoint passes when no matching process is returned. Any running LLM runtime process is a failing result.
      remediation:
        - id: gui
          desc: |
            To remove a local LLM runtime using the operating system interface:

            1. On macOS, quit the runtime and drag the application from `/Applications` to the Trash.
            2. On Windows, open **Settings > Apps > Installed apps**, locate the runtime, and select **Uninstall**.
        - id: cli
          desc: |
            To stop and uninstall a local LLM runtime from the command line. Stopping the process halts inference immediately, and uninstalling the package removes the runtime so it cannot be relaunched. The commands below use Ollama as the example; the runtime name on your endpoint may differ, so look up the real package id first with `brew info`, `winget search`, or `dpkg -l` rather than assuming the install id matches the process name. LM Studio, GPT4All, LocalAI, and Jan are installed as standalone applications or containers and must be removed through their own uninstallers (for example `brew uninstall --cask lm-studio` or `winget uninstall ElementLabs.LMStudio` for LM Studio).

            macOS:

            ```bash
            pkill -f ollama
            brew uninstall ollama
            ```

            Linux:

            ```bash
            sudo systemctl stop ollama
            sudo apt remove ollama       # Debian/Ubuntu
            sudo dnf remove ollama       # RHEL/Fedora
            ```

            Windows:

            ```powershell
            Stop-Process -Name ollama
            winget uninstall Ollama
            ```
        - id: ansible
          desc: |
            To stop and remove local LLM runtimes with Ansible:

            This playbook stops any running local LLM runtime process, then stops and removes the Ollama package and service. Ollama is the runtime distributed as a system package and service; LM Studio, GPT4All, LocalAI, and Jan are installed as standalone applications or containers and must be removed through their own uninstallers.

            ```yaml
            ---
            - name: Remove local LLM runtimes
              hosts: workstations
              tasks:
                - name: Kill local LLM runtime processes
                  ansible.builtin.command:
                    cmd: pkill -f "{{ item }}"
                  loop:
                    - ollama
                    - llama
                    - lmstudio
                    - localai
                    - gpt4all
                  failed_when: false

            - name: Remove local LLM runtime packages (system)
              hosts: workstations
              become: true
              tasks:
                - name: Stop and disable Ollama service
                  ansible.builtin.systemd_service:
                    name: ollama
                    state: stopped
                    enabled: false
                  failed_when: false

                - name: Remove Ollama package
                  ansible.builtin.package:
                    name: ollama
                    state: absent
                  failed_when: false
            ```

  - uid: mondoo-ai-security-no-local-llm-listening-ports
    title: No local LLM inference servers are exposed beyond localhost
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-uem-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-5
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-10
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm06
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: |
      ports.listening.where(address.notIn(["127.0.0.1", "::1", "[::1]"])).none(
        port == 11434 || port == 1234 || port == 1337
      )
    docs:
      desc: |
        This check verifies that no local LLM inference server is reachable from outside the endpoint.

        Local inference tools expose an HTTP API on well-known ports: 11434 for Ollama, 1234 for LM Studio, and 1337 for Jan. The check reads the listening port table and fails when one of those ports is bound to any address other than `127.0.0.1` or `::1`. Binding to loopback is acceptable and passes.

        **Why this matters**

        These APIs have no authentication. That is a deliberate design choice for a service intended to be reached only by applications on the same machine, and it becomes a serious exposure the moment the bind address changes.

        An inference server listening on a routable address is an open endpoint that anyone who can reach it may use: to run inference at the machine owner's expense, to load or delete models, and depending on the tool, to reach other capabilities the API exposes. Internet-wide scanning for these specific ports is established and ongoing, and exposed instances are found and used.

        The change is usually made for a reason that sounds harmless. A developer wants to reach the model from a container, from a second machine, or from a phone, sets the bind address to all interfaces, and the endpoint is then exposed on every network the laptop subsequently joins.

        Where remote access is genuinely needed, put the server behind a reverse proxy that authenticates, or reach it over a VPN or an SSH tunnel, rather than binding it to all interfaces. The loopback default is the safe configuration and the check is deliberately tolerant of it.
      audit: |-
        To verify that no local LLM inference server is exposed beyond localhost:

        1. Open a terminal on the endpoint.
        2. List listening sockets on the LLM inference ports:

           ```bash
           lsof -nP -iTCP:11434 -iTCP:1234 -iTCP:1337 -sTCP:LISTEN
           ```

        The endpoint passes when no process is listening on any of these ports on a non-loopback address. A process bound to `127.0.0.1` or `::1` is acceptable.
      remediation:
        - id: cli
          desc: |
            Identify the process bound to the flagged port and reconfigure it to bind to the loopback address only. Restricting the listener to `127.0.0.1` keeps the inference API reachable only from the local machine, so other hosts on the network can no longer submit prompts to it.

            macOS:

            ```bash
            lsof -nP -iTCP:11434 -iTCP:1234 -iTCP:1337 -sTCP:LISTEN
            launchctl setenv OLLAMA_HOST 127.0.0.1:11434
            ```

            Then quit and reopen the Ollama app so it picks up the new bind address.

            Note that `launchctl setenv` applies only to the current login session and is lost on logout or reboot, and the Ollama menu-bar app does not reliably read it. For a fix that survives a restart, set the bind address in the Ollama app settings, or install a per-user LaunchAgent plist under `~/Library/LaunchAgents` that runs `launchctl setenv OLLAMA_HOST 127.0.0.1:11434` at login.

            Linux:

            ```bash
            sudo mkdir -p /etc/systemd/system/ollama.service.d
            printf '[Service]\nEnvironment="OLLAMA_HOST=127.0.0.1:11434"\n' | sudo tee /etc/systemd/system/ollama.service.d/override.conf
            sudo systemctl daemon-reload
            sudo systemctl restart ollama
            ```

            Windows:

            ```powershell
            Get-NetTCPConnection -LocalPort 11434,1234,1337 | Select-Object LocalAddress,LocalPort,OwningProcess
            [Environment]::SetEnvironmentVariable("OLLAMA_HOST", "127.0.0.1:11434", "User")
            ```

            Then restart Ollama so it picks up the new bind address.

            For LM Studio, change the server settings in the app so the listen address is `127.0.0.1` instead of `0.0.0.0` and restart the server. For Jan, which serves its local API on port 1337, set the API server host to `127.0.0.1` in **Settings > Local API Server** and restart the server.
        - id: ansible
          desc: |
            Reconfigure local LLM inference servers to bind to localhost with Ansible:

            This playbook creates a systemd override that binds Ollama to the loopback address and restarts the service. The override approach is required because the unit file installed by Ollama does not read `/etc/default/ollama`. LM Studio and Jan are desktop applications; change their server host settings in the app.

            ```yaml
            ---
            - name: Rebind Ollama to localhost
              hosts: workstations
              become: true
              tasks:
                - name: Create the systemd override directory for Ollama
                  ansible.builtin.file:
                    path: /etc/systemd/system/ollama.service.d
                    state: directory
                    mode: "0755"

                - name: Bind Ollama to the loopback address
                  ansible.builtin.copy:
                    dest: /etc/systemd/system/ollama.service.d/override.conf
                    content: |
                      [Service]
                      Environment="OLLAMA_HOST=127.0.0.1:11434"
                    mode: "0644"
                  notify: Restart Ollama

              handlers:
                - name: Restart Ollama
                  ansible.builtin.systemd_service:
                    name: ollama
                    state: restarted
                    daemon_reload: true
            ```
