      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-5
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-10
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm03
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: |
      warp.skills.none()
    docs:
      desc: |
        This check verifies that the Warp terminal is not configured on this endpoint.

        Warp is a terminal emulator with built-in AI features that send command context to a model provider. The check reads the agent's own configuration for stored skills. A skill is a saved instruction set the agent loads and acts on, so its presence means the agent was set up on this machine rather than merely downloaded.

        **Why this matters**

        A terminal is a different exposure from an editor. What passes through it is not source code but commands and their output: connection strings, tokens pasted into a shell, the contents of files echoed during troubleshooting, and the names of internal hosts and services.

        Command history is also unusually revealing about infrastructure. A sequence of shell commands describes the systems an engineer administers, how they authenticate, and what they were doing at the time, which is a precise operational picture rather than a code sample.

        Where this tool is on the approved list, exempt it deliberately rather than suppressing the check, so the exemption is recorded and reviewed when the approval changes.
      audit: |-
        To verify that Warp is not configured on the endpoint:

        1. Open a terminal on the endpoint.
        2. Check for the shared agent skills directory that Warp reads and the Warp configuration directory:

           ```bash
           ls -d ~/.agents/skills ~/.warp 2>/dev/null
           ```

        The endpoint passes when the shared skills directory contains no skills. A `~/.agents/skills` directory containing skill definitions is a failing result.
      remediation:
        - id: gui
          desc: |
            To remove Warp using the operating system interface:

            1. On macOS, quit Warp and drag the application from `/Applications` to the Trash.
            2. On Windows, open **Settings > Apps > Installed apps**, locate Warp, and select **Uninstall**.
            3. Delete the shared agent skills folder that Warp reads, which is what this check inspects. On macOS, open Finder, choose **Go > Go to Folder**, enter `~/.agents/skills`, and move the folder to the Trash. On Windows, delete the `.agents\skills` folder in your user profile directory using File Explorer.
        - id: cli
          desc: |
            Warp reads agent skills from the shared `~/.agents/skills` directory rather than its own configuration folder. Remove the skill definitions there, and remove the Warp configuration directory as well. The shared directory may also be used by other agents that follow the same skills convention; if an approved tool relies on it, delete only the unapproved skill subfolders instead of the whole directory.

            macOS and Linux:

            ```bash
            rm -rf ~/.agents/skills
            rm -rf ~/.warp
            ```

            Windows:

            ```powershell
            Remove-Item -Recurse -Force "$env:USERPROFILE\.agents\skills"
            Remove-Item -Recurse -Force "$env:USERPROFILE\.warp"
            ```
        - id: ansible
          desc: |
            To remove Warp skills and configuration with Ansible:

            This playbook removes the shared agent skills directory that Warp reads and the Warp configuration directory.

            ```yaml
            ---
            - name: Remove Warp
              hosts: workstations
              tasks:
                - name: Remove Warp skills and configuration directories
                  ansible.builtin.file:
                    path: "{{ item }}"
                    state: absent
                  loop:
                    - "{{ ansible_env.HOME }}/.agents/skills"
                    - "{{ ansible_env.HOME }}/.warp"
            ```

