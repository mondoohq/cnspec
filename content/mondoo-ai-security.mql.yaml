  - uid: mondoo-ai-security-no-vscode-codeium-extension
    title: No Codeium extensions in VS Code-compatible editors
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-uem-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-5
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-10
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm03
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: |
      vscode.extensions.where(
        identifier == /(?i)codeium\./
      ).none()
    docs:
      desc: |
        This check verifies that no Codeium extension is installed in a VS Code-compatible editor.

        The check reads the installed extension list and matches extension identifiers beginning with `codeium.`. VS Code-compatible covers VS Code itself and the editors built on its extension model, so one installation of the extension is found wherever it lives.

        **Why this matters**

        An editor extension sees what the editor sees. It has access to the open file, the workspace, and in most cases the ability to read any file the editor can, and it sends the parts it needs to a model provider to answer a completion.

        That access is granted at install time and is not scoped per project. An extension installed to help with one repository is equally present when the developer opens a different one, including repositories with stricter handling requirements than the one that prompted the install.

        Where the extension is approved, exempt it deliberately so the approval is recorded. Extensions update themselves, so an approval is a statement about a publisher rather than about a fixed version.
      audit: |-
        To verify that no Codeium extension is installed:

        1. Open a terminal on the endpoint.
        2. List installed extensions for each VS Code-compatible editor and search for Codeium:

           ```bash
           code --list-extensions | grep -i codeium
           cursor --list-extensions | grep -i codeium
           windsurf --list-extensions | grep -i codeium
           ```

        The endpoint passes when none of the editors return a Codeium extension. Any line beginning with `codeium.` is a failing result.
      remediation:
        - id: gui
          desc: |
            To remove the Codeium extension from within the editor:

            1. Open the Extensions view (`Cmd+Shift+X` on macOS, `Ctrl+Shift+X` on Windows and Linux).
            2. Search for the Codeium extension.
            3. Select the extension and click **Uninstall**.
        - id: cli
          desc: |
            To uninstall the Codeium extension from whichever editor has it installed:

            ```bash
            code --uninstall-extension codeium.codeium       # VS Code
            cursor --uninstall-extension codeium.codeium     # Cursor
            windsurf --uninstall-extension codeium.codeium   # Windsurf
            ```
        - id: ansible
          desc: |
            To remove the Codeium extension from VS Code-compatible editors with Ansible:

            This playbook uninstalls the Codeium extension from VS Code, Cursor, and Windsurf on the endpoint.

            ```yaml
            ---
            - name: Remove the Codeium extension from VS Code-compatible editors
              hosts: workstations
              tasks:
                - name: Uninstall the Codeium extension from each editor
                  ansible.builtin.command:
                    cmd: "{{ item }} --uninstall-extension codeium.codeium"
                  loop:
                    - code
                    - cursor
                    - windsurf
                  register: uninstall
                  changed_when: "'successfully uninstalled' in uninstall.stdout"
                  failed_when: false
            ```

