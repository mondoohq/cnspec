      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: |
      goose.skills.none()
      goose.extensions.none()
    docs:
      desc: |
        This check verifies that the Goose agent is not configured on this endpoint.

        Goose is an open-source agent from Block that connects to a range of model providers and gains capability through extensions. The check reads its configuration for stored skills and installed extensions.

        **Why this matters**

        Extensions are the significant half. Goose's model is that capability comes from what you attach to it, so an extension list is a description of what the agent can reach on this machine and beyond it.

        The exposure is execution, not just disclosure. An agent that can run commands and edit files acts with the developer's full local privileges: their SSH keys, their cloud credentials, their access to internal services. A prompt that reaches it, whether from a user, a fetched web page, or a file in the repository, becomes an instruction it may act on, and the resulting commands are indistinguishable from the developer's own. Goose is designed to run autonomously rather than to suggest, so the gap between a prompt and an executed command is smaller than with a completion tool.

        Where this tool is on the approved list, exempt it deliberately rather than suppressing the check, so the exemption is recorded and reviewed when the approval changes.
      audit: |-
        To verify that Goose is not configured on the endpoint:

        1. Open a terminal on the endpoint.
        2. Check for the Goose configuration directory:

           ```bash
           ls -d ~/.config/goose 2>/dev/null
           ```

        The endpoint passes when no Goose configuration directory exists. A directory containing skills or extensions is a failing result.
      remediation:
        - id: gui
          desc: |
            To remove the Goose application using the operating system interface:

            1. On macOS, quit Goose and drag the application from `/Applications` to the Trash.
            2. On Windows, open **Settings > Apps > Installed apps**, locate Goose, and select **Uninstall**.
            3. Delete the leftover configuration folder, which the uninstaller does not remove and which is what this check inspects. On macOS, open Finder, choose **Go > Go to Folder**, enter `~/.config/goose`, and move the folder to the Trash. On Windows, delete the `.config\goose` folder in your user profile directory using File Explorer.
        - id: cli
          desc: |
            To remove the Goose configuration from the command line:

            macOS and Linux:

            ```bash
            rm -rf ~/.config/goose
            ```

            Windows:

            ```powershell
            Remove-Item -Recurse -Force "$env:USERPROFILE\.config\goose"
            ```
        - id: ansible
          desc: |
            To remove Goose configuration directories with Ansible:

            This playbook removes the Goose AI agent configuration directory from the endpoint.

            ```yaml
            ---
            - name: Remove Goose
              hosts: workstations
              tasks:
                - name: Remove Goose configuration directories
                  ansible.builtin.file:
                    path: "{{ item }}"
                    state: absent
                  loop:
                    - "{{ ansible_env.HOME }}/.config/goose"
            ```

