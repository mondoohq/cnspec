      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-5
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-10
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm03
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: |
      qwen.code.skills.none()
    docs:
      desc: |
        This check verifies that the Qwen Code agent is not configured on this endpoint.

        Qwen Code is an AI coding agent from Alibaba that connects to model providers and can execute commands and modify files. The check reads the agent's own configuration for stored skills. A skill is a saved instruction set the agent loads and acts on, so its presence means the agent was set up on this machine rather than merely downloaded.

        **Why this matters**

        Where the model provider processes data is a question an approval has to answer explicitly, because it determines which jurisdiction's law applies to source code and any customer data caught in context.

        The exposure is execution, not just disclosure. An agent that can run commands and edit files acts with the developer's full local privileges: their SSH keys, their cloud credentials, their access to internal services. A prompt that reaches it, whether from a user, a fetched web page, or a file in the repository, becomes an instruction it may act on, and the resulting commands are indistinguishable from the developer's own.

        Where this tool is on the approved list, exempt it deliberately rather than suppressing the check, so the exemption is recorded and reviewed when the approval changes.
      audit: |-
        To verify that Qwen Code is not configured on the endpoint:

        1. Open a terminal on the endpoint.
        2. Check for the Qwen Code configuration directory:

           ```bash
           ls -d ~/.qwen 2>/dev/null
           ```

        The endpoint passes when no Qwen Code configuration directory exists. A directory containing configured skills is a failing result.
      remediation:
        - id: cli
          desc: |
            Qwen Code is a command-line agent installed through npm. Deleting its configuration directory does not uninstall the agent: the binary stays on the `PATH` and regenerates `~/.qwen` the next time it runs. Uninstall the binary first, then remove the leftover configuration.

            ```bash
            npm uninstall -g @qwen-code/qwen-code
            ```

            Then remove the configuration directory. This deletes any saved Qwen Code history and settings, so confirm the contents before deleting.

            macOS and Linux:

            ```bash
            rm -rf ~/.qwen
            ```

            Windows:

            ```powershell
            Remove-Item -Recurse -Force "$env:USERPROFILE\.qwen"
            ```
        - id: ansible
          desc: |
            To remove Qwen Code configuration directories with Ansible:

            This playbook removes the Qwen Code agent configuration directory from the endpoint.

            ```yaml
            ---
            - name: Remove Qwen Code
              hosts: workstations
              tasks:
                - name: Remove Qwen Code configuration directories
                  ansible.builtin.file:
                    path: "{{ item }}"
                    state: absent
                  loop:
                    - "{{ ansible_env.HOME }}/.qwen"
            ```

