  # ---------------------------------------------------------------------------
  # Security groups
  # MQL has no string-to-int conversion, so a "from/to" port range cannot be
  # compared arithmetically. Range containment is encoded as a regex instead:
  # one alternation for "lower bound <= port" and one for "upper bound >= port".
  # Each half is verified exhaustively over 0-65535 before it lands here. The
  # upper half over-matches above 65535, which the service rejects on input.
  # ---------------------------------------------------------------------------
  - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh
    title: Ensure security groups do not allow public ingress to SSH (port 22)
    impact: 85
    docs:
      desc: |
        This check verifies that inbound SSH reachability is confined to trusted source ranges rather than the entire IPv4 internet.

        A security group ingress rule decides which sources may open a TCP session to the instances the group protects. This check treats a rule as world-open whether it names `0.0.0.0/0` directly or references a prefix list that contains it, and whether it names port 22 exactly or a wider range that spans it, so a rule written as `1/1024` or as the all-ports `-1/-1` counts the same as `22/22`. Inbound rules live under **Network & Security** > **Security Groups** in the ECS console, and the check requires that no accepting ingress rule admits TCP port 22 from `0.0.0.0/0`.

        **Why this matters**

        Port 22 is one of the most heavily scanned ports on the internet. Automated tooling works through common account names and password lists continuously, so a newly opened rule draws login attempts within minutes and never stops drawing them.

        Brute forcing is not the only path. Operators routinely reuse a single key pair or password across a fleet, so one credential recovered from a laptop, a build log, or an unrelated breach unlocks every host that accepts it. A world-open port 22 turns that reuse into direct account access with nothing else in the way.

        The exposure is rarely limited to one machine. A security group rule applies to every instance attached to the group, so a single rule can put an entire tier online at once, and it defeats the jump hosts and VPN-gated administration built to funnel that traffic through known networks.

        Restricting the source to a bastion address or an internal CIDR such as `10.0.0.0/8` is the fix, not moving SSH to a different port. This check looks only at IPv4 sources; a companion check in this policy covers the same administrative ports reached over IPv6.
      audit: |
        ### Audit via Console

        1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
        2. Navigate to **Network & Security** > **Security Groups**.
        3. Open each security group's **Inbound** rules and look for rules allowing `0.0.0.0/0` to TCP port 22.

        A passing group has no inbound rule allowing `0.0.0.0/0` to port 22. A failing group has one.

        ### Audit via CLI

        1. Inspect a security group's inbound rules:

        ```bash
        aliyun ecs DescribeSecurityGroupAttribute --SecurityGroupId <sg-id> --Direction ingress
        ```

        A passing group returns no `Accept` permission with `SourceCidrIp` `0.0.0.0/0` covering port 22. A failing group returns one.
      remediation:
        - id: console
          desc: |
            To remove world-open SSH access in the ECS console:

            1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
            2. Open the security group and its **Inbound** rules.
            3. Delete or edit the rule allowing `0.0.0.0/0` to port 22, restricting the source to a trusted CIDR or bastion address.
        - id: cli
          desc: |
            To revoke a world-open SSH rule with the `aliyun` CLI:

            ```bash
            aliyun ecs RevokeSecurityGroup --SecurityGroupId <sg-id> \
              --IpProtocol tcp --PortRange 22/22 --SourceCidrIp 0.0.0.0/0
            ```
        - id: terraform
          desc: |
            To scope SSH access in Terraform, set a trusted `cidr_ip` instead of `0.0.0.0/0`:

            ```hcl
            resource "alicloud_security_group_rule" "ssh" {
              type              = "ingress"
              ip_protocol       = "tcp"
              port_range        = "22/22"
              security_group_id = alicloud_security_group.example.id
              cidr_ip           = "10.0.0.0/8"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-alicloud
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-terraform-hcl
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-terraform-plan
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: false
  - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      # A rule opens the port whenever its range spans it, not only when the range is written
      # exactly as the port. The regex encodes "lower bound <= port <= upper bound" as two
      # alternations; it over-matches above 65535, which the service rejects on the way in.
      alicloud.ecs.securityGroups.all(
        permissions
          .where(direction.downcase == "ingress")
          .where(policy.downcase == "accept")
          .where(sourceCidrIp == "0.0.0.0/0" || sourcePrefixList != empty && sourcePrefixList.cidrBlocks.any(_ == "0.0.0.0/0"))
          .none(
            ipProtocol.downcase == "all" ||
            ipProtocol.downcase == "tcp" && portRange == "-1/-1" ||
            ipProtocol.downcase == "tcp" && portRange == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/
          )
      )

  - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_security_group_rule")
    mql: |
      terraform.resources("alicloud_security_group_rule").where(arguments["type"] == "ingress").where(arguments["cidr_ip"] == "0.0.0.0/0").where(arguments["policy"] == empty || arguments["policy"].downcase == "accept").none(arguments["ip_protocol"].downcase == "all" || arguments["ip_protocol"].downcase == "tcp" && arguments["port_range"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ || arguments["ip_protocol"].downcase == "tcp" && arguments["port_range"] == "-1/-1")
  - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_security_group_rule")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_security_group_rule").map(change.after).where(_["type"] == "ingress").where(_["cidr_ip"] == "0.0.0.0/0").where(_["policy"] == empty || _["policy"].downcase == "accept").none(_["ip_protocol"].downcase == "all" || _["ip_protocol"].downcase == "tcp" && _["port_range"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ || _["ip_protocol"].downcase == "tcp" && _["port_range"] == "-1/-1")
  - uid: mondoo-alibaba-security-ecs-security-group-no-public-ssh-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_security_group_rule")
    mql: |
      terraform.state.resources.where(type == "alicloud_security_group_rule").map(values).where(_["type"] == "ingress").where(_["cidr_ip"] == "0.0.0.0/0").where(_["policy"] == empty || _["policy"].downcase == "accept").none(_["ip_protocol"].downcase == "all" || _["ip_protocol"].downcase == "tcp" && _["port_range"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ || _["ip_protocol"].downcase == "tcp" && _["port_range"] == "-1/-1")

  - uid: mondoo-alibaba-security-ecs-security-group-no-public-rdp
    title: Ensure security groups do not allow public ingress to RDP (port 3389)
    impact: 85
    docs:
      desc: |
        This check verifies that Remote Desktop reachability is confined to trusted source ranges rather than being offered to the entire IPv4 internet.

        Remote Desktop Protocol carries interactive Windows console sessions over TCP port 3389, and a security group ingress rule decides who may open one. The check treats a rule as world-open whether it names `0.0.0.0/0` directly or references a prefix list that contains it, and whether it names port 3389 exactly or a wider range that spans it. Inbound rules are edited per group under **Network & Security** > **Security Groups** in the ECS console, and the required state is that no accepting ingress rule admits TCP port 3389 from `0.0.0.0/0`.

        **Why this matters**

        Exposed RDP is the working front door for ransomware crews. Access brokers scan the whole address space for port 3389, spray credentials against what answers, and sell the sessions that succeed; the intrusion that follows arrives as a hands-on-keyboard operator rather than a worm, which is why encryption is usually preceded by days of quiet credential harvesting and backup deletion.

        An interactive desktop session also hands the attacker the tooling already installed on the host. Domain-joined machines expose credential material to anyone holding a session, so a single reachable Windows instance frequently becomes the pivot into the rest of the estate.

        One rule is enough to create that opening across a whole tier, because the rule applies to every instance the security group protects, and it nullifies the VPN-gated or bastion-mediated administration that was supposed to stand in front of them.

        Where remote desktop genuinely must cross the internet, front it with a bastion or a VPN and scope `cidr_ip` to that path. This check evaluates IPv4 sources only; IPv6 exposure of the same port is covered by a companion check in this policy.
      audit: |
        ### Audit via Console

        1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
        2. Navigate to **Network & Security** > **Security Groups**.
        3. Open each security group's **Inbound** rules and look for rules allowing `0.0.0.0/0` to TCP port 3389.

        A passing group has no inbound rule allowing `0.0.0.0/0` to port 3389. A failing group has one.

        ### Audit via CLI

        1. Inspect a security group's inbound rules:

        ```bash
        aliyun ecs DescribeSecurityGroupAttribute --SecurityGroupId <sg-id> --Direction ingress
        ```

        A passing group returns no `Accept` permission with `SourceCidrIp` `0.0.0.0/0` covering port 3389. A failing group returns one.
      remediation:
        - id: console
          desc: |
            To remove world-open RDP access in the ECS console:

            1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
            2. Open the security group and its **Inbound** rules.
            3. Delete or edit the rule allowing `0.0.0.0/0` to port 3389, restricting the source to a trusted CIDR or bastion address.
        - id: cli
          desc: |
            To revoke a world-open RDP rule with the `aliyun` CLI:

            ```bash
            aliyun ecs RevokeSecurityGroup --SecurityGroupId <sg-id> \
              --IpProtocol tcp --PortRange 3389/3389 --SourceCidrIp 0.0.0.0/0
            ```
        - id: terraform
          desc: |
            To scope RDP access in Terraform, set a trusted `cidr_ip` instead of `0.0.0.0/0`:

            ```hcl
            resource "alicloud_security_group_rule" "rdp" {
              type              = "ingress"
              ip_protocol       = "tcp"
              port_range        = "3389/3389"
              security_group_id = alicloud_security_group.example.id
              cidr_ip           = "10.0.0.0/8"
            }
            ```
    variants:
