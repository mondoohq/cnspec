        values["environment_variables"].keys.none(
          _.downcase == /^access_key_id$|^access_key_secret$|^alicloud_access_key$|^alicloud_secret_key$|^security_token$|^api_token$|^bearer_token$|^db_password$|^private_key$|^password$|^passwd$|^secret$|^access_key$|^client_secret$|^connection_string$/
        ) &&
