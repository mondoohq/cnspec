  # No Terraform variants: the OSS bucket policy is an opaque JSON document (the inline policy argument is deprecated in favor of the alicloud_oss_bucket_policy resource), and reliably parsing embedded policy JSON out of HCL/plan/state to evaluate Principal grants is fragile; this control is evaluated against the resolved runtime policy only.
  - uid: mondoo-alibaba-security-oss-bucket-policy-no-anonymous
    title: Ensure OSS bucket policies do not grant anonymous access
    impact: 90
    docs:
      desc: |
        This check verifies that no Object Storage Service (OSS) bucket policy grants its permissions to unauthenticated callers.

        In an OSS bucket policy an anonymous grant is written as a statement whose `Principal` is `*`. Everyone on the internet then holds whatever actions that statement allows. Policies are edited under **Access Control** > **Bucket Policy** in the OSS console, and replaced from a file with `aliyun oss bucket-policy --method put oss://<bucket-name> ./bucket-policy.json`. The fix is to name specific RAM identities in place of the wildcard rather than to remove access altogether.

        **Why this matters**

        A wildcard principal removes authentication from the request path entirely. If the statement allows read actions, an attacker enumerates and downloads objects with no credential to steal and no key to rotate afterward. If it allows write or delete actions, the same anonymous caller overwrites or destroys the bucket's contents.

        The policy grant is evaluated independently of the bucket ACL, so a bucket that reads **Private** on the access control page can still be fully open through a permissive statement on the next page over. That separation is exactly why the problem survives reviews that only inspect the ACL.

        Object storage tends to accumulate database backups, application logs, and export files, which is precisely the material an attacker wants and precisely what makes an anonymously readable bucket worth scanning for.

        A bucket with no policy at all passes, since there is no grant to worry about, and so does a bucket whose wildcard statement is neutralized by an enabled Block Public Access setting, because the guardrail overrides the policy grant. A companion check in this policy covers the bucket ACL, which is the other route to anonymous access.
      audit: |
        ### Audit via Console

        1. Sign in to the [OSS console](https://oss.console.aliyun.com/).
        2. Open each bucket and go to **Access Control** > **Bucket Policy**.
        3. Review each statement and confirm none grants a `Principal` of `*`.

        A passing bucket has no policy or no statement with `Principal` `*`. A failing bucket has a statement granting `*`.

        ### Audit via CLI

        1. Retrieve the policy of each bucket with the `aliyun` CLI:

        ```bash
        aliyun oss bucket-policy --method get oss://<bucket-name>
        ```

        A passing bucket returns no policy or no `"Principal": ["*"]` grant. A failing bucket returns a statement whose `Principal` is `*`.
      remediation:
        - id: console
          desc: |
            To remove an anonymous grant from an OSS bucket policy in the console:

            1. Sign in to the [OSS console](https://oss.console.aliyun.com/).
            2. Open the bucket and go to **Access Control** > **Bucket Policy**.
            3. Edit or delete any statement whose `Principal` is `*`, restricting access to specific RAM identities, and save.
        - id: cli
          desc: |
            To replace a bucket policy with one that names specific principals instead of `*` with the `aliyun` CLI:

            ```bash
            aliyun oss bucket-policy --method put oss://<bucket-name> ./bucket-policy.json
            ```
        # No Terraform remediation: the bucket policy is an opaque JSON document and this control is not evaluated against Terraform sources.
    variants:
      - uid: mondoo-alibaba-security-oss-bucket-policy-no-anonymous-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-22
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-22
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7
      compliance/soc2-2017: soc2-control-cc6-1-7
      compliance/vda-isa-5: vda-isa-5-4-1-2
