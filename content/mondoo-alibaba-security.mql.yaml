    mql: |
      alicloud.acr.instance.repositories.all(tagImmutability == true)
  - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_cr_ee_repo")
    mql: |
      terraform.resources("alicloud_cr_ee_repo").all(arguments["tag_immutability"] == true)
  - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_cr_ee_repo")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_cr_ee_repo").all(
        change.after["tag_immutability"] == true
      )
