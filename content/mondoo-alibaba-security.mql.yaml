  # Container Registry (ACR)
  # ===========================================================================
  - uid: mondoo-alibaba-security-acr-repository-not-public
    title: Ensure Container Registry repositories are not pullable anonymously
    impact: 90
    docs:
      desc: |
        This check ensures that no Container Registry repository can be pulled without credentials. A repository is anonymously pullable when its visibility is `PUBLIC` and the registry instance answers on an internet endpoint, at which point anyone who learns or guesses the repository path can download every image in it.

        **Why this matters**

        - **Images carry more than application code:** Layers routinely include configuration files, private dependencies, and credentials baked in at build time, none of which are recoverable once downloaded.
        - **Repository paths are guessable:** Registry namespaces follow organizational naming, so a public repository is discoverable without any prior access.
        - **Pulls leave no attribution:** An anonymous pull identifies no principal, so exfiltration through a public repository is invisible in access logs.

        **Risk mitigation**

        - **Forces authenticated pulls:** Every download presents credentials that can be authorized, logged, and revoked.
        - **Contains build-time leakage:** A secret accidentally baked into a layer stays inside the trust boundary instead of reaching the internet.
      audit: |
        ### Audit via Console

        1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
        2. Open the instance and go to **Repository** > **Repositories**.
        3. Review the repository type of each repository.

        A passing repository is **Private**. A failing repository is **Public**.

        ### Audit via CLI

        1. List the repositories in an instance and review each repository type:

        ```bash
        aliyun cr ListRepository --InstanceId <instance-id>
        ```

        A passing repository returns a `RepoType` of `PRIVATE`. A failing repository returns `PUBLIC`.
      remediation:
        - id: console
          desc: |
            To make a repository private in the console:

            1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
            2. Open the instance, go to **Repository** > **Repositories**, and select **Manage** on the repository.
            3. On the **Details** page select **Edit**, set the repository type to **Private** in the **Modify Settings** dialog, and confirm.
        - id: cli
          desc: |
            To make a repository private with the `aliyun` CLI, pass the repository summary alongside the type, since the call rewrites both:

            ```bash
            aliyun cr UpdateRepository --InstanceId <instance-id> \
              --RepoId <repo-id> --RepoType PRIVATE --Summary <repository-summary>
            ```
        - id: terraform
          desc: |
            To declare a private repository in Terraform, set `repo_type` to `PRIVATE`:

            ```hcl
            resource "alicloud_cr_ee_repo" "example" {
              instance_id = "cri-example"
              namespace   = "example-namespace"
              name        = "example-repo"
              summary     = "example repository"
              repo_type   = "PRIVATE"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-acr-repository-not-public-alicloud
      - uid: mondoo-alibaba-security-acr-repository-not-public-terraform-hcl
      - uid: mondoo-alibaba-security-acr-repository-not-public-terraform-plan
      - uid: mondoo-alibaba-security-acr-repository-not-public-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-22
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-22
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7
      compliance/soc2-2017: soc2-control-cc6-1-7
      compliance/vda-isa-5: vda-isa-5-4-1-2
  - uid: mondoo-alibaba-security-acr-repository-not-public-alicloud
    filters: asset.platform == "alicloud-acr-instance"
    mql: |
      alicloud.acr.instance.repositories.all(isPublic == false)
  - uid: mondoo-alibaba-security-acr-repository-not-public-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_cr_ee_repo")
    mql: |
      terraform.resources("alicloud_cr_ee_repo").all(arguments["repo_type"] == "PRIVATE")
  - uid: mondoo-alibaba-security-acr-repository-not-public-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_cr_ee_repo")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_cr_ee_repo").all(
        change.after["repo_type"] == "PRIVATE"
      )
  - uid: mondoo-alibaba-security-acr-repository-not-public-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_cr_ee_repo")
    mql: |
      terraform.state.resources.where(type == "alicloud_cr_ee_repo").all(
        values["repo_type"] == "PRIVATE"
      )

  - uid: mondoo-alibaba-security-acr-repository-tag-immutability
    title: Ensure Container Registry repositories have tag immutability enabled
    impact: 70
    docs:
      desc: |
        This check ensures that every Container Registry repository forbids overwriting an existing tag. Without tag immutability a tag is a movable pointer, so `app:1.4.2` can be repointed at different content after it was reviewed, signed off, and deployed, and every later pull of that tag silently gets the new image.

        **Why this matters**

        - **The reviewed artifact stops being the deployed artifact:** Scanning, signing, and approval all attach to content that a later push can replace under the same name.
        - **Rollback becomes unreliable:** Redeploying a known-good tag no longer reproduces the known-good image, so incident recovery can reintroduce the problem.
        - **It is a quiet supply-chain foothold:** Anyone with push access can change what production runs without touching any deployment manifest.

        **Risk mitigation**

        - **Binds a name to fixed content:** A tag that cannot be moved means what was approved is what runs.
        - **Makes changes explicit:** Shipping different content requires a new tag, which shows up in the deployment diff.
      audit: |
        ### Audit via Console

        1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
        2. Open the instance, go to **Repository** > **Repositories**, and select **Manage** on a repository.
        3. On the **Details** page, review whether the repository is marked **Immutable**.

        A passing repository has tag immutability enabled. A failing repository has it disabled.

        ### Audit via CLI

        1. Read the repository configuration and review the immutability flag:

        ```bash
        aliyun cr GetRepository --InstanceId <instance-id> --RepoId <repo-id>
        ```

        A passing repository returns `TagImmutability` of `true`. A failing repository returns `false`.
      remediation:
        - id: console
          desc: |
            To enable tag immutability in the console:

            1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
            2. Open the instance, go to **Repository** > **Repositories**, and select **Manage** on the repository.
            3. On the **Details** page select **Edit**, select **Immutable** in the **Modify Settings** dialog, and confirm.
        - id: cli
          desc: |
            To enable tag immutability with the `aliyun` CLI, pass the repository type and summary alongside the immutability flag, since the call rewrites all of them:

            ```bash
            aliyun cr UpdateRepository --InstanceId <instance-id> \
              --RepoId <repo-id> --TagImmutability true \
              --RepoType PRIVATE --Summary <repository-summary>
            ```
        - id: terraform
          desc: |
            To enable tag immutability in Terraform, set `tag_immutability` to `true`:

            ```hcl
            resource "alicloud_cr_ee_repo" "example" {
              instance_id      = "cri-example"
              namespace        = "example-namespace"
              name             = "example-repo"
              summary          = "example repository"
              repo_type        = "PRIVATE"
              tag_immutability = true
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-alicloud
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-hcl
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-plan
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ais-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-21
      compliance/nis-2: nis-2-21-2-d
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-id-ra-09
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-5
      compliance/vda-isa-5: false
  - uid: mondoo-alibaba-security-acr-repository-tag-immutability-alicloud
    filters: asset.platform == "alicloud-acr-instance"
    mql: |
      alicloud.acr.instance.repositories.all(tagImmutability == true)
  - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_cr_ee_repo")
    mql: |
      terraform.resources("alicloud_cr_ee_repo").all(arguments["tag_immutability"] == true)
  - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_cr_ee_repo")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_cr_ee_repo").all(
        change.after["tag_immutability"] == true
      )
