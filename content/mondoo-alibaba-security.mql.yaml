  - uid: mondoo-alibaba-security-es-instance-no-public-network
    title: Ensure Elasticsearch clusters do not answer on a public endpoint
    impact: 85
    docs:
      desc: |
        This check ensures that no Elasticsearch cluster exposes a public network endpoint. With the public endpoint switched off a cluster is reachable only from inside its VPC; with it on, the cluster answers on an internet address and the public IP allowlist becomes the only thing between the index and the internet.

        **Why this matters**

        - **Search endpoints are directly queryable:** The Elasticsearch API returns documents, so reaching the endpoint with valid credentials is equivalent to reading the data.
        - **Allowlists drift:** A public endpoint gated only by an address list degrades quietly as ranges are widened for convenience or troubleshooting.
        - **Internet-facing search clusters are actively hunted:** Exposed Elasticsearch endpoints are a long-standing source of large-scale data disclosure.

        **Risk mitigation**

        - **Removes the internet path entirely:** Traffic must originate inside the VPC or arrive through a controlled network connection.
        - **Makes the network boundary the primary control:** Access no longer depends on an allowlist staying correct over time.
      audit: |
        ### Audit via Console

        1. Sign in to the [Elasticsearch console](https://elasticsearch.console.aliyun.com/).
        2. Open each cluster and go to **Configuration and Management** > **Security**.
        3. Review whether **Public Network Access** is enabled.

        A passing cluster has the public endpoint disabled. A failing cluster has it enabled.

        ### Audit via CLI

        1. Describe each cluster and review its network configuration:

        ```bash
        aliyun elasticsearch DescribeInstance --InstanceId <instance-id>
        ```

        A passing cluster returns `enablePublic` of `false`. A failing cluster returns `true`.
      remediation:
        - id: console
          desc: |
            To turn off the public endpoint in the console:

            1. Sign in to the [Elasticsearch console](https://elasticsearch.console.aliyun.com/).
            2. Open the cluster and go to **Configuration and Management** > **Security**.
            3. Turn off **Public Network Access**, and save.
        - id: cli
          desc: |
            To turn off the public endpoint with the `aliyun` CLI:

            ```bash
            aliyun elasticsearch UpdatePublicNetwork --InstanceId <instance-id> \
              --body '{"enablePublic":false}'
            ```
        - id: terraform
          desc: |
            To keep the cluster private in Terraform, set `enable_public` to `false`:

            ```hcl
            resource "alicloud_elasticsearch_instance" "example" {
              instance_charge_type = "PostPaid"
              data_node_amount     = 2
              data_node_spec       = "elasticsearch.sn2ne.large"
              data_node_disk_size  = 20
              data_node_disk_type  = "cloud_ssd"
              version              = "7.10_with_X-Pack"
              vswitch_id           = "vsw-example"
              password             = var.elasticsearch_password
              enable_public        = false
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-es-instance-no-public-network-alicloud
      - uid: mondoo-alibaba-security-es-instance-no-public-network-terraform-hcl
      - uid: mondoo-alibaba-security-es-instance-no-public-network-terraform-plan
      - uid: mondoo-alibaba-security-es-instance-no-public-network-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1
