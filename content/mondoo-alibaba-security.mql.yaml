          - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress
          - uid: mondoo-alibaba-security-vpn-connection-strong-encryption
          - uid: mondoo-alibaba-security-vpn-connection-strong-dh-group
          - uid: mondoo-alibaba-security-cloudfirewall-enabled
          - uid: mondoo-alibaba-security-cloudfirewall-no-unrestricted-accept
          - uid: mondoo-alibaba-security-antiddos-instance-protection-active
          - uid: mondoo-alibaba-security-slb-listener-not-plaintext
          - uid: mondoo-alibaba-security-waf-domain-tls-hardened
queries:
  # ===========================================================================
  # RAM
  # ===========================================================================
  # No Terraform variants: MFA device binding is a runtime state on the identity, not an attribute of the alicloud_ram_user resource; there is no Terraform resource that enforces an MFA device is present.
  - uid: mondoo-alibaba-security-ram-user-mfa-enabled
    title: Ensure RAM users with console access have MFA enabled
    impact: 85
    docs:
      desc: |
        This check verifies that interactive sign-in to the Alibaba Cloud console is protected by a second authentication factor for every RAM user who holds a logon profile.

        A RAM user created with a logon profile can authenticate with a password alone by default, so the account's only barrier is a secret that can be phished, reused, or guessed. Multi-factor authentication (MFA) binds a virtual MFA device or a U2F security key to the identity so a password on its own no longer produces a session. Bind the device in the RAM console under **Identities** > **Users** on the affected user's **Authentication** tab, or with `aliyun ram CreateVirtualMFADevice` followed by `aliyun ram BindMFADevice`. Binding a device is only half the control: enforce MFA at sign-in by attaching an MFA-required condition through the account's security settings, otherwise the device exists but is never demanded.

        **Why this matters**

        Phishing, credential stuffing, and password reuse are among the most frequent initial-access techniques in use today. A second factor blocks account takeover even in the case where the attacker already holds a working password, because the attacker must also compromise a physical or virtual device that never leaves the user's possession.

        Console sessions are unusually valuable. An interactive session can reach every service the user is authorized for, so an unprotected console login is a direct path to broad account access rather than a foothold in one service. RAM users frequently carry standing permissions that were granted once and never reviewed, which concentrates that value further.

        The check evaluates only users that have a logon profile. A programmatic identity that holds access keys but cannot sign in to the console is out of scope here; a companion check in this policy bounds the lifetime of those keys instead.
      audit: |
        ### Audit via Console

        1. Sign in to the [RAM console](https://ram.console.aliyun.com/).
        2. Navigate to **Identities** > **Users**.
        3. Open each user and review the **Authentication** tab for a bound MFA device.

        A passing user with console access shows an enabled MFA device. A failing user has a logon profile but no MFA device.

        ### Audit via CLI

        1. List users and inspect each user's MFA binding:

        ```bash
        aliyun ram ListUsers
        aliyun ram GetUserMFAInfo --UserName <user-name>
        ```

        A passing user returns a bound `MFADevice`. A failing user returns no MFA device while a logon profile exists.
      remediation:
        - id: console
          desc: |
            To require MFA for a RAM user in the RAM console:

            1. Sign in to the [RAM console](https://ram.console.aliyun.com/).
            2. Navigate to **Identities** > **Users** and open the affected user.
            3. On the **Authentication** tab, select **Virtual MFA Device** or **U2F Security Key** and complete the binding.
            4. Enforce MFA at sign-in by attaching an MFA-required condition through the account's security settings.
        - id: cli
          desc: |
            To bind a virtual MFA device to a RAM user with the `aliyun` CLI, create the device, then bind it after the user enrolls the generated secret in an authenticator app:

            ```bash
            aliyun ram CreateVirtualMFADevice --VirtualMFADeviceName <device-name>
            aliyun ram BindMFADevice --SerialNumber <mfa-serial> --UserName <user-name> \
              --AuthenticationCode1 <code1> --AuthenticationCode2 <code2>
            ```
        # No Terraform remediation: MFA device enrollment is an interactive runtime action (the user must register the device secret in an authenticator); the alicloud provider exposes no resource that binds and activates an MFA device for a user.
    variants:
      - uid: mondoo-alibaba-security-ram-user-mfa-enabled-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
  - uid: mondoo-alibaba-security-ram-user-mfa-enabled-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.ram.users.where(loginProfile != empty).all(mfaDevice != empty)

  # ===========================================================================
  # OSS
  # ===========================================================================
  - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled
    title: Ensure OSS buckets have server-side encryption enabled
    impact: 80
    docs:
      desc: |
        This check verifies that every Object Storage Service (OSS) bucket applies a default server-side encryption rule, so object contents are encrypted at rest from the moment they are written.

        Default encryption is a bucket-level setting administered under **Content Security** > **Server-side Encryption** in the OSS console, or with `aliyun oss bucket-encryption --method put`. The check requires that an encryption method is recorded for the bucket, either the service-managed `AES-256` keys or `KMS`. A bucket whose encryption method reads **None** fails. Declared in Terraform, the same setting is a `server_side_encryption_rule` block carrying an `sse_algorithm` value.

        **Why this matters**

        Without a bucket-level rule, objects land on the underlying storage as plaintext. Anyone who reaches that storage outside the service reads them directly: a recovered disk, a restored backup, or a copy of the storage media yields file contents without a single OSS API call, so nothing appears in request logs and no credential is ever spent. An encryption rule turns that same material into ciphertext that is useless without the keys.

        Encryption can also be requested per object at upload time, which means every SDK call, every pipeline, and every hand-run script has to remember to ask. A bucket default removes that dependency and guarantees objects are encrypted no matter which client wrote them, with no change to application behavior on read or write.

        Stored data that includes personal or cardholder information is expected to be encrypted at rest by most compliance regimes, so a bucket with no rule at all becomes an exception you must explain rather than a control you can evidence.

        This check asserts that some encryption method is configured, not which one. A companion check in this policy goes further and requires `KMS` with a customer master key, which adds key access control and audit trail that the built-in `AES-256` keys cannot provide.
      audit: |
        ### Audit via Console

        1. Sign in to the [OSS console](https://oss.console.aliyun.com/).
        2. Open each bucket and navigate to **Content Security** > **Server-side Encryption**.
        3. Confirm an encryption method (AES-256 or KMS) is enabled.

        A passing bucket shows a configured encryption method. A failing bucket shows encryption set to **None**.

        ### Audit via CLI

        1. Inspect the encryption configuration of each bucket with `ossutil` or the `aliyun` CLI:

        ```bash
        aliyun oss bucket-encryption --method get oss://<bucket-name>
        ```

        A passing bucket returns an `SSEAlgorithm`. A failing bucket returns no server-side encryption rule.
      remediation:
        - id: console
          desc: |
            To enable default encryption on an OSS bucket in the console:

            1. Sign in to the [OSS console](https://oss.console.aliyun.com/).
            2. Open the bucket and go to **Content Security** > **Server-side Encryption**.
            3. Set the encryption method to **KMS** (preferred) or **AES-256** and save.
        - id: cli
          desc: |
            To enable default server-side encryption with the `aliyun` CLI:

            ```bash
            aliyun oss bucket-encryption --method put oss://<bucket-name> --sse-algorithm KMS
            ```
        - id: terraform
          desc: |
            To enforce default encryption on an OSS bucket in Terraform, declare a `server_side_encryption_rule` block:

            ```hcl
            resource "alicloud_oss_bucket" "example" {
              bucket = "example-bucket"

              server_side_encryption_rule {
                sse_algorithm     = "KMS"
                kms_master_key_id = alicloud_kms_key.example.id
              }
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-alicloud
      - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-terraform-hcl
      - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-terraform-plan
      - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
  - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-alicloud
    filters: asset.platform == "alicloud-oss-bucket"
    mql: |
      alicloud.oss.bucket.sseAlgorithm != empty

  - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_oss_bucket")
    mql: |
      terraform.resources("alicloud_oss_bucket").all(
        blocks.where(type == "server_side_encryption_rule") != empty &&
        blocks.where(type == "server_side_encryption_rule").all(arguments["sse_algorithm"] != empty)
      )
  - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_oss_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_oss_bucket").all(
        change.after["server_side_encryption_rule"] != empty &&
        change.after["server_side_encryption_rule"].all(_["sse_algorithm"] != empty)
      )
  - uid: mondoo-alibaba-security-oss-bucket-encryption-enabled-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_oss_bucket")
    mql: |
      terraform.state.resources.where(type == "alicloud_oss_bucket").all(
        values["server_side_encryption_rule"] != empty &&
        values["server_side_encryption_rule"].all(_["sse_algorithm"] != empty)
      )

  # ===========================================================================
  # RAM
  # ===========================================================================
  # No Terraform variants: access key age is a runtime property of an issued credential; no alicloud_ram_access_key attribute governs how recently a key was rotated.
  - uid: mondoo-alibaba-security-ram-access-key-rotation-90-days
    title: Ensure RAM user access keys are rotated within 90 days
    impact: 70
    docs:
      desc: |
        This check verifies that long-lived programmatic credentials are replaced on a fixed schedule, requiring every `Active` RAM user access key to have been created within the last 90 days.

        An access key is a static secret with no expiry of its own, so its exposure window is bounded only by how often it is rotated. Rotate a key in the RAM console under **Identities** > **Users** on the user's **Authentication** tab by creating a new **AccessKey**, moving consumers onto it, then setting the old key to **Disabled** and deleting it once traffic has drained. The same sequence runs from the CLI with `aliyun ram CreateAccessKey`, `aliyun ram UpdateAccessKey --Status Inactive`, and `aliyun ram DeleteAccessKey`.

        **Why this matters**

        Unlike an interactive session, an access key does not lapse on its own. A key that is years old has had years to be copied into scripts, CI systems, container images, and laptops that are no longer trusted, and nothing about the account's current state records where those copies went.

        Leaked access keys are a leading breach vector. They surface routinely in public repositories, application logs, and published images, and automated scanners harvest them within minutes of exposure. Frequent rotation invalidates a leaked key before an attacker can build anything durable on it.

        Rotation also forces credential hygiene. A key that is never rotated outlives the person or the automation it was issued for, so a departed employee or a decommissioned job leaves working credentials behind. A rotation cycle surfaces those forgotten keys so they can be disabled and removed rather than quietly renewed.

        Keys already in the `Inactive` state are not evaluated, since a disabled key cannot authenticate. Disabling is a safe intermediate step during a rotation, but delete the old key once consumers have moved rather than leaving it parked.
      audit: |
        ### Audit via Console

        1. Sign in to the [RAM console](https://ram.console.aliyun.com/).
        2. Navigate to **Identities** > **Users** and open each user.
        3. On the **Authentication** tab, review each **AccessKey** and its creation date.

        A passing key is in the **Active** state and was created within the last 90 days. A failing key is **Active** but older than 90 days.

        ### Audit via CLI

        1. List users, then list each user's access keys and inspect the creation date:

        ```bash
        aliyun ram ListUsers
        aliyun ram ListAccessKeys --UserName <user-name>
        ```

        A passing key returns `Status: Active` with a `CreateDate` within the last 90 days. A failing key is `Active` with a `CreateDate` older than 90 days.
      remediation:
        - id: console
          desc: |
            To rotate a RAM user access key in the console:

            1. Sign in to the [RAM console](https://ram.console.aliyun.com/).
            2. Navigate to **Identities** > **Users** and open the affected user.
            3. On the **Authentication** tab, create a new **AccessKey**, update the applications that use the old key, then set the old key to **Disabled** and delete it once traffic has moved.
        - id: cli
          desc: |
            To rotate a RAM user access key with the `aliyun` CLI, create a new key, migrate consumers to it, then disable and delete the old key:

            ```bash
            aliyun ram CreateAccessKey --UserName <user-name>
            aliyun ram UpdateAccessKey --UserName <user-name> \
              --UserAccessKeyId <old-access-key-id> --Status Inactive
            aliyun ram DeleteAccessKey --UserName <user-name> \
              --UserAccessKeyId <old-access-key-id>
            ```
        # No Terraform remediation: key rotation is an operational lifecycle action on an already-issued credential; the alicloud provider exposes no resource attribute that enforces the age of an access key.
    variants:
      - uid: mondoo-alibaba-security-ram-access-key-rotation-90-days-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
  - uid: mondoo-alibaba-security-ram-access-key-rotation-90-days-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.ram.users.all(accessKeys.where(status == "Active").all(createDate > time.now - 90 * time.day))

  - uid: mondoo-alibaba-security-ram-password-policy-min-length
    title: Ensure the RAM password policy requires a minimum length of 14
    impact: 60
    docs:
      desc: |
        This check verifies that the account-wide credential floor for RAM passwords is high enough to resist cracking, requiring a minimum password length of at least 14 characters.

        The RAM account password policy governs every user in the account who authenticates with a password, so the minimum length set there is the shortest password anyone can choose. Set it in the RAM console under **Settings** > **Security Settings** > **Password Policy** by raising **Minimum Password Length** to 14 or greater, with `aliyun ram SetPasswordPolicy --MinimumPasswordLength 14`, or by declaring `minimum_password_length` on the Terraform account password policy resource.

        **Why this matters**

        Length is the strongest single lever available in password policy. Each additional character multiplies the search space an attacker must cover, so length defeats offline cracking far more effectively than composition rules do. A 14-character floor pushes an offline attack against a captured hash beyond practical reach for the tooling most attackers use.

        The Alibaba Cloud default minimum sits below modern guidance, so an account that was never tuned permits passwords short enough to be guessed. Because the policy is set once at the account level, leaving it at the default is a silent decision rather than a visible one, and no individual user is in a position to correct it.

        Enforcing the floor centrally also removes the gap that guidance alone leaves behind. Every RAM user who authenticates with a password inherits the same baseline, with no reliance on anyone following a written standard.

        Length is necessary but not sufficient on its own. Companion checks in this policy assert the character-class requirements and the failed-login lockout that complete the password policy.
      audit: |
        ### Audit via Console

        1. Sign in to the [RAM console](https://ram.console.aliyun.com/).
        2. Navigate to **Settings** > **Security Settings** and open the **Password Policy** section.
        3. Review the **Minimum Password Length** value.

        A passing account sets the minimum length to 14 or greater. A failing account sets it below 14.

        ### Audit via CLI

        1. Retrieve the account password policy:

        ```bash
        aliyun ram GetPasswordPolicy
        ```

        A passing account returns `MinimumPasswordLength` of 14 or greater. A failing account returns a value below 14.
      remediation:
        - id: console
          desc: |
            To raise the minimum password length in the console:

            1. Sign in to the [RAM console](https://ram.console.aliyun.com/).
            2. Navigate to **Settings** > **Security Settings** > **Password Policy**.
            3. Set **Minimum Password Length** to 14 or greater and save.
