  # ===========================================================================
  # Network ACLs
  # ===========================================================================
  - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress
    title: Ensure network ACLs do not accept admin traffic from the internet
    impact: 85
    docs:
      desc: |
        This check verifies that the subnet-level filter in front of a VPC does not accept administrative traffic from the whole internet.

        A network ACL is bound to vSwitches and evaluated ahead of the security groups attached to the instances inside them, so whatever it accepts reaches everything in those subnets. The check fails an inbound entry whose policy is `accept` and whose source is `0.0.0.0/0` when it covers every protocol, every port through `-1/-1`, or a TCP range containing SSH on port 22 or RDP on port 3389. Entries live under **Access Control** > **Network ACL** in the VPC console and are replaced with `aliyun vpc UpdateNetworkAclEntries`.

        **Why this matters**

        One accepting entry covers a whole subnet at once, every instance in every vSwitch the ACL is bound to, including instances created long after the entry was written. A permissive ACL quietly re-opens exactly what the security groups underneath it were written to close.

        Network ACLs are also reviewed far less often than security groups. Teams audit security groups as routine hygiene and rarely open the ACL list at all, so a permissive entry added during a migration survives long after everyone who understood it has moved on.

        A rule spanning a port opens it as surely as a rule naming it. An entry written `1/1024` publishes SSH just as `22/22` does, which is why review by eye for literal port numbers is unreliable and why this check tests range containment rather than exact matches.

        Scoped entries restore the subnet boundary and give real defense in depth, since a security group loosened by mistake is still backed by the ACL in front of it. An entry publishing a port the service is genuinely meant to serve, such as `443` from `0.0.0.0/0`, is expected and passes.
      audit: |
        ### Audit via Console

        1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
        2. Go to **Access Control** > **Network ACL** and open each ACL.
        3. Review the inbound rules for entries that accept traffic from `0.0.0.0/0`.

        A passing ACL accepts internet traffic only on the ports the service is meant to publish. A failing ACL accepts every protocol, every port, or SSH or RDP from `0.0.0.0/0`.

        ### Audit via CLI

        1. List the network ACLs and review their inbound entries:

        ```bash
        aliyun vpc DescribeNetworkAcls --RegionId <region-id>
        ```

        A passing ACL has no accepting inbound entry from `0.0.0.0/0` covering all protocols, all ports, port 22, or port 3389. A failing ACL has one.
      remediation:
        - id: console
          desc: |
            To narrow a network ACL inbound rule in the console:

            1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
            2. Go to **Access Control** > **Network ACL** and open the ACL.
            3. Edit the inbound rule to name a specific source range and a specific port, or change its policy to **drop**, and save.
        - id: cli
          desc: |
            To replace the inbound entries with a scoped set using the `aliyun` CLI:

            ```bash
            aliyun vpc UpdateNetworkAclEntries --NetworkAclId <acl-id> \
              --UpdateIngressAclEntries true \
              --IngressAclEntries.1.Policy accept \
              --IngressAclEntries.1.Protocol tcp \
              --IngressAclEntries.1.Port 22/22 \
              --IngressAclEntries.1.SourceCidrIp 203.0.113.0/24
            ```
        - id: terraform
          desc: |
            To scope the inbound entries in Terraform, name the source range each entry accepts:

            ```hcl
            resource "alicloud_network_acl" "example" {
              vpc_id           = "vpc-example"
              network_acl_name = "example-acl"

              ingress_acl_entries {
                network_acl_entry_name = "allow-ssh-from-office"
                policy                 = "accept"
                protocol               = "tcp"
                port                   = "22/22"
                source_cidr_ip         = "203.0.113.0/24"
                entry_type             = "custom"
              }
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-alicloud
      - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-terraform-hcl
