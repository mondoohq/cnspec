  - uid: mondoo-alibaba-security-vpn-connection-strong-dh-group
    title: Ensure VPN connections use a Diffie-Hellman group of 14 or higher
    impact: 70
    docs:
      desc: |
        This check ensures that every IPsec VPN connection negotiates its keys with Diffie-Hellman group 14 or higher, and does not disable perfect forward secrecy. Groups 1, 2, and 5 use 768-, 1024-, and 1536-bit MODP primes; 1024-bit MODP is within reach of a well-resourced attacker who precomputes against the small number of primes in common use, which is exactly the situation a fixed standard group creates.

        **Why this matters**

        - **A weak group undoes a strong cipher:** AES-256 protects nothing if the key that seeds it was derived from an exchange an attacker can break.
        - **Standard groups are shared targets:** Precomputation against a widely reused prime is amortized across every connection that uses it.
        - **Disabling forward secrecy makes it retroactive:** Without PFS, recovering one long-term key exposes traffic from every earlier session.

        **Risk mitigation**

        - **Puts key agreement out of practical reach:** Group 14 and above keep the discrete-logarithm problem infeasible at realistic attacker budgets.
        - **Contains any single key compromise:** Rekeying with fresh material means a recovered key does not decrypt past traffic.
      audit: |
        ### Audit via Console

        1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
        2. Go to **Interconnections** > **VPN** > **IPsec Connections** and open each connection.
        3. Review the Diffie-Hellman group in both the **IKE Configuration** and the **IPsec Configuration**.

        A passing connection uses `group14` or higher in both. A failing connection uses `group1`, `group2`, `group5`, or has it disabled.

        ### Audit via CLI

        1. Describe the IPsec connections and review both configurations:

        ```bash
        aliyun vpc DescribeVpnConnections --RegionId <region-id>
        ```

        A passing connection returns `group14` or higher for `IkeConfig.IkePfs` and `IpsecConfig.IpsecPfs`. A failing connection returns a lower group or `disabled`.
      remediation:
        - id: console
          desc: |
            To raise the Diffie-Hellman group in the console:

            1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
            2. Go to **Interconnections** > **VPN** > **IPsec Connections** and edit the connection.
            3. Set the DH group to `group14` or higher in both configurations, apply the matching change on the customer gateway, and save.
        - id: cli
          desc: |
            To raise the Diffie-Hellman group with the `aliyun` CLI:

            ```bash
            aliyun vpc ModifyVpnConnectionAttribute --VpnConnectionId <connection-id> \
              --IkeConfig '{"IkePfs":"group14"}' --IpsecConfig '{"IpsecPfs":"group14"}'
            ```
        - id: terraform
          desc: |
            To pin the Diffie-Hellman group in Terraform, set `ike_pfs` and `ipsec_pfs`:

            ```hcl
            resource "alicloud_vpn_connection" "example" {
              vpn_gateway_id      = "vpn-example"
              customer_gateway_id = "cgw-example"
              local_subnet        = ["10.0.0.0/16"]
              remote_subnet       = ["192.168.0.0/16"]

              ike_config {
                ike_enc_alg = "aes256"
                ike_version = "ikev2"
                ike_pfs     = "group14"
              }

              ipsec_config {
                ipsec_enc_alg = "aes256"
                ipsec_pfs     = "group14"
              }
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-vpn-connection-strong-dh-group-alicloud
      - uid: mondoo-alibaba-security-vpn-connection-strong-dh-group-terraform-hcl
