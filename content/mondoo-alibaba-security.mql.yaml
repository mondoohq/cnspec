      terraform.state.resources.where(type == "alicloud_network_acl").map(values).all(
        _["ingress_acl_entries"] == empty ||
        _["ingress_acl_entries"]
          .where(_["policy"].downcase == "accept")
          .where(_["source_cidr_ip"] == "0.0.0.0/0")
          .none(
            _["protocol"].downcase == "all" ||
            _["port"] == "-1/-1" ||
            _["protocol"].downcase == "tcp" && _["port"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ ||
            _["protocol"].downcase == "tcp" && _["port"] == /^(\d{1,3}|[12]\d{3}|3[0-2]\d{2}|33[0-7]\d|338\d)\/(3389|339\d|3[4-9]\d{2}|[4-9]\d{3}|\d{5})$/
          )
      )

  # ===========================================================================
  # KMS Secrets Manager
  # ===========================================================================
  - uid: mondoo-alibaba-security-kms-secret-rotation-enabled
    title: Ensure KMS secrets have automatic rotation enabled
    impact: 70
    docs:
      desc: |
        This check verifies that every secret held in KMS Secrets Manager rotates automatically.

        A secret whose rotation state is `Disabled` or `Suspended` keeps the same value indefinitely, so the window in which a copy taken from a log, a backup, or a developer's machine still works never closes on its own. Rotation is configured in the KMS console under Resource and then Secrets, by opening the secret, choosing Configure Rotation, and setting an automatic rotation interval. The same policy is set with `aliyun kms UpdateSecretRotationPolicy --EnableAutomaticRotation true`, or in Terraform with `enable_automatic_rotation` and a `rotation_interval`.

        **Why this matters**

        Secrets leak through copies, not through the vault. The value reaches application logs, CI output, and local development environments, and rotation is the mechanism that makes those scattered copies stop working. Without it, a stolen value keeps working until somebody notices, which may be never.

        A static secret therefore has an unbounded compromise window. An attacker who obtains the value once retains the access it grants for as long as the secret exists, and nothing in the account marks the moment that access should have ended.

        A suspended rotation schedule is the worst of both states, because it looks configured. It reads as "rotation is set up" during a console review while nothing is actually rotating, so the gap survives exactly the kind of inspection meant to catch it.

        Regular automatic rotation also exercises the rotation path itself. Consumers are proven to handle a changing value under normal conditions, so an emergency rotation during an incident is not the first attempt. Choose an interval that matches the sensitivity of the value, and confirm that every consumer reads the secret at use rather than caching it at deployment.
      audit: |
        ### Audit via Console

        1. Sign in to the [KMS console](https://kms.console.aliyun.com/).
        2. Go to **Resource** > **Secrets** and open each secret.
        3. Review the automatic rotation setting.

        A passing secret has rotation enabled. A failing secret has it disabled or suspended.

        ### Audit via CLI

        1. Describe each secret and review its rotation state:

        ```bash
        aliyun kms DescribeSecret --SecretName <secret-name>
        ```

        A passing secret returns `AutomaticRotation` of `Enabled`. A failing secret returns `Disabled` or `Suspended`.
      remediation:
        - id: console
          desc: |
            To enable automatic rotation in the console:

            1. Sign in to the [KMS console](https://kms.console.aliyun.com/).
            2. Go to **Resource** > **Secrets** and open the secret.
            3. Select **Configure Rotation**, turn on **Automatic Rotation**, set a rotation interval, and confirm.
        - id: cli
          desc: |
            To enable automatic rotation with the `aliyun` CLI:

            ```bash
            aliyun kms UpdateSecretRotationPolicy --SecretName <secret-name> \
              --EnableAutomaticRotation true --RotationInterval 2592000s
            ```
        - id: terraform
          desc: |
            To enable automatic rotation in Terraform, set `enable_automatic_rotation` and a `rotation_interval`:

            ```hcl
            resource "alicloud_kms_secret" "example" {
              secret_name               = "example-secret"
              secret_data               = var.example_secret_value
              version_id                = "v1"
              enable_automatic_rotation = true
              rotation_interval         = "2592000s"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-alicloud
      - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-terraform-hcl
      - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-terraform-plan
      - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
  - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.kms.secrets.all(automaticRotation == "Enabled")
  - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_kms_secret")
    mql: |
      terraform.resources("alicloud_kms_secret").all(
        arguments["enable_automatic_rotation"] == true
      )
  - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_kms_secret")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_kms_secret").all(
        change.after["enable_automatic_rotation"] == true
      )
  - uid: mondoo-alibaba-security-kms-secret-rotation-enabled-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_kms_secret")
    mql: |
      terraform.state.resources.where(type == "alicloud_kms_secret").all(
        values["enable_automatic_rotation"] == true
      )

  - uid: mondoo-alibaba-security-kms-secret-customer-managed-key
    title: Ensure KMS secrets are encrypted with a customer master key
    impact: 70
    docs:
      desc: |
        This check verifies that secrets in KMS Secrets Manager are encrypted under a customer master key rather than the service default.

        A customer master key gives the account its own key policy, rotation schedule, and audit trail for the material that protects the secret value, none of which the account controls when the service default is used. The key is chosen when the secret is created, in the KMS console under Resource and then Secrets, with `aliyun kms CreateSecret --EncryptionKeyId <cmk-id>`, or through the `encryption_key_id` argument in Terraform.

        **Why this matters**

        The key policy becomes a second gate. With a customer master key, reading a secret requires both Secrets Manager permission and permission on the key itself, so a single over-broad grant on Secrets Manager is no longer sufficient to read the value. Secret administration and key administration can also be held by different principals, which turns a single compromised identity into an incomplete one.

        Key use is logged separately. Decrypt operations against a customer master key appear in the key's own audit trail, producing a record of access that Secrets Manager permissions alone do not generate, and giving investigators a second, independent view of who read what.

        Revocation becomes possible. Disabling the key makes every secret it protects unreadable at once, which is often the fastest containment step available during an incident. Rotation and disablement become decisions the account owner makes rather than decisions delegated to the service.

        The encryption key of a secret cannot be changed after creation, so remediating an existing secret means creating a replacement under the intended key, repointing consumers at it, deleting the original, and rotating the value. Treat the rotation as mandatory rather than optional, since the old value was protected by material the account never controlled.
      audit: |
        ### Audit via Console

        1. Sign in to the [KMS console](https://kms.console.aliyun.com/).
        2. Go to **Resource** > **Secrets** and open each secret.
        3. Review the encryption key it is protected by.

        A passing secret names a customer master key. A failing secret shows the service default.

        ### Audit via CLI

        1. Describe each secret and review its encryption key:

        ```bash
        aliyun kms DescribeSecret --SecretName <secret-name>
        ```

        A passing secret returns an `EncryptionKeyId`. A failing secret returns none.
      remediation:
        - id: console
          desc: |
            The encryption key of a secret is chosen at creation. To move to a customer master key in the console:

            1. Sign in to the [KMS console](https://kms.console.aliyun.com/) and create or select a customer master key.
            2. Go to **Resource** > **Secrets** and create a replacement secret, choosing that key.
            3. Point consumers at the new secret, then delete the old one and rotate the value.
        - id: cli
          desc: |
            To create a replacement secret under a customer master key with the `aliyun` CLI:

            ```bash
            aliyun kms CreateSecret --SecretName <secret-name> \
              --SecretData '<value>' --VersionId v1 --EncryptionKeyId <cmk-id>
            ```
        - id: terraform
          desc: |
            To bind a secret to a customer master key in Terraform, set `encryption_key_id`:

            ```hcl
            resource "alicloud_kms_secret" "example" {
              secret_name       = "example-secret"
              secret_data       = var.example_secret_value
              version_id        = "v1"
              encryption_key_id = "key-example"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-alicloud
      - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-terraform-hcl
      - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-terraform-plan
      - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
  - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.kms.secrets.all(encryptionKey != empty)
  - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_kms_secret")
    mql: |
      terraform.resources("alicloud_kms_secret").all(arguments["encryption_key_id"] != empty)
  - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_kms_secret")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_kms_secret").all(
        change.after["encryption_key_id"] != empty
      )
  - uid: mondoo-alibaba-security-kms-secret-customer-managed-key-terraform-state
    filters: |
