    filters: asset.platform == "alicloud-ack-cluster"
    mql: |
      alicloud.cs.cluster.auditLogEnabled == true

  - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled
    title: Ensure ACK clusters enable RRSA (RAM Roles for Service Accounts)
    impact: 70
    docs:
      desc: |
        This check verifies that Container Service for Kubernetes (ACK) clusters enable RAM Roles for Service Accounts, known as RRSA.

        RRSA issues OpenID Connect tokens so that individual Kubernetes service accounts assume narrowly scoped RAM roles, instead of every pod inheriting the shared worker node RAM role. Without it, any workload on a node can use the node's role and reach whatever that role is permitted to do. RRSA is turned on in the Container Service console under Cluster Information and Basic Information, with `aliyun cs` against the cluster's RRSA enable path, or by setting `enable_rrsa` to `true` in Terraform. Enabling it is only the first half of the work; service accounts must then be bound to the scoped RAM roles their workloads require.

        **Why this matters**

        A shared node role is over-broad by construction. When pods rely on the worker node RAM role, a single compromised container inherits exactly the same cloud permissions as every other workload scheduled on that node, including workloads owned by other teams.

        There is no per-workload boundary without RRSA. One application cannot be granted access to a specific bucket or key without simultaneously granting it to every co-located pod, so the node role drifts toward the union of everything anything on the cluster has ever needed.

        RRSA restores least privilege at the workload level. Each service account carries only the permissions its application needs, so a compromised pod reaches only the resources that workload was granted, and workloads stop borrowing the broad node identity that makes lateral movement easy.

        Once RRSA is enabled on a cluster it cannot be turned off, so treat it as a one-way change and confirm that the OpenID Connect issuer and role trust policies are in place before workloads begin depending on them.
      audit: |
        ### Audit via Console

        1. Sign in to the [Container Service console](https://cs.console.aliyun.com/).
        2. Open each cluster and go to **Cluster Information** > **Basic Information**.
        3. Confirm that **RRSA** (RAM Roles for Service Accounts) is enabled.

        A passing cluster shows RRSA enabled. A failing cluster shows RRSA disabled.

        ### Audit via CLI

        1. Describe each cluster and inspect the RRSA configuration:

        ```bash
        aliyun cs GET /api/v1/clusters/<cluster-id>
        ```

        A passing cluster returns `rrsa_config` with `enabled` set to `true`. A failing cluster returns RRSA disabled.
      remediation:
        - id: console
          desc: |
            To enable RRSA on an ACK cluster in the console:

            1. Sign in to the [Container Service console](https://cs.console.aliyun.com/).
            2. Open the cluster and go to **Cluster Information** > **Basic Information**.
            3. Enable **RRSA**, then bind service accounts to scoped RAM roles as required by your workloads.
        - id: cli
          desc: |
            To enable RRSA on an existing cluster with the `aliyun` CLI:

            ```bash
            aliyun cs POST /clusters/<cluster-id>/rrsa/enable
            ```
        - id: terraform
          desc: |
            To enable RRSA in Terraform, set `enable_rrsa` to `true` on the managed cluster. Once enabled, RRSA cannot be turned off:

            ```hcl
            resource "alicloud_cs_managed_kubernetes" "example" {
              name        = "example-cluster"
              vswitch_ids = ["vsw-example"]
              enable_rrsa = true
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-alicloud
      - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-terraform-hcl
      - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-terraform-plan
      - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: false
  - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-alicloud
    filters: asset.platform == "alicloud-ack-cluster"
    mql: |
      alicloud.cs.cluster.rrsaEnabled == true
  - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_cs_managed_kubernetes")
    mql: |
      terraform.resources("alicloud_cs_managed_kubernetes").all(
        arguments["enable_rrsa"] == true
      )
  - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_cs_managed_kubernetes")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_cs_managed_kubernetes").all(
        change.after["enable_rrsa"] == true
      )
  - uid: mondoo-alibaba-security-cs-cluster-rrsa-enabled-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_cs_managed_kubernetes")
    mql: |
      terraform.state.resources.where(type == "alicloud_cs_managed_kubernetes").all(
        values["enable_rrsa"] == true
      )

  # ===========================================================================
  # NAS
  # ===========================================================================
  - uid: mondoo-alibaba-security-nas-access-rule-restrict-source
    title: Ensure NAS access rules do not grant read-write access to the internet
    impact: 80
    docs:
      desc: |
        This check verifies that mount access to Apsara File Storage NAS is scoped to named VPC and on-premises ranges instead of granting the `RDWR` permission to the entire internet.

        A NAS access group is the list of rules deciding which clients may mount a file system, and each rule pairs a source address range with a read/write permission. A rule that sets its `source_cidr_ip` to `0.0.0.0/0`, or its IPv6 source to `::/0`, while holding the `RDWR` permission lets any host able to reach the mount target both read and modify stored files. The rules live under **Permission Groups** in the NAS console, and `aliyun nas ModifyAccessRule` changes them from the command line.

        **Why this matters**

        A world-writable export is a data-integrity problem before it is a confidentiality one. Any client that can reach the mount target can alter or destroy files, not only read them, so an unauthenticated stranger holds the same power over the file system as the application that owns it.

        The confidentiality loss follows anyway. Sensitive data on a file system exposed to the whole internet can be copied out wholesale, encrypted for ransom, or corrupted quietly enough that the damage surfaces only when a restore is attempted.

        The blast radius is wider than a single rule suggests. NAS evaluates access rules by priority across the whole access group, so one overly broad entry can undo tighter rules written alongside it, and the group may be attached to more than one file system.

        Where a broad range genuinely has to be served, granting `RDONLY` rather than `RDWR` reduces the exposure from modification to disclosure. This check looks only at the read-write case, so a permissive read-only rule still deserves its own review.
      audit: |
        ### Audit via Console

        1. Sign in to the [NAS console](https://nas.console.aliyun.com/).
        2. Navigate to **Permission Groups** and open each access group.
        3. Review the rules and confirm that no rule sets **Authorization Address** to `0.0.0.0/0` (or `::/0`) while **Read/Write Permission** is **RDWR**.

        A passing access group has no read-write rule whose source is the entire internet. A failing group has an `RDWR` rule with a source of `0.0.0.0/0` or `::/0`.

        ### Audit via CLI

        1. List access groups and inspect the rules of each with the `aliyun` CLI:

        ```bash
        aliyun nas DescribeAccessGroups
        aliyun nas DescribeAccessRules --AccessGroupName <access-group-name>
        ```

        A passing rule with `RWAccess` of `RDWR` shows a specific `SourceCidrIp`. A failing rule shows `RWAccess` `RDWR` with `SourceCidrIp` `0.0.0.0/0` or `Ipv6SourceCidrIp` `::/0`.
      remediation:
        - id: console
          desc: |
            To tighten a NAS access rule in the console:

            1. Sign in to the [NAS console](https://nas.console.aliyun.com/).
            2. Navigate to **Permission Groups** and open the affected access group.
            3. Edit the offending rule and change **Authorization Address** from `0.0.0.0/0` to the specific VPC or client CIDR that needs access, or set **Read/Write Permission** to **RDONLY** where write access is not required.
        - id: cli
          desc: |
            To restrict a NAS access rule to a specific network with the `aliyun` CLI:

            ```bash
            aliyun nas ModifyAccessRule --AccessGroupName <access-group-name> \
              --AccessRuleId <rule-id> --SourceCidrIp 10.0.0.0/8 --RWAccessType RDONLY
            ```
        - id: terraform
          desc: |
            To declare a scoped NAS access rule in Terraform, set a specific `source_cidr_ip` and an appropriate `rw_access_type`:

            ```hcl
            resource "alicloud_nas_access_rule" "example" {
              access_group_name = alicloud_nas_access_group.example.access_group_name
              source_cidr_ip    = "10.0.0.0/8"
              rw_access_type    = "RDONLY"
              user_access_type  = "no_squash"
              priority          = 1
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-alicloud
      - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-terraform-hcl
      - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-terraform-plan
      - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-3-2
  - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.nas.accessGroups.all(
        accessRules.where(rwAccess == "RDWR").all(sourceCidrIp != "0.0.0.0/0" && ipv6SourceCidrIp != "::/0")
      )
  - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_nas_access_rule")
    mql: |
      terraform.resources("alicloud_nas_access_rule").all(
        arguments["rw_access_type"] != "RDWR" || arguments["source_cidr_ip"] != "0.0.0.0/0" && arguments["ipv6_source_cidr_ip"] != "::/0"
      )
  - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_nas_access_rule")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_nas_access_rule").all(
        change.after["rw_access_type"] != "RDWR" || change.after["source_cidr_ip"] != "0.0.0.0/0" && change.after["ipv6_source_cidr_ip"] != "::/0"
      )
  - uid: mondoo-alibaba-security-nas-access-rule-restrict-source-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_nas_access_rule")
    mql: |
      terraform.state.resources.where(type == "alicloud_nas_access_rule").all(
        values["rw_access_type"] != "RDWR" || values["source_cidr_ip"] != "0.0.0.0/0" && values["ipv6_source_cidr_ip"] != "::/0"
      )

  # ===========================================================================
  # Cloud Firewall
  # ===========================================================================
  # No Terraform variants: whether Cloud Firewall is provisioned and switched on for the account is a runtime service posture reported by the buy-version API; there is no alicloud_* resource attribute that represents the "Cloud Firewall enabled" account state.
  - uid: mondoo-alibaba-security-cloudfirewall-enabled
    title: Ensure Cloud Firewall is enabled
    impact: 75
    docs:
      desc: |
        This check verifies that the account has a managed boundary firewall in force, meaning Alibaba Cloud Firewall is provisioned and its protection is switched on.

        Cloud Firewall inspects and filters north-south traffic at the internet edge and east-west traffic between VPCs, applying the account's control policies at both. It is activated by purchasing an edition and switching protection on in the Cloud Firewall console, and `aliyun cloudfw DescribeUserBuyVersion` reports the account's current status.

        **Why this matters**

        Without it the account has no managed choke point at all. Every allow and deny decision falls to per-resource security groups and network ACLs, which are edited by whoever owns the workload and drift apart over time, so there is no single place where the intended perimeter policy is written down, let alone enforced.

        The loss is as much visibility as enforcement. Cloud Firewall supplies traffic analysis and intrusion prevention over the flows crossing the perimeter, and with it off the account has no view of what is reaching in or heading out, which is the telemetry an investigation would otherwise start from.

        An active firewall also blocks malicious inbound and outbound flows before they touch a workload, so a compromised instance attempting to call out meets a boundary control rather than an open path.

        Provisioning alone is not the finish line. Once the firewall is on, its control policies still have to say something meaningful, and a companion check in this policy fails an inbound policy that accepts every protocol from every source.
      audit: |
        ### Audit via Console

        1. Sign in to the [Cloud Firewall console](https://yundun.console.aliyun.com/?p=cfwnext).
        2. Review the **Overview** page and confirm the firewall is provisioned and its protection is switched on.

        A passing account shows Cloud Firewall enabled. A failing account shows Cloud Firewall not provisioned or switched off.

        ### Audit via CLI

        1. Query the account's Cloud Firewall edition and status with the `aliyun` CLI:

        ```bash
        aliyun cloudfw DescribeUserBuyVersion
        ```

        A passing account returns `UserStatus` of `true`. A failing account returns `UserStatus` of `false`.
      remediation:
        - id: console
          desc: |
            To enable Cloud Firewall in the console:

            1. Sign in to the [Cloud Firewall console](https://yundun.console.aliyun.com/?p=cfwnext).
            2. Provision a Cloud Firewall edition for the account and switch protection on.
            3. Define control policies for internet, VPC, and internal boundaries to enforce the intended traffic policy.
        - id: cli
          desc: |
            Cloud Firewall is enabled by purchasing and activating an edition. After it is active, confirm the account status with the `aliyun` CLI:

            ```bash
            aliyun cloudfw DescribeUserBuyVersion
            ```
        # No Terraform remediation: enabling Cloud Firewall is a subscription/activation action against the account, not the declaration of an alicloud_* resource, so there is no Terraform resource that provisions and switches on the service.
    variants:
      - uid: mondoo-alibaba-security-cloudfirewall-enabled-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-3-2
  - uid: mondoo-alibaba-security-cloudfirewall-enabled-alicloud
    filters: asset.platform == "alicloud-cloud-firewall"
    mql: |
      alicloud.cloudFirewall.enabled == true

  # ===========================================================================
  # Anti-DDoS
  # ===========================================================================
  # No Terraform variants: whether an Anti-DDoS instance is provisioned and its protection is active is a runtime status reported by the DDoS API; the alicloud_ddoscoo_instance resource does not expose an attribute that asserts protection is currently enabled and running.
  - uid: mondoo-alibaba-security-antiddos-instance-protection-active
    title: Ensure Anti-DDoS instances are enabled and active
    impact: 70
    docs:
      desc: |
        This check verifies that DDoS mitigation already purchased for the account is actually in force, requiring every provisioned Anti-DDoS instance to be enabled.

        An Anti-DDoS instance absorbs and scrubs volumetric floods on behalf of the endpoints associated with it, but only once it is enabled and a protected object is attached. An instance that exists in the account without being enabled shields nothing. Instances are reviewed under **Assets** > **Instances** in the Anti-DDoS console, and `aliyun ddoscoo DescribeInstances` reports their state.

        **Why this matters**

        Availability is the entire point of the purchase. A volumetric flood saturates the link or the frontend before any application-layer control is reached, and mitigation only helps if it is scrubbing traffic when the flood arrives. A disabled instance cannot protect the endpoints it was bought for.

        The lapse is a quiet one. The instance appears in the console, on the invoice, and in any inventory of security controls, so a reviewer counting protections records coverage that does not exist. Nothing about the account looks wrong until an attack tests it.

        Public-facing services frequently depend on this mitigation to stay reachable at all during an attack, so the gap is discovered at the worst possible moment, under load, with no time left to attach a protected object and switch the instance on.

        An account with no Anti-DDoS instances passes. This check confirms that protection already paid for is switched on; it never argues that an account ought to buy Anti-DDoS in the first place.
      audit: |
        ### Audit via Console

        1. Sign in to the [Anti-DDoS console](https://yundun.console.aliyun.com/?p=ddoscoo).
        2. Open **Assets** > **Instances** and review each instance.
        3. Confirm each instance is enabled and its protection status is normal.

        A passing account has every Anti-DDoS instance enabled. A failing account has one or more instances that are provisioned but not enabled.

        ### Audit via CLI

        1. List the account's Anti-DDoS instances with the `aliyun` CLI:

        ```bash
        aliyun ddoscoo DescribeInstances
        ```

        A passing instance returns `Enabled` of `1`. A failing instance returns `Enabled` of `0`.
      remediation:
        - id: console
          desc: |
            To activate protection on an Anti-DDoS instance in the console:

            1. Sign in to the [Anti-DDoS console](https://yundun.console.aliyun.com/?p=ddoscoo).
            2. Open **Assets** > **Instances** and select the instance that is not enabled.
            3. Associate the protected object and enable the instance so its mitigation is in force.
        - id: cli
          desc: |
            After associating a protected object, confirm the instance is enabled with the `aliyun` CLI:

            ```bash
            aliyun ddoscoo DescribeInstances
            ```
        # No Terraform remediation: enabling protection on a provisioned Anti-DDoS instance is an operational action tied to associating protected objects; the alicloud provider exposes no resource attribute that toggles an instance's active protection state.
    variants:
      - uid: mondoo-alibaba-security-antiddos-instance-protection-active-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-4
      compliance/nist-csf-2: nist-csf-2-pr-ir-04
      compliance/nist-sp-800-171: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-5
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
  - uid: mondoo-alibaba-security-antiddos-instance-protection-active-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.antiddos.instances.all(enabled == true)

  # ===========================================================================
  # SLB (Classic Load Balancer)
  # ===========================================================================
  # No Terraform variants: SLB listeners are declared as separate alicloud_slb_listener resources keyed by a load balancer id, so correlating a listener's protocol to whether its parent load balancer is internet-facing is a runtime relationship the static Terraform graph does not resolve cleanly.
  - uid: mondoo-alibaba-security-slb-listener-not-plaintext
    title: Ensure internet-facing load balancer listeners are not plaintext HTTP
    impact: 75
    docs:
      desc: |
        This check verifies that public web traffic reaching a Server Load Balancer (SLB) instance is protected by TLS, requiring internet-facing load balancers to serve no plaintext `HTTP` listener.

        An internet-facing SLB accepts client connections from the public internet. A listener declared with the `HTTP` protocol terminates or forwards that traffic unencrypted across untrusted networks, while an `HTTPS` listener presents a server certificate and protects the same traffic with TLS. Listeners are managed on the **Listeners** tab of each load balancer in the SLB console, and `aliyun slb CreateLoadBalancerHTTPSListener` adds an encrypted one from the command line.

        **Why this matters**

        Cleartext on a public path exposes exactly what is worth stealing. Credentials submitted to a login form, session tokens replayed on every subsequent request, and the request and response bodies themselves all cross the internet readable by anything on the path.

        Reading is not the limit. An on-path attacker can rewrite an unencrypted response as easily as observe it, injecting content or altering a request before it reaches the backend, and neither the client nor the load balancer has any way to detect the change.

        Offering `HTTP` at all creates a downgrade path even when `HTTPS` is available beside it. Clients follow the first URL they are handed, bookmarks and hardcoded links keep pointing at the plaintext port, and traffic settles on the unencrypted listener without anyone choosing it.

        Internal load balancers pass this check, since the exposure it describes depends on the public address. The assertion is that no `HTTP` listener exists on a public instance, so a listener kept only to redirect clients onward to `HTTPS` still fails it.
      audit: |
        ### Audit via Console

        1. Sign in to the [SLB console](https://slb.console.aliyun.com/).
        2. For each load balancer whose address type is **Internet**, open the **Listeners** tab.
        3. Confirm no listener uses the **HTTP** protocol; web listeners should use **HTTPS**.

        A passing internet-facing load balancer serves no `HTTP` listener. A failing one exposes at least one `HTTP` listener.

        ### Audit via CLI

        1. List load balancers and inspect the listeners of each with the `aliyun` CLI:

        ```bash
        aliyun slb DescribeLoadBalancers --AddressType internet
        aliyun slb DescribeLoadBalancerListeners --LoadBalancerId <lb-id>
        ```

        A passing internet-facing load balancer returns no listener with `ListenerProtocol` of `http`. A failing one returns a listener with `ListenerProtocol` `http`.
      remediation:
        - id: console
          desc: |
            To remove plaintext web traffic from an internet-facing load balancer in the console:

            1. Sign in to the [SLB console](https://slb.console.aliyun.com/).
            2. Open the internet-facing load balancer and go to the **Listeners** tab.
            3. Add an **HTTPS** listener with a server certificate, migrate clients to it, then delete the **HTTP** listener (or configure it to redirect to HTTPS).
        - id: cli
          desc: |
            To create an HTTPS listener and remove the plaintext one with the `aliyun` CLI:

            ```bash
            aliyun slb CreateLoadBalancerHTTPSListener --LoadBalancerId <lb-id> \
              --ListenerPort 443 --ServerCertificateId <cert-id> --Bandwidth -1 \
              --HealthCheck on
            aliyun slb DeleteLoadBalancerListener --LoadBalancerId <lb-id> --ListenerPort 80
            ```
        # No Terraform remediation: SLB listeners are modeled as standalone alicloud_slb_listener resources decoupled from their load balancer's address type, so this posture is asserted against the running configuration rather than a single Terraform attribute.
    variants:
      - uid: mondoo-alibaba-security-slb-listener-not-plaintext-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
