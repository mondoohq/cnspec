  - uid: mondoo-alibaba-security-oss-bucket-block-public-access
    title: Ensure OSS buckets enable Block Public Access
    impact: 85
    docs:
      desc: |
        This check ensures that every Object Storage Service (OSS) bucket has Block Public Access enabled. Block Public Access is an account- and bucket-level guardrail that overrides any ACL or bucket policy that would otherwise grant public access, so a bucket cannot be exposed to the internet even if an ACL or policy is misconfigured.

        **Why this matters**

        - **Defense in depth:** Block Public Access acts as a backstop that neutralizes accidental public ACLs and bucket policies, so a single mistake does not expose data.
        - **Prevents drift:** Even if a user or automation later sets a public ACL or policy, the guardrail keeps the bucket private.
        - **Reduces exposure surface:** Buckets that never need public access are hardened against the most common storage-exposure mistake.

        **Risk mitigation**

        - **Overrides risky grants:** Public ACLs and policies are ignored while the guardrail is active.
        - **Consistent baseline:** Enabling the block establishes a private-by-default posture across buckets.
      audit: |
        ### Audit via Console

        1. Sign in to the [OSS console](https://oss.console.aliyun.com/).
        2. Open each bucket and go to **Access Control** > **Block Public Access**.
        3. Confirm Block Public Access is **Enabled**.

        A passing bucket shows Block Public Access enabled. A failing bucket shows it disabled.
      remediation:
        - id: console
          desc: |
            To enable Block Public Access on an OSS bucket in the console:

            1. Sign in to the [OSS console](https://oss.console.aliyun.com/).
            2. Open the bucket and go to **Access Control** > **Block Public Access**.
            3. Turn on **Block Public Access** and save.
        # No CLI remediation: the embedded ossutil (aliyun oss) has no Block Public Access command; it is configured through the console or Terraform.
        - id: terraform
          desc: |
            To enable Block Public Access on an OSS bucket in Terraform, use the `alicloud_oss_bucket_public_access_block` resource:

            ```hcl
            resource "alicloud_oss_bucket_public_access_block" "example" {
              bucket              = alicloud_oss_bucket.example.bucket
              block_public_access = true
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-oss-bucket-block-public-access-alicloud
      - uid: mondoo-alibaba-security-oss-bucket-block-public-access-terraform-hcl
