  # ===========================================================================
  # Network ACLs
  # ===========================================================================
  - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress
    title: Ensure network ACLs do not accept admin traffic from the internet
    impact: 85
    docs:
      desc: |
        This check ensures that no network ACL has an ingress rule accepting traffic from `0.0.0.0/0` on every protocol, on every port, or on SSH (22) or RDP (3389). A network ACL is the subnet-level filter that sits in front of every security group in the vSwitches it is bound to, so a permissive entry here quietly re-opens what the security groups were written to close.

        **Why this matters**

        - **It applies to a whole subnet at once:** One accepting entry covers every instance in every vSwitch the ACL is bound to, present and future.
        - **It is reviewed less often than security groups:** Teams audit security groups routinely and network ACLs rarely, so a permissive entry survives longer.
        - **A rule spanning a port opens it:** An entry written as `1/1024` opens SSH just as surely as one written `22/22`, which makes literal-port review unreliable.

        **Risk mitigation**

        - **Restores the subnet boundary:** Only named source ranges reach management ports, whatever the security groups say.
        - **Gives defense in depth:** A security group loosened by mistake is still backed by the ACL in front of it.
      audit: |
        ### Audit via Console

        1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
        2. Go to **Access Control** > **Network ACL** and open each ACL.
        3. Review the inbound rules for entries that accept traffic from `0.0.0.0/0`.

        A passing ACL accepts internet traffic only on the ports the service is meant to publish. A failing ACL accepts every protocol, every port, or SSH or RDP from `0.0.0.0/0`.

        ### Audit via CLI

        1. List the network ACLs and review their inbound entries:

        ```bash
        aliyun vpc DescribeNetworkAcls --RegionId <region-id>
        ```

        A passing ACL has no accepting inbound entry from `0.0.0.0/0` covering all protocols, all ports, port 22, or port 3389. A failing ACL has one.
      remediation:
        - id: console
          desc: |
            To narrow a network ACL inbound rule in the console:

            1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
            2. Go to **Access Control** > **Network ACL** and open the ACL.
            3. Edit the inbound rule to name a specific source range and a specific port, or change its policy to **drop**, and save.
        - id: cli
          desc: |
            To replace the inbound entries with a scoped set using the `aliyun` CLI:

            ```bash
            aliyun vpc UpdateNetworkAclEntries --NetworkAclId <acl-id> \
              --UpdateIngressAclEntries true \
              --IngressAclEntries.1.Policy accept \
              --IngressAclEntries.1.Protocol tcp \
              --IngressAclEntries.1.Port 22/22 \
              --IngressAclEntries.1.SourceCidrIp 203.0.113.0/24
            ```
        - id: terraform
          desc: |
            To scope the inbound entries in Terraform, name the source range each entry accepts:

            ```hcl
            resource "alicloud_network_acl" "example" {
              vpc_id           = "vpc-example"
              network_acl_name = "example-acl"

              ingress_acl_entries {
                network_acl_entry_name = "allow-ssh-from-office"
                policy                 = "accept"
                protocol               = "tcp"
                port                   = "22/22"
                source_cidr_ip         = "203.0.113.0/24"
                entry_type             = "custom"
              }
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-alicloud
      - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-terraform-hcl
      - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-terraform-plan
      - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
