  # Terraform variants assert the TLS (ssl_action) portion only; MongoDB audit logging is
  # configured through the separate alicloud_mongodb_audit_policy resource, not an attribute
  # of alicloud_mongodb_instance.
  - uid: mondoo-alibaba-security-mongodb-instance-ssl-and-audit
    title: Ensure MongoDB instances enforce TLS and enable audit logging
    impact: 80
    docs:
      desc: |
        This check verifies that an ApsaraDB for MongoDB instance both encrypts client sessions with TLS and keeps a record of the operations run against it.

        The two controls live side by side in the ApsaraDB for MongoDB console on the Data Security page, one under SSL and the other under Audit Log. From the command line they are two separate calls: `ModifyDBInstanceSSL` with `--SSLAction Open` turns on TLS, and `ModifyAuditPolicy` with `--AuditStatus enable` turns on auditing. In Terraform the TLS half is the `ssl_action` argument set to `Open`, while auditing is declared through a separate `alicloud_mongodb_audit_policy` resource.

        **Why this matters**

        Without TLS, the authentication exchange and every returned document travel the network in plaintext. An observer on the path recovers the credentials first and the data second, and the same position permits tampering with results in flight rather than only reading them.

        Without audit logging there is no record of which queries and administrative commands ran. An attacker who obtains valid credentials then operates invisibly: a bulk read of a collection looks identical to normal traffic, and after the fact there is nothing to distinguish an exfiltration from a routine workload.

        Auditing also supplies attribution. Tying an operation to a source and an account is what makes an investigation possible at all, and it is the evidence compliance regimes expect when they require accountability for access to stored data.

        The two controls answer different questions, which is why the check requires both: TLS decides whether an outsider on the network learns anything, and the audit trail decides whether you can tell what an insider or a credential thief did. The Terraform-declared form asserts only `ssl_action`, because the audit policy is a resource of its own rather than an argument on the instance.
      audit: |
        ### Audit via Console

        1. Sign in to the [ApsaraDB for MongoDB console](https://mongodb.console.aliyun.com/).
        2. Open each instance and confirm **SSL/TLS** is enabled under **Data Security** > **SSL**.
        3. Confirm the **Audit Log** feature is enabled under **Data Security** > **Audit Log**.

        A passing instance shows TLS enabled and audit logging enabled. A failing instance shows either control disabled.

        ### Audit via CLI

        1. Inspect the TLS and audit-log status of each instance with the `aliyun` CLI:

        ```bash
        aliyun dds DescribeDBInstanceSSL --DBInstanceId <instance-id>
        aliyun dds DescribeAuditPolicy --DBInstanceId <instance-id>
        ```

        A passing instance returns `SSLStatus` as `Open` and `AuditStatus` as `enable`. A failing instance returns TLS closed or audit logging disabled.
      remediation:
        - id: console
          desc: |
            To enforce TLS and audit logging on a MongoDB instance in the console:

            1. Sign in to the [ApsaraDB for MongoDB console](https://mongodb.console.aliyun.com/).
            2. Open the instance and enable **SSL/TLS** under **Data Security** > **SSL**.
            3. Enable the **Audit Log** feature under **Data Security** > **Audit Log**.
        - id: cli
          desc: |
            To enable TLS and audit logging with the `aliyun` CLI:

            ```bash
            aliyun dds ModifyDBInstanceSSL --DBInstanceId <instance-id> --SSLAction Open
            aliyun dds ModifyAuditPolicy --DBInstanceId <instance-id> --AuditStatus enable
            ```
        - id: terraform
          desc: |
            To enforce TLS on a MongoDB instance in Terraform, set `ssl_action` to `Open`, and enable audit logging through the `alicloud_mongodb_audit_policy` resource:

            ```hcl
            resource "alicloud_mongodb_instance" "example" {
              engine_version      = "4.4"
              db_instance_class   = "dds.mongo.mid"
              db_instance_storage = 10
              vswitch_id          = alicloud_vswitch.example.id

              ssl_action = "Open"
            }

            resource "alicloud_mongodb_audit_policy" "example" {
              db_instance_id = alicloud_mongodb_instance.example.id
              audit_status   = "enable"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-mongodb-instance-ssl-and-audit-alicloud
      - uid: mondoo-alibaba-security-mongodb-instance-ssl-and-audit-terraform-hcl
