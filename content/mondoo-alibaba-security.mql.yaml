  - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env
    title: Ensure Function Compute environment variables hold no credentials
    impact: 90
    docs:
      desc: |
        This check ensures that no Function Compute function carries a credential in its environment variables. Environment variables are stored and returned as configured, so anything placed there is readable by every principal who can describe the function and is copied into deployment logs, templates, and backups along the way.

        **Why this matters**

        - **Describe permission becomes credential access:** Reading a function's configuration is a low-privilege, rarely-audited action, so a secret there is far more reachable than one in a vault.
        - **Secrets spread with the configuration:** Values appear in CI output, Terraform state, and change history, multiplying the places a leak can happen.
        - **They outlive their purpose:** A credential pasted into an environment variable during development is rarely rotated or removed once the function ships.

        **Risk mitigation**

        - **Keeps secrets in a system built for them:** KMS Secrets Manager provides access control, rotation, and an audit trail that environment variables do not.
        - **Shrinks the blast radius of read access:** A principal who can inspect function configuration no longer gains standing credentials by doing so.
      audit: |
        ### Audit via Console

        1. Sign in to the [Function Compute console](https://fcnext.console.aliyun.com/).
        2. Open each function, select the **Configuration** tab, and open **Advanced Settings**.
        3. In the **Environment Variables** section, review the names and values for access keys, tokens, passwords, and private keys.

        A passing function holds only non-sensitive configuration. A failing function holds a credential, or a reference that resolves to one.

        ### Audit via CLI

        1. Read each function's environment variables:

        ```bash
        aliyun fc GetFunction --functionName <function-name>
        ```

        A passing function returns `environmentVariables` with no credential-like name or value. A failing function returns an access key, token, password, or private key.
      remediation:
        - id: console
          desc: |
            To move a credential out of a function's environment in the console:

            1. Store the value in [KMS Secrets Manager](https://kms.console.aliyun.com/) and grant the function's RAM role permission to read it.
            2. Sign in to the [Function Compute console](https://fcnext.console.aliyun.com/), open the function, select the **Configuration** tab, and select **Modify** next to **Advanced Settings**.
            3. In the **Environment Variables** section replace the credential with the secret name, have the function fetch the value at startup, then rotate the exposed credential.
        - id: cli
          desc: |
            To replace an inline credential with a secret reference using the `aliyun` CLI:

            ```bash
            aliyun kms CreateSecret --SecretName example-db-password \
              --SecretData '<value>' --VersionId v1
            aliyun fc UpdateFunction --functionName <function-name> \
              --body '{"environmentVariables":{"DB_PASSWORD_SECRET":"example-db-password"}}'
            ```
        - id: terraform
          desc: |
            To keep credentials out of the function definition in Terraform, pass the name of a secret rather than its value:

            ```hcl
            resource "alicloud_fcv3_function" "example" {
              function_name   = "example-function"
              runtime         = "python3.10"
              handler         = "index.handler"
              memory_size     = 512
              internet_access = false

              environment_variables = {
                DB_PASSWORD_SECRET = "example-db-password"
              }

              code {
                oss_bucket_name = "example-code-bucket"
                oss_object_name = "example-function.zip"
              }
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env-alicloud
      - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env-terraform-hcl
      - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env-terraform-plan
      - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-5
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
  - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env-alicloud
    filters: asset.platform == "alicloud-fc-function"
    mql: |
      # No null guard, unlike the Terraform variants below. The provider builds this map with
      # map[string]any{} and always assigns it, so a function with no environment variables
      # yields an empty map rather than null, and .keys/.values on an empty map pass
      # vacuously. In HCL an omitted argument genuinely is null, which is why those variants
      # need the == empty guard and this one does not.
      alicloud.fc.function.environmentVariables.keys.none(
        _.downcase == /^access_key_id$|^access_key_secret$|^alicloud_access_key$|^alicloud_secret_key$|^security_token$|^api_token$|^bearer_token$|^db_password$|^private_key$|^password$|^passwd$|^secret$|^access_key$|^client_secret$|^connection_string$/
      )
      alicloud.fc.function.environmentVariables.values.none(
        _.find(/\bLTAI[A-Za-z0-9]{12,}\b/) != empty ||
        _.contains("-----BEGIN") && _.contains("PRIVATE KEY-----") ||
        _.find(/\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b/) != empty
      )
  - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_fcv3_function")
    mql: |
      terraform.resources("alicloud_fcv3_function").all(
        arguments["environment_variables"] == empty ||
        arguments["environment_variables"].keys.none(
          _.downcase == /^access_key_id$|^access_key_secret$|^alicloud_access_key$|^alicloud_secret_key$|^security_token$|^api_token$|^bearer_token$|^db_password$|^private_key$|^password$|^passwd$|^secret$|^access_key$|^client_secret$|^connection_string$/
        ) &&
        arguments["environment_variables"].values.none(
          _.find(/\bLTAI[A-Za-z0-9]{12,}\b/) != empty ||
          _.contains("-----BEGIN") && _.contains("PRIVATE KEY-----") ||
          _.find(/\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b/) != empty
        )
      )
  - uid: mondoo-alibaba-security-fc-function-no-credentials-in-env-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_fcv3_function")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_fcv3_function").all(
        change.after["environment_variables"] == empty ||
        change.after["environment_variables"].keys.none(
          _.downcase == /^access_key_id$|^access_key_secret$|^alicloud_access_key$|^alicloud_secret_key$|^security_token$|^api_token$|^bearer_token$|^db_password$|^private_key$|^password$|^passwd$|^secret$|^access_key$|^client_secret$|^connection_string$/
        ) &&
        change.after["environment_variables"].values.none(
          _.find(/\bLTAI[A-Za-z0-9]{12,}\b/) != empty ||
          _.contains("-----BEGIN") && _.contains("PRIVATE KEY-----") ||
          _.find(/\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b/) != empty
        )
