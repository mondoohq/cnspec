    filters: asset.platform == "alicloud-redis-instance"
    mql: |
      alicloud.redis.instance.authEnabled == true

  - uid: mondoo-alibaba-security-redis-instance-auth-enabled-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_kvstore_instance")
    mql: |
      terraform.resources("alicloud_kvstore_instance").all(
        arguments["vpc_auth_mode"] == empty || arguments["vpc_auth_mode"] == "Open"
      )
  - uid: mondoo-alibaba-security-redis-instance-auth-enabled-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_kvstore_instance")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_kvstore_instance").all(
        change.after["vpc_auth_mode"] == empty || change.after["vpc_auth_mode"] == "Open"
