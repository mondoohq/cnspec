  - uid: mondoo-alibaba-security-ecs-imds-v2-required
    title: Ensure ECS instances require a session token for metadata (IMDSv2)
    impact: 80
    docs:
      desc: |
        This check verifies that reading instance metadata requires a session token, the hardened access mode Alibaba Cloud offers in place of the default token-optional behavior.

        Every ECS instance can reach a link-local metadata endpoint that returns its configuration and, critically, the temporary credentials of its attached instance RAM role. In the default mode a token is optional, so a plain HTTP GET to that endpoint returns those credentials. The hardened mode makes the caller obtain a token in a separate request first. The mode is set per instance in the ECS console under the instance metadata settings, or with `aliyun ecs ModifyInstanceMetadataOptions --HttpEndpoint enabled --HttpTokens required`, where `HttpEndpoint` is mandatory on the call and `enabled` keeps metadata reachable while the token requirement is added.

        **Why this matters**

        Token-optional metadata turns any server-side request forgery flaw into credential theft. An application tricked into fetching an attacker-supplied URL fetches the metadata endpoint instead, and the response body is a working set of RAM role credentials, obtained with no authentication and no code execution on the host.

        Those credentials carry whatever the instance RAM role grants. A defect in one web form therefore inherits the role's reach across the account, which is why this path so often converts a low-severity application bug into a full cloud compromise.

        Requiring a token moves the defense off the application. Server-side request forgery payloads generally cannot perform the separate token request that must precede the read, so the credential path closes at the metadata service whether or not the application flaw is ever found and fixed.

        Instances with the metadata endpoint turned off entirely are already outside this risk and are not evaluated here. Requiring a token complements, and does not replace, keeping the instance RAM role scoped to the permissions the workload actually uses.
      audit: |
        ### Audit via Console

        1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
        2. Open each instance and review its instance metadata access mode under the instance security or metadata settings.

        A passing instance has the metadata endpoint enabled with token access required (the hardened mode). A failing instance has the endpoint enabled while token access is still optional.

        ### Audit via CLI

        1. Inspect the metadata options of each instance:

        ```bash
        aliyun ecs DescribeInstances --output cols=InstanceId,HttpEndpoint,HttpTokens
        ```

        A passing instance returns `HttpEndpoint` enabled with `HttpTokens` set to `required`. A failing instance returns `HttpTokens` set to `optional` while `HttpEndpoint` is enabled.
      remediation:
        - id: console
          desc: |
            To require a metadata token on an ECS instance in the console:

            1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
            2. Open the instance and go to its instance metadata / security settings.
            3. Set the instance metadata access mode to require a token (the hardened mode) and save.
        - id: cli
          desc: |
            To require a metadata token on an instance with the `aliyun` CLI:

            ```bash
            aliyun ecs ModifyInstanceMetadataOptions --InstanceId <instance-id> \
              --HttpEndpoint enabled --HttpTokens required
            ```

            `HttpEndpoint` is mandatory on this call, and passing `enabled` keeps the metadata service reachable while the token requirement is added.
        - id: terraform
          desc: |
            To require a metadata token in Terraform, set `http_tokens` to `required` on the instance:

            ```hcl
            resource "alicloud_instance" "example" {
              instance_name   = "example-instance"
              instance_type   = "ecs.g6.large"
              image_id        = "aliyun_3_x64_20G_alibase_20240819.vhd"
              security_groups = [alicloud_security_group.example.id]
              vswitch_id      = alicloud_vswitch.example.id

              http_endpoint = "enabled"
              http_tokens   = "required"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-ecs-imds-v2-required-alicloud
      - uid: mondoo-alibaba-security-ecs-imds-v2-required-terraform-hcl
      - uid: mondoo-alibaba-security-ecs-imds-v2-required-terraform-plan
      - uid: mondoo-alibaba-security-ecs-imds-v2-required-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-171: false
      compliance/nist-sp-800-53-rev5: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
  - uid: mondoo-alibaba-security-ecs-imds-v2-required-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.ecs.instances.where(metadataEndpointEnabled == true).all(metadataHttpTokens == "required")
  - uid: mondoo-alibaba-security-ecs-imds-v2-required-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_instance")
    mql: |
      # An omitted http_endpoint leaves the metadata service enabled, which is the state this
      # check is about, so only an explicit "disabled" takes an instance out of scope.
      terraform.resources("alicloud_instance").where(arguments["http_endpoint"] != "disabled").all(
        arguments["http_tokens"] == "required"
      )
  - uid: mondoo-alibaba-security-ecs-imds-v2-required-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_instance")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_instance").map(change.after)
        .where(_["http_endpoint"] != "disabled")
        .all(_["http_tokens"] == "required")
  - uid: mondoo-alibaba-security-ecs-imds-v2-required-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_instance")
    mql: |
      terraform.state.resources.where(type == "alicloud_instance").map(values)
        .where(_["http_endpoint"] != "disabled")
        .all(_["http_tokens"] == "required")

  # ===========================================================================
  # ApsaraDB for RDS
  # ===========================================================================
  # No Terraform variants: RDS public access is granted by allocating a public endpoint through the separate alicloud_db_connection resource; alicloud_db_instance exposes no attribute that declares the instance network type (Internet vs Intranet).
  - uid: mondoo-alibaba-security-rds-instance-no-public-network
    title: Ensure RDS instances are not assigned a public network endpoint
    impact: 85
    docs:
      desc: |
        This check verifies that an ApsaraDB for RDS instance is reachable only over the internal network and is never given an Internet-facing connection endpoint.

        An RDS instance can carry a second connection string in addition to its VPC endpoint, and that public endpoint puts the database listener directly on the internet. You manage it in the ApsaraDB for RDS console on the Database Connection page, where the public endpoint can be released, or with the `ReleaseInstancePublicConnection` API action. The check requires the instance to report a network type other than `Internet`.

        **Why this matters**

        A public endpoint places the database listener on the public internet, where it is continuously scanned and probed by opportunistic and targeted attackers. Automated scanners sweep the address space for open database ports and start credential guessing against anything that answers, so exposure is measured in minutes rather than months.

        Internal-only databases sit behind VPC boundaries and security groups. A public endpoint bypasses that layered isolation and leaves the IP allowlist as the only remaining barrier, so one loosened allowlist entry or one leaked credential is enough. A database that is only internally addressable must first be reached from inside the VPC; a publicly addressable one can be reached and drained from anywhere in the world.

        Releasing the public endpoint therefore raises the cost of exploiting the database from harvesting a password to establishing a foothold inside your network.

        Some workloads genuinely need access from outside Alibaba Cloud, such as a partner analytics tool or a one-time migration job. Where a public endpoint cannot be avoided, treat a tightly scoped whitelist and enforced transport encryption as mandatory compensating controls; companion checks in this policy cover both. This check evaluates the endpoint configuration only and asserts nothing about the strength of the credentials behind it.
      audit: |
        ### Audit via Console

        1. Sign in to the [ApsaraDB for RDS console](https://rdsnext.console.aliyun.com/).
        2. Open each instance and navigate to **Database Connection**.
        3. Review the connection endpoints and confirm that only an **Internal Network** (VPC) endpoint is present.

        A passing instance exposes only an internal endpoint. A failing instance shows a **Public** endpoint.

        ### Audit via CLI

        1. Describe each instance and inspect the network connection type:

        ```bash
        aliyun rds DescribeDBInstances
        aliyun rds DescribeDBInstanceNetInfo --DBInstanceId <instance-id>
        ```

        A passing instance reports `DBInstanceNetType` as `Intranet`. A failing instance reports `Internet`.
      remediation:
        - id: console
          desc: |
            To release the public endpoint of an RDS instance in the console:

            1. Sign in to the [ApsaraDB for RDS console](https://rdsnext.console.aliyun.com/).
            2. Open the affected instance and go to **Database Connection**.
            3. Locate the **Public Endpoint** and select **Release Public Endpoint**.
            4. Confirm that applications connect through the internal endpoint only.
        - id: cli
          desc: |
            To release the public connection string of an RDS instance with the `aliyun` CLI:

            ```bash
            aliyun rds ReleaseInstancePublicConnection \
              --DBInstanceId <instance-id> \
              --CurrentConnectionString <public-connection-string>
            ```
        # No Terraform remediation: the public endpoint is created and released through the separate alicloud_db_connection resource and runtime connection APIs; alicloud_db_instance has no attribute that controls the instance network type.
    variants:
      - uid: mondoo-alibaba-security-rds-instance-no-public-network-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: false
  - uid: mondoo-alibaba-security-rds-instance-no-public-network-alicloud
    filters: asset.platform == "alicloud-rds-instance"
    mql: |
      alicloud.rds.instance.dbInstanceNetType != empty
      alicloud.rds.instance.dbInstanceNetType != "Internet"

  - uid: mondoo-alibaba-security-rds-instance-ssl-enabled
    title: Ensure RDS instances enforce SSL/TLS connections
    impact: 75
    docs:
      desc: |
        This check verifies that client connections to an ApsaraDB for RDS instance are encrypted in transit with SSL/TLS.

        ApsaraDB for RDS terminates TLS per connection endpoint and issues a certificate authority certificate that clients install to validate the server. You turn it on in the ApsaraDB for RDS console on the Data Security page under SSL, selecting the endpoint to protect and downloading the CA certificate for clients, or with the `ModifyDBInstanceSSL` API action passing `--SSLEnabled 1`. The check requires SSL to be enabled on the instance.

        **Why this matters**

        An unencrypted database session carries the login handshake, the SQL text, and every returned row in cleartext. Anything able to observe the network path, including a compromised host on a shared segment, a mirrored port, or an intermediate network device, reads the account password and then the data itself.

        Encryption alone is not the whole benefit. Without server certificate validation, an attacker positioned on the path can impersonate the database endpoint, collect the credentials that clients present to it, and relay a modified session to the real instance without either side noticing.

        Many compliance regimes explicitly require that data in transit, and personal or cardholder data in particular, is protected by encryption between the application and the database.

        Because SSL is configured per endpoint, an instance that exposes both an internal and a public connection string needs the setting applied to each one it uses. The check confirms that the server is configured for encrypted connections; it cannot see whether every client connection string actually requests SSL and trusts the CA, so plan the client rollout alongside the server change or connections will continue in cleartext against a TLS-capable server.
      audit: |
        ### Audit via Console

        1. Sign in to the [ApsaraDB for RDS console](https://rdsnext.console.aliyun.com/).
        2. Open each instance and navigate to **Data Security** > **SSL**.
        3. Confirm that **SSL** is enabled and a valid server certificate is present.

        A passing instance shows SSL enabled. A failing instance shows SSL disabled.

        ### Audit via CLI

        1. Describe the SSL configuration of each instance:

        ```bash
        aliyun rds DescribeDBInstanceSSL --DBInstanceId <instance-id>
        ```

        A passing instance reports an enabled SSL connection. A failing instance reports SSL as disabled.
      remediation:
        - id: console
          desc: |
            To enable SSL/TLS on an RDS instance in the console:

            1. Sign in to the [ApsaraDB for RDS console](https://rdsnext.console.aliyun.com/).
            2. Open the affected instance and go to **Data Security** > **SSL**.
            3. Turn on **SSL**, select the endpoint to protect, and download the CA certificate for clients.
            4. Update client connection strings to require SSL and trust the CA certificate.
        - id: cli
          desc: |
            To enable SSL on an RDS instance with the `aliyun` CLI:

            ```bash
            aliyun rds ModifyDBInstanceSSL \
              --DBInstanceId <instance-id> \
              --ConnectionString <connection-string> \
              --SSLEnabled 1
            ```
        # No Terraform remediation: alicloud_db_instance exposes only the imperative ssl_action attribute (Open/Close/Update); SSL is a runtime connection state managed through the RDS SSL APIs rather than a declarative Terraform attribute.
    variants:
      - uid: mondoo-alibaba-security-rds-instance-ssl-enabled-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4
      compliance/soc2-2017: soc2-control-cc6-7-1
      compliance/vda-isa-5: vda-isa-5-5-1-1
  - uid: mondoo-alibaba-security-rds-instance-ssl-enabled-alicloud
    filters: asset.platform == "alicloud-rds-instance"
    mql: |
      alicloud.rds.instance.sslEnabled == true

  - uid: mondoo-alibaba-security-rds-instance-tde-enabled
    title: Ensure RDS instances have Transparent Data Encryption enabled
    impact: 80
    docs:
      desc: |
        This check verifies that an ApsaraDB for RDS instance encrypts its stored data with Transparent Data Encryption (TDE).

        TDE encrypts and decrypts at the storage engine layer, so the relational data files, the redo and binary logs, and the backups derived from them are written as ciphertext while applications keep issuing ordinary SQL. You enable it in the ApsaraDB for RDS console on the Data Security page under TDE, choosing either a Key Management Service key or the service-managed key, or with the `ModifyDBInstanceTDE` API action passing `--TDEStatus Enabled`. In Terraform the equivalent is `tde_status` set to `Enabled` on the database instance.

        **Why this matters**

        Without TDE, every table the engine has written is recoverable from the raw storage. An operator who copies a snapshot, a support process that exports a disk image, or an attacker who gains access to the storage layer beneath the database can read the rows directly without ever authenticating to the instance or leaving a trace in its logs.

        The exposure follows the data outward. Backups and exports inherit whatever protection the instance had, so an unencrypted instance produces unencrypted backup artifacts that are frequently stored and moved with far less scrutiny than the database itself.

        Compliance regimes routinely require stored personal and cardholder data to be encrypted at rest, and the storage-engine placement of TDE satisfies that without a schema change or an application rewrite.

        TDE protects data that has left the database process; it does nothing against an attacker who authenticates successfully, because the engine decrypts transparently for any valid session. Pair it with a scoped IP allowlist and enforced SSL so the encrypted store is not simultaneously an openly reachable one.
      audit: |
        ### Audit via Console

        1. Sign in to the [ApsaraDB for RDS console](https://rdsnext.console.aliyun.com/).
        2. Open each instance and navigate to **Data Security** > **TDE**.
        3. Confirm that **TDE** is enabled.

        A passing instance shows TDE enabled. A failing instance shows TDE disabled.

        ### Audit via CLI

        1. Describe the TDE status of each instance:

        ```bash
        aliyun rds DescribeDBInstanceTDE --DBInstanceId <instance-id>
        ```

        A passing instance reports `TDEStatus` as `Enabled`. A failing instance reports `Disabled`.
      remediation:
        - id: console
          desc: |
            To enable TDE on an RDS instance in the console:

            1. Sign in to the [ApsaraDB for RDS console](https://rdsnext.console.aliyun.com/).
            2. Open the affected instance and go to **Data Security** > **TDE**.
            3. Enable **TDE** and select a KMS key (or the service-managed key) to protect the data.
        - id: cli
          desc: |
            To enable TDE on an RDS instance with the `aliyun` CLI:

            ```bash
            aliyun rds ModifyDBInstanceTDE \
