      compliance/vda-isa-5: false
  - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      # Port containment is encoded as a regex because MQL cannot convert the "first/last"
      # string to numbers. Both halves are verified exhaustively over 0-65535.
      alicloud.vpc.networkAcls.all(
        ingressEntries
          .where(policy.downcase == "accept")
          .where(sourceCidrIp == "0.0.0.0/0")
          .none(
            protocol.downcase == "all" ||
            port == "-1/-1" ||
            protocol.downcase == "tcp" && port == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ ||
            protocol.downcase == "tcp" && port == /^(\d{1,3}|[12]\d{3}|3[0-2]\d{2}|33[0-7]\d|338\d)\/(3389|339\d|3[4-9]\d{2}|[4-9]\d{3}|\d{5})$/
          )
      )
  - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_network_acl")
    mql: |
      terraform.resources("alicloud_network_acl").all(
        blocks.where(type == "ingress_acl_entries")
          .where(arguments["policy"].downcase == "accept")
          .where(arguments["source_cidr_ip"] == "0.0.0.0/0")
          .none(
            arguments["protocol"].downcase == "all" ||
            arguments["port"] == "-1/-1" ||
            arguments["protocol"].downcase == "tcp" && arguments["port"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ ||
            arguments["protocol"].downcase == "tcp" && arguments["port"] == /^(\d{1,3}|[12]\d{3}|3[0-2]\d{2}|33[0-7]\d|338\d)\/(3389|339\d|3[4-9]\d{2}|[4-9]\d{3}|\d{5})$/
          )
      )
  - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_network_acl")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_network_acl").map(change.after).all(
        _["ingress_acl_entries"] == empty ||
        _["ingress_acl_entries"]
          .where(_["policy"].downcase == "accept")
          .where(_["source_cidr_ip"] == "0.0.0.0/0")
          .none(
            _["protocol"].downcase == "all" ||
            _["port"] == "-1/-1" ||
            _["protocol"].downcase == "tcp" && _["port"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ ||
            _["protocol"].downcase == "tcp" && _["port"] == /^(\d{1,3}|[12]\d{3}|3[0-2]\d{2}|33[0-7]\d|338\d)\/(3389|339\d|3[4-9]\d{2}|[4-9]\d{3}|\d{5})$/
          )
      )
  - uid: mondoo-alibaba-security-network-acl-no-unrestricted-ingress-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_network_acl")
    mql: |
      terraform.state.resources.where(type == "alicloud_network_acl").map(values).all(
        _["ingress_acl_entries"] == empty ||
        _["ingress_acl_entries"]
          .where(_["policy"].downcase == "accept")
          .where(_["source_cidr_ip"] == "0.0.0.0/0")
          .none(
            _["protocol"].downcase == "all" ||
            _["port"] == "-1/-1" ||
            _["protocol"].downcase == "tcp" && _["port"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ ||
            _["protocol"].downcase == "tcp" && _["port"] == /^(\d{1,3}|[12]\d{3}|3[0-2]\d{2}|33[0-7]\d|338\d)\/(3389|339\d|3[4-9]\d{2}|[4-9]\d{3}|\d{5})$/
          )
      )

  # ===========================================================================
  # KMS Secrets Manager
  # ===========================================================================
  - uid: mondoo-alibaba-security-kms-secret-rotation-enabled
    title: Ensure KMS secrets have automatic rotation enabled
    impact: 70
    docs:
      desc: |
        This check ensures that every secret held in KMS Secrets Manager rotates automatically. A secret with rotation set to `Disabled` or `Suspended` keeps the same value indefinitely, so the window in which a copy taken from a log, a backup, or a developer's machine still works never closes on its own.

        **Why this matters**

        - **Secrets leak through copies, not the vault:** The value reaches application logs, CI output, and local environments; rotation is what makes those copies stop working.
        - **A static secret has an unbounded compromise window:** Without rotation, an attacker who obtains the value keeps access until somebody notices, which may be never.
        - **Suspended rotation looks configured:** A suspended schedule reads as "rotation is set up" in a console review while nothing actually rotates.

        **Risk mitigation**

        - **Puts an expiry on every leaked copy:** A stolen value stops working at the next rotation whether or not the theft was detected.
        - **Exercises the rotation path:** Regular automatic rotation proves consumers handle a changing value, so an emergency rotation during an incident is not the first attempt.
      audit: |
        ### Audit via Console

        1. Sign in to the [KMS console](https://kms.console.aliyun.com/).
        2. Go to **Resource** > **Secrets** and open each secret.
        3. Review the automatic rotation setting.

        A passing secret has rotation enabled. A failing secret has it disabled or suspended.

        ### Audit via CLI

        1. Describe each secret and review its rotation state:

        ```bash
        aliyun kms DescribeSecret --SecretName <secret-name>
        ```

        A passing secret returns `AutomaticRotation` of `Enabled`. A failing secret returns `Disabled` or `Suspended`.
      remediation:
        - id: console
          desc: |
            To enable automatic rotation in the console:

            1. Sign in to the [KMS console](https://kms.console.aliyun.com/).
            2. Go to **Resource** > **Secrets** and open the secret.
            3. Select **Configure Rotation**, turn on **Automatic Rotation**, set a rotation interval, and confirm.
        - id: cli
          desc: |
            To enable automatic rotation with the `aliyun` CLI:

            ```bash
            aliyun kms UpdateSecretRotationPolicy --SecretName <secret-name> \
              --EnableAutomaticRotation true --RotationInterval 2592000s
            ```
        - id: terraform
          desc: |
            To enable automatic rotation in Terraform, set `enable_automatic_rotation` and a `rotation_interval`:

            ```hcl
            resource "alicloud_kms_secret" "example" {
              secret_name               = "example-secret"
              secret_data               = var.example_secret_value
              version_id                = "v1"
              enable_automatic_rotation = true
              rotation_interval         = "2592000s"
            }
            ```
