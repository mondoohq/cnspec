  # ===========================================================================
  # VPN gateways
  # ===========================================================================
  - uid: mondoo-alibaba-security-vpn-connection-strong-encryption
    title: Ensure VPN connections do not negotiate DES or 3DES
    impact: 80
    docs:
      desc: |
        This check ensures that no IPsec VPN connection negotiates DES or 3DES, for either the IKE key exchange or the IPsec payload. Both are obsolete: single DES has a 56-bit effective key, and 3DES is limited by its 64-bit block size, which makes it vulnerable to birthday attacks on long-lived connections. A site-to-site tunnel is exactly the long-lived, high-volume case where that matters.

        **Why this matters**

        - **The tunnel carries everything between two networks:** A VPN connection typically fronts an entire site or data center, so weak cipher selection exposes all of that traffic at once.
        - **Weak ciphers are chosen by default or by habit:** DES and 3DES survive in configurations copied from older peers and templates long after they stopped being appropriate.
        - **Recorded traffic can be attacked later:** Ciphertext captured today remains attackable, so an obsolete cipher is a retroactive exposure, not just a present one.

        **Risk mitigation**

        - **Puts the tunnel on modern cryptography:** AES with a 128-bit or larger key removes the practical attacks against DES and 3DES.
        - **Protects both negotiation and payload:** Hardening the IKE exchange as well as the IPsec transform closes the weaker of the two halves.
      audit: |
        ### Audit via Console

        1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
        2. Go to **Interconnections** > **VPN** > **IPsec Connections** and open each connection.
        3. Review the encryption algorithm in both the **IKE Configuration** and the **IPsec Configuration**.

        A passing connection uses an AES algorithm in both. A failing connection uses `des` or `3des` in either.

        ### Audit via CLI

        1. Describe the IPsec connections and review both configurations:

        ```bash
        aliyun vpc DescribeVpnConnections --RegionId <region-id>
        ```

        A passing connection returns an AES value for `IkeConfig.IkeEncAlg` and `IpsecConfig.IpsecEncAlg`. A failing connection returns `des` or `3des` for either.
      remediation:
        - id: console
          desc: |
            To move a connection onto AES in the console:

            1. Sign in to the [VPC console](https://vpc.console.aliyun.com/).
            2. Go to **Interconnections** > **VPN** > **IPsec Connections** and edit the connection.
            3. Set the encryption algorithm to `aes256` in both the IKE and IPsec configurations, apply the matching change on the customer gateway, and save.
        - id: cli
          desc: |
            To move a connection onto AES with the `aliyun` CLI:

            ```bash
            aliyun vpc ModifyVpnConnectionAttribute --VpnConnectionId <connection-id> \
              --IkeConfig '{"IkeEncAlg":"aes256"}' --IpsecConfig '{"IpsecEncAlg":"aes256"}'
            ```
        - id: terraform
          desc: |
            To pin the algorithms in Terraform, set them in the `ike_config` and `ipsec_config` blocks:

            ```hcl
            resource "alicloud_vpn_connection" "example" {
              vpn_gateway_id      = "vpn-example"
              customer_gateway_id = "cgw-example"
              local_subnet        = ["10.0.0.0/16"]
              remote_subnet       = ["192.168.0.0/16"]

              ike_config {
                ike_enc_alg = "aes256"
                ike_version = "ikev2"
                ike_pfs     = "group14"
              }

              ipsec_config {
                ipsec_enc_alg = "aes256"
                ipsec_pfs     = "group14"
