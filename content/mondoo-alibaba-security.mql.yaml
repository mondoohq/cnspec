  # No Terraform variants: the alicloud provider exposes no resource for Container Registry
  # scan rules, so which repositories are scanned and on what trigger cannot be declared in
  # Terraform. Revisit if aliyun/alicloud gains an alicloud_cr_ee_scan_rule resource.
  - uid: mondoo-alibaba-security-acr-instance-image-scanning
    title: Ensure Container Registry instances have image scan rules configured
    impact: 70
    docs:
      desc: |
        This check ensures that every Container Registry instance has at least one image scan rule. A scan rule is what makes vulnerability scanning happen on its own: it names the repositories and tag patterns to scan and the trigger that starts a scan. With no rule the registry still offers scanning, but only if somebody remembers to start one by hand, which means images are pushed and deployed unexamined.

        **Why this matters**

        - **Container images accumulate known vulnerabilities:** Base images and system packages age between rebuilds, so an image that was clean at build time is not clean months later.
        - **Manual scanning does not scale:** A registry with dozens of repositories and continuous pushes has no realistic manual path to full coverage.
        - **Scanning on push catches problems before deployment:** Finding a vulnerable layer at push time is far cheaper than finding it running in production.

        **Risk mitigation**

        - **Gives continuous coverage:** Every push matching the rule is examined without human involvement.
        - **Produces an inventory of exposure:** Scan results turn "we might have vulnerable images" into a concrete, prioritizable list.
      audit: |
        ### Audit via Console

        1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
        2. Open the instance and go to **Security and Trust** > **Image Scanning**.
        3. Review the configured scan rules.

        A passing instance has at least one scan rule. A failing instance has none.

        ### Audit via CLI

        1. List the scan rules of the instance:

        ```bash
        aliyun cr ListScanRule --InstanceId <instance-id>
        ```

        A passing instance returns one or more rules. A failing instance returns an empty list.
      remediation:
        - id: console
          desc: |
            To add an image scan rule in the console:

            1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
            2. Open the instance and go to **Security and Trust** > **Image Scanning**.
            3. Create a scan rule, set its scope to the repositories you want covered, and choose the on-push trigger.
        - id: cli
          desc: |
            To create a scan rule that runs on every push with the `aliyun` CLI:

            ```bash
            aliyun cr CreateScanRule --InstanceId <instance-id> \
              --RuleName scan-on-push --ScanType VUL --ScanScope NAMESPACE \
              --Namespaces '["<namespace>"]' --RepoTagFilterPattern '.*' --TriggerType AUTO
            ```
        # No Terraform remediation: the alicloud provider exposes no resource for Container
        # Registry scan rules, so this cannot be declared in Terraform.
    variants:
      - uid: mondoo-alibaba-security-acr-instance-image-scanning-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-07
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-11-2
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ra-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-11
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-5
  - uid: mondoo-alibaba-security-acr-instance-image-scanning-alicloud
    filters: asset.platform == "alicloud-acr-instance"
    mql: |
      alicloud.acr.instance.scanRules != empty

  # ===========================================================================
  # Elasticsearch
  # ===========================================================================
  - uid: mondoo-alibaba-security-es-instance-disk-encrypted
    title: Ensure Elasticsearch cluster data node disks are encrypted at rest
    impact: 80
    docs:
      desc: |
        This check ensures that every Elasticsearch cluster stores its indexed data on encrypted data node disks. Disk encryption is chosen when the cluster is created and cannot be turned on afterwards, so a cluster built without it stays unencrypted for its whole life.

        **Why this matters**

        - **Search clusters concentrate sensitive data:** Indexes are built from logs, documents, and application records, often holding personal data drawn from many systems at once.
        - **Encryption at rest covers the storage layer:** It protects data on the underlying disks and in the snapshots taken from them, where access controls of the search API no longer apply.
        - **The decision is permanent:** Because the setting cannot be changed later, an unencrypted cluster requires a rebuild and reindex to fix.

        **Risk mitigation**

        - **Removes plaintext at rest:** Media, backups, and detached volumes yield ciphertext instead of readable index data.
        - **Supports data-protection obligations:** Encryption at rest is an explicit expectation of most regulatory regimes covering personal data.
      audit: |
        ### Audit via Console

        1. Sign in to the [Elasticsearch console](https://elasticsearch.console.aliyun.com/).
        2. Open each cluster and go to **Basic Information**.
        3. Review the disk encryption setting of the data nodes.

        A passing cluster shows disk encryption enabled. A failing cluster shows it disabled.

        ### Audit via CLI

        1. Describe each cluster and review the data node configuration:

        ```bash
        aliyun elasticsearch DescribeInstance --InstanceId <instance-id>
        ```

        A passing cluster returns `diskEncryption` of `true` on the data node spec. A failing cluster returns `false`.
      remediation:
        - id: console
          desc: |
            Disk encryption cannot be enabled on an existing Elasticsearch cluster. To move to an encrypted cluster in the console:

            1. Sign in to the [Elasticsearch console](https://elasticsearch.console.aliyun.com/).
            2. Create a new cluster and turn on disk encryption for the data nodes.
            3. Reindex or restore a snapshot into the new cluster, cut clients over, and release the old cluster.
        - id: cli
          desc: |
            To create a replacement cluster with encrypted data node disks using the `aliyun` CLI:

            ```bash
            aliyun elasticsearch POST /openapi/instances \
              --body '{"description":"example-cluster","esVersion":"7.10_with_X-Pack","nodeAmount":2,"esAdminPassword":"<admin-password>","paymentType":"postpaid","nodeSpec":{"spec":"elasticsearch.sn2ne.large","disk":20,"diskType":"cloud_ssd","diskEncryption":true},"networkConfig":{"type":"vpc","vpcId":"<vpc-id>","vswitchId":"<vswitch-id>","vsArea":"<zone-id>"}}'
            ```

            `esVersion`, `nodeAmount`, `esAdminPassword`, `nodeSpec.spec`, and `networkConfig` are all mandatory, so the request has to carry them even though `diskEncryption` is the setting being fixed.
        - id: terraform
          desc: |
            To declare an encrypted cluster in Terraform, set `data_node_disk_encrypted` to `true`:

            ```hcl
            resource "alicloud_elasticsearch_instance" "example" {
              instance_charge_type     = "PostPaid"
              data_node_amount         = 2
              data_node_spec           = "elasticsearch.sn2ne.large"
              data_node_disk_size      = 20
              data_node_disk_type      = "cloud_ssd"
              data_node_disk_encrypted = true
              version                  = "7.10_with_X-Pack"
              vswitch_id               = "vsw-example"
              password                 = var.elasticsearch_password
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-es-instance-disk-encrypted-alicloud
      - uid: mondoo-alibaba-security-es-instance-disk-encrypted-terraform-hcl
      - uid: mondoo-alibaba-security-es-instance-disk-encrypted-terraform-plan
      - uid: mondoo-alibaba-security-es-instance-disk-encrypted-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
  - uid: mondoo-alibaba-security-es-instance-disk-encrypted-alicloud
    filters: asset.platform == "alicloud-elasticsearch-instance"
    mql: |
      alicloud.es.instance.diskEncrypted == true
  - uid: mondoo-alibaba-security-es-instance-disk-encrypted-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_elasticsearch_instance")
    mql: |
      terraform.resources("alicloud_elasticsearch_instance").all(
        arguments["data_node_disk_encrypted"] == true
      )
  - uid: mondoo-alibaba-security-es-instance-disk-encrypted-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_elasticsearch_instance")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_elasticsearch_instance").all(
        change.after["data_node_disk_encrypted"] == true
      )
  - uid: mondoo-alibaba-security-es-instance-disk-encrypted-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_elasticsearch_instance")
    mql: |
