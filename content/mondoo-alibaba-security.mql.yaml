  - uid: mondoo-alibaba-security-polardb-cluster-restrict-access-whitelist
    title: Ensure PolarDB cluster allowlists are not open to the internet
    impact: 85
    docs:
      desc: |
        This check ensures that no ApsaraDB for PolarDB cluster has an access allowlist entry of `0.0.0.0/0`, which would permit connections from any source address on the internet. A world-open allowlist removes the network barrier in front of the cluster and leaves only credentials protecting it.

        **Why this matters**

        - **World-open access:** An allowlist entry of `0.0.0.0/0` accepts connection attempts from every IP address, exposing the cluster to internet-wide scanning and brute-force attempts.
        - **Single line of defense:** With the network barrier removed, only the database password stands between an attacker and the data.
        - **Common breach vector:** Clusters reachable from anywhere are routinely discovered and compromised through weak or leaked credentials.

        **Risk mitigation**

        - **Restores network segmentation:** Limiting the allowlist to specific trusted addresses forces connections through known, controlled sources.
        - **Reduces exposure:** A tightly scoped allowlist keeps the cluster off the open internet even if a credential is compromised.
      audit: |
        ### Audit via Console

        1. Sign in to the [ApsaraDB for PolarDB console](https://polardb.console.aliyun.com/).
        2. Open each cluster and navigate to **Settings and Management** > **Whitelists**.
        3. Review every whitelist group and confirm that no group contains `0.0.0.0/0`.

        A passing cluster restricts the allowlist to specific addresses. A failing cluster lists `0.0.0.0/0`.

        ### Audit via CLI

        1. Describe the access allowlist of each cluster:

        ```bash
        aliyun polardb DescribeDBClusterAccessWhitelist --DBClusterId <cluster-id>
        ```

        A passing cluster lists only specific addresses. A failing cluster includes `0.0.0.0/0` in a security IP list.
      remediation:
        - id: console
          desc: |
            To restrict a PolarDB cluster allowlist in the console:

            1. Sign in to the [ApsaraDB for PolarDB console](https://polardb.console.aliyun.com/).
            2. Open the affected cluster and go to **Settings and Management** > **Whitelists**.
            3. Edit each whitelist group, remove `0.0.0.0/0`, and add only the specific IP addresses or CIDR ranges that require access.
        - id: cli
          desc: |
            To replace an open allowlist with specific addresses using the `aliyun` CLI:

            ```bash
            aliyun polardb ModifyDBClusterAccessWhitelist \
              --DBClusterId <cluster-id> \
              --WhiteListType IP \
              --DBClusterIPArrayName default \
              --SecurityIps <comma-separated-trusted-cidrs>
            ```
        - id: terraform
          desc: |
            To scope the PolarDB allowlist in Terraform, set the `security_ips` of each `db_cluster_ip_array` block to specific trusted ranges instead of `0.0.0.0/0`:

            ```hcl
            resource "alicloud_polardb_cluster" "example" {
              db_type       = "MySQL"
              db_version    = "8.0"
              db_node_class = "polar.mysql.x4.large"
              pay_type      = "PostPaid"
              vswitch_id    = alicloud_vswitch.example.id

              db_cluster_ip_array {
                db_cluster_ip_array_name = "default"
                security_ips             = ["10.0.0.0/24", "10.0.1.0/24"]
              }
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-polardb-cluster-restrict-access-whitelist-alicloud
      - uid: mondoo-alibaba-security-polardb-cluster-restrict-access-whitelist-terraform-hcl
      - uid: mondoo-alibaba-security-polardb-cluster-restrict-access-whitelist-terraform-plan
      - uid: mondoo-alibaba-security-polardb-cluster-restrict-access-whitelist-terraform-state
    tags:
