  - uid: mondoo-alibaba-security-es-instance-public-whitelist-restricted
    title: Ensure Elasticsearch public allowlists are not open to the internet
    impact: 85
    docs:
      desc: |
        This check ensures that no Elasticsearch cluster with a public endpoint allows every source address. When the public network is switched on, the public IP allowlist is the whole of the access control at the network layer, and an entry of `0.0.0.0/0` removes it, leaving the cluster credentials as the only barrier between the index and the internet.

        **Why this matters**

        - **A wide-open allowlist is the same as no allowlist:** Every host on the internet can open a connection and begin authenticating.
        - **Credential attacks become continuous:** With the endpoint reachable from anywhere, brute-force and credential-stuffing traffic never stops.
        - **It is often a leftover:** `0.0.0.0/0` is added during a migration or a debugging session and rarely removed once the work is finished.

        **Risk mitigation**

        - **Restores a network barrier:** Only named ranges can reach the endpoint at all, so authentication is a second layer rather than the only one.
        - **Shrinks the reachable surface:** Scanning and exploitation traffic from unrelated networks never arrives.
      audit: |
        ### Audit via Console

        1. Sign in to the [Elasticsearch console](https://elasticsearch.console.aliyun.com/).
        2. Open each cluster with a public endpoint and go to **Configuration and Management** > **Security**, then review the **Public IP Address Whitelist** section.
        3. Review the entries.

        A passing cluster lists only specific ranges, or has no public endpoint at all. A failing cluster lists `0.0.0.0/0`.

        ### Audit via CLI

        1. Describe each cluster and review the public allowlist:

        ```bash
        aliyun elasticsearch DescribeInstance --InstanceId <instance-id>
        ```

        A passing cluster returns a `publicIpWhitelist` without `0.0.0.0/0`. A failing cluster includes it.
      remediation:
        - id: console
          desc: |
            To narrow the public allowlist in the console:

            1. Sign in to the [Elasticsearch console](https://elasticsearch.console.aliyun.com/).
            2. Open the cluster, go to **Configuration and Management** > **Security**, and select **Modify** next to **Public IP Address Whitelist**.
            3. Replace `0.0.0.0/0` with the specific ranges that need access, and save.
        - id: cli
          desc: |
            To replace the public allowlist with specific ranges using the `aliyun` CLI:

            ```bash
            aliyun elasticsearch UpdatePublicWhiteIps --InstanceId <instance-id> \
              --body '{"publicIpWhitelist":["203.0.113.0/24"]}'
            ```
        - id: terraform
          desc: |
            To scope the public allowlist in Terraform, list only the ranges that need access:

            ```hcl
            resource "alicloud_elasticsearch_instance" "example" {
              instance_charge_type = "PostPaid"
              data_node_amount     = 2
              data_node_spec       = "elasticsearch.sn2ne.large"
              data_node_disk_size  = 20
              data_node_disk_type  = "cloud_ssd"
              version              = "7.10_with_X-Pack"
              vswitch_id           = "vsw-example"
              password             = var.elasticsearch_password
              enable_public        = true
              public_whitelist     = ["203.0.113.0/24"]
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-es-instance-public-whitelist-restricted-alicloud
      - uid: mondoo-alibaba-security-es-instance-public-whitelist-restricted-terraform-hcl
      - uid: mondoo-alibaba-security-es-instance-public-whitelist-restricted-terraform-plan
      - uid: mondoo-alibaba-security-es-instance-public-whitelist-restricted-terraform-state
    tags:
