  - uid: mondoo-alibaba-security-acr-repository-tag-immutability
    title: Ensure Container Registry repositories have tag immutability enabled
    impact: 70
    docs:
      desc: |
        This check verifies that every Container Registry repository refuses to overwrite an existing tag.

        Tag immutability binds a tag to the content it first pointed at. Without it a tag is a movable pointer, so `app:1.4.2` can be repointed at different content after it was reviewed, signed off, and deployed, and every later pull of that tag silently gets the new image. Immutability is turned on in the Container Registry console under **Repository** > **Repositories** by editing the repository and selecting **Immutable**, through `aliyun cr UpdateRepository` with `--TagImmutability true`, or in Terraform through `tag_immutability`. This check requires it on every repository.

        **Why this matters**

        The reviewed artifact stops being the deployed artifact. Scanning, signing, and approval all attach to content that a later push can replace under the same name, so the assurance gathered before release describes an image that is no longer the one being pulled.

        Rollback becomes unreliable. Redeploying a known-good tag no longer reproduces the known-good image, so incident recovery can reintroduce the very problem it was meant to undo.

        A movable tag is a quiet supply-chain foothold. Anyone with push access can change what production runs without touching any deployment manifest. With immutability in place, shipping different content requires a new tag, which shows up in the deployment diff and in change review.

        The `aliyun cr UpdateRepository` call rewrites the repository type and summary alongside the immutability flag, so pass the current values for both or an unrelated setting will be reset as a side effect. An instance that holds no repositories passes.
      audit: |
        ### Audit via Console

        1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
        2. Open the instance, go to **Repository** > **Repositories**, and select **Manage** on a repository.
        3. On the **Details** page, review whether the repository is marked **Immutable**.

        A passing repository has tag immutability enabled. A failing repository has it disabled.

        ### Audit via CLI

        1. Read the repository configuration and review the immutability flag:

        ```bash
        aliyun cr GetRepository --InstanceId <instance-id> --RepoId <repo-id>
        ```

        A passing repository returns `TagImmutability` of `true`. A failing repository returns `false`.
      remediation:
        - id: console
          desc: |
            To enable tag immutability in the console:

            1. Sign in to the [Container Registry console](https://cr.console.aliyun.com/).
            2. Open the instance, go to **Repository** > **Repositories**, and select **Manage** on the repository.
            3. On the **Details** page select **Edit**, select **Immutable** in the **Modify Settings** dialog, and confirm.
        - id: cli
          desc: |
            To enable tag immutability with the `aliyun` CLI, pass the repository type and summary alongside the immutability flag, since the call rewrites all of them:

            ```bash
            aliyun cr UpdateRepository --InstanceId <instance-id> \
              --RepoId <repo-id> --TagImmutability true \
              --RepoType PRIVATE --Summary <repository-summary>
            ```
        - id: terraform
          desc: |
            To enable tag immutability in Terraform, set `tag_immutability` to `true`:

            ```hcl
            resource "alicloud_cr_ee_repo" "example" {
              instance_id      = "cri-example"
              namespace        = "example-namespace"
              name             = "example-repo"
              summary          = "example repository"
              repo_type        = "PRIVATE"
              tag_immutability = true
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-alicloud
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-hcl
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-plan
      - uid: mondoo-alibaba-security-acr-repository-tag-immutability-terraform-state
