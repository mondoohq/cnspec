    mql: |
      terraform.state.resources.where(type == "alicloud_security_group_rule").map(values).where(_["type"] == "ingress").where(_["ipv6_cidr_ip"] == "::/0").where(_["policy"] == empty || _["policy"].downcase == "accept").none(_["ip_protocol"].downcase == "all" || _["ip_protocol"].downcase == "tcp" && _["port_range"] == /^(\d|1\d|2[0-2])\/(2[2-9]|[3-9]\d|\d{3,5})$/ || _["ip_protocol"].downcase == "tcp" && _["port_range"] == /^(\d{1,3}|[12]\d{3}|3[0-2]\d{2}|33[0-7]\d|338\d)\/(3389|339\d|3[4-9]\d{2}|[4-9]\d{3}|\d{5})$/ || _["ip_protocol"].downcase == "tcp" && _["port_range"] == "-1/-1")

  # ---------------------------------------------------------------------------
  # Instances
  # ---------------------------------------------------------------------------
  # No Terraform variants: internetExposed is a computed inbound-reachability signal derived from public IP, EIP, and effective security-group rules; no single alicloud_instance attribute reproduces it, so a static variant would misrepresent the check.
  - uid: mondoo-alibaba-security-ecs-instance-no-public-ip
    title: Ensure ECS instances are not directly exposed to the internet
    impact: 70
    docs:
      desc: |
        This check verifies that ECS instances are not directly reachable from the internet, meaning they carry no public or elastic IP that permissive security-group rules leave open.

        Direct exposure is the combination of two things: a routable address on the instance, either an assigned public IP or a bound elastic IP, and security-group rules that let outside traffic reach it. Both are managed in the ECS console, where an elastic IP is unbound from the instance and the attached security groups are tightened. Workloads that must serve external traffic belong behind a load balancer or a NAT gateway instead, so the address that faces the internet is not the host itself.

        **Why this matters**

        A publicly addressed instance is discovered and probed continuously, and every service it runs is evaluated by whoever finds it. The host operating system, not a managed edge, becomes the thing that has to survive that traffic.

        Fronting the workload with a load balancer or gateway reintroduces a layer where filtering, rate limiting, TLS termination, and request logging happen before anything reaches the instance. A directly exposed host has none of that, and an attack against it leaves evidence only in whatever the host itself records.

        The consequence of compromise is also worse. An internet-facing instance still sits inside the private network, so a successful intrusion starts from a position with routes to internal subnets and internal services, turning an external hit into a foothold for lateral movement.

        Some designs legitimately require a public address, such as a NAT instance or a bastion. Where that is true, the exposure should be one narrow, deliberately scoped path rather than a general-purpose host, and the security-group checks in this policy remain the control that keeps administrative ports closed.
      audit: |
        ### Audit via Console

        1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
        2. Open each instance and review its **Public IP** / **Elastic IP** and attached security groups.

        A passing instance has no public reachability. A failing instance has a public or elastic IP reachable via permissive security-group rules.

        ### Audit via CLI

        1. List instances and inspect public addresses:

        ```bash
        aliyun ecs DescribeInstances --output cols=InstanceId,PublicIpAddress,EipAddress
        ```

        A passing instance returns no public or elastic IP. A failing instance returns one.
      remediation:
        - id: console
          desc: |
            To remove direct internet exposure in the ECS console:

            1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
            2. Unbind the elastic IP from the instance, or release its public IP, and place the instance behind a load balancer or NAT gateway.
            3. Tighten the attached security groups so no administrative ports are open to `0.0.0.0/0`.
        - id: cli
          desc: |
            To unbind an elastic IP from an instance with the `aliyun` CLI:

            ```bash
            aliyun vpc UnassociateEipAddress --AllocationId <eip-alloc-id> \
              --InstanceId <instance-id> --InstanceType EcsInstance
            ```
        # No Terraform remediation: removing computed inbound reachability spans elastic IP association, public IP assignment, and security-group rules across multiple resources rather than one alicloud_instance attribute.
    variants:
      - uid: mondoo-alibaba-security-ecs-instance-no-public-ip-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: false
