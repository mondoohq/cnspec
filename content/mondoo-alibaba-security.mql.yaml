  # ===========================================================================
  # Apsara File Storage NAS
  # ===========================================================================
  - uid: mondoo-alibaba-security-nas-file-system-encrypted
    title: Ensure NAS file systems are encrypted at rest
    impact: 80
    docs:
      desc: |
        This check verifies that encryption at rest is in force on every Apsara File Storage NAS file system.

        NAS encrypts data on the underlying media and in snapshots when the file system is created, and that choice is fixed at that moment. There is no console switch to turn it on later, so an unencrypted file system stays unencrypted until its contents are copied to a new one. New file systems select it in the **File System List** area of the NAS console, or through `EncryptType` on `aliyun nas CreateFileSystem`.

        **Why this matters**

        A shared file system accumulates everything. It is written to by many hosts over a long life, so its contents end up broader and older than any single application's data, and whoever eventually reads that media has no way to know which generation of the business it belongs to.

        Encryption at rest covers the layer where the other controls stop. POSIX permissions and mount targets govern live access through the NFS path; they say nothing about the physical storage or about a snapshot restored somewhere else. Encryption is what keeps those artifacts as ciphertext rather than readable files, and it is an explicit expectation of most regimes covering personal or regulated data.

        The permanence is what makes this worth catching early. Remediating an existing file system means creating an encrypted replacement, copying the contents across, repointing every mount target, and deleting the original, which is a maintenance window rather than a setting change. Catching it at declaration time, before any data lands, costs nothing.
      audit: |
        ### Audit via Console

        1. Sign in to the [NAS console](https://nas.console.aliyun.com/).
        2. Go to **File System List** and open each file system.
        3. Review the encryption setting.

        A passing file system shows encryption enabled. A failing file system shows it disabled.

        ### Audit via CLI

        1. Describe the file systems and review the encryption type:

        ```bash
        aliyun nas DescribeFileSystems
        ```

        A passing file system returns an `EncryptType` other than `0`. A failing file system returns `0`.
      remediation:
        - id: console
          desc: |
            Encryption cannot be enabled on an existing NAS file system. To move to an encrypted file system in the console:

            1. Sign in to the [NAS console](https://nas.console.aliyun.com/).
            2. Create a new file system with encryption enabled.
            3. Copy the contents across, repoint the mount targets, and delete the old file system.
        - id: cli
          desc: |
            To create an encrypted replacement file system with the `aliyun` CLI:

            ```bash
            aliyun nas CreateFileSystem --FileSystemType standard \
              --ProtocolType NFS --StorageType Performance \
              --ZoneId <zone-id> --EncryptType 1
            ```
        - id: terraform
          desc: |
            To declare an encrypted file system in Terraform, set `encrypt_type` to a non-zero value:

            ```hcl
            resource "alicloud_nas_file_system" "example" {
              protocol_type = "NFS"
              storage_type  = "Performance"
              zone_id       = "cn-hangzhou-b"
              encrypt_type  = 1
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-nas-file-system-encrypted-alicloud
      - uid: mondoo-alibaba-security-nas-file-system-encrypted-terraform-hcl
      - uid: mondoo-alibaba-security-nas-file-system-encrypted-terraform-plan
      - uid: mondoo-alibaba-security-nas-file-system-encrypted-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
  - uid: mondoo-alibaba-security-nas-file-system-encrypted-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.nas.fileSystems.all(encrypted == true)
  - uid: mondoo-alibaba-security-nas-file-system-encrypted-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "alicloud_nas_file_system")
    mql: |
      terraform.resources("alicloud_nas_file_system").all(
        arguments["encrypt_type"] != empty && arguments["encrypt_type"] > 0
      )
  - uid: mondoo-alibaba-security-nas-file-system-encrypted-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "alicloud_nas_file_system")
    mql: |
      terraform.plan.resourceChanges.where(type == "alicloud_nas_file_system").map(change.after).all(
        _["encrypt_type"] != empty && _["encrypt_type"] > 0
      )
  - uid: mondoo-alibaba-security-nas-file-system-encrypted-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == "alicloud_nas_file_system")
    mql: |
      terraform.state.resources.where(type == "alicloud_nas_file_system").map(values).all(
        _["encrypt_type"] != empty && _["encrypt_type"] > 0
      )

  # No Terraform variants: publishing a custom image is an imperative call to
  # ModifyImageSharePermission rather than an attribute of alicloud_image, and
  # alicloud_image_share_permission only shares with a named account, not the world.
  - uid: mondoo-alibaba-security-ecs-image-not-public
    title: Ensure custom ECS images are not shared publicly
    impact: 85
    docs:
      desc: |
        This check verifies that custom images owned by the account are shared deliberately rather than published to every Alibaba Cloud user.

        A custom image is a full copy of a disk, and publishing it as a community image makes it launchable by anyone in any account. Whoever launches it can then read everything the image contains. Publication status is reviewed in the ECS console under **Instances & Images** > **Images** on the **Custom Images** tab, and it is reversed with `aliyun ecs ModifyImageSharePermission --IsPublic false`. Only images the account itself owns are evaluated; marketplace and vendor images are out of scope.

        **Why this matters**

        Golden images capture whatever happened to be on the disk when they were taken. In practice that routinely includes configuration files, deployment keys, agent credentials, and application source that were never intended to leave the account, none of which is obvious from the image name.

        Publishing is a one-way door in practice. Once an image has been public, copies may already exist in other accounts, and un-publishing does not recall them; anything sensitive the image carried has to be treated as exposed and rotated.

        It is also easy to do without noticing. Sharing is a separate call from image creation, so an image made public during a migration or a partner hand-off is rarely revisited, and nothing about day-to-day use of the image signals that it is world-readable.

        Where an image genuinely needs to reach another team or partner, share it with named account IDs instead. That keeps the disk contents inside a known boundary and leaves a record of who was granted access and when, which blanket publication does not.
      audit: |
        ### Audit via Console

        1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
        2. Go to **Instances & Images** > **Images** and open the **Custom Images** tab.
        3. Review whether each image is published as a community image.

        A passing image is not public. A failing image is published to all users.

        ### Audit via CLI

        1. List the account's own images and review whether each is public:

        ```bash
        aliyun ecs DescribeImages --RegionId <region-id> --ImageOwnerAlias self
        ```

        A passing image returns `IsPublic` of `false`. A failing image returns `true`.
      remediation:
        - id: console
          desc: |
            To un-publish a custom image in the console:

            1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
            2. Go to **Instances & Images** > **Images** and open the **Custom Images** tab.
            3. Find the published community image and unpublish it, then treat any credential the image contains as exposed and rotate it.
        - id: cli
          desc: |
            To un-publish a custom image with the `aliyun` CLI:

            ```bash
            aliyun ecs ModifyImageSharePermission --RegionId <region-id> \
              --ImageId <image-id> --IsPublic false
            ```
        # No Terraform remediation: publishing an image is an imperative call to
        # ModifyImageSharePermission, and alicloud_image exposes no attribute for it.
    variants:
      - uid: mondoo-alibaba-security-ecs-image-not-public-alicloud
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-ai-100-1: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-22
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-22
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7
      compliance/soc2-2017: soc2-control-cc6-1-7
      compliance/vda-isa-5: vda-isa-5-4-1-2
  - uid: mondoo-alibaba-security-ecs-image-not-public-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      alicloud.ecs.images.where(imageOwnerAlias == "self").all(isPublic == false)

  # ===========================================================================
  # Cloud Firewall control policies
  # ===========================================================================
  - uid: mondoo-alibaba-security-cloudfirewall-no-unrestricted-accept
    title: Ensure Cloud Firewall has no rule accepting all inbound traffic
    impact: 85
    docs:
      desc: |
        This check verifies that the account's internet-edge filter actually filters, failing any enabled inbound Cloud Firewall policy that accepts every protocol from every source to every destination.

        Cloud Firewall control policies are the allow and deny list applied to traffic crossing the account boundary. A policy whose direction is inbound, whose action is `accept`, whose protocol is `ANY`, and whose source and destination are both `0.0.0.0/0` permits everything the edge sees. Inbound policies live under **Prevention Configuration** > **Access Control** > **Policy Configuration** > **Internet Border** in the Cloud Firewall console, and `aliyun cloudfw ModifyControlPolicy` narrows one from the command line.

        **Why this matters**

        Such a rule negates the control it belongs to. The account pays for a boundary firewall, enables it, then instructs it to permit everything, which leaves the cost in place and the protection absent, and every downstream security group and network ACL on its own.

        It is also close to invisible in downstream reviews. An auditor examining security groups finds a carefully scoped configuration and sees nothing to suggest the edge in front of them was told to wave traffic through, so the finding never surfaces where people are actually looking.

        Accept-any rules arrive as temporary fixes. They are the fastest way to unblock a deployment that will not come up, they are typically added under time pressure by someone chasing a connectivity problem, and they are among the least likely changes to be undone once the immediate problem goes away.

        A scoped policy naming a protocol, destination port, and source range restores the edge as a real boundary and makes every permitted flow a named rule that can be reviewed and expired. A policy must name either a single application or an application list, so `ApplicationName` is mandatory when narrowing a rule through the API.
      audit: |
        ### Audit via Console

        1. Sign in to the [Cloud Firewall console](https://yundun.console.aliyun.com/?p=cfwnext).
        2. Go to **Prevention Configuration** > **Access Control** > **Policy Configuration** > **Internet Border** and open the **Inbound** tab.
        3. Look for an enabled rule whose action is **Accept** with `0.0.0.0/0` as both source and destination and a protocol of **ANY**.

        A passing account has no such rule. A failing account has at least one.

        ### Audit via CLI

        1. List the inbound control policies:

        ```bash
        aliyun cloudfw DescribeControlPolicy --Direction in --CurrentPage 1 --PageSize 50
        ```

        A passing account returns no enabled policy with `AclAction` of `accept`, `Proto` of `ANY`, and `0.0.0.0/0` for both `Source` and `Destination`. A failing account returns one.
      remediation:
        - id: console
          desc: |
            To narrow an accept-any rule in the console:

            1. Sign in to the [Cloud Firewall console](https://yundun.console.aliyun.com/?p=cfwnext).
            2. Go to **Prevention Configuration** > **Access Control** > **Policy Configuration** > **Internet Border**, open the **Inbound** tab, and edit the rule.
            3. Name the specific protocol, destination port, and source range the flow needs, or change the action to **Drop**, and save.
        - id: cli
          desc: |
            To narrow an accept-any rule with the `aliyun` CLI:

            ```bash
            aliyun cloudfw ModifyControlPolicy --AclUuid <acl-uuid> --Direction in \
              --AclAction accept --Proto TCP --ApplicationName HTTPS \
              --DestPort 443/443 --DestPortType port \
              --Source 203.0.113.0/24 --SourceType net \
              --Destination 10.0.0.0/16 --DestinationType net
            ```

            `ApplicationName` is mandatory on this call, since a policy must name either a single application or an application list.
        - id: terraform
          desc: |
            To declare a scoped inbound rule in Terraform, name the protocol, port, and source:

            ```hcl
            resource "alicloud_cloud_firewall_control_policy" "example" {
              direction        = "in"
              acl_action       = "accept"
              proto            = "TCP"
              dest_port        = "443/443"
              dest_port_type   = "port"
              source           = "203.0.113.0/24"
              source_type      = "net"
              destination      = "10.0.0.0/16"
              destination_type = "net"
              application_name = "HTTPS"
              description      = "partner API callers"
            }
            ```
