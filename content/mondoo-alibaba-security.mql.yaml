  # ===========================================================================
  # Function Compute
  # ===========================================================================
  - uid: mondoo-alibaba-security-fc-function-no-internet-access
    title: Ensure Function Compute functions have no public internet egress
    impact: 70
    docs:
      desc: |
        This check ensures that no Function Compute function is allowed to reach the public internet for outbound requests. Internet access is on by default, so a function that only ever talks to services inside its VPC still carries an open egress path it never uses.

        **Why this matters**

        - **Egress is the exfiltration path:** Code that can reach the internet can send whatever it can read to an arbitrary destination, which is what a compromised dependency does first.
        - **Function code changes faster than review:** A function is redeployed on every release, so an egress path granted once persists through every later change to the code.
        - **Least functionality applies to network reach:** A function that talks only to a database and a queue has no business initiating arbitrary outbound connections.

        **Risk mitigation**

        - **Removes the unattended outbound path:** Data cannot leave through the function even if the code is subverted.
        - **Forces deliberate connectivity:** Reaching an external service requires a NAT gateway or endpoint that is declared, reviewed, and visible.
      audit: |
        ### Audit via Console

        1. Sign in to the [Function Compute console](https://fcnext.console.aliyun.com/).
        2. Open each function, select the **Configuration** tab, and open **Advanced Settings**.
        3. In the **Network** section, review **Allow Default ENI to Access the Internet**.

        A passing function has internet access disabled. A failing function has it enabled.

        ### Audit via CLI

        1. Read each function's configuration:

        ```bash
        aliyun fc GetFunction --functionName <function-name>
        ```

        A passing function returns `internetAccess` of `false`. A failing function returns `true`.
      remediation:
        - id: console
          desc: |
            To turn off internet egress in the console:

            1. Sign in to the [Function Compute console](https://fcnext.console.aliyun.com/).
            2. Open the function, select the **Configuration** tab, and select **Modify** next to **Advanced Settings**.
            3. In the **Network** section set **Allow Default ENI to Access the Internet** to disabled, then deploy the change.
        - id: cli
          desc: |
            To turn off internet egress with the `aliyun` CLI:

            ```bash
            aliyun fc UpdateFunction --functionName <function-name> \
              --body '{"internetAccess":false}'
            ```
        - id: terraform
          desc: |
            To turn off internet egress in Terraform, set `internet_access` to `false`:

            ```hcl
            resource "alicloud_fcv3_function" "example" {
              function_name   = "example-function"
              runtime         = "python3.10"
              handler         = "index.handler"
              memory_size     = 512
              internet_access = false

              code {
                oss_bucket_name = "example-code-bucket"
                oss_object_name = "example-function.zip"
              }
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-fc-function-no-internet-access-alicloud
      - uid: mondoo-alibaba-security-fc-function-no-internet-access-terraform-hcl
