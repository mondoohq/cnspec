  - uid: mondoo-alibaba-security-kms-key-rotation-interval-alicloud
    filters: asset.platform == "alicloud-account"
    mql: |
      # rotationInterval is a duration string ("31536000s"), and MQL cannot convert a string to
      # a number, so the "<= 365 days" bound is encoded as a regex over the digits. Verified
      # exhaustively: it matches exactly the values 0s through 31536000s.
      alicloud.kms.keys.where(automaticRotation == "Enabled").all(
        rotationInterval == /^(\d{1,7}|[12]\d{7}|30\d{6}|31[0-4]\d{5}|315[0-2]\d{4}|3153[0-5]\d{3}|31536000)s$/
      )

  # ===========================================================================
  # ActionTrail
  # ===========================================================================
  - uid: mondoo-alibaba-security-actiontrail-trail-enabled
    title: Ensure an ActionTrail trail is logging all read and write events
    impact: 90
    docs:
      desc: |
        This check verifies that the account has at least one ActionTrail trail that is enabled, actively delivering logs, and capturing both read and write events with an `EventRW` value of `All`.

        ActionTrail records management events across services, so an account with no trail, a trail that has been stopped, or a trail scoped to a single event direction leaves administrative and API activity unrecorded. Trails are created in the ActionTrail console under Trails, or with `aliyun actiontrail CreateTrail --EventRW All` followed by `aliyun actiontrail StartLogging`. Delivery targets an Object Storage Service bucket, a Simple Log Service project, or both.

        **Why this matters**

        Audit logging is the record of who did what. ActionTrail captures console and API operations across services, and without it there is no authoritative account of resource changes, sign-ins, or configuration edits, so no action can be attributed to an identity after the fact.

        Read events matter as much as write events. A trail limited to writes records the change but not the reconnaissance that preceded it, so enumeration and data-access activity, which is where an intrusion usually starts, goes entirely unrecorded.

        Detection depends on the log existing. Threat detection, alerting, and post-incident forensics all rely on a continuous event record, and a stopped or missing trail creates a blind spot an attacker can operate inside without ever being observed. Continuous delivery to Object Storage Service or Simple Log Service is what feeds the monitoring that catches suspicious activity while it is still in progress.

        Regulatory regimes expect account activity to be logged and retained, and an unenabled trail fails that expectation outright. This check confirms that a qualifying trail exists and is running; it does not evaluate the retention, access controls, or integrity protections applied to the destination bucket or project, which need their own review.
      audit: |
        ### Audit via Console

        1. Sign in to the [ActionTrail console](https://actiontrail.console.aliyun.com/).
        2. Navigate to **Trails**.
        3. Confirm that at least one trail exists, its status is **Enabled**, it is actively delivering logs, and its **Event Type** is **All**.

        A passing account has an enabled trail that is logging all event types. A failing account has no trail, has only disabled or stopped trails, or logs only read or only write events.

        ### Audit via CLI

        1. List trails and review each trail's status:

        ```bash
        aliyun actiontrail DescribeTrails
        aliyun actiontrail GetTrailStatus --Name <trail-name>
        ```

        A passing account returns a trail whose `Status` is `Enable`, whose `IsLogging` is `true`, and whose `EventRW` is `All`. A failing account returns no trail, trails that are disabled or not logging, or trails whose `EventRW` is `Read` or `Write`.
      remediation:
        - id: console
          desc: |
            To create and enable a trail in the ActionTrail console:

            1. Sign in to the [ActionTrail console](https://actiontrail.console.aliyun.com/).
            2. Navigate to **Trails** and choose **Create Trail**.
            3. Select a delivery destination (an OSS bucket and/or a Simple Log Service project), set **Event Type** to **All**, and complete the wizard.
            4. Confirm the new trail's status is **Enabled** and that it is logging.
        - id: cli
          desc: |
            To create and start a trail with the `aliyun` CLI, create it against a delivery destination, then enable logging:

            ```bash
            aliyun actiontrail CreateTrail --Name <trail-name> \
              --OssBucketName <bucket-name> --EventRW All
            aliyun actiontrail StartLogging --Name <trail-name>
            ```
        - id: terraform
          desc: |
            To declare an enabled ActionTrail trail in Terraform, set `status` to `Enable` and `event_rw` to `All`:

            ```hcl
            resource "alicloud_actiontrail_trail" "example" {
              trail_name      = "example-trail"
              oss_bucket_name = alicloud_oss_bucket.example.bucket
              event_rw        = "All"
              status          = "Enable"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-actiontrail-trail-enabled-alicloud
      - uid: mondoo-alibaba-security-actiontrail-trail-enabled-terraform-hcl
      - uid: mondoo-alibaba-security-actiontrail-trail-enabled-terraform-plan
      - uid: mondoo-alibaba-security-actiontrail-trail-enabled-terraform-state
