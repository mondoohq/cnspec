      terraform.state.resources.where(type == "alicloud_security_group_rule").map(values).where(_["type"] == "ingress").where(_["cidr_ip"] == "0.0.0.0/0").where(_["policy"] == empty || _["policy"].downcase == "accept").none(_["ip_protocol"].downcase == "all" || _["ip_protocol"].downcase == "tcp" && _["port_range"] == /^(\d{1,3}|[12]\d{3}|3[0-2]\d{2}|33[0-7]\d|338\d)\/(3389|339\d|3[4-9]\d{2}|[4-9]\d{3}|\d{5})$/ || _["ip_protocol"].downcase == "tcp" && _["port_range"] == "-1/-1")

  - uid: mondoo-alibaba-security-ecs-security-group-no-public-all-ports
    title: Ensure security groups do not allow unrestricted public ingress
    impact: 90
    docs:
      desc: |
        This check verifies that no security group grants the internet unrestricted ingress, meaning access to every port or over every protocol.

        Ingress filtering is the whole purpose of a security group, and an all-ports or all-protocol rule sourced from the internet withdraws it. The check treats such a rule as world-open whether it names `0.0.0.0/0` directly or references a prefix list that contains it, and it recognizes the unrestricted forms the service accepts: an `ip_protocol` of `all`, and the port ranges `-1/-1` and `1/65535`. Rules are managed under **Network & Security** > **Security Groups** in the ECS console, and the required state is that none of these appears on an accepting inbound rule.

        **Why this matters**

        This is the total negation of network-level filtering. Every listening service on every instance the group protects becomes reachable from any address on the internet: administrative daemons, database ports bound to the wrong interface, debug endpoints, management agents, and anything a colleague starts next week without telling anyone.

        That reach includes services nobody deliberately published. An unrestricted rule needs no attacker skill to exploit, because there is nothing to bypass; discovery is a single port sweep, and whatever is listening is the attack surface.

        It also silently voids the rest of the hardening around it. Careful per-port rules elsewhere in the same group become decorative, and a review that reads those narrow rules can come away believing the tier is segmented when it is not.

        Removing the rule and replacing it with explicit rules for the ports actually in use, such as `443/443` from an internal range, restores least-exposure networking. A public-facing listener remains legitimate, but it belongs in a rule naming that one port and protocol, not in a blanket grant.
      audit: |
        ### Audit via Console

        1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
        2. Navigate to **Network & Security** > **Security Groups**.
        3. Open each security group's **Inbound** rules and look for `0.0.0.0/0` rules covering all ports (`-1/-1` or `1/65535`) or all protocols.

        A passing group has no such rule. A failing group has one.

        ### Audit via CLI

        1. Inspect a security group's inbound rules:

        ```bash
        aliyun ecs DescribeSecurityGroupAttribute --SecurityGroupId <sg-id> --Direction ingress
        ```

        A passing group returns no `Accept` permission from `0.0.0.0/0` covering all ports or all protocols. A failing group returns one.
      remediation:
        - id: console
          desc: |
            To remove an unrestricted ingress rule in the ECS console:

            1. Sign in to the [ECS console](https://ecs.console.aliyun.com/).
            2. Open the security group and its **Inbound** rules.
            3. Delete the `0.0.0.0/0` all-ports or all-protocol rule and add specific rules for the ports actually required.
        - id: cli
          desc: |
            To revoke an unrestricted ingress rule with the `aliyun` CLI:

            ```bash
            aliyun ecs RevokeSecurityGroup --SecurityGroupId <sg-id> \
              --IpProtocol all --PortRange -1/-1 --SourceCidrIp 0.0.0.0/0
            ```
        - id: terraform
          desc: |
            To replace an unrestricted rule in Terraform, scope the protocol, port range, and source:

            ```hcl
            resource "alicloud_security_group_rule" "app" {
              type              = "ingress"
              ip_protocol       = "tcp"
              port_range        = "443/443"
              security_group_id = alicloud_security_group.example.id
              cidr_ip           = "10.0.0.0/8"
            }
            ```
    variants:
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-all-ports-alicloud
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-all-ports-terraform-hcl
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-all-ports-terraform-plan
      - uid: mondoo-alibaba-security-ecs-security-group-no-public-all-ports-terraform-state
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
