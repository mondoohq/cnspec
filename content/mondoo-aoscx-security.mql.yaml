policies:
  - uid: mondoo-aoscx-security
    name: Mondoo HPE Aruba Networking AOS-CX Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: aoscx,networkdevice
      mondoo.com/icon: hpe
    require:
      - provider: aoscx
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure HPE Aruba Networking AOS-CX switch management access, AAA, SSH, SNMP, NTP, and logging
    docs:
      desc: |
        The Mondoo HPE Aruba Networking AOS-CX Security policy identifies misconfigurations on AOS-CX switches that could let an attacker reach the management plane, guess or intercept administrator credentials, change the switch without leaving a record, or hide their activity. The checks read the switch over its REST API and never change it.

        This policy provides security checks across key areas of AOS-CX configuration:

        - **Management plane**: Telnet disabled, SSH, HTTPS, and SNMP limited to the management VRF, a read-only REST API, and idle session timeouts
        - **SSH**: Strong ciphers, MACs, key exchange and host key algorithms, authentication attempt limits, and strong authorized keys
        - **Accounts and passwords**: The built-in admin password, password complexity, length and history, and login lockout
        - **AAA**: Remote authentication through TACACS+ or RADIUS, no fail-through to local accounts, command authorization, accounting, and RADIUS over TLS
        - **SNMP**: SNMPv3 users with SHA authentication and AES privacy, and SNMPv3 notifications
        - **Time and logging**: Authenticated NTP, remote syslog, and syslog over TLS
        - **Banners and certificates**: A pre-login banner and a valid, CA-signed HTTPS server certificate
        - **Configuration and ports**: A saved running configuration, VLAN 1 not in use, and unused ports shut down

        Learn more about scanning AOS-CX switches in the [cnspec HPE Aruba AOS-CX documentation](https://mondoo.com/docs/cnspec/network/aoscx).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Management Plane
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-telnet-disabled
          - uid: mondoo-aoscx-security-ssh-mgmt-vrf-only
          - uid: mondoo-aoscx-security-https-server-mgmt-vrf-only
          - uid: mondoo-aoscx-security-snmp-mgmt-vrf-only
          - uid: mondoo-aoscx-security-rest-api-read-only
          - uid: mondoo-aoscx-security-https-session-timeout
      - title: SSH
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-ssh-strong-ciphers
          - uid: mondoo-aoscx-security-ssh-strong-macs
          - uid: mondoo-aoscx-security-ssh-strong-kex
          - uid: mondoo-aoscx-security-ssh-strong-host-key-algorithms
          - uid: mondoo-aoscx-security-ssh-max-auth-attempts
          - uid: mondoo-aoscx-security-user-authorized-keys-strong
      - title: Accounts and Passwords
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-admin-password-set
          - uid: mondoo-aoscx-security-password-complexity-enabled
          - uid: mondoo-aoscx-security-password-minimum-length
          - uid: mondoo-aoscx-security-password-history
          - uid: mondoo-aoscx-security-login-lockout
      - title: AAA
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-aaa-remote-authentication
          - uid: mondoo-aoscx-security-aaa-fail-through-disabled
          - uid: mondoo-aoscx-security-aaa-command-authorization
          - uid: mondoo-aoscx-security-aaa-remote-accounting
          - uid: mondoo-aoscx-security-radius-tls
      - title: SNMP
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-snmpv3-auth-priv
          - uid: mondoo-aoscx-security-snmp-traps-v3
      - title: Time and Logging
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-ntp-enabled
          - uid: mondoo-aoscx-security-ntp-authenticated
          - uid: mondoo-aoscx-security-remote-syslog
          - uid: mondoo-aoscx-security-syslog-tls
      - title: Banners and Certificates
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-login-banner
          - uid: mondoo-aoscx-security-https-certificate-valid
      - title: Configuration and Ports
        filters: asset.platform == "aoscx"
        checks:
          - uid: mondoo-aoscx-security-running-config-saved
          - uid: mondoo-aoscx-security-vlan1-unused
          - uid: mondoo-aoscx-security-unused-ports-shutdown
    scoring_system: highest impact
queries:
  - uid: mondoo-aoscx-security-telnet-disabled
    title: Ensure the Telnet server is disabled on every VRF
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: aoscx.vrfs.none(telnetEnabled == true)
    docs:
      desc: |
        This check verifies that the switch does not accept Telnet logins on any VRF.

        AOS-CX can run a Telnet server per VRF, enabled with `telnet server vrf <vrf>`. Telnet is disabled by default, and this check requires that no VRF has it enabled.

        **Why this matters**

        Telnet sends the user name, the password, and every command of the session in cleartext. Anyone who can capture traffic on a path between the administrator and the switch, through a mirrored port, a compromised host on the same segment, or ARP spoofing, reads the administrator password and can log in with it.

        A switch password captured this way is usually an administrator credential that works on many other devices, because network teams often share accounts across the fleet. SSH provides the same CLI with an encrypted, authenticated channel, so there is no operational reason to keep Telnet.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include telnet`.

        If the output contains a `telnet server vrf` line, the check fails. If it is empty, Telnet is disabled on every VRF and the check passes.
      remediation:
        - id: cli
          desc: |
            To disable Telnet on every VRF using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Enter configuration mode and disable the Telnet server on each VRF that lists it in the running configuration.
            3. Save the configuration.

            ```text
            configure terminal
            no telnet server vrf <vrf>
            end
            write memory
            ```

            The switch asks for confirmation because disabling the server ends active Telnet sessions on that VRF. Reconnect over SSH.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-ssh-mgmt-vrf-only
    title: Ensure the SSH server listens only on the management VRF
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      aoscx.vrfs.any(sshEnabled == true || sshEnabled == false)
      aoscx.sshServer.enabledVrfs.all(name == "mgmt")
    docs:
      desc: |
        This check verifies that SSH logins to the switch are accepted only from the out-of-band management network.

        AOS-CX enables the SSH server per VRF with `ssh server vrf <vrf>`. The built-in `mgmt` VRF contains only the out-of-band management port, so SSH enabled there is reachable only from the management network. This check requires that `mgmt` is the only VRF with SSH enabled. It passes when SSH is disabled on every VRF, and fails when the switch reports the SSH setting for no VRF, since the setting could not be read.

        **Why this matters**

        SSH enabled on the `default` VRF or a user VRF listens on every routed interface in that VRF, including interfaces facing user subnets, servers, or the internet edge. Any host that can route to one of those addresses can try passwords against the switch, probe the SSH service for vulnerabilities, or reuse stolen credentials, without first reaching the management network.

        Keeping management in the `mgmt` VRF also keeps it working when the data plane is misconfigured or under attack, because the out-of-band port does not share forwarding with production traffic.

        Switch models without an out-of-band management port cannot meet this check and need compensating controls, such as a control plane ACL that limits SSH to the management subnet.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include ssh server vrf`.

        If the only line is `ssh server vrf mgmt`, or there is no line, SSH is limited to the management VRF or disabled. A line for any other VRF fails the check.
      remediation:
        - id: cli
          desc: |
            To limit SSH to the management VRF using the AOS-CX CLI:

            1. Connect to the switch over the out-of-band management port or the console, so the change does not end your own session.
            2. Enable SSH on the `mgmt` VRF and disable it on every other VRF that the running configuration lists.
            3. Save the configuration.

            ```text
            configure terminal
            ssh server vrf mgmt
            no ssh server vrf default
            end
            write memory
            ```

            **Confirm that the out-of-band management port is cabled and reachable before you disable SSH on the other VRFs.** Otherwise you lose remote access to the switch.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-https-server-mgmt-vrf-only
    title: Ensure the HTTPS server and REST API listen only on the management VRF
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      aoscx.httpsServer.enabledVrfs != empty
      aoscx.httpsServer.enabledVrfs.all(name == "mgmt")
    docs:
      desc: |
        This check verifies that the Web UI and the REST API are reachable only from the out-of-band management network.

        On AOS-CX the HTTPS server serves both the Web UI and the REST API, and it is enabled per VRF with `https-server vrf <vrf>`. Depending on the model, it is enabled by default on the `default` VRF, the `mgmt` VRF, or both. This check requires that the HTTPS server is enabled on at least one VRF and that `mgmt` is the only one. The scan itself reaches the switch through the REST API, so a switch that reports no VRF with HTTPS enabled is one whose setting could not be read, and the check fails.

        **Why this matters**

        The REST API exposes the full configuration of the switch and, in read-write mode, can change it. An HTTPS server listening on the `default` VRF answers on every routed interface, so any host that can route to the switch can attempt logins, run up the per-user session limit to lock administrators out, or exploit a flaw in the web service. HPE has published advisories for the AOS-CX web management interface, and a service that is only reachable from the management network is far harder to reach with such a flaw.

        Switch models without an out-of-band management port cannot meet this check and need compensating controls, such as a control plane ACL that limits HTTPS to the management subnet.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include https-server vrf`.

        If the only line is `https-server vrf mgmt`, the check passes. A line for any other VRF fails the check.
      remediation:
        - id: cli
          desc: |
            To limit the HTTPS server to the management VRF using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Enable the HTTPS server on the `mgmt` VRF and disable it on every other VRF that the running configuration lists.
            3. Save the configuration.

            ```text
            configure terminal
            https-server vrf mgmt
            no https-server vrf default
            end
            write memory
            ```

            Tools that manage the switch through the REST API, such as HPE Aruba Networking Central or NetEdit, must reach it through the management network afterward.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-snmp-mgmt-vrf-only
    title: Ensure the SNMP agent listens only on the management VRF
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      aoscx.vrfs.any(snmpEnabled == true || snmpEnabled == false)
      aoscx.snmp.enabledVrfs.all(name == "mgmt")
    docs:
      desc: |
        This check verifies that the SNMP agent answers only on the out-of-band management network.

        AOS-CX enables the SNMP agent per VRF with `snmp-server vrf <vrf>`. This check requires that `mgmt` is the only VRF with SNMP enabled. It passes when SNMP is disabled on every VRF, and fails when the switch reports the SNMP setting for no VRF, since the setting could not be read.

        **Why this matters**

        SNMP exposes the interface table, the ARP and MAC tables, routing information, and system details that an attacker uses to map the network. An agent listening on a production VRF can be queried, or have its community strings guessed, from any host that can route to the switch. SNMPv1 and v2c community strings travel in cleartext, so a single capture on a user segment can hand an attacker read or write access.

        Restricting the agent to the `mgmt` VRF limits SNMP queries to the monitoring systems on the management network.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include snmp-server vrf`.

        If the only line is `snmp-server vrf mgmt`, or there is no line, SNMP is limited to the management VRF or disabled. A line for any other VRF fails the check.
      remediation:
        - id: cli
          desc: |
            To limit the SNMP agent to the management VRF using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Enable SNMP on the `mgmt` VRF and disable it on every other VRF that the running configuration lists.
            3. Save the configuration.

            ```text
            configure terminal
            snmp-server vrf mgmt
            no snmp-server vrf default
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-rest-api-read-only
    title: Ensure the REST API is in read-only mode
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: aoscx.httpsServer.restAccessMode == "read-only"
    docs:
      desc: |
        This check verifies that the REST API cannot be used to change the switch configuration.

        AOS-CX sets the REST API access mode with `https-server rest access-mode`, which is either `read-only` or `read-write`. In read-write mode, any REST session of an administrator can write the configuration. This check requires `read-only`.

        **Why this matters**

        A REST session is authenticated by a cookie, not by an interactive terminal, so a session token stolen from an automation host, a browser, or a script log is enough to reconfigure the switch: add a user, change a VLAN, or mirror a port to a host the attacker controls. In read-only mode a stolen token can still read the configuration, but it cannot change it.

        Leave read-write mode on only where the switch is managed through the REST API, such as by an automation platform, and restrict the HTTPS server to the management VRF in that case.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include rest access-mode`.

        If the output is `https-server rest access-mode read-only`, the check passes. If it shows `read-write`, or the line is absent and the firmware default is read-write, the check fails.
      remediation:
        - id: cli
          desc: |
            To put the REST API in read-only mode using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Set the REST access mode to read-only.
            3. Save the configuration.

            ```text
            configure terminal
            https-server rest access-mode read-only
            end
            write memory
            ```
    refs:
      - url: https://mondoo.com/docs/cnspec/network/aoscx
        title: Secure HPE Aruba Networking AOS-CX with cnspec
  - uid: mondoo-aoscx-security-https-session-timeout
    title: Ensure Web UI and REST sessions time out after 15 minutes or less
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iii-access-control-automatic-logoff
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-8
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      aoscx.httpsServer.sessionTimeout > 0
      aoscx.httpsServer.sessionTimeout <= 15
    docs:
      desc: |
        This check verifies that idle Web UI and REST API sessions end within 15 minutes.

        AOS-CX ends an idle HTTPS session after the time set with `https-server session-timeout`, in minutes. The default is 20 minutes. This check requires a timeout from 1 to 15 minutes.

        **Why this matters**

        An administrator who walks away from a browser, or a script that never logs out, leaves an authenticated session behind. Anyone with access to that browser, or to the session cookie, can use the session for as long as it stays open. A short idle timeout limits that window, and it also frees one of the six sessions each user may hold, so abandoned sessions cannot lock administrators out of the REST API.

        PCI DSS 8.2.8 requires re-authentication after 15 minutes of inactivity.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include session-timeout`.

        If the output shows `https-server session-timeout` with a value from 1 to 15, the check passes. A higher value, or no line, fails the check.
      remediation:
        - id: cli
          desc: |
            To set a 15 minute idle timeout using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Set the HTTPS session timeout in minutes.
            3. Save the configuration.

            ```text
            configure terminal
            https-server session-timeout 15
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-ssh-strong-ciphers
    title: Ensure the SSH server allows only strong ciphers
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      aoscx.sshServer.ciphers != empty
      aoscx.sshServer.ciphers.none(_ == /cbc|3des|arcfour|blowfish|cast128/)
    docs:
      desc: |
        This check verifies that SSH sessions to the switch are encrypted only with ciphers that have no known practical weaknesses.

        AOS-CX sets the allowed SSH ciphers with `ssh ciphers`. Without that command the firmware default list applies, which can include ciphers kept for compatibility with old clients. This check requires an explicit cipher list that contains no CBC mode, 3DES, RC4, Blowfish, or CAST cipher.

        **Why this matters**

        CBC mode ciphers in SSH are open to plaintext recovery attacks, and 3DES has a 64-bit block that the Sweet32 attack exploits on long sessions. RC4 is broken outright. A client and switch that both allow such a cipher can be forced onto it by an attacker in the path, so a single weak cipher on the list weakens every session.

        An explicit list also keeps the allowed set stable across firmware upgrades instead of following whatever the next default list contains. Use AES in GCM or CTR mode, or ChaCha20-Poly1305 where the firmware offers it.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include ssh ciphers`.

        If the output lists only ciphers without `cbc`, `3des`, `arcfour`, `blowfish`, or `cast128` in their names, the check passes. If the line is absent, the firmware default list applies and the check fails.
      remediation:
        - id: cli
          desc: |
            To allow only strong SSH ciphers using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. List the ciphers your firmware supports with `ssh ciphers ?`.
            3. Configure a list of AES GCM and CTR ciphers, then save the configuration.

            ```text
            configure terminal
            ssh ciphers aes256-gcm@openssh.com aes128-gcm@openssh.com aes256-ctr aes192-ctr aes128-ctr
            end
            write memory
            ```

            Keep an existing SSH session open while you test a new one, so a client that supports none of the listed ciphers does not lock you out.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
      - url: https://sweet32.info/
        title: "Sweet32: Birthday attacks on 64-bit block ciphers in TLS and OpenVPN"
  - uid: mondoo-aoscx-security-ssh-strong-macs
    title: Ensure the SSH server allows only strong MAC algorithms
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      aoscx.sshServer.macs != empty
      aoscx.sshServer.macs.none(_ == /md5|sha1|-96|umac-64/)
    docs:
      desc: |
        This check verifies that SSH sessions to the switch are protected against tampering with strong message authentication codes.

        AOS-CX sets the allowed SSH MAC algorithms with `ssh macs`. Without that command the firmware default list applies. This check requires an explicit list that contains no MD5, SHA-1, truncated 96-bit, or 64-bit UMAC algorithm.

        **Why this matters**

        The MAC is what stops an attacker in the path from altering the commands an administrator sends or the output the switch returns. MD5 and SHA-1 are deprecated for new use, and truncated and 64-bit MACs shrink the work needed to forge a tag. Allowing them lets an attacker who can influence negotiation push a session onto the weakest algorithm both sides accept.

        Use the SHA-2 HMACs, preferably their encrypt-then-MAC forms.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include ssh macs`.

        If the output lists only algorithms without `md5`, `sha1`, `-96`, or `umac-64` in their names, the check passes. If the line is absent, the firmware default list applies and the check fails.
      remediation:
        - id: cli
          desc: |
            To allow only strong SSH MAC algorithms using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. List the MAC algorithms your firmware supports with `ssh macs ?`.
            3. Configure a list of SHA-2 algorithms, then save the configuration.

            ```text
            configure terminal
            ssh macs hmac-sha2-512-etm@openssh.com hmac-sha2-256-etm@openssh.com hmac-sha2-512 hmac-sha2-256
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-ssh-strong-kex
    title: Ensure the SSH server allows only strong key exchange algorithms
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      aoscx.sshServer.kexAlgorithms != empty
      aoscx.sshServer.kexAlgorithms.none(_ == /sha1|group1-/)
    docs:
      desc: |
        This check verifies that SSH session keys are agreed with key exchange algorithms that resist known attacks.

        AOS-CX sets the allowed key exchange algorithms with `ssh key-exchange-algorithms`. Without that command the firmware default list applies. This check requires an explicit list that contains no SHA-1 based algorithm and no 1024-bit Diffie-Hellman group 1.

        **Why this matters**

        The key exchange decides the keys that protect the rest of the session. Diffie-Hellman group 1 uses a 1024-bit prime, which the Logjam research showed to be within reach of well-funded attackers through precomputation, and SHA-1 based key exchanges rest on a hash with practical collision attacks. A recorded session protected by a weak exchange can be decrypted later.

        Use `curve25519-sha256`, the ECDH NIST curves with SHA-2, or Diffie-Hellman group 14 or larger with SHA-2.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include ssh key-exchange-algorithms`.

        If the output lists only algorithms without `sha1` or `group1-` in their names, the check passes. If the line is absent, the firmware default list applies and the check fails.
      remediation:
        - id: cli
          desc: |
            To allow only strong SSH key exchange algorithms using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. List the algorithms your firmware supports with `ssh key-exchange-algorithms ?`.
            3. Configure a list of algorithms that use SHA-2, then save the configuration.

            ```text
            configure terminal
            ssh key-exchange-algorithms curve25519-sha256 ecdh-sha2-nistp384 ecdh-sha2-nistp256 diffie-hellman-group16-sha512 diffie-hellman-group14-sha256
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
      - url: https://weakdh.org/
        title: "Weak Diffie-Hellman and the Logjam Attack"
  - uid: mondoo-aoscx-security-ssh-strong-host-key-algorithms
    title: Ensure the SSH server does not offer SHA-1 or DSA host key signatures
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      aoscx.sshServer.hostKeyAlgorithms != empty
      aoscx.sshServer.hostKeyAlgorithms.none(_ == "ssh-rsa" || _ == "ssh-dss")
    docs:
      desc: |
        This check verifies that the switch proves its identity to SSH clients with signature algorithms that cannot be forged.

        AOS-CX sets the host key algorithms it offers with `ssh host-key-algorithms`. Without that command the firmware default list applies. This check requires an explicit list that contains neither `ssh-rsa`, which signs with SHA-1, nor `ssh-dss`.

        **Why this matters**

        The host key signature is what lets an administrator's client detect a machine in the middle that impersonates the switch. SHA-1 has practical chosen-prefix collisions, and OpenSSH disabled `ssh-rsa` signatures by default for that reason. DSA keys are limited to 1024 bits. If the switch still offers either, an attacker who can intercept the connection has a weaker signature to attack when impersonating it, and captures the administrator's password on success.

        RSA host keys remain usable with the `rsa-sha2-256` and `rsa-sha2-512` signature algorithms.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include ssh host-key-algorithms`.

        If the output lists neither `ssh-rsa` nor `ssh-dss`, the check passes. If the line is absent, the firmware default list applies and the check fails.
      remediation:
        - id: cli
          desc: |
            To offer only strong host key algorithms using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. List the algorithms your firmware supports with `ssh host-key-algorithms ?`.
            3. Configure a list without `ssh-rsa` and `ssh-dss`, then save the configuration.

            ```text
            configure terminal
            ssh host-key-algorithms ssh-ed25519 ecdsa-sha2-nistp256 ecdsa-sha2-nistp384 rsa-sha2-512 rsa-sha2-256
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-ssh-max-auth-attempts
    title: Ensure SSH allows at most 4 authentication attempts per connection
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-4
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      aoscx.sshServer.maxAuthAttempts > 0
      aoscx.sshServer.maxAuthAttempts <= 4
    docs:
      desc: |
        This check verifies that a single SSH connection cannot be used for a long series of password guesses.

        AOS-CX sets the number of authentication attempts allowed per SSH connection with `ssh maximum-auth-attempts`. This check requires a value from 1 to 4, and fails when the setting is not reported.

        **Why this matters**

        Password guessing tools open a connection and try passwords until the server disconnects them. The fewer attempts a connection allows, the more connections an attack needs, which slows it down and makes it stand out in the logs. This limit applies even when users authenticate against TACACS+ or RADIUS, where the switch's own login lockout is not available.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include maximum-auth-attempts`.

        If the output shows `ssh maximum-auth-attempts` with a value from 1 to 4, the check passes. A higher value, or no line, fails the check.
      remediation:
        - id: cli
          desc: |
            To limit SSH authentication attempts using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Set the maximum number of authentication attempts per connection.
            3. Save the configuration.

            ```text
            configure terminal
            ssh maximum-auth-attempts 3
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-user-authorized-keys-strong
    title: Ensure local users' SSH authorized keys are not DSA or short RSA keys
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      aoscx.users.all(authorizedKeys.all(type != "ssh-dss"))
      aoscx.users.all(authorizedKeys.where(type == "ssh-rsa").all(bits >= 2048))
    docs:
      desc: |
        This check verifies that every SSH public key that can log in as a local user is strong enough that its private key cannot be derived.

        AOS-CX stores public keys per user, added with `user <name> authorized-key <key>`. A user holding a key logs in without a password. This check requires that no authorized key is a DSA key and that every RSA key is at least 2048 bits. Ed25519 and ECDSA keys pass.

        **Why this matters**

        An authorized key is a standing credential for the switch. DSA keys are fixed at 1024 bits and RSA keys below 2048 bits are below current NIST guidance, so the effort to recover the private key from the public key, which anyone who reads the configuration has, is far lower than for a modern key. A recovered key logs in as that user, often an administrator, without any password.

        Old keys also tend to belong to people or systems that no longer need access. Review the key comment and owner when replacing them.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include authorized-key` and inspect the key type of each entry.
        3. For each `ssh-rsa` key, determine its length, for example by copying the key to a workstation and running `ssh-keygen -l -f <file>`.

        If no key is `ssh-dss` and every `ssh-rsa` key is at least 2048 bits, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To replace weak authorized keys using the AOS-CX CLI:

            1. Generate a new Ed25519 key pair on the administrator's workstation with `ssh-keygen -t ed25519`.
            2. Connect to the switch over SSH or the console.
            3. Remove the weak key from the user and add the new public key, then save the configuration.

            ```text
            configure terminal
            no user <name> authorized-key <key-identifier>
            user <name> authorized-key ssh-ed25519 <base64-key> <comment>
            end
            write memory
            ```

            Run `show running-config | include authorized-key` to find the key identifier to remove.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-admin-password-set
    title: Ensure the built-in admin account has a password
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-2
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: aoscx.system.adminPasswordSet == true
    docs:
      desc: |
        This check verifies that the built-in `admin` account cannot log in without a password.

        A factory-default AOS-CX switch has an `admin` user with no password. The switch prompts for one at first console login on recent firmware, but a switch that was zeroized, deployed through automation, or upgraded from older firmware can still have none. This check requires that the `admin` password is set.

        **Why this matters**

        An `admin` account without a password is full administrative access for anyone who can reach a login prompt, over SSH, the Web UI, the REST API, or the console. Automated scanners try `admin` with an empty password on every switch they find, so the window between exposure and takeover is minutes.
      audit: |
        1. Connect to the switch console.
        2. Log in as `admin` and press Enter at the password prompt.

        If the login is refused, the check passes. If the switch logs you in, the account has no password and the check fails.
      remediation:
        - id: cli
          desc: |
            To set a password on the built-in admin account using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Set the password; the switch prompts for it twice.
            3. Save the configuration.

            ```text
            configure terminal
            user admin password
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-password-complexity-enabled
    title: Ensure password complexity rules are enforced for local users
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      aoscx.passwordPolicy.enabled == true
      aoscx.passwordPolicy.minimumUppercase >= 1
      aoscx.passwordPolicy.minimumLowercase >= 1
      aoscx.passwordPolicy.minimumDigits >= 1
      aoscx.passwordPolicy.minimumSpecial >= 1
    docs:
      desc: |
        This check verifies that the switch rejects simple passwords for local user accounts.

        AOS-CX enforces password rules for local users when the `password complexity` context is enabled. That context sets the minimum number of uppercase, lowercase, numeric, and special characters. This check requires the rules to be enabled with at least one character of each class.

        **Why this matters**

        Without complexity rules, an administrator can set a dictionary word or a short pattern, which falls to an online guessing attack or to an offline crack of a configuration backup in seconds. Local accounts are the fallback when TACACS+ or RADIUS is unreachable, so they are exactly the credentials an attacker targets when the AAA servers are down.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config` and find the `password complexity` section.

        If the section contains `enable` and each of `uppercase-count`, `lowercase-count`, `numeric-count`, and `special-char-count` is at least 1, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To enforce password complexity using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Enter the `password complexity` context, set the character class counts, and enable the rules.
            3. Save the configuration.

            ```text
            configure terminal
            password complexity
            uppercase-count 1
            lowercase-count 1
            numeric-count 1
            special-char-count 1
            enable
            end
            write memory
            ```

            The rules apply to passwords set after they are enabled. Change existing local passwords to bring them into line.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-password-minimum-length
    title: Ensure local user passwords are at least 14 characters long
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      aoscx.passwordPolicy.enabled == true
      aoscx.passwordPolicy.minimumLength >= 14
    docs:
      desc: |
        This check verifies that the switch rejects short passwords for local user accounts.

        AOS-CX sets the minimum password length for local users with `minimum-length` in the `password complexity` context, which applies once that context is enabled. This check requires the rules to be enabled with a minimum length of at least 14 characters, the length the CIS benchmark recommends. PCI DSS 8.3.6 sets 12 characters as the floor.

        **Why this matters**

        Length is the largest factor in how long a password resists guessing. An attacker who obtains a configuration backup or a support file can attack the stored password hashes offline at billions of guesses per second, and every additional character multiplies that work. Local accounts are the credentials that still work when TACACS+ or RADIUS is down, so they need to hold up on their own.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config` and find the `password complexity` section.

        If the section contains `enable` and `minimum-length` is 14 or more, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To require passwords of at least 14 characters using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Enter the `password complexity` context, set the minimum length, and enable the rules.
            3. Save the configuration.

            ```text
            configure terminal
            password complexity
            minimum-length 14
            enable
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-password-history
    title: Ensure local users cannot reuse their last 5 passwords
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-7
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      aoscx.passwordPolicy.enabled == true
      aoscx.passwordPolicy.historyCount >= 5
    docs:
      desc: |
        This check verifies that a local user cannot change a password back to one used recently.

        AOS-CX sets the number of previous passwords a user may not repeat with `history-count` in the `password complexity` context. This check requires the rules to be enabled with a history of at least 5 passwords. PCI DSS 8.3.7 requires at least the last four.

        **Why this matters**

        A password is usually changed because it may have been exposed. If the user can set the old password again right away, the change protects nothing, and the exposed password keeps working. A password history forces a new secret at each change.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config` and find the `password complexity` section.

        If the section contains `enable` and `history-count` is 5 or more, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To keep a password history of 5 using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Enter the `password complexity` context, set the history count, and enable the rules.
            3. Save the configuration.

            ```text
            configure terminal
            password complexity
            history-count 5
            enable
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-login-lockout
    title: Ensure failed logins lock local accounts or use TACACS+ or RADIUS
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-4
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      aoscx.aaa.maxLoginAttempts > 0 && aoscx.aaa.maxLoginAttempts <= 5 && aoscx.aaa.loginLockoutTime >= 1800 ||
        aoscx.aaa.methodLists.where(function == "authentication" && sessionType == "default").any(groups.first.type == "tacacs" || groups.first.type == "radius") &&
        aoscx.aaa.methodLists.where(function == "authentication" && sessionType != "console").all(groups.first.type == "tacacs" || groups.first.type == "radius")
    docs:
      desc: |
        This check verifies that an attacker cannot guess local passwords over SSH or the Web UI without limit.

        AOS-CX locks a local user out after repeated failures when `aaa authentication limit-login-attempts` is set, for the number of seconds given by its `lockout-time`. The switch does not allow that setting together with TACACS+ or RADIUS authentication, where the AAA server enforces lockout instead. This check passes when the switch locks out after at most 5 failures for at least 30 minutes, or when the `default` authentication method list and every list for SSH and the HTTPS server try a TACACS+ or RADIUS server group first.

        **Why this matters**

        Without a lockout, a password guessing tool can try passwords against the `admin` account for as long as it likes. A lockout of 30 minutes after a handful of failures turns an attack that finishes in hours into one that takes years, and the lockouts show up in the logs. PCI DSS 8.3.4 requires lockout after no more than 10 attempts for at least 30 minutes.

        When authentication goes to TACACS+ or RADIUS, configure lockout on the AAA server, since the switch cannot enforce it.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include aaa authentication`.

        The check passes if the output contains `aaa authentication limit-login-attempts` with 5 or fewer attempts and a `lockout-time` of 1800 seconds or more, or a `default` `aaa authentication login` line and every `ssh` and `https-server` line that name a TACACS+ or RADIUS server group first. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To lock out local users after failed logins using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Set the number of attempts and the lockout time in seconds.
            3. Save the configuration.

            ```text
            configure terminal
            aaa authentication limit-login-attempts 5 lockout-time 1800
            end
            write memory
            ```

            The lockout applies to SSH and Web UI logins with local authentication, not to the serial console. If the switch authenticates against TACACS+ or RADIUS, configure the lockout policy on the AAA server instead.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-aaa-remote-authentication
    title: Ensure remote logins authenticate against TACACS+ or RADIUS first
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      aoscx.aaa.methodLists.where(function == "authentication" && sessionType == "default").any(groups.first.type == "tacacs" || groups.first.type == "radius")
      aoscx.aaa.methodLists.where(function == "authentication" && sessionType != "console").all(groups.first.type == "tacacs" || groups.first.type == "radius")
    docs:
      desc: |
        This check verifies that administrators log in to the switch with individual accounts from a central TACACS+ or RADIUS server rather than with shared local accounts.

        AOS-CX chooses how to authenticate a login from the method list set with `aaa authentication login <session-type> group <groups>`. The `default` list applies to every session type that has no list of its own. This check requires the `default` list, and every list for SSH and the HTTPS server, to try a TACACS+ or RADIUS server group first. The console list may stay local, so the switch remains reachable when the servers are down.

        **Why this matters**

        Local accounts on switches are usually shared, rarely rotated, and stay valid after the person who knows the password leaves. Central authentication ties every login to one person, removes access everywhere at once when that person leaves, and lets the AAA server apply MFA, lockout, and password rules that the switch cannot.

        Keep `local` at the end of the list, so the switch falls back to a local account only when no AAA server answers.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include aaa authentication login`.

        The check passes if the `default` line and every `ssh` and `https-server` line name a TACACS+ or RADIUS group first. A missing `default` line, or a list that starts with `local`, fails the check.
      remediation:
        - id: cli
          desc: |
            To authenticate logins against TACACS+ first using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Define the TACACS+ server and a server group that contains it.
            3. Set the default login method list to the server group, followed by `local`, then save the configuration.

            ```text
            configure terminal
            tacacs-server host <server> key plaintext <key> vrf mgmt
            aaa group server tacacs <group>
            server <server> vrf mgmt
            exit
            aaa authentication login default group <group> local
            end
            write memory
            ```

            Test a login with a TACACS+ account from a second session before you close the one you configured from.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-aaa-fail-through-disabled
    title: Ensure AAA rejections do not fall through to local accounts
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: aoscx.aaa.failThrough != true
    docs:
      desc: |
        This check verifies that a password rejected by TACACS+ or RADIUS cannot be retried against the switch's local accounts.

        AOS-CX normally moves to the next group in an authentication method list only when a server group does not answer. With `aaa authentication allow-fail-through`, it also moves on when a server rejects the login. Fail-through is disabled by default, and this check requires it to stay disabled.

        **Why this matters**

        With fail-through, a user whose central account is disabled, or whose password was rejected, gets a second chance against the local database. A former employee who still knows a shared local password, or an attacker who has cracked one from a backup, logs in even though the AAA server said no, and the denial on the AAA server suggests the attempt failed.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include allow-fail-through`.

        If the output is empty, the check passes. If it contains `aaa authentication allow-fail-through`, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable AAA fail-through using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Remove the fail-through setting.
            3. Save the configuration.

            ```text
            configure terminal
            no aaa authentication allow-fail-through
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-aaa-command-authorization
    title: Ensure commands are authorized by a TACACS+ server
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: aoscx.aaa.methodLists.any(function == "authorization" && groups.any(type == "tacacs"))
    docs:
      desc: |
        This check verifies that each command an administrator runs is checked against central policy before the switch executes it.

        AOS-CX sends commands to a TACACS+ server for approval when an authorization method list names a TACACS+ group, set with `aaa authorization commands <session-type> group <group>`. This check requires an authorization list that uses a TACACS+ server group.

        **Why this matters**

        Without command authorization, the switch's built-in user groups are all-or-nothing: an operator either has full configuration rights or none. Per-command authorization lets the TACACS+ server allow a help desk account to bounce a port but not change AAA or routing, so a compromised low-privilege account cannot reconfigure the switch. It also gives the AAA server a record of every command it allowed or refused.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include aaa authorization`.

        If the output contains an `aaa authorization commands` line that names a TACACS+ server group, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To authorize commands through TACACS+ using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Configure a TACACS+ server group, as for remote authentication.
            3. Set the default command authorization list to that group, then save the configuration.

            ```text
            configure terminal
            aaa authorization commands default group <group>
            end
            write memory
            ```

            **Define authorization rules on the TACACS+ server before you enable this.** A server that denies everything, or does not answer, blocks every command.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-aaa-remote-accounting
    title: Ensure management activity is accounted to a TACACS+ or RADIUS server
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: aoscx.aaa.methodLists.any(function == "accounting" && groups.any(type == "tacacs" || type == "radius"))
    docs:
      desc: |
        This check verifies that the switch sends a record of administrator logins and commands to a central AAA server.

        AOS-CX records management activity locally by default, and sends it to a server when an accounting method list names a TACACS+ or RADIUS group, set with `aaa accounting all-mgmt <session-type> start-stop group <group>`. This check requires an accounting list that uses a TACACS+ or RADIUS server group.

        **Why this matters**

        A record that stays on the switch can be erased by anyone who gains administrative access there, and it is lost if the switch fails. Accounting records on a central server show who logged in, when, and what they changed, and survive an attacker's cleanup. They are the evidence an incident responder needs to tell an authorized change from a malicious one.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include aaa accounting`.

        If the output contains an `aaa accounting` line that names a TACACS+ or RADIUS server group, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To send accounting records to a TACACS+ server using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Configure a TACACS+ server group, as for remote authentication.
            3. Set the default accounting list to that group, then save the configuration.

            ```text
            configure terminal
            aaa accounting all-mgmt default start-stop group <group>
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-radius-tls
    title: Ensure RADIUS servers are reached over TLS
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: aoscx.radiusServers.all(tlsEnabled == true)
    docs:
      desc: |
        This check verifies that authentication requests to RADIUS servers travel inside an encrypted, authenticated TLS connection.

        AOS-CX supports RADIUS over TLS, known as RadSec, configured with the `tls` option of `radius-server host`. This check requires every configured RADIUS server to use TLS, and passes when no RADIUS server is configured.

        **Why this matters**

        Classic RADIUS over UDP hides only the password attribute, using a scheme built on MD5 and the shared secret, and leaves the user name and every other attribute in cleartext. The Blast-RADIUS attack showed that an attacker in the path can forge an Access-Accept response by exploiting MD5, turning a rejected login into an accepted one. RADIUS over TLS protects the whole exchange and authenticates the server with a certificate.

        Where the RADIUS server does not support TLS, keep RADIUS traffic on the management network and enable the Message-Authenticator attribute as a mitigation.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include radius-server host`.

        If every `radius-server host` line includes `tls`, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To reach a RADIUS server over TLS using the AOS-CX CLI:

            1. Install a certificate the RADIUS server trusts, and a trust anchor profile for the server's CA, on the switch.
            2. Connect to the switch over SSH or the console.
            3. Replace the UDP server definition with a TLS one, then save the configuration.

            ```text
            configure terminal
            no radius-server host <server> vrf mgmt
            radius-server host <server> tls vrf mgmt
            end
            write memory
            ```

            Add the server to its server group again after redefining it.
    refs:
      - url: https://www.blastradius.fail/
        title: BLAST RADIUS
  - uid: mondoo-aoscx-security-snmpv3-auth-priv
    title: Ensure SNMPv3 users authenticate with SHA and encrypt with AES
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: aoscx.snmp.v3Users.all(authProtocol == /^sha/ && privProtocol == /^aes/)
    docs:
      desc: |
        This check verifies that every SNMPv3 user both authenticates its messages and encrypts them with current algorithms.

        AOS-CX defines SNMPv3 users with `snmpv3 user <name> auth <protocol> auth-pass ... priv <protocol> priv-pass ...`. A user may authenticate with MD5 or SHA and encrypt with DES or AES, or skip encryption entirely. This check requires every SNMPv3 user to use a SHA authentication protocol and AES privacy.

        **Why this matters**

        SNMPv3 without privacy sends every value it reads or writes in cleartext, including interface and routing details, and without authentication anyone can send it requests. DES has a 56-bit key that commodity hardware brute forces, and MD5 is deprecated for authentication. A user configured with them gives an attacker on the path the same view of the switch as an SNMPv1 community.

        SNMPv1 and v2c community strings are not read by the scanner, since they are secrets. Check them separately and remove them where SNMPv3 is in use.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show snmpv3 users`.

        If every user shows a SHA authentication protocol and an AES privacy protocol, the check passes. A user with MD5, DES, or no privacy fails the check.
      remediation:
        - id: cli
          desc: |
            To define SNMPv3 users with SHA and AES using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Redefine each user with SHA authentication and AES privacy.
            3. Save the configuration.

            ```text
            configure terminal
            snmpv3 user <name> auth sha auth-pass plaintext <auth-pass> priv aes priv-pass plaintext <priv-pass>
            end
            write memory
            ```

            Update the monitoring system with the new protocols and pass phrases at the same time.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-snmp-traps-v3
    title: Ensure SNMP notifications are sent only with SNMPv3
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: aoscx.snmp.traps.all(version == "v3")
    docs:
      desc: |
        This check verifies that the switch sends SNMP traps and informs only with SNMPv3.

        AOS-CX sends notifications to each receiver configured with `snmp-server host <address> trap version <version>`. Versions v1 and v2c carry a community string, while v3 uses an SNMPv3 user. This check requires every receiver to use version v3, and passes when no receiver is configured.

        **Why this matters**

        A v1 or v2c trap carries its community string in cleartext. That string is often reused as a read or write community on other devices, so capturing a single trap can give an attacker SNMP access across the network. The trap content, such as link and authentication failures, also tells an observer what is happening on the switch.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include snmp-server host`.

        If every line shows `version v3`, the check passes. A line with `version v1` or `version v2c` fails the check.
      remediation:
        - id: cli
          desc: |
            To send notifications with SNMPv3 using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Remove each v1 or v2c receiver and add it again with an SNMPv3 user.
            3. Save the configuration.

            ```text
            configure terminal
            no snmp-server host <address> trap version v2c community <community>
            snmp-server host <address> trap version v3 user <name> vrf mgmt
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-ntp-enabled
    title: Ensure the switch synchronizes its clock with NTP
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      aoscx.ntp.enabled == true
      aoscx.ntp.servers != empty
    docs:
      desc: |
        This check verifies that the switch keeps its clock synchronized with NTP servers.

        AOS-CX runs its NTP client when `ntp enable` is set, and synchronizes with the servers configured with `ntp server`. This check requires the client to be enabled with at least one server.

        **Why this matters**

        Log messages, accounting records, and certificate validity checks all depend on the switch clock. A drifting clock puts switch events at the wrong time relative to firewall, server, and authentication logs, so an investigator cannot line up an intrusion across devices, and a clock far enough off makes valid certificates appear expired or not yet valid. PCI DSS 10.6.1 requires clocks to be synchronized.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show ntp status` and `show ntp servers`.

        If NTP is enabled and at least one server is listed, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To synchronize the clock with NTP using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Add your NTP servers, set the VRF used to reach them, and enable NTP.
            3. Save the configuration.

            ```text
            configure terminal
            ntp server <server> iburst
            ntp vrf mgmt
            ntp enable
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-ntp-authenticated
    title: Ensure NTP servers are authenticated with trusted keys
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-6-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      aoscx.ntp.authenticationEnabled == true
      aoscx.ntp.servers != empty
      aoscx.ntp.servers.all(key != empty && key.trusted == true)
    docs:
      desc: |
        This check verifies that the switch accepts time only from NTP servers that prove their identity with a shared key.

        AOS-CX authenticates NTP when `ntp authentication` is enabled, each server is configured with a `key`, and that key is marked trusted with `ntp trusted-key`. This check requires authentication to be enabled and every NTP server to use a trusted key.

        **Why this matters**

        Unauthenticated NTP accepts time from anyone who can answer the switch's requests, or spoof the server's address. An attacker who shifts the clock can make log records line up with an innocent time window, push certificates out of their validity period, or replay credentials that are only valid at a given time. A keyed server lets the switch reject time from anyone else.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include ntp`.

        If the output contains `ntp authentication`, every `ntp server` line has a `key`, and each of those keys appears in an `ntp trusted-key` line, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To authenticate NTP servers using the AOS-CX CLI:

            1. Configure the same key on the NTP server.
            2. Connect to the switch over SSH or the console.
            3. Add the key, mark it trusted, assign it to each server, and enable NTP authentication.
            4. Save the configuration.

            ```text
            configure terminal
            ntp authentication-key 1 sha1 plaintext <key>
            ntp trusted-key 1
            ntp server <server> key 1 iburst
            ntp authentication
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-remote-syslog
    title: Ensure log messages are sent to a remote syslog server
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-02
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-3-3
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: aoscx.syslogServers != empty
    docs:
      desc: |
        This check verifies that the switch forwards its log messages to at least one remote syslog server.

        AOS-CX sends log messages to each server configured with `logging <server>`. This check requires at least one server.

        **Why this matters**

        Logs kept only on the switch are limited in size, are lost when the switch reboots or fails, and can be cleared by an attacker who gains administrative access. A remote copy preserves authentication failures, configuration changes, and interface events for correlation and alerting, and it survives the cleanup of an intruder who knows the switch's local log is the only record.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include logging`.

        If the output contains at least one `logging <server>` line, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To forward logs to a syslog server using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Add the syslog server, the VRF used to reach it, and the lowest severity to forward.
            3. Save the configuration.

            ```text
            configure terminal
            logging <server> severity info vrf mgmt
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-syslog-tls
    title: Ensure log messages are sent to syslog servers over TLS
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: aoscx.syslogServers.all(transport == "tls")
    docs:
      desc: |
        This check verifies that log messages cannot be read or altered on their way to the syslog server.

        AOS-CX sends syslog over UDP by default, and over TCP or TLS when the server is configured with `tcp` or `tls`. This check requires every syslog server to use TLS, and passes when no server is configured, which the remote syslog check reports separately.

        **Why this matters**

        UDP and TCP syslog travel in cleartext without integrity protection. Anyone on the path reads the user names, addresses, and commands in the log stream, and can drop or forge messages to hide activity or plant misleading entries. UDP delivery is also lossy, so messages vanish silently under load. TLS encrypts the stream, authenticates the server, and delivers reliably.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config | include logging`.

        If every `logging <server>` line includes `tls`, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To send syslog over TLS using the AOS-CX CLI:

            1. Configure the syslog server to accept TLS, and install a trust anchor profile for its CA on the switch.
            2. Connect to the switch over SSH or the console.
            3. Replace each server with a TLS definition, then save the configuration.

            ```text
            configure terminal
            no logging <server>
            logging <server> tls severity info vrf mgmt
            end
            write memory
            ```
    refs:
      - url: https://datatracker.ietf.org/doc/html/rfc5425
        title: RFC 5425 - Transport Layer Security (TLS) Transport Mapping for Syslog
  - uid: mondoo-aoscx-security-login-banner
    title: Ensure a pre-login banner is configured
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-9
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-8
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: aoscx.system.banner.motd != empty
    docs:
      desc: |
        This check verifies that the switch shows a notice to users before they log in.

        AOS-CX shows the message of the day, set with `banner motd`, before the login prompt on SSH and the console. This check requires the banner to be set.

        **Why this matters**

        A pre-login banner states that the system is for authorized use only and that activity is monitored. In many jurisdictions such a notice supports prosecution of unauthorized access and removes an intruder's claim that they did not know access was restricted. It also tells authorized users that their sessions are recorded. NIST SP 800-53 AC-8 requires a system use notification before access is granted.

        Keep the banner free of the switch's model, firmware, site, or owner, which only help an attacker.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show banner motd`.

        If a banner is displayed, the check passes. If it is empty, the check fails.
      remediation:
        - id: cli
          desc: |
            To set a pre-login banner using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Enter the banner text between two delimiter characters that do not appear in the text.
            3. Save the configuration.

            ```text
            configure terminal
            banner motd ^
            This system is for authorized use only. Activity is monitored and recorded.
            ^
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-https-certificate-valid
    title: Ensure the HTTPS server uses a valid, CA-signed certificate
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      aoscx.certificates.where(usage.contains("https-server")) != empty
      aoscx.certificates.where(usage.contains("https-server")).all(notAfter > time.now)
      aoscx.certificates.where(usage.contains("https-server")).all(selfSigned == false)
    docs:
      desc: |
        This check verifies that the Web UI and REST API present a certificate that clients can validate.

        AOS-CX serves HTTPS with the certificate associated through `crypto pki application https-server certificate <name>`, and otherwise with a self-signed certificate generated at first boot. This check requires a certificate to be associated with the HTTPS server, and every such certificate to be unexpired and issued by a certificate authority rather than self-signed. A switch with no associated certificate serves the factory self-signed one and fails.

        **Why this matters**

        A self-signed or expired certificate trains administrators and automation to accept certificate warnings or to disable validation, which most scripts and tools offer as an insecure mode. Once validation is off, an attacker on the path can present their own certificate, read the administrator's password and REST session cookie, and take over the session. A CA-signed certificate lets every client validate the switch and refuse an impostor.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show crypto pki application` to see which certificate the HTTPS server uses.
        3. Run `show crypto pki certificate <name> details` for that certificate.

        If a certificate is associated with the HTTPS server, its issuer differs from its subject, and its validity end date is in the future, the check passes. If no certificate is associated, or the certificate is self-signed or expired, the check fails.
      remediation:
        - id: cli
          desc: |
            To install a CA-signed HTTPS certificate using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Create a certificate entry, generate a signing request, and submit it to your certificate authority.
            3. Import the signed certificate, associate it with the HTTPS server, and save the configuration.

            ```text
            configure terminal
            crypto pki certificate <name>
            subject common-name <switch-fqdn>
            enroll terminal
            exit
            crypto pki application https-server certificate <name>
            end
            write memory
            ```

            Renew the certificate before it expires. A trust anchor profile for the issuing CA must exist on the switch before the signed certificate can be imported.
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-running-config-saved
    title: Ensure the running configuration is saved as the startup configuration
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-07
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-2
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc8-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: aoscx.runningConfig.savedToStartup == true
    docs:
      desc: |
        This check verifies that the configuration the switch is running is the one it will boot with.

        AOS-CX applies configuration changes immediately but keeps them only until the next reboot unless they are saved with `write memory`. This check requires the running configuration to equal the startup configuration.

        **Why this matters**

        An unsaved change has two failure modes. A hardening change that was never saved disappears at the next reboot or power loss, silently reopening the exposure it closed. An unsaved malicious or mistaken change can sit in the running configuration, invisible to anyone who reviews the saved configuration or backups. Either way, the configuration in your records is not the one running on the switch.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show running-config diff startup-config`...

        If there are no differences, the check passes. Any difference fails the check.
      remediation:
        - id: cli
          desc: |
            To save the running configuration using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Review the running configuration for unexpected changes.
            3. Save it as the startup configuration.

            ```text
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-vlan1-unused
    title: Ensure no active interface carries VLAN 1
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: aoscx.vlans.where(id == 1).all(interfaces.where(linkState == "up").length == 0)
    docs:
      desc: |
        This check verifies that VLAN 1, the default VLAN, carries no traffic.

        Every port on a factory-default AOS-CX switch is an access port in VLAN 1, and trunks allow VLAN 1 unless told otherwise. This check requires that no interface that is up uses VLAN 1 as its access or native VLAN or allows it on a trunk.

        **Why this matters**

        VLAN 1 is the VLAN every unconfigured port falls into, so any device plugged into a forgotten port lands in the same broadcast domain as everything else left in VLAN 1. When VLAN 1 is the native VLAN of a trunk, it is also the VLAN that double-tagging attacks hop from. Moving users and infrastructure into purpose-built VLANs, and leaving VLAN 1 empty, keeps an unknown device isolated.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show vlan 1`.

        If no interface that is up is listed as a member, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To move interfaces out of VLAN 1 using the AOS-CX CLI:

            1. Create the VLANs your devices belong in.
            2. Connect to the switch over SSH or the console.
            3. Assign each access port to its VLAN, and give trunks a different native VLAN without VLAN 1 in their allowed list, then save the configuration.

            ```text
            configure terminal
            vlan <id>
            name <name>
            exit
            interface <port>
            vlan access <id>
            exit
            interface <trunk>
            vlan trunk native <native-id>
            vlan trunk allowed <ids>
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
  - uid: mondoo-aoscx-security-unused-ports-shutdown
    title: Ensure physical ports without a link are administratively shut down
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: aoscx.interfaces.where(type == "system" && linkState == "down").all(adminState == "down")
    docs:
      desc: |
        This check verifies that physical ports with nothing connected are disabled until they are needed.

        AOS-CX enables ports with `no shutdown` and disables them with `shutdown`. This check requires every physical port whose link is down to be administratively down.

        **Why this matters**

        An enabled, unused port is an open invitation: anyone with physical access, a contractor, a visitor, or a rogue device in a meeting room, plugs in and gets a network connection, usually in VLAN 1 or whatever VLAN the port was last given. Shutting unused ports down means a new connection requires a configuration change, which is logged and reviewed.

        Ports that are expected to come up later, such as those for a phone or a printer, can be left enabled when the access they grant is otherwise controlled, for example by 802.1X port access.
      audit: |
        1. Connect to the switch over SSH or the console.
        2. Run `show interface brief`.

        If every physical port whose link status is down is also administratively down, the check passes. Otherwise it fails.
      remediation:
        - id: cli
          desc: |
            To shut down unused ports using the AOS-CX CLI:

            1. Connect to the switch over SSH or the console.
            2. Shut down each unused port, optionally as a range.
            3. Save the configuration.

            ```text
            configure terminal
            interface 1/1/10-1/1/24
            shutdown
            end
            write memory
            ```
    refs:
      - url: https://www.cisecurity.org/benchmark/aruba
        title: CIS HPE Aruba Networking Benchmarks
