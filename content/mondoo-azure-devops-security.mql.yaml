      - uid: mondoo-azure-devops-repository-security-prevent-policy-bypass-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-azure-devops-repository-security-prevent-policy-bypass-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-azure-devops-repository-security-prevent-policy-bypass-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no person or group can skip the repository's branch policies.

        Azure DevOps has two repository permissions for this, under Project Settings, Repositories, the repository, Security: **Bypass policies when pushing** and **Bypass policies when completing pull requests**. A holder of either can push past a required policy or complete a pull request that has not met it. Azure DevOps has no setting that applies branch policies to administrators as well, so these permissions are the only control. The check fails when any user or group other than a build or release service identity is allowed either permission at repository scope, including permissions the repository inherits from the project. The Terraform version of this check reads the `PolicyExempt` and `PullRequestBypassPolicy` keys of `permissions` on every `azuredevops_git_permissions` resource and requires that neither be `Allow`.

        A repository with no commits has no default branch yet, and an administrator-disabled repository accepts no pushes, so both pass.

        **Why this matters**

        Branch policies exist to hold for everyone. A bypass permission turns each required review and build into a suggestion for its holders, and those holders are typically the most privileged accounts in the project, which are also the most valuable to an attacker. Taking over one of them is then enough to merge an unreviewed change, with the pull request recorded as completed.

        Grant bypass to a build service identity only when a pipeline genuinely has to push to a protected branch, such as a release pipeline that tags or bumps versions, and grant it to no person. When a human needs to bypass a policy in an emergency, grant the permission temporarily and remove it afterwards.
      audit: |
        ### Audit via Console

        1. Open **Project settings** > **Repositories** and select the repository.
        2. Open the **Security** tab.
        3. Select each user and group in turn and review **Bypass policies when completing pull requests** and **Bypass policies when pushing**.

        If neither permission shows **Allow** or **Allow (inherited)** for any user or group other than build and release service identities, the check passes. Otherwise, the check fails.

        ### Audit via CLI

        1. Look up the project and repository GUIDs:

           ```bash
           az repos show --repository <repository> --project <project> --org https://dev.azure.com/<organization> --query "{PROJECT_ID: project.id, REPOSITORY_ID: id}"
           ```

        2. Set `PROJECT_ID` and `REPOSITORY_ID` to the two GUIDs it prints, then show the repository permissions of a group, such as Project Administrators:

           ```bash
           az devops security permission show --namespace-id 2e9eb7ed-3c0a-47d4-87c1-0ffdd275fd87 --subject <group-descriptor> --token "repoV2/$PROJECT_ID/$REPOSITORY_ID" --org https://dev.azure.com/<organization>
           ```

        Bit 128 is **Bypass policies when pushing** and bit 32768 is **Bypass policies when completing pull requests**. If neither is allowed for any user or group other than build and release service identities, the check passes. Otherwise, the check fails.
      remediation:
        - id: console
          desc: |
            To remove the bypass permissions using the Azure DevOps web portal:

            1. Open **Project settings** > **Repositories** and select the repository.
            2. Open the **Security** tab.
            3. For each user and group other than build and release service identities, set **Bypass policies when completing pull requests** and **Bypass policies when pushing** to **Deny**. Use **Deny** rather than **Not set** where the group inherits **Allow** from the project.

            For more details, see [Set Git repository permissions](https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions) in the Azure DevOps documentation.
        - id: terraform
          desc: |
            To deny both bypass permissions to a group using Terraform:

            ```hcl
            resource "azuredevops_git_permissions" "deny_bypass" {
              project_id    = azuredevops_project.example.id
              repository_id = azuredevops_git_repository.example.id
              principal     = data.azuredevops_group.project_administrators.id
              permissions = {
                PolicyExempt            = "Deny"
                PullRequestBypassPolicy = "Deny"
              }
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions
        title: Azure DevOps - Set Git repository permissions
  - uid: mondoo-azure-devops-repository-security-prevent-policy-bypass-azuredevops
    filters: asset.platform == "azuredevops-repo"
    mql: |
      azuredevops.repository.isEmpty == true ||
        azuredevops.repository.isDisabled == true ||
        azuredevops.repository.branches.where(isDefault == true).any(protectionRules.enforceAdminsEnabled == true)
  - uid: mondoo-azure-devops-repository-security-prevent-policy-bypass-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "azuredevops_git_permissions")
    mql: |
      terraform.resources("azuredevops_git_permissions").all(
        arguments["permissions"]["PolicyExempt"] != "Allow" &&
        arguments["permissions"]["PullRequestBypassPolicy"] != "Allow"
      )
  - uid: mondoo-azure-devops-repository-security-prevent-policy-bypass-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "azuredevops_git_permissions")
    mql: |
      terraform.plan.resourceChanges.where(type == "azuredevops_git_permissions").map(change.after).all(
        _["permissions"]["PolicyExempt"] != "Allow" &&
        _["permissions"]["PullRequestBypassPolicy"] != "Allow"
      )
  - uid: mondoo-azure-devops-repository-security-prevent-policy-bypass-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "azuredevops_git_permissions")
    mql: |
      terraform.state.resources.where(type == "azuredevops_git_permissions").map(values).all(
        _["permissions"]["PolicyExempt"] != "Allow" &&
        _["permissions"]["PullRequestBypassPolicy"] != "Allow"
      )
  - uid: mondoo-azure-devops-repository-security-prevent-force-pushes
    title: Ensure no user or group can force push to the repository
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-4
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-3
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-azuredevops
        tags:
          mondoo.com/filter-title: Azure DevOps Repository
          mondoo.com/filter-icon: azure-devops
      - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no person or group can rewrite the history of the repository.

        Azure DevOps grants this with the **Force push (rewrite history, delete branches and tags)** repository permission, under Project Settings, Repositories, the repository, Security. The check fails when any user or group other than a build or release service identity is allowed it at repository scope, including a grant the repository inherits from the project. The Project Administrators group holds it by default, so a repository whose permissions were never changed fails. The Terraform version of this check reads the `ForcePush` key of `permissions` on every `azuredevops_git_permissions` resource and requires that it not be `Allow`.

        A repository with no commits has no default branch yet, and an administrator-disabled repository accepts no pushes, so both pass.

        **Why this matters**

        A normal push adds to history. A force push replaces it, which lets its holder swap the content of an approved pull request after review, delete the commit that introduced a backdoor once it has run, or delete a branch or tag outright. Every fresh clone then shows the rewritten history, and the original commits survive only in the clones and pipelines that fetched them before.

        Azure DevOps applies the permission to the whole repository, so one grant covers the default branch, every release branch, and every tag. Branch policies do not stop it: a holder of Force push can still delete or rewrite any branch the policies do not lock.
      audit: |
        ### Audit via Console

        1. Open **Project settings** > **Repositories** and select the repository.
        2. Open the **Security** tab.
        3. Select each user and group in turn and review **Force push (rewrite history, delete branches and tags)**.

        If the permission does not show **Allow** or **Allow (inherited)** for any user or group other than build and release service identities, the check passes. Otherwise, the check fails.

        ### Audit via CLI

        1. Look up the project and repository GUIDs:

           ```bash
           az repos show --repository <repository> --project <project> --org https://dev.azure.com/<organization> --query "{PROJECT_ID: project.id, REPOSITORY_ID: id}"
           ```

        2. Set `PROJECT_ID` and `REPOSITORY_ID` to the two GUIDs it prints, then show the repository permissions of a group, such as Project Administrators:

           ```bash
           az devops security permission show --namespace-id 2e9eb7ed-3c0a-47d4-87c1-0ffdd275fd87 --subject <group-descriptor> --token "repoV2/$PROJECT_ID/$REPOSITORY_ID" --org https://dev.azure.com/<organization>
           ```

        Bit 8 is **Force push (rewrite history, delete branches and tags)**. If it is not allowed for any user or group other than build and release service identities, the check passes. Otherwise, the check fails.
      remediation:
        - id: console
          desc: |
            To remove force push using the Azure DevOps web portal:

            1. Open **Project settings** > **Repositories** and select the repository.
            2. Open the **Security** tab.
            3. For each user and group other than build and release service identities, set **Force push (rewrite history, delete branches and tags)** to **Deny**. Use **Deny** rather than **Not set** for Project Administrators, which inherit **Allow** from the project.

            For more details, see [Set Git repository permissions](https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions) in the Azure DevOps documentation.
        - id: terraform
          desc: |
            To deny force push to a group using Terraform:

            ```hcl
            resource "azuredevops_git_permissions" "deny_force_push" {
              project_id    = azuredevops_project.example.id
              repository_id = azuredevops_git_repository.example.id
              principal     = data.azuredevops_group.project_administrators.id
              permissions = {
                ForcePush = "Deny"
              }
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions
        title: Azure DevOps - Set Git repository permissions
  - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-azuredevops
    filters: asset.platform == "azuredevops-repo"
    mql: |
      azuredevops.repository.isEmpty == true ||
        azuredevops.repository.isDisabled == true ||
        azuredevops.repository.branches.where(isDefault == true).any(protectionRules.allowForcePushesEnabled == false)
  - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "azuredevops_git_permissions")
    mql: |
      terraform.resources("azuredevops_git_permissions").all(arguments["permissions"]["ForcePush"] != "Allow")
  - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "azuredevops_git_permissions")
    mql: |
      terraform.plan.resourceChanges.where(type == "azuredevops_git_permissions").map(change.after).all(_["permissions"]["ForcePush"] != "Allow")
  - uid: mondoo-azure-devops-repository-security-prevent-force-pushes-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "azuredevops_git_permissions")
    mql: |
      terraform.state.resources.where(type == "azuredevops_git_permissions").map(values).all(_["permissions"]["ForcePush"] != "Allow")
  - uid: mondoo-azure-devops-repository-security-service-hooks-use-https
    title: Ensure service hooks send repository events only over HTTPS
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-azuredevops
        tags:
          mondoo.com/filter-title: Azure DevOps Repository
          mondoo.com/filter-icon: azure-devops
      - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every service hook sending the repository's events to another system does so over an encrypted connection.

        Service hooks are configured per project, under Project Settings, Service hooks. A hook subscribes to events, such as a code push or a pull request update, for one repository or for every repository in the project, and posts each event to a URL. The check covers every hook with a target URL that names this repository or all repositories, and requires each URL to use `https`. The Terraform version of this check reads the `url` argument of every `azuredevops_servicehook_webhook_tfs` resource and requires it to start with `https://`.

        Reading service hooks requires the **View subscriptions** permission on the project, which the Readers group does not have. Without it, the check reports an error rather than passing on a list it cannot see.

        **Why this matters**

        Repository events describe the code: repository and branch names, commit messages, authors, changed paths, and pull request titles and descriptions. A hook that posts them over plain HTTP exposes all of it to anyone on the network path, along with any credential the hook sends, such as a basic authentication password or a token in a custom header. An attacker in that position can also alter or forge events, which matters when the receiving system triggers deployments from them.
      audit: |
        ### Audit via Console

        1. Open **Project settings** > **Service hooks**.
        2. For each subscription on a code or pull request event, open it and note its target URL and the repository it filters on.

        If every subscription that covers this repository posts to an `https://` URL, the check passes. Otherwise, the check fails.

        ### Audit via CLI

        1. List the service hook subscriptions of the organization:

           ```bash
           az devops invoke --area hooks --resource subscriptions --http-method GET --api-version 7.1 --org https://dev.azure.com/<organization> --query "value[].{event: eventType, url: consumerInputs.url}"
           ```

        If every subscription for this repository's project posts to an `https://` URL, the check passes. Otherwise, the check fails.
      remediation:
        - id: console
          desc: |
            To move a service hook to HTTPS using the Azure DevOps web portal:

            1. Open **Project settings** > **Service hooks**.
            2. Select the subscription and choose **Edit**.
            3. Change the URL to the receiving system's `https://` address, or delete the subscription if nothing uses it.
            4. Select **Test** to confirm the receiver accepts the request, then **Finish**.

            For more details, see [Create a service hook](https://learn.microsoft.com/en-us/azure/devops/service-hooks/create-subscription) in the Azure DevOps documentation.
        - id: terraform
          desc: |
            To send repository events over HTTPS using Terraform:

            ```hcl
            resource "azuredevops_servicehook_webhook_tfs" "push" {
              project_id = azuredevops_project.example.id
              url        = "https://hooks.example.com/azure-devops"

              git_push {
                repository_id = azuredevops_git_repository.example.id
              }
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/azure/devops/service-hooks/overview
        title: Azure DevOps - Integrate with service hooks
  - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-azuredevops
    filters: asset.platform == "azuredevops-repo"
    mql: |
      azuredevops.repository.webhooks.all(isHttps == true)
  - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "azuredevops_servicehook_webhook_tfs")
    mql: |
      terraform.resources("azuredevops_servicehook_webhook_tfs").all(arguments["url"] == /^https:\/\//)
  - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "azuredevops_servicehook_webhook_tfs")
    mql: |
      terraform.plan.resourceChanges.where(type == "azuredevops_servicehook_webhook_tfs").map(change.after).all(_["url"] == /^https:\/\//)
  - uid: mondoo-azure-devops-repository-security-service-hooks-use-https-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "azuredevops_servicehook_webhook_tfs")
    mql: |
      terraform.state.resources.where(type == "azuredevops_servicehook_webhook_tfs").map(values).all(_["url"] == /^https:\/\//)
