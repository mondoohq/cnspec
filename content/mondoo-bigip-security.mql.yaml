policies:
  - uid: mondoo-bigip-security
    name: Mondoo F5 BIG-IP Security
    version: 1.0.4
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: bigip,networkdevice
    require:
      - provider: bigip
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure F5 BIG-IP device configurations
    docs:
      desc: |
        The Mondoo F5 BIG-IP Security policy identifies critical misconfigurations on F5 BIG-IP application delivery controllers that could leave your application traffic vulnerable to interception, downgrade, or unauthorized access. This policy helps organizations detect and remediate hardening gaps before they can be exploited, reducing the likelihood of TLS downgrade attacks, certificate compromise, and unauthorized administrative access.

        This policy provides security checks across key BIG-IP areas, uncovering misconfigurations that could weaken application delivery security:

        - **SSL/TLS certificates**: Validity, expiration, and cryptographic strength
        - **SSL/TLS profiles**: Client and server profiles, cipher suites, and authentication
        - **Network security**: VLAN source checking, route domain isolation, and SNMP access restrictions

        Learn more about scanning F5 BIG-IP in the [cnspec F5 BIG-IP documentation](https://mondoo.com/docs/cnspec/network/bigip).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).

    groups:
      - title: SSL/TLS Certificates
        filters: asset.platform == "bigip"
        checks:
          - uid: mondoo-bigip-security-certificates-not-expired
          - uid: mondoo-bigip-security-certificates-strong-key-size
          - uid: mondoo-bigip-security-keys-strong-key-size
      - title: SSL/TLS Profiles
        filters: asset.platform == "bigip"
        checks:
          - uid: mondoo-bigip-security-client-ssl-secure-ciphers
          - uid: mondoo-bigip-security-server-ssl-secure-ciphers
          - uid: mondoo-bigip-security-server-ssl-authenticate-backend
      - title: Network Security
        filters: asset.platform == "bigip"
        checks:
          - uid: mondoo-bigip-security-vlan-source-checking
          - uid: mondoo-bigip-security-route-domain-strict-isolation
          - uid: mondoo-bigip-security-snmp-restricted-access
queries:
  - uid: mondoo-bigip-security-certificates-not-expired
    title: Ensure SSL certificates are not expired
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      bigip.certificates.none(
        expirationDate != 0 && expirationDate < time.now.unix
      )
    docs:
      desc: |
        This check verifies that every SSL certificate installed on the BIG-IP is still within its validity period.

        The BIG-IP terminates TLS for the applications behind it, so the certificates in its traffic certificate store are the ones clients validate before they trust the site. Review and replace them under **System > Certificate Management > Traffic Certificate Management > SSL Certificate List**, or list them with `tmsh list sys crypto cert`. The check fails any certificate whose expiration date has already passed.

        **Why this matters**

        When a certificate expires, every client that validates properly refuses the connection. Browsers interrupt with a full-page interstitial, and API clients, mobile apps, and service-to-service callers simply fail the handshake. Each virtual server bound to that certificate stops serving traffic, and the failure arrives all at once for everyone.

        The dangerous part is the response to that outage. Under pressure, operators turn validation off rather than fix the certificate: users are told to click through, scripts gain a flag that skips verification, and integrations get certificate checking disabled to restore service. Once that happens an attacker positioned on the path presents a self-signed certificate of their own and the client accepts it, so the attacker reads and rewrites session cookies, authorization headers, and request bodies for as long as the workaround stays in place. The expiration turns a cryptographic guarantee into a prompt someone dismisses.

        Recurring expirations also destroy the warning's value. A population trained to click past certificate errors every few months has no way to react differently to the one raised by a real interception, so the control that was supposed to detect impersonation stops functioning as a signal.

        An expired certificate is also an ownership signal. A certificate nobody renewed is a certificate nobody is monitoring, while its private key is still installed on the device and present in every configuration backup taken since.

        Track renewal well ahead of expiry and install the replacement under the existing certificate object name so SSL profiles keep resolving it without edits. If a certificate has expired because the service it fronted was retired, delete the unused certificate and its key rather than leaving them installed.
      audit: |
        ### Audit via the BIG-IP Configuration utility

        1. Log in to the BIG-IP Configuration utility.
        2. Navigate to **System → Certificate Management → Traffic Certificate Management → SSL Certificate List**.
        3. Review the **Expiration** column for every certificate in the list.

        If every certificate shows a future expiration date, the device passes. If any certificate shows an expiration date in the past, the device fails.

        ### Audit via tmsh

        1. Open an SSH session to the BIG-IP and enter the tmsh shell.
        2. List the installed certificates and their expiration dates:

           ```text
           tmsh list sys crypto cert
           ```
        3. Compare the `expiration` value reported for each certificate against the current date.

        If every certificate expires in the future, the device passes. If any certificate has an expiration date in the past, the device fails.
      remediation:
        - id: console
          desc: |
            To replace expired certificates using the BIG-IP Configuration utility:

            1. Navigate to **System → Certificate Management → Traffic Certificate Management → SSL Certificate List**
            2. Identify any expired certificates by checking the expiration date
            3. For each expired certificate, generate a new CSR or import a renewed certificate:
               - Click the certificate name
               - Click **Renew** to generate a new CSR, or **Import** to upload a renewed certificate
            4. If you import the renewed certificate under the same name, existing SSL profiles continue to reference it automatically. If you import it under a new name, update every SSL profile that references the old certificate.
        - id: cli
          desc: |
            To replace expired certificates using tmsh:

            1. Open an SSH session to the BIG-IP and enter the tmsh shell.
            2. List certificates and their expiration dates:

               ```text
               tmsh list sys crypto cert
               ```
            3. Install the renewed certificate over the existing object name so SSL profiles keep referencing it:

               ```text
               tmsh install sys crypto cert <name> from-local-file <path>
               ```
            4. If the renewal was issued for a new key pair, install the new key as well:

               ```text
               tmsh install sys crypto key <name> from-local-file <key-path>
               ```
            5. Save the configuration so the change persists across reboots and failovers:

               ```text
               tmsh save sys config
               ```
    refs:
      - url: https://my.f5.com/manage/s/article/K14318
        title: F5 - Managing SSL certificates
      - url: https://my.f5.com/manage/s/article/K6353
        title: F5 - Updating SSL certificates

  - uid: mondoo-bigip-security-certificates-strong-key-size
    title: Ensure SSL certificates use strong key sizes
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      bigip.certificates.all(keySize >= 2048 || keyType.downcase.contains("ec") && keySize >= 256)
    docs:
      desc: |
        This check verifies that the certificates the BIG-IP presents are backed by keys strong enough to resist recovery through factoring.

        Key type and size are fixed when the key and certificate signing request are generated, and they travel with the issued certificate for its whole life. Inspect them under **System > Certificate Management > Traffic Certificate Management > SSL Certificate List** by opening a certificate and reading its **Key Type** and **Key Size**, or run `tmsh list sys crypto cert all-properties`. The check requires an RSA key of at least 2048 bits, or an elliptic curve key of at least 256 bits.

        **Why this matters**

        RSA moduli of 1024 bits and below are within reach of well-resourced attackers, which is why NIST SP 800-131A withdrew them and no public certificate authority will issue against one. An attacker who factors the modulus obtains the private key without ever touching the device, without triggering a login, and without leaving anything in a log. Because the BIG-IP is the TLS termination point, that single key covers every application behind the virtual servers that use it.

        With the key in hand, the attacker decrypts recorded sessions that used RSA key exchange and reads whatever was in them, then stands up a server that presents the site's own valid, unexpired, publicly trusted certificate. Clients see no warning, because nothing about the certificate is wrong. Detection is close to impossible: the break happened offline, and the device has no event to report.

        A certificate below 2048 bits in a current configuration almost always arrives from an internal certificate authority or from configuration carried forward across upgrades for a decade. Where one exists, the surrounding key material usually was not rotated either, so the finding is worth treating as a prompt to review the whole store rather than a single object.

        Replacing the key means re-issuing the certificate, so coordinate with the issuing certificate authority and update every SSL profile that references the old object before removing it. Where the client population includes embedded devices that cannot negotiate elliptic curve suites, a 2048-bit RSA key satisfies this check without cutting those clients off.
      audit: |
        ### Audit via the BIG-IP Configuration utility

        1. Log in to the BIG-IP Configuration utility.
        2. Navigate to **System → Certificate Management → Traffic Certificate Management → SSL Certificate List**.
        3. Click each certificate name and review the **Key Type** and **Key Size** values on the certificate properties page.

        If every certificate uses an RSA key of at least 2048 bits or an elliptic curve key of at least 256 bits, the device passes. If any certificate falls below these thresholds, the device fails.

        ### Audit via tmsh

        1. Open an SSH session to the BIG-IP and enter the tmsh shell.
        2. List the installed certificates with all of their properties:

           ```text
           tmsh list sys crypto cert all-properties
           ```
        3. Inspect the `key-size` and `key-type` values reported for each certificate.

        If every certificate uses an RSA key of at least 2048 bits or an elliptic curve key of at least 256 bits, the device passes. If any certificate falls below these thresholds, the device fails.
      remediation:
        - id: console
          desc: |
            To re-issue certificates with strong keys using the BIG-IP Configuration utility:

            1. Navigate to **System → Certificate Management → Traffic Certificate Management → SSL Certificate List**
            2. Identify certificates with RSA key sizes below 2048 bits
            3. For each weak certificate, generate a new key and CSR:
               - Click **Create**
               - Set the **Key Type** to RSA with a **Key Size** of 2048 or higher, or to ECDSA with a curve of P-256 or stronger
               - Complete the CSR fields and submit the CSR to your certificate authority
            4. Import the issued certificate and update every SSL profile that references the weak certificate
        - id: cli
          desc: |
            To re-issue certificates with strong keys using tmsh:

            1. Open an SSH session to the BIG-IP and enter the tmsh shell.
            2. Identify weak certificates:

               ```text
               tmsh list sys crypto cert all-properties
               ```
            3. Generate a new key and CSR with a 2048-bit key:

               ```text
               tmsh create sys crypto key <name> key-size 2048
               tmsh create sys crypto csr <name> key <name> common-name <cn>
               ```
            4. Submit the CSR to your certificate authority, then install the issued certificate:

               ```text
               tmsh install sys crypto cert <name> from-local-file <path>
               ```
            5. Update every SSL profile that references the old certificate, then save the configuration:

               ```text
               tmsh save sys config
               ```
    refs:
      - url: https://my.f5.com/manage/s/article/K14318
        title: F5 - Managing SSL certificates
      - url: https://csrc.nist.gov/pubs/sp/800/131/a/r2/final
        title: NIST SP 800-131A Rev. 2 - Transitioning the Use of Cryptographic Algorithms

  - uid: mondoo-bigip-security-keys-strong-key-size
    title: Ensure SSL keys use strong key sizes
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      bigip.keys.all(keySize >= 2048 || keyType.downcase.contains("ec") && keySize >= 256)
    docs:
      desc: |
        This check verifies that every SSL private key stored on the BIG-IP is large enough to resist recovery by an attacker who never touches the device.

        The key store holds every private key the device has generated or imported, including keys whose certificates have since been replaced and keys that were generated for a request that was never issued. Inspect them under **System > Certificate Management > Traffic Certificate Management > SSL Certificate List** on the **Key** tab of each object, or run `tmsh list sys crypto key all-properties`. The check requires an RSA key of at least 2048 bits, or an elliptic curve key of at least 256 bits.

        **Why this matters**

        The private key is the entirety of the device's cryptographic identity. Anyone who reconstructs it can decrypt traffic that was captured months earlier and encrypted under RSA key exchange, and can impersonate the site to any client that trusts the matching certificate. On a BIG-IP that means the plaintext of every application behind the affected virtual servers, because the device is where the encryption ends.

        Weak keys stay exploitable after their certificate has been swapped out. The old certificate is public, recorded in certificate transparency logs, and remains valid until it expires or is revoked, so an attacker who breaks the key can pair it with that certificate and be trusted by clients regardless of what the device is currently serving. Auditing only the certificate list misses these keys entirely, which is why the key store is examined on its own.

        Key reuse spreads the problem. When an operator generates a new signing request, selecting an existing key object is easier than creating one, so a single undersized key can be carried into renewal after renewal and end up behind several certificates that each look independently fine.

        Retiring a key that a certificate depends on means re-issuing that certificate, so start with the keys that have no current certificate; those can be deleted outright. For the rest, generate the replacement key and certificate together, repoint the SSL profiles, and delete the old key once nothing references it.
      audit: |
        ### Audit via the BIG-IP Configuration utility

        1. Log in to the BIG-IP Configuration utility.
        2. Navigate to **System → Certificate Management → Traffic Certificate Management → SSL Certificate List**.
        3. Click each entry whose **Contents** column includes a key, then click the **Key** tab on the object's properties page and review the **Type** and **Size** values.

        If every RSA key is at least 2048 bits and every elliptic curve key is at least 256 bits, the device passes. If any key falls below these thresholds, the device fails.

        ### Audit via tmsh

        1. Open an SSH session to the BIG-IP and enter the tmsh shell.
        2. List the installed keys with all of their properties:

           ```text
           tmsh list sys crypto key all-properties
           ```
        3. Inspect the `key-size` and `key-type` values reported for each key.

        If every RSA key is at least 2048 bits and every elliptic curve key is at least 256 bits, the device passes. If any key falls below these thresholds, the device fails.
      remediation:
        - id: console
          desc: |
            To replace weak SSL keys using the BIG-IP Configuration utility:

            1. Navigate to **System → Certificate Management → Traffic Certificate Management → SSL Certificate List**
            2. Click each entry whose **Contents** column includes a key
            3. Click the **Key** tab on the object's properties page and review the **Size** value
            4. For each RSA key smaller than 2048 bits, create a replacement key and CSR with a key size of at least 2048 bits
            5. Re-issue the associated certificate with the new key, import it, and update every SSL profile that references the old key
        - id: cli
          desc: |
            To replace weak SSL keys using tmsh:

            1. Open an SSH session to the BIG-IP and enter the tmsh shell.
            2. List existing keys to identify weak ones:

               ```text
               tmsh list sys crypto key
               ```
            3. Generate a new 2048-bit key and a CSR for it:

               ```text
               tmsh create sys crypto key <name> key-size 2048
               tmsh create sys crypto csr <name> key <name> common-name <cn>
               ```
            4. Re-issue the associated certificate with the new key, install it, update every SSL profile that references the old key, and save the configuration:

               ```text
               tmsh save sys config
               ```
    refs:
      - url: https://my.f5.com/manage/s/article/K14318
        title: F5 - Managing SSL certificates
      - url: https://csrc.nist.gov/pubs/sp/800/131/a/r2/final
        title: NIST SP 800-131A Rev. 2 - Transitioning the Use of Cryptographic Algorithms

  - uid: mondoo-bigip-security-client-ssl-secure-ciphers
    title: Ensure client SSL profiles use secure ciphers
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      bigip.clientSslProfiles.none(
        ciphers.downcase.split(":").any(_ == /^(rc4|des|3des|null|export)/)
      )
    docs:
      desc: |
        This check verifies that the TLS suites the BIG-IP offers to clients exclude the ones with practical, published breaks.

        A client SSL profile carries the cipher string or cipher group that a virtual server uses when negotiating with clients. Set it under **Local Traffic > Profiles > SSL > Client** with the **Configuration** selector on **Advanced**, or with `tmsh modify ltm profile client-ssl`. The check fails any profile whose cipher list admits RC4, DES, 3DES, NULL, or EXPORT suites.

        **Why this matters**

        RC4 leaks its plaintext through keystream biases. An attacker who can make a browser repeat a request many times, typically by running script in a page under the same origin, recovers a session cookie byte by byte from passively captured ciphertext and then replays it as the user. RFC 7465 prohibits RC4 in TLS for exactly this reason.

        DES and 3DES encrypt in 64-bit blocks, and SWEET32 turns that into plaintext recovery once enough data flows over one connection. An attacker who can keep a long-lived keep-alive connection busy reaches the required volume in hours on a fast link, then extracts the repeated secret in that stream, which in practice is the authentication cookie sent with every request.

        NULL suites negotiate authentication with no encryption at all, so anyone able to see the traffic reads the session as clear text. EXPORT suites are worse than legacy: their 512-bit RSA and Diffie-Hellman parameters were deliberately crippled and can be broken on rented compute in hours. FREAK and Logjam showed that an attacker on the path can force a handshake down into an EXPORT suite even when client and server both prefer strong ones, so merely leaving those suites enabled in the profile is enough. The client never has to ask for them.

        Narrowing a cipher list removes clients that could only negotiate what was removed, so review the negotiated-suite distribution for the affected virtual servers first and stage the change in a maintenance window. On releases that support cipher groups, building the profile from F5's `f5-secure` rule is the more durable form, because the group tracks F5's list rather than freezing a string at the moment it was typed.
      audit: |
        ### Audit via the BIG-IP Configuration utility

        1. Log in to the BIG-IP Configuration utility.
        2. Navigate to **Local Traffic → Profiles → SSL → Client**.
        3. Click each client SSL profile and review the **Ciphers** field for `RC4`, `DES`, `3DES`, `NULL`, or `EXPORT` entries.

        If no client SSL profile permits these weak ciphers, the device passes. If any profile permits RC4, DES, NULL, or EXPORT ciphers, the device fails.

        ### Audit via tmsh

        1. Open an SSH session to the BIG-IP and enter the tmsh shell.
        2. List the cipher string configured on each client SSL profile:

           ```text
           tmsh list ltm profile client-ssl ciphers
           ```
        3. Inspect each cipher string for `RC4`, `DES`, `3DES`, `NULL`, or `EXPORT` entries.

        If no client SSL profile permits these weak ciphers, the device passes. If any profile permits RC4, DES, NULL, or EXPORT ciphers, the device fails.
      remediation:
        - id: console
          desc: |
            The most maintainable approach on BIG-IP 13.0 and later is a cipher group built from F5's `f5-secure` cipher rule, which represents the cipher string `ECDHE:RSA:!SSLV3:!RC4:!EXP:!DES` and so excludes every suite this check flags. To configure one using the BIG-IP Configuration utility:

            1. Navigate to **Local Traffic → Ciphers → Groups** and click **Create**
            2. Give the group a name, add the `f5-secure` rule to the **Allowed** column, and click **Finished**
            3. Navigate to **Local Traffic → Profiles → SSL → Client** and click the affected profile
            4. Set the **Configuration** selector to **Advanced**
            5. In the **Ciphers** setting, select **Cipher Group** and choose the group you created
            6. Click **Update**

            `f5-secure` removes the weak suites but still permits RSA key exchange and AES-CBC suites. For a stricter posture, select **Cipher String** instead of **Cipher Group** and enter a list restricted to AES-GCM suites, for example `ECDHE+AES-GCM:DHE+AES-GCM`. Prefer GCM, an authenticated AEAD mode, over the older CBC suites such as `ECDHE+AES` or `DHE+AES`. GCM authenticates the ciphertext as part of decryption, which closes the padding-oracle and timing weaknesses such as BEAST and Lucky 13 that affect CBC suites in TLS.

            **Note**: Clients that support only the removed cipher suites can no longer connect to virtual servers using this profile. Validate the change against your client population in a maintenance window.
        - id: cli
          desc: |
            On BIG-IP 13.0 and later, the recommended approach is a cipher group built from F5's `f5-secure` cipher rule, which represents the cipher string `ECDHE:RSA:!SSLV3:!RC4:!EXP:!DES` and so excludes every suite this check flags:

            1. Open an SSH session to the BIG-IP and enter the tmsh shell.
            2. Create a cipher group that allows the `f5-secure` rule:

               ```text
               tmsh create ltm cipher group secure-gcm allow add { f5-secure }
               ```
            3. Attach the cipher group to the client SSL profile. The `ciphers none` argument clears any inline cipher string so the group takes effect:

               ```text
               tmsh modify ltm profile client-ssl <profile-name> cipher-group secure-gcm ciphers none
               ```
            4. Confirm the group resolves to the expected suites and that no weak suites remain:

               ```text
               tmsh show ltm cipher group secure-gcm
               ```
            5. Save the configuration:

               ```text
               tmsh save sys config
               ```

            `f5-secure` removes the weak suites but still permits RSA key exchange and AES-CBC suites. If your release does not support cipher groups, or you want a stricter posture, set an inline cipher string restricted to AES-GCM suites instead with `tmsh modify ltm profile client-ssl <profile-name> ciphers 'ECDHE+AES-GCM:DHE+AES-GCM'`, then verify the expansion with `tmm --clientciphers 'ECDHE+AES-GCM:DHE+AES-GCM'`. Prefer GCM, an authenticated AEAD mode, over CBC suites such as `ECDHE+AES` or `DHE+AES`. GCM authenticates the ciphertext during decryption, which closes the padding-oracle and timing weaknesses such as BEAST and Lucky 13 that affect CBC suites in TLS.
    refs:
      - url: https://my.f5.com/manage/s/article/K13156
        title: F5 - Configuring the cipher strength for SSL profiles
      - url: https://tools.ietf.org/html/rfc7465
        title: RFC 7465 - Prohibiting RC4 Cipher Suites

  - uid: mondoo-bigip-security-server-ssl-secure-ciphers
    title: Ensure server SSL profiles use secure ciphers
    impact: 85
