  - uid: eol-ha-addon
    title: Ensure EOL Chef HA add-on package is not installed
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      package("chef-ha").installed == false
    docs:
      desc: |
        This check verifies that the deprecated Chef HA add-on is not installed.

        The `chef-ha` package provided active and passive failover for Chef Infra Server using DRBD to replicate the underlying block device between two hosts, with keepalived moving a virtual IP address between them. It was superseded by Chef Backend and by external PostgreSQL clustering, and it is no longer maintained. The check requires that the package is absent.

        **Why this matters**

        DRBD replicates raw blocks, not API calls, so the replication link carries the server's database and cookbook store in a form that has no relationship to Chef's authentication or authorization. Anything that can reach the replication port can read or corrupt that volume without ever presenting a key to Chef Infra Server, and the packaged DRBD and keepalived receive no fixes for whatever is found in them.

        keepalived adds a second exposure on the local segment. Its failover election trusts the segment it runs on, so a host that can inject on that network can claim the virtual IP and become the Chef Infra Server the fleet talks to. That is a position from which cookbooks are served, and cookbooks execute as `root` on every node.

        Split-brain is the operational half of the same problem. When both nodes believe they are primary, the two copies of the database diverge, and the reconciliation is manual with no support path behind it. Migrate to Chef Backend or to an external PostgreSQL cluster and remove the package.
      audit: |
        Run the following command to check whether the Chef HA add-on is installed:

        ```bash
        dpkg -l | grep chef-ha || rpm -qa | grep chef-ha
        ```

        If the command returns no output, the add-on is not installed and the check passes. If a package line is printed, the deprecated add-on is present and the check fails.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            **Important**: Before removing Chef HA, migrate to a supported high availability solution such as Chef Backend or an external PostgreSQL cluster. Removing DRBD replication from an active failover pair without a migration plan can cause an outage or data loss.

            1. Stop the HA services before removing the package. The Chef HA add-on has no dedicated ctl uninstall command, so unlike the other add-ons nothing stops its services for you; removing the package while keepalived or DRBD replication is active can pull files out from under running processes.

            ```bash
            chef-server-ctl stop keepalived
            ```

            Confirm DRBD is not active on the node (for example with `drbdadm status`) before continuing.

            2. Remove the package with your platform package manager.

            On Debian and Ubuntu systems:

            ```bash
            dpkg -P chef-ha
            ```

            On Red Hat family systems:

            ```bash
            rpm -e chef-ha
            ```

            3. Regenerate the server configuration:

            ```bash
            chef-server-ctl reconfigure
            ```

            4. Verify the package is removed:

            ```bash
            dpkg -l | grep chef-ha || rpm -qa | grep chef-ha
            ```

            **Note**: Running `chef-server-ctl reconfigure` restarts server services and briefly interrupts client requests. Do not run `chef-server-ctl uninstall`; that command removes the entire Chef Infra Server application.
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this recipe code to uninstall the Chef HA package:

            ```ruby
            package 'chef-ha' do
              action :remove
              notifies :run, 'execute[reconfigure chef server]', :immediately
            end

            execute 'reconfigure chef server' do
              command 'chef-server-ctl reconfigure'
              action :nothing
            end
            ```
