      - url: https://docs.chef.io/server/
        title: Chef Infra Server Documentation
  - uid: secure-tls-only
    title: Ensure TLS versions before 1.2 are disabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      file("/var/opt/opscode/nginx/etc/chef_https_lb.conf").content.contains(/ssl_protocols TLSv1\.2( TLSv1\.3)?;/)
    docs:
      desc: |
        This check verifies that Chef Infra Server accepts only TLS 1.2 or later.

        Every HTTPS connection to the server terminates at its bundled nginx: client converges, `knife`, direct API use, and the management console. The protocol list is generated into `/var/opt/opscode/nginx/etc/chef_https_lb.conf` from `nginx['ssl_protocols']` in `chef-server.rb`. The check requires that list to be TLS 1.2, optionally with TLS 1.3, and nothing older.

        **Why this matters**

        TLS 1.0 and 1.1 depend on MD5 and SHA-1 in the handshake and on CBC constructions that BEAST and Lucky 13 target directly. Their presence is exploitable even when both sides would prefer something modern, because an on-path attacker can force the negotiation down to the weakest version offered. Removing them from the list is what makes the downgrade fail rather than succeed.

        What crosses this port makes the difference concrete. Node data, `knife` requests carrying data bag contents, and cookbook downloads all travel here, and the cookbooks are executed as `root` by the node that receives them. An attacker who breaks or manipulates the session is not reading logs, they are choosing what the fleet runs.

        The generated nginx configuration is overwritten on every `chef-server-ctl reconfigure`, so editing it in place does not survive. Set `nginx['ssl_protocols']` in `/etc/opscode/chef-server.rb` and reconfigure. Confirm first that any old `knife` workstations and clients in the estate can negotiate TLS 1.2, because they will lose access at the moment the older protocols are withdrawn.
      audit: |
        Run the following command to check the TLS protocols offered by the nginx front end:

        ```bash
        grep ssl_protocols /var/opt/opscode/nginx/etc/chef_https_lb.conf
        ```

        If the output shows `ssl_protocols TLSv1.2;` or `ssl_protocols TLSv1.2 TLSv1.3;`, only modern TLS is offered and the check passes. If TLS 1.0 or 1.1 is listed, or the directive is missing, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            The reliable fix is to explicitly restrict the protocols nginx offers. A default-driven TLS version is not enough: even on releases that default to TLS 1.2, the server can still negotiate TLS 1.0 and 1.1 unless you remove them explicitly. Setting `nginx['ssl_protocols']` guarantees that only the protocols you list are offered, which is exactly what this check verifies.

            1. Edit `/etc/opscode/chef-server.rb` and add one of the following:

            ```ruby
            # On releases that support TLS 1.3:
            nginx['ssl_protocols'] = 'TLSv1.2 TLSv1.3'

            # On older releases without TLS 1.3 support:
            nginx['ssl_protocols'] = 'TLSv1.2'
            ```

            2. Reconfigure the server:

            ```bash
            chef-server-ctl reconfigure
            ```

            3. Verify the configuration:

            ```bash
            grep ssl_protocols /var/opt/opscode/nginx/etc/chef_https_lb.conf
            ```

            Keeping Chef Infra Server on a current, supported release is a baseline that ships sensible TLS defaults and security fixes, but it does not replace the explicit `ssl_protocols` restriction above. Apply both.

            **Note**: Reconfiguring restarts the nginx front end and briefly interrupts client connections, so schedule this during a maintenance window. Ensure all Chef Infra Clients support TLS 1.2. Clients older than version 12.0 may need to be upgraded.
        - id: chef
          desc: |
            **Using Chef Infra**

            If you manage your Chef Infra Server configuration with Chef, use a `ruby_block` to safely append the setting without overwriting existing configuration:

            ```ruby
            ruby_block 'configure TLS 1.2 in chef-server.rb' do
              block do
                file = Chef::Util::FileEdit.new('/etc/opscode/chef-server.rb')
                file.insert_line_if_no_match(/nginx\['ssl_protocols'\]/, "nginx['ssl_protocols'] = 'TLSv1.2'")
                file.write_file
              end
              notifies :run, 'execute[reconfigure chef server]', :immediately
            end

            execute 'reconfigure chef server' do
              command 'chef-server-ctl reconfigure'
              action :nothing
            end
            ```

            **Note**: Do not use a `file` resource with `content` here, as it would overwrite the entire chef-server.rb file and erase any existing configuration.
    refs:
      - url: https://docs.chef.io/server/config_rb_server_optional_settings/
        title: Chef Infra Server Optional Configuration Settings
  - uid: disable-insecure-addon-compat
    title: Disable insecure_addon_compat feature
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      file("/etc/opscode/chef-server.rb").content.contains("insecure_addon_compat false")
    docs:
      desc: |
        This check verifies that Chef Infra Server keeps its credentials only in the encrypted secrets store.

        Since version 12.14 the server holds its generated credentials in `/etc/opscode/private-chef-secrets.json`. The `insecure_addon_compat` setting in `chef-server.rb` controls a backward compatibility mode that additionally writes those same credentials into the individual service configuration files in cleartext, so that older add-ons which only knew how to read them there keep working. The mode is on by default. The check requires `insecure_addon_compat false`.

        **Why this matters**

        With the mode enabled, the same database passwords and service tokens exist in several files at once, under different owners and different modes. Locking down the secrets store then protects nothing, because the same values are sitting in a service configuration file next to it. Security becomes whichever copy has the loosest permissions, and that copy is generated automatically on every reconfigure.

        The duplicates are also what get collected by accident. Backups, support bundles gathered for a vendor ticket, and configuration management repositories that manage `/etc/opscode` all pick up service configuration files as a matter of course, and each copy carries the credentials out of the server with them. One deliberately protected secrets file is a far easier thing to reason about than five incidental copies.

        Turning the mode off requires that no legacy add-on still depends on the old layout, so remove the deprecated add-ons first. Companion checks in this policy cover those packages, and running `chef-server-ctl reconfigure` after the change is what regenerates the service configuration without the embedded secrets.
      audit: |
        Run the following command to check whether the insecure compatibility mode is disabled:

        ```bash
        grep insecure_addon_compat /etc/opscode/chef-server.rb
        ```

        If the output shows `insecure_addon_compat false`, the legacy secrets mode is disabled and the check passes. If the line is absent or set to `true`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. First, ensure all your Chef add-ons are updated to versions that support secure secrets:
               - Chef Manage: 2.5.0 or later
               - Chef Automate: Any currently supported version

            2. Edit `/etc/opscode/chef-server.rb` and add:

            ```ruby
            insecure_addon_compat false
            ```

            3. Reconfigure the server:

            ```bash
            chef-server-ctl reconfigure
            ```

            4. Verify the setting is applied by checking that no errors occur and add-ons continue to function.

            **Important**: Test this change in a non-production environment first to ensure all add-ons are compatible.
        - id: chef
          desc: |
            **Using Chef Infra**

            If you manage your Chef Infra Server configuration with Chef, use a `ruby_block` to safely append the setting without overwriting existing configuration:

            ```ruby
            ruby_block 'disable insecure addon compat' do
              block do
                file = Chef::Util::FileEdit.new('/etc/opscode/chef-server.rb')
                file.insert_line_if_no_match(/insecure_addon_compat/, 'insecure_addon_compat false')
                file.write_file
              end
              notifies :run, 'execute[reconfigure chef server]', :immediately
            end

            execute 'reconfigure chef server' do
              command 'chef-server-ctl reconfigure'
              action :nothing
            end
            ```

            **Note**: Do not use a `file` resource with `content` here, as it would overwrite the entire chef-server.rb file and erase any existing configuration.
    refs:
      - url: https://docs.chef.io/server/config_rb_server_optional_settings/
        title: Chef Infra Server Optional Configuration Settings
  - uid: postgresql-not-externally-accessible
    title: Ensure embedded PostgreSQL is not bound to external interfaces
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      file("/etc/opscode/chef-server.rb") {
        content.contains(/postgresql\['listen_address'\]\s*=\s*['"](0\.0\.0\.0|\*)['"]/) == false
        content.contains(/postgresql\['vip'\]\s*=\s*['"]0\.0\.0\.0['"]/) == false
      }
    docs:
      desc: |
        This check verifies that Chef Infra Server's embedded database is reachable only from the server itself.

        The bundled PostgreSQL instance holds everything the server knows: users, organizations, clients and their public keys, node objects with their run lists and attributes, data bag items, and the authorization graph. `postgresql['listen_address']` and `postgresql['vip']` in `/etc/opscode/chef-server.rb` determine what it binds to, and the default is the loopback interface. The check fails when either is set to `0.0.0.0` or `*`.

        **Why this matters**

        Binding to all interfaces puts port 5432 on every network the host touches, which usually includes the one the entire managed fleet sits on. The database is where the server's authorization decisions are stored, not where they are enforced, so a client that connects directly is not subject to them at all. It can read data bag items outright, take encrypted ones away as ciphertext to attack offline, replace a user's public key with its own, or edit a node's run list so that node executes attacker-chosen cookbooks as `root` at the next converge.

        None of that appears in the Chef API request log, because none of it is an API request. The monitoring and audit trail that an operator would look at to reconstruct an incident describes a different interface entirely.

        Multi-server deployments that use an external PostgreSQL are a legitimate exception. There the database is a separate host by design and access is constrained at the network layer with security groups or firewall rules, so this setting on the Chef Infra Server host is not what governs the exposure.
      audit: |
        Run the following command to check whether the embedded PostgreSQL service is bound to all interfaces:

        ```bash
        grep -E "postgresql\['(listen_address|vip)'\]" /etc/opscode/chef-server.rb
        ```

        If the command returns no output, or the configured address is `127.0.0.1` or `localhost`, the database is not exposed and the check passes. If a `postgresql['listen_address']` line is set to `0.0.0.0` or `*`, or a `postgresql['vip']` line is set to `0.0.0.0`, the check fails. A `postgresql['vip']` pointing at a dedicated external PostgreSQL host in a multi-server deployment is a valid exception.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            If using embedded PostgreSQL, edit `/etc/opscode/chef-server.rb` and remove any `postgresql['listen_address']` or `postgresql['vip']` line that binds the database to `0.0.0.0` or `*`. The default of `localhost` keeps the database on the loopback interface. Then reconfigure:

            ```bash
            chef-server-ctl reconfigure
            ```

            **Note**: Reconfiguring restarts server services and briefly interrupts client requests.

            If using external PostgreSQL in a multi-server deployment, ensure your PostgreSQL server has appropriate firewall rules and authentication configured.
        - id: chef
          desc: |
            **Using Chef Infra**

            If you manage your Chef Infra Server configuration with Chef, use a `ruby_block` to remove the insecure bindings without overwriting the rest of the file:

            ```ruby
            ruby_block 'remove external postgresql bindings' do
              block do
                file = Chef::Util::FileEdit.new('/etc/opscode/chef-server.rb')
                file.search_file_delete_line(/postgresql\['listen_address'\]\s*=\s*['"](0\.0\.0\.0|\*)['"]/)
                file.search_file_delete_line(/postgresql\['vip'\]\s*=\s*['"]0\.0\.0\.0['"]/)
                file.write_file
              end
              notifies :run, 'execute[reconfigure chef server]', :immediately
            end

            execute 'reconfigure chef server' do
              command 'chef-server-ctl reconfigure'
              action :nothing
            end
            ```
    refs:
      - url: https://docs.chef.io/server/config_rb_server_optional_settings/
        title: Chef Infra Server Optional Configuration Settings
  - uid: search-not-externally-accessible
    title: Ensure embedded search is not bound to external interfaces
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      file("/etc/opscode/chef-server.rb") {
        content.contains(/opscode_solr4\['ip_address'\]\s*=\s*['"]0\.0\.0\.0['"]/) == false
        content.contains(/elasticsearch\['listen'\]\s*=\s*['"]0\.0\.0\.0['"]/) == false
        content.contains(/opensearch\['listen'\]\s*=\s*['"]0\.0\.0\.0['"]/) == false
      }
    docs:
      desc: |
        This check verifies that Chef Infra Server's search index is reachable only from the server itself.

        The server indexes every node object so that recipes and `knife` can query the fleet. The engine has changed over time, from Solr through Chef Infra Server 12, to Elasticsearch in versions 13 and 14, and to OpenSearch from version 15, and each is bound to the loopback interface by default. The check fails when `opscode_solr4['ip_address']`, `elasticsearch['listen']`, or `opensearch['listen']` in `/etc/opscode/chef-server.rb` is set to `0.0.0.0`.

        **Why this matters**

        The index is a searchable copy of every node's attributes: hostnames and addresses, installed packages with their versions, running processes, mounted filesystems, local user accounts, and cloud instance metadata. In this deployment the engine has no authentication in front of it, so an exposed port is an unauthenticated query interface over the whole estate. That is not just disclosure, it is a target list sorted by vulnerable version, assembled without touching a single managed host.

        Write access to the index is worse than read. Recipes call `search()` to build load balancer pools, monitoring targets, cluster peer lists, and firewall allowlists, and they render the results into files on the nodes. An attacker who can insert a document into the index chooses what those generated files say, on every node that runs the cookbook.

        Keep the engine on the loopback interface and let the server proxy the queries it is willing to answer. Where a separate search host is genuinely required, constrain it with network controls and enable the engine's own authentication rather than leaving it open.
      audit: |
        Run the following command to check whether the embedded search service is bound to all interfaces:

        ```bash
        grep -E "opscode_solr4\['ip_address'\]|elasticsearch\['listen'\]|opensearch\['listen'\]" /etc/opscode/chef-server.rb
        ```

        If the command returns no output, or the configured address is `127.0.0.1`, the search service is not exposed and the check passes. If any of these lines is set to `0.0.0.0`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Edit `/etc/opscode/chef-server.rb` and remove any `opscode_solr4['ip_address']`, `elasticsearch['listen']`, or `opensearch['listen']` line that binds the search service to `0.0.0.0`. The default of `127.0.0.1` keeps search on the loopback interface. Then reconfigure:

            ```bash
            chef-server-ctl reconfigure
            ```

            **Note**: Reconfiguring restarts server services and briefly interrupts client requests.
        - id: chef
          desc: |
            **Using Chef Infra**

            If you manage your Chef Infra Server configuration with Chef, use a `ruby_block` to remove the insecure bindings without overwriting the rest of the file:

            ```ruby
            ruby_block 'remove external search bindings' do
              block do
                file = Chef::Util::FileEdit.new('/etc/opscode/chef-server.rb')
                file.search_file_delete_line(/opscode_solr4\['ip_address'\]\s*=\s*['"]0\.0\.0\.0['"]/)
                file.search_file_delete_line(/elasticsearch\['listen'\]\s*=\s*['"]0\.0\.0\.0['"]/)
                file.search_file_delete_line(/opensearch\['listen'\]\s*=\s*['"]0\.0\.0\.0['"]/)
                file.write_file
              end
              notifies :run, 'execute[reconfigure chef server]', :immediately
            end

            execute 'reconfigure chef server' do
              command 'chef-server-ctl reconfigure'
              action :nothing
            end
            ```
    refs:
      - url: https://docs.chef.io/server/config_rb_server_optional_settings/
        title: Chef Infra Server Optional Configuration Settings
  - uid: remediate-cve-2023-28864
    title: Remediate against CVE-2023-28864
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      file("/var/opt/opscode/local-mode-cache/backup") {
        user.name == 'root'
        group.name == 'root'
        permissions.user_readable == true
        permissions.user_writeable == true
        permissions.group_readable == false
        permissions.group_writeable == false
        permissions.other_readable == false
        permissions.other_writeable == false
      }
    docs:
      desc: |
        This check verifies that the configuration backup directory Chef Infra Server writes during reconfigure is not readable by unprivileged local users.

        Each `chef-server-ctl reconfigure` copies the previous service configuration into `/var/opt/opscode/local-mode-cache/backup` before writing new files. In Chef Infra Server 12.0 through 15.6.2 that directory was created world readable, which is CVE-2023-28864. The check requires owner `root`, group `root`, and no access for group or other.

        **Why this matters**

        The copies keep their contents, and among them is the `oc_erchef` configuration, which carries the credentials for the embedded search service. Any local account on the server can read them, and from there query the index directly for every node's attributes: addresses, packages and versions, processes, local users, and cloud metadata for the entire fleet. It is a local read on one host that returns reconnaissance on all of them.

        The exposure is not a one-off. A new copy is written on every reconfigure, so the window is not the moment of the vulnerable install but the whole life of the server, and the accumulated backups reflect every configuration the server has ever had, including credentials that were rotated but never invalidated.

        Upgrading to a fixed release stops new backups being created world readable but does not correct a directory that already exists. On any server that was reconfigured while running an affected version, tighten the permissions on the existing directory as well, and treat the search credentials it exposed as compromised until they are rotated.
      audit: |
        Run the following command to inspect the configuration backup directory:

        ```bash
        stat -c '%a %U:%G %n' /var/opt/opscode/local-mode-cache/backup
        ```

        If the directory is owned by `root:root` and the mode denies group and other access (for example `700`), the backup path is restricted and the check passes. If group or other can read the directory, the check fails. Chef Infra Server 15.7 and later set this path to restrictive permissions automatically on each `chef-server-ctl` run.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            The permanent fix is to upgrade to Chef Infra Server 15.7 or later, which restricts the configuration backup path automatically on each `chef-server-ctl` execution.

            Until you can upgrade, run these commands to set proper permissions on your /var/opt/opscode/local-mode-cache/backup directory:

            ```bash
            chown root:root /var/opt/opscode/local-mode-cache/backup
            chmod 700 /var/opt/opscode/local-mode-cache/backup
            ```

            To verify the permissions were applied correctly:

            ```bash
            stat -c '%a %U:%G %n' /var/opt/opscode/local-mode-cache/backup
            ```

            Expected output: `700 root:root /var/opt/opscode/local-mode-cache/backup`
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this recipe code to set the permissions on the /var/opt/opscode/local-mode-cache/backup directory:

            ```ruby
            directory '/var/opt/opscode/local-mode-cache/backup' do
              owner 'root'
              group 'root'
              mode '0700'
              action :create
            end
            ```

            Note: Chef Infra Server 15.7 and later automatically set the configuration backup path to `600` permissions on each `chef-server-ctl` execution.
    refs:
      - url: https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2023-28864
        title: CVE-2023-28864
