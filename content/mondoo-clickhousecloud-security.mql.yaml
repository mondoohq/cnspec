policies:
  - uid: mondoo-clickhousecloud-security
    name: Mondoo ClickHouse Cloud Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: clickhousecloud
    require:
      - provider: clickhousecloud
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden ClickHouse Cloud service network exposure and encryption at rest
    docs:
      desc: |
        The Mondoo ClickHouse Cloud Security policy connects to a ClickHouse Cloud organization and assesses the security posture of its services: whether each service is reachable from any IP address and whether transparent data encryption is enabled.

        These settings are read from the ClickHouse Cloud API, so the checks reflect the controls ClickHouse Cloud is actually enforcing rather than a file on disk.

        Learn more about scanning databases in the [cnspec documentation](https://mondoo.com/docs/cnspec).
    groups:
      - title: Network Access
        checks:
          - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips
      - title: Encryption
        checks:
          - uid: mondoo-clickhousecloud-security-services-encryption-at-rest
    scoring_system: highest impact
queries:
  - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips
    title: Ensure ClickHouse Cloud services are not open to all IP addresses
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-clickhousecloud
        tags:
          mondoo.com/filter-title: ClickHouse Cloud
          mondoo.com/filter-icon: clickhousecloud
      - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no ClickHouse Cloud service accepts connections from every address on the internet.

        Each service carries an IP access list, edited in the ClickHouse Cloud console by opening the service, then Settings, then Security, then IP access list, and set through the `ipAccessList` field of the services API. An entry of `0.0.0.0/0` or `::/0` in that list means any source may open a connection. This check requires the list to name specific ranges instead, and the `clickhouse_service` Terraform resource expresses the same thing as an explicit `ip_access` list of approved CIDR blocks.

        **Why this matters**

        A wildcard entry is usually added during setup to get a first client connected and then never removed, so a service opened for an afternoon of testing stays open to the internet for the life of the deployment. ClickHouse Cloud endpoints follow a predictable hostname pattern and answer on well-known ports, so finding them takes scanning rather than inside knowledge.

        Once found, the only thing between an attacker and the tables is the service password, and passwords for managed databases leak through entirely ordinary means: a connection string in a repository, a value pasted into a chat thread, an environment file on a stolen laptop, a CI job that prints its configuration on failure. With a wildcard access list, any one of those is usable the moment it is found, from anywhere. With the list restricted to office, VPN, and application ranges, the same leaked password is useless from the attacker's address, which buys the time needed to notice and rotate it.

        The open list also removes the rate limit that network scoping provides for free. Password guessing runs from as many source addresses as an attacker cares to rent, continuously, against an endpoint with no application in front of it to slow the attempts down or record them.

        Restricting the list will break anything connecting from an address nobody enumerated, so collect the egress ranges for the application, the analytics and BI tools, and the operators before removing the wildcard entry.
      audit: |-
        ### Audit via the ClickHouse Cloud console

        1. Sign in to the ClickHouse Cloud console and open each service.
        2. Go to **Settings** > **Security** > **IP access list**.
        3. Confirm the list does not contain `0.0.0.0/0` or `::/0` and instead names specific approved ranges.

        If no service allows all IP addresses, the check passes. If any service has a wildcard entry, the check fails.
      remediation:
        - id: console
          desc: |-
            To restrict service network access in the ClickHouse Cloud console:

            1. Open the service and go to **Settings** > **Security** > **IP access list**.
            2. Remove any `0.0.0.0/0` or `::/0` entry.
            3. Add specific CIDR ranges for the approved office, VPN, and application networks.
        - id: api
          desc: |-
            To restrict service network access with the ClickHouse Cloud API, update the service's IP access list to specific ranges:

            ```bash
            curl -s -X PATCH \
              -u "$CLICKHOUSE_KEY_ID:$CLICKHOUSE_KEY_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"ipAccessList":{"add":[{"source":"203.0.113.0/24","description":"office"}],"remove":[{"source":"0.0.0.0/0"}]}}' \
              "https://api.clickhouse.cloud/v1/organizations/$ORG_ID/services/$SERVICE_ID"
            ```
        - id: terraform
          desc: |-
            To restrict service network access with the ClickHouse Cloud Terraform provider, set an explicit `ip_access` list on the service:

            ```hcl
            resource "clickhouse_service" "example" {
              name           = "example"
              cloud_provider = "aws"
              region         = "us-east-1"
              password_wo    = var.clickhouse_default_password

              ip_access = [
                {
                  source      = "203.0.113.0/24"
                  description = "office"
                }
              ]
            }
            ```
    refs:
      - url: https://clickhouse.com/docs/en/cloud/security/setting-ip-filters
        title: ClickHouse Cloud IP access lists
      - url: https://clickhouse.com/docs/cloud/manage/api/api-overview
        title: ClickHouse Cloud API
  - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-clickhousecloud
    filters: asset.platform == "clickhousecloud"
    mql: |
      clickhousecloud.organization.services.all(openToAllIps == false)
  # ip_access is required on clickhouse_service, so a service that parses at all declares one. An
  # absent list is a malformed configuration rather than a permissive one, and the list operation
  # fails it, which is the safe direction.
  - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "clickhouse_service")
    mql: |
      terraform.resources("clickhouse_service").all(arguments["ip_access"].none(_["source"] == "0.0.0.0/0" || _["source"] == "::/0"))
  - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "clickhouse_service")
    mql: |
      terraform.plan.resourceChanges.where(type == "clickhouse_service").all(change.after["ip_access"].none(_["source"] == "0.0.0.0/0" || _["source"] == "::/0"))
  - uid: mondoo-clickhousecloud-security-services-not-open-to-all-ips-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "clickhouse_service")
    mql: |
      terraform.state.resources.where(type == "clickhouse_service").all(values["ip_access"].none(_["source"] == "0.0.0.0/0" || _["source"] == "::/0"))
  - uid: mondoo-clickhousecloud-security-services-encryption-at-rest
    title: Ensure ClickHouse Cloud services enable transparent data encryption
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-clickhousecloud
        tags:
          mondoo.com/filter-title: ClickHouse Cloud
          mondoo.com/filter-icon: clickhousecloud
      - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every ClickHouse Cloud service encrypts the data it holds on disk.

        Transparent data encryption is selected when a service is created on the tiers that support it, and it appears in the ClickHouse Cloud console by opening the service, then Settings, then Security. The `clickhouse_service` Terraform resource carries it as a `transparent_data_encryption` block with `enabled = true`. Two further arguments, `encryption_key` and `encryption_assumed_role_identifier`, choose a customer-managed key in place of a ClickHouse-managed one; they select which key is used and do not switch the feature on by themselves. This check requires the feature to be enabled.

        **Why this matters**

        Encryption at rest defends the copy of the data that leaves the running service. The service's own access controls apply to queries; they do not apply to a snapshot, a backup file, or a block volume once something other than the service reads it. An attacker who reaches the storage layer, through a backup destination that was left readable, a credential for the underlying cloud account, or a support path they should not have had, gets the tables in whatever form they were written. Unencrypted, that is the data itself. Encrypted, it is ciphertext they also need a key for, and the key is held apart from the storage.

        Customer-managed keys extend that separation in a way worth choosing deliberately. When the key lives in your own cloud key service, revoking it makes every stored copy unreadable no matter who holds the storage, which is the only form of deletion that reaches snapshots you cannot enumerate.

        The setting is fixed when the service is created, so a service running without it cannot be updated in place. Bringing one into line means provisioning a replacement on a supporting tier and migrating the data across. That is worth scheduling rather than deferring, because the exposure covers not only the service as it stands but every backup taken of it in the meantime, and those backups outlive the decision to postpone.
      audit: |-
        ### Audit via the ClickHouse Cloud console

        1. Sign in to the ClickHouse Cloud console and open each service.
        2. Review the service's data encryption setting under **Settings** > **Security**.

        If every service reports transparent data encryption enabled, the check passes. If any service has it disabled, the check fails.
      remediation:
        - id: console
          desc: |-
            To enable transparent data encryption in the ClickHouse Cloud console:

            1. Transparent data encryption (including customer-managed keys) is selected when a service is created on supported tiers.
            2. For an existing service, contact ClickHouse Cloud support or recreate the service on a tier that supports encryption at rest, then migrate the data.
        - id: terraform
          desc: |-
            To provision a service with transparent data encryption using the ClickHouse Cloud Terraform provider, enable it on the service. The feature requires an organization on the Enterprise plan:

            ```hcl
            resource "clickhouse_service" "example" {
              name           = "example"
              cloud_provider = "aws"
              region         = "us-east-1"
              password_wo    = var.clickhouse_default_password

              ip_access = [
                {
                  source      = "203.0.113.0/24"
                  description = "office"
                }
              ]

              transparent_data_encryption = {
                enabled = true
              }
            }
            ```

            To hold the encryption key yourself rather than letting ClickHouse manage it, also set `encryption_key` and `encryption_assumed_role_identifier`. Those arguments select customer-managed keys; they do not turn the feature on by themselves.
    refs:
      - url: https://clickhouse.com/docs/en/cloud/security/cmek
        title: ClickHouse Cloud data encryption
  - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-clickhousecloud
    filters: asset.platform == "clickhousecloud"
    mql: |
      clickhousecloud.organization.services.all(hasTransparentDataEncryption == true)
  # transparent_data_encryption is the attribute the runtime field reflects. encryption_key selects a
  # customer-managed key for the feature and does not enable it, so a service that sets only the key
  # arguments is still unencrypted and fails here.
  - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "clickhouse_service")
    mql: |
      terraform.resources("clickhouse_service").all(arguments["transparent_data_encryption"]["enabled"] == true)
  - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "clickhouse_service")
    mql: |
      terraform.plan.resourceChanges.where(type == "clickhouse_service").all(change.after["transparent_data_encryption"]["enabled"] == true)
  - uid: mondoo-clickhousecloud-security-services-encryption-at-rest-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "clickhouse_service")
    mql: |
      terraform.state.resources.where(type == "clickhouse_service").all(values["transparent_data_encryption"]["enabled"] == true)
