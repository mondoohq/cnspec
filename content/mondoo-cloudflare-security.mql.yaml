          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-hsts-preload-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-preload-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-preload-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the zone signals it is ready to be added to the browser HTTPS-only preload list, which protects visitors who have never been to the site before.

        Ordinary HSTS only takes effect after a browser has received the header at least once. The preload list closes that gap by shipping the policy inside the browser itself, so the very first request a new visitor makes is already forced to HTTPS. The `preload` directive is how a site declares it consents to that, and it is a prerequisite for submitting the domain at hstspreload.org. Cloudflare exposes it as **Preload** under SSL/TLS > Edge Certificates, in the HSTS section. In Terraform it is the `preload` field of the `strict_transport_security` block inside the `security_header` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        The first visit is the one visit HSTS alone cannot protect, and it is not a rare event. New employees, new customers, a colleague opening a link on a fresh device, and anyone whose browser profile was reset all arrive with an empty policy cache, and their first plaintext request can be intercepted and stripped in the usual way.

        Preloading also holds up when DNS itself is the attack. A browser with the domain on its preload list will not make a plaintext request no matter what address the DNS answer points to, so an attacker who has poisoned a resolver cannot fall back to serving the victim plain HTTP.

        Because the list lives in the browser binary rather than a profile, the protection survives cache clears, profile resets, and reinstalls, and it applies to embedded browser components in mobile apps that would otherwise start from nothing on every launch.

        Setting the directive does not enroll the domain; the submission at hstspreload.org is a separate step, and it requires HSTS enabled with a max-age of at least one year and `includeSubDomains` set, both of which are companion checks in this policy. Removal from the list takes months to reach released browsers, so every hostname under the domain must be committed to HTTPS before submitting. This check does not fail zones where HSTS is turned off.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **SSL/TLS** > **Edge Certificates** > **HTTP Strict Transport Security (HSTS)**.
        3. Inspect the **Preload** toggle.

        A passing zone shows the preload toggle **Enabled** (or HSTS is not enabled on the zone). A failing zone shows HSTS enabled but the preload toggle **Disabled**.

        ### Audit via API

        1. Retrieve the `security_header` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"strict_transport_security": { "enabled": true, "preload": true, ... }` or `"enabled": false`. A failing zone returns `"enabled": true` with `"preload": false`.
      remediation:
        - id: console
          desc: |
            To enable HSTS preload in the Cloudflare dashboard, then submit to the preload list:

            1. Log in and select the affected zone.
            2. Navigate to **SSL/TLS** > **Edge Certificates** > **HTTP Strict Transport Security (HSTS)**.
            3. Confirm `max-age` is at least 12 months and `includeSubDomains` is enabled (both are preload prerequisites).
            4. Enable **Preload**.
            5. Save, then submit the zone at [https://hstspreload.org/](https://hstspreload.org/) to be added to the public preload list.
        - id: cli
          desc: |
            To enable the `preload` directive via the Cloudflare API. After enabling, submit the zone at [https://hstspreload.org/](https://hstspreload.org/) to be added to the public preload list.

            ```bash
            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":{"strict_transport_security":{"enabled":true,"max_age":31536000,"include_subdomains":true,"preload":true,"nosniff":true}}}'
            ```
        - id: terraform
          desc: |
            To enable the HSTS `preload` directive with Terraform, manage the zone's `security_header` setting with the `cloudflare_zone_setting` resource and set `preload` to `true` in the `strict_transport_security` block. After applying, submit the zone at [https://hstspreload.org/](https://hstspreload.org/) to be added to the public preload list.

            ```hcl
            resource "cloudflare_zone_setting" "security_header" {
              zone_id    = var.zone_id
              setting_id = "security_header"
              value = {
                strict_transport_security = {
                  enabled            = true
                  max_age            = 31536000
                  include_subdomains = true
                  preload            = true
                  nosniff            = true
                }
              }
            }
            ```
    refs:
      - url: https://hstspreload.org/
        title: HSTS Preload List
      - url: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/http-strict-transport-security/
        title: Cloudflare HSTS
  - uid: mondoo-cloudflare-security-r2-buckets-not-public
    title: Ensure R2 buckets are not publicly accessible
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-cloudflare-security-r2-buckets-not-public-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Account
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-r2-buckets-not-public-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-r2-buckets-not-public-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-r2-buckets-not-public-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no R2 bucket is readable by anonymous callers over Cloudflare's managed public URL.

        R2 buckets are private by default, but each one can be given a managed `r2.dev` subdomain that serves its objects to anyone who knows the URL, with no authentication, no signature, and no access policy in between. Cloudflare exposes it per bucket under R2, in **Settings** > **Public access**, as the **r2.dev subdomain** row, and this check requires it to show **Access Disallowed**. In Terraform the same switch is the `enabled` field of a `cloudflare_r2_managed_domain` resource, which must be `false`.

        **Why this matters**

        Turning it on makes every object in the bucket world-readable, not the one asset it was turned on for. Buckets accumulate things nobody meant to publish: database dumps and backups, application and access logs, user-uploaded documents and images, build artifacts, and files left over from a migration. Anonymous read on the bucket exposes all of it at once.

        Discovery is easier than the obscurity of the URL suggests. Once one object URL appears in a page, a support ticket, a mobile app bundle, or a `Referer` header sent to a third party, the bucket's hostname is known, and object names in most applications follow predictable patterns that can be enumerated. Search engines index whatever is linked, and the internet-wide scanners that made open S3 buckets a routine finding work the same way here.

        The exposure also tends to outlive its reason. Public access is commonly enabled to unblock one asset during development and never revisited when the bucket is reused for production data.

        The supported way to serve public content is a custom domain or a Worker in front of the bucket, which keeps Cloudflare's caching and access controls, rate limiting, and logging available; the managed `r2.dev` path deliberately offers none of those. One caveat on the result: if the scanning credential cannot list R2 buckets, or the account has no R2 subscription, Cloudflare answers with an error the provider reports as an empty list, and a check over an empty list passes without having examined any bucket.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the account.
        2. Navigate to **R2**.
        3. For each bucket, select the bucket, open **Settings** > **Public access**, and inspect the **r2.dev subdomain** row.

        A passing bucket shows **Access Disallowed** under r2.dev subdomain. A failing bucket shows **Access Allowed**.

        ### Audit via API

        1. List all R2 buckets for the account:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/<account-id>/r2/buckets" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        2. For each bucket, retrieve its managed domain configuration:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/<account-id>/r2/buckets/<bucket-name>/domains/managed" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing bucket returns `"enabled": false`. A failing bucket returns `"enabled": true`.
      remediation:
        - id: console
          desc: |
            To disable the managed `r2.dev` public access path in the Cloudflare dashboard:

            1. Log in and select the affected account.
            2. Navigate to **R2** > select the bucket.
            3. Open **Settings** > **Public access**.
            4. Under **r2.dev subdomain**, click **Disallow Access**.
            5. If the bucket needs to remain internet-accessible, configure a custom domain with a Cloudflare Worker or signed URL pattern instead.
        - id: cli
          desc: |
            To disable the managed `r2.dev` public domain via the Cloudflare API:

            ```bash
            curl -X PUT "https://api.cloudflare.com/client/v4/accounts/<account-id>/r2/buckets/<bucket-name>/domains/managed" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"enabled":false}'
            ```
        - id: terraform
          desc: |
            To disable the managed `r2.dev` public access path with Terraform, manage the bucket's managed domain with the `cloudflare_r2_managed_domain` resource and set `enabled` to `false`:

            ```hcl
            resource "cloudflare_r2_managed_domain" "example" {
              account_id  = var.account_id
              bucket_name = "example-bucket"
              enabled     = false
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/r2/buckets/public-buckets/
        title: Cloudflare R2 public buckets
  - uid: mondoo-cloudflare-security-api-tokens-have-expiration
    title: Ensure API tokens have an expiration set
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-1
    variants:
      - uid: mondoo-cloudflare-security-api-tokens-have-expiration-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Account
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-api-tokens-have-expiration-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-api-tokens-have-expiration-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-api-tokens-have-expiration-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every active Cloudflare API credential stops working on a known date.

        A Cloudflare API token created without a TTL is valid until somebody remembers to delete it. Cloudflare shows this per token in the **Expiration** column under My Profile > API Tokens, where a token with no TTL reads **No Expiration**, and this check requires every token whose status is active to carry an expiry. In Terraform it is the `expires_on` argument of a `cloudflare_api_token` resource.

        **Why this matters**

        Tokens leak through ordinary means rather than dramatic ones: committed to a repository, printed into a CI job log, pasted into a chat thread or a ticket, left in a shell history, or captured from a developer laptop by an infostealer. None of those events produce an alert, so the window between disclosure and discovery is measured in months when it is measured at all.

        With no expiry, that window has no end. A token exported to a build log in 2023 still authenticates today with whatever permissions it was given, and an API token on a Cloudflare account can change DNS, alter TLS and WAF configuration, or read R2 data. An expiry converts an open-ended compromise into one that closes by itself.

        Expiry also forces the periodic review that otherwise never happens. Renewing a token means somebody has to confirm the workload still exists, still needs the token, and still needs that scope, which is how tokens issued for a one-off migration get retired instead of inherited.

        Two limits apply to this result. Cloudflare returns only the tokens belonging to the signed-in user, so account-owned tokens are not read and not assessed by this check. And if the scanning credential cannot list tokens, the provider may report an empty list, and a check over an empty list passes without having examined anything.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard.
        2. Navigate to **My Profile** > **API Tokens**.
        3. For each active token, inspect the **Expiration** column.

        A passing token shows a specific expiration date in the **Expiration** column. A failing token shows **No Expiration** or a blank expiration field.

        ### Audit via API

        1. List all API tokens for the user:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing result shows every token with `"status": "active"` also has a non-null `"expires_on"` value. A failing result contains at least one active token where `"expires_on"` is `null` or absent.
      remediation:
        - id: console
          desc: |
            To set an expiration on an existing token in the Cloudflare dashboard:

            1. Log in and open **My Profile** > **API Tokens**.
            2. Identify tokens whose **Expiration** column shows no expiration.
            3. For each, choose **Edit**, scroll to the **TTL** section, and set a finite end date, typically one year out.
            4. Save the token. The token secret is unchanged, so consumers do not need to rotate.
        - id: cli
          desc: |
            The token update endpoint replaces the full token definition, so retrieve the current token, add `expires_on`, and send the complete object back. Compute the expiration relative to the current date so the example never produces an already-expired token. The literal you send must be a future RFC 3339 timestamp:

            ```bash
            EXPIRES_ON=$(date -u -d '+1 year' +%Y-%m-%dT%H:%M:%SZ)

            curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/<token-id>" \
              -H "Authorization: Bearer <api-token>" \
              | jq --arg expires_on "$EXPIRES_ON" '.result | {name, policies, condition, status, expires_on: $expires_on}' \
              > token.json

            curl -X PUT "https://api.cloudflare.com/client/v4/user/tokens/<token-id>" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data @token.json
            ```

            On macOS or BSD, the equivalent date command is `date -u -v+1y +%Y-%m-%dT%H:%M:%SZ`.
        - id: terraform
          desc: |
            For tokens managed with the `cloudflare_api_token` resource, set the `expires_on` attribute to a finite timestamp so the token cannot remain valid indefinitely:

            ```hcl
            resource "cloudflare_api_token" "example" {
              name = "ci-deploy-token"

              policies = [{
                effect = "allow"
                permission_groups = [{
                  id = "1a71c399035b4950a1bd1466b1e4f420"
                }]
                resources = jsonencode({
                  "com.cloudflare.api.account.0123456789abcdef0123456789abcdef" = "*"
                })
              }]

              expires_on = "2027-01-01T00:00:00Z"
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
        title: Cloudflare API Tokens
  - uid: mondoo-cloudflare-security-api-tokens-have-ip-allowlist
    title: Ensure API tokens have an IP allowlist configured
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-7-2-5
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-cloudflare-security-api-tokens-have-ip-allowlist-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Account
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-api-tokens-have-ip-allowlist-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-api-tokens-have-ip-allowlist-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-api-tokens-have-ip-allowlist-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every active Cloudflare API credential can only be used from a defined set of source addresses.

        A Cloudflare API token can carry a condition restricting which client IP addresses may present it, and Cloudflare rejects requests from anywhere else before evaluating the token's permissions at all. Cloudflare calls this **Client IP Address Filtering** on the token's settings under My Profile > API Tokens, and this check requires the **Is in** list to hold at least one address or CIDR. In Terraform it is `condition.request_ip.in` on a `cloudflare_api_token` resource.

        **Why this matters**

        Possession of the token string is otherwise the whole of the authentication. An attacker who lifts one from a CI log, a committed configuration file, or a developer's machine authenticates from their own infrastructure immediately, and nothing about the request distinguishes it from the legitimate automation that owns the token.

        Binding the token to source addresses removes that. The credential becomes useful only from the network it was issued for, so a copy exfiltrated to an attacker's host or a residential proxy fails at the door, and the attacker has to compromise the actual CI runner or egress network to use what they stole.

        Rejected attempts are also a signal worth having. A token presented from an unexpected address produces an authentication failure that can be alerted on, which is often the first evidence that a secret has escaped, and there is rarely any other detection for a stolen token being used correctly.

        This suits automation with stable egress, such as CI runners behind a NAT gateway or a Kubernetes cluster with fixed outbound addresses, and fits poorly where the caller's address is not predictable, which is why it complements rather than replaces the token expiry check in this policy. Two limits apply to the result: Cloudflare returns only the tokens belonging to the signed-in user, so account-owned tokens are not assessed, and if the scanning credential cannot list tokens the provider may report an empty list, which passes without having examined anything.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard.
        2. Navigate to **My Profile** > **API Tokens**.
        3. Select each active token and expand its settings to inspect **Client IP Address Filtering**.

        A passing token shows at least one CIDR or IP address under **Is in** for Client IP Address Filtering. A failing token shows no IP address filtering configured.

        ### Audit via API

        1. List all API tokens for the user:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing result shows every active token with a non-empty `"condition": { "request_ip": { "in": [...] } }` array. A failing result contains at least one active token where `condition.request_ip.in` is absent, null, or an empty array.
      remediation:
        - id: console
          desc: |
            To add an IP allowlist to an existing token in the Cloudflare dashboard:

            1. Log in and open **My Profile** > **API Tokens**.
            2. Select the token to edit.
            3. Under **Client IP Address Filtering**, choose **Is in** and add the CIDRs from which the token should be usable, typically the calling system's egress NAT or VPN ranges.
            4. Save.
        - id: cli
          desc: |
            The token update endpoint replaces the full token definition, so retrieve the current token, add the `condition.request_ip.in` allowlist, and send the complete object back. The `in` array accepts CIDRs:

            ```bash
            curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/<token-id>" \
              -H "Authorization: Bearer <api-token>" \
              | jq '.result | {name, policies, status, expires_on, condition: {request_ip: {in: ["198.51.100.0/24", "203.0.113.10/32"]}}}' \
              > token.json

            curl -X PUT "https://api.cloudflare.com/client/v4/user/tokens/<token-id>" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data @token.json
            ```
        - id: terraform
          desc: |
            For tokens managed with the `cloudflare_api_token` resource, populate the `condition.request_ip.in` list with the CIDRs from which the token should be usable:

            ```hcl
            resource "cloudflare_api_token" "example" {
              name = "ci-deploy-token"

              policies = [{
                effect = "allow"
                permission_groups = [{
                  id = "1a71c399035b4950a1bd1466b1e4f420"
                }]
                resources = jsonencode({
                  "com.cloudflare.api.account.0123456789abcdef0123456789abcdef" = "*"
                })
              }]

              condition = {
                request_ip = {
                  in = ["198.51.100.0/24", "203.0.113.10/32"]
                }
              }
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/fundamentals/api/how-to/secure-api-tokens-with-restrictive-permissions/
        title: Cloudflare API token IP filtering
  # No Terraform variants: the check inspects each accepted member's twoFactorAuthenticationEnabled flag, which is per-user account state managed by the underlying Cloudflare user — not configuration declared by cloudflare_account_member HCL.
  - uid: mondoo-cloudflare-security-members-have-two-factor
    filters: asset.platform == "cloudflare-account"
    title: Ensure every account member has two-factor authentication enabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-4-2
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      cloudflare.account.members.where(status == "accepted").all(twoFactorAuthenticationEnabled)
    docs:
      desc: |
        This check verifies that every person with active access to the Cloudflare account has actually configured a second authentication factor.

        The account-level enforcement toggle is a policy statement about future sign-ins; the per-member flag is the fact on the ground. Cloudflare records two-factor status against each individual Cloudflare user, and the member list shows it in the **Two-Factor Authentication** column under Manage Account > Members. This check reads that per-member flag for every member whose invitation status is accepted and requires it to be true for all of them.

        **Why this matters**

        Enforcement and reality diverge more often than they should. Members who joined while the toggle was off, members holding sessions established before it was turned on, and members whose access predates a change of ownership can all still be sitting on a password-only identity, and the account-level setting reports as compliant the whole time.

        Each of those identities carries the permissions of its role, so one of them is enough. An attacker who phishes a single member's password, or replays a credential pair leaked from an unrelated service, gains whatever that member can do: repoint DNS, disable the WAF, deploy a Worker that captures request bodies, or read objects out of R2. The rest of the members having strong authentication does not narrow that.

        Verifying identity by identity is also what auditors ask for. A framework that requires multi-factor authentication on privileged access wants evidence that each individual holds the factor, which the account toggle alone cannot supply.

        Two caveats apply to the result. Members who authenticate through an SSO identity provider are governed by that provider's MFA policy rather than a Cloudflare second factor, so a failure there may need to be assessed at the identity provider instead. And if the scanning credential cannot read the account member list, Cloudflare answers with a permission error that the provider reports as an empty list, and a check over an empty list passes without having examined anyone; treat a pass as meaningful only when the scan credential is known to have read access to account membership.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the account.
        2. Navigate to **Manage Account** > **Members**.
        3. For each member with **Status: Active**, confirm the **Two-Factor Authentication** column shows **Enabled**.

        A passing account shows 2FA enabled for every active member. A failing account shows at least one active member with 2FA disabled.

        ### Audit via API

        1. List members for the account:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/<account-id>/members" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        2. For each entry where `status` is `accepted`, confirm `user.two_factor_authentication_enabled` is `true`.

        A passing account returns `true` for every accepted member. A failing account returns `false` for at least one accepted member.
      remediation:
        - id: console
          desc: |
            To bring every member into compliance from the Cloudflare dashboard:

            1. Log in and select the account.
            2. Open the account members list under Manage Account. The exact menu path varies by dashboard version, so use the in-dashboard search for "members" if you cannot find it.
            3. Identify each active member whose **Two-Factor Authentication** column is **Disabled**.
            4. Contact each member and have them enable 2FA on their personal Cloudflare account under **My Profile** > **Authentication** by configuring a TOTP authenticator app or security key.
            5. With 2FA in place for every member, enable the account-level **Enforce two-factor authentication** toggle so new members must configure 2FA before joining. The authoritative control is the account `settings.enforce_twofactor` field, set via `PUT /accounts/{account_id}`; see the enforce-two-factor check for details.
        - id: cli
          desc: |
            The per-user 2FA enrollment cannot be performed by an account administrator through the API; each affected member must enroll on their own Cloudflare user account. After contacting affected members, verify their state with the members list endpoint:

            ```bash
            curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/<account-id>/members" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              | jq '.result[] | select(.status == "accepted" and .user.two_factor_authentication_enabled == false) | .user.email'
            ```

            Repeat until the query returns no email addresses. With every member compliant, set the account-level enforcement so future joiners cannot bypass the requirement:

            ```bash
            curl -X PUT "https://api.cloudflare.com/client/v4/accounts/<account-id>" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"name":"<account-name>","settings":{"enforce_twofactor":true}}'
            ```
        # No Terraform remediation: per-user two-factor enrollment is owned by each Cloudflare user account, not by account-membership configuration. The cloudflare_account_member resource grants role membership but does not declare or enforce the underlying user's 2FA state, so there is no HCL change that can remediate this finding.
    refs:
      - url: https://developers.cloudflare.com/fundamentals/setup/account/account-security/2fa/
        title: Cloudflare two-factor authentication
      - url: https://developers.cloudflare.com/api/operations/account-members-list-members
        title: Cloudflare API - List account members
  # No Terraform variants: the check inspects each token's modifiedOn timestamp (when its secret was last rotated), which is runtime telemetry with no analog in cloudflare_api_token HCL — Terraform expresses desired token configuration, not the age of the current secret.
  - uid: mondoo-cloudflare-security-api-tokens-not-older-than-365-days
    filters: asset.platform == "cloudflare-account"
    title: Ensure active API tokens have been rotated within the last 365 days
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      cloudflare.apiTokens.where(status == "active").all(time.now - modifiedOn < 365 * time.day)
    docs:
      desc: |
        This check verifies that every active Cloudflare API credential has been changed within the last year.

        Cloudflare records when each token was last modified, shown as **Last Modified** under My Profile > API Tokens, and this check requires that timestamp to fall within the past 365 days for every token whose status is active. Rolling a token's secret updates it, which is what makes the timestamp usable as a rotation date.

        **Why this matters**

        The exposure of a secret accumulates with the time it stays in service. Over a year a token gets copied into a second CI system, a container image, a secrets manager, a colleague's `.env` file, and a runbook, and it passes through build logs and terminal sessions along the way. Every one of those copies is a place it can leak from, and the count only goes up.

        Rotation is the only action that retroactively closes an unknown leak. Nobody can prove a token has not been exposed, but issuing a new secret invalidates every copy of the old one at once, including the one that was quietly captured months ago and has not been used yet.

        The people around the token change too. Projects get handed over and staff leave, and a token issued for one engineer's automation is often still in place long after they are, holding a scope that was never reviewed against what the workload actually needs today.

        Time also outruns the evidence. Security log retention rarely reaches back a year, so when a token that old is implicated in an incident there is no baseline of normal use to compare against.

        Two limits apply to this result. The timestamp records the last change of any kind, so renaming a token or editing its policies resets the clock without the secret being rolled, and a passing token is not proof of rotation on its own. Cloudflare also returns only the tokens belonging to the signed-in user, so account-owned tokens are not assessed by this check.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard.
        2. Navigate to **My Profile** > **API Tokens**.
        3. For each active token, inspect the **Last Modified** date.

        A passing token shows a **Last Modified** date within the past 365 days. A failing token shows a **Last Modified** date older than 365 days.

        ### Audit via API

        1. List all API tokens for the user:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing result shows every active token with a `"modified_on"` timestamp within the past 365 days. A failing result contains at least one active token where `"modified_on"` is older than 365 days from today.
      remediation:
        - id: console
          desc: |
            To rotate a long-lived token in the Cloudflare dashboard:

            1. Log in and open **My Profile** > **API Tokens**.
            2. Find tokens issued more than 365 days ago.
            3. For each, choose **Roll** to issue a fresh secret while preserving the token's policies.
            4. Update consumers with the new value, then revoke the prior version once they have rotated.
        - id: cli
          desc: |
            Roll the token's secret to a fresh value via the Cloudflare API. The roll operation invalidates the old secret immediately and returns a new one with the same policies, so coordinate the change with every consumer of the token. The endpoint takes no parameters, so send an empty JSON object as the request body:

            ```bash
            curl -X PUT "https://api.cloudflare.com/client/v4/user/tokens/<token-id>/value" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{}'
            ```
        # No Terraform remediation: rotating a token's secret is an imperative API operation (PUT .../tokens/{id}/value) with no representation in cloudflare_api_token HCL — the resource declares token configuration, not a rotation action.
    refs:
      - url: https://developers.cloudflare.com/fundamentals/api/how-to/manage-api-tokens/
        title: Cloudflare API token management
