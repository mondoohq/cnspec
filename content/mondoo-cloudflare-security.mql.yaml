  - uid: mondoo-cloudflare-security-tls-1-3-enabled
    title: Ensure TLS 1.3 is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-cloudflare-security-tls-1-3-enabled-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-tls-1-3-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-tls-1-3-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-tls-1-3-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the zone offers TLS 1.3 to clients that support it.

        TLS 1.3 is on by default at the Cloudflare edge, but it can be switched off, which pins every connection to TLS 1.2 or lower no matter what the client is capable of. Cloudflare calls this **TLS 1.3**, under SSL/TLS > Edge Certificates, and this check accepts any value other than **Off**, including the **ZRT** setting that additionally enables zero round trip resumption. In Terraform it is the `tls_1_3` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        TLS 1.2 still permits cipher suites and algorithms that an attacker can steer a handshake toward: static RSA key exchange with no forward secrecy, CBC modes with a long history of padding oracle attacks, and SHA-1 signatures. TLS 1.3 removed all of them from the protocol, so a connection negotiated at 1.3 cannot end up on any of them regardless of what the client advertises.

        Turning 1.3 off does not only forgo an improvement, it forces clients backward. A modern browser that would have completed a 1.3 handshake with a mandatory forward-secret exchange instead completes a 1.2 handshake whose properties depend entirely on how well the remaining cipher suites are configured.

        The 1.3 handshake also encrypts most of its own negotiation and finishes in one round trip rather than two, so less metadata is exposed on the wire and there is less handshake surface for an attacker to manipulate.

        Zero round trip resumption, the **ZRT** value, trades a small replay risk for latency on repeat connections and should be enabled deliberately rather than by default on endpoints that perform state-changing requests. Terraform configurations that never declare the `tls_1_3` setting are not failed here, because the check has nothing to read.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **SSL/TLS** > **Edge Certificates**.
        3. Locate the **TLS 1.3** toggle.

        A passing zone shows the toggle **On** (or **ZRT** for Zero Round Trip Time). A failing zone shows the toggle **Off**.

        ### Audit via API

        1. Retrieve the `tls_1_3` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/tls_1_3" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"value": "on"` or `"value": "zrt"`. A failing zone returns `"value": "off"`.
      remediation:
        - id: console
          desc: |
            To fix this in the Cloudflare dashboard:

            1. Log in and select the affected zone.
            2. Navigate to the Edge Certificates settings for SSL/TLS. The exact menu label and location vary by dashboard version, so use the in-dashboard search if you cannot find it.
            3. Enable TLS 1.3. To also turn on Zero Round Trip Time resumption, choose the ZRT option.

            The authoritative control is the `tls_1_3` zone setting, which accepts the values `on`, `off`, and `zrt`. If the dashboard layout has changed, use the API or Terraform steps below.
        - id: cli
          desc: |
            To fix this on the command line using the Cloudflare API, enable the `tls_1_3` zone setting:

            ```bash
            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/tls_1_3" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":"on"}'
            ```
        - id: terraform
          desc: |
            To enable TLS 1.3 with Terraform, manage the zone's `tls_1_3` setting with the `cloudflare_zone_setting` resource and set `value` to `on` (or `zrt` for Zero Round Trip Time resumption):

            ```hcl
            resource "cloudflare_zone_setting" "tls_1_3" {
              zone_id    = var.zone_id
              setting_id = "tls_1_3"
              value      = "on"
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/tls-13/
        title: TLS 1.3
  - uid: mondoo-cloudflare-security-automatic-https-rewrites
    title: Ensure Automatic HTTPS Rewrites is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-cloudflare-security-automatic-https-rewrites-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-automatic-https-rewrites-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-automatic-https-rewrites-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-automatic-https-rewrites-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that HTTP sub-resource URLs in HTML responses are rewritten to HTTPS before they reach the browser.

        A page delivered over HTTPS can still pull its scripts, stylesheets, images, and iframes from `http://` URLs hard-coded in templates, in a CMS database, or in a third-party embed. Cloudflare can rewrite those URLs on the way out when it can confirm the resource is also available over HTTPS. Cloudflare calls this **Automatic HTTPS Rewrites**, under SSL/TLS > Edge Certificates, and this check requires the toggle to be **On**. In Terraform it is the `automatic_https_rewrites` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        A script loaded over HTTP into an HTTPS page is the whole page's security boundary. An attacker on the path between the browser and that resource's host replaces the JavaScript body with their own, and it executes in the origin of the secure page: reading the DOM, reading tokens the page holds, and issuing requests as the logged-in user. The padlock stays in place while it happens.

        Passive sub-resources are a smaller but real problem. Swapping images or fonts lets an attacker alter what the page appears to say, and the requests themselves leak the visitor's browsing to anyone watching, along with cookies for the resource's domain.

        Browsers respond to this by blocking mixed active content outright, so the practical result of unrewritten URLs is usually a page whose scripts and styles simply do not load. Fixing it at the edge means the origin templates do not have to be found and changed first.

        Rewrites only apply where Cloudflare has evidence the HTTPS version exists, so this is a safety net rather than a substitute for fixing the URLs at the source. It also does not cover URLs constructed at runtime by JavaScript. Terraform configurations that never declare the `automatic_https_rewrites` setting are not failed here, because the check has nothing to read.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **SSL/TLS** > **Edge Certificates**.
        3. Locate the **Automatic HTTPS Rewrites** toggle.

        A passing zone shows the toggle **On**. A failing zone shows the toggle **Off**.

        ### Audit via API

        1. Retrieve the `automatic_https_rewrites` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/automatic_https_rewrites" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"value": "on"`. A failing zone returns `"value": "off"`.
      remediation:
        - id: console
          desc: |
            To fix this in the Cloudflare dashboard:

            1. Log in and select the affected zone.
            2. Navigate to **SSL/TLS** > **Edge Certificates**.
            3. Enable "Automatic HTTPS Rewrites".
            4. Review your site for any remaining mixed-content issues that cannot be automatically resolved.
        - id: cli
          desc: |
            To fix this on the command line using the Cloudflare API, enable the `automatic_https_rewrites` zone setting:

            ```bash
            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/automatic_https_rewrites" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":"on"}'
            ```
        - id: terraform
          desc: |
            To enable Automatic HTTPS Rewrites with Terraform, manage the zone's `automatic_https_rewrites` setting with the `cloudflare_zone_setting` resource and set `value` to `on`:

            ```hcl
            resource "cloudflare_zone_setting" "automatic_https_rewrites" {
              zone_id    = var.zone_id
              setting_id = "automatic_https_rewrites"
              value      = "on"
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/automatic-https-rewrites/
        title: Automatic HTTPS Rewrites
  - uid: mondoo-cloudflare-security-waf-enabled
    title: Ensure Web Application Firewall (WAF) is enabled
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-23
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-6-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-3
    variants:
      - uid: mondoo-cloudflare-security-waf-enabled-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-waf-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-waf-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-waf-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Cloudflare's previous-generation managed web application firewall is switched on for the zone.

        This check reads the legacy `waf` zone setting, the on and off switch for the managed rule sets that shipped before Cloudflare's current WAF. Zones still on that generation expose it under Security > WAF > Managed rules. Zones that have been migrated to the current WAF no longer show the toggle at all, and their protection comes from deployed rulesets such as the **Cloudflare Managed Ruleset** instead. In Terraform the setting is the `waf` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        The managed rule sets are the layer that recognizes an attack payload before the origin has to parse it. Without them, SQL injection strings, path traversal sequences, cross-site scripting payloads, and template injection attempts arrive at the application unfiltered, and whether they succeed depends entirely on how carefully every input path in the codebase was written.

        The response speed to new vulnerabilities is the other half. When a widely used framework or plugin gets a critical remote code execution disclosure, Cloudflare pushes a rule to the edge within hours, which stops exploitation across every zone that has the rule set enabled while the origin is still waiting for a vendor patch and a maintenance window. A zone with the firewall off gets none of that head start.

        Managed rules also absorb the constant background of automated scanning that maps an application's endpoints and framework versions, so the reconnaissance an attacker can complete before a targeted attempt is far less complete.

        Because this check reads the legacy setting, a zone that has migrated to the current WAF and is fully protected by managed rulesets will still be reported as failing. On a migrated zone, confirm the deployed rulesets under Security > WAF before treating the result as an actual gap. Terraform configurations that never declare the `waf` setting are not failed here, because the check has nothing to read.
      audit: |
        ### Audit via Dashboard

        This check reads the previous-generation `waf` zone setting. Zones migrated to the current WAF no longer expose this toggle in the dashboard; the API audit below is authoritative for this check.

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **Security** > **WAF** > **Managed rules**.
        3. On zones still running the previous-generation WAF, verify the WAF toggle is enabled. On migrated zones, verify that the **Cloudflare Managed Ruleset** is deployed.

        A passing zone has the legacy `waf` setting enabled. A failing zone has it disabled, even when managed rulesets provide protection on a migrated zone.

        ### Audit via API

        1. Retrieve the `waf` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/waf" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"value": "on"`. A failing zone returns `"value": "off"`.
      remediation:
        - id: console
          desc: |
            The zone setting this check inspects is the previous-generation WAF toggle. Zones migrated to the current WAF no longer expose this toggle in the dashboard; protection there is configured through managed rulesets:

            1. Log in and select the affected zone.
            2. Navigate to **Security** > **WAF** > **Managed rules**.
            3. Deploy the **Cloudflare Managed Ruleset** and review its configuration.
            4. Configure any necessary exceptions for legitimate traffic that may be flagged.
            5. Monitor WAF activity under **Security** > **Events** to tune rules and reduce false positives.

            On zones that still run the previous-generation WAF, also use the API or Terraform method to set the legacy `waf` zone setting to `on` so the setting reflects the active protection.
        - id: cli
          desc: |
            To fix this on the command line using the Cloudflare API, enable the legacy `waf` zone setting. This call succeeds only on zones that still carry the previous-generation WAF entitlement; migrated zones reject changes to this setting:

            ```bash
            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/waf" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":"on"}'
            ```
        - id: terraform
          desc: |
            To enable the legacy WAF with Terraform, manage the zone's `waf` setting with the `cloudflare_zone_setting` resource and set `value` to `on`. This applies only on zones that still carry the previous-generation WAF entitlement:

            ```hcl
            resource "cloudflare_zone_setting" "waf" {
              zone_id    = var.zone_id
              setting_id = "waf"
              value      = "on"
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/waf/
        title: Cloudflare Web Application Firewall
  - uid: mondoo-cloudflare-security-security-level-not-off
    title: Ensure security level is not set to essentially off
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-3
    variants:
      - uid: mondoo-cloudflare-security-security-level-not-off-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-security-level-not-off-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-security-level-not-off-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-security-level-not-off-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that reputation-based challenges are not effectively disabled for the zone.

        Cloudflare scores every client IP address against its threat intelligence, and the security level sets how bad that score has to be before a visitor is challenged instead of passed straight through. **Essentially Off** raises the bar so high that only the very worst-scoring addresses see anything. Cloudflare calls this **Security Level**, under Security > Settings, and this check requires any value other than **Essentially Off**. In Terraform it is the `security_level` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        Reputation challenges are what makes bulk attacks expensive. Credential stuffing runs succeed on volume: an operator with a list of leaked username and password pairs needs tens of thousands of login attempts to convert a handful of accounts, and those attempts come overwhelmingly from proxy pools, compromised hosts, and hosting ranges that Cloudflare already scores badly. Removing the challenge lets the entire list be tried at full speed against the origin's login endpoint.

        The same applies to vulnerability scanning. Automated tooling from known-bad ranges enumerates paths, probes for exposed admin panels and backup files, and fingerprints framework versions, and every request it completes is intelligence the attacker uses for a targeted attempt later.

        Challenges also impose a real cost per request during an application-layer flood, which is what keeps a botnet from converting cheaply into origin load. With that cost removed, the origin absorbs the full request rate and the application's own rate limiting is the only thing left.

        Enterprise zones can additionally select **Off**, which disables the reputation challenge outright; this check does not fail that value, so confirm it separately on Enterprise plans. Zones that serve mostly API clients rather than browsers may legitimately need a lower level to avoid challenging automation, but the right answer there is a WAF skip rule for the known callers rather than switching the level off for everyone. Terraform configurations that never declare the `security_level` setting are not failed here, because the check has nothing to read.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **Security** > **Settings**.
        3. Locate the **Security Level** dropdown.

        A passing zone shows any level other than **Essentially Off** (e.g., Low, Medium, High, or I'm Under Attack!). A failing zone shows **Essentially Off**.

        ### Audit via API

        1. Retrieve the `security_level` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_level" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns any value except `"essentially_off"`, such as `"low"`, `"medium"`, or `"high"`. A failing zone returns `"value": "essentially_off"`.
      remediation:
        - id: console
          desc: |
            To fix this in the Cloudflare dashboard:

            1. Log in and select the affected zone.
            2. Open the zone's security settings. The exact menu path for Security Level varies by dashboard version and plan, and on newer accounts this control is being superseded by Bot Fight Mode and WAF custom rules. Use the in-dashboard search for "Security Level" if you cannot find it.
            3. Set the Security Level to "Medium" as the recommended value, or "Low" at minimum.
            4. Monitor traffic to ensure legitimate visitors are not being blocked unnecessarily.

            The authoritative control is the `security_level` zone setting. If you cannot locate it in the dashboard, use the API or Terraform steps below.
        - id: cli
          desc: |
            To fix this on the command line using the Cloudflare API, set the `security_level` zone setting to `medium` (or `low` at minimum):

            ```bash
            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_level" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":"medium"}'
            ```
        - id: terraform
          desc: |
            To raise the security level with Terraform, manage the zone's `security_level` setting with the `cloudflare_zone_setting` resource and set `value` to `medium` (or `low` at minimum):

            ```hcl
            resource "cloudflare_zone_setting" "security_level" {
              zone_id    = var.zone_id
              setting_id = "security_level"
              value      = "medium"
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/waf/tools/security-level/
        title: Security level
