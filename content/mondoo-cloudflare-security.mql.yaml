      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-20
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-cloudflare-security-dnssec-active-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-dnssec-active-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-dnssec-active-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-dnssec-active-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that DNS answers for the zone are cryptographically signed and the chain of trust back to the parent zone is complete.

        DNSSEC signs a zone's records so a validating resolver can prove an answer came from the zone owner and was not altered on the way. Enabling it has two halves: Cloudflare signs the zone, and the registrar publishes a DS record in the parent zone that links Cloudflare's key into the global chain of trust. Only when both are done does Cloudflare report the status as **Active**, under DNS > Settings, and that is what this check requires. In Terraform the state is a `cloudflare_zone_dnssec` resource whose status is `active`.

        **Why this matters**

        DNS is answered before TLS begins, so an attacker who controls the answer controls where the connection goes before any certificate is checked. Cache poisoning against a recursive resolver, a hostile resolver on a captive portal or ISP, or interception of unencrypted DNS on the local network all produce the same result: the visitor's browser opens a connection to an address the attacker chose, and every HTTPS protection the zone configured applies to the attacker's server instead.

        The consequences reach past the website. MX records decide where the domain's mail is delivered, and SPF, DKIM, and DMARC records decide whether spoofed mail is accepted, so forged DNS answers let an attacker receive the organization's mail or make their own forgeries pass authentication. TXT records used for domain validation let an attacker obtain a valid certificate for the domain from a public certificate authority.

        Because the answer is wrong before the browser has any HTTPS policy for the site, this is one of the few attacks that a first-time visitor cannot be protected from by HSTS alone.

        A status of **Pending** means Cloudflare is signing the zone but the DS record has not been published at the registrar, so validation is not yet in effect and this check correctly fails. The DS record must also be updated whenever the key is rolled, or resolvers will start rejecting the zone outright.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **DNS** > **Settings**.
        3. Locate the **DNSSEC** section and inspect its status.

        A passing zone shows a status of **Active**. A failing zone shows a status of **Disabled** or **Pending**.

        ### Audit via API

        1. Retrieve the DNSSEC status for the zone:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/dnssec" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"status": "active"`. A failing zone returns `"status": "disabled"` or `"status": "pending"`.
      remediation:
        - id: console
          desc: |
            To enable DNSSEC in the Cloudflare dashboard:

            1. Log in and select the affected zone.
            2. Open **DNS** > **Settings**.
            3. Under **DNSSEC**, click **Enable DNSSEC**.
            4. Copy the displayed DS record and add it at your domain registrar so the parent zone can chain trust.
            5. Wait for the registrar to publish the DS record; Cloudflare will then mark DNSSEC as **Active**.
        - id: cli
          desc: |
            To enable DNSSEC for a zone via the Cloudflare API, set the status to `active`. After enabling, copy the returned DS record and publish it at your registrar.

            ```bash
            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/dnssec" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"status":"active"}'
            ```
        - id: terraform
          desc: |
            To activate DNSSEC with Terraform, manage the zone with the `cloudflare_zone_dnssec` resource and set `status` to `active`. After applying, copy the computed `ds` attribute and publish it at your domain registrar so the parent zone can chain trust.

            ```hcl
            resource "cloudflare_zone_dnssec" "this" {
              zone_id = var.zone_id
              status  = "active"
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/dns/dnssec/
        title: Cloudflare DNSSEC
  - uid: mondoo-cloudflare-security-hsts-enabled
    title: Ensure HSTS is enabled on every zone
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-cloudflare-security-hsts-enabled-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-hsts-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that browsers are told to reach the zone over HTTPS only.

        HTTP Strict Transport Security is a response header that instructs a browser to refuse plaintext connections to the host for a stated period. After one successful HTTPS visit, the browser rewrites `http://` URLs for the host to `https://` internally and will not send the plaintext request at all. Cloudflare emits the header when HSTS is enabled under SSL/TLS > Edge Certificates, in the HSTS section. In Terraform it is the `enabled` field of the `strict_transport_security` block inside the `security_header` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        An edge redirect only reacts to the plaintext request after it has been sent, and that request is where the damage is done. A tool such as sslstrip sits on the path, answers the visitor's HTTP request itself instead of letting Cloudflare's redirect through, and keeps the visitor on HTTP for the whole session while proxying content from the real site over its own HTTPS connection. Everything the visitor types, including credentials, passes through the attacker in clear text, and the browser shows no warning because the visitor never asked for HTTPS.

        HSTS defeats this by moving the decision into the browser. Once the policy is cached, the browser never emits the plaintext request the attacker needs to intercept, so there is nothing on the wire to hijack. It also turns certificate warnings into hard failures for the host, removing the click-through that an attacker with an invalid certificate relies on.

        The header additionally protects any cookie that was set without the `Secure` attribute, because there is no longer a plaintext request for the browser to attach it to.

        HSTS applies from the visitor's first successful HTTPS response onward, so a brand-new visitor is still exposed on that one request; the preload check in this policy covers that case. Enabling HSTS is also difficult to reverse quickly, since browsers honor the cached policy until it expires, so confirm that every hostname the policy will cover can serve HTTPS before turning it on.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **SSL/TLS** > **Edge Certificates**.
        3. Scroll to **HTTP Strict Transport Security (HSTS)** and inspect the **Status** indicator.

        A passing zone shows HSTS as **Enabled** with a non-zero max-age. A failing zone shows HSTS as **Disabled**.

        ### Audit via API

        1. Retrieve the `security_header` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"strict_transport_security": { "enabled": true, ... }`. A failing zone returns `"strict_transport_security": { "enabled": false, ... }` or an absent `enabled` key.
      remediation:
        - id: console
          desc: |
            To enable HSTS in the Cloudflare dashboard:

            1. Log in and select the affected zone.
            2. Navigate to **SSL/TLS** > **Edge Certificates**.
            3. Scroll to **HTTP Strict Transport Security (HSTS)** and click **Enable HSTS**.
            4. Acknowledge the warning that all subdomains served over HTTP will become unreachable for the duration of `max-age`.
            5. Set **Max Age Header** to at least 6 months, with 12 months recommended, and enable **No-Sniff Header**.
            6. Once you have confirmed that every subdomain serves HTTPS, also enable **Apply HSTS to subdomains** and **Preload**.
        - id: cli
          desc: |
            To enable HSTS via the Cloudflare API. The PATCH replaces the entire `strict_transport_security` object, so retrieve the current value first and preserve any directives already set. Keep `include_subdomains` and `preload` set to `false` until you have confirmed that every subdomain serves HTTPS; both extend enforcement in ways that are hard to reverse:

            ```bash
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
              -H "Authorization: Bearer <api-token>"

            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":{"strict_transport_security":{"enabled":true,"max_age":31536000,"include_subdomains":false,"preload":false,"nosniff":true}}}'
            ```
        - id: terraform
          desc: |
            To enable HSTS with Terraform, manage the zone's `security_header` setting with the `cloudflare_zone_setting` resource and set `enabled` to `true` in the `strict_transport_security` block. Keep `include_subdomains` and `preload` set to `false` until you have confirmed that every subdomain serves HTTPS; both extend enforcement in ways that are hard to reverse:

            ```hcl
            resource "cloudflare_zone_setting" "security_header" {
              zone_id    = var.zone_id
              setting_id = "security_header"
              value = {
                strict_transport_security = {
                  enabled            = true
                  max_age            = 31536000
                  include_subdomains = false
                  preload            = false
                  nosniff            = true
                }
              }
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/http-strict-transport-security/
        title: Cloudflare HSTS
  - uid: mondoo-cloudflare-security-hsts-max-age-one-year
    title: Ensure HSTS max-age is at least one year on HSTS-enabled zones
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-cloudflare-security-hsts-max-age-one-year-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-hsts-max-age-one-year-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-max-age-one-year-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-max-age-one-year-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a browser's commitment to reaching the zone over HTTPS only lasts at least a year.

        The `max-age` directive in the HSTS header is how long a browser remembers the policy after receiving it. Cloudflare exposes it as **Max Age Header** under SSL/TLS > Edge Certificates, in the HSTS section, and this check requires at least 31,536,000 seconds, which the dashboard offers as **12 months** and is its highest value. In Terraform it is the `max_age` field of the `strict_transport_security` block inside the `security_header` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        The policy protects a visitor only while it is still cached, and the clock restarts on each visit. A max-age of a few hours protects a daily visitor continuously but leaves a monthly visitor unprotected on almost every visit, and the visit where the policy has expired is an ordinary plaintext first request that an on-path attacker can intercept and strip exactly as if HSTS had never been set.

        That makes a short window something an attacker can simply wait for. Someone with recurring access to a target's network, a shared office, a hotel, or a compromised home router, does not need to defeat HSTS; they need to be present the next time the cache is empty, and a short max-age guarantees that moment comes around often.

        A year also crosses the gaps that matter in practice: new devices, reinstalled browsers, cleared profiles, and the long stretches between visits to a site someone uses occasionally rather than daily.

        One year is additionally the minimum the browser preload list accepts, so anything shorter blocks the preload path that the companion check in this policy targets. Note that this check does not fail zones where HSTS is turned off; a separate check in this policy requires HSTS to be enabled in the first place.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **SSL/TLS** > **Edge Certificates** > **HTTP Strict Transport Security (HSTS)**.
        3. Inspect the **Max Age Header** value.

        A passing zone shows a **Max Age Header** of **12 months**, which is 31,536,000 seconds and the highest value the dashboard offers. A failing zone shows a lower value, or HSTS is disabled.

        ### Audit via API

        1. Retrieve the `security_header` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"strict_transport_security": { "enabled": true, "max_age": 31536000, ... }` where `max_age` is 31536000 or greater. A failing zone returns a `max_age` value below 31536000 or `"enabled": false`.
      remediation:
        - id: console
          desc: |
            To raise the HSTS `max-age` in the Cloudflare dashboard:

            1. Log in and select the affected zone.
            2. Navigate to **SSL/TLS** > **Edge Certificates** > **HTTP Strict Transport Security (HSTS)**.
            3. Set **Max Age Header** to **12 months**.
            4. Save.
        - id: cli
          desc: |
            To raise HSTS `max-age` via the Cloudflare API. The PATCH replaces the entire `strict_transport_security` object, so retrieve the current value first and carry over the zone's existing `include_subdomains`, `preload`, and `nosniff` values, changing only `max_age`:

            ```bash
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
              -H "Authorization: Bearer <api-token>"

            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":{"strict_transport_security":{"enabled":true,"max_age":31536000,"include_subdomains":true,"preload":true,"nosniff":true}}}'
            ```
        - id: terraform
          desc: |
            To raise the HSTS `max-age` with Terraform, manage the zone's `security_header` setting with the `cloudflare_zone_setting` resource and set `max_age` to at least `31536000`, one year, in the `strict_transport_security` block. Set the other directives to match the zone's current configuration so applying this change does not alter them:

            ```hcl
            resource "cloudflare_zone_setting" "security_header" {
              zone_id    = var.zone_id
              setting_id = "security_header"
              value = {
                strict_transport_security = {
                  enabled            = true
                  max_age            = 31536000
                  include_subdomains = true
                  preload            = true
                  nosniff            = true
                }
              }
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/http-strict-transport-security/
        title: Cloudflare HSTS
      - url: https://hstspreload.org/
        title: HSTS Preload List requirements
  - uid: mondoo-cloudflare-security-hsts-include-subdomains
    title: Ensure HSTS includes subdomains on HSTS-enabled zones
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-cloudflare-security-hsts-include-subdomains-cloudflare
        tags:
          mondoo.com/filter-title: Cloudflare Zone
          mondoo.com/filter-icon: cloudflare
      - uid: mondoo-cloudflare-security-hsts-include-subdomains-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-include-subdomains-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-cloudflare-security-hsts-include-subdomains-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the zone's HTTPS-only policy extends to every subdomain.

        By default an HSTS policy covers only the exact hostname that served the header. The `includeSubDomains` directive extends it to every name beneath that host, so a browser that has seen the apex policy refuses plaintext connections to all of them. Cloudflare exposes it as **Apply HSTS policy to subdomains** under SSL/TLS > Edge Certificates, in the HSTS section. In Terraform it is the `include_subdomains` field of the `strict_transport_security` block inside the `security_header` entry of a `cloudflare_zone_setting` resource.

        **Why this matters**

        Almost nothing important is served from the apex. Logins, APIs, admin consoles, and customer portals live on subdomains, and an apex-only policy protects none of them until each one has independently served its own HSTS header to that browser. The names most worth attacking are the ones left uncovered.

        Cookies are what turn this into a concrete compromise. A session cookie scoped to the parent domain is sent to every subdomain, so an attacker only needs to get the browser to make one plaintext request to any name under the domain, including one that does not exist, to capture it. Forcing that request is straightforward: an image or link pointing at `http://anything.example.com` is enough, and the cookie goes out in clear text.

        Coverage by default is also what protects the names nobody is tracking. Staging hosts, marketing landing pages, vendor-hosted subdomains, and abandoned services rarely have HSTS configured individually, and a single directive at the apex covers all of them at once.

        That breadth is exactly why this needs care before it is switched on: every hostname under the domain must be able to serve HTTPS, including internal and legacy names, or browsers that have cached the policy will refuse to reach them. This check does not fail zones where HSTS is turned off; a separate check in this policy requires HSTS to be enabled.
      audit: |
        ### Audit via Dashboard

        1. Log in to the Cloudflare dashboard and select the zone.
        2. Navigate to **SSL/TLS** > **Edge Certificates** > **HTTP Strict Transport Security (HSTS)**.
        3. Inspect the **Apply HSTS policy to subdomains** toggle.

        A passing zone shows the subdomain toggle **Enabled** (or HSTS is not enabled on the zone). A failing zone shows HSTS enabled but the subdomain toggle **Disabled**.

        ### Audit via API

        1. Retrieve the `security_header` zone setting:

        ```bash
        curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
        ```

        A passing zone returns `"strict_transport_security": { "enabled": true, "include_subdomains": true, ... }` or `"enabled": false`. A failing zone returns `"enabled": true` with `"include_subdomains": false`.
      remediation:
        - id: console
          desc: |
            To extend HSTS to subdomains in the Cloudflare dashboard:

            1. Log in and select the affected zone.
            2. Navigate to **SSL/TLS** > **Edge Certificates** > **HTTP Strict Transport Security (HSTS)**.
            3. Confirm every subdomain currently supports HTTPS.
            4. Enable **Apply HSTS policy to subdomains**.
            5. Save.
        - id: cli
          desc: |
            To enable `includeSubDomains` via the Cloudflare API. Confirm every subdomain serves HTTPS first; once browsers cache the directive, plaintext subdomains become unreachable for the duration of `max-age`. The PATCH replaces the entire `strict_transport_security` object, so retrieve the current value first and carry over the zone's existing `max_age`, `preload`, and `nosniff` values:

            ```bash
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
              -H "Authorization: Bearer <api-token>"

            curl -X PATCH "https://api.cloudflare.com/client/v4/zones/<zone-id>/settings/security_header" \
              -H "Authorization: Bearer <api-token>" \
              -H "Content-Type: application/json" \
              --data '{"value":{"strict_transport_security":{"enabled":true,"max_age":31536000,"include_subdomains":true,"preload":false,"nosniff":true}}}'
            ```
        - id: terraform
          desc: |
            To extend HSTS to subdomains with Terraform, manage the zone's `security_header` setting with the `cloudflare_zone_setting` resource and set `include_subdomains` to `true` in the `strict_transport_security` block. Confirm every subdomain serves HTTPS first, and set the other directives to match the zone's current configuration so applying this change does not alter them:

            ```hcl
            resource "cloudflare_zone_setting" "security_header" {
              zone_id    = var.zone_id
              setting_id = "security_header"
              value = {
                strict_transport_security = {
                  enabled            = true
                  max_age            = 31536000
                  include_subdomains = true
                  preload            = false
                  nosniff            = true
                }
              }
            }
            ```
    refs:
      - url: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/http-strict-transport-security/
        title: Cloudflare HSTS
