  # Organizations
  # ---------------------------------------------------------------------------
  # No Terraform variants: Codesphere publishes no Terraform provider.
  - uid: mondoo-codesphere-security-organization-no-deleted-members
    filters: asset.platform == "codesphere-organization"
    title: Ensure the organization has no members with deleted user accounts
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-3-ii-c-workforce-security-establish-termination-procedures
      compliance/iso-27001-2022: iso-27001-2022-a-5-18
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-5
      compliance/soc2-2017: soc2-control-cc6-2-2
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      codesphere.organization.members.all(deletedAt == empty)
    docs:
      desc: |
        This check verifies that organization membership is removed for users whose Codesphere account has been deleted.

        An organization groups resource groups, and its members can be added to any of them; organization owners can manage all of them. The organization's **Members** page lists each member with their organizational role. The check fails when a member's user account carries a deletion date.

        **Why this matters**

        Organization membership is the gate to every resource group in the organization. A membership that outlives its account is a grant nobody reviews, and it becomes live access across the organization if the account is restored or its email address is registered again.

        Removing a user from the organization revokes their access in every resource group, which makes it the one step that closes all of it. Do it as part of offboarding, not after.
      audit: |
        ### Audit via Console

        1. Sign in to Codesphere as an organization owner.
        2. Open the organization's settings from the organization and resource group selector, then its **Members** page.

        A passing result shows only members with active accounts.

        ### Audit via CLI

        1. List the organization's members:

        ```bash
        cs list organization-members -g <organization-id> -o json
        ```

        A passing result shows no member with a `deletedAt` value.
      remediation:
        - id: console
          desc: |
            To remove the member using the Codesphere console:

            1. Open the organization's **Members** page.
            2. Open the actions menu on the member's row and remove the member.
        - id: cli
          desc: |
            To remove the member using the `cs` CLI:

            ```bash
            cs delete organization-member -g <organization-id> -u <user-id>
            ```
        - id: api
          desc: |
            To remove the member through the REST API:

            ```bash
            curl -s -X DELETE -H "Authorization: Bearer $CS_TOKEN" \
              "https://cloud.codesphere.com/api/organizations/<organization-id>/members/<user-id>"
            ```
        # No Terraform remediation: Codesphere publishes no Terraform provider.
    refs:
      - url: https://docs.codesphere.com/core-concepts/organizations-and-teams
        title: Codesphere organizations and resource groups
  # No Terraform variants: Codesphere publishes no Terraform provider.
  - uid: mondoo-codesphere-security-organization-no-stale-invitations
    filters: asset.platform == "codesphere-organization"
    title: Ensure organization invitations are not pending for over 30 days
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-ii-c-information-access-management-access-establishment-and-modification
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-2-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      codesphere.organization.members.where(pending == true).all(createdAt > time.now - 30 * time.day)
    docs:
      desc: |
        This check verifies that no invitation to the organization has stayed unaccepted for more than 30 days.

        Inviting someone to an organization creates a pending membership that becomes active as soon as the invitation is accepted, and an organization member can be added to any of its resource groups. The check fails when a pending membership was created more than 30 days ago.

        **Why this matters**

        An unaccepted invitation is a standing grant to whoever controls the invited mailbox. It usually belongs to someone who joined another way, changed address, or left, and it stays redeemable after the reason for it is gone. An attacker who takes over that mailbox accepts it and enters the organization, with an owner role if the invitation carried one.

        Pending invitations do not appear among active members, so access reviews miss them. Revoke them, and send a new invitation when the access is still needed.
      audit: |
        ### Audit via Console

        1. Sign in to Codesphere as an organization owner.
        2. Open the organization's **Members** page and review the pending invitations.

        A passing result shows no invitation older than 30 days.

        ### Audit via CLI

        1. List the organization's members:

        ```bash
        cs list organization-members -g <organization-id> -o json
        ```

        A passing result shows no member with `pending` set to `true` and a `createdAt` date more than 30 days ago.
      remediation:
        - id: console
          desc: |
            To revoke the invitation using the Codesphere console:

            1. Open the organization's **Members** page.
            2. Open the actions menu on the pending member's row and remove it.
            3. Send a new invitation if the person still needs access.
        - id: cli
          desc: |
            To revoke the invitation using the `cs` CLI:

            ```bash
            cs delete organization-member -g <organization-id> -u <user-id>
            ```
        - id: api
          desc: |
            To revoke the invitation through the REST API:

            ```bash
            curl -s -X DELETE -H "Authorization: Bearer $CS_TOKEN" \
              "https://cloud.codesphere.com/api/organizations/<organization-id>/members/<user-id>"
            ```
        # No Terraform remediation: Codesphere publishes no Terraform provider.
    refs:
      - url: https://docs.codesphere.com/core-concepts/organizations-and-teams
        title: Codesphere organizations and resource groups
