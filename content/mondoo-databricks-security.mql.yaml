policies:
  - uid: mondoo-databricks-security
    name: Mondoo Databricks Security
    version: 1.1.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: databricks,saas
    require:
      - provider: databricks
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Databricks accounts, workspaces, clusters, and access controls
    docs:
      desc: |
        The Mondoo Databricks Security policy identifies critical misconfigurations in Databricks accounts and workspaces that could expose data, analytics, and AI workloads to attackers. This policy helps organizations detect and remediate weaknesses before they can be exploited, reducing the likelihood of unauthorized data access, credential theft, and abuse of privileged identities across the Databricks lakehouse platform.

        This policy provides security checks across key Databricks areas:

        - Workspace security settings and hardening profiles
        - Compute cluster isolation, encryption, and governance
        - Personal access token lifecycle and secret scope access
        - Network access controls and private connectivity
        - Customer-managed encryption keys
        - Delta Sharing recipient controls
        - Mosaic AI model serving guardrails
        - Account identity and service principal hygiene

        Learn more about scanning Databricks in the [cnspec documentation](https://mondoo.com/docs/cnspec/saas/databricks).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Workspace Security Settings
        checks:
          - uid: mondoo-databricks-security-workspace-enhanced-security-monitoring-enabled
          - uid: mondoo-databricks-security-workspace-compliance-security-profile-enabled
          - uid: mondoo-databricks-security-workspace-automatic-cluster-update-enabled
          - uid: mondoo-databricks-security-workspace-ip-access-lists-enabled
          - uid: mondoo-databricks-security-workspace-legacy-access-disabled
          - uid: mondoo-databricks-security-workspace-token-lifetime-capped
          - uid: mondoo-databricks-security-workspace-admins-restricted
          - uid: mondoo-databricks-security-workspace-legacy-global-init-scripts-disabled
          - uid: mondoo-databricks-security-workspace-legacy-cluster-named-init-scripts-disabled
          - uid: mondoo-databricks-security-workspace-notebook-results-in-customer-account
      - title: Compute Clusters
        checks:
          - uid: mondoo-databricks-security-cluster-local-disk-encryption-enabled
          - uid: mondoo-databricks-security-cluster-access-mode-user-isolation
          - uid: mondoo-databricks-security-cluster-autotermination-configured
          - uid: mondoo-databricks-security-cluster-no-plaintext-spark-secrets
          - uid: mondoo-databricks-security-cluster-governed-by-policy
      - title: Tokens and Secrets
        checks:
          - uid: mondoo-databricks-security-token-no-nonexpiring
          - uid: mondoo-databricks-security-token-lifetime-under-90-days
          - uid: mondoo-databricks-security-secret-scope-not-world-readable
      - title: Network Access Controls
        checks:
          - uid: mondoo-databricks-security-workspace-public-access-disabled
          - uid: mondoo-databricks-security-private-access-restrict-endpoints
          - uid: mondoo-databricks-security-workspace-customer-managed-keys
          - uid: mondoo-databricks-security-ip-access-list-no-allow-all
      - title: Data Sharing and AI
        checks:
          - uid: mondoo-databricks-security-delta-sharing-recipient-ip-restricted
          - uid: mondoo-databricks-security-serving-endpoint-ai-gateway-guardrails
      - title: Identity and Access Management
        checks:
          - uid: mondoo-databricks-security-no-inactive-service-principals
    scoring_system: highest impact
queries:
  - uid: mondoo-databricks-security-workspace-enhanced-security-monitoring-enabled
    title: Ensure enhanced security monitoring is enabled on the workspace
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-02
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-16
      compliance/nis-2: nis-2-21-2-g
      compliance/nist-csf-1: nist-csf-1-de-cm-4
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-5-2-1
      compliance/soc2-2017: soc2-control-cc6-8-4
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      databricks.workspaceConf.enhancedSecurityMonitoringEnabled == true
    docs:
      desc: |
        This check verifies that the compute nodes behind a workspace boot a hardened operating system image and run antivirus and behavior based monitoring agents.

        Enhanced security monitoring is a workspace admin setting, not an account console setting. An administrator finds it under Settings on the **Security and compliance** tab, and the Databricks CLI reads the same value through `databricks settings enhanced-security-monitoring get`, which reports `is_enabled`. This check requires that flag to be true. The setting is off by default, so a workspace that no one has hardened runs its clusters on a stock image with no host level detection at all.

        **Why this matters**

        Cluster nodes execute whatever a notebook, job, or library asks them to. An attacker who gets code onto a node through a typosquatted package pulled from a public index, a poisoned dependency in a job, or an init script pointed at a bucket somebody else can write to, now owns a process on a host that holds the cluster's cloud identity. From there they read the instance profile or managed identity credentials off the node and use them against every storage location the cluster is entitled to reach.

        Without the hardened image and the monitoring agents, nothing on the host observes any of that. There is no antivirus scan of what the process writes to disk, no behavioral signal when a long running Spark executor suddenly spawns a shell or opens an outbound connection, and no host telemetry for a responder to correlate afterward. The first evidence tends to be an egress bill or a downstream data alert weeks later.

        Turning the setting on changes the image clusters boot from, so running clusters keep their current image until they restart. Pair the change with the automatic cluster update companion check in this policy so nodes actually cycle onto the hardened build rather than waiting for a manual restart.
      audit: |
        ### Audit via Console

        1. Sign in to the workspace as an administrator.
        2. Open **Settings** and select the **Security and compliance** tab.
        3. Locate **Enhanced security monitoring** and confirm the toggle is enabled.

        A passing result shows the toggle enabled; a failing result shows it disabled.

        ### Audit via CLI

        Run the settings command with the Databricks CLI configured for the workspace:

        ```bash
        databricks settings enhanced-security-monitoring get
        ```

        A passing result returns an `is_enabled` value of `true`; a failing result returns `false` or an unset value.
      remediation:
        - id: console
          desc: |
            To enable Enhanced Security Monitoring using the Databricks workspace admin console:

            1. Sign in to the workspace as an administrator.
            2. Open **Settings** and select the **Security and compliance** tab.
            3. Find **Enhanced security monitoring** and set the toggle to enabled.
            4. Save the change. Existing clusters pick up the hardened image and agents on their next restart.
        - id: cli
          desc: |
            To enable Enhanced Security Monitoring using the Databricks CLI:

            1. Confirm the current state:

                ```bash
                databricks settings enhanced-security-monitoring get
                ```

            2. Enable the setting:

                ```bash
                databricks settings enhanced-security-monitoring update --json '{"enhanced_security_monitoring": {"enabled": true}}'
                ```
        - id: terraform
          desc: |
            To enable Enhanced Security Monitoring using Terraform, declare the workspace setting resource with the `databricks/databricks` provider configured at workspace level:

            ```hcl
            resource "databricks_enhanced_security_monitoring_workspace_setting" "this" {
              enhanced_security_monitoring_workspace {
                is_enabled = true
              }
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-monitoring
        title: Databricks enhanced security monitoring documentation
  - uid: mondoo-databricks-security-workspace-compliance-security-profile-enabled
    title: Ensure the compliance security profile is enabled on the workspace
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: false
    mql: |
      databricks.workspaceConf.complianceSecurityProfileEnabled == true
    docs:
      desc: |
        This check verifies that the workspace runs under the hardened baseline that the compliance security profile applies.

        The compliance security profile is a workspace admin setting under Settings on the **Security and compliance** tab, and the Databricks CLI reports it through `databricks settings compliance-security-profile get` as `is_enabled`. Enabling it turns on the hardened operating system image, forces FIPS validated cryptographic modules for data in transit and at rest, and switches on enhanced monitoring, all as one bundle. An administrator then attaches the standards that apply to the workload, values such as `HIPAA`, `PCI_DSS`, and the FedRAMP levels. This check requires the profile to be enabled; it is off by default.

        **Why this matters**

        Without the profile, each hardening control is an independent toggle that somebody has to remember. A workspace that was built for a regulated workload but never had the profile enabled runs on a stock image, negotiates with whatever cipher suites the default stack offers, and carries no host monitoring. An attacker probing that workspace gets the widest set of protocol options to work with and the least chance of being noticed on the node once they land there.

        The profile also constrains what the platform itself does with the data. Regulated workloads assume a specific handling posture from the vendor, and a workspace outside the profile does not have it, so sensitive records processed there sit under weaker guarantees than the paperwork claims.

        Enabling the profile on a workspace is permanent and cannot be undone, so confirm the target workspace before you turn it on. It also restricts which runtime versions and cluster configurations remain available, which can break jobs pinned to older runtimes.
      audit: |
        ### Audit via Console

        1. Sign in to the workspace as an administrator.
        2. Open **Settings** and select the **Security and compliance** tab.
        3. Locate **Compliance security profile** and confirm the toggle is enabled.

        A passing result shows the toggle enabled; a failing result shows it disabled.

        ### Audit via CLI

        Run the settings command with the Databricks CLI configured for the workspace:

        ```bash
        databricks settings compliance-security-profile get
        ```

        A passing result returns an `is_enabled` value of `true`; a failing result returns `false` or an unset value.
      remediation:
        - id: console
          desc: |
            To enable the Compliance Security Profile using the Databricks workspace admin console:

            1. Sign in to the workspace as an administrator.
            2. Open **Settings** and select the **Security and compliance** tab.
            3. Find **Compliance security profile** and set the toggle to enabled.
            4. Select the compliance standards that apply to your workloads and save.

            > **Warning:** Enabling the Compliance Security Profile on a workspace is permanent and cannot be reversed, so confirm the workspace is the correct target before you enable it.
        - id: cli
          desc: |
            To enable the Compliance Security Profile using the Databricks CLI:

            1. Confirm the current state:

                ```bash
                databricks settings compliance-security-profile get
                ```

            2. Enable the setting. Enabling it is permanent, so verify the target workspace first:

                ```bash
                databricks settings compliance-security-profile update --json '{"compliance_security_profile": {"enabled": true}}'
                ```
        - id: terraform
          desc: |
            To enable the Compliance Security Profile using Terraform, declare the workspace setting resource with the `databricks/databricks` provider configured at workspace level and list the standards you must meet:

            ```hcl
            resource "databricks_compliance_security_profile_workspace_setting" "this" {
              compliance_security_profile_workspace {
                is_enabled           = true
                compliance_standards = ["HIPAA", "PCI_DSS"]
              }
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-compliance
        title: Databricks enhanced security and compliance settings documentation
  - uid: mondoo-databricks-security-workspace-automatic-cluster-update-enabled
    title: Ensure automatic cluster update is enabled on the workspace
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      databricks.workspaceConf.automaticClusterUpdateEnabled == true
    docs:
      desc: |
        This check verifies that the virtual machine images behind the workspace's compute are patched on a schedule instead of drifting.

        Automatic cluster update is a workspace admin setting under Settings on the **Security and compliance** tab, where an administrator enables it and picks a maintenance window. The Databricks CLI reads the same state with `databricks settings automatic-cluster-update get`, which reports `enabled`. This check requires that flag to be true. The setting is disabled by default, so nothing restarts a long lived cluster onto a newer image.

        **Why this matters**

        A cluster keeps the image it booted with for as long as it runs. An all purpose cluster that has been up for months is running the kernel, container runtime, and system libraries that shipped the day it started, and every vulnerability disclosed since then is still present on it. The exploit code for those flaws is public, which is exactly what makes this reachable rather than theoretical.

        The path an attacker takes is short. They get ordinary code execution on the node first, through a notebook they are allowed to run or a library the cluster loads, then use a published local privilege escalation against the unpatched kernel to break out of whatever confinement the workload had. At that point they hold the node's cloud credentials and can read every storage location the cluster is entitled to, plus anything else cached on local disk from other work that ran there.

        Scheduled updates close that gap without anyone tracking advisories by hand. Choose a maintenance window that tolerates a restart, because applying an image requires cycling the cluster, and long running streaming jobs need their restart behavior checked before you enable it.
      audit: |
        ### Audit via Console

        1. Sign in to the workspace as an administrator.
        2. Open **Settings** and select the **Security and compliance** tab.
        3. Locate **Automatic cluster update** and confirm the toggle is enabled.

        A passing result shows the toggle enabled; a failing result shows it disabled.

        ### Audit via CLI

        Run the settings command with the Databricks CLI configured for the workspace:

        ```bash
        databricks settings automatic-cluster-update get
        ```

        A passing result returns an `enabled` value of `true`; a failing result returns `false` or an unset value.
      remediation:
        - id: console
          desc: |
            To enable Automatic Cluster Update using the Databricks workspace admin console:

            1. Sign in to the workspace as an administrator.
            2. Open **Settings** and select the **Security and compliance** tab.
            3. Find **Automatic cluster update** and set the toggle to enabled.
            4. Configure the maintenance window and save.
        - id: cli
          desc: |
            To enable Automatic Cluster Update using the Databricks CLI:

            1. Confirm the current state:

                ```bash
                databricks settings automatic-cluster-update get
                ```

            2. Enable the setting:

                ```bash
                databricks settings automatic-cluster-update update --json '{"automatic_cluster_update": {"enabled": true}}'
                ```
        - id: terraform
          desc: |
            To enable Automatic Cluster Update using Terraform, declare the workspace setting resource with the `databricks/databricks` provider configured at workspace level and define a maintenance window:

            ```hcl
            resource "databricks_automatic_cluster_update_workspace_setting" "this" {
              automatic_cluster_update_workspace {
                enabled = true
                maintenance_window {
                  week_day_based_schedule {
                    day_of_week = "SUNDAY"
                    frequency   = "EVERY_WEEK"
                    window_start_time {
                      hours   = 1
                      minutes = 0
                    }
                  }
                }
              }
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-compliance
        title: Databricks enhanced security and compliance settings documentation
  - uid: mondoo-databricks-security-workspace-ip-access-lists-enabled
    title: Ensure IP access lists are enabled for the workspace
    impact: 80
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      databricks.workspaceConf.ipAccessListsEnabled == true
    docs:
      desc: |
        This check verifies that the workspace only accepts connections from networks an administrator has approved.

        IP access list enforcement is a workspace admin setting under Settings on the **Security** tab, where allow and block lists are defined and enforcement is switched on. The Databricks CLI reads the enforcement flag with `databricks workspace-conf get-status enableIpAccessLists` and the lists themselves with `databricks ip-access-lists list`. This check requires `enableIpAccessLists` to be true. It is false by default, and it stays false even after someone defines allow lists, so a workspace can carry a carefully written list that gates nothing.

        **Why this matters**

        With enforcement off, the workspace web application and the whole REST API answer from any address on the internet. That turns every credential in the workspace into a remotely usable one. An attacker who picks up a personal access token from a committed `.env` file, a CI log, a laptop backup, or a phishing page does not need to be anywhere near the corporate network to use it. They point the Databricks CLI at the workspace host from their own machine, list clusters, read secret scopes they have access to, submit a job that reads the storage the cluster identity can reach, and pull the results out.

        Enforcement makes the stolen token useless outside the ranges you named. It is a control that holds even when authentication has already failed, which is the case that matters.

        Enable it only after the allow list covers your own current egress address, along with corporate ranges, VPN exit addresses, and any CI runner that talks to the workspace. Turning enforcement on without those entries locks out everyone, including the administrator making the change.
      audit: |
        ### Audit via Console

        1. Sign in to the workspace as an administrator.
        2. Open **Settings** and select the **Security** tab.
        3. Locate **IP access lists** and confirm enforcement is enabled and at least one allow list is defined.

        A passing result shows enforcement enabled; a failing result shows it disabled.

        ### Audit via CLI

        Check the enforcement flag and the configured lists with the Databricks CLI configured for the workspace:

        ```bash
        databricks workspace-conf get-status enableIpAccessLists
        databricks ip-access-lists list
        ```

        A passing result returns `enableIpAccessLists` as `true`; a failing result returns `false` or an unset value.
      remediation:
        - id: console
          desc: |
            To enable IP access list enforcement using the Databricks workspace admin console:

            1. Sign in to the workspace as an administrator.
            2. Open **Settings** and select the **Security** tab.
            3. Under **IP access lists**, add an allow list with the CIDR ranges for your corporate networks and VPN egress addresses.
            4. Enable enforcement and save.

            > **Warning:** Enabling enforcement without an allow list that includes your current public address blocks everyone, including you. Confirm your egress range is covered before you enable it.
        - id: cli
          desc: |
            To enable IP access list enforcement using the Databricks CLI:

            1. Create at least one allow list that includes your trusted ranges. Replace the reserved documentation range below with your real egress ranges:

                ```bash
                databricks ip-access-lists create --json '{"label": "corp-allow", "list_type": "ALLOW", "ip_addresses": ["203.0.113.0/24"]}'
                ```

            2. Enable enforcement:

                ```bash
                databricks workspace-conf set-status --json '{"enableIpAccessLists": "true"}'
                ```

            3. Verify the flag and lists:

                ```bash
                databricks workspace-conf get-status enableIpAccessLists
                databricks ip-access-lists list
                ```
        - id: terraform
          desc: |
            To enable IP access list enforcement using Terraform, set the workspace configuration flag with the `databricks/databricks` provider and define at least one allow list. The `203.0.113.0/24` value is a reserved documentation range you must replace with your real egress ranges:

            ```hcl
            resource "databricks_workspace_conf" "this" {
              custom_config = {
                "enableIpAccessLists" = "true"
              }
            }

            resource "databricks_ip_access_list" "allow_in" {
              label        = "corp-allow"
              list_type    = "ALLOW"
              ip_addresses = ["203.0.113.0/24"]
              depends_on   = [databricks_workspace_conf.this]
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
        title: Databricks IP access lists documentation
  - uid: mondoo-databricks-security-workspace-legacy-access-disabled
    title: Ensure legacy access protocols are disabled on the workspace
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-1-6
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      databricks.workspaceConf.disableLegacyAccess == true
    docs:
      desc: |
        This check verifies that data access in the workspace is forced through Unity Catalog rather than the legacy paths that predate it.

        The legacy access setting lives under Settings on the **Security** tab of the workspace admin console, and the Databricks CLI reads it with `databricks settings disable-legacy-access get`, which reports `disabled`. This check requires legacy access to be disabled. It is available by default, which leaves direct Hive metastore access, fallback mode on external locations, and Databricks Runtime versions that predate the governed access model all still usable.

        **Why this matters**

        Unity Catalog is where the grants, row and column filters, and lineage live. The legacy paths do not consult any of it. A user who cannot query a table through the catalog can point a cluster at the Hive metastore, read the table's storage location straight from it, and get the underlying files with the cluster's own credentials. The permission model that was supposed to stop them was never in the request path.

        Fallback mode on external locations does the same for cloud storage. It lets a workload bypass the external location's credential and use whatever identity the compute carries, so a person with cluster access reads storage that Unity Catalog would have denied them. Neither route leaves a lineage record, so the read does not appear where an auditor would look for it.

        Disabling legacy access also retires the old runtimes that only speak the ungoverned protocol. Migrate any workload that still reads through the Hive metastore into Unity Catalog before you flip the setting, because those jobs will fail immediately once the legacy path closes.
      audit: |
        ### Audit via Console

        1. Sign in to the workspace as an administrator.
        2. Open **Settings** and select the **Security** tab.
        3. Locate the legacy access setting and confirm it is disabled so access is forced through Unity Catalog.

        A passing result shows legacy access disabled; a failing result shows it still permitted.

        ### Audit via CLI

        Run the settings command with the Databricks CLI configured for the workspace:

        ```bash
        databricks settings disable-legacy-access get
        ```

        A passing result returns a `disabled` value of `true`; a failing result returns `false` or an unset value.
      remediation:
        - id: console
          desc: |
            To disable legacy access using the Databricks workspace admin console:

            1. Sign in to the workspace as an administrator.
            2. Open **Settings** and select the **Security** tab.
            3. Locate the legacy access setting and set it to disabled so access is forced through Unity Catalog.
            4. Save the change.
        - id: cli
          desc: |
            To disable legacy access using the Databricks CLI:

            1. Confirm the current state:

                ```bash
                databricks settings disable-legacy-access get
                ```

            2. Disable legacy access:

                ```bash
                databricks settings disable-legacy-access update --json '{"disable_legacy_access": {"disabled": true}}'
                ```
        - id: terraform
          desc: |
            To disable legacy access using Terraform, declare the workspace setting resource with the `databricks/databricks` provider configured at workspace level:

            ```hcl
            resource "databricks_disable_legacy_access_setting" "this" {
              disable_legacy_access {
                value = true
              }
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/hive-metastore
        title: Databricks legacy Hive metastore and Unity Catalog documentation
  - uid: mondoo-databricks-security-workspace-token-lifetime-capped
    title: Ensure personal access tokens are disabled or lifetime is capped
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      databricks.workspaceConf.tokensEnabled == false || databricks.workspaceConf.maxTokenLifetimeDays != empty && databricks.workspaceConf.maxTokenLifetimeDays <= 90
    docs:
      desc: |
        This check verifies that the workspace either refuses to issue personal access tokens at all or caps how long a newly issued one stays valid.

        Personal access tokens are bearer credentials that authenticate to the entire Databricks REST API. An administrator controls them under Settings in the **Advanced** section of the workspace admin console, and the Databricks CLI reads the two governing keys with `databricks workspace-conf get-status enableTokens` and `databricks workspace-conf get-status maxTokenLifetimeDays`. This check passes when `enableTokens` is false, or when `maxTokenLifetimeDays` is set to 90 or fewer. Databricks ships with no maximum lifetime configured, so a token created today can remain valid until somebody remembers to revoke it.

        **Why this matters**

        A token is a single string, and everything an attacker needs comes with it. They find one in a git history, a notebook someone exported, a Slack message, a CI job log, or a stolen laptop's shell history, and they replay it against the workspace API from anywhere. No password, no second factor, no session to expire. They enumerate clusters and jobs, read the secret scopes the owning user can read, and submit their own job that reads the storage the workspace compute can reach.

        An uncapped lifetime is what turns that from an incident into a standing foothold. The credential in a two year old repository is still live. The token belonging to a contractor who left last spring still works. Capping the lifetime at 90 days means the leaked string becomes dead weight on its own schedule, whether or not anyone ever noticed the leak.

        Disabling tokens outright is the stronger position where OAuth and service principals cover the automation. Where tokens are still needed, the cap is what bounds the damage.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an admin.
        2. Open Settings, then the Advanced section.
        3. Review the Personal Access Tokens setting and its configured maximum lifetime.

        A passing result shows personal access tokens disabled, or a maximum lifetime set to 90 days or fewer. A failing result shows tokens enabled with no maximum lifetime or a lifetime greater than 90 days.

        ### Audit via CLI

        1. Query the workspace configuration for the token settings:

        ```bash
        databricks workspace-conf get-status enableTokens
        databricks workspace-conf get-status maxTokenLifetimeDays
        ```

        2. Compare the returned values against the required thresholds.

        A passing result shows `enableTokens` set to `false`, or `maxTokenLifetimeDays` set to `90` or fewer. A failing result shows `enableTokens` set to `true` with `maxTokenLifetimeDays` empty or greater than `90`.
      remediation:
        - id: console
          desc: |
            To disable personal access tokens or cap their lifetime using the Databricks console:

            1. Sign in to the workspace as an admin.
            2. Open Settings, then Advanced.
            3. Turn the Personal Access Tokens setting off to disable tokens, or open the token permission settings and set a maximum lifetime of 90 days or fewer.

            ```text
            Settings > Advanced > Personal Access Tokens
            ```
        - id: cli
          desc: |
            To cap the personal access token lifetime using the Databricks CLI:

            1. Set the workspace maximum token lifetime to 90 days or fewer:

            ```bash
            databricks workspace-conf set-status --json '{"maxTokenLifetimeDays": "90"}'
            ```

            2. To disable personal access tokens for the whole workspace instead:

            ```bash
            databricks workspace-conf set-status --json '{"enableTokens": "false"}'
            ```
        - id: terraform
          desc: |
            To cap the personal access token lifetime using the Databricks Terraform provider, set the workspace configuration keys:

            ```hcl
            resource "databricks_workspace_conf" "this" {
              custom_config = {
                "enableTokens"         = "true"
                "maxTokenLifetimeDays" = "90"
              }
            }
            ```
  - uid: mondoo-databricks-security-workspace-admins-restricted
    title: Ensure workspace admin privileges are restricted
    impact: 60
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      databricks.workspaceConf.restrictWorkspaceAdminsStatus == "RESTRICT_TOKENS_AND_JOB_RUN_AS"
    docs:
      desc: |
        This check verifies that a workspace administrator cannot act as identities they do not own.

        The **Restrict workspace admins** setting sits under Settings in the **Security** section of the workspace admin console, and the Databricks CLI reads it with `databricks settings restrict-workspace-admins get`. This check requires the status `RESTRICT_TOKENS_AND_JOB_RUN_AS`, which stops workspace admins from minting personal access tokens on behalf of arbitrary service principals and from changing the run-as identity of a job. The default is `ALLOW_ALL`, under which both are permitted.

        **Why this matters**

        Workspace admin is a role many people hold, often as a convenience for managing clusters and settings. Under `ALLOW_ALL` it is also a route to every other identity in the workspace. An admin, or anyone who takes over an admin session, edits an existing job to run as the service principal that owns your most sensitive pipeline, adds a task that dumps that pipeline's tables to a location they control, and runs it once. The job runs with the pipeline identity's grants, not theirs, so Unity Catalog authorizes every read.

        Token minting is the quieter version of the same move. The admin issues a personal access token for a privileged service principal, and from then on holds a portable credential for that identity that outlives their own session and does not look like an admin action in the logs.

        Restricting the setting keeps jobs and tokens bound to their legitimate owners, so administering the workspace stays separate from acting inside it. Expect to hear from teams that relied on an admin changing a job's run-as identity for them; that work moves to the identity's own owner.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an admin.
        2. Open Settings, then the Security section.
        3. Review the Restrict workspace admins setting.

        A passing result shows the setting restricting token generation and job run-as changes. A failing result shows the setting allowing all admin actions.

        ### Audit via CLI

        1. Read the current restrict workspace admins setting:

        ```bash
        databricks settings restrict-workspace-admins get
        ```

        A passing result shows a `status` of `RESTRICT_TOKENS_AND_JOB_RUN_AS`. A failing result shows a `status` of `ALLOW_ALL`.
      remediation:
        - id: console
          desc: |
            To restrict workspace admin privileges using the Databricks console:

            1. Sign in to the workspace as an admin.
            2. Open Settings, then Security.
            3. Set Restrict workspace admins to the option that limits token generation and job run-as identity changes.

            ```text
            Settings > Security > Restrict workspace admins
            ```
        - id: cli
          desc: |
            To restrict workspace admin privileges using the Databricks CLI:

            1. Update the restrict workspace admins setting to the restricted status:

            ```bash
            databricks settings restrict-workspace-admins update --json '{
              "allow_missing": true,
              "setting": {
                "restrict_workspace_admins": { "status": "RESTRICT_TOKENS_AND_JOB_RUN_AS" },
                "setting_name": "default"
              },
              "field_mask": "restrict_workspace_admins.status"
            }'
            ```
        - id: terraform
          desc: |
            To restrict workspace admin privileges using the Databricks Terraform provider, declare the restrict workspace admins setting:

            ```hcl
            resource "databricks_restrict_workspace_admins_setting" "this" {
              setting_name = "default"

              restrict_workspace_admins {
                status = "RESTRICT_TOKENS_AND_JOB_RUN_AS"
              }
            }
            ```
  - uid: mondoo-databricks-security-workspace-legacy-global-init-scripts-disabled
    title: Ensure deprecated global init scripts are disabled
    impact: 60
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      databricks.workspaceConf.deprecatedGlobalInitScriptsEnabled == false
    docs:
      desc: |
        This check verifies that the workspace has retired the legacy global init script mechanism in favor of the named, versioned replacement.

        Legacy global init scripts run as root on every node of every cluster in the workspace at startup. An administrator switches the mechanism off under Settings in the **Compute** section of the workspace admin console, and the Databricks CLI reads the same key with `databricks workspace-conf get-status enableDeprecatedGlobalInitScripts`. This check requires `enableDeprecatedGlobalInitScripts` to be false. Older workspaces often still carry it enabled because the flag was never turned off after Databricks introduced named global init scripts, which are versioned, individually access controlled, and auditable.

        **Why this matters**

        The legacy mechanism is root code execution across the entire workspace with no per script access control and no per script audit record. An attacker who reaches the storage path the legacy scripts are read from appends a few lines to one of them, and from that point every cluster anyone starts executes those lines as root before the workload begins. They run on the analyst's ad hoc cluster, on the nightly job cluster, on the cluster the security team uses.

        That gives the attacker persistence that survives cluster restarts, cluster deletion, and the incident response that follows, because nothing about the change is attributable. There is no version history to diff, no owner to ask, and no log line naming which script did what. A responder looking at a compromised node sees a root process with no provenance.

        The named replacement keeps the same capability with the properties that make it reviewable. Move any surviving init logic to it before disabling the legacy path, because clusters that depend on a legacy script will start without it.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an admin.
        2. Open Settings, then the Compute section.
        3. Review the Legacy global init scripts setting.

        A passing result shows legacy global init scripts disabled. A failing result shows them enabled.

        ### Audit via CLI

        1. Read the workspace configuration key:

        ```bash
        databricks workspace-conf get-status enableDeprecatedGlobalInitScripts
        ```

        A passing result shows `enableDeprecatedGlobalInitScripts` set to `false`. A failing result shows it set to `true`.
      remediation:
        - id: console
          desc: |
            To disable deprecated global init scripts using the Databricks console:

            1. Sign in to the workspace as an admin.
            2. Open Settings, then Compute.
            3. Turn the Legacy global init scripts setting off.

            ```text
            Settings > Compute > Legacy global init scripts
            ```
        - id: cli
          desc: |
            To disable deprecated global init scripts using the Databricks CLI:

            1. Set the workspace configuration key to false:

            ```bash
            databricks workspace-conf set-status --json '{"enableDeprecatedGlobalInitScripts": "false"}'
            ```
        - id: terraform
          desc: |
            To disable deprecated global init scripts using the Databricks Terraform provider, set the workspace configuration key:

            ```hcl
            resource "databricks_workspace_conf" "this" {
              custom_config = {
                "enableDeprecatedGlobalInitScripts" = "false"
              }
            }
            ```
  - uid: mondoo-databricks-security-workspace-legacy-cluster-named-init-scripts-disabled
    title: Ensure deprecated cluster-named init scripts are disabled
    impact: 60
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      databricks.workspaceConf.deprecatedClusterNamedInitScriptsEnabled == false
    docs:
      desc: |
        This check verifies that the workspace no longer executes init scripts selected by matching a cluster's name against a DBFS path.

        Legacy cluster-named init scripts live in DBFS and run automatically when a cluster whose name matches the script starts. An administrator disables the mechanism under Settings in the **Compute** section of the workspace admin console, and the Databricks CLI reads the key with `databricks workspace-conf get-status enableDeprecatedClusterNamedInitScripts`. This check requires `enableDeprecatedClusterNamedInitScripts` to be false. Workspaces created before Databricks replaced the mechanism with access controlled cluster-scoped and named global init scripts often still have it enabled.

        **Why this matters**

        The mechanism binds code execution to a string that anyone can guess and a storage path that many people can write to. Any workspace user with DBFS write access creates a file at the path matching a cluster name, and the next time that cluster starts, their code runs on every node before the workload does. The cluster owner never reviewed it and has no reason to look.

        That is a direct privilege escalation for a low privileged user. They write a script named after the production job cluster, wait for the nightly run, and their code executes with the cluster's cloud identity, reading the storage that identity is entitled to and forwarding it somewhere else. It also works in reverse as a trap: create the file first, then wait for anyone to happen to name a cluster that way.

        Cluster-scoped init scripts stored in workspace files or Unity Catalog volumes give the same startup hook with real access control on both the script and the cluster. Migrate anything still relying on the name match before disabling the mechanism.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an admin.
        2. Open Settings, then the Compute section.
        3. Review the Legacy cluster-named init scripts setting.

        A passing result shows legacy cluster-named init scripts disabled. A failing result shows them enabled.

        ### Audit via CLI

        1. Read the workspace configuration key:

        ```bash
        databricks workspace-conf get-status enableDeprecatedClusterNamedInitScripts
        ```

        A passing result shows `enableDeprecatedClusterNamedInitScripts` set to `false`. A failing result shows it set to `true`.
      remediation:
        - id: console
          desc: |
            To disable deprecated cluster-named init scripts using the Databricks console:

            1. Sign in to the workspace as an admin.
            2. Open Settings, then Compute.
            3. Turn the Legacy cluster-named init scripts setting off.

            ```text
            Settings > Compute > Legacy cluster-named init scripts
            ```
        - id: cli
          desc: |
            To disable deprecated cluster-named init scripts using the Databricks CLI:

            1. Set the workspace configuration key to false:

            ```bash
            databricks workspace-conf set-status --json '{"enableDeprecatedClusterNamedInitScripts": "false"}'
            ```
        - id: terraform
          desc: |
            To disable deprecated cluster-named init scripts using the Databricks Terraform provider, set the workspace configuration key:

            ```hcl
            resource "databricks_workspace_conf" "this" {
              custom_config = {
                "enableDeprecatedClusterNamedInitScripts" = "false"
              }
            }
            ```
  - uid: mondoo-databricks-security-workspace-notebook-results-in-customer-account
    title: Ensure interactive notebook results are stored in the customer account
    impact: 60
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-19
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-12
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm02
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-5-3-4
    mql: |
      databricks.workspaceConf.storeInteractiveNotebookResultsInCustomerAccount == true
    docs:
      desc: |
        This check verifies that the output of interactive notebook commands is persisted in your own cloud storage account rather than in the Databricks control plane.

        The setting appears under Settings in the **Security** section of the workspace admin console, and the Databricks CLI reads it with `databricks workspace-conf get-status storeInteractiveNotebookResultsInCustomerAccount`. This check requires `storeInteractiveNotebookResultsInCustomerAccount` to be true. Left at its default, result data for interactive commands is held in the vendor managed control plane instead of the storage account you configured for the workspace.

        **Why this matters**

        Notebook results are the data, not a summary of it. A cell that displays the first rows of a customer table persists those rows. A query written to check a join persists real identifiers, account numbers, and whatever else the table holds. Analysts run hundreds of these a day, and every one leaves its output behind.

        When that output lives in the control plane it sits outside every control you built for the data itself. Your customer managed key does not encrypt it. Your storage account policies, network restrictions, and object level audit logging do not apply to it. Your retention and deletion process cannot reach it, so a record you deleted from the source table still exists in a result blob you cannot enumerate. If you are obligated to keep data in a particular region, that obligation is not being met for the copy you cannot see.

        Storing results in your own account brings them back inside the boundary, under the same key, the same access policies, and the same audit trail as the tables they came from. The setting applies to results produced after the change, so plan for the older material separately.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an admin.
        2. Open Settings, then the Security section.
        3. Review the Store interactive notebook results in customer account setting.

        A passing result shows results stored in the customer account. A failing result shows results stored in the Databricks control plane.

        ### Audit via CLI

        1. Read the workspace configuration key:

        ```bash
        databricks workspace-conf get-status storeInteractiveNotebookResultsInCustomerAccount
        ```

        A passing result shows `storeInteractiveNotebookResultsInCustomerAccount` set to `true`. A failing result shows it set to `false`.
      remediation:
        - id: console
          desc: |
            To store interactive notebook results in the customer account using the Databricks console:

            1. Sign in to the workspace as an admin.
            2. Open Settings, then Security.
            3. Turn the Store interactive notebook results in customer account setting on.

            ```text
            Settings > Security > Store interactive notebook results in customer account
            ```
        - id: cli
          desc: |
            To store interactive notebook results in the customer account using the Databricks CLI:

            1. Set the workspace configuration key to true:

            ```bash
            databricks workspace-conf set-status --json '{"storeInteractiveNotebookResultsInCustomerAccount": "true"}'
            ```
        - id: terraform
          desc: |
            To store interactive notebook results in the customer account using the Databricks Terraform provider, set the workspace configuration key:

            ```hcl
            resource "databricks_workspace_conf" "this" {
              custom_config = {
                "storeInteractiveNotebookResultsInCustomerAccount" = "true"
              }
            }
            ```
  - uid: mondoo-databricks-security-cluster-local-disk-encryption-enabled
    title: Ensure local disk encryption is enabled on all compute clusters
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a28
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      databricks.clusters.all(localDiskEncryptionEnabled == true)
    docs:
      desc: |
        This check verifies that every compute cluster encrypts the local disks its nodes use for scratch storage.

        Spark writes shuffle partitions, cached datasets, and spilled records to node local storage during execution. The cluster attribute controlling whether that storage is encrypted is `enable_local_disk_encryption`, visible in the JSON view of a cluster under **Compute** and readable with `databricks clusters get <cluster-id> --output JSON`. This check requires the attribute to be true on every cluster. It is off by default, and it is absent rather than false on a cluster nobody set it on, which reads the same way.

        **Why this matters**

        Data that an operator believes never leaves memory does leave memory. A join large enough to spill, a cached DataFrame under pressure, a shuffle across a wide dataset: all of them land plaintext records on the worker's attached storage, including columns the query only touched in passing. The rows land there whether or not the query result was ever displayed.

        Those disks outlive the workload. Cloud instance storage and any snapshot taken from it are readable by anyone who reaches the underlying infrastructure, which includes an attacker who has compromised the cloud account rather than Databricks itself. They do not need to authenticate to the workspace or hold any Unity Catalog grant. They read the volume and recover whatever the last jobs spilled, sometimes long after the cluster is gone.

        Enabling encryption binds an ephemeral key to the cluster's lifetime, so the spilled data is unreadable once the cluster ends. Fix the attribute in a cluster policy rather than per cluster, using a `"type": "fixed"` entry, so nobody can launch compute that writes plaintext to local disk. Existing clusters must be recreated to pick it up.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Compute** and open each all-purpose or job cluster.
        3. Open the **JSON** view of the cluster and locate the `enable_local_disk_encryption` field.

        A passing result shows `enable_local_disk_encryption` set to `true` on every cluster; a failing result shows the field absent or set to `false` on at least one cluster.

        ### Audit via CLI

        1. List the clusters in the workspace:

           ```bash
           databricks clusters list --output JSON
           ```

        2. Inspect each cluster specification:

           ```bash
           databricks clusters get <cluster-id> --output JSON
           ```

        A passing result shows `enable_local_disk_encryption` set to `true` for every cluster; a failing result shows the field missing or `false` for at least one cluster.
      remediation:
        - id: console
          desc: |
            To enforce local disk encryption on compute clusters using the workspace console:

            1. Sign in to the Databricks workspace as an administrator.
            2. Go to **Compute** and select the **Policies** tab.
            3. Create or edit the cluster policy that governs your clusters and set the encryption attribute in the policy definition:

               ```json
               {
                 "enable_local_disk_encryption": {
                   "type": "fixed",
                   "value": true
                 }
               }
               ```

            4. Recreate any existing clusters under the updated policy so the setting takes effect.
        - id: cli
          desc: |
            To enable local disk encryption on a cluster using the Databricks CLI:

            1. Retrieve the current cluster specification so you can resubmit it with the encryption flag:

               ```bash
               databricks clusters get <cluster-id> --output JSON
               ```

            2. Resubmit the full specification with encryption enabled:

               ```bash
               databricks clusters edit --json '{
                 "cluster_id": "<cluster-id>",
                 "num_workers": 2,
                 "spark_version": "<runtime-version>",
                 "node_type_id": "<node-type>",
                 "enable_local_disk_encryption": true
               }'
               ```
        - id: terraform
          desc: |
            To enable local disk encryption on a cluster using Terraform, set `enable_local_disk_encryption` on the `databricks_cluster` resource:

            ```hcl
            resource "databricks_cluster" "this" {
              cluster_name                 = "secured-cluster"
              spark_version                = "15.4.x-scala2.12"
              node_type_id                 = "i3.xlarge"
              num_workers                  = 2
              enable_local_disk_encryption = true
            }
            ```
  - uid: mondoo-databricks-security-cluster-access-mode-user-isolation
    title: Ensure compute clusters enforce an access mode with user isolation
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a15
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      databricks.clusters.all(dataSecurityMode != empty && dataSecurityMode != "NONE")
    docs:
      desc: |
        This check verifies that every compute cluster runs under an access mode that keeps Unity Catalog governance and table access controls in the request path.

        The **Access mode** field on a cluster under **Compute** maps to the `data_security_mode` attribute. This check fails a cluster whose mode is unset or set to `NONE`, the value behind the no isolation shared option. Modes that provide isolation include `SINGLE_USER`, `USER_ISOLATION`, and the newer `DATA_SECURITY_MODE_DEDICATED`, `DATA_SECURITY_MODE_STANDARD`, and `DATA_SECURITY_MODE_AUTO`. The deprecated `LEGACY_*` modes still provide some isolation and therefore pass. Only `NONE` provides none.

        **Why this matters**

        A cluster in `NONE` mode is not connected to Unity Catalog and does not evaluate table access controls, so the row filters, column masks, and grants that define who may see what are not consulted for anything that runs on it. The permissions still exist in the catalog; they are just not in the path.

        What runs on such a cluster is arbitrary JVM code. A user who is allowed to attach a notebook can read the cluster's mounted storage directly, dump the credentials the cluster holds out of the Spark configuration and the environment, and reach every dataset the cluster identity is entitled to rather than every dataset they personally are. On a shared no isolation cluster they can also read what other users on the same cluster left behind, including results and cached frames from queries they had no right to run.

        The escalation is to the compute identity itself: the instance profile or managed identity the nodes assume, and every bucket or container it can reach. Fixing the mode in a cluster policy is what prevents someone from creating an unisolated cluster in the first place, since changing it on one cluster does not stop the next one.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Compute** and open each all-purpose or job cluster.
        3. Review the **Access mode** shown for the cluster, and confirm it is not **No isolation shared**.

        A passing result shows every cluster set to single user or a standard shared access mode; a failing result shows at least one cluster set to no isolation shared.

        ### Audit via CLI

        1. Inspect each cluster specification:

           ```bash
           databricks clusters get <cluster-id> --output JSON
           ```

        A passing result shows `data_security_mode` set to a value other than `NONE` on every cluster; a failing result shows `data_security_mode` unset or set to `NONE` on at least one cluster.
      remediation:
        - id: console
          desc: |
            To enforce an isolation aware access mode using the workspace console:

            1. Sign in to the Databricks workspace as an administrator.
            2. Go to **Compute** and open the cluster to change.
            3. Set **Access mode** to **Single user** or **Shared** so it is no longer **No isolation shared**.
            4. Save and restart the cluster.
        - id: cli
          desc: |
            To set an isolation aware data security mode on a cluster using the Databricks CLI, resubmit the cluster specification with `data_security_mode`:

            ```bash
            databricks clusters edit --json '{
              "cluster_id": "<cluster-id>",
              "num_workers": 2,
              "spark_version": "<runtime-version>",
              "node_type_id": "<node-type>",
              "data_security_mode": "USER_ISOLATION"
            }'
            ```
        - id: terraform
          desc: |
            To set an isolation aware access mode using Terraform, set `data_security_mode` on the `databricks_cluster` resource to `USER_ISOLATION` or `SINGLE_USER`:

            ```hcl
            resource "databricks_cluster" "this" {
              cluster_name       = "governed-cluster"
              spark_version      = "15.4.x-scala2.12"
              node_type_id       = "i3.xlarge"
              num_workers        = 2
              data_security_mode = "USER_ISOLATION"
            }
            ```
  - uid: mondoo-databricks-security-cluster-autotermination-configured
    title: Ensure compute clusters have auto-termination configured
    impact: 40
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-312-a-2-iii-access-control-automatic-logoff
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-12
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: pcidss-requirement-8-2-8
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      databricks.clusters.all(autoterminationMinutes > 0 && autoterminationMinutes <= 120)
    docs:
      desc: |
        This check verifies that compute clusters shut themselves down after a bounded idle period instead of running until someone stops them by hand.

        The **Terminate after ... minutes of inactivity** setting on a cluster under **Compute** maps to the `autotermination_minutes` attribute, readable with `databricks clusters get <cluster-id> --output JSON`. This check requires a value between 1 and 120 on every cluster. A value of `0` means auto-termination is off and the cluster runs indefinitely.

        **Why this matters**

        An idle cluster is a live, authenticated execution environment that nobody is watching. It holds the cloud identity its nodes assume, whatever storage is mounted on it, the Spark configuration it was launched with, and the cached and spilled data from the last work that ran there. All of that stays reachable to anyone who can attach to the cluster or who lands code on a node.

        That is what makes forgotten compute attractive. An attacker who obtains any workspace credential looks for the cluster that has been up for six weeks, because the people who would have noticed unusual activity on it stopped looking at it long ago. They attach a notebook, read the mounted paths and the environment, use the node identity against cloud storage, and everything they do blends into a cluster whose utilization pattern nobody tracks. On a cluster that terminates after two hours of inactivity, that same window closes on its own.

        Bounded lifetimes also stop the population of stale compute from growing, which keeps the set of clusters small enough to actually review. Set the value in a cluster policy so a user cannot disable it, and give streaming and always on workloads a deliberate exception rather than leaving the default open for everyone.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Compute** and open each all-purpose cluster.
        3. Review the **Terminate after ... minutes of inactivity** setting under the cluster configuration.

        A passing result shows every cluster set to terminate after 120 minutes of inactivity or fewer; a failing result shows a cluster with auto-termination disabled or set above 120 minutes.

        ### Audit via CLI

        1. Inspect each cluster specification:

           ```bash
           databricks clusters get <cluster-id> --output JSON
           ```

        A passing result shows `autotermination_minutes` set between `1` and `120` on every cluster; a failing result shows the value set to `0` or above `120` on at least one cluster.
      remediation:
        - id: console
          desc: |
            To configure auto-termination on a cluster using the workspace console:

            1. Sign in to the Databricks workspace as an administrator.
            2. Go to **Compute** and open the cluster to change.
            3. Enable **Terminate after ... minutes of inactivity** and set a value of 120 or fewer.
            4. Save and restart the cluster.
        - id: cli
          desc: |
            To configure auto-termination on a cluster using the Databricks CLI, resubmit the cluster specification with `autotermination_minutes`:

            ```bash
            databricks clusters edit --json '{
              "cluster_id": "<cluster-id>",
              "num_workers": 2,
              "spark_version": "<runtime-version>",
              "node_type_id": "<node-type>",
              "autotermination_minutes": 60
            }'
            ```
        - id: terraform
          desc: |
            To configure auto-termination using Terraform, set `autotermination_minutes` on the `databricks_cluster` resource:

            ```hcl
            resource "databricks_cluster" "this" {
              cluster_name            = "job-cluster"
              spark_version           = "15.4.x-scala2.12"
              node_type_id            = "i3.xlarge"
              num_workers             = 2
              autotermination_minutes = 60
            }
            ```
  - uid: mondoo-databricks-security-cluster-no-plaintext-spark-secrets
    title: Ensure no plaintext secrets are set in cluster Spark configuration
    impact: 80
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      databricks.clusters.all(sparkConf.where( key == /(?i)(password|secret|token|passwd|pwd|apikey|access.?key|credential)/ ).all( value == /\{\{secrets\// ))
    docs:
      desc: |
        This check verifies that credential shaped entries in a cluster's Spark configuration point at the Databricks secrets store instead of holding the credential itself.

        Under **Compute**, a cluster's **Advanced options** hold its **Spark config**, which appears as `spark_conf` in the cluster JSON. This check looks at every key whose name reads like a credential, covering password, secret, token, passwd, pwd, apikey, access key, and credential, and requires the value to be a `{{secrets/scope/key}}` reference. Databricks stores and displays a Spark configuration value verbatim, so a pasted credential stays there in clear text.

        **Why this matters**

        Spark configuration is not a private field. Anyone who can view the cluster sees it in the UI, anyone who can call the clusters API gets it in the response, and it is captured in cluster event logs and in exported cluster specifications. A database password pasted there is therefore readable by a much larger group than the one that was meant to have it, and by anyone who has obtained a token belonging to any member of that group.

        From there the credential leaves the platform. Cloned clusters carry it, exported JSON specifications carry it into tickets and repositories, and infrastructure code that was generated from a running cluster commits it to version control. An attacker who reads one cluster definition walks straight into the database or the external service it points at, using an account that is often far more privileged than any Databricks identity.

        A `{{secrets/scope/key}}` reference resolves at runtime and is redacted in logs and in the interface, so the value is never persisted in the configuration. Restrict read access on the secret scope to the principals that need it, otherwise the reference is only moving the exposure rather than closing it.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Compute** and open each cluster, then expand **Advanced options** and review the **Spark config** entries.
        3. Look for keys named like credentials whose values are not `{{secrets/scope/key}}` references.

        A passing result shows every credential named Spark configuration key holding a `{{secrets/...}}` reference; a failing result shows at least one such key holding a plaintext value.

        ### Audit via CLI

        1. Inspect each cluster specification and review the `spark_conf` map:

           ```bash
           databricks clusters get <cluster-id> --output JSON
           ```

        A passing result shows every credential named key under `spark_conf` set to a `{{secrets/...}}` reference; a failing result shows at least one such key set to a literal value.
      remediation:
        - id: console
          desc: |
            To replace a plaintext Spark configuration secret with a secret reference using the workspace console:

            1. Store the value in a secret scope. Secret scopes and secrets are created with the Databricks CLI or API, for example `databricks secrets create-scope` and `databricks secrets put-secret`.
            2. In the workspace, go to **Compute** and open the cluster to change.
            3. Expand **Advanced options** and edit the **Spark config** entry so the value reads:

               ```text
               spark.myservice.password {{secrets/my-scope/my-key}}
               ```

            4. Save and restart the cluster.
        - id: cli
          desc: |
            To move a plaintext Spark configuration secret into the secrets store using the Databricks CLI:

            1. Create a secret scope and store the value:

               ```bash
               databricks secrets create-scope my-scope
               databricks secrets put-secret my-scope my-key
               ```

            2. Resubmit the cluster specification so the Spark configuration references the secret instead of a literal value:

               ```bash
               databricks clusters edit --json '{
                 "cluster_id": "<cluster-id>",
                 "num_workers": 2,
                 "spark_version": "<runtime-version>",
                 "node_type_id": "<node-type>",
                 "spark_conf": {
                   "spark.myservice.password": "{{secrets/my-scope/my-key}}"
                 }
               }'
               ```
        - id: terraform
          desc: |
            To store a secret and reference it from a cluster Spark configuration using Terraform, create a `databricks_secret_scope` and `databricks_secret`, then reference them from `spark_conf` on the `databricks_cluster` resource:

            ```hcl
            resource "databricks_secret_scope" "this" {
              name = "my-scope"
            }

            resource "databricks_secret" "svc_password" {
              scope        = databricks_secret_scope.this.name
              key          = "my-key"
              string_value = var.service_password
            }

            resource "databricks_cluster" "this" {
              cluster_name  = "app-cluster"
              spark_version = "15.4.x-scala2.12"
              node_type_id  = "i3.xlarge"
              num_workers   = 2

              spark_conf = {
                "spark.myservice.password" = "{{secrets/my-scope/my-key}}"
              }
            }
            ```
  - uid: mondoo-databricks-security-cluster-governed-by-policy
    title: Ensure every compute cluster is governed by a cluster policy
    impact: 40
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a14
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: false
    mql: |
      databricks.clusters.all(policy != empty)
    docs:
      desc: |
        This check verifies that every compute cluster was created against a cluster policy rather than as unconstrained ad hoc compute.

        A cluster's **Policy** field under **Compute** shows either an assigned policy or **Unrestricted**, and the underlying attribute is `policy_id` in the cluster JSON. This check requires it to be populated on every cluster. Databricks lets any user with cluster creation rights launch compute with no policy at all, which leaves every attribute of that cluster up to whoever pressed the button.

        **Why this matters**

        Cluster policies are the only place the other cluster level controls can be made mandatory. Local disk encryption, the data security mode that keeps Unity Catalog in the request path, the idle timeout, the permitted runtime versions, and the instance types are all per cluster attributes that a user can set however they like unless a policy fixes them. Each of those has its own check in this policy, and each of those checks is a lagging indicator; the policy is what makes them hold going forward.

        The practical failure is a user creating a cluster to get some work done, accepting whatever the create form defaults to, and attaching an instance profile that reaches production storage. That cluster now runs without isolation, writes plaintext to local disk, never terminates, and boots a runtime nobody patches. An attacker who finds it has an environment that would never have passed review, sitting inside a workspace that otherwise looks well governed.

        Write policies that encode your baseline, assign them to the groups that create clusters, and restrict the entitlement to create unrestricted compute so nothing can be launched outside them. Existing clusters need to be recreated under the policy for its constraints to apply.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Compute** and open each all-purpose or job cluster.
        3. Confirm the cluster shows an assigned **Policy** rather than **Unrestricted**.

        A passing result shows every cluster bound to a cluster policy; a failing result shows at least one cluster created with no policy.

        ### Audit via CLI

        1. Inspect each cluster specification and review the `policy_id` field:

           ```bash
           databricks clusters get <cluster-id> --output JSON
           ```

        A passing result shows `policy_id` populated on every cluster; a failing result shows the field absent on at least one cluster.
      remediation:
        - id: console
          desc: |
            To bind a cluster to a cluster policy using the workspace console:

            1. Sign in to the Databricks workspace as an administrator.
            2. Go to **Compute**, select the **Policies** tab, and create a policy that encodes your secure baseline if one does not exist.
            3. Open the cluster to change and select the policy in the **Policy** field.
            4. Save and restart the cluster.
        - id: cli
          desc: |
            To create a cluster policy and bind a cluster to it using the Databricks CLI:

            1. Create the policy from a policy definition document:

               ```bash
               databricks cluster-policies create --json '{
                 "name": "secure-baseline",
                 "definition": "{\"enable_local_disk_encryption\":{\"type\":\"fixed\",\"value\":true}}"
               }'
               ```

            2. Resubmit the cluster specification with the returned `policy_id`:

               ```bash
               databricks clusters edit --json '{
                 "cluster_id": "<cluster-id>",
                 "num_workers": 2,
                 "spark_version": "<runtime-version>",
                 "node_type_id": "<node-type>",
                 "policy_id": "<policy-id>"
               }'
               ```
        - id: terraform
          desc: |
            To define a cluster policy and bind a cluster to it using Terraform, create a `databricks_cluster_policy` and set `policy_id` on the `databricks_cluster` resource:

            ```hcl
            resource "databricks_cluster_policy" "baseline" {
              name = "secure-baseline"
              definition = jsonencode({
                "enable_local_disk_encryption" : {
                  "type" : "fixed",
                  "value" : true
                }
              })
            }

            resource "databricks_cluster" "this" {
              cluster_name  = "governed-cluster"
              spark_version = "15.4.x-scala2.12"
              node_type_id  = "i3.xlarge"
              num_workers   = 2
              policy_id     = databricks_cluster_policy.baseline.id
            }
            ```
  - uid: mondoo-databricks-security-token-no-nonexpiring
    title: Ensure access tokens and service principal secrets are not non-expiring
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    variants:
      - uid: mondoo-databricks-security-token-no-nonexpiring-workspace
        tags:
          mondoo.com/filter-title: Databricks Workspace
          mondoo.com/filter-icon: databricks
      - uid: mondoo-databricks-security-token-no-nonexpiring-account
        tags:
          mondoo.com/filter-title: Databricks Account
          mondoo.com/filter-icon: databricks
    docs:
      desc: |
        This check verifies that no Databricks credential is set to never expire, covering both personal access tokens in a workspace and the OAuth secrets of account level service principals.

        Personal access tokens act as a workspace user and are listed with `databricks token-management list`, where a token that never expires reports an `expiry_time` of `-1`. Service principal secrets act as a machine identity and are managed in the account console under **User management** and then **Service principals**. This check requires an expiration on every personal access token and on every active service principal secret. Both are created without one when the **Lifetime (days)** field is left blank or no expiration is set on the secret, and the credential then stays valid until a person revokes it.

        **Why this matters**

        Both are bearer credentials for the REST API: whoever holds the string is the identity. There is no second factor to fail and no session to end. An attacker who recovers one from a repository history, a container image layer, a CI log, a backup, or a departed employee's machine authenticates as that principal and works through the API at their own pace.

        A credential with no expiry means that recovery never goes stale. The token in a repository archived three years ago still opens the workspace. The service principal secret issued for a pipeline that was decommissioned still authenticates, and because it belongs to an unattended machine identity, nobody is going to notice unusual sign in behavior for it the way they might for a person.

        Non expiring credentials also accumulate faster than anyone prunes them, so the set of live keys grows with every pipeline and every departure. Setting a lifetime makes the cleanup happen whether or not the leak was ever detected.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Settings** > **Developer** and open **Access tokens** to review personal access tokens.
        3. In the account console, open **User management** > **Service principals**, and for each service principal review its OAuth secrets and their expiration.
        4. Confirm the CLI or API is used for a workspace-wide review of personal access tokens, because the UI shows only the current user's tokens.

        A passing result shows every personal access token and every active service principal secret with an expiration date; a failing result shows at least one that never expires.

        ### Audit via CLI

        1. List all personal access tokens in the workspace:

            ```bash
            databricks token-management list
            ```

        2. Inspect the `expiry_time` of each token. A value of `-1` means the token never expires.

        A passing result shows every token with a positive `expiry_time`; a failing result shows at least one token whose `expiry_time` is `-1`.
      remediation:
        - id: console
          desc: |
            To ensure personal access tokens are created with an expiry using the workspace UI:

            1. Sign in to the Databricks workspace.
            2. Go to **Settings** > **Developer** and open **Access tokens**.
            3. When generating a token, enter a value in the **Lifetime (days)** field rather than leaving it blank.
            4. Revoke any existing token that was created with no lifetime by selecting it and choosing **Revoke**.
            5. For machine identities, sign in to the account console, open **User management** > **Service principals**, and for each service principal set an expiration when issuing an OAuth secret and delete any active secret that has no expiration.

            Enforcing this across the whole workspace requires the maximum token lifetime setting shown in the CLI and Terraform steps.
        - id: cli
          desc: |
            To prevent non-expiring tokens and revoke existing ones using the Databricks CLI:

            1. Set a workspace-wide maximum token lifetime so new tokens must carry an expiry:

                ```bash
                databricks workspace-conf set-status --json '{"maxTokenLifetimeDays": "90"}'
                ```

            2. Find tokens that never expire, which report an `expiry_time` of `-1`:

                ```bash
                databricks token-management list
                ```

            3. Revoke each non-expiring token by its ID:

                ```bash
                databricks token-management delete <token-id>
                ```
        - id: terraform
          desc: |
            To enforce token expiry as code using the `databricks/databricks` provider, set a workspace-wide maximum lifetime and always define `lifetime_seconds` on managed tokens. Omitting `lifetime_seconds` creates a token that never expires:

            ```hcl
            resource "databricks_workspace_conf" "this" {
              custom_config = {
                "maxTokenLifetimeDays" = "90"
              }
            }

            resource "databricks_token" "pipeline" {
              comment          = "pipeline token"
              lifetime_seconds = 7776000
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/admin/access-control/tokens
        title: Monitor and revoke Databricks personal access tokens
      - url: https://docs.databricks.com/aws/en/admin/users-groups/service-principals
        title: Manage service principals and their OAuth secrets
  - uid: mondoo-databricks-security-token-no-nonexpiring-workspace
    filters: asset.platform == "databricks-workspace"
    mql: |
      databricks.tokens.all(expiryTime != empty)
  - uid: mondoo-databricks-security-token-no-nonexpiring-account
    filters: asset.platform == "databricks-account"
    mql: |
      databricks.servicePrincipals.all(secrets.where(status == "active").all(expireTime != empty))
  - uid: mondoo-databricks-security-token-lifetime-under-90-days
    title: Ensure personal access token lifetimes do not exceed 90 days
    impact: 60
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      databricks.tokens.all(expiryTime - creationTime <= 90 * time.day)
    docs:
      desc: |
        This check verifies that no personal access token in the workspace was issued with a lifetime longer than 90 days.

        The lifetime is the span between a token's creation and its expiry. An individual sets it in the **Lifetime (days)** field under Settings and then **Developer** and **Access tokens**, but that page shows only the current user's tokens, so a workspace wide review needs `databricks token-management list` and a comparison of each token's creation and expiry timestamps. This check requires that span to be at most 90 days. The workspace maximum is 730 days unless an administrator lowers it, so a token created with the default ceiling stays valid for two years.

        **Why this matters**

        A personal access token authenticates to the entire Databricks REST API as its owner. It travels well: it ends up in a `.databrickscfg` file on a laptop, in a CI secret store, in a notebook someone shared, in a shell history. Any of those is a credential an attacker can pick up, and once they have it there is nothing else to defeat. They list the clusters, read the secret scopes the owner can read, and submit jobs that read whatever the owner's grants allow.

        The lifetime decides how long that holds. At two years, a token leaked from a laptop stolen last spring still works today, and it still works for the person who bought the disk image months from now. At 90 days it is dead well before most leaks are even discovered, which is the point: the cap protects you in the case where you never find out.

        Cap the workspace maximum rather than relying on individuals, and reissue existing long lived tokens with a shorter lifetime rather than letting them run out their original term.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Settings** > **Developer** and open **Access tokens** to review your own tokens and their expiration dates.
        3. Confirm the CLI or API is used for a workspace-wide review, because the UI shows only the current user's tokens.

        A passing result shows every token expiring within 90 days of its creation; a failing result shows at least one token with a longer lifetime.

        ### Audit via CLI

        1. List all tokens in the workspace:

            ```bash
            databricks token-management list
            ```

        2. For each token, subtract `creation_time` from `expiry_time`, both epoch millisecond values, and confirm the difference is at most 90 days.

        A passing result shows every token within a 90-day lifetime; a failing result shows at least one token whose lifetime exceeds 90 days.
      remediation:
        - id: console
          desc: |
            To keep token lifetimes within 90 days using the workspace UI:

            1. Sign in to the Databricks workspace.
            2. Go to **Settings** > **Developer** and open **Access tokens**.
            3. When generating a token, set the **Lifetime (days)** field to 90 or fewer.
            4. Revoke any existing token whose lifetime exceeds 90 days by selecting it and choosing **Revoke**, then reissue it with a shorter lifetime.

            Enforcing this across the whole workspace requires the maximum token lifetime setting shown in the CLI and Terraform steps.
        - id: cli
          desc: |
            To cap token lifetimes and reissue long-lived tokens using the Databricks CLI:

            1. Set the workspace-wide maximum token lifetime to 90 days. The default is 730 days:

                ```bash
                databricks workspace-conf set-status --json '{"maxTokenLifetimeDays": "90"}'
                ```

            2. Find tokens whose `expiry_time` minus `creation_time` exceeds 90 days:

                ```bash
                databricks token-management list
                ```

            3. Revoke each long-lived token by its ID, then reissue it with a shorter lifetime:

                ```bash
                databricks token-management delete <token-id>
                ```
        - id: terraform
          desc: |
            To bound token lifetimes as code using the `databricks/databricks` provider, set a workspace-wide maximum lifetime and keep `lifetime_seconds` at or below 90 days, which is 7776000 seconds:

            ```hcl
            resource "databricks_workspace_conf" "this" {
              custom_config = {
                "maxTokenLifetimeDays" = "90"
              }
            }

            resource "databricks_token" "pipeline" {
              comment          = "pipeline token"
              lifetime_seconds = 7776000
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/admin/access-control/tokens
        title: Monitor and revoke Databricks personal access tokens
  - uid: mondoo-databricks-security-secret-scope-not-world-readable
    title: Ensure secret scopes are not readable by all workspace users
    impact: 80
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      databricks.secretScopes.all(acls["users"] == empty)
    docs:
      desc: |
        This check verifies that no secret scope grants a permission to the built-in `users` group, which contains every member of the workspace.

        Secret scopes hold database passwords, cloud storage keys, and API tokens for downstream systems. The workspace UI does not display scope ACLs, so the review runs through `databricks secrets list-scopes` and then `databricks secrets list-acls <scope-name>`. This check fails a scope whose ACL list names the `users` principal at any permission, because MANAGE, READ, and WRITE all put the scope's contents within reach of the whole workspace.

        **Why this matters**

        A single READ grant to `users` means every person with workspace access can retrieve every secret in that scope. That is not an abstract exposure. Any user opens a notebook, calls the secret utility for the scope and key, and prints the value. A contractor with read only analytics access, an intern, a partner account, a compromised low privilege session: all of them get the production database password out of a scope that was set up for one team.

        The escalation goes outside Databricks. Secrets are credentials for other systems, and those systems usually have no idea the caller came from a workspace notebook. The attacker takes the storage key and reads the bucket directly, bypassing Unity Catalog entirely. They take the service account password and connect to the warehouse from their own machine. Whatever careful grant structure exists inside the workspace is irrelevant once the underlying credential is in hand.

        Grant secret scope ACLs only to the named users, groups, or service principals that need them, and delete any `users` entry outright rather than downgrading it. A workspace wide MANAGE grant is worse still, since it lets any user rewrite the secrets other people's pipelines depend on.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Confirm the CLI or API is used for ACL review, because the workspace UI does not display secret scope ACLs directly.
        3. Treat any scope whose ACL list includes the `users` principal as a finding.

        A passing result shows no secret scope granting a permission to `users`; a failing result shows at least one scope with a `users` ACL entry.

        ### Audit via CLI

        1. List the secret scopes:

            ```bash
            databricks secrets list-scopes
            ```

        2. For each scope, list its ACLs:

            ```bash
            databricks secrets list-acls <scope-name>
            ```

        A passing result shows no ACL whose principal is `users`; a failing result shows a `users` principal with a MANAGE, READ, or WRITE permission.
      remediation:
        - id: console
          desc: |
            To remove world-readable access from a secret scope using the workspace admin tooling:

            1. Identify the scope with a `users` grant from the CLI or API audit, because secret scope ACLs are not editable in the workspace UI.
            2. Determine which specific users, groups, or service principals genuinely need the secrets.
            3. Apply the ACL changes with the CLI or Terraform steps below, granting only those principals and deleting the `users` entry.
        - id: cli
          desc: |
            To revoke the `users` grant and scope access to named principals using the Databricks CLI:

            1. Delete the ACL that grants access to all workspace users:

                ```bash
                databricks secrets delete-acl <scope-name> users
                ```

            2. Grant the required permission only to the principals that need it:

                ```bash
                databricks secrets put-acl <scope-name> data-engineering READ
                ```

            3. Confirm the `users` principal is gone:

                ```bash
                databricks secrets list-acls <scope-name>
                ```
        - id: terraform
          desc: |
            To manage secret scope ACLs as code using the `databricks/databricks` provider, define `databricks_secret_acl` resources only for specific principals and never for the `users` group:

            ```hcl
            resource "databricks_secret_scope" "app" {
              name = "app-secrets"
            }

            resource "databricks_secret_acl" "engineering" {
              scope     = databricks_secret_scope.app.name
              principal = "data-engineering"
              permission = "READ"
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/security/secrets/acl
        title: Databricks secret access control lists
  - uid: mondoo-databricks-security-ip-access-list-no-allow-all
    title: Ensure IP access lists contain no unrestricted (allow-all) ranges
    impact: 70
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      databricks.ipAccessLists.where(listType == "ALLOW").all(ipAddresses.none(_ == "0.0.0.0/0" || _ == "::/0"))
    docs:
      desc: |
        This check verifies that no allow entry in the workspace's IP access lists opens the workspace to the entire internet.

        IP access lists are managed under Settings on the **Security** tab of the workspace admin console and read with `databricks ip-access-lists list`. This check examines every list whose type is ALLOW and fails if any of them contains `0.0.0.0/0` or `::/0`, the open ranges for IPv4 and IPv6. Either one admits every address on the internet, which cancels the effect of every other entry in the list.

        **Why this matters**

        The failure mode here is not an absent control but a control that reports as present. Enforcement is on, lists exist, an audit finding was closed, and a reviewer looking at the workspace concludes that network access is restricted. The wildcard entry means it is not. That gap between the documented posture and the real one is what makes this worth catching, because nobody goes back to look at a control they believe is working.

        Concretely, the workspace API answers from anywhere, so any credential that leaks is usable from anywhere. An attacker who buys a token from a credential dump, phishes a user, or pulls one out of a public repository connects straight to the workspace host, and the access list that was supposed to require them to be on the corporate network waves them through. They enumerate clusters, read the secret scopes their stolen identity can read, and run jobs against your data from wherever they are.

        Replace the open range with the specific office, VPN, and egress ranges you actually use, and keep them as narrow as the legitimate traffic allows. Confirm your own current address falls inside one of the remaining ranges before saving, or you will lock yourself out.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks workspace as an administrator.
        2. Go to **Settings** > **Security** and open the **IP access list** section.
        3. Review each allow entry for the `0.0.0.0/0` or `::/0` range.

        A passing result shows no allow entry with an open CIDR; a failing result shows at least one allow entry containing `0.0.0.0/0` or `::/0`.

        ### Audit via CLI

        1. List the IP access lists:

            ```bash
            databricks ip-access-lists list
            ```

        2. Inspect the `ip_addresses` of every list whose `list_type` is `ALLOW`.

        A passing result shows no ALLOW list containing `0.0.0.0/0` or `::/0`; a failing result shows at least one that does.
      remediation:
        - id: console
          desc: |
            To remove an unrestricted range from an IP access list using the workspace UI:

            1. Sign in to the Databricks workspace as an administrator.
            2. Go to **Settings** > **Security** and open the **IP access list** section.
            3. Edit the allow list that contains `0.0.0.0/0` or `::/0`.
            4. Replace the open range with the specific CIDR ranges your organization uses, then save.

            Confirm your own current public IP falls within an allowed range before saving, or you will lose access to the workspace.
        - id: cli
          desc: |
            To replace an unrestricted range using the Databricks CLI:

            1. Find the offending list and read its current entries:

                ```bash
                databricks ip-access-lists list
                ```

            2. Update the ALLOW list with specific ranges only, omitting any wildcard. The `203.0.113.0/24` and `198.51.100.0/24` values are reserved documentation ranges from RFC 5737, so replace them with your real egress ranges:

                ```bash
                databricks ip-access-lists update <list-id> --json '{
                  "label": "corp-allow",
                  "list_type": "ALLOW",
                  "enabled": true,
                  "ip_addresses": ["203.0.113.0/24", "198.51.100.0/24"]
                }'
                ```

            3. Verify the wildcard is gone:

                ```bash
                databricks ip-access-lists get <list-id>
                ```
        - id: terraform
          desc: |
            To manage IP access lists as code using the `databricks/databricks` provider, set `ip_addresses` on every ALLOW list to specific trusted CIDR ranges and never include `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "databricks_ip_access_list" "allowed" {
              label        = "corp-allow"
              list_type    = "ALLOW"
              ip_addresses = ["203.0.113.0/24", "198.51.100.0/24"]
            }
            ```
    refs:
      - url: https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list
        title: Databricks IP access lists
  - uid: mondoo-databricks-security-workspace-public-access-disabled
    title: Ensure public network access is disabled for workspaces
    impact: 80
    filters: asset.platform == "databricks-account"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      databricks.privateAccessSettings.all(publicAccessEnabled == false)
    docs:
      desc: |
        This check verifies that the private access settings registered in the Databricks account keep public network access turned off, so workspaces bound to them are reachable only through a private endpoint.

        Private access settings are an account console object, not a workspace setting. An account admin finds them under **Cloud resources** and then **Network**, and the Databricks CLI lists them with `databricks account private-access list` and reads one with `databricks account private-access get <private-access-settings-id>`. This check requires `public_access_enabled` to be false on every setting. A workspace without private only connectivity accepts connections from any address on the internet.

        **Why this matters**

        Public reachability is what makes a stolen credential usable from anywhere. An attacker who obtains a personal access token, a service principal secret, or a user's password and session does not need a foothold in your network to spend it. They resolve the workspace host from their own machine and authenticate. Everything that identity is entitled to, the clusters, the jobs, the secret scopes, the catalogs, follows from there.

        Private only connectivity removes that. The same credential presented from the open internet reaches nothing, because the workspace endpoint is not there to answer. The attacker now needs a position inside a network that holds an approved private endpoint, which is a much harder and much noisier thing to get.

        Route access through the cloud provider's private endpoint service and confirm your own users and CI runners reach the workspace over it before you disable public access. Also recheck the settings after infrastructure changes, since a rebuilt private access setting can come back with public access re-enabled and the workspace will keep working, which is exactly why nobody notices.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks account console as an account admin.
        2. Open **Cloud resources** then **Network**, and review each private access setting, or open a workspace and review its network configuration.
        3. Confirm that public access is disabled for every private access setting.

        A passing result shows public access disabled on all private access settings. A failing result shows at least one setting with public access enabled.

        ### Audit via CLI

        1. List the private access settings in the account:

            ```bash
            databricks account private-access list
            ```

        2. Inspect an individual setting to read its public access flag:

            ```bash
            databricks account private-access get <private-access-settings-id>
            ```

        A passing result shows `public_access_enabled` set to `false` on every setting. A failing result shows `true` on any of them.
      remediation:
        - id: console
          desc: |
            To disable public network access on a private access setting using the account console:

            1. Sign in to the Databricks account console as an account admin.
            2. Open **Cloud resources** then **Network**, and select the private access setting bound to the workspace.
            3. Turn off **Public access enabled** and save the setting.

            ```text
            Public access enabled: Disabled
            ```
        - id: cli
          desc: |
            To disable public network access on a private access setting using the Databricks CLI:

            1. Find the private access settings ID:

                ```bash
                databricks account private-access list
                ```

            2. Update the setting to disable public access, keeping the existing name, region, and access level:

                ```bash
                databricks account private-access replace <private-access-settings-id> --json '{
                  "private_access_settings_name": "prod-pas",
                  "region": "us-east-1",
                  "public_access_enabled": false,
                  "private_access_level": "ENDPOINT"
                }'
                ```
        - id: terraform
          desc: |
            To disable public network access using the `databricks/databricks` Terraform provider, set `public_access_enabled` to `false` on the private access settings and bind them to the workspace:

            ```hcl
            resource "databricks_mws_private_access_settings" "this" {
              provider                     = databricks.mws
              private_access_settings_name = "prod-pas"
              region                       = var.region
              public_access_enabled        = false
              private_access_level         = "ENDPOINT"
            }

            resource "databricks_mws_workspaces" "this" {
              provider       = databricks.mws
              account_id     = var.databricks_account_id
              workspace_name = var.databricks_workspace_name
              # ... other workspace configuration ...
              private_access_settings_id = databricks_mws_private_access_settings.this.private_access_settings_id
            }
            ```
  - uid: mondoo-databricks-security-private-access-restrict-endpoints
    title: Ensure private access settings restrict connections to allowed endpoints
    impact: 70
    filters: asset.platform == "databricks-account"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      databricks.privateAccessSettings.all(privateAccessLevel == "ENDPOINT" && allowedVpcEndpointIds != empty)
    docs:
      desc: |
        This check verifies that a private access setting names the specific endpoints allowed to reach the workspace instead of admitting every endpoint registered in the account.

        Private access settings are managed in the Databricks account console under **Cloud resources** and then **Network**, and read with `databricks account private-access get <private-access-settings-id>`. The private access level takes two values. With `ACCOUNT`, any registered endpoint in the account can connect. With `ENDPOINT`, only the endpoints listed in `allowed_vpc_endpoint_ids` can. This check requires the level to be `ENDPOINT` and the allow-list to be non-empty.

        **Why this matters**

        Private connectivity is often treated as the end of the network story, but at the `ACCOUNT` level it only moves the boundary from the internet to the account. Every endpoint anyone registers, including one created for a sandbox, a partner integration, or a team experimenting in a separate network, can reach every workspace bound to that setting.

        That is the lateral path. An attacker who gets code running in the least defended network that happens to have a registered endpoint, a development virtual network with permissive rules, say, now has a route to the production workspace. They still need a credential, but they have skipped the network control that was supposed to be the reason the workspace was safe to expose at all. A stolen token that would have been useless from the internet works from there.

        Naming endpoints makes each connection a decision someone made. Populate the allow-list with only the endpoints that must reach the workspace, and remove entries when the corresponding infrastructure is decommissioned, since a stale entry is a route to a network you no longer control.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks account console as an account admin.
        2. Open **Cloud resources** then **Network**, and select the private access setting bound to the workspace.
        3. Confirm the private access level is set to **Endpoint** and that the allowed VPC endpoints list contains the expected endpoints.

        A passing result shows the level set to Endpoint with a non-empty allow-list. A failing result shows the level set to Account, or an empty allow-list.

        ### Audit via CLI

        1. List the private access settings in the account:

            ```bash
            databricks account private-access list
            ```

        2. Inspect an individual setting to read its access level and endpoint allow-list:

            ```bash
            databricks account private-access get <private-access-settings-id>
            ```

        A passing result shows `private_access_level` set to `ENDPOINT` and a non-empty `allowed_vpc_endpoint_ids` array. A failing result shows `ACCOUNT`, or an empty allow-list.
      remediation:
        - id: console
          desc: |
            To restrict a private access setting to named endpoints using the account console:

            1. Sign in to the Databricks account console as an account admin.
            2. Open **Cloud resources** then **Network**, and select the private access setting bound to the workspace.
            3. Set the private access level to **Endpoint**, add the VPC endpoints that must reach the workspace to the allowed list, and save.

            ```text
            Private access level: Endpoint
            Allowed VPC endpoints: vpce-0abc..., vpce-0def...
            ```
        - id: cli
          desc: |
            To restrict a private access setting to named endpoints using the Databricks CLI:

            1. Find the private access settings ID and the VPC endpoint IDs to allow:

                ```bash
                databricks account private-access list
                databricks account vpc-endpoints list
                ```

            2. Update the setting to the `ENDPOINT` level with an explicit endpoint allow-list:

                ```bash
                databricks account private-access replace <private-access-settings-id> --json '{
                  "private_access_settings_name": "prod-pas",
                  "region": "us-east-1",
                  "public_access_enabled": false,
                  "private_access_level": "ENDPOINT",
                  "allowed_vpc_endpoint_ids": ["<vpc-endpoint-id>"]
                }'
                ```
        - id: terraform
          desc: |
            To restrict private access to named endpoints using the `databricks/databricks` Terraform provider, register the backend VPC endpoint and reference it from the private access settings allow-list:

            ```hcl
            resource "databricks_mws_vpc_endpoint" "backend" {
              provider            = databricks.mws
              vpc_endpoint_name   = "backend-endpoint"
              aws_vpc_endpoint_id = aws_vpc_endpoint.backend.id
              region              = var.region
            }

            resource "databricks_mws_private_access_settings" "this" {
              provider                     = databricks.mws
              private_access_settings_name = "prod-pas"
              region                       = var.region
              public_access_enabled        = false
              private_access_level         = "ENDPOINT"
              allowed_vpc_endpoint_ids     = [databricks_mws_vpc_endpoint.backend.vpc_endpoint_id]
            }
            ```
  - uid: mondoo-databricks-security-workspace-customer-managed-keys
    title: Ensure workspaces use customer-managed encryption keys
    impact: 70
    filters: asset.platform == "databricks-account"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-6-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      databricks.workspaces.all(managedServicesCustomerManagedKey != empty && storageCustomerManagedKey != empty)
    docs:
      desc: |
        This check verifies that each workspace in the account is encrypted with keys the organization controls, for both managed services and workspace storage.

        These are two separate assignments made in the Databricks account console. Managed services covers control plane data such as notebook source, command results, and secrets; workspace storage covers the DBFS root and the cluster volumes. An account admin registers a key for each use case under **Cloud resources** and then **Encryption keys**, and assigns both to the workspace, which shows up as `managed_services_customer_managed_key_id` and `storage_customer_managed_key_id`. This check requires both to be set. Without them, Databricks encrypts the data with keys it holds.

        **Why this matters**

        Platform managed encryption protects the data at rest, but it leaves you with no independent way to cut access off. If a workspace is compromised, if a credential you cannot enumerate is still circulating, or if you need to be certain a decommissioned workspace's data can no longer be read, the only reliable lever is the key. With your own key you disable or revoke it in your cloud key service and every copy of that data becomes ciphertext immediately, regardless of what tokens or sessions an attacker still holds.

        Splitting the key from the platform also splits the access needed to read the data. Someone who compromises the platform side alone gets encrypted blobs; they need a separate compromise of your key service to make anything of them.

        Assign keys for both use cases, since covering only one leaves the other domain, notebooks and secrets or the storage root, on platform keys and outside your control. Rotate them on whatever schedule your key management policy sets.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks account console as an account admin.
        2. Open **Workspaces** and select a workspace.
        3. Review the encryption configuration and confirm that a customer-managed key is assigned for both managed services and storage.

        A passing result shows a customer-managed key set for both managed services and storage on every workspace. A failing result shows either key unset.

        ### Audit via CLI

        1. List the customer-managed keys registered in the account:

            ```bash
            databricks account encryption-keys list
            ```

        2. Inspect a workspace to read its assigned key IDs:

            ```bash
            databricks account workspaces get <workspace-id>
            ```

        A passing result shows non-empty `managed_services_customer_managed_key_id` and `storage_customer_managed_key_id` values. A failing result shows either field empty.
      remediation:
        - id: console
          desc: |
            To assign customer-managed keys to a workspace using the account console:

            1. Sign in to the Databricks account console as an account admin.
            2. Register the encryption keys under **Cloud resources** then **Encryption keys**, one for the managed services use case and one for the storage use case.
            3. Open the workspace, assign both keys under its encryption configuration, and save.

            ```text
            Managed services key: assigned
            Storage key: assigned
            ```
        - id: cli
          desc: |
            To assign customer-managed keys to a workspace using the Databricks CLI:

            1. Register a key for each use case and note the returned key IDs:

                ```bash
                databricks account encryption-keys create --json '{
                  "aws_key_info": {"key_arn": "<kms-key-arn>", "key_alias": "<kms-key-alias>"},
                  "use_cases": ["MANAGED_SERVICES"]
                }'
                ```

            2. Assign both keys to the workspace:

                ```bash
                databricks account workspaces update <workspace-id> --json '{
                  "managed_services_customer_managed_key_id": "<managed-services-key-id>",
                  "storage_customer_managed_key_id": "<storage-key-id>"
                }'
                ```
        - id: terraform
          desc: |
            To assign customer-managed keys using the `databricks/databricks` Terraform provider, register a key for each use case and reference both from the workspace:

            ```hcl
            resource "databricks_mws_customer_managed_keys" "managed_services" {
              provider   = databricks.mws
              account_id = var.databricks_account_id
              aws_key_info {
                key_arn   = aws_kms_key.managed_services.arn
                key_alias = aws_kms_alias.managed_services.name
              }
              use_cases = ["MANAGED_SERVICES"]
            }

            resource "databricks_mws_customer_managed_keys" "storage" {
              provider   = databricks.mws
              account_id = var.databricks_account_id
              aws_key_info {
                key_arn   = aws_kms_key.storage.arn
                key_alias = aws_kms_alias.storage.name
              }
              use_cases = ["STORAGE"]
            }

            resource "databricks_mws_workspaces" "this" {
              provider       = databricks.mws
              account_id     = var.databricks_account_id
              workspace_name = var.databricks_workspace_name
              # ... other workspace configuration ...
              managed_services_customer_managed_key_id = databricks_mws_customer_managed_keys.managed_services.customer_managed_key_id
              storage_customer_managed_key_id          = databricks_mws_customer_managed_keys.storage.customer_managed_key_id
            }
            ```
  - uid: mondoo-databricks-security-delta-sharing-recipient-ip-restricted
    title: Ensure token-authenticated Delta Sharing recipients are IP restricted
    impact: 70
    filters: asset.platform == "databricks-account"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      databricks.deltaSharingRecipients.where(authenticationType == "TOKEN").all(ipAccessList != empty)
    docs:
      desc: |
        This check verifies that every Delta Sharing recipient authenticating with a bearer token is limited to network ranges you approved.

        Open sharing recipients are managed under **Catalog** and then **Delta Sharing** by a metastore admin, and read with `databricks recipients get <recipient-name>`. A recipient whose authentication type is `TOKEN` presents a bearer credential and nothing else. The other authentication types, `DATABRICKS`, `OAUTH_CLIENT_CREDENTIALS`, and `OIDC_FEDERATION`, bind the share to an identity system instead. This check requires a non-empty `ip_access_list.allowed_ip_addresses` on every token recipient.

        **Why this matters**

        Delta Sharing hands data to people outside your organization, and a token recipient is the weakest form of that arrangement. The credential is a file the partner downloads and then stores wherever their tooling puts it: a shared drive, a notebook repository, a laptop, a container image. You have no visibility into any of it and no control over who at the partner can copy it.

        Once that file gets out, whoever holds it retrieves the full contents of the share from anywhere in the world. There is no user to disable, no second factor to fail, and no sign in event that looks unusual, because the token is the entire authentication story. The pull looks exactly like the partner's normal access.

        An IP access list binds the token to the partner's known egress ranges, so a copy that leaves their network is inert. Collect those ranges before you activate the share, and keep them current as the partner's infrastructure changes. Where the partner can support it, moving them to an identity federated authentication type is stronger than a long lived token with a network restriction bolted on.
      audit: |
        ### Audit via Console

        1. Sign in to a workspace with access to the Unity Catalog metastore as a metastore admin.
        2. Open **Catalog**, then **Delta Sharing**, and review the recipients under **Shared by me**.
        3. For each recipient whose authentication type is token, confirm that an IP access list is set.

        A passing result shows an IP access list on every token recipient. A failing result shows a token recipient with no IP access list.

        ### Audit via CLI

        1. List the recipients and their authentication types:

            ```bash
            databricks recipients list
            ```

        2. Inspect a recipient to read its authentication type and IP access list:

            ```bash
            databricks recipients get <recipient-name>
            ```

        A passing result shows a non-empty `ip_access_list.allowed_ip_addresses` array on every recipient whose `authentication_type` is `TOKEN`. A failing result shows a token recipient with no allowed addresses.
      remediation:
        - id: console
          desc: |
            To restrict a token recipient to approved networks using the console:

            1. Sign in to a workspace with access to the Unity Catalog metastore as a metastore admin.
            2. Open **Catalog**, then **Delta Sharing**, and select the recipient under **Shared by me**.
            3. Edit the recipient, add the approved CIDR ranges to its IP access list, and save.

            ```text
            IP access list: 203.0.113.0/24
            ```
        - id: cli
          desc: |
            To restrict a token recipient to approved networks using the Databricks CLI:

            1. Confirm the recipient name and current authentication type:

                ```bash
                databricks recipients get <recipient-name>
                ```

            2. Update the recipient with the approved CIDR ranges. Replace the RFC 5737 documentation range below with your real egress ranges:

                ```bash
                databricks recipients update <recipient-name> --json '{
                  "ip_access_list": {"allowed_ip_addresses": ["203.0.113.0/24"]}
                }'
                ```
        - id: terraform
          desc: |
            To restrict a token recipient to approved networks using the `databricks/databricks` Terraform provider, set the `ip_access_list` block on the recipient:

            ```hcl
            resource "databricks_recipient" "external" {
              name                = "partner-org"
              authentication_type = "TOKEN"
              comment             = "Partner analytics team"

              ip_access_list {
                allowed_ip_addresses = ["203.0.113.0/24"]
              }
            }
            ```
  - uid: mondoo-databricks-security-serving-endpoint-ai-gateway-guardrails
    title: Ensure AI Gateway guardrails are configured on model serving endpoints
    impact: 60
    filters: asset.platform == "databricks-workspace"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-10
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-12
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-3
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm01
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-7-1
      compliance/vda-isa-5: false
    mql: |
      databricks.servingEndpoints.all(aiGateway != empty && aiGateway.guardrails != empty)
    docs:
      desc: |
        This check verifies that model serving endpoints screen the prompts they receive and the responses they return.

        AI Gateway is configured per endpoint under **Serving** in the workspace, where an administrator enables input and output guardrails and sets the safety and PII filters. The Databricks CLI reads the same configuration with `databricks serving-endpoints get <endpoint-name>`, and this check requires a populated `ai_gateway.guardrails` block on every endpoint. A serving endpoint has no guardrails by default, so prompts and generated output pass through unexamined.

        **Why this matters**

        A serving endpoint that reaches internal data is a query interface with a natural language front door. Without output filtering, the model is free to include in a response whatever it retrieved or memorized, so an attacker who can send prompts asks for customer records, support ticket contents, or credentials that appeared in the training corpus, and reads them straight out of the completion. PII detection with a blocking behavior is what stops that response from being returned at all.

        Input filtering addresses the other direction. Where the endpoint is wired to tools, retrieval, or downstream systems, a prompt crafted to override its instructions turns the model into a confused deputy acting with the endpoint's privileges. That prompt does not have to come from a person; it can arrive inside a document the application feeds the model, which is why screening the input rather than trusting the caller is the useful control.

        Attach guardrails to any endpoint that handles prompts from outside a trusted set of callers, and tune the PII behavior and safety filters to the sensitivity of the data the endpoint can reach. An endpoint serving a classical model over non sensitive features is a reasonable place to decide the filters add nothing.
      audit: |
        ### Audit via Console

        1. Sign in to the workspace and open **Serving**.
        2. Select a model serving endpoint and open its **AI Gateway** configuration.
        3. Confirm that guardrails are configured for input and output.

        A passing result shows an AI Gateway with guardrails on every endpoint. A failing result shows an endpoint with no AI Gateway or no guardrails.

        ### Audit via CLI

        1. List the serving endpoints in the workspace:

            ```bash
            databricks serving-endpoints list
            ```

        2. Inspect an endpoint to read its AI Gateway configuration:

            ```bash
            databricks serving-endpoints get <endpoint-name>
            ```

        A passing result shows a populated `ai_gateway.guardrails` block on every endpoint. A failing result shows the `ai_gateway` or `guardrails` block absent.
      remediation:
        - id: console
          desc: |
            To configure guardrails on a serving endpoint using the console:

            1. Sign in to the workspace and open **Serving**.
            2. Select the model serving endpoint and edit its **AI Gateway** configuration.
            3. Enable input and output guardrails, set the PII and safety filters, and save.

            ```text
            AI Gateway guardrails: enabled (input + output)
            ```
        - id: cli
          desc: |
            To configure guardrails on a serving endpoint using the Databricks CLI:

            1. Confirm the endpoint name:

                ```bash
                databricks serving-endpoints list
                ```

            2. Apply the AI Gateway guardrails to the endpoint:

                ```bash
                databricks serving-endpoints put-ai-gateway <endpoint-name> --json '{
                  "guardrails": {
                    "input": {"safety": true, "pii": {"behavior": "BLOCK"}},
                    "output": {"safety": true, "pii": {"behavior": "BLOCK"}}
                  }
                }'
                ```
        - id: terraform
          desc: |
            To configure guardrails using the `databricks/databricks` Terraform provider, set the `ai_gateway` block with `guardrails` on the `databricks_model_serving` resource:

            ```hcl
            resource "databricks_model_serving" "this" {
              name = "llm-endpoint"

              ai_gateway {
                guardrails {
                  input {
                    safety = true
                    pii {
                      behavior = "BLOCK"
                    }
                  }
                  output {
                    safety = true
                    pii {
                      behavior = "BLOCK"
                    }
                  }
                }
              }

              config {
                # ... served_entities configuration ...
              }
            }
            ```
  - uid: mondoo-databricks-security-no-inactive-service-principals
    title: Ensure there are no inactive account service principals
    impact: 40
    filters: asset.platform == "databricks-account"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-ii-c-information-access-management-access-establishment-and-modification
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-2-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      databricks.servicePrincipals.all(active == true)
    docs:
      desc: |
        This check verifies that the Databricks account carries no service principal left sitting in a deactivated state.

        Service principals are account level machine identities, managed in the account console under **User management** and then **Service principals**, and listed with `databricks account service-principals list`. Each carries an `active` flag. This check requires it to be true on every one of them, which in practice means deactivated identities are deleted rather than parked.

        **Why this matters**

        Deactivation is not deletion. A deactivated service principal keeps its identity, its group memberships, its entitlements, and its workspace and Unity Catalog grants. The account only refuses to authenticate it. Flip the flag back and every one of those grants is live again, exactly as it was on the day the identity was retired.

        That makes a dormant service principal an attractive thing for an attacker who has account admin access to find. Creating a new identity and granting it access to production data is a conspicuous act that shows up in review. Reactivating one that already exists, already holds the grants they want, and already has a plausible name from a project two years ago is not. The audit trail shows a status change rather than a privilege grant, and the identity's ongoing API activity looks like a pipeline resuming.

        Dormant identities also decay. Nobody owns them, nobody reviews their entitlements, and the reason they were granted access is forgotten, so they accumulate permissions that no current process justifies. Delete service principals that are no longer needed, and reactivate one only when there is a live workload that requires it.
      audit: |
        ### Audit via Console

        1. Sign in to the Databricks account console as an account admin.
        2. Open **User management** and select **Service principals**.
        3. Review the status column and identify any service principal that is not active.

        A passing result shows every account service principal active. A failing result shows at least one inactive service principal.

        ### Audit via CLI

        1. List the account service principals and their status:

            ```bash
            databricks account service-principals list
            ```

        A passing result shows `active` set to `true` on every service principal. A failing result shows `false` on any of them.
      remediation:
        - id: console
          desc: |
            To remove an inactive service principal using the account console:

            1. Sign in to the Databricks account console as an account admin.
            2. Open **User management** and select **Service principals**.
            3. Select the inactive service principal and delete it. Reactivate it instead only if it is still required.

            ```text
            Service principals: no inactive entries
            ```
        - id: cli
          desc: |
            To remove an inactive service principal using the Databricks CLI:

            1. Identify the inactive service principal ID:

                ```bash
                databricks account service-principals list
                ```

            2. Delete it, or reactivate it if it is still required:

                ```bash
                databricks account service-principals delete <service-principal-id>
                ```
        - id: terraform
          desc: |
            To keep managed service principals active using the `databricks/databricks` Terraform provider, set `active` to `true`, and remove the resource entirely for identities that are no longer needed:

            ```hcl
            resource "databricks_service_principal" "automation" {
              display_name = "ci-automation"
              active       = true
            }
            ```
