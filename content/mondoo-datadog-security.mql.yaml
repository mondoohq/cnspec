policies:
  - uid: mondoo-datadog-security
    name: Mondoo Datadog Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: datadog
    require:
      - provider: datadog
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden Datadog organization single sign-on, membership allowlisting, and sharing
    docs:
      desc: |
        The Mondoo Datadog Security policy connects to a Datadog organization and reads its security and sharing settings through the `datadog.org` resource. Because it reads the organization's live configuration rather than a copy on disk, the checks reflect the settings Datadog is actually enforcing for members and shared content.

        This policy assesses how the organization authenticates and admits members and how it exposes monitoring data. It covers SAML single sign-on and strict enforcement, so members authenticate through the organization's identity provider and cannot fall back to direct logins. It checks that new members are constrained to approved email domains through the email-domain allowlist. It also checks that individual dashboard widgets cannot be shared externally, keeping monitoring data inside the organization.

        Learn more about scanning with cnspec in the [cnspec documentation](https://mondoo.com/docs/cnspec).
    groups:
      - title: Authentication
        filters: asset.platform == "datadog"
        checks:
          - uid: mondoo-datadog-security-saml-enabled
          - uid: mondoo-datadog-security-saml-strict-mode
      - title: Access Control
        filters: asset.platform == "datadog"
        checks:
          - uid: mondoo-datadog-security-domain-allowlist-enabled
          - uid: mondoo-datadog-security-no-public-widget-share
    scoring_system: highest impact
queries:
  - uid: mondoo-datadog-security-saml-enabled
    filters: asset.platform == "datadog"
    title: Ensure Datadog SAML single sign-on is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      datadog.org.samlEnabled == true
    docs:
      desc: |-
        This check ensures that SAML single sign-on is enabled for the Datadog organization so that members authenticate through the organization's identity provider rather than with standalone Datadog credentials. Centralizing authentication lets the identity provider enforce multi-factor authentication, conditional access, and consistent account lifecycle management.

        **Why this matters**

        - **Central identity control:** Authentication and account state are governed by the identity provider, so provisioning and deprovisioning follow the organization's directory.
        - **Stronger authentication:** SAML lets the identity provider enforce MFA and conditional access policies that standalone logins bypass.
        - **Consistent policy:** Session, device, and access controls are applied uniformly across every application federated to the identity provider.

        **Risk mitigation**

        - **Faster offboarding:** Disabling a user in the identity provider immediately cuts off Datadog access.
        - **Reduced credential sprawl:** Members do not maintain separate Datadog passwords that can be phished or reused.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Select **Login Methods** and review the **SAML** section.

        If SAML is configured and enabled, the check passes. If SAML is not enabled, the check fails.
      remediation:
        - id: console
          desc: |-
            To enable SAML single sign-on using the Datadog console:

            1. Open **Organization Settings** and select **Login Methods**.
            2. In the **SAML** section, upload your identity provider's metadata and configure the required attributes.
            3. Enable SAML for the organization and confirm a test login succeeds.
        - id: terraform
          desc: |-
            To enable SAML single sign-on using the `DataDog/datadog` Terraform provider, manage the organization settings and enable SAML:

            ```hcl
            resource "datadog_organization_settings" "org" {
              name = "example-org"

              settings {
                saml {
                  enabled = true
                }
              }
            }
            ```
    refs:
      - url: https://docs.datadoghq.com/account_management/saml/
        title: Datadog SAML
  - uid: mondoo-datadog-security-saml-strict-mode
    filters: asset.platform == "datadog"
    title: Ensure Datadog SAML strict mode is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      datadog.org.samlStrictModeEnabled == true
    docs:
      desc: |-
        This check ensures that SAML strict mode is enabled for the Datadog organization so that username-and-password logins are refused once SAML is active. Without strict mode, a member can bypass the identity provider, and the MFA and conditional access it enforces, by signing in with a direct Datadog login.

        **Why this matters**

        - **No fallback path:** Strict mode closes the direct-login route that would otherwise let a member sidestep federated authentication.
        - **Enforced MFA:** Because every login must go through the identity provider, the MFA and conditional access the provider enforces cannot be skipped.
        - **Consistent enforcement:** Strict mode guarantees the SAML policy applies to all members, not just those who choose to use it.

        **Risk mitigation**

        - **Phishing resistance:** Removing standalone password logins eliminates a credential that can be phished or reused.
        - **Attack-surface reduction:** A single, controlled authentication path is easier to monitor and secure than two parallel ones.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Select **Login Methods** and review the **SAML Strict Mode** setting.

        If SAML strict mode is enabled, the check passes. If it is disabled, the check fails.
      remediation:
        - id: console
          desc: |-
            To enable SAML strict mode using the Datadog console:

            1. Open **Organization Settings** and select **Login Methods**.
            2. Confirm SAML is configured and enabled first.
            3. Enable **SAML Strict Mode** so only SAML logins are accepted.
        - id: terraform
          desc: |-
            To enable SAML strict mode using the `DataDog/datadog` Terraform provider, manage the organization settings and enable strict mode:

            ```hcl
            resource "datadog_organization_settings" "org" {
              name = "example-org"

              settings {
                saml {
                  enabled = true
                }

                saml_strict_mode {
                  enabled = true
                }
              }
            }
            ```
    refs:
      - url: https://docs.datadoghq.com/account_management/saml/
        title: Datadog SAML
  - uid: mondoo-datadog-security-domain-allowlist-enabled
    filters: asset.platform == "datadog"
    title: Ensure the Datadog email domain allowlist is enforced
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      datadog.org.domainAllowlistEnabled == true
    docs:
      desc: |-
        This check ensures that the email-domain allowlist is enforced for the Datadog organization so that only users from approved domains can be invited to or created in the organization. Without the allowlist, a member can add an account from any email domain, letting arbitrary external identities gain access.

        **Why this matters**

        - **Bounded membership:** Restricting invitations to approved domains keeps organization access tied to identities the business controls.
        - **Reduced insider risk:** An allowlist prevents a member from quietly adding personal or third-party accounts.
        - **Consistent onboarding:** New members must come from a known corporate domain, aligning membership with the directory.

        **Risk mitigation**

        - **No rogue accounts:** External addresses cannot be added to the organization outside the approved domains.
        - **Clear accountability:** Every member maps to a recognized corporate identity, simplifying audit and offboarding.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Review the email **domain allowlist** configuration.

        If the domain allowlist is enabled and populated with approved domains, the check passes. If it is disabled, the check fails.
      remediation:
        - id: console
          desc: |-
            To enforce the email domain allowlist using the Datadog console:

            1. Open **Organization Settings**.
            2. Enable the email **domain allowlist**.
            3. Add each approved corporate email domain, then save.
        # No Terraform remediation: the DataDog/datadog provider's datadog_organization_settings resource does not expose the organization email-domain allowlist; configure it in the Datadog console.
    refs:
      - url: https://docs.datadoghq.com/account_management/org_settings/
        title: Datadog organization settings
  - uid: mondoo-datadog-security-no-public-widget-share
    filters: asset.platform == "datadog"
    title: Ensure Datadog restricts sharing dashboard widgets externally
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      datadog.org.privateWidgetShare == false
    docs:
      desc: |-
        This check ensures that external sharing of individual dashboard widgets is disabled for the Datadog organization, preventing monitoring data from being exposed outside the organization through public widget embeds. The `privateWidgetShare` field is `true` when external widget sharing is permitted, so the secure state is `false`.

        **Why this matters**

        - **Data exposure:** A publicly shared widget embeds live monitoring data on any page that includes its URL, reachable without authentication.
        - **Uncontrolled distribution:** Once a widget share link exists, it can be forwarded or indexed beyond the intended audience.
        - **Sensitive telemetry:** Dashboards often reveal infrastructure names, traffic patterns, and error rates that aid an attacker.

        **Risk mitigation**

        - **Contained monitoring data:** Disabling external widget sharing keeps dashboard content inside authenticated sessions.
        - **Reduced reconnaissance surface:** Attackers cannot harvest operational detail from public embeds.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Review the **sharing** settings for public or external dashboard widget sharing.

        If external widget sharing is turned off, the check passes. If it is permitted, the check fails.
      remediation:
        - id: console
          desc: |-
            To disable external dashboard widget sharing using the Datadog console:

            1. Open **Organization Settings**.
            2. Locate the **sharing** settings.
            3. Disable public or external widget sharing, then save.
        - id: terraform
          desc: |-
            To disable external dashboard widget sharing using the `DataDog/datadog` Terraform provider, manage the organization settings and set `private_widget_share` to `false`:

            ```hcl
            resource "datadog_organization_settings" "org" {
              name = "example-org"

              settings {
                private_widget_share = false
              }
            }
            ```
    refs:
      - url: https://docs.datadoghq.com/account_management/org_settings/
        title: Datadog organization settings
