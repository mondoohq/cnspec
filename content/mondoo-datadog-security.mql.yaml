policies:
  - uid: mondoo-datadog-security
    name: Mondoo Datadog Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: datadog
    require:
      - provider: datadog
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden Datadog organization single sign-on, membership allowlisting, and sharing
    docs:
      desc: |
        The Mondoo Datadog Security policy reads the security and sharing settings of a Datadog organization through the `datadog.org` resource. Scanning a live organization reports the settings Datadog is actually enforcing for members and shared content. Every check also carries Terraform HCL, plan, and state variants, so the same control can be assessed from the configuration that will create those settings before it reaches Datadog.

        This policy assesses how the organization authenticates and admits members and how it exposes monitoring data. It covers SAML single sign-on and strict enforcement, so members authenticate through the organization's identity provider and cannot fall back to direct logins. It checks that new members are constrained to approved email domains through the email-domain allowlist. It also checks that individual dashboard widgets cannot be shared externally, keeping monitoring data inside the organization.

        Learn more about scanning with cnspec in the [cnspec documentation](https://mondoo.com/docs/cnspec).
    groups:
      - title: Authentication
        checks:
          - uid: mondoo-datadog-security-saml-enabled
          - uid: mondoo-datadog-security-saml-strict-mode
      - title: Access Control
        checks:
          - uid: mondoo-datadog-security-domain-allowlist-enabled
          - uid: mondoo-datadog-security-no-public-widget-share
    scoring_system: highest impact
queries:
  - uid: mondoo-datadog-security-saml-enabled
    title: Ensure Datadog SAML single sign-on is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    variants:
      - uid: mondoo-datadog-security-saml-enabled-datadog
        tags:
          mondoo.com/filter-title: Datadog Organization
          mondoo.com/filter-icon: datadog
      - uid: mondoo-datadog-security-saml-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-saml-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-saml-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |-
        This check ensures that SAML single sign-on is enabled for the Datadog organization so that members authenticate through the organization's identity provider rather than with standalone Datadog credentials. Centralizing authentication lets the identity provider enforce multi-factor authentication, conditional access, and consistent account lifecycle management.

        **Why this matters**

        - **Central identity control:** Authentication and account state are governed by the identity provider, so provisioning and deprovisioning follow the organization's directory.
        - **Stronger authentication:** SAML lets the identity provider enforce MFA and conditional access policies that standalone logins bypass.
        - **Consistent policy:** Session, device, and access controls are applied uniformly across every application federated to the identity provider.

        **Risk mitigation**

        - **Faster offboarding:** Disabling a user in the identity provider immediately cuts off Datadog access.
        - **Reduced credential sprawl:** Members do not maintain separate Datadog passwords that can be phished or reused.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Select **Login Methods** and review the **SAML** section.

        If SAML is configured and enabled, the check passes. If SAML is not enabled, the check fails.
      remediation:
        - id: console
          desc: |-
            To enable SAML single sign-on using the Datadog console:

            1. Open **Organization Settings** and select **Login Methods**.
            2. In the **SAML** section, upload your identity provider's metadata and configure the required attributes.
            3. Enable SAML for the organization and confirm a test login succeeds.
        - id: terraform
          desc: |-
            To enable SAML single sign-on using the `DataDog/datadog` Terraform provider, manage the organization settings and enable SAML. The provider requires all four SAML blocks inside `settings`, and the resource manages the whole settings object, so the blocks unrelated to this change read their current values from the matching data source:

            ```hcl
            data "datadog_organization_settings" "current" {}

            resource "datadog_organization_settings" "org" {
              name = data.datadog_organization_settings.current.name

              settings {
                saml {
                  enabled = true
                }

                saml_strict_mode {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_strict_mode[0].enabled
                }

                saml_idp_initiated_login {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_idp_initiated_login[0].enabled
                }

                saml_autocreate_users_domains {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_autocreate_users_domains[0].enabled
                  domains = data.datadog_organization_settings.current.settings[0].saml_autocreate_users_domains[0].domains
                }
              }
            }
            ```
    refs:
      - url: https://docs.datadoghq.com/account_management/saml/
        title: Datadog SAML
  - uid: mondoo-datadog-security-saml-enabled-datadog
    filters: asset.platform == "datadog"
    mql: |
      datadog.org.samlEnabled == true
  # saml.enabled defaults to false, so an organization_settings resource that omits the settings
  # block, or the saml block inside it, leaves SAML off. Both absences are guarded rather than left
  # to all() on an empty list, which would pass vacuously and report SAML as enabled.
  - uid: mondoo-datadog-security-saml-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "datadog_organization_settings")
    mql: |
      terraform.resources("datadog_organization_settings").all(blocks.where(type == "settings") != empty && blocks.where(type == "settings").all(blocks.where(type == "saml") != empty && blocks.where(type == "saml").all(arguments["enabled"] == true)))
  - uid: mondoo-datadog-security-saml-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "datadog_organization_settings")
    mql: |
      terraform.plan.resourceChanges.where(type == "datadog_organization_settings").all(change.after["settings"] != empty && change.after["settings"].all(_["saml"] != empty && _["saml"].all(_["enabled"] == true)))
  - uid: mondoo-datadog-security-saml-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "datadog_organization_settings")
    mql: |
      terraform.state.resources.where(type == "datadog_organization_settings").all(values["settings"] != empty && values["settings"].all(_["saml"] != empty && _["saml"].all(_["enabled"] == true)))
  - uid: mondoo-datadog-security-saml-strict-mode
    title: Ensure Datadog SAML strict mode is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    variants:
      - uid: mondoo-datadog-security-saml-strict-mode-datadog
        tags:
          mondoo.com/filter-title: Datadog Organization
          mondoo.com/filter-icon: datadog
      - uid: mondoo-datadog-security-saml-strict-mode-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-saml-strict-mode-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-saml-strict-mode-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |-
        This check ensures that SAML strict mode is enabled for the Datadog organization so that username-and-password logins are refused once SAML is active. Without strict mode, a member can bypass the identity provider, and the MFA and conditional access it enforces, by signing in with a direct Datadog login.

        **Why this matters**

        - **No fallback path:** Strict mode closes the direct-login route that would otherwise let a member sidestep federated authentication.
        - **Enforced MFA:** Because every login must go through the identity provider, the MFA and conditional access the provider enforces cannot be skipped.
        - **Consistent enforcement:** Strict mode guarantees the SAML policy applies to all members, not just those who choose to use it.

        **Risk mitigation**

        - **Phishing resistance:** Removing standalone password logins eliminates a credential that can be phished or reused.
        - **Attack-surface reduction:** A single, controlled authentication path is easier to monitor and secure than two parallel ones.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Select **Login Methods** and review the **SAML Strict Mode** setting.

        If SAML strict mode is enabled, the check passes. If it is disabled, the check fails.
      remediation:
        - id: console
          desc: |-
            To enable SAML strict mode using the Datadog console:

            1. Open **Organization Settings** and select **Login Methods**.
            2. Confirm SAML is configured and enabled first.
            3. Enable **SAML Strict Mode** so only SAML logins are accepted.
        - id: terraform
          desc: |-
            To enable SAML strict mode using the `DataDog/datadog` Terraform provider, manage the organization settings and enable strict mode. Strict mode needs SAML itself enabled in the same block, otherwise Datadog rejects the change. The provider requires all four SAML blocks inside `settings`, and the resource manages the whole settings object, so the blocks unrelated to this change read their current values from the matching data source:

            ```hcl
            data "datadog_organization_settings" "current" {}

            resource "datadog_organization_settings" "org" {
              name = data.datadog_organization_settings.current.name

              settings {
                saml {
                  enabled = true
                }

                saml_strict_mode {
                  enabled = true
                }

                saml_idp_initiated_login {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_idp_initiated_login[0].enabled
                }

                saml_autocreate_users_domains {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_autocreate_users_domains[0].enabled
                  domains = data.datadog_organization_settings.current.settings[0].saml_autocreate_users_domains[0].domains
                }
              }
            }
            ```
    refs:
      - url: https://docs.datadoghq.com/account_management/saml/
        title: Datadog SAML
  - uid: mondoo-datadog-security-saml-strict-mode-datadog
    filters: asset.platform == "datadog"
    mql: |
      datadog.org.samlStrictModeEnabled == true
  # saml_strict_mode.enabled defaults to false and is guarded the same way as saml.enabled. These
  # variants assert strict mode alone, matching the runtime check. SAML itself being enabled is
  # the separate mondoo-datadog-security-saml-enabled check.
  - uid: mondoo-datadog-security-saml-strict-mode-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "datadog_organization_settings")
    mql: |
      terraform.resources("datadog_organization_settings").all(blocks.where(type == "settings") != empty && blocks.where(type == "settings").all(blocks.where(type == "saml_strict_mode") != empty && blocks.where(type == "saml_strict_mode").all(arguments["enabled"] == true)))
  - uid: mondoo-datadog-security-saml-strict-mode-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "datadog_organization_settings")
    mql: |
      terraform.plan.resourceChanges.where(type == "datadog_organization_settings").all(change.after["settings"] != empty && change.after["settings"].all(_["saml_strict_mode"] != empty && _["saml_strict_mode"].all(_["enabled"] == true)))
  - uid: mondoo-datadog-security-saml-strict-mode-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "datadog_organization_settings")
    mql: |
      terraform.state.resources.where(type == "datadog_organization_settings").all(values["settings"] != empty && values["settings"].all(_["saml_strict_mode"] != empty && _["saml_strict_mode"].all(_["enabled"] == true)))
  - uid: mondoo-datadog-security-domain-allowlist-enabled
    title: Ensure the Datadog email domain allowlist is enforced
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-datadog-security-domain-allowlist-enabled-datadog
        tags:
          mondoo.com/filter-title: Datadog Organization
          mondoo.com/filter-icon: datadog
      - uid: mondoo-datadog-security-domain-allowlist-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-domain-allowlist-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-domain-allowlist-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |-
        This check ensures that the email-domain allowlist is enforced for the Datadog organization so that only users from approved domains can be invited to or created in the organization. Without the allowlist, a member can add an account from any email domain, letting arbitrary external identities gain access.

        **Why this matters**

        - **Bounded membership:** Restricting invitations to approved domains keeps organization access tied to identities the business controls.
        - **Reduced insider risk:** An allowlist prevents a member from quietly adding personal or third-party accounts.
        - **Consistent onboarding:** New members must come from a known corporate domain, aligning membership with the directory.

        **Risk mitigation**

        - **No rogue accounts:** External addresses cannot be added to the organization outside the approved domains.
        - **Clear accountability:** Every member maps to a recognized corporate identity, simplifying audit and offboarding.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Review the email **domain allowlist** configuration.

        If the domain allowlist is enabled, the check passes. If it is disabled, the check fails. The check reads whether the allowlist is enforced, not which domains it holds, so review the domain list separately.
      remediation:
        - id: console
          desc: |-
            To enforce the email domain allowlist using the Datadog console:

            1. Open **Organization Settings**.
            2. Enable the email **domain allowlist**.
            3. Add each approved corporate email domain, then save.
        - id: terraform
          desc: |-
            To enforce the email domain allowlist using the `DataDog/datadog` Terraform provider, declare the `datadog_domain_allowlist` resource. The allowlist is served by its own API endpoint rather than by the organization settings object, so it is a separate resource and not a block inside `datadog_organization_settings`. Both arguments are required:

            ```hcl
            resource "datadog_domain_allowlist" "main" {
              enabled = true
              domains = ["example.com", "example.org"]
            }
            ```

            **The `domains` argument replaces the allowlist rather than adding to it.** List every approved domain in this resource, because applying it with a partial list removes the domains left out.
    refs:
      - url: https://docs.datadoghq.com/account_management/org_settings/
        title: Datadog organization settings
  - uid: mondoo-datadog-security-domain-allowlist-enabled-datadog
    filters: asset.platform == "datadog"
    mql: |
      datadog.org.domainAllowlistEnabled == true
  # The allowlist is its own API surface rather than a field of the organization settings, so these
  # variants read datadog_domain_allowlist and not datadog_organization_settings. Both of its
  # arguments are required, so enabled is never absent in a configuration that applies.
  - uid: mondoo-datadog-security-domain-allowlist-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "datadog_domain_allowlist")
    mql: |
      terraform.resources("datadog_domain_allowlist").all(arguments["enabled"] == true)
  - uid: mondoo-datadog-security-domain-allowlist-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "datadog_domain_allowlist")
    mql: |
      terraform.plan.resourceChanges.where(type == "datadog_domain_allowlist").all(change.after["enabled"] == true)
  - uid: mondoo-datadog-security-domain-allowlist-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "datadog_domain_allowlist")
    mql: |
      terraform.state.resources.where(type == "datadog_domain_allowlist").all(values["enabled"] == true)
  - uid: mondoo-datadog-security-no-public-widget-share
    title: Ensure Datadog restricts sharing dashboard widgets externally
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-datadog-security-no-public-widget-share-datadog
        tags:
          mondoo.com/filter-title: Datadog Organization
          mondoo.com/filter-icon: datadog
      - uid: mondoo-datadog-security-no-public-widget-share-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-no-public-widget-share-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-datadog-security-no-public-widget-share-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |-
        This check ensures that external sharing of individual dashboard widgets is disabled for the Datadog organization, preventing monitoring data from being exposed outside the organization through public widget embeds. The `privateWidgetShare` field is `true` when external widget sharing is permitted, so the secure state is `false`.

        **Why this matters**

        - **Data exposure:** A publicly shared widget embeds live monitoring data on any page that includes its URL, reachable without authentication.
        - **Uncontrolled distribution:** Once a widget share link exists, it can be forwarded or indexed beyond the intended audience.
        - **Sensitive telemetry:** Dashboards often reveal infrastructure names, traffic patterns, and error rates that aid an attacker.

        **Risk mitigation**

        - **Contained monitoring data:** Disabling external widget sharing keeps dashboard content inside authenticated sessions.
        - **Reduced reconnaissance surface:** Attackers cannot harvest operational detail from public embeds.
      audit: |-
        ### Audit via the Datadog console

        1. Sign in to Datadog and open **Organization Settings**.
        2. Review the **sharing** settings for public or external dashboard widget sharing.

        If external widget sharing is turned off, the check passes. If it is permitted, the check fails.
      remediation:
        - id: console
          desc: |-
            To disable external dashboard widget sharing using the Datadog console:

            1. Open **Organization Settings**.
            2. Locate the **sharing** settings.
            3. Disable public or external widget sharing, then save.
        - id: terraform
          desc: |-
            To disable external dashboard widget sharing using the `DataDog/datadog` Terraform provider, manage the organization settings and set `private_widget_share` to `false`. The provider requires all four SAML blocks inside `settings`, and the resource manages the whole settings object, so the blocks unrelated to this change read their current values from the matching data source:

            ```hcl
            data "datadog_organization_settings" "current" {}

            resource "datadog_organization_settings" "org" {
              name = data.datadog_organization_settings.current.name

              settings {
                private_widget_share = false

                saml {
                  enabled = data.datadog_organization_settings.current.settings[0].saml[0].enabled
                }

                saml_strict_mode {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_strict_mode[0].enabled
                }

                saml_idp_initiated_login {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_idp_initiated_login[0].enabled
                }

                saml_autocreate_users_domains {
                  enabled = data.datadog_organization_settings.current.settings[0].saml_autocreate_users_domains[0].enabled
                  domains = data.datadog_organization_settings.current.settings[0].saml_autocreate_users_domains[0].domains
                }
              }
            }
            ```
    refs:
      - url: https://docs.datadoghq.com/account_management/org_settings/
        title: Datadog organization settings
  - uid: mondoo-datadog-security-no-public-widget-share-datadog
    filters: asset.platform == "datadog"
    mql: |
      datadog.org.privateWidgetShare == false
  # private_widget_share defaults to false, which is the secure state, so an absent settings block
  # or an absent argument passes. That is why these assert != true rather than == false: an absent
  # argument reads null, and null == false is false. The plan and state variants need an explicit
  # empty guard because an absent settings key reads null there, and all() on null fails.
  - uid: mondoo-datadog-security-no-public-widget-share-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "datadog_organization_settings")
    mql: |
      terraform.resources("datadog_organization_settings").all(blocks.where(type == "settings").all(arguments["private_widget_share"] != true))
  - uid: mondoo-datadog-security-no-public-widget-share-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "datadog_organization_settings")
