      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-rdp-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Cloud Firewall admits inbound RDP from the entire internet.

        A Cloud Firewall inbound rule permitting TCP port 3389 from `0.0.0.0/0` or `::/0` publishes the Remote Desktop endpoint of every Droplet the firewall covers. RDP should never be reachable from untrusted networks. Inbound rules are edited under Networking then Firewalls in the DigitalOcean Cloud Control Panel, or with `doctl compute firewall add-rules`.

        **Why this matters**

        Internet-exposed RDP is one of the most common ransomware delivery channels. Attackers acquire working credentials from broker markets and connect directly to exposed endpoints, so the intrusion looks like an ordinary login and requires no exploit at all.

        RDP also carries a documented history of critical pre-authentication remote code execution vulnerabilities, which are routinely weaponized within days of disclosure. An endpoint reachable from the internet is exploitable the moment such a flaw is published, well before most operators have patched.

        Public RDP endpoints separately attract continuous credential-stuffing tools that replay breached username and password pairs at scale, so any password reused from a prior breach is tried against the endpoint automatically.

        Blocking RDP from public sources removes the endpoint from the attack surface entirely, which is one of the highest-return single controls available for preventing ransomware incidents in cloud environments. Legitimate users should reach RDP through a VPN or a bastion host instead.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Firewalls**.
        3. Open each firewall and review the **Inbound Rules** table.
        4. Look for any rule that allows TCP port 3389 with a source of `All IPv4` (`0.0.0.0/0`) or `All IPv6` (`::/0`).

        A passing firewall has no inbound RDP rule with an unrestricted source. A failing firewall contains an inbound rule for TCP port 3389 sourced from `0.0.0.0/0` or `::/0`.

        ### Audit via CLI

        1. List all firewalls and retrieve their inbound rules:

        ```bash
        doctl compute firewall list --format ID,Name
        doctl compute firewall get <firewall-id> --format InboundRules
        ```

        A passing firewall returns no inbound rule for port 3389 with `address:0.0.0.0/0` or `address:::/0`. A failing firewall returns an inbound rule for `protocol:tcp,ports:3389` with a source of `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Firewalls** and open the affected firewall.
            2. Remove the RDP rule entirely, or restrict the source to a specific trusted CIDR, tag, or Droplet ID.
            3. Save the firewall.
        - id: cli
          desc: |
            To fix this on the command line using the `doctl` CLI, remove the unrestricted RDP rule for both the IPv4 and IPv6 catch-all sources:

            ```bash
            doctl compute firewall remove-rules "<firewall-id>" \
              --inbound-rules "protocol:tcp,ports:3389,address:0.0.0.0/0 protocol:tcp,ports:3389,address:::/0"
            ```
        - id: terraform
          desc: |
            To remove unrestricted RDP access in Terraform, drop the public `inbound_rule` for port 3389 or scope its `source_addresses` to a trusted CIDR:

            ```hcl
            resource "digitalocean_firewall" "example" {
              name = "example"

              inbound_rule {
                protocol         = "tcp"
                port_range       = "3389"
                source_addresses = ["203.0.113.0/24"]
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/firewalls/how-to/configure-rules/
        title: Configure Cloud Firewall rules

