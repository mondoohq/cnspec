  # No Terraform variants: internetReachable resolves the cluster's live public connection
  # endpoint against its effective trusted-source firewall rules. The digitalocean_database_cluster
  # Terraform resource exposes neither the resolved public reachability nor the evaluated
  # trusted-source decision, so there is nothing equivalent to assert in HCL, plan, or state.
  # The db-in-private-network and db-firewall-configured checks already cover the
  # Terraform-expressible posture.
  - uid: mondoo-digitalocean-security-db-not-internet-reachable
    title: Ensure managed databases are not reachable from the internet
    impact: 85
    filters: asset.platform == "digitalocean-database"
    mql: |
      digitalocean.database.internetReachable == false
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    docs:
      desc: |
        This check verifies that no managed database cluster is actually reachable from the public internet.

        The `internetReachable` signal correlates the cluster's public connection endpoint with its trusted-source firewall rules. A cluster counts as internet-reachable when it publishes a public endpoint and those rules admit any address, which includes the common case where no trusted sources are configured at all and the public endpoint is left open to every host. Because it accounts for whether the rules actually restrict access, it is a higher-fidelity signal than the presence of a public endpoint alone.

        **Why this matters**

        A database that no internet host can reach is removed from the pool of targets for credential stuffing and for protocol-level attacks against the database engine. Both of those are automated and continuous, so removing the path removes a standing workload rather than a hypothetical one.

        Correlating the endpoint with the rules catches the specific failure that matters: a cluster that kept its public endpoint while its trusted-source list is empty or world-open. That combination is easy to produce during troubleshooting and easy to miss afterward, because neither half looks alarming on its own.

        Keeping the cluster private supplements engine authentication rather than replacing it, so a weak or leaked credential is not directly exploitable from an arbitrary internet host, and the endpoint stops appearing to mass scanners entirely.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Databases** and open each cluster.
        3. On the **Overview** tab, review the **Connection Details** for a public host, and on the **Settings** tab review the **Trusted Sources** list.

        A passing database cluster either exposes no public connection endpoint or restricts its trusted sources to specific resources or CIDRs. A failing database cluster exposes a public endpoint while its trusted sources admit any address or are empty.

        ### Audit via CLI

        1. List clusters and inspect each cluster's trusted-source firewall rules:

        ```bash
        doctl databases list --format ID,Name,Engine
        doctl databases firewalls list <database-id>
        ```

        A passing database cluster returns trusted-source rules that name specific droplets, tags, Kubernetes clusters, or narrow CIDRs. A failing database cluster returns an `ip_addr` rule of `0.0.0.0/0` or `::/0`, or no trusted-source rules at all while a public endpoint is in use.
      remediation:
        - id: console
          desc: |
            A cluster with a public connection endpoint passes once its Trusted Sources list is not empty and contains no `0.0.0.0/0` or `::/0` entry. Connecting clients over the private VPC hostname does not remove the public endpoint, so the Trusted Sources list is what closes the finding.

            **Clients missing from the list lose access.** Once the list is restrictive, the cluster refuses every source not on it, so add all application hosts and administrator addresses before removing the world-open entry.

            To close the internet-reachable path in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Databases** and open the affected cluster.
            2. On the **Settings** tab, edit **Trusted Sources** and add the specific Droplets, tags, apps, Kubernetes clusters, or narrow CIDRs that need access.
            3. Remove any trusted-source entry of `0.0.0.0/0` or `::/0`, and confirm at least one restrictive trusted source remains.
        - id: cli
          desc: |
            A cluster with a public connection endpoint passes once its Trusted Sources list is not empty and contains no `ip_addr` rule of `0.0.0.0/0` or `::/0`.

            **Clients missing from the list lose access.** Once the list is restrictive, the cluster refuses every source not on it, so append rules for all clients before removing the world-open rule.

            To restrict the trusted sources on the command line using the `doctl` CLI:

            1. Append a rule for each client that needs access. `droplet:<droplet-id>` allows one Droplet, and `ip_addr:<address>` allows one IP address or a narrow CIDR range such as an office network. `tag:`, `k8s:`, and `app:` rules are also accepted:

                ```bash
                doctl databases firewalls append <database-id> --rule droplet:<droplet-id>
                doctl databases firewalls append <database-id> --rule ip_addr:<address>
                ```

            2. List the rules and note the UUID of any `ip_addr` rule whose value is `0.0.0.0/0` or `::/0`:

                ```bash
                doctl databases firewalls list <database-id>
                ```

            3. Remove each world-open rule by its UUID:

                ```bash
                doctl databases firewalls remove <database-id> --uuid <rule-uuid>
                ```
        # No Terraform remediation: internetReachable is a runtime correlation of the live
        # public endpoint with the effective trusted-source rules and has no single
        # configuration analog. Express the desired posture with the db-in-private-network
        # and db-firewall-configured Terraform remediations instead.
    refs:
      - url: https://docs.digitalocean.com/products/databases/postgresql/how-to/secure/
        title: How to Secure PostgreSQL Managed Database Clusters

  - uid: mondoo-digitalocean-security-db-engine-supported-version
    title: Ensure managed database engines are not running an EOL version
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-digitalocean-security-db-engine-supported-version-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-db-engine-supported-version-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-db-engine-supported-version-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-db-engine-supported-version-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no managed database cluster runs an engine version that has reached end of life.

        Each cluster's engine and version are compared against the releases that no longer receive security patches from their upstream maintainer or from DigitalOcean, covering PostgreSQL, MySQL, Redis, MongoDB, Kafka, and OpenSearch. The version in use is shown on the cluster overview in the DigitalOcean Cloud Control Panel and returned by `doctl databases get`.

        **Why this matters**

        An end-of-life engine receives no patches for newly disclosed CVEs, so known vulnerabilities accumulate in it with no remediation available. Known-exploited flaws in older PostgreSQL, MySQL, Redis, MongoDB, and other database releases are routinely weaponized in both targeted and opportunistic attacks, and the cluster holds exactly the data those attacks are aimed at.

        Supported versions also carry protocol-level security improvements that older releases simply lack, including stronger TLS defaults and better authentication mechanisms. Staying on an unsupported major means forgoing those improvements permanently, not merely waiting longer for fixes.

        Most security frameworks require software components to receive vendor security support, so an end-of-life engine produces an audit finding regardless of how well the rest of the environment is configured.

        Migrating to a supported major version restores the flow of security patches without requiring other configuration changes. DigitalOcean provides upgrade tooling for supported engine transitions, so acting before a version reaches end of life avoids the more disruptive cold-migration path that a fully retired version forces.
      audit: |
        ### Audit via Console

        Treat the versions that DigitalOcean currently offers as the authoritative list of supported versions. The set of EOL versions changes over time, so check the live `doctl databases options versions` output for each engine rather than relying on a static list. The version ranges below are examples that were EOL at the time of writing and may be incomplete now.

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Databases** and review the **Engine Version** column for each cluster.
        3. Compare each engine and version against the versions DigitalOcean currently offers for that engine. Examples of versions that were EOL at the time of writing include PostgreSQL 9.x through 13, MySQL 5.6 and 5.7, Redis 4 through 6, MongoDB 3.6 through 5.0, Kafka 2.8 through 3.4, and OpenSearch 1.x. Confirm the current set with the CLI step below.

        A passing database cluster runs a version that DigitalOcean still offers for its engine. A failing database cluster runs a version absent from the current supported list.

        ### Audit via CLI

        1. List all clusters with their engine and version, then check the versions DigitalOcean currently supports. Treat this live output as authoritative, since the supported set changes as versions reach EOL:

        ```bash
        doctl databases list --format ID,Name,Engine,Version,Region
        doctl databases options versions --engine pg
        doctl databases options versions --engine mysql
        doctl databases options versions --engine redis
        doctl databases options versions --engine mongodb
        doctl databases options versions --engine kafka
        doctl databases options versions --engine opensearch
        ```

        A passing cluster shows a version in the current supported list for its engine. A failing cluster shows a version absent from that list.
      remediation:
        - id: console
          desc: |
            The cluster fails while it runs one of these versions, so upgrade to a newer version that DigitalOcean still offers:

            - PostgreSQL `9` through `13`
            - MySQL `5.6` and `5.7`
            - Redis `4` through `6`
            - MongoDB `3.6` through `5.0`
            - Kafka `2.8` through `3.4`
            - OpenSearch `1.x`

            Confirm which versions DigitalOcean currently offers with `doctl databases options versions --engine <engine>` before choosing a target.

            **A major-version upgrade cannot be rolled back.** Backups taken on the old version can no longer be used for point-in-time recovery, so add a read-only node or test the upgrade on a fork first.

            To upgrade in place in the DigitalOcean Cloud Control Panel, where the engine offers it:

            1. Navigate to **Databases** and open the affected cluster.
            2. On the **Overview** tab, scroll to **CURRENT VERSION** and click **Upgrade Now**.
            3. Select a supported version. If the compatibility check reports issues, fix them and retry, then click **Upgrade Now**.

            If the engine offers no in-place upgrade, create a new cluster on a supported version, migrate the data with engine-native tools such as `pg_dump` or `mysqldump`, and delete the old cluster after cutover.
        - id: cli
          desc: |
            `doctl` has no major-version upgrade command, so on the command line the fix is a replacement cluster on a supported version, followed by a cutover with engine-native tools. The control panel upgrades supported engines in place instead.

            **This replaces the cluster.** The new cluster does not inherit the old cluster's data, database users, connection pools, or Trusted Sources, and the final step permanently deletes the old cluster with its data and backups.

            1. Identify affected clusters and list supported versions for each engine:

                ```bash
                doctl databases list --format ID,Name,Engine,Version,Region,Size
                doctl databases options versions --engine pg
                doctl databases options versions --engine mysql
                doctl databases options versions --engine redis
                doctl databases options versions --engine mongodb
                doctl databases options versions --engine kafka
                doctl databases options versions --engine opensearch
                ```

            2. Provision a replacement cluster on a supported version. Match the existing region, size, and node count:

                ```bash
                doctl databases create <new-name> \
                  --engine pg \
                  --version 16 \
                  --region <region> \
                  --size <size-slug> \
                  --num-nodes <count> \
                  --private-network-uuid <vpc-uuid>
                ```

                - The example creates PostgreSQL `16`. For another engine, set `--engine` to the old cluster's `Engine` value and `--version` to a version from that engine's `options versions` output that is newer than the failing versions.
                - `<region>`, `<size-slug>`, and `<count>` are the old cluster's `Region`, `Size`, and `NumNodes` values, and `<vpc-uuid>` is the VPC network the application hosts use.

            3. Pull connection info for the new cluster, then migrate the data and re-create the users, connection pools, and Trusted Sources with engine-native tools such as `pg_dump` and `pg_restore` or `mysqldump`:

                ```bash
                doctl databases connection <new-cluster-id> --format Host,Port,User,Password,Database
                ```

            4. Repoint applications and verify them against the new cluster. Then delete the old cluster, which keeps failing the check for as long as it exists:

                ```bash
                doctl databases delete <old-cluster-id>
                ```
        - id: terraform
          desc: |
            Terraform manages the engine version through the `version` argument on `digitalocean_database_cluster`. Set it to a supported major version newer than the failing versions, such as `16` for PostgreSQL. Changing `version` makes the provider call the major-version upgrade API on the existing cluster rather than replacing it.

            **The upgrade cannot be rolled back.** Backups taken on the old version can no longer be used for point-in-time recovery, so test the upgrade on a fork first:

            ```hcl
            resource "digitalocean_database_cluster" "example" {
              name       = "example"
              engine     = "pg"
              version    = "16"
              size       = "db-s-1vcpu-1gb"
              region     = "nyc3"
              node_count = 1
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/databases/postgresql/how-to/upgrade-version/
        title: How to Upgrade PostgreSQL to a New Version

  - uid: mondoo-digitalocean-security-db-engine-supported-version-digitalocean
