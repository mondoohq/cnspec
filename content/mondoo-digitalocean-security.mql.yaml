  - uid: mondoo-digitalocean-security-lb-in-vpc
    title: Ensure load balancers are deployed inside a VPC
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-digitalocean-security-lb-in-vpc-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-lb-in-vpc-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-lb-in-vpc-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-lb-in-vpc-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every load balancer is attached to a VPC.

        A DigitalOcean load balancer can be created without a VPC association, in which case it must reach its backend Droplets over public-facing addresses. Attaching it to a VPC lets it forward to those backends on private IPs instead. The network is selected when the load balancer is created and recorded as its VPC UUID.

        **Why this matters**

        A VPC-attached load balancer keeps intra-application traffic entirely within DigitalOcean's internal network. The forwarding hop from the balancer to the backend never leaves the private network, so hosts outside the VPC cannot intercept or interpose on it.

        Without VPC attachment, that hop needs public endpoints on the backends, which adds internet-reachable addresses to the infrastructure for no reason other than to let two components in the same account talk to each other.

        Shared VPC membership also makes other network controls work as intended. Firewall rules can name the VPC as a trusted source, which is what allows backend ports to accept load-balancer-originated traffic and nothing else, and internal DNS resolution behaves consistently across the tier.

        Because a load balancer's network is fixed at creation, an existing balancer outside the VPC must be replaced by one created inside it.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Load Balancers** and open each load balancer.
        3. Check the **Network** section for a VPC assignment.

        A passing load balancer shows a named VPC in the Network section. A failing load balancer shows no VPC or only a public network assignment.

        ### Audit via CLI

        1. List all load balancers and inspect the `VPCUUID` field:

        ```bash
        doctl compute load-balancer list --format ID,Name,VPCUUID,Region
        ```

        A passing load balancer returns a non-empty `VPCUUID`. A failing load balancer returns an empty `VPCUUID`.
      remediation:
        - id: console
          desc: |
            **This fix replaces the load balancer.** DigitalOcean cannot move a load balancer into a VPC network, and the replacement receives a new IP address, so plan the DNS cutover.

            To fix this in the Cloud Control Panel, create a replacement load balancer in the target VPC and cut traffic over:

            1. Navigate to **Networking** > **Load Balancers** and create a new load balancer.
            2. In the creation flow, select the target VPC under **Network**.
            3. Configure the same forwarding rules, health check, redirect, TLS cipher policy, and firewall rules as the original, and attach the same Droplets or the same tag.
            4. Update DNS to point at the new load balancer's IP address and verify that it serves traffic.
            5. Delete the original load balancer, which keeps failing the check for as long as it exists.
        - id: cli
          desc: |
            **This fix replaces the load balancer.** DigitalOcean cannot move a load balancer into a VPC network, and the replacement receives a new IP address, so plan the DNS cutover.

            To fix this on the command line using the `doctl` CLI:

            1. Print the original load balancer's settings and the VPC networks in its region:

                ```bash
                doctl compute load-balancer get <lb-id> \
                  --format Name,Region,SizeUnit,Tag,DropletIDs,RedirectHttpToHttps,StickySessions,HealthCheck,ForwardingRules,Firewall
                doctl vpcs list --format ID,Name,Region,IPRange
                ```

            2. Create the replacement inside the VPC network:

                ```bash
                doctl compute load-balancer create \
                  --name <new-name> \
                  --region <region> \
                  --vpc-uuid <vpc-uuid> \
                  --droplet-ids <droplet-ids> \
                  --forwarding-rules "entry_protocol:https,entry_port:443,target_protocol:http,target_port:80,certificate_id:<cert-id>" \
                  --redirect-http-to-https \
                  --tls-cipher-policy STRONG
                ```

                - `<vpc-uuid>` is the `ID` of a VPC network in `<region>`, the original load balancer's region. Setting it gives the replacement the VPC membership the check requires.
                - Replace the example `--forwarding-rules` with the original's `ForwardingRules` value, and pass its `HealthCheck`, `StickySessions`, and firewall entries with `--health-check`, `--sticky-sessions`, and `--allow-list`.
                - `<droplet-ids>` is the original's `DropletIDs` value. If it targets a tag instead, replace `--droplet-ids` with `--tag-name <tag>`.
                - `<cert-id>` is the ID of a certificate from `doctl compute certificate list` that covers the served domain.

            3. Update DNS to point at the new load balancer's IP address and verify that it serves traffic.
            4. Delete the original load balancer, which keeps failing the check for as long as it exists:

                ```bash
                doctl compute load-balancer delete <lb-id>
                ```
        - id: terraform
          desc: |
            To deploy load balancers inside a VPC in Terraform, set `vpc_uuid` on the `digitalocean_loadbalancer` resource:

            ```hcl
            resource "digitalocean_loadbalancer" "example" {
              name     = "example-lb"
              region   = "nyc3"
              vpc_uuid = digitalocean_vpc.example.id

              forwarding_rule {
                entry_port       = 443
                entry_protocol   = "https"
                target_port      = 80
                target_protocol  = "http"
                certificate_name = digitalocean_certificate.example.name
              }

              droplet_ids = [digitalocean_droplet.example.id]
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/vpc/
        title: DigitalOcean VPC overview

  - uid: mondoo-digitalocean-security-lb-in-vpc-digitalocean
    filters: asset.platform == "digitalocean-loadbalancer"
    mql: |
      digitalocean.loadBalancer.vpc != null
  - uid: mondoo-digitalocean-security-lb-in-vpc-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_loadbalancer")
    mql: |
      terraform.resources("digitalocean_loadbalancer").all(arguments.vpc_uuid != empty)
  - uid: mondoo-digitalocean-security-lb-in-vpc-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_loadbalancer")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_loadbalancer").all(change.after.vpc_uuid != empty)
  - uid: mondoo-digitalocean-security-lb-in-vpc-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_loadbalancer")
    mql: |
      terraform.state.resources.where(type == "digitalocean_loadbalancer").all(values.vpc_uuid != empty)

  - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled
    title: Ensure DOKS clusters have auto-upgrade enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every DOKS cluster has automatic patch upgrades enabled.

        DigitalOcean Kubernetes applies patch releases to the control plane and node components automatically when auto-upgrade is turned on, during the maintenance window configured for the cluster. New clusters do not have it enabled, so patch application is a manual operator responsibility by default. The setting is on the cluster's Settings tab in the DigitalOcean Cloud Control Panel and is `auto_upgrade` in the API.

        **Why this matters**

        Kubernetes control-plane and node components receive regular patch releases that fix security vulnerabilities. A cluster without auto-upgrade accumulates unpatched CVEs across the whole window between disclosure and the moment an operator notices and acts, and that window is as long as the team's spare attention allows.

        Automating the upgrade removes the operational step most likely to be delayed or skipped during periods of high workload. Operators no longer have to track and apply each patch release per cluster, which is the tracking failure that produces most of the gap in practice.

        It also makes posture consistent across the account. Every cluster receives patches on the same predictable schedule rather than depending on per-cluster manual follow-through, so no cluster silently falls years behind its peers.

        Set the maintenance window to a period the workload can absorb, and keep node pools sized so a rolling node replacement does not exhaust capacity.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Kubernetes** and open each cluster.
        3. Go to **Settings** > **Maintenance** and check whether **Automatically upgrade my cluster to patch releases** is enabled.

        A passing cluster shows auto-upgrade as enabled. A failing cluster shows auto-upgrade as disabled or unconfigured.

        ### Audit via CLI

        1. List all Kubernetes clusters and inspect the `AutoUpgrade` field:

        ```bash
        doctl kubernetes cluster list --format ID,Name,AutoUpgrade,Version,Region
        ```

        A passing cluster returns `true` for `AutoUpgrade`. A failing cluster returns `false`.
      remediation:
        - id: console
          desc: |
            The cluster passes once automatic upgrades are enabled. DigitalOcean then applies new patch releases during the cluster's maintenance window. Minor-version upgrades remain a manual step.

            **Each automatic upgrade replaces the worker nodes.** Workloads are rescheduled and the new nodes receive new IP addresses, so keep surge upgrades enabled and set a maintenance window the workload can absorb.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Kubernetes** and open the affected cluster.
            2. Select the **Settings** tab.
            3. In the **Automatically upgrade minor version patches** section, select **Automatically install minor version patches**.
        - id: cli
          desc: |
            The cluster passes once automatic upgrades are enabled. DigitalOcean then applies new patch releases during the cluster's maintenance window. Minor-version upgrades remain a manual step.

            **Each automatic upgrade replaces the worker nodes.** Workloads are rescheduled and the new nodes receive new IP addresses, so keep surge upgrades enabled and set a maintenance window the workload can absorb.

            To fix this on the command line using the `doctl` CLI, enable auto-upgrade on the affected cluster:

            ```bash
            doctl kubernetes cluster update <cluster-id> --auto-upgrade=true
            ```
        - id: terraform
          desc: |
            To enable automatic patch upgrades in Terraform, set `auto_upgrade = true` on the `digitalocean_kubernetes_cluster` resource. The `maintenance_policy` block sets the window the upgrades run in, and the `digitalocean_kubernetes_versions` data source resolves the latest patch release of a supported minor version:

            ```hcl
            data "digitalocean_kubernetes_versions" "example" {
              version_prefix = "1.35."
            }

            resource "digitalocean_kubernetes_cluster" "example" {
              name         = "example"
              region       = "nyc3"
              version      = data.digitalocean_kubernetes_versions.example.latest_version
              auto_upgrade = true

              maintenance_policy {
                start_time = "04:00"
                day        = "sunday"
              }

              node_pool {
                name       = "default"
                size       = "s-1vcpu-2gb"
                node_count = 1
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/kubernetes/how-to/upgrade-cluster/
        title: Upgrade a DOKS cluster

  - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-digitalocean
    filters: asset.platform == "digitalocean-kubernetes-cluster"
    mql: |
      digitalocean.kubernetes.cluster.autoUpgrade == true
  - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_kubernetes_cluster")
    mql: |
      terraform.resources("digitalocean_kubernetes_cluster").all(arguments["auto_upgrade"] == true)
  - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_kubernetes_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_kubernetes_cluster").all(change.after.auto_upgrade == true)
  - uid: mondoo-digitalocean-security-doks-auto-upgrade-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_kubernetes_cluster")
    mql: |
      terraform.state.resources.where(type == "digitalocean_kubernetes_cluster").all(values.auto_upgrade == true)

  - uid: mondoo-digitalocean-security-doks-supported-version
    title: Ensure DOKS clusters run a supported Kubernetes minor version
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-digitalocean-security-doks-supported-version-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-doks-supported-version-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-doks-supported-version-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-doks-supported-version-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every DOKS cluster runs a Kubernetes minor version that is still supported.

        Upstream Kubernetes supports only the latest three minor versions, and DigitalOcean aligns its own support window with that. This check requires version 1.30 or newer, the boundary of that window. The running version is shown on the cluster overview in the DigitalOcean Cloud Control Panel and returned by `doctl kubernetes cluster get`.

        **Why this matters**

        A cluster on an older minor receives no fixes for newly disclosed CVEs in cluster components, because no upstream patch release targets it. The list of publicly known vulnerabilities present in the cluster grows continuously with nothing available to close them, which makes the environment more exploitable the longer it sits.

        Falling outside the provider support boundary compounds this. Clusters beyond the window may also lose access to critical managed-node updates and operational tooling, so the node images stop advancing along with the control plane.

        Upgrading to a supported minor immediately restores the flow of security fixes from both the upstream community and DigitalOcean's managed node images, and it puts the cluster back in a position where patch releases can be applied within days rather than never.

        Plan minor upgrades one step at a time and check the deprecated API removals for each hop, since a cluster that has fallen several minors behind may need workload changes before it can move.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Kubernetes** and review the **Version** column for each cluster.
        3. Compare the version against the currently supported minor versions (1.30 and newer). A banner or badge indicating **Upgrade Available** confirms the cluster is on an unsupported minor.

        A passing cluster shows a version of 1.30 or newer with no upgrade warning. A failing cluster shows a version older than 1.30 or displays an unsupported-version warning.

        ### Audit via CLI

        1. List all clusters and compare their versions against the available supported versions:

        ```bash
        doctl kubernetes cluster list --format ID,Name,Version,Region
        doctl kubernetes options versions
        ```

        A passing cluster returns a version string that matches an entry in the supported versions list. A failing cluster returns a version not present in that list.
      remediation:
        - id: console
          desc: |
            The cluster passes once it runs Kubernetes 1.30 or newer. A cluster moves up one minor version per upgrade, and only after it has the latest patch release of its current minor version, so a cluster several versions behind needs several upgrades.

            **An upgrade replaces every worker node.** Workloads are rescheduled, the new nodes receive new IP addresses, and APIs removed in the target version stop working, so check the deprecated API removals for each hop and keep surge upgrades enabled.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Kubernetes** and open the affected cluster.
            2. Go to **Overview** and click **Upgrade Available** if present.
            3. Select the offered version, run the cluster linter from the upgrade window, and confirm the upgrade.
            4. Repeat until the cluster runs 1.30 or newer.
        - id: cli
          desc: |
            The cluster passes once it runs Kubernetes 1.30 or newer. A cluster moves up one minor version per upgrade, and only after it has the latest patch release of its current minor version, so a cluster several versions behind needs several upgrades.

            **An upgrade replaces every worker node.** Workloads are rescheduled, the new nodes receive new IP addresses, and APIs removed in the target version stop working, so check the deprecated API removals for each hop and keep surge upgrades enabled.

            To fix this on the command line using the `doctl` CLI:

            1. List the versions this cluster can upgrade to. `doctl kubernetes options versions` lists versions for new clusters instead, which are not always valid upgrade targets:

                ```bash
                doctl kubernetes cluster get-upgrades <cluster-id>
                ```

            2. Upgrade to a version slug from that list, taking the latest patch of the current minor version first if it is offered:

                ```bash
                doctl kubernetes cluster upgrade <cluster-id> --version <version-slug>
                ```

            3. Repeat both steps until the cluster runs 1.30 or newer.
        - id: terraform
          desc: |
            Terraform manages the cluster version through the `version` argument on `digitalocean_kubernetes_cluster`. Use the `digitalocean_kubernetes_versions` data source to resolve the latest patch release for a minor version. The check requires 1.30 or newer, but DigitalOcean only creates clusters on its three most recent minor releases, so point `version_prefix` at one of those, such as `1.35.`:

            ```hcl
            data "digitalocean_kubernetes_versions" "example" {
              version_prefix = "1.35."
            }

            resource "digitalocean_kubernetes_cluster" "example" {
              name    = "example"
              region  = "nyc3"
              version = data.digitalocean_kubernetes_versions.example.latest_version

              node_pool {
                name       = "default"
                size       = "s-1vcpu-2gb"
                node_count = 1
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/kubernetes/details/supported-releases/
        title: DOKS supported Kubernetes releases

  - uid: mondoo-digitalocean-security-doks-supported-version-digitalocean
    filters: asset.platform == "digitalocean-kubernetes-cluster"
    mql: |
      digitalocean.kubernetes.cluster.version == /^1\.(3[0-9]|[4-9][0-9]|[1-9][0-9]{2})\./
  - uid: mondoo-digitalocean-security-doks-supported-version-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_kubernetes_cluster")
    mql: |
      terraform.resources("digitalocean_kubernetes_cluster").all(
        arguments["version"] == /^1\.(3[0-9]|[4-9][0-9]|[1-9][0-9]{2})\./ ||
        arguments["version"] == /^data\.digitalocean_kubernetes_versions\./
      )
      terraform.datasources.where(nameLabel == "digitalocean_kubernetes_versions").all(
        arguments["version_prefix"] == empty ||
        arguments["version_prefix"] == /^1\.(3[0-9]|[4-9][0-9]|[1-9][0-9]{2})\./
      )
  - uid: mondoo-digitalocean-security-doks-supported-version-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_kubernetes_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_kubernetes_cluster").all(
        change.after.version == /^1\.(3[0-9]|[4-9][0-9]|[1-9][0-9]{2})\./
      )
  - uid: mondoo-digitalocean-security-doks-supported-version-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_kubernetes_cluster")
    mql: |
      terraform.state.resources.where(type == "digitalocean_kubernetes_cluster").all(
        values.version == /^1\.(3[0-9]|[4-9][0-9]|[1-9][0-9]{2})\./
      )

  # No Terraform variants yet: the digitalocean Terraform provider now exposes an
  # `sso` block on digitalocean_kubernetes_cluster, so variants can be added.
  - uid: mondoo-digitalocean-security-doks-sso-enabled
    filters: asset.platform == "digitalocean-kubernetes-cluster"
    title: Ensure DOKS clusters have SSO configured
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      digitalocean.kubernetes.cluster.ssoEnabled == true
    docs:
      desc: |
        This check verifies that every DOKS cluster has Single Sign-On configured against an identity provider.

        DOKS can authenticate cluster users through an OIDC identity provider rather than through the static tokens embedded in a downloaded kubeconfig. Until that integration is configured, static kubeconfig tokens are the only authentication path the cluster has. SSO is configured on the cluster's settings in the DigitalOcean Cloud Control Panel.

        **Why this matters**

        Connecting the cluster to an authoritative identity provider is what lets user lifecycle events reach cluster access. Offboarding, group changes, and account suspensions propagate automatically instead of leaving a static token valid until someone remembers to rotate it on every cluster.

        Once the integration exists, MFA policies defined in the identity provider apply to cluster authentication, which raises the bar for credential-based attacks well above what a bearer token in a file on a laptop provides.

        Identity-provider integration also creates an audit trail showing who authenticated to the cluster and when. Static tokens produce no such record, so there is nothing to review after an incident.

        Configuring SSO is the necessary first step toward requiring it, since SSO must be configured before it can be enforced. Pair this check with the requirement that SSO be enforced, because a configured but optional integration leaves the static-token path fully usable.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Kubernetes** and open each cluster.
        3. Go to **Settings** > **Single Sign-On** and check whether an OIDC identity provider is configured.

        A passing cluster shows an SSO configuration with an issuer URL and client ID. A failing cluster shows the SSO section as unconfigured.

        ### Audit via CLI

        1. Inspect the cluster's SSO configuration:

        ```bash
        doctl kubernetes cluster get "<cluster-id>" --output json | jq '.[0].sso'
        ```

        A passing cluster returns an `sso` object with `"enabled": true`. A failing cluster returns `"enabled": false` or no `sso` object.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Kubernetes** and open the affected cluster.
            2. Go to **Settings** > **Single Sign-On**.
            3. Configure the OIDC identity provider issuer URL and client ID.
            4. Save. Plan a follow-up to enable **Require SSO for cluster access** once users are migrated.
        - id: cli
          desc: |
            To fix this on the command line using the `doctl` CLI, configure the OIDC identity provider and enable SSO on the cluster:

            ```bash
            doctl kubernetes cluster update "<cluster-id>" \
              --sso-issuer-url "<oidc-issuer-url>" \
              --sso-client-id "<client-id>" \
              --sso-enabled
            ```

            `<oidc-issuer-url>` is the issuer URL of the identity provider, and `<client-id>` is the ID of the OIDC client registered there for the cluster.
        - id: terraform
          desc: |
            To configure SSO in Terraform, add an `sso` block with `enabled = true` to the `digitalocean_kubernetes_cluster` resource. Set `issuer_url` to the identity provider's issuer URL and `client_id` to the OIDC client registered there for the cluster:

            ```hcl
            data "digitalocean_kubernetes_versions" "example" {
              version_prefix = "1.35."
            }

            resource "digitalocean_kubernetes_cluster" "example" {
              name    = "example"
              region  = "nyc3"
              version = data.digitalocean_kubernetes_versions.example.latest_version

              node_pool {
                name       = "default"
                size       = "s-1vcpu-2gb"
                node_count = 1
              }

              sso {
                enabled    = true
                issuer_url = "https://idp.example.com"
                client_id  = "example-client-id"
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/kubernetes/how-to/connect-to-cluster/
        title: How to Connect to a DigitalOcean Kubernetes Cluster

  # No Terraform variants yet: the digitalocean Terraform provider now exposes an
  # `sso` block on digitalocean_kubernetes_cluster, so variants can be added.
  - uid: mondoo-digitalocean-security-doks-sso-required
    filters: asset.platform == "digitalocean-kubernetes-cluster"
    title: Ensure DOKS clusters require SSO for cluster authentication
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      digitalocean.kubernetes.cluster.ssoRequired == true
    docs:
      desc: |
        This check verifies that every DOKS cluster requires Single Sign-On for cluster authentication.

        DOKS treats configuring SSO and requiring it as separate settings. When SSO is required, kubectl access must be authenticated through the OIDC identity provider and static kubeconfig tokens are no longer accepted. Enabling SSO without requiring it leaves those token paths active alongside it. The requirement is set on the cluster's settings in the DigitalOcean Cloud Control Panel.

        **Why this matters**

        Requiring SSO eliminates static kubeconfig tokens as a valid authentication path, so every user session is backed by a live identity-provider session that can be revoked. A token file copied to a second laptop, a CI system, or a personal backup stops being a working credential.

        That is what makes joiner, mover, and leaver processes effective for the cluster. Deprovisioning a user at the identity provider revokes their cluster access at the next kubectl session, closing the window in which a former employee or a compromised account retains access through a previously issued token, and doing so without separate kubeconfig rotation per cluster.

        Required SSO also makes MFA coverage complete rather than voluntary. The identity provider's policies apply to every authentication attempt against the cluster, not only to users who happen to choose the SSO flow. Even an exfiltrated kubeconfig token cannot be used, because the API server will not accept credentials the provider did not issue.

        Confirm that automation reaching the API server has a supported identity before enforcing the requirement, so CI systems and controllers are migrated rather than broken.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Kubernetes** and open each cluster.
        3. Go to **Settings** > **Single Sign-On** and check whether **Require SSO for cluster access** is enabled.

        A passing cluster shows **Require SSO for cluster access** as enabled. A failing cluster has SSO configured but the require toggle disabled, or has no SSO configured at all.

        ### Audit via CLI

        1. Inspect the cluster's SSO configuration:

        ```bash
        doctl kubernetes cluster get "<cluster-id>" --output json | jq '.[0].sso'
        ```

        A passing cluster returns an `sso` object with both `"enabled": true` and `"required": true`. A failing cluster returns `"required": false` or has no SSO configured.
      remediation:
        - id: console
          desc: |
            **Requiring SSO stops the cluster from accepting static kubeconfig tokens.** CI pipelines, controllers, and operators that authenticate with a downloaded kubeconfig lose access, so move them to an identity from the OIDC provider first.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Kubernetes** and open the affected cluster.
            2. Go to **Settings** > **Single Sign-On**.
            3. Configure the OIDC identity provider issuer URL and client ID if not already done.
            4. Enable **Require SSO for cluster access** so that token-based access is no longer permitted.
        - id: cli
          desc: |
            **Requiring SSO stops the cluster from accepting static kubeconfig tokens.** CI pipelines, controllers, and operators that authenticate with a downloaded kubeconfig lose access, so move them to an identity from the OIDC provider first.

            To fix this on the command line using the `doctl` CLI, enable SSO and mark it as required so the cluster rejects non-SSO authentication. `<oidc-issuer-url>` is the issuer URL of the identity provider, and `<client-id>` is the ID of the OIDC client registered there for the cluster:

            ```bash
            doctl kubernetes cluster update "<cluster-id>" \
              --sso-issuer-url "<oidc-issuer-url>" \
              --sso-client-id "<client-id>" \
              --sso-enabled \
              --sso-required
            ```
        - id: terraform
          desc: |
            **Requiring SSO stops the cluster from accepting static kubeconfig tokens.** CI pipelines, controllers, and operators that authenticate with a downloaded kubeconfig lose access, so move them to an identity from the OIDC provider first.

            To require SSO in Terraform, set both `enabled = true` and `required = true` in the `sso` block of the `digitalocean_kubernetes_cluster` resource. Set `issuer_url` to the identity provider's issuer URL and `client_id` to the OIDC client registered there for the cluster:

            ```hcl
            data "digitalocean_kubernetes_versions" "example" {
              version_prefix = "1.35."
            }

            resource "digitalocean_kubernetes_cluster" "example" {
              name    = "example"
              region  = "nyc3"
              version = data.digitalocean_kubernetes_versions.example.latest_version

              node_pool {
                name       = "default"
                size       = "s-1vcpu-2gb"
                node_count = 1
              }

              sso {
                enabled    = true
                required   = true
                issuer_url = "https://idp.example.com"
                client_id  = "example-client-id"
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/kubernetes/how-to/connect-to-cluster/
        title: How to Connect to a DigitalOcean Kubernetes Cluster

  - uid: mondoo-digitalocean-security-doks-in-vpc
    title: Ensure DOKS clusters are deployed inside a VPC
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-digitalocean-security-doks-in-vpc-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-doks-in-vpc-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-doks-in-vpc-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-doks-in-vpc-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every DOKS cluster is deployed inside a VPC.

        A DigitalOcean Kubernetes cluster is assigned a VPC at creation time. When none is chosen, the worker nodes communicate over the default network rather than an isolated private network boundary. The network is selected in the create flow and recorded as the cluster's VPC UUID.

        **Why this matters**

        A VPC gives the cluster's worker nodes a private network boundary that contains intra-cluster and node-to-resource traffic instead of routing it across the shared default network. Traffic that only ever needs to travel between nodes stays where it belongs.

        VPC membership also lets the cluster reach managed databases, Droplets, and load balancers in the same VPC over private IPs, which keeps that traffic off public addresses and removes any need to publish those services publicly just so the cluster can consume them.

        Containment matters most when a node is compromised. A node in a VPC-isolated cluster has a narrower reachable network than one on the default network, which limits how far an attacker who wins a container escape can pivot.

        This supplements Kubernetes network policies and cloud firewalls rather than replacing them, so a misconfiguration in one layer does not immediately expose the cluster's internal traffic. Because the network cannot be changed after creation, a cluster outside a VPC must be rebuilt inside one.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Kubernetes** and open each cluster.
        3. On the **Overview** tab, check the **VPC Network** assignment.

        A passing cluster shows a named VPC. A failing cluster shows no VPC or only the default network.

        ### Audit via CLI

        1. List all clusters and inspect each cluster's VPC UUID:

        ```bash
        doctl kubernetes cluster list --output json | jq -r '.[] | [.id, .name, .vpc_uuid] | @tsv'
        ```

        A passing cluster returns a non-empty `vpc_uuid`. A failing cluster returns an empty value.
      remediation:
        - id: console
          desc: |
            **This fix replaces the cluster.** DigitalOcean cannot move an existing DOKS cluster into a VPC network, so plan a cutover. Persistent volumes, load balancers, and in-cluster state do not move with the workloads and must be recreated or migrated.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Kubernetes** and create a new cluster.
            2. In the creation flow, select the target VPC under **VPC Network**.
            3. Redeploy workloads to the new cluster with `kubectl` or a GitOps pipeline and verify connectivity.
            4. Repoint ingress and DNS to the new cluster.
            5. Delete the original cluster, which keeps failing the check for as long as it exists.
        - id: cli
          desc: |
            **This fix replaces the cluster.** DigitalOcean cannot move an existing DOKS cluster into a VPC network, so plan a cutover. Persistent volumes, load balancers, and in-cluster state do not move with the workloads and must be recreated or migrated.

            To fix this on the command line using the `doctl` CLI:

            1. Create a replacement cluster inside the VPC network:

                ```bash
                doctl kubernetes cluster create <new-name> \
                  --region <region> \
                  --vpc-uuid <vpc-uuid> \
                  --node-pool "name=default;size=s-1vcpu-2gb;count=3"
                ```

                - `<vpc-uuid>` is the `ID` of a VPC network in `<region>` from `doctl vpcs list --format ID,Name,Region`. Setting it gives the new cluster the VPC membership the check requires.
                - Adjust the `--node-pool` size and count to match the original cluster's node pools.

            2. Redeploy workloads to the new cluster, verify them, and repoint ingress and DNS.
            3. Delete the original cluster, which keeps failing the check for as long as it exists:

                ```bash
                doctl kubernetes cluster delete <cluster-id>
                ```
        - id: terraform
          desc: |
            To deploy a DOKS cluster inside a VPC in Terraform, set `vpc_uuid` on the `digitalocean_kubernetes_cluster` resource:

            ```hcl
            data "digitalocean_kubernetes_versions" "example" {
              version_prefix = "1.35."
            }

            resource "digitalocean_kubernetes_cluster" "example" {
              name     = "example"
              region   = "nyc3"
              version  = data.digitalocean_kubernetes_versions.example.latest_version
              vpc_uuid = digitalocean_vpc.example.id

              node_pool {
                name       = "default"
                size       = "s-1vcpu-2gb"
                node_count = 3
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/vpc/
        title: DigitalOcean VPC overview

  - uid: mondoo-digitalocean-security-doks-in-vpc-digitalocean
