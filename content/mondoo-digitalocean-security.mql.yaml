  # No Terraform variants: the check inspects the validity window of the CA certificate the cluster currently advertises — runtime telemetry that has no analog in digitalocean_database_cluster HCL. Terraform expresses desired cluster configuration; the CA is managed and rotated by DigitalOcean and only exposed by the live API.
  - uid: mondoo-digitalocean-security-db-ca-certificate-not-expired
    filters: asset.platform == "digitalocean-database"
    title: Ensure managed database CA certificates are not expired
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      digitalocean.database {
        certificates(pem: caCertificate).all(notAfter > time.now)
      }
    docs:
      desc: |
        This check verifies that the CA certificate a managed database cluster advertises is still within its validity window.

        Clients verify a managed database's TLS endpoint by pinning to the CA certificate the cluster publishes. Once that certificate's validity window passes, every connection performing TLS verification fails at the handshake. The current CA is downloaded from the cluster's connection details in the DigitalOcean Cloud Control Panel.

        **Why this matters**

        An expired CA takes the cluster offline from the application's perspective even though the cluster itself is healthy, because every TLS-verifying client fails at the handshake at the same moment. The failure arrives as an outage, not as a warning.

        That is where the security damage happens. Operators under pressure to restore service frequently disable TLS verification rather than rotate the CA, which downgrades every subsequent connection to unauthenticated TLS that a man-in-the-middle can intercept. The temporary fix outlives the incident and quietly removes the control.

        The pinned CA is also the only signal that distinguishes a legitimate cluster endpoint from a replacement under an attacker's control, so an expired or revoked CA left in application configuration removes the basis for that distinction and the forensic record that depends on it.

        Managed database CA certificates are rotated by the platform on long cycles, which makes expiry easy to miss on an operator's calendar. Detecting it in advance leaves time to pull the updated CA and distribute it to every client before the current one lapses.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Databases** and open each cluster.
        3. On the **Overview** tab, locate the **CA Certificate** download and inspect the certificate's **Valid Until** field.

        A passing cluster shows a future **Valid Until** date. A failing cluster shows a date that has already passed.

        ### Audit via CLI

        1. List clusters:

        ```bash
        doctl databases list --format ID,Name,Engine
        ```

        2. Download each cluster's CA and inspect the validity window with `openssl`:

        ```bash
        doctl databases get-ca "<database-id>" --format Certificate --no-header \
          | openssl x509 -noout -enddate
        ```

        A passing cluster prints a `notAfter=` date in the future. A failing cluster prints a date in the past.
      remediation:
        - id: console
          desc: |
            The check reads the CA certificate the cluster itself publishes, and only DigitalOcean can issue a replacement. Distributing a certificate to clients keeps their connections working but does not change what the cluster publishes, so it does not clear the finding.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Open the cluster's **Overview** tab and click **Download CA Certificate** to retrieve the current `ca-certificate.crt`.
            2. Check its expiry with `openssl x509 -in ca-certificate.crt -noout -enddate`.
            3. If the date is still in the past, open a DigitalOcean support ticket from the cluster page and ask for the cluster CA to be reissued. The check passes once the cluster publishes the reissued certificate.
            4. Once a valid certificate is available, update every application configuration, Kubernetes secret, and CI pipeline that pins the old CA, then restart the connecting services so they load it.
        - id: cli
          desc: |
            The check reads the CA certificate the cluster itself publishes, and only DigitalOcean can issue a replacement. Distributing a certificate to clients keeps their connections working but does not change what the cluster publishes, so it does not clear the finding.

            To fix this on the command line using the `doctl` CLI:

            1. Download the certificate the cluster currently publishes. The command prints it PEM-encoded:

                ```bash
                doctl databases get-ca <database-id> --format Certificate --no-header > ca-certificate.crt
                ```

            2. Check its validity window:

                ```bash
                openssl x509 -in ca-certificate.crt -noout -enddate -subject
                ```

            3. If `notAfter` is still in the past, open a DigitalOcean support ticket for the cluster and ask for the CA to be reissued. `doctl` has no command that rotates it. The check passes once the cluster publishes the reissued certificate.
            4. Once a valid certificate is available, replace the certificate file in every client trust store, restart the connecting services, and confirm new connections succeed.
        # No Terraform remediation: the CA certificate is provisioned and rotated by DigitalOcean, not declared in digitalocean_database_cluster HCL. Terraform-managed clusters still pull the active CA via the runtime API; remediation is to refresh the trust store on consumers, which is a deployment-time concern outside Terraform.
    refs:
      - url: https://docs.digitalocean.com/products/databases/postgresql/how-to/secure/
        title: How to Secure PostgreSQL Managed Database Clusters

  # No Terraform variants: connectionSslEnabled reflects the SSL flag on the live
  # connection object returned by the DigitalOcean API, which the platform sets on
  # every managed cluster. digitalocean_database_cluster exposes no argument to enable
  # or disable TLS, so there is nothing to assert in HCL, plan, or state.
  - uid: mondoo-digitalocean-security-db-connection-ssl-enabled
    filters: asset.platform == "digitalocean-database"
    title: Ensure managed database connections enforce TLS/SSL
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      digitalocean.database.connectionSslEnabled
    docs:
      desc: |
        This check verifies that every managed database cluster advertises a connection endpoint with TLS enabled.

        The cluster's connection object reports whether its endpoint requires SSL. When it reports SSL disabled, the cluster accepts plaintext connections, and both the authentication exchange and the query payload cross the network unprotected. Connection details are shown on the cluster page in the DigitalOcean Cloud Control Panel and returned by `doctl databases connection`.

        **Why this matters**

        Database connections carry authentication material on every session. Without TLS, usernames and passwords traverse the network in cleartext and can be captured by any host on the path, which turns a single passive observer into a permanent credential holder.

        The payload is at least as valuable. Query results and writes often contain the most sensitive data an organization holds, so an unencrypted connection exposes that data to the same passive interception, continuously and without leaving a trace.

        TLS also binds the connection to the cluster's certificate, so an attacker cannot transparently proxy the connection or tamper with queries and responses in flight. An encrypted session yields only ciphertext to a network observer and detects modification if one is attempted.

        Frameworks that govern regulated data require encryption of sensitive information whenever it crosses a network boundary, and database traffic is a primary carrier of that data.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Databases** and open each cluster.
        3. On the **Overview** tab, inspect the **Connection Details** panel and confirm the connection string uses `sslmode=require` (PostgreSQL), `ssl-mode=REQUIRED` (MySQL), or the engine's equivalent TLS parameter.

        A passing cluster presents a TLS-enabled connection string. A failing cluster presents a connection string with SSL disabled.

        ### Audit via CLI

        1. List clusters, then inspect each cluster's connection details:

        ```bash
        doctl databases list --format ID,Name,Engine
        doctl databases connection <database-id> --format Host,Port,SSL
        ```

        A passing cluster reports `SSL` as `true`. A failing cluster reports `SSL` as `false`.
      remediation:
        - id: console
          desc: |
            The check reads the read-only SSL flag on the connection details DigitalOcean publishes for the cluster. No setting in the Cloud Control Panel changes that flag, and neither do client connection strings, so a cluster that reports SSL as disabled needs DigitalOcean to correct it:

            1. Open the cluster's **Overview** tab and confirm that the **Connection Details** show SSL disabled.
            2. Open a DigitalOcean support ticket from the cluster page and ask for TLS to be enabled on the cluster's connection endpoint. The check passes once the connection details report SSL as enabled.
            3. Until then, and afterward as defense in depth, make every client require TLS, for example `sslmode=require` for PostgreSQL or `ssl-mode=REQUIRED` for MySQL, and verify the server against the cluster's CA certificate.
        - id: cli
          desc: |
            The check reads the read-only SSL flag on the connection details DigitalOcean publishes for the cluster. No `doctl` command changes that flag, and neither do client connection strings, so a cluster that reports SSL as disabled needs DigitalOcean to correct it.

            1. Confirm the flag the cluster reports:

                ```bash
                doctl databases connection <database-id> --format Host,Port,User,SSL
                ```

            2. If `SSL` is `false`, open a DigitalOcean support ticket for the cluster and ask for TLS to be enabled on its connection endpoint. The check passes once the command above reports `true`.
            3. Until then, and afterward as defense in depth, make every client require TLS, such as `sslmode=require` in a PostgreSQL connection string, then restart the connecting services and confirm sessions negotiate TLS.
        # No Terraform remediation: TLS on managed database connections is enforced by the DigitalOcean platform and is not a declarable argument on digitalocean_database_cluster. Requiring TLS is a client-side connection-string concern that lives outside the cluster's Terraform definition.
    refs:
      - url: https://docs.digitalocean.com/products/databases/postgresql/how-to/secure/
        title: How to Secure PostgreSQL Managed Database Clusters

  - uid: mondoo-digitalocean-security-lb-http-redirected-to-https
    title: Ensure load balancers redirect HTTP traffic to HTTPS
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a load balancer accepting HTTP traffic redirects it to HTTPS.

        When a DigitalOcean load balancer has a forwarding rule with an HTTP entry protocol, the redirect setting decides whether clients are answered with a 301 to the HTTPS equivalent of their request or simply forwarded to the backend in plaintext. It appears as the redirect option on the load balancer's settings page in the DigitalOcean Cloud Control Panel and as `redirectHttpToHttps` on the load balancer object, or `redirect_http_to_https` in Terraform. A load balancer that forwards HTTP without redirecting it allows plaintext sessions end to end.

        **Why this matters**

        Plaintext HTTP exposes authentication tokens, session cookies, API keys, and form submissions to any host on the network path between the client and the load balancer. Everything the application treats as a secret is readable in transit, and the backend has no way to tell that it was.

        Without an enforced redirect, an attacker positioned on that path can also strip HTTPS by intercepting the initial HTTP request before the client ever gets the chance to upgrade, so the client never sees a certificate error and never learns the session was downgraded.

        A 301 is a permanent redirect, so it updates bookmarks and caches and moves clients to HTTPS for all future requests rather than only for the requests where they happened to type the HTTPS URL.

        Enabling the redirect at the load balancer ensures every active session uses TLS and enforces HTTPS for every backend behind it, regardless of whether individual application components implement the redirect themselves. Pair it with HSTS at the application so even the first request in a session avoids the plaintext round trip.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Load Balancers** and open each load balancer.
        3. Go to **Settings** > **Forwarding Rules**.
        4. Check whether **Redirect HTTP to HTTPS** is enabled.

        A passing load balancer either has no HTTP forwarding rule or has HTTP-to-HTTPS redirect enabled. A failing load balancer has an HTTP forwarding rule without the redirect enabled.

        ### Audit via CLI

        1. List all load balancers and inspect the `RedirectHttpToHttps` field:

        ```bash
        doctl compute load-balancer list --format ID,Name,RedirectHttpToHttps,ForwardingRules
        ```

        A passing load balancer returns `true` for `RedirectHttpToHttps` or has no HTTP forwarding rule. A failing load balancer returns `false` for `RedirectHttpToHttps` while an HTTP forwarding rule is present.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Load Balancers** and open the affected load balancer.
            2. Go to **Settings** > **Forwarding Rules**.
            3. Enable **Redirect HTTP to HTTPS**. Confirm that an HTTPS forwarding rule and TLS certificate are configured.
        - id: cli
          desc: |
            The load balancer passes once `redirect_http_to_https` is enabled, which answers every HTTP request with a redirect to HTTPS. It also passes if it has no HTTP forwarding rule at all.

            **`doctl compute load-balancer update` resets every setting you leave out.** The update replaces the whole load balancer configuration, so a flag you omit returns its setting to the default. That includes the HTTP-to-HTTPS redirect, the TLS cipher policy, and the firewall allow and deny lists, each of which another check depends on. The command has no flag for the HTTP idle timeout, so a custom idle timeout returns to its default and must be set again in the control panel. The control panel method changes the redirect without this risk.

            To fix this on the command line using the `doctl` CLI:

            1. Print the current settings. The first command prints most values in the syntax the update flags accept, and the JSON output adds the TLS cipher policy, proxy protocol, and backend keepalive settings:

                ```bash
                doctl compute load-balancer get <lb-id> \
                  --format Name,Region,SizeUnit,VPCUUID,Tag,DropletIDs,RedirectHttpToHttps,StickySessions,HealthCheck,ForwardingRules,Firewall
                doctl compute load-balancer get <lb-id> --output json
                ```

            2. Re-apply the configuration with the redirect enabled:

                ```bash
                doctl compute load-balancer update <lb-id> \
                  --name <name> \
                  --region <region> \
                  --size-unit <size-unit> \
                  --vpc-uuid <vpc-uuid> \
                  --forwarding-rules "<forwarding-rules>" \
                  --health-check "<health-check>" \
                  --sticky-sessions "<sticky-sessions>" \
                  --droplet-ids <droplet-ids> \
                  --tls-cipher-policy <tls-cipher-policy> \
                  --allow-list <allow-list> \
                  --redirect-http-to-https
                ```

                - Copy `<name>`, `<region>`, `<size-unit>`, `<vpc-uuid>`, `<forwarding-rules>`, `<health-check>`, and `<sticky-sessions>` from step 1. Quote values that contain spaces, since several forwarding rules are separated by spaces, and drop any of these flags whose value is empty.
                - `<droplet-ids>` is the `DropletIDs` value. If the load balancer targets a tag instead, replace `--droplet-ids` with `--tag-name <tag>`.
                - Add `--enable-proxy-protocol` or `--enable-backend-keepalive` if step 1 shows either enabled.
                - `<tls-cipher-policy>` is the JSON `tls_cipher_policy` value. Use `STRONG` to keep the cipher policy check passing.
                - `<allow-list>` is the comma-separated `allow` entries from the `Firewall` value, such as `cidr:203.0.113.0/24`. Drop `--allow-list` if the list is empty, and pass the `deny` entries the same way with `--deny-list`.
                - The redirect needs an HTTPS forwarding rule with a certificate to send clients to, so confirm one is present in `<forwarding-rules>`.
        - id: terraform
          desc: |
            To enforce the HTTP-to-HTTPS redirect in Terraform, set `redirect_http_to_https = true` on the `digitalocean_loadbalancer` resource alongside an HTTPS forwarding rule:

            ```hcl
            resource "digitalocean_loadbalancer" "example" {
              name                   = "example-lb"
              region                 = "nyc3"
              redirect_http_to_https = true

              forwarding_rule {
                entry_port       = 443
                entry_protocol   = "https"
                target_port      = 80
                target_protocol  = "http"
                certificate_name = digitalocean_certificate.example.name
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/load-balancers/how-to/ssl-termination/
        title: Load balancer SSL termination and redirect

  - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-digitalocean
    filters: asset.platform == "digitalocean-loadbalancer"
    mql: |
      digitalocean.loadBalancer {
        listeners.none(entryProtocol == "http") || redirectHttpToHttps == true
      }
  - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_loadbalancer")
    mql: |
      terraform.resources("digitalocean_loadbalancer").all(
        blocks.where(type == "forwarding_rule").none(arguments["entry_protocol"] == "http") ||
        arguments["redirect_http_to_https"] == true
      )
  - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_loadbalancer")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_loadbalancer").all(
        change.after["forwarding_rule"] == empty ||
        change.after["forwarding_rule"].none(_["entry_protocol"] == "http") ||
        change.after.redirect_http_to_https == true
      )
  - uid: mondoo-digitalocean-security-lb-http-redirected-to-https-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_loadbalancer")
    mql: |
      terraform.state.resources.where(type == "digitalocean_loadbalancer").all(
        values["forwarding_rule"] == empty ||
        values["forwarding_rule"].none(_["entry_protocol"] == "http") ||
        values.redirect_http_to_https == true
      )

  - uid: mondoo-digitalocean-security-lb-strong-tls-cipher-policy
    title: Ensure TLS load balancers enforce the strong TLS cipher policy
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-digitalocean-security-lb-strong-tls-cipher-policy-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-lb-strong-tls-cipher-policy-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-lb-strong-tls-cipher-policy-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-lb-strong-tls-cipher-policy-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a load balancer terminating TLS enforces the strong cipher policy.

        DigitalOcean load balancers offer two minimum TLS cipher policies. `DEFAULT` permits a broader, weaker set of protocol versions and cipher suites for backward compatibility; `STRONG` negotiates only TLS 1.2 and later with a restricted set of modern, forward-secret suites. The policy is chosen on the load balancer's settings page in the DigitalOcean Cloud Control Panel and set as `tls_cipher_policy` in the API. This check requires `STRONG` on any load balancer with an HTTPS or TLS entry protocol.

        **Why this matters**

        The strong policy removes cipher suites that lack forward secrecy or rely on weaker primitives. Without forward secrecy, traffic captured today can be decrypted later by an adversary who eventually obtains the server key, so a recording made now stays valuable to an attacker indefinitely.

        Restricting the negotiable protocol versions and cipher suites also narrows the room an attacker has to force a client onto a weaker connection than both ends could have agreed on, which is the mechanism behind protocol downgrade attacks.

        Pinning the policy keeps that posture stable as the client population changes over time, rather than letting a permissive default quietly negotiate weak suites for whichever clients ask for them.

        Frameworks that require strong cryptography for data in transit are satisfied by the restricted policy and not by the permissive default. Confirm that any legacy client which must reach the load balancer supports TLS 1.2 before switching, since the strong policy will refuse the ones that do not.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Load Balancers** and open each load balancer that has an HTTPS or TLS forwarding rule.
        3. Go to **Settings** and review the **TLS Cipher Policy** value.

        A passing load balancer terminating TLS shows the cipher policy set to **Strong**. A failing load balancer terminating TLS shows the **Default** cipher policy.

        ### Audit via CLI

        1. List load balancers and inspect the `tls_cipher_policy` field alongside the forwarding rules:

        ```bash
        doctl compute load-balancer list --output json | jq -r '.[] | [.id, .name, .tls_cipher_policy] | @tsv'
        ```

        A passing load balancer that terminates TLS returns `STRONG`. A failing load balancer that terminates TLS returns `DEFAULT` or an empty value.
      remediation:
        - id: console
          desc: |
            To enforce the strong cipher policy in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Load Balancers** and open the affected load balancer.
            2. Go to **Settings** and set the **TLS Cipher Policy** to **Strong**.
            3. Confirm that clients still negotiate successfully, since the strong policy drops TLS 1.1 and older and legacy ciphers.
        - id: cli
          desc: |
            The load balancer passes once `tls_cipher_policy` is `STRONG`, which limits TLS termination to TLS 1.2 and later with modern cipher suites. It also passes if it has no HTTPS or TLS forwarding rule.

            **Clients that only support TLS 1.1 or older can no longer connect.** Confirm that every client supports TLS 1.2 before switching.

            **`doctl compute load-balancer update` resets every setting you leave out.** The update replaces the whole load balancer configuration, so a flag you omit returns its setting to the default. That includes the HTTP-to-HTTPS redirect, the TLS cipher policy, and the firewall allow and deny lists, each of which another check depends on. The command has no flag for the HTTP idle timeout, so a custom idle timeout returns to its default and must be set again in the control panel. The control panel method changes the cipher policy without this risk.

            To fix this on the command line using the `doctl` CLI:

            1. Print the current settings. The first command prints most values in the syntax the update flags accept, and the JSON output adds the TLS cipher policy, proxy protocol, and backend keepalive settings:

                ```bash
                doctl compute load-balancer get <lb-id> \
                  --format Name,Region,SizeUnit,VPCUUID,Tag,DropletIDs,RedirectHttpToHttps,StickySessions,HealthCheck,ForwardingRules,Firewall
                doctl compute load-balancer get <lb-id> --output json
                ```

            2. Re-apply the configuration with the strong cipher policy:

                ```bash
                doctl compute load-balancer update <lb-id> \
                  --name <name> \
                  --region <region> \
                  --size-unit <size-unit> \
                  --vpc-uuid <vpc-uuid> \
                  --forwarding-rules "<forwarding-rules>" \
                  --health-check "<health-check>" \
                  --sticky-sessions "<sticky-sessions>" \
                  --droplet-ids <droplet-ids> \
                  --redirect-http-to-https \
                  --allow-list <allow-list> \
                  --tls-cipher-policy STRONG
                ```

                - Copy `<name>`, `<region>`, `<size-unit>`, `<vpc-uuid>`, `<forwarding-rules>`, `<health-check>`, and `<sticky-sessions>` from step 1. Quote values that contain spaces, since several forwarding rules are separated by spaces, and drop any of these flags whose value is empty.
                - `<droplet-ids>` is the `DropletIDs` value. If the load balancer targets a tag instead, replace `--droplet-ids` with `--tag-name <tag>`.
                - Add `--enable-proxy-protocol` or `--enable-backend-keepalive` if step 1 shows either enabled.
                - Keep `--redirect-http-to-https` only if `RedirectHttpToHttps` is `true` in step 1. Leaving it out turns the redirect off.
                - `<allow-list>` is the comma-separated `allow` entries from the `Firewall` value, such as `cidr:203.0.113.0/24`. Drop `--allow-list` if the list is empty, and pass the `deny` entries the same way with `--deny-list`.
        - id: terraform
          desc: |
            To enforce the strong cipher policy in Terraform, set `tls_cipher_policy = "STRONG"` on the `digitalocean_loadbalancer` resource that terminates TLS:

            ```hcl
            resource "digitalocean_loadbalancer" "example" {
              name              = "example-lb"
              region            = "nyc3"
              tls_cipher_policy = "STRONG"

              forwarding_rule {
                entry_port       = 443
                entry_protocol   = "https"
                target_port      = 80
                target_protocol  = "http"
                certificate_name = digitalocean_certificate.example.name
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/load-balancers/how-to/ssl-termination/
        title: Load balancer SSL termination

