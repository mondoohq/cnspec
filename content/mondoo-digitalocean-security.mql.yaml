  # No Terraform variants: the DigitalOcean Terraform provider's `digitalocean_spaces_bucket.acl` argument exposes only `"private"` and `"public-read"` — the S3-compatible `public-read-write` ACL must be applied through the runtime S3 API, so there is no HCL surface to inspect for it. The runtime variant catches buckets where it was set out of band.
  - uid: mondoo-digitalocean-security-spaces-bucket-not-publicly-writable
    filters: asset.platform == "digitalocean-spaces-bucket"
    title: Ensure Spaces buckets do not grant anonymous write access
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      digitalocean.spacesBucket.publicWriteAcl == false
    docs:
      desc: |
        This check verifies that no Spaces bucket grants anonymous write access.

        An ACL granting the `WRITE` permission to the `AllUsers` group, expressed as the `public-read-write` canned ACL, lets any unauthenticated caller upload, overwrite, or delete objects in the bucket. The ACL is set on the bucket's settings in the DigitalOcean Cloud Control Panel or through the S3-compatible API.

        **Why this matters**

        Writable buckets are routinely abused to stage phishing pages, malware downloads, and command-and-control payloads under a legitimate-looking domain that the owner's customers and security tools may already trust. The bucket becomes free hosting and a laundering point for someone else's campaign.

        An attacker who can write the bucket can also overwrite what is already there. Configuration files, JavaScript bundles, and signed artifacts can be replaced with modified versions served to every consumer, which turns the bucket into a supply-chain foothold rather than an unwanted upload target.

        Anonymous writes accumulate storage and bandwidth charges billed to the bucket owner, and high-volume abuse can push the account against its service quotas, so the incident has a direct cost even before anything malicious is served.

        Unlike `public-read`, which at least supports legitimate static-hosting patterns, `public-read-write` has no defensible reason to exist on a production bucket; its presence is almost always a misconfiguration. Removing the anonymous `WRITE` grant forces every upload through Spaces access keys and restores accountability, and where third parties must upload content the workflow should be gated through short-lived pre-signed PUT URLs issued by application code.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Open the affected bucket under **Spaces Object Storage**.
        3. Inspect the **Settings** tab and review any bucket policy attached to the bucket for a statement granting `s3:PutObject` to `Principal: "*"`.

        A passing bucket has no bucket policy or no policy statement granting write to anonymous callers. A failing bucket grants `s3:PutObject` (or equivalent) to `*`.

        ### Audit via CLI

        1. Retrieve the bucket ACL and policy with the S3-compatible API:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-acl --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns no grant with `Grantee.URI = http://acs.amazonaws.com/groups/global/AllUsers` and `Permission` in (`WRITE`, `WRITE_ACP`, `FULL_CONTROL`). A failing bucket returns at least one such grant.
      remediation:
        - id: console
          desc: |
            The check reads the bucket ACL and passes once it grants no `WRITE` permission to the `AllUsers` group. The Cloud Control Panel has no setting for a `WRITE` grant or for bucket policies, so reset the ACL with the S3-compatible API shown in the CLI remediation.

            If the bucket genuinely needs third-party uploads, issue pre-signed `PUT` URLs from application code instead of granting anonymous write access.
        - id: cli
          desc: |
            The check reads the bucket ACL and passes once it grants no `WRITE` permission to the `AllUsers` group. Setting the canned `private` ACL removes every group grant. `<spaces-key>` and `<spaces-secret>` are a Spaces access key pair from the **Spaces Keys** page, and `<region>` is the Spaces region slug such as `nyc3`.

            To remove anonymous write access using the S3-compatible API:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-bucket-acl --bucket <bucket> --acl private \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```

            A bucket policy that grants writes to `*` also allows anonymous uploads, although this check does not read it. If the bucket needs no policy, delete it.

            **This deletes every statement in the policy**, including any that other applications rely on. To keep the rest, re-apply the policy without the wildcard statements with `aws s3api put-bucket-policy` instead:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api delete-bucket-policy --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```
        # No Terraform remediation: the DigitalOcean Terraform provider's `digitalocean_spaces_bucket.acl` argument accepts only `"private"` and `"public-read"`. Anonymous writes are configured through the runtime S3 API (`PutBucketPolicy` granting `s3:PutObject` to `Principal: "*"`), which has no Terraform analog.
    refs:
      - url: https://docs.digitalocean.com/products/spaces/how-to/manage-access/
        title: Manage Spaces bucket access

  # No Terraform variants: the DigitalOcean Terraform provider's `digitalocean_spaces_bucket` resource does not expose server-side encryption configuration. SSE is configured through the runtime S3-compatible `PutBucketEncryption` call, which Terraform does not currently model.
  - uid: mondoo-digitalocean-security-spaces-bucket-encryption-enabled
    filters: asset.platform == "digitalocean-spaces-bucket"
    title: Ensure Spaces buckets have server-side encryption enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      digitalocean.spacesBucket.encryptionEnabled
    docs:
      desc: |
        This check verifies that every Spaces bucket has a default server-side encryption configuration.

        When default encryption is configured on a bucket, the platform encrypts every object written to it at rest, without the client having to request encryption on each call. The configuration is applied to the bucket through the S3-compatible API.

        **Why this matters**

        Without a default, encryption depends on every caller remembering the per-request encryption header on every `PutObject`. One client that forgets, or one script written before the convention existed, leaves sensitive data sitting on disk in plaintext, and nothing in the write path objects.

        Derived objects make this worse. Objects produced by lifecycle transitions, replication, and multipart uploads inherit the bucket default, so without one configured those objects also land unencrypted even when the original write was handled correctly.

        Encryption at rest is the last line of defense if access controls fail and an attacker reaches the underlying storage media or a backup of it. With a bucket default in place, a future media exposure does not automatically become a content exposure.

        Frameworks that mandate encryption at rest expect a single platform-enforced control rather than a per-call discipline that depends on developer behavior, and centralizing the decision at the bucket removes the configuration burden from every client SDK and CI pipeline.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Open the affected bucket under **Spaces Object Storage**.
        3. Inspect the **Settings** tab for the **Default Encryption** section.

        A passing bucket shows **AES-256** (or a configured KMS algorithm). A failing bucket shows **Not configured**.

        ### Audit via CLI

        1. Use the S3-compatible API to query the bucket's encryption configuration:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-encryption --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns a `ServerSideEncryptionConfiguration` document. A failing bucket returns `ServerSideEncryptionConfigurationNotFoundError`.
      remediation:
        - id: console
          desc: |
            Spaces does not expose default-encryption configuration in the Cloud Control Panel for every region. Apply the configuration with the CLI or S3-compatible API instead; see the CLI remediation below.
        - id: cli
          desc: |
            Spaces is S3-compatible, so use the AWS CLI pointed at the Spaces endpoint. The `<spaces-key>` and `<spaces-secret>` come from the **Spaces Keys** page in the API section of the control panel, not the DigitalOcean API token, and `<region>` is the Spaces region slug such as `nyc3`.

            Apply a bucket-level default encryption configuration with the S3-compatible API:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-bucket-encryption \
                --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com \
                --server-side-encryption-configuration '{
                  "Rules": [{
                    "ApplyServerSideEncryptionByDefault": { "SSEAlgorithm": "AES256" }
                  }]
                }'
            ```

            Re-encrypt existing objects so they pick up the new default:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3 cp s3://<bucket>/ s3://<bucket>/ \
                --recursive --sse AES256 \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```
        # No Terraform remediation: the digitalocean_spaces_bucket resource has no server_side_encryption_configuration argument; Spaces SSE must be applied at runtime via the S3-compatible PutBucketEncryption call.
    refs:
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

  # No Terraform variants: the DigitalOcean Terraform provider's digitalocean_spaces_bucket
  # resource exposes only the acl argument ("private"/"public-read") and models no
  # public-access-block configuration. The block-public-acls/block-public-policy/
  # ignore-public-acls/restrict-public-buckets settings are applied through the runtime
  # S3-compatible PutPublicAccessBlock call, so there is no HCL surface to inspect.
  - uid: mondoo-digitalocean-security-spaces-bucket-public-access-blocked
    filters: asset.platform == "digitalocean-spaces-bucket"
    title: Ensure Spaces buckets enable the Public Access Block
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      digitalocean.spacesBucket.publicAccessBlocked
    docs:
      desc: |
        This check verifies that every Spaces bucket has the Public Access Block fully enabled.

        The Public Access Block is a bucket-level guardrail with four parts: it blocks public ACLs, blocks public bucket policies, ignores any public ACLs already present, and restricts public bucket policies. With all four in force, no ACL or bucket policy can grant public access regardless of how it is written. A bucket has no Public Access Block by default, so a single misconfigured ACL or policy can expose its contents to the entire internet. The guardrail is applied to the bucket through the S3-compatible API.

        **Why this matters**

        The block overrides any public grant, so a developer mistake in an ACL or a policy cannot silently make objects world-readable or world-writable. It converts a whole class of misconfiguration from an exposure into a no-op.

        It also replaces continuous review with a single enforceable control. Rather than auditing every ACL and every policy statement for public principals, one bucket-level guardrail makes public access structurally impossible, which shrinks the surface an auditor must keep verifying.

        Public grants get reintroduced over time by automation, third-party tools, and console changes, and the block neutralizes all of them until it is explicitly removed. That removal is a visible, auditable act, unlike the quiet drift it prevents.

        Publicly readable object storage is one of the most common sources of large-scale data leaks, and a writable bucket lets attackers stage malware or ransom the contents, so this guardrail is worth enabling on every bucket that is not deliberately serving public content.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Open the affected bucket under **Spaces Object Storage** and review the **Settings** tab for any public access indicators on the ACL and policy sections.
        3. Because the Cloud Control Panel does not surface the Public Access Block state directly, confirm the configuration with the S3-compatible API in the CLI step below.

        A passing bucket has all four block settings enabled. A failing bucket has one or more of them disabled or no configuration at all.

        ### Audit via CLI

        1. Spaces is S3-compatible, so use the AWS CLI pointed at the Spaces endpoint to read the bucket's Public Access Block:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-public-access-block --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns a `PublicAccessBlockConfiguration` with `BlockPublicAcls`, `BlockPublicPolicy`, `IgnorePublicAcls`, and `RestrictPublicBuckets` all `true`. A failing bucket returns `NoSuchPublicAccessBlockConfiguration` or a configuration with any of these set to `false`.
      remediation:
        - id: console
          desc: |
            The Cloud Control Panel does not expose the Public Access Block for every region. Apply the configuration with the CLI or S3-compatible API instead; see the CLI remediation below.
        - id: cli
          desc: |
            Spaces is S3-compatible, so use the AWS CLI pointed at the Spaces endpoint. The `<spaces-key>` and `<spaces-secret>` come from the **Spaces Keys** page in the API section of the control panel, not the DigitalOcean API token, and `<region>` is the Spaces region slug such as `nyc3`.

            Enable all four Public Access Block settings on the bucket:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-public-access-block \
                --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com \
                --public-access-block-configuration \
                  BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            ```

            Confirm the guardrail is in place:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api get-public-access-block --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```
        # No Terraform remediation: the digitalocean_spaces_bucket resource has no public-access-block argument; the block-public-acls/block-public-policy/ignore-public-acls/restrict-public-buckets guardrail must be applied at runtime via the S3-compatible PutPublicAccessBlock call.
    refs:
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

  - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled
    title: Ensure Spaces buckets have object versioning enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-13
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Spaces bucket has object versioning enabled.

        Versioning preserves every revision of an object rather than replacing it, and a deletion becomes a delete marker over the retained versions instead of destroying them. Accidental overwrites and ransomware-style mass deletes can then be reversed by reading the prior version. Versioning is turned on in the bucket's settings in the DigitalOcean Cloud Control Panel or through the S3-compatible API.

        **Why this matters**

        A misconfigured deployment that pushes an empty file to the wrong key still leaves the previous version recoverable, which turns what would be a data-loss incident into a rollback. Single-object recovery becomes a `GET` of the prior version rather than a restore from external backups.

        Versioning also slows credential abuse. An attacker who obtains Spaces credentials and re-encrypts the contents of a bucket cannot remove the prior versions with a simple `DELETE`; they are forced to issue per-version deletes, which takes longer, slows exfiltration, and leaves substantially more forensic evidence behind. The operator can roll forward to the prior versions while the leaked key is rotated.

        The version history is additionally a tamper-resistant record of every change to an object, which downstream compliance evidence and incident response both rely on.

        Cross-region replication and certain lifecycle transitions on S3-compatible storage require versioning to be enabled, so turning it on early avoids re-architecting later. Pair it with a lifecycle rule that expires noncurrent versions so the retained history does not grow without bound.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Open the affected bucket under **Spaces Object Storage**.
        3. Inspect the **Settings** tab for the **Versioning** section.

        A passing bucket shows **Enabled**. A failing bucket shows **Disabled** or **Suspended**.

        ### Audit via CLI

        1. Query the bucket's versioning state via the S3-compatible API:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-versioning --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns `"Status": "Enabled"`. A failing bucket returns no status, `"Suspended"`, or an empty response.
      remediation:
        - id: console
          desc: |
            The Cloud Control Panel shows whether versioning is enabled but cannot change it, so enable versioning with the S3-compatible API shown in the CLI remediation. The bucket passes once its **Object Versioning** section on the **Settings** tab shows **Enabled**.

            Pair versioning with a lifecycle rule that expires noncurrent versions after a defined retention window so the bucket does not grow unbounded.
        - id: cli
          desc: |
            Spaces is S3-compatible, so use the AWS CLI pointed at the Spaces endpoint. The `<spaces-key>` and `<spaces-secret>` come from the **Spaces Keys** page in the API section of the control panel, not the DigitalOcean API token, and `<region>` is the Spaces region slug such as `nyc3`.

            To enable versioning using the S3-compatible API:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-bucket-versioning --bucket <bucket> \
                --versioning-configuration Status=Enabled \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```

            Verify the new state:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api get-bucket-versioning --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```
        - id: terraform
          desc: |
            To enable versioning with Terraform, declare a `versioning` block on `digitalocean_spaces_bucket` with `enabled = true`:

            ```hcl
            resource "digitalocean_spaces_bucket" "example" {
              name   = "example-bucket"
              region = "nyc3"
              acl    = "private"

              versioning {
                enabled = true
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/spaces/how-to/enable-versioning/
        title: Enable Spaces bucket versioning
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

  - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-digitalocean
    filters: asset.platform == "digitalocean-spaces-bucket"
    mql: |
      digitalocean.spacesBucket.versioningStatus == "Enabled"
  - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_spaces_bucket")
    mql: |
      terraform.resources("digitalocean_spaces_bucket").all(blocks.where(type == "versioning").any(arguments.enabled == true))
  - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_spaces_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_spaces_bucket").all(change.after["versioning"] != null && change.after["versioning"].any(_["enabled"] == true))
  - uid: mondoo-digitalocean-security-spaces-bucket-versioning-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_spaces_bucket")
    mql: |
      terraform.state.resources.where(type == "digitalocean_spaces_bucket").all(values["versioning"] != null && values["versioning"].any(_["enabled"] == true))

  # No Terraform variants: the AuthenticatedUsers ACL grant is applied through the
  # S3-compatible API; the digitalocean_spaces_bucket.acl argument exposes only
  # "private" and "public-read", so there is no HCL surface for the authenticated-read
  # grant. The runtime variant catches buckets where it was set out of band.
  - uid: mondoo-digitalocean-security-spaces-bucket-not-authenticated-readable
    title: Ensure Spaces buckets do not grant read access to all authenticated users
    impact: 80
    filters: asset.platform == "digitalocean-spaces-bucket"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      digitalocean.spacesBucket.authenticatedReadAcl == false
    docs:
      desc: |
        This check verifies that no Spaces bucket grants read access to the `AuthenticatedUsers` group.

        In the S3-compatible ACL model that Spaces implements, `AuthenticatedUsers` is not limited to the bucket owner's account. It is satisfied by any authenticated S3-compatible principal, including any DigitalOcean or AWS account on the internet. A bucket carrying the `authenticated-read` grant is therefore listable and readable by anyone willing to authenticate at all. The ACL is set on the bucket's settings in the DigitalOcean Cloud Control Panel or through the S3-compatible API.

        **Why this matters**

        Because any valid S3-compatible credential satisfies the group, an `authenticated-read` grant exposes object listings and contents to essentially the entire authenticated internet rather than to a trusted subset. Creating an account is not a barrier.

        The label is what makes this dangerous. Operators read `authenticated-read` as meaning only their own account, when it means any authenticated account, so the setting survives review by looking like the restrictive option it is named after.

        The practical result is the same exposure class as a fully public bucket, applied to the logs, backups, and uploads that accumulate in it, but harder to spot because neither the ACL name nor a casual console glance suggests anything is open.

        Removing the `READ` grant restores access to the bucket owner and explicitly granted principals only, forcing all other retrieval through scoped Spaces access keys or pre-signed URLs, and it makes any future grant an explicit, auditable decision rather than a label that hides cross-account reach.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Spaces Object Storage** and open each bucket.
        3. Spaces does not surface the `AuthenticatedUsers` ACL grant in the panel; inspect it with the S3-compatible API in the CLI step below.

        ### Audit via CLI

        1. Retrieve the bucket ACL with the S3-compatible API and look for an `AuthenticatedUsers` grantee:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api list-buckets \
            --endpoint-url https://<region>.digitaloceanspaces.com \
            --query 'Buckets[].Name' --output text

        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-acl --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns grants only to the bucket owner. A failing bucket returns a grant where `Grantee.URI` is `http://acs.amazonaws.com/groups/global/AuthenticatedUsers` and `Permission` is `READ` or `FULL_CONTROL`.
      remediation:
        - id: console
          desc: |
            Spaces does not expose the `AuthenticatedUsers` grant in the Cloud Control Panel; reset the ACL to private with the S3-compatible API shown in the CLI remediation below, then confirm the bucket no longer carries the grant.
        - id: cli
          desc: |
            DigitalOcean Spaces is S3-compatible, so manage its ACLs with the AWS CLI pointed at the Spaces endpoint. The `<spaces-key>` and `<spaces-secret>` come from the **Spaces Keys** page in the API section of the control panel, not the DigitalOcean API token, and `<region>` is the Spaces region slug such as `nyc3`.

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-bucket-acl --bucket <bucket> --acl private \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```

            If specific accounts genuinely need access, grant them individually with `--grant-read id=<canonical-id>` rather than re-applying the `authenticated-read` group grant.
        # No Terraform remediation: the digitalocean_spaces_bucket.acl argument accepts only "private" and "public-read"; the authenticated-read group grant is applied through the runtime S3 API and has no Terraform analog.
    refs:
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

  # No Terraform variants: a bucket policy is declared in a separate
  # digitalocean_spaces_bucket_policy resource whose `policy` is a free-form JSON
  # document keyed to the bucket by name, so asserting "no policy grants public access"
  # requires parsing that JSON and correlating it back to each bucket — awkward to do
  # reliably in MQL on Terraform sources. The runtime variant inspects the resolved
  # policy document directly.
  - uid: mondoo-digitalocean-security-spaces-bucket-policy-not-public
    title: Ensure Spaces bucket policies do not grant public access
    impact: 90
    filters: asset.platform == "digitalocean-spaces-bucket"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      digitalocean.spacesBucket.hasWildcardPolicy == false
    docs:
      desc: |
        This check verifies that no Spaces bucket policy grants access to the anonymous wildcard principal.

        A bucket policy is a JSON document evaluated independently of the bucket ACL. An `Allow` statement whose `Principal` is the wildcard `"*"` grants unauthenticated access to every caller, even when the ACL on the same bucket is private. This is the bucket-policy counterpart to the ACL-based public-read and public-write checks. The policy is set on the bucket through the S3-compatible API.

        **Why this matters**

        Access to a Spaces bucket comes from both the ACL and the bucket policy, so a wildcard-principal statement opens the bucket to anyone regardless of how restrictive the ACL is. Tightening the ACL alone does not close it.

        Policy statements typically grant `s3:GetObject`, `s3:ListBucket`, or `s3:*`. With `Principal: "*"` those actions become available to the entire internet without credentials, and in the case of `s3:*` that includes writing and deleting as well as reading.

        This is easy to overlook precisely because the policy is a separate document from the ACL. A bucket whose ACL review came back clean can still be fully public through its policy, leaving a gap that an ACL-only audit never sees.

        Replace `"*"` with the specific account or Spaces-key principals that need access, and audit the policy alongside the ACL so the two are never reviewed in isolation. Enabling the Public Access Block additionally neutralizes a public policy if one is reintroduced.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Open the affected bucket under **Spaces Object Storage**.
        3. On the **Settings** tab, review any attached bucket policy for a statement whose `Principal` is `"*"` with `Effect: "Allow"`.

        A passing bucket has no policy, or no `Allow` statement with a `"*"` principal. A failing bucket has an `Allow` statement granting access to `"*"`.

        ### Audit via CLI

        1. Retrieve the bucket policy with the S3-compatible API and inspect its statements:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-policy --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com \
          | jq -r '.Policy | fromjson | .Statement[] | [.Effect, (.Principal|tostring)] | @tsv'
        ```

        A passing bucket returns `NoSuchBucketPolicy` or no `Allow` statement with a `"*"` principal. A failing bucket returns an `Allow` statement whose principal is `"*"`.
      remediation:
        - id: console
          desc: |
            Spaces bucket policies can only be viewed and changed through the S3-compatible API, not the Cloud Control Panel. Use the CLI remediation to remove the wildcard statement, then confirm the result with `aws s3api get-bucket-policy`.
        - id: cli
          desc: |
            DigitalOcean Spaces is S3-compatible, so manage its policy with the AWS CLI pointed at the Spaces endpoint. The `<spaces-key>` and `<spaces-secret>` come from the **Spaces Keys** page in the API section of the control panel, not the DigitalOcean API token, and `<region>` is the Spaces region slug such as `nyc3`.

            The bucket passes once no `Allow` statement in its policy names the wildcard `*` principal.

            **Removing a wildcard statement cuts off every anonymous client that relied on it**, such as public downloads or a static site served straight from the bucket. Move that content behind a CDN endpoint or pre-signed URLs first.

            If the bucket does not need a policy at all, delete it. This removes every statement, including ones that do not use the wildcard:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api delete-bucket-policy --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```

            To keep the other statements, print the policy, save a copy to `scoped-policy.json` with every `Allow` statement whose `Principal` is `"*"` removed, and re-apply it:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api get-bucket-policy --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com \
                --query Policy --output text
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-bucket-policy --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com \
                --policy file://scoped-policy.json
            ```
        # No Terraform remediation: the bucket policy lives in a separate digitalocean_spaces_bucket_policy resource holding a free-form JSON document; an HCL snippet cannot assert that an arbitrary bucket's policy omits a wildcard principal.
    refs:
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

  # No Terraform variants: MFA delete is enabled through the S3-compatible
  # PutBucketVersioning call with an MFA serial and code; the digitalocean_spaces_bucket
  # resource has no argument for it, so there is no HCL surface to inspect.
  - uid: mondoo-digitalocean-security-spaces-bucket-mfa-delete-enabled
    title: Ensure Spaces buckets require MFA to delete object versions
    impact: 50
    filters: asset.platform == "digitalocean-spaces-bucket"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-13
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      digitalocean.spacesBucket.mfaDeleteEnabled == true
    docs:
      desc: |
        This check verifies that every Spaces bucket requires multi-factor authentication to delete object versions.

        MFA delete hardens a versioned bucket so that permanently removing an object version, or suspending versioning altogether, requires a second factor in addition to the access key. It is configured on the bucket's versioning settings through the S3-compatible API.

        **Why this matters**

        Object versioning preserves prior revisions, but on its own it only slows an attacker down: a single compromised key can still issue per-version deletes until nothing is left. MFA delete forces a second factor before any version is permanently removed, which is the difference between slowing the destruction and preventing it.

        That closes the path by which an attacker with stolen credentials destroys the recovery copies before exfiltration or extortion. With MFA delete enabled, the version history remains available for recovery even after a write-capable key is compromised, and the same protection applies to a destructive insider.

        It also protects the controls themselves. Suspending versioning is a version-level operation, so MFA delete prevents the guarantees that make the bucket recoverable from being silently undone with key access alone.

        Requiring a second factor means destructive operations demand interactive, authenticated action rather than an automated API call, so confirm that no pipeline depends on programmatic version deletion before enabling it.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Spaces does not surface MFA delete state in the panel; inspect it with the S3-compatible API in the CLI step below.

        ### Audit via CLI

        1. Query the bucket's versioning configuration, which reports the MFA delete state:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-versioning --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns `"MFADelete": "Enabled"`. A failing bucket returns `"MFADelete": "Disabled"` or omits the field.
      remediation:
        - id: console
          desc: |
            MFA delete cannot be configured from the Cloud Control Panel; it is set through the S3-compatible API using the root account's MFA device, as shown in the CLI remediation below.
        - id: cli
          desc: |
            MFA delete is enabled through the S3-compatible `PutBucketVersioning` call and requires the serial number of the account's MFA device together with the current code. The `<spaces-key>` and `<spaces-secret>` come from the **Spaces Keys** page, and `<region>` is the Spaces region slug such as `nyc3`.

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-bucket-versioning --bucket <bucket> \
                --versioning-configuration Status=Enabled,MFADelete=Enabled \
                --mfa "<mfa-serial> <mfa-code>" \
                --endpoint-url https://<region>.digitaloceanspaces.com
            ```

            Versioning must be enabled for MFA delete to apply. Verify the new state with `aws s3api get-bucket-versioning`.
        # No Terraform remediation: MFA delete requires an interactive MFA serial and code on the PutBucketVersioning call; the digitalocean_spaces_bucket resource models no such argument, so there is no Terraform analog.
    refs:
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

  - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin
    title: Ensure Spaces bucket CORS rules do not allow all origins
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Spaces bucket allows all origins in its CORS rules.

        A CORS rule tells the browser which web origins may issue cross-origin requests against the bucket and read the responses. An allowed-origins list containing the wildcard `"*"` grants that permission to every website. CORS rules are configured on the bucket's settings in the DigitalOcean Cloud Control Panel or through the S3-compatible API, and each rule's allowed origins should name specific scheme-and-host front ends.

        **Why this matters**

        A `"*"` allowed origin permits scripts on any site to read responses from the bucket in a visitor's browser context. Objects intended only for one application's front end become readable by any page the user happens to have open, weakening exactly the same-origin protections that normally isolate web applications from each other.

        Combined with permissive methods, a wildcard origin also broadens the set of sites that can drive credentialed browser requests against the bucket on a visitor's behalf, expanding the surface for cross-site abuse rather than merely widening read access.

        Wildcard origins are frequently copied from quick-start examples and left in place, so the bucket ends up granting far wider browser access than the single front-end domain it actually serves, without anyone having decided to.

        Restrict allowed origins to the specific front ends that need browser access, and pair that narrow list with only the methods and headers those front ends require.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Open the affected bucket under **Spaces Object Storage**.
        3. On the **Settings** tab, review the **CORS Configurations** and check whether any rule's **Origin** is `*`.

        A passing bucket has no CORS rule with a `*` origin. A failing bucket has at least one CORS rule whose allowed origin is `*`.

        ### Audit via CLI

        1. Retrieve the bucket CORS configuration with the S3-compatible API:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-cors --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns no rule with `"AllowedOrigins": ["*"]`. A failing bucket returns at least one rule whose `AllowedOrigins` contains `*`.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Open the bucket under **Spaces Object Storage** and go to the **Settings** tab.
            2. Edit each CORS configuration whose **Origin** is `*` and replace it with the specific scheme-and-host origins that need browser access, for example `https://app.example.com`.
            3. Save the configuration.
        - id: cli
          desc: |
            DigitalOcean Spaces is S3-compatible, so manage CORS with the AWS CLI pointed at the Spaces endpoint. The `<spaces-key>` and `<spaces-secret>` come from the **Spaces Keys** page, and `<region>` is the Spaces region slug such as `nyc3`. Re-apply the CORS configuration with explicit origins instead of `*`:

            ```bash
            AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
              aws s3api put-bucket-cors --bucket <bucket> \
                --endpoint-url https://<region>.digitaloceanspaces.com \
                --cors-configuration '{
                  "CORSRules": [{
                    "AllowedOrigins": ["https://app.example.com"],
                    "AllowedMethods": ["GET"],
                    "AllowedHeaders": ["*"]
                  }]
                }'
            ```
        - id: terraform
          desc: |
            To scope CORS in Terraform, set `allowed_origins` on each `cors_rule` block of `digitalocean_spaces_bucket` to specific origins instead of `*`:

            ```hcl
            resource "digitalocean_spaces_bucket" "example" {
              name   = "example-bucket"
              region = "nyc3"
              acl    = "private"

              cors_rule {
                allowed_origins = ["https://app.example.com"]
                allowed_methods = ["GET"]
                allowed_headers = ["*"]
                max_age_seconds = 3000
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

  - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin-digitalocean
    filters: asset.platform == "digitalocean-spaces-bucket"
    mql: |
      digitalocean.spacesBucket.corsRules.none(_["allowedOrigins"].contains("*"))
  - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_spaces_bucket")
    mql: |
      terraform.resources("digitalocean_spaces_bucket").all(
        blocks.where(type == "cors_rule").none(arguments["allowed_origins"].contains("*"))
      )
  - uid: mondoo-digitalocean-security-spaces-bucket-cors-no-wildcard-origin-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_spaces_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_spaces_bucket").all(
