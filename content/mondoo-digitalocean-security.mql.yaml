          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Cloud Firewall admits inbound SSH from the entire internet.

        A Cloud Firewall inbound rule pairs a protocol and port range with a set of source addresses. A rule permitting TCP port 22 from `0.0.0.0/0` or `::/0` opens SSH to every host on the internet. Inbound rules are edited under Networking then Firewalls in the DigitalOcean Cloud Control Panel, or with `doctl compute firewall add-rules`, and the SSH source should be a known trusted CIDR range, a bastion host, or a VPN endpoint.

        **Why this matters**

        SSH open to the internet is subjected to continuous automated credential-stuffing and brute-force login attempts from global scanning infrastructure. The volume is not background noise that can be ignored; it is a permanent adversarial workload against every account that has a weak password or a weak key.

        Public exposure also puts the SSH daemon itself in reach of every host on the internet, so any pre-authentication vulnerability in the SSH implementation becomes immediately exploitable against the Droplet, with no credential required at all.

        Environments that use key-based authentication only are not immune either, because private keys leak from laptops, CI systems, and backups. Restricting the source IPs limits where a stolen key can be used from, so a compromised credential outside the trusted range cannot be replayed directly against the Droplet.

        Scoping SSH to a specific CIDR or bastion eliminates the vast majority of opportunistic automated attacks without affecting legitimate operator access. Where operator addresses are not static, front SSH with a VPN endpoint or a bastion and allow only that source.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Firewalls**.
        3. Open each firewall and review the **Inbound Rules** table.
        4. Look for any rule that allows TCP port 22 with a source of `All IPv4` (`0.0.0.0/0`) or `All IPv6` (`::/0`).

        A passing firewall has no inbound SSH rule with an unrestricted source. A failing firewall contains an inbound rule for TCP port 22 sourced from `0.0.0.0/0` or `::/0`.

        ### Audit via CLI

        1. List all firewalls and retrieve their inbound rules:

        ```bash
        doctl compute firewall list --format ID,Name
        doctl compute firewall get <firewall-id> --format InboundRules
        ```

        A passing firewall returns no inbound rule for port 22 with `address:0.0.0.0/0` or `address:::/0`. A failing firewall returns an inbound rule for `protocol:tcp,ports:22` with a source of `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Firewalls** and open the affected firewall.
            2. Edit the offending inbound rule for SSH and change the source from `All IPv4`/`All IPv6` to a specific trusted CIDR, tag, or Droplet ID.
            3. Save the firewall.
        - id: cli
          desc: |
            To fix this on the command line using the `doctl` CLI, remove the unrestricted SSH rule for both the IPv4 and IPv6 catch-all sources, then add a replacement rule scoped to a trusted CIDR:

            ```bash
            doctl compute firewall remove-rules "<firewall-id>" \
              --inbound-rules "protocol:tcp,ports:22,address:0.0.0.0/0 protocol:tcp,ports:22,address:::/0"
            doctl compute firewall add-rules "<firewall-id>" \
              --inbound-rules "protocol:tcp,ports:22,address:<your-trusted-cidr>"
            ```
        - id: terraform
          desc: |
            To scope SSH access in Terraform, set `source_addresses` on the `inbound_rule` for port 22 to a trusted CIDR instead of `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "digitalocean_firewall" "example" {
              name = "example"

              inbound_rule {
                protocol         = "tcp"
                port_range       = "22"
                source_addresses = ["203.0.113.0/24"]
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/firewalls/how-to/configure-rules/
        title: Configure Cloud Firewall rules

