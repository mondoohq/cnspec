  # No Terraform variants: the control-plane firewall is enforced by the managed DOKS control
  # plane and surfaced as live posture. controlPlaneFirewallEnabled is null until the feature is
  # configured through the API, and the check correlates that flag with the resolved
  # allowed-address list to reject a world-open allowlist. Expressing both the null-until-set
  # state and the public-CIDR exclusion across digitalocean_kubernetes_cluster HCL, plan, and
  # state would be fragile, so this check is runtime-only.
  - uid: mondoo-digitalocean-security-doks-control-plane-firewall-enabled
    title: Ensure DOKS clusters restrict API server access with a firewall
    impact: 90
    filters: asset.platform == "digitalocean-kubernetes-cluster"
    mql: |
      digitalocean.kubernetes.cluster.exposure.internetReachable == false
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    docs:
      desc: |
        This check verifies that a DOKS cluster's Kubernetes API server is not reachable from the public internet.

        The verdict combines the cluster's published control-plane endpoint with the control-plane firewall. The API server counts as internet-reachable unless that firewall is enabled and its allowed source addresses exclude `0.0.0.0/0` and `::/0`. When the firewall is disabled, the API server accepts connections from any internet host; when it is enabled but allows any address, the restriction is effectively removed. Correlating the endpoint with the firewall in a single reachability signal reports a cluster as exposed only when the API server is genuinely open, rather than flagging the firewall settings in isolation. Allowed sources are managed on the cluster's settings in the DigitalOcean Cloud Control Panel.

        **Why this matters**

        The API server is the cluster's control surface. Anyone who can reach it can attempt authentication, exploit an API-level vulnerability, or probe for misconfigurations that grant access to workloads and to every secret the cluster holds.

        Authentication is not the only layer that matters here. Even with strong authentication in place, an internet-reachable API server remains a standing target for credential attacks and for any future flaw in the API server itself, and neither of those requires defeating authentication first.

        A scoped allowlist contains the blast radius. Restricting the API server to known administrative and CI/CD source ranges removes it from internet-wide scanning entirely, so it is not discoverable by mass scanners probing for exposed Kubernetes endpoints, and it cuts off the primary network path to a control-plane takeover.

        Add the administrative and CI/CD source ranges that legitimately need API access to the allowed-address list rather than leaving the firewall open or disabled.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Kubernetes** and open each cluster.
        3. On the **Settings** tab, review the **Control plane firewall** configuration.

        A passing cluster has the control plane firewall enabled with the allowed addresses scoped to specific trusted CIDRs. A failing cluster has the firewall disabled, or enabled with `0.0.0.0/0` or `::/0` in the allowed addresses.

        ### Audit via CLI

        1. List clusters, then inspect each cluster's control-plane firewall settings:

        ```bash
        doctl kubernetes cluster list --format ID,Name
        doctl kubernetes cluster get <cluster-id> --output json | jq -r '.[] | [.name, .control_plane_firewall.enabled, (.control_plane_firewall.allowed_addresses | join(","))] | @tsv'
        ```

        A passing cluster returns `true` for the firewall with an allowed-address list that excludes `0.0.0.0/0` and `::/0`. A failing cluster returns `false`, or `true` with an unrestricted address in the list.
      remediation:
        - id: console
          desc: |
            The cluster passes once the control plane firewall is enabled and its allowed addresses contain neither `0.0.0.0/0` nor `::/0`. Allowed addresses must be public IPv4 ranges in CIDR notation. Worker nodes and DigitalOcean's management systems are allowed automatically.

            **Addresses left off the list lose access to the API server.** Include the public addresses of every administrator, CI/CD runner, and external tool that runs `kubectl` against the cluster, including your own, or you lock yourself out. Requests may be briefly disrupted the first time the firewall is enabled.

            To restrict API server access in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Kubernetes** and open the affected cluster.
            2. On the **Settings** tab, enable the **Control plane firewall**.
            3. Add the specific administrative and CI/CD source CIDRs that need API access, and ensure neither `0.0.0.0/0` nor `::/0` is present.
            4. Confirm that your management tooling can still reach the cluster after the change.
        - id: cli
          desc: |
            The cluster passes once the control plane firewall is enabled and its allowed addresses contain neither `0.0.0.0/0` nor `::/0`. Allowed addresses must be public IPv4 ranges in CIDR notation. Worker nodes and DigitalOcean's management systems are allowed automatically.

            **Addresses left off the list lose access to the API server.** Include the public addresses of every administrator, CI/CD runner, and external tool that runs `kubectl` against the cluster, including your own, or you lock yourself out. The flag replaces the whole existing list, and requests may be briefly disrupted the first time the firewall is enabled.

            To enable and scope the control-plane firewall on the command line using the `doctl` CLI:

            ```bash
            doctl kubernetes cluster update <cluster-id> \
              --enable-control-plane-firewall=true \
              --control-plane-firewall-allowed-addresses "203.0.113.0/24,198.51.100.10/32"
            ```

            Replace the example addresses, which are documentation ranges, with the trusted source ranges that need API access. Verify connectivity from an allowed range afterward.
        - id: terraform
          desc: |
            To enable the control plane firewall in Terraform, add a `control_plane_firewall` block with `enabled = true` to the `digitalocean_kubernetes_cluster` resource. Set `allowed_addresses` to the public IPv4 ranges that need API server access, never `0.0.0.0/0`, and replace the example documentation range:

            ```hcl
            data "digitalocean_kubernetes_versions" "example" {
              version_prefix = "1.35."
            }

            resource "digitalocean_kubernetes_cluster" "example" {
              name    = "example"
              region  = "nyc3"
              version = data.digitalocean_kubernetes_versions.example.latest_version

              node_pool {
                name       = "default"
                size       = "s-1vcpu-2gb"
                node_count = 1
              }

              control_plane_firewall {
                enabled           = true
                allowed_addresses = ["203.0.113.0/24"]
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/kubernetes/how-to/add-control-plane-firewall/
        title: How to Add a Control Plane Firewall

  # No Terraform variants: this check inspects the certificate's notAfter validity
  # window — runtime telemetry set at issuance, not a configuration field. The
  # digitalocean_certificate resource has no expiration argument (Let's Encrypt certs
  # auto-renew; custom certs carry the date inside the uploaded PEM), so expiry is
  # only observable through the live API.
  - uid: mondoo-digitalocean-security-cert-not-expired
    filters: asset.platform == "digitalocean"
    title: Ensure TLS certificates are not expired
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      digitalocean.certificates.all(notAfter > time.now)
    docs:
      desc: |
        This check verifies that no TLS certificate stored in the account has passed its expiration date.

        DigitalOcean holds the certificates that load balancers and CDN endpoints present to clients, each with a `notAfter` date after which it is no longer valid. An expired certificate breaks the chain of trust clients use to verify server identity. Certificates are listed under Settings then Security in the DigitalOcean Cloud Control Panel and with `doctl compute certificate list`.

        **Why this matters**

        An expired certificate causes browsers and API clients to reject the TLS handshake, producing certificate warnings or hard failures that hit application availability directly. The service is running and correctly configured in every other respect, and it is still unreachable.

        Users trained to click through certificate warnings when their own applications expire carry that habit elsewhere. The warning is the only defense signal a user gets against a genuine man-in-the-middle attempt, and routine expiry teaches them to dismiss it.

        Many API clients fail closed on an expired certificate and abort the connection outright, so a single expired certificate cascades into dependent services and becomes both a security failure and an availability incident at the same time.

        Catching expiry in advance provides a remediation window before the certificate lapses and before either consequence lands. Prefer DigitalOcean's Let's Encrypt certificates, which renew without operator intervention, over custom uploads that depend on someone remembering the renewal date.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Certificates**.
        3. Review the **Expiration** column for each certificate and check whether any date is in the past.

        A passing certificate shows an expiration date in the future. A failing certificate shows an expiration date that has already passed.

        ### Audit via CLI

        1. List all certificates and inspect their expiration dates:

        ```bash
        doctl compute certificate list --format ID,Name,NotAfter,State
        ```

        A passing certificate returns a `NotAfter` date that is later than today and a `State` of `verified`. A failing certificate returns a `NotAfter` date in the past or a `State` of `expired`.
      remediation:
        - id: console
          desc: |
            The account passes once no stored certificate has a `notAfter` date in the past. Creating a renewed certificate is not enough on its own, because the expired certificate keeps failing the check until it is deleted.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Certificates**.
            2. Identify the expired certificate and either upload a renewed version or create a new Let's Encrypt certificate for the same domains.
            3. Update any load balancers, CDN endpoints, or App Platform apps referencing the old certificate to use the new one.
            4. Delete the expired certificate once no resource references it.
        - id: cli
          desc: |
            To fix this on the command line using the `doctl` CLI, create a renewed certificate and then update any consumers to reference it. Choose the variant that matches how the domain's DNS is hosted.

            If the domain's DNS is managed by DigitalOcean, create a Let's Encrypt certificate. The `--type lets_encrypt` flag only works when DigitalOcean controls the domain's DNS records, because DigitalOcean must publish the validation records itself:

            ```bash
            doctl compute certificate create \
              --name <new-name> \
              --type lets_encrypt \
              --dns-names <domain>
            ```

            If the domain's DNS is hosted elsewhere or the certificate was issued by an external CA, upload it as a custom certificate instead:

            ```bash
            doctl compute certificate create \
              --name <new-name> \
              --type custom \
              --leaf-certificate-path <cert.pem> \
              --certificate-chain-path <chain.pem> \
              --private-key-path <privkey.pem>
            ```

            `<domain>` is a comma-separated list of the domains the expired certificate covered, and `<cert.pem>`, `<chain.pem>`, and `<privkey.pem>` are the paths to the renewed leaf certificate, its intermediate chain, and its private key.

            After creating the replacement, update any load balancers, CDN endpoints, or App Platform apps to reference the new certificate. Then delete the expired certificate, which keeps failing the check for as long as it exists:

            ```bash
            doctl compute certificate list --format ID,Name,NotAfter
            doctl compute certificate delete <expired-certificate-id>
            ```
        # No Terraform remediation: expiry is not a configurable field. A digitalocean_certificate resource can provision a replacement, but Terraform cannot express or assert the validity window of an issued certificate.
    refs:
      - url: https://docs.digitalocean.com/platform/teams/how-to/manage-certificates/
        title: How to Manage SSL Certificates on DigitalOcean Teams

  - uid: mondoo-digitalocean-security-cdn-has-certificate
    title: Ensure CDN endpoints with a custom domain have a TLS certificate attached
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-digitalocean-security-cdn-has-certificate-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-cdn-has-certificate-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-cdn-has-certificate-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-cdn-has-certificate-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every CDN endpoint using a custom domain has a TLS certificate attached.

        A DigitalOcean CDN endpoint fronting a Spaces bucket can be given a custom domain, but it can only terminate HTTPS for that domain if a certificate covering it is attached to the endpoint. Without one, clients reach the custom domain over HTTP or encounter certificate errors. The certificate is selected when the custom domain is configured on the endpoint in the DigitalOcean Cloud Control Panel.

        **Why this matters**

        Content served over HTTP from a CDN can be modified by any host on the network path between the user and the edge. That makes content injection straightforward against every visitor on a hostile network, and the injected content carries the authority of the custom domain.

        Users who authenticate through a custom-domain CDN endpoint over HTTP expose their credentials and session cookies to anyone able to observe the traffic path, with no indication to them that anything is wrong.

        A valid certificate also lets clients verify the endpoint's identity, which is what prevents an impersonation attempt from succeeding silently. Over plain HTTP there is nothing for the client to check.

        Attach a certificate covering the custom domain and confirm the DNS record points at the endpoint, since a mismatch produces the same client-visible failure as having no certificate at all.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **CDN** and open each endpoint.
        3. Under **Custom subdomain**, check whether a TLS certificate is selected for any endpoint that has a custom domain configured.

        A passing CDN endpoint either has no custom domain or has a custom domain with a certificate assigned. A failing CDN endpoint has a custom domain configured but no certificate selected.

        ### Audit via CLI

        1. List all CDN endpoints and inspect the `CertificateID` and `CustomDomain` fields:

        ```bash
        doctl compute cdn list --format ID,Origin,CustomDomain,CertificateID
        ```

        A passing endpoint returns a non-empty `CertificateID` when `CustomDomain` is set, or has an empty `CustomDomain`. A failing endpoint returns a non-empty `CustomDomain` paired with an empty `CertificateID`.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **CDN** and open the affected endpoint.
            2. Under **Custom subdomain**, select an existing certificate or create a new Let's Encrypt certificate for the domain.
            3. Save the CDN configuration.
        - id: cli
          desc: |
            To fix this on the command line using the `doctl` CLI, attach a certificate to the affected CDN endpoint. The certificate must be passed together with the custom domain it covers, because `doctl` updates the domain and certificate as a pair:

            ```bash
            doctl compute cdn update "<cdn-id>" \
              --domain "<custom-domain>" \
              --certificate-id "<cert-id>"
            ```
        - id: terraform
          desc: |
            To attach a TLS certificate to a custom-domain CDN endpoint in Terraform, set `certificate_name` on the `digitalocean_cdn` resource alongside `custom_domain`:

            ```hcl
            resource "digitalocean_cdn" "example" {
              origin           = digitalocean_spaces_bucket.example.bucket_domain_name
              custom_domain    = "cdn.example.com"
              certificate_name = digitalocean_certificate.example.name
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/spaces/how-to/enable-cdn/
        title: How to Enable the DigitalOcean Spaces CDN

  - uid: mondoo-digitalocean-security-cdn-has-certificate-digitalocean
    filters: asset.platform == "digitalocean"
    mql: |
      digitalocean.cdnEndpoints.where(customDomain != "").all(certificateId != "")
  - uid: mondoo-digitalocean-security-cdn-has-certificate-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_cdn")
    mql: |
      terraform.resources("digitalocean_cdn").where(arguments["custom_domain"] != empty).all(
        arguments["certificate_name"] != empty || arguments["certificate_id"] != empty
      )
  - uid: mondoo-digitalocean-security-cdn-has-certificate-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_cdn")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_cdn").where(change.after["custom_domain"] != empty).all(
        change.after["certificate_name"] != empty || change.after["certificate_id"] != empty
      )
  - uid: mondoo-digitalocean-security-cdn-has-certificate-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_cdn")
    mql: |
      terraform.state.resources.where(type == "digitalocean_cdn").where(values["custom_domain"] != empty).all(
        values["certificate_name"] != empty || values["certificate_id"] != empty
      )

  - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants
    title: Ensure Spaces access keys are scoped with bucket grants
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Spaces access key is scoped by at least one bucket grant.

        A Spaces access key can be issued with grants naming the specific buckets and operations it may use. A key created with no grants carries unrestricted account-level access to every Spaces bucket in the account. Grants are set when the key is created, under Spaces Keys in the API section of the DigitalOcean Cloud Control Panel.

        **Why this matters**

        An unscoped key that leaks provides full read and write access to every bucket in the account, so a single exposed string is a complete object-storage compromise. A grant-scoped key limits the damage to exactly the bucket and permissions it was issued for.

        Keys leak in predictable ways: committed to source control, written to application logs, embedded in a shipped binary, captured in a CI job's environment. Scoping decides in advance how much any of those incidents is worth, which is the only decision still available once the key is already out.

        Each application or service that touches Spaces should hold a key restricted to the buckets and operations it actually requires, rather than sharing an account-wide credential across everything that happens to need object storage.

        Scoped keys are also individually rotatable. One integration's key can be revoked and reissued without disrupting other services, which is what makes precise incident response possible instead of a coordinated fleet-wide rotation.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **API** > **Spaces Keys**.
        3. Review each access key and check whether it has bucket grants listed under its permissions.

        A passing Spaces key shows one or more bucket-level grants. A failing Spaces key shows no grants, indicating full account-level access to all buckets.

        ### Audit via CLI

        1. List all Spaces keys and inspect their grants:

        ```bash
        doctl spaces keys list
        ```

        A passing key returns one or more entries in its `Grants` field. A failing key returns an empty `Grants` field.
      remediation:
        - id: console
          desc: |
            **Deleting the unscoped key immediately breaks every application still using it.** Move each application to its replacement key before the final step.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **API** > **Spaces Keys**.
            2. Create a replacement key with specific bucket grants, for example read-only access to a single bucket.
            3. Update every application that used the unscoped key to use the new scoped key.
            4. Delete the unscoped key.
        - id: cli
          desc: |
            **Deleting the unscoped key immediately breaks every application still using it.** Move each application to its replacement key before deleting the old one.

            To fix this on the command line using the `doctl` CLI, create a scoped replacement key first:

            ```bash
            doctl spaces keys create "<new-name>" \
              --grants "bucket=<bucket-name>;permission=read"
            ```

            `<bucket-name>` is the one bucket the application uses, and `permission` is `read` or `readwrite`, whichever the application needs. Add more grants separated by commas, such as `bucket=logs;permission=read,bucket=uploads;permission=readwrite`. Never use an empty bucket name or `permission=fullaccess`, which grant access to every bucket in the account.

            Update every application that used the unscoped key, then delete it by its access key ID:

            ```bash
            doctl spaces keys delete "<old-access-key-id>"
            ```
        - id: terraform
          desc: |
            To scope a Spaces access key in Terraform, declare one or more `grant` blocks on the `digitalocean_spaces_key` resource, each naming a specific bucket and permission:

            ```hcl
            resource "digitalocean_spaces_key" "example" {
              name = "example-key"

              grant {
                bucket     = "example-bucket"
                permission = "read"
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/spaces/how-to/manage-access/
        title: Manage Spaces access keys and grants

  - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-digitalocean
    filters: asset.platform == "digitalocean"
    mql: |
      digitalocean.spacesKeys.all(grants != empty)
  - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_spaces_key")
    mql: |
      terraform.resources("digitalocean_spaces_key").all(blocks.where(type == "grant") != empty)
  - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_spaces_key")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_spaces_key").all(change.after["grant"] != empty)
  - uid: mondoo-digitalocean-security-spaces-key-has-scoped-grants-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_spaces_key")
    mql: |
      terraform.state.resources.where(type == "digitalocean_spaces_key").all(values["grant"] != empty)

  - uid: mondoo-digitalocean-security-spaces-bucket-not-publicly-readable
    title: Ensure Spaces buckets do not grant anonymous read access
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-digitalocean-security-spaces-bucket-not-publicly-readable-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-spaces-bucket-not-publicly-readable-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-bucket-not-publicly-readable-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-spaces-bucket-not-publicly-readable-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Spaces bucket is publicly readable.

        The runtime verdict combines every path to public access into one signal: an ACL grant to the `AllUsers` or `AuthenticatedUsers` group, a bucket policy that allows the wildcard `*` principal, and whether block-public-access actually neutralizes those grants. A bucket is reported public only when a grant exists and public access is not fully blocked, so a bucket made public through its policy is caught even when its ACL looks private. DigitalOcean Spaces is S3-compatible, so the same `public-read` ACL and wildcard-policy semantics as Amazon S3 apply, and the `AuthenticatedUsers` group covers every account on the platform rather than only this one, which is why it counts as public.

        **Why this matters**

        A `public-read` bucket lets any client enumerate object keys and download contents over the predictable `https://<bucket>.<region>.digitaloceanspaces.com/` URL pattern, with no DigitalOcean account and no credentials required. Discovery is trivial because the URL is derived from the bucket name and region.

        Buckets created for development or one-off asset hosting commonly inherit `public-read` and then accumulate logs, backups, customer uploads, and build artifacts that nobody ever reviewed for public release. The exposure grows silently long after the decision that caused it.

        Search engines and security scanners actively index publicly readable Spaces buckets, so the interval between a bucket becoming public and its contents being discovered and reused by others is short.

        Frameworks that govern customer data, personal information, or cardholder data prohibit storage in world-readable locations, so a single `public-read` bucket produces an audit finding regardless of what it contains.

        Removing the anonymous `READ` grant forces every retrieval through Spaces access keys or pre-signed URLs, restoring both auditability and access control. Where content genuinely needs to be public, serve it through a DigitalOcean CDN endpoint or a signed-URL pattern, which provide the rate limiting, access logs, and revocation that a raw bucket URL cannot.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Spaces Object Storage** and open each bucket.
        3. On the **Settings** tab, inspect the **File Listing** section.

        A passing bucket shows **Restricted (Signed URLs only)**. A failing bucket shows **Enabled (Public)** or any indication that listing is allowed without authentication.

        ### Audit via CLI

        1. List the buckets and use `s3cmd` or the AWS CLI against the Spaces endpoint to inspect each bucket's ACL:

        ```bash
        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api list-buckets \
            --endpoint-url https://<region>.digitaloceanspaces.com \
            --query 'Buckets[].Name' --output text

        AWS_ACCESS_KEY_ID=<spaces-key> AWS_SECRET_ACCESS_KEY=<spaces-secret> \
          aws s3api get-bucket-acl --bucket <bucket> \
            --endpoint-url https://<region>.digitaloceanspaces.com
        ```

        A passing bucket returns grants only to the bucket owner. A failing bucket returns a grant where `Grantee.URI` is `http://acs.amazonaws.com/groups/global/AllUsers` and `Permission` is `READ` or `FULL_CONTROL`.
      remediation:
        - id: console
          desc: |
            This finding is about the bucket's `public-read` ACL, which is a different control from the **File Listing** toggle in the Cloud Control Panel. The File Listing setting only governs anonymous directory browsing; it does not remove a `public-read` ACL grant, so objects can still be downloaded by anyone even after File Listing is restricted. The ACL is changed through the S3-compatible API or `s3cmd`, not the panel.

            To remove anonymous read access:

            1. Set the bucket ACL to private using `s3cmd setacl s3://<bucket> --acl-private` or the equivalent `aws s3api put-bucket-acl --acl private` call shown in the CLI remediation.
            2. Remove any bucket policy statement that allows the wildcard `*` principal, as shown in the CLI remediation. Bucket policies are not editable in the control panel, and the check fails a bucket that is public through its policy even when the ACL is private.
            3. Reset any individual objects that carry their own public ACLs to private, since a private bucket ACL does not override per-object grants.
            4. In the Cloud Control Panel, navigate to **Spaces Object Storage**, open the bucket, and on the **Settings** tab set **File Listing** to **Restricted (Signed URLs only)** as defense in depth.
            5. If the bucket must serve public content, route requests through a DigitalOcean CDN endpoint or a pattern that enforces auth or rate limits.
        - id: cli
          desc: |
            DigitalOcean Spaces is S3-compatible, so you manage its ACLs and bucket policy with the AWS CLI pointed at the Spaces endpoint rather than with `doctl`. The bucket passes once its ACL grants nothing to the `AllUsers` or `AuthenticatedUsers` groups and its policy has no `Allow` statement for the wildcard `*` principal.

            `<spaces-key>` and `<spaces-secret>` are a Spaces access key pair generated on the **Spaces Keys** page in the API section of the control panel, not the DigitalOcean API token. `<region>` is the Spaces region slug such as `nyc3`.

            1. Export the credentials so every command below uses them:

                ```bash
                export AWS_ACCESS_KEY_ID=<spaces-key>
                export AWS_SECRET_ACCESS_KEY=<spaces-secret>
                ```

            2. Set the bucket ACL to private, which removes the group grants:

                ```bash
                aws s3api put-bucket-acl --bucket <bucket> --acl private \
                  --endpoint-url https://<region>.digitaloceanspaces.com
                ```

            3. Print the bucket policy. A `NoSuchBucketPolicy` error means there is none and this step is done:

                ```bash
                aws s3api get-bucket-policy --bucket <bucket> \
                  --endpoint-url https://<region>.digitaloceanspaces.com \
                  --query Policy --output text
                ```

                If a statement has `"Effect": "Allow"` with `"Principal": "*"`, save the policy without those statements to `policy.json` and apply it. If no statement remains, delete the policy with `aws s3api delete-bucket-policy` instead:

                ```bash
                aws s3api put-bucket-policy --bucket <bucket> \
                  --policy file://policy.json \
                  --endpoint-url https://<region>.digitaloceanspaces.com
                ```

            4. Optionally reset per-object public ACLs left over from earlier configuration. The check does not read object ACLs, but a `public-read` object stays downloadable after the bucket is private:

                ```bash
                aws s3api list-objects-v2 --bucket <bucket> \
                  --endpoint-url https://<region>.digitaloceanspaces.com \
                  --query 'Contents[].Key' --output text \
                  | tr '\t' '\n' \
                  | while IFS= read -r key; do
                      aws s3api put-object-acl --bucket <bucket> --key "$key" --acl private \
                        --endpoint-url https://<region>.digitaloceanspaces.com
                    done
                ```
        - id: terraform
          desc: |
            To declare the bucket as private with Terraform, set `acl = "private"` on `digitalocean_spaces_bucket` (the default) and avoid any `digitalocean_spaces_bucket_policy` or `_acl` resource that grants `AllUsers` read:

            ```hcl
            resource "digitalocean_spaces_bucket" "example" {
              name   = "example-bucket"
              region = "nyc3"
              acl    = "private"
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/spaces/how-to/manage-access/
        title: Manage Spaces bucket access
      - url: https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
        title: Spaces S3 compatibility reference

