      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-db-ports-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-db-ports-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-db-ports-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-db-ports-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Cloud Firewall admits inbound traffic from the internet to a common database port.

        The ports covered are MySQL on 3306, PostgreSQL on 5432, MongoDB on 27017, Redis on 6379, Kafka on 9092, and Elasticsearch or OpenSearch on 9200. Database connectivity should be confined to private networks, so an inbound rule pairing any of these ports with `0.0.0.0/0` or `::/0` fails this check. Rules are edited under Networking then Firewalls in the DigitalOcean Cloud Control Panel, or with `doctl compute firewall add-rules`.

        **Why this matters**

        Databases exposed to the internet are targeted by automated tools that guess weak passwords or replay credentials obtained from unrelated breaches. Several of these engines have also had critical unauthenticated vulnerabilities, so network exposure alone provides a direct attack path that needs no valid credential.

        The consequence of success is total. A database reachable from the internet can be fully exfiltrated or ransomed in a single session once initial access is achieved, because the attacker is already speaking the engine's own protocol against live data.

        Publishing the database port also bypasses the application tier that should be the only authorized client. Every authorization rule, rate limit, and audit hook implemented above the database stops applying to traffic that reaches it directly, which widens the attack surface well beyond the port itself.

        Confine database traffic to internal networks and route external consumers through the application tier. Firewalling these ports at the network layer supplements engine-level authentication, so a weak password or a stolen credential cannot be used from an arbitrary internet host.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Firewalls**.
        3. Open each firewall and review the **Inbound Rules** table.
        4. Check for rules that allow TCP traffic on ports 3306 (MySQL), 5432 (PostgreSQL), 27017 (MongoDB), 6379 (Redis), 9092 (Kafka), or 9200 (Elasticsearch/OpenSearch) with a source of `All IPv4` or `All IPv6`.

        A passing firewall has no inbound rule for these database ports sourced from `0.0.0.0/0` or `::/0`. A failing firewall has at least one such rule with an unrestricted source.

        ### Audit via CLI

        1. List all firewalls and retrieve their inbound rules:

        ```bash
        doctl compute firewall list --format ID,Name
        doctl compute firewall get <firewall-id> --format InboundRules
        ```

        A passing firewall returns no inbound rule for ports 3306, 5432, 27017, 6379, 9092, or 9200 with `address:0.0.0.0/0` or `address:::/0`. A failing firewall returns at least one such rule with an unrestricted source address.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Firewalls** and open the affected firewall.
            2. Remove the wide-open inbound rule for the offending database port, or restrict its source to a specific trusted CIDR, tag, or Droplet ID.
            3. Repeat for each offending port. For managed databases, prefer the database's built-in **Trusted Sources** restriction over Droplet-level firewall rules.
        - id: cli
          desc: |
            To fix this on the command line using the `doctl` CLI, remove the offending inbound rule for both the IPv4 and IPv6 catch-all sources, or restrict the source to a trusted CIDR, tag, or Droplet ID:

            ```bash
            doctl compute firewall remove-rules "<firewall-id>" \
              --inbound-rules "protocol:tcp,ports:5432,address:0.0.0.0/0 protocol:tcp,ports:5432,address:::/0"
            ```

            Repeat for each offending port (`3306`, `5432`, `27017`, `6379`, `9092`, `9200`).
        - id: terraform
          desc: |
            To keep database ports off the public internet in Terraform, scope each database-port `inbound_rule` to a trusted CIDR or omit the public rule entirely:

            ```hcl
            resource "digitalocean_firewall" "example" {
              name = "example"

              inbound_rule {
                protocol         = "tcp"
                port_range       = "5432"
                source_addresses = ["10.0.0.0/8"]
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/firewalls/how-to/configure-rules/
        title: Configure Cloud Firewall rules

