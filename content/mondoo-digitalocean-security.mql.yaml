queries:
  # No CLI remediation: email verification is a one-time interactive flow — the
  # legitimate user must click a confirmation link delivered to their inbox.
  # `doctl account` exposes only `get` and `ratelimit`; there is no API for
  # triggering or completing email verification.
  # No Terraform variants: this check reads account-wide state from
  # digitalocean.account; the digitalocean Terraform provider has no resource that
  # represents the account or its email-verification status, so there is nothing
  # to assert against in HCL, plan, or state.
  - uid: mondoo-digitalocean-security-account-email-verified
    filters: asset.platform == "digitalocean"
    title: Ensure the DigitalOcean account email is verified
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      digitalocean.account.emailVerified == true
    docs:
      desc: |
        This check verifies that email verification is completed for the DigitalOcean account.

        DigitalOcean uses the account email address for password resets and other account recovery workflows, but an account can operate without ever confirming that address. The verification state is shown in the account settings of the DigitalOcean Cloud Control Panel and reported on the account API object; this check requires that it report the address as verified.

        **Why this matters**

        An unverified address cannot be trusted as the true owner's mailbox, which makes the self-service recovery flow exploitable by whoever controls that address. Password reset links sent to an address the account holder never confirmed can land in an attacker's inbox, and the reset completes a full account takeover without any other credential being compromised.

        Verification demonstrates that the account holder controls the mailbox, binding the account identity to a real owner. That binding is what makes the recovery flow safe to leave enabled, and an attacker who inserts an unverified address into the account gains the recovery path without detection.

        A verified address also establishes a confirmed point of contact for security notifications, incident response, and ownership disputes.

        Complete verification from the message DigitalOcean sends to the address on record, and verify again whenever the account email changes.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Settings** > **Profile**.
        3. Check whether the email address shows a verification status badge.

        A passing account shows the email address as verified. A failing account shows the email address as unverified or displays a prompt to resend the verification email.

        ### Audit via CLI

        1. Retrieve the account details:

        ```bash
        doctl account get
        ```

        A passing account returns an `email_verified` value of `true`. A failing account returns `email_verified` as `false`.
      remediation:
        - id: console
          desc: |
            To fix this in the DigitalOcean Cloud Control Panel:

            1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
            2. Navigate to **Settings** > **Profile**.
            3. If the email address shows as unverified, click **Resend verification email**.
            4. Open the verification email and follow the confirmation link.
        # No Terraform remediation: email verification is an interactive account-level
        # flow with no provider resource — the same limitation as the CLI above.
    refs:
      - url: https://docs.digitalocean.com/platform/accounts/settings/
        title: DigitalOcean account settings
  - uid: mondoo-digitalocean-security-droplet-in-vpc
    title: Ensure Droplets are deployed inside a VPC
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-digitalocean-security-droplet-in-vpc-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-droplet-in-vpc-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-droplet-in-vpc-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-droplet-in-vpc-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Droplet is placed inside a VPC private network.

        A DigitalOcean VPC is a private network boundary that contains traffic between the resources attached to it. Unless a VPC is selected at creation time, a Droplet is left outside any named VPC with only public-facing network interfaces. The network is chosen in the VPC Network step of the create flow and recorded as the Droplet's VPC UUID.

        **Why this matters**

        Without VPC membership, every connection a Droplet makes to another resource in the account leaves through a public interface. Traffic that should never be routable from outside is instead carried on addresses anyone can reach, which lengthens the path and widens the set of hosts that can observe or reach it.

        VPC membership is also what contains a compromise. A Droplet outside a VPC has broader network reach across the account, so an attacker who lands on it can survey and attack far more than an attacker on a segmented host. Membership additionally enables private-IP communication between Droplets, managed databases, and load balancers, removing the need to expose those services on public addresses at all.

        This is defense in depth alongside the Cloud Firewall and any host firewall rules, so a misconfiguration in one layer does not immediately expose the resource. Because a Droplet's network cannot be changed after creation, a Droplet outside a VPC must be rebuilt or replaced inside one.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Droplets** and open each Droplet.
        3. Select the **Networking** tab and check the **VPC** field.

        A passing Droplet shows a named VPC under the Networking tab. A failing Droplet shows no VPC or lists only the legacy default network.

        ### Audit via CLI

        1. List all Droplets and note any that lack a VPC UUID:

        ```bash
        doctl compute droplet list --format ID,Name,VPCUUID,Region
        ```

        A passing Droplet returns a non-empty `VPCUUID`. A failing Droplet returns an empty `VPCUUID` field.
      remediation:
        - id: console
          desc: |
            **This fix replaces the Droplet.** DigitalOcean does not support moving an existing Droplet into a VPC, so plan for downtime and treat the change as a migration rather than an in-place edit.

            To fix this in the DigitalOcean Cloud Control Panel, create a snapshot of the Droplet, create a replacement Droplet from the snapshot inside the target VPC, and retire the original:

            1. Power down the Droplet before snapshotting so the disk is in a consistent state. A snapshot of a running Droplet can capture an incomplete filesystem.
            2. Navigate to **Images** > **Snapshots** and take a snapshot of the affected Droplet.
            3. Create a new Droplet from the snapshot and select a VPC, not the default, in the **VPC Network** section.
            4. Update DNS, firewall rules, and monitoring to point at the new Droplet. The replacement Droplet receives a new public IP address, so anything that references the old IP must be updated.
            5. Verify the replacement is serving traffic before retiring the original.
            6. Destroy the original Droplet only after the replacement is confirmed healthy.
        - id: cli
          desc: |
            **This fix replaces the Droplet.** DigitalOcean cannot move an existing Droplet into a VPC, so plan for downtime, keep the original until the replacement is verified, and expect the new Droplet to receive a new public IP address.

            To fix this on the command line using the `doctl` CLI, snapshot the Droplet and create a replacement from the snapshot with a VPC set:

            1. Power off the Droplet so the snapshot captures a consistent filesystem, then take the snapshot:

                ```bash
                doctl compute droplet-action power-off <droplet-id> --wait
                doctl compute droplet-action snapshot <droplet-id> --snapshot-name <snapshot-name> --wait
                ```

            2. Look up the snapshot ID and the VPCs available to the replacement:

                ```bash
                doctl compute snapshot list --resource droplet --format ID,Name,Regions,MinDiskSize
                doctl vpcs list --format ID,Name,Region,IPRange
                ```

            3. Create the replacement Droplet inside the VPC:

                ```bash
                doctl compute droplet create <new-name> \
                  --image <snapshot-id> \
                  --size <size> \
                  --region <region> \
                  --vpc-uuid <vpc-uuid>
                ```

                - `<snapshot-id>` is the `ID` of the snapshot taken in step 1.
                - `<region>` must be a region the snapshot is available in, and `<vpc-uuid>` must be the `ID` of a VPC in that same region. Setting `--vpc-uuid` gives the new Droplet the VPC membership the check requires.
                - `<size>` must provide a disk at least as large as the snapshot's `MinDiskSize`. Reusing the original Droplet's size slug keeps the same capacity.

            4. Update DNS, firewall rules, and monitoring to reference the new Droplet, and verify that it serves traffic.
            5. Delete the original Droplet. It keeps failing the check for as long as it exists outside a VPC:

                ```bash
                doctl compute droplet delete <droplet-id>
                ```
        - id: terraform
          desc: |
            To deploy Droplets inside a VPC in Terraform, set `vpc_uuid` on the `digitalocean_droplet` resource:

            ```hcl
            resource "digitalocean_droplet" "example" {
              name     = "example"
              image    = "ubuntu-22-04-x64"
              region   = "nyc3"
              size     = "s-1vcpu-1gb"
              vpc_uuid = digitalocean_vpc.example.id
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/vpc/
        title: DigitalOcean VPC overview

  - uid: mondoo-digitalocean-security-droplet-in-vpc-digitalocean
    filters: asset.platform == "digitalocean"
    mql: |
      digitalocean.droplets.all(vpc != null)
  - uid: mondoo-digitalocean-security-droplet-in-vpc-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "digitalocean_droplet")
    mql: |
      terraform.resources("digitalocean_droplet").all(arguments.vpc_uuid != empty)
  - uid: mondoo-digitalocean-security-droplet-in-vpc-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "digitalocean_droplet")
    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_droplet").all(change.after.vpc_uuid != empty)
  - uid: mondoo-digitalocean-security-droplet-in-vpc-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_droplet")
    mql: |
      terraform.state.resources.where(type == "digitalocean_droplet").all(values.vpc_uuid != empty)

  # No Terraform variants: this check requires cross-resource correlation between
  # digitalocean_droplet and digitalocean_firewall (matched by id or by overlapping
  # tag), which is awkward to express reliably in MQL on Terraform sources. The
  # runtime check uses the digitalocean.droplet.missingFirewall helper, which does
  # the correlation server-side.
  # No Terraform remediation: see above.
  - uid: mondoo-digitalocean-security-droplet-firewall-coverage
    filters: asset.platform == "digitalocean"
    title: Ensure every Droplet is covered by a Cloud Firewall
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      digitalocean.droplets.all(missingFirewall == false)
    docs:
      desc: |
        This check verifies that every Droplet is covered by at least one DigitalOcean Cloud Firewall.

        Cloud Firewalls attach either directly by Droplet ID or through a tag the Droplet carries, and they filter traffic before it reaches the Droplet's network stack. They are opt-in: a Droplet created without one has no network-layer filtering at all, and its traffic is governed only by whatever rules the host operating system happens to enforce. Coverage is managed under Networking then Firewalls in the DigitalOcean Cloud Control Panel, or with `doctl compute firewall`.

        **Why this matters**

        An uncovered Droplet exposes every listening service directly to whatever network can reach its IP addresses, including services that bind to all interfaces by default. Common ports such as SSH on port 22 are scanned continuously by automated infrastructure, and uncovered Droplets are targeted within minutes of provisioning.

        Relying on iptables or nftables alone is fragile. A single misconfigured rule, or a package that opens a port during installation, bypasses every network-layer control at once, and per-host rules drift independently across a fleet so that no two Droplets end up filtering the same way. A Cloud Firewall applies its rules consistently to everything it covers and cannot be disabled from inside a compromised workload.

        Attach firewalls by tag rather than by Droplet ID wherever possible, so Droplets created during a scaling event inherit the correct policy at creation time instead of opening a coverage gap.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Droplets** and open each Droplet.
        3. Select the **Networking** tab and look at the **Firewalls** section.

        A passing Droplet lists at least one Cloud Firewall in the Firewalls section. A failing Droplet shows no firewalls attached.

        ### Audit via CLI

        1. List all Cloud Firewalls and their associated Droplets and tags:

        ```bash
        doctl compute firewall list --format ID,Name,DropletIDs,Tags
        ```

        2. Cross-reference with the full list of Droplets:

        ```bash
        doctl compute droplet list --format ID,Name,Tags
        ```

        A passing Droplet appears in the `DropletIDs` field of at least one firewall, or carries a tag that at least one firewall targets. A failing Droplet is absent from every firewall's Droplet list and shares no tag with any firewall.
      remediation:
        - id: console
          desc: |
            A Droplet passes once at least one Cloud Firewall covers it, either by Droplet ID or through a tag the Droplet carries.

            **Attaching a firewall can cut off traffic to the Droplet.** A Cloud Firewall drops all inbound and outbound traffic that no rule permits, so review its rules before attaching it. Make sure it allows the inbound ports the Droplet serves and the outbound traffic it needs, such as DNS, package updates, and calls to other services.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Firewalls** and open an existing firewall that should protect the Droplet, or create a new one.
            2. Under **Apply to Droplets**, add the Droplet by name or attach a tag the Droplet already carries.
            3. Save the firewall and verify the Droplet now lists the firewall under its **Networking** tab.
        - id: cli
          desc: |
            A Droplet passes once at least one Cloud Firewall covers it, either by Droplet ID or through a tag the Droplet carries.

            **Attaching a firewall can cut off traffic to the Droplet.** A Cloud Firewall drops all inbound and outbound traffic that no rule permits. Before attaching one, confirm with `doctl compute firewall get <firewall-id> --format InboundRules,OutboundRules` that it allows the ports the Droplet serves and the outbound traffic it needs.

            To fix this on the command line using the `doctl` CLI, find the firewall ID with `doctl compute firewall list --format ID,Name,Tags`, then attach the Droplet directly:

            ```bash
            doctl compute firewall add-droplets <firewall-id> \
              --droplet-ids <droplet-id>
            ```

            Or, if you scope firewalls by tag, apply one of the tags listed in the firewall's `Tags` column to the Droplet:

            ```bash
            doctl compute droplet tag <droplet-id> --tag-name <firewall-tag>
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/firewalls/
        title: DigitalOcean Cloud Firewalls overview

  # Security-only check (compliance mapping intentionally omitted per maintainer).
  # No Terraform variants: internetReachable is a runtime-computed exposure signal (IP + security group/firewall reachability) with no static config analog.
  - uid: mondoo-digitalocean-security-droplet-not-internet-reachable
    title: Ensure Droplets are not reachable from the internet
    impact: 85
    filters: asset.platform == "digitalocean"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      digitalocean.droplets.all( exposure.internetReachable == false )
    docs:
      desc: |
        This check verifies that no Droplet is actually reachable from the public internet.

        The `internetReachable` signal correlates two facts rather than one: whether the Droplet holds a public IP, and whether firewall ingress genuinely admits inbound traffic to it from any address. The case where no Cloud Firewall covers the Droplet at all counts as admitting traffic. A Droplet is reported exposed only when both conditions hold, which makes this a higher-fidelity signal than a public-IP flag on its own.

        **Why this matters**

        A Droplet with no internet-reachable path keeps its listening services off the public scanning grid entirely. Nothing on the internet can probe them, so the pre-authentication surface of every daemon on the host stops being an internet-facing surface, and a compromise there stops being an available entry point into the rest of the account.

        A public IP is harmless until a firewall rule, or the absence of a firewall, admits traffic to it. Closing either side of that pair closes the path, which gives operators two independent ways to remediate: detach the public address, or tighten the ingress rules that make it useful to an attacker.

        Because the signal correlates the address with the ingress rules, it surfaces the Droplets that are genuinely exposed rather than every Droplet that merely holds a public address, so a failing result is worth acting on rather than triaging away.

        Intentionally public hosts such as bastions and public web servers will fail this check and should be exempted, ideally after their ingress rules have been narrowed to the ports they actually serve.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Droplets**, open each Droplet, and check the **Networking** tab for an assigned public IPv4 or IPv6 address.
        3. In the same **Networking** tab, review the attached Cloud Firewalls and their inbound rules; a Droplet with no firewall admits all inbound traffic.

        A passing Droplet either has no public IP, or is covered by firewalls whose inbound rules admit no `0.0.0.0/0` or `::/0` source. A failing Droplet has a public IP and a firewall rule (or no firewall coverage) that admits traffic from any address.

        ### Audit via CLI

        1. List Droplets with their public addresses, then cross-reference the firewalls that cover each:

        ```bash
        doctl compute droplet list --format ID,Name,PublicIPv4,PublicIPv6
        doctl compute firewall list --format ID,Name,DropletIDs,Tags,InboundRules
        ```

        A passing Droplet either reports no public IP, or is covered by firewall inbound rules whose `address` values exclude `0.0.0.0/0` and `::/0`. A failing Droplet has a public IP combined with an inbound rule sourced from `0.0.0.0/0` or `::/0`, or no firewall coverage at all.
      remediation:
        - id: console
          desc: |
            A Droplet with a public IP address passes only when at least one Cloud Firewall covers it and none of the firewalls covering it has an inbound rule, on any port or protocol, whose sources include `All IPv4` (`0.0.0.0/0`) or `All IPv6` (`::/0`). A Droplet that no firewall covers always counts as reachable.

            **Narrowing inbound sources drops connections from every address you leave out.** Include your own management address before you remove a world-open SSH rule, or you lose access to the Droplet. A host that must stay public, such as a web server, needs an exception rather than this fix.

            To close the internet-reachable path in the DigitalOcean Cloud Control Panel:

            1. Open the Droplet, select its **Networking** tab, and note every firewall listed under **Firewalls**. If none is listed, navigate to **Networking** > **Firewalls**, create a firewall with the inbound and outbound rules the Droplet needs, and apply it to the Droplet.
            2. In each listed firewall, edit every inbound rule whose sources include `All IPv4` or `All IPv6`. Replace those sources with the specific trusted CIDRs, tags, Droplets, or load balancers that need to reach the port.
            3. Save each firewall.
        - id: cli
          desc: |
            A Droplet with a public IP address passes only when at least one Cloud Firewall covers it and none of the firewalls covering it has an inbound rule, on any port or protocol, whose sources include `0.0.0.0/0` or `::/0`. A Droplet that no firewall covers always counts as reachable.

            **Narrowing inbound sources drops connections from every address you leave out.** Add the scoped rule before removing the world-open one, and include your own management address in any SSH rule, or you lose access to the Droplet.

            To fix this on the command line using the `doctl` CLI:

            1. List the firewalls covering the Droplet and print their inbound rules exactly as they are stored:

                ```bash
                doctl compute firewall list-by-droplet <droplet-id> --format ID,Name,InboundRules
                ```

            2. For each rule whose sources include `address:0.0.0.0/0` or `address:::/0`, add a replacement rule with the same protocol and ports scoped to a trusted source, then remove the world-open rule. Pass the rule to `remove-rules` exactly as step 1 printed it, including every `address` entry it lists:

                ```bash
                doctl compute firewall add-rules <firewall-id> \
                  --inbound-rules "protocol:tcp,ports:<port>,address:<trusted-cidr>"
                doctl compute firewall remove-rules <firewall-id> \
                  --inbound-rules "<rule-as-printed-in-step-1>"
                ```

                `<port>` is the port or range of the rule being replaced, and `<trusted-cidr>` is the network that legitimately connects to it, such as an office range or a VPN egress address. Any source other than `0.0.0.0/0` and `::/0` satisfies the check.

            3. If step 1 returned no firewall, create one that covers the Droplet. A Cloud Firewall drops all traffic no rule permits, so give it the outbound rules the Droplet needs as well as scoped inbound rules:

                ```bash
                doctl compute firewall create --name <firewall-name> \
                  --droplet-ids <droplet-id> \
                  --inbound-rules "protocol:tcp,ports:22,address:<trusted-cidr>" \
                  --outbound-rules "protocol:tcp,ports:all,address:0.0.0.0/0,address:::/0 protocol:udp,ports:all,address:0.0.0.0/0,address:::/0"
                ```
        - id: terraform
          desc: |
            Keep Droplets off the public internet by covering them with a firewall whose `inbound_rule` blocks are scoped to trusted CIDRs rather than `0.0.0.0/0` or `::/0`. Replace `203.0.113.0/24`, a documentation range, with the network that legitimately connects to the port. A firewall drops all traffic no rule permits, so also declare `outbound_rule` blocks for the traffic the Droplet sends:

            ```hcl
            resource "digitalocean_firewall" "scoped" {
              name        = "scoped"
              droplet_ids = [digitalocean_droplet.example.id]

              inbound_rule {
                protocol         = "tcp"
                port_range       = "443"
                source_addresses = ["203.0.113.0/24"]
              }

              outbound_rule {
                protocol              = "tcp"
                port_range            = "all"
                destination_addresses = ["0.0.0.0/0", "::/0"]
              }

              outbound_rule {
                protocol              = "udp"
                port_range            = "all"
                destination_addresses = ["0.0.0.0/0", "::/0"]
              }
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/networking/firewalls/how-to/configure-rules/
        title: Configure Cloud Firewall rules

  - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh
    title: Ensure no firewall allows unrestricted inbound SSH (port 22)
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-firewall-no-unrestricted-ssh-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Cloud Firewall admits inbound SSH from the entire internet.

        A Cloud Firewall inbound rule pairs a protocol and port range with a set of source addresses. A rule permitting TCP port 22 from `0.0.0.0/0` or `::/0` opens SSH to every host on the internet. Inbound rules are edited under Networking then Firewalls in the DigitalOcean Cloud Control Panel, or with `doctl compute firewall add-rules`, and the SSH source should be a known trusted CIDR range, a bastion host, or a VPN endpoint.

        **Why this matters**

        SSH open to the internet is subjected to continuous automated credential-stuffing and brute-force login attempts from global scanning infrastructure. The volume is not background noise that can be ignored; it is a permanent adversarial workload against every account that has a weak password or a weak key.

        Public exposure also puts the SSH daemon itself in reach of every host on the internet, so any pre-authentication vulnerability in the SSH implementation becomes immediately exploitable against the Droplet, with no credential required at all.

        Environments that use key-based authentication only are not immune either, because private keys leak from laptops, CI systems, and backups. Restricting the source IPs limits where a stolen key can be used from, so a compromised credential outside the trusted range cannot be replayed directly against the Droplet.

        Scoping SSH to a specific CIDR or bastion eliminates the vast majority of opportunistic automated attacks without affecting legitimate operator access. Where operator addresses are not static, front SSH with a VPN endpoint or a bastion and allow only that source.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Networking** > **Firewalls**.
        3. Open each firewall and review the **Inbound Rules** table.
        4. Look for any rule that allows TCP port 22 with a source of `All IPv4` (`0.0.0.0/0`) or `All IPv6` (`::/0`).

        A passing firewall has no inbound SSH rule with an unrestricted source. A failing firewall contains an inbound rule for TCP port 22 sourced from `0.0.0.0/0` or `::/0`.

        ### Audit via CLI

        1. List all firewalls and retrieve their inbound rules:

        ```bash
        doctl compute firewall list --format ID,Name
        doctl compute firewall get <firewall-id> --format InboundRules
        ```

        A passing firewall returns no inbound rule for port 22 with `address:0.0.0.0/0` or `address:::/0`. A failing firewall returns an inbound rule for `protocol:tcp,ports:22` with a source of `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            The firewall passes once no inbound TCP rule for port `22` lists `All IPv4` (`0.0.0.0/0`) or `All IPv6` (`::/0`) among its sources.

            **Keep your own access in the new source list.** Removing the world-open source immediately blocks SSH from every address the replacement rule does not cover, including your own if you leave it out.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Networking** > **Firewalls** and open the affected firewall.
            2. Edit the inbound SSH rule and replace the `All IPv4` and `All IPv6` sources with the trusted CIDR, tag, or Droplet that operators connect from, such as a bastion host or VPN range.
            3. Save the firewall.
        - id: cli
          desc: |
            The firewall passes once no inbound TCP rule for port `22` lists `0.0.0.0/0` or `::/0` among its sources.

            **Keep your own access in the new source list.** Add the scoped rule before removing the world-open one, and make sure `<trusted-cidr>` includes the address you connect from, or you lose SSH access to every Droplet the firewall covers.

            To fix this on the command line using the `doctl` CLI:

            1. Print the firewall's inbound rules exactly as they are stored:

                ```bash
                doctl compute firewall get <firewall-id> --format InboundRules
                ```

            2. Add an SSH rule scoped to the trusted source, then remove the world-open SSH rule. Pass the rule to `remove-rules` exactly as step 1 printed it, including every `address` entry it lists, for example `protocol:tcp,ports:22,address:0.0.0.0/0,address:::/0`:

                ```bash
                doctl compute firewall add-rules <firewall-id> \
                  --inbound-rules "protocol:tcp,ports:22,address:<trusted-cidr>"
                doctl compute firewall remove-rules <firewall-id> \
                  --inbound-rules "<ssh-rule-as-printed-in-step-1>"
                ```

                `<trusted-cidr>` is the range operators connect from, such as a bastion host address or VPN egress range.
        - id: terraform
          desc: |
            To scope SSH access in Terraform, set `source_addresses` on the `inbound_rule` for port 22 to a trusted CIDR instead of `0.0.0.0/0` or `::/0`. Replace `203.0.113.0/24`, a documentation range, with the range operators connect from:

            ```hcl
            resource "digitalocean_firewall" "example" {
              name = "example"

              inbound_rule {
                protocol         = "tcp"
                port_range       = "22"
                source_addresses = ["203.0.113.0/24"]
              }
            }
            ```
