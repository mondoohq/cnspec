      digitalocean.database.engine != "pg" || digitalocean.database.version.notIn(["9", "9.5", "9.6", "10", "11", "12", "13"])
      digitalocean.database.engine != "mysql" || digitalocean.database.version.notIn(["5.6", "5.7"])
