    mql: |
      terraform.plan.resourceChanges.where(type == "digitalocean_firewall").all(
        change.after["inbound_rule"] == empty ||
        change.after["inbound_rule"].none(_["port_range"] == /^(0|all|1-65535|0-65535)$/ && _["source_addresses"].contains("0.0.0.0/0")) &&
        change.after["inbound_rule"].none(_["port_range"] == /^(0|all|1-65535|0-65535)$/ && _["source_addresses"].contains("::/0"))
      )
  - uid: mondoo-digitalocean-security-firewall-no-all-ports-open-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "digitalocean_firewall")
    mql: |
      terraform.state.resources.where(type == "digitalocean_firewall").all(
        values["inbound_rule"] == empty ||
        values["inbound_rule"].none(_["port_range"] == /^(0|all|1-65535|0-65535)$/ && _["source_addresses"].contains("0.0.0.0/0")) &&
        values["inbound_rule"].none(_["port_range"] == /^(0|all|1-65535|0-65535)$/ && _["source_addresses"].contains("::/0"))
      )

  # No Terraform variants: this check requires cross-resource correlation between
  # digitalocean_database_cluster and digitalocean_database_firewall (matched by
  # cluster_id), which is awkward to express reliably in MQL on Terraform sources.
  # The runtime check reads the firewallRules collected per cluster server-side. This
  # is the same correlation limitation as mondoo-digitalocean-security-droplet-firewall-coverage.
  - uid: mondoo-digitalocean-security-db-firewall-configured
    filters: asset.platform == "digitalocean-database"
    title: Ensure managed databases restrict access via Trusted Sources
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      digitalocean.database.firewallRules != empty
    docs:
      desc: |
        This check verifies that every managed database cluster restricts inbound connections with a Trusted Sources list.

        Trusted Sources is the managed database firewall. Each entry names a Droplet, a tag, a Kubernetes cluster, an App Platform application, or an IP address permitted to connect. A newly created cluster has no entries, and in that state it accepts connections from any source that presents valid credentials. The list is edited on the cluster's Settings tab in the DigitalOcean Cloud Control Panel, or with `doctl databases firewalls`.

        **Why this matters**

        With no Trusted Sources entry, the only thing standing between the internet and the data is the database password. Passwords leak from application logs, source control, CI configuration, and developer laptops, and a leaked one can then be used from any internet host to connect directly to the cluster.

        Trusted Sources also stops a compromised application server from being used as a pivot. A host that was never authorized to reach a given cluster cannot reach it even after an attacker owns it completely, which keeps a single compromised workload from becoming access to every database in the account.

        This is a network layer beneath engine authentication, so both must be defeated for an attacker to read data. Scoping access to specific Droplets, tags, or CIDRs means a leaked credential is only usable from the authorized infrastructure.

        The resulting list is also an explicit inventory of every authorized client, which makes unauthorized access attempts in the database logs straightforward to identify.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Databases** and open each cluster.
        3. Go to **Settings** > **Trusted Sources**.
        4. Verify that at least one Trusted Sources entry is listed.

        A passing database cluster has one or more Trusted Sources entries. A failing database cluster shows an empty Trusted Sources list, meaning any source can attempt a connection.

        ### Audit via CLI

        1. List all database clusters, then retrieve the firewall rules for each:

        ```bash
        doctl databases list --format ID,Name,Engine,Region
        doctl databases firewalls list <database-id>
        ```

        A passing database returns one or more firewall rules. A failing database returns an empty list of firewall rules.
      remediation:
        - id: console
          desc: |
            The cluster passes once its Trusted Sources list holds at least one entry.

            **The first entry blocks every client not on the list.** As soon as one Trusted Source exists, the cluster refuses connections from all other sources, so add every application host, App Platform app, Kubernetes cluster, and administrator address in the same change. Never add `0.0.0.0/0`, which leaves the cluster open to the internet.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Databases** and open the affected cluster.
            2. Go to **Settings** > **Trusted Sources**.
            3. Add the Droplets, tags, apps, Kubernetes clusters, or specific IP addresses that need database access.
        - id: cli
          desc: |
            The cluster passes once its Trusted Sources list holds at least one entry.

            **The first rule blocks every client not on the list.** As soon as one rule exists, the cluster refuses connections from all other sources, so append a rule for every client before applications reconnect. Never use `ip_addr:0.0.0.0/0`, which leaves the cluster open to the internet.

            To fix this on the command line using the `doctl` CLI, append one rule per client. Each rule is `<type>:<value>`:

            - `droplet:<droplet-id>` allows one Droplet, using the ID from `doctl compute droplet list --format ID,Name`.
            - `tag:<tag-name>` allows every Droplet carrying the tag.
            - `k8s:<cluster-id>` and `app:<app-id>` allow a DOKS cluster or an App Platform app.
            - `ip_addr:<address>` allows a single IP address or a CIDR range, such as an administrator's office network.

            ```bash
            doctl databases firewalls append <database-id> \
              --rule droplet:<droplet-id>
            doctl databases firewalls append <database-id> \
              --rule ip_addr:<address>
            doctl databases firewalls list <database-id>
            ```
        # No Terraform remediation: the same cross-resource correlation limitation as the variants above. Trusted Sources are a separate digitalocean_database_firewall resource referencing cluster_id, so an HCL snippet cannot assert coverage of an arbitrary cluster.
    refs:
      - url: https://docs.digitalocean.com/products/databases/postgresql/how-to/secure/
        title: How to Secure PostgreSQL Managed Database Clusters

  - uid: mondoo-digitalocean-security-db-in-private-network
    title: Ensure managed databases are attached to a private network
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-digitalocean-security-db-in-private-network-digitalocean
        tags:
          mondoo.com/filter-title: DigitalOcean
          mondoo.com/filter-icon: digitalocean
      - uid: mondoo-digitalocean-security-db-in-private-network-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-db-in-private-network-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-digitalocean-security-db-in-private-network-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every managed database cluster is attached to a VPC private network.

        A managed database receives a public connection string by default and must be reached over the internet unless a private network is configured at creation time. Attaching the cluster to a VPC gives it a private hostname that resources in the same VPC use instead. The network is selected in the create flow and recorded as the cluster's private network UUID.

        **Why this matters**

        Without a private network, traffic between applications and the cluster traverses public-facing endpoints. That lengthens the path and increases the number of hops where the traffic can be observed, for no benefit when the client is a Droplet in the same region. A private network keeps that traffic inside DigitalOcean's infrastructure instead.

        A cluster reachable only on private IPs is also not directly accessible from the internet even when Trusted Sources are misconfigured, which is the second layer that matters most in practice. A firewall rule opened by accident has no effect if there is no public path for it to open.

        Applications gain the private hostname and use it without per-connection TLS certificate pinning against a public endpoint or reliance on public DNS, so the simpler configuration is also the more private one.

        Attach the cluster to the same VPC as the Droplets and clusters that consume it, and keep the Trusted Sources list in place as well; the two controls fail differently and are worth having together.
      audit: |
        ### Audit via Console

        1. Sign in to the DigitalOcean [Cloud Control Panel](https://cloud.digitalocean.com/).
        2. Navigate to **Databases** and open each cluster.
        3. Go to **Overview** and check the **Network** section for a private network (VPC) assignment.

        A passing database cluster shows a VPC name under the Network section. A failing database cluster shows no private network or only a public endpoint.

        ### Audit via CLI

        1. List all database clusters and inspect each cluster's private network UUID:

        ```bash
        doctl databases list --output json | jq -r '.[] | [.id, .name, .engine, .private_network_uuid] | @tsv'
        ```

        A passing database cluster returns a non-empty `private_network_uuid`. A failing database cluster returns an empty value.
      remediation:
        - id: console
          desc: |
            A managed database cluster can be migrated into a VPC network directly, so the same cluster and its data stay in service without a replacement. The cluster passes once it reports a private network UUID.

            **Schedule the migration in a maintenance window.** The cluster shows a `migrating` status until the move completes, and it is assigned a new IP address in the VPC network. Check the private connection details afterward and update any client that uses them.

            To fix this in the DigitalOcean Cloud Control Panel:

            1. Navigate to **Databases**, open the affected cluster, and select the **Settings** tab.
            2. Under **Cluster datacenter**, click **Edit**.
            3. Keep the cluster's current datacenter, select the target network from the **VPC Network** menu, and click **Save**.
            4. When the migration finishes, copy the private connection details from the **Overview** tab into the applications that use them.
        - id: cli
          desc: |
            A managed database cluster can be migrated into a VPC network directly with `doctl databases migrate`, so the same cluster and its data stay in service without a replacement. The cluster passes once it reports a private network UUID.

            **Schedule the migration in a maintenance window.** The cluster shows a `migrating` status until the move completes, and it is assigned a new IP address in the VPC network. Check the private connection details afterward and update any client that uses them.

            To fix this on the command line using the `doctl` CLI:

            1. Look up the cluster's current region and the VPC networks in that region:

                ```bash
                doctl databases list --format ID,Name,Region
                doctl vpcs list --format ID,Name,Region,IPRange
                ```

            2. Migrate the cluster into the VPC network. `<region>` is the cluster's current region, which keeps it in the same datacenter, and `<vpc-uuid>` is the `ID` of a VPC network in that region:

                ```bash
                doctl databases migrate <database-id> \
                  --region <region> \
                  --private-network-uuid <vpc-uuid> \
                  --wait
                ```

            3. Print the new connection details and update the applications that use the private hostname:

                ```bash
                doctl databases connection <database-id> --private --format Host,Port
                ```
        - id: terraform
          desc: |
            To attach a managed database to a VPC in Terraform, set `private_network_uuid` on the `digitalocean_database_cluster` resource:

            ```hcl
            resource "digitalocean_database_cluster" "example" {
              name                 = "example"
              engine               = "pg"
              version              = "16"
              size                 = "db-s-1vcpu-1gb"
              region               = "nyc3"
              node_count           = 1
              private_network_uuid = digitalocean_vpc.example.id
            }
            ```
    refs:
      - url: https://docs.digitalocean.com/products/databases/postgresql/how-to/connect/
        title: Connect to a managed database cluster

  - uid: mondoo-digitalocean-security-db-in-private-network-digitalocean
    filters: asset.platform == "digitalocean-database"
