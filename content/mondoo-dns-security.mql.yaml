policies:
  - uid: mondoo-dns-security
    name: Mondoo DNS Security
    version: 1.6.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: host
    require:
      - provider: network
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure DNS against spoofing, poisoning, and hijacking
    docs:
      desc: |
        The Mondoo DNS Security policy identifies DNS misconfigurations that could expose your domain to spoofing, cache poisoning, and domain hijacking. This policy helps organizations detect and remediate DNS weaknesses before attackers can exploit them to redirect traffic, intercept sensitive communications, or impersonate your organization to customers and partners.

        This policy provides security checks across key DNS areas:

        - DNSSEC enablement and validation
        - Authoritative record configuration for A, AAAA, MX, NS, TXT, and CNAME records
        - Detection of legacy or vulnerable record types
        - Record consistency and exposure of internal infrastructure

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      # `dns.fqdn != empty` keeps these checks off assets that have no domain
      # name. Scanning by IP leaves the fqdn empty, and the dns resource answers
      # an empty fqdn with the DNS ROOT ZONE — so `cnspec scan host 1.1.1.1`
      # previously reported DNSSEC as enabled, NS redundancy as satisfied and no
      # wildcards present, all of which described `.` rather than the asset.
      # The root cause is upstream (initDns substitutes an empty fqdn for an IP
      # target); this guard is what protects users until they pick that up, since
      # the network provider versions independently of cnspec.
      #
      # The four checks carrying `dns.fqdn == dns.zone.fqdn` are zone-wide, and
      # that filter keeps them on the one name able to answer them. DNSKEY, NS
      # and SOA records exist at a zone apex and nowhere else inside the zone,
      # so asking www.example.com whether its zone is signed, or how many
      # nameservers serve it, reads empty and fails a name that has nothing to
      # misconfigure. Scanning an apex surfaces the `www` host as an asset of
      # its own, which is where those failures were reported.
      #
      # The apex is established by delegation (`dns.zone`) rather than by the
      # public suffix list, so a delegated subdomain is audited as the zone it
      # is: `cs.cmu.edu` has its own nameservers and its own signing state, and
      # an eTLD+1 test would skip it as a subdomain of `cmu.edu`. This needs
      # network provider 13.3.1 or newer, which is where `dns.zone` lands.
      - title: Networking
        filters: |
          asset.family.contains('network') && dns.fqdn != empty
        checks:
          - uid: mondoo-dns-security-google-workspaces-mx-records
          - uid: mondoo-dns-security-no-cname-for-root-domain
          - uid: mondoo-dns-security-no-ip-for-ns-mx-records
          - uid: mondoo-dns-security-no-legacy-ms-365-mx-records
          - uid: mondoo-dns-security-dnssec-enabled
          - uid: mondoo-dns-security-no-wildcard
          - uid: mondoo-dns-security-ns-redundancy
          - uid: mondoo-dns-security-reasonable-ttls
    scoring_system: highest impact
queries:
  - uid: mondoo-dns-security-no-cname-for-root-domain
    title: Ensure no CNAME is used for root domain
    impact: 60
    filters: dns.fqdn == dns.zone.fqdn
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      dns.records.where(type == "CNAME") == empty
    docs:
      desc: |
        This check verifies that the zone apex, the bare domain with no label in front of it, resolves through an address record and carries no CNAME.

        A CNAME declares that this name is an alias for another name and that the other name's records are authoritative for everything. That is incompatible with the apex, which must carry its own SOA and NS records for the zone to exist at all. The fix in your DNS provider's control panel is to delete the apex CNAME and publish an `A` or `AAAA` record, or, where the target is a hostname whose address moves, the provider's alias record type: `ALIAS`, `ANAME`, or CNAME flattening, each of which resolves the target and answers with an address.

        **Why this matters**

        The failure is availability, and it is total rather than partial. A resolver that meets a CNAME at the apex either ignores the SOA and NS records sitting alongside it or rejects the zone as malformed, and which one happens depends on the resolver. The result is a domain that answers for some users and not others, or that resolves through a caching resolver and fails through a validating one, which is the hardest class of outage to reproduce and the slowest to diagnose.

        Everything anchored at the apex goes with it. Mail stops, because the `MX` lookup is an apex lookup. Subdomain delegation stops, because the `NS` records that delegate are apex records. Certificate issuance stops for challenges that read a `TXT` record at the apex, so renewal fails during the outage and the site cannot be recovered by reissuing.

        Some providers accept the record and answer correctly by flattening it internally, which is why the configuration survives in a zone for years. Moving to the provider's alias type gets the same behavior without depending on that.
      audit: |
        Run the `dig <domain>` command and inspect the answer section for the root domain.

        A passing result shows the root domain resolving through A or AAAA records with no CNAME present. A failing result shows a CNAME record returned for the root domain.
      remediation:
        - id: console
          desc: |
            To replace an apex CNAME using your DNS provider's control panel:

            1. Sign in to the control panel for the provider that hosts the zone and open the DNS records for the domain.
            2. Note the target the apex `CNAME` currently points to, then delete the record.
            3. Create an `A` record at the apex (`@`) pointing to the service IP address. If the target is a hostname whose address changes, create an `ALIAS`, `ANAME`, or `CNAME flattening` record instead, whichever your provider offers.
            4. Save the zone and confirm the apex now returns an address record.
        - id: cli
          desc: |
            To confirm the apex resolves through an address record rather than a CNAME:

            1. Inspect the current apex answer:

                ```bash
                dig +noall +answer example.com CNAME
                dig +noall +answer example.com A
                ```

            2. Remove the apex `CNAME` and publish an `A` or `ALIAS` record through your provider's API or CLI.
            3. Re-run the commands. The `CNAME` query must return no answer and the `A` query must return an address.
        - id: terraform
          desc: |
            To publish an apex address record with Terraform, use the alias-style resource your DNS provider offers rather than a `CNAME`:

            ```hcl
            # AWS Route 53 - alias record at the apex
            resource "aws_route53_record" "apex" {
              zone_id = aws_route53_zone.primary.zone_id
              name    = "example.com"
              type    = "A"

              alias {
                name                   = aws_lb.web.dns_name
                zone_id                = aws_lb.web.zone_id
                evaluate_target_health = true
              }
            }

            # Cloudflare - CNAME flattening applies automatically at the apex
            resource "cloudflare_dns_record" "apex" {
              zone_id = var.cloudflare_zone_id
              name    = "@"
              type    = "CNAME"
              content = "web.example.net"
              proxied = true
              ttl     = 1
            }
            ```
    refs:
      - url: https://www.cisa.gov/dns-security
        title: CISA DNS Security
  - uid: mondoo-dns-security-no-ip-for-ns-mx-records
    title: Ensure NS and MX records are not pointing to IP addresses
    impact: 75
    filters: dns.fqdn == dns.zone.fqdn
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      dns.mx != empty
      dns.mx.all(domainName != regex.ipv4 && domainName != regex.ipv6)
      dns.records.where(type == "NS") != empty
      dns.records.where(type == "NS").all( rdata != regex.ipv4 && rdata != regex.ipv6 )
    docs:
      desc: |
        This check verifies that every `NS` and `MX` record in the zone names a host rather than a literal address, and that both record sets exist at all.

        Both record types are defined to carry a domain name in their data, and the address is resolved separately through that name's `A` or `AAAA` record. In your DNS provider's control panel that means an `NS` record reading `ns1.example.com` and an `MX` record reading `10 mail.example.com`, with each of those hostnames having an address record of its own.

        **Why this matters**

        Resolvers and mail servers are entitled to treat the field as a name, and several of them do exactly that. They read the dotted quad as a hostname, look it up, get no answer, and give up. Because implementations fail differently, the symptom is partial: mail from some senders is delivered and mail from others bounces, while the zone looks correct to whoever configured it.

        The operational cost compounds. A hostname is one place to change an address. A literal address is copied into every record that referenced it, and into every zone anyone else copied it into. When the mail server or nameserver moves, the record nobody remembered keeps pointing at the old address, which is frequently reassigned to someone else. Mail then gets delivered to whoever holds it now.

        There is a disclosure cost as well. Publishing the address directly tells anyone reading the zone which host to attack, without the indirection a name allows, and it forecloses the operational moves that indirection buys: a failover that changes the address behind a stable name, a load-balanced set of mail servers, or a provider migration nobody outside has to notice.

        Publish hostnames, give each one an address record, and confirm the result with `dig NS` and `dig MX`.
      audit: |
        Run the `dig NS <domain>` and `dig MX <domain>` commands and inspect the answer sections.

        A passing result shows every NS and MX record pointing to a hostname such as `ns1.example.com` or `mail.example.com`. A failing result shows any NS or MX record whose target is a literal IPv4 or IPv6 address.
      remediation:
        - id: console
          desc: |
            To replace literal IP addresses in NS and MX records using your DNS provider's control panel:

            1. Sign in to the control panel for the provider that hosts the zone and open the DNS records for the domain.
            2. For each `NS` record whose value is an IP address, create or confirm a hostname for that nameserver (for example `ns1.example.com`), publish an `A`/`AAAA` record for it, then change the `NS` record to reference that hostname.
            3. For each `MX` record whose value is an IP address, replace it with the fully qualified hostname of the mail server (for example `mail.example.com`) and keep the existing preference value.
            4. Delete the records that still carry literal addresses, then save the zone.
        - id: cli
          desc: |
            To confirm no NS or MX record resolves to a literal address:

            1. Inspect the current values:

                ```bash
                dig +noall +answer example.com NS
                dig +noall +answer example.com MX
                ```

            2. Publish hostname-based replacements through your provider's API or CLI, adding `A`/`AAAA` records for any nameserver hostname that does not already have one.
            3. Re-run the commands. Every answer must be a hostname; a passing zone shows values such as `ns1.example.com.` and `10 mail.example.com.`, never a dotted-quad or IPv6 literal.
        - id: terraform
          desc: |
            To publish hostname-based NS and MX records with Terraform:

            ```hcl
            resource "aws_route53_record" "mx" {
              zone_id = aws_route53_zone.primary.zone_id
              name    = "example.com"
              type    = "MX"
              ttl     = 3600
              records = [
                "10 mail.example.com",
                "20 mail2.example.com",
              ]
            }

            resource "aws_route53_record" "ns" {
              allow_overwrite = true
              zone_id         = aws_route53_zone.primary.zone_id
              name            = "example.com"
              type            = "NS"
              ttl             = 172800
              records         = aws_route53_zone.primary.name_servers
            }
            ```

            Route 53 creates the apex `NS` record as soon as the hosted zone exists, so a plain `aws_route53_record` of type `NS` at the apex fails to apply with a "but it already exists" error. `allow_overwrite = true` lets the same run manage the record. Reading the values from `name_servers` also keeps them the hostnames Route 53 assigned, which is what this check requires. Where you run your own nameservers, list their hostnames instead and publish an `A` or `AAAA` record for each.
    refs:
      - url: https://www.cisa.gov/dns-security
        title: CISA DNS Security
  - uid: mondoo-dns-security-no-legacy-ms-365-mx-records
    title: Ensure legacy MX records are not used with Microsoft 365
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      dns.mx.all( domainName.downcase != "mail.outlook.com." )
      dns.mx.all( domainName.downcase != "mail.messaging.microsoft.com." )
      dns.mx.all( domainName.downcase != "mail.global.frontbridge.com." )
      dns.mx.all( domainName.downcase != "mail.global.bigfish.com." )
    docs:
      desc: |
        This check verifies that the domain's `MX` records do not point at Microsoft's retired mail endpoints.

        Four hostnames are checked: `mail.outlook.com`, `mail.messaging.microsoft.com`, `mail.global.frontbridge.com`, and `mail.global.bigfish.com`. Each belonged to an earlier generation of Microsoft's hosted mail, back through Forefront Online Protection and FrontBridge. A current Microsoft 365 tenant publishes a single record under `*.mail.protection.outlook.com`, and the exact value for a domain is shown in the Microsoft 365 admin center under Settings and then Domains. Replace the legacy records with that value at preference `0` in your DNS provider's control panel.

        **Why this matters**

        An `MX` record naming a retired endpoint is a public statement about where your mail goes, and mail follows it. Where the hostname no longer resolves, messages queue at the sender and bounce after several days, and the sender is the one who finds out. Where it does still resolve, the traffic is reaching infrastructure that is no longer part of your tenant, so it bypasses the filtering, the transport encryption negotiation, and the mail flow rules your tenant applies.

        That gap is where an attacker operates. Phishing sent to your users along a path that never touches Microsoft 365 anti-spam arrives without the checks that would have caught it, and quarantine and reporting show nothing, because the message was never seen.

        The stale record is also a reconnaissance signal. An attacker enumerating the zone reads a retired endpoint and infers that the mail configuration has not been reviewed since the migration, which makes the domain a promising target for spoofing attempts and for probing the rest of the zone.

        Publish the current endpoint, delete the four legacy names, and confirm the zone with a `dig MX` query.
      audit: |
        Run the `dig MX <domain>` command and inspect the answer section.

        A passing result shows MX records pointing to current Microsoft 365 endpoints under `*.mail.protection.outlook.com`. A failing result shows an MX record pointing to a legacy host such as `mail.outlook.com` or `mail.global.frontbridge.com`.
      remediation:
        - id: console
          desc: |
            To replace legacy Microsoft 365 MX records using your DNS provider's control panel:

            1. Sign in to the Microsoft 365 admin center, open **Settings > Domains**, select the domain, and copy the MX value Microsoft currently publishes for it. It has the form `<domain-key>.mail.protection.outlook.com`.
            2. Sign in to the control panel for the provider that hosts the zone and open the DNS records for the domain.
            3. Add an `MX` record at the apex with that value and preference `0`.
            4. Delete the legacy records — `mail.outlook.com`, `mail.messaging.microsoft.com`, `mail.global.frontbridge.com`, and `mail.global.bigfish.com` are all retired endpoints.
            5. Save the zone.
        - id: cli
          desc: |
            To confirm the domain uses the current Microsoft 365 mail endpoint:

            1. Inspect the published MX records:

                ```bash
                dig +noall +answer example.com MX
                ```

            2. Replace any retired endpoint with the `*.mail.protection.outlook.com` host shown for the domain in the Microsoft 365 admin center, using your DNS provider's API or CLI.
            3. Re-run the command. A passing zone returns a single `0 <domain-key>.mail.protection.outlook.com.` answer and none of the retired hostnames.
        - id: terraform
          desc: |
            To publish the current Microsoft 365 MX record with Terraform:

            ```hcl
            resource "aws_route53_record" "m365_mx" {
              zone_id = aws_route53_zone.primary.zone_id
              name    = "example.com"
              type    = "MX"
              ttl     = 3600
              records = ["0 example-com.mail.protection.outlook.com"]
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/microsoft-365/admin/get-help-with-domains/create-dns-records-at-any-dns-hosting-provider?view=o365-worldwide
        title: Add DNS records to connect your domain
  - uid: mondoo-dns-security-google-workspaces-mx-records
    title: Ensure the correct MX records are used with Google Workspace
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |-
      dns.mx.where(domainName == /l\.google\.com\./).
        map(domainName.downcase).
        containsOnly(["aspmx.l.google.com.", "alt1.aspmx.l.google.com.", "alt2.aspmx.l.google.com.", "alt3.aspmx.l.google.com.", "alt4.aspmx.l.google.com."])
    docs:
      desc: |
        This check verifies that a domain routing mail through Google Workspace publishes only the canonical Google mail endpoints, with no stale host left behind under the same suffix.

        The records live at the zone apex in your DNS provider's control panel. Google Workspace expects five `MX` records: `aspmx.l.google.com` at preference 1, then `alt1.aspmx.l.google.com` and `alt2.aspmx.l.google.com` at 5, then `alt3.aspmx.l.google.com` and `alt4.aspmx.l.google.com` at 10. The check looks at every record whose target sits under `l.google.com` and requires that set to contain nothing but those five.

        **Why this matters**

        An `MX` record decides where the internet delivers your mail, and anyone can read it. A record pointing at a host that is no longer yours hands mail to whoever controls that host: password resets, invoices, contract attachments, and anything else that arrives by email. The recipient never sees a failure, because delivery succeeded, and the sender has no way to know their message went somewhere else.

        Stale endpoints under `l.google.com` are usually left behind by a migration, a decommissioned regional relay, or a zone file copied between domains. They keep receiving mail for as long as they resolve, and because the domain still works for everyone, nobody investigates.

        Delivering through the canonical endpoints is also what makes Google Workspace's own protections apply. Spam and phishing filtering, transport encryption negotiation between sending servers, and the account-level controls over what happens to a message all sit behind those hosts. Mail that reaches a mailbox by some other path skipped every one of them.

        Publish the five records, delete anything else pointing into Google's mail infrastructure, and confirm the result with a `dig MX` query rather than trusting the control panel view.
      audit: |
        Run the `dig MX <domain>` command and inspect the answer section.

        A passing result shows MX records pointing only to `aspmx.l.google.com` and its `alt1` through `alt4` variants. A failing result shows a record under `l.google.com` that points to any other host.
      remediation:
        - id: console
          desc: |
            To publish the Google Workspace MX records using your DNS provider's control panel:

            1. Sign in to the control panel for the provider that hosts the zone and open the DNS records for the domain.
            2. Add `MX` records at the apex for the five Google endpoints, with these preference values:

                | Preference | Mail server |
                |---|---|
                | 1 | `ASPMX.L.GOOGLE.COM` |
                | 5 | `ALT1.ASPMX.L.GOOGLE.COM` |
                | 5 | `ALT2.ASPMX.L.GOOGLE.COM` |
                | 10 | `ALT3.ASPMX.L.GOOGLE.COM` |
                | 10 | `ALT4.ASPMX.L.GOOGLE.COM` |

            3. Delete any remaining MX records that point at a previous mail provider, so mail cannot be routed to a system nobody monitors.
            4. Save the zone.
        - id: cli
          desc: |
            To confirm the domain routes mail to the Google Workspace endpoints:

            1. Inspect the published MX records:

                ```bash
                dig +noall +answer example.com MX
                ```

            2. Publish the five `ASPMX`/`ALT*.ASPMX` records with the preferences above through your provider's API or CLI, and remove any others.
            3. Re-run the command. A passing zone returns exactly the five Google endpoints and no third-party mail hosts.
        - id: terraform
          desc: |
            To publish the Google Workspace MX records with Terraform:

            ```hcl
            resource "aws_route53_record" "google_mx" {
              zone_id = aws_route53_zone.primary.zone_id
              name    = "example.com"
              type    = "MX"
              ttl     = 3600
              records = [
                "1 ASPMX.L.GOOGLE.COM",
                "5 ALT1.ASPMX.L.GOOGLE.COM",
                "5 ALT2.ASPMX.L.GOOGLE.COM",
                "10 ALT3.ASPMX.L.GOOGLE.COM",
                "10 ALT4.ASPMX.L.GOOGLE.COM",
              ]
            }
            ```
    refs:
      - url: https://support.google.com/a/answer/140034?hl=en
        title: Set up MX records for Google Workspace email
  - uid: mondoo-dns-security-dnssec-enabled
    title: Ensure DNSSEC is enabled
    impact: 75
    filters: dns.fqdn == dns.zone.fqdn
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1557
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: dns.dnssec.enabled
    docs:
      desc: |
        This check verifies that the domain is signed with DNSSEC, by confirming that the zone publishes `DNSKEY` records.

        Signing is enabled at the DNS host, which generates the keys and starts serving `DNSKEY` and `RRSIG` records alongside the existing data. That is only half of it. The registrar must then publish a `DS` record in the parent zone, and until it does, resolvers have no trust anchor to validate against and the signatures are ignored. Where the host and the registrar are the same company, confirm it published the `DS` rather than assuming so, and verify from outside with a `dig DS` query.

        **Why this matters**

        DNS answers are unauthenticated by default, so the safety of a name rests on an attacker not being able to answer first. Anyone who can, does. An attacker on the same network as the client, or one who can get a forged response accepted by a resolver, answers a query for your hostname with an address they control, and every connection that follows goes to their server. From there they collect credentials, serve modified content, or hold the connection open while they answer a certificate challenge and get a genuine certificate issued for your name.

        Cache poisoning makes that scale. A single accepted forgery sits in a resolver's cache and redirects every user behind it until the entry expires, and the operator of the domain sees nothing, because their own servers are answering normally for everyone else.

        DNSSEC closes both routes by signing the records. A validating resolver checks the signature against the chain from the root and discards an answer that does not verify, so a forged response is rejected instead of cached.

        Watch signature expiry and key rollover after enabling it, since a zone whose signatures lapse fails closed for validating resolvers.
      audit: |
        Run the `dig DNSKEY <domain>` command and inspect the answer section.

        A passing result shows one or more DNSKEY records published for the domain. A failing result shows an empty answer section, indicating DNSSEC is not enabled.
      remediation:
        - id: console
          desc: |
            To enable DNSSEC, sign the zone at the DNS host **and** publish the DS record at the registrar. Doing only the first step is the most common reason DNSSEC appears configured but provides no protection:

            1. Sign in to the control panel for the provider that hosts the zone, open the DNS settings for the domain, and enable DNSSEC. The provider generates the signing keys and serves `DNSKEY` and `RRSIG` records.
            2. Copy the DS record the host displays, or the DNSKEY values needed to build it.
            3. Sign in to the domain registrar, open the DNSSEC settings for the domain, and publish that DS record. Until the DS exists in the parent zone, resolvers have no trust anchor and never validate.
            4. If the host and the registrar are the same provider, confirm it published the DS on your behalf rather than assuming it did.
            5. Set a reminder to review signature expiry and any planned key rollover.
        - id: cli
          desc: |
            To confirm the full chain of trust is live, check both the zone signature and the parent-zone delegation:

            1. Confirm the zone is signed:

                ```bash
                dig +noall +answer example.com DNSKEY
                ```

            2. Confirm the registrar published the DS record in the parent zone:

                ```bash
                dig +noall +answer example.com DS
                ```

            3. Confirm a validating resolver accepts the answer:

                ```bash
                dig +dnssec example.com A
                ```

            A passing domain returns DNSKEY records, at least one DS record, and an answer carrying the `ad` (authenticated data) flag. An empty `DS` answer means the zone is signed but the chain of trust is broken at the registrar.
        - id: terraform
          desc: |
            To enable DNSSEC with Terraform, sign the zone and publish the delegation:

            ```hcl
            # Cloudflare - enabling DNSSEC returns the DS values to hand to the registrar
            resource "cloudflare_zone_dnssec" "example" {
              zone_id = var.cloudflare_zone_id
            }

            # AWS Route 53 - sign the zone, then publish the DS at the registrar
            resource "aws_route53_key_signing_key" "example" {
              hosted_zone_id             = aws_route53_zone.primary.id
              key_management_service_arn = aws_kms_key.dnssec.arn
              name                       = "example-ksk"
            }

            resource "aws_route53_hosted_zone_dnssec" "example" {
              depends_on     = [aws_route53_key_signing_key.example]
              hosted_zone_id = aws_route53_key_signing_key.example.hosted_zone_id
            }
            ```

            Terraform can sign the zone, but publishing the DS record at the registrar is a registrar operation. Where the registrar is not the DNS host, complete that step in the registrar's control panel or API.
    refs:
      - url: https://www.icann.org/resources/pages/dnssec-what-is-it-why-is-it-important-2019-03-05-en
        title: ICANN DNSSEC Overview
  - uid: mondoo-dns-security-no-wildcard
    title: Ensure no wildcard DNS records are configured
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/mitre-attack: mitre-attack-t1584-002
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-6
    # Detection has to probe a name that should not exist. A wildcard RR has the
    # owner name `*.example.com`, and the provider only ever queries the exact
    # FQDN, so the wildcard is never present in an answer for `example.com` —
    # matching on `name == /\*/` could not fail. The authoritative server
    # expands the wildcard, so an improbable label resolving is the signal.
    # Uses dns.fqdn rather than domainName.fqdn: domainName errors with
    # "cannot derive eTLD+1" on a name that is itself a public suffix.
    mql: |
      dns(fqdn: "mondoo-wildcard-probe-x7f3q9." + dns.fqdn).records.where(type == "A") == empty
    docs:
      desc: |
        This check verifies that the zone publishes no wildcard record, meaning a record whose owner name is `*` and which therefore answers for every label nobody defined explicitly.

        Detection works by asking for a name that should not exist. An answer for an invented subdomain means a wildcard expanded it. The fix in your DNS provider's control panel is to enumerate the subdomains currently depending on the wildcard, publish an explicit `A` or `CNAME` record for each, and only then delete the wildcard.

        **Why this matters**

        A wildcard makes every name an attacker invents resolve to your infrastructure, and the name is what users and filters trust. An attacker who can get content served from your servers, through a hosted-content path, an open redirect, or a virtual host that answers with a default site, now serves it from `login-secure.example.com` or `billing-update.example.com`, hostnames that did not exist until they typed them. Those names carry your registrable domain, they resolve, and a certificate authority will issue for them on request, so the phishing page arrives with a valid certificate and a padlock.

        The same property defeats controls written in terms of names. Cookies scoped to the parent domain are sent to the invented host. Content policies, mail filters, and proxy allowlists that trust your domain trust it too. Takedown is slower, because the abusive name is genuinely yours.

        A wildcard also erases the boundary of what you expose. Nobody can enumerate what the zone answers for, so an inventory of your public surface cannot be produced from the zone at all.

        Where a wildcard is genuinely required, a multi-tenant product provisioning customer subdomains on demand being the usual case, keep it deliberate. Document why it exists and monitor which names actually get requested, because the wildcard answers for every name an attacker invents.
      audit: |
        A wildcard is detected by asking for a name that should not exist. If the zone answers for an arbitrary label, a wildcard is expanding it.

        1. Query an improbable subdomain:

            ```bash
            dig +noall +answer wildcard-probe-x7f3q9.example.com A
            ```

            A passing domain returns nothing, because the name genuinely does not exist. A failing domain returns an address, meaning a wildcard answered for a name nobody published.

        2. Confirm by querying the wildcard record directly. A wildcard is a real resource record whose owner name is `*`, so it can be looked up:

            ```bash
            dig +noall +answer '*.example.com' A
            ```

            An answer here names the wildcard target explicitly.

        Note that step 1 is the reliable test. Querying the zone apex or any specific hostname will never reveal a wildcard, because the authoritative server expands the wildcard and answers with the name that was asked for.
      remediation:
        - id: console
          desc: |
            To remove a wildcard record using your DNS provider's control panel:

            1. Sign in to the control panel for the provider that hosts the zone and open the DNS records for the domain.
            2. Find records whose name begins with `*`, such as `*.example.com`, and list the subdomains that legitimately rely on them.
            3. Create an explicit record for each of those subdomains.
            4. Delete the wildcard record once the explicit records resolve correctly.
            5. If a wildcard is genuinely required — a multi-tenant product that provisions customer subdomains on demand, for example — document the reason and monitor which names get requested, since a wildcard answers for every name an attacker invents.
        - id: cli
          desc: |
            To confirm the zone publishes no wildcard record:

            1. Query a name that should not exist:

                ```bash
                dig +noall +answer this-name-should-not-exist.example.com A
                ```

            2. Replace any wildcard with explicit records for the subdomains that need them, using your provider's API or CLI.
            3. Re-run the command. A passing zone returns no answer; a zone with a wildcard still in place returns an address for the invented name.
        - id: terraform
          desc: |
            To replace a wildcard with explicit records in Terraform, declare each subdomain you actually serve:

            ```hcl
            resource "aws_route53_record" "www" {
              zone_id = aws_route53_zone.primary.zone_id
              name    = "www.example.com"
              type    = "A"
              ttl     = 300
              records = ["203.0.113.10"]
            }

            resource "aws_route53_record" "api" {
              zone_id = aws_route53_zone.primary.zone_id
              name    = "api.example.com"
              type    = "A"
              ttl     = 300
              records = ["203.0.113.11"]
            }
            ```

            Remove any `name = "*.example.com"` resource once the explicit records are in place.
    refs:
      - url: https://www.cisa.gov/dns-security
        title: CISA DNS Security
  - uid: mondoo-dns-security-ns-redundancy
    title: Ensure at least two NS records exist
    impact: 60
    filters: dns.fqdn == dns.zone.fqdn
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-14
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ip-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-3-1-2
    mql: |
      dns.records.where(type == "NS") != empty
      dns.records.where(type == "NS").first.rdata.length >= 2
    docs:
      desc: |
        This check verifies that the domain is delegated to at least two authoritative nameservers.

        The `NS` records at the zone apex list them, and the registrar's delegation in the parent zone must name the same set. Most managed DNS providers assign four nameservers on separate networks when the zone is created, so this usually passes on its own, and a single `NS` record generally means a hand-built zone or a self-hosted nameserver. RFC 1034 has recommended multiple nameservers for a domain since the protocol was defined.

        **Why this matters**

        One nameserver is one machine standing between your domain and the internet. When it stops answering, every name under the domain becomes unresolvable as soon as the cached records expire. That is not only the website. Mail stops being delivered because the `MX` lookup fails, certificate renewal stops because the issuance challenge cannot be resolved, and monitoring that reaches your services by name goes dark alongside the services, so the outage is invisible in exactly the tooling meant to report it.

        A single nameserver is also the cheapest denial of service target available. There is no need to attack the application, the load balancer, or the origin. Saturating one address takes the whole domain offline, and it takes it offline for everyone rather than for the users routed to one region. Spreading authority across nameservers on different networks, ideally at two providers, means an attacker has to hold all of them down at once, and a provider-wide outage does not automatically become your outage.

        Publish the `NS` records in the zone and confirm the registrar's delegation matches. The two are separate records in separate places, and a domain whose zone lists redundant nameservers while the parent delegates to one is still delegated to one.
      audit: |
        Run the `dig NS <domain>` command and inspect the answer section.

        A passing result shows two or more NS records returned for the domain. A failing result shows a single NS record or none, indicating no nameserver redundancy.
      remediation:
        - id: console
          desc: |
            To add nameserver redundancy using your DNS provider's control panel:

            1. Sign in to the control panel for the provider that hosts the zone and open the DNS records for the domain.
            2. Review the `NS` records at the apex. If only one is present, add at least one more.
            3. Prefer nameservers on separate networks, ideally at a second DNS provider, so a single provider outage cannot take the domain offline. Most managed DNS providers assign four nameservers across distinct networks by default.
            4. Update the nameserver delegation at the domain registrar so the parent zone lists the same set.
            5. Save the zone.
        - id: cli
          desc: |
            To confirm the domain has redundant authoritative nameservers:

            1. Inspect the delegation:

                ```bash
                dig +noall +answer example.com NS
                ```

            2. Confirm each one answers authoritatively for the zone:

                ```bash
                dig @ns1.example.com example.com SOA
                dig @ns2.example.com example.com SOA
                ```

            3. A passing domain lists two or more `NS` records and every one returns the SOA. A single `NS` record, or one that fails to answer, is a single point of failure.
        - id: terraform
          desc: |
            To declare redundant nameservers with Terraform:

            ```hcl
            resource "aws_route53_zone" "primary" {
              name = "example.com"
            }

            resource "aws_route53_record" "ns" {
              allow_overwrite = true
              zone_id         = aws_route53_zone.primary.zone_id
              name            = "example.com"
              type            = "NS"
              ttl             = 172800
              records         = aws_route53_zone.primary.name_servers
            }

            resource "aws_route53domains_registered_domain" "primary" {
              domain_name = "example.com"

              dynamic "name_server" {
                for_each = aws_route53_zone.primary.name_servers
                content {
                  name = name_server.value
                }
              }
            }
            ```

            Route 53 assigns four nameservers on distinct networks when the hosted zone is created and publishes them as the apex `NS` record, so the redundancy comes from the zone itself. Managing that record in Terraform needs `allow_overwrite = true`, because the record already exists the moment the zone does. Do not substitute hostnames of your own choosing: replacing the set with nameservers that do not serve the zone breaks resolution for the whole domain.

            Publishing the NS set in the zone is only half of it, because the registrar's delegation must list the same nameservers. The `aws_route53domains_registered_domain` resource does that for domains registered with Route 53. For a registrar with no Terraform provider, copy the `name_servers` output into its control panel.
    refs:
      - url: https://datatracker.ietf.org/doc/html/rfc1034#section-4.1
        title: 'RFC 1034: Domain Names - Concepts and Facilities'
  - uid: mondoo-dns-security-reasonable-ttls
    title: Ensure DNS record TTLs are not suspiciously low
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/mitre-attack: mitre-attack-t1568-001
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: dns.records.where(type.in(["A", "AAAA"])).all(ttl == null || ttl >= 60)
    docs:
      desc: |
        This check verifies that the `A` and `AAAA` records in the zone carry a TTL of at least 60 seconds.

        The TTL is the per-record field telling resolvers how long they may cache an answer, set in the TTL column of your DNS provider's control panel. Production address records normally sit between 300 and 3600 seconds. The check accepts any value of 60 or above, and also accepts a record whose TTL the provider does not report.

        **Why this matters**

        A TTL of a few seconds is the signature of fast flux, the technique malware operators use to keep a command-and-control name alive by rotating it through a large pool of compromised hosts. Legitimate services rarely need it, so a very short TTL on a production record is worth explaining rather than accepting. Where a domain has been taken over, the shortened TTL is often the first visible change, because it is what lets the attacker move the name quickly and move it back just as quickly if they are noticed.

        The more common cause is more mundane and still worth fixing. A TTL is dropped to 60 seconds or less ahead of a migration so the cutover propagates quickly, and then nobody restores it. The record stays that way for years, and every resolver on the internet re-queries your nameservers for it constantly. That multiplies query load, and it converts any brief nameserver unavailability into an immediate outage, because almost nothing is still cached to ride it out.

        Raise the value once a cutover is finished, and treat a low TTL on a record with no migration in progress as a change to investigate rather than as a preference somebody expressed.
      audit: |
        Run the `dig <domain>` command and inspect the TTL column of the A and AAAA records in the answer section.

        A passing result shows every A and AAAA record with a TTL of 60 seconds or greater. A failing result shows an A or AAAA record with a TTL below 60 seconds.
      remediation:
        - id: console
          desc: |
            To raise suspiciously low TTLs using your DNS provider's control panel:

            1. Sign in to the control panel for the provider that hosts the zone and open the DNS records for the domain.
            2. Review the TTL column for every `A` and `AAAA` record and note any below 60 seconds.
            3. Set production records to at least 300 seconds. Values between 300 and 3600 are typical.
            4. If a low TTL was set deliberately to shorten a cutover window, restore the normal value once the migration is finished rather than leaving it in place.
            5. Save the zone.
        - id: cli
          desc: |
            To confirm no address record carries an unusually low TTL:

            1. Inspect the TTL column, which is the second field of each answer:

                ```bash
                dig +noall +answer example.com A
                dig +noall +answer example.com AAAA
                ```

            2. Raise any value below 60 through your provider's API or CLI.
            3. Re-run the commands against an authoritative nameserver so a cached answer does not show a decremented TTL:

                ```bash
                dig @ns1.example.com +noall +answer example.com A
                ```
        - id: terraform
          desc: |
            To set explicit production TTLs with Terraform:

            ```hcl
            resource "aws_route53_record" "www" {
              zone_id = aws_route53_zone.primary.zone_id
              name    = "www.example.com"
              type    = "A"
              ttl     = 300
              records = ["203.0.113.10"]
            }
            ```

            Where a short TTL is needed for a planned cutover, change `ttl` in a dedicated commit and revert it once the migration completes, so the low value does not silently become permanent.
    refs:
      - url: https://www.cisa.gov/dns-security
        title: CISA DNS Security
