  - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled
    title: Ensure managed databases have termination protection enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: false
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-5
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Exoscale managed database services are protected against deletion and power-off.

                Termination protection makes the Exoscale API refuse to delete or power off a database service until the protection is removed in a separate, deliberate step. The check requires it on every service.

        **Why this matters**

        Deleting a managed database deletes its data and, after the retention period, its backups. Without protection, one mistaken command, a script run against the wrong zone, or an attacker holding a leaked API key can destroy a production database in a single call.

        Protection turns that single call into two, the second of which is easy to alert on. Remove it only for the duration of a planned decommission.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **DBaaS**.
        2. Open each service and review whether termination protection is enabled.

        A passing service has termination protection enabled. A failing service has it disabled.

        ### Audit via CLI

        ```bash
        exo dbaas show <service> -z <zone> -O json
        ```

        A passing service reports `termination_protection` as `true`. A failing service reports `false`.
      remediation:
        - id: console
          desc: |
            To enable termination protection using the Exoscale Portal:

            1. Open **DBaaS** and select the service.
            2. Enable **Termination protection** and save.
        - id: cli
          desc: |
            To enable termination protection using the Exoscale CLI:

            ```bash
            exo dbaas update <service> -z <zone> --termination-protection
            ```
        - id: terraform
          desc: |
            To enable termination protection using Terraform, set `termination_protection`, or leave it unset since it defaults to `true`:

            ```hcl
            resource "exoscale_dbaas" "db" {
              zone                   = "ch-gva-2"
              name                   = "app-db"
              type                   = "pg"
              plan                   = "startup-4"
              termination_protection = true

              pg = {
                version   = "16"
                ip_filter = ["203.0.113.0/24"]
              }
            }
            ```
    refs:
      - url: https://registry.terraform.io/providers/exoscale/exoscale/latest/docs/resources/dbaas
        title: Terraform exoscale_dbaas
  - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-exoscale
    filters: asset.platform == "exoscale-dbaas-service"
    mql: |
      exoscale.dbaas.service.terminationProtection == true
  - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "exoscale_dbaas")
    mql: |
      terraform.resources("exoscale_dbaas").all(
        arguments['termination_protection'] != false
      )
  - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "exoscale_dbaas")
    mql: |
      terraform.plan.resourceChanges.where(type == "exoscale_dbaas").all(
        change.after.termination_protection != false
      )
  - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "exoscale_dbaas")
    mql: |
      terraform.state.resources.where(type == "exoscale_dbaas").all(
        values.termination_protection != false
      )

  # No Terraform variants: The exoscale_kms_key Terraform resource has no rotation argument, so a Terraform configuration cannot express or reveal the rotation setting. Revisit when the provider adds one.
  - uid: mondoo-exoscale-security-kms-key-rotation-enabled
    title: Ensure KMS keys rotate their key material automatically
    impact: 70
    filters: asset.platform == "exoscale-organization"
    mql: |
      exoscale.kmsKeys.where(status == "enabled").all(rotationEnabled == true)
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-7-4
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    docs:
      desc: |
        This check verifies that enabled Exoscale KMS keys rotate their key material automatically.

                With automatic rotation, Exoscale generates new key material on a fixed period (365 days by default, configurable from 90 to 2560 days) and uses it for new encryption, while older versions stay available to decrypt existing data. The check requires automatic rotation on every enabled key.

        **Why this matters**

        The longer one key version encrypts data, the more data a single compromise of that version exposes, and the longer an undetected leak stays useful to an attacker. Rotation bounds both.

        Rotation is transparent to callers, because decryption selects the matching key version automatically, so there is little operational reason to leave it off.
      audit: |
        ### Audit via CLI

        1. List the KMS keys in each zone:

        ```bash
        exo kms key list -z <zone> -O json
        ```

        2. For each key with `status` `enabled`, review `rotation.automatic`.

        A passing key reports `rotation.automatic` as `true`. A failing key reports `false`.
      remediation:
        - id: console
          desc: |
            To enable rotation using the Exoscale Portal:

            1. Open **KMS** and select the key.
            2. Enable automatic rotation and choose the rotation period.
        - id: cli
          desc: |
            To enable rotation using the Exoscale CLI:

            ```bash
            exo kms key enable-rotation <key-id> -z <zone> --rotation-period 365
            ```
        # No Terraform remediation: The exoscale_kms_key Terraform resource has no rotation argument. Revisit when the provider adds one.
    refs:
      - url: https://community.exoscale.com/product/security/kms/
        title: Exoscale KMS

  # No Terraform variants: Organization users are invited and manage their own second factor in the Exoscale Portal, which no Terraform resource models.
  - uid: mondoo-exoscale-security-iam-user-two-factor-enabled
    title: Ensure every organization user has two-factor authentication enabled
    impact: 90
    filters: asset.platform == "exoscale-organization"
    mql: |
      exoscale.iamUsers.where(sso != true).all(twoFactorAuthentication == true)
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-4-2
      compliance/soc2-2017: soc2-control-cc6-6-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    docs:
      desc: |
        This check verifies that every user of the Exoscale organization who signs in with a password also uses two-factor authentication.

                Exoscale users can protect their account with a time-based one-time password in addition to their password. Users who sign in through single sign-on authenticate with your identity provider instead and are excluded, since their second factor is enforced there. The check requires two-factor authentication for every other user.

        **Why this matters**

        An Exoscale user can create API keys, read database credentials, and delete infrastructure. Passwords alone fall to phishing, reuse from other breaches, and credential stuffing, and a single compromised account can then act with that user's full role.

        A second factor stops those attacks from completing a login. Users with an organization role such as Owner need it most, because their accounts can also change IAM policies and create new API keys.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **IAM**, then **Users**.
        2. Review the two-factor authentication status of each user who does not sign in through SSO.

        A passing organization shows two-factor authentication enabled for every such user. A failing organization has at least one user without it.
      remediation:
        - id: console
          desc: |
            Each user enables two-factor authentication for their own account in the Exoscale Portal:

            1. Sign in and open the account settings from the user menu.
            2. Enable two-factor authentication and enroll an authenticator app.

            Organization owners should ask each listed user to enroll, and remove users who no longer need access.
        - id: cli
          desc: |
            The Exoscale CLI cannot enroll a second factor, which happens in the Exoscale Portal. Use it to review the API keys a user created while you follow up:

            ```bash
            exo iam api-key list
            ```
        # No Terraform remediation: Second-factor enrollment is a per-user action in the Exoscale Portal with no Terraform resource.
    refs:
      - url: https://community.exoscale.com/product/iam/
        title: Exoscale IAM

  # No Terraform variants: exoscale_iam_api_key references its role by ID, and the Owner system role is not declared in Terraform, so the role a key receives cannot be resolved from configuration. Revisit if the provider exposes system roles as a data source.
  - uid: mondoo-exoscale-security-iam-api-key-not-owner-role
    title: Ensure no API key is bound to the Owner role
    impact: 80
    filters: asset.platform == "exoscale-organization"
    mql: |
      exoscale.iamApiKeys.none(role.name == "Owner" && role.editable == false)
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-5
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    docs:
      desc: |
        This check verifies that no Exoscale API key is bound to the built-in Owner role.

                Every Exoscale API key is bound to an IAM role that decides what the key can do. The Owner system role allows every operation in the organization, including managing IAM itself. The check requires API keys to use a custom role scoped to the services and operations the key's job needs.

        **Why this matters**

        API keys end up in CI systems, Terraform state, configuration files, and developer laptops, and they do not expire on their own. A leaked Owner key gives its holder full control: they can delete every resource, read database credentials, and create new keys to keep access after the leaked one is revoked.

        A key bound to a narrow role limits the damage of the same leak to what that role allows. Create a role per use case, for example read-only compute access for an inventory scanner, and bind each key to the narrowest role that works.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **IAM**, then **API Keys**.
        2. Review the role of each key.

        A passing organization has no API key with the Owner role. A failing organization has at least one.

        ### Audit via CLI

        ```bash
        exo iam api-key list -O json
        exo iam role show Owner -O json
        ```

        Compare each key's `role-id` with the `id` of the Owner role. A passing organization has no key with that role ID.
      remediation:
        - id: console
          desc: |
            To replace an Owner key using the Exoscale Portal:

            1. Open **IAM**, then **Roles**, and create a role that allows only the services and operations the key needs.
            2. Open **API Keys** and create a new key bound to that role.
            3. Update the systems that use the old key, then delete it.
        - id: cli
          desc: |
            To replace an Owner key using the Exoscale CLI, create a key bound to a narrower role, roll it out, then delete the old key:

            ```bash
            exo iam role list
            exo iam api-key create ci-deploy <scoped-role-name>
            exo iam api-key delete <old-key>
            ```
        # No Terraform remediation: The Owner role is a system role that Terraform cannot reference by name, so the fix is choosing a custom role ID for exoscale_iam_api_key, which the CLI steps already cover.
    refs:
      - url: https://community.exoscale.com/product/iam/
        title: Exoscale IAM
