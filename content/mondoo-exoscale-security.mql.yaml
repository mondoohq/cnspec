  - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled
    title: Ensure SKS clusters upgrade the control plane automatically
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-1-ii-b-security-management-process-risk-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-4-8
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Exoscale SKS Kubernetes clusters receive control plane patch releases automatically.

                With automatic upgrades enabled, Exoscale moves the control plane to the latest patch release of its Kubernetes minor version as patches ship. The setting is off by default. The check requires it to be on for every cluster.

        **Why this matters**

        Kubernetes patch releases carry fixes for API server and control plane vulnerabilities, including privilege escalation and authorization bypass flaws. A control plane that waits for someone to remember the upgrade stays exposed for weeks or months after a fix is public.

        Patch releases do not change the Kubernetes minor version, so the upgrade carries little compatibility risk. Node pools are upgraded separately and still need their own rollout.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **Compute**, then **SKS**.
        2. Open each cluster and review whether automatic upgrades are enabled.

        A passing cluster has automatic upgrades enabled. A failing cluster has them disabled.

        ### Audit via CLI

        ```bash
        exo compute sks list
        exo compute sks show <cluster> -z <zone> -O json
        ```

        A passing cluster reports `auto_upgrade` as `true`. A failing cluster reports `false`.
      remediation:
        - id: console
          desc: |
            To enable automatic upgrades using the Exoscale Portal:

            1. Open **Compute**, then **SKS**, and select the cluster.
            2. Enable **Auto upgrade** and save.
        - id: cli
          desc: |
            To enable automatic upgrades using the Exoscale CLI:

            ```bash
            exo compute sks update <cluster> -z <zone> --auto-upgrade
            ```
        - id: terraform
          desc: |
            To enable automatic upgrades using Terraform, set `auto_upgrade`:

            ```hcl
            resource "exoscale_sks_cluster" "prod" {
              zone         = "ch-gva-2"
              name         = "prod"
              auto_upgrade = true
            }
            ```
    refs:
      - url: https://registry.terraform.io/providers/exoscale/exoscale/latest/docs/resources/sks_cluster
        title: Terraform exoscale_sks_cluster
  - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-exoscale
    filters: asset.platform == "exoscale-sks-cluster"
    mql: |
      exoscale.sks.cluster.autoUpgrade == true
  - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "exoscale_sks_cluster")
    mql: |
      terraform.resources("exoscale_sks_cluster").all(
        arguments['auto_upgrade'] == true
      )
  - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "exoscale_sks_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "exoscale_sks_cluster").all(
        change.after.auto_upgrade == true
      )
  - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled-terraform-state
