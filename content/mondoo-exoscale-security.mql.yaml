        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Exoscale compute instances have a virtual Trusted Platform Module.

                A virtual TPM gives the instance a hardware-backed store for keys and a record of boot measurements. Operating systems use it for measured boot, for disk encryption keys sealed to a known-good boot state, and for platform attestation. The check requires the TPM to be enabled on every instance.

        **Why this matters**

        Without a TPM, disk encryption keys and machine credentials live in files or memory where an attacker with root access can copy them and reuse them elsewhere. Keys sealed in a TPM cannot be exported, so a stolen disk image or a copied credential file is not enough to impersonate the machine.

        Measured boot also lets you detect a tampered boot chain after the fact. Enable the TPM together with Secure Boot.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **Compute**, then **Instances**.
        2. Open each instance and review whether the TPM is enabled.

        A passing instance has the TPM enabled. A failing instance has it disabled.

        ### Audit via CLI

        ```bash
        exo compute instance list
        exo compute instance show <instance> -z <zone> -O json
        ```

        A passing instance reports `tpm` as `true`. A failing instance reports `false`.
      remediation:
        - id: console
          desc: |
            To create an instance with a TPM using the Exoscale Portal:

            1. Open **Compute**, then **Instances**, and select **Add**.
            2. Enable **TPM** and create the instance, then move the workload from the old instance.
        - id: cli
          desc: |
            To create an instance with a TPM using the Exoscale CLI:

            ```bash
            exo compute instance create web-1 \
              --zone ch-gva-2 \
              --template "Linux Ubuntu 24.04 LTS 64-bit" \
              --instance-type standard.small \
              --secureboot \
              --tpm
            ```
        - id: terraform
          desc: |
            To enable the TPM using Terraform, set `enable_tpm`. Enabling it stops and restarts the instance:

            ```hcl
            data "exoscale_template" "ubuntu" {
              zone = "ch-gva-2"
              name = "Linux Ubuntu 24.04 LTS 64-bit"
            }

            resource "exoscale_compute_instance" "web" {
              zone               = "ch-gva-2"
              name               = "web-1"
              template_id        = data.exoscale_template.ubuntu.id
              type               = "standard.small"
              disk_size          = 10
              enable_secure_boot = true
              enable_tpm         = true
            }
            ```
    refs:
      - url: https://registry.terraform.io/providers/exoscale/exoscale/latest/docs/resources/compute_instance
        title: Terraform exoscale_compute_instance
