policies:
  - uid: mondoo-exoscale-security
    name: Mondoo Exoscale Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: exoscale,cloud
      mondoo.com/icon: exoscale
    require:
      - provider: exoscale
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Exoscale security groups, instances, SKS clusters, managed databases, KMS keys, and IAM access
    docs:
      desc: |
        The Mondoo Exoscale Security policy identifies misconfigurations that could leave an Exoscale organization open to attackers. It focuses on network exposure, boot integrity, Kubernetes control plane hygiene, database access, key management, and identity controls.

        This policy provides security checks across key Exoscale resources:

        - Security groups
        - Compute instances
        - SKS Kubernetes clusters
        - Managed databases (DBaaS)
        - KMS keys
        - IAM users and API keys

        Exoscale encrypts block storage volumes and instance disks by default and exposes no setting to turn that off, so the policy does not check it. The Kubernetes API server allow-list of SKS clusters is not checked yet, because Exoscale does not document a way to change it from its CLI, Terraform provider, or API.

        Learn more about scanning Exoscale in the [cnspec Exoscale documentation](https://mondoo.com/docs/cnspec/cloud/exoscale).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Security Groups
        checks:
          - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh
          - uid: mondoo-exoscale-security-security-group-no-unrestricted-rdp
          - uid: mondoo-exoscale-security-security-group-no-unrestricted-db-ports
          - uid: mondoo-exoscale-security-security-group-no-all-ports-open
      - title: Compute Instances
        checks:
          - uid: mondoo-exoscale-security-compute-instance-secure-boot-enabled
          - uid: mondoo-exoscale-security-compute-instance-tpm-enabled
      - title: SKS Kubernetes Clusters
        checks:
          - uid: mondoo-exoscale-security-sks-cluster-auto-upgrade-enabled
          - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled
      - title: Managed Databases (DBaaS)
        checks:
          - uid: mondoo-exoscale-security-dbaas-ip-filter-restricted
          - uid: mondoo-exoscale-security-dbaas-termination-protection-enabled
      - title: Key Management
        checks:
          - uid: mondoo-exoscale-security-kms-key-rotation-enabled
      - title: Identity and Access
        checks:
          - uid: mondoo-exoscale-security-iam-user-two-factor-enabled
          - uid: mondoo-exoscale-security-iam-api-key-not-owner-role
queries:
  - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh
    title: Ensure no security group allows unrestricted inbound SSH (port 22)
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Exoscale security group allows inbound SSH from the entire internet.

                An Exoscale security group is a stateful firewall attached to compute instances, instance pools, and SKS node pools. A rule admits SSH from anywhere when it is an ingress TCP rule whose port range includes `22` and whose source network is `0.0.0.0/0` or `::/0`. You manage these rules under **Compute**, **Security Groups** in the Exoscale Portal. The check requires that no rule open port 22 to either unrestricted source.

        **Why this matters**

        Internet-facing SSH attracts constant automated login attempts. Brute-force and credential-stuffing traffic finds a new listener within minutes, and a single weak or reused credential turns that noise into an interactive shell on the instance.

        Key-based authentication narrows but does not remove the exposure. An open rule publishes the SSH daemon itself, so any pre-authentication vulnerability in it is reachable by every host on the internet until the instance is patched.

        A compromised instance becomes a pivot into private networks, managed databases, and SKS clusters that were never meant to be reachable from outside. Restrict the source to a bastion host, a VPN egress range, or another security group, and add the restricted rule before deleting the open one so you keep access.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **Compute**, then **Security Groups**.
        2. Open each security group and review its **Ingress** rules.
        3. Look for a TCP rule whose port range includes `22` with a source of `0.0.0.0/0` or `::/0`.

        A passing security group has no such rule. A failing security group has at least one.

        ### Audit via CLI

        1. List the security groups and show each one with its rules:

        ```bash
        exo compute security-group list
        exo compute security-group show <security-group> -O json
        ```

        2. Review the `ingress_rules` array for an entry with protocol `tcp`, a port range that includes `22`, and network `0.0.0.0/0` or `::/0`.

        A passing security group returns no such rule. A failing security group returns at least one.
      remediation:
        - id: console
          desc: |
            To restrict the rule using the Exoscale Portal:

            1. Open **Compute**, then **Security Groups**, and select the security group.
            2. Add an ingress rule for TCP port 22 whose source is the trusted CIDR range that needs access, such as a bastion host or VPN egress range.
            3. Delete the rule whose source is `0.0.0.0/0` or `::/0`.
        - id: cli
          desc: |
            To restrict the rule using the Exoscale CLI:

            1. Show the security group and note the ID of the open rule.
            2. Add a rule scoped to the trusted CIDR range, then delete the open rule. Adding the restricted rule first keeps access from the trusted range uninterrupted.

            ```bash
            exo compute security-group show <security-group>
            exo compute security-group rule add <security-group> \
              --flow ingress --protocol tcp --port 22 \
              --network 203.0.113.0/24
            exo compute security-group rule delete <security-group> <rule-id>
            ```
        - id: terraform
          desc: |
            To restrict the rule using Terraform, set `cidr` to a trusted range instead of `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "exoscale_security_group" "web" {
              name = "web"
            }

            resource "exoscale_security_group_rule" "ssh" {
              security_group_id = exoscale_security_group.web.id
              type              = "INGRESS"
              protocol          = "TCP"
              cidr              = "203.0.113.0/24"
              start_port        = 22
              end_port          = 22
            }
            ```
    refs:
      - url: https://community.exoscale.com/product/compute/instances/how-to/security-groups/
        title: Exoscale security groups
  - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-exoscale
    filters: asset.platform == "exoscale-security-group"
    mql: |
      exoscale.securityGroup.rules.none(direction == "ingress" && protocol == "tcp" && startPort <= 22 && endPort >= 22 && network.in(["0.0.0.0/0", "::/0"]))
  - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "exoscale_security_group_rule")
    mql: |
      terraform.resources("exoscale_security_group_rule").all(
        arguments['type'].downcase != "ingress" ||
          arguments['protocol'] != null && arguments['protocol'].downcase != "tcp" ||
          arguments['start_port'] > 22 ||
          arguments['end_port'] < 22 ||
          arguments['cidr'] == null ||
          arguments['cidr'].notIn(["0.0.0.0/0", "::/0"])
      )
  - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "exoscale_security_group_rule")
    mql: |
      terraform.plan.resourceChanges.where(type == "exoscale_security_group_rule").all(
        change.after['type'].downcase != "ingress" ||
          change.after['protocol'] != null && change.after['protocol'].downcase != "tcp" ||
          change.after['start_port'] > 22 ||
          change.after['end_port'] < 22 ||
          change.after['cidr'] == null ||
          change.after['cidr'].notIn(["0.0.0.0/0", "::/0"])
      )
  - uid: mondoo-exoscale-security-security-group-no-unrestricted-ssh-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "exoscale_security_group_rule")
    mql: |
      terraform.state.resources.where(type == "exoscale_security_group_rule").all(
        values['type'].downcase != "ingress" ||
          values['protocol'] != null && values['protocol'].downcase != "tcp" ||
          values['start_port'] > 22 ||
          values['end_port'] < 22 ||
          values['cidr'] == null ||
          values['cidr'].notIn(["0.0.0.0/0", "::/0"])
      )

