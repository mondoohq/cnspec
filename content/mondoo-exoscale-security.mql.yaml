  - uid: mondoo-exoscale-security-compute-instance-secure-boot-enabled
    title: Ensure compute instances boot with UEFI Secure Boot
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-3
    variants:
      - uid: mondoo-exoscale-security-compute-instance-secure-boot-enabled-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-compute-instance-secure-boot-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-compute-instance-secure-boot-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-compute-instance-secure-boot-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Exoscale compute instances boot with UEFI Secure Boot.

                Secure Boot has the firmware verify the signature of the boot loader and kernel before running them, so only software signed by a trusted key starts. Exoscale offers it on instances created from UEFI templates, and it can only be chosen when the instance is created. The check requires Secure Boot to be enabled on every instance.

        **Why this matters**

        Without Secure Boot, an attacker who gains root on an instance can replace the boot loader or kernel with a modified one. Bootkits and rootkits installed that way load before the operating system and its security tooling, survive reinstalling packages, and hide from anything running inside the instance.

        Secure Boot breaks that persistence path: a tampered boot chain fails verification and does not start. Pair it with a virtual TPM so the boot measurements can also be attested.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **Compute**, then **Instances**.
        2. Open each instance and review whether Secure Boot is enabled.

        A passing instance has Secure Boot enabled. A failing instance has it disabled.

        ### Audit via CLI

        ```bash
        exo compute instance list
        exo compute instance show <instance> -z <zone> -O json
        ```

        A passing instance reports `secureboot` as `true`. A failing instance reports `false`.
      remediation:
        - id: console
          desc: |
            Secure Boot can only be chosen when an instance is created. To replace an instance with one that has Secure Boot using the Exoscale Portal:

            1. Snapshot or back up the instance data you need to keep.
            2. Open **Compute**, then **Instances**, and select **Add**.
            3. Choose a UEFI template, enable **Secure Boot**, and recreate the instance with the same configuration.
            4. Move the workload and delete the old instance.
        - id: cli
          desc: |
            To create a replacement instance with Secure Boot using the Exoscale CLI:

            ```bash
            exo compute instance create web-1 \
              --zone ch-gva-2 \
              --template "Linux Ubuntu 24.04 LTS 64-bit" \
              --instance-type standard.small \
              --secureboot \
              --tpm
            ```
        - id: terraform
          desc: |
            To enable Secure Boot using Terraform, set `enable_secure_boot`. Changing it replaces the instance:

            ```hcl
            data "exoscale_template" "ubuntu" {
              zone = "ch-gva-2"
              name = "Linux Ubuntu 24.04 LTS 64-bit"
            }

            resource "exoscale_compute_instance" "web" {
              zone               = "ch-gva-2"
              name               = "web-1"
              template_id        = data.exoscale_template.ubuntu.id
              type               = "standard.small"
              disk_size          = 10
              enable_secure_boot = true
              enable_tpm         = true
            }
            ```
