  - uid: mondoo-exoscale-security-security-group-no-unrestricted-db-ports
    title: Ensure no security group exposes database ports to the internet
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-db-ports-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-db-ports-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-db-ports-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-security-group-no-unrestricted-db-ports-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Exoscale security group exposes common database and data-store ports to the entire internet.

                The check covers MySQL (`3306`), PostgreSQL (`5432`), SQL Server (`1433`), Oracle (`1521`), Redis and Valkey (`6379`), MongoDB (`27017`), Elasticsearch and OpenSearch (`9200`), Kafka (`9092`), CouchDB (`5984`), and Memcached (`11211`). A rule fails when it is an ingress TCP rule whose port range includes any of these ports and whose source network is `0.0.0.0/0` or `::/0`.

        **Why this matters**

        Data stores reachable from the internet are found by mass scanners within hours. Several of these services ship without authentication by default, and attackers have wiped and ransomed tens of thousands of exposed MongoDB, Elasticsearch, and Redis instances in automated campaigns.

        Even with authentication enabled, an exposed database invites credential brute forcing and puts any unpatched server vulnerability one connection away from your data. Keep databases on private networks, and let only the application tier's security group or a specific CIDR range reach them.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **Compute**, then **Security Groups**.
        2. Open each security group and review its **Ingress** rules.
        3. Look for a TCP rule whose port range includes `3306`, `5432`, `1433`, `1521`, `6379`, `27017`, `9200`, `9092`, `5984`, or `11211` with a source of `0.0.0.0/0` or `::/0`.

        A passing security group has no such rule. A failing security group has at least one.

        ### Audit via CLI

        1. List the security groups and show each one with its rules:

        ```bash
        exo compute security-group list
        exo compute security-group show <security-group> -O json
        ```

        2. Review the `ingress_rules` array for an entry with protocol `tcp`, a port range that includes one of `3306`, `5432`, `1433`, `1521`, `6379`, `27017`, `9200`, `9092`, `5984`, or `11211`, and network `0.0.0.0/0` or `::/0`.

        A passing security group returns no such rule. A failing security group returns at least one.
      remediation:
        - id: console
          desc: |
            To restrict the rule using the Exoscale Portal:

            1. Open **Compute**, then **Security Groups**, and select the security group.
            2. Add an ingress rule for the database port whose source is the trusted CIDR range that needs access, such as a bastion host or VPN egress range.
            3. Delete the rule whose source is `0.0.0.0/0` or `::/0`.
        - id: cli
          desc: |
            To restrict the rule using the Exoscale CLI:

            1. Show the security group and note the ID of the open rule.
            2. Add a rule scoped to the trusted CIDR range, then delete the open rule. Adding the restricted rule first keeps access from the trusted range uninterrupted.

            ```bash
            exo compute security-group show <security-group>
            exo compute security-group rule add <security-group> \
              --flow ingress --protocol tcp --port 5432 \
              --network 203.0.113.0/24
            exo compute security-group rule delete <security-group> <rule-id>
            ```
        - id: terraform
          desc: |
            To restrict the rule using Terraform, set `cidr` to a trusted range instead of `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "exoscale_security_group" "web" {
              name = "web"
            }

            resource "exoscale_security_group_rule" "postgres" {
              security_group_id      = exoscale_security_group.web.id
              type                   = "INGRESS"
              protocol               = "TCP"
              user_security_group_id = exoscale_security_group.app.id
              start_port             = 5432
              end_port               = 5432
            }

            resource "exoscale_security_group" "app" {
              name = "app"
            }
            ```
    refs:
      - url: https://community.exoscale.com/product/compute/instances/how-to/security-groups/
        title: Exoscale security groups
  - uid: mondoo-exoscale-security-security-group-no-unrestricted-db-ports-exoscale
    filters: asset.platform == "exoscale-security-group"
    mql: |
      exoscale.securityGroup.rules.none(direction == "ingress" && protocol == "tcp" && startPort <= 3306 && endPort >= 3306 && network.in(["0.0.0.0/0", "::/0"]))
      exoscale.securityGroup.rules.none(direction == "ingress" && protocol == "tcp" && startPort <= 5432 && endPort >= 5432 && network.in(["0.0.0.0/0", "::/0"]))
      exoscale.securityGroup.rules.none(direction == "ingress" && protocol == "tcp" && startPort <= 1433 && endPort >= 1433 && network.in(["0.0.0.0/0", "::/0"]))
