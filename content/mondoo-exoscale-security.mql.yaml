  - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled
    title: Ensure SKS clusters send Kubernetes audit logs to an endpoint
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    variants:
      - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Exoscale SKS clusters record Kubernetes audit events and deliver them to an external endpoint.

                The Kubernetes audit log records every request to the API server: who made it, what it changed, and whether it was allowed. On SKS you enable it by giving the cluster an audit webhook endpoint and bearer token, which the control plane posts events to. Audit logging is available on clusters with the Pro service level. The check requires audit logging to be enabled with an endpoint set.

        **Why this matters**

        The API server is the control point for everything in the cluster. Without its audit log there is no record of a stolen service account token creating a privileged pod, a user reading every secret, or a workload being modified, and an investigation has nothing to reconstruct the attack from.

        Shipping the events off the cluster also keeps them out of reach of an attacker who gains cluster-admin and would otherwise delete the evidence.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **Compute**, then **SKS**.
        2. Open each cluster and review its audit logging configuration.

        A passing cluster has audit logging enabled with an endpoint. A failing cluster has audit logging disabled.

        ### Audit via CLI

        ```bash
        exo compute sks show <cluster> -z <zone> -O json
        ```

        A passing cluster reports `audit_enabled` as `true` and a non-empty `audit_endpoint`. A failing cluster reports `audit_enabled` as `false`.
      remediation:
        - id: console
          desc: |
            To enable audit logging using the Exoscale Portal:

            1. Open **Compute**, then **SKS**, and select the cluster. Audit logging requires the Pro service level, so upgrade a Starter cluster first.
            2. Enable audit logging and enter the URL of the webhook that receives the audit events, plus its bearer token.
            3. Save the cluster.
        - id: cli
          desc: |
            To enable audit logging using the Exoscale CLI, move a Starter cluster to the Pro service level first, then set the audit endpoint:

            ```bash
            exo compute sks upgrade-service-level <cluster> -z <zone>
            exo compute sks update <cluster> -z <zone> \
              --audit-enabled \
              --audit-endpoint https://audit.example.com/k8s \
              --audit-bearer-token <token>
            ```
        - id: terraform
          desc: |
            To enable audit logging using Terraform, add an `audit` block to a Pro cluster. The block can only be added when the cluster is created:

            ```hcl
            resource "exoscale_sks_cluster" "prod" {
              zone          = "ch-gva-2"
              name          = "prod"
              service_level = "pro"

              audit {
                enabled      = true
                endpoint     = "https://audit.example.com/k8s"
                bearer_token = var.audit_bearer_token
              }
            }

            variable "audit_bearer_token" {
              type      = string
              sensitive = true
            }
            ```
    refs:
      - url: https://registry.terraform.io/providers/exoscale/exoscale/latest/docs/resources/sks_cluster
        title: Terraform exoscale_sks_cluster
  - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-exoscale
    filters: asset.platform == "exoscale-sks-cluster"
    mql: |
      exoscale.sks.cluster.auditEnabled == true
      exoscale.sks.cluster.auditEndpoint != empty
  - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "exoscale_sks_cluster")
    mql: |
      terraform.resources("exoscale_sks_cluster").all(
        blocks.where(type == "audit").any(arguments['enabled'] == true && arguments['endpoint'] != empty)
      )
  - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "exoscale_sks_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "exoscale_sks_cluster").all(
        change.after.audit != empty && change.after.audit.all(_['enabled'] == true && _['endpoint'] != empty)
      )
  - uid: mondoo-exoscale-security-sks-cluster-audit-logging-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "exoscale_sks_cluster")
    mql: |
      terraform.state.resources.where(type == "exoscale_sks_cluster").all(
        values.audit != empty && values.audit.all(_['enabled'] == true && _['endpoint'] != empty)
      )

  - uid: mondoo-exoscale-security-dbaas-ip-filter-restricted
    title: Ensure managed databases do not accept connections from any address
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-4
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-exoscale-security-dbaas-ip-filter-restricted-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-dbaas-ip-filter-restricted-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-dbaas-ip-filter-restricted-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-dbaas-ip-filter-restricted-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Exoscale managed database services restrict which networks can connect to them.

                Every Exoscale DBaaS service (PostgreSQL, MySQL, Valkey, Kafka, OpenSearch, Grafana, ClickHouse) has an IP filter, a list of CIDR ranges allowed to open connections. A service created without a filter accepts no connections at all. A filter containing `0.0.0.0/0` or `::/0` accepts connections from every address on the internet. The check requires the filter to name specific ranges instead.

        **Why this matters**

        Managed database endpoints have public DNS names and are found by scanners like any other service. With an open filter, the only thing between the internet and your data is the database password, which leaves it exposed to credential stuffing, brute forcing, and any authentication flaw in the engine.

        Limit the filter to the egress addresses of the instances, SKS node pools, or offices that need access. Connections from elsewhere are then refused before they reach authentication.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **DBaaS**.
        2. Open each service and review its **IP Filter**.

        A passing service lists only specific CIDR ranges. A failing service lists `0.0.0.0/0` or `::/0`.

        ### Audit via CLI

        ```bash
        exo dbaas list
        exo dbaas show <service> -z <zone> -O json
        ```

        Review the `ip_filter` list of the engine section. A passing service returns only specific ranges. A failing service includes `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            To restrict the IP filter using the Exoscale Portal:

            1. Open **DBaaS** and select the service.
            2. Edit the **IP Filter**, remove `0.0.0.0/0` and `::/0`, and add the CIDR ranges that need access.
            3. Save the service.
        - id: cli
          desc: |
            To restrict the IP filter using the Exoscale CLI, pass the engine-specific flag with the allowed ranges. This example updates a PostgreSQL service:

            ```bash
            exo dbaas update <service> -z <zone> \
              --pg-ip-filter 203.0.113.0/24,198.51.100.10/32
            ```

            MySQL, Valkey, and the other engines take `--mysql-ip-filter`, `--valkey-ip-filter`, and so on.
        - id: terraform
          desc: |
            To restrict the IP filter using Terraform, set `ip_filter` in the engine block to specific ranges:

            ```hcl
            resource "exoscale_dbaas" "db" {
              zone = "ch-gva-2"
              name = "app-db"
              type = "pg"
              plan = "startup-4"

              pg = {
                version   = "16"
                ip_filter = ["203.0.113.0/24"]
              }
            }
            ```
    refs:
