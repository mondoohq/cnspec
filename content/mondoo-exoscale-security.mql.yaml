        RDP is among the most scanned and most exploited services on the internet. Exposed listeners face continuous password spraying, and RDP has a history of pre-authentication remote code execution flaws such as BlueKeep (CVE-2019-0708) that let an attacker take over a Windows instance without any credentials.

        Ransomware operators routinely buy and use exposed RDP access as their initial foothold. Reach Windows instances through a VPN or a bastion host instead, and scope the rule to that source.
