      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-exoscale-security-security-group-no-all-ports-open-exoscale
        tags:
          mondoo.com/filter-title: Exoscale
          mondoo.com/filter-icon: exoscale
      - uid: mondoo-exoscale-security-security-group-no-all-ports-open-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-security-group-no-all-ports-open-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-exoscale-security-security-group-no-all-ports-open-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Exoscale security group admits traffic on every port from the entire internet.

                A rule opens everything when it is an ingress rule with protocol `all`, or a TCP or UDP rule covering ports `1` to `65535`, and its source network is `0.0.0.0/0` or `::/0`. Such a rule turns the security group into no firewall at all for every instance it is attached to.

        **Why this matters**

        Instances run more listeners than their owners realize: management agents, metrics endpoints, container runtimes, and services bound to all interfaces during development. An allow-all rule exposes every one of them at once, and the exposure grows silently each time software is installed.

        Replace the rule with rules that name the ports the workload serves and the sources it serves them to. If the needed scope is unknown, find it by observing traffic rather than by permitting everything.
      audit: |
        ### Audit via Console

        1. Log in to the [Exoscale Portal](https://portal.exoscale.com/) and open **Compute**, then **Security Groups**.
        2. Open each security group and review its **Ingress** rules.
        3. Look for a rule with protocol `all`, or a TCP or UDP rule covering ports `1-65535`, with a source of `0.0.0.0/0` or `::/0`.

        A passing security group has no such rule. A failing security group has at least one.

        ### Audit via CLI

        1. List the security groups and show each one with its rules:

        ```bash
        exo compute security-group list
        exo compute security-group show <security-group> -O json
        ```

        2. Review the `ingress_rules` array for an entry with protocol `all`, or protocol `tcp` or `udp` with start port `1` and end port `65535`, and network `0.0.0.0/0` or `::/0`.

        A passing security group returns no such rule. A failing security group returns at least one.
      remediation:
        - id: console
          desc: |
            To restrict the rule using the Exoscale Portal:

            1. Open **Compute**, then **Security Groups**, and select the security group.
            2. Add an ingress rule for only the ports the workload serves whose source is the trusted CIDR range that needs access, such as a bastion host or VPN egress range.
            3. Delete the rule whose source is `0.0.0.0/0` or `::/0`.
        - id: cli
          desc: |
            To restrict the rule using the Exoscale CLI:

            1. Show the security group and note the ID of the open rule.
            2. Add a rule scoped to the trusted CIDR range, then delete the open rule. Adding the restricted rule first keeps access from the trusted range uninterrupted.

            ```bash
            exo compute security-group show <security-group>
            exo compute security-group rule add <security-group> \
              --flow ingress --protocol tcp --port 443 \
              --network 203.0.113.0/24
            exo compute security-group rule delete <security-group> <rule-id>
            ```
        - id: terraform
          desc: |
            To restrict the rule using Terraform, set `cidr` to a trusted range instead of `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "exoscale_security_group" "web" {
              name = "web"
            }

            resource "exoscale_security_group_rule" "https" {
              security_group_id = exoscale_security_group.web.id
              type              = "INGRESS"
              protocol          = "TCP"
              cidr              = "0.0.0.0/0"
              start_port        = 443
              end_port          = 443
            }
            ```
    refs:
      - url: https://community.exoscale.com/product/compute/instances/how-to/security-groups/
        title: Exoscale security groups
