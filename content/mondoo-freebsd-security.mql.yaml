            set -e

            echo "Disabling web proxy server..."
            sysrc squid_enable="NO" 2>/dev/null || true
            service squid onestop 2>/dev/null || true

            echo "Web proxy server disabled."
            ```
        - id: ansible
          desc: |
            To disable the `squid` web proxy using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Disable squid in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Disable squid in rc.conf
                  community.general.sysrc:
                    name: squid_enable
                    value: 'NO'

                - name: Stop the squid service
                  ansible.builtin.service:
                    name: squid
                    state: stopped
                  failed_when: false
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the Squid web proxy:

            ```ruby
            service 'squid' do
              action %i(stop disable)
            end
            ```
  - uid: mondoo-freebsd-security-mail-transfer-agent-is-configured-for-local-only-mode
    title: Ensure mail transfer agent is configured for local-only mode
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      package("postfix").installed && service("postfix").running
    mql: |
      postfix.inetInterfaces.containsOnly(["localhost", "loopback-only", "127.0.0.1", "::1"])
    docs:
      refs:
        - url: https://docs.freebsd.org/en/books/handbook/network-servers/
          title: FreeBSD Handbook - Network Servers
      desc: |
        This check verifies that Postfix, if installed, is configured to only process local mail by setting `inet_interfaces` to `localhost`.

        **Why this matters**

        A mail transfer agent that listens on all network interfaces can be used as an open relay for spam or as an attack vector. Unless the system is intended to be a mail server, the MTA should only accept mail from the local system.
      audit: |
        To verify that Postfix processes only local mail, inspect its configuration:

        ```bash
        postconf inet_interfaces
        ```

        If `inet_interfaces` is set to `localhost` (or `loopback-only`), the MTA processes only local mail and the check passes. If it is set to `all` or a routable address, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit `/usr/local/etc/postfix/main.cf` and set:

            ```ini
            inet_interfaces = localhost
            ```

            `localhost` binds Postfix to the loopback addresses only. `loopback-only`, `127.0.0.1`, and `::1` also satisfy the check, alone or together. Any other address, or `all`, fails it. Postfix still delivers mail it sends from this host to remote servers, because the setting only controls where it listens.

            Then restart Postfix. A reload does not apply a change to `inet_interfaces`:

            ```bash
            service postfix restart
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            POSTFIX_CONF="/usr/local/etc/postfix/main.cf"

            if [ ! -f "$POSTFIX_CONF" ]; then
              echo "Postfix configuration not found at $POSTFIX_CONF. Skipping."
              exit 0
            fi

            echo "Configuring Postfix for local-only mode..."
            if grep -q '^inet_interfaces' "$POSTFIX_CONF" 2>/dev/null; then
              sed -i '' 's/^inet_interfaces.*/inet_interfaces = localhost/' "$POSTFIX_CONF"
            else
              echo 'inet_interfaces = localhost' >> "$POSTFIX_CONF"
            fi

            service postfix restart 2>/dev/null || true

            echo "Postfix configured for local-only mode."
            ```
        - id: ansible
          desc: |
            To configure Postfix for local-only mode using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Restrict Postfix to local interfaces
              hosts: all
              become: true

              tasks:
                - name: Restrict Postfix to local interfaces
                  ansible.builtin.lineinfile:
                    path: /usr/local/etc/postfix/main.cf
                    regexp: '^inet_interfaces'
                    line: 'inet_interfaces = localhost'
                  notify: Restart postfix

              handlers:
                - name: Restart postfix
                  ansible.builtin.service:
                    name: postfix
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to bind Postfix to the loopback interface. On FreeBSD the Postfix configuration lives under `/usr/local/etc`:

            ```ruby
            main_cf = '/usr/local/etc/postfix/main.cf'

            service 'postfix' do
              action :nothing
            end

            ruby_block 'bind Postfix to the loopback interface' do
              block do
                body = ::File.read(main_cf)
                directive = 'inet_interfaces = localhost'
                body = if body.match?(/^\s*inet_interfaces\s*=/)
                         body.gsub(/^\s*inet_interfaces\s*=.*$/, directive)
                       else
                         "#{body.chomp}\n#{directive}\n"
                       end
                ::File.write(main_cf, body)
              end
              only_if { ::File.exist?(main_cf) }
              not_if { ::File.exist?(main_cf) && ::File.read(main_cf).match?(/^inet_interfaces\s*=\s*localhost\s*$/) }
              notifies :restart, 'service[postfix]', :delayed
            end
            ```
  - uid: mondoo-freebsd-security-permissions-on-sshd-config-are-configured
    title: Ensure permissions on /etc/ssh/sshd_config are configured
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      file("/etc/ssh/sshd_config") {
        user.name == 'root'
        group.name == 'wheel'
        permissions.group_readable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_readable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that `/etc/ssh/sshd_config` is owned by `root:wheel` and is not readable by group or other users.

        **Why this matters**

        The SSH daemon configuration file controls how remote access to the system is handled. If this file is readable by unauthorized users, they can learn about the system's SSH configuration and potentially identify weaknesses. If writable, an attacker could weaken the SSH configuration.
      audit: |
        To verify the ownership and permissions of the SSH daemon configuration file, run the following command:

        ```bash
        ls -l /etc/ssh/sshd_config
        ```

        If the file is owned by `root:wheel` and is not readable, writable, or executable by group or other, the check passes. If group or other have any access, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Set the correct ownership and permissions:

            ```bash
            chown root:wheel /etc/ssh/sshd_config
            chmod 0600 /etc/ssh/sshd_config
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Setting permissions on /etc/ssh/sshd_config..."
            chown root:wheel /etc/ssh/sshd_config
            chmod 0600 /etc/ssh/sshd_config

            echo "Permissions on /etc/ssh/sshd_config configured."
            ```
        - id: ansible
          desc: |
            To set the correct ownership and permissions using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Secure sshd_config permissions
              hosts: all
              become: true

              tasks:
                - name: Secure sshd_config permissions
                  ansible.builtin.file:
                    path: /etc/ssh/sshd_config
                    owner: root
                    group: wheel
                    mode: '0600'
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict the SSH daemon configuration to root:

            ```ruby
            file '/etc/ssh/sshd_config' do
              owner 'root'
              group 'wheel'
              mode '0600'
            end
            ```
  - uid: mondoo-freebsd-security-permissions-on-ssh-private-host-key-files-are-configured
    title: Ensure permissions on SSH private host key files are configured
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      files.find(from: "/etc/ssh", type: "file").where(path == /ssh_host_.*key$/).list {
        path
        user.name == 'root'
        permissions.user_executable == false
        permissions.group_readable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_readable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that SSH private host key files under `/etc/ssh/` are owned by root with mode 0600 or more restrictive.

        **Why this matters**

        SSH private host keys are used to authenticate the server to clients. If these keys are exposed to unauthorized users, an attacker could impersonate the server, enabling man-in-the-middle attacks. Private keys must be accessible only to root.
      audit: |
        To verify the ownership and permissions of the SSH private host key files, run the following command:

        ```bash
        ls -l /etc/ssh/ssh_host_*key
        ```

        If every private host key file is owned by `root` with mode `0600` or more restrictive, the check passes. If any file is accessible to group or other, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Set the correct ownership and permissions on all SSH private host key files. The glob `ssh_host_*key` matches only the private keys. A public key filename such as `ssh_host_ed25519_key.pub` ends with `.pub`, not `key`, so it falls outside the pattern and stays readable:

            ```bash
            find /etc/ssh -name 'ssh_host_*key' -exec chown root:wheel {} \;
            find /etc/ssh -name 'ssh_host_*key' -exec chmod 0600 {} \;
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Setting permissions on SSH private host key files..."
            find /etc/ssh -name 'ssh_host_*key' -exec chown root:wheel {} \;
            find /etc/ssh -name 'ssh_host_*key' -exec chmod 0600 {} \;

            echo "SSH private host key file permissions configured."
            ```
        - id: ansible
          desc: |
            To set the correct ownership and permissions using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Find SSH private host key files
              hosts: all
              become: true

              tasks:
                - name: Find SSH private host key files
                  ansible.builtin.find:
                    paths: /etc/ssh
                    patterns: 'ssh_host_*key'
                    excludes: '*.pub'
                  register: ssh_private_keys

                - name: Secure SSH private host key files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    group: wheel
                    mode: '0600'
                  loop: "{{ ssh_private_keys.files }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict the SSH host private keys. The glob matches only the private keys, because the public keys end in `.pub`:

            ```ruby
            ::Dir.glob('/etc/ssh/ssh_host_*key').each do |private_key|
              file private_key do
                owner 'root'
                group 'wheel'
                mode '0600'
              end
            end
            ```
