      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      groups.list.duplicates(name).none()
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=group&sektion=5
          title: FreeBSD group(5)
      desc: |
        This check verifies that no duplicate group names exist in `/etc/group`.

        **Why this matters**

        Duplicate group names create ambiguity in group-based access controls. System utilities may resolve a group name to different GIDs depending on which entry is found first, leading to inconsistent and potentially insecure access control behavior.
      audit: |
        To verify that no group names are duplicated, run the following command:

        ```bash
        awk -F: '{ print $1 }' /etc/group | sort | uniq -d
        ```

        If the command returns no output, every group name is unique and the check passes. If any name is listed, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Identify the duplicated group names:

                ```bash
                awk -F: '{print $1}' /etc/group | sort | uniq -d
                ```

            2. List every entry that uses a reported name, with its GID and members. Replace `<group>` with a name from the previous command:

                ```bash
                grep '^<group>:' /etc/group
                ```

            3. Edit `/etc/group` and leave one entry per name. If both entries describe the same group, merge their member lists into one entry and delete the other. If they are different groups, rename one of them to a unique name.

            4. Check that the edited file is still well formed, then run the command from step 1 again and confirm it prints nothing:

                ```bash
                chkgrp
                ```

            Tools that look a group up by name use the first matching entry, so members listed only on the second entry do not get that group's access until the entries are merged.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Checking for duplicate group names..."
            DUPES=$(awk -F: '{print $1}' /etc/group | sort | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "WARNING: Duplicate group names found:"
              echo "$DUPES"
              echo "Please manually resolve duplicate group names."
              exit 1
            fi

            echo "No duplicate group names found."
            ```
        - id: ansible
          desc: |
            To detect duplicate group names using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook, then manually resolve any reported duplicate.

            ```yaml
            ---
            - name: Find duplicate group names
              hosts: all
              become: true

              tasks:
                - name: Find duplicate group names
                  ansible.builtin.shell: "awk -F: '{print $1}' /etc/group | sort | uniq -d"
                  register: dup_groups
                  changed_when: false

                - name: Fail when duplicate group names exist
                  ansible.builtin.fail:
                    msg: "Duplicate group names found: {{ dup_groups.stdout }}"
                  when: dup_groups.stdout | length > 0
            ```
