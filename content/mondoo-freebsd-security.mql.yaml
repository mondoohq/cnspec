            ```yaml
            ---
            - name: Disable snmpd in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Disable snmpd in rc.conf
                  community.general.sysrc:
                    name: snmpd_enable
                    value: 'NO'

                - name: Stop the snmpd service
                  ansible.builtin.service:
                    name: snmpd
                    state: stopped
                  failed_when: false
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the SNMP daemon:

            ```ruby
            service 'snmpd' do
              action %i(stop disable)
            end
            ```
  - uid: mondoo-freebsd-security-tftp-server-is-not-enabled
    title: Ensure TFTP server is not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      inetd.config.serviceNames.none(_ == "tftp")
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=inetd&sektion=8
          title: FreeBSD inetd(8)
      desc: |
        This check verifies that TFTP is not enabled in `/etc/inetd.conf`. TFTP has no built-in encryption or authentication.

        **Why this matters**

        TFTP is a protocol designed for simplicity with no authentication or encryption. Any user on the network can read or write files via TFTP. Unless specifically required for network booting infrastructure, TFTP should be disabled.
      audit: |
        To verify that TFTP is not enabled, inspect `/etc/inetd.conf`:

        ```bash
        grep -E '^tftp' /etc/inetd.conf
        ```

        If the file does not exist or no uncommented `tftp` line is returned, the check passes. If an active `tftp` entry is present, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Comment out or remove TFTP entries from `/etc/inetd.conf`:

            ```bash
            sed -i '' 's/^tftp/#tftp/' /etc/inetd.conf
            ```

            Reload inetd so the change takes effect:

            ```bash
            service inetd reload
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling TFTP server..."
            if [ -f /etc/inetd.conf ]; then
              sed -i '' 's/^tftp/#tftp/' /etc/inetd.conf
              service inetd reload 2>/dev/null || true
              echo "TFTP entries commented out in /etc/inetd.conf."
            fi

            echo "TFTP server disabled."
            ```
        - id: ansible
          desc: |
            To disable TFTP using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Comment out TFTP entries in inetd.conf
              hosts: all
              become: true

              tasks:
                - name: Comment out TFTP entries in inetd.conf
                  ansible.builtin.replace:
                    path: /etc/inetd.conf
                    regexp: '^tftp'
                    replace: '#tftp'

                - name: Reload inetd to apply the change
                  ansible.builtin.service:
                    name: inetd
                    state: reloaded
                  failed_when: false
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to disable the TFTP service in inetd:

            ```ruby
            inetd_conf = '/etc/inetd.conf'

            # inetd is often not running at all, in which case commenting the entry out is
            # already enough and the reload has nothing to do.
            service 'inetd' do
              action :nothing
              ignore_failure true
            end

            ruby_block 'comment out tftp entries in inetd.conf' do
              block do
                body = ::File.read(inetd_conf)
                ::File.write(inetd_conf, body.gsub(/^tftp/, '#tftp'))
              end
              only_if { ::File.exist?(inetd_conf) && ::File.read(inetd_conf).match?(/^tftp/) }
              notifies :restart, 'service[inetd]', :delayed
            end
            ```
  - uid: mondoo-freebsd-security-imap-and-pop3-server-is-not-enabled
    title: Ensure IMAP and POP3 server is not enabled
    impact: 100
    tags:
