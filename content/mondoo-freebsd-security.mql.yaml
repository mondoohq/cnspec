      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      sshd.config.params["MaxAuthTries"] <= 4
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that the SSH `MaxAuthTries` is set to 4 or less to limit the number of authentication attempts per connection.

        **Why this matters**

        Limiting the number of authentication attempts reduces the effectiveness of brute force attacks. With a low `MaxAuthTries` value, an attacker must establish a new connection for each set of attempts, slowing down automated attacks and making them easier to detect.
      audit: |
        To verify the SSH `MaxAuthTries` setting in effect, run the following command:

        ```bash
        sshd -T | grep -i '^maxauthtries'
        ```

        If the value is `4` or less, the check passes. If the value is greater than `4`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            MaxAuthTries 4
            ```

            Any value from `1` to `4` satisfies the check. `4` still leaves room for a user whose SSH agent offers several keys before the right one, because each offered key counts as an attempt. The directive has to be present, since OpenSSH defaults to `6` when it is absent.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"

            echo "Setting SSH MaxAuthTries to 4..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"
            if grep -q '^MaxAuthTries' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^MaxAuthTries.*/MaxAuthTries 4/' "$SSHD_CONFIG"
            elif grep -q '^#MaxAuthTries' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^#MaxAuthTries.*/MaxAuthTries 4/' "$SSHD_CONFIG"
            else
              echo 'MaxAuthTries 4' >> "$SSHD_CONFIG"
            fi

            # Validate the edited file before restarting. If sshd rejects it,
            # put the original back so a later restart or reboot still starts
            # sshd, and stop without restarting.
            if ! sshd -t -f "$SSHD_CONFIG"; then
              cp -p "${SSHD_CONFIG}.bak" "$SSHD_CONFIG"
              echo "sshd -t rejected the new configuration. The original file was restored." >&2
              exit 1
            fi
            service sshd restart

            echo "SSH MaxAuthTries set to 4."
