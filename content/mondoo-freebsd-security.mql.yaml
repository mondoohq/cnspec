    mql: |
      kernel.parameters["net.inet.ip.redirect"] == 0
      kernel.parameters["net.inet6.ip6.redirect"] == 0
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=sysctl&sektion=8
          title: FreeBSD sysctl(8)
        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that ICMP redirect sending is disabled for both IPv4 and IPv6, preventing the system from sending routing redirect messages.

        **Why this matters**

        ICMP redirects are used by routers to inform hosts of more efficient routes. An attacker could craft fraudulent ICMP redirect messages to corrupt the routing table of a target system, potentially redirecting traffic through a malicious system for interception or modification.
      audit: |
        To verify that ICMP redirect sending is disabled, run the following commands:

        ```bash
        sysctl net.inet.ip.redirect
        sysctl net.inet6.ip6.redirect
        ```

        If both values are `0`, redirect sending is disabled and the check passes. If either value is `1`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Disable redirect sending immediately:

                ```bash
                sysctl net.inet.ip.redirect=0
                sysctl net.inet6.ip6.redirect=0
                ```

            2. Make the change permanent by adding to `/etc/sysctl.conf`:

                ```ini
                net.inet.ip.redirect=0
                net.inet6.ip6.redirect=0
                ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling packet redirect sending..."
            sysctl net.inet.ip.redirect=0
            sysctl net.inet6.ip6.redirect=0

            for param in net.inet.ip.redirect=0 net.inet6.ip6.redirect=0; do
              key=$(echo "$param" | cut -d= -f1)
              if grep -q "^${key}" /etc/sysctl.conf 2>/dev/null; then
                sed -i '' "s/^${key}=.*/${param}/" /etc/sysctl.conf
              else
                echo "$param" >> /etc/sysctl.conf
              fi
            done

            echo "Packet redirect sending disabled."
            ```
        - id: ansible
          desc: |
            To disable ICMP redirect sending using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Disable ICMP redirect sending
              hosts: all
              become: true

              tasks:
                - name: Disable ICMP redirect sending
                  ansible.posix.sysctl:
                    name: "{{ item }}"
                    value: '0'
                    sysctl_file: /etc/sysctl.conf
                    reload: true
                  loop:
                    - net.inet.ip.redirect
                    - net.inet6.ip6.redirect
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop the host from sending ICMP redirects:

            ```ruby
            sysctl_conf = '/etc/sysctl.conf'

            execute 'reload sysctl settings' do
              command "sysctl -f #{sysctl_conf}"
              action :nothing
            end

            { 'net.inet.ip.redirect' => '0', 'net.inet6.ip6.redirect' => '0' }.each do |key, value|
              pattern = Regexp.escape(key)

              ruby_block "set #{key} in sysctl.conf" do
                block do
                  body = ::File.exist?(sysctl_conf) ? ::File.read(sysctl_conf) : ''
                  directive = "#{key}=#{value}"
                  body = if body.match?(/^\s*#{pattern}\s*=/)
                           body.gsub(/^\s*#{pattern}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n".lstrip
                         end
                  ::File.write(sysctl_conf, body)
                end
                not_if do
                  ::File.exist?(sysctl_conf) &&
                    ::File.read(sysctl_conf).match?(/^#{pattern}\s*=\s*#{Regexp.escape(value)}\s*$/)
                end
                notifies :run, 'execute[reload sysctl settings]', :delayed
              end
            end
            ```
  - uid: mondoo-freebsd-security-icmp-redirects-are-not-accepted
    title: Ensure ICMP redirects are not accepted
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
