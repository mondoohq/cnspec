  - uid: mondoo-freebsd-security-permissions-on-bootloader-config-are-configured
    title: Ensure permissions on bootloader config are configured
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      file("/boot/loader.conf") {
        exists == false ||
          user.name == 'root' &&
          group.name == 'wheel' &&
          permissions.user_executable == false &&
          permissions.group_readable == false &&
          permissions.group_writeable == false &&
          permissions.group_executable == false &&
          permissions.other_readable == false &&
          permissions.other_writeable == false &&
          permissions.other_executable == false
      }
      file("/boot/loader.conf.local") {
        exists == false ||
          user.name == 'root' &&
          group.name == 'wheel' &&
          permissions.user_executable == false &&
          permissions.group_readable == false &&
          permissions.group_writeable == false &&
          permissions.group_executable == false &&
          permissions.other_readable == false &&
          permissions.other_writeable == false &&
          permissions.other_executable == false
      }
      file("/boot/loader.conf.lua") {
        exists == false ||
          user.name == 'root' &&
          group.name == 'wheel' &&
          permissions.user_executable == false &&
          permissions.group_readable == false &&
          permissions.group_writeable == false &&
          permissions.group_executable == false &&
          permissions.other_readable == false &&
          permissions.other_writeable == false &&
          permissions.other_executable == false
      }
      files.find(from: "/boot/loader.conf.d", type: "file").list.all(
        user.name == 'root' &&
        group.name == 'wheel' &&
        permissions.group_writeable == false &&
        permissions.other_writeable == false
      )
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=loader.conf&sektion=5
          title: FreeBSD loader.conf(5)
      desc: |
        This check verifies that `/boot/loader.conf`, `/boot/loader.conf.local`, and `/boot/loader.conf.lua` are owned by `root:wheel` and have mode 0600 or more restrictive, and that no file under `/boot/loader.conf.d/` is group or other writable. All of these paths are optional, so the check passes when they are absent.

        **Why this matters**

        The bootloader configuration controls kernel parameters and module loading at boot time. If readable by unauthorized users, it may expose sensitive configuration such as the loader `password` setting. If writable, an attacker could modify boot parameters to bypass security controls, boot into single-user mode, or load malicious kernel modules.

        **Scope**

        loader.conf(5) documents five user defined configuration locations, not one. The loader reads `/boot/loader.conf` and every `.conf` file under `/boot/loader.conf.d/` on each boot, and reads `/boot/loader.conf.local` last so that it overrides the settings found in the others. `/boot/loader.conf.lua` and `.lua` drop-ins hold the same settings written in Lua. All of them can carry the loader `password` and `bootlock_password` variables, so this check covers all of them, in two tiers:

        - `/boot/loader.conf`, `/boot/loader.conf.local`, and `/boot/loader.conf.lua` hold settings that an administrator writes. No package owns these paths, so each one that exists must be `root:wheel` with mode 0600 or more restrictive.
        - Files under `/boot/loader.conf.d/` must be `root:wheel` and must not be group or other writable. The read bits are deliberately not asserted there. FreeBSD ports install package-managed drop-ins into that directory with world-readable modes, so requiring mode 0600 would fail every host that installs one of those packages. The `net/wifi-firmware-*-kmod` ports ship `compat.linuxkpi` tunables this way. Write access is the part that matters, because an unprivileged user who can edit a drop-in sets kernel tunables and loads modules on the next boot.
        - An absent file passes, and so does an absent or empty `/boot/loader.conf.d/`. There is nothing to read and nothing whose contents an attacker could change.
        - `/boot/defaults/loader.conf` is out of scope. It ships with the base system, holds no site configuration, and is world readable on every FreeBSD install, so requiring mode 0600 on it would fail every system without protecting anything.
      audit: |
        To verify the ownership and permissions of the administrator-written bootloader configuration files, run the following command:

        ```bash
        ls -l /boot/loader.conf /boot/loader.conf.local /boot/loader.conf.lua
        ```

        Every one of these files that exists must be owned by `root:wheel` with mode `0600` or more restrictive. The check fails when the owner or group is wrong, or when group or other have any access. A file that `ls` reports as `No such file or directory` passes, because the system holds no administrator-written settings in it.

        To verify the drop-in directory, run:

        ```bash
        ls -l /boot/loader.conf.d/
        ```

        Every file listed must be owned by `root:wheel` and must not be group or other writable. A missing or empty directory passes.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Restrict every administrator-written bootloader configuration file that exists:

                ```bash
                for f in /boot/loader.conf /boot/loader.conf.local /boot/loader.conf.lua; do
                  [ -e "$f" ] || continue
                  chown root:wheel "$f"
                  chmod 0600 "$f"
                done
                ```

            2. Remove group and other write access from the drop-in files:

                ```bash
                if [ -d /boot/loader.conf.d ]; then
                  find /boot/loader.conf.d -type f -exec chown root:wheel {} + -exec chmod go-w {} +
                fi
                ```

            **Do not create any of these files just to satisfy this check.** An absent file already passes. Creating one adds a boot configuration file the system did not have, and the loader starts reading it.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            for f in /boot/loader.conf /boot/loader.conf.local /boot/loader.conf.lua; do
              if [ ! -e "$f" ]; then
                echo "$f does not exist, nothing to secure."
                continue
              fi

              echo "Setting permissions on $f..."
              chown root:wheel "$f"
              chmod 0600 "$f"
            done

            if [ -d /boot/loader.conf.d ]; then
              echo "Removing group and other write access from /boot/loader.conf.d..."
              find /boot/loader.conf.d -type f -exec chown root:wheel {} + -exec chmod go-w {} +
            fi

            echo "Bootloader configuration permissions configured."
            ```
        - id: ansible
          desc: |
            To set the correct ownership and permissions using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Secure bootloader configuration permissions
              hosts: all
              become: true

              tasks:
                - name: Check which bootloader configuration files exist
                  ansible.builtin.stat:
                    path: "{{ item }}"
                  loop:
                    - /boot/loader.conf
                    - /boot/loader.conf.local
                    - /boot/loader.conf.lua
                  register: loader_conf

                - name: Secure the administrator-written bootloader configuration files
                  ansible.builtin.file:
                    path: "{{ item.item }}"
                    state: file
                    owner: root
                    group: wheel
                    mode: '0600'
                  loop: "{{ loader_conf.results }}"
                  loop_control:
                    label: "{{ item.item }}"
                  when: item.stat.exists

                - name: Find the bootloader configuration drop-in files
                  ansible.builtin.find:
                    paths: /boot/loader.conf.d
                    file_type: file
                  register: loader_conf_d

                - name: Remove group and other write access from the drop-in files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    state: file
                    owner: root
                    group: wheel
                    mode: g-w,o-w
                  loop: "{{ loader_conf_d.files }}"
                  loop_control:
                    label: "{{ item.path }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict the existing bootloader configuration to root. Both `only_if` guards run at converge time. The first keeps the `file` resource from creating a configuration file the system does not have. The second runs the drop-in fix only when a drop-in is actually misowned or writable, and clears just the group and other write bits, so a package-managed drop-in keeps the mode its port installed:

            ```ruby
            %w(/boot/loader.conf /boot/loader.conf.local /boot/loader.conf.lua).each do |conf|
              file conf do
                owner 'root'
                group 'wheel'
                mode '0600'
                only_if { ::File.exist?(conf) }
              end
            end

            execute 'restrict bootloader configuration drop-in files' do
              command 'find /boot/loader.conf.d -type f -exec chown root:wheel {} + -exec chmod go-w {} +'
              only_if do
                ::Dir.glob('/boot/loader.conf.d/*').any? do |dropin|
                  next false unless ::File.file?(dropin)

                  stat = ::File.stat(dropin)
                  stat.uid != 0 || stat.gid != 0 || !(stat.mode & 0o022).zero?
                end
              end
            end
            ```
  - uid: mondoo-freebsd-security-root-is-the-only-uid-0-account
    title: Ensure root is the only UID 0 account
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      users.where( uid == 0 ).all( name == "root" )
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=passwd&sektion=5
          title: FreeBSD passwd(5)
        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that only the `root` account has UID 0.

        **Why this matters**

        Any account with UID 0 has unrestricted access to the entire system. Multiple UID 0 accounts make it impossible to determine which administrator performed a given action, undermining accountability. The `toor` account, while traditional on FreeBSD, should be removed if not needed.
      audit: |
        To verify that only `root` has UID 0, run the following command:

        ```bash
        awk -F: '$3 == 0 { print $1 }' /etc/passwd
        ```

        If `root` is the only name returned, the check passes. If any other account is listed, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Identify all UID 0 accounts:

            ```bash
            awk -F: '$3 == 0 { print $1 }' /etc/passwd
            ```

            FreeBSD ships a `toor` account that shares UID 0 with `root`. If it is not needed, remove it:

            ```bash
            pw userdel toor
            ```

            Remove any other UID 0 account with `pw userdel`, or assign it a unique UID with `pw usermod -u`.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Checking for non-root UID 0 accounts..."
            EXTRA_UID0=$(awk -F: '$3 == 0 && $1 != "root" { print $1 }' /etc/passwd)

            if [ -n "$EXTRA_UID0" ]; then
              echo "WARNING: The following non-root accounts have UID 0:"
              echo "$EXTRA_UID0"
              echo "Please manually remove these accounts or change their UID."
              exit 1
            fi

            echo "Only root has UID 0. No action needed."
            ```
        - id: ansible
          desc: |
            To detect non-root UID 0 accounts using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook, then manually remove or re-number any reported account.

            ```yaml
            ---
            - name: Find non-root accounts with UID 0
              hosts: all
              become: true

              tasks:
                - name: Find non-root accounts with UID 0
                  ansible.builtin.shell: "awk -F: '$3 == 0 && $1 != \"root\" { print $1 }' /etc/passwd"
                  register: uid0_accounts
                  changed_when: false

                - name: Fail when a non-root UID 0 account exists
                  ansible.builtin.fail:
                    msg: "Non-root UID 0 accounts found: {{ uid0_accounts.stdout }}"
                  when: uid0_accounts.stdout | length > 0
            ```
        # No Chef Infra remediation: resolving this means deciding which account or sudoers entry to change, which is a human decision rather than a converge step.
  - uid: mondoo-freebsd-security-no-duplicate-uids-exist
    title: Ensure no duplicate UIDs exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      users.list.duplicates(uid).none(uid != 0)
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=passwd&sektion=5
          title: FreeBSD passwd(5)
      desc: |
        This check verifies that no two non-root users share the same UID.

        **Why this matters**

        Duplicate UIDs break the assumption that each UID maps to a unique user. Files owned by one user would appear to be owned by another, creating accountability gaps and making it impossible to reliably audit user actions or enforce per-user access controls.
      audit: |
        To verify that no non-root users share a UID, run the following command:

        ```bash
        awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d
        ```

        If the command returns no output, every non-root user has a unique UID and the check passes. If any UID is listed, it is shared by more than one account and the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            First identify the duplicated UIDs:

            ```bash
            awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d
            ```

            1. For each duplicated UID, list the accounts that share it so you can decide which one to renumber. Replace `<uid>` with a UID from the previous command:

                ```bash
                awk -F: -v u=<uid> '$3 == u { print $1 }' /etc/passwd
                ```

            2. Assign a new, unused UID to the account you chose to change, where `<name>` is that account and `<new-uid>` is a UID no other account has. `pw` refuses a UID that is already taken:

                ```bash
                pw usermod <name> -u <new-uid>
                ```

            3. Re-own the files that belong to the renumbered account. Changing a UID does not update files the account already owns, so they keep the old numeric UID, which is `<uid>` from step 1. Limit the change to that account's own files, such as its home directory at `<home>`:

                ```bash
                find <home> -user <uid> -exec chown -h <new-uid> {} +
                ```

            **Do not re-own every file on the system that has the old UID.** The other account keeps that UID, and a system-wide `find / -user <uid>` cannot tell its files apart from those of the account you renumbered, so a blanket `chown` hands the other account's files to the wrong user. Review any file outside the home directory before changing its owner.

            Verify afterward that both accounts can still log in and reach their own files.
        - id: sh
          desc: |
            **Using a Shell Script**

            This script reports duplicate UIDs but does not change them, because choosing which account to renumber and re-owning its files must be done deliberately. Use the CLI steps to apply the fix.

            ```sh
            #!/bin/sh
            set -e

            echo "Checking for duplicate UIDs..."
            DUPES=$(awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "WARNING: Duplicate UIDs found:"
              for uid in $DUPES; do
                echo "  UID $uid used by: $(awk -F: -v u="$uid" '$3 == u { print $1 }' /etc/passwd | tr '\n' ' ')"
              done
              echo "Please manually assign unique UIDs to each user."
              exit 1
            fi

            echo "No duplicate UIDs found."
            ```
        - id: ansible
          desc: |
            To detect duplicate UIDs using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook, then manually assign unique UIDs to any reported account.

            ```yaml
            ---
            - name: Find duplicate UIDs
              hosts: all
              become: true

              tasks:
                - name: Find duplicate UIDs
                  ansible.builtin.shell: "awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d"
                  register: dup_uids
                  changed_when: false

                - name: Fail when duplicate UIDs exist
                  ansible.builtin.fail:
                    msg: "Duplicate UIDs found: {{ dup_uids.stdout }}"
                  when: dup_uids.stdout | length > 0
            ```
        # No Chef Infra remediation: resolving this means deciding which account or sudoers entry to change, which is a human decision rather than a converge step.
