              sed -i '' 's/^net.inet.tcp.syncookies=.*/net.inet.tcp.syncookies=1/' /etc/sysctl.conf
            else
              echo 'net.inet.tcp.syncookies=1' >> /etc/sysctl.conf
            fi

            echo "TCP SYN cookies enabled."
