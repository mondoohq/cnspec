      sshd.config.params["LoginGraceTime"] <= 60
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that the SSH server closes connections that have not authenticated within one minute.

        The check reads `LoginGraceTime` in `/etc/ssh/sshd_config`, which must be between 1 and 60 seconds. The OpenSSH default is 120 seconds.

        **Why this matters**

        `LoginGraceTime` bounds how long a connection may sit unauthenticated before `sshd` closes it, and every connection in that state occupies a slot and an unauthenticated `sshd` process.

        That makes the value a denial of service parameter. `MaxStartups` caps how many unauthenticated connections may be in progress at once, and `LoginGraceTime` decides how long each one holds its slot. With a long grace period, an attacker who opens connections and never authenticates can fill the available slots and keep them full at almost no cost, and legitimate administrators are refused. Halving the grace period halves the number of connections needed to sustain that.

        The pre-authentication window matters for a second reason: it is where `sshd` parses attacker-supplied protocol data before any credential has been accepted. Keeping it short reduces the time available to work through a multi-step interaction against that code.

        A minute is generous for an automated client and for an administrator typing a password or touching a hardware key. Where an interactive second factor needs longer, scope the exception with a `Match` block rather than raising the global value.
      audit: |
        To verify the SSH `LoginGraceTime` setting in effect, run the following command:

        ```bash
        sshd -T | grep -i '^logingracetime'
        ```

        If the value is between `1` and `60` seconds, the check passes. If the value is `0` or greater than `60`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            LoginGraceTime 60
            ```

            Any value from `1` to `60` seconds satisfies the check, and a time suffix such as `1m` is also accepted. `0` fails because it removes the limit entirely, and so does leaving the directive out, since OpenSSH then waits 120 seconds.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"

            echo "Setting SSH LoginGraceTime to 60..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"
            if grep -q '^LoginGraceTime' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^LoginGraceTime.*/LoginGraceTime 60/' "$SSHD_CONFIG"
            elif grep -q '^#LoginGraceTime' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^#LoginGraceTime.*/LoginGraceTime 60/' "$SSHD_CONFIG"
            else
              echo 'LoginGraceTime 60' >> "$SSHD_CONFIG"
            fi

