          title: FreeBSD rc.conf(5)
      desc: |
        This check verifies that `snmpd` is not running and not enabled, or that the `net-snmp` package is not installed.

        **Why this matters**

        SNMPv1 and SNMPv2 transmit community strings and data in cleartext, making them vulnerable to interception. Even SNMPv3 can be misconfigured. Unless SNMP monitoring is specifically required and properly configured with SNMPv3, the SNMP service should be disabled.
      audit: |
        To verify that the SNMP daemon is not active, run the following commands:

        ```bash
        service snmpd status
        sysrc -n snmpd_enable
        pkg info net-snmp
        ```

        If `snmpd` is not running and not enabled, or the `net-snmp` package is not installed, the check passes. If `snmpd` is running or enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Stop the SNMP daemon, then disable it so it does not come back at boot:

            ```bash
            service snmpd stop
            sysrc snmpd_enable="NO"
            ```

            **Stop before you disable.** Once `snmpd_enable` is `NO`, `service snmpd stop` is refused with a message pointing at `onestop`, and the daemon keeps running until the next reboot.

            Or remove the package entirely. Stop `snmpd` with the command above first, because `pkg delete` removes the files but leaves a running daemon listening until it is stopped or the host reboots:

            ```bash
            pkg delete net-snmp
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling SNMP server..."
            sysrc snmpd_enable="NO" 2>/dev/null || true
            service snmpd onestop 2>/dev/null || true

            echo "SNMP server disabled."
            ```
        - id: ansible
          desc: |
            To disable the SNMP daemon using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
