            Set the correct permissions on all SSH public host key files:

            ```bash
            find /etc/ssh -name 'ssh_host_*key.pub' -exec chown root:wheel {} \;
            find /etc/ssh -name 'ssh_host_*key.pub' -exec chmod 0644 {} \;
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Setting permissions on SSH public host key files..."
            find /etc/ssh -name 'ssh_host_*key.pub' -exec chown root:wheel {} \;
            find /etc/ssh -name 'ssh_host_*key.pub' -exec chmod 0644 {} \;

            echo "SSH public host key file permissions configured."
            ```
        - id: ansible
          desc: |
            To set the correct ownership and permissions using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Find SSH public host key files
              hosts: all
              become: true

              tasks:
                - name: Find SSH public host key files
                  ansible.builtin.find:
                    paths: /etc/ssh
                    patterns: 'ssh_host_*key.pub'
                  register: ssh_public_keys

                - name: Secure SSH public host key files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    group: wheel
                    mode: '0644'
                  loop: "{{ ssh_public_keys.files }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the ownership and permissions on the SSH host public keys:

            ```ruby
            ::Dir.glob('/etc/ssh/ssh_host_*key.pub').each do |public_key|
              file public_key do
                owner 'root'
                group 'wheel'
                mode '0644'
              end
            end
            ```
  - uid: mondoo-freebsd-security-only-strong-ciphers-are-used
    title: Ensure only strong ciphers are used
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      sshd.config.ciphers != empty
      sshd.config.ciphers.containsOnly(["chacha20-poly1305@openssh.com","aes256-gcm@openssh.com","aes128-gcm@openssh.com","aes256-ctr","aes192-ctr","aes128-ctr"])
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that the SSH server is configured to use only strong, modern ciphers and that no weak ciphers such as 3DES, Blowfish, CAST128, or CBC-mode AES are permitted.

        **Why this matters**

        Weak ciphers can be exploited to decrypt SSH traffic. CBC-mode ciphers are vulnerable to plaintext recovery attacks, and legacy ciphers like 3DES have insufficient key lengths for modern security requirements. Only authenticated encryption modes (GCM) and strong stream ciphers (CTR, ChaCha20) should be used.
      audit: |
        To verify the SSH ciphers, inspect the SSH server configuration file:

        ```bash
        grep -i '^[[:space:]]*Ciphers' /etc/ssh/sshd_config
        ```

        If a `Ciphers` line is returned and every cipher on it is one of `chacha20-poly1305@openssh.com`, `aes256-gcm@openssh.com`, `aes128-gcm@openssh.com`, `aes256-ctr`, `aes192-ctr`, or `aes128-ctr`, the check passes. If any other cipher appears, or no line is returned, the check fails.

        Do not audit this with `sshd -T`. The check reads the configuration file, so a missing `Ciphers` line fails even when the cipher list OpenSSH applies by default would pass.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
            ```

            The check accepts only the six ciphers on this line. You can remove ciphers from the list, but adding any other cipher, including a CBC-mode one, fails the check. The line has to be present, because the check reads the configuration file rather than the list OpenSSH uses by default.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"
            CIPHERS="chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"

            echo "Configuring strong SSH ciphers..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"
            if grep -q '^Ciphers' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' "s/^Ciphers.*/Ciphers ${CIPHERS}/" "$SSHD_CONFIG"
            else
              echo "Ciphers ${CIPHERS}" >> "$SSHD_CONFIG"
            fi

            # Validate the edited file before restarting. If sshd rejects it,
            # put the original back so a later restart or reboot still starts
            # sshd, and stop without restarting.
            if ! sshd -t -f "$SSHD_CONFIG"; then
              cp -p "${SSHD_CONFIG}.bak" "$SSHD_CONFIG"
              echo "sshd -t rejected the new configuration. The original file was restored." >&2
              exit 1
            fi
            service sshd restart

            echo "Strong SSH ciphers configured."
            ```
        - id: ansible
          desc: |
            To restrict SSH to strong ciphers using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            The `validate` option runs `sshd -t` against the edited copy of `sshd_config`, and Ansible writes the file only if that copy passes. A configuration `sshd` cannot parse would otherwise stop the service from starting again and lock out new SSH logins.

            ```yaml
            ---
            - name: Configure strong SSH ciphers
              hosts: all
              become: true

              tasks:
                - name: Configure strong SSH ciphers
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '^#?Ciphers'
                    line: 'Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr'
                    validate: /usr/sbin/sshd -t -f %s
                  notify: Restart sshd

              handlers:
                - name: Restart sshd
                  ansible.builtin.service:
                    name: sshd
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **An invalid SSH server configuration locks out remote access.** The `verify` property runs `sshd -t` against the edited copy of `sshd_config`, and Chef writes the file only if that copy passes. The `only_if` guard on the service runs `sshd -t` again before the restart and skips it if the complete configuration fails.

            Use this Chef Infra recipe code to restrict SSH to strong ciphers:

            ```ruby
            sshd_config = '/etc/ssh/sshd_config'

            service 'sshd' do
              action :nothing
              only_if '/usr/sbin/sshd -t'
            end

            { 'Ciphers' => 'chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' }.each do |keyword, value|
              file "set #{keyword} in sshd_config" do
                path sshd_config
                content(lazy do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  if body.match?(/^\s*#?\s*#{keyword}\b/i)
                    body.gsub(/^\s*#?\s*#{keyword}\b.*$/i, directive)
                  else
                    "#{body.chomp}\n#{directive}\n"
                  end
                end)
                verify '/usr/sbin/sshd -t -f %{path}'
                not_if { ::File.read(sshd_config).match?(/^#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, 'service[sshd]', :delayed
              end
            end
            ```
  - uid: mondoo-freebsd-security-only-strong-mac-algorithms-are-used
    title: Ensure only strong MAC algorithms are used
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      sshd.config.macs != empty
      sshd.config.macs.containsOnly(["umac-128-etm@openssh.com","hmac-sha2-256-etm@openssh.com","hmac-sha2-512-etm@openssh.com","umac-128@openssh.com","hmac-sha2-256","hmac-sha2-512"])
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that the SSH server uses only strong Message Authentication Code (MAC) algorithms and that weak algorithms such as MD5, SHA1-96, RIPEMD160, and UMAC-64 variants are not permitted.

        **Why this matters**

        MAC algorithms ensure the integrity of data transmitted over SSH. Weak MAC algorithms can be exploited to tamper with SSH traffic without detection. Only SHA-256/SHA-512 based MACs and UMAC-128 should be used.
      audit: |
        To verify the SSH MAC algorithms, inspect the SSH server configuration file:

        ```bash
        grep -i '^[[:space:]]*MACs' /etc/ssh/sshd_config
        ```

        If a `MACs` line is returned and every algorithm on it is one of `umac-128-etm@openssh.com`, `hmac-sha2-256-etm@openssh.com`, `hmac-sha2-512-etm@openssh.com`, `umac-128@openssh.com`, `hmac-sha2-256`, or `hmac-sha2-512`, the check passes. If any other algorithm appears, such as `hmac-md5`, `hmac-sha1`, `hmac-ripemd160`, or a `umac-64` variant, or no line is returned, the check fails.

        Do not audit this with `sshd -T`. The check reads the configuration file, so a missing `MACs` line fails even though `sshd -T` prints the default list. That default list is itself weak by this check's standard, because it carries `umac-64-etm@openssh.com`, `hmac-sha1-etm@openssh.com`, `umac-64@openssh.com`, and `hmac-sha1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512
            ```

            The check accepts only the six MAC algorithms on this line. You can remove algorithms from the list, but adding any other one fails the check. OpenSSH's default list includes `umac-64` and `hmac-sha1` algorithms, so leaving the directive out fails as well.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"
            MACS="umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512"

            echo "Configuring strong SSH MAC algorithms..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"
            if grep -q '^MACs' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' "s/^MACs.*/MACs ${MACS}/" "$SSHD_CONFIG"
            else
              echo "MACs ${MACS}" >> "$SSHD_CONFIG"
            fi

            # Validate the edited file before restarting. If sshd rejects it,
            # put the original back so a later restart or reboot still starts
            # sshd, and stop without restarting.
            if ! sshd -t -f "$SSHD_CONFIG"; then
              cp -p "${SSHD_CONFIG}.bak" "$SSHD_CONFIG"
              echo "sshd -t rejected the new configuration. The original file was restored." >&2
              exit 1
            fi
            service sshd restart

            echo "Strong SSH MAC algorithms configured."
            ```
        - id: ansible
          desc: |
            To restrict SSH to strong MAC algorithms using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            The `validate` option runs `sshd -t` against the edited copy of `sshd_config`, and Ansible writes the file only if that copy passes. A configuration `sshd` cannot parse would otherwise stop the service from starting again and lock out new SSH logins.

            ```yaml
            ---
            - name: Configure strong SSH MAC algorithms
              hosts: all
              become: true

              tasks:
                - name: Configure strong SSH MAC algorithms
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '^#?MACs'
                    line: 'MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512'
                    validate: /usr/sbin/sshd -t -f %s
                  notify: Restart sshd

              handlers:
                - name: Restart sshd
                  ansible.builtin.service:
                    name: sshd
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **An invalid SSH server configuration locks out remote access.** The `verify` property runs `sshd -t` against the edited copy of `sshd_config`, and Chef writes the file only if that copy passes. The `only_if` guard on the service runs `sshd -t` again before the restart and skips it if the complete configuration fails.

            Use this Chef Infra recipe code to restrict SSH to strong MAC algorithms:

            ```ruby
            sshd_config = '/etc/ssh/sshd_config'

            service 'sshd' do
              action :nothing
              only_if '/usr/sbin/sshd -t'
            end

            { 'MACs' => 'umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512' }.each do |keyword, value|
              file "set #{keyword} in sshd_config" do
                path sshd_config
                content(lazy do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  if body.match?(/^\s*#?\s*#{keyword}\b/i)
                    body.gsub(/^\s*#?\s*#{keyword}\b.*$/i, directive)
                  else
                    "#{body.chomp}\n#{directive}\n"
                  end
                end)
                verify '/usr/sbin/sshd -t -f %{path}'
                not_if { ::File.read(sshd_config).match?(/^#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, 'service[sshd]', :delayed
              end
            end
            ```
  - uid: mondoo-freebsd-security-only-strong-kex-algorithms-are-used
    title: Ensure only strong key exchange algorithms are used
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      sshd.config.kexs != empty
      sshd.config.kexs.containsOnly(["mlkem768x25519-sha256","sntrup761x25519-sha512","sntrup761x25519-sha512@openssh.com","curve25519-sha256@libssh.org","curve25519-sha256","diffie-hellman-group18-sha512","diffie-hellman-group16-sha512"])
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
        - url: https://www.openssh.org/txt/release-9.9
          title: OpenSSH 9.9 release notes
      desc: |
        This check verifies that the SSH server uses only strong key exchange algorithms and that weak algorithms such as diffie-hellman-group1-sha1 and diffie-hellman-group14-sha1 are not permitted.

        **Why this matters**

        The key exchange algorithm determines the shared secret used to encrypt the SSH session. Weak key exchange algorithms may be vulnerable to eavesdropping or man-in-the-middle attacks. Only modern, strong algorithms should be used:

        - The post-quantum hybrids `mlkem768x25519-sha256` and `sntrup761x25519-sha512`, which OpenSSH 9.9 and later provide. FreeBSD 13.5 and 14.3 ship OpenSSH 9.9, and FreeBSD 14.4 and 15.0 ship OpenSSH 10.0, where `mlkem768x25519-sha256` is the default. `sntrup761x25519-sha512@openssh.com` is the pre-9.9 spelling of the Streamlined NTRU Prime hybrid and remains accepted.
        - Curve25519 elliptic curve Diffie-Hellman.
        - Diffie-Hellman groups 16 and 18 with SHA-512.
      audit: |
        To verify the SSH key exchange algorithms, inspect the SSH server configuration file:

        ```bash
        grep -i '^[[:space:]]*KexAlgorithms' /etc/ssh/sshd_config
        ```

        If a `KexAlgorithms` line is returned and every algorithm on it is one of `mlkem768x25519-sha256`, `sntrup761x25519-sha512`, `sntrup761x25519-sha512@openssh.com`, `curve25519-sha256@libssh.org`, `curve25519-sha256`, `diffie-hellman-group18-sha512`, or `diffie-hellman-group16-sha512`, the check passes. If any other algorithm appears, such as `diffie-hellman-group1-sha1` or `diffie-hellman-group14-sha1`, or no line is returned, the check fails.

        Do not audit this with `sshd -T`. The check reads the configuration file, so a missing `KexAlgorithms` line fails even though `sshd -T` prints the default list.

        To list the algorithm names the installed `sshd` accepts, run `ssh -Q kex`. The first two names on the list above need OpenSSH 9.9 or later.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **`sshd` refuses to start when `KexAlgorithms` names an algorithm it does not implement.** The post-quantum hybrids `mlkem768x25519-sha256` and `sntrup761x25519-sha512` arrived in OpenSSH 9.9, so write the list that matches the OpenSSH release in the base system. List what the installed `sshd` accepts:

            ```bash
            ssh -V
            ssh -Q kex
            ```

            1. On FreeBSD 13.5, 14.3, and every later release, where OpenSSH is 9.9 or newer, edit `/etc/ssh/sshd_config` and set:

               ```text
               KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256@libssh.org,curve25519-sha256,diffie-hellman-group18-sha512,diffie-hellman-group16-sha512
               ```

            2. On an older release, where OpenSSH is 9.8 or earlier and `ssh -Q kex` lists neither hybrid, drop the first two names and set:

               ```text
               KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256@libssh.org,curve25519-sha256,diffie-hellman-group18-sha512,diffie-hellman-group16-sha512
               ```

               Keep only the names `ssh -Q kex` prints. OpenSSH releases before 8.5 have no Streamlined NTRU Prime hybrid under this name either, so on those hosts the directive keeps the Curve25519 and Diffie-Hellman entries only.

            The check accepts only the seven algorithms on the first line, so either list passes. You can remove algorithms from the list, but adding any other one fails the check. OpenSSH's default list includes the NIST `ecdh-sha2` curves, so leaving the directive out fails as well.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"

            # Keep only the algorithms this sshd implements. Naming one it does
            # not know stops sshd from starting, and the post-quantum hybrids
            # mlkem768x25519-sha256 and sntrup761x25519-sha512 arrived in
            # OpenSSH 9.9, which FreeBSD 13.5 and 14.3 were the first to ship.
            SUPPORTED="$(ssh -Q kex)"
            KEXS=""
            for kex in mlkem768x25519-sha256 sntrup761x25519-sha512 \
              sntrup761x25519-sha512@openssh.com curve25519-sha256@libssh.org \
              curve25519-sha256 diffie-hellman-group18-sha512 \
              diffie-hellman-group16-sha512; do
              if echo "$SUPPORTED" | grep -qx -- "$kex"; then
                if [ -z "$KEXS" ]; then
                  KEXS="$kex"
                else
                  KEXS="${KEXS},${kex}"
                fi
              fi
            done

            if [ -z "$KEXS" ]; then
              echo "ssh -Q kex listed none of the expected algorithms. Nothing was changed." >&2
              exit 1
            fi

            echo "Configuring strong SSH key exchange algorithms..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"
            if grep -q '^KexAlgorithms' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' "s/^KexAlgorithms.*/KexAlgorithms ${KEXS}/" "$SSHD_CONFIG"
            else
              echo "KexAlgorithms ${KEXS}" >> "$SSHD_CONFIG"
            fi

            # Validate the edited file before restarting. If sshd rejects it,
            # put the original back so a later restart or reboot still starts
            # sshd, and stop without restarting.
            if ! sshd -t -f "$SSHD_CONFIG"; then
              cp -p "${SSHD_CONFIG}.bak" "$SSHD_CONFIG"
              echo "sshd -t rejected the new configuration. The original file was restored." >&2
              exit 1
            fi
            service sshd restart

            echo "Strong SSH key exchange algorithms configured."
            ```
        - id: ansible
          desc: |
            To restrict SSH to strong key exchange algorithms using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            The first task reads `ssh -Q kex` so that the directive names only algorithms the host's OpenSSH release implements. The post-quantum hybrids `mlkem768x25519-sha256` and `sntrup761x25519-sha512` arrived in OpenSSH 9.9, which FreeBSD 13.5 and 14.3 were the first to ship, and an older `sshd` refuses to start when the directive names one of them.

            The `validate` option runs `sshd -t` against the edited copy of `sshd_config`, and Ansible writes the file only if that copy passes. A configuration `sshd` cannot parse would otherwise stop the service from starting again and lock out new SSH logins.

            ```yaml
            ---
            - name: Configure strong SSH key exchange algorithms
              hosts: all
              become: true

              vars:
                ssh_kex_algorithms:
                  - mlkem768x25519-sha256
                  - sntrup761x25519-sha512
                  - sntrup761x25519-sha512@openssh.com
                  - curve25519-sha256@libssh.org
                  - curve25519-sha256
                  - diffie-hellman-group18-sha512
                  - diffie-hellman-group16-sha512

              tasks:
                - name: Read the key exchange algorithms this OpenSSH release implements
                  ansible.builtin.command: ssh -Q kex
                  changed_when: false
                  register: ssh_supported_kex

                - name: Configure strong SSH key exchange algorithms
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '^#?KexAlgorithms'
                    line: "KexAlgorithms {{ ssh_kex_algorithms | select('in', ssh_supported_kex.stdout_lines) | join(',') }}"
                    validate: /usr/sbin/sshd -t -f %s
                  notify: Restart sshd

              handlers:
                - name: Restart sshd
                  ansible.builtin.service:
                    name: sshd
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **An invalid SSH server configuration locks out remote access.** The `verify` property runs `sshd -t` against the edited copy of `sshd_config`, and Chef writes the file only if that copy passes. The `only_if` guard on the service runs `sshd -t` again before the restart and skips it if the complete configuration fails.

            The recipe intersects the wanted list with `ssh -Q kex` so that the directive names only algorithms the host's OpenSSH release implements. The post-quantum hybrids `mlkem768x25519-sha256` and `sntrup761x25519-sha512` arrived in OpenSSH 9.9, which FreeBSD 13.5 and 14.3 were the first to ship, and an older `sshd` refuses to start when the directive names one of them.

            Use this Chef Infra recipe code to restrict SSH to strong key exchange algorithms:

            ```ruby
            sshd_config = '/etc/ssh/sshd_config'

            wanted_kex = %w(
              mlkem768x25519-sha256
              sntrup761x25519-sha512
              sntrup761x25519-sha512@openssh.com
              curve25519-sha256@libssh.org
              curve25519-sha256
              diffie-hellman-group18-sha512
              diffie-hellman-group16-sha512
            )
            supported_kex = shell_out!('ssh -Q kex').stdout.split("\n")

            service 'sshd' do
              action :nothing
              only_if '/usr/sbin/sshd -t'
            end

            { 'KexAlgorithms' => (wanted_kex & supported_kex).join(',') }.each do |keyword, value|
              file "set #{keyword} in sshd_config" do
                path sshd_config
                content(lazy do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  if body.match?(/^\s*#?\s*#{keyword}\b/i)
                    body.gsub(/^\s*#?\s*#{keyword}\b.*$/i, directive)
                  else
                    "#{body.chomp}\n#{directive}\n"
                  end
                end)
                verify '/usr/sbin/sshd -t -f %{path}'
                not_if { ::File.read(sshd_config).match?(/^#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, 'service[sshd]', :delayed
              end
            end
            ```
  - uid: mondoo-freebsd-security-ssh-root-login-is-disabled
    title: Ensure SSH root login is disabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      sshd.config.params["PermitRootLogin"].in(["no", "prohibit-password", "without-password"])
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that the SSH server does not allow the root account to log in with a password.

        The check reads `PermitRootLogin` in `/etc/ssh/sshd_config`, which must be `no`, `prohibit-password`, or the older synonym `without-password`.

        **Why this matters**

        `root` exists on every FreeBSD host, so it is the one account name an attacker never has to discover. Password-guessing traffic against SSH is aimed at it more than at anything else, and a single correct guess yields complete control with no further escalation required.

        Accountability is the other half. When administrators log in as themselves and escalate with `sudo` or `su`, the logs record which person ran which privileged command. When they log in as `root` directly, every action is attributed to `root`, and an investigation cannot distinguish one administrator from another, or from an intruder using the same credential.

        `prohibit-password` is usually the right setting for a server: it permits key-based root login for automation that genuinely needs it while removing the guessable password path entirely. `no` is stronger and appropriate where nothing depends on direct root access.

        Before applying `no`, confirm that an administrative account exists, that it can reach the host, and that it is a member of `wheel` so it can escalate. Locking out root without a verified path back in is a common way to lose access to a system.
      audit: |
        To verify the SSH root login setting, inspect the SSH server configuration file:

        ```bash
        grep -i '^[[:space:]]*PermitRootLogin' /etc/ssh/sshd_config
        ```

        If the value is `no`, `prohibit-password`, or `without-password`, the check passes. If the value is `yes`, or no line is returned, the check fails.

        Do not audit this with `sshd -T`. The check reads the configuration file, so a missing `PermitRootLogin` line fails even though `sshd -T` prints the secure built-in default.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Confirm another way into root before you apply this.** Log in as an administrative account that is a member of `wheel` and check that it can escalate with `su` or `sudo`. Without one, disabling root login removes your only remote path to root.

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            PermitRootLogin no
            ```

            `no` blocks every root login over SSH. `prohibit-password` also satisfies the check and keeps key-based root login for automation that needs it, while refusing passwords. The older synonym `without-password` is accepted too. The check reads the configuration file, so write the line even though OpenSSH applies a default when it is absent.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
        - id: sh
          desc: |
            **Using a Shell Script**

            **Confirm another way into root before you run this.** An account in the `wheel` group must be able to log in and escalate with `su` or `sudo`, or the script removes your only remote path to root.

            ```sh
            #!/bin/sh
            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"

            echo "Disabling SSH root login..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"
            if grep -q '^PermitRootLogin' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^PermitRootLogin.*/PermitRootLogin no/' "$SSHD_CONFIG"
            elif grep -q '^#PermitRootLogin' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^#PermitRootLogin.*/PermitRootLogin no/' "$SSHD_CONFIG"
            else
              echo 'PermitRootLogin no' >> "$SSHD_CONFIG"
            fi

            # Validate the edited file before restarting. If sshd rejects it,
            # put the original back so a later restart or reboot still starts
            # sshd, and stop without restarting.
            if ! sshd -t -f "$SSHD_CONFIG"; then
              cp -p "${SSHD_CONFIG}.bak" "$SSHD_CONFIG"
              echo "sshd -t rejected the new configuration. The original file was restored." >&2
              exit 1
            fi
            service sshd restart

            echo "SSH root login disabled."
            ```
        - id: ansible
          desc: |
            To disable SSH root login using Ansible:

            1. Confirm that an account in the `wheel` group can log in and escalate with `su` or `sudo`. The playbook removes root's own SSH login, so without that account you lose remote access to root.
            2. Add the following task to a playbook targeting the FreeBSD host.
            3. Run the playbook.

            The `validate` option runs `sshd -t` against the edited copy of `sshd_config`, and Ansible writes the file only if that copy passes. A configuration `sshd` cannot parse would otherwise stop the service from starting again and lock out new SSH logins.

            ```yaml
            ---
            - name: Disable SSH root login
              hosts: all
              become: true

