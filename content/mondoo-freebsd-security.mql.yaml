        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that IPv6 router advertisements are not accepted, preventing rogue router advertisement attacks.

        **Why this matters**

        Rogue IPv6 router advertisements can be used in man-in-the-middle attacks by directing traffic through an attacker-controlled system. Unless the system specifically requires IPv6 autoconfiguration, router advertisements should be disabled.
      audit: |
        To verify that IPv6 router advertisements are not accepted, run the following command:

        ```bash
        sysctl net.inet6.ip6.accept_rtadv
        ```

        If the value is `0`, router advertisements are rejected and the check passes. If the value is `1`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            `net.inet6.ip6.accept_rtadv` is the default each network interface copies into its own `accept_rtadv` flag when the interface attaches. Changing the parameter does not clear the flag on interfaces that already have it, and those interfaces keep accepting router advertisements until they are reconfigured.

            **Hosts that take their IPv6 address or default route from router advertisements lose them.** Configure a static IPv6 address and route first on any such host.

            1. Disable router advertisements immediately:

                ```bash
                sysctl net.inet6.ip6.accept_rtadv=0
                ```

            2. Make the change permanent by adding to `/etc/sysctl.conf`:

                ```ini
                net.inet6.ip6.accept_rtadv=0
                ```

            3. Clear the flag on every interface that already carries it:

                ```bash
                for ifn in $(ifconfig -l inet6); do ifconfig "$ifn" inet6 -accept_rtadv; done
                ```

            4. Remove the rc.conf settings that set the flag again at boot. Delete `accept_rtadv` from every `ifconfig_<interface>_ipv6` line in `/etc/rc.conf`, where `<interface>` is an interface name such as `em0`, and remove `ipv6_cpe_wanif` and the legacy `ipv6_enable` variable if either is set. If `rtsold_enable` is `YES`, stop and disable the router solicitation daemon:

                ```bash
                service rtsold stop
                sysrc rtsold_enable="NO"
                ```
        - id: sh
          desc: |
            **Using a Shell Script**

            **Hosts that take their IPv6 address or default route from router advertisements lose them.** Configure a static IPv6 address and route first on any such host.

            The script clears the `accept_rtadv` flag on interfaces that are already attached, because changing the parameter only affects interfaces that attach later. Remove `accept_rtadv` from the `ifconfig_<interface>_ipv6` lines in `/etc/rc.conf` by hand, or the flag returns at the next boot.

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling IPv6 router advertisements..."
            sysctl net.inet6.ip6.accept_rtadv=0

            if grep -q '^net.inet6.ip6.accept_rtadv' /etc/sysctl.conf 2>/dev/null; then
              sed -i '' 's/^net.inet6.ip6.accept_rtadv=.*/net.inet6.ip6.accept_rtadv=0/' /etc/sysctl.conf
            else
              echo 'net.inet6.ip6.accept_rtadv=0' >> /etc/sysctl.conf
            fi

            for ifn in $(ifconfig -l inet6); do
              ifconfig "$ifn" inet6 -accept_rtadv
            done

            echo "IPv6 router advertisements disabled."
            ```
        - id: ansible
          desc: |
            To reject IPv6 router advertisements using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            **Hosts that take their IPv6 address or default route from router advertisements lose them.** Configure a static IPv6 address and route first on any such host.

            ```yaml
            ---
            - name: Disable IPv6 router advertisement acceptance
              hosts: all
              become: true

              tasks:
                - name: Disable IPv6 router advertisement acceptance
                  ansible.posix.sysctl:
                    name: net.inet6.ip6.accept_rtadv
                    value: '0'
                    sysctl_file: /etc/sysctl.conf
                    reload: true
                  notify: Clear accept_rtadv on attached interfaces

              handlers:
                - name: Clear accept_rtadv on attached interfaces
                  ansible.builtin.shell: for ifn in $(ifconfig -l inet6); do ifconfig "$ifn" inet6 -accept_rtadv; done
                  changed_when: true
            ```

            The handler clears the `accept_rtadv` flag on interfaces that are already attached, because the parameter only sets the default for interfaces that attach later. Remove `accept_rtadv` from the `ifconfig_<interface>_ipv6` lines in `/etc/rc.conf` as well, or the flag returns at the next boot.
        - id: chef
          desc: |
            **Using Chef Infra**

            **Hosts that take their IPv6 address or default route from router advertisements lose them.** Skip this on hosts that rely on SLAAC, or configure a static IPv6 address and route first.

            Use this Chef Infra recipe code to reject IPv6 router advertisements. The `execute` resource clears the `accept_rtadv` flag on interfaces that are already attached, because the parameter only sets the default for interfaces that attach later.

            Remove `accept_rtadv` from the `ifconfig_<interface>_ipv6` lines in `/etc/rc.conf` as well, where `<interface>` is an interface name such as `em0`, or the flag returns at the next boot:

            ```ruby
            execute 'clear accept_rtadv on attached interfaces' do
              command 'for ifn in $(ifconfig -l inet6); do ifconfig "$ifn" inet6 -accept_rtadv; done'
              action :nothing
            end

            sysctl_conf = '/etc/sysctl.conf'

            execute 'reload sysctl settings' do
              command "sysctl -f #{sysctl_conf}"
              action :nothing
            end

            { 'net.inet6.ip6.accept_rtadv' => '0' }.each do |key, value|
              pattern = Regexp.escape(key)

              ruby_block "set #{key} in sysctl.conf" do
                block do
                  body = ::File.exist?(sysctl_conf) ? ::File.read(sysctl_conf) : ''
                  directive = "#{key}=#{value}"
                  body = if body.match?(/^\s*#{pattern}\s*=/)
                           body.gsub(/^\s*#{pattern}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n".lstrip
                         end
                  ::File.write(sysctl_conf, body)
                end
                not_if do
                  ::File.exist?(sysctl_conf) &&
                    ::File.read(sysctl_conf).match?(/^#{pattern}\s*=\s*#{Regexp.escape(value)}\s*$/)
                end
                notifies :run, 'execute[reload sysctl settings]', :delayed
                notifies :run, 'execute[clear accept_rtadv on attached interfaces]', :delayed
              end
            end
            ```
