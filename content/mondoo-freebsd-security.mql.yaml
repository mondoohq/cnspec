            Use this Chef Infra recipe code to stop and disable the NIS server:

            ```ruby
            service 'ypserv' do
              action %i(stop disable)
            end
            ```
  - uid: mondoo-freebsd-security-rpcbind-is-not-enabled
    title: Ensure rpcbind is not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      service("rpcbind").running == false
      service("rpcbind").enabled == false
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=rc.conf&sektion=5
          title: FreeBSD rc.conf(5)
      desc: |
        This check verifies that the `rpcbind` service is neither running nor enabled at boot.

        `rpcbind` is the portmapper. It listens on port 111 and tells callers which ports the system's RPC services are using, which is what NFS and NIS rely on to find each other. The check reads the service's running and enabled state.

        **Why this matters**

        `rpcbind` answers two questions for anyone who can reach it, and both help an attacker.

        It enumerates. A single query returns the list of RPC services registered on the host and the ports they occupy, so an attacker learns what the machine offers without scanning for it and without producing the traffic pattern that a scan would.

        It amplifies. Queries are small and responses can be considerably larger, and because the service answers over UDP the source address is trivially forged. That makes the host usable as a reflector in a denial of service attack against a third party, which the host itself will never see the effect of and which can land its address on public abuse lists.

        `rpcbind` is only needed where NFS or NIS is actually in use. It is frequently enabled because a client package pulled it in rather than because anything on the host requires it, so check what depends on it before concluding it is needed.
      audit: |
        To verify that `rpcbind` is not active, run the following commands:

        ```bash
        service rpcbind status
        sysrc -n rpcbind_enable
        ```

        If `service rpcbind status` reports the service is not running and `rpcbind_enable` is `NO`, the check passes. If the service is running or enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Find the services that still depend on `rpcbind`:

                ```bash
                sysrc -n nfs_server_enable mountd_enable nis_server_enable nis_client_enable rpc_statd_enable rpc_lockd_enable
                ```

                Each of these rc scripts force-starts `rpcbind` at boot when its own variable is `YES`, even with `rpcbind_enable` set to `NO`. A remaining `YES` brings `rpcbind` back on the next reboot and the check fails again.

            2. Stop and disable each dependent service this host does not need, for example `service mountd stop` followed by `sysrc mountd_enable="NO"`. If one of them is required, the host needs `rpcbind` and this check does not apply to it.

            3. Stop `rpcbind`, then disable it so it does not come back at boot:

                ```bash
                service rpcbind stop
                sysrc rpcbind_enable="NO"
                ```

            **Stop before you disable.** Once `rpcbind_enable` is `NO`, `service rpcbind stop` is refused with a message pointing at `onestop`, and the daemon keeps running until the next reboot.

            **RPC services on this host stop answering as soon as `rpcbind` stops.** That includes an NFS server, NIS, and NFS file locking through `rpc.lockd` and `rpc.statd`.
        - id: sh
          desc: |
            **Using a Shell Script**

            The script stops without changing anything if a service that force-starts `rpcbind` at boot is still enabled, because `rpcbind` would come back on the next reboot.

            ```sh
            #!/bin/sh
            set -e

            for rcvar in nfs_server_enable mountd_enable nis_server_enable nis_client_enable rpc_statd_enable rpc_lockd_enable; do
              case "$(sysrc -n "$rcvar")" in
                [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1)
                  echo "$rcvar is enabled and starts rpcbind at boot. Disable that service first." >&2
                  exit 1
                  ;;
              esac
            done

            echo "Disabling rpcbind..."
            sysrc rpcbind_enable="NO"
            service rpcbind onestop 2>/dev/null || true

            echo "rpcbind disabled."
            ```
        - id: ansible
          desc: |
            To disable `rpcbind` using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            The playbook fails before changing anything if a service that force-starts `rpcbind` at boot is still enabled, because `rpcbind` would come back on the next reboot.

            ```yaml
            ---
            - name: Disable rpcbind in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Read the rc.conf variables of services that start rpcbind
                  ansible.builtin.command: sysrc -n nfs_server_enable mountd_enable nis_server_enable nis_client_enable rpc_statd_enable rpc_lockd_enable
                  register: rpcbind_dependents
                  changed_when: false

                - name: Fail when a service that starts rpcbind is still enabled
                  ansible.builtin.fail:
                    msg: "A service that force-starts rpcbind at boot is still enabled. Disable it first."
                  when: rpcbind_dependents.stdout_lines | map('upper') | select('equalto', 'YES') | list | length > 0

                - name: Disable rpcbind in rc.conf
                  community.general.sysrc:
                    name: rpcbind_enable
                    value: 'NO'

                - name: Stop the rpcbind service
                  ansible.builtin.service:
                    name: rpcbind
                    state: stopped
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable rpcbind. Disable the NFS server, `mountd`, NIS, `rpc.statd`, and `rpc.lockd` first if this host does not need them, because each of those rc scripts force-starts `rpcbind` at boot while its own variable is `YES`:

            ```ruby
            service 'rpcbind' do
              action %i(stop disable)
            end
            ```
  - uid: mondoo-freebsd-security-nfs-server-is-not-enabled
    title: Ensure NFS server is not enabled
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      service("nfsd").running == false
      service("nfsd").enabled == false
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=rc.conf&sektion=5
          title: FreeBSD rc.conf(5)
        - url: https://docs.freebsd.org/en/books/handbook/network-servers/
          title: FreeBSD Handbook - Network Servers
      desc: |
        This check verifies that the NFS server daemon is neither running nor enabled at boot.

        When `nfsd` runs, the directories listed in `/etc/exports` are available to other machines over the NFS protocol. The check reads the service's running and enabled state.

        **Why this matters**

        NFS decides who you are by trusting the user and group IDs the client puts in each request. There is no authentication in the protocol beyond a check that the connection came from a permitted address, so anyone with root on a permitted client, or the ability to appear as one, can present any identity they choose and read the corresponding files.

        Where an export was written without `-maproot=root` being explicitly avoided, a remote root user is root on the exported files as well, which means they can create a setuid binary inside the export and execute it to escalate on any machine that mounts it.

        Exports are also easy to leave behind. An entry added to `/etc/exports` for a one-time transfer, without a host restriction, keeps exporting to everything that can reach the port, and nothing about the running system draws attention to it afterward.

        Where NFS is required, restrict each export to named hosts rather than to a subnet, keep root mapping in place, and confine the traffic to a storage network.
      audit: |
        To verify that the NFS daemon is not active, run the following commands:

        ```bash
        service nfsd status
        sysrc -n nfs_server_enable
        ```

        If `service nfsd status` reports the service is not running and `nfs_server_enable` is `NO`, the check passes. If the service is running or enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            The NFS server is not a single process. It is several cooperating daemons: `nfsd` serves file data, `mountd` handles mount requests and reads `/etc/exports`, and `rpcbind` advertises which ports those services listen on. Disabling only `nfsd` can leave `mountd` and `rpcbind` running, so the network surface stays partly open.

            Stop both the NFS daemon and `mountd`, then disable them so they do not come back at boot:

            ```bash
            service nfsd stop
            service mountd stop
            sysrc nfs_server_enable="NO"
            sysrc mountd_enable="NO"
            ```

            **Stop before you disable.** Once `nfs_server_enable` is `NO`, `service nfsd stop` is refused with a message pointing at `onestop`, and the daemon keeps running until the next reboot. The same applies to `mountd` and `mountd_enable`.

            If no other RPC services are needed on this host, also disable `rpcbind` by following the remediation for the check that `rpcbind` is not enabled. Leave `rpcbind` running only if another service requires it.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling NFS server..."
            sysrc nfs_server_enable="NO"
            sysrc mountd_enable="NO"
            service nfsd onestop 2>/dev/null || true
            service mountd onestop 2>/dev/null || true

            echo "NFS server disabled."
            ```
        - id: ansible
          desc: |
            To disable the NFS daemon using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Disable NFS server in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Disable the NFS server and mountd in rc.conf
                  community.general.sysrc:
                    name: "{{ item }}"
                    value: 'NO'
                  loop:
                    - nfs_server_enable
                    - mountd_enable

                - name: Stop nfsd and mountd
                  ansible.builtin.service:
                    name: "{{ item }}"
                    state: stopped
                  loop:
                    - nfsd
                    - mountd
            ```

            The playbook stops `mountd` as well as `nfsd`, because `mountd` keeps answering mount requests for the directories in `/etc/exports` on its own.
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the NFS daemon and `mountd`, which keeps answering mount requests for the directories in `/etc/exports` on its own:

            ```ruby
            %w(nfsd mountd).each do |svc|
              service svc do
                action %i(stop disable)
              end
            end
            ```
