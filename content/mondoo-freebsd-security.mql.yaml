    mql: |
      file("/etc/passwd") {
        user.name == 'root'
        group.name == 'wheel'
        permissions.user_executable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=passwd&sektion=5
          title: FreeBSD passwd(5)
      desc: |
        This check verifies that `/etc/passwd` is owned by `root:wheel` and has mode 0644 or more restrictive.

        **Why this matters**

        The `/etc/passwd` file contains user account information. If writable by unauthorized users, an attacker could add or modify accounts to gain access to the system. Proper ownership and permissions ensure only root can modify this critical file.
      audit: |
        To verify the ownership and permissions of `/etc/passwd`, run the following command:

        ```bash
        ls -l /etc/passwd
        ```

        If the file is owned by `root:wheel` with mode `0644` or more restrictive, the check passes. If group or other can write to it or it is executable, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Set the correct ownership and permissions:

            ```bash
            chown root:wheel /etc/passwd
            chmod 0644 /etc/passwd
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Setting permissions on /etc/passwd..."
            chown root:wheel /etc/passwd
            chmod 0644 /etc/passwd

            echo "Permissions on /etc/passwd configured."
            ```
        - id: ansible
          desc: |
            To set the correct ownership and permissions using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Secure /etc/passwd permissions
              hosts: all
              become: true

              tasks:
                - name: Secure /etc/passwd permissions
                  ansible.builtin.file:
                    path: /etc/passwd
                    owner: root
                    group: wheel
                    mode: '0644'
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the ownership and permissions on `/etc/passwd`:

            ```ruby
            file '/etc/passwd' do
              owner 'root'
              group 'wheel'
              mode '0644'
            end
            ```
