        - id: cli
          desc: |
            **Using the CLI**

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            PermitEmptyPasswords no
            ```

            Write the line even though OpenSSH already uses `no` when `PermitEmptyPasswords` is absent. The check reads the configuration file and fails until the directive is present there.

