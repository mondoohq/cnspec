            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"

            echo "Enabling SSH UsePAM..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"
            if grep -q '^UsePAM' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^UsePAM.*/UsePAM yes/' "$SSHD_CONFIG"
            elif grep -q '^#UsePAM' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^#UsePAM.*/UsePAM yes/' "$SSHD_CONFIG"
            else
              echo 'UsePAM yes' >> "$SSHD_CONFIG"
            fi

            # Validate the edited file before restarting. If sshd rejects it,
            # put the original back so a later restart or reboot still starts
            # sshd, and stop without restarting.
            if ! sshd -t -f "$SSHD_CONFIG"; then
              cp -p "${SSHD_CONFIG}.bak" "$SSHD_CONFIG"
              echo "sshd -t rejected the new configuration. The original file was restored." >&2
              exit 1
            fi
            service sshd restart

            echo "SSH UsePAM enabled."
            ```
        - id: ansible
          desc: |
            To enable SSH `UsePAM` using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            The `validate` option runs `sshd -t` against the edited copy of `sshd_config`, and Ansible writes the file only if that copy passes. A configuration `sshd` cannot parse would otherwise stop the service from starting again and lock out new SSH logins.

            ```yaml
