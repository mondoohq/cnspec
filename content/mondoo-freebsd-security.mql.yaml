      desc: |
        This check verifies that the `sudo` package is installed.

        **Why this matters**

        `sudo` provides granular privilege escalation control, allowing administrators to grant specific users permission to run specific commands as root without sharing the root password. Without `sudo`, privilege escalation typically requires sharing the root password via `su`, which is less secure and less auditable.
      audit: |
        To verify that the `sudo` package is installed, run the following command:

        ```bash
        pkg info sudo
        ```

        If `pkg info` reports the package as installed, the check passes. If the package is not found, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Install sudo:

            ```bash
            pkg install sudo
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Installing sudo..."
            if command -v sudo >/dev/null 2>&1; then
              echo "sudo is already installed."
            else
              # Refresh the package catalog first; on a fresh host it may be
              # stale or absent, which would make `pkg install` fail or install
              # an outdated version. On a minimal install where pkg itself is
              # not yet present, run `pkg bootstrap` before this step.
              pkg update
              pkg install -y sudo
              echo "sudo installed."
            fi
            ```
        - id: ansible
          desc: |
            To install `sudo` using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Install sudo
              hosts: all
              become: true

              tasks:
                - name: Install sudo
                  community.general.pkgng:
                    name: sudo
                    state: present
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to install sudo. On FreeBSD the `package` resource resolves to `freebsd_package`, which uses pkg:

            ```ruby
            package 'sudo' do
              action :install
            end
            ```
  - uid: mondoo-freebsd-security-sudo-commands-use-pty
    title: Ensure sudo commands use a pseudo terminal
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    filters: |
      package("sudo").installed
    mql: |
      sudoers.defaults.any(parameter == "use_pty" && negated == false)
    docs:
      refs:
        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that sudoers configuration includes `Defaults use_pty`, requiring sudo commands to run in a pseudo terminal.

        **Why this matters**

        When sudo is configured without `use_pty`, a malicious program run via sudo could fork a background process that retains elevated privileges after the sudo command completes. Requiring a pseudo terminal ensures that all child processes are terminated when the terminal session ends, preventing persistent privilege escalation.
      audit: |
        To verify that sudo is configured to use a pseudo terminal, inspect the sudoers configuration:

        ```bash
        grep -rE '^[^#]*Defaults.*use_pty' /usr/local/etc/sudoers /usr/local/etc/sudoers.d/
        ```

        If a `Defaults use_pty` line is returned, the check passes. If no such line is present, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit the sudoers file using `visudo` and add:

            ```text
            Defaults use_pty
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SUDOERS="/usr/local/etc/sudoers"
            SUDOERS_D="/usr/local/etc/sudoers.d"

            echo "Configuring sudo to use pty..."
            # Check if use_pty is already configured
            HAS_USE_PTY=false
            if grep -Eq '^[^#!]*Defaults[^#]*[[:space:],]use_pty' "$SUDOERS" 2>/dev/null; then
              HAS_USE_PTY=true
            fi
            if [ -d "$SUDOERS_D" ]; then
              for f in "$SUDOERS_D"/*; do
                if [ -f "$f" ] && grep -Eq '^[^#!]*Defaults[^#]*[[:space:],]use_pty' "$f" 2>/dev/null; then
                  HAS_USE_PTY=true
                fi
              done
            fi

            if [ "$HAS_USE_PTY" = false ]; then
              echo 'Defaults use_pty' > "${SUDOERS_D}/99-use-pty"
              chmod 0440 "${SUDOERS_D}/99-use-pty"
              echo "Added 'Defaults use_pty' to ${SUDOERS_D}/99-use-pty."
            else
              echo "'use_pty' is already configured."
            fi
            ```
        - id: ansible
          desc: |
            To require a pseudo terminal for sudo using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Require a pseudo terminal for sudo
              hosts: all
              become: true

              tasks:
                - name: Require a pseudo terminal for sudo
                  ansible.builtin.copy:
                    dest: /usr/local/etc/sudoers.d/99-use-pty
                    content: "Defaults use_pty\n"
                    owner: root
                    group: wheel
                    mode: '0440'
                    validate: 'visudo -cf %s'
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to require a pseudo terminal for sudo. The `sudo` resource knows FreeBSD keeps its sudoers configuration under `/usr/local/etc`, and validates the generated file with `visudo` before installing it.

            Set `visudo_binary` to `/usr/local/sbin/visudo`, where the sudo package installs it. The resource looks for `/usr/sbin/visudo` by default, and when that file is missing it logs a warning and installs the file without validating it:

            ```ruby
            sudo '99-use-pty' do
              defaults ['use_pty']
              visudo_binary '/usr/local/sbin/visudo'
            end
            ```
  - uid: mondoo-freebsd-security-sudo-nopasswd-is-not-configured
    title: Ensure NOPASSWD is not configured in sudoers
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    filters: |
      package("sudo").installed
    mql: |
      sudoers.userSpecs.none( tags.any( _.downcase == "nopasswd" ) )
    docs:
      refs:
        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that no sudoers files contain `NOPASSWD` entries, requiring users to authenticate before running commands with elevated privileges.

        **Why this matters**

        `NOPASSWD` entries in sudoers allow users to run commands as root without entering a password. If an attacker compromises a user account with `NOPASSWD` access, they can immediately escalate to root without any additional authentication barrier. Requiring password authentication for sudo adds an important layer of defense.
      audit: |
        To verify that no sudoers rule grants passwordless access, inspect the sudoers configuration:

        ```bash
        grep -riE '^[^#]*NOPASSWD' /usr/local/etc/sudoers /usr/local/etc/sudoers.d/
        ```

        If the command returns no output, no rule uses `NOPASSWD` and the check passes. If any line is returned, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Always edit the sudoers files with `visudo`. It checks the syntax before saving and refuses to write a broken file. A syntax error in `sudoers` can break sudo for every user, including the administrator, so do not bypass `visudo` by editing the file directly.

            ```bash
            visudo
            ```

            Remove the `NOPASSWD` tag from any rule so that sudo prompts for a password. For example, change a line like:

            ```text
            alice ALL=(ALL) NOPASSWD: ALL
            ```

            to:

            ```text
            alice ALL=(ALL) PASSWD: ALL
            ```

            Files under `/usr/local/etc/sudoers.d/` are included by the main sudoers file, so check and fix those too. Edit each one with `visudo -f /usr/local/etc/sudoers.d/<file>`.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SUDOERS="/usr/local/etc/sudoers"
            SUDOERS_D="/usr/local/etc/sudoers.d"

            echo "Checking for NOPASSWD entries in sudoers..."
            FOUND=false

            if grep -i 'nopasswd' "$SUDOERS" 2>/dev/null | grep -v '^#' | grep -qi 'nopasswd'; then
              echo "WARNING: NOPASSWD found in $SUDOERS"
              FOUND=true
            fi

            if [ -d "$SUDOERS_D" ]; then
              for f in "$SUDOERS_D"/*; do
                if [ -f "$f" ] && grep -v '^#' "$f" 2>/dev/null | grep -qi 'nopasswd'; then
                  echo "WARNING: NOPASSWD found in $f"
                  FOUND=true
                fi
              done
            fi

            if [ "$FOUND" = true ]; then
              echo "Please manually edit the sudoers files with 'visudo' to remove NOPASSWD entries."
              exit 1
            fi

            echo "No NOPASSWD entries found in sudoers."
            ```
        - id: ansible
          desc: |
            To detect `NOPASSWD` sudoers entries using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook, then edit the reported files with `visudo` to remove the `NOPASSWD` tag.

            ```yaml
            ---
            - name: Search for NOPASSWD entries
              hosts: all
              become: true

              tasks:
                - name: Search for NOPASSWD entries
                  ansible.builtin.shell: "grep -rilE '^[^#]*NOPASSWD' /usr/local/etc/sudoers /usr/local/etc/sudoers.d/ || true"
                  register: nopasswd_files
                  changed_when: false

                - name: Fail when NOPASSWD is configured
                  ansible.builtin.fail:
                    msg: "NOPASSWD found in: {{ nopasswd_files.stdout }}"
                  when: nopasswd_files.stdout | length > 0
            ```
        # No Chef Infra remediation: resolving this means deciding which account or sudoers entry to change, which is a human decision rather than a converge step.
  - uid: mondoo-freebsd-security-firewall-is-enabled
    title: Ensure a firewall is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      service("ipfw").enabled || service("pf").enabled
    docs:
      refs:
        - url: https://docs.freebsd.org/en/books/handbook/firewalls/
          title: FreeBSD Handbook - Firewalls
      desc: |
        This check verifies that at least one firewall service (`ipfw` or `pf`) is enabled.

        **Why this matters**

        A firewall is a fundamental network security control that filters incoming and outgoing traffic based on defined rules. Without an active firewall, the system accepts connections on all listening ports, exposing services to potential attacks from the network. FreeBSD supports both `ipfw` and `pf` as firewall options.
      audit: |
        To verify that a firewall service is enabled, run the following command:

        ```bash
        sysrc -n firewall_enable pf_enable
        ```

        If `firewall_enable` (ipfw) or `pf_enable` is `YES`, a firewall is enabled and the check passes. If both are `NO`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Starting a firewall on a remote system can terminate your SSH session and lock you out.** Run these commands from the system console, and confirm the rule set allows SSH before starting the firewall.

            Enable `ipfw`. The `workstation` profile opens the ports in `firewall_myservices` to the networks in `firewall_allowservices`. The example below allows SSH from a single admin network instead of from any source, which keeps the management surface small:

            ```bash
            sysrc firewall_enable="YES"
            sysrc firewall_type="workstation"
            sysrc firewall_myservices="22/tcp"
            sysrc firewall_allowservices="<admin-network>/24"
            service ipfw start
            ```

            Before you run `service ipfw start`, replace `22/tcp` with the real SSH port if this host listens on a non-default port, and replace `<admin-network>/24` with your actual administrative network in CIDR notation. If `firewall_myservices` does not list the port you are connected on, or `firewall_allowservices` does not include your source network, starting the firewall will drop your session.

            Or enable `pf` after creating an `/etc/pf.conf` rule set that allows SSH:

            ```bash
            sysrc pf_enable="YES"
            service pf start
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            **Starting a firewall on a remote system can terminate your SSH session and lock you out.** Run this script from the system console, and confirm the rule set allows SSH before starting the firewall.

            The `workstation` firewall type admits inbound connections only to the ports in `firewall_myservices`, and only from the sources in `firewall_allowservices`:

            - `firewall_myservices` is `22/tcp`, the SSH port. Replace it with the real SSH port if the host listens elsewhere, and add every other port this host serves, separated by spaces, or those services stop answering.
            - `firewall_allowservices` is `any`, which lets every source reach those ports. Replace it with your administrative network in CIDR notation, such as `192.0.2.0/24`, to limit who can connect.

            The script leaves an existing configuration alone when `firewall_enable` or `pf_enable` is already on, in any letter case.

            ```sh
            #!/bin/sh
            set -e

            echo "Checking firewall status..."
            # rc.subr accepts YES, TRUE, ON, or 1 in any letter case.
            is_on() {
              case "$1" in
                [Yy][Ee][Ss]|[Tt][Rr][Uu][Ee]|[Oo][Nn]|1) return 0 ;;
                *) return 1 ;;
              esac
            }

            IPFW_ENABLED=$(sysrc -n firewall_enable 2>/dev/null || echo "NO")
            PF_ENABLED=$(sysrc -n pf_enable 2>/dev/null || echo "NO")

            if is_on "$IPFW_ENABLED" || is_on "$PF_ENABLED"; then
              echo "A firewall is already enabled."
            else
              echo "No firewall enabled. Enabling ipfw in workstation mode..."
              sysrc firewall_enable="YES"
              sysrc firewall_type="workstation"
              sysrc firewall_myservices="22/tcp"
              sysrc firewall_allowservices="any"
              service ipfw start

              echo "ipfw firewall enabled in workstation mode."
            fi
            ```
        - id: ansible
          desc: |
            To enable a firewall using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            **Starting a firewall on a remote system can terminate the SSH connection Ansible uses and lock you out.** Confirm the rule set allows SSH from the control node before you run the playbook.

            The `workstation` firewall type admits inbound connections only to the ports in `firewall_myservices`, and only from the sources in `firewall_allowservices`:

            - `firewall_myservices` is `22/tcp`, the SSH port. Replace it with the real SSH port if the host listens elsewhere, and add every other port this host serves, separated by spaces, or those services stop answering.
            - `firewall_allowservices` is `any`, which lets every source reach those ports. Replace it with your administrative network in CIDR notation, such as `192.0.2.0/24`, to limit who can connect.

            ```yaml
            ---
            - name: Enable ipfw in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Enable ipfw in rc.conf
                  community.general.sysrc:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                  loop:
                    - { name: firewall_enable, value: 'YES' }
                    - { name: firewall_type, value: 'workstation' }
                    - { name: firewall_myservices, value: '22/tcp' }
                    - { name: firewall_allowservices, value: 'any' }

                - name: Start the ipfw service
                  ansible.builtin.service:
                    name: ipfw
                    state: started
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **Confirm the rule set allows your management access before you apply this.** Starting a firewall on a remote system can terminate your SSH session and lock you out.

            The `workstation` firewall type admits inbound connections only to the ports in `firewall_myservices`, and only from the sources in `firewall_allowservices`:

            - `firewall_myservices` is `22/tcp`, the SSH port. Replace it with the real SSH port if the host listens elsewhere, and add every other port this host serves, separated by spaces, or those services stop answering.
            - `firewall_allowservices` is `any`, which lets every source reach those ports. Replace it with your administrative network in CIDR notation, such as `192.0.2.0/24`, to limit who can connect.

            Use this Chef Infra recipe code to enable ipfw:

            ```ruby
            service 'ipfw' do
              action :nothing
            end

            {
              'firewall_enable' => 'YES',
              'firewall_type' => 'workstation',
              'firewall_myservices' => '22/tcp',
              'firewall_allowservices' => 'any',
            }.each do |key, value|
              execute "set #{key} in rc.conf" do
                command "sysrc #{key}='#{value}'"
                not_if "sysrc -n #{key} | grep -qxF '#{value}'"
                notifies :start, 'service[ipfw]', :delayed
              end
            end
            ```
  - uid: mondoo-freebsd-security-time-synchronization-is-enabled
    title: Ensure a time synchronization daemon is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a7
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-45
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      ["ntpd", "openntpd", "chronyd"].any(service(_).enabled && service(_).running)
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=ntpd&sektion=8
          title: FreeBSD ntpd(8)
      desc: |
        This check verifies that a time synchronization daemon is enabled and running. FreeBSD ships `ntpd` in the base system but leaves it disabled, and OpenNTPD and chrony are available from packages as alternatives. Any of the three satisfies the check, and each is turned on with its own `_enable` variable in `/etc/rc.conf`.

        **Why this matters**

        Every log line and audit record on the host is stamped with the local clock, and a host whose clock has drifted cannot be placed on the same timeline as the firewall, the authentication server, or the other machines in an investigation. The events are all present and their order is wrong, which is worse than missing data because it leads to the wrong conclusion about what happened first.

        Authentication depends on the clock directly. Kerberos rejects tickets outside a tolerance of a few minutes, so a drifting host loses domain authentication. TLS is the more dangerous case, because certificate validity is evaluated against local time through the `notBefore` and `notAfter` fields: a clock set behind real time accepts certificates that have expired or been revoked and replaced, and one set ahead rejects certificates that are perfectly valid.

        An attacker with root can move the clock deliberately for the same reason, to shift the timestamps on the records of what they did, or to push a session or token outside the window in which it would have been questioned.

        Point the daemon at time sources the organization controls or explicitly trusts, and configure more than one so that a single unreachable server does not leave the clock unattended.
      audit: |
        To verify that a time synchronization daemon is active, run the following commands:

        ```bash
        service ntpd status
        sysrc -n ntpd_enable
        ```

        If `service ntpd status` reports the service is running and `ntpd_enable` is `YES`, the check passes. If you run OpenNTPD or chrony instead, check the equivalent service and rc.conf variable (`service openntpd status` / `sysrc -n openntpd_enable`, or `service chronyd status` / `sysrc -n chronyd_enable`). If no time synchronization daemon is enabled and running, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Enable and start `ntpd` from the base system. The `ntpd_sync_on_start` option steps the clock at startup so large initial offsets are corrected immediately rather than slewed slowly:

            ```bash
            sysrc ntpd_enable="YES"
            sysrc ntpd_sync_on_start="YES"
            service ntpd start
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Enabling time synchronization daemon (ntpd)..."
            sysrc ntpd_enable="YES"
            sysrc ntpd_sync_on_start="YES"
            # Start ntpd unless it is already running. A failed start stops the
            # script under set -e instead of reporting success.
            service ntpd status >/dev/null 2>&1 || service ntpd start

            echo "ntpd enabled and started."
            ```
        - id: ansible
          desc: |
            To enable a time synchronization daemon using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Enable ntpd in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Enable ntpd in rc.conf
                  community.general.sysrc:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                  loop:
                    - { name: ntpd_enable, value: 'YES' }
                    - { name: ntpd_sync_on_start, value: 'YES' }

                - name: Start the ntpd service
                  ansible.builtin.service:
                    name: ntpd
                    state: started
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to enable and start `ntpd` from the base system. The FreeBSD service provider sets `ntpd_enable` in `/etc/rc.conf`, and `ntpd_sync_on_start` steps the clock at startup so a large initial offset is corrected immediately:

            ```ruby
            execute 'set ntpd_sync_on_start in rc.conf' do
              command 'sysrc ntpd_sync_on_start=YES'
              not_if 'sysrc -n ntpd_sync_on_start | grep -qix yes'
            end

            service 'ntpd' do
              action %i(enable start)
            end
            ```
  - uid: mondoo-freebsd-security-pkg-signature-verification-is-enabled
    title: Ensure pkg repository signature verification is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-d
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-id-ra-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      file("/etc/pkg/FreeBSD.conf").exists && file("/etc/pkg/FreeBSD.conf").content.find(/(?sm)^\w[\w.-]*\s*:\s*\{(?:[^\n]*\}[^\n]*$|.*?^\})/).where(_ != /(?i)enabled\s*:\s*(no|false|off|0)\b/).all(_ == /(?i)signature_type\s*:\s*["']?(fingerprints|pubkey)\b/)
      files.find(from: "/usr/local/etc/pkg/repos", regex: ".*[.]conf$", type: "file").list.all(content.find(/(?sm)^\w[\w.-]*\s*:\s*\{(?:[^\n]*\}[^\n]*$|.*?^\})/).where(_ != /(?i)enabled\s*:\s*(no|false|off|0)\b/).all(_ == /(?i)signature_type\s*:\s*["']?(fingerprints|pubkey)\b/ || _ != /(?i)signature_type\s*:/ && file("/etc/pkg/FreeBSD.conf").content.contains(_.split(":")[0].trim)))
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=pkg.conf&sektion=5
          title: FreeBSD pkg.conf(5)
      desc: |
        This check verifies that every enabled pkg repository requires a signature before anything is installed from it.

        pkg reads repository definitions from the directories in `REPOS_DIR`, which defaults to `/etc/pkg/` and `/usr/local/etc/pkg/repos/`. Files are read in that order, and a block that reuses a repository name overrides only the keys it sets, keeping the rest of the earlier definition.

        The base repositories are defined in `/etc/pkg/FreeBSD.conf`. Every block there ships with `signature_type: "fingerprints"` and validates packages against the trusted keys in `/usr/share/keys/pkg`. FreeBSD 14 defines `FreeBSD` and `FreeBSD-kmods`, and FreeBSD 15 defines `FreeBSD-ports`, `FreeBSD-ports-kmods`, and `FreeBSD-base`. The check reads each block on its own, so one repository downgraded to `signature_type: "none"` fails the check even when the other blocks in the file still enforce fingerprints. Both `fingerprints` and `pubkey` are accepted, the latter validating against a configured public key. A repository that declares no `signature_type` gets `NONE`, so an enabled block that omits the key fails exactly as one setting `"none"` does. Removing the file fails the check as well.

        The check then reads the repository files in `/usr/local/etc/pkg/repos/*.conf`. A block naming a repository that `/etc/pkg/FreeBSD.conf` already defines inherits the `signature_type` from there, so the usual override that points a base repository at another URL, or re-enables it, keeps fingerprint verification and passes. A block naming a repository defined nowhere else creates that repository from scratch and has to declare `fingerprints` or `pubkey` itself. A block setting any other `signature_type` fails wherever it appears.

        Repositories turned off with `enabled: no` are exempt. pkg uses a repository only while it is enabled, so a disabled one is never contacted and cannot deliver a package. Requiring a signature there would also fail the documented way of turning off a base repository, which writes an override block containing nothing but `enabled: no`.

        **Why this matters**

        Package installation runs as root, and post-install scripts execute before anything on the host inspects what arrived. Signature verification is the only step that establishes the package came from the FreeBSD signing infrastructure rather than from whoever answered the request.

        Without it, an attacker who controls a mirror or sits on the network path between the host and the repository substitutes a package with the same name and a higher version. The next `pkg upgrade` installs it and its script runs as root. No exploit is involved, and the operation reports success.

        Verification also catches the ordinary case of a corrupted or partially replaced file on a mirror, which fails the check in the same way a deliberately modified package does.
      audit: |
        To see the configuration pkg uses after merging every repository file, run:

        ```bash
        pkg -vv
        ```

        The `Repositories:` section at the end lists each repository with its effective settings, in upper case:

        ```
          FreeBSD: {
            url             : "pkg+https://pkg.FreeBSD.org/FreeBSD:14:amd64/latest",
            enabled         : yes,
            priority        : 0,
            mirror_type     : "SRV",
            signature_type  : "FINGERPRINTS",
            fingerprints    : "/usr/share/keys/pkg"
          }
        ```

        Every repository reporting `enabled: yes` should report `signature_type: "FINGERPRINTS"` or `signature_type: "PUBKEY"`. One reporting `"NONE"` accepts unsigned packages and the check fails.

        To see where each setting comes from, read the files pkg merges, in the order it reads them:

        ```bash
        cat /etc/pkg/FreeBSD.conf
        cat /usr/local/etc/pkg/repos/*.conf
        ```

        Every enabled block in `/etc/pkg/FreeBSD.conf` needs its own `signature_type`, because a block that omits it gets `NONE`. A block in `/usr/local/etc/pkg/repos` that reuses a repository name from `/etc/pkg/FreeBSD.conf` keeps whatever it does not restate, so an override setting only a `url` or `enabled` still verifies signatures. A block naming a repository defined nowhere else needs a `signature_type` of its own.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Restore fingerprint verification for the base repositories by editing `/etc/pkg/FreeBSD.conf` so that every enabled repository block contains the two lines below. Fix each block on its own, because one block set to `"none"` leaves that repository unverified no matter what the others say, and a block that declares no `signature_type` at all is unverified in the same way. FreeBSD 14 names the blocks `FreeBSD` and `FreeBSD-kmods`, and FreeBSD 15 names them `FreeBSD-ports`, `FreeBSD-ports-kmods`, and `FreeBSD-base`:

                ```ini
                signature_type: "fingerprints",
                fingerprints: "/usr/share/keys/pkg"
                ```

            2. Ensure the fingerprint keys are present. They ship with the base system under `/usr/share/keys/pkg`:

                ```bash
                ls /usr/share/keys/pkg/trusted
                ```

                If the directory is missing or empty, restore it from a known-good host of the same FreeBSD release before running `pkg update`.

            3. List the repository files under `/usr/local/etc/pkg/repos` that switch verification off:

                ```bash
                grep -Ei 'signature_type[[:space:]]*:[[:space:]]*"?none' /usr/local/etc/pkg/repos/*.conf
                ```

                Then list the files that define a repository of their own without a `signature_type`:

                ```bash
                for f in /usr/local/etc/pkg/repos/*.conf; do
                  grep -qi 'signature_type' "$f" && continue
                  grep -Eo '^[A-Za-z0-9_][A-Za-z0-9_.-]*[[:space:]]*:[[:space:]]*\{' "$f" | sed -E 's/[[:space:]]*:.*//' | while read -r name; do
                    grep -Eq "^${name}[[:space:]]*:" /etc/pkg/FreeBSD.conf || echo "$f defines $name with no signature_type"
                  done
                done
                ```

                The check fails for each file the two commands print. A repository that declares no `signature_type` gets `NONE` and installs packages without verifying them. A file that only overrides one of the FreeBSD repositories, by pointing it at another URL or by enabling it, keeps the `signature_type` from `/etc/pkg/FreeBSD.conf` and needs no change. Add a `signature_type` to the repository block in each file the commands report:

                - For a file that defines a repository of its own that the FreeBSD signing infrastructure signs, copy the two lines from step 1.
                - For a third-party or internal repository, use `signature_type: "pubkey"` and set `pubkey` to the path of the public key that repository signs with, such as `/usr/local/etc/ssl/pkg.pub`. Get that key from the repository's operator. `fingerprints` also works if the operator publishes a fingerprints directory.

            4. Run `pkg update -f` and confirm every repository updates without a signature error.
        - id: sh
          desc: |
            **Using a Shell Script**

            The script switches every `signature_type: "none"` in `/etc/pkg/FreeBSD.conf` back to `fingerprints` and warns when a block there declares no `signature_type` at all. Under `/usr/local/etc/pkg/repos` it only reports the files that define a repository of their own without one, because the right key for those depends on who signs the repository, and it leaves the files that merely override a FreeBSD repository alone, since those inherit the setting from `/etc/pkg/FreeBSD.conf`. Fix the files it reports with step 3 of the CLI instructions.

            ```sh
            #!/bin/sh
            set -e

            CONF=/etc/pkg/FreeBSD.conf

            echo "Restoring pkg signature verification..."
            if grep -q 'signature_type:[[:space:]]*"none"' "$CONF" 2>/dev/null; then
              sed -i '' 's/signature_type:[[:space:]]*"none"/signature_type: "fingerprints"/' "$CONF"
              echo "signature_type set to fingerprints in $CONF."
            fi

            # A block that declares no signature_type gets NONE, so every block
            # in the base file needs one of its own. Track the blocks one at a
            # time, because two signature_type lines in one block would hide a
            # second block that has none.
            awk '
              /^[A-Za-z0-9_][A-Za-z0-9_.-]*[[:space:]]*:[[:space:]]*\{/ {
                if (inblock && !sig) print name
                inblock = 1; sig = 0; name = $1; sub(/:.*/, "", name)
              }
              tolower($0) ~ /signature_type[[:space:]]*:/ { sig = 1 }
              END { if (inblock && !sig) print name }
            ' "$CONF" | while read -r name; do
              echo "WARNING: block $name in $CONF declares no signature_type. Add one by hand." >&2
            done

            if [ ! -d /usr/share/keys/pkg/trusted ]; then
              echo "WARNING: /usr/share/keys/pkg/trusted is missing; restore the fingerprint keys before running pkg update." >&2
            fi

            # A file that reuses a repository name from the base file inherits
            # its signature_type. A file that names a new repository does not,
            # and the key to use depends on who signs that repository, so report
            # it instead of guessing.
            for f in /usr/local/etc/pkg/repos/*.conf; do
              [ -f "$f" ] || continue
              if grep -qi 'signature_type' "$f"; then
                continue
              fi
              grep -Eo '^[A-Za-z0-9_][A-Za-z0-9_.-]*[[:space:]]*:[[:space:]]*\{' "$f" | sed -E 's/[[:space:]]*:.*//' | while read -r name; do
                grep -Eq "^${name}[[:space:]]*:" "$CONF" ||
                  echo "WARNING: $f defines repository $name without signature_type. Add one by hand." >&2
              done
            done

            echo "pkg signature verification configured."
            ```
        - id: ansible
          desc: |
            To restore pkg signature verification using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            `/etc/pkg/FreeBSD.conf` holds more than one repository block, so the playbook uses `replace`, which changes every `signature_type: "none"` in the file. A block that declares no `signature_type` at all still needs a hand edit, as does every repository file under `/usr/local/etc/pkg/repos` that step 3 of the CLI instructions reports.

            ```yaml
            ---
            - name: Enforce fingerprint signature verification for the base repositories
              hosts: all
              become: true

              tasks:
                - name: Enforce fingerprint signature verification for the base repositories
                  ansible.builtin.replace:
                    path: /etc/pkg/FreeBSD.conf
                    regexp: 'signature_type:\s*"none"'
                    replace: 'signature_type: "fingerprints"'

                - name: Confirm the trusted fingerprint keys are present
                  ansible.builtin.stat:
                    path: /usr/share/keys/pkg/trusted
                  register: pkg_keys

                - name: Fail when the fingerprint keys are missing
                  ansible.builtin.fail:
                    msg: "/usr/share/keys/pkg/trusted is missing; restore the fingerprint keys before running pkg update."
                  when: not pkg_keys.stat.exists
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to switch every `signature_type: "none"` in `/etc/pkg/FreeBSD.conf` back to `fingerprints`. A block that declares no `signature_type` at all still needs a hand edit, as does every repository file under `/usr/local/etc/pkg/repos` that step 3 of the CLI instructions reports:

            ```ruby
            pkg_conf = '/etc/pkg/FreeBSD.conf'

            ruby_block 'restore fingerprint verification in FreeBSD.conf' do
              block do
                body = ::File.read(pkg_conf)
                ::File.write(pkg_conf, body.gsub(/signature_type:\s*"none"/, 'signature_type: "fingerprints"'))
              end
              only_if { ::File.exist?(pkg_conf) && ::File.read(pkg_conf).match?(/signature_type:\s*"none"/) }
            end
            ```
