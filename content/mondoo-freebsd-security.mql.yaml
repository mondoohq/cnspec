      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      service("dovecot").running == false
      service("dovecot").enabled == false
      service("imapd").running == false
      service("imapd").enabled == false
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=rc.conf&sektion=5
          title: FreeBSD rc.conf(5)
      desc: |
        This check verifies that the Dovecot and Cyrus IMAP mail access services are neither running nor enabled at boot.

        The check reads the running and enabled state of the `dovecot` and `imapd` services.

        **Why this matters**

        IMAP and POP3 servers on FreeBSD normally authenticate through PAM against the system's own accounts. That makes an unintended mail service a second front door to the host, using the same usernames and passwords as SSH.

        This matters most on hosts that have been hardened everywhere else. A machine configured for key-only SSH, with root login disabled and `LoginGraceTime` lowered, still accepts unlimited password attempts on port 143 if `dovecot` is listening. None of the controls placed on the intended login path applies to one nobody knew was there.

        Both daemons also parse client input before authentication completes, accepting commands from anyone who can open the connection. That is a pre-authentication attack surface on a host that has no reason to have one.

        Where the host is a mail server, that is a deliberate role. Require TLS, disable plaintext authentication, and apply the same rate limiting used on other authentication paths. Everywhere else, stop and disable both services.
      audit: |
        To verify that IMAP and POP3 services are not active, run the following commands:

        ```bash
        service dovecot status
        service imapd status
        sysrc -n dovecot_enable cyrus_imapd_enable
        ```

        The cyrus-imapd port installs its rc script as `imapd` while keeping `cyrus_imapd_enable` as the rc.conf variable, so the service name and the rc variable differ.

        If neither service is running or enabled, the check passes. If either one is running or enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Stop the mail access services, then disable them so they do not come back at boot:

            ```bash
            service dovecot stop
            service imapd stop
            sysrc dovecot_enable="NO"
            sysrc cyrus_imapd_enable="NO"
            ```

            The cyrus-imapd port installs its rc script as `imapd` while keeping `cyrus_imapd_enable` as the rc.conf variable, so the two names differ by design.

            **Stop before you disable.** Once the rc variable is `NO`, `service ... stop` is refused with a message pointing at `onestop`, and the daemon keeps running until the next reboot.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling IMAP and POP3 services..."
            sysrc dovecot_enable="NO" 2>/dev/null || true
            service dovecot onestop 2>/dev/null || true
            sysrc cyrus_imapd_enable="NO" 2>/dev/null || true
            service imapd onestop 2>/dev/null || true

            echo "IMAP and POP3 services disabled."
            ```
        - id: ansible
          desc: |
            To disable IMAP and POP3 services using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Disable mail access services in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Disable mail access services in rc.conf
                  community.general.sysrc:
                    name: "{{ item }}"
                    value: 'NO'
                  loop:
                    - dovecot_enable
                    - cyrus_imapd_enable

                - name: Stop mail access services
                  ansible.builtin.service:
                    name: "{{ item }}"
                    state: stopped
                  loop:
                    - dovecot
                    - imapd
                  failed_when: false
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the IMAP and POP3 daemons:

            ```ruby
            %w(dovecot imapd).each do |svc|
              service svc do
                action %i(stop disable)
              end
            end
            ```
