  - uid: mondoo-freebsd-security-ssh-idle-timeout-interval-is-configured
    title: Ensure SSH idle timeout interval is configured
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      sshd.config.params["ClientAliveInterval"] >= 1
      sshd.config.params["ClientAliveInterval"] <= 300
      sshd.config.params["ClientAliveCountMax"] >= 1
      sshd.config.params["ClientAliveCountMax"] <= 3
    docs:
      refs:
        - url: https://man.openbsd.org/sshd_config
          title: OpenSSH sshd_config(5)
      desc: |
        This check verifies that the SSH server terminates sessions whose client has stopped responding.

        The check reads `ClientAliveInterval`, which must be between 1 and 300 seconds, and `ClientAliveCountMax`, which must be between 1 and 3.

        **Why this matters**

        The two directives work together. `sshd` sends an encrypted keepalive every `ClientAliveInterval` seconds and closes the session after `ClientAliveCountMax` of them go unanswered, so the product is the longest a session can survive with nothing on the other end.

        What this closes is the abandoned session. An administrator connects from a laptop, authenticates, and then closes the lid, loses the network, or walks away. The connection stays established on the server, holding an authenticated shell with that administrator's privileges, and anyone who reaches the client machine reaches that shell with no authentication step in between.

        It also frees sessions stranded by network changes, which would otherwise accumulate and hold resources indefinitely.

        A `ClientAliveCountMax` of `0` is rejected. OpenSSH treats zero as disabling connection termination, so the daemon never drops an unresponsive session no matter how short the interval is.

        These directives use the encrypted channel, so they detect a dead peer rather than merely keeping a NAT mapping alive, which is what the unrelated `TCPKeepAlive` option does.
      audit: |
        To verify the SSH idle timeout settings in effect, run the following command:

        ```bash
        sshd -T | grep -iE '^clientalive'
        ```

        If `ClientAliveInterval` is between `1` and `300` seconds and `ClientAliveCountMax` is between `1` and `3`, the check passes. Otherwise the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            ClientAliveInterval 300
            ClientAliveCountMax 3
            ```

            `ClientAliveInterval` must be between `1` and `300` seconds and `ClientAliveCountMax` between `1` and `3`. With these values `sshd` closes a session after about 15 minutes without a response from the client. Lower values close abandoned sessions sooner. `ClientAliveCountMax 0` fails the check, because OpenSSH treats it as never closing the session.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            SSHD_CONFIG="/etc/ssh/sshd_config"

            echo "Configuring SSH idle timeout..."
            cp -p "$SSHD_CONFIG" "${SSHD_CONFIG}.bak"

            # Set ClientAliveInterval
            if grep -q '^ClientAliveInterval' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^ClientAliveInterval.*/ClientAliveInterval 300/' "$SSHD_CONFIG"
            elif grep -q '^#ClientAliveInterval' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^#ClientAliveInterval.*/ClientAliveInterval 300/' "$SSHD_CONFIG"
            else
              echo 'ClientAliveInterval 300' >> "$SSHD_CONFIG"
            fi

            # Set ClientAliveCountMax
            if grep -q '^ClientAliveCountMax' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^ClientAliveCountMax.*/ClientAliveCountMax 3/' "$SSHD_CONFIG"
            elif grep -q '^#ClientAliveCountMax' "$SSHD_CONFIG" 2>/dev/null; then
              sed -i '' 's/^#ClientAliveCountMax.*/ClientAliveCountMax 3/' "$SSHD_CONFIG"
            else
