        - id: ansible
          desc: |
            To configure the SSH idle timeout using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            The `validate` option runs `sshd -t` against the edited copy of `sshd_config`, and Ansible writes the file only if that copy passes. A configuration `sshd` cannot parse would otherwise stop the service from starting again and lock out new SSH logins.

            ```yaml
            ---
            - name: Configure SSH idle timeout
              hosts: all
              become: true

              tasks:
                - name: Configure SSH idle timeout
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: "{{ item.regexp }}"
                    line: "{{ item.line }}"
                    validate: /usr/sbin/sshd -t -f %s
                  loop:
                    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
                    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 3' }
                  notify: Restart sshd

              handlers:
                - name: Restart sshd
                  ansible.builtin.service:
                    name: sshd
                    state: restarted
