    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=group&sektion=5
          title: FreeBSD group(5)
      desc: |
        This check verifies that no two groups share the same GID.

        **Why this matters**

        Duplicate GIDs create ambiguity in group-based access controls. Files with group ownership may inadvertently grant access to users in an unintended group, leading to unauthorized data access.
      audit: |
        To verify that no groups share a GID, run the following command:

        ```bash
        awk -F: '{ print $3 }' /etc/group | sort -n | uniq -d
        ```

        If the command returns no output, every group has a unique GID and the check passes. If any GID is listed, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            First identify the duplicated GIDs:

            ```bash
            awk -F: '{print $3}' /etc/group | sort -n | uniq -d
            ```

            1. For each duplicated GID, list the groups that share it so you can decide which one to renumber. Replace `<gid>` with a GID from the previous command:

                ```bash
                awk -F: -v g=<gid> '$3 == g { print $1 }' /etc/group
                ```

            2. Assign a new, unused GID to the group you chose to change, where `<name>` is that group and `<new-gid>` is a GID no other group has. `pw` refuses a GID that is already taken:

                ```bash
                pw groupmod <name> -g <new-gid>
                ```

            3. Re-group the files that belong to the renumbered group. Changing a GID does not update files that already carry the old group ownership, which is `<gid>` from step 1. Limit the change to directories that group owns, such as a shared project directory at `<directory>`:

                ```bash
                find <directory> -group <gid> -exec chgrp -h <new-gid> {} +
                ```

            **Do not re-group every file on the system that has the old GID.** The other group keeps that GID, and a system-wide `find / -group <gid>` cannot tell its files apart from those of the group you renumbered, so a blanket `chgrp` moves the other group's files to the wrong group.

            Verify afterward that members of both groups still have the access they need. Users whose primary GID in `/etc/passwd` was `<gid>` stay in the group that kept it, so change their primary group with `pw usermod <user> -g <new-gid>` where they belong to the renumbered one.
        - id: sh
          desc: |
            **Using a Shell Script**

            This script reports duplicate GIDs but does not change them, because choosing which group to renumber and re-grouping its files must be done deliberately. Use the CLI steps to apply the fix.

            ```sh
            #!/bin/sh
            set -e

            echo "Checking for duplicate GIDs..."
            DUPES=$(awk -F: '{print $3}' /etc/group | sort -n | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "WARNING: Duplicate GIDs found:"
              for gid in $DUPES; do
                echo "  GID $gid used by: $(awk -F: -v g="$gid" '$3 == g { print $1 }' /etc/group | tr '\n' ' ')"
              done
              echo "Please manually assign unique GIDs to each group."
              exit 1
            fi

            echo "No duplicate GIDs found."
            ```
        - id: ansible
          desc: |
            To detect duplicate GIDs using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook, then manually assign unique GIDs to any reported group.

            ```yaml
            ---
            - name: Find duplicate GIDs
              hosts: all
              become: true

              tasks:
                - name: Find duplicate GIDs
                  ansible.builtin.shell: "awk -F: '{print $3}' /etc/group | sort -n | uniq -d"
                  register: dup_gids
                  changed_when: false

                - name: Fail when duplicate GIDs exist
                  ansible.builtin.fail:
                    msg: "Duplicate GIDs found: {{ dup_gids.stdout }}"
                  when: dup_gids.stdout | length > 0
            ```
        # No Chef Infra remediation: resolving this means deciding which account or sudoers entry to change, which is a human decision rather than a converge step.
  - uid: mondoo-freebsd-security-no-duplicate-user-names-exist
    title: Ensure no duplicate user names exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
