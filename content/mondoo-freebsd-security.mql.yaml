            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Disable broadcast ICMP echo responses
              hosts: all
              become: true

              tasks:
                - name: Disable broadcast ICMP echo responses
                  ansible.posix.sysctl:
                    name: net.inet.icmp.bmcastecho
                    value: '0'
                    sysctl_file: /etc/sysctl.conf
                    reload: true
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to ignore broadcast and multicast ICMP echo requests:

            ```ruby
