      desc: |
        This check verifies that SSH is configured to use PAM (Pluggable Authentication Modules).

        **Why this matters**

        PAM provides a flexible framework for authentication, session management, and account controls. When UsePAM is disabled, SSH cannot enforce PAM-based policies such as password complexity requirements, account lockout, or session limits. Enabling PAM ensures consistent enforcement of the system's authentication policies.
      audit: |
        To verify the SSH `UsePAM` setting, inspect the SSH server configuration file:

        ```bash
        grep -i '^[[:space:]]*UsePAM' /etc/ssh/sshd_config
        ```

        If the value is `yes`, the check passes. If the value is `no`, or no line is returned, the check fails.

        Do not audit this with `sshd -T`. The check reads the configuration file, so a missing `UsePAM` line fails even though `sshd -T` prints the secure built-in default of `yes`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit `/etc/ssh/sshd_config` and set:

            ```text
            UsePAM yes
            ```

            Write the line even though OpenSSH already uses `yes` when `UsePAM` is absent. The check reads the configuration file and fails until the directive is present there.

            Validate the configuration before restarting. A malformed directive can stop `sshd` from starting and lock out future logins, so test it first:

            ```bash
            sshd -t && service sshd restart
            ```

            If `sshd -t` reports an error, fix the configuration before restarting. Keep your current SSH session open and confirm that a new connection succeeds before you log out.
