      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      users.list.duplicates(name).none()
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=passwd&sektion=5
          title: FreeBSD passwd(5)
      desc: |
        This check verifies that no duplicate user names exist in `/etc/passwd`.

        **Why this matters**

        Duplicate user names create confusion in access control enforcement and auditing. If two entries share the same username, only one can be reliably used for authentication, while the other may have different UID and group memberships, creating unpredictable behavior.
      audit: |
        To verify that no user names are duplicated, run the following command:

        ```bash
        awk -F: '{ print $1 }' /etc/passwd | sort | uniq -d
        ```

        If the command returns no output, every user name is unique and the check passes. If any name is listed, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Identify the duplicated user names:

                ```bash
                awk -F: '{print $1}' /etc/passwd | sort | uniq -d
                ```

            2. Open the account database with `vipw`, which edits `/etc/master.passwd` under a lock:

                ```bash
                vipw
                ```

            3. Find the entries that share each reported name. Delete the one that should not exist, or rename it to a unique login name. Compare the UID, home directory, and shell of both entries first, so the account that owns the files and the sudo rules is the one that keeps the name.

            4. Save and exit. `vipw` runs `pwd_mkdb`, which rebuilds `/etc/passwd` and the password databases from the edited file.

            **Do not edit `/etc/passwd` directly.** `pwd_mkdb` generates it from `/etc/master.passwd`, so a direct edit is overwritten the next time any account changes.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Checking for duplicate user names..."
            DUPES=$(awk -F: '{print $1}' /etc/passwd | sort | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "WARNING: Duplicate user names found:"
              echo "$DUPES"
              echo "Please manually resolve duplicate user names."
              exit 1
            fi

            echo "No duplicate user names found."
            ```
        - id: ansible
          desc: |
            To detect duplicate user names using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook, then manually resolve any reported duplicate.

            ```yaml
            ---
            - name: Find duplicate user names
              hosts: all
              become: true

              tasks:
                - name: Find duplicate user names
                  ansible.builtin.shell: "awk -F: '{print $1}' /etc/passwd | sort | uniq -d"
                  register: dup_users
                  changed_when: false

                - name: Fail when duplicate user names exist
                  ansible.builtin.fail:
                    msg: "Duplicate user names found: {{ dup_users.stdout }}"
                  when: dup_users.stdout | length > 0
            ```
        # No Chef Infra remediation: resolving this means deciding which account or sudoers entry to change, which is a human decision rather than a converge step.
  - uid: mondoo-freebsd-security-no-duplicate-group-names-exist
    title: Ensure no duplicate group names exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
