policies:
  - uid: mondoo-freebsd-security
    name: Mondoo FreeBSD Security
    version: 1.2.5
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: freebsd
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure FreeBSD access controls, SSH, and services
    docs:
      desc: |
        The Mondoo FreeBSD Security policy identifies critical misconfigurations on FreeBSD systems that could leave servers and appliances vulnerable to attackers. This policy helps organizations detect and remediate hardening gaps before they can be exploited, reducing the likelihood of unauthorized access, privilege escalation, lateral movement, and persistent compromise of critical FreeBSD infrastructure.

        This policy provides security checks across key FreeBSD areas:

        - Kernel and process security settings
        - Removal of dangerous services and unnecessary daemons
        - SSH server hardening
        - Network stack kernel parameters
        - File permissions on sensitive system files
        - User and group configuration
        - System and audit logging
        - Privilege escalation controls

        Learn more about scanning FreeBSD in the [cnspec FreeBSD documentation](https://mondoo.com/docs/cnspec/os/freebsd).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Kernel and Process Hardening
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-aslr-is-enabled
          - uid: mondoo-freebsd-security-core-dump-backtraces-are-disabled
          - uid: mondoo-freebsd-security-core-dump-storage-is-disabled
      - title: Network Stack
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-ip-forwarding-is-disabled
          - uid: mondoo-freebsd-security-packet-redirect-sending-is-disabled
          - uid: mondoo-freebsd-security-icmp-redirects-are-not-accepted
          - uid: mondoo-freebsd-security-source-routed-packets-are-not-accepted
          - uid: mondoo-freebsd-security-tcp-syn-cookies-is-enabled
          - uid: mondoo-freebsd-security-ipv6-router-advertisements-are-not-accepted
          - uid: mondoo-freebsd-security-broadcast-icmp-requests-are-ignored
      - title: Sensitive Services
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-ftp-server-is-not-enabled
          - uid: mondoo-freebsd-security-telnet-server-is-not-enabled
          - uid: mondoo-freebsd-security-nis-server-is-not-enabled
          - uid: mondoo-freebsd-security-rpcbind-is-not-enabled
          - uid: mondoo-freebsd-security-nfs-server-is-not-enabled
          - uid: mondoo-freebsd-security-snmp-server-is-not-enabled
          - uid: mondoo-freebsd-security-tftp-server-is-not-enabled
          - uid: mondoo-freebsd-security-imap-and-pop3-server-is-not-enabled
          - uid: mondoo-freebsd-security-web-proxy-server-is-not-enabled
          - uid: mondoo-freebsd-security-mail-transfer-agent-is-configured-for-local-only-mode
      - title: SSH Server Configuration
        filters: |
          asset.platform == "freebsd"
          file("/etc/ssh/sshd_config").exists
        checks:
          - uid: mondoo-freebsd-security-permissions-on-sshd-config-are-configured
          - uid: mondoo-freebsd-security-permissions-on-ssh-private-host-key-files-are-configured
          - uid: mondoo-freebsd-security-permissions-on-ssh-public-host-key-files-are-configured
          - uid: mondoo-freebsd-security-only-strong-ciphers-are-used
          - uid: mondoo-freebsd-security-only-strong-mac-algorithms-are-used
          - uid: mondoo-freebsd-security-only-strong-kex-algorithms-are-used
          - uid: mondoo-freebsd-security-ssh-root-login-is-disabled
          - uid: mondoo-freebsd-security-ssh-permitemptypasswords-is-disabled
          - uid: mondoo-freebsd-security-ssh-hostbasedauthentication-is-disabled
          - uid: mondoo-freebsd-security-ssh-permituserenvironment-is-disabled
          - uid: mondoo-freebsd-security-ssh-ignorerhosts-is-enabled
          - uid: mondoo-freebsd-security-ssh-maxauthtries-is-set-to-4-or-less
          - uid: mondoo-freebsd-security-ssh-logingracetime-is-configured
          - uid: mondoo-freebsd-security-ssh-loglevel-is-appropriate
          - uid: mondoo-freebsd-security-ssh-idle-timeout-interval-is-configured
          - uid: mondoo-freebsd-security-ssh-disableforwarding-is-enabled
          - uid: mondoo-freebsd-security-ssh-usepam-is-enabled
      - title: Sensitive Files
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-permissions-on-etc-passwd-are-configured
          - uid: mondoo-freebsd-security-permissions-on-etc-group-are-configured
          - uid: mondoo-freebsd-security-permissions-on-etc-master-passwd-are-configured
          - uid: mondoo-freebsd-security-permissions-on-etc-shells-are-configured
          - uid: mondoo-freebsd-security-permissions-on-bootloader-config-are-configured
      - title: Users and Groups
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-root-is-the-only-uid-0-account
          - uid: mondoo-freebsd-security-no-duplicate-uids-exist
          - uid: mondoo-freebsd-security-no-duplicate-gids-exist
          - uid: mondoo-freebsd-security-no-duplicate-user-names-exist
          - uid: mondoo-freebsd-security-no-duplicate-group-names-exist
          - uid: mondoo-freebsd-security-all-groups-in-passwd-exist-in-group
      - title: Logging
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-syslogd-is-enabled-and-running
          - uid: mondoo-freebsd-security-syslogd-is-not-accepting-remote-messages
      - title: Privilege Escalation
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-sudo-is-installed
          - uid: mondoo-freebsd-security-sudo-commands-use-pty
          - uid: mondoo-freebsd-security-sudo-nopasswd-is-not-configured
      - title: Firewall
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-firewall-is-enabled
      - title: System Services
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-time-synchronization-is-enabled
      - title: Software Integrity
        filters: |
          asset.platform == "freebsd"
        checks:
          - uid: mondoo-freebsd-security-pkg-signature-verification-is-enabled
    scoring_system: highest impact
queries:
  - uid: mondoo-freebsd-security-aslr-is-enabled
    title: Ensure address space layout randomization (ASLR) is enabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      kernel.parameters["kern.elf64.aslr.enable"] == 1
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=mitigations&sektion=7
          title: FreeBSD Security Mitigations
        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that Address Space Layout Randomization (ASLR) is enabled on FreeBSD by confirming that the kernel parameter `kern.elf64.aslr.enable` is set to 1.

        **Why this matters**

        ASLR randomizes the memory layout of a process, making it significantly harder for attackers to exploit memory corruption vulnerabilities such as buffer overflows. Without ASLR, attackers can reliably predict memory addresses and craft exploits targeting known locations of critical functions and data structures.

        Enabling ASLR is one of the most effective exploit mitigation techniques available and should be enabled on all FreeBSD systems.
      audit: |
        To verify that ASLR is enabled, run the following command:

        ```bash
        sysctl kern.elf64.aslr.enable
        ```

        If the value is `1`, ASLR is enabled and the check passes. If the value is `0`, ASLR is disabled and the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Enable ASLR immediately:

                ```bash
                sysctl kern.elf64.aslr.enable=1
                ```

            2. Make the change permanent by adding to `/etc/sysctl.conf`:

                ```ini
                kern.elf64.aslr.enable=1
                ```

            ASLR only takes effect when a binary is executed, so enabling it does not protect processes that are already running. Restart long-running services or reboot the system so they start with randomized address spaces.

            `kern.elf64.aslr.enable` covers 64-bit binaries. If the system also runs 32-bit binaries, enable ASLR for them too with `kern.elf32.aslr.enable`, both at runtime and in `/etc/sysctl.conf`.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Enabling ASLR..."
            sysctl kern.elf64.aslr.enable=1

            if grep -q '^kern.elf64.aslr.enable' /etc/sysctl.conf 2>/dev/null; then
              sed -i '' 's/^kern.elf64.aslr.enable=.*/kern.elf64.aslr.enable=1/' /etc/sysctl.conf
            else
              echo 'kern.elf64.aslr.enable=1' >> /etc/sysctl.conf
            fi

            echo "ASLR enabled."
            ```
        - id: ansible
          desc: |
            To enable ASLR using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Enable ASLR
              hosts: all
              become: true

              tasks:
                - name: Enable ASLR
                  ansible.posix.sysctl:
                    name: kern.elf64.aslr.enable
                    value: '1'
                    sysctl_file: /etc/sysctl.conf
                    reload: true
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to enable address space layout randomization:

            ```ruby
            sysctl_conf = '/etc/sysctl.conf'

            execute 'reload sysctl settings' do
              command "sysctl -f #{sysctl_conf}"
              action :nothing
            end

            { 'kern.elf64.aslr.enable' => '1' }.each do |key, value|
              pattern = Regexp.escape(key)

              ruby_block "set #{key} in sysctl.conf" do
                block do
                  body = ::File.exist?(sysctl_conf) ? ::File.read(sysctl_conf) : ''
                  directive = "#{key}=#{value}"
                  body = if body.match?(/^\s*#{pattern}\s*=/)
                           body.gsub(/^\s*#{pattern}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n".lstrip
                         end
                  ::File.write(sysctl_conf, body)
                end
                not_if do
                  ::File.exist?(sysctl_conf) &&
                    ::File.read(sysctl_conf).match?(/^#{pattern}\s*=\s*#{Regexp.escape(value)}\s*$/)
                end
                notifies :run, 'execute[reload sysctl settings]', :delayed
              end
            end
            ```
  - uid: mondoo-freebsd-security-core-dump-backtraces-are-disabled
    title: Ensure core dump backtraces are disabled
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      service("savecore").running == false
      service("savecore").enabled == false
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=savecore&sektion=8
          title: FreeBSD savecore(8)
      desc: |
        This check verifies that the `savecore` service is not running or enabled. Core dumps capture the memory contents of a process at crash time, potentially exposing sensitive information such as passwords, cryptographic keys, or application data.

        **Why this matters**

        If unrestricted, core dumps can be exploited to extract secrets from crashed privileged processes. Disabling the `savecore` service prevents the system from automatically saving crash dumps, reducing the risk of sensitive data exposure.
      audit: |
        To verify that the `savecore` service is not active, run the following command:

        ```bash
        sysrc -n savecore_enable
        ```

        If `savecore_enable` is `NO`, the check passes. If it is `YES`, the check fails.

        The `savecore` rc script runs once at boot to extract a kernel crash dump and then exits. It defines no `status` directive and leaves no process behind, so the rc variable is the authoritative source for whether it runs on the next boot.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Disable the `savecore` service:

            ```bash
            sysrc savecore_enable="NO"
            ```

            The rc script runs once at boot and exits, so there is no running daemon to stop and the change takes effect on the next boot.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling savecore service..."
            sysrc savecore_enable="NO"

            echo "savecore service disabled."
            ```
        - id: ansible
          desc: |
            To disable the `savecore` service using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Disable savecore in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Disable savecore in rc.conf
                  community.general.sysrc:
                    name: savecore_enable
                    value: 'NO'
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to disable `savecore`. The FreeBSD service provider derives the `savecore_enable` rc variable from the rc script and clears it in `/etc/rc.conf`:

            ```ruby
            service 'savecore' do
              action :disable
            end
            ```
  - uid: mondoo-freebsd-security-core-dump-storage-is-disabled
    title: Ensure core dump storage is disabled
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      command('sysrc -n dumpdev').stdout.trim == "NO"
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=rc.conf&sektion=5
          title: FreeBSD rc.conf(5)
      desc: |
        This check verifies that the kernel does not write crash dumps to disk.

        When the kernel panics it can write an image of its memory to a configured dump device, from which `savecore` later copies it into `/var/crash`. The check reads `dumpdev` with `sysrc`, which must be `NO`.

        **Why this matters**

        A kernel crash dump is a copy of kernel memory at the moment of the panic, and kernel memory holds material that exists nowhere else on the system in readable form.

        That includes disk encryption keys held for the mounted filesystems, IPsec and WireGuard session keys, the contents of network buffers in transit, and credentials passed through the kernel by processes that were running at the time. None of it is protected by file permissions while it is in memory, and all of it lands in a file on disk once the dump is written.

        The file then persists. It sits in `/var/crash` until someone removes it, gets swept into backups like any other file, and is frequently included when an administrator collects diagnostics to send to a vendor or a support forum.

        Where kernel debugging is genuinely required, enable dumps on a specific host for the duration of the investigation, treat `/var/crash` as holding secrets while they exist, and remove the dumps afterward rather than leaving the capability on across the estate.
      audit: |
        To verify that kernel crash dump storage is disabled, run the following command:

        ```bash
        sysrc -n dumpdev
        ```

        If the value is `NO`, crash dump storage is disabled and the check passes. If a device path is returned, crash dumps are stored and the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            The `dumpdev` variable in `/etc/rc.conf` names the device the kernel writes a crash dump to. The `dumpon` rc script reads it once at boot, so changing it alone leaves the running kernel with its dump device configured until the next reboot.

            1. Stop the kernel from saving crash dumps at boot:

                ```bash
                sysrc dumpdev="NO"
                ```

            2. Remove the dump device from the running kernel:

                ```bash
                dumpon off
                ```

            3. Confirm that no dump device remains. The command prints `/dev/null` when none is configured:

                ```bash
                dumpon -l
                ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling crash dump storage..."
            sysrc dumpdev="NO"

            # rc.conf is only read at boot, so also clear the dump device
            # configured in the running kernel.
            dumpon off

            echo "Crash dump storage disabled."
            ```
        - id: ansible
          desc: |
            To disable crash dump storage using Ansible:

            1. Add the following task to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Disable crash dump storage
              hosts: all
              become: true

              tasks:
                - name: Disable crash dump storage
                  community.general.sysrc:
                    name: dumpdev
                    value: 'NO'
                  notify: Clear the running dump device

              handlers:
                - name: Clear the running dump device
                  ansible.builtin.command: dumpon off
                  changed_when: true
            ```

            The handler runs `dumpon off` because `/etc/rc.conf` is only read at boot, and the running kernel otherwise keeps its dump device until the next reboot.
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop the kernel from writing crash dumps. `sysrc` changes the setting applied at boot, and `dumpon off` clears the dump device the running kernel already has:

            ```ruby
            execute 'clear the running dump device' do
              command 'dumpon off'
              action :nothing
            end

            execute 'set dumpdev in rc.conf' do
              command 'sysrc dumpdev=NO'
              not_if 'sysrc -n dumpdev | grep -qx NO'
              notifies :run, 'execute[clear the running dump device]', :immediately
            end
            ```
  - uid: mondoo-freebsd-security-ip-forwarding-is-disabled
    title: Ensure IP forwarding is disabled
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      kernel.parameters["net.inet.ip.forwarding"] == 0
      kernel.parameters["net.inet6.ip6.forwarding"] == 0
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=sysctl&sektion=8
          title: FreeBSD sysctl(8)
        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that both IPv4 and IPv6 forwarding are disabled, preventing the system from acting as a network router.

        **Why this matters**

        IP forwarding allows a system to route traffic between network interfaces. Unless the system is specifically intended to function as a router or firewall, forwarding should be disabled to prevent the system from being used to relay traffic between network segments, which could bypass network security controls.
      audit: |
        To verify that IP forwarding is disabled, run the following commands:

        ```bash
        sysctl net.inet.ip.forwarding
        sysctl net.inet6.ip6.forwarding
        ```

        If both values are `0`, IP forwarding is disabled and the check passes. If either value is `1`, the system routes traffic and the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Do not apply this to a host that routes traffic.** Gateways, firewalls, and hosts that route for VNET jails or virtual machines stop passing traffic between networks as soon as forwarding is off.

            1. Disable forwarding immediately:

                ```bash
                sysctl net.inet.ip.forwarding=0
                sysctl net.inet6.ip6.forwarding=0
                ```

            2. Make the change permanent by adding to `/etc/sysctl.conf`:

                ```ini
                net.inet.ip.forwarding=0
                net.inet6.ip6.forwarding=0
                ```

            3. Turn off the gateway settings in `/etc/rc.conf`:

                ```bash
                sysrc gateway_enable="NO"
                sysrc ipv6_gateway_enable="NO"
                ```

                The `routing` rc script sets both forwarding parameters from `gateway_enable` and `ipv6_gateway_enable` every time it starts. If either is still `YES`, the next `service routing restart` turns forwarding back on.
        - id: sh
          desc: |
            **Using a Shell Script**

            **Do not apply this to a host that routes traffic.** Gateways, firewalls, and hosts that route for VNET jails or virtual machines stop passing traffic between networks as soon as forwarding is off.

            ```sh
            #!/bin/sh
            set -e

            echo "Disabling IP forwarding..."
            sysctl net.inet.ip.forwarding=0
            sysctl net.inet6.ip6.forwarding=0

            for param in net.inet.ip.forwarding=0 net.inet6.ip6.forwarding=0; do
              key=$(echo "$param" | cut -d= -f1)
              if grep -q "^${key}" /etc/sysctl.conf 2>/dev/null; then
                sed -i '' "s/^${key}=.*/${param}/" /etc/sysctl.conf
              else
                echo "$param" >> /etc/sysctl.conf
              fi
            done

            # The routing rc script sets both parameters from these rc.conf
            # variables whenever it starts.
            sysrc gateway_enable="NO"
            sysrc ipv6_gateway_enable="NO"

            echo "IP forwarding disabled."
            ```
        - id: ansible
          desc: |
            To disable IP forwarding using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            **Do not apply this to a host that routes traffic.** Gateways, firewalls, and hosts that route for VNET jails or virtual machines stop passing traffic between networks as soon as forwarding is off.

            ```yaml
            ---
            - name: Disable IPv4 and IPv6 forwarding
              hosts: all
              become: true

              tasks:
                - name: Disable IPv4 and IPv6 forwarding
                  ansible.posix.sysctl:
                    name: "{{ item }}"
                    value: '0'
                    sysctl_file: /etc/sysctl.conf
                    reload: true
                  loop:
                    - net.inet.ip.forwarding
                    - net.inet6.ip6.forwarding

                - name: Turn off the rc.conf gateway settings
                  community.general.sysrc:
                    name: "{{ item }}"
                    value: 'NO'
                  loop:
                    - gateway_enable
                    - ipv6_gateway_enable
            ```

            The second task matters because the `routing` rc script sets both forwarding parameters from `gateway_enable` and `ipv6_gateway_enable` whenever it starts, so leaving either at `YES` turns forwarding back on.
        - id: chef
          desc: |
            **Using Chef Infra**

            **Do not apply this to a host that routes traffic.** Gateways, firewalls, and hosts that route for VNET jails or virtual machines stop passing traffic between networks as soon as forwarding is off.

            Use this Chef Infra recipe code to disable IP forwarding. The recipe also sets `gateway_enable` and `ipv6_gateway_enable` to `NO`, because the `routing` rc script sets both forwarding parameters from them whenever it starts:

            ```ruby
            %w(gateway_enable ipv6_gateway_enable).each do |rcvar|
              execute "set #{rcvar} in rc.conf" do
                command "sysrc #{rcvar}=NO"
                not_if "sysrc -n #{rcvar} | grep -qix no"
              end
            end

            sysctl_conf = '/etc/sysctl.conf'

            execute 'reload sysctl settings' do
              command "sysctl -f #{sysctl_conf}"
              action :nothing
            end

            { 'net.inet.ip.forwarding' => '0', 'net.inet6.ip6.forwarding' => '0' }.each do |key, value|
              pattern = Regexp.escape(key)

              ruby_block "set #{key} in sysctl.conf" do
                block do
                  body = ::File.exist?(sysctl_conf) ? ::File.read(sysctl_conf) : ''
                  directive = "#{key}=#{value}"
                  body = if body.match?(/^\s*#{pattern}\s*=/)
                           body.gsub(/^\s*#{pattern}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n".lstrip
                         end
                  ::File.write(sysctl_conf, body)
                end
                not_if do
                  ::File.exist?(sysctl_conf) &&
                    ::File.read(sysctl_conf).match?(/^#{pattern}\s*=\s*#{Regexp.escape(value)}\s*$/)
                end
                notifies :run, 'execute[reload sysctl settings]', :delayed
              end
            end
            ```
