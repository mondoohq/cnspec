            ```text
            DisableForwarding yes
            ```

            **This breaks every workflow that forwards through this host.** `DisableForwarding yes` turns off TCP port forwarding, SSH agent forwarding, X11 forwarding, and Unix socket forwarding, which includes using the host as a `ProxyJump` bastion. Confirm nobody relies on these before you apply it. SFTP and `scp` keep working.

