      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      kernel.parameters["net.inet.icmp.drop_redirect"] == 1
      kernel.parameters["net.inet6.icmp6.rediraccept"] == 0
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=sysctl&sektion=8
          title: FreeBSD sysctl(8)
        - url: https://docs.freebsd.org/en/books/handbook/security/
          title: FreeBSD Handbook - Security
      desc: |
        This check verifies that the system drops ICMP redirects for IPv4 and does not accept them for IPv6, preventing outsiders from updating the system's routing tables.

        **Why this matters**

        Accepting ICMP redirects from untrusted sources can allow attackers to manipulate the system's routing table, potentially redirecting traffic through a malicious host for man-in-the-middle attacks. Systems that are not routers should not accept routing instructions from ICMP redirects.
      audit: |
        To verify that ICMP redirects are not accepted, run the following commands:

        ```bash
        sysctl net.inet.icmp.drop_redirect
        sysctl net.inet6.icmp6.rediraccept
        ```

        If `net.inet.icmp.drop_redirect` is `1` and `net.inet6.icmp6.rediraccept` is `0`, the check passes. Otherwise the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Drop ICMP redirects immediately:

                ```bash
                sysctl net.inet.icmp.drop_redirect=1
                sysctl net.inet6.icmp6.rediraccept=0
                ```

            2. Make the change permanent by adding to `/etc/sysctl.conf`:

                ```ini
                net.inet.icmp.drop_redirect=1
                net.inet6.icmp6.rediraccept=0
                ```

            3. Set the matching rc.conf variable:

                ```bash
                sysrc icmp_drop_redirect="YES"
                ```

                The `routing` rc script writes `net.inet.icmp.drop_redirect` from `icmp_drop_redirect` every time it starts. The default value `auto` resolves to `NO` on a host that runs no routing daemon, so without this step the next `service routing restart` sets the parameter back to `0`.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Configuring ICMP redirect rejection..."
            sysctl net.inet.icmp.drop_redirect=1
            sysctl net.inet6.icmp6.rediraccept=0

            for param in net.inet.icmp.drop_redirect=1 net.inet6.icmp6.rediraccept=0; do
              key=$(echo "$param" | cut -d= -f1)
              if grep -q "^${key}" /etc/sysctl.conf 2>/dev/null; then
                sed -i '' "s/^${key}=.*/${param}/" /etc/sysctl.conf
              else
                echo "$param" >> /etc/sysctl.conf
              fi
            done

            # The routing rc script writes net.inet.icmp.drop_redirect from this
            # variable whenever it starts, and its default of auto means NO.
            sysrc icmp_drop_redirect="YES"

            echo "ICMP redirect rejection configured."
            ```
        - id: ansible
          desc: |
            To reject ICMP redirects using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Drop incoming ICMP redirects
              hosts: all
              become: true

              tasks:
                - name: Drop incoming ICMP redirects
                  ansible.posix.sysctl:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                    sysctl_file: /etc/sysctl.conf
                    reload: true
                  loop:
                    - { name: net.inet.icmp.drop_redirect, value: '1' }
                    - { name: net.inet6.icmp6.rediraccept, value: '0' }

                - name: Keep the routing rc script from re-enabling IPv4 redirects
                  community.general.sysrc:
                    name: icmp_drop_redirect
                    value: 'YES'
            ```

            The second task is needed because the `routing` rc script writes `net.inet.icmp.drop_redirect` from `icmp_drop_redirect` whenever it starts, and the default value `auto` resolves to `NO` on a host without a routing daemon.
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to drop incoming ICMP redirects. It also sets `icmp_drop_redirect` to `YES`, because the `routing` rc script writes `net.inet.icmp.drop_redirect` from that variable whenever it starts, and the default value `auto` resolves to `NO` on a host without a routing daemon:

            ```ruby
            execute 'set icmp_drop_redirect in rc.conf' do
              command 'sysrc icmp_drop_redirect=YES'
              not_if 'sysrc -n icmp_drop_redirect | grep -qix yes'
            end

            sysctl_conf = '/etc/sysctl.conf'

            execute 'reload sysctl settings' do
              command "sysctl -f #{sysctl_conf}"
              action :nothing
            end

            { 'net.inet.icmp.drop_redirect' => '1', 'net.inet6.icmp6.rediraccept' => '0' }.each do |key, value|
              pattern = Regexp.escape(key)

              ruby_block "set #{key} in sysctl.conf" do
                block do
                  body = ::File.exist?(sysctl_conf) ? ::File.read(sysctl_conf) : ''
                  directive = "#{key}=#{value}"
                  body = if body.match?(/^\s*#{pattern}\s*=/)
                           body.gsub(/^\s*#{pattern}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n".lstrip
                         end
                  ::File.write(sysctl_conf, body)
                end
                not_if do
                  ::File.exist?(sysctl_conf) &&
                    ::File.read(sysctl_conf).match?(/^#{pattern}\s*=\s*#{Regexp.escape(value)}\s*$/)
                end
                notifies :run, 'execute[reload sysctl settings]', :delayed
              end
            end
            ```
