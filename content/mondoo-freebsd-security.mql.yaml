  - uid: mondoo-freebsd-security-all-groups-in-passwd-exist-in-group
    title: Ensure all groups in /etc/passwd exist in /etc/group
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      users.list.all( group != empty )
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=passwd&sektion=5
          title: FreeBSD passwd(5)
        - url: https://man.freebsd.org/cgi/man.cgi?query=group&sektion=5
          title: FreeBSD group(5)
      desc: |
        This check verifies that every user's primary group referenced in `/etc/passwd` has a corresponding entry in `/etc/group`.

        **Why this matters**

        If a user's primary group does not exist in `/etc/group`, the system cannot properly enforce group-based access controls. This can lead to unexpected file permissions and may indicate a corrupted or manually edited system configuration.
      audit: |
        To verify that every user's primary group exists in `/etc/group`, run the following command:

        ```bash
        awk -F: 'NR==FNR { gids[$3]; next } !($4 in gids) { print $1 " GID " $4 }' /etc/group /etc/passwd
        ```

        If the command returns no output, the check passes. If it lists a user whose primary group does not exist in `/etc/group`, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Identify users whose primary group is missing from `/etc/group`:

            ```bash
            awk -F: 'NR==FNR { gids[$3]; next } !($4 in gids) { print $1 " GID " $4 }' /etc/group /etc/passwd
            ```

            For each reported user, either create the missing group or move the user to a group that exists:

            - Create the group with the GID the user already references, where `<name>` is the new group name and `<gid>` is the GID from the output above. `pw` reads the group name only when it comes right after `groupadd`, before any option:

                ```bash
                pw groupadd <name> -g <gid>
                ```

            - Or change the user's primary group to an existing one, where `<user>` is the reported user and `<group>` is an existing group name or GID:

                ```bash
                pw usermod <user> -g <group>
                ```

                Files the user already created keep the old GID, so re-group them with `chgrp` where needed.
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Checking for users with missing primary groups..."
            MISSING=""
            while IFS=: read -r user _ _ gid _ _ _ _ _; do
              if ! awk -F: -v g="$gid" '$3 == g { found=1 } END { exit !found }' /etc/group 2>/dev/null; then
                MISSING="$MISSING $user(gid=$gid)"
              fi
            done < /etc/passwd

            if [ -n "$MISSING" ]; then
              echo "WARNING: Users with missing primary groups:"
              echo "$MISSING"
              echo "Please create the missing groups or reassign these users."
              exit 1
            fi

            echo "All user groups exist in /etc/group."
            ```
        - id: ansible
          desc: |
            To detect users with missing primary groups using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook, then create the missing groups or reassign the reported users.

            ```yaml
            ---
            - name: Find users whose primary group is missing
              hosts: all
              become: true

              tasks:
                - name: Find users whose primary group is missing
                  ansible.builtin.shell: "awk -F: 'NR==FNR { gids[$3]; next } !($4 in gids) { print $1 }' /etc/group /etc/passwd"
                  register: missing_groups
                  changed_when: false

                - name: Fail when a primary group is missing
                  ansible.builtin.fail:
                    msg: "Users with missing primary groups: {{ missing_groups.stdout }}"
                  when: missing_groups.stdout | length > 0
            ```
        # No Chef Infra remediation: resolving this means deciding which account or sudoers entry to change, which is a human decision rather than a converge step.
  - uid: mondoo-freebsd-security-syslogd-is-enabled-and-running
    title: Ensure syslogd is enabled and running
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      service("syslogd").enabled
      service("syslogd").running
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=syslogd&sektion=8
          title: FreeBSD syslogd(8)
      desc: |
        This check verifies that the `syslogd` service is both enabled and running.

        **Why this matters**

        System logging is critical for security monitoring, incident response, and forensic analysis. Without an active syslog daemon, the system cannot record authentication events, service failures, kernel messages, and other security-relevant events. An attacker could exploit a system without logging to operate undetected.
      audit: |
        To verify that `syslogd` is enabled and running, run the following commands:

        ```bash
        service syslogd status
        sysrc -n syslogd_enable
        ```

        If `service syslogd status` reports the service is running and `syslogd_enable` is `YES`, the check passes. If the service is stopped or not enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Enable and start syslogd:

            ```bash
            sysrc syslogd_enable="YES"
            service syslogd start
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Enabling and starting syslogd..."
            sysrc syslogd_enable="YES"
            service syslogd start 2>/dev/null || service syslogd restart

            echo "syslogd enabled and running."
            ```
        - id: ansible
          desc: |
            To enable and start `syslogd` using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Enable syslogd in rc.conf
              hosts: all
              become: true

              tasks:
                - name: Enable syslogd in rc.conf
                  community.general.sysrc:
                    name: syslogd_enable
                    value: 'YES'

                - name: Start the syslogd service
                  ansible.builtin.service:
                    name: syslogd
                    state: started
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to enable syslogd in `/etc/rc.conf` and start it:

            ```ruby
            service 'syslogd' do
              action %i(enable start)
            end
            ```
  - uid: mondoo-freebsd-security-syslogd-is-not-accepting-remote-messages
    title: Ensure syslogd is not accepting remote messages
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      command('sysrc syslogd_flags').stdout.contains("-s")
    docs:
      refs:
        - url: https://man.freebsd.org/cgi/man.cgi?query=syslogd&sektion=8
          title: FreeBSD syslogd(8)
      desc: |
        This check verifies that `syslogd` does not accept log messages from other hosts.

        Secure mode stops the daemon binding a network socket for inbound messages while leaving local logging untouched. The check reads `syslogd_flags` with `sysrc`, which must contain `-s`.

        **Why this matters**

        A `syslogd` listening on the network accepts messages from anyone who can reach the port, with no authentication and, over UDP, no way to verify the sender's address.

        The direct consequence is that an attacker controls the contents of this host's logs. They can inject entries that never happened, fabricating evidence of activity by an account or a host that was never involved, and they can flood the daemon so that the entries that do matter are pushed out of retention or lost as the filesystem fills. An investigator working from those logs is working from a record the attacker helped write.

        Log injection also reaches whatever consumes the logs downstream. Entries carrying crafted content have been used against the parsers and dashboards that read them, so the exposure is not limited to this machine.

        Where the host genuinely aggregates logs, that is a deliberate role: restrict the accepting socket to the management network with `-a`, and prefer a transport that authenticates the sender. Everywhere else, `-s` is correct, and `-ss` goes further by disabling the network socket entirely.
      audit: |
        To verify that `syslogd` rejects remote messages, run the following command:

        ```bash
        sysrc -n syslogd_flags
        ```

        If the flags include `-s` (secure mode), `syslogd` does not accept remote messages and the check passes. If `-s` is absent, the check fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Enable secure mode for syslogd:

            ```bash
            sysrc syslogd_flags+=" -s"
            service syslogd restart
            ```
        - id: sh
          desc: |
            **Using a Shell Script**

            ```sh
            #!/bin/sh
            set -e

            echo "Configuring syslogd secure mode..."
            CURRENT_FLAGS=$(sysrc -n syslogd_flags 2>/dev/null || echo "")
            if echo "$CURRENT_FLAGS" | grep -q -- '-s'; then
              echo "syslogd_flags already contains -s."
            else
              sysrc syslogd_flags+=" -s"
            fi

            service syslogd restart

            echo "syslogd configured to reject remote messages."
            ```
        - id: ansible
          desc: |
            To configure `syslogd` secure mode using Ansible:

            1. Add the following tasks to a playbook targeting the FreeBSD host.
            2. Run the playbook.

            ```yaml
            ---
            - name: Set syslogd secure-mode flag
              hosts: all
              become: true

              tasks:
                - name: Set syslogd secure-mode flag
                  community.general.sysrc:
                    name: syslogd_flags
                    value: '-s'
                    state: value_present

                - name: Restart the syslogd service
                  ansible.builtin.service:
                    name: syslogd
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to put syslogd in secure mode so it stops listening for remote log messages. `sysrc` appends with `+=` so any other flags the host already sets, such as a bind address, survive the change:

            ```ruby
            service 'syslogd' do
              action :nothing
            end

            execute 'add -s to syslogd_flags in rc.conf' do
              command 'sysrc syslogd_flags+=" -s"'
              not_if 'sysrc -n syslogd_flags | grep -q -- -s'
              notifies :restart, 'service[syslogd]', :delayed
            end
            ```
