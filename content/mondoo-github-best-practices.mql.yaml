policies:
  - uid: mondoo-github-repository-best-practices
    name: Mondoo GitHub Repository Best Practices
    version: 1.2.2
    license: BUSL-1.1
    tags:
      mondoo.com/category: best-practices
      mondoo.com/platform: github
    require:
      - provider: github
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Validate GitHub repo quality and collaboration practices
    docs:
      desc: |
        The Mondoo GitHub Repository Best Practices policy identifies GitHub repositories that don't follow operational best practices for sustainable, collaborative software development. This policy helps organizations maintain code quality, smooth onboarding, and predictable contribution workflows, reducing confusion, lost contributions, and the operational drag that comes with unmaintained or under-documented repositories.

        This policy provides checks across key repository configuration areas:

        - README presence and completeness
        - License files
        - Code of conduct
        - Contributing guidelines
        - Issue and pull request templates
        - Support documentation

        Learn more about scanning GitHub in the [cnspec GitHub documentation](https://mondoo.com/docs/cnspec/saas/github).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: GitHub Repo
        filters: |
          asset.platform == "github-repo"
        checks:
          - uid: mondoo-github-repository-best-practices-code-of-conduct
          - uid: mondoo-github-repository-best-practices-description
          - uid: mondoo-github-repository-best-practices-gitignore
          - uid: mondoo-github-repository-best-practices-include-authors
          - uid: mondoo-github-repository-best-practices-license
          - uid: mondoo-github-repository-best-practices-readme
          - uid: mondoo-github-repository-best-practices-readme-getting-started
          - uid: mondoo-github-repository-best-practices-support-resources
    scoring_system: highest impact
queries:
  - uid: mondoo-github-repository-best-practices-support-resources
    title: Ensure repository has a support policy
    impact: 30
    mql: |
      // if a .github repo exists, then check if the SUPPORT.md is there
      if ( github.organization.repositories.one(name == ".github") ) {
        github.organization.repositories.where( name == ".github").all(
          supportFile.exists
        ) || github.repository.supportFile.exists
      } else {
          github.repository.supportFile.exists
      }
    docs:
      desc: |
        This check verifies that the repository publishes support resources.

        Support resources go in a `SUPPORT.md` file in the repository root or in the `.github` directory, and an organization can publish one shared copy in its own `.github` repository that covers every repository it owns. The file says where to get help: links to the documentation, the issue tracker, any community forum or chat channel, and a contact address for the maintainers. GitHub reads it and shows a link to your support resources on the new issue page, so the person about to file sees it while they are still deciding what to do. A copy stored under `docs` is rendered by GitHub but is not inspected by this check, so keep the file in the root or in `.github`.

        **Why this matters**

        When no channel is documented, everything arrives in the issue tracker. Questions about how to configure the tool, reports that turn out to be a local misconfiguration, and requests for help with somebody's fork all land in the same queue as real defects, and maintainers spend their triage time separating them. The backlog stops being a picture of what is wrong with the project, and genuine bugs wait behind support requests for a reply.

        Users lose too. Somebody with an urgent problem picks whichever channel they can find, which is often a comment on an unrelated closed issue or a direct message to whoever committed last, and the answer comes late or never.

        Write down where each kind of question goes, and keep the addresses working. Vulnerability reports need their own route rather than this one. A `SECURITY.md` file gives researchers a private channel, and GitHub links it from the same part of the interface, so a reporter who finds neither file is left choosing between saying nothing and opening a public issue that describes the flaw to everyone.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Look for a `SUPPORT.md` file in the repository root or the `.github` directory.
        3. Check the organization's `.github` repository for a shared `SUPPORT.md` that applies to all repositories.

        If a `SUPPORT.md` file is present in any of these locations, the check passes. If none exists, the check fails. GitHub also displays a `SUPPORT.md` stored in the `docs` directory, but this check does not inspect that location, so keep the file in the repository root or the `.github` directory.

        ### Audit via CLI

        1. Query the repository contents for a support file:

           ```bash
           gh api /repos/OWNER/REPO/contents/SUPPORT.md --jq '.name'
           ```

        If the command returns `SUPPORT.md`, the check passes. If it returns a `Not Found` error, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You need write access to the repository to commit a new file.

            1. Navigate to your repository on GitHub.
            2. Click on the "Add file" button.
            3. Select "Create new file".
            4. Name the file `SUPPORT.md`.
            5. Add the content of the support resources you want to include.
            6. Commit the changes to your repository.

            The SUPPORT.md file should include information about how to get help with the project, such as:

            - Links to documentation
            - Contact information for maintainers
            - Links to community forums or chat channels
            - Information about how to report issues or bugs

            For more details, see [Adding support resources to your project](https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/adding-support-resources-to-your-project).
        - id: terraform
          desc: |
            **Using Terraform**

            Manage the support file with the `github_repository_file` resource:

            ```hcl
            resource "github_repository_file" "support" {
              repository     = github_repository.example.name
              file           = "SUPPORT.md"
              content        = "# Support\n\nFor help, open an issue or contact support@example.com\n"
              commit_message = "Add support resources"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run `gh auth login` first so the CLI has a token with write access to the repository.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/contents/SUPPORT.md \
              -f message="Add support resources" \
              -f content="$(cat <<'CONTENT' | base64 | tr -d '\n'
            # Support

            For help, open an issue or contact support@example.com
            CONTENT
            )"
            ```

            The `tr -d '\n'` step keeps the encoded value on a single line. GNU coreutils `base64`, the default on most Linux distributions, wraps its output at 76 columns unless you pass `-w 0`.
    refs:
      - url: https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/adding-support-resources-to-your-project
        title: Adding support resources to your project
  - uid: mondoo-github-repository-best-practices-code-of-conduct
    title: Ensure repository has a CODE_OF_CONDUCT.md policy
    impact: 30
    mql: |
      // if a .github repo exists, then check if the CODE_OF_CONDUCT.md is there
      if ( github.organization.repositories.one(name == ".github") ) {
        github.organization.repositories.where( name == ".github").all(
          codeOfConductFile.exists
        ) || github.repository.codeOfConductFile.exists
      } else {
        github.repository.codeOfConductFile.exists
      }
    docs:
      desc: |
        This check verifies that the repository publishes a code of conduct.

        A code of conduct states the behavior expected of everyone who participates in the project and the process for reporting behavior that falls short of it. GitHub looks for a `CODE_OF_CONDUCT.md` file in the repository root or in the repository's `.github` directory, and an organization can publish one shared copy in its own `.github` repository that then applies to every repository it owns. This check passes when the file exists in any of those places. GitHub also renders a copy stored under `docs`, but this check does not look there, so keep the file in the root or in `.github`.

        **Why this matters**

        Once the file exists, GitHub links it from the repository's Community Standards page and from the issue and pull request forms, so a first-time contributor sees the expectations before writing anything.

        Without it, a maintainer who needs to remove a participant for abusive behavior has no written standard to point at. The decision becomes one person's judgment applied after the fact, the participant can argue that no rule was broken, and other contributors reading the thread have no way to tell whether the removal was fair. A published document turns that argument into a reference to a sentence everyone could have read in advance.

        The absence also costs contributions that never arrive. Someone deciding whether to spend an evening on an unfamiliar project reads the repository for signals about how its maintainers treat people, and an empty answer is a reason to work somewhere else.

        Adopting an existing text such as the Contributor Covenant is the usual route, because writing conduct rules from scratch is slow and the well-known texts already cover reporting and enforcement. Whichever text you choose, name a working contact address for reports. A code of conduct with nobody to report to does not do the job.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Look for a `CODE_OF_CONDUCT.md` file in the repository root or the `.github` directory.
        3. Check the organization's `.github` repository for a shared `CODE_OF_CONDUCT.md` that applies to all repositories.

        If a `CODE_OF_CONDUCT.md` file is present in any of these locations, the check passes. If none exists, the check fails. GitHub also displays a `CODE_OF_CONDUCT.md` stored in the `docs` directory, but this check does not inspect that location, so keep the file in the repository root or the `.github` directory.

        ### Audit via CLI

        1. Query the repository contents for a code of conduct file:

           ```bash
           gh api /repos/OWNER/REPO/contents/CODE_OF_CONDUCT.md --jq '.name'
           ```

        If the command returns `CODE_OF_CONDUCT.md`, the check passes. If it returns a `Not Found` error, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You need write access to the repository to commit a new file.

            1. Navigate to your repository on GitHub.
            2. Click on the "Add file" button.
            3. Select "Create new file".
            4. Name the file `CODE_OF_CONDUCT.md`.
            5. Add the content of the code of conduct you want to use.
            6. Commit the changes to your repository.

            The CODE_OF_CONDUCT.md file should include the project's values and principles.
        - id: terraform
          desc: |
            **Using Terraform**

            Manage the code of conduct file with the `github_repository_file` resource:

            ```hcl
            resource "github_repository_file" "code_of_conduct" {
              repository     = github_repository.example.name
              file           = "CODE_OF_CONDUCT.md"
              content        = "# Code of Conduct\n\nThis project follows the Contributor Covenant Code of Conduct.\n"
              commit_message = "Add code of conduct"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run `gh auth login` first so the CLI has a token with write access to the repository.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/contents/CODE_OF_CONDUCT.md \
              -f message="Add code of conduct" \
              -f content="$(cat <<'CONTENT' | base64 | tr -d '\n'
            # Code of Conduct

            This project follows the Contributor Covenant Code of Conduct.
            CONTENT
            )"
            ```

            The `tr -d '\n'` step keeps the encoded value on a single line. GNU coreutils `base64`, the default on most Linux distributions, wraps its output at 76 columns unless you pass `-w 0`.
    refs:
      - url: https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/adding-a-code-of-conduct-to-your-project
        title: Adding a CODE_OF_CONDUCT.md to your project
  - uid: mondoo-github-repository-best-practices-description
    title: Ensure repository has a description
    impact: 30
    mql: github.repository.description != empty
    docs:
      desc: |
        This check verifies that the repository has a description.

        The description is the one-line summary shown in the "About" panel on the repository's main page. Maintainers set it through the gear icon beside that panel, and the same value appears on the repository record returned by the API. This check passes when the description is a non-empty string.

        **Why this matters**

        An organization's repository list shows the name and the description and little else. With the description blank, anyone scanning that list sees a column of names such as `platform-svc-2` and has to open each repository and read its README to learn what it is. On an account with a few hundred repositories that is the difference between finding the right one in seconds and giving up on the search.

        The same text is what GitHub search matches and displays beneath each result, so an undescribed repository is harder to find even by someone who knows roughly what they are looking for. Inventory tooling that lists repositories through the API hits the same problem in a different shape: the catalog it produces has an empty summary column, and whoever owns that catalog ends up filling it in by hand.

        A good description says what the project is and who it is for in one sentence, for example a command-line tool for managing cloud infrastructure, or a React component library for building accessible web applications. Keep it current afterward. A description that describes what the repository did two rewrites ago is worse than a blank one, because readers believe it.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Look at the "About" section on the right side of the repository page.

        If a description is shown, the check passes. If the "About" section has no description text, the check fails.

        ### Audit via CLI

        1. Query the repository description:

           ```bash
           gh repo view OWNER/REPO --json description --jq '.description'
           ```

        If the command returns a non-empty string, the check passes. If it returns an empty value, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your repository on GitHub.
            2. Click the gear icon next to the "About" section on the right side of the repository page.
            3. Enter a description for the repository.
            4. Click "Save changes".

            The description should be a brief summary of the project's purpose, functionality, or goals. For example: "A command-line tool for managing cloud infrastructure" or "React component library for building accessible web applications".
        - id: terraform
          desc: |
            **Using Terraform**

            ```hcl
            resource "github_repository" "example" {
              name        = "example"
              description = "A brief description of the repository"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            ```bash
            gh repo edit OWNER/REPO --description "A brief description of the repository"
            ```
    refs:
      - url: https://docs.github.com/en/repositories/creating-and-managing-repositories/about-repositories
        title: About repositories
  - uid: mondoo-github-repository-best-practices-gitignore
    title: Ensure repository has a .gitignore file
    impact: 30
    mql: github.repository.files.one( name == ".gitignore" )
    docs:
      desc: |
        This check verifies that the repository has a `.gitignore` file in its root.

        `.gitignore` lists the path patterns that Git leaves untracked. Add it as a file in the repository root. GitHub offers a starting template per language from the "Add .gitignore" dropdown while you create a repository, and the matching Terraform attribute for those templates also applies only at creation, so an existing repository needs the file committed directly. This check passes when a file named `.gitignore` is present in the root.

        **Why this matters**

        Without it, everything the build produces is a candidate for the next `git add .`. A dependency directory such as `node_modules` or `vendor` lands in a commit and the repository grows by hundreds of megabytes. Every clone after that pays the cost, and the pull request that introduced it shows thousands of changed files that no reviewer can read.

        Editor and operating system files cause a smaller version of the same problem continuously. One contributor commits `.DS_Store`, another commits an `.idea` directory, and the two of them then produce a merge conflict in files that have nothing to do with the project.

        The serious case is credentials. A `.env` file or a downloaded service account key sits in the working directory looking like any other file, gets swept up by a wildcard add, and becomes readable by everyone with access to the repository. Deleting it in a later commit does not undo that. The value stays in the history, and it has to be treated as compromised and rotated.

        Start from the template for your language and extend it with the paths your build and tooling actually produce. A file that is already tracked keeps being tracked no matter what patterns you add later, so anything committed by accident has to be removed from the index as well.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Look for a `.gitignore` file in the repository root.

        If a `.gitignore` file is present, the check passes. If it is absent, the check fails.

        ### Audit via CLI

        1. Query the repository contents for a `.gitignore` file:

           ```bash
           gh api /repos/OWNER/REPO/contents/.gitignore --jq '.name'
           ```

        If the command returns `.gitignore`, the check passes. If it returns a `Not Found` error, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your repository on GitHub.
            2. Click on the "Add file" button.
            3. Select "Create new file".
            4. Name the file `.gitignore`.
            5. Add patterns for files and directories to ignore.
            6. Commit the changes to your repository.

            GitHub provides a collection of `.gitignore` templates for various programming languages and frameworks. When creating a new repository, you can select a template from the "Add .gitignore" dropdown menu.

            For more details, see [Ignoring files](https://docs.github.com/en/get-started/getting-started-with-git/ignoring-files).
        - id: terraform
          desc: |
            **Using Terraform**

            The `gitignore_template` attribute only takes effect when Terraform creates the repository:

            ```hcl
            resource "github_repository" "example" {
              name               = "example"
              gitignore_template = "Go"
            }
            ```

            For an existing repository, manage the file directly with the `github_repository_file` resource:

            ```hcl
            resource "github_repository_file" "gitignore" {
              repository     = github_repository.example.name
              file           = ".gitignore"
              content        = file("${path.module}/templates/gitignore")
              commit_message = "Add .gitignore"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run `gh auth login` first so the CLI has a token with write access to the repository.

            Create a .gitignore file in an existing repository:

            ```bash
            gh api --method PUT /repos/OWNER/REPO/contents/.gitignore \
              -f message="Add .gitignore" \
              -f content="$(gh api /gitignore/templates/Go --jq '.source' | base64 | tr -d '\n')"
            ```

            The `tr -d '\n'` step keeps the encoded value on a single line. GNU coreutils `base64`, the default on most Linux distributions, wraps its output at 76 columns unless you pass `-w 0`.
    refs:
      - url: https://docs.github.com/en/get-started/getting-started-with-git/ignoring-files
        title: Ignoring files
  - uid: mondoo-github-repository-best-practices-include-authors
    title: Ensure the README.md includes authors
    impact: 20
    mql: |
      github.repository.files.where(name.downcase == "readme.md") != empty
      github.repository.files.where(name.downcase == "readme.md") {
        content == /Authors/i
      }
    docs:
      desc: |
        This check verifies that the README names the people or teams responsible for the project.

        The check reads `README.md` from the repository root and looks for an authors section. A repository with no `README.md` fails, since it names nobody. Add one by opening the file with the pencil icon on GitHub, or in a normal commit, and writing a short block headed Authors or Maintainers that names the person or team and gives a way to reach them, such as a team alias or a shared mailbox. GitHub renders the README on the repository's main page, so those names are visible without opening a file.

        **Why this matters**

        Attribution is the difference between a question that gets answered and one that does not. Someone who hits a bug, needs a release cut, or wants to know whether a pull request will ever be looked at otherwise has to guess from the commit log, where the most recent committer is often a person who fixed a typo two years ago.

        Internal repositories lose their owner quietly. A team reorganizes, the engineers who wrote the service move on, and a year later somebody on call is reading unfamiliar code at three in the morning with no idea which team to page. A named team alias survives that. A name in a commit signature usually does not.

        For anyone evaluating the project from outside, the names answer a different question. A repository with an identified maintainer or a sponsoring team reads as something a person is accountable for, and one without reads as code that was published and abandoned. That judgment gets made in the first minute of looking, and it decides whether the evaluation continues at all.

        Prefer roles and shared addresses over individual names wherever you can, so the section stays accurate after people change jobs.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Open the rendered `README.md` on the repository main page.
        3. Look for an authors or maintainers section.

        If the README names the project's authors, the check passes. If no authors section is present, the check fails, and a repository with no `README.md` at all fails for the same reason.

        ### Audit via CLI

        1. Fetch the README and search it for an authors section:

           ```bash
           gh api /repos/OWNER/REPO/contents/README.md \
             --jq '.content' | base64 -d | grep -i 'authors'
           ```

        If the command prints a matching line, the check passes. If it prints nothing, or reports that the file does not exist, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You need write access to the repository to edit and commit the file.

            1. Navigate to your repository on GitHub.
            2. Open the `README.md` file and click the pencil icon to edit it.
            3. Add a section that names the people or teams responsible for the project. For example:

               ```markdown
               ## Authors

               - Jane Doe, maintainer
               - Platform Team, platform-team@example.com
               ```

            4. Commit the changes to your repository.

            Naming authors gives users a clear point of contact and signals that the project is actively stewarded.
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run `gh auth login` first so the CLI has a token with write access to the repository.

            Fetch the current README, add an authors section, and update:

            ```bash
            # Get current content and SHA
            README=$(gh api /repos/OWNER/REPO/contents/README.md)
            SHA=$(echo "$README" | jq -r '.sha')
            CONTENT=$(echo "$README" | jq -r '.content' | base64 -d)

            # Build the new content
            NEW_CONTENT=$(printf '%s\n\n## Authors\n\n- Author Name\n' "$CONTENT")

            # Append authors section and update
            gh api --method PUT /repos/OWNER/REPO/contents/README.md \
              -f message="Add authors section" \
              -f sha="$SHA" \
              -f content="$(printf '%s' "$NEW_CONTENT" | base64 | tr -d '\n')"
            ```

            Use `printf '%s'` rather than `echo` so backticks, `$`, and backslashes in the README are preserved instead of being interpreted by the shell. Code fences make those characters common. The `tr -d '\n'` step keeps the encoded value on a single line, because GNU coreutils `base64`, the default on most Linux distributions, wraps its output at 76 columns.
        # No Terraform remediation: the fix appends an authors section to an existing README.md, and github_repository_file would overwrite the entire file with static content.
    refs:
      - url: https://docs.github.com/en/repositories/creating-and-managing-repositories/best-practices-for-repositories
        title: GitHub Repository Best Practices
  - uid: mondoo-github-repository-best-practices-readme
    title: Ensure repository has a README
    impact: 30
    mql: github.repository.files.one( name.downcase == "readme.md" )
    docs:
      desc: |
        This check verifies that the repository has a `README.md` file in its root.

        The README is the page GitHub renders below the file list on the repository's main page, and for most visitors it is the entire documentation set. Create it as `README.md` in the root through the "Add file" menu or in an ordinary commit. This check looks for that exact name, so a project documented in `README.rst` or `README.txt` does not satisfy it even though GitHub renders those formats too.

        **Why this matters**

        Without a README the repository page shows a list of directories and nothing else. A visitor has to infer the project from file names, open the source, and read enough of it to work out what the code does and whether it does what they need. Almost nobody does this. They arrived from a search result or a link, they had a specific question, and an unexplained file tree does not answer it.

        The cost inside a company is a slower version of the same thing. New team members reconstruct build and run instructions by reading configuration files and asking colleagues, and every answer is given verbally to one person, so the next new hire asks the same question again.

        A useful README states what the project does, how to install it, how to run it, and how to contribute. Two companion checks in this policy look for a getting started section and a named set of authors inside that same file, so treat those as the sections to write first. Keep the installation steps runnable. A README whose commands fail on a clean machine costs more trust than one that leaves them out.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Check the file list on the repository main page for a file named `README.md`.

        If a `README.md` file is present in the repository root, the check passes. If the repository has no README, or only a README in another format such as `README.rst` or `README.txt`, the check fails.

        ### Audit via CLI

        1. Query the repository contents for a `README.md` file:

           ```bash
           gh api /repos/OWNER/REPO/contents/README.md --jq '.name'
           ```

        If the command returns `README.md`, the check passes. If it returns a `Not Found` error, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your repository on GitHub.
            2. Click on the "Add file" button.
            3. Select "Create new file".
            4. Name the file `README.md`.
            5. Add content describing the project, including what it does, how to install and use it, and how to contribute.
            6. Commit the changes to your repository.

            For more details, see [About READMEs](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes).
        - id: terraform
          desc: |
            **Using Terraform**

            Manage the README file with the `github_repository_file` resource:

            ```hcl
            resource "github_repository_file" "readme" {
              repository     = github_repository.example.name
              file           = "README.md"
              content        = "# Project Name\n\nA brief description of the project.\n"
              commit_message = "Add README"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run `gh auth login` first so the CLI has a token with write access to the repository.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/contents/README.md \
              -f message="Add README" \
              -f content="$(cat <<'CONTENT' | base64 | tr -d '\n'
            # Project Name

            A brief description of the project.
            CONTENT
            )"
            ```

            The `tr -d '\n'` step keeps the encoded value on a single line. GNU coreutils `base64`, the default on most Linux distributions, wraps its output at 76 columns unless you pass `-w 0`.
    refs:
      - url: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes
        title: About READMEs
  - uid: mondoo-github-repository-best-practices-readme-getting-started
    title: Ensure the README.md includes a getting started guide
    impact: 30
    mql: |
      github.repository.files.where(name.downcase == "readme.md") != empty
      github.repository.files.where(name.downcase == "readme.md") {
        content == /Getting started/i
      }
    docs:
      desc: |
        This check verifies that the README includes a getting started guide.

        The check reads `README.md` from the repository root and looks for a getting started or quick start section. A repository with no `README.md` fails, since it offers no starting point. Write it by editing the file on GitHub with the pencil icon or in an ordinary commit, under a heading such as "Getting started", and cover the path a newcomer actually walks: install the project, set whatever configuration it requires, and run it once successfully.

        **Why this matters**

        A README that explains what a project does but not how to start it leaves the reader to assemble the sequence themselves out of the build files, the test configuration, and whatever the last blog post said. The steps do exist. They are just distributed across the repository in the order the code needed them rather than the order a person needs them. Most evaluators give up at this point, and the maintainer sees a clone with no follow-up rather than a question.

        The maintainers pay for the omission as well. Everyone who does persist asks in an issue or a chat channel, and each answer gets written once, for one person, and is then lost. The same three questions keep arriving for years, which is expensive in a way that never appears as a task on anybody's board.

        Write the steps against a clean machine and run them yourself before committing them. Instructions written from memory tend to assume a tool the author installed years ago and a configuration file that exists only on their laptop, and a guide that fails at step two is worse than no guide, because the reader concludes the project is broken rather than that the documentation is stale.

        Keep it short. This section is the shortest route to one working run, not a manual. Deeper material belongs in the rest of the README or in a documentation directory.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Open the rendered `README.md` on the repository main page.
        3. Look for a getting started or quick start section.

        If the README includes a getting started section, the check passes. If none is present, the check fails, and a repository with no `README.md` at all fails for the same reason.

        ### Audit via CLI

        1. Fetch the README and search it for a getting started section:

           ```bash
           gh api /repos/OWNER/REPO/contents/README.md \
             --jq '.content' | base64 -d | grep -i 'getting started'
           ```

        If the command prints a matching line, the check passes. If it prints nothing, or reports that the file does not exist, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You need write access to the repository to edit and commit the file.

            1. Navigate to your repository on GitHub.
            2. Open the `README.md` file and click the pencil icon to edit it.
            3. Add a section titled "Getting started" that covers:
               - A description of the project
               - How to install the project
               - How to use the project
               - How to contribute to the project
            4. Commit the changes to your repository.

            A documented setup path gives new users a repeatable route from clone to first successful run and reduces repetitive support questions.
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run `gh auth login` first so the CLI has a token with write access to the repository.

            Fetch the current README, append a getting started section, and update the file:

            ```bash
            # Get current content and SHA
            README=$(gh api /repos/OWNER/REPO/contents/README.md)
            SHA=$(echo "$README" | jq -r '.sha')
            CONTENT=$(echo "$README" | jq -r '.content' | base64 -d)

            # Build the new content
            NEW_CONTENT=$(printf '%s\n\n## Getting started\n\n1. Install the project.\n2. Configure required settings.\n3. Run the project.\n' "$CONTENT")

            # Append a getting started section and update
            gh api --method PUT /repos/OWNER/REPO/contents/README.md \
              -f message="Add getting started guide" \
              -f sha="$SHA" \
              -f content="$(printf '%s' "$NEW_CONTENT" | base64 | tr -d '\n')"
            ```

            Replace the placeholder steps with real installation and usage instructions for your project.

            Use `printf '%s'` rather than `echo` so backticks, `$`, and backslashes in the README are preserved instead of being interpreted by the shell. Code fences make those characters common. The `tr -d '\n'` step keeps the encoded value on a single line, because GNU coreutils `base64`, the default on most Linux distributions, wraps its output at 76 columns.
        # No Terraform remediation: the fix appends a getting started section to an existing README.md, and github_repository_file would overwrite the entire file with static content.
    refs:
      - url: https://docs.github.com/en/repositories/creating-and-managing-repositories/best-practices-for-repositories
        title: GitHub Repository Best Practices
  - uid: mondoo-github-repository-best-practices-license
    title: Ensure repository declares a license
    impact: 30
    mql: github.repository.files.any(name == /^LICENSE/i)
    docs:
      desc: |
        This check verifies that the repository declares a license.

        Publishing source code does not grant anyone permission to use it. Absent an explicit license the code is under exclusive copyright, and the only rights a reader has are the ones GitHub's terms of service provide, which amount to viewing the code and forking it within GitHub itself. Add the grant as a file in the repository root whose name starts with `LICENSE`, such as `LICENSE`, `LICENSE.txt`, or `LICENSE.md`. GitHub's license detection reads that file and shows the identifier it recognizes in the "About" panel. The Terraform attribute for selecting a license template applies only when the repository is created, so an existing repository needs the file committed directly.

        **Why this matters**

        The consequence lands on the people who want to use the project. An engineer at a company that scans its dependencies adds the package, the scanner reports the license as unknown, and policy blocks the build until legal signs off. Most of the time nobody asks legal. They find another library and move on, and the maintainer never learns that the evaluation happened.

        Everything downstream inherits the problem. A distribution cannot package unlicensed code, a vendor cannot ship it inside a product, and a contributor cannot be confident they are permitted to publish a fork carrying their own fix. Even reading the code for a security review stands on uncertain ground in organizations that take copyright seriously.

        Pick the license from the project's goals. A permissive license such as MIT or Apache 2.0 suits code meant to be embedded in commercial products, and a copyleft license such as GPL suits projects where derived work should stay open. Add the file early. Relicensing later needs agreement from everyone who has contributed since, which gets harder with every merged pull request.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Look for a license file such as `LICENSE`, `LICENSE.txt`, or `LICENSE.md` in the repository root.

        If a license file following common conventions is present, the check passes. If none exists, the check fails.

        ### Audit via CLI

        1. Query the repository for a license:

           ```bash
           gh api /repos/OWNER/REPO/license --jq '.license.spdx_id'
           ```

        If the command returns a license identifier, the check passes. If it returns a `Not Found` error, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your repository on GitHub.
            2. Click on the "Add file" button.
            3. Select "Create new file".
            4. Name the file with the uppercase `LICENSE` prefix, such as `LICENSE`, `LICENSE.txt`, or `LICENSE.md`, so license detection tooling recognizes it.
            5. Add the content of the license you want to use.
            6. Commit the changes to your repository.

            The license should be chosen based on the project's goals and the intended audience. For example, if the project is intended for commercial use, a permissive license such as MIT or Apache 2.0 may be appropriate. If the project is intended for open source use, a copyleft license such as GPL may be appropriate.
        - id: terraform
          desc: |
            **Using Terraform**

            The `license_template` attribute only takes effect when Terraform creates the repository:

            ```hcl
            resource "github_repository" "example" {
              name             = "example"
              license_template = "apache-2.0"
            }
            ```

            For an existing repository, manage the license file directly with the `github_repository_file` resource:

            ```hcl
            resource "github_repository_file" "license" {
              repository     = github_repository.example.name
              file           = "LICENSE"
              content        = file("${path.module}/LICENSE")
              commit_message = "Add license"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run `gh auth login` first so the CLI has a token with write access to the repository.

            Check if a license exists:

            ```bash
            gh api /repos/OWNER/REPO/license
            ```

            To add a license file:

            ```bash
            gh api --method PUT /repos/OWNER/REPO/contents/LICENSE \
              -f message="Add license" \
              -f content="$(gh api /licenses/apache-2.0 --jq '.body' | base64 | tr -d '\n')"
            ```

            The `tr -d '\n'` step keeps the encoded value on a single line. GNU coreutils `base64`, the default on most Linux distributions, wraps its output at 76 columns unless you pass `-w 0`.
    refs:
      - url: https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/adding-a-license-to-a-repository
        title: Adding a license to a repository
