  - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos
    title: Ensure secret scanning push protection is enabled for new repositories
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos-github
        tags:
          mondoo.com/filter-title: GitHub Organization
          mondoo.com/filter-icon: github
      - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that repositories created in the organization reject pushes that contain a recognized credential.

        Push protection is the enforcing half of secret scanning. It rejects the push itself when a recognized credential pattern appears in the incoming commits, rather than raising an alert after the commit has already landed on GitHub. The Configurations page, reached through Advanced Security in the Security section of the Organization Settings sidebar, lists Push protection as its own setting alongside secret scanning, and the check passes only when the configuration that applies by default to newly created repositories has it turned on. The Terraform version of this check reads `secret_scanning_push_protection_enabled_for_new_repositories` on a `github_organization_settings` resource and requires the same value.

        **Why this matters**

        The difference between blocking and alerting is the difference between an inconvenience and an incident. Once a commit carrying a live key reaches the remote, it is on GitHub's servers, it is in the events feed, and it is in every fork, clone, and CI cache that pulled afterward. Rewriting history does not un-leak it, and on a public repository harvesting bots will have tested the key long before the rewrite is pushed.

        What follows is expensive. A leaked cloud key gets used to enumerate storage and IAM within seconds of the push. A leaked npm or PyPI publishing token gets used to ship a backdoored release of a package under the organization's own name, and every consumer that installs it inherits the attacker's code. Even when nothing is exploited, the credential has to be treated as burned, which means rotating it across every service, pipeline, and runtime that depends on it while builds fail in the meantime.

        Push protection only stops patterns it recognizes, which covers partner tokens and any custom patterns the organization defines. A homegrown token format, a database password in a config file, or a private key with no distinguishing prefix passes through untouched, so keep secrets out of the repository by design rather than relying on the block.
      audit: |
        ### Audit via Console

        1. Navigate to your organization on GitHub.
        2. Go to **Settings**. In the sidebar under **Security**, select **Advanced Security** > **Configurations**.
        3. Review the security configuration applied as the default for new repositories and confirm **Push protection** is set to **Enabled** under secret scanning.

        If the default configuration for new repositories enables push protection, the check passes. If it does not, the check fails. On organizations that have not yet migrated to security configurations, this setting appears on the legacy **Settings** > **Code security and analysis** page under "Secret scanning."

        ### Audit via CLI

        1. Query the organization's push protection default:

           ```bash
           gh api /orgs/ORG --jq '.secret_scanning_push_protection_enabled_for_new_repositories'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            GitHub manages organization-wide security defaults through security configurations, which replaced the former "Code security and analysis" settings page.

            1. Navigate to your organization on GitHub.
            2. Go to **Settings**. In the sidebar under **Security**, select **Advanced Security** > **Configurations**.
            3. Create a new security configuration or edit an existing one. Set **Secret scanning** to **Enabled** and set its **Push protection** option to **Enabled**.
            4. Save the configuration.
            5. Apply the configuration to your repositories and mark it as the default for newly created repositories.

            For more details, see [Applying a custom security configuration](https://docs.github.com/en/code-security/securing-your-organization/enabling-security-features-in-your-organization/applying-a-custom-security-configuration) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            The `billing_email` argument is required by this resource:

            ```hcl
            resource "github_organization_settings" "example" {
              billing_email                                                = "billing@example.com"
              secret_scanning_push_protection_enabled_for_new_repositories = true
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            GitHub has deprecated this organization-level field in favor of code security configurations, but it remains functional:

            ```bash
            gh api --method PATCH /orgs/ORG \
              -F secret_scanning_push_protection_enabled_for_new_repositories=true
            ```
    refs:
      - url: https://docs.github.com/en/code-security/secret-scanning/push-protection-for-repositories-and-organizations
        title: Push protection for repositories and organizations
  - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos-github
    filters: asset.platform == "github-org"
    mql: github.organization.secretScanningPushProtectionEnabledForNewRepos == true
  - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "github_organization_settings")
    mql: |
      terraform.resources("github_organization_settings").all(arguments["secret_scanning_push_protection_enabled_for_new_repositories"] == true)
