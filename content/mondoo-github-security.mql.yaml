  - uid: mondoo-github-repository-security-required-signed-commits
    title: Ensure repository branch protection requires signed commits
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-github-repository-security-required-signed-commits-github
        tags:
          mondoo.com/filter-title: GitHub Repository
          mondoo.com/filter-icon: github
      - uid: mondoo-github-repository-security-required-signed-commits-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-required-signed-commits-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-required-signed-commits-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every commit landing on the default branch carries a verified cryptographic signature.

        Require signed commits is an option on the branch protection rule for the default branch, and the check passes only when the default branch is protected and that option is turned on. GitHub accepts GPG, SSH, and S/MIME signatures, and marks a commit Verified when the signature checks out against a key registered to the account. The Terraform version of this check reads `require_signed_commits` on a `github_branch_protection` resource and requires it to be `true`.

        **Why this matters**

        The author and committer fields in a git commit are ordinary text supplied by whoever runs `git commit`. Nothing in git verifies them. Anyone with push access can set `user.name` and `user.email` to a trusted maintainer's values, and the resulting commit will display that person's name and avatar in the GitHub history. An attacker with a stolen personal access token or a compromised CI credential uses this to make a backdoor look like routine work from someone the team trusts, which delays discovery and misdirects the eventual investigation.

        Signature enforcement removes that option. To land a commit attributed to a maintainer, the attacker now needs that maintainer's signing key, not just some write credential. It also gives incident response a reliable pivot: after a token compromise, the set of commits that carry a valid signature and the set that would have been rejected are separable, so the blast radius can be bounded instead of guessed.

        Signing proves origin, not intent or quality, and a signed commit from a compromised workstation is still malicious. Note also that commits created through the GitHub web editor and through the API are signed automatically with GitHub's own key, so a stolen token used against the API produces commits that satisfy this rule. Keep required reviews in place alongside it.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Open the protection rule for the default branch.
        4. Review the **Require signed commits** setting.

        If **Require signed commits** is checked, the check passes. If it is unchecked, the check fails.

        ### Audit via CLI

        1. Query the signed-commits requirement on the default branch:

           ```bash
           gh api /repos/OWNER/REPO/branches/DEFAULT_BRANCH/protection/required_signatures \
             --jq '.enabled'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            Prerequisite: before enabling this, ensure contributors have configured local commit signing with GPG, SSH, or S/MIME and registered their signing key with GitHub. Once **Require signed commits** is enforced, unsigned commits are rejected, so any contributor who has not set up signing will be unable to merge.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To require signed commits with a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Create or edit an active branch ruleset that targets your default branch, such as `main` or `master`.
              4. Enable **Require signed commits**.
              5. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule for your default branch, such as `main` or `master`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, check the box for **Require signed commits**.
              6. Save the branch protection rule.

            For more details, see [About commit signature verification](https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification), [Require signed commits](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-signed-commits), and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            ```hcl
            resource "github_branch_protection" "default" {
              repository_id  = github_repository.example.node_id
              pattern        = "main"
              require_signed_commits = true
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            ```bash
            gh api --method POST \
              /repos/OWNER/REPO/branches/main/protection/required_signatures
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
        title: GitHub Docs - About protected branches
      - url: https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification
        title: GitHub Docs - About commit signature verification
  - uid: mondoo-github-repository-security-required-signed-commits-github
    filters: asset.platform == "github-repo"
    mql: |
      github.repository.branches
        .where( isDefault == true )
        .all( isProtected == true )
      github.repository.branches
        .where( isDefault == true )
        .all( protectionRules { requiredSignatures == true } )
