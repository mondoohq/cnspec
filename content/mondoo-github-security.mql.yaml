    mql: |
      terraform.state.resources.where(type == "github_branch_protection").all(values["required_pull_request_reviews"] != empty)
  - uid: mondoo-github-repository-security-block-creations-default-branch
    title: Ensure repository default branch blocks direct creations
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-github-repository-security-block-creations-default-branch-github
        tags:
          mondoo.com/filter-title: GitHub Repository
          mondoo.com/filter-icon: github
      - uid: mondoo-github-repository-security-block-creations-default-branch-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-block-creations-default-branch-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-block-creations-default-branch-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the repository's default branch protection also stops branch creation by users who are not permitted to push.

        A branch protection rule offers Restrict who can push to matching branches, and beneath it Restrict pushes that create matching branches, which extends the same push restriction to the act of creating a branch that matches the rule's pattern. Two things must hold for this check to pass: the default branch has a protection rule, and that option is turned on. The Terraform version of this check requires a `restrict_pushes` block on a `github_branch_protection` resource with `blocks_creations` set to `true`.

        **Why this matters**

        Branch protection matches branches by pattern, and push restrictions govern pushes to branches that already exist. Creation is a separate act. When creation is not blocked, someone outside the push allowlist can make a brand-new branch that matches the protected pattern and deliver its full contents in that single creation, so the code arrives having passed no review and tripped no push restriction. A rule written to guard `release/*` is bypassed by creating `release/2.1` from scratch and letting the pattern cover it after the fact.

        That matters most when automation keys off the pattern. Release, publishing, and deployment workflows commonly trigger on branches matching a naming convention, so creating a matching branch is a way to make CI run attacker-chosen code. The resulting job holds a `GITHUB_TOKEN` that can carry write permission to repository contents, packages, and releases, plus whatever repository secrets the job can read, which is how a branch name becomes a published artifact or a set of leaked cloud credentials.

        A stolen token with write access but no place in the allowlist is exactly the actor this closes out, since otherwise the allowlist constrains only what they can modify, not what they can introduce.

        Creation is only one of the three ways to change a protected pattern. Deletion and force pushes are governed by their own settings, and allowlisted actors remain able to create matching branches, so this belongs next to restrictions on deletion and force pushing rather than in place of them.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Open the protection rule for the default branch.
        4. Review the **Block creations** setting.

        If **Block creations** is checked for the default branch rule, the check passes. If it is unchecked, the check fails.

        ### Audit via CLI

        1. Query the block-creations setting on the default branch:

           ```bash
           gh api /repos/OWNER/REPO/branches/DEFAULT_BRANCH/protection \
             --jq '.block_creations.enabled'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To block branch creation with a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Create or edit an active branch ruleset that targets your default branch.
              4. Enable **Restrict creations**.
              5. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," click **Edit** next to the default branch rule.
              4. Check **Restrict who can push to matching branches**.
              5. Check **Restrict pushes that create matching branches**.
              6. Click **Save changes**.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#restrict-who-can-push-to-matching-branches) and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            Use the `restrict_pushes` block of the `github_branch_protection` resource. The `blocks_creations` argument prevents creation of branches that match the rule:

            ```hcl
            resource "github_branch_protection" "default" {
              repository_id = github_repository.example.node_id
              pattern       = "main"

              restrict_pushes {
                blocks_creations = true
              }
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Note: This endpoint replaces the entire branch protection configuration. Include all desired settings in the request.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/branches/main/protection \
              -F "block_creations=true" \
              -F "required_pull_request_reviews[required_approving_review_count]=1" \
              -F "required_status_checks=null" \
              -F "enforce_admins=true" \
              -F "restrictions=null"
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/managing-a-branch-protection-rule
        title: Managing a branch protection rule
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
        title: About protected branches
  - uid: mondoo-github-repository-security-block-creations-default-branch-github
    filters: asset.platform == "github-repo"
    mql: |
      github.repository.branches
        .where( isDefault == true )
        .all( isProtected == true )
      github.repository.branches
        .where( isDefault == true )
        .all( protectionRules { blockCreations == true } )
