    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "github_branch_protection")
    mql: |
      terraform.state.resources.where(type == "github_branch_protection").all(values.require_signed_commits == true)
  - uid: mondoo-github-repository-security-enforce-branch-protection
    title: Ensure repository does not allow bypassing of branch protection rules
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-github-repository-security-enforce-branch-protection-github
        tags:
          mondoo.com/filter-title: GitHub Repository
          mondoo.com/filter-icon: github
      - uid: mondoo-github-repository-security-enforce-branch-protection-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-enforce-branch-protection-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-enforce-branch-protection-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that branch protection on the default branch applies to administrators as well as to ordinary contributors.

        GitHub calls this Do not allow bypassing the above settings, the last option on the branch protection rule for the default branch, and the check passes only when the default branch is protected and that option is turned on. By default the restrictions of a branch protection rule do not apply to people with admin permission on the repository, nor to anyone holding a custom role with the bypass branch protections permission, so those accounts can push directly and merge without satisfying the rules. The Terraform version of this check reads `enforce_admins` on a `github_branch_protection` resource and requires it to be `true`.

        **Why this matters**

        Every control configured on the branch, required reviews, required status checks, signed commits, linear history, is conditional until admins are included. The rules describe what happens to contributors; the exemption describes what happens to the accounts an attacker most wants.

        Admin accounts are the highest value target in a repository for exactly this reason. A phished maintainer session or a stolen personal access token belonging to an owner turns into a direct push to the default branch: no pull request, no review, no test run, no reviewer notification. The change is live in the branch that CI builds and deploys from, and the first visible artifact is a deployment rather than a review request. The same path lets an attacker force-push to rewrite recent history and hide the insertion, or amend a release commit after it has been approved.

        Turning enforcement on also removes the routine habit of merging past a red check during an incident, which is where accidental regressions tend to enter. Plan the break-glass path in advance, since genuine emergencies now require an audited change to the protection settings. Note also that repository rulesets are a separate mechanism with their own bypass actor list, which this check does not read.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Open the protection rule for the default branch.
        4. Review the **Do not allow bypassing the above settings** option.

        If **Do not allow bypassing the above settings** is checked, the check passes. If it is unchecked, the check fails.

        ### Audit via CLI

        1. Query the enforce-admins setting on the default branch:

           ```bash
           gh api /repos/OWNER/REPO/branches/DEFAULT_BRANCH/protection/enforce_admins \
             --jq '.enabled'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            Caution: enforcing this applies the branch protection rules to administrators as well, so admins lose the ability to make emergency pushes that bypass the rules. Before enabling it, confirm a break-glass process exists, for example a documented procedure to temporarily disable enforcement under approval, so the team is not locked out during an incident.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. Rulesets do not have an admin bypass by default; you control who may bypass through the ruleset's bypass list. To enforce protection for everyone with a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Create or edit an active branch ruleset that targets your default branch, such as `main` or `master`.
              4. Leave the **Bypass list** empty, or add only the break-glass actors you intend to allow.
              5. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule for your default branch, such as `main` or `master`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, check the box for **Do not allow bypassing the above settings**.
              6. Save the branch protection rule.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches), [Do not allow bypassing the above settings](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#do-not-allow-bypassing-the-above-settings), and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            ```hcl
            resource "github_branch_protection" "default" {
              repository_id = github_repository.example.node_id
              pattern       = "main"
              enforce_admins = true
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Caution: this applies branch protection to administrators as well, removing their ability to bypass the rules for emergency pushes. Confirm a break-glass process exists before running it.

            ```bash
            gh api --method POST \
              /repos/OWNER/REPO/branches/main/protection/enforce_admins
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
        title: GitHub Docs - About protected branches
  - uid: mondoo-github-repository-security-enforce-branch-protection-github
    filters: asset.platform == "github-repo"
    mql: |
      github.repository.branches
        .where( isDefault == true )
        .all( isProtected == true )
      github.repository.branches
        .where( isDefault == true )
        .all( protectionRules.enforceAdminsEnabled == true )
  - uid: mondoo-github-repository-security-enforce-branch-protection-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "github_branch_protection")
    mql: |
      terraform.resources("github_branch_protection").all(arguments["enforce_admins"] == true)
  - uid: mondoo-github-repository-security-enforce-branch-protection-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "github_branch_protection")
    mql: |
      terraform.plan.resourceChanges.where(type == "github_branch_protection").all(change.after.enforce_admins == true)
  - uid: mondoo-github-repository-security-enforce-branch-protection-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "github_branch_protection")
    mql: |
      terraform.state.resources.where(type == "github_branch_protection").all(values.enforce_admins == true)
  # No Terraform variants: this check asserts the existence and contents of a SECURITY.md
  # file in the repository, which is a git tree property rather than a Terraform-declared
  # configuration. github_repository_file can manage individual files but cannot be reverse-
  # scanned to verify presence of a specific path across arbitrary repositories without
  # cross-resource correlation that produces false positives.
  - uid: mondoo-github-repository-security-security-policy
    filters: asset.platform == "github-repo"
    title: Ensure repository defines a security policy
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      github.repository.securityFile.exists
    docs:
      desc: |
        This check verifies that the repository publishes a security policy telling people how to report a vulnerability.

        No console toggle governs this one. GitHub looks for a `SECURITY.md` file in the repository root, in the `docs` folder, or in the `.github` folder, and surfaces whichever one it finds under the repository's Security tab, where anyone who wants to report a vulnerability can read it. The check passes when such a file exists, and it tests only for presence, not for what the file says.

        **Why this matters**

        Without a stated reporting path, a finder has to guess. The common guesses are all bad. Some open a public issue describing the flaw in detail, which turns a private report into a public exploit note and starts a race between the maintainers and everyone scraping GitHub issues. Some email an address pulled from a commit log that belongs to a contributor who left three years ago, and the report is never read. Some post to social media out of frustration after weeks of silence. Some sell it. Each of those outcomes is caused by the absence of a documented channel, not by the reporter acting in bad faith.

        The delay itself is the damage. The window between a researcher finding a bug and a maintainer learning about it is the window in which the same bug is available to anyone who repeats the research, and for a widely consumed library that exposure extends to every downstream consumer. A policy file also lets you set expectations that keep a report private while a fix is prepared: where to send it, what response time to expect, and which versions are still supported.

        A file that exists but names no contact address or no supported versions passes this check and helps nobody, so review the content. An organization-wide policy stored in the organization's `.github` repository is surfaced in the user interface for repositories that lack their own, but this check inspects the repository itself.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Look for a `SECURITY.md` file in the repository root, the `docs` directory, or the `.github` directory.

        If a `SECURITY.md` file is present in any of these locations, the check passes. If none exists, the check fails.

        ### Audit via CLI

        1. Query the repository contents for a security policy file:

           ```bash
           gh api /repos/OWNER/REPO/contents/SECURITY.md --jq '.name'
           ```

        If the command returns `SECURITY.md`, the check passes. If it returns a `Not Found` error, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your repository on GitHub.
            2. Click the **Security and quality** tab. If the tab is not visible, open the dropdown menu and select it.
            3. In the sidebar under "Reporting," click **Security policy**.
            4. Click **Start setup**.
            5. Add information about supported versions and how to report vulnerabilities, then commit the new `SECURITY.md` file.

            For more details, see [Adding a security policy to your repository](https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            ```hcl
            resource "github_repository_file" "security_policy" {
              repository     = github_repository.example.name
              file           = "SECURITY.md"
              content        = "# Security Policy\n\nReport vulnerabilities to security@example.com\n"
              commit_message = "Add security policy"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Create the SECURITY.md in the repository. When updating an existing file, the contents endpoint also requires the current file's `sha`:

            ```bash
            gh api --method PUT /repos/OWNER/REPO/contents/SECURITY.md \
              -f message="Add security policy" \
              -f content="$(base64 <<'CONTENT'
            # Security Policy

            Report vulnerabilities to security@example.com
            CONTENT
            )"
            ```
    refs:
      - url: https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository
        title: GitHub Docs - Adding a security policy to your repository
  # No Terraform variants: this check inspects the contents of every file tracked by the
  # repository to detect binary artifacts. File contents are a git tree property, not a
  # Terraform-declared configuration — Terraform manages resource state, not the bytes
  # inside an arbitrary file in a repository.
  - uid: mondoo-github-repository-security-binary-artifacts
    filters: asset.platform == "github-repo"
    title: Ensure repository does not generate binary artifacts
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      github.repository.allFiles
        .where( type == "file" )
        .all( isBinary == false )
    docs:
      desc: |
        This check verifies that the repository does not carry committed binary files.

        Nothing in the GitHub interface configures this. The instrument is the repository's own committed files, the ones a reader sees when browsing the repository. The check reads the entire file tree of the default branch and requires that none of the files in it is a binary. A file counts as a binary when its extension names a known executable or package format, such as `exe`, `dll`, `so`, `jar`, `class`, `rpm`, `deb`, `msi`, or `whl`.

        **Why this matters**

        A binary in source control is code that nobody reviews. Pull request review reads diffs, and the diff for a compiled artifact is an unreadable blob, so an approving reviewer is approving the commit message. That makes a committed executable, library, or installer the cheapest place in the repository to hide a backdoor. An attacker with write access, whether through a compromised maintainer account or a stolen personal access token, replaces the checked-in binary with a rebuilt copy containing extra behavior, writes a plausible message such as a version bump, and the change passes human review by construction.

        The consequence extends past the repository. Committed binaries are frequently the ones executed by build scripts, developer setup steps, and CI jobs, so the modified artifact runs on maintainer workstations and on runners holding deploy credentials. Because it was built somewhere off the record, there is no source, no build log, and no way to reproduce it, so after an incident you cannot prove what the shipped bytes actually did. Any vulnerable dependency compiled into it is invisible to dependency scanning as well.

        Some repositories legitimately contain binary data: images used in documentation, fonts, compiled test fixtures, and sample media. Those will fail here when their extension is one of the recognized executable or package formats, and the answer is to move them out of the reviewed source tree, to Git LFS or to a release asset, or to accept the exception deliberately.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Browse the file tree, including subdirectories, for committed executable or compiled files such as `.exe`, `.dll`, `.jar`, `.so`, or `.pyc`.

        If no generated binary artifacts are committed to the repository, the check passes. If binary artifacts are present, the check fails.

        ### Audit via CLI

        1. List the repository tree and search for common binary file extensions:

           ```bash
           gh api /repos/OWNER/REPO/git/trees/HEAD?recursive=1 \
             --jq '.tree[].path | select(test("\\.(exe|dll|jar|so|pyc|class)$"))'
           ```

        If the command prints nothing, the check passes. If it prints any file paths, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Browse the repository file tree and identify committed binary artifacts, such as `.exe`, `.dll`, `.jar`, `.so`, or `.pyc` files.
            2. Delete each binary file through the web editor, or remove them locally as described in the CLI steps.
            3. Move artifact production into your CI pipeline and publish build outputs as GitHub release assets or to a package registry instead of committing them to the repository.

            For more details, see [Binary Artifacts](https://github.com/ossf/scorecard/blob/main/docs/checks.md#binary-artifacts) in the OSSF Scorecard documentation.
        - id: cli
          desc: |
            **Using the Git CLI**

            Remove tracked binaries from version control, keep them ignored going forward, and push the change:

            ```bash
            git rm --cached app.exe
            echo "*.exe" >> .gitignore
            git add .gitignore
            git commit -m "Remove binary artifact from source control"
            git push
            ```

            If a binary contains sensitive data, also rewrite history with a tool such as git filter-repo and rotate any embedded credentials, because the file remains reachable in prior commits.
    refs:
      - url: https://github.com/ossf/scorecard/blob/main/docs/checks.md#binary-artifacts
        title: OSSF Scorecard - Binary Artifacts
  # No Terraform variants: this check verifies the presence of a .github/dependabot.yaml
  # (or .yml) file in the repository's git tree. File existence is not a Terraform-declared
  # configuration — github_repository_file can manage individual files but a per-module
  # variant cannot enumerate the contents of an arbitrary repository to verify the file is
  # present.
  - uid: mondoo-github-repository-security-ensure-dependabot-workflow
    filters: asset.platform == "github-repo"
    title: Ensure a Dependabot configuration file exists
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |-
      github.repository.files
        .any( name == ".github" && type == "dir" )
      github.repository.files
        .where( path == ".github" )
        .all( files.any( name.in(["dependabot.yaml", "dependabot.yml"]) ) )
    docs:
      desc: |
        This check verifies that the repository is configured for automated dependency update pull requests.

        The artifact here is a configuration file a developer writes and commits, at `.github/dependabot.yml` or `.github/dependabot.yaml`. It declares which package ecosystems and directories Dependabot should watch and how often it should look for newer versions. The check passes when the `.github` directory exists and holds either file, and fails when the directory is absent or neither file is present.

        **Why this matters**

        Dependency risk is a function of time. A vulnerability disclosed in a transitive package is public the moment the advisory is published, and exploitation of widely used libraries typically begins within days while affected repositories are still on the old version. When updates depend on someone remembering to run an upgrade, the gap is measured in months, and the version that finally ships is several majors ahead, which makes the upgrade risky enough to defer again.

        The exposure is not limited to production. GitHub Actions dependencies are covered too, and a stale action reference is a live supply chain path: a third-party action pinned to a mutable tag can be repointed by whoever controls that repository, and the replacement runs inside your workflow with whatever `GITHUB_TOKEN` permissions and repository secrets that job holds. Automated update pull requests keep those references moving and put each bump in front of a reviewer with a changelog attached, which is when a suspicious maintainer change is most likely to be noticed.

        This file governs version updates only. Dependabot alerts and automated security fixes are separate repository settings, and enabling them is what tells you an advisory affects code you already shipped. Configure both, and be aware that an update pull request still needs someone to review and merge it.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Open the `.github` directory.
        3. Look for a `dependabot.yml` or `dependabot.yaml` file.

        If a Dependabot configuration file is present in the `.github` directory, the check passes. If none exists, the check fails.

        ### Audit via CLI

        1. Query the repository for the Dependabot configuration file:

           ```bash
           gh api /repos/OWNER/REPO/contents/.github/dependabot.yml --jq '.name'
           ```

        If the command returns `dependabot.yml` (or `dependabot.yaml`), the check passes. If it returns a `Not Found` error for both file names, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Create a `.github/dependabot.yml` or `.github/dependabot.yaml` file in your repository.
            2. Define the configuration for Dependabot, including the package ecosystems and update schedule.
            3. Save the changes.

            For more details, see [Dependabot options reference](https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            ```hcl
            resource "github_repository_file" "dependabot" {
              repository     = github_repository.example.name
              file           = ".github/dependabot.yml"
              content        = <<-EOT
                version: 2
                updates:
                  - package-ecosystem: "github-actions"
                    directory: "/"
                    schedule:
                      interval: "weekly"
              EOT
              commit_message = "Add Dependabot configuration"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Create a Dependabot configuration file:

            ```bash
            gh api --method PUT /repos/OWNER/REPO/contents/.github/dependabot.yml \
              -f message="Add Dependabot configuration" \
              -f content="$(cat <<'CONTENT' | base64
            version: 2
            updates:
              - package-ecosystem: github-actions
                directory: /
                schedule:
                  interval: weekly
            CONTENT
            )"
            ```
