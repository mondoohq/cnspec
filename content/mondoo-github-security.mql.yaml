policies:
  - uid: mondoo-github-organization-security
    name: Mondoo GitHub Organization Security
    version: 1.8.6
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: github
    require:
      - provider: github
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure GitHub orgs, repos, and supply chain settings
    docs:
      desc: |
        The Mondoo GitHub Organization Security policy identifies critical misconfigurations in GitHub organizations that could expose your software development lifecycle to supply chain attacks, unauthorized code changes, and source code theft. This policy helps organizations detect and remediate weaknesses before attackers can exploit them to inject malicious code, harvest secrets, or compromise downstream consumers of your software.

        This policy provides security checks across key GitHub organization areas:

        - Two-factor authentication requirements
        - Default repository permissions and visibility
        - Verified domains and SAML SSO enforcement
        - Member, outside collaborator, and team access controls
        - Organization-wide security policies and Dependabot settings
        - Webhook and OAuth or GitHub App authorization

        Learn more about scanning GitHub in the [cnspec GitHub documentation](https://mondoo.com/docs/cnspec/saas/github).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Authentication & Access
        checks:
          - uid: mondoo-github-organization-security-two-factor-auth
          - uid: mondoo-github-organization-security-verified-domain
          - uid: mondoo-github-organization-security-default-permission-level
          - uid: mondoo-github-organization-security-fork-private-repos
          - uid: mondoo-github-organization-security-members-cannot-change-repo-visibility
          - uid: mondoo-github-organization-security-members-cannot-delete-repos
      - title: Security Features for New Repos
        checks:
          - uid: mondoo-github-organization-security-advanced-security-new-repos
          - uid: mondoo-github-organization-security-dependency-graph-new-repos
          - uid: mondoo-github-organization-security-dependabot-alerts-new-repos
          - uid: mondoo-github-organization-security-dependabot-security-updates-new-repos
          - uid: mondoo-github-organization-security-secret-scanning-new-repos
          - uid: mondoo-github-organization-security-secret-scanning-push-protection-new-repos
      - title: Organizational Policies
        checks:
          - uid: mondoo-github-organization-security-security-policy
      - title: Logging & Monitoring
        checks:
          - uid: mondoo-github-organization-security-audit-log-streaming-enabled
    scoring_system: highest impact
  - uid: mondoo-github-repository-security
    name: Mondoo GitHub Repository Security
    version: 1.8.5
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: github
    require:
      - provider: github
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure GitHub repos, branches, and dependencies
    docs:
      desc: |
        The Mondoo GitHub Repository Security policy identifies misconfigurations that could expose repositories to supply chain attacks, unauthorized code changes, and secret leakage. Insecure repository settings can allow attackers to push malicious code, access sensitive credentials, or compromise the software development lifecycle. This policy also evaluates open source dependencies to assess the risk they pose to your organization.

        This policy validates critical security controls including branch protection rules, secret scanning, Dependabot alerts, code scanning configurations, and access control settings.

        ## Authentication

        Scanning GitHub repositories requires a GitHub personal access token to authenticate with GitHub's API. The personal access token is required regardless of whether you are scanning a public or a private repository. Access to private repositories is determined by the level of access granted to the token.

        ### Create a personal access token

        To create a read-only personal access token, see [Creating a personal access token](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens) on GitHub's documentation site.

        ### Configure a GITHUB_TOKEN environment variable

        You supply your personal access token to cnspec using the `GITHUB_TOKEN` environment variable.

        #### Linux / macOS

        ```bash
        export GITHUB_TOKEN=<your personal access token>
        ```

        #### Windows

        ```powershell
        $Env:GITHUB_TOKEN = "<personal-access-token>"
        ```

        ## Scanning GitHub repositories

        To scan the configuration of a GitHub repository:

        ```bash
        cnspec scan github repo <ORG_NAME/REPO_NAME>
        ```

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Branch Protection
        checks:
          - uid: mondoo-github-repository-security-ensure-default-branch-protection
          - uid: mondoo-github-repository-security-ensure-release-branch-protection
          - uid: mondoo-github-repository-security-enforce-branch-protection
          - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch
          - uid: mondoo-github-repository-security-prevent-force-pushes-release-branch
          - uid: mondoo-github-repository-security-require-pull-request-reviews
          - uid: mondoo-github-repository-security-require-conversation-resolution
          - uid: mondoo-github-repository-security-require-status-checks-before-merging
          - uid: mondoo-github-repository-security-required-signed-commits
          - uid: mondoo-github-repository-security-block-creations-default-branch
      - title: Security Scanning
        checks:
          - uid: mondoo-github-repository-security-no-open-secret-scanning-alerts
          - uid: mondoo-github-repository-security-no-open-code-scanning-alerts
          - uid: mondoo-github-repository-security-no-open-critical-dependabot-alerts
      - title: Supply Chain Security
        checks:
          - uid: mondoo-github-repository-security-binary-artifacts
          - uid: mondoo-github-repository-security-actions-require-sha-pinning
          - uid: mondoo-github-repository-security-ensure-dependabot-workflow
      - title: Environment & Deployment
        checks:
          - uid: mondoo-github-repository-security-environment-prevent-self-review
      - title: Repository Policies
        checks:
          - uid: mondoo-github-repository-security-security-policy
          - uid: mondoo-github-repository-security-webhooks-use-ssl
    scoring_system: highest impact
queries:
  # No Terraform variants: the integrations/github provider (v6.x) does not expose a
  # two-factor enforcement argument on github_organization_settings. The org-level 2FA
  # requirement is set in the GitHub UI / REST API but not modeled as a Terraform field.
  - uid: mondoo-github-organization-security-two-factor-auth
    filters: asset.platform == "github-org"
    title: Enable Two-factor authentication for all users in the organization
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: github.organization.twoFactorRequirementEnabled
    docs:
      desc: |
        This check verifies that the GitHub organization requires two-factor authentication for everyone who belongs to it.

        GitHub calls this Require two-factor authentication for everyone in your organization, under Organization Settings, Security, Authentication security. The check passes only when the requirement is turned on. Turning it on has immediate consequences for people who have not enrolled: members and billing managers keep their seats but cannot reach the organization's resources until they add a second factor, and outside collaborators are removed from the organization and lose access to its repositories along with their forks of its private repositories. An owner can reinstate a removed collaborator's access and settings if that person enables two-factor authentication within three months of the removal.

        **Why this matters**

        A GitHub password is one of the most widely reused credentials a developer holds, and it appears in credential dumps constantly. Without a second factor, an attacker who buys a password from a dump, phishes one with a lookalike login page, or pulls one out of a developer's browser profile gets everything that account can reach. For a typical engineer that means push access to dozens of repositories at once.

        What follows is fast and quiet. The attacker pushes a commit that edits a build script, a lockfile, or a workflow in a repository nobody is actively watching, then waits for the next pipeline run to execute it with whatever deploy credentials that pipeline holds. Because the commit is authored under a real maintainer's identity, it survives casual review and shows up in blame as ordinary work.

        Account takeover also tends to become persistent. An attacker who is inside for even a few minutes adds an SSH key, creates a personal access token, or authorizes an OAuth app. Those artifacts keep working after the victim resets the password, so the eventual password rotation closes nothing.

        Two-factor enforcement covers interactive sign-in, and that is its limit. Personal access tokens, SSH deploy keys, GitHub App installation tokens, and CI service credentials authenticate without a second factor, so a leaked token bypasses this control entirely. Pair the requirement with short token lifetimes, secret scanning with push protection, and a periodic review of which tokens and deploy keys still have write access.
      audit: |
        ### Audit via Console

        1. Navigate to your organization on GitHub.
        2. Go to **Settings** > **Security** > **Authentication security**.
        3. Review the "Two-factor authentication" section.

        If two-factor authentication is required for everyone in the organization, the check passes. If it is not required, the check fails.

        ### Audit via CLI

        1. Query the organization's two-factor requirement setting:

           ```bash
           gh api /orgs/ORG --jq '.two_factor_requirement_enabled'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must be an organization owner to change this setting.

            To enable two-factor authentication for all users in your GitHub organization, follow these steps:
              1. Navigate to your organization on GitHub.
              2. Go to **Settings** > **Security** > **Authentication security**.
              3. Under "Two-factor authentication," enable the option to require two-factor authentication for all members of the organization.
              4. Save the changes.

            Warning: When you require two-factor authentication, members, outside collaborators, and billing managers who have not enabled two-factor authentication are removed from the organization. Confirm your own account has two-factor authentication enabled and notify affected users before turning on enforcement.

            For more details, see [Requiring two-factor authentication in your organization](https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-two-factor-authentication-for-your-organization/requiring-two-factor-authentication-in-your-organization) in the GitHub documentation.
        # No Terraform remediation: github_organization_settings has no two-factor-enforcement argument. Earlier versions of this remediation referenced `enforce_two_factor_authentication`, which is not a real argument and would fail terraform plan with "Unsupported argument".
        # No CLI remediation: the update-an-organization endpoint (PATCH /orgs/{org}) does not accept a two_factor_requirement_enabled parameter; the field is read-only in the REST API. Two-factor enforcement can only be enabled by an owner in the web UI.
    refs:
      - url: https://docs.github.com/en/authentication/securing-your-account-with-two-factor-authentication-2fa
        title: Securing your account with two-factor authentication (2FA)
  # No Terraform variants: domain verification is a runtime/external-state property
  # determined by GitHub after DNS TXT record validation. The integrations/github provider
  # does not expose a "verified" field on github_organization_settings, and the
  # github_organization data source surfaces verification status as runtime state, not as a
  # configurable resource argument.
  - uid: mondoo-github-organization-security-verified-domain
    filters: asset.platform == "github-org"
    title: Organization should have a verified domain attached
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: github.organization.isVerified
    docs:
      desc: |
        This check verifies that the GitHub organization has proven control of at least one domain it publishes under.

        Domain verification lives under Organization Settings, Security, Verified and approved domains. An owner adds a domain there, GitHub generates a DNS TXT record for it, the owner publishes that record with the domain's DNS host, and GitHub confirms it. Once confirmed, a Verified badge appears on the organization profile and the organization gains the option to restrict email notifications to addresses on its verified domains. The check passes only when at least one domain has been verified this way.

        **Why this matters**

        GitHub organization names are first come, first served, and nothing stops someone from registering a name that reads like yours with a hyphen, a plural, or a swapped character. An attacker who does this gets a profile that looks legitimate to anyone who has not memorized your exact slug. They fill it with forks of your public repositories so the activity graph looks real, then publish a package, a container image, or a reusable GitHub Actions workflow under that name.

        The payoff comes when an engineer or an automated dependency update points at the wrong organization. A workflow that references an action from the impostor organization runs attacker-controlled code inside your CI with whatever secrets that job is granted, and the reference looks correct in review because the organization name is nearly identical. The same trick works on install instructions pasted into a README or a support ticket.

        A verified badge is the signal that closes this off. It is checkable at a glance and cannot be forged without control of the DNS zone.

        Verification proves who owns the namespace, not that the code inside it is safe, and it does nothing about a squatted name someone already registered. Report those to GitHub for trademark takedown, and treat domain verification as one half of a pair with pinning third-party actions to a full commit SHA rather than a tag or branch.
      audit: |
        ### Audit via Console

        1. Navigate to your organization on GitHub.
        2. Go to **Settings** > **Verified and approved domains**.
        3. Review the list of domains and their status.

        If at least one domain shows a "Verified" status, the check passes. If no domain is verified, the check fails.

        ### Audit via CLI

        1. Query the organization's verified status:

           ```bash
           gh api /orgs/ORG --jq '.is_verified'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your organization on GitHub.
            2. Go to **Settings**. In the sidebar under **Security**, click **Verified and approved domains**.
            3. Click **Add a domain**, enter the domain you want to verify, and click **Add domain**.
            4. Create the DNS TXT record that GitHub displays with your DNS provider. DNS changes can take up to 72 hours to propagate.
            5. Return to **Verified and approved domains**, select **Continue verifying** next to the domain, and click **Verify**.

            For more details, see [Verifying or approving a domain for your organization](https://docs.github.com/en/enterprise-cloud@latest/organizations/managing-organization-settings/verifying-or-approving-a-domain-for-your-organization) in the GitHub documentation.
        # No CLI remediation: GitHub does not provide a REST API for organization domain verification. Earlier versions of this remediation referenced POST /orgs/{org}/domains endpoints that do not exist. Domains are added and verified in the web UI after DNS TXT validation.
    refs:
      - url: https://docs.github.com/en/enterprise-cloud@latest/organizations/managing-organization-settings/verifying-or-approving-a-domain-for-your-organization
        title: Verifying or approving a domain for your organization
  - uid: mondoo-github-organization-security-default-permission-level
    title: Ensure GitHub Organization has base permissions configured
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-github-organization-security-default-permission-level-github
        tags:
          mondoo.com/filter-title: GitHub Organization
          mondoo.com/filter-icon: github
      - uid: mondoo-github-organization-security-default-permission-level-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-default-permission-level-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-default-permission-level-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that new members of the GitHub organization receive read access to organization repositories by default rather than the ability to write to them.

        GitHub calls this Base permissions, under Organization Settings, Member privileges in the Access section of the sidebar. The level chosen applies automatically to every member for every repository in the organization, on top of access granted through teams or direct invitations, and a higher level granted on an individual repository overrides it. The levels run from no access at all up through Read, Write, and Admin. The check passes only on Read. The Terraform version of this check reads `default_repository_permission` on a `github_organization_settings` resource and requires the same level.

        **Why this matters**

        When the base permission is `write`, every person in the organization can push to every repository, including ones they have never opened and that no one expects them to touch. The blast radius of a single compromised account is then the entire code estate. An attacker holding one stolen personal access token or one phished session picks the least-watched repository in the organization, edits a build script or a dependency manifest, and lets that repository's pipeline execute the change with its own deploy credentials. Nobody who works on the busy repositories sees any of it.

        A base permission of `admin` is worse in a specific way: it hands every member the settings surface. From there an attacker can disable branch protection on a release branch, register a webhook that streams every push to a server they control, add a deploy key for durable access, or delete a repository outright and take the history with it.

        Some organizations run a stricter baseline than this check asks for, setting base permissions to `none` and granting repository access only through explicit team assignments. That model is tighter than `read`, and this check would need adjusting to accept it. Keep in mind that even `read` exposes full source and full git history to every member, so repositories whose history contains credentials need those credentials rotated regardless.
      audit: |
        ### Audit via Console

        1. Navigate to your organization on GitHub.
        2. Go to **Settings** > **Member privileges**.
        3. Review the "Base permissions" setting.

        If base permissions are set to "No permission" or "Read," the check passes. If they are set to "Write" or "Admin," the check fails.

        ### Audit via CLI

        1. Query the organization's default repository permission:

           ```bash
           gh api /orgs/ORG --jq '.default_repository_permission'
           ```

        If the command returns `none` or `read`, the check passes. If it returns `write` or `admin`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your organization on GitHub.
            2. Go to **Settings** > **Member privileges**.
            3. Under "Base permissions," select "Read," or select "No permission" and grant repository access explicitly through teams.
            4. Save the changes.

            For more details, see [Setting base permissions for an organization](https://docs.github.com/en/organizations/managing-access-to-your-organizations-repositories/setting-base-permissions-for-an-organization) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            To configure base permissions for your GitHub organization using Terraform, use the `github_organization_settings` resource. The `billing_email` argument is required by this resource:

            ```hcl
            resource "github_organization_settings" "example" {
              billing_email                 = "billing@example.com"
              default_repository_permission = "read"
            }
            ```

            For more details, see [github_organization_settings](https://registry.terraform.io/providers/integrations/github/latest/docs/resources/organization_settings) in the Terraform Registry.
        - id: cli
          desc: |
            **Using GitHub CLI**

            ```bash
            gh api --method PATCH /orgs/ORG \
              -f default_repository_permission=read
            ```
    refs:
      - url: https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/repository-roles-for-an-organization
        title: Setting base permissions for an organization
  - uid: mondoo-github-organization-security-default-permission-level-github
    filters: asset.platform == "github-org"
    mql: github.organization.defaultRepositoryPermission.in(["none", "read"])
  - uid: mondoo-github-organization-security-default-permission-level-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "github_organization_settings")
    mql: |
      terraform.resources("github_organization_settings").all(arguments["default_repository_permission"].in(["none", "read"]))
  - uid: mondoo-github-organization-security-default-permission-level-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "github_organization_settings")
    mql: |
      terraform.plan.resourceChanges.where(type == "github_organization_settings").all(change.after.default_repository_permission.in(["none", "read"]))
  - uid: mondoo-github-organization-security-default-permission-level-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "github_organization_settings")
    mql: |
      terraform.state.resources.where(type == "github_organization_settings").all(values.default_repository_permission.in(["none", "read"]))
  # No Terraform variants: this check looks for a SECURITY.md file in the org's .github
  # repository (or in each repo as a fallback). File-content presence is not a Terraform
  # configuration property — github_repository_file can manage the file, but verifying its
  # presence across an arbitrary number of repos from a single Terraform module requires
  # cross-resource correlation that produces false positives on modules managing files
  # elsewhere.
  - uid: mondoo-github-organization-security-security-policy
    filters: asset.platform == "github-org"
    title: Ensure the organization defines a default security policy
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      github.organization.repositories.any( name == ".github" ) &&
      github.repository( name: ".github" ).securityFile.exists
    docs:
      desc: |
        This check verifies that the organization publishes a default security policy covering the repositories it owns.

        There is no console toggle behind this check. The artifact is a `SECURITY.md` file in the organization's public `.github` repository, which GitHub then serves as the default security policy for every repository the organization owns that does not carry one of its own. Within that repository GitHub looks for the file in the root, the `docs` folder, or the `.github` folder. The check passes when the `.github` repository publishes such a file, and fails when it does not or when the organization has no `.github` repository. Whether an individual repository publishes its own policy is assessed by a companion check in this policy.

        **Why this matters**

        A security policy is the published answer to a question outsiders will otherwise answer badly: where do I send this bug. Without it, a researcher who has found a working authentication bypass or a remote code execution path has no private channel and improvises. The common improvisation is a public issue with reproduction steps, which turns a private finding into a working exploit visible to everyone watching the repository, and watchers include bots that mirror new issues within seconds.

        The other improvisations are no better. Some researchers post to a mailing list or social media on a disclosure clock you never agreed to. Some email an address they guess at, get no reply because nobody monitors it, and conclude the project does not care. Some sell the finding. In each case the first your team hears of the flaw is a public exploit or an incident in production.

        Publishing the policy is process, not defense, and it neither finds nor fixes anything on its own. Back it with GitHub's private vulnerability reporting so submissions land in a real queue, and make sure the contact address in the file reaches people who are on call, since a policy pointing at a dead mailbox is worse than none at all.
      audit: |
        ### Audit via Console

        1. Navigate to the organization on GitHub.
        2. Open its public `.github` repository. If the organization has no `.github` repository, the check fails.
        3. Look for a `SECURITY.md` file in that repository's root, its `docs` directory, or its `.github` directory.

        If a `SECURITY.md` file is present in any of those locations, the check passes.

        ### Audit via CLI

        1. Query the organization's `.github` repository for a security policy file:

           ```bash
           gh api /repos/ORG/.github/contents/SECURITY.md --jq '.name'
           ```

        If the command returns `SECURITY.md`, the check passes. If it returns a `Not Found` error, or the `.github` repository does not exist, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your organization's `.github` repository, or create it if it does not exist. A `SECURITY.md` file in this repository applies to every repository in the organization that has no security policy of its own.
            2. Click the **Security and quality** tab. If the tab is not visible, open the dropdown menu and select it.
            3. In the sidebar under "Reporting," click **Security policy**.
            4. Click **Start setup**.
            5. Add information about supported versions and how to report vulnerabilities, then commit the new `SECURITY.md` file.

            For more details, see [Adding a security policy to your repository](https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            To define an organization-wide security policy using Terraform, manage a `SECURITY.md` file in the organization's `.github` repository with the `github_repository_file` resource:

            ```hcl
            resource "github_repository_file" "security_policy" {
              repository = ".github"
              file       = "SECURITY.md"
              content    = <<EOF
            # Security Policy

            ## Reporting a Vulnerability

            If you discover a security vulnerability, please report it to us via email at security@example.com
            or through our [issue tracker](https://github.com/example/repo/issues).

            ## Security Policy

            We take security seriously and will respond to reports promptly.
            EOF
              commit_message = "Add security policy"
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Create the SECURITY.md in the `.github` repository. When updating an existing file, the contents endpoint also requires the current file's `sha`:

            ```bash
            gh api --method PUT /repos/ORG/.github/contents/SECURITY.md \
              -f message="Add security policy" \
              -f content="$(base64 <<'CONTENT'
            # Security Policy

            ## Reporting a Vulnerability

            Please report vulnerabilities to security@example.com
            CONTENT
            )"
            ```
    refs:
      - url: https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository
        title: GitHub Docs - Adding a security policy to your repository
  # No Terraform variants: this check asks "does the repository's default branch have a
  # protection rule?" Verifying that requires cross-resource correlation — matching
  # github_repository.default_branch against the patterns on github_branch_protection
  # resources targeting the same repository_id. The other branch-protection checks (signed
  # commits, PR reviews, etc.) do have variants because they assert config properties of
  # any declared github_branch_protection; this existence check would need joins that MQL
  # variants do not express well, and would false-positive on modules that manage branch
  # protection elsewhere.
  - uid: mondoo-github-repository-security-ensure-default-branch-protection
    filters: asset.platform == "github-repo"
    title: Ensure GitHub repository default branch is protected
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      github.repository.branches
        .where( isDefault == true )
        .all( isProtected == true )
    docs:
      desc: |
        This check verifies that the repository's default branch has branch protection turned on.

        Branch protection rules live under Repository Settings, Branches, and each rule applies to the branches matched by its branch name pattern. The check passes only when a rule matches the default branch. Protection is the switch that makes every other rule enforceable: required pull request reviews, required status checks, restrictions on who may push, and blocks on deletion all hang off a protection rule, and none of them can apply to a branch that has no rule. GitHub also offers rulesets as an alternative to branch protection rules.

        **Why this matters**

        The default branch is the one everyone else consumes. It is what a clone lands on, what a fork copies, what a dependency reference resolves to when someone points a package manager at the git URL, and in most pipelines it is what a deploy job builds from. Anything that reaches it reaches production and reaches every downstream copy.

        With no protection rule, a write-scoped credential is enough to put code there directly. An attacker with a stolen personal access token or a hijacked maintainer session pushes a commit that adds an install-time script to a package manifest or edits a workflow file, and there is no review step and no required status check standing between that push and the next build. The workflow path is especially attractive, because a job that triggers on push to the default branch typically holds the deploy credentials the attacker actually wants.

        The propagation is what makes it hard to clean up. Every fork taken after the push carries the change, and developers who pull get it without any signal that something unusual happened.

        Protection being present is not the same as protection being strict. A branch can carry a rule that requires zero approving reviews, requires no status checks, and lets administrators bypass everything, and it still reports as protected here. Read this result alongside the checks that assert the individual rules, especially required reviews and blocked force pushes.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Review the branch protection rules and confirm a rule matches the default branch.

        If the default branch is covered by a protection rule, the check passes. If no rule protects the default branch, the check fails.

        ### Audit via CLI

        1. Query the default branch and its protection status:

           ```bash
           gh api /repos/OWNER/REPO --jq '.default_branch'
           gh api /repos/OWNER/REPO/branches/DEFAULT_BRANCH --jq '.protected'
           ```

        If the second command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To create a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Select **New ruleset** > **New branch ruleset**.
              4. Set the enforcement status to **Active** and add a branch targeting rule that matches your default branch, such as `main` or `master`.
              5. Enable the desired protections, such as requiring a pull request before merging and requiring status checks to pass.
              6. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule for your default branch, such as `main` or `master`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, configure the desired protection options, such as required pull request reviews and status checks.
              6. Save the branch protection rule.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches) and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            To enforce branch protection for the default branch of your GitHub repository using Terraform, use the `github_branch_protection` resource:

            ```hcl
            resource "github_branch_protection" "default" {
              repository_id = github_repository.example.node_id
              pattern       = "main"

              required_pull_request_reviews {
                dismiss_stale_reviews      = true
                require_code_owner_reviews = true
              }

              enforce_admins = true

              required_status_checks {
                strict   = true
                contexts = ["ci/circleci"]
              }
            }
            ```

            For more details, see [github_branch_protection](https://registry.terraform.io/providers/integrations/github/latest/docs/resources/branch_protection) in the Terraform Registry.
        - id: cli
          desc: |
            **Using GitHub CLI**

            Note: This endpoint replaces the entire branch protection configuration. Include all desired settings in the request.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/branches/main/protection \
              -F "required_pull_request_reviews[required_approving_review_count]=1" \
              -F "required_status_checks=null" \
              -F "enforce_admins=true" \
              -F "restrictions=null"
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
        title: About Branch protection
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-branches-in-your-repository/changing-the-default-branch
        title: Changing the default branch
  # No Terraform variants: the runtime check iterates the repository's branches and looks
  # for those matching the user-configurable release-branch pattern, then asserts each has
  # protection. Both halves are impractical from HCL/plan/state: branches are not declared
  # in Terraform (they exist in the repo's git history), so we cannot enumerate them; and
  # asserting that some pattern in props is covered by a github_branch_protection.pattern
  # requires cross-resource correlation that produces false positives.
  - uid: mondoo-github-repository-security-ensure-release-branch-protection
    filters: asset.platform == "github-repo"
    title: Ensure GitHub repository release branches are protected
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    props:
      - uid: mondooGithubReleaseBranches
        title: Pattern for release branch
        mql: |
          return  /^(release|stable([-\/][0-9v]|$)|v?[0-9]+\.[0-9x]+)/
    mql: |
      github.repository.branches
        .where( name == props.mondooGithubReleaseBranches )
        .all( isProtected == true )
    docs:
      desc: |
        This check verifies that the repository's release branches carry a branch protection rule.

        Branch protection rules live under Repository Settings, Branches, and each rule applies to the branches matched by its branch name pattern. Which branches count as release branches comes from a policy property that the operator sets to the naming convention the team actually uses. The default covers the three shapes that are common in practice: a name beginning with `release`, the name `stable` either on its own or carrying a version such as `stable-2.19` and `stable/6.1.x`, and a version-shaped name such as `v1.x`, `2.0.x`, or `28.x`. A `stable` name followed by anything other than a version is left out, so a documentation or feature branch named `stable-docs` stays out of scope. Every branch matching that convention must be covered by a protection rule for the check to pass.

        A repository whose release branches follow none of those conventions has nothing in scope and passes. That is the correct answer for the majority of repositories, which cut releases from tags and keep no long-lived release branch at all, but it does mean the check is only as good as the pattern. Set the property to your own convention if you name release branches something the default does not reach.

        **Why this matters**

        A release branch is the code customers are running. It is cut from the default branch and then diverges, and from that point it lives on a different clock: hotfixes and backports land on it directly, long after mainline development has moved several versions ahead. That combination makes it both important and quiet. Far fewer people watch a branch called `release-4.2` than watch `main`, and reviewers who do look at it are often doing so under incident pressure.

        An attacker who wants their code running in a customer environment without going through mainline review targets exactly this. An unprotected release branch accepts a direct push from any write-scoped credential, and the release automation watching that branch builds the result, signs it, and ships it. There is no required review to satisfy and no status check to defeat, so the path from stolen token to signed artifact in a customer's environment is a single push.

        Branches under long-term support make this worse, because they may be the only branch still receiving changes for a widely deployed version that will not be upgraded soon.

        Coverage here depends entirely on the naming pattern. A team that names its branches `v2.1.x` or `stable` will match nothing, and a check with nothing to evaluate reports success, so confirm the property matches reality before trusting a pass. Note also that protection applies to branches and not to tags, which can be deleted and repointed at a different commit independently of any branch rule.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Review the branch protection rules and confirm a rule covers your release branches (for example, branches matching `release/*`).

        If every release branch is covered by a protection rule, the check passes. If any release branch is unprotected, the check fails.

        ### Audit via CLI

        1. List branches and inspect protection status for each release branch:

           ```bash
           gh api /repos/OWNER/REPO/branches --jq '.[] | select(.name | startswith("release")) | {name, protected}'
           ```

        If every listed release branch reports `protected: true`, the check passes. If any reports `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To create a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Select **New ruleset** > **New branch ruleset**.
              4. Set the enforcement status to **Active** and add a branch targeting rule covering your release branches, for example the pattern `release/*`.
              5. Enable the desired protections, such as requiring a pull request before merging and requiring status checks to pass.
              6. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule covering your release branches, for example the pattern `release/*`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, configure the desired protection options, such as required pull request reviews and status checks.
              6. Save the branch protection rule.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches) and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            To enforce branch protection for release branches of your GitHub repository using Terraform, use the `github_branch_protection` resource with a release pattern:

            ```hcl
            resource "github_branch_protection" "release" {
              repository_id = github_repository.example.node_id
              pattern       = "release/*"

              required_pull_request_reviews {
                dismiss_stale_reviews      = true
                require_code_owner_reviews = true
              }

              enforce_admins = true

              required_status_checks {
                strict   = true
                contexts = ["ci/circleci"]
              }
            }
            ```

            For more details, see [github_branch_protection](https://registry.terraform.io/providers/integrations/github/latest/docs/resources/branch_protection) in the Terraform Registry.
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run this for each release branch. Replace RELEASE_BRANCH with the branch name and URL-encode any slashes, for example `release%2F1.2`. Note: This endpoint replaces the entire branch protection configuration. Include all desired settings in the request.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/branches/RELEASE_BRANCH/protection \
              -F "required_pull_request_reviews[required_approving_review_count]=1" \
              -F "required_status_checks=null" \
              -F "enforce_admins=true" \
              -F "restrictions=null"
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/managing-a-branch-protection-rule
        title: GitHub Branch Protection Rules
  - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch
    title: Ensure repository does not allow force pushes to the default branch
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-github
        tags:
          mondoo.com/filter-title: GitHub Repository
          mondoo.com/filter-icon: github
      - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the repository's default branch is protected and that force pushes to it are refused.

        Two things must hold. The default branch must be covered by a branch protection rule at all, under Repository Settings, Branches, and on that rule the Allow force pushes setting must be off. A default branch with no protection rule fails on the first count, since nothing is in place to refuse a force push. The Terraform version of this check reads `allows_force_pushes` on a `github_branch_protection` resource and requires that it not be true.

        **Why this matters**

        A normal push adds to history. A force push replaces it, and that difference is what an attacker is after. The cleanest abuse is post-approval substitution: a pull request is reviewed and approved, and then the branch is rewritten so the commit that lands carries the reviewed message and subject but different content. The approval sits on the record, no new review event fires, and the diff a human already read no longer describes what shipped.

        Rewriting also erases. Someone who pushed a malicious commit, waited for a workflow to run it against the repository secrets, and got what they came for can force push the branch back to its prior state. Afterward `git log` in every fresh clone shows nothing unusual. Traces survive in the server-side reflog and the organization audit log, but only for a team that knows to look there before retention expires.

        There is collateral damage even when the intent is benign. A rewrite invalidates every existing clone, and developers who unstick themselves with a hard reset destroy their own local evidence of what the branch contained.

        This setting governs the force push path for one branch and nothing more. It does not restrict who may push normally, it does not extend to other branches or to tags, and unless the rule is configured to apply to administrators as well, an account with admin rights on the repository can still bypass it.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Open the protection rule for the default branch.
        4. Review the **Allow force pushes** setting.

        If **Allow force pushes** is unchecked for the default branch, the check passes. If it is enabled, the check fails.

        ### Audit via CLI

        1. Query the force-push setting on the default branch:

           ```bash
           gh api /repos/OWNER/REPO/branches/DEFAULT_BRANCH/protection \
             --jq '.allow_force_pushes.enabled'
           ```

        If the command returns `false`, the check passes. If it returns `true`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To block force pushes with a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Create or edit an active branch ruleset that targets your default branch, such as `main` or `master`.
              4. Enable **Block force pushes**.
              5. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule for your default branch, such as `main` or `master`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, make sure **Allow force pushes** is unchecked.
              6. Save the branch protection rule.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches), [Allow force pushes](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#allow-force-pushes), and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            If you are using Terraform to manage your GitHub repository settings, disable force pushes on the default branch with the `allows_force_pushes` argument of the `github_branch_protection` resource:

            ```hcl
            resource "github_branch_protection" "default" {
              repository_id       = github_repository.example.node_id
              pattern             = "main"
              allows_force_pushes = false
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Note: This endpoint replaces the entire branch protection configuration. Include all desired settings in the request.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/branches/main/protection \
              -F "allow_force_pushes=false" \
              -F "required_pull_request_reviews[required_approving_review_count]=1" \
              -F "required_status_checks=null" \
              -F "enforce_admins=true" \
              -F "restrictions=null"
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
        title: GitHub Docs - About protected branches
  - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-github
    filters: asset.platform == "github-repo"
    mql: |
      github.repository.branches
        .where( isDefault == true )
        .all( isProtected == true )
      github.repository.branches
        .where( isDefault == true )
        .all( protectionRules.allowForcePushesEnabled == false )
  - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "github_branch_protection")
    mql: |
      terraform.resources("github_branch_protection").all(arguments["allows_force_pushes"] != true)
  - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "github_branch_protection")
    mql: |
      terraform.plan.resourceChanges.where(type == "github_branch_protection").all(change.after.allows_force_pushes != true)
  - uid: mondoo-github-repository-security-prevent-force-pushes-default-branch-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "github_branch_protection")
    mql: |
      terraform.state.resources.where(type == "github_branch_protection").all(values.allows_force_pushes != true)
  # No Terraform variants: same cross-resource correlation problem as ensure-release-branch-protection.
  # The check iterates branches matching a user-configurable release pattern (props.mondooGithubReleaseBranches)
  # and asserts allows_force_pushes is disabled on each. Asserting that the pattern is covered
  # by a github_branch_protection requires joins that MQL variants do not express well, and
  # the prevent-force-pushes-default-branch variant already covers the typical case for any
  # declared protection.
  - uid: mondoo-github-repository-security-prevent-force-pushes-release-branch
    filters: asset.platform == "github-repo"
