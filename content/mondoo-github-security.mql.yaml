  - uid: mondoo-github-repository-security-require-status-checks-before-merging
    title: Ensure status checks are passing before merging PRs on the default branch
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-github-repository-security-require-status-checks-before-merging-github
        tags:
          mondoo.com/filter-title: GitHub Repository
          mondoo.com/filter-icon: github
      - uid: mondoo-github-repository-security-require-status-checks-before-merging-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-require-status-checks-before-merging-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-repository-security-require-status-checks-before-merging-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the default branch requires at least one status check to pass before a pull request can be merged into it.

        On the branch protection rule for the default branch, GitHub calls this Require status checks to pass before merging. Turning it on reveals a search field beneath it where an administrator picks the individual checks that become required. The check passes only when the default branch is protected and that required list holds at least one entry. It asserts nothing about which checks are named or what they do. The Terraform version of this check asserts that a `required_status_checks` block is present on a `github_branch_protection` resource.

        **Why this matters**

        Automated checks are frequently the only reviewer that actually reads every line of a large diff. Secret scanning, dependency review, static analysis, and the test suite run on the merge result and report back as commit statuses. If nothing is required, those checks still run and still turn red, and the merge button stays green next to them. A maintainer merging twenty pull requests in an afternoon will not stop for a failing job that does not block anything.

        That is directly exploitable. An attacker who lands a pull request through a compromised contributor account, or who has stolen a personal access token with `repo` scope, wants the change on the default branch before a human correlates the red check with the diff. A dependency swapped to a typosquatted package, an added postinstall script, or a workflow edit that exfiltrates `GITHUB_TOKEN` all produce loud automated failures and no enforcement.

        Because the condition is only that the list is non-empty, a repository can satisfy it with one trivial check while the build and the security scans stay optional. Review which contexts are actually listed, and consider also requiring branches to be up to date before merging so that checks are evaluated against the current tip rather than a stale base.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Open the protection rule for the default branch.
        4. Review the **Require status checks to pass before merging** setting.

        If status checks are required before merging, the check passes. If no status checks are required, the check fails.

        ### Audit via CLI

        1. Query the required status checks on the default branch:

           ```bash
           gh api /repos/OWNER/REPO/branches/DEFAULT_BRANCH/protection \
             --jq '.required_status_checks.contexts'
           ```

        If the command returns a non-empty list of status check contexts, the check passes. If it returns an empty list or a `Not Found` error, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To require status checks with a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Create or edit an active branch ruleset that targets your default branch, such as `main` or `master`.
              4. Enable **Require status checks to pass** and add the status checks to require.
              5. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule for your default branch, such as `main` or `master`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, check the box for **Require status checks to pass before merging** and select the status checks to require.
              6. Save the branch protection rule.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches), [Require status checks before merging](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-status-checks-before-merging), and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            If you are using Terraform to manage your GitHub repository settings, require status checks to pass before merging with the `required_status_checks` block of the `github_branch_protection` resource:

            ```hcl
            resource "github_branch_protection" "default" {
              repository_id = github_repository.example.node_id
              pattern       = "main"

              required_status_checks {
                strict   = true
                contexts = ["ci/circleci", "ci/gh_action_1"]
              }
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Note: This endpoint replaces the entire branch protection configuration. Include all desired settings in the request.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/branches/main/protection \
              -F "required_status_checks[strict]=true" \
              -F "required_status_checks[contexts][]=ci/build" \
              -F "required_pull_request_reviews[required_approving_review_count]=1" \
              -F "enforce_admins=true" \
              -F "restrictions=null"
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
        title: GitHub Docs - About protected branches
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-status-checks-before-merging
        title: Require status checks before merging
