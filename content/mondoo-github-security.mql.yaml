      - uid: mondoo-github-repository-security-require-conversation-resolution-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a pull request cannot be merged into the default branch while review comments on it are still unresolved.

        Require conversation resolution before merging is an option on the branch protection rule that covers the default branch. Two things must hold for the check to pass: the default branch has a protection rule at all, and that option is turned on. The Terraform version of this check reads `require_conversation_resolution` on a `github_branch_protection` resource and requires it to be `true`.

        **Why this matters**

        Review comments are where a reviewer records the thing that worried them. A reviewer notices that a pull request adds a `curl ... | bash` step to a release workflow, or bumps a third-party GitHub Action from a pinned SHA to a floating tag, or quietly widens the `permissions:` block on a job that already holds a deploy credential, and writes a comment asking why. Without required conversation resolution, that comment is advisory text. Anyone with write access can merge over the top of it, and the reviewer's objection ends up in a closed thread that nobody reads again.

        An attacker working from a compromised maintainer account depends on exactly that gap. The malicious change does not need to survive scrutiny, only to outrun it. A single approval from a reviewer skimming a large diff, followed by an immediate merge while an unanswered question sits on the relevant line, is enough to put attacker-controlled code on the branch that builds and deploys. Once merged, the change is in the release history and the audit trail shows a normal approved pull request.

        The setting forces resolution, not agreement. A pull request author with write access can mark their own threads resolved and merge, so this is a speed bump against carelessness rather than a control against a determined insider. Pair it with required reviews from code owners and with a protected branch that admins cannot bypass.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Open the protection rule for the default branch.
        4. Review the **Require conversation resolution before merging** setting.

        If **Require conversation resolution before merging** is checked, the check passes. If it is unchecked, the check fails.

        ### Audit via CLI

        1. Query the conversation-resolution setting on the default branch:

           ```bash
           gh api /repos/OWNER/REPO/branches/DEFAULT_BRANCH/protection \
             --jq '.required_conversation_resolution.enabled'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To require conversation resolution with a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Create or edit an active branch ruleset that targets your default branch, such as `main` or `master`.
              4. Enable **Require conversation resolution before merging**.
              5. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule for your default branch, such as `main` or `master`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, check the box for **Require conversation resolution before merging**.
              6. Save the branch protection rule.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches), [Require conversation resolution before merging](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-conversation-resolution-before-merging), and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            If you are using Terraform to manage your GitHub repository settings, require conversation resolution before merging with the `require_conversation_resolution` argument of the `github_branch_protection` resource:

            ```hcl
            resource "github_branch_protection" "default" {
              repository_id                   = github_repository.example.node_id
              pattern                         = "main"
              require_conversation_resolution = true
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Note: This endpoint replaces the entire branch protection configuration. Include all desired settings in the request.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/branches/main/protection \
              -F "required_conversation_resolution=true" \
              -F "required_pull_request_reviews[required_approving_review_count]=1" \
              -F "required_status_checks=null" \
              -F "enforce_admins=true" \
              -F "restrictions=null"
            ```
