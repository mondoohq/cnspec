  - uid: mondoo-github-organization-security-secret-scanning-new-repos
    title: Ensure secret scanning is enabled for new repositories
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    variants:
      - uid: mondoo-github-organization-security-secret-scanning-new-repos-github
        tags:
          mondoo.com/filter-title: GitHub Organization
          mondoo.com/filter-icon: github
      - uid: mondoo-github-organization-security-secret-scanning-new-repos-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-secret-scanning-new-repos-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-secret-scanning-new-repos-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that repositories created in the organization have secret scanning turned on from the moment they exist.

        Secret scanning is one of the enablement settings an owner turns on inside a security configuration, which is built under Organization Settings by opening the Security section of the sidebar, then Advanced Security, then Configurations. The check passes only when scanning is on in the configuration GitHub applies by default to newly created repositories. That default takes effect at creation time, so turning it on does not retroactively start scanning repositories that already exist. It protects the next repository somebody creates, not the ones already in the organization. The Terraform version of this check reads `secret_scanning_enabled_for_new_repositories` on a `github_organization_settings` resource and requires the same value.

        **Why this matters**

        Credentials reach git repositories constantly, and almost never on purpose. A developer hard-codes an access key to get a script working, commits it while debugging, then deletes the line in a later commit and considers the problem handled. The key is still in the history and still reachable by commit SHA, and anyone who can read the repository can read it.

        On public code the window to exploit that is measured in seconds. Bots watch the public GitHub events feed, clone new pushes, and test any cloud key they find almost immediately, so the account is being enumerated before a human notices the mistake. Publishing tokens are worse still. An npm or PyPI token pulled out of a commit lets an attacker push a backdoored version of a package that thousands of builds install without review, which turns one careless commit into a compromise of every downstream consumer.

        Scanning is detection, not prevention: the secret has already been pushed by the time an alert appears. Turn it on explicitly for repositories that predate this setting, pair it with push protection so the commit is stopped at the boundary, and treat every alert as a credential to rotate rather than a line to delete from history.
      audit: |
        ### Audit via Console

        1. Navigate to your organization on GitHub.
        2. Go to **Settings**. In the sidebar under **Security**, select **Advanced Security** > **Configurations**.
        3. Review the security configuration applied as the default for new repositories and confirm **Secret scanning** is set to **Enabled**.

        If the default configuration for new repositories enables secret scanning, the check passes. If it does not, the check fails. On organizations that have not yet migrated to security configurations, this setting appears on the legacy **Settings** > **Code security and analysis** page under "Secret scanning."

        ### Audit via CLI

        1. Query the organization's secret scanning default:

           ```bash
           gh api /orgs/ORG --jq '.secret_scanning_enabled_for_new_repositories'
           ```

        If the command returns `true`, the check passes. If it returns `false`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            GitHub manages organization-wide security defaults through security configurations, which replaced the former "Code security and analysis" settings page.

            1. Navigate to your organization on GitHub.
            2. Go to **Settings**. In the sidebar under **Security**, select **Advanced Security** > **Configurations**.
            3. Create a new security configuration or edit an existing one, and set **Secret scanning** to **Enabled**.
            4. Save the configuration.
            5. Apply the configuration to your repositories and mark it as the default for newly created repositories.

            For more details, see [Applying a custom security configuration](https://docs.github.com/en/code-security/securing-your-organization/enabling-security-features-in-your-organization/applying-a-custom-security-configuration) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            The `billing_email` argument is required by this resource:

            ```hcl
            resource "github_organization_settings" "example" {
              billing_email                                = "billing@example.com"
              secret_scanning_enabled_for_new_repositories = true
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            GitHub has deprecated this organization-level field in favor of code security configurations, but it remains functional:

            ```bash
            gh api --method PATCH /orgs/ORG \
              -F secret_scanning_enabled_for_new_repositories=true
            ```
    refs:
      - url: https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/managing-security-and-analysis-settings-for-your-organization
        title: Managing security and analysis settings for your organization
  - uid: mondoo-github-organization-security-secret-scanning-new-repos-github
    filters: asset.platform == "github-org"
    mql: github.organization.secretScanningEnabledForNewRepos == true
  - uid: mondoo-github-organization-security-secret-scanning-new-repos-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "github_organization_settings")
    mql: |
      terraform.resources("github_organization_settings").all(arguments["secret_scanning_enabled_for_new_repositories"] == true)
  - uid: mondoo-github-organization-security-secret-scanning-new-repos-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "github_organization_settings")
    mql: |
      terraform.plan.resourceChanges.where(type == "github_organization_settings").all(change.after.secret_scanning_enabled_for_new_repositories == true)
  - uid: mondoo-github-organization-security-secret-scanning-new-repos-terraform-state
