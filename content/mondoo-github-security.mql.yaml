      - url: https://docs.github.com/en/code-security
        title: GitHub Code Security
      - url: https://docs.github.com/en/code-security/dependabot/dependabot-auto-triage-rules/about-dependabot-auto-triage-rules
        title: About Dependabot auto-triage rules
  - uid: mondoo-github-organization-security-fork-private-repos
    title: Ensure organization members cannot fork private repositories
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-github-organization-security-fork-private-repos-github
        tags:
          mondoo.com/filter-title: GitHub Organization
          mondoo.com/filter-icon: github
      - uid: mondoo-github-organization-security-fork-private-repos-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-fork-private-repos-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-github-organization-security-fork-private-repos-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that organization members cannot fork the organization's private and internal repositories.

        GitHub calls this Allow forking of private and internal repositories, under Organization Settings, Member privileges, in the Repository forking section. The check passes only when forking of private and internal repositories is not allowed for the organization. The Terraform version of this check reads `members_can_fork_private_repositories` on a `github_organization_settings` resource and requires it to be `false`.

        **Why this matters**

        A fork is a full copy of the repository that lives under a personal account, outside the organization's administrative reach. Organization owners cannot audit its collaborators, cannot apply branch protection to it, cannot see its access log, and cannot delete it. Every secret ever committed to that history, every internal hostname, every deploy script, and every piece of proprietary logic is now sitting in a namespace controlled by an individual.

        That copy outlives the relationship. When the member leaves and their organization membership is revoked, the personal fork is untouched, so offboarding removes access to the original while leaving a complete snapshot in the departing person's hands. If that account is later phished, or its personal access token leaks in a `.npmrc` or a CI log, the attacker gets the source without ever touching the organization. Worse, the fork owner can change the visibility of their copy, and a private repository turned public is scraped by credential harvesting bots within seconds, at which point any committed key is in use before the disclosure email is written.

        Forks also become an exfiltration route that looks like ordinary work: pushing to a personal remote rarely triggers the alerting that a large clone from a corporate device might.

        Disabling forking does not stop someone with read access from cloning the repository and pushing it elsewhere manually, so treat this as removing the easy path rather than closing the channel. Pair it with secret scanning across the organization and with a review of which repositories genuinely need broad member access.
      audit: |
        ### Audit via Console

        1. Navigate to your organization on GitHub.
        2. Go to **Settings** > **Member privileges**.
        3. Review the "Repository forking" setting.

        If forking of private repositories is disabled, the check passes. If members are allowed to fork private repositories, the check fails.

        ### Audit via CLI

        1. Query the organization's private fork setting:

           ```bash
           gh api /orgs/ORG --jq '.members_can_fork_private_repositories'
           ```

        If the command returns `false`, the check passes. If it returns `true`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your organization on GitHub.
            2. Go to **Settings** > **Member privileges**.
            3. Under "Repository forking," uncheck the option to allow forking of private repositories.
            4. Save the changes.

            For more details, see [Managing the forking policy for your organization](https://docs.github.com/en/organizations/managing-organization-settings/managing-the-forking-policy-for-your-organization) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            To prevent members from forking private repositories using Terraform, use the `github_organization_settings` resource. The `billing_email` argument is required by this resource:

            ```hcl
            resource "github_organization_settings" "example" {
              billing_email                          = "billing@example.com"
              members_can_fork_private_repositories = false
            }
            ```

            For more details, see [github_organization_settings](https://registry.terraform.io/providers/integrations/github/latest/docs/resources/organization_settings) in the Terraform Registry.
        - id: cli
          desc: |
            **Using GitHub CLI**

            ```bash
            gh api --method PATCH /orgs/ORG \
              -F members_can_fork_private_repositories=false
            ```
    refs:
      - url: https://docs.github.com/en/organizations/managing-organization-settings/managing-the-forking-policy-for-your-organization
        title: Managing the forking policy for your organization
  - uid: mondoo-github-organization-security-fork-private-repos-github
    filters: asset.platform == "github-org"
    mql: github.organization.membersCanForkPrivateRepos == false
  - uid: mondoo-github-organization-security-fork-private-repos-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "github_organization_settings")
    mql: |
