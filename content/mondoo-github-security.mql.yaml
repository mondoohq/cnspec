      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    props:
      - uid: mondooGithubReleaseBranches
        title: Pattern for release branch
        mql: |
          return  /^(release|stable([-\/][0-9v]|$)|v?[0-9]+\.[0-9x]+)/
    mql: |
      github.repository.branches
        .where( name == props.mondooGithubReleaseBranches )
        .all( isProtected == true )
      github.repository.branches
        .where( name == props.mondooGithubReleaseBranches )
        .all( protectionRules.allowForcePushesEnabled == false )
    docs:
      desc: |
        This check verifies that the repository's release branches are protected and that history on them cannot be rewritten by a force push.

        This applies the same Allow force pushes setting to every branch whose name matches the release branch naming convention the operator configures as a policy property. Each matching branch must be covered by a branch protection rule under Repository Settings, Branches, and force pushes must be off on that rule. Both conditions must hold for every matching branch, since a branch with no protection rule has nothing in place to refuse a rewrite of its history.

        **Why this matters**

        The history on a release branch is the authoritative record of what shipped. It is what an incident responder reaches for when the question is which code was running in the version a customer deployed, and that question gets answered by diffing the branch against the last known-good tag. A force push changes the answer retroactively, so the diff comes back clean and the responder concludes nothing changed when something did.

        That is the outcome an attacker wants from a release branch specifically. Land a change, let the release pipeline build and publish from it, then rewrite the branch to remove the commit. The customer-facing artifact is out the door, and the commit that produced it is no longer reachable from any branch. Reconstructing what happened then takes the server-side reflog or a build log that captured the original SHA, and neither is where anyone looks first.

        Rewriting also desynchronizes the artifact registry. Automation keyed to the branch head will rebuild and republish after a rewrite, leaving a published version whose contents match no commit anyone can find.

        This check does not speak to the default branch, which needs its own force push rule. Its coverage is also bounded by the naming pattern in the property, so branches the team names differently are simply not evaluated. Deleting a release branch and recreating it at a different commit produces much the same rewrite, so block branch deletion on the same rule.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to **Settings** > **Branches**.
        3. Open the protection rule covering your release branches.
        4. Review the **Allow force pushes** setting.

        If **Allow force pushes** is unchecked for every release branch, the check passes. If it is enabled on any release branch, the check fails.

        ### Audit via CLI

        1. For each release branch, query the force-push setting:

           ```bash
           gh api /repos/OWNER/REPO/branches/RELEASE_BRANCH/protection \
             --jq '.allow_force_pushes.enabled'
           ```

        If the command returns `false` for every release branch, the check passes. If it returns `true` for any, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            You must have admin access to the repository to change branch protection.

            GitHub now recommends Repository Rulesets as the modern mechanism for protecting branches. To block force pushes with a ruleset:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Rules** > **Rulesets**.
              3. Create or edit an active branch ruleset that targets your release branches, for example the pattern `release/*`.
              4. Enable **Block force pushes**.
              5. Save the ruleset.

            Classic branch protection rules remain available as an alternative:
              1. Navigate to your repository on GitHub.
              2. Go to **Settings** > **Branches**.
              3. Under "Branch protection rules," add or edit a rule covering your release branches, for example the pattern `release/*`.
              4. Ensure **Protect matching branches** is enabled.
              5. In the rule settings, make sure **Allow force pushes** is unchecked.
              6. Save the branch protection rule.

            For more details, see [About protected branches](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches), [Allow force pushes](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#allow-force-pushes), and [About rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) in the GitHub documentation.
        - id: terraform
          desc: |
            **Using Terraform**

            If you are using Terraform to manage your GitHub repository settings, disable force pushes on release branches with the `allows_force_pushes` argument of the `github_branch_protection` resource:

            ```hcl
            resource "github_branch_protection" "release" {
              repository_id       = github_repository.example.node_id
              pattern             = "release/*"
              allows_force_pushes = false
            }
            ```
        - id: cli
          desc: |
            **Using GitHub CLI**

            Run this for each release branch. Replace RELEASE_BRANCH with the branch name and URL-encode any slashes. Note: This endpoint replaces the entire branch protection configuration. Include all desired settings in the request.

            ```bash
            gh api --method PUT /repos/OWNER/REPO/branches/RELEASE_BRANCH/protection \
              -F "allow_force_pushes=false" \
              -F "required_pull_request_reviews[required_approving_review_count]=1" \
              -F "required_status_checks=null" \
              -F "enforce_admins=true" \
              -F "restrictions=null"
            ```
    refs:
      - url: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
        title: GitHub Docs - About protected branches
  - uid: mondoo-github-repository-security-require-conversation-resolution
    title: Ensure branch protection requires conversation resolution before merging
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
