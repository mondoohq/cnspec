  - uid: mondoo-github-organization-security-members-cannot-delete-repos
    filters: asset.platform == "github-org"
    title: Ensure organization members cannot delete repositories
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-14
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ip-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: github.organization.membersCanDeleteRepositories == false
    docs:
      desc: |
        This check verifies that ordinary organization members cannot remove repositories from the organization.

        Repository deletion and transfer is a heading on the Member privileges page in Organization Settings, under Access in the sidebar, and it carries a single checkbox named Allow members to delete or transfer repositories for this organization. The check passes only when that box is cleared. The one setting governs both actions, so a member holding admin rights on a repository can neither delete it nor transfer it out of the organization, and either move requires an organization owner.

        **Why this matters**

        Deletion destroys far more than the code. The git history usually survives on somebody's laptop, but issues, pull request discussions, review history, releases and their published binaries, wikis, deploy keys, and branch protection configuration do not. Rebuilding a repository from a developer clone recovers the source and loses the record of why every decision was made, and any pipeline or dependency that resolved against that repository breaks immediately.

        Transfer is the quieter half, and it is the one worth worrying about. A transferred repository is not gone, it simply belongs to an account the organization does not control. The attacker now owns the code, the history, and the repository's identity, while redirects keep old links working for a while so the move can go unnoticed. A stolen personal access token with the right scope or a phished maintainer account is enough to do it.

        Both actions are also available to a departing employee acting on impulse, which is a more common cause of a missing repository than any external attacker. The blast radius is the same either way, and the recovery path runs through GitHub support rather than through anything the organization can do for itself.

        This does not protect the contents of a repository that stays in place. History rewrites through force pushes, branch deletion, and tag moves all remain available, so pair this with branch protection rules and an independent backup of anything whose loss would matter.
      audit: |
        ### Audit via Console

        1. Navigate to your organization on GitHub.
        2. Go to **Settings** > **Member privileges**.
        3. Review the "Repository deletion and transfer" setting.

        If members are not allowed to delete or transfer repositories, the check passes. If members can delete repositories, the check fails.

        ### Audit via CLI

        1. Query the organization's repository deletion setting:

           ```bash
           gh api /orgs/ORG --jq '.members_can_delete_repositories'
           ```

        If the command returns `false`, the check passes. If it returns `true`, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your organization on GitHub.
            2. Go to **Settings** > **Member privileges**.
            3. Under "Repository deletion and transfer," uncheck the option to allow members to delete repositories.
            4. Save the changes.

            For more details, see [Setting permissions for deleting or transferring repositories](https://docs.github.com/en/organizations/managing-organization-settings/setting-permissions-for-deleting-or-transferring-repositories) in the GitHub documentation.
        # No Terraform remediation: github_organization_settings has no members_can_delete_repositories argument. Earlier versions of this remediation referenced that field, which is not a real argument and would fail terraform plan with "Unsupported argument".
        # No CLI remediation: the update-an-organization endpoint (PATCH /orgs/{org}) does not accept a members_can_delete_repositories parameter; the field is read-only in the REST API. This setting can only be changed in the web UI.
    refs:
      - url: https://docs.github.com/en/organizations/managing-organization-settings/setting-permissions-for-deleting-or-transferring-repositories
        title: Setting permissions for deleting or transferring repositories
  # No Terraform variants: open-alert state is runtime telemetry from the GitHub secret
  # scanning API. The presence and resolution status of individual alerts are not Terraform
  # configuration — they exist as findings produced after code is scanned. The related
  # secret-scanning-new-repos org-settings check (which IS variant-covered) controls
  # whether the feature is enabled.
  - uid: mondoo-github-repository-security-no-open-secret-scanning-alerts
    filters: asset.platform == "github-repo"
    title: Ensure repository has no open secret scanning alerts
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: github.repository.secretScanningAlerts.none( state == "open" )
    docs:
      desc: |
        This check verifies that the repository has no secret scanning alerts still awaiting action.

        There is no console toggle behind this one. The artifact is the alert list itself, on the repository's Security and quality tab under Secret scanning, and the check passes only when nothing in that list is still open. An alert leaves the open state when somebody closes it, and GitHub asks for a reason: Revoked, False positive, Used in tests, or Won't fix. A repository with no alerts at all passes.

        **Why this matters**

        An open alert is not a warning that a secret might exist. It is GitHub reporting that it matched a recognized credential pattern in the repository's contents or history, and until somebody proves otherwise the credential should be assumed live and assumed known to everyone who can read the repository.

        Deleting the line does not help. The blob stays in the object store and stays reachable by commit SHA, so anyone with read access, every fork, and every CI cache that pulled the branch still has it. On a public repository the timeline is far shorter than any human response: harvesting bots watch the events feed and test leaked cloud keys within seconds of the push. A publishing token for npm or PyPI is worse, because it lets an attacker ship a backdoored release under the organization's own name into every build that installs the package.

        The honest limitation is in the state machine. This check reads the alert's state, not the credential's. Dismissing an alert as a false positive or as one you will not fix closes it and satisfies this check while the credential stays valid in the provider, so the only safe order is to rotate first and resolve second, and a spike in dismissals deserves the same scrutiny as a spike in alerts.
      audit: |
        ### Audit via Console

        1. Navigate to the repository on GitHub.
        2. Go to the **Security** tab > **Secret scanning alerts**.
        3. Filter by the "Open" state.

        If there are no open secret scanning alerts, the check passes. If one or more alerts remain open, the check fails.

        ### Audit via CLI

        1. List open secret scanning alerts:

           ```bash
           gh api '/repos/OWNER/REPO/secret-scanning/alerts?state=open' --jq 'length'
           ```

        If the command returns `0`, the check passes. If it returns a number greater than zero, the check fails.
      remediation:
        - id: github
          desc: |
            **Using the GitHub web UI**

            1. Navigate to your repository on GitHub.
            2. Go to **Security** > **Secret scanning alerts**.
            3. Review each open alert and take appropriate action:
               - **Revoke the secret**: Immediately revoke or rotate the exposed credential in the service where it is used.
               - **Remove from history**: If the secret is still in the repository, remove it and rewrite Git history if necessary.
               - **Close the alert**: After remediation, close the alert with the appropriate resolution (revoked, false positive, used in tests, etc.).
            4. Verify that the revoked credential is no longer valid by testing access.

            For more details, see [Managing alerts from secret scanning](https://docs.github.com/en/code-security/secret-scanning/managing-alerts-from-secret-scanning) in the GitHub documentation.
        - id: cli
          desc: |
            **Using GitHub CLI**

            List open secret scanning alerts to identify and remediate them:

            ```bash
            gh api /repos/OWNER/REPO/secret-scanning/alerts?state=open
            ```

            Resolve an alert after remediating the exposed secret:

            ```bash
            gh api --method PATCH /repos/OWNER/REPO/secret-scanning/alerts/ALERT_NUMBER \
              -f state=resolved -f resolution=revoked
            ```
    refs:
      - url: https://docs.github.com/en/code-security/secret-scanning/managing-alerts-from-secret-scanning
        title: Managing alerts from secret scanning
