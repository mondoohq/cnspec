      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-gitlab-security-group-prevent-forking-outside-gitlab
        tags:
          mondoo.com/filter-title: GitLab Group
          mondoo.com/filter-icon: gitlab
      - uid: mondoo-gitlab-security-group-prevent-forking-outside-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-gitlab-security-group-prevent-forking-outside-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-gitlab-security-group-prevent-forking-outside-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that projects in the group cannot be forked outside it.

        The setting is under Group settings, General, Permissions and group features, and it restricts forking to namespaces within the group. The check requires it to be enabled.

        **Why this matters**

        A fork is a full copy of the repository, including its history, placed in a namespace the group does not control. Once it exists outside the group, the group's own settings stop applying to it.

        That is the exposure. The original project can be private, require approvals, enforce push rules, and reject unsigned commits; the fork in a personal namespace inherits none of it and can be made public by its owner at any time. Every credential in the history moves with the copy.

        The offboarding case is the one that bites. A developer forks a project to a personal namespace, leaves the organization, and the fork remains in an account nobody administers, holding source code and history indefinitely.

        The forks are also invisible from the group. There is no listing of copies that left, so the organization cannot enumerate where its code now exists.

        Restricting forking to within the group keeps copies inside the boundary where policy applies and membership is managed. Where an external fork is genuinely needed, such as a contribution to an upstream open source project, handle it as a deliberate exception rather than leaving the general permission open.
      audit: |
        ### Audit via Console

        1. In GitLab, navigate to your group.
        2. Go to **Settings** > **General**.
        3. Expand the **Permissions and group features** section.
        4. Check the state of **Prevent project forking outside current group**.

        A passing group has **Prevent project forking outside current group** checked. A failing group has it unchecked.

        ### Audit via CLI

        Query the forking restriction with the `glab` CLI:

        ```bash
        glab api groups/GROUP_ID | jq '.prevent_forking_outside_group'
        ```

        A passing group returns `true`. A failing group returns `false`.
      remediation:
        - id: gitlab
          desc: |
            To prevent forking projects outside the group using the GitLab web UI:

            1. Navigate to your group in GitLab.
            2. Go to **Settings** > **General**.
            3. Expand the **Permissions and group features** section.
            4. Check **Prevent project forking outside current group**.
            5. Click **Save changes**.

            For more details, see [Prevent project forking outside group](https://docs.gitlab.com/user/group/access_and_permissions/#prevent-project-forking-outside-group).
        - id: cli
          desc: |
            To prevent forking projects outside the group using the `glab` CLI:

            ```bash
            glab api --method PUT groups/GROUP_ID \
              -f prevent_forking_outside_group=true
            ```

            For more details, see the [Groups API](https://docs.gitlab.com/api/groups.html#update-group).
        - id: terraform
          desc: |
            To prevent forking projects outside the group using Terraform:

            ```hcl
            resource "gitlab_group" "example" {
              name                          = "example"
              path                          = "example"
              prevent_forking_outside_group = true
            }
            ```

            For more details, see the Terraform [GitLab Provider](https://registry.terraform.io/providers/gitlabhq/gitlab/latest/docs/resources/group).
    refs:
      - url: https://docs.gitlab.com/user/group/
        title: GitLab Group Settings
      - url: https://docs.gitlab.com/administration/settings/visibility_and_access_controls.html
        title: GitLab Visibility and Access Controls
