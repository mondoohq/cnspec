  - uid: mondoo-gitlab-security-secret-push-protection
    title: Ensure secret push protection is enabled
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-17
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-12
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-5
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-6-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: asset.platform == "gitlab-project" && gitlab.namespace.plan == "ultimate"
    mql: |
      gitlab.project.preReceiveSecretDetectionEnabled == true
    docs:
      desc: |
        This check verifies that secret push protection is enabled for the project.

        Secret push protection scans the content of pushed commits and rejects the push when it detects a credential, rather than matching on filenames. It is enabled under Project settings, Security and compliance. The check requires it to be on.

        **Why this matters**

        This is the content-aware counterpart to the push rule that blocks secret-looking filenames, and it catches the case that rule cannot: a token pasted into a source file, a configuration value, a test fixture, or a comment.

        That is the common way secrets actually enter a repository. Very few are committed as a `.pem` file; most are assigned to a variable during local debugging and pushed without the author noticing the line survived.

        Blocking at push is the only point where prevention is still possible. Once the commit lands, the credential is in the history, and every subsequent remedy is a response rather than a prevention: rotate the credential, rewrite the history, and hope nothing cloned it first.

        Detection also stops being timely after the fact. Scanners that run on the repository find the secret after it is already there, on their own schedule, which is measured against an attacker's automation that finds it faster.

        Enable both this and the filename push rule, since they cover different mistakes. Treat any credential that reaches the history as compromised and rotate it, because deletion does not undo distribution.
      audit: |
        ### Audit via Console

        1. In GitLab, navigate to your project.
        2. Go to **Secure** > **Security configuration**.
        3. Check the state of the **Secret push protection** toggle.

        A passing project has **Secret push protection** enabled. A failing project has it disabled.

        ### Audit via CLI

        Query the security settings with the `glab` CLI:

        ```bash
        glab api projects/PROJECT_ID/security_settings | jq '.secret_push_protection_enabled'
        ```

        A passing project returns `true`. A failing project returns `false`. On GitLab instances older than 17.11 the field is named `pre_receive_secret_detection_enabled`.
      remediation:
        - id: gitlab
          desc: |
            Secret push protection requires a GitLab Ultimate subscription.

            To enable secret push protection using the GitLab web UI:

            1. Navigate to your project in GitLab.
            2. Go to **Secure** > **Security configuration**.
            3. Under **Secret push protection**, turn on the toggle.

            For more details, see [Secret push protection](https://docs.gitlab.com/user/application_security/secret_detection/secret_push_protection/).
        - id: cli
          desc: |
            Secret push protection requires a GitLab Ultimate subscription.

            To enable secret push protection using the `glab` CLI:

            ```bash
            glab api --method PUT projects/PROJECT_ID/security_settings \
              -f secret_push_protection_enabled=true
            ```

            GitLab renamed this attribute from `pre_receive_secret_detection_enabled` in 17.11. Use the old name on instances older than that.

            For more details, see the [Project security settings API](https://docs.gitlab.com/api/project_security_settings.html).
        - id: terraform
          desc: |
            Secret push protection requires a GitLab Ultimate subscription.

            To enable secret push protection using Terraform:

            ```hcl
            resource "gitlab_project" "example" {
              name                                 = "example"
              pre_receive_secret_detection_enabled = true
            }
            ```

            For more details, see the Terraform [GitLab Provider](https://registry.terraform.io/providers/gitlabhq/gitlab/latest/docs/resources/project).
