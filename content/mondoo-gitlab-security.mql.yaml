      - uid: mondoo-gitlab-security-no-author-approval-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the author of a merge request cannot approve it.

        The setting is under Project settings, Merge requests, Merge request approvals, as the option preventing authors from approving their own merge requests. The check requires it to be enabled. The Terraform version reads `merge_requests_author_approval` on a `gitlab_project_approval_rule` configuration and requires it to be false.

        **Why this matters**

        An approval requirement that the author can satisfy themselves is not a review requirement. It is a checkbox the author ticks, and it produces an audit trail showing the change was approved.

        That is worse than having no requirement at all, because the record says a review happened. Anyone auditing the repository, or answering a compliance question about separation of duties, sees an approved merge request and has no way to tell that approver and author were the same person without inspecting each one.

        For an attacker holding a developer credential, self-approval collapses the entire control. They open the merge request, approve it, and merge, satisfying the process end to end from one account.

        Enabling this is what makes the approval requirement mean a second person. Pair it with the companion check preventing committers from approving, since an attacker who cannot approve as the author can otherwise contribute a commit and approve as someone else's merge request.
      audit: |
        ### Audit via Console

        1. In GitLab, navigate to your project.
        2. Go to **Settings** > **Merge requests**.
        3. Under **Merge request approvals**, scroll to **Approval settings**.
        4. Check the state of **Prevent approval by merge request creator (author)**.

        A passing project has **Prevent approval by merge request creator (author)** checked. A failing project has it unchecked.

        ### Audit via CLI

        Query the approval settings with the `glab` CLI:

        ```bash
        glab api projects/PROJECT_ID/approvals | jq '.merge_requests_author_approval'
        ```

        A passing project returns `false`. A failing project returns `true`.
      remediation:
        - id: gitlab
          desc: |
            Merge request approval settings require a GitLab Premium or Ultimate subscription. On the Free tier the **Approval settings** section is not available, so this control cannot be configured there.

            To prevent merge request authors from approving their own requests using the GitLab web UI:

            1. Navigate to your project.
            2. Go to **Settings** > **Merge requests**.
            3. Under **Merge request approvals**, scroll to **Approval settings**.
            4. Check **Prevent approval by merge request creator (author)**.
            5. Click **Save changes**.

            For more details, see [Merge request approval settings](https://docs.gitlab.com/user/project/merge_requests/approvals/settings.html).
        - id: cli
          desc: |
            Merge request approval settings require a GitLab Premium or Ultimate subscription. The command below has no effect on the Free tier, where this control is unavailable.

            To prevent merge request authors from approving their own requests using the `glab` CLI:

            ```bash
            glab api --method POST projects/PROJECT_ID/approvals \
              -f merge_requests_author_approval=false
            ```

            For more details, see the [Merge request approvals API](https://docs.gitlab.com/api/merge_request_approvals.html#change-configuration).
        - id: terraform
          desc: |
            To prevent merge request authors from approving their own requests using Terraform:

            ```hcl
            resource "gitlab_project_level_mr_approvals" "example" {
              project                        = gitlab_project.example.id
              merge_requests_author_approval = false
            }
            ```

            For more details, see the Terraform [GitLab Provider](https://registry.terraform.io/providers/gitlabhq/gitlab/latest/docs/resources/project_level_mr_approvals).
    refs:
      - url: https://docs.gitlab.com/user/project/merge_requests/approvals/
        title: GitLab Merge Request Approvals
      - url: https://docs.gitlab.com/user/project/settings/
        title: GitLab Project Settings
