          mondoo.com/filter-icon: terraform
      - uid: mondoo-gitlab-security-reset-approvals-on-push-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that existing approvals are removed when new commits are pushed to a merge request.

        The setting is under Project settings, Merge requests, Merge request approvals, and clears approvals whenever the branch changes. The check requires it to be enabled.

        **Why this matters**

        Without this, an approval applies to a merge request rather than to the code in it. The reviewer approves what they read, and any commit pushed afterward inherits that approval without anyone looking at it.

        That is a direct route to shipping unreviewed code, and it does not require malice to happen. A developer addresses review comments after approval, pushes the fix, and merges, so the change that actually shipped is not the change that was read.

        It is also the cleanest way to abuse a review process deliberately. Open a merge request with an innocuous change, obtain approval, then push the real payload and merge. The audit trail shows an approved merge request, the approver remembers approving something reasonable, and nothing in the record distinguishes the two states.

        The cost is that reviewers re-approve after every change, including trivial ones, which is the friction that gets this setting turned off. Keep it on and reduce the friction by encouraging smaller merge requests rather than by allowing approvals to outlive the code they covered.
      audit: |
        ### Audit via Console

        1. In GitLab, navigate to your project.
        2. Go to **Settings** > **Merge requests**.
        3. Under **Merge request approvals**, scroll to **Approval settings**.
        4. Check the state of **Remove all approvals**.

        A passing project has **Remove all approvals** checked. A failing project has it unchecked.

        ### Audit via CLI

        Query the approval settings with the `glab` CLI:

        ```bash
        glab api projects/PROJECT_ID/approvals | jq '.reset_approvals_on_push'
        ```

        A passing project returns `true`. A failing project returns `false`.
      remediation:
        - id: gitlab
          desc: |
            Merge request approval settings require a GitLab Premium or Ultimate subscription. On the Free tier the **Approval settings** section is not available, so this control cannot be configured there.

            To reset merge request approvals when new commits are pushed using the GitLab web UI:

            1. Navigate to your project.
            2. Go to **Settings** > **Merge requests**.
            3. Under **Merge request approvals**, scroll to **Approval settings**.
            4. Check **Remove all approvals**.
            5. Click **Save changes**.

            For more details, see [Merge request approval settings](https://docs.gitlab.com/user/project/merge_requests/approvals/settings.html#remove-all-approvals-when-commits-are-added-to-the-source-branch).
        - id: cli
          desc: |
            Merge request approval settings require a GitLab Premium or Ultimate subscription. The command below has no effect on the Free tier, where this control is unavailable.

            To reset merge request approvals when new commits are pushed using the `glab` CLI:

            ```bash
            glab api --method POST projects/PROJECT_ID/approvals \
              -f reset_approvals_on_push=true
            ```

            For more details, see the [Merge request approvals API](https://docs.gitlab.com/api/merge_request_approvals.html#change-configuration).
        - id: terraform
          desc: |
            To reset merge request approvals when new commits are pushed using Terraform:

            ```hcl
            resource "gitlab_project_level_mr_approvals" "example" {
              project                 = gitlab_project.example.id
              reset_approvals_on_push = true
            }
            ```

            For more details, see the Terraform [GitLab Provider](https://registry.terraform.io/providers/gitlabhq/gitlab/latest/docs/resources/project_level_mr_approvals).
