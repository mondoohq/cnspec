        tags:
          mondoo.com/filter-title: GitLab Project
          mondoo.com/filter-icon: gitlab
      - uid: mondoo-gitlab-security-pipeline-must-succeed-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-gitlab-security-pipeline-must-succeed-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-gitlab-security-pipeline-must-succeed-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a merge request cannot be merged unless its pipeline succeeds.

        The setting is under Project settings, Merge requests, Merge checks, as the requirement that pipelines must succeed. The check requires it to be enabled.

        **Why this matters**

        The pipeline is usually where the automated security controls actually run: dependency scanning, secret detection, static analysis, and the test suite. If a failing pipeline does not block the merge, every one of those becomes advisory.

        That is the practical failure. The scanner finds a vulnerable dependency, the job fails, and the merge proceeds anyway because nothing enforces the result. The control ran, produced the correct answer, and had no effect, which is harder to notice than a control that was never configured.

        The pressure to merge past a failure is real and routine. A release is waiting, the failure looks unrelated, and merging is one click. Making the check blocking removes the judgment call at the moment when the person making it is least inclined to investigate.

        Note what this does not cover. A skipped pipeline is not a failed one, so pair this with the companion check that blocks merges on skipped pipelines, otherwise an attacker who can cause the pipeline not to run at all bypasses the requirement without ever failing it.
      audit: |
        ### Audit via Console

        1. In GitLab, navigate to your project.
        2. Go to **Settings** > **Merge requests**.
        3. Under **Merge checks**, check the state of **Pipelines must succeed**.

        A passing project has **Pipelines must succeed** checked. A failing project has it unchecked.

        ### Audit via CLI

        Query the merge-check setting with the `glab` CLI:

        ```bash
        glab api projects/PROJECT_ID | jq '.only_allow_merge_if_pipeline_succeeds'
        ```

        A passing project returns `true`. A failing project returns `false`.
      remediation:
        - id: gitlab
          desc: |
            To require a successful pipeline before merging using the GitLab web UI:

            1. Navigate to your project.
            2. Go to **Settings** > **Merge requests**.
            3. Under **Merge checks**, check **Pipelines must succeed**.
            4. Click **Save changes**.

            For more details, see [Require a successful pipeline for merge](https://docs.gitlab.com/user/project/merge_requests/auto_merge/#require-a-successful-pipeline-for-merge).
        - id: cli
          desc: |
            To require a successful pipeline before merging using the `glab` CLI:

            ```bash
            glab api --method PUT projects/PROJECT_ID \
              -f only_allow_merge_if_pipeline_succeeds=true
            ```

            For more details, see the [Projects API](https://docs.gitlab.com/api/projects.html#edit-project).
        - id: terraform
          desc: |
            To require a successful pipeline before merging using Terraform:

            ```hcl
            resource "gitlab_project" "example" {
              name                                  = "example"
              only_allow_merge_if_pipeline_succeeds = true
            }
            ```

            For more details, see the Terraform [GitLab Provider](https://registry.terraform.io/providers/gitlabhq/gitlab/latest/docs/resources/project).
    refs:
      - url: https://docs.gitlab.com/user/application_security/
        title: GitLab Application Security
      - url: https://docs.gitlab.com/user/project/settings/
        title: GitLab Project Settings
