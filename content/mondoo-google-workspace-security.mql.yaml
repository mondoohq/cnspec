  - uid: mondoo-googleworkspace-security-admins-no-pending-password-reset
    title: Ensure no admin accounts have a pending forced password change
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-9
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-5
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: googleworkspace.users.where(isAdmin == true).none(changePasswordAtNextLogin == true)
    docs:
      desc: |
        This check verifies that no administrator account is sitting on a password change that was demanded and never completed.

        When an administrator forces a reset on an account, Google flags it to change its password at next sign-in and leaves the current password working until that sign-in happens. The Admin console does not display the pending state, so it is read through the Admin SDK Directory API. This check requires no account holding an admin role to carry the flag.

        **Why this matters**

        The flag is usually set for a reason, and the most common reason is a suspicion that the current password is known to somebody else. Until the account signs in, that suspect password is still valid. An attacker who already has it does not care that a change is pending; they authenticate with the old credential, and if they get there before the legitimate administrator does, they complete the change themselves and set a password only they know. The forced reset then becomes the mechanism by which the real owner loses the account.

        A flag that stays pending for weeks says something else as well: nobody is signing in to that account. An administrator account that goes unused for that long is one that no one is watching, which is the profile of an account that was created for a project, granted a role, and never retired.

        There is also an availability edge. An account in this state cannot be used cleanly for emergency response, which matters when the accounts that hold administrative roles are the ones the response depends on.

        Have each affected administrator complete the change immediately, remove the role or suspend the account if it is no longer needed, and look into why the reset was triggered by reviewing the sign-in events under **Reporting > Audit and investigation** for signs the account was already compromised.
      audit: |
        ### Audit via Admin Console

        1. Sign in to the Google Admin console at admin.google.com using an administrator account.
        2. Go to **Directory** > **Users** and filter for users with admin roles.
        3. Open each admin account and check whether a password change is pending at next sign-in.

        A passing result shows no admin with a pending forced password change; a failing result shows an admin account flagged to change its password at next login.

        ### Audit via API

        Query the Google Admin SDK Directory API and inspect the result:

        ```bash
        curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
          "https://admin.googleapis.com/admin/directory/v1/users?customer=my_customer"
        ```

        A passing response shows every user with `isAdmin` set to `true` reporting `changePasswordAtNextLogin` set to `false`; a failing response shows an admin user with `changePasswordAtNextLogin` set to `true`.
      remediation:
        - id: console
          desc: |
            To resolve pending admin password resets:

            1. Identify admin accounts with a pending forced password change. The Admin console does not display this state, so query the Directory API:

               ```bash
               curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
                 "https://admin.googleapis.com/admin/directory/v1/users?customer=my_customer&query=isAdmin=true" \
                 | jq -r '.users[] | select(.changePasswordAtNextLogin == true) | .primaryEmail'
               ```

            2. Contact each affected admin and require them to sign in and complete the password change immediately.
            3. If the admin account is inactive or no longer needed, remove its admin privileges or suspend it in the [Google Admin console](https://admin.google.com/) under **Directory** > **Users**.
            4. Review why the password reset was triggered and investigate signs of compromise, such as suspicious sign-in events under **Reporting** > **Audit and investigation**.

            For more details, see [Reset a user's password](https://support.google.com/a/answer/33319).
    refs:
      - url: https://support.google.com/a/answer/33319
        title: Google Workspace - Reset a User's Password
      - url: https://support.google.com/a/answer/9011373
        title: Google Workspace Security Best Practices
