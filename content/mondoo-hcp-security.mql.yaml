policies:
  - uid: mondoo-hcp-security
    name: Mondoo HashiCorp Cloud Platform Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: hcp-organization
    require:
      - provider: hcp
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden HashiCorp Cloud Platform cluster network exposure and audit-log export
    docs:
      desc: |
        The Mondoo HashiCorp Cloud Platform Security policy connects to an HCP organization and reads the live control-plane state of its managed Vault clusters. Because it evaluates what the HCP control plane reports for each cluster rather than a file on disk, the checks reflect the exposure the platform is actually serving.

        This policy focuses on how HCP Vault clusters are reachable and observed. It flags clusters that expose an unrestricted public endpoint, which is acceptable only when an IP allowlist restricts who can reach it, and it verifies that clusters stream audit logs to an external destination so an authentication and secret-access trail is preserved off the cluster for detection and investigation.

        Learn more about scanning with cnspec in the [cnspec documentation](https://mondoo.com/docs/cnspec).
    groups:
      - title: Network Exposure
        checks:
          - uid: mondoo-hcp-security-vault-no-public-endpoint
      - title: Logging & Monitoring
        checks:
          - uid: mondoo-hcp-security-vault-audit-log-export
    scoring_system: highest impact
queries:
  - uid: mondoo-hcp-security-vault-no-public-endpoint
    title: Ensure HCP Vault clusters are not exposed without an IP allowlist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-hcp-security-vault-no-public-endpoint-hcp-organization
        tags:
          mondoo.com/filter-title: HashiCorp Cloud Platform Organization
          mondoo.com/filter-icon: hcp
      - uid: mondoo-hcp-security-vault-no-public-endpoint-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hcp-security-vault-no-public-endpoint-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hcp-security-vault-no-public-endpoint-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that an HCP Vault cluster is not reachable from the whole internet.

        A cluster satisfies this in either of two ways. Its public endpoint can be off, leaving the cluster reachable only across the HashiCorp Virtual Network peered with your own infrastructure. Or the public endpoint can stay on while an IP allowlist names the CIDR ranges permitted to reach it. Both are edited in the HCP portal by opening Vault, selecting the cluster, and opening its networking configuration, and both appear on the `hcp_vault_cluster` Terraform resource as `public_endpoint` and an `ip_allowlist` block taking an `address` and a `description`. A cluster with a public endpoint and no allowlist fails.

        **Why this matters**

        Vault holds the credentials for everything else, which makes an internet-facing Vault API a single address worth an attacker's sustained attention. The endpoint answers on a predictable hostname and returns a recognizable response, so it is found by scanning rather than by anyone disclosing where it is.

        What follows is quiet and unlimited. An attacker works leaked tokens against the login endpoints for as long as they like, at whatever rate they choose, from anywhere. A token that turned up in a CI log, in an environment file committed to a repository, or in a developer's shell history is tried against the open endpoint the moment it is found, from an address that has no relationship to your infrastructure. Once one authenticates, the holder reads secrets and, depending on the policy attached to that token, mints fresh credentials for the databases and cloud accounts Vault brokers, which are then usable long after the original token is revoked.

        An allowlist takes all of that away from anyone outside your ranges. The leaked token is still leaked, but it cannot be presented from where the attacker is standing.

        An allowlist is not a replacement for Vault's own controls, since a compromised host inside an allowlisted range reaches the cluster as normally as any other client. Keep token lifetimes short and policies narrow, and pair this with the companion check in this policy that streams audit logs off the cluster, so that use of the endpoint leaves a record you still hold afterwards.
      audit: |-
        ### Audit via the HCP portal

        1. Sign in to the HashiCorp Cloud Platform portal and open **Vault**.
        2. Select each cluster and open its **Networking** (public access) configuration.
        3. Note whether the public endpoint is enabled and whether an IP allowlist (CIDR allowlist) is configured.

        If every cluster either has its public endpoint disabled or has a non-empty IP allowlist, the check passes. If any cluster exposes a public endpoint with no allowlist, the check fails.

        ### Audit via the HCP API

        1. List the Vault clusters in a project and read each cluster's public endpoint and allowlist:

           ```bash
           curl -s \
             --header "Authorization: Bearer $HCP_API_TOKEN" \
             "https://api.cloud.hashicorp.com/vault/2020-11-25/organizations/$HCP_ORG_ID/projects/$HCP_PROJECT_ID/clusters" \
             | jq '.clusters[] | {id: .id, public_endpoint: .config.network_config.public_ipv4_enabled, allowlist: .config.network_config.ip_allowlist}'
           ```

        If no cluster reports a public endpoint without an accompanying IP allowlist, the check passes. If any cluster does, the check fails.
      remediation:
        - id: console
          desc: |-
            To restrict Vault cluster exposure in the HCP portal:

            1. Open **Vault** and select the affected cluster.
            2. Open the cluster's **Networking** configuration.
            3. Either disable the public endpoint, or add an IP allowlist that limits access to your known operator and application CIDR ranges.
        - id: terraform
          desc: |-
            To restrict Vault cluster exposure with the `hashicorp/hcp` Terraform provider, disable the public endpoint or set a restrictive IP allowlist on the `hcp_vault_cluster` resource:

            ```hcl
            resource "hcp_vault_cluster" "example" {
              cluster_id = "example-vault-cluster"
              hvn_id     = hcp_hvn.example.hvn_id

              # keep the cluster off the public internet
              public_endpoint = false

              # or, if a public endpoint is required, restrict who can reach it
              ip_allowlist {
                address     = "203.0.113.0/24"
                description = "corporate egress"
              }
            }
            ```
    refs:
      - url: https://developer.hashicorp.com/hcp/docs/vault
        title: HCP Vault
      - url: https://developer.hashicorp.com/hcp/api-docs/vault
        title: HCP Vault API reference
  - uid: mondoo-hcp-security-vault-no-public-endpoint-hcp-organization
    filters: asset.platform == "hcp-organization"
    mql: |
      hcp.projects.all(vaultClusters.all(publicEndpoint == false || ipAllowlist != empty))
  # public_endpoint defaults to false, so an absent argument leaves the cluster private and passes.
  # ip_allowlist is a block rather than an argument, so a cluster with no allowlist has an empty
  # blocks list, not a null one, and the disjunction resolves without a null guard.
  - uid: mondoo-hcp-security-vault-no-public-endpoint-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcp_vault_cluster")
    mql: |
      terraform.resources("hcp_vault_cluster").all(arguments["public_endpoint"] != true || blocks.where(type == "ip_allowlist") != empty)
  - uid: mondoo-hcp-security-vault-no-public-endpoint-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcp_vault_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcp_vault_cluster").all(change.after["public_endpoint"] != true || change.after["ip_allowlist"] != empty)
  - uid: mondoo-hcp-security-vault-no-public-endpoint-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcp_vault_cluster")
    mql: |
      terraform.state.resources.where(type == "hcp_vault_cluster").all(values["public_endpoint"] != true || values["ip_allowlist"] != empty)
  - uid: mondoo-hcp-security-vault-audit-log-export
    title: Ensure HCP Vault clusters export audit logs
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    variants:
      - uid: mondoo-hcp-security-vault-audit-log-export-hcp-organization
        tags:
          mondoo.com/filter-title: HashiCorp Cloud Platform Organization
          mondoo.com/filter-icon: hcp
      - uid: mondoo-hcp-security-vault-audit-log-export-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hcp-security-vault-audit-log-export-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hcp-security-vault-audit-log-export-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that an HCP Vault cluster streams its audit log to a destination outside the cluster.

        Streaming is configured in the HCP portal by opening Vault, selecting the cluster, and opening its audit log configuration, and on the `hcp_vault_cluster` Terraform resource as an `audit_log_config` block. That block names one destination through its own set of arguments, so a CloudWatch destination is given as a region, a group name, a stream name, and credentials, while Datadog, Elasticsearch, Grafana, New Relic, Splunk, and a generic HTTP endpoint each take a different set. This check requires some destination to be configured.

        **Why this matters**

        The Vault audit log is the only record of which token read which secret at what time, which makes it the record an attacker most wants gone. Someone who reaches the cluster with enough privilege can disable an audit device or stop the export, and from that moment their reads leave nothing behind. Streaming continuously into a different trust boundary means the entries written before that point are already elsewhere and beyond reach, so the attempt to cover the tracks shows up as a gap in a record you still hold rather than as an absence of evidence.

        The record also decides how large an incident turns out to be. When a token is found to have leaked, the audit log answers which paths it actually read, and that answer is the difference between rotating a handful of secrets and rotating every credential the token's policy allowed. With no exported log the safe assumption is the second, which for a Vault cluster means rotating the database and cloud credentials of everything downstream of it.

        Exported entries are what detection runs on as well. A collector holding them can alert on a burst of failed logins, on a token reading paths it has never touched before, and on secret access outside working hours, none of which is visible from inside the cluster alone.

        Send the stream somewhere the Vault operators do not administer, because a destination reached with the same credentials and controlled by the same people as the cluster inherits the cluster's compromise along with its logs.
      audit: |-
        ### Audit via the HCP portal

        1. Sign in to the HashiCorp Cloud Platform portal and open **Vault**.
        2. Select each cluster and open its **Audit logs** (streaming) configuration.
        3. Confirm that a streaming destination is configured and enabled.

        If every cluster has audit-log streaming configured to a destination, the check passes. If any cluster has no audit-log export, the check fails.

        ### Audit via the HCP API

        1. List the Vault clusters and inspect each cluster's audit-log streaming configuration:

           ```bash
           curl -s \
             --header "Authorization: Bearer $HCP_API_TOKEN" \
             "https://api.cloud.hashicorp.com/vault/2020-11-25/organizations/$HCP_ORG_ID/projects/$HCP_PROJECT_ID/clusters" \
             | jq '.clusters[] | {id: .id, audit_log_export: .config.audit_log_export_config}'
           ```

        If every cluster reports an audit-log streaming destination, the check passes. If any cluster reports none, the check fails.
      remediation:
        - id: console
          desc: |-
            To export Vault audit logs in the HCP portal:

            1. Open **Vault** and select the affected cluster.
            2. Open the cluster's **Audit logs** configuration.
            3. Configure audit-log streaming to a supported destination (for example a cloud logging or object-storage service) and enable it.
        - id: terraform
          desc: |-
            To export Vault audit logs with the `hashicorp/hcp` Terraform provider, add an `audit_log_config` block to the `hcp_vault_cluster` resource naming the destination to stream to:

            ```hcl
            resource "hcp_vault_cluster" "example" {
              cluster_id = "example-vault-cluster"
              hvn_id     = hcp_hvn.example.hvn_id

              audit_log_config {
                cloudwatch_region            = "us-east-1"
                cloudwatch_group_name        = "hcp-vault-audit"
                cloudwatch_stream_name       = "example-vault-cluster"
                cloudwatch_access_key_id     = var.cloudwatch_access_key_id
                cloudwatch_secret_access_key = var.cloudwatch_secret_access_key
              }
            }
            ```

            The block also accepts Datadog, Elasticsearch, Grafana, New Relic, Splunk, and generic HTTP destinations through their own argument sets; configure whichever destination the organization already collects logs in.
    refs:
      - url: https://developer.hashicorp.com/hcp/docs/vault/audit-logs
        title: HCP Vault audit logs
      - url: https://developer.hashicorp.com/hcp/api-docs/vault
        title: HCP Vault API reference
  - uid: mondoo-hcp-security-vault-audit-log-export-hcp-organization
    filters: asset.platform == "hcp-organization"
    mql: |
      hcp.projects.all(vaultClusters.all(auditLogExport != empty))
  # audit_log_config is a block, so a cluster that configures no export has an empty blocks list and
  # fails. That is the correct verdict: streaming is off until the block names a destination.
  - uid: mondoo-hcp-security-vault-audit-log-export-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcp_vault_cluster")
    mql: |
      terraform.resources("hcp_vault_cluster").all(blocks.where(type == "audit_log_config") != empty)
  - uid: mondoo-hcp-security-vault-audit-log-export-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcp_vault_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcp_vault_cluster").all(change.after["audit_log_config"] != empty)
  - uid: mondoo-hcp-security-vault-audit-log-export-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcp_vault_cluster")
    mql: |
      terraform.state.resources.where(type == "hcp_vault_cluster").all(values["audit_log_config"] != empty)
