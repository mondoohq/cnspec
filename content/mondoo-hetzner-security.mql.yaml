      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-hetzner-security-firewall-has-rules-hetzner
        tags:
          mondoo.com/filter-title: Hetzner Cloud
          mondoo.com/filter-icon: hetzner
      - uid: mondoo-hetzner-security-firewall-has-rules-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-firewall-has-rules-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-firewall-has-rules-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Hetzner Cloud Firewall defines at least one rule.

        A Hetzner firewall evaluates inbound traffic against its rule set and drops anything not explicitly allowed, while outbound traffic is permitted unless an outbound rule restricts it. A firewall with no rules is therefore almost always an unfinished or mistakenly emptied configuration rather than an intentional control. You populate it on the **Rules** tab of the firewall in the Hetzner Cloud Console, or with `hcloud firewall add-rule`.

        **Why this matters**

        An applied but empty firewall creates a false sense of protection. In the console the attached servers appear to be governed by a rule set, when in fact no inbound service has been deliberately allowed and no egress is constrained at all.

        An empty firewall is also a configuration drift signal. One created during provisioning and never populated indicates an incomplete change, and surfacing it prompts an operator to either finish the configuration or delete the unused artifact so it stops implying coverage that does not exist.

        Because Hetzner allows all outbound traffic by default, the empty firewall does nothing to constrain data leaving the server either. The opportunity to limit exfiltration paths through egress rules is simply unused.

        Requiring at least one rule forces a deliberate decision about which inbound ports are allowed and, where appropriate, which egress destinations are permitted. A populated rule set that admits only required ports, paired with outbound rules where egress control is needed, keeps the firewall doing meaningful work rather than acting as a placeholder.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Firewalls** and open each firewall.
        3. Review the **Rules** tab.

        A passing firewall lists at least one inbound or outbound rule. A failing firewall shows an empty rule set.

        ### Audit via CLI

        1. List all firewalls and inspect their rules:

        ```bash
        hcloud firewall list -o columns=id,name
        hcloud firewall describe <firewall> -o json
        ```

        A passing firewall returns a non-empty `rules` array. A failing firewall returns an empty `rules` array (`[]`).
      remediation:
        - id: console
          desc: |
            1. Navigate to **Firewalls** and open the affected firewall.
            2. On the **Rules** tab, add the inbound rules required by the workload (scoped to trusted source CIDRs) and any outbound rules needed to constrain egress.
            3. If the firewall is an unused artifact, delete it instead so it does not imply coverage that does not exist.
        - id: cli
          desc: |
            ```bash
            hcloud firewall add-rule <firewall> \
              --direction in --protocol tcp --port 443 --source-ips 0.0.0.0/0
            ```

            Add the specific rules the workload requires. Delete the firewall instead if it is not needed.
        - id: terraform
          desc: |
            Declare at least one `rule` block on every `hcloud_firewall`:

            ```hcl
            resource "hcloud_firewall" "default" {
              name = "default"

              rule {
                direction  = "in"
                protocol   = "tcp"
                port       = "443"
                source_ips = ["0.0.0.0/0", "::/0"]
              }
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/firewalls/overview/
        title: Hetzner Cloud Firewalls overview

  - uid: mondoo-hetzner-security-firewall-has-rules-hetzner
    filters: asset.platform == "hetzner-firewall"
    mql: |
      hetzner.firewall.rules != empty
  - uid: mondoo-hetzner-security-firewall-has-rules-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcloud_firewall")
    mql: |
      terraform.resources("hcloud_firewall").all(blocks.where(type == "rule") != empty)
  - uid: mondoo-hetzner-security-firewall-has-rules-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcloud_firewall")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcloud_firewall").all(
        change.after.rule != null && change.after.rule != []
      )
  - uid: mondoo-hetzner-security-firewall-has-rules-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcloud_firewall")
    mql: |
      terraform.state.resources.where(type == "hcloud_firewall").all(
        values.rule != null && values.rule != []
      )

  - uid: mondoo-hetzner-security-lb-http-redirected-to-https
    title: Ensure load balancers redirect HTTP traffic to HTTPS
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-hetzner-security-lb-http-redirected-to-https-hetzner
        tags:
          mondoo.com/filter-title: Hetzner Cloud
          mondoo.com/filter-icon: hetzner
      - uid: mondoo-hetzner-security-lb-http-redirected-to-https-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-lb-http-redirected-to-https-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-lb-http-redirected-to-https-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Hetzner Cloud load balancer redirects plaintext HTTP requests to HTTPS rather than serving a plain HTTP service.

        Hetzner implements the redirect as an option of the HTTPS service, not of the HTTP service. With it enabled, the load balancer answers port 80 itself with a 301 redirect to the HTTPS equivalent, so a separate plain HTTP service is no longer needed. You enable it under **Services** on the load balancer in the Hetzner Cloud Console by deleting the plain HTTP service on port 80 and turning on **Redirect HTTP to HTTPS** on the HTTPS service, or with `hcloud load-balancer update-service --http-redirect-http=true`. Without the redirect, clients that initiate HTTP connections get their responses over an unencrypted channel.

        **Why this matters**

        HTTP traffic is plaintext. Any credential, session cookie, or API token transmitted over it is readable by every host on the network path between the client and the load balancer, and nothing about the eventual HTTPS session retroactively protects what was already sent in the clear.

        A load balancer that silently serves HTTP responses also gives an attacker a window to intercept the connection and strip the TLS layer before the client upgrades, the technique known as SSL stripping. The client never sees an error, because a working HTTP service is exactly what it was offered.

        Cookie protections are undermined in the same window. Cookies without the `Secure` attribute can be sent over HTTP, and even cookies set over HTTPS can be intercepted if the client makes an initial plaintext request before any redirect happens.

        A 301 redirect ensures every subsequent request in the session uses TLS, closing the interception and downgrade window after the first request. Pair it with an HSTS header so clients remember to use HTTPS on their own and future plaintext requests never leave the client at all, which eliminates the initial window as well.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Load Balancers** and open each load balancer.
        3. Click the **Services** tab.
        4. Verify that no plain HTTP service is configured and that the HTTPS service has **Redirect HTTP to HTTPS** enabled.

        A passing load balancer has no plain HTTP service and shows **Redirect HTTP to HTTPS** toggled on for its HTTPS service. A failing load balancer has a plain HTTP service, or none of its HTTPS services has the redirect enabled.

        ### Audit via CLI

        1. List all load balancers and inspect their services:

        ```bash
        hcloud load-balancer list -o columns=id,name
        hcloud load-balancer describe <lb> -o json
        ```

        In the `services` array, verify that no entry has `protocol` set to `http`, and that on a load balancer with HTTPS services at least one of them has `http.redirect_http` set to `true`.

        A passing load balancer has no `http` service and returns `"redirect_http": true` on an HTTPS service. A failing load balancer has a service with `protocol` set to `http`, or HTTPS services that all return `"redirect_http": false`.
      remediation:
        - id: console
          desc: |
            Hetzner exposes the redirect as an option of the HTTPS service, not the HTTP service. When the redirect is enabled, the load balancer answers port 80 itself with a redirect to HTTPS, so a separate plain HTTP service is no longer needed.

            1. Navigate to **Load Balancers** and open the affected load balancer.
            2. Go to **Services** and delete the plain HTTP service listening on port 80.
            3. Edit the HTTPS service and enable **Redirect HTTP to HTTPS**. If no HTTPS service exists yet, create one on port 443 with a certificate and enable the redirect on it.

            Plain HTTP requests go unanswered for the short interval between deleting the HTTP service and enabling the redirect.
        - id: cli
          desc: |
            The redirect option belongs to the HTTPS service. Delete the plain HTTP service on port 80, then enable the redirect on the HTTPS service:

            ```bash
            hcloud load-balancer delete-service <lb> --listen-port 80
            hcloud load-balancer update-service <lb> \
              --listen-port 443 --http-redirect-http=true
            ```
        - id: terraform
          desc: |
            The `redirect_http` option is only supported on services with `protocol = "https"`. Remove any plain HTTP service on port 80 and enable the redirect on the HTTPS service instead:

            ```hcl
            resource "hcloud_load_balancer_service" "https" {
              load_balancer_id = hcloud_load_balancer.example.id
              protocol         = "https"
              listen_port      = 443
              destination_port = 80

              http {
                certificates  = [hcloud_managed_certificate.example.id]
                redirect_http = true
              }
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/load-balancers/overview/
        title: Hetzner Cloud Load Balancers overview

  - uid: mondoo-hetzner-security-lb-http-redirected-to-https-hetzner
    filters: asset.platform == "hetzner-loadbalancer"
    mql: |
      hetzner.loadBalancer.services.none(protocol == "http")
      hetzner.loadBalancer.services.where(protocol == "https").all(http["redirectHttp"] == true)
  - uid: mondoo-hetzner-security-lb-http-redirected-to-https-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcloud_load_balancer_service")
    mql: |
      terraform.resources("hcloud_load_balancer_service").all(arguments['protocol'] != "http")
      terraform.resources("hcloud_load_balancer_service").where(arguments['protocol'] == "https").all(
        blocks.where(type == "http").all(arguments['redirect_http'] == true)
      )
  - uid: mondoo-hetzner-security-lb-http-redirected-to-https-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcloud_load_balancer_service")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcloud_load_balancer_service").all(
        change.after.protocol != "http"
      )
      terraform.plan.resourceChanges.where(type == "hcloud_load_balancer_service" && change.after.protocol == "https").all(
        change.after.http.all(_['redirect_http'] == true)
      )
  - uid: mondoo-hetzner-security-lb-http-redirected-to-https-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcloud_load_balancer_service")
    mql: |
      terraform.state.resources.where(type == "hcloud_load_balancer_service").all(
        values.protocol != "http"
      )
      terraform.state.resources.where(type == "hcloud_load_balancer_service" && values.protocol == "https").all(
        values.http.all(_['redirect_http'] == true)
      )

  - uid: mondoo-hetzner-security-lb-https-service-has-certificate
    title: Ensure HTTPS load balancer services have a TLS certificate attached
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-hetzner-security-lb-https-service-has-certificate-hetzner
        tags:
          mondoo.com/filter-title: Hetzner Cloud
          mondoo.com/filter-icon: hetzner
      - uid: mondoo-hetzner-security-lb-https-service-has-certificate-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-lb-https-service-has-certificate-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-lb-https-service-has-certificate-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Hetzner Cloud load balancer service configured for HTTPS has at least one TLS certificate attached.

        An HTTPS listener with no certificate cannot complete a TLS handshake, so clients either receive certificate errors or fall back to unencrypted connections. You attach one under **Services** on the load balancer in the Hetzner Cloud Console by editing the HTTPS service and adding an existing certificate or creating a Hetzner-managed certificate for the domain, or with `hcloud load-balancer update-service --http-certificates`. The service is identified by its listen port, so the update must target the port the existing HTTPS service already listens on.

        **Why this matters**

        Without a certificate the load balancer cannot establish a valid TLS session at all. Clients receive certificate errors that degrade trust in the service and, worse, condition users to click through the very warnings that are supposed to stop a real attack.

        Some client configurations respond to a failed HTTPS handshake by falling back to HTTP. That silently removes encryption from the connection and exposes the traffic to interception without anyone seeing a failure, which is the fail-open outcome the listener was meant to prevent.

        Certificate-related TLS failures also tend to surface as hard-to-diagnose connectivity errors rather than clear messages. They disrupt users and dependent services, which makes a missing certificate an availability concern as much as a security one.

        Attaching a certificate lets the load balancer complete handshakes and deliver encrypted sessions to every client. Prefer Hetzner-managed certificates so renewal is handled automatically through Let's Encrypt and no one has to track expiry dates by hand.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Load Balancers** and open each load balancer.
        3. Click the **Services** tab.
        4. Find any service configured for HTTPS (port 443) and verify that at least one certificate is listed under **Certificates**.

        A passing load balancer shows at least one certificate attached to every HTTPS service. A failing load balancer shows an HTTPS service with no certificates attached.

        ### Audit via CLI

        1. List all load balancers and inspect their services:

        ```bash
        hcloud load-balancer list -o columns=id,name
        hcloud load-balancer describe <lb> -o json
        ```

        In the `services` array, find entries where `protocol` is `https` and check whether `http.certificates` is a non-empty array.

        A passing load balancer returns a non-empty `certificates` array for every HTTPS service. A failing load balancer returns an empty `certificates` array (`[]`) for an HTTPS service.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Load Balancers** and open the affected load balancer.
            2. Go to **Services** and edit the HTTPS service.
            3. Under **Certificates**, attach an existing certificate or create a Hetzner-managed certificate for the domain.
        - id: cli
          desc: |
            The check fails when an HTTPS service already exists but has no certificate attached. Use `update-service` to attach a certificate to that existing listener; `add-service` would attempt to create a second service on the same listen port and fail because the listener already exists.

            ```bash
            hcloud load-balancer update-service <lb> \
              --listen-port 443 \
              --http-certificates <certificate>
            ```

            The service is identified by its listen port, so `--listen-port` must match the existing HTTPS service. Use `add-service` only when no HTTPS service exists yet on that port.
        - id: terraform
          desc: |
            Attach at least one certificate to every HTTPS `hcloud_load_balancer_service` via `http.certificates`:

            ```hcl
            resource "hcloud_managed_certificate" "example" {
              name         = "example"
              domain_names = ["example.com"]
            }

            resource "hcloud_load_balancer_service" "https" {
              load_balancer_id = hcloud_load_balancer.example.id
              protocol         = "https"
              listen_port      = 443
              destination_port = 80

              http {
                certificates = [hcloud_managed_certificate.example.id]
              }
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/load-balancers/overview/
        title: Hetzner Cloud Load Balancers overview

  - uid: mondoo-hetzner-security-lb-https-service-has-certificate-hetzner
    filters: asset.platform == "hetzner-loadbalancer"
    mql: |
      hetzner.loadBalancer.services.where(protocol == "https").all(certificates != empty)
  - uid: mondoo-hetzner-security-lb-https-service-has-certificate-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcloud_load_balancer_service")
    mql: |
      terraform.resources("hcloud_load_balancer_service").all(
        arguments['protocol'] != "https" ||
        blocks.where(type == "http").any(arguments['certificates'] != null && arguments['certificates'] != [])
      )
  - uid: mondoo-hetzner-security-lb-https-service-has-certificate-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcloud_load_balancer_service")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcloud_load_balancer_service").all(
        change.after.protocol != "https" ||
        change.after.http.any(_['certificates'] != null && _['certificates'] != [])
      )
  - uid: mondoo-hetzner-security-lb-https-service-has-certificate-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcloud_load_balancer_service")
    mql: |
      terraform.state.resources.where(type == "hcloud_load_balancer_service").all(
        values.protocol != "https" ||
        values.http.any(_['certificates'] != null && _['certificates'] != [])
      )

  # No Terraform variants: a load balancer's private-network attachment is expressed
  # by a separate `hcloud_load_balancer_network` resource keyed by `load_balancer_id`,
  # not by an argument on `hcloud_load_balancer`. Asserting "every load balancer has an
  # attachment" requires correlating that separate resource back to each load balancer,
  # which is awkward to express reliably in MQL on Terraform sources. The runtime variant
  # reads the resolved private-network attachments directly. Terraform remediation is
  # still provided below because the fix is a self-contained resource.
  - uid: mondoo-hetzner-security-lb-in-private-network
    title: Ensure load balancers are attached to a private network
    impact: 70
    filters: asset.platform == "hetzner-loadbalancer"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      hetzner.loadBalancer.privateNet != empty
    docs:
      desc: |
        This check verifies that every Hetzner Cloud load balancer is attached to at least one private network.

        When a load balancer reaches its targets only over the public network, traffic between the load balancer and the backend servers crosses public-facing interfaces instead of staying on an isolated RFC-1918 network. You attach a network from the load balancer's **Networking** tab in the Hetzner Cloud Console with **Attach to Network**, enabling **Use private IP for targets** so forwarding actually takes the private path, or run `hcloud load-balancer attach-to-network`.

        **Why this matters**

        A load balancer on a private network forwards to its targets over private IPs, which keeps the hop from the load balancer to the backend entirely inside the project rather than out on public addresses where it can be observed.

        Without that attachment the backend servers have no choice but to expose the forwarded ports on their public interface, because that is the only address the load balancer can reach them on. The internet-facing surface of every backend widens as a direct consequence of the load balancer's own configuration.

        Shared private-network membership also lets firewall rules treat the load balancer and its backends as an internal trust zone, which is not expressible while the forwarding path is public. With the private path in place, backends can restrict the forwarded ports to the private network range instead of accepting them from the internet.

        Setting the attachment alone is not sufficient if targets are still addressed publicly, so enable private-IP targeting at the same time.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Load Balancers** and open each load balancer.
        3. Click the **Networking** tab and review the **Private Networks** section.

        A passing load balancer shows at least one private network attached. A failing load balancer shows an empty **Private Networks** section.

        ### Audit via CLI

        1. List all load balancers and inspect their private network attachments:

        ```bash
        hcloud load-balancer list -o columns=id,name
        hcloud load-balancer describe <lb> -o json | grep -A5 'private_net'
        ```

        A passing load balancer returns a non-empty `private_net` array. A failing load balancer returns an empty `private_net` array (`[]`).
      remediation:
        - id: console
          desc: |
            1. Navigate to **Networks** and create a network if one does not already exist.
            2. Open the affected load balancer and go to **Networking**.
            3. Click **Attach to Network** and select the target network. Enable **Use private IP for targets** so forwarding uses the private path.
        - id: cli
          desc: |
            ```bash
            hcloud load-balancer attach-to-network <lb> --network <network>
            ```
        - id: terraform
          desc: |
            Attach every `hcloud_load_balancer` to a network with an `hcloud_load_balancer_network` resource. `use_private_ip` lives on `hcloud_load_balancer_target`, so set it there as well and the load balancer forwards to its targets over the private path:

            ```hcl
            resource "hcloud_network" "main" {
              name     = "main"
              ip_range = "10.0.0.0/16"
            }

            resource "hcloud_network_subnet" "main" {
              network_id   = hcloud_network.main.id
              type         = "cloud"
              network_zone = "eu-central"
              ip_range     = "10.0.1.0/24"
            }

            resource "hcloud_load_balancer" "example" {
              name               = "example"
              load_balancer_type = "lb11"
              location           = "nbg1"
            }

            resource "hcloud_load_balancer_network" "example" {
              load_balancer_id = hcloud_load_balancer.example.id
              network_id       = hcloud_network.main.id
              depends_on       = [hcloud_network_subnet.main]
            }

            resource "hcloud_load_balancer_target" "example" {
              type             = "server"
              load_balancer_id = hcloud_load_balancer.example.id
              server_id        = hcloud_server.example.id
              use_private_ip   = true
              depends_on       = [hcloud_load_balancer_network.example]
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/load-balancers/overview/
        title: Hetzner Cloud Load Balancers overview

  # No Terraform variants: certificate expiration (`notValidAfter`) is runtime metadata derived from the certificate material, not a configurable field on `hcloud_managed_certificate` / `hcloud_uploaded_certificate`. The Terraform config carries no signal about the current expiry date.
  - uid: mondoo-hetzner-security-cert-not-expired
    title: Ensure TLS certificates are not expired
    impact: 100
    filters: asset.platform == "hetzner-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      hetzner.certificates.all(notValidAfter > time.now)
    docs:
      desc: |
        This check verifies that no TLS certificate managed in Hetzner Cloud has passed its expiration date.

        Each certificate carries a `notValidAfter` timestamp, and once that moment has passed standard TLS clients reject the certificate and the trust chain that encrypted connections depend on no longer holds. You replace it under **Certificates** in the Hetzner Cloud Console, repoint every HTTPS load balancer service that references the old certificate, and delete the expired one, or perform the same sequence with `hcloud certificate create`, `hcloud load-balancer update-service`, and `hcloud certificate delete`.

        **Why this matters**

        Once a certificate expires the handshake fails and the encrypted channel is no longer established as intended. Users see certificate warnings in place of the service, and the protection TLS was providing lapses at a moment nobody chose.

        Repeated certificate warnings also train users to click through security errors. That normalized bypass behavior persists long after the certificate is fixed, and it undermines the warning that would otherwise stop a genuine interception attempt.

        API clients and service-to-service integrations behave differently but no better. They typically fail closed on certificate errors rather than falling back, so an expired certificate becomes an availability incident on top of a security failure, with dependent systems breaking in ways that are slow to trace back to the certificate.

        Prefer Hetzner-managed certificates so renewal is delegated to Hetzner through Let's Encrypt and the manual tracking that leads to missed expirations disappears. Monitor expiry and trigger renewal well before the `notValidAfter` date so the interruption window never opens. If a managed certificate did expire, find out why renewal failed before re-creating it; a common cause is the domain's DNS no longer pointing at the load balancer.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Certificates**.
        3. Review the **Expires** column for each certificate.

        A passing certificate shows an expiry date in the future. A failing certificate shows an expiry date that has already passed.

        ### Audit via CLI

        1. List all certificates and check the expiry date for each:

        ```bash
        hcloud certificate list -o columns=id,name,not_valid_after
        ```

        A passing certificate shows a `not_valid_after` date that is later than today. A failing certificate shows a `not_valid_after` date that is in the past.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Certificates** and create a replacement. For managed certificates, create a new managed certificate for the affected domains; for uploaded certificates, upload the renewed certificate and key.
            2. Navigate to **Load Balancers** and update every HTTPS service that references the expired certificate to use the replacement.
            3. Delete the expired certificate so it no longer exists in the project.

            Managed certificates normally renew automatically through Let's Encrypt. If one expired, investigate why renewal failed before re-creating it; a common cause is the domain's DNS no longer pointing at the load balancer.
        - id: cli
          desc: |
            Create a replacement certificate, repoint every load balancer service that uses the expired certificate, then delete the expired certificate:

            ```bash
            hcloud certificate create \
              --type managed \
              --name <new-name> \
              --domain <domain>
            hcloud load-balancer update-service <lb> \
              --listen-port 443 --http-certificates <new-certificate>
            hcloud certificate delete <expired-certificate>
            ```
        - id: terraform
          desc: |
            Prefer `hcloud_managed_certificate` so Hetzner auto-renews via Let's Encrypt and certificates do not silently expire:

            ```hcl
            resource "hcloud_managed_certificate" "example" {
              name         = "example"
              domain_names = ["example.com", "*.example.com"]
            }
            ```

            For uploaded certificates, replace the certificate material before expiry:

            ```hcl
            resource "hcloud_uploaded_certificate" "example" {
              name        = "example"
              certificate = file("${path.module}/cert.pem")
              private_key = file("${path.module}/key.pem")
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/certificates/overview/
        title: Hetzner Cloud Certificates overview

  # No Terraform variants: the `blocked` flag is set by Hetzner's abuse team based on observed traffic; it is not a configurable field on `hcloud_floating_ip` and Terraform carries no signal about it.
  - uid: mondoo-hetzner-security-floating-ip-not-blocked
    title: Ensure floating IPs are not blocked by Hetzner abuse
    impact: 70
    filters: asset.platform == "hetzner-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      hetzner.floatingIps.all(blocked == false)
    docs:
      desc: |
        This check verifies that no floating IP in the Hetzner Cloud project is in a blocked state.

        Hetzner sets the `blocked` flag on a floating IP when its abuse team determines that the address is originating malicious traffic such as outbound attacks, spam, scanning, or malware distribution. The flag is visible on the floating IP in the Hetzner Cloud Console, and it is lifted by Hetzner support once the underlying issue is remediated, not by any setting you control.

        **Why this matters**

        A blocked floating IP is a strong indicator of compromise. It means the workload attached to the address is compromised, misconfigured in a way that emits abusive traffic, or being actively misused by a threat actor, and the block is Hetzner reporting that from outside your environment.

        While the block stands, the underlying workload may keep generating abusive traffic. That causes ongoing harm to external recipients and accrues further abuse history against the project, which affects how the next incident is handled.

        The block is also operationally disruptive. A blocked IP cannot deliver outbound traffic normally, so any service depending on it for egress or inbound reachability is degraded until the root cause is resolved.

        Treat a blocked IP as a confirmed incident rather than an inconvenience to be unblocked. Identify the attached server, review recent logs, outbound traffic, and authentication events, and if the workload is compromised rebuild it from a known-good image and rotate every credential it held so the attacker cannot regain access afterward. Contact Hetzner support to discuss the abuse case only once the underlying issue is remediated.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Floating IPs**.
        3. Review each floating IP for a blocked or suspended status indicator.

        A passing floating IP shows a normal active status with no blocked indicator. A failing floating IP shows a blocked status, typically surfaced by a warning or abuse notice from Hetzner.

        ### Audit via CLI

        1. List all floating IPs and inspect the `blocked` field for each:

        ```bash
        hcloud floating-ip list -o columns=id,name,ip,server
        hcloud floating-ip describe <floating-ip> -o json | grep '"blocked"'
        ```

        A passing floating IP returns `"blocked": false`. A failing floating IP returns `"blocked": true`.
      remediation:
        - id: console
          desc: |
            Investigate before unblocking.

            1. Identify the server the floating IP is attached to and review recent logs, outbound traffic, and authentication events for signs of compromise.
            2. If the workload is compromised, rebuild the server from a known-good image and rotate any credentials it held.
            3. Contact Hetzner support to discuss the abuse case and request unblocking once the underlying issue is remediated.
        # No CLI remediation: the `blocked` flag is set and cleared only by Hetzner's abuse team; neither the hcloud CLI nor the API can modify it.
        # No Terraform remediation: the `blocked` flag is set by Hetzner's abuse team based on observed traffic; it is not a configurable field on `hcloud_floating_ip`. The fix is investigation and remediation of the underlying workload, then a support request.
    refs:
      - url: https://docs.hetzner.com/cloud/floating-ips/overview/
        title: Hetzner Cloud Floating IPs overview

