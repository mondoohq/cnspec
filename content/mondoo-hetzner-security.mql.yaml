  - uid: mondoo-hetzner-security-firewall-no-unrestricted-db-ports
    title: Ensure no firewall allows unrestricted inbound on common database ports
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-db-ports-hetzner
        tags:
          mondoo.com/filter-title: Hetzner Cloud
          mondoo.com/filter-icon: hetzner
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-db-ports-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-db-ports-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-db-ports-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Hetzner Cloud Firewall allows inbound traffic from the public internet to a common database port.

        The ports covered are MySQL on 3306, PostgreSQL on 5432, MongoDB on 27017, Redis on 6379, Kafka on 9092, Elasticsearch and OpenSearch on 9200, and SQL Server on 1433. A rule fails when its source is `Any IPv4` or `Any IPv6`. You remove or scope those rules on the **Rules** tab of the affected firewall in the Hetzner Cloud Console, or with `hcloud firewall delete-rule` once per offending port. Database services should be reachable only from the application tier, ideally over a Hetzner private network, never directly from the internet.

        **Why this matters**

        Databases exposed to the internet are subject to continuous automated login attempts. A guessable or default credential on one of these ports leads directly to data exfiltration, with no intermediate control left to stop it.

        Several of these engines have had widely exploited episodes where a misconfiguration left them accessible with no authentication at all. Those incidents ended in mass data destruction and ransom demands, and the exposure that enabled them was exactly an open port on a public address.

        Direct internet access to a database port also removes the application tier as a layer of access control. An attacker who reaches the port can query or dump data without ever passing through the application's authorization logic, so every permission decision that lives in the application is bypassed at once.

        The engine's own protocol becomes attack surface as well. Any pre-authentication vulnerability in the database software is exploitable by any host on the internet the moment the port is publicly reachable.

        Place databases on a private network and reach them from application servers on that same network, or scope the rule to the trusted CIDR of those servers. Both forms keep the intended access boundary intact and ensure external access is mediated by the application tier.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Firewalls** and open each firewall.
        3. Review the **Rules** tab, focusing on inbound rules.
        4. Check whether any inbound TCP rule specifies a port of `3306`, `5432`, `27017`, `6379`, `9092`, `9200`, or `1433` with a source of `Any IPv4` (`0.0.0.0/0`) or `Any IPv6` (`::/0`).

        A passing firewall shows no inbound rule for those database ports sourced from `0.0.0.0/0` or `::/0`. A failing firewall shows at least one such inbound rule permitting unrestricted internet access to a database port.

        ### Audit via CLI

        1. List all firewalls and inspect their rules:

        ```bash
        hcloud firewall list -o columns=id,name
        hcloud firewall describe <firewall> -o json
        ```

        Review the `rules` array for entries where `direction` is `in`, `protocol` is `tcp`, `port` is any of `3306`, `5432`, `27017`, `6379`, `9092`, `9200`, or `1433`, and `source_ips` contains `0.0.0.0/0` or `::/0`.

        A passing firewall returns no such rule. A failing firewall returns at least one inbound rule matching one of those database ports with an unrestricted source.
      remediation:
        - id: console
          desc: |
            Database services should be reachable only from the application tier, ideally over a Hetzner private network.

            1. Navigate to **Firewalls** and open the affected firewall.
            2. On the **Rules** tab, locate each inbound rule for ports `3306`, `5432`, `27017`, `6379`, `9092`, `9200`, or `1433` whose source is `Any IPv4` or `Any IPv6`.
            3. Delete the rule, or change its source to the trusted CIDR of your application servers.
            4. Save the firewall and repeat for every offending port.
        - id: cli
          desc: |
            The `delete-rule` command must match the existing rule exactly, including the complete source IP list and any description, so inspect the rule first and reuse its exact values:

            ```bash
            hcloud firewall describe <firewall> -o json
            hcloud firewall delete-rule <firewall> \
              --direction in --protocol tcp --port 5432 \
              --source-ips 0.0.0.0/0,::/0
            ```

