        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Hetzner Cloud Firewall allows inbound TCP traffic on port 3389 from the public internet.

        An RDP rule is unrestricted when its source is `0.0.0.0/0` or `::/0`. Internet-facing RDP is one of the most common initial access vectors in ransomware campaigns and targeted intrusions. You remove or scope the rule under **Firewalls** in the Hetzner Cloud Console, or with `hcloud firewall delete-rule`, and this check requires that no rule leave port 3389 open to either unrestricted source.

        **Why this matters**

        RDP exposed to the internet is the primary delivery mechanism for many ransomware families. Threat actors scan continuously for open port 3389 and attempt credential-based entry the moment they find one, so exposure is measured in minutes rather than days.

        The protocol also carries a documented history of critical pre-authentication remote code execution vulnerabilities, BlueKeep and CVE-2019-0708 among them. That history makes a directly exposed listener a higher-risk target even on a fully patched system, because the next such flaw is reachable by anyone before a fix exists.

        Reused or weak credentials compound both problems. On an internet-facing RDP service they can be discovered and exploited within minutes of server provisioning, which is well before most hardening or monitoring work is finished.

        Remove direct exposure and route remote desktop sessions through a VPN or bastion instead. Where RDP genuinely must stay reachable, restrict it by source CIDR to a specific trusted range so automated scanning and exploitation by arbitrary internet hosts cannot reach it.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Firewalls** and open each firewall.
        3. Review the **Rules** tab, focusing on inbound rules.
        4. Check whether any inbound TCP rule for port 3389 lists `Any IPv4` (`0.0.0.0/0`) or `Any IPv6` (`::/0`) as the source.

        A passing firewall shows no inbound rule for TCP port 3389 with an unrestricted source. A failing firewall shows an inbound TCP rule for port 3389 sourced from `0.0.0.0/0` or `::/0`.

        ### Audit via CLI

        1. List all firewalls and inspect their rules:

        ```bash
        hcloud firewall list -o columns=id,name
        hcloud firewall describe <firewall> -o json
        ```

        Review the `rules` array for any entry where `direction` is `in`, `protocol` is `tcp`, `port` is `3389`, and `source_ips` contains `0.0.0.0/0` or `::/0`.

        A passing firewall returns no such rule. A failing firewall returns at least one rule with direction `in`, protocol `tcp`, port `3389`, and source IP `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Firewalls** and open the affected firewall.
            2. Remove the RDP rule entirely, or restrict the source to a specific trusted CIDR.
            3. Save the firewall.
        - id: cli
          desc: |
            The `delete-rule` command must match the existing rule exactly, including the complete source IP list and any description, so inspect the rule first and reuse its exact values:

            ```bash
            hcloud firewall describe <firewall> -o json
            hcloud firewall delete-rule <firewall> \
              --direction in --protocol tcp --port 3389 \
              --source-ips 0.0.0.0/0,::/0
            ```

            If the unrestricted IPv4 and IPv6 sources are defined in separate rules, run `delete-rule` once per rule with that rule's exact `source-ips` value. If RDP must remain reachable, add a replacement rule restricted to a trusted range before deleting the open rule:

            ```bash
            hcloud firewall add-rule <firewall> \
              --direction in --protocol tcp --port 3389 \
              --source-ips <your-trusted-cidr>
            ```
        - id: terraform
          desc: |
            Remove any RDP `rule` block sourced from `0.0.0.0/0` or `::/0`. If RDP must remain reachable, scope `source_ips` to a specific trusted CIDR:

            ```hcl
            resource "hcloud_firewall" "default" {
              name = "default"

              rule {
                direction  = "in"
                protocol   = "tcp"
                port       = "3389"
                source_ips = ["203.0.113.0/24"]
              }
            }
            ```
