policies:
  - uid: mondoo-hetzner-security
    name: Mondoo Hetzner Cloud Security
    version: 2.3.2
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: hetzner,cloud
    require:
      - provider: hetzner
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Hetzner Cloud servers, SSH keys, firewalls, load balancers, certificates, Storage Boxes, and IP addresses
    docs:
      desc: |
        The Mondoo Hetzner Cloud Security policy identifies critical misconfigurations that could leave your Hetzner Cloud project vulnerable to attackers. This policy focuses on security-relevant controls and helps organizations harden against unauthorized network access, data exposure in transit, weak cryptography, and exposure to known CVEs through end-of-life software.

        This policy provides security checks across key Hetzner Cloud resources:

        - Cloud Servers
        - SSH keys
        - Firewalls
        - Load Balancers
        - TLS Certificates
        - Storage Boxes
        - Floating IPs and Primary IPs

        Learn more about scanning Hetzner Cloud in the [cnspec Hetzner Cloud documentation](https://mondoo.com/docs/cnspec/cloud/hetzner).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Servers
        checks:
          - uid: mondoo-hetzner-security-server-in-private-network
          - uid: mondoo-hetzner-security-server-has-firewall
          - uid: mondoo-hetzner-security-server-image-not-deprecated
          - uid: mondoo-hetzner-security-server-not-internet-reachable
      - title: SSH Keys
        checks:
          - uid: mondoo-hetzner-security-ssh-key-strong-algorithm
      - title: Firewalls
        checks:
          - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh
          - uid: mondoo-hetzner-security-firewall-no-unrestricted-rdp
          - uid: mondoo-hetzner-security-firewall-no-unrestricted-db-ports
          - uid: mondoo-hetzner-security-firewall-no-all-ports-open
          - uid: mondoo-hetzner-security-firewall-no-unrestricted-egress
          - uid: mondoo-hetzner-security-firewall-has-rules
      - title: Load Balancers
        checks:
          - uid: mondoo-hetzner-security-lb-http-redirected-to-https
          - uid: mondoo-hetzner-security-lb-https-service-has-certificate
          - uid: mondoo-hetzner-security-lb-in-private-network
      - title: TLS Certificates
        checks:
          - uid: mondoo-hetzner-security-cert-not-expired
          - uid: mondoo-hetzner-security-cert-not-self-signed
      - title: Storage Boxes
        checks:
          - uid: mondoo-hetzner-security-storage-box-not-externally-reachable
      - title: IP Addresses
        checks:
          - uid: mondoo-hetzner-security-floating-ip-not-blocked
          - uid: mondoo-hetzner-security-primary-ip-not-blocked
    scoring_system: highest impact
queries:
  - uid: mondoo-hetzner-security-server-in-private-network
    title: Ensure servers are attached to a private network
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-hetzner-security-server-in-private-network-hetzner
        tags:
          mondoo.com/filter-title: Hetzner Cloud
          mondoo.com/filter-icon: hetzner
      - uid: mondoo-hetzner-security-server-in-private-network-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-server-in-private-network-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-server-in-private-network-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Hetzner Cloud server is attached to at least one private network.

        A private network gives the resources in a project an isolated RFC-1918 address space they can use to reach each other without touching public interfaces. Hetzner does not create or assign a private network automatically, so by default servers communicate over the public internet even when the traffic never leaves the project. You create one under **Networks** in the Hetzner Cloud Console and attach it from the server's **Networking** tab with **Attach to Network**, or run `hcloud server attach-to-network`. This check requires at least one network attachment on every server.

        **Why this matters**

        A server with no private network has no network boundary between it and the other resources in the project. An attacker who compromises one server reaches the others over the same public paths the server already uses, so a single foothold becomes lateral movement with no additional barrier to cross.

        Traffic that stays on a private network never traverses the public internet, which removes the opportunity to intercept or manipulate intra-project communication. Without that path, servers exchange the same data across public-facing interfaces where anything on the route can see it.

        Private network membership also enables subnet-level access controls that cloud firewall rules alone cannot express, and it is the prerequisite for further segmentation such as dedicated subnets per tier and private-only service endpoints. It adds depth as well: when a cloud firewall rule is misconfigured, private-network isolation confines the blast radius of that mistake to the hosts on the same network.

        A single-purpose appliance with no peers in the project has nothing to talk to privately and may legitimately have no network attachment. Every server that exchanges traffic with another project resource should be on one, paired with firewall rules that restrict the forwarded ports to the private range.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Servers** and open each server.
        3. Click the **Networking** tab.
        4. Review the **Private Networks** section.

        A passing server shows at least one private network listed under **Private Networks**. A failing server shows an empty **Private Networks** section.

        ### Audit via CLI

        1. List all servers and inspect their private network attachments:

        ```bash
        hcloud server list -o columns=id,name
        hcloud server describe <server> -o json | grep -A5 'private_net'
        ```

        A passing server returns a non-empty `private_net` array in the JSON output. A failing server returns an empty `private_net` array (`[]`).
      remediation:
        - id: console
          desc: |
            1. Navigate to **Networks** and create a network if one does not already exist.
            2. Open the affected server and go to **Networking**.
            3. Click **Attach to Network** and select the target network.
        - id: cli
          desc: |
            ```bash
            hcloud server attach-to-network <server> --network <network>
            ```
        - id: terraform
          desc: |
            Define a `hcloud_network` with at least one `hcloud_network_subnet` and reference it from a `network` block on every `hcloud_server`. Use the inline `network` block rather than a separate `hcloud_server_network` resource, because only the inline form is recognized when this check evaluates Terraform code:

            ```hcl
            resource "hcloud_network" "main" {
              name     = "main"
              ip_range = "10.0.0.0/16"
            }

            resource "hcloud_network_subnet" "main" {
              network_id   = hcloud_network.main.id
              type         = "cloud"
              network_zone = "eu-central"
              ip_range     = "10.0.1.0/24"
            }

            resource "hcloud_server" "example" {
              name        = "example"
              image       = "ubuntu-24.04"
              server_type = "cx22"
              location    = "nbg1"

              network {
                network_id = hcloud_network.main.id
              }

              depends_on = [hcloud_network_subnet.main]
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/networks/overview/
        title: Hetzner Cloud Networks overview

  - uid: mondoo-hetzner-security-server-in-private-network-hetzner
    filters: asset.platform == "hetzner-project"
    mql: |
      hetzner.servers.all(privateNet != empty)
  - uid: mondoo-hetzner-security-server-in-private-network-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcloud_server")
    mql: |
      terraform.resources("hcloud_server").all(
        blocks.where(type == "network") != empty
      )
  - uid: mondoo-hetzner-security-server-in-private-network-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcloud_server")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcloud_server").all(
        change.after.network != null && change.after.network != empty
      )
  - uid: mondoo-hetzner-security-server-in-private-network-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcloud_server")
    mql: |
      terraform.state.resources.where(type == "hcloud_server").all(
        values.network != null && values.network != empty
      )

  - uid: mondoo-hetzner-security-server-has-firewall
    title: Ensure servers have at least one firewall applied
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-hetzner-security-server-has-firewall-hetzner
        tags:
          mondoo.com/filter-title: Hetzner Cloud
          mondoo.com/filter-icon: hetzner
      - uid: mondoo-hetzner-security-server-has-firewall-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-server-has-firewall-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-server-has-firewall-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Hetzner Cloud server has at least one Hetzner Cloud Firewall applied.

        A Cloud Firewall is a separate resource that you attach to servers, and Hetzner does not attach one to new servers by default. Until a firewall is applied, every port bound on the server's public network interface is reachable from the entire internet. You create the firewall under **Firewalls** in the Hetzner Cloud Console and attach it on the firewall's **Apply to** tab, either by naming the server or by using a label selector that matches it, or you run `hcloud firewall apply-to-resource`. This check requires each server to carry at least one such attachment.

        **Why this matters**

        Without a Cloud Firewall a Hetzner server sits in a default-allow posture: it accepts connections on every listening port from every address on the internet. That includes the ports nobody meant to publish, such as debug endpoints, internal admin tools, and services that were misconfigured to bind on the public interface rather than on loopback.

        A Cloud Firewall enforces its restrictions at the network edge, before traffic reaches the server. That is what makes it different from the in-guest OS firewall: if the guest firewall is disabled, flushed by a package upgrade, or simply misconfigured, the unauthorized ports stay unreachable anyway, and no guest-level mistake can bypass the rules.

        Narrowing the exposed service footprint to the ports the workload actually needs also shrinks the window in which any vulnerability in a running service can be exploited. An explicit allowlist means unintended services are never reachable regardless of what software gets installed or started later.

        A firewall additionally gives incident response a fast, centralized control plane. Traffic to a compromised server can be cut off from the console or the CLI without needing in-guest access to a machine you no longer trust.

        Pair the attachment with rules narrow enough to be meaningful. A firewall that is applied but permits everything satisfies the attachment requirement while providing no perimeter.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Servers** and open each server.
        3. Click the **Firewalls** tab.
        4. Review the list of applied firewalls.

        A passing server shows at least one firewall listed. A failing server shows no firewalls applied.

        ### Audit via CLI

        1. List all servers and inspect each server's firewall assignments:

        ```bash
        hcloud server list -o columns=id,name
        hcloud server describe <server> -o json | grep -A5 'firewall'
        ```

        A passing server returns a non-empty `public_net.firewalls` or `firewall_ids` array. A failing server returns an empty or absent firewall list.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Firewalls** and create a firewall with rules appropriate for the server's role.
            2. Open the firewall and go to **Apply to**.
            3. Add the affected server (or a label selector that matches it).
        - id: cli
          desc: |
            ```bash
            hcloud firewall apply-to-resource <firewall> --type server --server <server>
            ```
        - id: terraform
          desc: |
            Reference at least one `hcloud_firewall` from `firewall_ids` on every `hcloud_server`. Use the `firewall_ids` attribute rather than a separate `hcloud_firewall_attachment` resource or an `apply_to` block on the firewall, because only the `firewall_ids` form is recognized when this check evaluates Terraform code:

            ```hcl
            resource "hcloud_firewall" "default" {
              name = "default"

              rule {
                direction  = "in"
                protocol   = "tcp"
                port       = "22"
                source_ips = ["10.0.0.0/16"]
              }
            }

            resource "hcloud_server" "example" {
              name         = "example"
              image        = "ubuntu-24.04"
              server_type  = "cx22"
              location     = "nbg1"
              firewall_ids = [hcloud_firewall.default.id]
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/firewalls/overview/
        title: Hetzner Cloud Firewalls overview

  - uid: mondoo-hetzner-security-server-has-firewall-hetzner
    filters: asset.platform == "hetzner-project"
    mql: |
      hetzner.servers.all(firewalls != empty)
  - uid: mondoo-hetzner-security-server-has-firewall-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcloud_server")
    mql: |
      terraform.resources("hcloud_server").all(
        arguments['firewall_ids'] != null && arguments['firewall_ids'] != []
      )
  - uid: mondoo-hetzner-security-server-has-firewall-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcloud_server")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcloud_server").all(
        change.after.firewall_ids != null && change.after.firewall_ids != []
      )
  - uid: mondoo-hetzner-security-server-has-firewall-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcloud_server")
    mql: |
      terraform.state.resources.where(type == "hcloud_server").all(
        values.firewall_ids != null && values.firewall_ids != []
      )

  # No Terraform variants: image deprecation is runtime metadata set by Hetzner on the image (`image.deprecated` timestamp), not a configurable field on `hcloud_server`. Terraform configs only carry the image name string, with no signal whether Hetzner has marked it deprecated.
  - uid: mondoo-hetzner-security-server-image-not-deprecated
    title: Ensure servers do not run a deprecated OS image
    impact: 70
    filters: asset.platform == "hetzner-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-1-ii-b-security-management-process-risk-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      hetzner.servers.where(image != null).all(image.deprecated == null || image.deprecated > time.now)
    docs:
      desc: |
        This check verifies that no Hetzner Cloud server was created from a system image whose deprecation date has passed.

        Hetzner marks an image deprecated when the upstream operating system reaches end of life or when Hetzner plans to retire the image, and it publishes a deprecation timestamp alongside the image. Once that timestamp is in the past, the image is no longer supported. The fix is to move the server onto a current image, either through **Rebuild** on the server in the Hetzner Cloud Console or with `hcloud server rebuild`, and this check requires that no server run an image whose deprecation date has already elapsed.

        **Why this matters**

        A deprecated image is tied to an end-of-life operating system that no longer receives upstream security fixes. Known-exploited CVEs accumulate against it with no remediation path available, so the server drifts further from a patchable state with every disclosure.

        The exposure is not limited to the kernel. User-space packages and system libraries shipped in a deprecated image are past end of life too, so the vulnerability surface widens across the whole software stack rather than in one component you could isolate.

        Running unsupported software is also a direct compliance problem. Many frameworks require that software run on vendor-supported versions, and a deprecated image creates a gap that auditors and regulators will flag independently of whether it has been exploited.

        Rebuilding from a current, supported image starts the server with all upstream security patches applied and puts it back on a baseline where future patching and image-refresh workflows are predictable and vendor-supported. Rebuilding erases the disk, so back up or migrate data first, and for stateful workloads prefer provisioning a replacement server and moving the workload onto it.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Servers** and open each server.
        3. On the **Overview** tab, check the **Image** field.
        4. A deprecated image is noted with a deprecation warning or end-of-life indicator in the image name or description.

        A passing server shows a current, non-deprecated image. A failing server shows an image flagged as deprecated or end-of-life.

        ### Audit via CLI

        1. Retrieve the image details for each server and check the `deprecated` field:

        ```bash
        hcloud server describe <server> -o json | grep -A5 '"image"'
        hcloud image describe <image-id> -o json | grep 'deprecated'
        ```

        A passing server returns `"deprecated": null` or a `deprecated` date in the future. A failing server returns a `deprecated` date that is in the past.
      remediation:
        - id: console
          desc: |
            Rebuilding a server from a new image erases all data on its disk. Back up or migrate any data you need before you start. For stateful workloads, prefer provisioning a replacement server and migrating the workload.

            To rebuild in place:

            1. Navigate to **Servers** and open the affected server.
            2. Go to **Rebuild**, select a current, supported OS image, and confirm.
            3. Restore data and configuration from your backup.

            To migrate to a replacement server instead:

            1. Note the affected server's configuration, including server type, location, networks, firewalls, and SSH keys.
            2. Provision a replacement server using a current OS image.
            3. Migrate data and configuration to the new server.
            4. Update DNS, monitoring, and dependent services to point at the new server.
            5. Delete the original server. The finding clears only once no server runs a deprecated image.
        - id: cli
          desc: |
            Rebuilding erases all data on the server's disk; back up anything you need first:

            ```bash
            hcloud server rebuild <server> --image <current-image>
            ```

            To migrate to a replacement server instead, create the new server, move the workload, then delete the original server so the deprecated image is no longer in use:

            ```bash
            hcloud server create \
              --name <new-name> \
              --type <server-type> \
              --image <current-image> \
              --location <location> \
              --network <network> \
              --firewall <firewall> \
              --ssh-key <ssh-key>
            hcloud server delete <old-server>
            ```
        - id: terraform
          desc: |
            Pin `image` on every `hcloud_server` resource to a current, supported OS image. Changing `image` forces server replacement, so plan a data migration before applying:

            ```hcl
            resource "hcloud_server" "example" {
              name        = "example"
              server_type = "cx22"
              location    = "nbg1"
              image       = "ubuntu-24.04"
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/servers/faq/#what-does-it-mean-when-an-image-is-deprecated
        title: Hetzner image deprecation policy

  # Security-only check (compliance mapping intentionally omitted per maintainer).
  # No Terraform variants: internetReachable is a runtime-computed exposure signal (IP + security group/firewall reachability) with no static config analog.
  - uid: mondoo-hetzner-security-server-not-internet-reachable
    title: Ensure servers are not reachable from the internet
    impact: 85
    filters: asset.platform == "hetzner-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      hetzner.servers.all( exposure.internetReachable == false )
    docs:
      desc: |
        This check verifies that no Hetzner Cloud server is reachable from the public internet.

        The `internetReachable` signal correlates two conditions: the server holds a public IP, and firewall ingress actually admits inbound traffic from any address. The second condition includes the case where no firewall is attached at all, since an unfiltered server admits everything. Because both must hold, this is a higher-fidelity view of what is genuinely exposed than a public-IP flag on its own. You close the path either by scoping the world-open inbound rules on the applied firewall under **Firewalls** in the Hetzner Cloud Console, or by removing the server's public IPv4 and IPv6 from its **Networking** tab and reaching it over a private network or a bastion instead.

        **Why this matters**

        A server with no internet-reachable path keeps its listening services off the public scanning grid entirely. Nothing on the internet can enumerate what it runs, so no service on it can be probed or attacked by an arbitrary remote host.

        The two halves of the exposure are independent, which is what makes this fixable from either side. A public IP is harmless until a firewall rule, or a missing firewall, admits traffic to it, so removing either the address or the open ingress closes the path.

        Correlating the address with the ingress also keeps the finding honest. It surfaces the servers that are actually exposed rather than every server that merely holds a public address, so the results stay worth acting on instead of becoming noise that gets filtered out.

        Intentionally public hosts such as bastions and public web servers will fail this check and should be exempted. For those, the meaningful control is narrow per-service rules rather than an absence of public reachability.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Servers** and open each server, then review the **Networking** tab for an assigned public IPv4 or IPv6 address.
        3. Open the **Firewalls** tab and review the inbound rules of every applied firewall; a server with no firewall admits all inbound traffic.

        A passing server either has no public IP, or has firewalls whose inbound rules admit no `0.0.0.0/0` or `::/0` source. A failing server has a public IP and a firewall rule (or absent firewall) that admits traffic from any address.

        ### Audit via CLI

        1. List servers and inspect each server's public IP and applied firewalls:

        ```bash
        hcloud server list -o columns=id,name,ipv4,ipv6
        hcloud server describe <server> -o json | grep -A5 'firewall'
        hcloud firewall describe <firewall> -o json
        ```

        A passing server either reports no public IP, or has firewall inbound rules whose `source_ips` exclude `0.0.0.0/0` and `::/0`. A failing server has a public IP combined with an inbound rule sourced from `0.0.0.0/0` or `::/0`, or no firewall applied.
      remediation:
        - id: console
          desc: |
            Close the internet-reachable path by restricting the firewall or removing the public edge.

            1. Navigate to **Firewalls** and open the firewall applied to the affected server (create one and apply it first if the server has none).
            2. Edit any inbound rule whose source is `Any IPv4` (`0.0.0.0/0`) or `Any IPv6` (`::/0`) and scope it to a specific trusted CIDR.
            3. If the server does not need a public IP at all, open the server's **Networking** tab and remove its public IPv4/IPv6, reaching it over a private network or a bastion instead.
        - id: cli
          desc: |
            Scope every world-open inbound rule on the applied firewall to a trusted CIDR. If the server has no firewall, create one and apply it first:

            ```bash
            hcloud firewall delete-rule <firewall> \
              --direction in --protocol tcp --port 443 --source-ips 0.0.0.0/0
            hcloud firewall add-rule <firewall> \
              --direction in --protocol tcp --port 443 --source-ips 203.0.113.0/24
            hcloud firewall apply-to-resource <firewall> --type server --server <server>
            ```

            A public IP cannot be detached from a running server in place; to remove the public edge entirely, rebuild the server with the public interface disabled (Terraform below).
        - id: terraform
          desc: |
            Keep servers off the public internet by attaching a firewall whose inbound rules are scoped to trusted CIDRs, and disabling the public interface where it is not needed:

            ```hcl
            resource "hcloud_firewall" "scoped" {
              name = "scoped"

              rule {
                direction  = "in"
                protocol   = "tcp"
                port       = "443"
                source_ips = ["203.0.113.0/24"]
              }
            }

            resource "hcloud_server" "example" {
              name         = "example"
              image        = "ubuntu-24.04"
              server_type  = "cx22"
              location     = "nbg1"
              firewall_ids = [hcloud_firewall.scoped.id]

              public_net {
                ipv4_enabled = false
                ipv6_enabled = false
              }

              network {
                network_id = hcloud_network.main.id
              }

              depends_on = [hcloud_network_subnet.main]
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/firewalls/overview/
        title: Hetzner Cloud Firewalls overview

  - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh
    title: Ensure no firewall allows unrestricted inbound SSH (port 22)
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-hetzner
        tags:
          mondoo.com/filter-title: Hetzner Cloud
          mondoo.com/filter-icon: hetzner
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no Hetzner Cloud Firewall allows inbound TCP traffic on port 22 from the public internet.

        An SSH rule is unrestricted when its source is `0.0.0.0/0` or `::/0`, which admits every address on the internet. SSH exposed that way is one of the most common entry points in cloud infrastructure compromises. You scope the rule under **Firewalls** in the Hetzner Cloud Console by changing its source from `Any IPv4` or `Any IPv6` to a specific trusted CIDR, or with `hcloud firewall add-rule` followed by `hcloud firewall delete-rule`. This check requires that no rule leave port 22 open to either unrestricted source.

        **Why this matters**

        Internet-facing SSH attracts constant automated login attempts. Brute-force and credential-stuffing traffic finds a new listener within minutes of it appearing, and a single weak or reused credential turns that background noise into an immediate breach.

        Key-based authentication narrows but does not remove the exposure. An unrestricted listener publishes the SSH daemon itself to the internet, so any future pre-authentication vulnerability in that daemon is reachable by every host that can route to it, regardless of how strong the credentials behind it are.

        Unauthorized SSH access to one server also becomes a pivot. From inside the project an attacker can enumerate the network and reach other resources that were never meant to be reachable from outside, so the blast radius of a single compromised login extends well past the server that accepted it.

        Sessions established through unrestricted SSH are harder to attribute and monitor than sessions routed through a bastion or VPN with centralized logging, which leaves gaps in the audit trail exactly when an investigation needs it.

        Restrict the source to a known trusted CIDR, a bastion host, or a VPN egress range. That eliminates the vast majority of automated attack traffic before it can attempt authentication, and it means that during the interval between a vulnerability disclosure and your patching, only trusted hosts can reach the service at all. Add the restricted rule before deleting the open one, and confirm your own management network falls inside the range, so you do not lock yourself out.
      audit: |
        ### Audit via Console

        1. Log in to the [Hetzner Cloud Console](https://console.hetzner.cloud) and select the project.
        2. Navigate to **Firewalls** and open each firewall.
        3. Review the **Rules** tab, focusing on inbound rules.
        4. Check whether any inbound TCP rule for port 22 lists `Any IPv4` (`0.0.0.0/0`) or `Any IPv6` (`::/0`) as the source.

        A passing firewall shows no inbound rule for TCP port 22 with a source of `0.0.0.0/0` or `::/0`. A failing firewall shows an inbound TCP rule for port 22 with an unrestricted source.

        ### Audit via CLI

        1. List all firewalls and inspect their rules:

        ```bash
        hcloud firewall list -o columns=id,name
        hcloud firewall describe <firewall> -o json
        ```

        Review the `rules` array for any entry where `direction` is `in`, `protocol` is `tcp`, `port` is `22`, and `source_ips` contains `0.0.0.0/0` or `::/0`.

        A passing firewall returns no such rule. A failing firewall returns at least one rule with direction `in`, protocol `tcp`, port `22`, and source IP `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Firewalls** and open the affected firewall.
            2. Edit the offending inbound rule for SSH and change the source from `Any IPv4`/`Any IPv6` to a specific trusted CIDR.
            3. Save the firewall.
        - id: cli
          desc: |
            The `delete-rule` command must match the existing rule exactly, including the complete source IP list and any description, so inspect the rule first and reuse its exact values. Add the restricted rule before deleting the open one so SSH access from your trusted range is never interrupted, and make sure your own management network is inside that range:

            ```bash
            hcloud firewall describe <firewall> -o json
            hcloud firewall add-rule <firewall> \
              --direction in --protocol tcp --port 22 \
              --source-ips <your-trusted-cidr>
            hcloud firewall delete-rule <firewall> \
              --direction in --protocol tcp --port 22 \
              --source-ips 0.0.0.0/0,::/0
            ```

            If the unrestricted IPv4 and IPv6 sources are defined in separate rules, run `delete-rule` once per rule with that rule's exact `source-ips` value.
        - id: terraform
          desc: |
            Scope inbound SSH `source_ips` to a specific trusted CIDR. Never use `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "hcloud_firewall" "default" {
              name = "default"

              rule {
                direction  = "in"
                protocol   = "tcp"
                port       = "22"
                source_ips = ["203.0.113.0/24"]
              }
            }
            ```
    refs:
      - url: https://docs.hetzner.com/cloud/firewalls/overview/
        title: Hetzner Cloud Firewalls overview

  - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-hetzner
    filters: asset.platform == "hetzner-firewall"
    mql: |
      hetzner.firewall.rules.none(
        _["direction"] == "in" && _["protocol"] == "tcp" && _["port"] == "22" && _["sourceIps"].contains("0.0.0.0/0")
      )
      hetzner.firewall.rules.none(
        _["direction"] == "in" && _["protocol"] == "tcp" && _["port"] == "22" && _["sourceIps"].contains("::/0")
      )
  - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "hcloud_firewall")
    mql: |
      terraform.resources("hcloud_firewall").all(
        blocks.where(type == "rule").all(
          arguments['direction'] != "in" ||
          arguments['protocol'] != "tcp" ||
          arguments['port'] != "22" ||
          arguments['source_ips'].containsNone(["0.0.0.0/0", "::/0"])
        )
      )
  - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "hcloud_firewall")
    mql: |
      terraform.plan.resourceChanges.where(type == "hcloud_firewall").all(
        change.after.rule == null || change.after.rule.all(
          _['direction'] != "in" ||
          _['protocol'] != "tcp" ||
          _['port'] != "22" ||
          _['source_ips'].containsNone(["0.0.0.0/0", "::/0"])
        )
      )
  - uid: mondoo-hetzner-security-firewall-no-unrestricted-ssh-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "hcloud_firewall")
    mql: |
      terraform.state.resources.where(type == "hcloud_firewall").all(
        values.rule == null || values.rule.all(
          _['direction'] != "in" ||
          _['protocol'] != "tcp" ||
          _['port'] != "22" ||
          _['source_ips'].containsNone(["0.0.0.0/0", "::/0"])
        )
      )

