        Declare a CPU value under `resources.limits` for each container. The manifest below shows the required configuration:

        ```yaml
        ---
        apiVersion: apps/v1
        kind: DaemonSet
        spec:
          template:
            spec:
              containers:
                - name: app
                  image: images.my-company.example/app:v1.2.3
                  resources:
                    limits:
                      cpu: "500m"
        ```
