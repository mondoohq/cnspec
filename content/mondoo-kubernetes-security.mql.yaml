  - uid: mondoo-kubernetes-security-pod-capability-net-raw
    title: Pods should not run with NET_RAW capability
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      k8s.pod.ephemeralContainers.all( addedCapabilities.none( _.upcase == /^NET_RAW$|^ALL$/ ) )
      k8s.pod.ephemeralContainers.all( droppedCapabilities.any( _.upcase == /^NET_RAW$|^ALL$/ ) )
      k8s.pod.initContainers.all( addedCapabilities.none( _.upcase == /^NET_RAW$|^ALL$/ ) )
      k8s.pod.initContainers.all( droppedCapabilities.any( _.upcase == /^NET_RAW$|^ALL$/ ) )
      k8s.pod.containers.all( addedCapabilities.none( _.upcase == /^NET_RAW$|^ALL$/ ) )
      k8s.pod.containers.all( droppedCapabilities.any( _.upcase == /^NET_RAW$|^ALL$/ ) )
    docs:
      desc: |
        This check verifies that containers in the Pod cannot craft raw network packets.

        `CAP_NET_RAW` lets a process open raw and packet sockets, building Ethernet and IP frames by hand instead of going through the kernel's normal socket path. Container runtimes grant it by default, so removing it takes an explicit `securityContext.capabilities.drop` of `NET_RAW` or `ALL` on every container, init container, and ephemeral container under `spec`, and no container may add it back through `capabilities.add`.

        **Why this matters**

        Raw sockets are the toolkit for attacking the Pod network from inside it. With `NET_RAW` a compromised container forges ARP replies to put itself between two Pods on the same node, forges DNS responses that beat the real resolver, and sends packets with a source address that is not its own, which defeats any control that identifies workloads by IP.

        DNS spoofing is the practical one. Cluster DNS traffic is plain UDP, and a container with raw socket access on the same node can answer a neighbor's query for a Service name before CoreDNS does, redirecting that neighbor's traffic to an endpoint of the attacker's choosing without touching a single Kubernetes object.

        Raw sockets also enable quiet reconnaissance and exfiltration. Scanning the cluster network, fingerprinting neighbors, and tunneling data inside ICMP payloads all need this capability, and none of them create the connection records that ordinary sockets would.

        The capability is needed by workloads that ping, run traceroute, or capture traffic, which in practice means network debugging tools, some service mesh init containers, and a few monitoring agents. Grant it to those explicitly rather than leaving it enabled everywhere by default. Dropping `NET_RAW` is not a substitute for NetworkPolicy, since the container can still open ordinary connections; the two controls cover different halves of the problem. A Pod created directly is never recreated when its node fails, so the hardened spec you fix here lives only as long as that node does; apply the same setting in whichever controller owns the durable copy of this workload.
      audit: |
        Check to ensure no Pods have explicitly asked for the NET_RAW capability (or asked for ALL capabilities which includes NET_RAW):

        ```bash
        kubectl get pods -A -o json | jq -r '.items[] | select(.spec.containers[].securityContext.capabilities.add | . != empty and any(.[] ; ascii_upcase | test("ALL|NET_RAW")) ) | .metadata.namespace + "/" + .metadata.name' | uniq
        ```


        Additionally, a Pod that doesn't define a list of capabilities to drop at all, or that has a non-empty drop list that doesn't drop NET_RAW (or the ALL capability which includes NET_RAW) will implicitly run with NET_RAW. List these Pods with:

        ```bash
        kubectl get pods -A -o json | jq -r '.items[] | select( .spec.containers[].securityContext.capabilities.drop | . == null or ( any(.[] ; ascii_upcase | test("ALL|NET_RAW")) | not) ) | .metadata.namespace + "/" + .metadata.name' | uniq
        ```
      remediation: |
        For any Pods that explicitly add the NET_RAW or ALL capability, update the Pods (or the Deployments/DaemonSets/CronJobs/etc that produced the Pods) to ensure they do not ask for the NET_RAW or ALL capability:

        ```yaml
        apiVersion: v1
        kind: Pod
        metadata:
          name: example-pod
          namespace: example-namespace
        spec:
          containers:
            - securityContext:
                capabilities:
                  add: [] # <-- ensure no "NET_RAW" or "ALL" in the list of capabilities added
        ```

        For any Pods that do not define a list of capabilities to drop or that define a list but do not drop NET_RAW, update the Pods (or the Deployments/DaemonSets/CronJobs/etc that produced the Pods) to ensure they drop ALL or NET_RAW:

        ```yaml
        apiVersion: v1
        kind: Pod
        metadata:
          name: example
          namespace: example-namespace
        spec:
          containers:
            - securityContext:
                capabilities:
                  drop: ["NET_RAW"] # <-- or ensure "ALL" in the list of capabilities to drop
        ```
    refs:
      - url: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        title: 'Kubernetes Security Standards: Capabilities'
