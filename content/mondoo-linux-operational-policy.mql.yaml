policies:
  - uid: linux-operational-policy
    name: Linux Server Operational Policy
    version: 1.1.1
    license: BUSL-1.1
    tags:
      mondoo.com/category: best-practices
      mondoo.com/platform: linux
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Validate Linux server reliability and operations
    docs:
      desc: |
        The Mondoo Linux Server Operational Policy identifies operational health issues on Linux servers that could lead to service disruption, data corruption, and unplanned outages. This policy helps operations teams catch resource exhaustion and capacity problems before they cascade into application crashes, dropped writes, and emergency on-call work.

        This policy provides checks across key Linux server health indicators:

        - Disk usage thresholds across mounted filesystems
        - Memory utilization and swap pressure

        Learn more about scanning Linux in the [cnspec Linux documentation](https://mondoo.com/docs/cnspec/os/linux).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - filters: asset.family.contains("linux")
        checks:
          - uid: linux-operational-policy-disk-usage
          - uid: linux-operational-policy-memory-usage
queries:
  - uid: linux-operational-policy-disk-usage
    title: Ensure disk usage is under 80%
    impact: 60
    mql: |
      mount.list.where(fstype != "tmpfs" && fstype != "devtmpfs" && fstype != "squashfs" && fstype != "iso9660" && device != "udev" && device != /^\/dev\/loop/).where(size > 0).all(used * 100 / size < 80)
    docs:
      desc: |
        This check verifies that every persistent filesystem on the host is below 80 percent used.

        The check reads the mount table, computes used space as a proportion of size for each entry, and requires the result to stay under 80 percent. Pseudo-filesystems and read-only images are excluded, so `tmpfs`, `devtmpfs`, `squashfs`, `iso9660`, `udev`, and loopback devices do not count against the host. The threshold is a warning level rather than a failure point: a filesystem at 80 percent is working normally and is flagged because the remaining margin has grown thin.

        **Why this matters**

        A full filesystem does not degrade gracefully. Writes return an error, and most software handles that error badly. A database refuses transactions or shuts down to protect its files, a log writer drops records without saying so, a package manager aborts partway through an upgrade leaving half-configured packages, and a service that writes its state file at shutdown fails to and comes back with an inconsistent one. The failures arrive at once and are not obviously related to each other, which is what makes the incident take longer to diagnose than it should.

        The root filesystem filling is the worst version. With no space on `/`, the mechanisms used to recover need space themselves: shells cannot write history, the journal cannot record what happened, and package operations to clean up cannot run. On some configurations even logging in fails.

        Twenty percent of headroom is what turns that into a ticket instead. The gap between crossing the threshold and running out is the time available to find what grew, and where growth is usually logs or an accumulating cache, that is a routine cleanup rather than an outage.

        Treat a failing filesystem as a capacity question and not only as a cleanup. Deleting files buys time, and if usage returns to the threshold within a few weeks, the volume is undersized or something is retaining data it should be rotating.
      audit: |
        Run this command to inspect filesystem usage:

        ```bash
        df -hP -x tmpfs -x devtmpfs -x squashfs -x iso9660
        ```

        A passing result shows every persistent filesystem with a `Use%` value below 80 percent. A failing result shows one or more filesystems at 80 percent or higher.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Identify large files and directories consuming disk space:

            ```bash
            du -sh /* 2>/dev/null | sort -rh | head -20
            ```

            Clean up common sources of disk usage. Before deleting from `/tmp`, run the find command with `-print` instead of `-delete` to review what will be removed, because applications may still reference files there:

            ```bash
            # Remove journal logs older than 7 days
            journalctl --vacuum-time=7d

            # Clean package manager cache (Debian/Ubuntu)
            apt-get clean

            # Clean package manager cache (RHEL/CentOS)
            dnf clean all

            # Remove temporary files not accessed in 7 days
            find /tmp -mindepth 1 -type f -atime +7 -delete
            ```
        - id: script
          desc: |
            **Using a bash script**

            Run the following script as root to report filesystems over the threshold and reclaim space from common sources:

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            # Report filesystems at or above 80 percent usage
            df -P -x tmpfs -x devtmpfs -x squashfs -x iso9660 | awk 'NR > 1 { gsub("%", "", $5); if ($5 >= 80) print $6 " is at " $5 "%" }'

            # Reclaim space from journal logs older than 7 days
            journalctl --vacuum-time=7d

            # Clean the package manager cache
            if command -v apt-get > /dev/null 2>&1; then
              apt-get clean
            elif command -v dnf > /dev/null 2>&1; then
              dnf clean all
            elif command -v yum > /dev/null 2>&1; then
              yum clean all
            fi

            # Remove temporary files not accessed in 7 days
            find /tmp -mindepth 1 -type f -atime +7 -delete
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Free disk space by cleaning up common sources of usage with the following Ansible playbook:

            ```yaml
            ---
            - name: Reduce disk usage below 80%
              hosts: all
              become: true

              tasks:
                - name: Remove journal logs older than 7 days
                  ansible.builtin.command: journalctl --vacuum-time=7d
                  changed_when: true
                  when: ansible_service_mgr == "systemd"

                - name: Clean apt cache (Debian/Ubuntu)
                  ansible.builtin.apt:
                    autoclean: true
                    autoremove: true
                  when: ansible_os_family == "Debian"

                - name: Clean dnf cache (RHEL/CentOS)
                  ansible.builtin.command: dnf clean all
                  changed_when: true
                  when: ansible_os_family == "RedHat"

                - name: Find temporary files not accessed in 7 days
                  ansible.builtin.find:
                    paths: /tmp
                    age: 7d
                    age_stamp: atime
                    file_type: file
                  register: old_tmp_files

                - name: Delete old temporary files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    state: absent
                  loop: "{{ old_tmp_files.files }}"
            ```
  - uid: linux-operational-policy-memory-usage
    title: Ensure memory usage is under 80%
    impact: 60
    mql: |
      command("LC_ALL=C free | awk '/^Mem:/ {print $3/$2 * 100.0}'").stdout.trim < 80.0
    docs:
      desc: |
        This check verifies that the host is using less than 80 percent of its physical memory.

        The check reads the totals the kernel reports and compares used memory against the total as a percentage. Memory the kernel holds as page cache and reclaimable buffers is not counted as used, so the figure reflects what processes have actually committed rather than everything that is occupied. A host at 80 percent is not failing; it is running with a margin thin enough that the next allocation spike has nowhere to come from.

        **Why this matters**

        Unlike disk space, memory pressure does not announce itself. Long before anything fails, the kernel starts reclaiming. Page cache is dropped, so file reads that were served from memory go back to the disk, and anonymous pages are pushed out to swap, where every subsequent access costs a disk round trip. Throughput falls and latency turns erratic while every service still reports itself as healthy, which is why the symptom usually arrives as unexplained slowness rather than as a memory alert.

        When the margin is gone entirely, the kernel's out-of-memory killer picks a process and terminates it. Its choice is driven by memory footprint, so it usually selects the largest process on the host, which on a single-purpose machine is the service the machine exists to run. The process disappears without a graceful shutdown, and unless the journal is being read the only record is a kernel message nothing was watching for.

        Sustained high utilization is also the visible form of a leak. A process whose usage climbs steadily and never falls back will reach the limit eventually, and the only open question is whether that happens during working hours or overnight.

        Read a failing result as a question about the workload rather than only about the host. Identify which processes hold the memory and whether the growth is steady, and decide from that between restarting a leaking service, bounding it with a memory limit in its unit file, moving work elsewhere, or adding RAM.
      audit: |
        Run this command to inspect memory utilization:

        ```bash
        free -m
        ```

        A passing result shows used memory below 80 percent of the total. A failing result shows used memory at or above 80 percent of the total.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Identify the processes consuming the most memory:

            ```bash
            ps -eo pid,user,%mem,%cpu,rss,command --sort=-%mem | head -20
            ```

            Inspect memory and swap usage at a glance:

            ```bash
            free -h
            ```

            Restart the service that holds the most memory to release it. Substitute the unit that owns the top process for `myapp.service`. Restarting or stopping a service briefly interrupts what it serves, so schedule the action in a maintenance window:

            ```bash
            systemctl restart myapp.service
            ```

            For persistent pressure, right-size the workload: tune service memory limits with `MemoryHigh=` and `MemoryMax=` in systemd unit files, move workloads to another host, or scale the host's RAM.
        - id: script
          desc: |
            **Using a bash script**

            Run the following script as root to report utilization and the processes responsible, then restart or right-size the largest consumers:

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            # Show overall memory and swap utilization
            free -h

            # List the top 20 memory consumers
            ps -eo pid,user,%mem,rss,command --sort=-%mem | head -20

            # Print the current memory utilization percentage
            LC_ALL=C free | awk '/^Mem:/ { printf "Memory usage: %.1f%%\n", $3 / $2 * 100 }'
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Report memory utilization and the largest consumers, and restart an identified memory-leaking service, with the following Ansible playbook. Set `service_to_restart` to the offending unit name; restarting briefly interrupts the service:

            ```yaml
            ---
            - name: Investigate and reduce memory usage
              hosts: all
              become: true
              vars:
                service_to_restart: ""

              tasks:
                - name: Report current memory utilization
                  ansible.builtin.debug:
                    msg: >-
                      Memory usage is
                      {{ (ansible_memory_mb.nocache.used / ansible_memory_mb.real.total * 100) | round(1) }}%

                - name: List top memory consumers
                  ansible.builtin.command: ps -eo pid,user,%mem,rss,command --sort=-%mem
                  register: top_mem
                  changed_when: false

                - name: Show the top 20 memory consumers
                  ansible.builtin.debug:
                    msg: "{{ top_mem.stdout_lines[:21] }}"

                - name: Restart the identified memory-leaking service
                  ansible.builtin.systemd_service:
                    name: "{{ service_to_restart }}"
                    state: restarted
                  when: service_to_restart | length > 0
            ```
