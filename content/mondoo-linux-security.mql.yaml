    mql: |
      sshd.config.params["X11Forwarding"] == "no"
    docs:
      desc: |
        This check verifies that the SSH server does not tunnel X11 graphical sessions.

        The check reads `X11Forwarding` in `/etc/ssh/sshd_config`, which must be `no`. The directive must be present in the file; an absent `X11Forwarding` fails this check even though `no` is the OpenSSH default.

        **Why this matters**

        X11 forwarding sets up a proxy X display on the server and points the user's remote programs at it. Anything drawn to that display is relayed back to the display on the user's own workstation.

        The exposure runs from the server toward the client, which is the opposite of how it is usually described. The X protocol has no separation between clients of the same display, so any program that can reach the forwarded display can read every keystroke sent to it, capture the contents of other windows, and inject synthetic input. If the server is compromised, or if another local user on the server reaches the proxy display, the attacker gets the administrator's keyboard and screen on their own machine, including whatever they type into other applications there.

        Untrusted forwarding, requested with `ssh -X` rather than `-Y`, applies the X security extension to limit this, but it is the client that chooses, not the server. Leaving forwarding enabled on the server means relying on every user to make the safer choice every time.

        Where a graphical application genuinely must run on a server, enable forwarding in a `Match` block scoped to that account rather than globally.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*X11Forwarding\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows `X11Forwarding no`. A failing result shows `X11Forwarding yes`, or no output at all, which means the directive is absent.

        Do not verify this check with `sshd -T`. That command prints the effective configuration including OpenSSH's built-in defaults, so on a host where the directive is absent it reports `x11forwarding no` while this check reads the configuration file and fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works.

            To disable SSH X11 forwarding, edit the `/etc/ssh/sshd_config` file and add or modify the following line:

            ```bash
            X11Forwarding no
            ```

            The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads `/etc/ssh/sshd_config.d/` first, in lexical order. Red Hat Enterprise Linux and Ubuntu ship their own snippets in that directory, so a value added to `/etc/ssh/sshd_config` has no effect once one of those snippets sets the same keyword. Check the directory, and where it is in use put the value in a drop-in numbered below the vendor snippets:

            ```bash
            grep -ri 'X11Forwarding' /etc/ssh/sshd_config.d/
            touch /etc/ssh/sshd_config.d/00-hardening.conf
            chmod 600 /etc/ssh/sshd_config.d/00-hardening.conf
            echo 'X11Forwarding no' >> /etc/ssh/sshd_config.d/00-hardening.conf
            ```

            Validate the configuration before restarting:

            ```bash
            sshd -t
            ```

            Restart the SSH service to apply the changes:

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To disable SSH X11 forwarding, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            if grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
              SSHD_CONFIG=/etc/ssh/sshd_config.d/00-hardening.conf
              mkdir -p /etc/ssh/sshd_config.d
              touch "$SSHD_CONFIG"
              chmod 600 "$SSHD_CONFIG"
            else
              SSHD_CONFIG=/etc/ssh/sshd_config
            fi

            if grep -q '^X11Forwarding' "$SSHD_CONFIG"; then
              echo "Updating X11Forwarding to no in $SSHD_CONFIG..."
              sed -i 's/^X11Forwarding.*/X11Forwarding no/' "$SSHD_CONFIG"
            else
              echo "Adding X11Forwarding no to $SSHD_CONFIG..."
              echo "X11Forwarding no" >> "$SSHD_CONFIG"
            fi

            # Validate the new configuration before restarting. A syntax error here can lock you out of SSH.
            sshd -t

            # Restart the SSH service. The unit is "ssh" on Debian/Ubuntu and "sshd" on other distributions.
            if systemctl list-unit-files | grep -q '^ssh\.service'; then
              systemctl restart ssh
            else
              systemctl restart sshd
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To disable SSH X11 forwarding, use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure SSH X11Forwarding is disabled
              hosts: all
              become: true

              tasks:
                - name: Detect whether sshd reads drop-in configuration files
                  ansible.builtin.command: grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
                  register: sshd_include
                  changed_when: false
                  failed_when: false

                # sshd uses the first value it reads for each keyword, and the Include at the top of
                # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order, so a drop-in numbered
                # below the vendor snippets is the only place a new value reliably wins.
                - name: Select the configuration file sshd reads first
                  ansible.builtin.set_fact:
                    sshd_target: "{{ '/etc/ssh/sshd_config.d/00-hardening.conf' if sshd_include.rc == 0 else '/etc/ssh/sshd_config' }}"

                - name: Ensure the hardening drop-in exists
                  ansible.builtin.copy:
                    dest: "{{ sshd_target }}"
                    content: ""
                    force: false
                    owner: root
                    group: root
                    mode: '0600'

                - name: Set X11Forwarding to no in sshd_config
                  ansible.builtin.lineinfile:
                    path: "{{ sshd_target }}"
                    regexp: '^X11Forwarding'
                    line: 'X11Forwarding no'
                  register: ssh_config_change

                - name: Gather service facts to detect the SSH unit name
                  ansible.builtin.service_facts:
                  when: ssh_config_change.changed

                - name: Restart the SSH service
                  ansible.builtin.systemd:
                    name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
                    state: restarted
                  when: ssh_config_change.changed
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to disable X11 forwarding:

            ```ruby
            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            sshd_include = ::File.exist?('/etc/ssh/sshd_config') &&
                           ::File.read('/etc/ssh/sshd_config').match?(%r{^\s*Include\s+/etc/ssh/sshd_config\.d/})
            sshd_config = sshd_include ? '/etc/ssh/sshd_config.d/00-hardening.conf' : '/etc/ssh/sshd_config'
            ssh_service = platform_family?('debian') ? 'ssh' : 'sshd'

            directory '/etc/ssh/sshd_config.d' do
              owner 'root'
              group 'root'
              mode '0755'
              only_if { sshd_include }
            end

            file sshd_config do
              owner 'root'
              group 'root'
              mode '0600'
              action :create_if_missing
            end

            service ssh_service do
              action :nothing
            end

            { 'X11Forwarding' => 'no' }.each do |keyword, value|
              ruby_block "set #{keyword} in sshd_config" do
                block do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  body = if body.match?(/^\s*#{keyword}\b/i)
                           body.gsub(/^\s*#{keyword}\b.*$/i, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(sshd_config, body)
                end
                not_if { ::File.read(sshd_config).match?(/^\s*#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, "service[#{ssh_service}]", :delayed
              end
            end
            ```
