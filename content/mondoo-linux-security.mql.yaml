  - uid: mondoo-linux-security-reverse-path-filtering-is-enabled
    title: Ensure reverse path filtering is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.conf.all.rp_filter'] == 1
      kernel.parameters['net.ipv4.conf.default.rp_filter'] == 1
    docs:
      desc: |
        This check verifies that reverse path filtering is enabled in strict mode.

        Reverse path filtering is the kernel's anti-spoofing test on inbound traffic: for each arriving packet it asks whether the route back to the claimed source address would use the interface the packet arrived on, and drops the packet when it would not. The check reads the kernel parameters `net.ipv4.conf.all.rp_filter` and `net.ipv4.conf.default.rp_filter`, both of which must be `1`. Loose mode, value `2`, accepts a packet when a route to the source exists through any interface and does not satisfy this check.

        **Why this matters**

        Source addresses in IP are asserted by the sender and verified by nothing. Reverse path filtering is the host's own means of catching the ones that cannot be true.

        That matters because a great deal of security configuration trusts source addresses. Firewall rules that permit a management network, application allowlists, and services that treat traffic from a local subnet as internal all make decisions on a field the sender chose. Without reverse path filtering, an attacker on an external interface can claim an internal address and be treated accordingly.

        The filter also prevents the host from being used against others. Reflection and amplification attacks depend on forged source addresses, and a host that drops packets whose source is inconsistent with their arrival interface cannot be recruited into one.

        Strict mode is correct for hosts with a single default route, which is most servers. Multi-homed hosts and those using policy routing or asymmetric paths may legitimately need loose mode, in which case set an exception for this check rather than disabling the filter entirely, since loose mode still catches addresses that are not routable at all.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv4.conf.all.rp_filter
        sysctl net.ipv4.conf.default.rp_filter
        ```

        A passing result shows every listed parameter set to `1`. A failing result shows any parameter set to `0` or absent.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            **Warning: strict reverse path filtering can break asymmetric routing.** Setting `rp_filter = 1` (strict mode) drops return traffic that would leave through a different interface than the one it arrived on. On routers, multihomed hosts, VPN gateways, and load-balancer nodes this silently breaks legitimate connectivity. On those hosts use loose mode (`rp_filter = 2`), which still validates that a route to the source exists but does not require the same interface. Loose mode does not satisfy this check, so record it as a documented exception, and verify connectivity after applying any change. Drop-in files must end in `.conf` to be loaded.

            1. Set the following parameters in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv4.conf.all.rp_filter = 1
                net.ipv4.conf.default.rp_filter = 1
                ```

            2. Run these commands to set the active kernel parameters and reload the persisted drop-in files:

                ```bash
                sysctl -w net.ipv4.conf.all.rp_filter=1
                sysctl -w net.ipv4.conf.default.rp_filter=1
                sysctl -w net.ipv4.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            **Warning: strict reverse path filtering can break asymmetric routing.** Strict mode (`rp_filter = 1`) drops return traffic that arrives on a different interface than the kernel would use to reach the source. On routers, multihomed hosts, VPN gateways, and load balancers use loose mode (`rp_filter = 2`) instead and record it as a documented exception, then verify connectivity after applying. Use this Bash script to enable reverse path filtering and persist the settings.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^net.ipv4.conf.all.rp_filter' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.conf.all.rp_filter to 1 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.conf.all.rp_filter.*/net.ipv4.conf.all.rp_filter = 1/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.conf.all.rp_filter to 1 in /etc/sysctl.d/99-enable-reverse-path-filtering.conf"
              echo "net.ipv4.conf.all.rp_filter = 1" >> /etc/sysctl.d/99-enable-reverse-path-filtering.conf
            fi

            if grep -q '^net.ipv4.conf.default.rp_filter' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.conf.default.rp_filter to 1 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.conf.default.rp_filter.*/net.ipv4.conf.default.rp_filter = 1/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.conf.default.rp_filter to 1 in /etc/sysctl.d/99-enable-reverse-path-filtering.conf"
              echo "net.ipv4.conf.default.rp_filter = 1" >> /etc/sysctl.d/99-enable-reverse-path-filtering.conf
            fi

            sysctl -w net.ipv4.conf.all.rp_filter=1
            sysctl -w net.ipv4.conf.default.rp_filter=1
            sysctl -w net.ipv4.route.flush=1

            # Reload all persisted sysctl drop-in files so the saved values take effect.
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Strict reverse path filtering (`rp_filter = 1`) can break asymmetric and multihomed routing on routers, VPN gateways, and load balancers. Use loose mode (`value: '2'`) on those hosts and record it as a documented exception, then verify connectivity after applying. Use this Ansible playbook to set the kernel parameters:

            ```yaml
            ---
            - name: Enable Reverse Path Filtering
              hosts: all
              become: true

              tasks:
                - name: Ensure Reverse Path Filtering is enabled in sysctl configuration
                  ansible.builtin.sysctl:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                    sysctl_file: /etc/sysctl.d/99-enable-reverse-path-filtering.conf
                    state: present
                    sysctl_set: true
                    reload: yes
                  loop:
                    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
                    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to enable reverse path filtering. Asymmetric routing setups need `2` for loose mode instead of `1`:

            ```ruby
            sysctl 'net.ipv4.conf.all.rp_filter' do
              value 1
            end

            sysctl 'net.ipv4.conf.default.rp_filter' do
              value 1
            end
            ```
    refs:
      - url: https://www.kernel.org/doc/html/latest/admin-guide/sysctl/
        title: Linux Kernel sysctl Documentation
  - uid: mondoo-linux-security-tcp-syn-cookies-is-enabled
    title: Ensure TCP SYN cookies are enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.tcp_syncookies'] == 1
    docs:
      desc: |
        This check verifies that TCP SYN cookies are enabled.

        SYN cookies are the kernel's defense against having its TCP connection backlog exhausted: when the backlog fills, it encodes the connection state into the sequence number it sends back and reconstructs that state from the client's reply, rather than refusing new connections. The check reads the kernel parameter `net.ipv4.tcp_syncookies`, which must be `1`.

        **Why this matters**

        Opening a TCP connection takes three packets. The kernel allocates state after the first one and holds it while waiting for the third. An attacker who sends the first packet and never completes the handshake leaves that state allocated, and enough of them fill the backlog. Legitimate connections are then refused, and the service is down without a single one of its own processes being touched.

        The attack is cheap in a way that matters. The attacker never completes a handshake, so they never have to receive anything, which means the source addresses can be forged and the traffic is difficult to attribute or filter.

        SYN cookies remove the asymmetry. By deriving the state from the reply rather than storing it, the kernel stops needing memory per half-open connection, so the backlog cannot be exhausted and legitimate clients continue to connect throughout.

        The mechanism engages only when the backlog is actually full, so there is no cost in normal operation. The tradeoff when it does engage is that a few TCP options negotiated during the handshake cannot be carried in the cookie, which is a reasonable price for staying reachable.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv4.tcp_syncookies
        ```

        A passing result shows every listed parameter set to `1`. A failing result shows any parameter set to `0` or absent.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Set the following parameter in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv4.tcp_syncookies = 1
                ```

            2. Run these commands to set the active kernel parameters:

                ```bash
                sysctl -w net.ipv4.tcp_syncookies=1
                sysctl -w net.ipv4.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to enable TCP SYN Cookies and persist the setting.

            ```bash
            #!/bin/bash
            set -e

            # Set net.ipv4.tcp_syncookies
            if grep -q '^net.ipv4.tcp_syncookies' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.tcp_syncookies to 1 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.tcp_syncookies.*/net.ipv4.tcp_syncookies = 1/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.tcp_syncookies to 1 in /etc/sysctl.d/99-enable-tcp-syncookies.conf"
              echo "net.ipv4.tcp_syncookies = 1" >> /etc/sysctl.d/99-enable-tcp-syncookies.conf
            fi

            sysctl -w net.ipv4.tcp_syncookies=1
            sysctl -w net.ipv4.route.flush=1
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the kernel parameters:

            ```yaml
            ---
            - name: Enable TCP SYN Cookies
              hosts: all
              become: true

              tasks:
                - name: Ensure TCP SYN Cookies is enabled in sysctl configuration
                  ansible.builtin.sysctl:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                    sysctl_file: /etc/sysctl.d/99-enable-tcp-syncookies.conf
                    state: present
                    sysctl_set: true
                    reload: yes
                  loop:
                    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to enable TCP SYN cookies:

            ```ruby
            sysctl 'net.ipv4.tcp_syncookies' do
              value 1
            end
            ```
