                    dest: "{{ sshd_target }}"
                    content: ""
                    force: false
                    owner: root
                    group: root
                    mode: '0600'

                - name: Ensure Banner is set in sshd_config
                  ansible.builtin.lineinfile:
                    path: "{{ sshd_target }}"
                    regexp: '^Banner'
                    line: 'Banner /etc/issue.net'
                    create: yes
                    state: present
                - name: Gather service facts to detect the SSH unit name
                  ansible.builtin.service_facts:

                - name: Restart the SSH service
                  ansible.builtin.systemd:
                    name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to present a warning banner before authentication:

