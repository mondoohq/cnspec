          desc: |
            **Using CLI**

            Run these commands to stop and disable `ntalk` and `talkd`:

            ```bash
            systemctl stop ntalk talkd
            systemctl disable ntalk talkd
            ```

            Typically only one of these alternative units is installed. A unit that is not installed reports an error that can be ignored; the commands still apply to the units that exist.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable talk server services.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling talk server services..."
            for unit in ntalk.service talkd.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `ntalk` and `talkd`:

            ```yaml
            ---
            - name: Stop and disable talk server services
              hosts: all
              become: true

              tasks:
                - name: Ensure talk server services are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - ntalk
                    - talkd
                  register: talk_units
                  failed_when:
                    - talk_units.failed
                    - "'Could not find the requested service' not in (talk_units.msg | default(''))"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the talk server units:

            ```ruby
            %w(ntalk.service talkd.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
