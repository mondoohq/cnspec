    docs:
      desc: |
        This check verifies that `/etc/shadow` carries no execute bit for the owner, no write or execute permission for the group, and no access at all for other users. Group read is permitted, because Debian-based distributions assign the file to a dedicated `shadow` group. The expected mode is `0640` on Debian and derivatives, and `0000` or `0600` on Red Hat and SUSE.

        **Why this matters**

        This file holds the password hashes. Excluding read access for other users is the point of the check, because an attacker who obtains the hashes does not need any further access to the host to attack them.

        Once copied, hashes are cracked offline, at whatever rate the attacker's hardware allows, with no failed-login records, no lockouts, and no rate limiting. Every control that protects the login path stops applying the moment the hashes leave the machine. Password reuse then extends the damage well beyond this host, since a recovered password frequently works elsewhere.

        Write access is worse still. An attacker who can modify the file can replace an account's hash with one they generated, or empty the password field entirely, and then log in as that account.

        The file also carries password aging data, so tampering can disable expiry on an account and keep a stale credential valid indefinitely.

        Keep the `shadow` group empty on distributions that use it. The group read bit is only safe while nothing is a member.
