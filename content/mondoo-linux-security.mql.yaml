      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.conf.all.secure_redirects'] == 0
        || kernel.parameters['net.ipv4.conf.all.secure_redirects'] == null
      kernel.parameters['net.ipv4.conf.default.secure_redirects'] == 0
        || kernel.parameters['net.ipv4.conf.default.secure_redirects'] == null
    docs:
      desc: |
        This check verifies that the host ignores secure ICMP redirect messages as well as ordinary ones.

        Secure redirects are the narrower form of the same behavior: the host honors redirect messages, but only when they appear to come from a router already listed as one of its default gateways. The check reads `net.ipv4.conf.all.secure_redirects` and `net.ipv4.conf.default.secure_redirects`, each of which must be `0` or unset.

        **Why this matters**

        The constraint sounds meaningful and is weaker than it appears. The check is on the source address of the redirect, and ICMP runs over IP with no authentication, so an attacker on the same segment simply forges the gateway's address. Being on the list of default gateways is not something a sender has to prove.

        Even where the source is genuine, the setting means the host will accept routing changes from a gateway at any time, without notice. A compromised router, or one an attacker has managed to become through a rogue DHCP server or router advertisement, then holds the ability to redirect this host's traffic wherever it likes.

        Disabling both forms leaves the host's routing determined solely by its own configuration. That is also what makes network behavior diagnosable: a host whose routing table can change in response to unauthenticated messages does not behave the same way twice, and troubleshooting it means chasing state that no configuration file records.
