      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      systemd.socket("telnet").enabled == false
      systemd.socket("telnet").running == false
    docs:
      desc: |-
        This check verifies that the `telnet` systemd socket unit is neither running nor enabled.

        **Why this matters**

        Telnet has no encryption and no integrity protection. The username and password are sent as plaintext at the start of the session, and every command and response afterward travels the same way.

        Anyone able to observe the traffic captures a working administrative credential. That includes anyone on the same network segment, anyone who has compromised a switch or router along the path, and anyone operating infrastructure between the endpoints. Because there is no integrity protection either, an attacker in that position can also modify the session in flight, injecting commands into an authenticated shell without needing the password at all.

        Telnet is also a standing target for automated attack. Internet-wide scanners probe port 23 continuously, and the credential-guessing botnets that assemble from the results have been among the largest ever observed, precisely because the protocol offers no rate limiting or key-based alternative.

        SSH provides the same interactive access with authentication and encryption. Disable the socket unit and remove the server package.
