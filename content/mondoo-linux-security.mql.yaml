  - uid: mondoo-linux-security-snmp-server-is-not-enabled
    title: Ensure SNMP server is stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("snmpd").enabled == false
      service("snmpd").running == false
    docs:
      desc: |
        This check verifies that the `snmpd` service is neither running nor enabled at boot.

        **Why this matters**

        Net-SNMP ships with the community string `public` on many distributions, and SNMPv1 and v2c send that string in cleartext with no other authentication. Anyone who can reach UDP port 161 and either guess or observe the string can walk the entire MIB tree.

        What that returns is a complete host inventory: running processes and their command lines, listening ports, network interfaces and addresses, installed software and versions, mounted filesystems, and the routing table. Command lines alone frequently contain credentials passed as arguments. This is the reconnaissance an attacker would otherwise spend considerable effort and noise assembling, delivered in a single walk that looks like ordinary monitoring traffic.

        A writable community string is worse, since it allows configuration changes through SNMP SET operations.

        Where SNMP monitoring is required, use SNMPv3 with authentication and privacy enabled, restrict the listener to the management network, and limit the accessible view to the objects the monitoring system actually collects.
      audit: |
        Run this command to confirm the SNMP server service is stopped and disabled:

        ```bash
        systemctl is-active snmpd
        systemctl is-enabled snmpd
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run these commands to stop and disable `snmpd`:

            ```bash
            systemctl stop snmpd
            systemctl disable snmpd
            ```

            Note: Since the `snmpd` service is often interdependent with other services, it might not be enough to disable the service because other services will likely restart the service automatically.

            To make the service `snmpd` invisible to other services run this command:

            ```bash
            systemctl mask snmpd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the SNMP server.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping, disabling, and masking the snmpd service..."
            systemctl stop snmpd
            systemctl disable snmpd
            systemctl mask snmpd
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `snmpd`:

            ```yaml
            ---
            - name: Stop and disable SNMP server
              hosts: all
              become: true

              tasks:
                - name: Ensure SNMP server (snmpd) is stopped and disabled
                  ansible.builtin.systemd:
                    name: snmpd
                    state: stopped
                    masked: true
                    enabled: no
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop, disable, and mask the SNMP server:

            ```ruby
            systemd_unit 'snmpd.service' do
              action %i(stop disable mask)
              only_if 'systemctl cat snmpd.service'
            end
            ```
    refs:
      - url: https://www.freedesktop.org/wiki/Software/systemd/
        title: systemd System and Service Manager
  - uid: mondoo-linux-security-mail-transfer-agent-is-configured-for-local-only-mode
    title: Ensure mail transfer agent is configured for local-only mode
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      if( package("postfix").installed && service('postfix').running ) {
        postfix.inetInterfaces.containsOnly(["localhost", "loopback-only", "127.0.0.1", "::1"])
      }
      if( package("exim4").installed && service('exim4').running ) {
        exim.localInterfaces.length > 0 && exim.localInterfaces.containsOnly(["127.0.0.1", "::1"])
      }
      ports.listening.where(address != "127.0.0.1" && address != "[::1]").none(port == 25)
    docs:
      desc: |
        This check verifies that the host's mail transfer agent accepts connections only on the loopback interface. For Postfix it requires `inet_interfaces` to list only loopback addresses, for Exim it requires `local_interfaces` to be restricted to `127.0.0.1` and `::1`, and it confirms that no MTA process is listening on any other address.

        **Why this matters**

        Most Linux distributions install an MTA by default so that cron output and system notifications have somewhere to go. That local delivery role needs nothing beyond the loopback interface. When the daemon listens on an external address instead, it takes on the exposure of a mail server without any of the configuration a real mail server would receive.

        The first consequence is relaying. An MTA that accepts mail from the network without a reviewed relay policy will forward it, and an open relay is found by scanners within hours. The host is then used to send spam and phishing, and the organization's address space lands on public blocklists, which breaks legitimate mail from every other host that shares it.

        The second is that SMTP parsing happens before authentication. Exim and Postfix both process attacker-controlled input from any client that can open a connection, and Exim in particular has had pre-authentication flaws that gave remote root.

        Where the host is a real mail server, that is a deliberate role with an explicit relay policy, TLS, and authentication. Everywhere else, bind the MTA to loopback.
      audit: |
        Run these commands to confirm the mail transfer agent listens only on the loopback interface:

        ```bash
        postconf inet_interfaces
        grep -E '^dc_local_interfaces' /etc/exim4/update-exim4.conf.conf
        grep DAEMON_OPTIONS /etc/mail/sendmail.mc
        ss -lntp | grep ':25'
        ```

        A passing result shows Postfix `inet_interfaces` set to `localhost` or `loopback-only` (or Exim bound to `127.0.0.1` and `::1`, or Sendmail `DAEMON_OPTIONS` bound to `127.0.0.1`), and no listener on port 25 outside the loopback addresses. A failing result shows the MTA bound to an external address on port 25.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. For Postfix, set `inet_interfaces` to `loopback-only` with `postconf`, which updates `/etc/postfix/main.cf` whether or not the directive already exists:

                ```bash
                postconf -e 'inet_interfaces = loopback-only'
                ```

            2. Restart Postfix:

                ```bash
                systemctl restart postfix
                ```

            3. For Exim4, edit the Exim4 configuration file:

                ```bash
                vi /etc/exim4/update-exim4.conf.conf
                ```

            4. Find the line that sets `dc_local_interfaces` and modify it to:

                ```ini
                dc_local_interfaces='127.0.0.1 ; ::1'
                ```

            5. Regenerate the Exim4 runtime configuration and restart the service:

                ```bash
                update-exim4.conf
                systemctl restart exim4
                ```

            6. For Sendmail, edit `/etc/mail/sendmail.mc` and ensure the daemon binds only to the loopback address:

                ```text
                DAEMON_OPTIONS(`Port=smtp,Addr=127.0.0.1, Name=MTA')dnl
                ```

            7. Rebuild the Sendmail configuration and restart the service:

                ```bash
                make -C /etc/mail
                systemctl restart sendmail
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to configure the MTA for local-only mode.

            ```bash
            #!/bin/bash
            set -e

            if command -v postconf >/dev/null 2>&1; then
              echo "Configuring Postfix for local-only mode..."
              postconf -e 'inet_interfaces = loopback-only'
              systemctl restart postfix
            else
              echo "Postfix not found. Skipping Postfix configuration."
            fi

            if [[ -f /etc/exim4/update-exim4.conf.conf ]]; then
              echo "Configuring Exim4 for local-only mode..."
              sed -i "s/^dc_local_interfaces=.*/dc_local_interfaces='127.0.0.1 ; ::1'/" /etc/exim4/update-exim4.conf.conf
              update-exim4.conf
              systemctl restart exim4
            else
              echo "Exim4 configuration file not found. Skipping Exim4 configuration."
            fi
            ```

            The Postfix portion uses `postconf -e` because it updates `inet_interfaces` whether or not the directive already exists in `main.cf`. The Exim sed pattern matches the `dc_local_interfaces='...'` format that `update-exim4.conf.conf` uses, which has no spaces around the equals sign.
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to ensure the Postfix is configured for local-only mode:

            ```yaml
            ---
            - name: Ensure mail transfer agent is configured for local-only mode
              hosts: all
              become: true

              tasks:
                - name: Check whether Postfix is installed
                  ansible.builtin.stat:
                    path: /etc/postfix/main.cf
                  register: postfix_main_cf

                - name: Configure Postfix for local-only mode
                  ansible.builtin.lineinfile:
                    path: /etc/postfix/main.cf
                    regexp: '^inet_interfaces'
                    line: 'inet_interfaces = loopback-only'
                    state: present
                  when: postfix_main_cf.stat.exists
                  register: postfix_config_change

                - name: Restart Postfix
                  ansible.builtin.systemd:
                    name: postfix
                    state: restarted
                  when: postfix_config_change.changed
            ```

            Use this Ansible playbook to ensure the Exim4 is configured for local-only mode:

            ```yaml
            ---
            - name: Ensure Exim4 is configured for local-only mode
              hosts: all
              become: true

              tasks:
                - name: Check whether Exim4 is installed
                  ansible.builtin.stat:
                    path: /etc/exim4/update-exim4.conf.conf
                  register: exim4_conf

                - name: Configure Exim4 for local-only mode
                  ansible.builtin.lineinfile:
                    path: /etc/exim4/update-exim4.conf.conf
                    regexp: '^dc_local_interfaces'
                    line: "dc_local_interfaces='127.0.0.1 ; ::1'"
                    state: present
                  when: exim4_conf.stat.exists
                  register: exim4_config_change

                - name: Regenerate Exim4 configuration
                  ansible.builtin.command:
                    cmd: update-exim4.conf
                  when: exim4_config_change.changed

                - name: Restart Exim4
                  ansible.builtin.systemd:
                    name: exim4
                    state: restarted
                  when: exim4_config_change.changed
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to bind Postfix to the loopback interface:

            ```ruby
            main_cf = '/etc/postfix/main.cf'

            service 'postfix' do
              action :nothing
            end

            ruby_block 'bind Postfix to the loopback interface' do
              block do
                body = ::File.read(main_cf)
                directive = 'inet_interfaces = loopback-only'
                body = if body.match?(/^\s*inet_interfaces\s*=/)
                         body.gsub(/^\s*inet_interfaces\s*=.*$/, directive)
                       else
                         "#{body.chomp}\n#{directive}\n"
                       end
                ::File.write(main_cf, body)
              end
              # File.read raises Errno::ENOENT on a host that does not run Postfix, so the
              # existence test has to come before the content test in the same guard.
              only_if { ::File.exist?(main_cf) }
              not_if { ::File.exist?(main_cf) && ::File.read(main_cf).match?(/^inet_interfaces\s*=\s*loopback-only\s*$/) }
              notifies :restart, 'service[postfix]', :delayed
            end
            ```

            Use this Chef Infra recipe code to bind Exim4 to the loopback interface:

            ```ruby
            exim_conf = '/etc/exim4/update-exim4.conf.conf'

            service 'exim4' do
              action :nothing
            end

            execute 'regenerate the Exim4 configuration' do
              command 'update-exim4.conf'
              action :nothing
              notifies :restart, 'service[exim4]', :delayed
            end

            ruby_block 'bind Exim4 to the loopback interface' do
              block do
                body = ::File.read(exim_conf)
                directive = "dc_local_interfaces='127.0.0.1 ; ::1'"
                body = if body.match?(/^\s*dc_local_interfaces\s*=/)
                         body.gsub(/^\s*dc_local_interfaces\s*=.*$/, directive)
                       else
                         "#{body.chomp}\n#{directive}\n"
                       end
                ::File.write(exim_conf, body)
              end
              # File.read raises Errno::ENOENT on a host that does not run Exim4, so the
              # existence test has to come before the content test in the same guard.
              only_if { ::File.exist?(exim_conf) }
              not_if { ::File.exist?(exim_conf) && ::File.read(exim_conf).match?(/^dc_local_interfaces='127\.0\.0\.1 ; ::1'\s*$/) }
              notifies :run, 'execute[regenerate the Exim4 configuration]', :delayed
            end
            ```
