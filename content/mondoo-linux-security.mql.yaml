  - uid: mondoo-linux-security-events-that-modify-date-and-time-information-are-collected
    title: Ensure events that modify date and time information are audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      // 64-bit syscall rules for time modification
      syscalls_64bit = ["adjtimex", "settimeofday", "clock_settime"]
      desiredRules64 = auditd.rules.syscalls.where(
        syscalls.any(_.in(syscalls_64bit))
        && arch == "b64"
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat
      desiredRules64.containsAll(syscalls_64bit)

      // 32-bit syscall rules for time modification (includes stime)
      syscalls_32bit = ["adjtimex", "settimeofday", "clock_settime", "stime"]
      desiredRules32 = auditd.rules.syscalls.where(
        syscalls.any(_.in(syscalls_32bit))
        && arch == "b32"
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat
      desiredRules32.containsAll(syscalls_32bit)

      // Watch rule for /etc/localtime
      auditd.rules.files.contains(
        path == "/etc/localtime"
        && permissions == "wa"
        && keyname != empty
      )
    docs:
      desc: |
        This check verifies that audit rules record the `adjtimex`, `settimeofday`, and `clock_settime` system calls on both 32-bit and 64-bit architectures, each with `action always` and a non-empty key, along with a watch on the system's timezone configuration.

        **Why this matters**

        Every log entry on this host and every other one is ordered by a timestamp. Correlating an event on a web server with one on a database server, or reconstructing the sequence of actions in an intrusion, depends entirely on those timestamps being comparable.

        Moving the clock breaks that, and it breaks it retroactively across every system that ingests logs from this host. Entries written after the change sort into the wrong position, appearing before events that actually preceded them or interleaving with an unrelated period. An attacker who sets the clock back writes their activity into a window that has already been reviewed; one who sets it forward pushes it beyond the range an investigator is looking at.

        Time changes have effects beyond logging. Certificate validity, Kerberos ticket lifetimes, and token expiry are all evaluated against the local clock, so a large enough shift causes expired credentials to be accepted or valid ones to be refused.

        Auditing the syscalls rather than the output of `date` is what makes this reliable, since any program can adjust the clock through them, not only the command-line tools. Note that `ntpd` and `chrony` adjust time through these same calls, so expect routine records from them and filter by process when reviewing.
      audit: |
        Run this command to confirm the audit rules for date and time modification events are loaded:

        ```bash
        auditctl -l | grep -E -- '(adjtimex|settimeofday|stime|clock_settime|/etc/localtime)'
        ```

        A passing result lists the expected audit rules with any non-empty audit key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-time_change.rules`

            2. Add the following lines to the configuration file:

                ```text
                -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change
                -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
                -a always,exit -F arch=b32 -S clock_settime -k time-change
                -a always,exit -F arch=b64 -S clock_settime -k time-change
                -w /etc/localtime -p wa -k time-change
                ```

            3. To load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            4. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to configure the auditd rules for date and time changes.

            ```bash
            #!/bin/bash
            set -e

            RULES_FILE="/etc/audit/rules.d/50-time_change.rules"

            echo "Ensuring audit rules for time changes are configured"
            cat > "$RULES_FILE" <<EOF
            -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change
            -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
            -a always,exit -F arch=b32 -S clock_settime -k time-change
            -a always,exit -F arch=b64 -S clock_settime -k time-change
            -w /etc/localtime -p wa -k time-change
            EOF

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for date and time changes:

            ```yaml
            ---
            - name: Configure audit rules for time change events
              hosts: all
              become: true

              tasks:
                - name: Ensure required time-change audit rules are present
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-time_change.rules
                    block: |
                      -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change
                      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
                      -a always,exit -F arch=b32 -S clock_settime -k time-change
                      -a always,exit -F arch=b64 -S clock_settime -k time-change
                      -w /etc/localtime -p wa -k time-change
                    create: yes
                    owner: root
                    group: root
                    mode: '0640'
                  register: audit_rules_updated

                - name: Reload audit rules if file was updated
                  ansible.builtin.command: augenrules --load
                  when: audit_rules_updated.changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Notify if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit changes to the system clock:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/50-time_change.rules' do
              content <<~RULES
                -a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change
                -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
                -a always,exit -F arch=b32 -S clock_settime -k time-change
                -a always,exit -F arch=b64 -S clock_settime -k time-change
                -w /etc/localtime -p wa -k time-change
              RULES
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
