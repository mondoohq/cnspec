      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      auditdRuleFiles = auditd.rules.files + auditd.rules(path: "/etc/audit/audit.rules").files

      appArmorPaths = ["/etc/apparmor", "/etc/apparmor.d"]
      appArmorConfigured = appArmorPaths.all(p:
        auditdRuleFiles.contains( f:
          f.path.in([p, p + "/"])
          && f.permissions.contains("w")
          && f.permissions.contains("a")
          && f.keyname != empty
        )
      )

      seLinuxPaths = ["/etc/selinux", "/usr/share/selinux"]
      seLinuxConfigured = seLinuxPaths.all(p:
        auditdRuleFiles.contains( f:
          f.path.in([p, p + "/"])
          && f.permissions.contains("w")
          && f.permissions.contains("a")
          && f.keyname != empty
        )
      )

      appArmorConfigured || seLinuxConfigured
    docs:
      desc: |
        This check verifies that audit watch rules with a write and attribute mask and a non-empty key cover the mandatory access control configuration directories, which are `/etc/selinux` and `/usr/share/selinux` on SELinux systems and `/etc/apparmor` and `/etc/apparmor.d` on AppArmor systems.

        **Why this matters**

        SELinux and AppArmor are what stop a compromised service from reaching beyond the files and capabilities it needs. A web server exploited through an application flaw is confined to what its policy permits, which is usually not enough to matter.

        Weakening that policy is therefore a deliberate step taken to enable something else, and it is one of the more reliable indicators available. Setting a domain to permissive, disabling a profile, or editing a policy file to grant an additional access is not something that happens by accident on a running production host, and it almost always precedes an action the policy was blocking.

        The change is also easy to miss without these rules. `setenforce 0` leaves the configuration files untouched and reverts at the next boot, and a policy module loaded at runtime does not appear in a review of `/etc/selinux/config`. Watching the configuration directories catches the persistent half, and the runtime half shows up as an absence of the AVC denials that were being recorded before.

        Note that package updates legitimately modify these directories, so expect records from `dnf` and `apt` and correlate against the package transaction log when reviewing.
      audit: |
        This check inspects the **persistent** audit rule files on disk — the `.rules` files in `/etc/audit/rules.d/` and the compiled `/etc/audit/audit.rules` — rather than the ruleset currently loaded in the kernel. The rules must be present in these files so they are reapplied on every boot.

        Confirm the rules are written to a persistent rules file:

        ```bash
        grep -rsE -- '^-w.*(selinux|apparmor).*-p[[:blank:]]*([rx]*w[rx]*a|[rx]*a[rx]*w)' /etc/audit/rules.d/ /etc/audit/audit.rules
        ```

        The check passes when the persistent rules define a complete Mandatory Access Control set with `wa` permissions and any non-empty audit key — either both AppArmor paths:

        ```text
        -w /etc/apparmor -p wa -k MAC-policy
        -w /etc/apparmor.d -p wa -k MAC-policy
        ```

        or both SELinux paths:

        ```text
        -w /etc/selinux -p wa -k MAC-policy
        -w /usr/share/selinux -p wa -k MAC-policy
        ```

        You can also confirm the rules are active in the running kernel:

        ```bash
        auditctl -l | grep -E -- '^-w.*(selinux|apparmor).*-p[[:blank:]]*([rx]*w[rx]*a|[rx]*a[rx]*w)'
        ```

        Note that `auditctl -l` reports the *running* ruleset, which can differ from what is stored on disk. If `auditctl -l` lists the rules but this check still reports a failure, the rules were loaded into the kernel but are not persisted in a `.rules` file under `/etc/audit/rules.d/` (or in `/etc/audit/audit.rules`). Persist them to a rules file and reload — see the remediation below.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-MAC_policy.rules`

            2. Add the following lines, for SELinux:

                ```text
                -w /etc/selinux -p wa -k MAC-policy
                -w /usr/share/selinux -p wa -k MAC-policy
                ```

            3. Add the following lines, for AppArmor:

                ```text
                -w /etc/apparmor -p wa -k MAC-policy
                -w /etc/apparmor.d -p wa -k MAC-policy
                ```

            4. To load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            5. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure events that modify the system's Mandatory Access Controls are audited.

            ```bash
            #!/bin/bash
            set -e

            RULES_FILE="/etc/audit/rules.d/50-MAC_policy.rules"

            echo "Ensuring audit rules for MAC policy changes are configured in $RULES_FILE"
            cat > "$RULES_FILE" <<EOF
            -w /etc/selinux -p wa -k MAC-policy
            -w /usr/share/selinux -p wa -k MAC-policy
            -w /etc/apparmor -p wa -k MAC-policy
            -w /etc/apparmor.d -p wa -k MAC-policy
            EOF

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for MAC policy changes:

            ```yaml
            ---
            - name: Configure audit rules for SELinux and AppArmor MAC policy monitoring
              hosts: all
              become: true

              tasks:
                - name: Ensure MAC-policy audit rules are present
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-MAC_policy.rules
                    block: |
                      -w /etc/selinux -p wa -k MAC-policy
                      -w /usr/share/selinux -p wa -k MAC-policy
                      -w /etc/apparmor -p wa -k MAC-policy
                      -w /etc/apparmor.d -p wa -k MAC-policy
                    create: yes
                    owner: root
                    group: root
                    mode: '0640'
                  register: mac_audit_rules_updated

                - name: Reload audit rules if file was updated
                  ansible.builtin.command: augenrules --load
                  when: mac_audit_rules_updated.changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Notify if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit changes to the SELinux and AppArmor policy directories:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/50-MAC_policy.rules' do
              content <<~RULES
                -w /etc/selinux -p wa -k MAC-policy
                -w /usr/share/selinux -p wa -k MAC-policy
                -w /etc/apparmor -p wa -k MAC-policy
                -w /etc/apparmor.d -p wa -k MAC-policy
              RULES
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-events-that-modify-the-systems-network-environment-are-collected
    title: Ensure events that modify the system's network environment are audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    variants:
      - uid: mondoo-linux-security-events-that-modify-the-systems-network-environment-are-collected-debian-rhel
        tags:
          mondoo.com/filter-title: Debian/Red Hat Linux
          mondoo.com/filter-icon: linux
      - uid: mondoo-linux-security-events-that-modify-the-systems-network-environment-are-collected-other
        tags:
          mondoo.com/filter-title: Other Linux
          mondoo.com/filter-icon: linux
    docs:
      desc: |
        This check verifies that the audit system records changes to the host's network identity and to the files that define its local name resolution and its login banners.

        It requires syscall rules with a non-empty key for `sethostname` and `setdomainname` on both the 32-bit and the 64-bit ABI, and watch rules with the `wa` permission mask on `/etc/issue`, `/etc/issue.net`, and `/etc/hosts`. On Red Hat and Debian based systems it also requires a watch on the distribution's network configuration location, `/etc/sysconfig/network` or `/etc/network`. Rules are written into a file under `/etc/audit/rules.d/` and loaded with `augenrules --load`.

        **Why this matters**

        `/etc/hosts` is the interesting one. It takes precedence over DNS in a default resolver configuration, so a single added line silently redirects a name to an address of the attacker's choosing for every process on the host. That is how an update server, a package mirror, a log collector, or an internal API endpoint gets repointed without touching DNS, without any network device seeing a change, and without anything in the application logs looking wrong.

        `sethostname` and `setdomainname` matter because the hostname is the field that ties a log line to a machine. Renaming a host mid-incident splits its records across two identities in the collector, and Kerberos, certificate validation, and configuration management all key off the same name.

        `/etc/issue` and `/etc/issue.net` are displayed before authentication on console and network logins. They are a natural place to add text that steers a user somewhere, and on many sites they carry the legal banner that gives monitoring its authority.

        These rules record that a change happened and who made it, not what the new content is. Pair them with configuration management or file integrity monitoring to recover the content of a change.
      audit: |
        Run this command to confirm the audit rules for network environment modification events are loaded:

        ```bash
        auditctl -l | grep -E -- 'sethostname|setdomainname|/etc/(issue|issue\.net|hosts)|/etc/(sysconfig/)?network'
        ```

        A passing result lists the expected syscall and watch rules, each with a non-empty audit key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-network.rules`

            2. Add the following lines to the configuration file:

                ```text
                -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale
                -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale

                -w /etc/issue -p wa -k system-locale
                -w /etc/issue.net -p wa -k system-locale
                -w /etc/hosts -p wa -k system-locale
                ```

            3. Add the following line for Red Hat based systems:

                ```text
                -w /etc/sysconfig/network -p wa -k system-locale
                ```

            4. Add the following line for Debian/Ubuntu based systems:

                ```text
                -w /etc/network -p wa -k system-locale
                ```

            5. To load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            6. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure events that modify the system's network environment are audited.

            ```bash
            #!/bin/bash
            set -e

            RULES_FILE="/etc/audit/rules.d/50-network.rules"

            echo "Ensuring audit rules for network environment changes are configured in $RULES_FILE"
            cat > "$RULES_FILE" <<EOF
            -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale
            -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale
            -w /etc/issue -p wa -k system-locale
            -w /etc/issue.net -p wa -k system-locale
            -w /etc/hosts -p wa -k system-locale
            EOF

            if [[ -f /etc/sysconfig/network ]]; then
              echo "-w /etc/sysconfig/network -p wa -k system-locale" >> "$RULES_FILE"
            elif [[ -d /etc/network ]]; then
              echo "-w /etc/network -p wa -k system-locale" >> "$RULES_FILE"
            fi

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for network environment changes:

            ```yaml
            ---
            - name: Ensure events that modify the system's network environment are audited
              hosts: all
              become: true
              gather_facts: yes

              tasks:
                - name: Gather network file facts
                  ansible.builtin.stat:
                    path: "{{ item }}"
                  register: network_files
                  loop:
                    - /etc/sysconfig/network
                    - /etc/network

                - name: Configure base audit rules
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-system_local.rules
                    block: |
                      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale
                      -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale
                      -w /etc/issue -p wa -k system-locale
                      -w /etc/issue.net -p wa -k system-locale
                      -w /etc/hosts -p wa -k system-locale
                    marker: "# {mark} ANSIBLE MANAGED - base network rules"
                    state: present
                    create: true
                  register: base_audit_rules

                - name: Configure conditional network file monitoring
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-system_local.rules
                    block: "-w {{ item.item }} -p wa -k system-locale"
                    marker: "# {mark} ANSIBLE MANAGED - {{ item.item | basename }}"
                    state: present
                  loop: "{{ network_files.results }}"
                  when: item.stat.exists
                  register: conditional_audit_rules

                - name: Set secure file permissions
                  ansible.builtin.file:
                    path: /etc/audit/rules.d/50-system_local.rules
                    owner: root
                    group: root
                    mode: '0600'

                - name: Reload audit rules if the rules file was updated
                  ansible.builtin.command: augenrules --load
                  when: >
                    base_audit_rules.changed or
                    conditional_audit_rules.changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Warn if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit changes to the system's network environment. The distribution-specific network configuration paths are only watched where they exist, because auditd refuses to load a watch on a missing path:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            locale_rules = [
              '-a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale',
              '-a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale',
              '-w /etc/issue -p wa -k system-locale',
              '-w /etc/issue.net -p wa -k system-locale',
              '-w /etc/hosts -p wa -k system-locale',
            ]

            %w(/etc/sysconfig/network /etc/network).each do |path|
              locale_rules << "-w #{path} -p wa -k system-locale" if ::File.exist?(path)
            end

            file '/etc/audit/rules.d/50-system_local.rules' do
              content "#{locale_rules.join("\n")}\n"
              owner 'root'
              group 'root'
              mode '0600'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-events-that-modify-the-systems-network-environment-are-collected-debian-rhel
    filters: asset.family.contains(/redhat|debian/) == true
    mql: |
      // Syscall rules for network changes (64-bit)
      syscalls_64bit = ["sethostname", "setdomainname"]
      desiredRules64 = auditd.rules.syscalls.where(
        syscalls.any(_.in(syscalls_64bit))
        && arch == "b64"
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat
      desiredRules64.containsAll(syscalls_64bit)

      // Syscall rules for network changes (32-bit)
      syscalls_32bit = ["sethostname", "setdomainname"]
      desiredRules32 = auditd.rules.syscalls.where(
        syscalls.any(_.in(syscalls_32bit))
        && arch == "b32"
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat
      desiredRules32.containsAll(syscalls_32bit)

      // Watch rules for network config files
      paths = ["/etc/issue", "/etc/issue.net", "/etc/hosts"]
      paths.all(p:
        auditd.rules.files.contains( f:
          f.path == p && f.permissions == "wa"
          && f.keyname != empty
        )
      )

      // Watch rule for network directory (redhat or debian)
      networkDirPaths = ["/etc/sysconfig/network", "/etc/network"]
      networkDirPaths.any(p:
        auditd.rules.files.contains( f:
          f.path == p && f.permissions == "wa"
          && f.keyname != empty
        )
      )
