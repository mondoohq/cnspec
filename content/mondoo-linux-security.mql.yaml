        title: Linux Kernel sysctl Documentation
  - uid: mondoo-linux-security-ipv6-router-advertisements-are-not-accepted
    title: Ensure IPv6 router advertisements are not accepted
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv6.conf.all.accept_ra'] == 0
        || kernel.parameters['net.ipv6.conf.all.accept_ra'] == null
      kernel.parameters['net.ipv6.conf.default.accept_ra'] == 0
        || kernel.parameters['net.ipv6.conf.default.accept_ra'] == null
    docs:
      desc: |
        This check verifies that the host does not configure its IPv6 networking from router advertisements.

        Router advertisements are how a host learns its prefix and default gateway without DHCP, by listening for announcements from routers on the segment. The check reads the kernel parameters `net.ipv6.conf.all.accept_ra` and `net.ipv6.conf.default.accept_ra`, each of which must be `0` or unset.

        **Why this matters**

        Router advertisements are unauthenticated, and any device on the segment can send them. A host that accepts them is allowing an unauthenticated message to set its default gateway.

        The rogue advertisement is a well-known attack for that reason. It requires no privileges on the target and no vulnerability, only the ability to put a packet on the local network, and it results in the host routing its traffic through the attacker.

        What makes it more dangerous than the IPv4 equivalent is that it works on networks nobody thinks of as IPv6 networks. Linux enables IPv6 by default and prefers it over IPv4 when both are available for a destination, so a segment that is managed, monitored, and firewalled entirely in IPv4 can still have its traffic diverted through an IPv6 path that no one is watching.

        Servers should have static addressing or DHCPv6 configured deliberately. Where autoconfiguration is genuinely required, set an exception for this check and compensate with RA Guard on the switching infrastructure, which validates advertisements at the port they arrive on.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv6.conf.all.accept_ra
        sysctl net.ipv6.conf.default.accept_ra
        ```

        A passing result shows every listed parameter set to `0` (or unset). A failing result shows any parameter set to `1`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Set the following parameters in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv6.conf.all.accept_ra = 0
                net.ipv6.conf.default.accept_ra = 0
                ```

            2. Run these commands to set the active kernel parameters:

                ```bash
                sysctl -w net.ipv6.conf.all.accept_ra=0
                sysctl -w net.ipv6.conf.default.accept_ra=0
                sysctl -w net.ipv6.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to disable IPv6 router advertisements acceptance and persist the settings.

            ```bash
            #!/bin/bash
            set -e

            # Set net.ipv6.conf.all.accept_ra
            if grep -q '^net.ipv6.conf.all.accept_ra' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv6.conf.all.accept_ra to 0 in /etc/sysctl.conf"
              sed -i 's/^net.ipv6.conf.all.accept_ra.*/net.ipv6.conf.all.accept_ra = 0/' /etc/sysctl.conf
            else
              echo "Setting net.ipv6.conf.all.accept_ra to 0 in /etc/sysctl.d/99-disable-ipv6-router-advertisements.conf"
              echo "net.ipv6.conf.all.accept_ra = 0" >> /etc/sysctl.d/99-disable-ipv6-router-advertisements.conf
            fi

            # Set net.ipv6.conf.default.accept_ra
            if grep -q '^net.ipv6.conf.default.accept_ra' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv6.conf.default.accept_ra to 0 in /etc/sysctl.conf"
              sed -i 's/^net.ipv6.conf.default.accept_ra.*/net.ipv6.conf.default.accept_ra = 0/' /etc/sysctl.conf
            else
              echo "Setting net.ipv6.conf.default.accept_ra to 0 in /etc/sysctl.d/99-disable-ipv6-router-advertisements.conf"
              echo "net.ipv6.conf.default.accept_ra = 0" >> /etc/sysctl.d/99-disable-ipv6-router-advertisements.conf
            fi

            sysctl -w net.ipv6.conf.all.accept_ra=0
            sysctl -w net.ipv6.conf.default.accept_ra=0
            sysctl -w net.ipv6.route.flush=1
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the kernel parameters:

            ```yaml
            ---
            - name: Disable IPv6 router advertisements acceptance
              hosts: all
              become: true

              tasks:
                - name: Ensure IPv6 router advertisements are not accepted in sysctl configuration
                  ansible.builtin.sysctl:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                    sysctl_file: /etc/sysctl.d/99-disable-ipv6-router-advertisements.conf
                    state: present
                    sysctl_set: true
                    reload: yes
                  loop:
                    - { name: 'net.ipv6.conf.all.accept_ra', value: '0' }
                    - { name: 'net.ipv6.conf.default.accept_ra', value: '0' }
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to reject IPv6 router advertisements. Skip this on hosts that rely on SLAAC for their IPv6 address:

            ```ruby
            sysctl 'net.ipv6.conf.all.accept_ra' do
              value 0
            end

            sysctl 'net.ipv6.conf.default.accept_ra' do
              value 0
            end
            ```
