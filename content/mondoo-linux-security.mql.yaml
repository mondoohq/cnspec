      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      sshd.config.params["Banner"] == "/etc/issue.net"
    docs:
      desc: |
        This check verifies that the SSH server displays a warning banner before authentication.

        The check reads `Banner` in `/etc/ssh/sshd_config`, which must be `/etc/issue.net`. `sshd` displays the contents of that file to the client before any credential is accepted.

        **Why this matters**

        The banner is a legal control rather than a technical one, and it is worth being direct about that: it stops nobody. Its purpose is to establish, before access is attempted, that the system is private, that use is restricted to authorized purposes, and that activity may be monitored and recorded.

        That notice is what makes monitoring and subsequent action defensible. Prosecutions and internal disciplinary cases involving unauthorized access have turned on whether the user was warned, and consent to monitoring is a precondition for using session recordings as evidence in a number of jurisdictions. A host without a banner can leave an organization unable to act on what it observed.

        Several frameworks require it as a discrete control, including the CIS Benchmarks and the DISA STIGs.

        Use `/etc/issue.net` rather than `/etc/issue`. The latter is displayed at local console login and commonly contains the distribution name and kernel version, which is information worth withholding from a remote client before authentication. Keep the banner text to the authorization and monitoring notice, with no hostname, role, or version detail.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*Banner\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows `Banner /etc/issue.net`. A failing result shows `Banner none` or a different path, or no output at all, which means the directive is absent.

        This check reads the configuration file rather than the effective configuration, so verify it with `grep` rather than `sshd -T`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works.

            To set the SSH warning banner, edit the `/etc/ssh/sshd_config` file and add or modify the `Banner` parameter to point to the desired banner file.

            Example:

            ```bash
            Banner /etc/issue.net
            ```

            The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads `/etc/ssh/sshd_config.d/` first, in lexical order. Red Hat Enterprise Linux and Ubuntu ship their own snippets in that directory, so a value added to `/etc/ssh/sshd_config` has no effect once one of those snippets sets the same keyword. Check the directory, and where it is in use put the value in a drop-in numbered below the vendor snippets:

            ```bash
            grep -ri 'Banner' /etc/ssh/sshd_config.d/
            touch /etc/ssh/sshd_config.d/00-hardening.conf
            chmod 600 /etc/ssh/sshd_config.d/00-hardening.conf
            echo 'Banner /etc/issue.net' >> /etc/ssh/sshd_config.d/00-hardening.conf
            ```

            Validate the configuration and restart the SSH service to apply the changes:

            ```bash
            sshd -t
            ```

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that the SSH warning banner is configured, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            if grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
              SSHD_CONFIG=/etc/ssh/sshd_config.d/00-hardening.conf
              mkdir -p /etc/ssh/sshd_config.d
              touch "$SSHD_CONFIG"
              chmod 600 "$SSHD_CONFIG"
            else
              SSHD_CONFIG=/etc/ssh/sshd_config
            fi

            echo "Setting SSH warning banner"
            if grep -q '^Banner' "$SSHD_CONFIG"; then
              echo "Updating existing Banner configuration value"
              sed -i 's|^Banner.*|Banner /etc/issue.net|' "$SSHD_CONFIG"
            else
              echo "Adding Banner configuration value to SSH config"
              echo "Banner /etc/issue.net" >> "$SSHD_CONFIG"
            fi

            # Validate the new configuration before restarting. A syntax error here can lock you out of SSH.
            sshd -t

            # Restart the SSH service. The unit is "ssh" on Debian/Ubuntu and "sshd" on other distributions.
            if systemctl list-unit-files | grep -q '^ssh\.service'; then
              systemctl restart ssh
            else
              systemctl restart sshd
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the SSH warning banner using Ansible, use the following playbook:

            ```yaml
