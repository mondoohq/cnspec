  - uid: mondoo-linux-security-broadcast-icmp-requests-are-ignored
    title: Ensure broadcast ICMP requests are ignored
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.icmp_echo_ignore_broadcasts'] == 1
    docs:
      desc: |
        This check verifies that the host does not answer ICMP echo requests sent to broadcast or multicast addresses.

        Pings addressed to the host directly are still answered; what stops is replying to a request that was sent to the whole segment at once. The check reads the kernel parameter `net.ipv4.icmp_echo_ignore_broadcasts`, which must be `1`.

        **Why this matters**

        A request sent to a broadcast address reaches every host on the segment, and if they all answer, one small packet produces as many replies as there are machines. Because the source address of the original request can be forged, those replies go wherever the attacker chose rather than back to them.

        That is the Smurf attack, and it makes every responding host an unwitting participant in a denial of service against a third party. The host sees only that it answered a ping. The victim sees traffic amplified by the size of the segment, arriving from a large number of apparently legitimate sources, which is considerably harder to filter than traffic from one place.

        The same behavior is a mapping tool. A single broadcast ping enumerates every live host on the segment at once, which is faster and quieter than scanning addresses one at a time.

        Ignoring broadcast requests does not affect ordinary connectivity testing. A ping addressed to this host still receives a reply, so monitoring and diagnostics continue to work.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv4.icmp_echo_ignore_broadcasts
        ```

        A passing result shows every listed parameter set to `1`. A failing result shows any parameter set to `0` or absent.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Set the following parameter in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv4.icmp_echo_ignore_broadcasts = 1
                ```

            2. Run these commands to set the active kernel parameters:

                ```bash
                sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1
                sysctl -w net.ipv4.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to disable ICMP echo broadcasts.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^net.ipv4.icmp_echo_ignore_broadcasts' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.icmp_echo_ignore_broadcasts to 1 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.icmp_echo_ignore_broadcasts.*/net.ipv4.icmp_echo_ignore_broadcasts = 1/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.icmp_echo_ignore_broadcasts to 1 in /etc/sysctl.d/99-disable-icmp-echo-broadcasts.conf"
              echo "net.ipv4.icmp_echo_ignore_broadcasts = 1" >> /etc/sysctl.d/99-disable-icmp-echo-broadcasts.conf
            fi

            sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1
            sysctl -w net.ipv4.route.flush=1
            sysctl --system
            ```
        - id: ansible
          desc: |
