    mql: |
      sshd.config.params["LoginGraceTime"] >= 1
      sshd.config.params["LoginGraceTime"] <= 60
    docs:
      desc: |
        This check verifies that the SSH server closes connections that have not authenticated within one minute.

        The check reads `LoginGraceTime` in `/etc/ssh/sshd_config`, which must be between 1 and 60 seconds. The OpenSSH default is 120 seconds.

        **Why this matters**

        `LoginGraceTime` bounds how long a connection may sit unauthenticated before `sshd` closes it. Every connection in that state consumes a slot and an unauthenticated `sshd` process on the server.

        That makes the value a denial of service parameter. `MaxStartups` limits how many unauthenticated connections may be in progress at once, and `LoginGraceTime` decides how long each one occupies its slot. With a long grace period, an attacker who opens connections and simply never authenticates can fill the available slots and keep them full, at almost no cost to themselves, and legitimate administrators are refused. Halving the grace period halves the number of connections needed to sustain that.

        The pre-authentication window matters for a second reason: it is where the parsing of attacker-supplied protocol data happens, before any credential has been accepted. Keeping it short reduces the time available to work through a multi-step interaction against that code.

        A minute is generous for any automated client and for an administrator typing a password or touching a hardware key. Where an interactive second factor needs longer, scope the exception to that path with a `Match` block rather than raising the global value.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*LoginGraceTime\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows `LoginGraceTime` between `1` and `60` seconds. A failing result shows a greater value or `0`, which disables the limit entirely, or no output at all, which means the directive is absent and OpenSSH's default of `120` applies.

        This check reads the configuration file rather than the effective configuration, so verify it with `grep` rather than `sshd -T`.
