      desc: |
        This check verifies that the `talkd` and `ntalk` services are neither running nor enabled at boot.

        **Why this matters**

        `talk` is a terminal chat protocol from an era when a network was a single trusted campus. It has no encryption, so messages and the usernames involved cross the network in clear, and no meaningful authentication, so the daemon accepts invitations from anywhere it is reachable.

        The practical exposure is that anyone who can reach the daemon can write directly to a logged-in user's terminal. Terminal output is not neutral: control sequences can clear the screen, reposition the cursor, and paint arbitrary text, which makes it possible to forge a convincing prompt in an administrator's session and capture whatever they type in response.

        Beyond that, this is unmaintained code. `talkd` receives no meaningful upstream attention, so any defect in its request handling stays a defect, and it is present only because a package pulled it in rather than because anyone chose to run it.

        There is no modern reason to run `talk`. Disable both services and remove the packages.
