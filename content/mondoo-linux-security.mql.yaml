  - uid: mondoo-linux-security-session-initiation-information-is-collected
    title: Ensure session initiation information is audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      // Check utmp is watched with a non-empty audit key
      auditd.rules.files.contains( f:
        f.path == "/var/run/utmp" && f.permissions == "wa"
        && f.keyname != empty
      )
      // Check wtmp and btmp are watched with a non-empty audit key
      sessionPaths = ["/var/log/wtmp", "/var/log/btmp"]
      sessionPaths.all(p:
        auditd.rules.files.contains( f:
          f.path == p && f.permissions == "wa"
          && f.keyname != empty
        )
      )
    docs:
      desc: |
        This check verifies that the audit system watches the three files that hold the host's login record.

        It requires watch rules with the `wa` permission mask and a non-empty key on `/var/run/utmp`, `/var/log/wtmp`, and `/var/log/btmp`. The `utmp` file lists sessions that are currently open, `wtmp` is the history of logins and logouts that `last` reads, and `btmp` records failed authentication attempts and is read by `lastb`. Rules go in a file under `/etc/audit/rules.d/` and are loaded with `augenrules --load`.

        **Why this matters**

        These are binary records that any process running as root can rewrite, and rewriting them is a well-worn step in covering an intrusion. Utilities to do it have shipped in rootkits for decades: they delete the session entry from `wtmp`, remove the current session from `utmp`, and clear the failed attempts from `btmp` that the password guessing produced on the way in. Afterwards `last` and `lastb` report a host that nobody unexpected logged into.

        Watch rules break that, because the edit itself becomes an audit event with a process, a parent, and an audit ID attached. The attacker is then choosing between leaving the login record intact and leaving a record of having tampered with it, and either outcome is one the investigation can work from.

        The records are worth having with nobody tampering at all. `btmp` is where a slow password-guessing campaign shows up before it succeeds, and `wtmp` is what answers whether a given account was in use at the time something happened.

        Watching these three files does not protect their contents. Ship the audit records and the login history off the host, because everything discussed here is readable and writable by anyone who has already reached root locally.
      audit: |
        Run this command to confirm the session audit rules are loaded:

        ```bash
        auditctl -l | grep -E -- '-w (/var/run/utmp|/var/log/wtmp|/var/log/btmp).*-p wa'
        ```

        A passing result lists watch rules on `/var/run/utmp`, `/var/log/wtmp`, and `/var/log/btmp` with `-p wa` permissions and a non-empty audit key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-session.rules`

            2. Add the following lines to the configuration file:

                ```text
                -w /var/run/utmp -p wa -k session
                -w /var/log/wtmp -p wa -k logins
                -w /var/log/btmp -p wa -k logins
                ```

            3. To load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            4. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure session initiation information is audited:

            ```bash
            #!/bin/bash
            set -e

            RULES_FILE="/etc/audit/rules.d/50-session.rules"

            echo "Ensuring audit rules for session initiation are configured in $RULES_FILE"
            cat > "$RULES_FILE" <<EOF
            -w /var/run/utmp -p wa -k session
            -w /var/log/wtmp -p wa -k logins
            -w /var/log/btmp -p wa -k logins
            EOF

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for session initiation:

            ```yaml
            ---
            - name: Ensure session initiation information is audited
              hosts: all
              become: true

              tasks:
                - name: Set session tracking audit rules
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-session.rules
                    block: |
                      -w /var/run/utmp -p wa -k session
                      -w /var/log/wtmp -p wa -k logins
                      -w /var/log/btmp -p wa -k logins
                    state: present
                    create: true
                  notify: Load audit rules

                - name: Check if audit rules are immutable
                  ansible.builtin.shell: |
                    auditctl -s | grep '^enabled' | awk '{print $2}'
                  register: audit_enabled

                - name: Warn if reboot is required to apply immutable audit rules
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because the configuration is immutable."
                  when: audit_enabled.stdout == "2"

              handlers:
                - name: Load audit rules
                  ansible.builtin.command: augenrules --load
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit session initiation:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/50-session.rules' do
              content <<~RULES
                -w /var/run/utmp -p wa -k session
                -w /var/log/wtmp -p wa -k logins
                -w /var/log/btmp -p wa -k logins
              RULES
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
