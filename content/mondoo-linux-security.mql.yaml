      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("vsftpd").enabled == false
      service("vsftpd").running == false
      service("proftpd").enabled == false
      service("proftpd").running == false
      service("pure-ftpd").enabled == false
      service("pure-ftpd").running == false
    docs:
      desc: |
        This check verifies that the `vsftpd`, `proftpd`, and `pure-ftpd` services are neither running nor enabled at boot.

        **Why this matters**

        FTP sends the username and password across the network as plaintext, on every login, with no negotiation step that could upgrade the connection. Anyone positioned to observe the traffic captures working credentials.

        Those credentials are usually system accounts. FTP servers commonly authenticate through PAM against `/etc/shadow`, so the password captured from an FTP session is the same one that unlocks SSH and `sudo`. A protocol that is only used to move a nightly export file becomes the way an attacker obtains interactive access to the host.

        The data channel adds its own problems. FTP negotiates a second connection for transfers, which makes it awkward to firewall precisely, and misconfigured anonymous access with an upload directory gives an unauthenticated attacker a writable path on the server.

        SFTP, which rides on the SSH server already present, and FTPS both authenticate and transfer over an encrypted channel. Where file transfer is needed, use one of those and disable the FTP daemon.
      audit: |
        Run this command to confirm the FTP server service is stopped and disabled:

        ```bash
        systemctl is-active vsftpd proftpd pure-ftpd
        systemctl is-enabled vsftpd proftpd pure-ftpd
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run this command to stop and disable `vsftpd`, `proftpd`, and `pure-ftpd`:

            ```bash
            systemctl stop vsftpd proftpd pure-ftpd
            systemctl disable vsftpd proftpd pure-ftpd
            ```

            Typically only one of these alternative units is installed. A unit that is not installed reports an error that can be ignored; the commands still apply to the units that exist.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the FTP server services.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling FTP server services..."
            for unit in vsftpd.service proftpd.service pure-ftpd.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `vsftpd`, `proftpd`, and `pure-ftpd`:

            ```yaml
            ---
            - name: Stop and disable FTP server services
              hosts: all
              become: true

              tasks:
                - name: Ensure FTP server services are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - vsftpd
                    - proftpd
                    - pure-ftpd
                  register: ftp_units
                  failed_when:
                    - ftp_units.failed
                    - "'Could not find the requested service' not in (ftp_units.msg | default(''))"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the FTP server units:

            ```ruby
            %w(vsftpd.service proftpd.service pure-ftpd.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable)
                only_if "systemctl cat #{unit}"
              end
            end
