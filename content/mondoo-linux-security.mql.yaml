  - uid: mondoo-linux-security-discretionary-access-control-permission-modification-events-are-collected
    title: Ensure DAC permission modification events are audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      // Syscalls for DAC permission modification (64-bit)
      syscalls_64bit = ["chmod", "fchmod", "fchmodat", "chown", "fchown", "fchownat", "lchown", "setxattr", "lsetxattr", "fsetxattr", "removexattr", "lremovexattr", "fremovexattr"]
      desiredRules64 = auditd.rules.syscalls.where(
        syscalls.any(_.in(syscalls_64bit))
        && arch == "b64"
        && auidMin == 1000
        && excludesUnsetAuid
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat
      desiredRules64.containsAll(syscalls_64bit)

      // Syscalls for DAC permission modification (32-bit)
      syscalls_32bit = ["chmod", "fchmod", "fchmodat", "chown", "fchown", "fchownat", "lchown", "setxattr", "lsetxattr", "fsetxattr", "removexattr", "lremovexattr", "fremovexattr"]
      desiredRules32 = auditd.rules.syscalls.where(
        syscalls.any(_.in(syscalls_32bit))
        && arch == "b32"
        && auidMin == 1000
        && excludesUnsetAuid
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat
      desiredRules32.containsAll(syscalls_32bit)
    docs:
      desc: |
        This check verifies that audit rules record the system calls that change file permissions, ownership, and extended attributes, on both 32-bit and 64-bit architectures, filtered to `auid>=1000` with `action always` and a non-empty key. The permission calls are `chmod`, `fchmod`, and `fchmodat`; the ownership calls are `chown`, `fchown`, `fchownat`, and `lchown`; the extended attribute calls are `setxattr`, `lsetxattr`, `fsetxattr`, `removexattr`, `lremovexattr`, and `fremovexattr`.

        **Why this matters**

        Permission changes are how access is granted on a Linux host, so they are also how access is taken. The records that matter are specific: a file made world-writable so another account can modify it, ownership of a script transferred to an account the attacker controls, or the setuid bit added to a copy of a shell, which is the oldest and still one of the most common persistence mechanisms available.

        The extended attribute calls are in the list for a reason that is easy to overlook. File capabilities, SELinux labels, and AppArmor attributes are all stored as extended attributes, so `setxattr` can grant a binary a capability such as `CAP_SETUID` without setting any bit that `ls -l` displays, and `removexattr` can strip the SELinux label that confines a file. Neither is visible in a normal directory listing, and neither would be caught by watching `chmod` alone.

        The `auid>=1000` filter keeps the volume manageable by excluding daemon activity while retaining every action traceable to a person who logged in, including actions taken after `sudo`.
      audit: |
        Run this command to confirm the audit rules for discretionary access control permission changes are loaded:

        ```bash
        auditctl -l | grep -E -- '(chmod|chown|xattr)'
        ```

        A passing result lists the expected audit rules; the audit key can be any non-empty value. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

