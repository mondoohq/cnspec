  - uid: mondoo-linux-security-permissions-on-etcpasswd--are-configured
    title: Ensure secure permissions on /etc/passwd- are set
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      if (file("/etc/passwd-").exists) {
        file("/etc/passwd-") {
          permissions.user_executable == false
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
        }
      }
    docs:
      desc: |
        This check verifies that `/etc/passwd-` is accessible only by its owner: no execute bit for the owner, and no read, write, or execute permission for the group or for other users. The expected mode is `0600` or stricter. This is stricter than the check on `/etc/passwd` itself, which must stay readable.

        **Why this matters**

        `/etc/passwd-` is the previous copy of the account database, written automatically by `useradd`, `usermod`, and `passwd` before they modify the live file. Nothing reads it during normal operation, so it does not need the world-readable permissions that `/etc/passwd` requires, and there is no cost to locking it down.

        Its value to an attacker is historical. It shows the account list as it was before the most recent change: accounts that have since been removed, UIDs and shells before they were altered, and home directory paths that may still exist. Comparing it against the live file reveals what an administrator changed and when, which is useful for finding an account that was disabled but not deleted.

        Write access is the more serious exposure. Restore procedures and some administrative tools copy this file back over `/etc/passwd`, so content planted here can become the live account database later, at a moment when nobody is treating the operation as a security event.

        Backup files are routinely missed when permissions are reviewed, because attention goes to the live file whose name everyone recognizes.
      audit: |
        Run this command to inspect the ownership and permissions of `/etc/passwd-`:

        ```bash
        stat -c '%U %G %a' /etc/passwd-
        ```

        A passing result shows the file owned by root with the expected hardened mode. A failing result shows group or other write or execute access, or for shadow files any read access for other users.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. To set the ownership and permissions on the `/etc/passwd-` file, run the following commands:

                ```bash
                chown root:root /etc/passwd-
                chmod 600 /etc/passwd-
                ```

            2. To ensure these permissions are not reverted by automated actions, add the following line to `/etc/tmpfiles.d/etc.conf`:

                ```text
                f /etc/passwd- 0600 root root -
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that the `/etc/passwd-` file has the correct permissions, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting ownership and permissions on /etc/passwd-"
            chown root:root /etc/passwd-
            chmod 0600 /etc/passwd-
            echo "f /etc/passwd- 0600 root root -" >> /etc/tmpfiles.d/etc.conf
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the ownership and permissions on the `/etc/passwd-` file, use the following Ansible playbook:

            ```yaml
            ---
            - name: Set ownership and permissions on /etc/passwd-
              hosts: all
              become: true

              tasks:
                - name: Set correct ownership and permissions on /etc/passwd-
                  ansible.builtin.file:
                    path: /etc/passwd-
                    owner: root
                    group: root
                    mode: '0600'
                - name: Ensure /etc/passwd- is not reverted
                  ansible.builtin.lineinfile:
                    path: /etc/tmpfiles.d/etc.conf
                    line: 'f /etc/passwd- 0600 root root -'
                    state: present
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the ownership and permissions on `/etc/passwd-`:

            ```ruby
            tmpfiles_conf = '/etc/tmpfiles.d/etc.conf'
            tmpfiles_entry = 'f /etc/passwd- 0600 root root -'

            file '/etc/passwd-' do
              owner 'root'
              group 'root'
              mode '0600'
            end

            ruby_block 'keep systemd-tmpfiles from reverting /etc/passwd-' do
              block do
                body = ::File.exist?(tmpfiles_conf) ? ::File.read(tmpfiles_conf) : ''
                body = if body.match?(%r{^f /etc/passwd-\s})
                         body.gsub(%r{^f /etc/passwd-\s.*$}, tmpfiles_entry)
                       else
                         "#{body.chomp}\n#{tmpfiles_entry}\n".lstrip
                       end
                ::File.write(tmpfiles_conf, body)
              end
              not_if { ::File.exist?(tmpfiles_conf) && ::File.read(tmpfiles_conf).include?(tmpfiles_entry) }
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man5/passwd.5.html
        title: passwd(5) Manual Page
