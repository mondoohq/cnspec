      - uid: mondoo-linux-security-login-and-logout-events-are-collected-debian
        tags:
          mondoo.com/filter-title: Debian Linux
          mondoo.com/filter-icon: linux
      - uid: mondoo-linux-security-login-and-logout-events-are-collected-rhel
        tags:
          mondoo.com/filter-title: Red Hat Linux
          mondoo.com/filter-icon: linux
      - uid: mondoo-linux-security-login-and-logout-events-are-collected-other
        tags:
          mondoo.com/filter-title: Other Linux
          mondoo.com/filter-icon: linux
    docs:
      desc: |
        This check verifies that audit watch rules with a non-empty key cover the files that record login activity. On every system it requires watches on `/var/log/lastlog`, which records each account's most recent login, and `/var/log/tallylog`, which counts failed attempts. Debian-based systems additionally require a watch on `/var/log/faillog`, and Red Hat and Amazon Linux systems additionally require one on `/var/run/faillock`, which is where `pam_faillock` tracks failed authentication.

        **Why this matters**

        These files are the system's own record of who logged in and who failed to. They are also, for exactly that reason, among the first things an intruder modifies.

        Auditing writes to them catches the tampering rather than the login. A successful authentication already produces log entries elsewhere; what these rules add is a record when the login history itself is altered. An attacker clearing their entry from `lastlog`, or resetting a `faillock` counter to erase the evidence of the brute-force attempt that got them in, cannot do so without generating an audit event they do not control.

        The failure counters matter independently. `tallylog` and `faillock` are what account lockout policy is enforced from, so clearing them does not merely hide history, it restores an attacker's remaining attempts and defeats the lockout.

        The distribution differences reflect which PAM module is in use. `pam_tally2` wrote to `faillog` and `tallylog`, while `pam_faillock`, which replaced it, uses `/var/run/faillock`. The check requires the paths that are actually in use on the platform being scanned.
      audit: |
        Run this command to confirm the audit rules for login and logout events are loaded:

        ```bash
        auditctl -l | grep -E -- '/var/log/(lastlog|tallylog|faillog)|/var/run/faillock'
        ```

        A passing result lists watch rules on those files with `wa` permissions and a non-empty audit key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-logins.rules`

            2. Add the following lines to the configuration file:

                ```text
                -w /var/log/lastlog -p wa -k logins
                -w /var/log/tallylog -p wa -k logins
                ```

            3. Add the following additional line for Debian/Ubuntu based systems:

                ```text
                -w /var/log/faillog -p wa -k logins
                ```

            4. Add the following additional line for Red Hat/Fedora/Amazon Linux based systems:

                ```text
                -w /var/run/faillock -p wa -k logins
                ```

            5. To load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            6. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure login and logout events are audited.

            ```bash
            #!/bin/bash
            set -e

            RULES_FILE="/etc/audit/rules.d/50-logins.rules"

            echo "Ensuring audit rules for lastlog and tallylog are configured in $RULES_FILE"
            cat > "$RULES_FILE" <<EOF
            -w /var/log/lastlog -p wa -k logins
            -w /var/log/tallylog -p wa -k logins
            EOF

            if [ -f /etc/debian_version ]; then
              echo "Adding auditing for faillog in $RULES_FILE"
              echo "-w /var/log/faillog -p wa -k logins" >> "$RULES_FILE"
            elif [ -f /etc/redhat-release ] || grep -qi '^ID.*amzn' /etc/os-release 2>/dev/null; then
              echo "Adding auditing for faillock in $RULES_FILE"
              echo "-w /var/run/faillock -p wa -k logins" >> "$RULES_FILE"
            fi

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for login and logout events:

            ```yaml
            ---
            - name: Ensure login and logout events are audited
              hosts: all
              become: true

              tasks:
                - name: Set base login audit rules
                  ansible.builtin.copy:
                    dest: /etc/audit/rules.d/50-logins.rules
                    content: |
                      -w /var/log/lastlog -p wa -k logins
                      -w /var/log/tallylog -p wa -k logins
                  notify: Load audit rules

                - name: Add Debian/Ubuntu-specific faillog audit rule
                  ansible.builtin.lineinfile:
                    path: /etc/audit/rules.d/50-logins.rules
                    line: "-w /var/log/faillog -p wa -k logins"
                    create: yes
                    insertafter: EOF
                  when: ansible_os_family == "Debian"
                  notify: Load audit rules

                - name: Add RedHat/Fedora/Amazon-specific faillock audit rule
                  ansible.builtin.lineinfile:
                    path: /etc/audit/rules.d/50-logins.rules
                    line: "-w /var/run/faillock -p wa -k logins"
                    create: yes
                    insertafter: EOF
                  when: ansible_os_family in ["RedHat", "Amazon"]
                  notify: Load audit rules

                - name: Check if audit rules are immutable
                  ansible.builtin.shell: |
                    auditctl -s | grep '^enabled' | awk '{print $2}'
                  register: audit_enabled

                - name: Warn if reboot is required to apply immutable audit rules
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because the configuration is immutable."
                  when: audit_enabled.stdout == "2"

              handlers:
                - name: Load audit rules
                  ansible.builtin.command: augenrules --load
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit login and logout events. The failed-login record differs by distribution, so the rule set is assembled from the platform family:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            login_rules = ['-w /var/log/lastlog -p wa -k logins', '-w /var/log/tallylog -p wa -k logins']
            login_rules << if platform_family?('debian')
                             '-w /var/log/faillog -p wa -k logins'
                           else
                             '-w /var/run/faillock -p wa -k logins'
                           end

            file '/etc/audit/rules.d/50-logins.rules' do
              content "#{login_rules.join("\n")}\n"
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
