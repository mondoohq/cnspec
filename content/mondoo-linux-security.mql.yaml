    mql: |
      sshd.config.params["IgnoreRhosts"] == "yes"
    docs:
      desc: |
        This check verifies that the SSH server ignores `.rhosts` and `.shosts` files in users' home directories.

        The check reads `IgnoreRhosts` in `/etc/ssh/sshd_config`, which must be `yes`. The directive must be present in the file; an absent `IgnoreRhosts` fails this check even though `yes` is the OpenSSH default.

        **Why this matters**

        `.rhosts` and `.shosts` files let a user declare which remote hosts and accounts may log in as them without presenting a credential. They are read from the user's own home directory, which means the user, and anyone who can write to that directory, decides who gets in.

        That inverts the usual control. An administrator can restrict `AllowUsers`, require keys, and disable passwords, and a single `.shosts` file written by a compromised account still grants access to whoever it names. Because the file lives in a home directory rather than in `/etc`, it is not covered by configuration management review and it survives changes to the central SSH configuration.

        The trust it expresses is also weak. It identifies the peer by hostname, so anyone who can influence name resolution or compromise the named host inherits the access.

        Setting `IgnoreRhosts yes` tells `sshd` to disregard these files entirely, so authorization stays with the system configuration. Set it explicitly rather than relying on the default, so that the intent is recorded and a later edit to the file cannot silently change it.
