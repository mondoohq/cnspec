        title: Red Hat - Managing software with the DNF tool
  - uid: mondoo-linux-security-apt-repositories-enforce-signature-verification
    title: Ensure APT repositories enforce signature verification
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-uem-02
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-id-ra-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    filters: |
      asset.family.contains('debian')
    mql: |
      apt.repos.where(enabled).all(trusted == false)
    docs:
      desc: |
        This check verifies that no enabled APT repository is marked trusted, which would tell APT to install its packages without checking any signature.

        APT normally refuses a repository whose release file is not signed by a key the host holds. Marking an entry trusted removes that requirement. In a one-line sources file the marker is `[trusted=yes]` in the options field; in a deb822 `.sources` file it is a `Trusted: yes` field. The check reads every enabled repository and requires the marker to be absent. The supported way to add a third-party repository is a `signed-by` option naming a keyring, which trusts one specific key for that one repository.

        **Why this matters**

        `[trusted=yes]` is usually added to make an error go away. The repository's key was never imported, or it was imported into a location APT no longer honors, `apt-get update` failed, and the flag suppressed the failure. What it actually did was switch that repository from cryptographically verified to unverified, permanently, with no further warning.

        An unverified repository is a root shell available to whoever can answer for it. That includes the operator of the mirror, anyone who compromises it, and, where the repository is reached over plain HTTP, anyone on the network path between the host and the server. Substituting a package with the same name and a higher version is enough: `apt-get upgrade` installs it and the maintainer scripts run as root before anything else on the host has a chance to notice.

        The exposure is wider than the one repository, too. APT resolves dependencies across every configured source, so an unverified repository that offers a higher version of a core library gets to supply it to the whole system.

        Replace the flag with the key it was working around. Fetch the repository's signing key, place it in a keyring under `/usr/share/keyrings/`, and reference that keyring with `signed-by` so the trust is scoped to one key and one repository rather than granted to an address.
      audit: |
        Run this command to list any repository that bypasses signature verification:

        ```bash
        grep -rEi 'trusted\s*=\s*yes|^\s*Trusted:\s*yes' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null
        ```

        A passing result returns no matches, meaning every enabled repository enforces signature verification. A failing result lists one or more entries marked trusted.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Remove the `[trusted=yes]` option from the offending entry and pin the repository to its signing key instead. For a one-line entry, replace the trusted flag with a `signed-by` keyring:

            ```bash
            sed -i 's/\[trusted=yes\]/[signed-by=\/usr\/share\/keyrings\/example-archive-keyring.gpg]/' /etc/apt/sources.list.d/example.list
            apt-get update
            ```

            For a deb822 entry in a `.sources` file, remove the `Trusted: yes` line and declare the signing key with a `Signed-By:` field:

            ```bash
            sed -i -E '/^\s*Trusted:\s*yes\s*$/Id' /etc/apt/sources.list.d/example.sources
            apt-get update
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to strip the trusted flag from every one-line sources file and every deb822 sources file so APT enforces signature verification. It removes only the `trusted=yes` option and keeps other options such as `arch=` and `signed-by=` intact:

            ```bash
            #!/bin/bash
            set -e

            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
              [ -f "$f" ] || continue
              sed -i -E 's/\btrusted=yes\b[[:space:]]*//I; s/\[[[:space:]]*\][[:space:]]*//; s/  +/ /g' "$f"
            done

            for f in /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] || continue
              sed -i -E '/^[[:space:]]*Trusted:[[:space:]]*yes[[:space:]]*$/Id' "$f"
            done

            apt-get update
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to remove trusted overrides from one-line sources files and deb822 sources files. It removes only the `trusted=yes` option and keeps other options such as `arch=` and `signed-by=` intact:

            ```yaml
            ---
            - name: Enforce APT signature verification
              hosts: all
              become: true

              tasks:
                - name: Find one-line APT sources files
                  ansible.builtin.find:
                    paths:
                      - /etc/apt
                      - /etc/apt/sources.list.d
                    patterns: "*.list"
                    recurse: no
                  register: apt_sources

                - name: Remove trusted=yes overrides
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '\btrusted=yes\b\s*'
                    replace: ""
                  loop: "{{ apt_sources.files }}"

                - name: Remove option brackets left empty
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '\[\s*\]\s*'
                    replace: ""
                  loop: "{{ apt_sources.files }}"

                - name: Find deb822 APT sources files
                  ansible.builtin.find:
                    paths: /etc/apt/sources.list.d
                    patterns: "*.sources"
                  register: deb822_sources

                - name: Remove Trusted yes lines from deb822 sources files
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*Trusted:\s*yes\s*$'
                    state: absent
                  loop: "{{ deb822_sources.files }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to drop the trusted overrides from APT source definitions. It removes only `trusted=yes` and `Trusted: yes`, leaving options such as `arch=` and `signed-by=` in place:

            ```ruby
            one_line_sources = ::Dir.glob('/etc/apt/*.list') + ::Dir.glob('/etc/apt/sources.list.d/*.list')

            one_line_sources.each do |source_file|
              ruby_block "remove trusted overrides from #{source_file}" do
                block do
                  body = ::File.read(source_file)
                  body = body.gsub(/\btrusted=yes\b\s*/, '')
                  body = body.gsub(/\[\s*\]\s*/, '')
                  ::File.write(source_file, body)
                end
                only_if { ::File.read(source_file).match?(/\btrusted=yes\b/) }
              end
            end

            ::Dir.glob('/etc/apt/sources.list.d/*.sources').each do |source_file|
              ruby_block "remove Trusted from #{source_file}" do
                block do
                  body = ::File.read(source_file)
                  ::File.write(source_file, body.gsub(/^\s*Trusted:\s*yes\s*$\n/, ''))
                end
                only_if { ::File.read(source_file).match?(/^\s*Trusted:\s*yes\s*$/) }
              end
            end
            ```
    refs:
      - url: https://manpages.debian.org/stable/apt/sources.list.5.en.html
        title: Debian - sources.list manual page
