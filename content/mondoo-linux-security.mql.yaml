        `/etc/shadow-` is the previous copy of the password file, written automatically before the live file is modified. It contains password hashes in exactly the same format, so it deserves exactly the same protection.

        An attacker looking for hashes does not care which file they come from. Where `/etc/shadow` has been locked down and this one has not, the backup is the easier target and yields the same result: hashes to crack offline, with no failed-login records and no rate limiting.

        The backup also holds hashes that are no longer current. A password changed after a suspected compromise still appears here in its old form until the next account change overwrites the file, which means a credential that was believed rotated may still be recoverable. For accounts whose password has not changed recently, the hash here is simply the live one.

        Write access carries the restore risk. Content planted in this file can reach `/etc/shadow` through a recovery procedure that nobody is treating as security-relevant at the time.
      audit: |
        Run this command to inspect the ownership and permissions of `/etc/shadow-`:

        ```bash
        stat -c '%U %G %a' /etc/shadow-
        ```

        A passing result shows the file owned by root with the expected hardened mode. A failing result shows group or other write or execute access, or for shadow files any read access for other users.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. To set the ownership and permissions on the `/etc/shadow-` file, run the commands for your distribution.

                Debian/Ubuntu and derivatives:

                ```bash
                chown root:shadow /etc/shadow-
                chmod 640 /etc/shadow-
                ```

                RHEL/Fedora/Amazon Linux and derivatives:

                ```bash
                chown root:root /etc/shadow-
                chmod 0000 /etc/shadow-
                ```

            2. To ensure these permissions are not reverted by automated actions, add a matching line to `/etc/tmpfiles.d/etc.conf`. On Debian-based systems use:

                ```text
                f /etc/shadow- 0640 root shadow -
                ```

                On Red Hat-based systems use:

                ```text
                f /etc/shadow- 0000 root root -
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that the `/etc/shadow-` file has the correct permissions, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            if getent group shadow >/dev/null; then
              GROUP=shadow
              MODE=0640
            else
              GROUP=root
              MODE=0000
            fi

            echo "Setting ownership and permissions on /etc/shadow-"
            chown root:"$GROUP" /etc/shadow-
            chmod "$MODE" /etc/shadow-
            echo "f /etc/shadow- $MODE root $GROUP -" >> /etc/tmpfiles.d/etc.conf
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the ownership and permissions on the `/etc/shadow-` file, use the following Ansible playbook:

            ```yaml
            ---
            - name: Set ownership and permissions on /etc/shadow-
              hosts: all
              become: true

              tasks:
                - name: Set correct ownership and permissions on /etc/shadow-
                  ansible.builtin.file:
                    path: /etc/shadow-
                    owner: root
                    group: "{{ 'shadow' if ansible_facts['os_family'] == 'Debian' else 'root' }}"
                    mode: "{{ '0640' if ansible_facts['os_family'] == 'Debian' else '0000' }}"
                - name: Ensure /etc/shadow- is not reverted
                  ansible.builtin.lineinfile:
                    path: /etc/tmpfiles.d/etc.conf
                    line: "f /etc/shadow- {{ '0640 root shadow' if ansible_facts['os_family'] == 'Debian' else '0000 root root' }} -"
                    create: yes
                    state: present
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the ownership and permissions on `/etc/shadow-`. systemd-tmpfiles resets these permissions on some distributions, so the tmpfiles entry is corrected alongside the file itself:

            ```ruby
            tmpfiles_conf = '/etc/tmpfiles.d/etc.conf'
            shadow_group = platform_family?('debian') ? 'shadow' : 'root'
            shadow_mode = platform_family?('debian') ? '0640' : '0000'
            tmpfiles_entry = "f /etc/shadow- #{shadow_mode} root #{shadow_group} -"

            file '/etc/shadow-' do
              owner 'root'
              group shadow_group
              mode shadow_mode
            end

            ruby_block 'keep systemd-tmpfiles from reverting /etc/shadow-' do
              block do
                body = ::File.exist?(tmpfiles_conf) ? ::File.read(tmpfiles_conf) : ''
                body = if body.match?(%r{^f /etc/shadow-\s})
                         body.gsub(%r{^f /etc/shadow-\s.*$}, tmpfiles_entry)
                       else
                         "#{body.chomp}\n#{tmpfiles_entry}\n".lstrip
                       end
                ::File.write(tmpfiles_conf, body)
              end
              not_if { ::File.exist?(tmpfiles_conf) && ::File.read(tmpfiles_conf).include?(tmpfiles_entry) }
            end
            ```
