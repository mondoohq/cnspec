      service("nginx").running == false
    docs:
      desc: |
        This check verifies that the `httpd`, `apache2`, and `nginx` services are neither running nor enabled at boot.

        **Why this matters**

        A web server that nobody deliberately deployed has no owner, and that is the risk. It was pulled in as a dependency or left behind by a decommissioned application, so it is absent from the inventory that drives patching, no one has reviewed its configuration, and its access logs are not going anywhere anyone reads.

        The default site it serves is rarely empty. Default virtual hosts expose server version banners, status endpoints such as `server-status` and `stub_status`, and directory listings of whatever happens to sit under the document root, all of which tell an attacker what the host is and what else runs on it.

        The listener is also useful to an attacker after any other compromise. A writable directory under the document root turns a file-write bug into a web shell, and an HTTP listener on a host with restricted outbound access provides a channel for staging tools and retrieving data that firewall rules permitting inbound web traffic will not block.

        Where the host is meant to serve web content, that is a deliberate role: keep the service, and manage its configuration, patching, and logs accordingly. Where it is not, stop and disable the daemon.
      audit: |
        Run this command to confirm the HTTP server service is stopped and disabled:

        ```bash
        systemctl is-active httpd apache2 nginx
        systemctl is-enabled httpd apache2 nginx
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run this command to stop and disable `httpd`, `apache2`, and `nginx`:

            ```bash
            systemctl stop httpd apache2 nginx
            systemctl disable httpd apache2 nginx
            ```

            Typically only one of these alternative units is installed. A unit that is not installed reports an error that can be ignored; the commands still apply to the units that exist.
