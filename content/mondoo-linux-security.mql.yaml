      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      // Check for 64-bit or 32-bit mount syscall audit rule
      auditd.rules.syscalls.contains(
        syscalls.contains("mount")
        && arch == "b64"
        && auidMin == 1000
        && excludesUnsetAuid
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ) || auditd.rules.syscalls.contains(
        syscalls.contains("mount")
        && arch == "b32"
        && auidMin == 1000
        && excludesUnsetAuid
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      )
    docs:
      desc: |
        This check verifies that an audit rule records the `mount` system call on the host's architecture, filtered to `auid>=1000` so that it captures actions by interactive users while excluding daemon activity, with `action always` and a non-empty key.

        **Why this matters**

        Mounting a filesystem changes what is reachable on the host, and a non-root user who can mount is working around the constraints that the existing filesystem layout imposes.

        Two uses matter. The first is moving data out: attaching removable media or a network share and copying to it leaves the host through a path that egress filtering and network monitoring never see, because no traffic traverses the monitored interfaces at all. The second is defeating mount options. Hardened systems mount `/tmp`, `/var/tmp`, and `/home` with `noexec` specifically to stop downloaded payloads from running; mounting a loopback image or a `tmpfs` over one of those paths without the option restores the ability to execute there.

        Bind mounts deserve particular attention. A bind mount can expose a directory from outside a restricted area into one the user controls, or overlay a directory that a privileged process reads with content the user supplies.

        The `auid` filter is what makes the rule usable. Without it the rule fires continuously on ordinary system activity and buries the events worth reading. With it, each record carries the original login identity, so a mount performed after `sudo` still attributes to the person who logged in rather than to root.
      audit: |
        Run this command to confirm the audit rules for filesystem mount operations are loaded:

        ```bash
        auditctl -l | grep -- '-S mount' | grep -- '-F auid'
        ```

        A passing result lists audit rules for the mount syscall with the correct auid filters and any non-empty audit key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-mounts.rules`

            2. Add the following lines to the configuration file:

                ```text
                -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
                -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
                ```

            3. Load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            4. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use the following script to set the audit rules for successful file system mounts:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting up audit rules for successful file system mounts..."
            cat <<EOF > /etc/audit/rules.d/50-mounts.rules
            -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
            -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
            EOF

            echo "Loading audit rules..."
            augenrules --load > /dev/null

            # Notify if a reboot is required due to immutable audit configuration
            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for successful file system mounts:

            ```yaml
            ---
            - name: Configure audit rules for successful file system mounts
              hosts: all
              become: true

              tasks:
                - name: Ensure mount audit rules are present
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-mounts.rules
                    block: |
                      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
                      -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
                    state: present
                    insertafter: EOF
                    create: yes
                    mode: '0600'
                  register: mount_audit_rules_updated
                - name: Reload audit rules if file was updated
                  ansible.builtin.command: augenrules --load
                  when: mount_audit_rules_updated.changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Notify if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit file system mounts made by unprivileged users:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/50-mounts.rules' do
