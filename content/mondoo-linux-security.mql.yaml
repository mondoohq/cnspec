  - uid: mondoo-linux-security-no-duplicate-uids-exist
    title: Ensure no duplicate UIDs exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      users.list.duplicates(uid).none()
    docs:
      desc: |
        This check verifies that no two entries in `/etc/passwd` share a UID.

        **Why this matters**

        The kernel identifies users by UID. Account names exist for humans; every permission decision, every file owner, and every audit record is made against the number.

        Two accounts sharing a UID are therefore the same user as far as the system is concerned, however different they look in `/etc/passwd`. Each can read, modify, and delete the other's files, attach a debugger to the other's processes, and use the other's credentials. Compromising either one compromises both, and a restriction placed on one account is not a restriction at all while the second name for the same UID still logs in.

        The consequences for accountability are equally direct. File ownership and audit records store the UID, and both names resolve back to whichever entry appears first in the file, so an investigation cannot determine which account acted. Where the duplicated UID is `0`, the second name is simply an additional root account that does not look like one.

        Assign a distinct UID and reassign ownership of the affected files with `find / -uid <old> -exec chown <new> {} +` before the account is used again.
      audit: |
        Run this command to list any UIDs assigned to more than one account:

        ```bash
        cut -d: -f3 /etc/passwd | sort | uniq -d
        ```

        A passing result returns no output. A failing result lists one or more duplicated UIDs.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To ensure no duplicate UIDs exist, you can use the following command to list users with duplicate UIDs for manual remediation::

            ```bash
            awk -F: '{print $3}' /etc/passwd | sort | uniq -d
            ```

            If duplicates are found, you can change the UID of a user using the `usermod` command:

            ```bash
            usermod -u <new uid> <user>
            ```
        # No Chef Infra remediation: the fix is choosing which account or group to renumber, which is a human decision rather than a converge step.
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-no-duplicate-user-names-exist
    title: Ensure no duplicate user names exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      users.list.duplicates(name).none()
    docs:
      desc: |
        This check verifies that no two entries in `/etc/passwd` share a user name.

        **Why this matters**

        Lookups by name return the first matching entry in the file. Everything else about the second entry, including its UID, its home directory, and its shell, is silently ignored by the resolver, while remaining fully present on the system.

        That gap between what is configured and what takes effect is the risk. An administrator editing the account, changing its shell, or disabling it may be working on the entry that never resolves, and conclude the change took effect when nothing changed. Meanwhile a process that authenticates through PAM and one that reads the file directly can arrive at different UIDs for the same name, so a permission decision and the identity it was based on stop agreeing.

        Duplicate names also mean a second, independent set of credentials. The password field of the shadowed entry still authenticates through paths that consult it, which leaves a working credential that no review of the visible account would surface.

        Duplicates usually arrive from a merge of account files, a partially completed migration, or a script appending rather than updating. Remove the stale entry rather than editing it, and confirm afterward that the surviving entry has the intended UID and shell.
      audit: |
        Run this command to list any user names defined more than once:

        ```bash
        cut -d: -f1 /etc/passwd | sort | uniq -d
        ```

        A passing result returns no output. A failing result lists one or more duplicated user names.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To ensure no duplicate user names exist, you can use the following command to list users with duplicate names for manual remediation:

            ```bash
            awk -F: '{print $1}' /etc/passwd | sort | uniq -d
            ```

            If duplicates are found, you can change the user name of a user using the `usermod` command:

            ```bash
            usermod -l <new login-name> <old username>
            ```
        # No Chef Infra remediation: the fix is choosing which account or group to renumber, which is a human decision rather than a converge step.
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-no-duplicate-gids-exist
    title: Ensure no duplicate GIDs exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      groups.list.duplicates(gid).none()
    docs:
      desc: |
        This check verifies that no two entries in `/etc/group` share a GID.

        **Why this matters**

        Group permissions are enforced on the GID, not the group name. When two groups share a GID, the kernel cannot distinguish them, so membership in either grants access to everything owned by the other.

        That silently widens privilege. A newly created application group that happens to reuse the GID of `docker`, `adm`, or `wheel` gives every one of its members the access that group carries, and nothing in the membership list of the privileged group changes to show it. A review of who holds administrative group access looks correct while additional people hold it.

        The reverse direction breaks operations. Files created by a member of one group show the other group's name in `ls -l`, because reverse lookup returns whichever entry comes first, so ownership no longer describes what it appears to describe and troubleshooting a permission problem leads to the wrong group.

        Assign a distinct GID, then reassign group ownership of the affected files with `find / -gid <old> -exec chgrp <new> {} +`. Check the primary GID field in `/etc/passwd` as well, since accounts pointing at the removed GID need updating too.
      audit: |
        Run this command to list any GIDs assigned to more than one group:

        ```bash
        cut -d: -f3 /etc/group | sort | uniq -d
        ```

        A passing result returns no output. A failing result lists one or more duplicated GIDs.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To ensure no duplicate GIDs exist, you can use the following command to list groups with duplicate GIDs for manual remediation:

            ```bash
            awk -F: '{print $3}' /etc/group | sort | uniq -d
            ```

            If duplicates are found, you can change the GID of a group using the `groupmod` command:

            ```bash
            groupmod -g <new gid> <old groupname>
            ```
        # No Chef Infra remediation: the fix is choosing which account or group to renumber, which is a human decision rather than a converge step.
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-no-duplicate-group-names-exist
    title: Ensure no duplicate group names exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      groups.list.duplicates(name).none()
    docs:
      desc: |
        This check verifies that no two entries in `/etc/group` share a group name.

        **Why this matters**

        Administrators and tools grant access by group name, and name resolution returns the first matching entry. The membership list of every other entry with that name is ignored by the resolver while remaining in the file.

        This produces access that does not match its record. Adding an account to a group with `usermod -aG` may write to one entry while permission checks resolve the other, so the grant appears to have been made and has no effect. Equally, an account listed in the entry that does resolve holds access that a reviewer looking at the other entry will not see. Neither outcome is visible without reading the file directly.

        Removing access has the same problem in reverse. An account removed from the wrong entry keeps its access, and the change log says otherwise.

        Where the duplicated entries also carry different GIDs, the divergence extends to file ownership, since the name resolves to one GID while files may be owned by the other.

        Consolidate the memberships into a single entry and delete the duplicate. Verify with `getent group <name>`, which shows what the system actually resolves rather than what the file contains.
      audit: |
        Run this command to list any group names defined more than once:

        ```bash
        cut -d: -f1 /etc/group | sort | uniq -d
        ```

        A passing result returns no output. A failing result lists one or more duplicated group names.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To ensure no duplicate group names exist, you can use the following command to list groups with duplicate names for manual remediation:

            ```bash
            awk -F: '{print $1}' /etc/group | sort | uniq -d
            ```

            If duplicates are found, you can change the group name of a group using the `groupmod` command:

            ```bash
            groupmod -n <new group name> <old groupname>
            ```
        # No Chef Infra remediation: the fix is choosing which account or group to renumber, which is a human decision rather than a converge step.
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-default-group-for-the-root-account-is-gid-0
    title: Ensure default group for the root account is GID 0
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      users.where(name == "root").list.all(gid == 0)
    docs:
      desc: |
        This check verifies that the `root` entry in `/etc/passwd` has a primary GID of `0`.

        **Why this matters**

        The primary GID determines the group ownership of every file root creates. With GID `0`, files that root writes belong to the `root` group, which by convention on a correctly configured system has no ordinary members.

        Pointing root at any other group inverts that. Every file root subsequently creates, including files written into `/etc`, configuration written by installers, and content generated by administrative scripts, is group-owned by that group instead. Where the group has members and the file is group-writable, which many default umasks produce, those members can modify files that were created by root and are assumed to be protected by it.

        The effect is retroactive in scope and easy to miss, because the file's owner still reads `root` in a directory listing. Only the group column changes, and it is not the column anyone checks when asking whether a file is protected.

        Startup scripts and packaging tooling also assume `root:root` ownership for system paths, so a different primary GID produces ownership that later integrity checks and package verification flag as unexpected.
      audit: |
        Run this command to inspect the primary group of the root account:

        ```bash
        grep '^root:' /etc/passwd | cut -d: -f4
        ```

        A passing result returns `0`. A failing result returns any other GID.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to set the `root` user default group to GID `0`:

            ```bash
            usermod -g 0 root
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that the default group for the root account is set to GID 0, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting default group for root account to GID 0"
            usermod -g 0 root
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To ensure that the default group for the root account is set to GID 0, you can use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure default group for root account is GID 0
              hosts: all
              become: true

              tasks:
                - name: Set root user default group to GID 0
                  ansible.builtin.user:
                    name: root
                    group: 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the primary group of the root account to GID 0:

            ```ruby
            user 'root' do
              gid 0
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-each-user-member-of-a-group
    title: Ensure each user is a member of a group
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      users.list.all(gid != empty)
    docs:
      desc: |
        This check verifies that every entry in `/etc/passwd` has a primary GID set. It is concerned with the field being populated; a separate check confirms that the GID resolves to a real group.

        **Why this matters**

        Linux has no concept of a user without a group. The primary GID is part of the process credential set assigned at login, alongside the UID, and it determines the group ownership of every file the account creates.

        An entry with the field empty or malformed leaves that credential undefined. Login and session setup can fail outright, because there is no group identity to establish, and where the session does start, the value the system falls back to is not something the administrator chose. Files the account creates then carry whatever group ownership resulted, which is either a group the account should not be writing on behalf of or one that no longer means anything.

        The management consequence is that the account cannot be controlled through groups. Group-based access, which is how permission is normally granted and revoked on a Linux host, has nothing to attach to for this account, so any access it needs has to be granted individually and is easy to overlook when it should be removed.

        Assign an appropriate primary group with `usermod -g <group> <user>`, using a dedicated per-user group where the distribution's convention calls for one.
      audit: |
        Run this command to find accounts whose primary group does not exist in `/etc/group`:

        ```bash
        for g in $(cut -d: -f4 /etc/passwd | sort -u); do getent group "$g" >/dev/null || echo "missing GID $g"; done
        ```

        A passing result returns no output. A failing result lists primary GIDs with no matching group.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To ensure that each user is a member of a group, you can run the following command to list users who are not members of any group:

            ```bash
            awk -F: '($4 == "") {print $1}' /etc/passwd
            ```

            If any users are found without a group, you can add them to a primary group using the `usermod` command:

            ```bash
            usermod -g <primary group> <user>
            ```
        # No Chef Infra remediation: the fix is choosing which account or group to renumber, which is a human decision rather than a converge step.
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-gid-in-passwd-exists-in-group
    title: Ensure all GIDs in /etc/passwd exist in /etc/group
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      users.list.all(group != empty)
    docs:
      desc: |
        This check verifies that the primary GID of every entry in `/etc/passwd` resolves to a group that exists in `/etc/group`. A GID that is set but points at nothing fails this check.

        **Why this matters**

        A dangling GID means the account has a group identity that cannot be named. Files it creates are owned by a numeric GID with no entry behind it, and `ls -l` shows the raw number where a group name should be.

        The security consequence appears later, when that GID is reused. Group IDs are allocated from a pool, so a subsequently created group can be assigned the orphaned number. At that moment every file previously written by the account becomes group-owned by the new group, and every member of it gains whatever access the file's group permissions allow. Nothing about the files changed and no permission was granted; the meaning of a number changed underneath them.

        Until that happens, the condition also breaks review. Determining who can reach a file requires resolving its group, and a GID that does not resolve cannot be assessed, so those files are quietly excluded from any audit of group access.

        Fix it by pointing the account at an existing group or by creating the missing group with the expected GID. Where the group was deleted deliberately, reassign the affected files rather than recreating it.
      audit: |
        Run this command to find GIDs referenced in `/etc/passwd` that are absent from `/etc/group`:

        ```bash
        for g in $(cut -d: -f4 /etc/passwd | sort -u); do getent group "$g" >/dev/null || echo "missing GID $g"; done
        ```

        A passing result returns no output. A failing result lists GIDs with no matching group entry.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To ensure that all GIDs in `/etc/passwd` exist in `/etc/group`, you can run the following command to list GIDs that are not defined in `/etc/group`:

            ```bash
            awk -F: '{print $4}' /etc/passwd | sort | uniq | comm -13 <(cut -d: -f3 /etc/group | sort) -
            ```

            If any GIDs are found that do not exist in `/etc/group`, you can create a group for each missing GID using the `groupadd` command:

            ```bash
            groupadd -g <gid> <groupname>
            ```
        # No Chef Infra remediation: the fix is choosing which account or group to renumber, which is a human decision rather than a converge step.
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-uid-min-is-set-to-1000
    title: Ensure UID_MIN is set to 1000
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    filters: |
      asset.kind != "container-image"
    mql: |
      logindefs.params{ _['UID_MIN'] == 1000 }
    docs:
      desc: |
        This check verifies that regular user accounts are allocated from UID 1000 upward, which is the boundary the rest of the system's security configuration treats as separating system accounts from people.

        The check reads `UID_MIN` in `/etc/login.defs`, which must be `1000`. This is the lower bound `useradd` uses when allocating a UID for a new account.

        **Why this matters**

        `UID_MIN` is not just a setting for the account creation tool. It is the number that the rest of the system's security configuration keys on to answer the question of whether a UID belongs to a person.

        Audit rules are the clearest example. The rules in this policy filter on `auid>=1000` so that they record actions by real users while excluding the constant background activity of system daemons. Those rules take the number literally. On a host where `UID_MIN` is `500`, accounts are created from 500 upward, and every user allocated below 1000 falls outside the filter. Their file deletions, permission changes, and mount operations are never recorded, and the audit configuration reports as correctly installed the entire time.

        `SYS_UID_MAX` and PAM policies that distinguish system from interactive accounts depend on the same boundary, as does this policy's check that no interactive account is a member of the `root` group.

        Changing `UID_MIN` does not renumber accounts that already exist. On a host that was provisioned with a lower value, correct the setting and then review whether any existing account falls below the new boundary, since those accounts remain outside the filters that assume it.
      audit: |
        Run this command to inspect the minimum UID for regular accounts:

        ```bash
        grep -E '^UID_MIN' /etc/login.defs
        ```

        A passing result shows `UID_MIN 1000`. A failing result shows a different value or the setting absent.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            This setting affects only accounts created after the change. It does not renumber existing accounts, so any current UID overlaps must be corrected separately. Edit the `/etc/login.defs` file and set UID_MIN:

            ```text
            UID_MIN                  1000
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that `UID_MIN` is set to 1000, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting UID_MIN to 1000 in /etc/login.defs"
            if grep -q '^UID_MIN' /etc/login.defs; then
              sed -i 's/^UID_MIN.*/UID_MIN                  1000/' /etc/login.defs
            else
              echo 'UID_MIN                  1000' >> /etc/login.defs
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To ensure that `UID_MIN` is set to 1000, you can use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure UID_MIN is set to 1000
              hosts: all
              become: true

              tasks:
                - name: Set UID_MIN in /etc/login.defs
                  ansible.builtin.lineinfile:
                    path: /etc/login.defs
                    regexp: '^UID_MIN'
                    line: 'UID_MIN                  1000'
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set `UID_MIN` in `/etc/login.defs`. The value only applies to accounts created after the change, so renumber any existing regular account that sits below it:

            ```ruby
            login_defs = '/etc/login.defs'

            ruby_block 'set UID_MIN in login.defs' do
              block do
                body = ::File.read(login_defs)
                directive = 'UID_MIN                  1000'
                body = if body.match?(/^\s*UID_MIN\s/)
                         body.gsub(/^\s*UID_MIN\s.*$/, directive)
                       else
                         "#{body.chomp}\n#{directive}\n"
                       end
                ::File.write(login_defs, body)
              end
              not_if { ::File.read(login_defs).match?(/^UID_MIN\s+1000\s*$/) }
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man5/login.defs.5.html
        title: login.defs Manual Page
  - uid: mondoo-linux-security-shadow-group-is-empty
    title: Ensure shadow group is empty
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      groups.where(name == "shadow").all(members.length == 0)
    docs:
      desc: |
        This check verifies that the `shadow` group has no members. On Debian-based distributions this group owns `/etc/shadow` and `/etc/gshadow`, which are mode `0640`, so membership confers read access to both.

        **Why this matters**

        Every other control on `/etc/shadow` exists to keep the password hashes away from accounts that are not root. Membership in this group grants exactly that access and bypasses all of them.

        Once a hash is readable it can be copied, and once copied it is attacked offline. There is no rate limit, no failed-login record, no lockout, and no signal to anyone that it is happening. Password reuse extends the result well past this host.

        Membership is usually well-intentioned. A monitoring agent, a backup process, or an application that needs to verify passwords is added to the group because doing so is simpler than the alternative, and it stays there. That account then holds the same access as root over every credential on the system, while looking in every listing like an ordinary service account.

        Where a service genuinely needs to verify passwords, use PAM, which performs the check without exposing the file. Where a backup needs the file, run it as root with a narrowly scoped `sudo` rule rather than granting standing group membership. The group read bit on `/etc/shadow` is only safe while this group is empty.
      audit: |
        Run this command to inspect the membership of the shadow group:

        ```bash
        getent group shadow
        ```

        A passing result shows no users in the final field. A failing result lists one or more members.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. To ensure that the `shadow` group is empty, you can run the following command to remove all users from the `shadow` group:

                ```bash
                gpasswd -d <user> shadow
                ```

            2. To change the primary group of any users with `shadow` as their primary group, you can run:

                ```bash
                usermod -g <new_group> <user>
                ```

                Replace `<user>` with the username and `<new_group>` with the desired primary group.
        - id: bash
          desc: |
            **Using a Bash Script**

            **Warning: review the affected accounts before running.** This script reassigns the primary group of every user whose primary group is `shadow` to `users`, which can break service accounts that depend on their current primary group. List the affected users first with `getent group shadow` and `awk -F: -v g="$(getent group shadow | cut -d: -f3)" '$4==g{print $1}' /etc/passwd`, confirm each is safe to change, and choose the correct replacement group rather than assuming `users`. To ensure that the `shadow` group is empty, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Removing users from shadow group"
            for user in $(getent group shadow | cut -d: -f4 | tr ',' ' '); do
              echo "Removing $user from shadow group"
              gpasswd -d "$user" shadow
            done

            SHADOW_GID=$(getent group shadow | cut -d: -f3)
            echo "Changing primary group for users whose primary group is shadow"
            while IFS=: read -r user _ _ gid _; do
              if [ "$gid" = "$SHADOW_GID" ]; then
                # Replace users with the desired primary group before running this loop
                usermod -g users "$user"
              fi
            done < /etc/passwd
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To ensure that the `shadow` group is empty, you can use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure shadow group is empty
              hosts: all
              become: true

              tasks:
                - name: Read shadow group membership
                  ansible.builtin.command: getent group shadow
                  register: shadow_group
                  changed_when: false
                  failed_when: false

                - name: Remove users from shadow group
                  ansible.builtin.command: "gpasswd -d {{ item }} shadow"
                  loop: "{{ (shadow_group.stdout.split(':')[3].split(',') | select | list) if shadow_group.rc == 0 else [] }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to empty the `shadow` group. Members of this group can read the password hashes of every account on the host, so move any service that needs them to a dedicated group with an explicit ACL instead:

            ```ruby
            group 'shadow' do
              members []
              append false
              action :modify
              only_if 'getent group shadow'
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-root-group-is-empty
    title: Ensure root group is empty
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      groups.where(name == "root").all(members.all(uid < 1000))
    docs:
      desc: |
        This check verifies that no interactive account, meaning UID 1000 or above, is a member of the `root` group, whether through the primary GID field in `/etc/passwd` or as a supplementary member in `/etc/group`.

        Distribution-provided system accounts below UID 1000, such as `sync`, `shutdown`, `halt`, and `operator`, ship with `root` as their primary group by design on some distributions. These are non-interactive and are not flagged; they should not be removed or reassigned.

        Identifying members by UID rather than by an allowlist of account names keeps the check robust across distributions, since system account names differ between Debian, RHEL, SUSE, and Alpine. The tradeoff is that a system account manually added to the `root` group is tolerated. That is a deliberate accepted gap: the `SYS_UID_MAX` boundary in `/etc/login.defs` reserves UIDs below 1000 for non-interactive accounts at creation time.

        **Why this matters**

        The `root` group owns a large portion of `/etc`, `/usr`, and the system's device nodes. Where any of that is group-writable, and some of it is on most systems, a member of the group can modify it.

        That reaches privilege quickly and without an exploit. A group-writable file under `/etc` that is read by a process running as root, a script executed by a systemd unit, or a cron job, becomes code the group member controls and root executes. The escalation looks like normal system activity because it is normal system activity, running content someone else supplied.

        Membership is also invisible in the places people check. Reviews of administrative access look at `sudo` and `wheel`; `root` group membership grants a comparable degree of access and appears in neither.
      audit: |
        `getent group root` only shows *supplementary* members. A user's *primary* group (the GID field in `/etc/passwd`) does not appear there, so you must inspect both sources.

        List supplementary members of the root group:

        ```bash
        getent group root
        ```

        List every account whose *primary* group is root (GID 0):

        ```bash
        awk -F: '$4 == 0 {print $1}' /etc/passwd
        ```

        A passing result shows only `root` and distribution-provided system accounts (UID below 1000, e.g. `sync`, `shutdown`, `halt`, `operator`). A failing result lists an interactive user account (UID 1000 or above) — that is the account you need to remediate. System accounts with root as their primary group are expected and should be left in place.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            This check only flags **interactive** user accounts (UID 1000 and above). Distribution-provided system accounts (UID below 1000, such as `sync`, `shutdown`, `halt`, and `operator`) are expected to have `root` as their primary group and must **not** be changed — reassigning them can break the system.

            1. To remove an interactive user from the `root` group (supplementary membership), run:

                ```bash
                gpasswd -d <user> root
                ```

            2. If an interactive user has `root` as their *primary* group, reassign it to an appropriate group:

                ```bash
                usermod -g <new_group> <user>
                ```

                Replace `<user>` with the username and `<new_group>` with the desired primary group.
        - id: bash
          desc: |
            **Using a Bash Script**

            **Warning: review the affected accounts before running.** This script only touches **interactive** accounts (UID 1000 and above); it deliberately leaves distribution-provided system accounts (UID below 1000) alone, since those are expected to belong to the `root` group. It reassigns the primary group of any interactive user whose primary group is `root` (GID 0) to `users` — confirm that is the correct replacement group for your environment first. List the affected users with `awk -F: '$4==0 && $3>=1000 {print $1}' /etc/passwd` before running.

            ```bash
            #!/bin/bash
            set -e

            echo "Removing interactive users from root group"
            for user in $(getent group root | cut -d: -f4 | tr ',' ' '); do
              # Default to a high UID so stale entries (in /etc/group but not /etc/passwd)
              # are treated as interactive and removed, rather than silently skipped.
              uid=$(id -u "$user" 2>/dev/null || echo 65534)
              if [ "$user" != "root" ] && [ "$uid" -ge 1000 ]; then
                echo "Removing $user from root group"
                gpasswd -d "$user" root || true
              fi
            done

            echo "Changing primary group for interactive users whose primary group is root"
            awk -F: '$4 == 0 && $3 >= 1000 {print $1}' /etc/passwd | while IFS= read -r user; do
              if [ "$user" != "root" ]; then
                # Replace users with the desired primary group before running this loop
                usermod -g users "$user"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To ensure that the `root` group is empty, you can use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure root group is empty
              hosts: all
              become: true

              tasks:
                - name: Read root group membership
                  ansible.builtin.command: getent group root
                  register: root_group
                  changed_when: false

                - name: Remove users from root group
                  ansible.builtin.command: "gpasswd -d {{ item }} root"
                  loop: "{{ (root_group.stdout.split(':')[3] | default('')).split(',') | select | reject('eq', 'root') | list }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to remove the secondary members of the `root` group. Grant administrative access through sudo instead, which records who ran what:

            ```ruby
            group 'root' do
              members []
              append false
              action :modify
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-system-accounts-are-non-login
    title: Ensure system accounts are non-login
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    mql: |
      users.where( name.notIn(["root", "sync", "shutdown", "halt"]) ).where( uid < 1000 ).list {
        shell.in(["/usr/bin/nologin", "/sbin/nologin", "/usr/sbin/nologin"])
      }
    docs:
      desc: |
        This check verifies that accounts with a UID below 1000, other than `root`, `sync`, `shutdown`, and `halt`, have a shell of `/sbin/nologin`, `/usr/sbin/nologin`, or `/usr/bin/nologin`.

        **Why this matters**

        System accounts exist so that daemons can drop privileges. `nginx`, `postgres`, `redis`, and their peers each own their files and run their processes as a dedicated account, which is what limits the damage when one of them is compromised.

        None of them needs an interactive shell, and giving one to them undoes part of that separation. A service account with a working shell can be logged into, which means it becomes a target for password guessing and for any authorized key that finds its way into its home directory. More importantly, it changes what a compromise of the service yields: a web application vulnerability that permits command execution as `www-data` gives the attacker a usable interactive session when that account has a shell, and a considerably more awkward foothold when it does not.

        `nologin` refuses the login, prints a message, and exits. It does not prevent the service from running, because daemons are started by systemd or an init script rather than by logging in, and it does not block `su - <account> -s /bin/bash` for an administrator who genuinely needs to run something as that account.

        Use `nologin` rather than `/bin/false`, since it produces a clear message and a logged, distinguishable event.
      audit: |
        Run this command to find system accounts (UID below 1000) with an interactive login shell:

        ```bash
        awk -F: '($3 < 1000 && $1 !~ /^(root|sync|shutdown|halt)$/ && $7 !~ /nologin|false/) {print $1, $7}' /etc/passwd
        ```

        A passing result returns no output. A failing result lists system accounts with a login shell.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. To list all system accounts with a UID below 1000, other than `root`, `sync`, `shutdown`, and `halt`, that still have a login shell, run:

                ```bash
                awk -F: '($3 < 1000 && $1 !~ /^(root|sync|shutdown|halt)$/ && $7 !~ /nologin|false/) {print $1}' /etc/passwd
                ```

            2. To set the shell for each listed system account to `/usr/sbin/nologin`, run:

                ```bash
                usermod -s /usr/sbin/nologin <user>
                ```

            3. Lock the `sync`, `shutdown`, and `halt` users to prevent login:

                ```bash
                usermod -L sync
                usermod -L shutdown
                usermod -L halt
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that all system accounts are non-login, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting shell for system accounts to nologin"
            while IFS=: read -r user _ uid _ _ _ _; do
              case "$user" in root|sync|shutdown|halt) continue ;; esac
              if [ "$uid" -lt 1000 ]; then
                echo "Setting nologin shell for user: $user"
                usermod -s /usr/sbin/nologin "$user"
              fi
            done < /etc/passwd

            # Only Red Hat family distributions ship the shutdown and halt accounts, so
            # check each one exists before locking it. Without the guard usermod exits
            # non-zero on Debian and Ubuntu and `set -e` aborts the script.
            for account in sync shutdown halt; do
              if getent passwd "$account" >/dev/null; then
                echo "Locking the $account account"
                usermod -L "$account"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To ensure that system accounts are non-login, you can use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure system accounts are non-login
              hosts: all
              become: true

              tasks:
                - name: Find system accounts with a login shell
                  ansible.builtin.shell: |
                    awk -F: '($3 < 1000 && $1 !~ /^(root|sync|shutdown|halt)$/ && $7 !~ /nologin|false/) {print $1}' /etc/passwd
                  register: system_accounts
                  changed_when: false

                - name: Set shell for system accounts to nologin
                  ansible.builtin.user:
                    name: "{{ item }}"
                    shell: /usr/sbin/nologin
                  loop: "{{ system_accounts.stdout_lines }}"

                # Only Red Hat family distributions ship the shutdown and halt accounts.
                # ansible.builtin.user defaults to state: present, so looping over the
                # names without this filter creates them on Debian and Ubuntu.
                - name: Read the accounts defined on the host
                  ansible.builtin.getent:
                    database: passwd

                - name: Lock the sync, shutdown, and halt accounts that exist
                  ansible.builtin.user:
                    name: "{{ item }}"
                    password_lock: true
                  loop: "{{ ['sync', 'shutdown', 'halt'] | select('in', ansible_facts.getent_passwd) | list }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to give every system account a non-login shell and lock the accounts that exist only to run a single command:

            ```ruby
            nologin_shell = ::File.exist?('/usr/sbin/nologin') ? '/usr/sbin/nologin' : '/sbin/nologin'

            ::File.readlines('/etc/passwd').each do |entry|
              account, _password, uid, _gid, _comment, _home, shell = entry.chomp.split(':')

              next if %w(root sync shutdown halt).include?(account)
              next if uid.to_i >= 1000
              next if shell.to_s.match?(/nologin|false/)

              user account do
                shell nologin_shell
              end
            end

            %w(sync shutdown halt).each do |account|
              user account do
                action :lock
                only_if "getent passwd #{account}"
              end
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-access-to-the-su-command-is-restricted
    title: Ensure access to the su command is restricted
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    filters: |
      asset.kind != "container-image"
      pam.conf.exists
    mql: |
      // `su` should be limited to a trusted group by pam_wheel, which keys on the
      // caller's real uid. Selecting the service by name returns an empty list when
      // `/etc/pam.d/su` is absent, so a host missing the file fails this check
      // rather than feeding a null into the group comparison.
      suRestrictedPam = pam.conf.service(name: "su").entries.where(pamType == "auth" && module == "pam_wheel.so" && params["use_uid"] != null)
      suRestrictedGroups = suRestrictedPam.where(params["group"] != null).map(params["group"])

      suRestrictedPam != empty
      groups.map(name).containsAll(suRestrictedGroups)
      suRestrictedGroups != empty || groups.any(name.in(["wheel", "sudo"]))
    docs:
      desc: |
        This check verifies that use of the `su` command is restricted to members of a trusted group rather than being available to every account on the host.

        The check reads `/etc/pam.d/su` for a `pam_wheel.so` entry with `use_uid`, which limits `su` to a named group such as `wheel` or `sudo`. A host with no `/etc/pam.d/su` file fails the check rather than being skipped.

        **Why this matters**

        `su` is setuid root and is executable by every account on the system by default. Without `pam_wheel`, any local account may invoke it and attempt to become root, which means every account on the host is an unlimited password-guessing position against the root password. Those attempts run locally, at whatever rate the CPU allows, and produce far less attention than an equivalent number of network authentication failures.

        Restricting `su` to a group turns that into a two-step problem. An attacker must first compromise an account that is a member of the trusted group, which is a much smaller and better-monitored set, before the root password is even reachable as a target.

        `use_uid` is the part of the configuration that matters. Without it, `pam_wheel` evaluates the effective UID, which can be manipulated in some invocation contexts. With it, the module tests the caller's real UID, which is the identity that actually initiated the command.

        Prefer `sudo` over `su` generally. `sudo` authenticates the user with their own password, logs the specific command, and can be scoped to individual commands, where `su` grants a full root shell and records only that the switch occurred.
      audit: |
        Run this command and verify output includes matching line:

        ```console
        # grep pam_wheel.so /etc/pam.d/su
        auth required pam_wheel.so use_uid
        ```

        If the PAM line does not specify a `group=` option, verify users in the `wheel` or `sudo` group match site policy:

        ```console
        # grep wheel /etc/group
        wheel:x:10:root,<user list>
        ```
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: confirm the `wheel` group has an administrator before you apply this.** With `pam_wheel.so use_uid` and no `group=` option, PAM allows `su` only for members of the `wheel` group. If that group is empty, no one can `su` to root. Debian and Ubuntu do not populate `wheel` by default because they rely on `sudo`, so add at least one trusted administrative account to `wheel` first and verify it can `su` in a separate session before you close your current one.

            To restrict access to the `su` command, you can edit the `/etc/pam.d/su` file and add the following line:

            ```bash
            echo "auth required pam_wheel.so use_uid" >> /etc/pam.d/su
            ```

            If users need `su` access, add them to the `wheel` group:

            ```bash
            usermod -aG wheel <user>
            ```

            If you want to lock down the use of the command `su` entirely instead, you need to create an empty group, for example `sugroup`:

            ```bash
            groupadd sugroup
            ```

            Then add the following line to the `/etc/pam.d/su` file:

            ```text
            auth required pam_wheel.so use_uid group=sugroup
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            **Warning: confirm the `wheel` group has an administrator before you apply this.** If the `wheel` group is empty, this configuration prevents anyone from running `su` to root. Debian and Ubuntu do not populate `wheel` by default, so add a trusted administrative account to it first and verify `su` works in a separate session. To restrict access to the `su` command to members of the `wheel` group, run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Restricting access to su command"
            if ! grep -qE '^\s*auth\s+required\s+pam_wheel\.so\s+use_uid' /etc/pam.d/su; then
              echo "auth required pam_wheel.so use_uid" >> /etc/pam.d/su
            fi

            # Grant su access to each authorized user:
            # usermod -aG wheel <user>
            ```

            To lock down use of the `su` command entirely instead, create an empty group and reference it in the PAM configuration in place of the line above:

            ```bash
            groupadd sugroup
            echo "auth required pam_wheel.so use_uid group=sugroup" >> /etc/pam.d/su
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning: confirm the `wheel` group has an administrator before you apply this.** If the `wheel` group is empty, this configuration prevents anyone from running `su` to root. Debian and Ubuntu do not populate `wheel` by default, so add a trusted administrative account to it first and verify `su` works in a separate session. To restrict access to the `su` command, you can use the following Ansible playbook:

            ```yaml
            ---
            - name: Restrict access to su command
              hosts: all
              become: true

              tasks:
                - name: Ensure pam_wheel.so is configured in /etc/pam.d/su
                  ansible.builtin.lineinfile:
                    path: /etc/pam.d/su
                    regexp: '^auth required pam_wheel.so use_uid'
                    line: 'auth required pam_wheel.so use_uid'
                    create: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **Warning: confirm the `wheel` group has an administrator before you apply this.** If the `wheel` group is empty, this configuration prevents anyone from running `su` to root. Debian and Ubuntu do not populate `wheel` by default, so add a trusted administrative account to it first and verify `su` works in a separate session. Use this Chef Infra recipe code to restrict the `su` command to the `wheel` group:

            ```ruby
            pam_su = '/etc/pam.d/su'

            ruby_block 'restrict su to the wheel group' do
              block do
                body = ::File.exist?(pam_su) ? ::File.read(pam_su) : ''
                directive = 'auth required pam_wheel.so use_uid'
                # Append rather than prepend. PAM ignores the success of a `sufficient`
                # module once an earlier `required` module has failed, so placing this
                # line above `auth sufficient pam_rootok.so` would stop root from
                # running `su` whenever root is not a member of the wheel group.
                body = if body.match?(/^\s*auth\s+required\s+pam_wheel\.so\b/)
                         body.gsub(/^\s*auth\s+required\s+pam_wheel\.so\b.*$/, directive)
                       else
                         "#{body.chomp}\n#{directive}\n".lstrip
                       end
                ::File.write(pam_su, body)
              end
              not_if { ::File.exist?(pam_su) && ::File.read(pam_su).match?(/^auth\s+required\s+pam_wheel\.so\s+use_uid\s*$/) }
            end
            ```
    refs:
      - url: https://www.linux-pam.org/Linux-PAM-html/
        title: Linux-PAM System Administrator's Guide
  - uid: mondoo-linux-security-selinux-enforcing
    title: Ensure SELinux is in enforcing mode
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      selinux.mode == "enforcing"
    docs:
      desc: |
        This check verifies that SELinux is currently enforcing its policy rather than merely loaded and logging.

        SELinux is the kernel's mandatory access control system. It labels every process and every object and consults a policy on each access, independently of the file permissions and of the process's user ID. It has three runtime states: enforcing, where a denied access fails; permissive, where the same access is allowed but logged; and disabled, where no policy is consulted. The check reads the running mode, the value `getenforce` reports, and requires it to be enforcing. A companion check in this policy covers the persistent setting that survives a reboot.

        **Why this matters**

        Discretionary permissions answer whether a process may open a file. SELinux answers whether a process of this type may open a file of that type, which is a much narrower question, and it is the question that constrains a service after it has been exploited.

        The difference shows up at the moment it is needed. A web server compromised through its own code runs as its own account and, without SELinux, may read anything that account may read: application configuration holding database credentials, private keys in its own certificate directory, and any world-readable file on the host. Under an enforcing targeted policy the same process is confined to the types its domain permits, so the exploit yields a shell that cannot read the key material, cannot write outside a handful of directories, and cannot connect outbound to a port the policy does not allow.

        Permissive mode gives none of that. The denials are written to the audit log and the access proceeds anyway, which is useful while a policy is being developed and worthless as a control.

        Permissive is the right setting while collecting denials for a new workload. Do that for a bounded period, resolve the denials with correct file contexts and booleans rather than a blanket allow, and return the host to enforcing.
      audit: |
        Run this command to inspect the current SELinux mode:

        ```bash
        getenforce
        ```

        A passing result reports `Enforcing`. A failing result reports `Permissive` or `Disabled`.
      remediation:
        - id: cli
          desc: |
            1. Set SELinux to enforcing mode immediately (does not survive reboot):

                ```bash
                setenforce 1
                ```

            2. To make the change persistent, edit `/etc/selinux/config` and set:

                ```ini
                SELINUX=enforcing
                ```

            3. Reboot the system to fully apply the policy:

                ```bash
                reboot
                ```

            **Note:** Switching from disabled to enforcing requires a system relabel. On the next boot, SELinux will automatically relabel the filesystem, which may take several minutes depending on disk size.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to put SELinux into enforcing mode. It writes the persistent setting first so the runtime change cannot be lost on the next boot:

            ```bash
            #!/bin/bash
            set -e

            CONF=/etc/selinux/config

            if grep -qE '^[[:space:]]*SELINUX=' "$CONF"; then
              echo "Setting SELINUX=enforcing in $CONF"
              sed -i 's/^[[:space:]]*SELINUX=.*/SELINUX=enforcing/' "$CONF"
            else
              echo "Adding SELINUX=enforcing to $CONF"
              echo 'SELINUX=enforcing' >> "$CONF"
            fi

            if setenforce 1; then
              echo "SELinux is now enforcing."
            else
              # Moving from disabled to enforcing needs a full file system relabel, which
              # only happens during boot.
              touch /.autorelabel
              echo "SELinux was disabled at boot. Reboot to relabel the file system and enforce."
            fi
            ```
        - id: ansible
          desc: |
            The `ansible.posix.selinux` module updates the persistent configuration and applies enforcing mode at runtime where possible, but switching from disabled requires a relabel on the next boot. The module reports `reboot_required` when a reboot is needed to fully apply the policy, so gate a reboot on that result to keep the runtime state and the persistent config from diverging:

            ```yaml
            ---
            - name: Ensure SELinux is in enforcing mode
              hosts: all
              become: true

              tasks:
                - name: Set SELinux to enforcing
                  ansible.posix.selinux:
                    policy: targeted
                    state: enforcing
                  register: selinux_state

                - name: Reboot to complete the SELinux relabel and policy load
                  ansible.builtin.reboot:
                  when: selinux_state.reboot_required | default(false)
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **Warning: this reboots the host when SELinux was disabled.** Moving from disabled to enforcing requires a full file system relabel, which only happens during boot. On a host that is already permissive, the switch takes effect immediately and no reboot is triggered. Use this Chef Infra recipe code to put SELinux into enforcing mode:

            ```ruby
            selinux_install 'selinux tools'

            selinux_state 'enforcing' do
              policy 'targeted'
              automatic_reboot true
              action :enforcing
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/using_selinux/changing-selinux-states-and-modes_using-selinux
        title: Red Hat - Changing SELinux states and modes
  - uid: mondoo-linux-security-selinux-config-enforcing
    title: Ensure SELinux config is set to enforcing
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      selinux.configMode == "enforcing"
    docs:
      desc: |
        This check verifies that the SELinux mode chosen at boot is enforcing, so the protection is still in place after the host restarts.

        The runtime mode and the persistent mode are two separate settings. `setenforce 1` changes the running kernel and nothing else; the mode the host comes back with is the `SELINUX=` line in `/etc/selinux/config`. The check reads that file and requires `SELINUX=enforcing`. A companion check in this policy covers the runtime mode.

        **Why this matters**

        A host can pass a runtime check and still be one reboot away from having no mandatory access control at all. That is not an unusual state, it is the normal outcome of a common sequence. Someone hits a denial while installing an application, runs `setenforce 0` to get past it, finishes the work, and never returns the host to enforcing in the file. The runtime mode is later corrected, or the machine is left running untouched for months, and the discrepancy stays invisible until an unrelated reboot removes the confinement.

        The same discrepancy is worth an attacker's attention precisely because it is quiet. Editing one line in `/etc/selinux/config` changes nothing observable: no service restarts, no denial appears, no monitoring alert fires, and the running system continues to enforce. The confinement disappears at the next reboot, which will be attributed to patching or to a hardware event rather than to the edit that caused it.

        Moving from disabled to enforcing is not purely a configuration change. The filesystem carries no security labels while SELinux is off, so the next boot performs a full relabel, taking time proportional to the number of files. Plan that reboot rather than discovering the relabel during an incident, and confirm afterwards that the running mode and the file agree.
      audit: |
        Run this command to inspect the persistent SELinux mode:

        ```bash
        grep -E '^SELINUX=' /etc/selinux/config
        ```

        A passing result shows `SELINUX=enforcing`. A failing result shows `permissive` or `disabled`.
      remediation:
        - id: cli
          desc: |
            Edit `/etc/selinux/config` and ensure the following line is set:

            ```ini
            SELINUX=enforcing
            ```

            This change takes effect on the next reboot. To also enforce immediately, run:

            ```bash
            setenforce 1
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to set enforcing mode in the persistent SELinux configuration:

            ```bash
            #!/bin/bash
            set -e

            CONF=/etc/selinux/config

            if grep -qE '^[[:space:]]*SELINUX=' "$CONF"; then
              echo "Setting SELINUX=enforcing in $CONF"
              sed -i 's/^[[:space:]]*SELINUX=.*/SELINUX=enforcing/' "$CONF"
            else
              echo "Adding SELINUX=enforcing to $CONF"
              echo 'SELINUX=enforcing' >> "$CONF"
            fi

            # Bring the running kernel into line as well. This fails when SELinux was
            # disabled at boot, in which case only a reboot can load the policy.
            if ! setenforce 1; then
              echo "SELinux was disabled at boot. Reboot to load the policy."
            fi
            ```
        - id: ansible
          desc: |
            ```yaml
            ---
            - name: Ensure SELinux config is set to enforcing
              hosts: all
              become: true

              tasks:
                - name: Set SELinux to enforcing in config
                  ansible.posix.selinux:
                    policy: targeted
                    state: enforcing
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set enforcing mode in `/etc/selinux/config` so the policy survives a reboot:

            ```ruby
            selinux_install 'selinux tools'

            selinux_state 'enforcing' do
              policy 'targeted'
              action :enforcing
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/using_selinux/changing-selinux-states-and-modes_using-selinux
        title: Red Hat - Changing SELinux states and modes
  - uid: mondoo-linux-security-chrony-time-source-is-configured
    title: Ensure a time source is configured in chrony
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-45
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    filters: |
      package('chrony').installed
    mql: |
      chrony.conf.servers != [] || chrony.conf.pools != []
    docs:
      desc: |
        This check verifies that chrony has at least one upstream time source configured, so the daemon has something to synchronize the clock against.

        chrony is the time synchronization daemon on most current distributions. It disciplines the system clock against remote reference clocks, but only against the ones it has been given. The check reads the chrony configuration, `/etc/chrony.conf` on Red Hat based systems and `/etc/chrony/chrony.conf` on Debian based ones, and requires at least one `server` or `pool` directive. Some packages ship the daemon with every source commented out, which leaves chrony running, reporting no error, and correcting nothing.

        **Why this matters**

        Every security record on the host is stamped with the local clock, and a stamp is only useful relative to the stamps on other hosts. When one machine drifts, its events cannot be ordered against the firewall, the authentication server, or the application tier, and the reconstruction of an incident stops at the point where the sequence matters most.

        Authentication depends on the same clock directly. Kerberos rejects a ticket whose timestamp falls outside a tolerance of a few minutes, so a drifting host loses domain authentication outright. TLS is the more dangerous case, because certificate validity is evaluated against local time: a clock set behind real time accepts certificates that have expired or been revoked and replaced, and a clock set ahead rejects valid ones. Time-based one-time passwords fail the same way.

        Drift is also something an attacker can use. Where a host takes time from a source they influence, moving the clock moves the timestamps on the records of what they did, and it can push a session or a token outside the window in which it would have been questioned.

        Point the host at sources the organization controls or explicitly trusts, and configure more than one so a single unreachable server does not leave the clock unattended.
      audit: |
        Run this command to confirm chrony is tracking at least one time source:

        ```bash
        chronyc sources
        ```

        Then inspect the configuration for a configured source:

        ```bash
        grep -E '^\s*(server|pool)\s' /etc/chrony.conf /etc/chrony/chrony.conf 2>/dev/null
        ```

        A passing result lists one or more `server` or `pool` entries and shows reachable sources in `chronyc sources`. A failing result returns no `server` or `pool` directives.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Add an authorized time source to the chrony configuration for your distribution, then restart the daemon. Red Hat-based systems use `/etc/chrony.conf`; Debian-based systems use `/etc/chrony/chrony.conf`:

            ```bash
            CONF=/etc/chrony.conf
            [ -f "$CONF" ] || CONF=/etc/chrony/chrony.conf
            echo "pool 2.pool.ntp.org iburst" >> "$CONF"
            systemctl restart chronyd 2>/dev/null || systemctl restart chrony
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to add a pool directive if none is configured and restart chrony:

            ```bash
            #!/bin/bash
            set -e

            CONF=/etc/chrony.conf
            [ -f "$CONF" ] || CONF=/etc/chrony/chrony.conf

            if ! grep -qE '^\s*(server|pool)\s' "$CONF"; then
              echo "pool 2.pool.ntp.org iburst" >> "$CONF"
            fi

            systemctl restart chronyd 2>/dev/null || systemctl restart chrony
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to ensure a time source is configured and chrony is running:

            ```yaml
            ---
            - name: Configure a chrony time source
              hosts: all
              become: true

              tasks:
                - name: Check for the Debian chrony configuration path
                  ansible.builtin.stat:
                    path: /etc/chrony/chrony.conf
                  register: debian_chrony

                - name: Ensure a pool directive is present
                  ansible.builtin.lineinfile:
                    path: "{{ debian_chrony.stat.exists | ternary('/etc/chrony/chrony.conf', '/etc/chrony.conf') }}"
                    line: "pool 2.pool.ntp.org iburst"
                    regexp: '^\s*pool\s'
                    state: present
                  notify: Restart chrony

              handlers:
                - name: Restart chrony
                  ansible.builtin.service:
                    name: "{{ debian_chrony.stat.exists | ternary('chrony', 'chronyd') }}"
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to configure a chrony time source. Replace the public pool with your own time servers where site policy requires it:

            ```ruby
            debian = ::File.exist?('/etc/chrony/chrony.conf')
            chrony_conf = debian ? '/etc/chrony/chrony.conf' : '/etc/chrony.conf'
            chrony_service = debian ? 'chrony' : 'chronyd'

            service chrony_service do
              action :nothing
            end

            ruby_block 'configure a chrony time source' do
              block do
                body = ::File.exist?(chrony_conf) ? ::File.read(chrony_conf) : ''
                directive = 'pool 2.pool.ntp.org iburst'
                body = if body.match?(/^\s*pool\s/)
                         body.gsub(/^\s*pool\s.*$/, directive)
                       else
                         "#{body.chomp}\n#{directive}\n".lstrip
                       end
                ::File.write(chrony_conf, body)
              end
              not_if { ::File.exist?(chrony_conf) && ::File.read(chrony_conf).match?(/^\s*(pool|server)\s+\S+/) }
              notifies :restart, "service[#{chrony_service}]", :delayed
            end
            ```
    refs:
      - url: https://chrony-project.org/documentation.html
        title: chrony - Documentation
  - uid: mondoo-linux-security-timesyncd-time-source-is-configured
    title: Ensure a time source is configured in systemd-timesyncd
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-45
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    filters: |
      systemd.timesyncd.active
    mql: |
      systemd.timesyncd.servers != []
    docs:
      desc: |
        This check verifies that systemd-timesyncd, where it is the active time client, has its time servers set explicitly rather than falling back on the ones compiled into the distribution package.

        The daemon reads `NTP=` from `/etc/systemd/timesyncd.conf`, or from a drop-in beneath it, and turns to its fallback list only when that setting is empty or unreachable. The check requires a configured server list, which `timedatectl show-timesync --all` reports as the system servers rather than the fallback ones.

        **Why this matters**

        Falling back is not the same as being unconfigured, and that is what makes it easy to miss. The clock is usually correct, `timedatectl` reports synchronization, and nothing looks wrong. What has actually happened is that the host takes its time from whichever public servers the distribution vendor chose, over the open internet, on a path nobody in the organization designed.

        Three things follow. In a segmented or air-gapped network those servers are unreachable, so the daemon retries and the clock quietly free-runs until the drift is large enough to break authentication. Where they are reachable, the traffic leaves the network unauthenticated and can be answered by anyone in a position to do so, and a supplied offset is enough to make an expired certificate appear valid or to shift the timestamps written into logs. And when time goes wrong across a fleet, the fallback servers are outside the organization's ability to investigate or fix.

        Pinning the sources also makes the configuration reviewable. An explicit list can be checked against the network design and against firewall policy; a compiled-in default cannot.

        Set the servers the organization operates or has approved, list more than one, and confirm afterwards that the daemon reports them as its system servers rather than continuing on the fallback list.
      audit: |
        Run this command to display the configured NTP servers and synchronization state:

        ```bash
        timedatectl show-timesync --all
        ```

        Also inspect the configuration file directly:

        ```bash
        grep -E '^\s*NTP=' /etc/systemd/timesyncd.conf
        ```

        A passing result lists one or more servers in the `SystemNTPServers` field or a non-empty `NTP=` directive. A failing result shows only fallback servers and no configured `NTP=` value.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Set an authorized NTP server in the timesyncd configuration and restart the service. The `NTP=` setting must be added if the file does not already contain one:

            ```bash
            CONF=/etc/systemd/timesyncd.conf
            if grep -qE '^#?NTP=' "$CONF"; then
              sed -i 's/^#\?NTP=.*/NTP=2.pool.ntp.org/' "$CONF"
            else
              printf '[Time]\nNTP=2.pool.ntp.org\n' >> "$CONF"
            fi
            systemctl restart systemd-timesyncd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure an `NTP=` server is configured and restart timesyncd:

            ```bash
            #!/bin/bash
            set -e

            CONF=/etc/systemd/timesyncd.conf

            if grep -qE '^\s*NTP=' "$CONF"; then
              sed -i 's/^\s*NTP=.*/NTP=2.pool.ntp.org/' "$CONF"
            else
              printf '[Time]\nNTP=2.pool.ntp.org\n' >> "$CONF"
            fi

            systemctl restart systemd-timesyncd
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the NTP server in the timesyncd configuration:

            ```yaml
            ---
            - name: Configure systemd-timesyncd NTP server
              hosts: all
              become: true

              tasks:
                - name: Ensure an NTP server is configured
                  ansible.builtin.ini_file:
                    path: /etc/systemd/timesyncd.conf
                    section: Time
                    option: NTP
                    value: "2.pool.ntp.org"
                    no_extra_spaces: true
                  notify: Restart timesyncd

              handlers:
                - name: Restart timesyncd
                  ansible.builtin.service:
                    name: systemd-timesyncd
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the NTP server systemd-timesyncd queries. Replace the public pool with your own time servers where site policy requires it:

            ```ruby
            timesyncd_conf = '/etc/systemd/timesyncd.conf'

            service 'systemd-timesyncd' do
              action :nothing
            end

            ruby_block 'set NTP in timesyncd.conf' do
              block do
                body = ::File.exist?(timesyncd_conf) ? ::File.read(timesyncd_conf) : ''
                body = "[Time]\n#{body}" unless body.match?(/^\[Time\]$/)
                directive = 'NTP=2.pool.ntp.org'
                body = if body.match?(/^\s*#?\s*NTP=/)
                         body.gsub(/^\s*#?\s*NTP=.*$/, directive)
                       else
                         body.sub(/^\[Time\]$/, "[Time]\n#{directive}")
                       end
                ::File.write(timesyncd_conf, body)
              end
              not_if { ::File.exist?(timesyncd_conf) && ::File.read(timesyncd_conf).match?(/^NTP=\S+/) }
              notifies :restart, 'service[systemd-timesyncd]', :delayed
            end
            ```
    refs:
      - url: https://www.freedesktop.org/software/systemd/man/latest/timesyncd.conf.html
        title: systemd - timesyncd.conf manual page
  - uid: mondoo-linux-security-timesyncd-clock-is-synchronized
    title: Ensure the system clock is synchronized via systemd-timesyncd
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-45
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    filters: |
      service('systemd-timesyncd').enabled
    mql: |
      systemd.timesyncd.active == true
      systemd.timesyncd.synchronized == true
    docs:
      desc: |
        This check verifies that systemd-timesyncd is actually running and has synchronized the system clock, not merely enabled to do so.

        Enabled, active, and synchronized are three different states, and only the last means the clock is correct. The check requires the daemon to be active and to report a synchronized clock, which is what `timedatectl status` shows as an active time service and a synchronized system clock. A companion check in this policy confirms that time servers are configured; this one confirms that reaching them worked.

        **Why this matters**

        The common failure here is silent. The unit is enabled, so every configuration review passes. The daemon started, so the service manager reports it running. But the configured servers are blocked by a firewall rule that closed outbound UDP port 123, or they resolve to nothing on a segmented network, and the daemon retries in the background while the clock free-runs on the hardware oscillator. Nothing logs an error that a human sees, and the drift accumulates at a few seconds a day until something breaks.

        What breaks first is usually authentication. Kerberos rejects tickets once the offset passes a few minutes, so domain logins fail on that host alone, which reads as a host problem rather than a time problem. TLS validation is the more dangerous outcome, because a clock behind real time accepts certificates that have already expired or been replaced.

        The audit trail degrades before any of that is noticed. Records written by a drifting host cannot be ordered against records from the rest of the fleet, and the discrepancy is not visible in the log lines themselves, so an investigation reaches the wrong conclusion about what happened first.

        Alert on the synchronized state rather than on the unit being enabled. That is the state that changes when the network path to the time source breaks.
      audit: |
        Run this command to confirm the daemon is active and the clock is synchronized:

        ```bash
        timedatectl status
        ```

        A passing result reports `NTP service: active` and `System clock synchronized: yes`. A failing result reports the service as inactive or the clock as not synchronized.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Enable network time synchronization and start the daemon:

            ```bash
            timedatectl set-ntp true
            systemctl restart systemd-timesyncd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to enable, start, and verify timesyncd synchronization:

            ```bash
            #!/bin/bash
            set -e

            timedatectl set-ntp true
            systemctl enable --now systemd-timesyncd
            systemctl restart systemd-timesyncd
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to enable and start timesyncd so the clock synchronizes:

            ```yaml
            ---
            - name: Ensure systemd-timesyncd synchronizes the clock
              hosts: all
              become: true

              tasks:
                - name: Enable network time synchronization
                  ansible.builtin.command: timedatectl set-ntp true
                  changed_when: false

                - name: Ensure timesyncd is enabled and running
                  ansible.builtin.service:
                    name: systemd-timesyncd
                    enabled: true
                    state: started
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to turn on network time synchronization and start systemd-timesyncd:

            ```ruby
            execute 'enable network time synchronization' do
              command 'timedatectl set-ntp true'
              not_if 'timedatectl show --property=NTP --value | grep -q yes'
            end

            service 'systemd-timesyncd' do
              action %i(enable start)
            end
            ```
    refs:
      - url: https://www.freedesktop.org/software/systemd/man/latest/systemd-timesyncd.service.html
        title: systemd - systemd-timesyncd.service manual page
  - uid: mondoo-linux-security-gpgcheck-is-globally-activated
    title: Ensure gpgcheck is globally activated
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-uem-02
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-id-ra-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    filters: |
      asset.family.contains('redhat') || asset.platform == 'amazonlinux'
    mql: |
      yum.config.gpgcheck == true
    docs:
      desc: |
        This check verifies that the package manager verifies the cryptographic signature of every package before installing it.

        On Red Hat based systems and Amazon Linux, `gpgcheck` in the `[main]` section of `/etc/dnf/dnf.conf`, or of `/etc/yum.conf` on older releases, sets the default for every repository. The check requires it to be enabled. Note that an individual repository definition under `/etc/yum.repos.d/` can still override the global default with its own `gpgcheck=0`, so review those files as well.

        **Why this matters**

        Package installation is the most privileged thing that happens routinely on a server. Scriptlets run as root before and after the files are unpacked, and the files themselves land in system directories and are executed by everything on the host. Signature verification is the only step that establishes the package came from the vendor whose key the host trusts.

        With verification off, that assurance is gone and the trust falls back to whatever is protecting the transport. An attacker positioned between the host and the repository, on a compromised mirror, on a caching proxy, or on the network path where a repository is still reached over plain HTTP, substitutes a package with the same name and a higher version. The host installs it on the next update and the scriptlet runs as root. No exploit is involved and nothing on the host reports anything unusual, because from the package manager's point of view the update succeeded normally.

        The same setting catches a corrupted download or a mirror serving damaged content, which fails a signature check the way a tampered package does.

        Enable it in the `[main]` section so it applies to every repository, then audit the repository definitions for per-repository overrides, and confirm that the vendor keys the host trusts are the ones actually expected.
      audit: |
        Run this command to confirm `gpgcheck` is enabled in the global configuration:

        ```bash
        grep -E '^gpgcheck' /etc/yum.conf /etc/dnf/dnf.conf 2>/dev/null
        ```

        A passing result reports `gpgcheck=1`. A failing result reports `gpgcheck=0` or omits the directive entirely.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Enable `gpgcheck` in the global package manager configuration. On dnf-based systems edit `/etc/dnf/dnf.conf` because `/etc/yum.conf` is a symlink to it that in-place edits would break; on yum-based systems edit `/etc/yum.conf`:

            ```bash
            CONF=/etc/dnf/dnf.conf
            [ -f "$CONF" ] || CONF=/etc/yum.conf
            if grep -q '^gpgcheck' "$CONF"; then
              sed -i 's/^gpgcheck\s*=.*/gpgcheck=1/' "$CONF"
            else
              # Insert under [main] so the directive is global rather than landing in a
              # later section if [main] is not the last section in the file.
              sed -i '/^\[main\]/a gpgcheck=1' "$CONF"
            fi
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to enforce `gpgcheck` in whichever global configuration file is present. It prefers `/etc/dnf/dnf.conf` because `/etc/yum.conf` is a symlink to it on dnf-based systems and an in-place edit of the symlink would break it:

            ```bash
            #!/bin/bash
            set -e

            CONF=/etc/dnf/dnf.conf
            [ -f "$CONF" ] || CONF=/etc/yum.conf

            if grep -qE '^gpgcheck' "$CONF"; then
              sed -i 's/^gpgcheck\s*=.*/gpgcheck=1/' "$CONF"
            else
              # Insert under [main] so the directive is global rather than landing in a
              # later section if [main] is not the last section in the file.
              sed -i '/^\[main\]/a gpgcheck=1' "$CONF"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set `gpgcheck` in the global `[main]` section:

            ```yaml
            ---
            - name: Enforce global gpgcheck
              hosts: all
              become: true

              tasks:
                - name: Check for the dnf configuration file
                  ansible.builtin.stat:
                    path: /etc/dnf/dnf.conf
                  register: dnf_conf

                - name: Ensure gpgcheck is enabled in the global configuration
                  ansible.builtin.ini_file:
                    path: "{{ dnf_conf.stat.exists | ternary('/etc/dnf/dnf.conf', '/etc/yum.conf') }}"
                    section: main
                    option: gpgcheck
                    value: "1"
                    no_extra_spaces: true
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to require package signature verification in the global package manager configuration. Repositories that set `gpgcheck=0` in their own definition still override this, so audit `/etc/yum.repos.d/` afterwards:

            ```ruby
            package_conf = ::File.exist?('/etc/dnf/dnf.conf') ? '/etc/dnf/dnf.conf' : '/etc/yum.conf'

            ruby_block 'enable gpgcheck globally' do
              block do
                body = ::File.exist?(package_conf) ? ::File.read(package_conf) : ''
                body = "[main]\n#{body}" unless body.match?(/^\[main\]$/)
                body = if body.match?(/^\s*gpgcheck\s*=/)
                         body.gsub(/^\s*gpgcheck\s*=.*$/, 'gpgcheck=1')
                       else
                         body.sub(/^\[main\]$/, "[main]\ngpgcheck=1")
                       end
                ::File.write(package_conf, body)
              end
              not_if { ::File.exist?(package_conf) && ::File.read(package_conf).match?(/^gpgcheck\s*=\s*1\s*$/) }
            end
            ```
