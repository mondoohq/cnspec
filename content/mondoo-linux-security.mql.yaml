        title: systemd System and Service Manager
  - uid: mondoo-linux-security-nis-server-is-not-enabled
    title: Ensure NIS server is stopped and not enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("ypserv").enabled == false
      service("ypserv").running == false
      service("nis").enabled == false
      service("nis").running == false
    docs:
      desc: |
        This check verifies that the `ypserv` and `nis` services are neither running nor enabled at boot.

        **Why this matters**

        NIS distributes the account database, and in its original design that includes the password map. The protocol's only access control is the NIS domain name, which functions as a shared secret that is transmitted in clear, is often set to something guessable such as the company or site name, and is visible to anyone already on the network.

        Anyone who learns or guesses the domain name can request the password map and receive the hashes for every account in it. That is the entire authentication database for every host bound to the domain, retrieved with a single unauthenticated query. Offline cracking then proceeds against all of it at once.

        Nothing in NIS is encrypted or signed, so responses can also be observed and forged, allowing an attacker to substitute account data and grant themselves access on every client that trusts the server.

        NIS has no safe configuration. Migrate to LDAP over TLS with Kerberos, or to a directory service that authenticates both parties, and stop and disable `ypserv`.
      audit: |
        Run this command to confirm the NIS server service is stopped and disabled:

        ```bash
        systemctl is-active ypserv nis
        systemctl is-enabled ypserv nis
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run these commands to stop and disable `ypserv` and `nis`:

            ```bash
            systemctl stop ypserv nis
            systemctl disable ypserv nis
            ```

            Typically only one of these alternative units is installed. A unit that is not installed reports an error that can be ignored; the commands still apply to the units that exist.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable NIS server services.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling NIS server services..."
            for unit in ypserv.service nis.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `ypserv` and `nis`:

            ```yaml
            ---
            - name: Stop and disable NIS server services
              hosts: all
              become: true

              tasks:
                - name: Ensure NIS server services are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - ypserv
                    - nis
                  register: nis_units
                  failed_when:
                    - nis_units.failed
                    - "'Could not find the requested service' not in (nis_units.msg | default(''))"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the NIS server units:

            ```ruby
            %w(ypserv.service nis.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
