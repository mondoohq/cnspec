    filters: |
      asset.kind != "container-image"
    mql: |
      service("nfs-server").enabled == false
      service("nfs-server").running == false
      service("rpcbind").enabled == false
      service("rpcbind").running == false
    docs:
      desc: |
        This check verifies that the `nfs-server` and `rpcbind` services are neither running nor enabled at boot.

        **Why this matters**

        NFS decides who you are by trusting the user and group IDs the client puts in each request. There is no authentication in the protocol itself beyond a check that the connection came from a permitted address. Anyone with root on a permitted client, or the ability to spoof one, can present any UID they like and read the corresponding files.

        `rpcbind` compounds this in two ways. It tells any caller which ports the RPC services are listening on, which removes the need to scan for them, and it responds to small queries with much larger replies. That makes it a usable reflector for amplification attacks, and a host running it can find itself contributing to a denial of service against a third party.

        Both services are frequently enabled by dependency rather than by decision. Installing an NFS client package can bring `rpcbind` along, leaving the listener running on a host that never exports anything.

        Where NFS exports are genuinely needed, keep root squashing enabled, restrict exports to specific hosts rather than subnets, and confine the traffic to a storage network.
      audit: |
        Run this command to confirm the NFS and RPC service is stopped and disabled:

        ```bash
        systemctl is-active nfs-server rpcbind
        systemctl is-enabled nfs-server rpcbind
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Run these commands to stop and disable `nfs-server` and `rpcbind`, including the `rpcbind.socket` unit that would otherwise restart `rpcbind` on the next RPC connection. A unit that is not installed reports an error that can be ignored:

                ```bash
                systemctl stop nfs-server rpcbind.socket rpcbind

                systemctl disable nfs-server rpcbind.socket rpcbind
                ```

            2. To make the `nfs-server` and `rpcbind` units invisible to other services run this command:
                ```bash
                systemctl mask nfs-server rpcbind.socket rpcbind
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the NFS and RPC services.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping, disabling, and masking NFS and RPC services..."
            for unit in nfs-server.service rpcbind.socket rpcbind.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
                systemctl mask "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `nfs-server` and `rpcbind`:

            ```yaml
            ---
            - name: Stop and disable NFS and RPC services
              hosts: all
              become: true

              tasks:
                - name: Ensure NFS and RPC units are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                    masked: true
                  loop:
                    - nfs-server
                    - rpcbind.socket
                    - rpcbind
                  register: nfs_units
                  failed_when:
                    - nfs_units.failed
                    - "'Could not find the requested service' not in (nfs_units.msg | default(''))"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop, disable, and mask the NFS and RPC units:

            ```ruby
            %w(nfs-server.service rpcbind.socket rpcbind.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable mask)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
    refs:
      - url: https://www.freedesktop.org/wiki/Software/systemd/
        title: systemd System and Service Manager
  - uid: mondoo-linux-security-nfs-exports-root-squash
    title: Ensure NFS exports do not disable root squashing
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: false
    filters: |
      asset.kind != "container-image"
      nfs.exports.length > 0
    mql: |
      nfs.exports.all(noRootSquash == false)
    docs:
      desc: |
        This check verifies that no NFS export turns off root squashing.

        With root squashing in effect, which is the server default, requests arriving with user ID 0 are remapped to an unprivileged account such as `nfsnobody` before the server touches the filesystem. The `no_root_squash` option in `/etc/exports`, or in a file under `/etc/exports.d/`, removes that remapping and lets a client's root account act as root on the exported files. The check reads the active export table and requires the option to be absent everywhere.

        **Why this matters**

        NFS authenticates the client machine by network address and then trusts whatever user and group IDs that machine puts in each request. The server does not verify that the client's user ID 0 corresponds to anyone in particular; it accepts the number.

        That is workable while every access is squashed, because the worst a hostile client can claim is an unprivileged identity. With `no_root_squash`, anyone with root on a permitted client, and anyone who can impersonate one, owns the export. The concrete step is short: mount the share, write a shell binary into it, set it setuid root, then execute it on the server or on any other host that mounts the same export and escalate there. Nothing about the attack requires a vulnerability in NFS.

        The same access reads every file in the export regardless of ownership, which is how credentials, keys, and databases stored on a shared volume leave the network, and it rewrites ownership and permissions to leave a way back in.

        Where a client genuinely needs privileged access to an export, such as a backup host, express that with explicit `anonuid` and `anongid` mappings and restrict the export to that one address, rather than disabling squashing for every client the export permits.
      audit: |
        Run this command to review the active export options:

        ```bash
        exportfs -v
        ```

        A passing result shows `root_squash` on every export. A failing result shows `no_root_squash` on any export.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit the export definition in `/etc/exports` or the relevant file in `/etc/exports.d/` and remove the `no_root_squash` option. Replace it with `root_squash` to be explicit:

                ```text
                /srv/share 192.0.2.0/24(rw,root_squash)
                ```

            2. Reapply the export table:

                ```bash
                exportfs -ra
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to replace `no_root_squash` with `root_squash` in all export definitions and reapply the export table.

            ```bash
            #!/bin/bash
            set -e

            echo "Enabling root squashing on NFS export definitions..."
            sed -i 's/\bno_root_squash\b/root_squash/g' /etc/exports
            if [ -d /etc/exports.d ]; then
              sed -i 's/\bno_root_squash\b/root_squash/g' /etc/exports.d/*.exports 2>/dev/null || true
            fi
            exportfs -ra
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to replace `no_root_squash` with `root_squash` in the export definitions and reapply the export table:

            ```yaml
            ---
            - name: Enable root squashing on NFS exports
              hosts: all
              become: true

              tasks:
                - name: Find export definition files in /etc/exports.d
                  ansible.builtin.find:
                    paths: /etc/exports.d
                    patterns: '*.exports'
                  register: exports_d_files

                - name: Replace no_root_squash with root_squash in export definitions
                  ansible.builtin.replace:
                    path: "{{ item }}"
                    regexp: '\bno_root_squash\b'
                    replace: root_squash
                  loop: "{{ ['/etc/exports'] + (exports_d_files.files | map(attribute='path') | list) }}"
                  register: exports_updated

                - name: Reapply the NFS export table
                  ansible.builtin.command: exportfs -ra
                  when: exports_updated.results | selectattr('changed') | list | length > 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to replace `no_root_squash` with `root_squash` in every export definition and reapply the export table:

            ```ruby
            execute 'reapply the NFS export table' do
              command 'exportfs -ra'
              action :nothing
            end

            (['/etc/exports'] + ::Dir.glob('/etc/exports.d/*.exports')).each do |export_file|
              ruby_block "enable root squashing in #{export_file}" do
                block do
                  body = ::File.read(export_file)
                  ::File.write(export_file, body.gsub(/\bno_root_squash\b/, 'root_squash'))
                end
                only_if { ::File.exist?(export_file) && ::File.read(export_file).match?(/\bno_root_squash\b/) }
                notifies :run, 'execute[reapply the NFS export table]', :delayed
              end
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man5/exports.5.html
        title: exports(5) - NFS server export table
  - uid: mondoo-linux-security-dns-server-is-not-enabled
    title: Ensure DNS server is stopped and not enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("named").enabled == false
      service("named").running == false
      service("bind9").enabled == false
      service("bind9").running == false
    docs:
      desc: |
        This check verifies that the `named` and `bind9` services are neither running nor enabled at boot.

        **Why this matters**

        A DNS server left in its default configuration is usually a recursive resolver that will answer anyone. That has two consequences.

        The first is amplification. A small query can produce a large answer, and because DNS runs over UDP the source address is trivially forged. An open resolver is therefore a ready-made amplifier: an attacker sends queries with a victim's address as the source, and the resolver delivers the amplified responses to the victim. The host contributes to an attack it will never see the results of, and lands on public open-resolver blocklists as a result.

        The second is disclosure. If the server is authoritative for internal zones and permits zone transfers, a single `AXFR` request returns the complete internal naming map: hostnames, addresses, service records, and the internal structure they imply.

        Where a resolver is required, restrict recursion to known client networks, limit zone transfers to secondaries by address and key, and run the service as a designated resolver rather than as a side effect of another package.
      audit: |
        Run this command to confirm the DNS server service is stopped and disabled:

        ```bash
        systemctl is-active named bind9
        systemctl is-enabled named bind9
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to stop and disable `named` and `bind9`:

            ```bash
            systemctl stop named bind9
            systemctl disable named bind9
            ```

            Typically only one of these alternative units is installed. A unit that is not installed reports an error that can be ignored; the commands still apply to the units that exist.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the DNS server services.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling DNS server services..."
            for unit in named.service bind9.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `named` and `bind9`:

            ```yaml
            ---
            - name: Stop and disable DNS server services
              hosts: all
              become: true

              tasks:
                - name: Ensure DNS server services (named and bind9) are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - named
                    - bind9
                  register: dns_units
                  failed_when:
                    - dns_units.failed
                    - "'Could not find the requested service' not in (dns_units.msg | default(''))"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the DNS server units:

            ```ruby
            %w(named.service bind9.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
