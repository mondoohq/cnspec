      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      systemd.socket("rsh").enabled == false
      systemd.socket("rlogin").enabled == false
      systemd.socket("rexec").enabled == false
      systemd.socket("rsh").running == false
      systemd.socket("rlogin").running == false
      systemd.socket("rexec").running == false
    docs:
      desc: |
        This check verifies that the `rsh`, `rlogin`, and `rexec` systemd socket units are neither running nor enabled.

        **Why this matters**

        The r-commands were designed for a network where hosts trusted each other and nobody was listening. They carry credentials and session data in plaintext, so anyone who can observe the traffic reads the password and everything typed afterward.

        Their trust model is the larger problem. A `.rhosts` file in a user's home directory, or an entry in `/etc/hosts.equiv`, tells the server to accept a connection from a named host and user with no password at all. The server verifies this by resolving and trusting the client's address, which means that DNS manipulation, ARP spoofing, or simply compromising any one of the trusted hosts converts into passwordless access on all the others.

        That property makes r-services a lateral movement tool. An attacker who lands on one host in a group that trusts each other reaches the rest without needing another credential.

        There is no configuration that makes these services safe. SSH replaces all three with authenticated, encrypted equivalents. Disable the sockets and remove the packages.
      audit: |
        Run this command to confirm the rsh, rlogin, and rexec socket units are stopped and disabled:

        ```bash
        systemctl is-active rsh.socket rlogin.socket rexec.socket
        systemctl is-enabled rsh.socket rlogin.socket rexec.socket
        ```

        A passing result reports `inactive` and `disabled` for every listed socket unit. A failing result reports any socket as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run these commands to stop and disable `rsh`, `rlogin`, and `rexec`:

            ```bash
            systemctl stop rsh.socket
            systemctl stop rlogin.socket
            systemctl stop rexec.socket

            systemctl disable rsh.socket
            systemctl disable rlogin.socket
            systemctl disable rexec.socket
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable rsh server services.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling rsh server services..."
            systemctl stop rsh.socket
            systemctl stop rlogin.socket
            systemctl stop rexec.socket
            systemctl disable rsh.socket
            systemctl disable rlogin.socket
            systemctl disable rexec.socket
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `rsh`, `rlogin`, and `rexec`:

            ```yaml
            ---
            - name: Stop and disable rsh server services
              hosts: all
              become: true

              tasks:
                - name: Ensure rsh-related services are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - rsh.socket
                    - rlogin.socket
                    - rexec.socket
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the rsh, rlogin, and rexec sockets:

            ```ruby
            %w(rsh.socket rlogin.socket rexec.socket).each do |unit|
              systemd_unit unit do
                action %i(stop disable)
                only_if "systemctl cat #{unit}"
              end
            end
