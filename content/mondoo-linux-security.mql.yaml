  - uid: mondoo-linux-security-bogus-icmp-responses-are-ignored
    title: Ensure bogus ICMP responses are ignored
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.icmp_ignore_bogus_error_responses'] == 1
    docs:
      desc: |
        This check verifies that the host discards ICMP error responses that violate the protocol's rules.

        Some hosts and network devices reply to broadcast frames with ICMP errors, which the standard forbids, and by default the kernel processes and logs each one. The check reads the kernel parameter `net.ipv4.icmp_ignore_bogus_error_responses`, which must be `1`.

        **Why this matters**

        Some hosts and network devices respond to broadcast frames with ICMP error messages, which the standard forbids. These arrive continuously on a busy segment and mean nothing.

        Processing them costs the host twice. Each one consumes handling in the network stack, and each one produces a kernel log entry. On a segment with a few misbehaving devices that becomes a steady stream of messages that describe nothing actionable, and the cost lands where it hurts most: in the kernel log, which is where the entries that do matter have to be found.

        An attacker can drive that deliberately. Generating a flood of malformed ICMP errors fills the log with noise, which both obscures whatever else is being recorded at the time and consumes the disk that logging depends on. It is a cheap way to reduce the value of a host's own monitoring in advance of doing something worth noticing.

        Discarding these responses loses nothing. They are invalid by definition, so no diagnostic information is being given up, and the host still processes ICMP errors that conform to the protocol.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv4.icmp_ignore_bogus_error_responses
        ```

        A passing result shows every listed parameter set to `1`. A failing result shows any parameter set to `0` or absent.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Set the following parameter in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv4.icmp_ignore_bogus_error_responses = 1
                ```

            2. Run these commands to set the active kernel parameters:

                ```bash
                sysctl -w net.ipv4.icmp_ignore_bogus_error_responses=1
                sysctl -w net.ipv4.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to disable bogus ICMP responses and persist the setting.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^net.ipv4.icmp_ignore_bogus_error_responses' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.icmp_ignore_bogus_error_responses to 1 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.icmp_ignore_bogus_error_responses.*/net.ipv4.icmp_ignore_bogus_error_responses = 1/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.icmp_ignore_bogus_error_responses to 1 in /etc/sysctl.d/99-disable-bogus-icmp-responses.conf"
              echo "net.ipv4.icmp_ignore_bogus_error_responses = 1" >> /etc/sysctl.d/99-disable-bogus-icmp-responses.conf
            fi

            sysctl -w net.ipv4.icmp_ignore_bogus_error_responses=1
            sysctl -w net.ipv4.route.flush=1
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the kernel parameters:

            ```yaml
            ---
            - name: Disable bogus ICMP responses
              hosts: all
              become: true

              tasks:
                - name: Ensure bogus ICMP responses are ignored in sysctl configuration
                  ansible.builtin.sysctl:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                    sysctl_file: /etc/sysctl.d/99-disable-bogus-icmp-responses.conf
                    state: present
                    sysctl_set: true
                    reload: yes
                  loop:
                    - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
            ```
