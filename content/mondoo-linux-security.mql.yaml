  - uid: mondoo-linux-security-ssh-access-is-limited
    title: Ensure SSH access is limited
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      sshd.config.params["AllowUsers"] != empty || sshd.config.params["AllowGroups"] != empty || sshd.config.params["DenyUsers"] != empty || sshd.config.params["DenyGroups"] != empty

      if (sshd.config.params["AllowUsers"] != empty) { sshd.config.params["AllowUsers"] != "" }
      if (sshd.config.params["AllowGroups"] != empty) { sshd.config.params["AllowGroups"] != "" }
      if (sshd.config.params["DenyUsers"] != empty) { sshd.config.params["DenyUsers"] != "" }
      if (sshd.config.params["DenyGroups"] != empty) { sshd.config.params["DenyGroups"] != "" }
    docs:
      desc: |
        This check verifies that SSH access is restricted to an explicit list of accounts or groups rather than being open to everyone on the host.

        The check reads `/etc/ssh/sshd_config` and requires that at least one of `AllowUsers`, `AllowGroups`, `DenyUsers`, or `DenyGroups` is present with a non-empty value.

        **Why this matters**

        Without one of these directives, `sshd` will attempt to authenticate any account that exists on the host. That set is much larger than the set of people who should be logging in: application accounts created by packages, database and web server accounts, accounts left behind by decommissioned software, and accounts belonging to people who have since changed roles.

        Each of those is a name an attacker can try, and a name that must be individually secured. If any one of them acquires a weak password, a shell it should not have, or an authorized key from a stale automation setup, it becomes a login path. An allowlist collapses that surface to the accounts that are supposed to connect, and it does so at the SSH layer, so a mistake in account provisioning elsewhere does not turn into remote access.

        Prefer `AllowGroups` naming a dedicated group. Access is then granted by group membership, which is visible, auditable, and revoked in one place when someone leaves, rather than by editing `sshd_config` and reloading the daemon for every change.

        Use `DenyUsers` and `DenyGroups` only as a supplement. A denylist has to anticipate every account that should not connect, which is a list that grows on its own and is wrong by default.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*(Allow|Deny)(Users|Groups)\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows at least one `AllowUsers`, `AllowGroups`, `DenyUsers`, or `DenyGroups` directive with a non-empty value. A failing result produces no output, which means none of these directives is configured and every account on the host may attempt to authenticate.

        This check reads the configuration file rather than the effective configuration, so verify it with `grep` rather than `sshd -T`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works. Confirm that your own administrative account is a member of the allowed group or is named in `AllowUsers` before you apply the change, otherwise you will be denied access along with everyone else not on the list.

            To limit SSH access, edit the `/etc/ssh/sshd_config` file and add or modify one or more of the `AllowUsers`, `AllowGroups`, `DenyUsers`, or `DenyGroups` parameters as needed. Configure only the directives your site policy requires. Once `AllowUsers` or `AllowGroups` is set, every account not matched is denied SSH access, so make sure the list covers all administrative accounts before applying it.

            Example restricting access to one group:

            ```bash
            AllowGroups sshusers
            ```

            Validate the configuration and restart the SSH service to apply the changes:

            ```bash
            sshd -t
            ```

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To limit SSH access, you can run the following bash script. Before running it, replace the example group with a group that contains every account that must retain SSH access, including your administrative accounts. Once `AllowGroups` is set, any account outside the listed groups is denied SSH access.

            ```bash
            #!/bin/bash
            set -e

            # Replace with the group that should retain SSH access
            ALLOW_GROUPS="sshusers"

            if grep -q '^AllowGroups' /etc/ssh/sshd_config; then
              echo "Updating existing AllowGroups configuration value"
              sed -i "s/^AllowGroups.*/AllowGroups $ALLOW_GROUPS/" /etc/ssh/sshd_config
            else
              echo "Adding AllowGroups configuration value to SSH config"
              echo "AllowGroups $ALLOW_GROUPS" >> /etc/ssh/sshd_config
            fi

            # Validate the new configuration before restarting. A syntax error here can lock you out of SSH.
            sshd -t

            # Restart the SSH service. The unit is "ssh" on Debian/Ubuntu and "sshd" on other distributions.
            if systemctl list-unit-files | grep -q '^ssh\.service'; then
              systemctl restart ssh
            else
              systemctl restart sshd
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**
            To limit SSH access using Ansible, use the following playbook:

            ```yaml
            ---
            - name: Restrict SSH access using AllowGroups
              hosts: all
              become: true
              vars:
                ssh_allow_groups: "sshusers"

              tasks:
                - name: Set AllowGroups in sshd_config
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '^AllowGroups'
                    line: "AllowGroups {{ ssh_allow_groups }}"
                    create: yes
                    state: present
                  register: allow_groups_changed

                - name: Gather service facts to detect the SSH unit name
                  ansible.builtin.service_facts:
                  when: allow_groups_changed.changed

                - name: Restart the SSH service
                  ansible.builtin.systemd:
                    name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
                    state: restarted
                  when: allow_groups_changed.changed
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to limit SSH access to a named group. Create the group and add your administrators to it before you apply this, or no one will be able to log in:

            ```ruby
            sshd_config = '/etc/ssh/sshd_config'
            ssh_service = platform_family?('debian') ? 'ssh' : 'sshd'

            service ssh_service do
              action :nothing
            end

            { 'AllowGroups' => 'sshusers' }.each do |keyword, value|
              ruby_block "set #{keyword} in sshd_config" do
                block do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  body = if body.match?(/^\s*#{keyword}\b/i)
                           body.gsub(/^\s*#{keyword}\b.*$/i, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(sshd_config, body)
                end
                not_if { ::File.read(sshd_config).match?(/^\s*#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, "service[#{ssh_service}]", :delayed
              end
            end
            ```
