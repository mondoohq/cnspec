  - uid: mondoo-linux-security-rsync-service-is-not-enabled
    title: Ensure rsync service is stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("rsyncd").enabled == false
      service("rsyncd").running == false
    docs:
      desc: |
        This check verifies that the `rsyncd` service is neither running nor enabled at boot. This concerns the rsync daemon on port 873, not the ordinary use of `rsync` over SSH.

        **Why this matters**

        The rsync daemon has its own access model, entirely separate from the system's. Each module in `rsyncd.conf` defines a path and its own rules, and by default a module requires no authentication at all. When credentials are used, they live in a plaintext secrets file and are sent over an unencrypted connection.

        The result is that an exposed `rsyncd` frequently offers anonymous read access to whatever directory the module points at, which is typically the data someone considered important enough to replicate. Internet-wide scans for open rsync modules are routine, and they find backups, database dumps, and source trees.

        Modules that are writable are worse. `read only = yes` is the default in the shipped configuration but is commonly turned off for push-based backup workflows, and a writable module gives an unauthenticated attacker a path to place files on the host.

        Running `rsync` over SSH gives the same synchronization with the host's existing authentication and encryption. Use that, and leave `rsyncd` disabled.
      audit: |
        Run this command to confirm the rsync service is stopped and disabled:

        ```bash
        systemctl is-active rsyncd
        systemctl is-enabled rsyncd
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run these commands to stop and disable `rsync`:

            ```bash
            systemctl stop rsyncd.socket rsyncd.service
            systemctl disable rsyncd.socket rsyncd.service
            ```

            The `rsyncd.socket` unit is included because it restarts the daemon on the next inbound connection when socket activation is enabled. A unit that is not installed reports an error that can be ignored.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the rsync service.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling rsyncd units..."
            for unit in rsyncd.socket rsyncd.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `rsync`:

            ```yaml
            ---
            - name: Stop and disable rsync service
              hosts: all
              become: true

              tasks:
                - name: Ensure rsync units are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - rsyncd.socket
                    - rsyncd
                  register: rsync_units
                  failed_when:
                    - rsync_units.failed
                    - "'Could not find the requested service' not in (rsync_units.msg | default(''))"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the rsync units:

            ```ruby
            %w(rsyncd.socket rsyncd.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
