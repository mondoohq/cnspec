      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("squid").enabled == false
      service("squid").running == false
      service("tinyproxy").enabled == false
      service("tinyproxy").running == false
    docs:
      desc: |
        This check verifies that the `squid` and `tinyproxy` services are neither running nor enabled at boot.

        **Why this matters**

        A proxy exists to make requests on someone else's behalf. An open one makes requests on an attacker's behalf, from inside the network, using the proxy host's own network position.

        That is the core risk, and it does not require a vulnerability. An attacker who can reach the proxy port can ask it to fetch internal URLs that they cannot reach directly: management interfaces on other hosts, service endpoints on private subnets, and cloud instance metadata endpoints that hand out credentials to whatever asks from the right source address. The proxy is trusted on the internal network, so it gets answers the attacker could not obtain themselves.

        The same capability works outward. An open proxy launders traffic, so attacks on third parties and exfiltration of data both appear to originate from the organization's address space, and the proxy's logs become the only record of who actually sent them.

        Where a proxy is part of the architecture, restrict the client networks that may connect, define an explicit allowlist of permitted destinations, and forward the access logs somewhere they are reviewed.
