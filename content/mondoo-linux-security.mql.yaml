      sshd.config.macs != empty
      sshd.config.macs.containsOnly(props.mondooLinuxSecurityMacAlgos)
    docs:
      desc: |
        This check verifies that the SSH server offers only strong message authentication algorithms.

        The MAC protects the integrity of a session, preventing an attacker on the network path from altering packets they cannot read. The check reads the `MACs` directive in `/etc/ssh/sshd_config` and requires that every algorithm it names appears in the approved list carried by this policy's property. The directive must be present; a configuration that relies on OpenSSH's compiled-in default fails this check.

        **Why this matters**

        The MAC protects integrity. It is what prevents an attacker who sits on the network path from altering packets in a session they cannot read, and SSH's history shows why that matters as much as confidentiality: the attacks that broke protocol 1 were integrity attacks, not decryption.

        Two properties separate a good MAC list from a bad one. Algorithms built on MD5 and on truncated digests such as the `-96` variants offer too small a security margin to keep. And OpenSSH offers both encrypt-and-MAC and encrypt-then-MAC forms of the same algorithms, distinguished by the `-etm@openssh.com` suffix; the encrypt-then-MAC form lets the receiver reject a forged packet before decrypting it, which removes a class of oracle attacks that the older ordering permits.

        Requiring an explicit directive matters for the same reason it does for ciphers. The compiled-in default varies between OpenSSH releases and vendor builds, so a host that negotiates well today may negotiate differently after an upgrade.

        Note that AEAD ciphers such as `chacha20-poly1305@openssh.com` and the AES-GCM modes provide integrity themselves and ignore the `MACs` list entirely. The list governs sessions that negotiate a non-AEAD cipher.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*MACs\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows an explicit `MACs` directive listing only approved algorithms. A failing result lists a weak algorithm, such as an MD5-based or `-96` truncated variant, or produces no output at all, which means the directive is absent.

        Do not verify this check with `sshd -T`. That command prints the effective configuration including OpenSSH's built-in defaults, so on a host where the directive is absent it reports `the full built-in MAC list` while this check reads the configuration file and fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works. Setting a MAC list that your SSH clients do not support is one of the most common causes of a total SSH lockout, so verify the new connection from each client type you rely on.

            To configure SSH to use only strong MAC algorithms, edit the `/etc/ssh/sshd_config` file and add or modify the `MACs` parameter to include a comma-separated list of approved MAC algorithms.

            Example:

            ```bash
            MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
            ```

            The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads `/etc/ssh/sshd_config.d/` first, in lexical order. Red Hat Enterprise Linux and Ubuntu ship their own snippets in that directory, so a value added to `/etc/ssh/sshd_config` has no effect once one of those snippets sets the same keyword. On Red Hat Enterprise Linux 9 that snippet includes the system-wide cryptographic policy, which sets `Ciphers`, `MACs`, and `KexAlgorithms` itself, so a lower-numbered drop-in is the only place these keywords take effect. Check the directory, and where it is in use put the value in a drop-in numbered below the vendor snippets:

