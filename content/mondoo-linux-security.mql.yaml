        - id: ansible
          desc: |
            **Using Ansible**
            To configure SSH to use only approved key exchange algorithms, use the following Ansible playbook:

            ```yaml
            ---
            - name: Configure SSH with approved KexAlgorithms based on OpenSSH version
              hosts: all
              become: true
              gather_facts: true
              tasks:
                - name: Detect whether sshd reads drop-in configuration files
                  ansible.builtin.command: grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
                  register: sshd_include
                  changed_when: false
                  failed_when: false

                # sshd uses the first value it reads for each keyword, and the Include at the top of
                # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order, so a drop-in numbered
                # below the vendor snippets is the only place a new value reliably wins.
                - name: Select the configuration file sshd reads first
                  ansible.builtin.set_fact:
                    sshd_target: "{{ '/etc/ssh/sshd_config.d/00-hardening.conf' if sshd_include.rc == 0 else '/etc/ssh/sshd_config' }}"

                - name: Ensure the hardening drop-in exists
                  ansible.builtin.copy:
                    dest: "{{ sshd_target }}"
                    content: ""
                    force: false
                    owner: root
                    group: root
                    mode: '0600'

                - name: Get OpenSSH version
                  ansible.builtin.shell: |
                    ssh -V 2>&1 | grep -oP 'OpenSSH_\K\d+\.\d+'
                  register: sshd_version
                  changed_when: false
                  failed_when: sshd_version.rc != 0 or sshd_version.stdout == ""

                - name: Set parsed OpenSSH version
                  ansible.builtin.set_fact:
                    openssh_version_float: "{{ sshd_version.stdout }}"

                - name: Determine appropriate KexAlgorithms value
                  ansible.builtin.set_fact:
                    kexalgos: >-
                      {% if openssh_version_float | float < 7.0 %}
                        curve25519-sha256@libssh.org
                      {% elif openssh_version_float | float < 8.0 %}
                        curve25519-sha256@libssh.org,diffie-hellman-group18-sha512
                      {% elif openssh_version_float | float < 8.6 %}
                        sntrup4591761x25519-sha512@tinyssh.org,curve25519-sha256@libssh.org,diffie-hellman-group18-sha512
                      {% else %}
                        sntrup761x25519-sha512@openssh.com,curve25519-sha256@libssh.org,diffie-hellman-group18-sha512
                      {% endif %}

                - name: Ensure KexAlgorithms is set in sshd_config
                  ansible.builtin.lineinfile:
                    path: "{{ sshd_target }}"
                    regexp: '^KexAlgorithms'
                    line: "KexAlgorithms {{ kexalgos | trim }}"
                    create: yes
                    state: present
                  register: kexalgos_config_change

                - name: Gather service facts to detect the SSH unit name
                  ansible.builtin.service_facts:
                  when: kexalgos_config_change.changed

                - name: Restart the SSH service
                  ansible.builtin.systemd:
                    name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
                    state: restarted
                  when: kexalgos_config_change.changed
