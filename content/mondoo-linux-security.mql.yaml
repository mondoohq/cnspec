    docs:
      desc: |
        This check verifies that the SSH server limits how many authentication attempts a single connection may make.

        The check reads `MaxAuthTries` in `/etc/ssh/sshd_config`, which must be `4` or lower. The OpenSSH default is `6`.

        **Why this matters**

        `MaxAuthTries` caps the number of authentication attempts within a single TCP connection. `sshd` also starts writing failure messages to the log once more than half the limit has been consumed, so the value determines both how many guesses a connection buys and how quickly the attempt becomes visible.

        Lowering it makes password guessing expensive. Each small batch of attempts costs the attacker a new TCP handshake and a full key exchange, which is orders of magnitude more work than another guess on an open connection, and it multiplies the number of connection events their campaign leaves behind.

        It is important to be clear about what this does not do. `MaxAuthTries` is a rate limiter, not a lockout. An attacker can reconnect immediately and continue, so this control slows credential stuffing and makes it conspicuous rather than stopping it.

        Treat it as one layer. Key-based authentication with `PasswordAuthentication no` removes the guessable secret entirely, `AllowUsers` or `AllowGroups` narrows who may attempt authentication at all, and a tool such as `fail2ban` supplies the blocking that `MaxAuthTries` does not.
