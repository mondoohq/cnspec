      desc: |
        This check verifies that the SSH server does not apply user-supplied environment variables to a session.

        The check reads `PermitUserEnvironment` in `/etc/ssh/sshd_config`, which must be `no`. The directive must be present in the file; an absent `PermitUserEnvironment` fails this check even though `no` is the OpenSSH default.

        **Why this matters**

        When this option is enabled, `sshd` reads `~/.ssh/environment` and the `environment=` options in `~/.ssh/authorized_keys`, and applies those variables to the session before the user's shell or command starts.

        The variables it applies include the ones that control the dynamic linker. Setting `LD_PRELOAD` or `LD_LIBRARY_PATH` there causes a library the user controls to load into the process at startup, which means code of their choosing runs first, inside a session the server just authenticated.

        That defeats the mechanisms used to constrain accounts. A key restricted with `command=` to run one specific script, an account confined to a restricted shell, and a forced-command bastion configuration all assume the session runs the program the server chose. Preloaded code runs before that program does, and can replace what it does entirely.

        The exposure applies to any account that can write its own `authorized_keys` or `~/.ssh/environment`, which is normally every account on the host.

        Where a session genuinely needs environment variables set, use `SetEnv` or `AcceptEnv` in `sshd_config`, which keeps the decision with the server administrator.
