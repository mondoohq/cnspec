      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
      kernel.modules.any(name == "can")
    mql: |
      kernel.module("can").blacklisted
      kernel.module("can").installBypass
    docs:
      desc: |
        This check verifies that the CAN kernel module cannot be loaded.

        Controller Area Network is the bus used in vehicles, robotics, and factory equipment to connect microcontrollers without a host computer, and the `can` module provides its `AF_CAN` socket family. The check reads the modprobe configuration in `/etc/modprobe.d/`, which must both blacklist the module and redirect its install command to `/bin/false`. Both directives are required: blacklisting alone stops automatic loading but still allows an explicit `modprobe can`.

