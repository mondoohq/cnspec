        title: Linux Kernel sysctl Documentation
  - uid: mondoo-linux-security-auditd-is-installed-and-running
    title: Ensure auditd is installed, enabled, and running
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      package("auditd").installed && package("audispd-plugins").installed
      || package("audit").installed || package("audit-libs").installed
      service("auditd").enabled
      service("auditd").running
    docs:
      desc: |
        This check verifies that the audit packages are installed, which is `auditd` together with `audispd-plugins` on Debian-based systems or `audit` and `audit-libs` on Red Hat-based systems, and that the `auditd` service is both enabled at boot and currently running.

        **Why this matters**

        `auditd` is the only component on a Linux host that records who did what at the system call level. `syslog` records what applications chose to report, and shell history is a convenience file the user can edit. Neither survives contact with someone who does not want to be seen.

        Every other audit check in this policy configures rules that `auditd` executes. If the daemon is absent, disabled, or stopped, those rules are inert, and the host produces no record of privilege changes, file access, or module loading regardless of how carefully the rules were written. A configuration review looks correct while nothing is being captured.

        The distinction between enabled and running is worth keeping. A daemon that is running but not enabled stops recording at the next reboot, which is a common moment for it to matter. A daemon that is enabled but not running has failed since boot, and the gap has already begun.

        Note that stopping `auditd` is itself the first thing an intruder does. Once the audit configuration is made immutable, as a later check requires, that becomes considerably harder and leaves a reboot behind as evidence.
      audit: |
        Run these commands to confirm the audit daemon is installed, enabled, and running:

        ```bash
        rpm -q audit || dpkg -s auditd
        systemctl is-enabled auditd
        systemctl is-active auditd
        ```

        A passing result reports the audit package installed and `auditd` reported as `enabled` and `active`. A failing result reports the package missing or the service not enabled or not running.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Install the auditd package:

                **RHEL/Fedora/Amazon Linux and derivatives**

                ```bash
                dnf install audit audit-libs
                ```

                **Debian/Ubuntu and derivatives**

                ```bash
                apt-get install auditd audispd-plugins
                ```

                **SLES and openSUSE**

                ```bash
                zypper install audit
                ```

            2. Enable and start the auditd service:

                ```bash
                systemctl --now enable auditd
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to install auditd, enable it, and start the service.

            ```bash
            #!/bin/bash
            set -e

            echo "Installing auditd..."
            if command -v dnf &> /dev/null; then
              dnf install -y audit audit-libs
            elif command -v apt-get &> /dev/null; then
              apt-get install -y auditd audispd-plugins
            elif command -v zypper &> /dev/null; then
              zypper install -y audit
            else
              echo "Unsupported package manager. Please install auditd manually."
              exit 1
            fi

            echo "Enabling and starting auditd service..."
            systemctl --now enable auditd
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to ensure auditd is installed, enabled, and running:

            ```yaml
            ---
            - name: Ensure auditd is installed and running
              hosts: all
              become: true

              tasks:
                - name: Install auditd on RHEL/Fedora/Amazon Linux
                  ansible.builtin.package:
                    name:
                      - audit
                      - audit-libs
                    state: present
                  when: ansible_facts['os_family'] == "RedHat"

                - name: Install auditd on Debian/Ubuntu
                  ansible.builtin.package:
                    name:
                      - auditd
                      - audispd-plugins
                    state: present
                  when: ansible_facts['os_family'] == "Debian"

                - name: Install auditd on SLES/openSUSE
                  ansible.builtin.package:
                    name: audit
                    state: present
                  when: ansible_facts['os_family'] == "Suse"

                - name: Enable and start auditd service
                  ansible.builtin.systemd:
                    name: auditd
                    enabled: yes
                    state: started
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to install auditd and start it at boot:

            ```ruby
            audit_packages = if platform_family?('debian')
                               %w(auditd audispd-plugins)
                             elsif platform_family?('suse')
                               %w(audit)
                             else
                               %w(audit audit-libs)
                             end

            package audit_packages do
              action :install
            end

            service 'auditd' do
              action %i(enable start)
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-auditing-for-processes-that-start-prior-to-auditd-is-enabled
    title: Ensure auditing for processes that start prior to auditd is enabled
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    filters: |
      asset.runtime != "docker-container"
    mql: |
      switch {
        case file("/boot/grub2/grubenv").exists:
          file("/boot/grub2/grubenv").content.lines.where( _ == /^[^#]/ )
            .any(_ == /audit(\s+)?\=(\s+)?1/);
        case file("/boot/grub2/grub.cfg").exists:
          file("/boot/grub2/grub.cfg").content.lines.where( _ == /^[^#]/ )
            .any(_ == /audit(\s+)?\=(\s+)?1/);
        case file("/boot/grub/grub.cfg").exists:
          file("/boot/grub/grub.cfg").content.lines.where( _ == /^[^#]/ )
            .any(_ == /audit(\s+)?\=(\s+)?1/);
        case file("/boot/grub/grub.conf").exists:
          file("/boot/grub/grub.conf").content.lines.where( _ == /^[^#]/ )
            .any(_ == /audit(\s+)?\=(\s+)?1/);
        case file("/etc/secboot/config.json").exists:
          parse.json('/etc/secboot/config.json')
            .params['kernel-params'] == /audit(\s+)?\=(\s+)?1/;
        default: false
      }
    docs:
      desc: |
        This check verifies that the kernel begins auditing at boot, before the `auditd` daemon has started.

        The kernel queues audit events from very early in boot, but only if it is told to. The check reads the boot loader configuration under `/boot`, and on systems that store kernel parameters in `/etc/secboot/config.json` it reads that instead, looking for `audit=1` on the active kernel command line. Setting it means adding the parameter to `GRUB_CMDLINE_LINUX` and regenerating the boot loader configuration, and it takes effect on the next boot.

        **Why this matters**

        Between the kernel handing control to the init system and `auditd` opening its socket, the host runs a considerable amount of code: the init system itself, mount and udev work, early kernel module loads, and any unit ordered ahead of the audit daemon. Without `audit=1`, none of it is auditable, because the kernel discards audit events instead of holding them until a daemon is listening.

        An attacker who has already reached the host cares about that window, because it is the one place where privileged action leaves no audit record at all. Persistence installed as an early-boot unit, a module loaded before auditing starts, or a filesystem mounted somewhere unexpected all execute inside it, and the audit log opens afterwards showing a clean boot.

        The gap is a problem in the ordinary case too. An audit trail with a recurring hole at every reboot cannot be used to establish that a file went untouched over a period, because the reboots are exactly the moments it does not cover.

        Note that this parameter only preserves events; the rules still decide what is recorded. Pair it with the syscall and watch rules the rest of this policy requires, and confirm the change survived by reading the running kernel command line after the reboot.
      audit: |
        Run this command to confirm the kernel command line enables auditing of early-boot processes:

        ```bash
        grep -E 'audit=1' /boot/grub2/grubenv /boot/grub2/grub.cfg /boot/grub/grub.cfg
        ```

        A passing result shows an `audit=1` parameter on the active kernel boot entry. A failing result shows the parameter absent.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Edit the GRUB configuration file at `/etc/default/grub` to include the `audit=1` parameter in the `GRUB_CMDLINE_LINUX` value, keeping any previous values it may have:

                ```ini
                GRUB_CMDLINE_LINUX="audit=1"
                ```

            2. Update the GRUB configuration:

                **RHEL/Fedora/Amazon Linux and derivatives**

                For BIOS systems:

                ```bash
                grub2-mkconfig -o /boot/grub2/grub.cfg
                ```

                For UEFI systems:

                ```bash
                grub2-mkconfig -o /boot/efi/EFI/<distribution>/grub.cfg
                ```

                Replace `<distribution>` with your distribution's directory name (e.g., `centos`, `redhat`, `fedora`).

                On RHEL 8 and later, also update the kernel command line for the installed kernels, because the active boot entries read their parameters from `grubenv` and the BLS entries rather than the regenerated `grub.cfg`:

                ```bash
                grubby --update-kernel=ALL --args="audit=1"
                ```

                **Debian/Ubuntu and derivatives**

                ```bash
                update-grub
                ```

            3. Reboot the system so the kernel starts with the new `audit=1` parameter. The change does not take effect until the next boot.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure the audit=1 parameter is set in the GRUB configuration.

            ```bash
            #!/bin/bash
            set -e

            # Check if GRUB configuration file exists
            if [ -f /etc/default/grub ]; then
              if grep -q "audit=1" /etc/default/grub; then
                echo "audit=1 is already set in GRUB configuration."
              else
                echo "Setting audit=1 in GRUB configuration."
                sed -i 's/GRUB_CMDLINE_LINUX="/GRUB_CMDLINE_LINUX="audit=1 /' /etc/default/grub
              fi
            fi

            if command -v update-grub >/dev/null 2>&1; then
              echo "Running update-grub"
              update-grub
            else
              echo "Regenerating grub.cfg"
              grub2-mkconfig -o /boot/grub2/grub.cfg
              # On RHEL 8 and later the active boot entries read their parameters from grubenv and
              # the BLS entries, so a regenerated grub.cfg alone may not apply audit=1. grubby
              # updates the installed kernels directly, so run it whenever it is available.
              if command -v grubby >/dev/null 2>&1; then
                echo "Updating the kernel command line with grubby"
                grubby --update-kernel=ALL --args="audit=1"
              fi
            fi

            echo "Reboot required: audit=1 takes effect on the next boot."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to ensure the `audit=1` kernel parameter is set in the GRUB bootloader configuration and regenerate the GRUB config:

            ```yaml
            ---
            - name: Enable auditing for processes that start prior to auditd
              hosts: all
              become: true

              tasks:
                - name: Ensure audit=1 is set in GRUB_CMDLINE_LINUX
                  ansible.builtin.lineinfile:
                    path: /etc/default/grub
                    regexp: '^GRUB_CMDLINE_LINUX="((?!audit=1).*)"$'
                    line: 'GRUB_CMDLINE_LINUX="audit=1 \1"'
                    backrefs: yes

                - name: Regenerate GRUB configuration (Debian/Ubuntu)
                  ansible.builtin.command: update-grub
                  when: ansible_os_family == "Debian"

                - name: Regenerate GRUB configuration (RHEL/SUSE BIOS)
                  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
                  when: ansible_os_family in ["RedHat", "Suse"]

                - name: Update the kernel command line for installed kernels (RHEL 8 and later)
                  ansible.builtin.command: grubby --update-kernel=ALL --args="audit=1"
                  when: ansible_os_family == "RedHat"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to add `audit=1` to the kernel command line and regenerate the bootloader configuration. The setting takes effect on the next boot:

            ```ruby
            grub_default = '/etc/default/grub'
            grub_command = if platform_family?('debian')
                             'update-grub'
                           else
                             'grub2-mkconfig -o /boot/grub2/grub.cfg'
                           end

            execute 'regenerate the GRUB configuration' do
              command grub_command
              action :nothing
            end

            execute 'update the command line of installed kernels' do
              command 'grubby --update-kernel=ALL --args="audit=1"'
              only_if { platform_family?('rhel', 'fedora', 'amazon') }
              only_if 'command -v grubby'
            end

            ruby_block 'add audit=1 to the kernel command line' do
              block do
                body = ::File.read(grub_default)
                body = body.gsub(/^GRUB_CMDLINE_LINUX="(.*)"$/) do
                  %(GRUB_CMDLINE_LINUX="audit=1 #{Regexp.last_match(1)}")
                end
                ::File.write(grub_default, body)
              end
              not_if { ::File.read(grub_default).match?(/^GRUB_CMDLINE_LINUX=".*\baudit=1\b.*"$/) }
              notifies :run, 'execute[regenerate the GRUB configuration]', :immediately
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-audit-log-storage-size-is-configured
    title: Ensure audit log storage size is configured
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      file("/etc/audit/auditd.conf").exists &&
        auditd.config.params.contains("max_log_file") &&
        auditd.config.params.max_log_file != 0
    docs:
      desc: |
        This check verifies that a single audit log file has a bounded size, so the audit daemon rotates rather than growing one file without limit.

        The check reads `max_log_file` in `/etc/audit/auditd.conf`, which sets the size in megabytes at which the current log is closed and rotated. The value must be present and non-zero, because zero means no limit at all.

        **Why this matters**

        Audit logs grow quickly on a busy host, and the volume is not under the operator's control. A noisy syscall rule, a batch job that touches many files, or an attacker deliberately generating auditable events can all produce far more records than the daily average suggests.

        Without a rotation threshold, that growth lands in one file on whatever filesystem holds `/var/log/audit`. When the filesystem fills, the effects reach past the audit system. Services that cannot write to `/var/log` start failing, and depending on the configured disk-space actions, the audit daemon either stops recording or takes the host out of service.

        There is an attacker-facing side to this as well. Filling the audit partition is a cheap way to blind the host: an unprivileged user who can generate auditable events in a loop pushes the log past the available space, and whatever happens next either goes unrecorded or is buried under millions of generated records. A bounded file size, paired with a rotation count and a dedicated partition, keeps that attempt from taking the whole filesystem with it.

        Set the value against how much history the site needs and how much space is available. Pair it with `num_logs` and with the disk-space actions a companion check in this policy covers, and ship records off the host so that rotation ages out copies rather than the only record.
      audit: |
        Run this command to inspect the audit log file size setting:

        ```bash
        grep -E '^max_log_file\b' /etc/audit/auditd.conf
        ```

        A passing result shows `max_log_file` set to a non-zero value. A failing result shows the setting absent or set to `0`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Set the following parameter in `/etc/audit/auditd.conf` in accordance with site policy:

                ```ini
                max_log_file = <MB>
                ```

            2. Restart the auditd service to apply the new configuration:

                ```bash
                systemctl restart auditd 2>/dev/null || service auditd restart
                ```

                On RHEL-based systems `systemctl restart auditd` is refused because the auditd unit disallows manual stops, so the `service auditd restart` fallback performs the restart.

            3. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to configure the maximum log file size for audit logs.

            ```bash
            #!/bin/bash
            set -e

            MB_SIZE="500"  # Replace 500 with the desired size in megabytes

            if grep -q '^max_log_file' /etc/audit/auditd.conf; then
              echo "Updating max_log_file to $MB_SIZE in /etc/audit/auditd.conf"
              sed -i "s/^max_log_file.*/max_log_file = $MB_SIZE/" /etc/audit/auditd.conf
            else
              echo "Adding max_log_file = $MB_SIZE to /etc/audit/auditd.conf"
              echo "max_log_file = $MB_SIZE" >> /etc/audit/auditd.conf
            fi

            echo "Restarting auditd service to apply changes"
            systemctl restart auditd 2>/dev/null || service auditd restart

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the maximum log file size for audit logs. Set `max_log_file_mb` to the maximum log file size in megabytes required by your site policy:

            ```yaml
            ---
            - name: Configure audit log storage size
              hosts: all
              become: true

              vars:
                max_log_file_mb: 500

              tasks:
                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Ensure audit log storage size is configured in auditd.conf
                  ansible.builtin.lineinfile:
                    path: /etc/audit/auditd.conf
                    regexp: '^max_log_file ='
                    line: 'max_log_file = {{ max_log_file_mb }}'
                    create: yes
                    state: present
                  register: auditd_logsize_changed

                - name: Restart auditd service to apply changes if not immutable
                  ansible.builtin.service:
                    name: auditd
                    state: restarted
                  when:
                    - immutable_check.rc != 0
                    - auditd_logsize_changed.changed
                    - ansible_facts['os_family'] != 'RedHat'

                - name: Restart auditd on RHEL-based systems where systemd refuses manual restarts
                  ansible.builtin.command: /usr/libexec/initscripts/legacy-actions/auditd/restart
                  when:
                    - immutable_check.rc != 0
                    - auditd_logsize_changed.changed
                    - ansible_facts['os_family'] == 'RedHat'

                - name: Warn if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to cap the size of a single audit log file. Change `500` to the size in megabytes your site policy requires:

            ```ruby
            auditd_conf = '/etc/audit/auditd.conf'
            restart_command = if platform_family?('rhel', 'fedora', 'amazon')
                                '/usr/libexec/initscripts/legacy-actions/auditd/restart'
                              else
                                'systemctl restart auditd'
                              end

            execute 'restart auditd' do
              command restart_command
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            { 'max_log_file' => '500' }.each do |keyword, value|
              ruby_block "set #{keyword} in auditd.conf" do
                block do
                  body = ::File.read(auditd_conf)
                  directive = "#{keyword} = #{value}"
                  body = if body.match?(/^\s*#{keyword}\s*=/)
                           body.gsub(/^\s*#{keyword}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(auditd_conf, body)
                end
                not_if { ::File.read(auditd_conf).match?(/^#{keyword}\s*=\s*#{Regexp.escape(value)}\s*$/) }
                notifies :run, 'execute[restart auditd]', :delayed
              end
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-audit-logs-are-not-automatically-deleted
    title: Ensure audit logs are not automatically deleted
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      file("/etc/audit/auditd.conf").exists &&
        auditd.config.params.max_log_file_action == "keep_logs"
    docs:
      desc: |
        This check verifies that auditd retains rotated audit logs instead of deleting or overwriting them.

        The check reads `max_log_file_action` in `/etc/audit/auditd.conf`, which must be `keep_logs`. The alternatives destroy history: `rotate` keeps a fixed number of files and deletes the oldest, and `ignore` keeps writing to a single file indefinitely.

        **Why this matters**

        The alternatives to `keep_logs` all destroy evidence on a timer. `rotate` keeps a fixed number of files and deletes the oldest, and `ignore` keeps writing to a single file indefinitely.

        That deletion is silent and its timing is attacker-controllable. Intrusions are typically discovered weeks or months after the initial access, so the entries that describe how an attacker first arrived are the oldest and the first to be discarded. An attacker who knows the rotation behavior can accelerate it deliberately: generating a large volume of routine, auditable activity pushes the interesting entries out of retention without touching a single log file or triggering anything that looks like tampering.

        What remains after that is an investigation that can describe the current state of a compromise but not its origin, which is the part that determines whether other hosts are affected and whether the entry point is still open.

        `keep_logs` retains files until something else removes them, so pair it with disk monitoring and an archival process. This check works alongside the ones requiring a size limit and a low-space action, which together prevent retention from filling the filesystem.
      audit: |
        Run this command to inspect the audit log rotation action:

        ```bash
        grep -E '^max_log_file_action' /etc/audit/auditd.conf
        ```

        A passing result shows `max_log_file_action = keep_logs`. A failing result shows any other value, such as `rotate` or `ignore`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            **Caveat: `keep_logs` does not rotate or delete logs and can fill the disk.** With this setting auditd stops writing to a log only when it reaches `max_log_file`, then opens the next numbered file and keeps all of them. Pair it with external rotation or archival, and place `/var/log/audit` on its own partition that you monitor, otherwise the disk will eventually fill and auditing or the system can stop.

            1. Set the following parameter in `/etc/audit/auditd.conf`:

                ```ini
                max_log_file_action = keep_logs
                ```

            2. Restart the service to load the new configuration values:

                ```bash
                systemctl restart auditd 2>/dev/null || service auditd restart
                ```

                On RHEL-based systems `systemctl restart auditd` is refused because the auditd unit disallows manual stops, so the `service auditd restart` fallback performs the restart.

            3. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**
            Use this Bash script to configure the maximum log file action for audit logs.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^max_log_file_action' /etc/audit/auditd.conf; then
              echo "Updating max_log_file_action to keep_logs in /etc/audit/auditd.conf"
              sed -i 's/^max_log_file_action.*/max_log_file_action = keep_logs/' /etc/audit/auditd.conf
            else
              echo "Adding max_log_file_action = keep_logs to /etc/audit/auditd.conf"
              echo "max_log_file_action = keep_logs" >> /etc/audit/auditd.conf
            fi

            echo "Restarting auditd service to apply changes"
            systemctl restart auditd 2>/dev/null || service auditd restart

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the maximum log file action for audit logs:

            ```yaml
            ---
            - name: Configure audit log file action
              hosts: all
              become: true

              tasks:
                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Ensure audit log file action is configured in auditd.conf
                  ansible.builtin.lineinfile:
                    path: /etc/audit/auditd.conf
                    regexp: '^max_log_file_action ='
                    line: 'max_log_file_action = keep_logs'
                    create: yes
                    state: present
                  register: auditd_logfile_action_changed

                - name: Restart auditd service to apply changes if not immutable
                  ansible.builtin.service:
                    name: auditd
                    state: restarted
                  when:
                    - immutable_check.rc != 0
                    - auditd_logfile_action_changed.changed
                    - ansible_facts['os_family'] != 'RedHat'

                - name: Restart auditd on RHEL-based systems where systemd refuses manual restarts
                  ansible.builtin.command: /usr/libexec/initscripts/legacy-actions/auditd/restart
                  when:
                    - immutable_check.rc != 0
                    - auditd_logfile_action_changed.changed
                    - ansible_facts['os_family'] == 'RedHat'

                - name: Warn if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to keep rotated audit logs instead of deleting them. Ship the logs to a central collector or size the audit partition to match the retention you need:

            ```ruby
            auditd_conf = '/etc/audit/auditd.conf'
            restart_command = if platform_family?('rhel', 'fedora', 'amazon')
                                '/usr/libexec/initscripts/legacy-actions/auditd/restart'
                              else
                                'systemctl restart auditd'
                              end

            execute 'restart auditd' do
              command restart_command
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            { 'max_log_file_action' => 'keep_logs' }.each do |keyword, value|
              ruby_block "set #{keyword} in auditd.conf" do
                block do
                  body = ::File.read(auditd_conf)
                  directive = "#{keyword} = #{value}"
                  body = if body.match?(/^\s*#{keyword}\s*=/)
                           body.gsub(/^\s*#{keyword}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(auditd_conf, body)
                end
                not_if { ::File.read(auditd_conf).match?(/^#{keyword}\s*=\s*#{Regexp.escape(value)}\s*$/) }
                notifies :run, 'execute[restart auditd]', :delayed
              end
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-system-is-disabled-when-audit-logs-are-full
    title: Ensure system is disabled when audit logs are full
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    filters: |
      asset.kind != "container-image"
    mql: |
      file("/etc/audit/auditd.conf").exists &&
        auditd.config.params.space_left_action == /email|exec|single|halt/ &&
        auditd.config.params.action_mail_acct == "root" &&
        auditd.config.params.admin_space_left_action == /halt|single/
    docs:
      desc: |
        This check verifies that the audit daemon is configured to act, rather than silently continue, when the filesystem holding the audit logs runs low on space.

        Three settings in `/etc/audit/auditd.conf` carry that behavior. `space_left_action` fires at the warning threshold and must be `email`, `exec`, `single`, or `halt`. `action_mail_acct` names the recipient of the warning and must be `root`, whose mail an administrator or a forwarding alias actually reads. `admin_space_left_action` fires at the critical threshold and must be `halt` or `single`, so the host powers off or drops to single-user mode instead of running on without a usable audit trail.

        **Why this matters**

        The default behavior when the audit partition fills is to keep the system running and stop recording. Nothing is logged about the events that follow, because there is nowhere to write them, and the host looks entirely normal while producing no audit trail at all.

        An attacker with any local foothold can bring that state about deliberately and cheaply. Auditable events can be generated in a loop from an unprivileged shell, and once the partition is full the rules that would have recorded the next stage of the intrusion have nothing to write to. Blinding the audit system this way needs no privilege and no exploit, only patience and a small partition.

        Configuring the thresholds removes the payoff. The warning gives an administrator time to act, and the critical action stops the host rather than letting it run unmonitored, which turns an invisible blinding attempt into a loud outage.

        Choose the critical action deliberately, because both options interrupt service. `single` is the less disruptive of the two. Size a dedicated partition for `/var/log/audit` and forward records off the host first, so that the warning threshold is the one you meet in practice.
      audit: |
        Run this command to inspect the audit disk-space actions:

        ```bash
        grep -E '^(space_left_action|action_mail_acct|admin_space_left_action)' /etc/audit/auditd.conf
        ```

        A passing result shows `space_left_action` set to `email`, `exec`, `single`, or `halt`; `action_mail_acct` set to `root`; and `admin_space_left_action` set to `halt` or `single`. A failing result shows any of these settings missing or set to a permissive value.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            **Warning: this can take a production host offline.** `admin_space_left_action` controls what happens when the audit disk is critically low. `halt` powers the system down and `single` drops it to single-user mode, both of which interrupt service. This is a deliberate trade-off that puts audit completeness ahead of availability, so choose it only where that ordering is required, such as systems with a legal mandate for complete audit records. Before enabling either action, size a dedicated partition for `/var/log/audit`, then tune `space_left` and the lower-severity `space_left_action` (for example `email` or `exec`) so you are alerted and can act well before the critical threshold is reached. This check accepts either `single` or `halt`; `single` is the less disruptive choice and is recommended unless a full halt is mandated.

            1. Set the following parameters in `/etc/audit/auditd.conf`:

                ```ini
                space_left_action = email
                action_mail_acct = root
                admin_space_left_action = single
                ```

            2. Restart the service to load the new configuration values:

                ```bash
                systemctl restart auditd 2>/dev/null || service auditd restart
                ```

                On RHEL-based systems `systemctl restart auditd` is refused because the auditd unit disallows manual stops, so the `service auditd restart` fallback performs the restart.

            3. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            **Warning: this can take a production host offline.** `admin_space_left_action = single` drops the system to single-user mode when the audit disk is critically low, which interrupts service. This script uses `single` rather than `halt` to reduce the impact, but it is still disruptive. Size a dedicated partition for `/var/log/audit` and rely on the lower-severity `space_left_action = email` alert to act before the critical threshold is reached. Use this Bash script to configure the auditd parameters for handling full audit logs.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^space_left_action' /etc/audit/auditd.conf; then
              echo "Updating space_left_action to email in /etc/audit/auditd.conf"
              sed -i 's/^space_left_action.*/space_left_action = email/' /etc/audit/auditd.conf
            else
              echo "Adding space_left_action = email to /etc/audit/auditd.conf"
              echo "space_left_action = email" >> /etc/audit/auditd.conf
            fi

            if grep -q '^action_mail_acct' /etc/audit/auditd.conf; then
              echo "Updating action_mail_acct to root in /etc/audit/auditd.conf"
              sed -i 's/^action_mail_acct.*/action_mail_acct = root/' /etc/audit/auditd.conf
            else
              echo "Adding action_mail_acct = root to /etc/audit/auditd.conf"
              echo "action_mail_acct = root" >> /etc/audit/auditd.conf
            fi

            if grep -q '^admin_space_left_action' /etc/audit/auditd.conf; then
              echo "Updating admin_space_left_action to single in /etc/audit/auditd.conf"
              sed -i 's/^admin_space_left_action.*/admin_space_left_action = single/' /etc/audit/auditd.conf
            else
              echo "Adding admin_space_left_action = single to /etc/audit/auditd.conf"
              echo "admin_space_left_action = single" >> /etc/audit/auditd.conf
            fi

            echo "Restarting auditd service to apply changes"
            systemctl restart auditd 2>/dev/null || service auditd restart

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning: this can take a production host offline.** `admin_space_left_action = single` drops the system to single-user mode when the audit disk is critically low, which interrupts service. This playbook uses `single` rather than `halt` to reduce the impact, but it is still disruptive. Size a dedicated partition for `/var/log/audit` and rely on the lower-severity `space_left_action = email` alert to act before the critical threshold is reached. Use this Ansible playbook to set the auditd parameters:

            ```yaml
            ---
            - name: Configure auditd parameters
              hosts: all
              become: true

              tasks:
                - name: Ensure auditd parameters are configured in auditd.conf
                  ansible.builtin.lineinfile:
                    path: /etc/audit/auditd.conf
                    regexp: '^{{ item.key }} ='
                    line: '{{ item.key }} = {{ item.value }}'
                    create: yes
                    state: present
                  loop:
                    - { key: space_left_action, value: email }
                    - { key: action_mail_acct, value: root }
                    - { key: admin_space_left_action, value: single }
                  register: auditd_params_changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Restart auditd service to apply changes if not immutable and config changed
                  ansible.builtin.service:
                    name: auditd
                    state: restarted
                  when:
                    - immutable_check.rc != 0
                    - auditd_params_changed.changed
                    - ansible_facts['os_family'] != 'RedHat'

                - name: Restart auditd on RHEL-based systems where systemd refuses manual restarts
                  ansible.builtin.command: /usr/libexec/initscripts/legacy-actions/auditd/restart
                  when:
                    - immutable_check.rc != 0
                    - auditd_params_changed.changed
                    - ansible_facts['os_family'] == 'RedHat'

                - name: Warn if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **Warning: this can take a production host offline.** `admin_space_left_action = single` drops the system to single-user mode when the audit disk is critically low, which interrupts service. This recipe uses `single` rather than `halt` to reduce the impact, but it is still disruptive. Size a dedicated partition for `/var/log/audit` and rely on the lower-severity `space_left_action = email` alert to act before the critical threshold is reached. Use this Chef Infra recipe code to set the auditd disk space actions:

            ```ruby
            auditd_conf = '/etc/audit/auditd.conf'
            restart_command = if platform_family?('rhel', 'fedora', 'amazon')
                                '/usr/libexec/initscripts/legacy-actions/auditd/restart'
                              else
                                'systemctl restart auditd'
                              end

            execute 'restart auditd' do
              command restart_command
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            { 'space_left_action' => 'email', 'action_mail_acct' => 'root', 'admin_space_left_action' => 'single' }.each do |keyword, value|
              ruby_block "set #{keyword} in auditd.conf" do
                block do
                  body = ::File.read(auditd_conf)
                  directive = "#{keyword} = #{value}"
                  body = if body.match?(/^\s*#{keyword}\s*=/)
                           body.gsub(/^\s*#{keyword}\s*=.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(auditd_conf, body)
                end
                not_if { ::File.read(auditd_conf).match?(/^#{keyword}\s*=\s*#{Regexp.escape(value)}\s*$/) }
                notifies :run, 'execute[restart auditd]', :delayed
              end
            end
            ```
