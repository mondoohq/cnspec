  - uid: mondoo-linux-security-permissions-on-etcpasswd-are-configured
    title: Ensure secure permissions on /etc/passwd are set
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      file("/etc/passwd") {
        permissions.user_executable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      desc: |
        This check verifies that `/etc/passwd` carries no execute bit for the owner and no write or execute permission for the group or for other users. Read access is deliberately left open, because ordinary commands need it. The expected mode is `0644`.

        **Why this matters**

        `/etc/passwd` maps every account to its UID, primary GID, home directory, and login shell. It has to be world-readable so that `ls`, `ps`, and every other tool can turn a numeric owner into a name, so the control here is write access, not confidentiality.

        Write access to this file is a direct route to root, and it does not require any exploit. Changing an account's UID field to `0` makes that account root on next login. Changing its shell field from `/sbin/nologin` to `/bin/bash` turns a service account that was never meant to be used interactively into one that can be. Adding a line creates an account outright.

        The `x` in the password field points at `/etc/shadow` for the actual hash. On a system where that indirection has been undone, a password hash sits in this world-readable file instead, which is why the field is worth confirming as well as the mode.

        Group and other write are both excluded because either one is sufficient. A file writable by a group with any member other than `root` grants that member the same authority as a world-writable file.
      audit: |
        Run this command to inspect the ownership and permissions of `/etc/passwd`:

        ```bash
        stat -c '%U %G %a' /etc/passwd
        ```

        A passing result shows the file owned by root with the expected hardened mode. A failing result shows group or other write or execute access, or for shadow files any read access for other users.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To set the ownership and permissions on the `/etc/passwd` file, run the following commands:

            ```bash
            chown root:root /etc/passwd
            chmod 644 /etc/passwd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that the `/etc/passwd` file has the correct permissions, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

