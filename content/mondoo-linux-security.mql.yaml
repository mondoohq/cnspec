      service("smbd").enabled == false
      service("smb").running == false
      service("smbd").running == false
    docs:
      desc: |
        This check verifies that the `smb` and `smbd` services are neither running nor enabled at boot. These provide SMB and CIFS file and print sharing for Windows interoperability.

        **Why this matters**

        SMB is among the most heavily targeted protocols on any network. It is the first thing scanned for after a foothold is established, because it so often leads directly to file access or to credentials.

        Two specific paths matter. Guest or anonymous shares, which are easy to create accidentally and persist unnoticed, expose their contents to anyone who can reach port 445. And SMB authentication can be relayed: a host that speaks SMB can be coerced into authenticating to an attacker, who forwards those credentials to a third system and acts as the user. Neither requires a software vulnerability.

        The protocol has also produced wormable remote code execution repeatedly, in both the Windows and Samba implementations, and those vulnerabilities are weaponized within days because the installed base is so large.

        Where Samba is required, bind it to a management or storage network rather than a general one, disable guest access, require SMB signing, and keep the packages current. Where it is not required, stop and disable the services.
      audit: |
        Run this command to confirm the Samba service is stopped and disabled:

        ```bash
        systemctl is-active smb smbd
        systemctl is-enabled smb smbd
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
