        Leave the module blocked unless this host is connected to a CAN bus and runs software that speaks it, such as an industrial gateway or a vehicle telemetry collector.
      audit: |
        Run this command to confirm the `can` module is blacklisted and its installation is disabled:

        ```bash
        grep -E '^\s*(blacklist|install)\s+can\b' /etc/modprobe.d/*.conf
        ```

        A passing result shows both a `blacklist can` line and an `install can /bin/false` line. A failing result shows either directive missing.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Create or edit the file `/etc/modprobe.d/can.conf` and add the following lines to disable loading and installation of the CAN module:

            ```text
            blacklist can
            install can /bin/false
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to disable the CAN module by creating the appropriate modprobe configuration file:

            ```bash
            #!/bin/bash
            set -e

            echo "Unload CAN module if currently loaded..."
            modprobe -r can || true

            echo "Disabling CAN module..."
            cat <<EOF > /etc/modprobe.d/can.conf
            blacklist can
            install can /bin/false
            EOF
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to disable the CAN module:

            ```yaml
            ---
            - name: Disable CAN module on Linux systems
              hosts: all
              become: true

              tasks:
                - name: Create modprobe config to disable CAN module
                  ansible.builtin.copy:
                    dest: /etc/modprobe.d/can.conf
                    owner: root
                    group: root
                    mode: '0644'
                    content: |
                      blacklist can
                      install can /bin/false
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop the CAN module from loading:

            ```ruby
            kernel_module 'can' do
              action %i(disable blacklist)
            end
            ```
