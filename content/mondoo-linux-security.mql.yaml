  - uid: mondoo-linux-security-suspicious-packets-are-logged
    title: Ensure suspicious packets are logged
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.conf.all.log_martians'] == 1
      kernel.parameters['net.ipv4.conf.default.log_martians'] == 1
    docs:
      desc: |
        This check verifies that the host logs martian packets.

        A martian packet is one whose source address could not legitimately have come from the interface it arrived on, and without this setting the kernel drops them silently. The check reads the kernel parameters `net.ipv4.conf.all.log_martians` and `net.ipv4.conf.default.log_martians`, both of which must be `1`.

        **Why this matters**

        A martian packet is one the routing table says is impossible: traffic claiming an internal source address arriving on an external interface is the classic example. Legitimate traffic essentially never produces one.

        That makes each log entry worth reading, because there are only a few explanations. Someone is spoofing source addresses to probe or attack the host, a routing or firewall change has gone wrong, or a device is misconfigured and injecting traffic where it does not belong. All three are conditions an operator wants to know about, and none of them generates any other signal.

        Without the logging, the host defends itself correctly and tells nobody. Spoofed packets are dropped, the attack proceeds against other targets, and a campaign that swept the whole network leaves no trace on any of the machines it touched.

        This produces volume on noisy networks. The kernel rate-limits the messages internally, so handle the remainder with log rotation and retention rather than turning the logging off. Note that this behavior depends on reverse path filtering being active, since that is what identifies a packet as martian in the first place.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv4.conf.all.log_martians
        sysctl net.ipv4.conf.default.log_martians
        ```

        A passing result shows every listed parameter set to `1`. A failing result shows any parameter set to `0` or absent.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Set the following parameters in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv4.conf.all.log_martians = 1
                net.ipv4.conf.default.log_martians = 1
                ```

            2. Run these commands to set the active kernel parameters:

                ```bash
                sysctl -w net.ipv4.conf.all.log_martians=1
                sysctl -w net.ipv4.conf.default.log_martians=1
                sysctl -w net.ipv4.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to enable logging of suspicious packets.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^net.ipv4.conf.all.log_martians' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.conf.all.log_martians to 1 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.conf.all.log_martians.*/net.ipv4.conf.all.log_martians = 1/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.conf.all.log_martians to 1 in /etc/sysctl.d/99-log-martians.conf"
              echo "net.ipv4.conf.all.log_martians = 1" >> /etc/sysctl.d/99-log-martians.conf
            fi

            if grep -q '^net.ipv4.conf.default.log_martians' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.conf.default.log_martians to 1 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.conf.default.log_martians.*/net.ipv4.conf.default.log_martians = 1/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.conf.default.log_martians to 1 in /etc/sysctl.d/99-log-martians.conf"
              echo "net.ipv4.conf.default.log_martians = 1" >> /etc/sysctl.d/99-log-martians.conf
            fi

            sysctl -w net.ipv4.conf.all.log_martians=1
            sysctl -w net.ipv4.conf.default.log_martians=1
            sysctl -w net.ipv4.route.flush=1
            sysctl --system
