    docs:
      desc: |
        This check verifies that audit rules record failed file access, covering the `creat`, `open`, `openat`, `truncate`, and `ftruncate` system calls on both 32-bit and 64-bit architectures, filtered to `auid>=1000`, excluding daemon activity, and matching the `EACCES` and `EPERM` return codes. Each rule must carry a non-empty key.

        **Why this matters**

        Successful access tells you what someone did. Failed access tells you what they tried, and after a compromise that is frequently the more informative half.

        An attacker landing in an unfamiliar account does not know what it can reach, so the first thing they do is find out. Attempts to open `/etc/shadow`, other users' home directories, private keys, database credentials, and container socket files all fail, all return `EACCES` or `EPERM`, and all leave no trace anywhere else on the system. A burst of them from one account in a short window is one of the clearest signals of an account being explored by someone who is not its owner, and it appears before the attacker finds anything that works.

        The same records serve a second purpose. A steady trickle of permission denials from a service account usually means a genuine misconfiguration, and these rules surface it before it becomes an outage.

        The `auid` filter is essential here. Failed opens are constant during normal operation, particularly from library and configuration path searching, and without the filter the useful events are lost in that volume.
      audit: |
        Run this command to confirm the audit rules for unsuccessful file access attempts are loaded:

        ```bash
        auditctl -l | grep -E -- '(creat|open|openat|truncate|ftruncate)' | grep -E -- '(exit=-EACCES|exit=-EPERM)'
        ```

        A passing result lists the expected audit rules with non-empty keys. A failing result returns no matching rules.
