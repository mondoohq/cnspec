  - uid: mondoo-linux-security-only-strong-ciphers-are-used
    title: Ensure only strong ciphers are used
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: package('openssh-server').installed
    props:
      - uid: mondooLinuxSecuritySshdCiphers
        title: Define the hardened ciphers for all SSH configurations
        mql: |
          if( package('openssh-server').version >= semver("6") && package('openssh-server').version < semver("7")  ) {
            return ["aes256-ctr", "aes192-ctr", "aes128-ctr"]
          }
          return ["chacha20-poly1305@openssh.com","aes256-gcm@openssh.com","aes128-gcm@openssh.com","aes256-ctr","aes192-ctr","aes128-ctr"]
    mql: |
      sshd.config.ciphers != empty
      sshd.config.ciphers.containsOnly(props.mondooLinuxSecuritySshdCiphers)
    docs:
      desc: |
        This check verifies that the SSH server offers only strong encryption ciphers.

        The cipher protects the confidentiality of everything inside a session, and the server's list determines the weakest option a client can select. The check reads the `Ciphers` directive in `/etc/ssh/sshd_config` and requires that every algorithm it names appears in the approved list carried by this policy's property. The directive must be present; a configuration that relies on OpenSSH's compiled-in default fails this check.

        **Why this matters**

        The cipher protects the confidentiality of everything inside the session: commands, file contents, and any credential typed at a prompt. The client and server negotiate which one to use from the lists each offers, and the server's list determines the weakest option that can be selected.

        Two categories are worth excluding deliberately. CBC-mode ciphers are vulnerable to a plaintext recovery attack against the SSH binary packet protocol that lets an attacker who can inject and observe traffic recover portions of the plaintext. Anything built on RC4, offered as `arcfour` and its variants, is broken outright by biases in its keystream. Both remain compiled into some builds for compatibility.

        Requiring the directive to be present, rather than accepting the default, is deliberate. Defaults differ across OpenSSH versions and vendor builds, so a host that looks fine today can offer a weaker set after a package upgrade or a move to a different distribution. An explicit list makes the negotiated floor a property of the configuration rather than of the build.

        Prefer AEAD constructions such as `chacha20-poly1305@openssh.com` and the AES-GCM ciphers, which authenticate and encrypt in a single pass. Adjust the property if a client that cannot be upgraded requires something outside the list, and record why.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*Ciphers\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows an explicit `Ciphers` directive listing only approved algorithms. A failing result lists a weak algorithm, such as any CBC-mode cipher or an `arcfour` variant, or produces no output at all, which means the directive is absent.

        Do not verify this check with `sshd -T`. That command prints the effective configuration including OpenSSH's built-in defaults, so on a host where the directive is absent it reports `the full built-in cipher list` while this check reads the configuration file and fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works. Setting a cipher list that your SSH clients do not support is one of the most common causes of a total SSH lockout, so verify the new connection from each client type you rely on.

            To configure SSH to use only strong ciphers, edit the `/etc/ssh/sshd_config` file and add or modify the `Ciphers` parameter to include a comma-separated list of approved ciphers.

            On OpenSSH 7.0 or later:

            ```bash
            Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
            ```

            On OpenSSH 6.x, which does not support the chacha20 and GCM ciphers, use only the CTR ciphers:

            ```bash
            Ciphers aes256-ctr,aes192-ctr,aes128-ctr
            ```

            The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads `/etc/ssh/sshd_config.d/` first, in lexical order. Red Hat Enterprise Linux and Ubuntu ship their own snippets in that directory, so a value added to `/etc/ssh/sshd_config` has no effect once one of those snippets sets the same keyword. On Red Hat Enterprise Linux 9 that snippet includes the system-wide cryptographic policy, which sets `Ciphers`, `MACs`, and `KexAlgorithms` itself, so a lower-numbered drop-in is the only place these keywords take effect. Check the directory, and where it is in use put the value in a drop-in numbered below the vendor snippets:

            ```bash
            grep -ri 'Ciphers' /etc/ssh/sshd_config.d/
            touch /etc/ssh/sshd_config.d/00-hardening.conf
            chmod 600 /etc/ssh/sshd_config.d/00-hardening.conf
            echo 'Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' >> /etc/ssh/sshd_config.d/00-hardening.conf
            ```

            Validate the configuration and restart the SSH service to apply the changes:

            ```bash
            sshd -t
            ```

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To ensure that only strong ciphers are used in SSH, you can run the following bash script. It selects the cipher list supported by the installed OpenSSH version:

            ```bash
            #!/bin/bash
            set -e

            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            if grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
              SSHD_CONFIG=/etc/ssh/sshd_config.d/00-hardening.conf
              mkdir -p /etc/ssh/sshd_config.d
              touch "$SSHD_CONFIG"
              chmod 600 "$SSHD_CONFIG"
            else
              SSHD_CONFIG=/etc/ssh/sshd_config
            fi

            openssh_version=$(ssh -V 2>&1 | grep -oP 'OpenSSH_\K\d+')

            if [ "$openssh_version" -lt 7 ]; then
              CIPHER_LINE="Ciphers aes256-ctr,aes192-ctr,aes128-ctr"
            else
              CIPHER_LINE="Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
            fi

            if grep -q '^Ciphers' "$SSHD_CONFIG"; then
              echo "Updating Ciphers in sshd_config..."
              sed -i "s/^Ciphers.*/$CIPHER_LINE/" "$SSHD_CONFIG"
            else
              echo "Adding Ciphers to sshd_config..."
              echo "$CIPHER_LINE" >> "$SSHD_CONFIG"
            fi

            # Validate the new configuration before restarting. A syntax error here can lock you out of SSH.
            sshd -t

            # Restart the SSH service. The unit is "ssh" on Debian/Ubuntu and "sshd" on other distributions.
            if systemctl list-unit-files | grep -q '^ssh\.service'; then
              systemctl restart ssh
            else
              systemctl restart sshd
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To configure SSH to use only strong ciphers, use the following Ansible playbook. On hosts running OpenSSH 6.x, change the `Ciphers` line to `Ciphers aes256-ctr,aes192-ctr,aes128-ctr` because the chacha20 and GCM ciphers are not supported there:

            ```yaml
            ---
            - name: Configure SSH to use only strong ciphers
              hosts: all
              become: true

              tasks:
                - name: Detect whether sshd reads drop-in configuration files
                  ansible.builtin.command: grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
                  register: sshd_include
                  changed_when: false
                  failed_when: false

                # sshd uses the first value it reads for each keyword, and the Include at the top of
                # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order, so a drop-in numbered
                # below the vendor snippets is the only place a new value reliably wins.
                - name: Select the configuration file sshd reads first
                  ansible.builtin.set_fact:
                    sshd_target: "{{ '/etc/ssh/sshd_config.d/00-hardening.conf' if sshd_include.rc == 0 else '/etc/ssh/sshd_config' }}"

                - name: Ensure the hardening drop-in exists
                  ansible.builtin.copy:
                    dest: "{{ sshd_target }}"
                    content: ""
                    force: false
                    owner: root
                    group: root
                    mode: '0600'

                - name: Ensure Ciphers are set in sshd_config
                  ansible.builtin.lineinfile:
                    path: "{{ sshd_target }}"
                    regexp: '^Ciphers'
                    line: 'Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr'
                    create: yes
                    state: present
                  register: ssh_ciphers_config_change

                - name: Gather service facts to detect the SSH unit name
                  ansible.builtin.service_facts:
                  when: ssh_ciphers_config_change.changed

                - name: Restart the SSH service
                  ansible.builtin.systemd:
                    name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
                    state: restarted
                  when: ssh_ciphers_config_change.changed
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict SSH to strong ciphers: On hosts running OpenSSH 6.x, change the value to `aes256-ctr,aes192-ctr,aes128-ctr`, because the chacha20 and GCM ciphers are not supported there.

            ```ruby
            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            sshd_include = ::File.exist?('/etc/ssh/sshd_config') &&
                           ::File.read('/etc/ssh/sshd_config').match?(%r{^\s*Include\s+/etc/ssh/sshd_config\.d/})
            sshd_config = sshd_include ? '/etc/ssh/sshd_config.d/00-hardening.conf' : '/etc/ssh/sshd_config'
            ssh_service = platform_family?('debian') ? 'ssh' : 'sshd'

            directory '/etc/ssh/sshd_config.d' do
              owner 'root'
              group 'root'
              mode '0755'
              only_if { sshd_include }
            end

            file sshd_config do
              owner 'root'
              group 'root'
              mode '0600'
              action :create_if_missing
            end

            service ssh_service do
              action :nothing
            end

            { 'Ciphers' => 'chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' }.each do |keyword, value|
              ruby_block "set #{keyword} in sshd_config" do
                block do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  body = if body.match?(/^\s*#{keyword}\b/i)
                           body.gsub(/^\s*#{keyword}\b.*$/i, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(sshd_config, body)
                end
                not_if { ::File.read(sshd_config).match?(/^\s*#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, "service[#{ssh_service}]", :delayed
              end
            end
            ```
