    docs:
      desc: |
        This check verifies that audit watch rules with the `wa` permission mask and a non-empty key cover `/etc/passwd`, `/etc/shadow`, `/etc/group`, `/etc/gshadow`, and `/etc/security/opasswd`.

        **Why this matters**

        These five files are the account database. Any change to who exists on this host, what privileges they hold, or what credential authenticates them passes through one of them.

        The events worth catching are the ones that establish or extend access: a new account appearing in `/etc/passwd`, an account's UID changed to `0`, a service account's shell changed from `nologin` to a real one, an account added to `sudo` or `docker` in `/etc/group`, or a password hash replaced in `/etc/shadow`. Each of these is a small edit that grants durable access, and none of them produces any other signal on the system.

        `/etc/security/opasswd` stores previous password hashes for the PAM history module. It belongs in the same set both because it holds credential material and because clearing it is how someone circumvents a policy that forbids password reuse.

        Watch rules record the process, the account behind it, and the time, which is what distinguishes a change made by an administrator running `useradd` from the same change written directly into the file by a compromised service.

        Note that these rules record that a change occurred, not what it contained. Pair them with configuration management or file integrity monitoring to capture the content of the change.
      audit: |
        Run this command to confirm the audit rules for user and group information changes are loaded:

        ```bash
        auditctl -l | grep -E -- '/(group|passwd|gshadow|shadow|opasswd)'
        ```

        A passing result lists the expected audit rules with `wa` permissions and any non-empty key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-identity.rules`

            2. Add the following lines to the configuration file:

                ```text
                -w /etc/group -p wa -k identity
                -w /etc/passwd -p wa -k identity
                -w /etc/gshadow -p wa -k identity
                -w /etc/shadow -p wa -k identity
                -w /etc/security/opasswd -p wa -k identity
                ```

            3. To load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            4. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure events that modify user/group information are audited.

            ```bash
            #!/bin/bash
            set -e

            RULES_FILE="/etc/audit/rules.d/50-identity.rules"

            echo "Ensuring audit rules for user/group information changes are configured in $RULES_FILE"
            cat > "$RULES_FILE" <<EOF
            -w /etc/group -p wa -k identity
            -w /etc/passwd -p wa -k identity
            -w /etc/gshadow -p wa -k identity
            -w /etc/shadow -p wa -k identity
            -w /etc/security/opasswd -p wa -k identity
            EOF

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for user and group information changes:

            ```yaml
