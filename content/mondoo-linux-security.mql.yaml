      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      sshd.config.params["HostbasedAuthentication"] == "no"
    docs:
      desc: |
        This check verifies that the SSH server does not accept host-based authentication.

        The check reads `HostbasedAuthentication` in `/etc/ssh/sshd_config`, which must be `no`. The directive must be present in the file; an absent `HostbasedAuthentication` fails this check even though `no` is the OpenSSH default.

        **Why this matters**

        Host-based authentication moves the trust decision from the user to the machine. The client host proves its identity with its own host key, and the server then accepts whatever username that host asserts, without the user presenting any credential of their own.

        This makes every trusted client host a single point of failure for the servers that trust it. An attacker who obtains root on one such client can authenticate to every trusting server as any user listed for it, and there is no second factor, password, or per-user key anywhere in that path to stop them. What was a compromise of one machine becomes access across a group of them.

        The credential involved is also long-lived and rarely rotated. Host keys are generated once at install and typically stay in place for the life of the machine, so an attacker who reads one from a client's `/etc/ssh` retains that access indefinitely.

        Where automation needs to move between hosts without interactive authentication, use per-account keys with `command=` and source restrictions in `authorized_keys`. That keeps the credential scoped to one task and revocable on its own.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*HostbasedAuthentication\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows `HostbasedAuthentication no`. A failing result shows `HostbasedAuthentication yes`, or no output at all, which means the directive is absent.

        Do not verify this check with `sshd -T`. That command prints the effective configuration including OpenSSH's built-in defaults, so on a host where the directive is absent it reports `hostbasedauthentication no` while this check reads the configuration file and fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works.

            To disable SSH HostbasedAuthentication, edit the `/etc/ssh/sshd_config` file and add or modify the following line:

            ```bash
            HostbasedAuthentication no
            ```

            The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads `/etc/ssh/sshd_config.d/` first, in lexical order. Red Hat Enterprise Linux and Ubuntu ship their own snippets in that directory, so a value added to `/etc/ssh/sshd_config` has no effect once one of those snippets sets the same keyword. Check the directory, and where it is in use put the value in a drop-in numbered below the vendor snippets:

            ```bash
            grep -ri 'HostbasedAuthentication' /etc/ssh/sshd_config.d/
            touch /etc/ssh/sshd_config.d/00-hardening.conf
            chmod 600 /etc/ssh/sshd_config.d/00-hardening.conf
            echo 'HostbasedAuthentication no' >> /etc/ssh/sshd_config.d/00-hardening.conf
            ```

            Validate the configuration before restarting:

            ```bash
            sshd -t
            ```

            Restart the SSH service to apply the changes:

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To disable SSH HostbasedAuthentication, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            if grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
              SSHD_CONFIG=/etc/ssh/sshd_config.d/00-hardening.conf
              mkdir -p /etc/ssh/sshd_config.d
              touch "$SSHD_CONFIG"
              chmod 600 "$SSHD_CONFIG"
            else
              SSHD_CONFIG=/etc/ssh/sshd_config
            fi

            if grep -q '^HostbasedAuthentication' "$SSHD_CONFIG"; then
              echo "Updating HostbasedAuthentication to no in $SSHD_CONFIG..."
              sed -i 's/^HostbasedAuthentication.*/HostbasedAuthentication no/' "$SSHD_CONFIG"
