            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling HTTP server services..."
            for unit in httpd.service apache2.service nginx.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `httpd`, `apache2`, and `nginx`:

            ```yaml
            ---
            - name: Stop and disable HTTP server services
              hosts: all
              become: true

              tasks:
                - name: Ensure HTTP server services are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - httpd
                    - apache2
                    - nginx
                  register: http_units
                  failed_when:
                    - http_units.failed
                    - "'Could not find the requested service' not in (http_units.msg | default(''))"
