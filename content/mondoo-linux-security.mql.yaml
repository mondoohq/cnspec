    docs:
      desc: |
        This check verifies that the SSH server refuses accounts that have no password set.

        The check reads `PermitEmptyPasswords` in `/etc/ssh/sshd_config`, which must be `no`. The directive must be present in the file; an absent `PermitEmptyPasswords` fails this check even though `no` is the OpenSSH default.

        **Why this matters**

        An account with an empty password field authenticates to anyone who supplies an empty password. If `PermitEmptyPasswords` is `yes`, that works over the network, and the account is open to the internet with no secret at all.

        Accounts end up in this state through ordinary operations rather than malice. Automated provisioning that creates an account before setting its password, a `passwd -d` run during troubleshooting, a restored backup of `/etc/shadow` from before a password was set, or an application package that adds a service account without a credential all produce the same result. The window between account creation and password assignment becomes a window of unauthenticated access.

        The setting is a backstop for exactly that class of mistake. It ensures that an account which temporarily has no password cannot be used remotely, so the error stays a local misconfiguration rather than becoming remote access.

        Set it explicitly. Relying on the default means the protection depends on nothing else in the file having changed it, which a `Match` block elsewhere in the configuration can do.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*PermitEmptyPasswords\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows `PermitEmptyPasswords no`. A failing result shows `PermitEmptyPasswords yes`, or no output at all, which means the directive is absent.

        Do not verify this check with `sshd -T`. That command prints the effective configuration including OpenSSH's built-in defaults, so on a host where the directive is absent it reports `permitemptypasswords no` while this check reads the configuration file and fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works.

            To disable SSH PermitEmptyPasswords, edit the `/etc/ssh/sshd_config` file and add or modify the following line:

            ```bash
