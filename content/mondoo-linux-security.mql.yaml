      desc: |
        This check verifies that the SSH server does not allow the root account to log in with a password.

        The check reads `PermitRootLogin` in `/etc/ssh/sshd_config`, which must be `no`, `prohibit-password`, or the older synonym `without-password`. The directive must be present in the file; an absent `PermitRootLogin` fails this check even though `prohibit-password` is the OpenSSH default on current versions.

        **Why this matters**

        `root` exists on every Linux host, so it is the one account name an attacker never has to discover. Password-guessing traffic against SSH is overwhelmingly aimed at it, and a single correct guess yields full control with no further escalation required.

        Accountability is the other half. When administrators log in as themselves and escalate with `sudo`, the logs record which person ran which privileged command. When they log in as `root` directly, every action is attributed to `root`, and an investigation cannot tell one administrator from another, or from an intruder using the same credential.

        `prohibit-password` is the middle setting and is usually the right one for servers: it permits key-based root login for automation that genuinely needs it while removing the guessable password path entirely. `no` is stronger and appropriate wherever no automation depends on direct root access.

        Before applying `no`, confirm that an alternative administrative account exists, that it can reach the host, and that it can escalate. Locking out root without a verified path back in is a common way to lose access to a system.
