  - uid: mondoo-linux-security-ip-forwarding-is-disabled
    title: Ensure IP forwarding is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.ip_forward'] == 0
        || kernel.parameters['net.ipv4.ip_forward'] == null
      kernel.parameters['net.ipv6.conf.all.forwarding'] == 0
        || kernel.parameters['net.ipv6.conf.all.forwarding'] == null
    docs:
      desc: |
        This check verifies that the host does not route traffic between its network interfaces.

        IP forwarding is what turns a host into a router: a packet arriving on one interface that is addressed elsewhere gets passed along rather than dropped. The check reads the kernel parameters `net.ipv4.ip_forward` and `net.ipv6.conf.all.forwarding`, each of which must be `0` or unset.

        **Why this matters**

        A host with forwarding enabled is a router whether or not anyone intended it to be, and that changes what the machine means to the network around it.

        The clearest case is a dual-homed host. A machine with one interface in a DMZ and another on an internal network is exactly what network segmentation is designed to prevent, and enabling forwarding on it quietly reconnects the two. An attacker who reaches the host from the less trusted side can route traffic through it into the more trusted side without exploiting anything further, because the routing is a feature that is already switched on.

        Forwarding also changes how the kernel applies other protections. Several of the redirect and source-routing behaviors this policy checks are relaxed once the kernel considers itself a router, so enabling forwarding silently weakens neighboring controls.

        Docker requires IP forwarding to publish container ports, and Kubernetes nodes, VPN gateways, and NAT hosts all need it too. Where the host genuinely routes traffic, set an exception for this check rather than disabling forwarding and breaking the workload.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv4.ip_forward
        sysctl net.ipv6.conf.all.forwarding
        ```

        A passing result shows every listed parameter set to `0` (or unset). A failing result shows any parameter set to `1`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            **Caveat: do not disable forwarding on hosts that route traffic.** Routers, NAT gateways, VPN concentrators, Docker hosts that publish container ports, and Kubernetes nodes (where kube-proxy and the CNI require `ip_forward=1`) all need IP forwarding. Disabling it there breaks connectivity, so set a documented exception for this check on those hosts rather than applying the change.

            1. Set the following parameter in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv4.ip_forward = 0
                net.ipv6.conf.all.forwarding = 0
                ```

            2. Run these commands to set the active kernel parameters:

                ```bash
                sysctl -w net.ipv4.ip_forward=0
                sysctl -w net.ipv4.route.flush=1

                sysctl -w net.ipv6.conf.all.forwarding=0
                sysctl -w net.ipv6.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to disable IP forwarding.

            ```bash
            #!/bin/bash
            set -e

            # Set net.ipv4.ip_forward
            if grep -q '^net.ipv4.ip_forward' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.ip_forward to 0 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.ip_forward.*/net.ipv4.ip_forward = 0/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.ip_forward to 0 in /etc/sysctl.d/99-disable-ip-forwarding.conf"
              echo "net.ipv4.ip_forward = 0" >> /etc/sysctl.d/99-disable-ip-forwarding.conf
            fi

            # Set net.ipv6.conf.all.forwarding
            if grep -q '^net.ipv6.conf.all.forwarding' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv6.conf.all.forwarding to 0 in /etc/sysctl.conf"
              sed -i 's/^net.ipv6.conf.all.forwarding.*/net.ipv6.conf.all.forwarding = 0/' /etc/sysctl.conf
            else
              echo "Setting net.ipv6.conf.all.forwarding to 0 in /etc/sysctl.d/99-disable-ip-forwarding.conf"
              echo "net.ipv6.conf.all.forwarding = 0" >> /etc/sysctl.d/99-disable-ip-forwarding.conf
            fi

            sysctl -w net.ipv4.ip_forward=0
            sysctl -w net.ipv4.route.flush=1

            sysctl -w net.ipv6.conf.all.forwarding=0
            sysctl -w net.ipv6.route.flush=1
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the kernel parameters:

            ```yaml
            ---
            - name: Disable IPv4 and IPv6 forwarding
              hosts: all
              become: true

              tasks:
                - name: Ensure IPv4 and IPv6 forwarding is disabled in sysctl configuration
                  ansible.builtin.sysctl:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                    sysctl_file: /etc/sysctl.d/99-disable-ip-forwarding.conf
                    state: present
                    sysctl_set: true
                    reload: yes
                  loop:
                    - { name: 'net.ipv4.ip_forward', value: '0' }
                    - { name: 'net.ipv6.conf.all.forwarding', value: '0' }
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to disable IP forwarding. Skip this on hosts that route traffic, such as routers, VPN gateways, and container hosts:

            ```ruby
            sysctl 'net.ipv4.ip_forward' do
              value 0
            end

            sysctl 'net.ipv6.conf.all.forwarding' do
              value 0
            end
            ```
    refs:
      - url: https://www.kernel.org/doc/html/latest/admin-guide/sysctl/
        title: Linux Kernel sysctl Documentation
  - uid: mondoo-linux-security-packet-redirect-sending-is-disabled
    title: Ensure packet redirect sending is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters['net.ipv4.conf.all.send_redirects'] == 0
        || kernel.parameters['net.ipv4.conf.all.send_redirects'] == null
      kernel.parameters['net.ipv4.conf.default.send_redirects'] == 0
        || kernel.parameters['net.ipv4.conf.default.send_redirects'] == null
    docs:
      desc: |
        This check verifies that the host does not send ICMP redirect messages.

        Sending a redirect tells another host on the network that a better next hop exists for a destination, which is a router's job and something a host that is not routing has no reason to do. The check reads the kernel parameters `net.ipv4.conf.all.send_redirects` and `net.ipv4.conf.default.send_redirects`, each of which must be `0` or unset.

        **Why this matters**

        A redirect message rewrites the routing table of whatever host receives it. When a machine that is not a router emits them, it is issuing routing instructions it has no authority to issue, and the hosts that accept them will follow.

        That gives an attacker who compromises this host a way to reach further without touching anything else. From a single foothold they can steer traffic on the local segment toward a system they control, and the redirect is accepted as an ordinary protocol message rather than an intrusion.

        The same behavior causes damage without an attacker. A host with an incomplete or stale routing table that emits redirects will propagate its own confusion to its neighbors, producing intermittent connectivity failures that appear to originate on the machines receiving the redirects rather than the one sending them.

        Only hosts deliberately configured as routers should send redirects, and even there the behavior is usually better replaced by correct routing configuration on the clients. On everything else, leave it off.
      audit: |
        Run these commands to read the active kernel parameters:

        ```bash
        sysctl net.ipv4.conf.all.send_redirects
        sysctl net.ipv4.conf.default.send_redirects
        ```

        A passing result shows every listed parameter set to `0` (or unset). A failing result shows any parameter set to `1`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            1. Set the following parameters in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file:

                ```ini
                net.ipv4.conf.all.send_redirects = 0
                net.ipv4.conf.default.send_redirects = 0
                ```

            2. Run these commands to set the active kernel parameters:

                ```bash
                sysctl -w net.ipv4.conf.all.send_redirects=0
                sysctl -w net.ipv4.conf.default.send_redirects=0
                sysctl -w net.ipv4.route.flush=1
                sysctl --system
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to disable packet redirect sending.

            ```bash
            #!/bin/bash
            set -e

            # Set net.ipv4.conf.all.send_redirects
            if grep -q '^net.ipv4.conf.all.send_redirects' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.conf.all.send_redirects to 0 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.conf.all.send_redirects.*/net.ipv4.conf.all.send_redirects = 0/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.conf.all.send_redirects to 0 in /etc/sysctl.d/99-disable-packet-redirect.conf"
              echo "net.ipv4.conf.all.send_redirects = 0" >> /etc/sysctl.d/99-disable-packet-redirect.conf
            fi

            # Set net.ipv4.conf.default.send_redirects
            if grep -q '^net.ipv4.conf.default.send_redirects' /etc/sysctl.conf 2>/dev/null; then
              echo "Setting net.ipv4.conf.default.send_redirects to 0 in /etc/sysctl.conf"
              sed -i 's/^net.ipv4.conf.default.send_redirects.*/net.ipv4.conf.default.send_redirects = 0/' /etc/sysctl.conf
            else
              echo "Setting net.ipv4.conf.default.send_redirects to 0 in /etc/sysctl.d/99-disable-packet-redirect.conf"
              echo "net.ipv4.conf.default.send_redirects = 0" >> /etc/sysctl.d/99-disable-packet-redirect.conf
            fi

            sysctl -w net.ipv4.conf.all.send_redirects=0
            sysctl -w net.ipv4.conf.default.send_redirects=0
            sysctl -w net.ipv4.route.flush=1
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the kernel parameters:

            ```yaml
            ---
            - name: Disable packet redirect sending
              hosts: all
              become: true

              tasks:
                - name: Ensure packet redirect sending is disabled in sysctl configuration
                  ansible.builtin.sysctl:
                    name: "{{ item.name }}"
                    value: "{{ item.value }}"
                    sysctl_file: /etc/sysctl.d/99-disable-packet-redirect.conf
                    state: present
                    sysctl_set: true
                    reload: yes
                  loop:
                    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
                    - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop the host from sending ICMP redirects:

            ```ruby
            sysctl 'net.ipv4.conf.all.send_redirects' do
              value 0
            end

            sysctl 'net.ipv4.conf.default.send_redirects' do
              value 0
            end
            ```
