  - uid: mondoo-linux-security-imap-and-pop3-server-is-not-enabled
    title: Ensure IMAP and POP3 servers are stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("dovecot").enabled == false
      service("dovecot").running == false
      service("cyrus-imapd").enabled == false
      service("cyrus-imapd").running == false
    docs:
      desc: |
        This check verifies that the `dovecot` and `cyrus-imapd` services are neither running nor enabled at boot.

        **Why this matters**

        IMAP and POP3 servers on Linux normally authenticate through PAM against the system's own accounts. That makes an unintended mail service a second front door to the host, using the same usernames and passwords as SSH.

        This matters most on hosts that have been hardened everywhere else. A machine configured for key-only SSH, with `PermitRootLogin no` and `MaxAuthTries` lowered, still accepts unlimited password attempts on port 143 if `dovecot` is listening. The controls placed on the intended login path do not apply to one nobody knew was there.

        Both daemons also parse attacker-supplied input before authentication completes, in protocol handlers that accept commands from any client that can open the connection. That is a pre-authentication attack surface on a host that has no reason to run one.

        Where the host is a mail server, that is a deliberate role. Require TLS, disable plaintext authentication, and apply the same rate limiting and account restrictions used on other authentication paths. Everywhere else, stop and disable the daemons.
      audit: |
        Run this command to confirm the IMAP and POP3 server service is stopped and disabled:

        ```bash
        systemctl is-active dovecot cyrus-imapd
        systemctl is-enabled dovecot cyrus-imapd
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run this command to stop and disable `dovecot` and `cyrus-imapd`:

            ```bash
            systemctl stop dovecot cyrus-imapd
            systemctl disable dovecot cyrus-imapd
            ```

            Typically only one of these alternative units is installed. A unit that is not installed reports an error that can be ignored; the commands still apply to the units that exist.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable IMAP and POP3 server services.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling IMAP and POP3 server services..."
            for unit in dovecot.service cyrus-imapd.service; do
              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `dovecot` and `cyrus-imapd`:

            ```yaml
            ---
            - name: Stop and disable IMAP and POP3 server services
              hosts: all
              become: true

              tasks:
                - name: Ensure IMAP and POP3 server services are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - dovecot
                    - cyrus-imapd
                  register: mail_units
                  failed_when:
                    - mail_units.failed
                    - "'Could not find the requested service' not in (mail_units.msg | default(''))"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the IMAP and POP3 server units:

            ```ruby
            %w(dovecot.service cyrus-imapd.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
