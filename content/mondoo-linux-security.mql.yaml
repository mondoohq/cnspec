  - uid: mondoo-linux-security-prelink-is-disabled
    title: Ensure prelink is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      package("prelink").installed == false
    docs:
      desc: |
        This check verifies that the `prelink` package is not installed. Prelink rewrites ELF binaries on disk to precompute the addresses of shared library symbols, saving dynamic linker work at process start.

        **Why this matters**

        Prelink defeats two controls this policy depends on.

        It assigns each library a fixed load address and bakes that address into every binary that links against it. That is the opposite of what ASLR provides, and it hands an attacker exactly the predictable layout that randomization exists to deny them.

        It also rewrites binaries in place, which changes their checksums. A file integrity baseline taken before a prelink run reports every rewritten binary as modified afterward, and the usual response is to re-baseline. An attacker who tampers with a binary between that re-baseline and the next scan is indistinguishable from prelink's own churn.

        The performance benefit prelink was written for has largely evaporated. Modern dynamic linkers resolve symbols fast enough that the tradeoff no longer favors it, and the tool has been retired from current Red Hat and Debian releases.

        Removing the package is not sufficient on a host where prelink has already run. Undo the existing modifications with `prelink -ua` before uninstalling, so binaries are restored to their original form and the integrity baseline reflects vendor-shipped content.
      audit: |
        Run this command to confirm the prelink package is not installed:

        ```bash
        rpm -q prelink || dpkg -s prelink
        ```

        A passing result reports that the prelink package is not installed. A failing result reports an installed prelink package.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to restore binaries to their original state before removing the package. Prelinked binaries remain modified on disk after the package is removed, which keeps corrupting AIDE baselines and weakening ASLR:

            ```bash
            prelink -ua
            ```

            Then remove the prelink package:

            ### RHEL/Fedora/Amazon Linux and derivatives

            ```bash
            yum remove prelink
            ```

            ### Debian/Ubuntu and derivatives

            ```bash
            apt-get purge prelink
            ```

            ### SLES and openSUSE

            ```bash
            zypper remove prelink
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to remove the prelink package. It will auto-detect the package manager and remove prelink if installed.

            ```bash
            #!/bin/bash
            set -e

            if command -v prelink >/dev/null 2>&1; then
              echo "Restoring prelinked binaries to their original state..."
              prelink -ua
            fi

            if command -v yum >/dev/null 2>&1; then
              echo "Detected yum-based system. Removing prelink..."
              yum remove -y prelink
            elif command -v dnf >/dev/null 2>&1; then
              echo "Detected dnf-based system. Removing prelink..."
              dnf remove -y prelink
            elif command -v apt-get >/dev/null 2>&1; then
              echo "Detected apt-based system. Removing prelink..."
              apt-get purge -y prelink
            elif command -v zypper >/dev/null 2>&1; then
              echo "Detected zypper-based system. Removing prelink..."
              zypper remove -y prelink
            else
              echo "No supported package manager found. Please remove prelink manually."
              exit 1
            fi
            echo "Prelink removal complete."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to remove the prelink package:

            ```yaml
            ---
            - name: Remove prelink package
              hosts: all
              become: true

              tasks:
                - name: Check whether prelink is installed
                  ansible.builtin.stat:
                    path: /usr/sbin/prelink
                  register: prelink_bin

                - name: Restore prelinked binaries to their original state
                  ansible.builtin.command: prelink -ua
                  when: prelink_bin.stat.exists

                - name: Remove prelink on RHEL/Fedora/Amazon Linux
                  ansible.builtin.yum:
                    name: prelink
                    state: absent
                  when: ansible_os_family == "RedHat"

                - name: Remove prelink on Debian/Ubuntu
                  ansible.builtin.apt:
                    name: prelink
                    state: absent
                  when: ansible_os_family == "Debian"

                - name: Remove prelink on SLES/openSUSE
                  ansible.builtin.zypper:
                    name: prelink
                    state: absent
                  when: ansible_os_family == "Suse"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restore prelinked binaries and remove the prelink package:

            ```ruby
            execute 'restore prelinked binaries' do
              command 'prelink -ua'
              only_if { ::File.exist?('/usr/sbin/prelink') }
            end

            package 'prelink' do
              action :remove
            end
            ```
