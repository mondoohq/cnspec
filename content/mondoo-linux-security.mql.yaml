        - id: ansible
          desc: |
            **Using Ansible**

            To set the ownership and permissions on the `/etc/shadow` file, use the following Ansible playbook:

            ```yaml
            ---
            - name: Set ownership and permissions on /etc/shadow
              hosts: all
              become: true

              tasks:
