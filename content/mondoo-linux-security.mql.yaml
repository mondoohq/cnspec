        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-window-system-is-not-installed
    title: Ensure X Window System is not installed
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      packages.none(name == /^xserver-xorg.*/)
      packages.none(name == /^xorg-x11/ && name != /^xorg-x11-fonts/)
      packages.none(name == /^xserver/)
    docs:
      desc: |
        This check verifies that no X Window System server package is installed, matching package names beginning with `xserver-xorg`, `xserver`, or `xorg-x11`. Font packages are excluded.

        **Why this matters**

        An X server is a large, privileged, locally reachable program on a machine that has no display attached. On many distributions Xorg either runs setuid root or is launched through a helper that does, because it needs direct hardware access, and its command-line and configuration handling has produced local root escalations that require nothing more than the ability to run the binary.

        Installing the server also pulls in the rest of a desktop session: display managers, D-Bus session services, font and input daemons, and accessibility helpers. These run as ordinary services, are patched on a desktop cadence rather than a server one, and are rarely covered by the monitoring a server team has in place.

        None of this buys anything on a headless host. Administrators reach the machine over SSH, and applications draw no windows.

        Where administrators need a graphical application on a remote server, forward it over SSH from a workstation that already runs X, or use a dedicated jump host, rather than installing a display server on the server itself.
      audit: |
        Run this command to list any installed X Window System packages:

        ```bash
        rpm -qa | grep -E '^xorg-x11' || dpkg -l | grep -E 'xserver-xorg|xserver'
        ```

        A passing result returns no X server packages. A failing result lists one or more installed `xorg-x11` or `xserver` packages.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to remove the X Windows System packages:

            ### RHEL/Fedora/Amazon Linux and derivatives

            ```bash
            yum remove xorg-x11*
            ```

            ### Debian/Ubuntu and derivatives

            Purge every package whose name starts with `xserver`, because removing only `xserver-xorg` and `xserver-common` leaves dependencies such as `xserver-xorg-core` and the video and input driver packages installed:

            ```bash
            apt-get purge '^xserver'
            ```

            ### SLES and openSUSE

            ```bash
            zypper remove xorg-x11-server
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to remove the X Window System packages. It will auto-detect the package manager and remove relevant X packages if installed.

            ```bash
            #!/bin/bash
            set -e

            if command -v yum >/dev/null 2>&1; then
              echo "Detected yum-based system. Removing X Window System packages..."
              yum remove -y xorg-x11*
            elif command -v dnf >/dev/null 2>&1; then
              echo "Detected dnf-based system. Removing X Window System packages..."
              dnf remove -y xorg-x11*
            elif command -v apt-get >/dev/null 2>&1; then
              echo "Detected apt-based system. Removing X Window System packages..."
              apt-get purge -y '^xserver'
            elif command -v zypper >/dev/null 2>&1; then
              echo "Detected zypper-based system. Removing X Window System packages..."
              zypper remove -y xorg-x11-server
            else
              echo "No supported package manager found. Please remove X Window System packages manually."
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to remove the X Windows System packages. The `xserver*` pattern relies on the fnmatch wildcard support that the apt module documents for its `name` parameter:

            ```yaml
            ---
            - name: Remove X Window System packages
              hosts: all
              become: true

              tasks:
                - name: Remove X Window System packages on RHEL/Fedora/Amazon Linux
                  ansible.builtin.yum:
                    name: xorg-x11*
                    state: absent
                  when: ansible_os_family == "RedHat"

                - name: Remove X Window System packages on Debian/Ubuntu
                  ansible.builtin.apt:
                    name: xserver*
                    state: absent
                    purge: yes
                  when: ansible_os_family == "Debian"

                - name: Remove X Window System packages on SLES/openSUSE
                  ansible.builtin.zypper:
                    name: xorg-x11-server
                    state: absent
                  when: ansible_os_family == "Suse"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to remove the X Window System packages. Confirm that no application on the host needs a graphical display before you apply it:

            ```ruby
            xorg_packages = if platform_family?('debian')
                              %w(xserver-xorg-core xserver-common)
                            elsif platform_family?('suse')
                              %w(xorg-x11-server)
                            else
                              %w(xorg-x11-server-Xorg xorg-x11-server-common xorg-x11-server-utils)
                            end

            package xorg_packages do
              action :remove
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-avahi-server-is-not-enabled
    title: Ensure Avahi server is stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("avahi-daemon").enabled == false
      service("avahi-daemon").running == false
    docs:
      desc: |
        This check verifies that the `avahi-daemon` service is neither running nor enabled at boot. Avahi implements multicast DNS and DNS service discovery, listening on UDP port 5353.

        **Why this matters**

        Avahi's job is to announce the host to everything on the local segment. It publishes the hostname, the addresses of every interface, and the services the machine offers, unprompted and without authentication, to any device that can receive multicast on that network.

        On a cloud subnet or a shared VLAN, that is free reconnaissance for anyone who gets a foothold on a neighboring machine. They learn the internal naming scheme, which hosts exist, and what those hosts run, without sending a single probe that a network monitor would flag.

        The daemon is also a parser for untrusted multicast traffic that runs continuously and accepts input from anyone on the segment. Its record-handling code has produced remotely triggerable crashes, and a crash loop in a name resolution component takes local service discovery down with it.

        Avahi belongs on desktops and appliances that need to find printers and each other. Servers reach their dependencies through DNS and configuration, so leave it stopped and disabled.
      audit: |
        Run this command to confirm the Avahi service is stopped and disabled:

        ```bash
        systemctl is-active avahi-daemon
        systemctl is-enabled avahi-daemon
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run these commands to stop and disable the `avahi-daemon` service and its activation socket. The socket must be included because it restarts the daemon on the next mDNS request:

            ```bash
            systemctl stop avahi-daemon.socket avahi-daemon.service
            systemctl disable avahi-daemon.socket avahi-daemon.service
            ```

            Note: Since the `avahi-daemon` service is often interdependent with other services, it might not be enough to disable the service because other services will likely restart the service automatically.

            To make the service `avahi-daemon` invisible to other services run this command:

            ```bash
            systemctl mask avahi-daemon.socket avahi-daemon.service
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the Avahi daemon.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping, disabling, and masking Avahi daemon..."
            systemctl stop avahi-daemon.socket avahi-daemon.service
            systemctl disable avahi-daemon.socket avahi-daemon.service
            systemctl mask avahi-daemon.socket avahi-daemon.service
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `avahi-daemon`:

            ```yaml
            ---
            - name: Stop and disable Avahi daemon
              hosts: all
              become: true

              tasks:
                - name: Ensure the Avahi daemon and its activation socket are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                    masked: true
                  loop:
                    - avahi-daemon.socket
                    - avahi-daemon.service
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop, disable, and mask the Avahi daemon and its activation socket:

            ```ruby
            %w(avahi-daemon.socket avahi-daemon.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable mask)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
    refs:
      - url: https://www.freedesktop.org/wiki/Software/systemd/
        title: systemd System and Service Manager
  - uid: mondoo-linux-security-cups-is-not-enabled
    title: Ensure CUPS is stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("cups").enabled == false
      service("cups").running == false
    docs:
      desc: |
        This check verifies that the `cups` service is neither running nor enabled at boot. CUPS is the Common Unix Printing System, and it provides both a printing daemon and a web administration interface on port 631.

        **Why this matters**

        CUPS is installed by default on many distributions, including on images used for servers that will never print anything. It then listens, and it is a considerably larger network service than its purpose suggests.

        The 2024 vulnerability chain in `cups-browsed` illustrates the exposure. That component accepted printer announcements from any host that could reach UDP port 631, with no authentication, and used them to construct a printer definition. When a print job was subsequently sent to the attacker-supplied printer, commands embedded in that definition ran on the host. The precondition was simply that CUPS was installed and listening, which on many systems nobody had chosen.

        The administration interface is the second half of the problem. It exposes configuration over HTTP and, where it has been bound beyond the loopback interface, gives anyone who reaches it a way to change how the printing system behaves.

        Stop and disable CUPS on any host that is not a print server. Where printing is required, bind the listener to the loopback interface and restrict the administration interface to trusted networks.
      audit: |
        Run this command to confirm the CUPS service is stopped and disabled:

        ```bash
        systemctl is-active cups
        systemctl is-enabled cups
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run these commands to stop and disable the `cups` service together with its activation socket and path units. The socket and path units must be included because they restart the service on the next print or socket event:

            ```bash
            systemctl stop cups.socket cups.path cups.service
            systemctl disable cups.socket cups.path cups.service
            ```

            Note: Since the `cups` service is often interdependent with other services, it might not be enough to disable the service because other services will likely restart the service automatically.

            To make the service `cups` invisible to other services run this command:

            ```bash
            systemctl mask cups.socket cups.path cups.service
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the CUPS service.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping, disabling, and masking CUPS service..."
            systemctl stop cups.socket cups.path cups.service
            systemctl disable cups.socket cups.path cups.service
            systemctl mask cups.socket cups.path cups.service
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `cups`:

            ```yaml
            ---
            - name: Stop and disable CUPS printing service
              hosts: all
              become: true

              tasks:
                - name: Ensure CUPS units are stopped and disabled
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                    masked: true
                  loop:
                    - cups.socket
                    - cups.path
                    - cups.service
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop, disable, and mask the CUPS printing units:

            ```ruby
            %w(cups.socket cups.path cups.service).each do |unit|
              systemd_unit unit do
                action %i(stop disable mask)
                only_if "systemctl cat #{unit}"
              end
            end
            ```
    refs:
      - url: https://www.freedesktop.org/wiki/Software/systemd/
        title: systemd System and Service Manager
  - uid: mondoo-linux-security-dhcp-server-is-not-enabled
    title: Ensure DHCP server is stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("dhcpd").enabled == false
      service("dhcpd").running == false
    docs:
      desc: |
        This check verifies that the `dhcpd` service is neither running nor enabled at boot.

        **Why this matters**

        A DHCP server tells clients which addresses to use, which gateway to route through, and which DNS servers to trust. Clients accept the first answer they receive, and there is no authentication anywhere in the exchange.

        An unintended DHCP server on a network segment is therefore a network takeover primitive. If it answers faster than the legitimate server, it decides where every newly booting machine on that segment sends its traffic. Pointing them at an attacker-controlled gateway puts that attacker in the middle of the connections, and pointing them at an attacker-controlled resolver lets them redirect any name to any address.

        This does not require malice to cause damage. A `dhcpd` left enabled from a test or from a package's default configuration will begin issuing addresses from whatever pool it was last configured with, colliding with the real server's leases and producing duplicate-address failures that are difficult to trace back to their source.

        Run `dhcpd` only on hosts whose role is to serve DHCP for a defined scope. On every other host, stop and disable it.
      audit: |
        Run this command to confirm the DHCP server service is stopped and disabled:

        ```bash
        systemctl is-active dhcpd
        systemctl is-enabled dhcpd
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Run this command to stop and disable `dhcpd`:

                ```bash
                systemctl stop dhcpd
                systemctl disable dhcpd
                ```

            2. To make the service `dhcpd` invisible to other services run this command:

                ```bash
                systemctl mask dhcpd
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the DHCP server.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping, disabling, and masking DHCP server..."
            systemctl stop dhcpd
            systemctl disable dhcpd
            systemctl mask dhcpd
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `dhcpd`:

            ```yaml
            ---
            - name: Stop and disable DHCP server service
              hosts: all
              become: true

              tasks:
                - name: Ensure DHCP server (dhcpd) is stopped and disabled
                  ansible.builtin.systemd:
                    name: dhcpd
                    state: stopped
                    enabled: no
                    masked: true
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop, disable, and mask the DHCP server:

            ```ruby
            systemd_unit 'dhcpd.service' do
              action %i(stop disable mask)
              only_if 'systemctl cat dhcpd.service'
            end
            ```
    refs:
      - url: https://www.freedesktop.org/wiki/Software/systemd/
        title: systemd System and Service Manager
  - uid: mondoo-linux-security-ldap-server-is-not-enabled
    title: Ensure LDAP server is stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      service("slapd").enabled == false
      service("slapd").running == false
    docs:
      desc: |
        This check verifies that the `slapd` service is neither running nor enabled at boot. OpenLDAP's `slapd` serves directory data on ports 389 and 636.

        **Why this matters**

        A directory server holds the organization's identity data: every account, every group membership, the organizational structure, contact details, and depending on the schema in use, password hashes in `userPassword` attributes.

        The default access configuration in many deployments permits anonymous binds for read. Anyone who can reach port 389 can then enumerate the entire tree without credentials. That gives an attacker a complete, authoritative list of accounts to target and a map of which of them hold privileged group memberships, which is the reconnaissance step that makes a password-spraying campaign efficient instead of noisy.

        An unintended `slapd` is worse than an intended one, because the intended one has an access control policy that someone reviewed. A `slapd` running because a package pulled it in has whatever the default configuration provides.

        Run `slapd` only on designated directory servers. On those, require TLS, disable anonymous binds, and restrict access to the attributes each client genuinely needs.
      audit: |
        Run this command to confirm the LDAP server service is stopped and disabled:

        ```bash
        systemctl is-active slapd
        systemctl is-enabled slapd
        ```

        A passing result reports `inactive` and `disabled` (or `masked`) for every listed unit. A failing result reports any unit as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run these commands to stop and disable `slapd`. Masking the unit prevents another service or dependency from restarting it:

            ```bash
            systemctl stop slapd
            systemctl disable slapd
            systemctl mask slapd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop, disable, and mask the LDAP server. Masking prevents another service or dependency from restarting it.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping, disabling, and masking the slapd service..."
            systemctl stop slapd
            systemctl disable slapd
            systemctl mask slapd
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `slapd`:

            ```yaml
            ---
            - name: Stop and disable LDAP server (slapd)
              hosts: all
              become: true

              tasks:
                - name: Ensure LDAP server (slapd) is stopped, disabled, and masked
                  ansible.builtin.systemd:
                    name: slapd
                    state: stopped
                    enabled: no
                    masked: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop, disable, and mask the LDAP server:

            ```ruby
            systemd_unit 'slapd.service' do
              action %i(stop disable mask)
              only_if 'systemctl cat slapd.service'
            end
            ```
    refs:
      - url: https://www.freedesktop.org/wiki/Software/systemd/
        title: systemd System and Service Manager
  - uid: mondoo-linux-security-nfs-and-rpc-are-not-enabled
    title: Ensure NFS and RPC are stopped and not enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
