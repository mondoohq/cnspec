        title: Linux Audit System
  - uid: mondoo-linux-security-changes-to-system-administration-scope-sudoers-is-collected
    title: Ensure changes to system administration scope (sudoers) is audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      paths = ["/etc/sudoers", "/etc/sudoers.d"]
      paths.all(p:
        auditd.rules.files.contains( f:
          f.path == p && f.permissions == "wa"
          && f.keyname != empty
        )
      )
    docs:
      desc: |
        This check verifies that audit watch rules with the `wa` permission mask and a non-empty key cover both `/etc/sudoers` and the `/etc/sudoers.d` directory, so that writes and attribute changes to either are recorded.

        **Why this matters**

        These files define who may run commands as root and which commands they may run. They are the authoritative statement of administrative privilege on the host, and a change to them is a change to who controls the machine.

        An attacker who has obtained root once uses them to keep that access. Adding a line such as `attacker ALL=(ALL) NOPASSWD: ALL`, or dropping a small file into `/etc/sudoers.d`, converts a temporary compromise into standing privilege that survives reboots, password changes, and the revocation of whatever they originally exploited. It also looks entirely ordinary afterward, since the account then escalates through the same mechanism every administrator uses.

        `/etc/sudoers.d` needs its own watch. Configuration management, packages, and administrators all add files there, and a directory-level watch is what catches a new file appearing rather than only changes to the main file.

        The `wa` mask covers writes and attribute changes. Read access is deliberately not audited, because the file is read on every `sudo` invocation and watching reads would bury the writes that matter. The key is what makes the events retrievable later with `ausearch -k`.
      audit: |
        Run this command to confirm the audit rules for changes to the sudoers configuration are loaded:

        ```bash
        auditctl -l | grep -E -- '-w /etc/sudoers(\.d)? '
        ```

        A passing result lists both watch rules with `wa` permissions and a non-empty audit key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

            Example: `vi /etc/audit/rules.d/50-scope.rules`

            Add the following lines:

            ```text
            -w /etc/sudoers -p wa -k scope
            -w /etc/sudoers.d -p wa -k scope
            ```

            To load the newly added rules into the running configuration:

            ```bash
            augenrules --load
            ```

            This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            Check if a reboot is required, in case the running configuration is set to be immutable:

            ```bash
            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to ensure changes to the sudoers file and directory are audited.

            ```bash
            #!/bin/bash
            set -e

            RULES_FILE="/etc/audit/rules.d/50-scope.rules"

            if [ ! -f "$RULES_FILE" ]; then
              echo "Creating audit rules file: $RULES_FILE"
              touch "$RULES_FILE"
            fi

            echo "Ensuring audit rules for sudoers are configured"
            if ! grep -q '^-w /etc/sudoers -p wa -k scope' "$RULES_FILE"; then
              echo "-w /etc/sudoers -p wa -k scope" >> "$RULES_FILE"
            fi
            if ! grep -q '^-w /etc/sudoers.d -p wa -k scope' "$RULES_FILE"; then
              echo "-w /etc/sudoers.d -p wa -k scope" >> "$RULES_FILE"
            fi

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules because auditd is in immutable mode"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for sudoers:

            ```yaml
            ---
            - name: Ensure changes to system administration scope (sudoers) is audited
              hosts: all
              become: true

              tasks:
                - name: Ensure audit rules for sudoers are configured
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-scope.rules
                    block: |
                      -w /etc/sudoers -p wa -k scope
                      -w /etc/sudoers.d -p wa -k scope
                    marker: "# {mark} ANSIBLE MANAGED - sudoers scope audit rules"
                    create: yes
                    state: present
                  register: scope_rules_updated

                - name: Load audit rules if updated
                  ansible.builtin.command: augenrules --load
                  when: scope_rules_updated.changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Warn if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit changes to the sudoers configuration:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/50-scope.rules' do
              content <<~RULES
                -w /etc/sudoers -p wa -k scope
                -w /etc/sudoers.d -p wa -k scope
              RULES
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
