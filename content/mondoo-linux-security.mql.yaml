  - uid: mondoo-linux-security-file-deletion-events-by-users-are-collected
    title: Ensure file deletion events by users are audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      // Define syscalls based on architecture (ARM doesn't have unlink/rename)
      syscalls_base = ["unlinkat", "renameat"]
      syscalls_nonarm = ["unlink", "rename"]

      // Get audited syscall rules with proper auid filtering and a non-empty audit key
      deleteRules64 = auditd.rules.syscalls.where(
        arch == "b64"
        && auidMin == 1000
        && excludesUnsetAuid
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat

      deleteRules32 = auditd.rules.syscalls.where(
        arch == "b32"
        && auidMin == 1000
        && excludesUnsetAuid
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      ).map(syscalls).flat

      // Base syscalls must be present on all architectures
      deleteRules64.containsAll(syscalls_base) || deleteRules32.containsAll(syscalls_base)

      // Non-ARM syscalls must be present only on non-ARM architectures
      if (asset.arch != /arm|aarch/) {
        deleteRules64.containsAll(syscalls_nonarm) || deleteRules32.containsAll(syscalls_nonarm)
      }
    docs:
      desc: |
        This check verifies that the audit system records file deletions and renames performed by ordinary user accounts.

        It requires syscall rules with a non-empty key, filtered to `auid>=1000` and excluding the unset audit ID, covering `unlinkat` and `renameat` on the 32-bit and 64-bit ABI, and `unlink` and `rename` in addition on architectures that implement them. ARM kernels do not, so those two are not required there. Rules go in a file under `/etc/audit/rules.d/` and are loaded with `augenrules --load`. Where the site has changed `UID_MIN` in `/etc/login.defs`, replace `auid>=1000` with `auid>=<UID_MIN for your system>` so the filter still separates human accounts from service accounts.

        **Why this matters**

        Deleting is what an intruder does last. Having used an account to reach data, run a tool, or drop a payload, the tidy-up is removing the tool, removing the payload, and removing whatever the tool wrote. Each of those is an `unlink`, and without a rule there is no record that the file ever existed, so the investigation begins with a host that looks untouched.

        Renaming is the same act performed more quietly, and it is worth auditing for a second reason. Moving a file over another one is how a binary gets replaced or a configuration file swapped, because a rename onto an existing path is atomic and leaves no window in which the target is missing.

        Destruction is also the goal in its own right in ransomware and sabotage, where the record of which paths disappeared and under which login is what scopes the recovery.

        The `auid` filter is what keeps these rules usable. Service accounts churn through temporary files constantly, and auditing all of it would bury the events worth reading. Filtering on the audit ID keeps each record tied to the human who logged in, even after they have changed identity with `su` or `sudo`.
      audit: |
        Run this command to confirm the audit rules for file deletion events are loaded:

        ```bash
        auditctl -l | grep -E -- '(unlink|rename)'
        ```

        A passing result lists the expected audit rules with the appropriate syscalls, auid filters, and any non-empty key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-deletion.rules`

            2. Add the following lines to the configuration file:

                ** On non-ARM architectures:**

                ```text
                -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                ```

                ** On ARM architectures:**

                ```text
                -a always,exit -F arch=b64 -S unlinkat -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                -a always,exit -F arch=b32 -S unlinkat -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                ```

            3. Load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            4. Check if a reboot is required, in case the running configuration is set to be immutable:

              ```bash
              if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
              ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the audit rules for file deletion and renaming, you can use the following Bash script:

            ```bash
            #!/bin/bash
            set -e

            arch=$(uname -m)
            is_arm=false
            if [[ "$arch" == arm* || "$arch" == aarch* ]]; then
              is_arm=true
            fi

            echo "Configuring audit rules for file deletion and renaming..."

            if $is_arm; then
              cat > /etc/audit/rules.d/50-deletion.rules <<'EOF'
            -a always,exit -F arch=b64 -S unlinkat -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
            -a always,exit -F arch=b32 -S unlinkat -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
            EOF
            else
              cat > /etc/audit/rules.d/50-deletion.rules <<'EOF'
            -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
            -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
            EOF
            fi

            echo "Loading audit rules..."
            augenrules --load > /dev/null

            # Notify if a reboot is required due to immutable audit configuration
            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for file deletion and renaming:

            ```yaml
            ---
            - name: Configure audit rules for file deletion and renaming
              hosts: all
              become: true

              tasks:
                - name: Ensure file deletion and renaming audit rules are present (non-ARM)
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-deletion.rules
                    block: |
                      -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                      -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                    create: yes
                    owner: root
                    group: root
                    mode: '0640'
                  register: deletion_audit_rules_nonarm
                  when: ansible_architecture is not match('^(arm|aarch)')

                - name: Ensure file deletion and renaming audit rules are present (ARM)
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-deletion.rules
                    block: |
                      -a always,exit -F arch=b64 -S unlinkat -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                      -a always,exit -F arch=b32 -S unlinkat -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
                    create: yes
                    owner: root
                    group: root
                    mode: '0640'
                  register: deletion_audit_rules_arm
                  when: ansible_architecture is match('^(arm|aarch)')

                - name: Reload audit rules if file was updated
                  ansible.builtin.command: augenrules --load
                  when: (deletion_audit_rules_nonarm is defined and deletion_audit_rules_nonarm.changed) or
                        (deletion_audit_rules_arm is defined and deletion_audit_rules_arm.changed)

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Notify if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit file deletions and renames by unprivileged users. ARM kernels do not implement the `unlink` and `rename` syscalls, so those are only requested on other architectures:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            arm = node['kernel']['machine'].to_s.match?(/^(arm|aarch)/)
            syscalls = arm ? '-S unlinkat -S renameat' : '-S unlink -S unlinkat -S rename -S renameat'

            deletion_rules = %w(b64 b32).map do |arch|
              "-a always,exit -F arch=#{arch} #{syscalls} -F auid>=1000 -F auid!=4294967295 -k delete"
            end

            file '/etc/audit/rules.d/50-deletion.rules' do
              content "#{deletion_rules.join("\n")}\n"
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-kernel-module-loading-and-unloading-is-collected
    title: Ensure kernel module loading and unloading is audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      // Watch rules for module tools
      paths = ["/sbin/insmod", "/sbin/rmmod", "/sbin/modprobe"]
      paths.all(p:
        auditd.rules.files.contains( f:
          f.path == p && f.permissions == "x"
          && f.keyname != empty
        )
      )

      // Syscall rules for module loading
      auditd.rules.syscalls.contains(
        syscalls.containsAll(["init_module", "delete_module"])
        && arch == "b64"
        && action == "always"
        && fields.contains(key == "key" && value != empty)
      )
    docs:
      desc: |
        This check verifies that audit rules cover both paths by which kernel modules are managed: watch rules with the execute mask on `/sbin/insmod`, `/sbin/rmmod`, and `/sbin/modprobe`, and a syscall rule recording `init_module` and `delete_module`. All rules must carry a non-empty key.

        **Why this matters**

        A kernel module runs in kernel space with no restrictions. It can hide processes from `ps`, remove files from the output of `ls` while leaving them on disk, intercept system calls to conceal network connections, and modify the audit subsystem itself. This is what a rootkit is, and loading a module is how one is installed.

        The consequence is that the log entry recording the load may be the last trustworthy entry the system produces. Everything a userspace tool reports afterward passes through code the attacker now controls. That makes these records disproportionately valuable and makes forwarding them off the host immediately, rather than relying on the local copy, the difference between having the evidence and not.

        Both rule types are required because they catch different things. The watch rules record who executed the module tools, which gives the account and the command line. The syscall rules catch module loading performed directly through the kernel interface by a program that never invokes `modprobe`, which is what malware does.

        Expect legitimate records from driver installation, package updates, and hardware hotplug. The signal is a module load that does not correspond to any of those.
      audit: |
        Run this command to confirm the audit rules for kernel module loading and unloading are loaded:

        ```bash
        auditctl -l | grep -E -- '\-w /sbin/(insmod|rmmod|modprobe)|init_module|delete_module'
        ```

        A passing result lists the expected audit rules with the proper paths and permissions (any non-empty key is acceptable). A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

                Example: `vi /etc/audit/rules.d/50-modules.rules`

            2. Add the following lines to the configuration file. The `b32` syscall rule audits 32-bit module operations, `finit_module` covers the file-descriptor based loader that modern `modprobe` uses, and the `/sbin` watch paths are required by this check. On distributions where the module tools live under `/usr/sbin`, `/sbin` is normally a symlink to `/usr/sbin`, so the `/sbin` paths still match. Add equivalent `/usr/sbin` watch lines as well if your host does not provide that symlink:

                ```text
                -w /sbin/insmod -p x -k modules
                -w /sbin/rmmod -p x -k modules
                -w /sbin/modprobe -p x -k modules
                -a always,exit -F arch=b64 -S init_module -S finit_module -S delete_module -k modules
                -a always,exit -F arch=b32 -S init_module -S finit_module -S delete_module -k modules
                ```

            3. Load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

                This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            4. Check if a reboot is required, in case the running configuration is set to be immutable:

                ```bash
                if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the audit rules for kernel module loading and unloading, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting audit rules for kernel modules..."
            echo "-w /sbin/insmod -p x -k modules" > /etc/audit/rules.d/50-modules.rules
            echo "-w /sbin/rmmod -p x -k modules" >> /etc/audit/rules.d/50-modules.rules
            echo "-w /sbin/modprobe -p x -k modules" >> /etc/audit/rules.d/50-modules.rules
            echo "-a always,exit -F arch=b64 -S init_module -S finit_module -S delete_module -k modules" >> /etc/audit/rules.d/50-modules.rules
            echo "-a always,exit -F arch=b32 -S init_module -S finit_module -S delete_module -k modules" >> /etc/audit/rules.d/50-modules.rules

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for kernel module loading and unloading:

            ```yaml
            ---
            - name: Configure audit rules for kernel modules
              hosts: all
              become: true

              tasks:
                - name: Ensure audit rules for kernel modules are present
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-modules.rules
                    block: |
                      -w /sbin/insmod -p x -k modules
                      -w /sbin/rmmod -p x -k modules
                      -w /sbin/modprobe -p x -k modules
                      -a always,exit -F arch=b64 -S init_module -S finit_module -S delete_module -k modules
                      -a always,exit -F arch=b32 -S init_module -S finit_module -S delete_module -k modules
                    create: yes
                    owner: root
                    group: root
                    mode: '0640'
                  register: modules_audit_rules_updated
                - name: Reload audit rules if file was updated
                  ansible.builtin.command: augenrules --load
                  when: modules_audit_rules_updated.changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Notify if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit kernel module loading and unloading:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/50-modules.rules' do
              content <<~RULES
                -w /sbin/insmod -p x -k modules
                -w /sbin/rmmod -p x -k modules
                -w /sbin/modprobe -p x -k modules
                -a always,exit -F arch=b64 -S init_module -S finit_module -S delete_module -k modules
                -a always,exit -F arch=b32 -S init_module -S finit_module -S delete_module -k modules
              RULES
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-system-administrator-actions-sudolog-are-collected
    title: Ensure system administrator actions (sudolog) are audited
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      auditd.rules.files.contains( f:
        f.path == "/var/log/sudo.log" && f.permissions == "wa"
        && f.keyname != empty
      )
    docs:
      desc: |
        This check verifies that an audit watch rule with the `wa` permission mask and a non-empty key covers `/var/log/sudo.log`, the dedicated sudo log file configured by a companion check in this policy.

        **Why this matters**

        `/var/log/sudo.log` is the record of every privileged command run on the host: who ran it, from which session, and what the command line was. In an investigation it is usually the first file anyone opens, because it answers what was actually done with administrative access rather than merely that access was obtained.

        That makes it a target. An attacker who has used `sudo` to escalate has the privileges required to edit or truncate the file that recorded them doing it, and there is nothing inherent in the logging that would reveal the edit.

        The watch rule closes that. Writes and attribute changes to the file generate audit records held in a separate subsystem, so removing lines from `sudo.log` produces an entry in the audit log showing that the file was modified, along with the account responsible. The attacker must then compromise the audit trail as well, which the immutable-configuration check makes considerably harder.

        Note the asymmetry this creates deliberately: `sudo` writes to the file constantly during normal use, but those writes come from the `sudo` binary itself. A write from a text editor or a shell redirection is the anomaly worth alerting on.
      audit: |
        Run this command to confirm the audit rules for administrator actions recorded in the sudo log are loaded:

        ```bash
        auditctl -l | grep -- '/var/log/sudo.log'
        ```

        A passing result lists the audit rule for `/var/log/sudo.log` with write and append permissions (`-p wa`) and a non-empty audit key. A failing result returns no matching rules.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Prerequisite: make sudo write to `/var/log/sudo.log` first.** On mainstream distributions sudo logs to syslog or the journal by default, and `/var/log/sudo.log` does not exist. Without enabling the log file, this watch rule monitors a path that is never written, so the audit rule is meaningless. Run `visudo` and add the following line so sudo writes to the file the rule watches:

            ```text
            Defaults logfile=/var/log/sudo.log
            ```

            Then configure the audit watch. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`

            Example: `vi /etc/audit/rules.d/50-sudo.rules`

            Add the following line:

            ```text
            -w /var/log/sudo.log -p wa -k actions
            ```

            To load the newly added rules into the running configuration:

            ```bash
            augenrules --load
            ```

            This command will generate a new `/etc/audit/audit.rules` file containing the newly added rules.

            Check if a reboot is required, in case the running configuration is set to be immutable:

            ```bash
            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the audit rule for sudo actions, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting audit rule for sudo actions..."
            echo "-w /var/log/sudo.log -p wa -k actions" > /etc/audit/rules.d/50-sudo.rules

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit rules for sudo log monitoring:

            ```yaml
            ---
            - name: Configure audit rule for sudo actions
              hosts: all
              become: true

              tasks:
                - name: Ensure audit rule for /var/log/sudo.log is present
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-sudo.rules
                    block: |
                      -w /var/log/sudo.log -p wa -k actions
                    create: yes
                    owner: root
                    group: root
                    mode: '0640'
                  register: sudo_audit_rule_updated

                - name: Reload audit rules if updated
                  ansible.builtin.command: augenrules --load
                  when: sudo_audit_rule_updated.changed

                - name: Check if auditd is in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  failed_when: false
                  changed_when: false

                - name: Notify if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit writes to the sudo log:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/50-sudo.rules' do
              content <<~RULES
                -w /var/log/sudo.log -p wa -k actions
              RULES
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-the-audit-configuration-is-immutable
    title: Ensure the audit configuration is immutable
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      auditd.rules.controls.any(flag == "-e" && value == "2")
    docs:
      desc: |
        This check verifies that the audit rule set cannot be changed while the system is running.

        Immutable mode is what stops `auditctl` from adding, removing, or modifying rules until the next reboot. The check reads the audit rules for the `-e 2` control flag.

        **Why this matters**

        Audit rules are ordinarily loaded and modified at runtime with `auditctl`. Anyone with root can therefore run `auditctl -D` and delete every rule on the system in a single command, disabling all monitoring instantly and without a reboot.

        That command is a standard early step after a privilege escalation, precisely because it is quiet: the daemon keeps running, the service status stays healthy, the configuration files on disk are untouched, and nothing about the host looks different. Everything that follows goes unrecorded, and a later review of `/etc/audit/rules.d` finds the rules exactly as they were written.

        `-e 2` removes that option. Rules can no longer be added, removed, or modified while the system runs, so an attacker who wants to stop the auditing has to reboot the machine. A reboot is disruptive, visible in the audit log up to the moment it happens, and recorded by monitoring, which converts a silent action into an alertable one.

        The operational cost is that rule changes require a reboot to take effect. Place `-e 2` as the final line of the last rules file so that everything above it loads first, and validate rule changes on a non-production host.
      audit: |
        Run this command to confirm the audit configuration is locked:

        ```bash
        auditctl -s | grep -E '^enabled'
        ```

        A passing result reports `enabled 2`, indicating the configuration is immutable until reboot. A failing result reports `enabled 0` or `enabled 1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To ensure the audit configuration is immutable, follow these steps:

            1. Edit or create a file in the `/etc/audit/rules.d/` directory ending in `.rules`.

                Example:

                ```bash
                vi /etc/audit/rules.d/50-immutable.rules
                ```

            2. Add the following line to the file:

                ```text
                -e 2
                ```

            3. Load the newly added rules into the running configuration:

                ```bash
                augenrules --load
                ```

            4. Check if a reboot is required, in case the running configuration is set to be immutable:

              ```bash
              if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
              ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the audit configuration to immutable mode, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting audit configuration to immutable mode..."
            echo "-e 2" > /etc/audit/rules.d/50-immutable.rules

            echo "Loading audit rules"
            augenrules --load > /dev/null

            if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then
              echo "Reboot required to load rules"
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the audit configuration to immutable mode:

            ```yaml
            ---
            - name: Ensure audit configuration is set to immutable mode (-e 2)
              hosts: all
              become: true

              tasks:
                - name: Ensure immutable audit rule is present
                  ansible.builtin.blockinfile:
                    path: /etc/audit/rules.d/50-immutable.rules
                    block: |
                      -e 2
                    create: yes
                    owner: root
                    group: root
                    mode: '0640'
                  register: immutable_rule_updated

                - name: Reload audit rules if file was updated
                  ansible.builtin.command: augenrules --load
                  when: immutable_rule_updated.changed

                - name: Check if auditd is already in immutable mode
                  ansible.builtin.shell: |
                    auditctl -s | grep -q '^enabled.*2$'
                  register: immutable_check
                  changed_when: false
                  failed_when: false

                - name: Notify if reboot is required due to immutable audit config
                  ansible.builtin.debug:
                    msg: "Reboot required to load audit rules because auditd is in immutable mode"
                  when: immutable_check.rc == 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to make the audit configuration immutable. Once loaded, the rule set cannot be changed until the host reboots, so apply this after every other audit rule is in place:

            ```ruby
            execute 'load audit rules' do
              command 'augenrules --load'
              action :nothing
              not_if "auditctl -s | grep -q '^enabled.*2$'"
            end

            file '/etc/audit/rules.d/99-immutable.rules' do
              content "-e 2\n"
              owner 'root'
              group 'root'
              mode '0640'
              notifies :run, 'execute[load audit rules]', :delayed
            end
            ```
    refs:
      - url: https://man7.org/linux/man-pages/man8/auditd.8.html
        title: Linux Audit System
  - uid: mondoo-linux-security-sudo-logging-is-enabled
    title: Ensure sudo logging is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      sudoers.defaults.where(parameter == "logfile").any(value == "/var/log/sudo.log")
    docs:
      desc: |
        This check verifies that `sudo` writes a dedicated log file rather than only mixing its records in with every other authentication event on the host.

        The check reads the sudo defaults for a `logfile` setting pointing at `/var/log/sudo.log`. Administrators add it as a `Defaults logfile="/var/log/sudo.log"` line, edited through `visudo` in `/etc/sudoers` or in a file under `/etc/sudoers.d/`. The log file itself should be owned by `root` and readable only by its owner.

        **Why this matters**

        `sudo` is the boundary between an ordinary account and root, so its records answer the question that matters most after an incident: which account ran what as root, and when. By default those lines land in `/var/log/auth.log` alongside every SSH connection, every PAM session open and close, every cron job authentication, and every failed login on the host. On a busy machine the sudo lines are a fraction of a percent of the volume.

        That ratio is what an attacker relies on. Commands run through a compromised account are recorded, but they are recorded in a stream nobody reads line by line, and the surrounding noise means an alert on the pattern is either drowned or switched off. A dedicated file makes the entire history of privilege escalation on the host readable in one place, and cheap to ship to a collector and alert on.

        The separation also survives the ordinary failure modes of a shared log. A burst of authentication failures, or aggressive rotation tuned to that volume, ages sudo history out of `/var/log/auth.log` far sooner than anyone intends. A separate file rotates on its own much slower schedule.

        A local log file is evidence for an investigation, not protection from one. Anyone who reaches root can edit or truncate it, so forward the records off the host as well.
      audit: |
        Run this command to confirm sudo is configured to write a log file:

        ```bash
        grep -rE 'logfile=' /etc/sudoers /etc/sudoers.d/
        ```

        A passing result shows a `Defaults logfile="/var/log/sudo.log"` directive. A failing result shows no `logfile` directive.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To enable sudo logging to a dedicated file using a sudoers.d file:

            1. Create a new file in `/etc/sudoers.d/` (for example, `/etc/sudoers.d/sudo-logging`) using the `visudo` command to prevent syntax errors:

              ```bash
              visudo -f /etc/sudoers.d/sudo-logging
              ```

            2. Add the following line to the file:

              ```text
              Defaults logfile="/var/log/sudo.log"
              ```

            3. Ensure that the log file exists and has appropriate permissions:

              ```bash
              touch /var/log/sudo.log
              chmod 600 /var/log/sudo.log
              chown root:root /var/log/sudo.log
              ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To enable sudo logging to a dedicated file using a bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Creating a temporary file with the sudo logging configuration..."
            tmpfile=$(mktemp /tmp/sudo-logging.XXXXXX)
            echo 'Defaults logfile="/var/log/sudo.log"' > "$tmpfile"

            echo "Validating sudo logging configuration and installing..."
            if visudo -cf "$tmpfile"; then
              # Set correct permissions before moving
              chmod 440 "$tmpfile"
              install -o root -g root -m 440 "$tmpfile" /etc/sudoers.d/sudo-logging
              rm -f "$tmpfile"
            else
              echo "visudo config file validation failed"
              rm -f "$tmpfile"
              exit 1
            fi

            echo "Creating the sudo log file..."
            touch /var/log/sudo.log
            chmod 600 /var/log/sudo.log
            chown root:root /var/log/sudo.log
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to configure sudo logging to a dedicated file:

            ```yaml
            ---
            - name: Enable sudo logging to a dedicated file
              hosts: all
              become: true

              tasks:
                - name: Create sudoers.d file for sudo logging
                  ansible.builtin.copy:
                    dest: /etc/sudoers.d/sudo-logging
                    content: 'Defaults logfile="/var/log/sudo.log"'
                    owner: root
                    group: root
                    mode: '0440'
                    validate: visudo -cf %s

                - name: Ensure sudo log file exists with correct permissions
                  ansible.builtin.file:
                    path: /var/log/sudo.log
                    state: touch
                    owner: root
                    group: root
                    mode: '0600'
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to log sudo activity to a dedicated file. The `sudo` resource validates the generated file with `visudo` before installing it:

            ```ruby
            sudo 'sudo-logging' do
              defaults ['logfile="/var/log/sudo.log"']
            end

            file '/var/log/sudo.log' do
              owner 'root'
              group 'root'
              mode '0600'
            end
            ```
    refs:
      - url: https://www.sudo.ws/docs/man/sudoers.man/
        title: sudoers Manual
  - uid: mondoo-linux-security-permissions-on-etcsshsshd-config-are-configured
    title: Ensure secure permissions on /etc/ssh/sshd_config are set
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      file("/etc/ssh/sshd_config") {
        user.name == "root"
        group.name == "root"
        permissions.user_executable == false
        permissions.group_readable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_readable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      desc: |
        This check verifies that `/etc/ssh/sshd_config` is owned by `root` and the `root` group, and that it carries no execute bit for the owner and no read, write, or execute permission for the group or for other users. In practice that means mode `0600` or `0400`.

        **Why this matters**

        This file decides who may log in to the host and how. Every other SSH control in this policy is expressed here, so write access to it is equivalent to authority over all of them.

        An attacker who can modify it does not need to break authentication, they can rewrite it: set `PermitRootLogin yes`, add their own key path through `AuthorizedKeysFile`, or drop in a `Match` block that exempts one account from every restriction. The next time `sshd` reloads, which a package update or a routine service restart will do, the change takes effect and nothing about the running system looks unusual.

        Read access matters too, which is why group and other read are excluded rather than just write. The file names the accounts and groups permitted to connect, the authentication methods accepted, any non-standard port, and the location of key material. That is a precise description of how to attack the host's remote access, and it should not be available to every local account.

        Ownership by `root` closes the same gap from the other direction. A file owned by a service account can be replaced by anything running as that account, regardless of its mode.
      audit: |
        Run this command to inspect the ownership and permissions of the SSH server configuration file:

        ```bash
        stat -c '%U %G %a' /etc/ssh/sshd_config
        ```

        A passing result shows the file owned by `root:root` with no group or other access (mode `600` or stricter). A failing result shows group or other read, write, or execute access.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To set the ownership and permissions on `/etc/ssh/sshd_config`, run the following commands:

            ```bash
            chown root:root /etc/ssh/sshd_config
            chmod u-x,og-rwx /etc/ssh/sshd_config
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the ownership and permissions on `/etc/ssh/sshd_config`, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting ownership and permissions for /etc/ssh/sshd_config..."
            chown root:root /etc/ssh/sshd_config
            chmod u-x,og-rwx /etc/ssh/sshd_config
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the ownership and permissions on `/etc/ssh/sshd_config`, use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure correct ownership and permissions for sshd_config
              hosts: all
              become: yes
              tasks:
                - name: Set ownership of /etc/ssh/sshd_config to root:root
                  ansible.builtin.file:
                    path: /etc/ssh/sshd_config
                    owner: root
                    group: root

                - name: Remove read/write/execute permissions for group and others on sshd_config
                  ansible.builtin.file:
                    path: /etc/ssh/sshd_config
                    mode: '0600'
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict the SSH daemon configuration to root:

            ```ruby
            file '/etc/ssh/sshd_config' do
              owner 'root'
              group 'root'
              mode '0600'
            end
            ```
    refs:
      - url: https://man.openbsd.org/sshd_config
        title: OpenSSH sshd_config Manual
  - uid: mondoo-linux-security-rsyslog-is-installed-and-enabled
    title: Ensure rsyslog is installed
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      package("rsyslog").installed
      service("rsyslog").enabled
    docs:
      desc: |
        This check verifies that the `rsyslog` package is installed and that the `rsyslog` service is enabled at boot.

        **Why this matters**

        The reason to run `rsyslog` alongside `journald` is that it can send logs somewhere else. `journald` stores records locally in a binary journal; `rsyslog` is the component that forwards them to a central collector over the network, and that forwarding is what determines whether the logs survive the host.

        This is the difference between logs and evidence. An attacker who obtains root can edit or delete anything on the local filesystem, including the journal, so a purely local record proves nothing about a host that has been compromised. Records already delivered to a collector are outside their reach, and the gap where forwarding stopped is itself a signal.

        Centralization is also what makes correlation possible. An intrusion that touches several hosts is only visible when their logs sit side by side, ordered on a common timeline.

        Installing and enabling the service is the prerequisite, not the whole control. Configure a remote destination, prefer the TCP or RELP transports over UDP so that records are not silently dropped, and enable TLS so that log contents are not exposed in transit and the collector can authenticate the sender.
      audit: |
        Run these commands to confirm rsyslog is installed and enabled:

        ```bash
        rpm -q rsyslog || dpkg -s rsyslog
        systemctl is-enabled rsyslog
        ```

        A passing result reports the rsyslog package installed and the service `enabled`. A failing result reports the package missing or the service not enabled.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To install and enable `rsyslog`, run the following commands:

            ### RHEL/Fedora/Amazon Linux and derivatives

            Use `dnf`, which is the package manager on current RHEL, Fedora, and Amazon Linux 2023. On older releases where only `yum` is present, `yum` is aliased to `dnf` and the same command works:

            ```bash
            dnf install rsyslog
            systemctl --now enable rsyslog
            ```

            ### Debian/Ubuntu and derivatives

            ```bash
            apt-get install rsyslog
            systemctl --now enable rsyslog
            ```

            ### SLES and openSUSE

            ```bash
            zypper install rsyslog
            systemctl --now enable rsyslog
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To install and enable `rsyslog`, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Installing rsyslog..."
            if command -v dnf &> /dev/null; then
              dnf install -y rsyslog
            elif command -v yum &> /dev/null; then
              yum install -y rsyslog
            elif command -v apt-get &> /dev/null; then
              apt-get install -y rsyslog
            elif command -v zypper &> /dev/null; then
              zypper install -y rsyslog
            else
              echo "Unsupported package manager. Please install rsyslog manually."
              exit 1
            fi

            echo "Starting and enabling rsyslog service..."
            systemctl enable --now rsyslog
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To install and enable `rsyslog`, use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure rsyslog is installed and enabled
              hosts: all
              become: yes
              tasks:
                - name: Install rsyslog
                  ansible.builtin.package:
                    name: rsyslog
                    state: present

                - name: Enable and start rsyslog service
                  ansible.builtin.systemd:
                    name: rsyslog
                    enabled: yes
                    state: started
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to install rsyslog and start it at boot:

            ```ruby
            package 'rsyslog' do
              action :install
            end

            service 'rsyslog' do
              action %i(enable start)
            end
            ```
    refs:
      - url: https://www.rsyslog.com/doc/master/
        title: rsyslog Documentation
  - uid: mondoo-linux-security-rsyslog-default-file-permissions-configured
    title: Ensure rsyslog default file permissions are configured
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      rsyslog.conf.params["FileCreateMode"] == "0640"
    docs:
      desc: |
        This check verifies that log files rsyslog creates are not readable by every account on the host.

        `$FileCreateMode` sets the permissions rsyslog applies to log files it creates itself, which is separate from the permissions on files that already exist. The check reads that directive, which must be `0640`, giving the owner read and write, the group read, and other users nothing.

        **Why this matters**

        `rsyslog` creates log files on demand as new facilities and rulesets produce output, and it applies `$FileCreateMode` at that moment. If the value is permissive, every new log file arrives world-readable, and it arrives that way without anyone making a decision.

        That matters because of what lands in these files. Authentication logs carry account names, source addresses, and passwords typed into a username prompt. Application logs carry request URLs with tokens in the query string, database errors quoting the failing statement, and stack traces exposing internal structure. Any local account can read all of it as soon as the file is created.

        The distinction from a one-time permission fix is the point of the check. Correcting the mode on today's files does nothing about the file `rsyslog` creates next week when a new service starts logging. `$FileCreateMode` is what makes the correct permissions the default going forward.

        `0640` gives the owner read and write, the group read, and other users nothing, which lets an operations group with membership in `adm` read logs without exposing them to every account on the host.
      audit: |
        Run this command to confirm the rsyslog default file creation mode:

        ```bash
        grep -r 'FileCreateMode' /etc/rsyslog.conf /etc/rsyslog.d/
        ```

        A passing result shows `$FileCreateMode 0640`. A failing result shows the directive absent or set to a more permissive mode.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            `$FileCreateMode` sets the permissions rsyslog applies to log files it creates that do not already exist. The target is `0640` so that root can write, the log group can read, and other users have no access. This keeps sensitive log contents from being world-readable while still allowing log-processing tools that run as the log group to read them, which a stricter `0600` would prevent.

            To set the default file permissions for `rsyslog`, edit the `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf` files and add or modify the following line:

            ```ini
            $FileCreateMode 0640
            ```
            Restart the `rsyslog` service to apply the changes:

            ```bash
            systemctl restart rsyslog
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the default file permissions for `rsyslog`, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting default file permissions for rsyslog..."

            # Update /etc/rsyslog.conf
            if grep -q '^\$FileCreateMode' /etc/rsyslog.conf; then
              sed -i 's/^\$FileCreateMode.*/\$FileCreateMode 0640/' /etc/rsyslog.conf
            else
              echo '$FileCreateMode 0640' >> /etc/rsyslog.conf
            fi

            # Update all /etc/rsyslog.d/*.conf files
            for file in /etc/rsyslog.d/*.conf; do
              [ -e "$file" ] || continue
              if grep -q '^\$FileCreateMode' "$file"; then
                sed -i 's/^\$FileCreateMode.*/\$FileCreateMode 0640/' "$file"
              else
                echo '$FileCreateMode 0640' >> "$file"
              fi
            done

            echo "Restarting rsyslog service..."
            systemctl restart rsyslog
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the default file permissions for `rsyslog`, use the following Ansible playbook:

            ```yaml
            ---
            - name: Set default file permissions for rsyslog
              hosts: all
              become: yes
              tasks:
                - name: Ensure $FileCreateMode 0640 is set in /etc/rsyslog.conf
                  ansible.builtin.lineinfile:
                    path: /etc/rsyslog.conf
                    regexp: '^\$FileCreateMode'
                    line: '$FileCreateMode 0640'
                    state: present
                    insertafter: EOF
                    create: yes

                - name: Ensure $FileCreateMode 0640 is set in all /etc/rsyslog.d/*.conf files
                  ansible.builtin.find:
                    paths: /etc/rsyslog.d
                    patterns: '*.conf'
                    file_type: file
                  register: rsyslog_conf_files

                - name: Set $FileCreateMode 0640 in each rsyslog.d file
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\$FileCreateMode'
                    line: '$FileCreateMode 0640'
                    create: yes
                    state: present
                    backup: yes
                  loop: "{{ rsyslog_conf_files.files }}"

                - name: Restart rsyslog service
                  ansible.builtin.systemd:
                    name: rsyslog
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the mode rsyslog creates new log files with. The directive is applied to the main configuration file and to every drop-in, because a later drop-in overrides an earlier setting:

            ```ruby
            service 'rsyslog' do
              action :nothing
            end

            (['/etc/rsyslog.conf'] + ::Dir.glob('/etc/rsyslog.d/*.conf')).each do |config|
              ruby_block "set $FileCreateMode in #{config}" do
                block do
                  body = ::File.read(config)
                  directive = '$FileCreateMode 0640'
                  body = if body.match?(/^\s*\$FileCreateMode\s/)
                           body.gsub(/^\s*\$FileCreateMode\s.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(config, body)
                end
                only_if { ::File.exist?(config) }
                not_if { ::File.read(config).match?(/^\$FileCreateMode\s+0640\s*$/) }
                notifies :restart, 'service[rsyslog]', :delayed
              end
            end
            ```
    refs:
      - url: https://www.rsyslog.com/doc/master/
        title: rsyslog Documentation
  - uid: mondoo-linux-security-journald-is-configured-to-send-logs-to-rsyslog
    title: Ensure journald is configured to send logs to rsyslog
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      file("/etc/systemd/journald.conf").exists &&
        journald.config.sections.where(name == "Journal").any(params.where(name == "ForwardToSyslog").any(value == "yes"))
    docs:
      desc: |
        This check verifies that journald hands its log records to rsyslog, which is what allows them to be forwarded off the host.

        The check reads `ForwardToSyslog` in the `[Journal]` section of `/etc/systemd/journald.conf`, which must be `yes`.

        **Why this matters**

        `journald` is where log records arrive, and it stores them locally in a binary journal. It has no ability to ship them anywhere. Forwarding to `rsyslog` is the bridge that gets records from the journal into a component that can send them off the host.

        Without it, everything the system logs stays on the system. That is precisely the wrong property for security logging, because the records describing a compromise are then held on a machine the attacker controls, in files they can edit or delete once they have root. A host that is thoroughly compromised produces a clean-looking journal.

        Forwarding also matters for hosts that are ephemeral. Container hosts, autoscaled instances, and spot capacity are destroyed routinely, and the local journal goes with them. Records that were never forwarded simply cease to exist, along with any evidence of what happened on that instance.

        Setting this parameter is one half of the path. It moves records into `rsyslog`; the `rsyslog` configuration then has to define a remote destination for them to actually leave the host. Verify both, since forwarding into a `rsyslog` that only writes to `/var/log` leaves the records exactly where they were.
      audit: |
        Run this command to inspect the journald configuration:

        ```bash
        grep -E '^ForwardToSyslog' /etc/systemd/journald.conf
        ```

        A passing result shows `ForwardToSyslog=yes`. A failing result shows the setting absent or set to a different value.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. To configure journald to forward logs to rsyslog, edit the `/etc/systemd/journald.conf` file and add the following line in the `[Journal]` section. Settings placed outside that section are ignored:

                ```ini
                ForwardToSyslog=yes
                ```

            2. Restart the service to load the new configuration values:

                ```bash
                systemctl restart systemd-journald
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To configure journald to forward logs to rsyslog, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Configuring journald to forward logs to rsyslog..."

            grep -q '^\[Journal\]' /etc/systemd/journald.conf 2>/dev/null || echo '[Journal]' >> /etc/systemd/journald.conf

            if grep -q '^ForwardToSyslog=' /etc/systemd/journald.conf; then
              sed -i 's/^ForwardToSyslog=.*/ForwardToSyslog=yes/' /etc/systemd/journald.conf
            else
              echo "ForwardToSyslog=yes" >> /etc/systemd/journald.conf
            fi

            echo "Restarting systemd-journald service..."
            systemctl restart systemd-journald
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To configure journald to forward logs to rsyslog, use the following Ansible playbook:

            ```yaml
            ---
            - name: Configure journald to forward logs to rsyslog
              hosts: all
              become: true

              tasks:
                - name: Ensure the Journal section header exists in journald.conf
                  ansible.builtin.lineinfile:
                    path: /etc/systemd/journald.conf
                    regexp: '^\[Journal\]'
                    line: '[Journal]'
                    create: yes

                - name: Ensure ForwardToSyslog=yes is set in journald.conf
                  ansible.builtin.lineinfile:
                    path: /etc/systemd/journald.conf
                    regexp: '^#?ForwardToSyslog='
                    line: 'ForwardToSyslog=yes'
                    insertafter: '^\[Journal\]'
                    backup: yes

                - name: Restart systemd-journald to apply changes
                  ansible.builtin.systemd:
                    name: systemd-journald
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to forward journald records to rsyslog:

            ```ruby
            journald_conf = '/etc/systemd/journald.conf'

            service 'systemd-journald' do
              action :nothing
            end

            ruby_block 'set ForwardToSyslog in journald.conf' do
              block do
                body = ::File.exist?(journald_conf) ? ::File.read(journald_conf) : ''
                body = "[Journal]\n#{body}" unless body.match?(/^\[Journal\]$/)
                directive = 'ForwardToSyslog=yes'
                body = if body.match?(/^\s*#?\s*ForwardToSyslog=/)
                         body.gsub(/^\s*#?\s*ForwardToSyslog=.*$/, directive)
                       else
                         body.sub(/^\[Journal\]$/, "[Journal]\n#{directive}")
                       end
                ::File.write(journald_conf, body)
              end
              not_if { ::File.exist?(journald_conf) && ::File.read(journald_conf).match?(/^ForwardToSyslog=yes\s*$/) }
              notifies :restart, 'service[systemd-journald]', :delayed
            end
            ```
    refs:
      - url: https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
        title: journald.conf Manual Page
  - uid: mondoo-linux-security-journald-is-configured-to-compress-large-log-files
    title: Ensure journald is configured to compress large log files
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      file("/etc/systemd/journald.conf").exists &&
        journald.config.sections.where(name == "Journal").any(params.where(name == "Compress").any(value == "yes"))
    docs:
      desc: |
        This check verifies that journald compresses journal files, so that a fixed disk allocation holds more history.

        The check reads `Compress` in the `[Journal]` section of `/etc/systemd/journald.conf`, which must be `yes`.

        **Why this matters**

        This is a retention and availability control rather than a confidentiality one, and it is worth being clear about that. Compression does not protect log contents from anyone; it changes how much history fits in the space available.

        `journald` enforces a disk budget and discards its oldest records once that budget is reached. Compression typically reduces journal size several-fold, so the same disk allocation holds substantially more history. In practice that is the difference between a journal covering a few days and one covering several weeks, and intrusions are usually discovered well after they begin. Whether the records describing the initial access still exist is often decided by this setting rather than by any deliberate retention policy.

        The second effect is on the host itself. Journals that grow until the filesystem fills take services down with them, and a full `/var` is a common cause of outages that look unrelated to logging.

        Compression costs some CPU on write and on read. On any modern system that cost is negligible next to the retention gained, and this remains a supporting control: the durable copy of the logs should be on a central collector, not on this host.
      audit: |
        Run this command to inspect the journald configuration:

        ```bash
        grep -E '^Compress' /etc/systemd/journald.conf
        ```

        A passing result shows `Compress=yes`. A failing result shows the setting absent or set to a different value.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. To configure journald to compress large log files, edit the `/etc/systemd/journald.conf` file and add the following line in the `[Journal]` section. Settings placed outside that section are ignored:

                ```ini
                Compress=yes
                ```

            2. Restart the service to load the new configuration values:

                ```bash
                systemctl restart systemd-journald
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To configure journald to compress large log files, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Configuring journald to compress large log files..."

            grep -q '^\[Journal\]' /etc/systemd/journald.conf 2>/dev/null || echo '[Journal]' >> /etc/systemd/journald.conf

            if grep -q '^Compress=' /etc/systemd/journald.conf; then
              sed -i 's/^Compress=.*/Compress=yes/' /etc/systemd/journald.conf
            else
              echo "Compress=yes" >> /etc/systemd/journald.conf
            fi

            echo "Restarting systemd-journald service..."
            systemctl restart systemd-journald
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To configure journald to compress large log files, use the following Ansible playbook:

            ```yaml
            ---
            - name: Configure journald to compress large log files
              hosts: all
              become: true

              tasks:
                - name: Ensure the Journal section header exists in journald.conf
                  ansible.builtin.lineinfile:
                    path: /etc/systemd/journald.conf
                    regexp: '^\[Journal\]'
                    line: '[Journal]'
                    create: yes

                - name: Ensure Compress=yes is set in journald.conf
                  ansible.builtin.lineinfile:
                    path: /etc/systemd/journald.conf
                    regexp: '^#?Compress='
                    line: 'Compress=yes'
                    insertafter: '^\[Journal\]'
                    backup: yes

                - name: Restart systemd-journald to apply compression setting
                  ansible.builtin.systemd:
                    name: systemd-journald
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to compress large journal files:

            ```ruby
            journald_conf = '/etc/systemd/journald.conf'

            service 'systemd-journald' do
              action :nothing
            end

            ruby_block 'set Compress in journald.conf' do
              block do
                body = ::File.exist?(journald_conf) ? ::File.read(journald_conf) : ''
                body = "[Journal]\n#{body}" unless body.match?(/^\[Journal\]$/)
                directive = 'Compress=yes'
                body = if body.match?(/^\s*#?\s*Compress=/)
                         body.gsub(/^\s*#?\s*Compress=.*$/, directive)
                       else
                         body.sub(/^\[Journal\]$/, "[Journal]\n#{directive}")
                       end
                ::File.write(journald_conf, body)
              end
              not_if { ::File.exist?(journald_conf) && ::File.read(journald_conf).match?(/^Compress=yes\s*$/) }
              notifies :restart, 'service[systemd-journald]', :delayed
            end
            ```
    refs:
      - url: https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
        title: journald.conf Manual Page
  - uid: mondoo-linux-security-journald-is-configured-to-write-logfiles-to-persistent-disk
    title: Ensure journald is configured to write logfiles to persistent disk
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      file("/etc/systemd/journald.conf").exists &&
        journald.config.sections.where(name == "Journal").any(params.where(name == "Storage").any(value == "persistent"))
    docs:
      desc: |
        This check verifies that journald keeps logs across reboots rather than holding them in memory.

        The check reads `Storage` in the `[Journal]` section of `/etc/systemd/journald.conf`, which must be `persistent`. That value directs journald to write to `/var/log/journal` and to create the directory if it is absent. The common default is `auto`, which writes to disk only if that directory already exists and otherwise keeps the journal on a tmpfs.

        **Why this matters**

        The default on many distributions is `Storage=auto`, which writes to persistent storage only if `/var/log/journal` already exists and otherwise keeps the journal in `/run/log/journal`, on a tmpfs. That distinction is easy to miss, because a host in the volatile mode looks entirely normal: `journalctl` works, records appear, nothing reports an error.

        The records are in memory, and they are discarded at every reboot.

        That is a problem in exactly the situations where logs matter. A host that panics, is rebooted to clear a suspected compromise, or is restarted by an attacker covering their tracks loses the entire journal for the period leading up to the restart, which is the period an investigation is interested in. Kernel messages and service failures that preceded the crash go with it, so the diagnostic use is lost as well.

        Volatile storage also caps the journal by memory rather than by disk, so retention on a busy host may be hours.

        `Storage=persistent` fixes the local copy. It does not remove the need to forward records off the host, since anything on this filesystem remains editable by whoever holds root here.
      audit: |
        Run this command to inspect the journald configuration:

        ```bash
        grep -E '^Storage' /etc/systemd/journald.conf
        ```

        A passing result shows `Storage=persistent`. A failing result shows the setting absent or set to a different value.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. To configure journald to write log files to a persistent disk, edit the `/etc/systemd/journald.conf` file and add the following line in the `[Journal]` section. Settings placed outside that section are ignored:

                ```ini
                Storage=persistent
                ```

            2. Restart the service to load the new configuration values:

                ```bash
                systemctl restart systemd-journald
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To configure journald to write log files to a persistent disk, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Configuring journald to write logs to persistent storage..."

            grep -q '^\[Journal\]' /etc/systemd/journald.conf 2>/dev/null || echo '[Journal]' >> /etc/systemd/journald.conf

            if grep -q '^Storage=' /etc/systemd/journald.conf; then
              sed -i 's/^Storage=.*/Storage=persistent/' /etc/systemd/journald.conf
            else
              echo "Storage=persistent" >> /etc/systemd/journald.conf
            fi

            echo "Restarting systemd-journald service..."
            systemctl restart systemd-journald
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To configure journald to write log files to a persistent disk, use the following Ansible playbook:

            ```yaml
            ---
            - name: Configure journald to write logs to persistent storage
              hosts: all
              become: true

              tasks:
                - name: Ensure the Journal section header exists in journald.conf
                  ansible.builtin.lineinfile:
                    path: /etc/systemd/journald.conf
                    regexp: '^\[Journal\]'
                    line: '[Journal]'
                    create: yes

                - name: Ensure Storage=persistent is set in journald.conf
                  ansible.builtin.lineinfile:
                    path: /etc/systemd/journald.conf
                    regexp: '^#?Storage='
                    line: 'Storage=persistent'
                    insertafter: '^\[Journal\]'
                    backup: yes

                - name: Restart systemd-journald to apply storage setting
                  ansible.builtin.systemd:
                    name: systemd-journald
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to keep the journal across reboots:

            ```ruby
            journald_conf = '/etc/systemd/journald.conf'

            service 'systemd-journald' do
              action :nothing
            end

            ruby_block 'set Storage in journald.conf' do
              block do
                body = ::File.exist?(journald_conf) ? ::File.read(journald_conf) : ''
                body = "[Journal]\n#{body}" unless body.match?(/^\[Journal\]$/)
                directive = 'Storage=persistent'
                body = if body.match?(/^\s*#?\s*Storage=/)
                         body.gsub(/^\s*#?\s*Storage=.*$/, directive)
                       else
                         body.sub(/^\[Journal\]$/, "[Journal]\n#{directive}")
                       end
                ::File.write(journald_conf, body)
              end
              not_if { ::File.exist?(journald_conf) && ::File.read(journald_conf).match?(/^Storage=persistent\s*$/) }
              notifies :restart, 'service[systemd-journald]', :delayed
            end
            ```
    refs:
      - url: https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
        title: journald.conf Manual Page
  - uid: mondoo-linux-security-permissions-on-all-logfiles-are-configured
    title: Ensure secure permissions on all log files are set
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      files.find(from: "/var/log", type: "file").list.all(
        permissions.group_writeable == false &&
        permissions.group_executable == false &&
        permissions.other_readable == false &&
        permissions.other_writeable == false &&
        permissions.other_executable == false
      )
    docs:
      desc: |
        This check verifies that every file under `/var/log` has no write or execute permission for the group, and no read, write, or execute permission for other users. Group read is permitted, so that a log-reading group such as `adm` continues to work.

        **Why this matters**

        Logs are read to reconstruct what happened, so they contain what happened, including material that is sensitive on its own. Authentication logs record which accounts exist and when they are used. Mail logs carry addresses and subjects. Application logs routinely capture full request URLs with tokens in query strings, database errors quoting the offending statement and its parameters, and stack traces exposing internal paths and configuration. Passwords mistyped into a username prompt end up in the authentication log in clear.

        Read access for other users therefore hands every local account a running feed of that material. It also gives an attacker who has landed in an unprivileged service account a way to watch the administrators responding to them.

        Write access is the more consequential half. An attacker with a foothold cleans up by editing the logs: removing the authentication entries that show how they arrived, the command records, and the file access that followed. Logs are frequently the only evidence of an intrusion, and once they are writable by the compromised account they cannot be relied on.

        Forward logs to a system the host cannot modify. Local permissions protect the copy on disk; only an off-host copy survives someone with root on this machine.
      audit: |
        Run this command to find log files with overly permissive permissions:

        ```bash
        find /var/log -type f \( -perm /0137 \) -ls
        ```

        A passing result returns no files, meaning no log file is group-writable or executable or readable, writable, or executable by other users. A failing result lists log files with broader access.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Set the correct permissions on all log files in `/var/log/`, run the following command:

                ```bash
                find /var/log/ -type f -exec chmod g-wx,o-rwx {} +
                ```

            2. Configure rsyslog to set default permissions for newly created log files if using `rsyslog`:

                Edit the `/etc/rsyslog.conf` file (and any relevant files in `/etc/rsyslog.d/*.conf`) and add or update the following lines:

                ```conf
                $FileCreateMode 0640
                $Umask 0077
                ```

                Save the file and restart the rsyslog service to apply the changes:

                ```bash
                systemctl restart rsyslog
                ```

            3. Configure the creation, deletion, and cleaning of volatile and temporary files:

                Edit or create a file in the `/etc/tmpfiles.d/` directory, for example, `/etc/tmpfiles.d/var.conf`, and add the following lines:

                ```text
                f /var/log/alternatives.log 0640 root utmp -
                f /var/log/apt/history.log 0640 root utmp -
                f /var/log/auth.log 0640 root utmp -
                f /var/log/btmp 0640 root utmp -
                f /var/log/cron.log 0640 root utmp -
                f /var/log/daemon.log 0640 root utmp -
                f /var/log/dpkg.log 0640 root utmp -
                f /var/log/faillog 0640 root root -
                f /var/log/lastlog 0640 root utmp -
                f /var/log/sudo.log 0640 root utmp -
                f /var/log/wtmp 0640 root utmp -
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the ownership and permissions on all log files in /var/log, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            echo "Setting permissions on all log files in /var/log..."
            find /var/log/ -type f -exec chmod g-wx,o-rwx {} +

            # Tighten the mode rsyslog creates new files with. Without this the daemon
            # recreates world-readable log files and the hardening above is undone on the
            # next rotation.
            if [ -f /etc/rsyslog.conf ]; then
              echo "Setting the rsyslog file creation mode and umask..."

              if grep -q '^\$FileCreateMode' /etc/rsyslog.conf; then
                sed -i 's/^\$FileCreateMode.*/\$FileCreateMode 0640/' /etc/rsyslog.conf
              else
                echo '$FileCreateMode 0640' >> /etc/rsyslog.conf
              fi

              if grep -q '^\$Umask' /etc/rsyslog.conf; then
                sed -i 's/^\$Umask.*/\$Umask 0077/' /etc/rsyslog.conf
              else
                echo '$Umask 0077' >> /etc/rsyslog.conf
              fi

              systemctl restart rsyslog
            fi

            echo "Configuring tmpfiles.d to set default permissions for newly created log files..."
            cat <<EOF > /etc/tmpfiles.d/var.conf
            f /var/log/alternatives.log 0640 root utmp -
            f /var/log/apt/history.log 0640 root utmp -
            f /var/log/auth.log 0640 root utmp -
            f /var/log/btmp 0640 root utmp -
            f /var/log/cron.log 0640 root utmp -
            f /var/log/daemon.log 0640 root utmp -
            f /var/log/dpkg.log 0640 root utmp -
            f /var/log/faillog 0640 root root -
            f /var/log/lastlog 0640 root utmp -
            f /var/log/sudo.log 0640 root utmp -
            f /var/log/wtmp 0640 root utmp -
            EOF
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set secure permissions on all log files in `/var/log/` and configure rsyslog default file permissions:

            ```yaml
            ---
            - name: Ensure secure permissions on all log files
              hosts: all
              become: true

              tasks:
                - name: Find all files in /var/log
                  ansible.builtin.find:
                    paths: /var/log
                    recurse: yes
                    file_type: file
                  register: log_files

                - name: Remove group write/execute and other rwx on log files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    mode: "g-wx,o-rwx"
                  loop: "{{ log_files.files }}"
                  loop_control:
                    label: "{{ item.path }}"

                - name: Configure rsyslog default file creation mode
                  ansible.builtin.lineinfile:
                    path: /etc/rsyslog.conf
                    regexp: '^\$FileCreateMode'
                    line: '$FileCreateMode 0640'
                  notify: Restart rsyslog
                  when: ansible_facts.services['rsyslog.service'] is defined

                - name: Configure rsyslog umask
                  ansible.builtin.lineinfile:
                    path: /etc/rsyslog.conf
                    regexp: '^\$Umask'
                    line: '$Umask 0077'
                  notify: Restart rsyslog
                  when: ansible_facts.services['rsyslog.service'] is defined

                - name: Create tmpfiles.d configuration for log file permissions
                  ansible.builtin.copy:
                    dest: /etc/tmpfiles.d/var.conf
                    owner: root
                    group: root
                    mode: '0644'
                    content: |
                      f /var/log/alternatives.log 0640 root utmp -
                      f /var/log/apt/history.log 0640 root utmp -
                      f /var/log/auth.log 0640 root utmp -
                      f /var/log/btmp 0640 root utmp -
                      f /var/log/cron.log 0640 root utmp -
                      f /var/log/daemon.log 0640 root utmp -
                      f /var/log/dpkg.log 0640 root utmp -
                      f /var/log/faillog 0640 root root -
                      f /var/log/lastlog 0640 root utmp -
                      f /var/log/sudo.log 0640 root utmp -
                      f /var/log/wtmp 0640 root utmp -

              handlers:
                - name: Restart rsyslog
                  ansible.builtin.service:
                    name: rsyslog
                    state: restarted
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to remove group and world access from every existing log file, set the mode rsyslog creates new files with, and record the intended permissions so systemd-tmpfiles keeps them:

            ```ruby
            service 'rsyslog' do
              action :nothing
            end

            ruby_block 'remove group and world access from log files' do
              block do
                ::Dir.glob('/var/log/**/*').each do |log_file|
                  next unless ::File.file?(log_file)

                  ::File.chmod(::File.stat(log_file).mode & 0o740, log_file)
                end
              end
              only_if do
                ::Dir.glob('/var/log/**/*').any? do |log_file|
                  ::File.file?(log_file) && (::File.stat(log_file).mode & 0o037) != 0
                end
              end
            end

            rsyslog_conf = '/etc/rsyslog.conf'

            { '$FileCreateMode' => '0640', '$Umask' => '0077' }.each do |keyword, value|
              pattern = Regexp.escape(keyword)

              ruby_block "set #{keyword} in rsyslog.conf" do
                block do
                  body = ::File.read(rsyslog_conf)
                  directive = "#{keyword} #{value}"
                  body = if body.match?(/^\s*#{pattern}\s/)
                           body.gsub(/^\s*#{pattern}\s.*$/, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(rsyslog_conf, body)
                end
                not_if { ::File.read(rsyslog_conf).match?(/^#{pattern}\s+#{Regexp.escape(value)}\s*$/) }
                only_if { ::File.exist?(rsyslog_conf) }
                notifies :restart, 'service[rsyslog]', :delayed
              end
            end

            file '/etc/tmpfiles.d/var.conf' do
              content <<~TMPFILES
                f /var/log/alternatives.log 0640 root utmp -
                f /var/log/apt/history.log 0640 root utmp -
                f /var/log/auth.log 0640 root utmp -
                f /var/log/btmp 0640 root utmp -
                f /var/log/cron.log 0640 root utmp -
                f /var/log/daemon.log 0640 root utmp -
                f /var/log/dpkg.log 0640 root utmp -
                f /var/log/faillog 0640 root root -
                f /var/log/lastlog 0640 root utmp -
                f /var/log/sudo.log 0640 root utmp -
                f /var/log/wtmp 0640 root utmp -
              TMPFILES
              owner 'root'
              group 'root'
              mode '0644'
            end
            ```
    refs:
      - url: https://www.rsyslog.com/doc/master/
        title: rsyslog Documentation
  - uid: mondoo-linux-security-permissions-on-ssh-private-host-key-files-are-configured
    title: Ensure secure permissions on SSH private host key files are set
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      files.
        find(from: "/etc/ssh", type: "file").
        where(path == /ssh_host_.*key$/).list {
          permissions.user_executable == false
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
        }
    docs:
      desc: |
        This check verifies that files in `/etc/ssh` matching `ssh_host_*key` are not readable, writable, or executable by the group or by other users, and are not executable by their owner.

        **Why this matters**

        The private host key is the server's identity. When a client connects, the server proves it holds this key, and the client compares the corresponding public key against the fingerprint it recorded on first connection. That is the entire basis on which SSH decides it is talking to the right machine.

        A local user who can read the key can copy it and stand up a server that is cryptographically indistinguishable from this one. Clients connecting to the impostor see no host key warning, because the key matches, and hand over passwords or forwarded agent credentials to it. The warning that would normally make an interception attempt obvious is exactly what a stolen host key suppresses.

        The keys also underpin host-based authentication between systems. Where that is configured, possession of the key is itself the credential that grants access to the trusting hosts.

        If a private host key has been exposed, restoring the permissions is not sufficient. Generate new host keys, distribute the new fingerprints to clients, and treat any credential that was entered over a session in the exposure window as compromised.
      audit: |
        Run this command to inspect the permissions of the SSH private host key files:

        ```bash
        find /etc/ssh -type f -name 'ssh_host_*key' -exec stat -c '%n %A' {} +
        ```

        A passing result shows each private host key with no group or other access. A failing result shows group or other read, write, or execute access.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            This check requires that the private host keys have no group or other access, so set the mode to `0600`. Some recent Debian and Ubuntu builds ship the keys as `0640 root:ssh_keys` and read them through the `ssh_keys` group. Mode `0600` removes group read regardless of the group owner, so keep the `ssh_keys` group where it exists to match the platform layout, and fall back to `root` ownership only where no such group is present:

            ```bash
            if getent group ssh_keys >/dev/null 2>&1; then
              find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chown root:ssh_keys {} \; -exec chmod 0600 {} \;
            else
              find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chown root:root {} \; -exec chmod 0600 {} \;
            fi
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the ownership and permissions on the SSH host private key files, you can run the following bash script. It keeps the `ssh_keys` group where the platform uses it and sets mode `0600` so the keys have no group or other access:

            ```bash
            #!/bin/bash
            set -e

            if getent group ssh_keys >/dev/null 2>&1; then
              find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chown root:ssh_keys {} \; -exec chmod 0600 {} \;
            else
              find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec chown root:root {} \; -exec chmod 0600 {} \;
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the ownership and permissions on the SSH host private key files, use the following Ansible playbook:

            ```yaml
            ---
            - name: Set ownership and permissions on SSH host private key files
              hosts: all
              become: true

              tasks:
                - name: Check whether the ssh_keys group exists
                  ansible.builtin.getent:
                    database: group
                    key: ssh_keys
                  register: ssh_keys_group
                  failed_when: false

                - name: Find SSH host private key files
                  ansible.builtin.find:
                    paths: /etc/ssh
                    patterns: 'ssh_host_*_key'
                    file_type: file
                    recurse: no
                    follow: false
                  register: ssh_private_keys

                - name: Set correct ownership and permissions on SSH host private keys
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    group: "{{ 'ssh_keys' if ssh_keys_group.ansible_facts.getent_group is defined and ssh_keys_group.ansible_facts.getent_group else 'root' }}"
                    mode: '0600'
                  loop: "{{ ssh_private_keys.files }}"
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict the SSH host private keys. Distributions that ship an `ssh_keys` group expect the keys to belong to it so that `ssh-keygen` can read them without root:

            ```ruby
            ssh_keys_group = ::File.readlines('/etc/group').any? { |entry| entry.start_with?('ssh_keys:') }
            key_group = ssh_keys_group ? 'ssh_keys' : 'root'

            ::Dir.glob('/etc/ssh/ssh_host_*_key').each do |private_key|
              file private_key do
                owner 'root'
                group key_group
                mode '0600'
              end
            end
            ```
    refs:
      - url: https://man.openbsd.org/sshd_config
        title: OpenSSH sshd_config Manual
  - uid: mondoo-linux-security-permissions-on-ssh-public-host-key-files-are-configured
    title: Ensure secure permissions on SSH public host key files are set
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      files.
        find(from: "/etc/ssh", type: "file").
        where(path == /ssh_host_.*key\.pub$/).list {
          permissions.user_executable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_writeable == false
          permissions.other_executable == false
        }
    docs:
      desc: |
        This check verifies that files in `/etc/ssh` matching `ssh_host_*key.pub` are not writable or executable by the group or by other users, and are not executable by their owner. These files are meant to be world-readable, so read access is not restricted.

        **Why this matters**

        Public host keys are not secret, but their integrity still matters. `sshd` reads them to advertise the server's identity, and tooling that distributes known-hosts entries reads them to tell clients what fingerprint to expect.

        A local user who can write these files can therefore influence what the host claims to be. Substituting a key they control feeds the wrong fingerprint into any automation that harvests it, which pre-authorizes a machine they hold the private key for.

        Even without an attacker, a modified public key file breaks things in ways that are hard to diagnose. Clients that already recorded the real fingerprint refuse to connect and report a host key mismatch, which is the same signal an interception attempt produces. Automation stops, and the on-call response is to investigate a suspected attack.

        Writable key material in `/etc/ssh` is also a signal in its own right. The same directory holds the private keys, and permissions that are wrong on one file are worth checking on all of them.
      audit: |
        Run this command to inspect the permissions of the SSH public host key files:

        ```bash
        find /etc/ssh -type f -name 'ssh_host_*key.pub' -exec stat -c '%n %A' {} +
        ```

        A passing result shows each public host key with no group or other write or execute access. A failing result shows group or other write or execute access.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            To set the ownership and permissions on the SSH host public key files, run the following commands:

            ```bash
            find /etc/ssh -xdev -type f -name 'ssh_host_*_key.pub' -exec chown root:root {} \; -exec chmod 0644 {} \;
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the ownership and permissions on the SSH host public key files, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            find /etc/ssh -xdev -type f -name 'ssh_host_*_key.pub' -exec chown root:root {} \; -exec chmod 0644 {} \;
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the ownership and permissions on the SSH host public key files, use the following Ansible playbook:

            ```yaml
            ---
            - name: Set ownership and permissions on SSH host public key files
              hosts: all
              become: true

              tasks:
                - name: Find SSH host public key files
                  ansible.builtin.find:
                    paths: /etc/ssh
                    patterns: 'ssh_host_*_key.pub'
                    file_type: file
                    recurse: no
                    follow: false
                  register: ssh_public_keys

                - name: Set correct ownership and permissions on SSH host public keys
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    group: root
                    mode: '0644'
                  loop: "{{ ssh_public_keys.files }}"
                  when: ssh_public_keys.matched > 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the ownership and permissions on the SSH host public keys:

            ```ruby
            ::Dir.glob('/etc/ssh/ssh_host_*_key.pub').each do |public_key|
              file public_key do
                owner 'root'
                group 'root'
                mode '0644'
              end
            end
            ```
    refs:
      - url: https://man.openbsd.org/sshd_config
        title: OpenSSH sshd_config Manual
  - uid: mondoo-linux-security-ssh-protocol-is-set-to-2
    title: Ensure SSH Protocol is set to 2
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: package('openssh-server').version  >= semver("6") && package('openssh-server').version < semver("7.6")
    mql: |
      sshd.config.params["Protocol"] == null || sshd.config.params["Protocol"] == 2
    docs:
      desc: |
        This check verifies that the SSH server speaks only protocol version 2.

        The check reads `Protocol` in `/etc/ssh/sshd_config`. An explicit `Protocol 1` or `Protocol 2,1` fails; an explicit `Protocol 2` passes, and so does an absent directive, because every OpenSSH release in scope already defaults to protocol 2. It applies only to hosts running OpenSSH 6.0 through 7.5, the versions where the directive still exists and protocol 1 can still be selected. OpenSSH 7.4 removed server support for protocol 1 and 7.6 removed the directive entirely, so newer hosts are out of scope and are not evaluated.

        **Why this matters**

        SSH protocol 1 is broken in ways that cannot be configured around. Its integrity check is a CRC-32, which is not a cryptographic function, and that allowed an attacker who could observe and modify a session to insert chosen ciphertext without detection. The best known result was a remote root compromise against the server through this flaw.

        Protocol 1 also has no separate rekeying and a weaker key exchange, so a long-lived session gives an attacker a large volume of traffic under a single key.

        Where this check fails, the host is running a version old enough that protocol 1 remains selectable, which means the OpenSSH package is at least several years behind. Setting `Protocol 2` closes the immediate exposure, but upgrading the package is the actual remedy, since versions in this range are also missing years of fixes to the protocol 2 implementation.
      audit: |
        Run this command to inspect the SSH protocol setting:

        ```bash
        grep -i '^Protocol' /etc/ssh/sshd_config
        ```

        A passing result shows `Protocol 2`, or no `Protocol` line, since the default on every version in scope is already protocol 2. A failing result shows `Protocol 1` or a mixed setting such as `Protocol 2,1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works.

            To set the SSH protocol to version 2, edit the `/etc/ssh/sshd_config` file and add or modify the following line:

            ```bash
            Protocol 2
            ```

            If the system uses configuration snippets in `/etc/ssh/sshd_config.d/`, check for a conflicting `Protocol` directive there. The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads these snippets first:

            ```bash
            grep -ri 'Protocol' /etc/ssh/sshd_config.d/
            ```

            Validate the configuration before restarting:

            ```bash
            sshd -t
            ```

            Restart the SSH service to apply the changes:

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            The `Protocol` directive applies only to OpenSSH versions earlier than 7.6, which is why this check is version-gated. OpenSSH 7.6 removed protocol 1 support and the directive itself, so on newer servers no `Protocol` line is needed. If you run this script against a newer server, `sshd -t` rejects the unknown keyword and the script aborts before restarting the service. To set the SSH Protocol to 2 on an in-scope server, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^Protocol' /etc/ssh/sshd_config; then
              echo "Updating Protocol to 2 in /etc/ssh/sshd_config..."
              sed -i 's/^Protocol.*/Protocol 2/' /etc/ssh/sshd_config
            else
              echo "Adding Protocol 2 to /etc/ssh/sshd_config..."
              echo "Protocol 2" >> /etc/ssh/sshd_config
            fi

            # Validate the new configuration before restarting. A syntax error here can lock you out of SSH.
            sshd -t

            # Restart the SSH service. The unit is "ssh" on Debian/Ubuntu and "sshd" on other distributions.
            if systemctl list-unit-files | grep -q '^ssh\.service'; then
              systemctl restart ssh
            else
              systemctl restart sshd
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the SSH protocol to version 2, use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure SSH Protocol is set to 2
              hosts: all
              become: true

              tasks:
                - name: Set Protocol 2 in sshd_config
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '^Protocol'
                    line: 'Protocol 2'
                  register: ssh_config_change

                - name: Gather service facts to detect the SSH unit name
                  ansible.builtin.service_facts:
                  when: ssh_config_change.changed

                - name: Restart the SSH service
                  ansible.builtin.systemd:
                    name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
                    state: restarted
                  when: ssh_config_change.changed
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to pin the SSH protocol to version 2:

            ```ruby
            sshd_config = '/etc/ssh/sshd_config'
            ssh_service = platform_family?('debian') ? 'ssh' : 'sshd'

            service ssh_service do
              action :nothing
            end

            { 'Protocol' => '2' }.each do |keyword, value|
              ruby_block "set #{keyword} in sshd_config" do
                block do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  body = if body.match?(/^\s*#{keyword}\b/i)
                           body.gsub(/^\s*#{keyword}\b.*$/i, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(sshd_config, body)
                end
                not_if { ::File.read(sshd_config).match?(/^\s*#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, "service[#{ssh_service}]", :delayed
              end
            end
            ```
    refs:
      - url: https://man.openbsd.org/sshd_config
        title: OpenSSH sshd_config Manual
  - uid: mondoo-linux-security-ssh-loglevel-is-appropriate
    title: Ensure SSH LogLevel is appropriate
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      sshd.config.params["LogLevel"] == /INFO|VERBOSE/
    docs:
      desc: |
        This check verifies that the SSH server records authentication activity in enough detail to investigate it.

        The check reads `LogLevel` in `/etc/ssh/sshd_config`, which must be `INFO` or `VERBOSE`. The directive must be present in the file; an absent `LogLevel` fails this check even though `INFO` is the OpenSSH default.

        **Why this matters**

        SSH log lines are frequently the only record that an account was used. At `INFO`, `sshd` records each authentication result with the account name and the source address, which is what makes it possible to answer whether an account was accessed, from where, and when.

        `VERBOSE` adds the fingerprint of the public key that authenticated the session. That single field changes what an investigation can establish. With it, a login is attributable to a specific key rather than to an account that may have several authorized keys held by several people or systems. Without it, an incident involving a shared service account cannot be narrowed down at all, and a key that needs to be revoked cannot be identified from the logs.

        Levels below `INFO`, such as `ERROR` or `QUIET`, suppress successful authentications entirely. The host then logs failures while leaving no trace of the login that actually succeeded, which is precisely backwards for detection.

        Avoid `DEBUG` and above in production. Those levels are explicitly documented as violating user privacy and produce volume that obscures the events worth keeping.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*LogLevel\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows `LogLevel INFO` or `LogLevel VERBOSE`. A failing result shows a lower verbosity such as `QUIET` or `ERROR`, or no output at all, which means the directive is absent.

        Do not verify this check with `sshd -T`. That command prints the effective configuration including OpenSSH's built-in defaults, so on a host where the directive is absent it reports `loglevel INFO` while this check reads the configuration file and fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works.

            To set the SSH LogLevel to an appropriate value, edit the `/etc/ssh/sshd_config` file and add or modify the following line:

            ```bash
            LogLevel VERBOSE
            ```

            or

            ```bash
            LogLevel INFO
            ```

            The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads `/etc/ssh/sshd_config.d/` first, in lexical order. Red Hat Enterprise Linux and Ubuntu ship their own snippets in that directory, so a value added to `/etc/ssh/sshd_config` has no effect once one of those snippets sets the same keyword. Check the directory, and where it is in use put the value in a drop-in numbered below the vendor snippets:

            ```bash
            grep -ri 'LogLevel' /etc/ssh/sshd_config.d/
            touch /etc/ssh/sshd_config.d/00-hardening.conf
            chmod 600 /etc/ssh/sshd_config.d/00-hardening.conf
            echo 'LogLevel VERBOSE' >> /etc/ssh/sshd_config.d/00-hardening.conf
            ```

            Validate the configuration before restarting:

            ```bash
            sshd -t
            ```

            Restart the SSH service to apply the changes:

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the SSH LogLevel to an appropriate value, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            if grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
              SSHD_CONFIG=/etc/ssh/sshd_config.d/00-hardening.conf
              mkdir -p /etc/ssh/sshd_config.d
              touch "$SSHD_CONFIG"
              chmod 600 "$SSHD_CONFIG"
            else
              SSHD_CONFIG=/etc/ssh/sshd_config
            fi

            if grep -q '^LogLevel' "$SSHD_CONFIG"; then
              echo "Updating LogLevel to VERBOSE in $SSHD_CONFIG..."
              sed -i 's/^LogLevel.*/LogLevel VERBOSE/' "$SSHD_CONFIG"
            else
              echo "Adding LogLevel VERBOSE to $SSHD_CONFIG..."
              echo "LogLevel VERBOSE" >> "$SSHD_CONFIG"
            fi

            # Validate the new configuration before restarting. A syntax error here can lock you out of SSH.
            sshd -t

            # Restart the SSH service. The unit is "ssh" on Debian/Ubuntu and "sshd" on other distributions.
            if systemctl list-unit-files | grep -q '^ssh\.service'; then
              systemctl restart ssh
            else
              systemctl restart sshd
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            To set the SSH LogLevel to an appropriate value, use the following Ansible playbook:

            ```yaml
            ---
            - name: Ensure SSH LogLevel is set to VERBOSE
              hosts: all
              become: true

              tasks:
                - name: Detect whether sshd reads drop-in configuration files
                  ansible.builtin.command: grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
                  register: sshd_include
                  changed_when: false
                  failed_when: false

                # sshd uses the first value it reads for each keyword, and the Include at the top of
                # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order, so a drop-in numbered
                # below the vendor snippets is the only place a new value reliably wins.
                - name: Select the configuration file sshd reads first
                  ansible.builtin.set_fact:
                    sshd_target: "{{ '/etc/ssh/sshd_config.d/00-hardening.conf' if sshd_include.rc == 0 else '/etc/ssh/sshd_config' }}"

                - name: Ensure the hardening drop-in exists
                  ansible.builtin.copy:
                    dest: "{{ sshd_target }}"
                    content: ""
                    force: false
                    owner: root
                    group: root
                    mode: '0600'

                - name: Set LogLevel in sshd_config
                  ansible.builtin.lineinfile:
                    path: "{{ sshd_target }}"
                    regexp: '^LogLevel'
                    line: 'LogLevel VERBOSE'
                  register: ssh_config_change

                - name: Gather service facts to detect the SSH unit name
                  ansible.builtin.service_facts:
                  when: ssh_config_change.changed

                - name: Restart the SSH service
                  ansible.builtin.systemd:
                    name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
                    state: restarted
                  when: ssh_config_change.changed
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to raise the SSH log level so that failed logins and key fingerprints are recorded:

            ```ruby
            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            sshd_include = ::File.exist?('/etc/ssh/sshd_config') &&
                           ::File.read('/etc/ssh/sshd_config').match?(%r{^\s*Include\s+/etc/ssh/sshd_config\.d/})
            sshd_config = sshd_include ? '/etc/ssh/sshd_config.d/00-hardening.conf' : '/etc/ssh/sshd_config'
            ssh_service = platform_family?('debian') ? 'ssh' : 'sshd'

            directory '/etc/ssh/sshd_config.d' do
              owner 'root'
              group 'root'
              mode '0755'
              only_if { sshd_include }
            end

            file sshd_config do
              owner 'root'
              group 'root'
              mode '0600'
              action :create_if_missing
            end

            service ssh_service do
              action :nothing
            end

            { 'LogLevel' => 'VERBOSE' }.each do |keyword, value|
              ruby_block "set #{keyword} in sshd_config" do
                block do
                  body = ::File.read(sshd_config)
                  directive = "#{keyword} #{value}"
                  body = if body.match?(/^\s*#{keyword}\b/i)
                           body.gsub(/^\s*#{keyword}\b.*$/i, directive)
                         else
                           "#{body.chomp}\n#{directive}\n"
                         end
                  ::File.write(sshd_config, body)
                end
                not_if { ::File.read(sshd_config).match?(/^\s*#{keyword}\s+#{Regexp.escape(value)}\s*$/i) }
                notifies :restart, "service[#{ssh_service}]", :delayed
              end
            end
            ```
    refs:
      - url: https://man.openbsd.org/sshd_config
        title: OpenSSH sshd_config Manual
  - uid: mondoo-linux-security-ssh-x11-forwarding-is-disabled
    title: Ensure SSH X11 forwarding is disabled
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
