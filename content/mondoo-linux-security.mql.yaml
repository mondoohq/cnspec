  - uid: mondoo-linux-security-core-dumps-are-restricted
    title: Ensure core dumps are restricted
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      limits.entries.any(domain == "*" && type == "hard" && item == "core" && value == "0")

      kernel.parameters['fs.suid_dumpable'] == 0
      if(service("coredump").enabled || service("coredump").running) {
        parse.ini("/etc/systemd/coredump.conf").sections['Coredump']['ProcessSizeMax'] == 0
        parse.ini("/etc/systemd/coredump.conf").sections['Coredump']['Storage'] == 'none'
      }
    docs:
      desc: |
        This check verifies that the system does not write core dumps.

        A core dump is a copy of a process's memory saved to disk when it crashes, and suppressing it requires settings in three separate places. The check reads all three: a hard limit of `0` on core file size for all users in `/etc/security/limits.conf`, the kernel parameter `fs.suid_dumpable` set to `0` so that set-user-ID programs never dump, and, where the systemd `coredump` service is present, `ProcessSizeMax=0` and `Storage=none` in `/etc/systemd/coredump.conf`.

        **Why this matters**

        A core dump contains whatever the process held in memory at the moment it crashed, which is everything it had decrypted, received, or been configured with. Passwords read from a config file at startup, private keys loaded for TLS, session tokens, database credentials, and customer data all appear in the dump in cleartext, regardless of how carefully they were protected on disk.

        The file then sits on the filesystem, frequently in a shared location, and is included in backups and support bundles like any other file. Secrets that were never meant to leave process memory end up copied to places nobody is treating as sensitive.

        Set-user-ID programs deserve the separate control. They run with privileges the invoking user does not have, so a dump from one can expose material the user was never entitled to see. An attacker can also crash such a program deliberately to produce the dump.

        All three settings are needed because they cover different paths. The resource limit governs the kernel writing a core file, `fs.suid_dumpable` governs the privileged case the limit does not reach, and the systemd service intercepts dumps and stores them in its own journal independently of both.

        Where crash analysis is required, capture dumps on a dedicated non-production host rather than enabling them in production.
      audit: |
        Run these commands to inspect the core dump configuration:

        ```bash
        grep -E '^\s*\*\s+hard\s+core' /etc/security/limits.conf /etc/security/limits.d/*.conf
        sysctl fs.suid_dumpable
        grep -E '^(Storage|ProcessSizeMax)' /etc/systemd/coredump.conf
        ```

        A passing result shows a `* hard core 0` limit, `fs.suid_dumpable = 0`, and (where systemd-coredump is active) `Storage=none` with `ProcessSizeMax=0`. A failing result shows any of these settings missing or set to a permissive value.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Run this command to set the core dump size to 0:

                ```bash
                ulimit -c 0
                ```

            2. Make the change permanent:

                Edit `/etc/security/limits.conf` or a separate config file in `/etc/security/limits.d/` and add the following line:

                ```text
                * hard core 0
                ```

                Set the following parameter in `/etc/sysctl.conf` or a `/etc/sysctl.d/` file. Drop-in files must end in `.conf` to be loaded:

                ```ini
                fs.suid_dumpable = 0
                ```

                Run these commands to set the active kernel parameter and reload the persisted drop-in files:

                ```bash
                sysctl -w fs.suid_dumpable=0
                sysctl --system
                ```

            3. Configure systemd-coredump if present:

                If the file `/etc/systemd/coredump.conf` exists, set these options in the `[Coredump]` section:

                ```ini
                [Coredump]
                Storage=none
                ProcessSizeMax=0
                ```

                Run this command to apply the change:

                ```bash
                systemctl daemon-reload
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to restrict core dumps. It will set the appropriate limits, kernel parameters, and update systemd-coredump configuration if present.

            ```bash
            #!/bin/bash
            set -e

            # Set hard core dump limit to 0
            if ! grep -qE '^\*\s+hard\s+core\s+0' /etc/security/limits.conf; then
              echo "Adding hard core limit to /etc/security/limits.conf"
              echo '* hard core 0' | tee -a /etc/security/limits.conf
            fi

            # Always write the compliant fs.suid_dumpable value to a dedicated drop-in so an
            # existing permissive value elsewhere cannot leave a non-compliant setting in place.
            # The file name must end in .conf to be loaded by sysctl.
            echo "Setting fs.suid_dumpable to 0 in /etc/sysctl.d/99-disable-coredump.conf"
            echo 'fs.suid_dumpable = 0' | tee /etc/sysctl.d/99-disable-coredump.conf
            sysctl -w fs.suid_dumpable=0

            # Reload persisted sysctl drop-in files so the saved value takes effect.
            sysctl --system

            # Configure systemd-coredump if present
            if [ -f /etc/systemd/coredump.conf ]; then
              echo "Setting systemd-coredump configuration"

              # Ensure a [Coredump] section header exists exactly once.
              if ! grep -q '^\[Coredump\]' /etc/systemd/coredump.conf; then
                printf '\n[Coredump]\n' | tee -a /etc/systemd/coredump.conf
              fi

              # Update the keys in place if they are present, otherwise add them under the
              # existing [Coredump] header. This avoids appending a second, duplicate section.
              if grep -qE '^\s*#?\s*Storage=' /etc/systemd/coredump.conf; then
                sed -i 's/^\s*#\?\s*Storage=.*/Storage=none/' /etc/systemd/coredump.conf
              else
                sed -i '/^\[Coredump\]/a Storage=none' /etc/systemd/coredump.conf
              fi

              if grep -qE '^\s*#?\s*ProcessSizeMax=' /etc/systemd/coredump.conf; then
                sed -i 's/^\s*#\?\s*ProcessSizeMax=.*/ProcessSizeMax=0/' /etc/systemd/coredump.conf
              else
                sed -i '/^\[Coredump\]/a ProcessSizeMax=0' /etc/systemd/coredump.conf
              fi

              systemctl daemon-reexec
            fi

            echo "Core dump restrictions applied."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to restrict core dumps:

            ```yaml
            ---
            - name: Disable core dumps on Linux
              hosts: all
              become: true

              tasks:
                - name: Set hard core dump limit to 0 in limits.d
                  ansible.builtin.copy:
                    dest: /etc/security/limits.d/99-disable-core.conf
                    owner: root
                    group: root
                    mode: '0644'
                    content: |
                      * hard core 0

                - name: Disable core dumps via sysctl
                  ansible.builtin.sysctl:
                    name: fs.suid_dumpable
                    value: '0'
                    sysctl_file: /etc/sysctl.d/99-disable-coredump.conf
                    state: present
                    sysctl_set: true
                    reload: yes

                - name: Check if systemd-coredump config exists
                  ansible.builtin.stat:
                    path: /etc/systemd/coredump.conf
                  register: coredump_conf

                - name: Set systemd-coredump options if applicable
                  block:
                    - name: Ensure /etc/systemd/coredump.conf exists with correct settings
                      ansible.builtin.ini_file:
                        path: /etc/systemd/coredump.conf
                        section: Coredump
                        option: "{{ item.option }}"
                        value: "{{ item.value }}"
                      loop:
                        - { option: 'Storage', value: 'none' }
                        - { option: 'ProcessSizeMax', value: '0' }

                    - name: Reload systemd daemon after coredump config change
                      ansible.builtin.command: systemctl daemon-reexec
                  when: coredump_conf.stat.exists
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict core dumps:

            ```ruby
            user_ulimit '*' do
              core_hard_limit 0
              filename '99-disable-core.conf'
            end

            sysctl 'fs.suid_dumpable' do
              value 0
            end

            coredump_conf = '/etc/systemd/coredump.conf'

            { 'Storage' => 'none', 'ProcessSizeMax' => '0' }.each do |keyword, value|
              ruby_block "set #{keyword} in coredump.conf" do
                block do
                  body = ::File.read(coredump_conf)
                  directive = "#{keyword}=#{value}"
                  body = if body.match?(/^\s*#?\s*#{keyword}=/)
                           body.gsub(/^\s*#?\s*#{keyword}=.*$/, directive)
                         else
                           body.sub(/^\[Coredump\]$/, "[Coredump]\n#{directive}")
                         end
                  ::File.write(coredump_conf, body)
                end
                not_if { ::File.read(coredump_conf).match?(/^#{keyword}=#{Regexp.escape(value)}\s*$/) }
                only_if { ::File.exist?(coredump_conf) }
              end
            end
            ```
    refs:
      - url: https://www.kernel.org/doc/html/latest/admin-guide/sysctl/
        title: Linux Kernel sysctl Documentation
  - uid: mondoo-linux-security-address-space-layout-randomization-aslr-is-enabled
    title: Ensure address space layout randomization (ASLR) is enabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters["kernel.randomize_va_space"] == 2
    docs:
      desc: |
        This check verifies that Address Space Layout Randomization is fully enabled.

        ASLR places a program's stack, heap, shared libraries, and executable at different memory addresses every time it runs, so an attacker cannot know in advance where anything is. The check reads the kernel parameter `kernel.randomize_va_space`, which must be `2`. A value of `1` randomizes everything except the `brk` heap, and `0` turns randomization off entirely.

        **Why this matters**

        Memory corruption exploits need addresses. A stack overflow is only useful if the attacker can name somewhere to jump to, and a heap overflow only pays off if they know what sits next to the buffer they overran. Without randomization those addresses are the same on every machine running the same build, so an exploit written once works everywhere.

        ASLR removes that certainty. The attacker must either find a separate information leak to recover the layout or guess, and a wrong guess crashes the process instead of exploiting it. That failure is loud, and the restart comes back with a fresh layout, so each attempt starts over.

        The difference between full and partial randomization is worth keeping. In partial mode the `brk` heap stays at a fixed offset from the executable, so applications that allocate through `brk` still present a predictable region while everything around it moves.

        ASLR is also the assumption the other memory protections rest on. Stack canaries and non-executable memory both depend on the attacker not being able to simply look up where to write.
      audit: |
        Run this command to read the active kernel parameter:

        ```bash
        sysctl kernel.randomize_va_space
        ```

        A passing result shows `kernel.randomize_va_space = 2`. Any other value, or no output, is a failing result that requires enabling full ASLR.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Set the ASLR value to 2:

                Run this command to set the active kernel parameter:

                ```bash
                sysctl -w kernel.randomize_va_space=2
                sysctl --system
                ```

            2. Make the change permanent:

                Edit `/etc/sysctl.conf` or a file in `/etc/sysctl.d/` and add the following line:

                ```ini
                kernel.randomize_va_space = 2
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to set ASLR. It will check if the setting is already configured and apply it if not.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^kernel.randomize_va_space' /etc/sysctl.conf 2>/dev/null; then
              echo "Updating kernel.randomize_va_space to 2 in /etc/sysctl.conf"
              sed -i 's/^kernel.randomize_va_space.*/kernel.randomize_va_space = 2/' /etc/sysctl.conf
            else
              echo "Setting kernel.randomize_va_space to 2 in /etc/sysctl.d/99-aslr.conf"
              echo 'kernel.randomize_va_space = 2' | tee /etc/sysctl.d/99-aslr.conf
            fi

            echo "Applying kernel.randomize_va_space=2"
            sysctl -w kernel.randomize_va_space=2
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set ASLR:

            ```yaml
            ---
            - name: Set ASLR to 2 on Linux systems
              hosts: all
              become: true

              tasks:
                - name: Set kernel.randomize_va_space to 2
                  ansible.builtin.sysctl:
                    name: kernel.randomize_va_space
                    value: '2'
                    sysctl_file: /etc/sysctl.d/99-aslr.conf
                    state: present
                    sysctl_set: true
                    reload: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to enable full address space layout randomization:

            ```ruby
            sysctl 'kernel.randomize_va_space' do
              value 2
            end
            ```
    refs:
      - url: https://docs.kernel.org/admin-guide/sysctl/kernel.html#randomize-va-space
        title: "Linux Kernel Documentation: kernel.randomize_va_space"
  - uid: mondoo-linux-security-restrict-kernel-address-access
    title: Restrict access to kernel addresses
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters["kernel.kptr_restrict"] == 2
    docs:
      desc: |
        This check verifies that the kernel hides its own memory addresses from every reader, including privileged ones.

        Pointer values printed through `/proc`, `/sys`, and kernel log messages are replaced with zeros, so the layout of kernel memory stays unknown to anything reading them. The check reads the kernel parameter `kernel.kptr_restrict`, which must be `2`. A value of `1` hides addresses from unprivileged users only, and `0` prints them to anyone.

        **Why this matters**

        Modern kernels randomize their own load address at boot, so an attacker who has found a memory corruption bug still has to learn where the kernel actually lives before they can aim at anything. A single leaked kernel pointer solves that: subtract the known offset of the symbol from the leaked address and the entire kernel layout falls out.

        Pointers leak through interfaces that look harmless. `/proc/kallsyms`, `/proc/modules`, files under `/sys/kernel/`, and kernel log messages all print addresses, and any one of them is enough to defeat randomization and turn an unreliable crash into a working privilege escalation.

        Hiding addresses from everyone rather than only from unprivileged users matters because privileged readers are not always trustworthy. A compromised service running as root, or a process holding a capability it does not need, still receives real addresses under the weaker setting.

        Debuggers and profilers such as `perf` rely on symbol addresses and lose resolution when addresses are hidden from everyone. Where profiling is required, grant the specific capability to the profiling tool rather than weakening this protection for the whole system.
      audit: |
        Run this command to read the active kernel parameter:

        ```bash
        sysctl kernel.kptr_restrict
        ```

        A passing result shows `kernel.kptr_restrict = 2`. Any other value, or no output, is a failing result that requires restricting kernel pointer exposure.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Set the kptr_restrict value to 2:

                Run this command to set the active kernel parameter:

                ```bash
                sysctl -w kernel.kptr_restrict=2
                sysctl --system
                ```

            2. Make the change permanent:

                Edit `/etc/sysctl.conf` or a file in `/etc/sysctl.d/` and add the following line:

                ```ini
                kernel.kptr_restrict = 2
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to restrict kernel address access. It will check if the setting is already configured and apply it if not.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^kernel.kptr_restrict' /etc/sysctl.conf 2>/dev/null; then
              echo "Updating kernel.kptr_restrict to 2 in /etc/sysctl.conf"
              sed -i 's/^kernel.kptr_restrict.*/kernel.kptr_restrict = 2/' /etc/sysctl.conf
            else
              echo "Setting kernel.kptr_restrict to 2 in /etc/sysctl.d/99-kptr-restrict.conf"
              echo 'kernel.kptr_restrict = 2' | tee /etc/sysctl.d/99-kptr-restrict.conf
            fi

            echo "Applying kernel.kptr_restrict=2"
            sysctl -w kernel.kptr_restrict=2
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to restrict kernel address access:

            ```yaml
            ---
            - name: Restrict kernel address access on Linux systems
              hosts: all
              become: true
              tasks:
                - name: Set kernel.kptr_restrict to 2
                  ansible.builtin.sysctl:
                    name: kernel.kptr_restrict
                    value: '2'
                    sysctl_file: /etc/sysctl.d/99-kptr-restrict.conf
                    state: present
                    sysctl_set: true
                    reload: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to hide kernel pointers from unprivileged users:

            ```ruby
            sysctl 'kernel.kptr_restrict' do
              value 2
            end
            ```
    refs:
      - url: https://access.redhat.com/articles/7133962
        title: "Red Hat Customer Portal: Implications of enabling kptr_restrict=2"
      - url: https://docs.kernel.org/admin-guide/sysctl/kernel.html#kptr-restrict
        title: "Linux Kernel Documentation: kernel.kptr_restrict"
  - uid: mondoo-linux-security-prevent-mapping-low-memory-addresses
    title: Prevent mapping of low memory addresses
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters["vm.mmap_min_addr"] >= 65536
    docs:
      desc: |
        This check verifies that processes cannot map memory at low addresses.

        Reserving the bottom of every address space is what turns a kernel NULL pointer bug into a crash rather than into root, because there is nowhere for an attacker to place the data the kernel would follow the null pointer into. The check reads the kernel parameter `vm.mmap_min_addr`, which must be `65536` or higher, holding the lowest 64KB of every address space empty.

        **Why this matters**

        A NULL pointer dereference in kernel code is normally just a crash. It becomes a root exploit when the attacker can put data at address zero first: the kernel follows the null pointer into memory the attacker controls and executes whatever it finds there.

        Reserving the low addresses closes that conversion. The attacker can still crash the kernel, but they cannot choose what the kernel finds when it dereferences the null pointer, which reduces a large class of exploitable bugs to denial of service.

        This was not a theoretical concern. Before the protection was introduced and adopted as a default, mapping a payload at address zero was a standard technique, and several widely used local root exploits worked exactly this way.

        A few programs legitimately need low mappings, notably DOS and 16-bit emulation such as `dosemu`, some `qemu` modes, and older WINE configurations. Confirm nothing on the host depends on it before applying the setting, and grant `CAP_SYS_RAWIO` to the specific program rather than lowering the system-wide reservation.
      audit: |
        Run this command to read the active kernel parameter:

        ```bash
        sysctl vm.mmap_min_addr
        ```

        A passing result shows `vm.mmap_min_addr` set to `65536` or higher. A lower value, or no output, is a failing result.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Caveat: some low-level applications need to map low memory.** Setting `vm.mmap_min_addr = 65536` blocks mapping the lowest memory addresses, which can break Wine, DOSEMU, and qemu workloads that require it. Confirm that no application on this host depends on low-memory mapping before applying.

            1. Set the mmap_min_addr value to 65536:

                Run this command to set the active kernel parameter:

                ```bash
                sysctl -w vm.mmap_min_addr=65536
                sysctl --system
                ```
            2. Make the change permanent:

                Edit `/etc/sysctl.conf` or a file in `/etc/sysctl.d/` and add the following line:

                ```ini
                vm.mmap_min_addr = 65536
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            **Caveat: some low-level applications need to map low memory.** This setting can break Wine, DOSEMU, and qemu workloads that require mapping the lowest memory addresses. Confirm that no application on this host depends on low-memory mapping before applying. Use this Bash script to prevent mapping of low memory addresses. It will check if the setting is already configured and apply it if not.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^vm.mmap_min_addr' /etc/sysctl.conf 2>/dev/null; then
              echo "Updating vm.mmap_min_addr to 65536 in /etc/sysctl.conf"
              sed -i 's/^vm.mmap_min_addr.*/vm.mmap_min_addr = 65536/' /etc/sysctl.conf
            else
              echo "Setting vm.mmap_min_addr to 65536 in /etc/sysctl.d/99-mmap-min-addr.conf"
              echo 'vm.mmap_min_addr = 65536' | tee /etc/sysctl.d/99-mmap-min-addr.conf
            fi

            echo "Applying vm.mmap_min_addr=65536"
            sysctl -w vm.mmap_min_addr=65536
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to prevent mapping of low memory addresses:

            ```yaml
            ---
            - name: Prevent mapping of low memory addresses on Linux systems
              hosts: all
              become: true
              tasks:
                - name: Set vm.mmap_min_addr to 65536
                  ansible.builtin.sysctl:
                    name: vm.mmap_min_addr
                    value: '65536'
                    sysctl_file: /etc/sysctl.d/99-mmap-min-addr.conf
                    state: present
                    sysctl_set: true
                    reload: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to prevent mapping of low memory addresses:

            ```ruby
            sysctl 'vm.mmap_min_addr' do
              value 65536
            end
            ```
    refs:
      - url: https://wiki.debian.org/mmap_min_addr
        title: "Debian Wiki: mmap_min_addr"
      - url: https://docs.kernel.org/admin-guide/sysctl/vm.html#mmap-min-addr
        title: "Linux Kernel Documentation: vm.mmap_min_addr"
  - uid: mondoo-linux-security-restrict-dmesg-access
    title: Ensure dmesg access is restricted
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters["kernel.dmesg_restrict"] == 1
    docs:
      desc: |
        This check verifies that reading the kernel ring buffer is restricted to privileged processes.

        The ring buffer holds the messages the kernel emits about hardware, drivers, memory, and its own internal state, and by default any local account can read all of it with `dmesg`. The check reads the kernel parameter `kernel.dmesg_restrict`, which must be `1`.

        **Why this matters**

        The ring buffer is a reconnaissance source. It describes the hardware and virtualization platform the host runs on, which drivers and modules are loaded, how memory is laid out, and which security features the kernel enabled at boot. An attacker who has landed in an unprivileged account learns from a single command what kind of machine they are on and which exploits are worth attempting.

        It also carries material that defeats other protections. Kernel messages routinely include memory addresses, and an address printed into the buffer is exactly the leak that kernel address randomization exists to prevent. Oops and warning traces are the richest source, and they are generated precisely when something has gone wrong in a way an attacker may be probing for deliberately.

        Restricting the buffer does not affect logging. `systemd-journald` and `rsyslog` read it with the privileges they already hold, so the messages still reach the system logs and the tooling that consumes them.

        Administrators who need `dmesg` can still reach it through `sudo`, which has the additional benefit of recording who read it.
      audit: |
        Run this command to read the active kernel parameter:

        ```bash
        sysctl kernel.dmesg_restrict
        ```

        A passing result shows `kernel.dmesg_restrict = 1`. Any other value, or no output, is a failing result that requires restricting dmesg access.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            1. Set the dmesg_restrict value to 1:

                Run this command to set the active kernel parameter:

                ```bash
                sysctl -w kernel.dmesg_restrict=1
                sysctl --system
                ```

            2. Make the change permanent:

                Edit `/etc/sysctl.conf` or a file in `/etc/sysctl.d/` and add the following line:

                ```ini
                kernel.dmesg_restrict = 1
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to restrict dmesg access. It will check if the setting is already configured and apply it if not.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^kernel.dmesg_restrict' /etc/sysctl.conf 2>/dev/null; then
              echo "Updating kernel.dmesg_restrict to 1 in /etc/sysctl.conf"
              sed -i 's/^kernel.dmesg_restrict.*/kernel.dmesg_restrict = 1/' /etc/sysctl.conf
            else
              echo "Setting kernel.dmesg_restrict to 1 in /etc/sysctl.d/99-dmesg-restrict.conf"
              echo 'kernel.dmesg_restrict = 1' | tee /etc/sysctl.d/99-dmesg-restrict.conf
            fi

            echo "Applying kernel.dmesg_restrict=1"
            sysctl -w kernel.dmesg_restrict=1
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to restrict dmesg access:

            ```yaml
            ---
            - name: Restrict dmesg access on Linux systems
              hosts: all
              become: true

              tasks:
                - name: Set kernel.dmesg_restrict to 1
                  ansible.builtin.sysctl:
                    name: kernel.dmesg_restrict
                    value: '1'
                    sysctl_file: /etc/sysctl.d/99-dmesg-restrict.conf
                    state: present
                    sysctl_set: true
                    reload: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict dmesg access to privileged users:

            ```ruby
            sysctl 'kernel.dmesg_restrict' do
              value 1
            end
            ```
    refs:
      - url: https://docs.kernel.org/admin-guide/sysctl/kernel.html#dmesg-restrict
        title: "Linux Kernel Documentation: kernel.dmesg_restrict"
  - uid: mondoo-linux-security-prevent-nonprivileged-ebpf-access
    title: Prevent non-privileged eBPF access
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
    mql: |
      kernel.parameters["kernel.unprivileged_bpf_disabled"] >= 1
    docs:
      desc: |
        This check verifies that unprivileged accounts cannot load eBPF programs into the kernel.

        eBPF lets a program upload code that the kernel then runs in its own address space, which is a capability that should be reserved for processes holding `CAP_BPF` or `CAP_SYS_ADMIN`. The check reads the kernel parameter `kernel.unprivileged_bpf_disabled`, which must be `1` or higher. At `1` the restriction cannot be undone without a reboot; at `2` it can be re-enabled at runtime; at `0` any account may call `bpf()`.

        **Why this matters**

        The only thing standing between an uploaded eBPF program and the kernel's memory is the verifier, a static analyzer that must prove the program is safe before it loads. That makes the verifier a security boundary, and it is a boundary implemented as a complex analysis of untrusted code.

        It has been broken repeatedly. Bugs in its bounds tracking have allowed crafted programs to pass verification and then perform out-of-bounds reads and writes against kernel memory, each of which is a straightforward local privilege escalation available to any unprivileged account on the host.

        Reserving eBPF for privileged processes removes that boundary from the attack surface rather than trusting the analysis to be correct. It is the difference between a defense that has to be right every time and one that is not exposed to the attacker in the first place.

        Observability tooling is unaffected, since `bpftrace`, `bcc`, Cilium, and similar tools already run with the required capability. Confirm before applying that no unprivileged workload loads its own eBPF programs. Seccomp-bpf, used by browsers and sandboxing libraries, is a separate mechanism and is not affected.
      audit: |
        Run this command to read the active kernel parameter:

        ```bash
        sysctl kernel.unprivileged_bpf_disabled
        ```

        A passing result shows `kernel.unprivileged_bpf_disabled` set to `1` or higher. A value of `0`, or no output, is a failing result.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            A value of `1` disables unprivileged eBPF but can be toggled back to `0` at runtime. A value of `2` is the stronger setting because it becomes immutable until the next reboot. Use `2` where you do not run eBPF tooling that needs to be reconfigured at runtime; both values satisfy this check.

            1. Set the unprivileged_bpf_disabled value to 1:

                Run this command to set the active kernel parameter:

                ```bash
                sysctl -w kernel.unprivileged_bpf_disabled=1
                sysctl --system
                ```

            2. Make the change permanent:

                Edit `/etc/sysctl.conf` or a file in `/etc/sysctl.d/` and add the following line:

                ```ini
                kernel.unprivileged_bpf_disabled = 1
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to prevent non-privileged eBPF access. It will check if the setting is already configured and apply it if not.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^kernel.unprivileged_bpf_disabled' /etc/sysctl.conf 2>/dev/null; then
              echo "Updating kernel.unprivileged_bpf_disabled to 1 in /etc/sysctl.conf"
              sed -i 's/^kernel.unprivileged_bpf_disabled.*/kernel.unprivileged_bpf_disabled = 1/' /etc/sysctl.conf
            else
              echo "Setting kernel.unprivileged_bpf_disabled to 1 in /etc/sysctl.d/99-unprivileged-bpf.conf"
              echo 'kernel.unprivileged_bpf_disabled = 1' | tee /etc/sysctl.d/99-unprivileged-bpf.conf
            fi

            echo "Applying kernel.unprivileged_bpf_disabled=1"
            sysctl -w kernel.unprivileged_bpf_disabled=1
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to prevent non-privileged eBPF access:

            ```yaml
            ---
            - name: Prevent non-privileged eBPF access on Linux systems
              hosts: all
              become: true
              tasks:
                - name: Set kernel.unprivileged_bpf_disabled to 1
                  ansible.builtin.sysctl:
                    name: kernel.unprivileged_bpf_disabled
                    value: '1'
                    sysctl_file: /etc/sysctl.d/99-unprivileged-bpf.conf
                    state: present
                    sysctl_set: true
                    reload: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to prevent non-privileged eBPF access:

            ```ruby
            sysctl 'kernel.unprivileged_bpf_disabled' do
              value 1
            end
            ```
    refs:
      - url: https://docs.kernel.org/admin-guide/sysctl/kernel.html#unprivileged-bpf-disabled
        title: "Linux Kernel Documentation: kernel.unprivileged_bpf_disabled"
  - uid: mondoo-linux-security-prevent-nonprivileged-ptrace-access
    title: Restrict non-privileged access to ptrace
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
      file("/proc/sys/kernel/yama/ptrace_scope").exists
    mql: |
      kernel.parameters["kernel.yama.ptrace_scope"] >= 2
    docs:
      desc: |
        This check verifies that attaching a debugger to another process requires privilege.

        The Yama security module governs who may trace whom, and its scope setting decides whether tracing is unrestricted, limited to a process's own children, reserved for privileged processes, or blocked entirely. The check reads the kernel parameter `kernel.yama.ptrace_scope`, which must be `2` or higher. The permissive values are `0`, allowing any process to trace any other process of the same user, and `1`, limiting tracing to direct descendants. A value of `3` blocks attachment completely.

        **Why this matters**

        Attaching to a process gives complete control of it: the tracer can read and write the target's memory and inject code. Under the permissive settings this crosses no privilege boundary the operating system recognizes, because both processes belong to the same user.

        That is exactly the problem after a compromise. An attacker who lands in one process running as an application account can attach to every other process owned by that account and take whatever is held in memory: private keys in a running `ssh-agent`, database credentials read from a config file at startup, decrypted session tokens, TLS keys. None of that exists on disk in a form file permissions could protect.

        Restricting tracing forces the attacker to escalate privileges before they can harvest secrets from other processes, which is both a real barrier and a much noisier one.

        Choose `3` where nothing on the host needs to attach a debugger, noting that it cannot be lowered without a reboot. Both settings break unprivileged use of `gdb`, `strace`, and crash reporters, so grant `CAP_SYS_PTRACE` to the specific tools that require it.
      audit: |
        Run this command to read the active kernel parameter:

        ```bash
        sysctl kernel.yama.ptrace_scope
        ```

        A passing result shows `kernel.yama.ptrace_scope` set to `2` or higher. A lower value, or no output, is a failing result.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Caveat: this can break debugging and monitoring tools.** A value of `2` (admin-only) or `3` (ptrace disabled) prevents non-privileged use of ptrace, which breaks debuggers such as `gdb` and `strace`, userspace crash handlers, and APM or observability agents that rely on ptrace. Confirm that no required tooling on this host depends on ptrace before applying.

            1. Set the ptrace_scope value to 2:

                Run this command to set the active kernel parameter:

                ```bash
                sysctl -w kernel.yama.ptrace_scope=2
                sysctl --system
                ```
            2. Make the change permanent:

                Edit `/etc/sysctl.conf` or a file in `/etc/sysctl.d/` and add the following line:

                ```ini
                kernel.yama.ptrace_scope = 2
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            **Caveat: this can break debugging and monitoring tools.** A value of `2` or `3` breaks `gdb`, `strace`, userspace crash handlers, and APM or observability agents that rely on ptrace. Confirm that no required tooling on this host depends on ptrace before applying. Use this Bash script to restrict non-privileged access to ptrace. It will check if the setting is already configured and apply it if not.

            ```bash
            #!/bin/bash
            set -e

            if grep -q '^kernel.yama.ptrace_scope' /etc/sysctl.conf 2>/dev/null; then
              echo "Updating kernel.yama.ptrace_scope to 2 in /etc/sysctl.conf"
              sed -i 's/^kernel.yama.ptrace_scope.*/kernel.yama.ptrace_scope = 2/' /etc/sysctl.conf
            else
              echo "Setting kernel.yama.ptrace_scope to 2 in /etc/sysctl.d/99-ptrace-scope.conf"
              echo 'kernel.yama.ptrace_scope = 2' | tee /etc/sysctl.d/99-ptrace-scope.conf
            fi

            echo "Applying kernel.yama.ptrace_scope=2"
            sysctl -w kernel.yama.ptrace_scope=2
            sysctl --system
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to restrict non-privileged access to ptrace:

            ```yaml
            ---
            - name: Restrict non-privileged access to ptrace on Linux systems
              hosts: all
              become: true
              tasks:
                - name: Set kernel.yama.ptrace_scope to 2
                  ansible.builtin.sysctl:
                    name: kernel.yama.ptrace_scope
                    value: '2'
                    sysctl_file: /etc/sysctl.d/99-ptrace-scope.conf
                    state: present
                    sysctl_set: true
                    reload: yes
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to restrict non-privileged access to ptrace:

            ```ruby
            sysctl 'kernel.yama.ptrace_scope' do
              value 2
            end
            ```
    refs:
      - url: https://www.kernel.org/doc/Documentation/security/Yama.txt
        title: "Linux Kernel Documentation: Yama"
  - uid: mondoo-linux-security-disable-loading-of-atm-module
    title: Ensure loading of the ATM module is disabled
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
      asset.runtime != "docker-container"
      kernel.modules.any(name == "atm")
    mql: |
      kernel.module("atm").blacklisted
      kernel.module("atm").installBypass
    docs:
      desc: |
        This check verifies that the ATM kernel module cannot be loaded.

        Asynchronous Transfer Mode is a cell-switched networking technology from the era of DSL aggregation and telecom backbones, and the `atm` module provides its `AF_ATM` socket family. The check reads the modprobe configuration in `/etc/modprobe.d/`, which must both blacklist the module and redirect its install command to `/bin/false`. Both directives are required: blacklisting alone stops automatic loading but still allows an explicit `modprobe atm`.

        **Why this matters**

        Linux autoloads a protocol module the first time any process asks for a socket of that address family. An unprivileged local user can therefore pull ATM into the running kernel with a single `socket()` call, reaching code the host never intentionally runs and that nobody is watching for crashes or anomalies.

        That combination is the risk: rarely exercised kernel code with an entry point available to any local user. A memory-safety bug there becomes a local privilege escalation, and because the subsystem is otherwise unused, there is no operational signal when it is touched.

        Leave the module blocked unless this host terminates ATM or DSL links directly. Blocking it has no effect on Ethernet, Wi-Fi, or any IP networking.
      audit: |
        Run this command to confirm the `atm` module is blacklisted and its installation is disabled:

        ```bash
        grep -E '^\s*(blacklist|install)\s+atm\b' /etc/modprobe.d/*.conf
        ```

        A passing result shows both a `blacklist atm` line and an `install atm /bin/false` line. A failing result shows either directive missing.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Create or edit the file `/etc/modprobe.d/atm.conf` and add the following lines to disable loading and installation of the ATM module:

            ```text
            blacklist atm
            install atm /bin/false
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to disable the ATM module by creating the appropriate modprobe configuration file:

            ```bash
            #!/bin/bash
            set -e

            echo "Unload ATM module if currently loaded..."
            modprobe -r atm || true
            echo "ATM module disabled."

            echo "Disabling ATM module..."
            cat <<EOF > /etc/modprobe.d/atm.conf
            blacklist atm
            install atm /bin/false
            EOF
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to disable the ATM module:

            ```yaml
            ---
            - name: Disable ATM module on Linux systems
              hosts: all
              become: true

              tasks:
                - name: Create modprobe config to disable ATM module
                  ansible.builtin.copy:
                    dest: /etc/modprobe.d/atm.conf
                    owner: root
                    group: root
                    mode: '0644'
                    content: |
                      blacklist atm
                      install atm /bin/false
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop the ATM module from loading:

            ```ruby
            kernel_module 'atm' do
              action %i(disable blacklist)
            end
            ```
    refs:
      - url: https://www.kernel.org/doc/html/latest/admin-guide/sysctl/
        title: Linux Kernel sysctl Documentation
  - uid: mondoo-linux-security-disable-loading-of-can-module
    title: Ensure loading of the CAN module is disabled
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
