      - uid: mondooLinuxSecurityKexAlgos
        title: Define the hardened key exchange algorithms for all SSH configurations
        mql: |
          if( package('openssh-server').version  >= semver("6") && package('openssh-server').version  < semver("7") ) {
            return ["curve25519-sha256@libssh.org"]
          }
          if( package('openssh-server').version  >= semver("7") && package('openssh-server').version  < semver("8") ) {
            return ["curve25519-sha256@libssh.org","diffie-hellman-group18-sha512"]
          }
          if( package('openssh-server').version  >= semver("8") && package('openssh-server').version  < semver("8.6") ) {
            return ["sntrup4591761x25519-sha512@tinyssh.org","curve25519-sha256@libssh.org","diffie-hellman-group18-sha512"]
          }
          return ["sntrup761x25519-sha512@openssh.com","curve25519-sha256@libssh.org","diffie-hellman-group18-sha512"]
    mql: |
      sshd.config.kexs != empty
      sshd.config.kexs.containsOnly(props.mondooLinuxSecurityKexAlgos)
    docs:
      desc: |
        This check verifies that the SSH server offers only strong key exchange algorithms.

        Key exchange establishes the session keys that the cipher and MAC then use, so it is the foundation the rest of the session rests on. The check reads the `KexAlgorithms` directive in `/etc/ssh/sshd_config` and requires that every algorithm it names appears in the approved list carried by this policy's property. The directive must be present; a configuration that relies on OpenSSH's compiled-in default fails this check.

        **Why this matters**

        Key exchange establishes the session keys that the cipher and MAC then use. It is the foundation the rest of the session rests on, and a weakness here is not mitigated by a strong cipher, because the attacker derives the same keys the endpoints do.

        The algorithms worth excluding are excluded for concrete reasons. `diffie-hellman-group1-sha1` uses a fixed 1024-bit group, which is within reach of a well-resourced attacker who precomputes against that single widely shared group, and the Logjam work showed that a downgrade to such a group can be forced during negotiation. The remaining SHA-1 based exchanges inherit the weakened collision resistance of that hash.

        Key exchange also has a property the other algorithm choices do not: it determines whether a session recorded today can be decrypted later. An attacker who captures traffic now and obtains the host key afterward can recover the contents of any session whose key exchange did not provide forward secrecy.

        Prefer `curve25519-sha256` and the group-exchange and ECDH variants over SHA-256 or better. Where post-quantum resistance is a requirement, current OpenSSH releases offer hybrid exchanges that combine a classical algorithm with a post-quantum one, which protects recorded traffic against later decryption.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*KexAlgorithms\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows an explicit `KexAlgorithms` directive listing only approved algorithms. A failing result lists a weak algorithm, such as `diffie-hellman-group1-sha1` or another SHA-1 based exchange, or produces no output at all, which means the directive is absent.

        Do not verify this check with `sshd -T`. That command prints the effective configuration including OpenSSH's built-in defaults, so on a host where the directive is absent it reports `the full built-in key exchange list` while this check reads the configuration file and fails.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works. A key exchange list that your SSH clients do not support is one of the most common causes of a total SSH lockout, so verify the new connection from each client type you rely on.

            To configure SSH to use only approved key exchange algorithms, edit the `/etc/ssh/sshd_config` file and add or modify the `KexAlgorithms` parameter based on your `openssh-server` version.

            First, determine your SSH server version:

            ```bash
            cnquery run -c "package('openssh-server').version"
            ```

            Then, based on the version, set the appropriate `KexAlgorithms` value:

            - **OpenSSH 6.x**:
              ```text
              KexAlgorithms curve25519-sha256@libssh.org
              ```

            - **OpenSSH 7.x**:
              ```text
              KexAlgorithms curve25519-sha256@libssh.org,diffie-hellman-group18-sha512
              ```

            - **OpenSSH 8.0 to 8.5**:
              ```text
              KexAlgorithms sntrup4591761x25519-sha512@tinyssh.org,curve25519-sha256@libssh.org,diffie-hellman-group18-sha512
              ```

            - **OpenSSH 8.6 or later**:
              ```text
              KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256@libssh.org,diffie-hellman-group18-sha512
              ```

