              if [ -n "$(systemctl list-unit-files "$unit" --no-legend 2>/dev/null)" ]; then
                systemctl stop "$unit"
                systemctl disable "$unit"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable `smb` and `smbd`:

            ```yaml
            ---
            - name: Stop and disable Samba services
              hosts: all
              become: true

              tasks:
                - name: Stop and disable Samba services
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: no
                  loop:
                    - smb
                    - smbd
                  register: samba_units
                  failed_when:
                    - samba_units.failed
