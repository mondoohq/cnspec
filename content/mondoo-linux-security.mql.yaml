  - uid: mondoo-linux-security-tftp-server-is-not-enabled
    title: Ensure TFTP server is stopped and not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      systemd.socket("tftp").enabled == false
      systemd.socket("tftp").running == false
    docs:
      desc: |
        This check verifies that the `tftp` systemd socket unit is neither running nor enabled.

        **Why this matters**

        TFTP has no authentication of any kind. There is no username, no password, and no credential exchange in the protocol. Access is governed entirely by the daemon's configured root directory and the filesystem permissions beneath it.

        Anyone who can reach UDP port 69 can therefore read any file the daemon can read. Where the service was configured with write access enabled, which is common because TFTP is usually deployed for network boot and device firmware workflows that need it, they can also write files. A writable TFTP root on a host is a way for an unauthenticated attacker to place content on the filesystem, and where that directory is shared with a web root or a boot path, that content gets executed.

        The protocol runs over UDP with no session state, so source addresses can be forged and the transfers are hard to attribute after the fact.

        Where TFTP is required for PXE boot or device provisioning, run it read-only, confine it to an isolated provisioning network, and keep only boot artifacts under its root. Everywhere else, disable the socket unit.
      audit: |
        Run this command to confirm the TFTP socket units are stopped and disabled:

        ```bash
        systemctl is-active tftp.socket
        systemctl is-enabled tftp.socket
        ```

        A passing result reports `inactive` and `disabled` for every listed socket unit. A failing result reports any socket as `active` or `enabled`.
      remediation:
        - id: cli
          desc: |
            **Using CLI**

            Run these commands to stop and disable tftp:

            ```bash
            systemctl stop tftp.socket
            systemctl disable tftp.socket
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to stop and disable the TFTP server.

            ```bash
            #!/bin/bash
            set -e

            echo "Stopping and disabling TFTP service..."
            systemctl stop tftp.socket
            systemctl disable tftp.socket
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable tftp:

            ```yaml
            ---
            - name: Stop and disable TFTP server
              hosts: all
              become: true

              tasks:
                - name: Ensure TFTP server is stopped and disabled
                  ansible.builtin.systemd:
                    name: tftp.socket
                    state: stopped
                    enabled: no
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to stop and disable the TFTP socket:

            ```ruby
            systemd_unit 'tftp.socket' do
              action %i(stop disable)
              only_if 'systemctl cat tftp.socket'
            end
            ```
