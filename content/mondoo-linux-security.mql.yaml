queries:
  - uid: mondoo-linux-security-aide-is-installed
    title: Ensure Advanced Intrusion Detection Environment (AIDE) is installed
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      package("aide").installed
    docs:
      desc: |
        This check verifies that the Advanced Intrusion Detection Environment is installed, by confirming the `aide` package is present.

        AIDE is a host-based file integrity checker. It records a cryptographic hash, along with size, ownership, permissions, and timestamps, for each file an administrator lists in its configuration, and stores that snapshot in a local database. A later run compares the live filesystem against the database and reports every file that changed. The package is `aide` on yum, dnf, apt-get, and zypper based distributions alike. This check looks only for its presence; a companion check in this policy confirms that the comparison actually runs on a schedule.

        **Why this matters**

        An attacker who reaches root on a host wants to stay. The usual mechanisms are all writes to files: a replaced `sshd` or `login` binary that records passwords, a new setuid executable in a system directory, an added line in a cron file or a systemd unit, a modified shared library loaded by every process. None of these produce an alert on their own. The system keeps running normally, which is exactly the point.

        File integrity monitoring is what turns those writes into events. When the hash of `/usr/sbin/sshd` no longer matches the baseline and no package transaction explains it, the host has been modified by something outside the software supply chain, and that is worth investigating regardless of what the change was.

        Detection also matters after the fact. When an incident is being reconstructed, the integrity database is often the only record of which files an intruder touched, and therefore of how far the compromise reached and which hosts need rebuilding rather than cleaning.

        Installing the package is the first half of the control and does nothing on its own. Initialize the database on a known-good system, keep a copy of it somewhere the host cannot write, and schedule the comparison.
      audit: |
        Run this command to confirm the AIDE package is installed:

        ```bash
        rpm -q aide || dpkg -s aide
        ```

        A passing result reports the installed AIDE package and version. A failing result reports that the package is not installed.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to install `aide`:

            ### RHEL/Fedora/Amazon Linux and derivatives

            ```bash
            yum install aide
            ```

            ### Debian/Ubuntu and derivatives

            ```bash
            apt-get install aide
            ```

            ### SLES and openSUSE

            ```bash
            zypper install aide
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to install AIDE. It will auto-detect the package manager and install AIDE if not already installed.

            ```bash
            #!/bin/bash
            set -e

            if command -v yum >/dev/null 2>&1; then
              echo "Detected yum-based system. Installing aide..."
              yum install -y aide
            elif command -v dnf >/dev/null 2>&1; then
              echo "Detected dnf-based system. Installing aide..."
              dnf install -y aide
            elif command -v apt-get >/dev/null 2>&1; then
              echo "Detected apt-based system. Installing aide..."
              apt-get update
              apt-get install -y aide
            elif command -v zypper >/dev/null 2>&1; then
              echo "Detected zypper-based system. Installing aide..."
              zypper install -y aide
            else
              echo "No supported package manager found. Please install AIDE manually."
              exit 1
            fi

            echo "AIDE installation complete."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to install `aide`:

            ```yaml
            ---
            - name: Install AIDE on Linux systems
              hosts: all
              become: true

              tasks:
                - name: Ensure AIDE is installed
                  ansible.builtin.package:
                    name: aide
                    state: present
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to install AIDE:

            ```ruby
            package 'aide' do
              action :install
            end
            ```
    refs:
      - url: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/security_hardening/index
        title: Red Hat Enterprise Linux Security Hardening
  - uid: mondoo-linux-security-filesystem-integrity-is-regularly-checked
    title: Ensure filesystem integrity is regularly checked using AIDE
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: |
      asset.kind != "container-image"
    mql: |
      file("/etc/default/aide").exists && ["/etc/default/aide"].where(file(_).exists).all(parse.ini(_).params["CRON_DAILY_RUN"] == "yes") ||
      crontab.entries.where(user == "root").any(command.contains("aide --check")) ||
      crontab.entries.where(user == "root").any(command.contains("aide.conf --check")) ||
      systemd.timer('aidecheck').enabled
    docs:
      desc: |
        This check verifies that AIDE integrity comparisons run on a schedule rather than only when someone remembers to start one.

        Any of three arrangements satisfies it: `CRON_DAILY_RUN=yes` in `/etc/default/aide`, a root crontab entry that runs `aide --check`, or an enabled `aidecheck` systemd timer. Distributions differ in which they ship, so any one of them is accepted.

        **Why this matters**

        An integrity database that is never compared against is a file taking up disk space. The control does nothing until something reads the live filesystem, hashes it, and reports the differences, and the interval between those comparisons is the window in which a modified binary goes unnoticed.

        That window is where attackers operate. A backdoored `sshd`, a new setuid binary under `/bin` or `/sbin`, a modified init script in `/etc`, or a replaced shared library all keep working indefinitely, and each additional day of silence is a day of collected credentials, a day of lateral movement, and a day of log rotation carrying away the evidence that would have explained the change. Running the comparison daily bounds that window to hours.

        A schedule also changes the character of the signal. Manual runs happen after someone already suspects a problem, which means the baseline has usually drifted so far through ordinary patching that the report is unreadable. A daily run produces a short list of changes against yesterday, most of which map to a package transaction, and the handful that do not are the ones worth reading.

        Send the output somewhere a person or a pipeline actually reads. A scheduled comparison whose report goes to an unread local mailbox restores the original problem in a less obvious form.
      audit: |
        Run these commands to confirm a periodic AIDE check is scheduled:

        ```bash
        grep -E '^CRON_DAILY_RUN' /etc/default/aide
        crontab -u root -l | grep aide
        systemctl is-enabled aidecheck.timer
        ```

        A passing result shows `CRON_DAILY_RUN=yes`, a root cron entry that runs `aide --check`, or an enabled `aidecheck.timer`. A failing result shows none of these are present.
      remediation:
        - id: cli
          desc: |
            **Using the CLI to setup Cron:**

            1. Run this command to initialize the AIDE database:

                ```bash
                aide --init
                ```

            2. Copy the newly created database into place so scheduled checks can use it:

                ```bash
                mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
                ```

            3. Edit the root crontab:

                ```bash
                crontab -u root -e
                ```

                Add the following line to the crontab. On Debian and Ubuntu systems the AIDE binary is `/usr/bin/aide`; adjust the path accordingly:

                ```crontab
                0 5 * * * /usr/sbin/aide --check
                ```

            **Using the CLI to setup systemd:**

            1. Run this command to initialize the AIDE database:

                ```bash
                aide --init
                ```

            2. Copy the newly created database into place so scheduled checks can use it:

                ```bash
                mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
                ```

            3. Create the systemd service by creating the file `/etc/systemd/system/aidecheck.service` and adding the following lines. On Debian and Ubuntu systems use `/usr/bin/aide` in `ExecStart`:

                ```ini
                [Unit]
                Description=Aide Check

                [Service]
                Type=simple
                ExecStart=/usr/sbin/aide --check

                [Install]
                WantedBy=multi-user.target
                ```

            4. Create the systemd timer by creating or editing the file `/etc/systemd/system/aidecheck.timer` and add the following lines:

                ```ini
                [Unit]
                Description=Aide check every day at 5AM

                [Timer]
                OnCalendar=*-*-* 05:00:00
                Unit=aidecheck.service

                [Install]
                WantedBy=multi-user.target
                ```

            5. Configure the service and timer to run:

                ```bash
                chown root:root /etc/systemd/system/aidecheck.*
                chmod 0644 /etc/systemd/system/aidecheck.*

                systemctl daemon-reload

                systemctl enable aidecheck.service
                systemctl --now enable aidecheck.timer
                ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to configure a daily AIDE check. It will auto-detect the package manager, install AIDE if not already installed, initialize the database, and set up a cron job for daily checks at 5AM.

            ```bash
            #!/bin/bash
            set -e

            # Install AIDE if not present
            if ! command -v aide >/dev/null 2>&1; then
              if command -v yum >/dev/null 2>&1; then
                echo "Detected yum-based system. Installing aide..."
                yum install -y aide
              elif command -v dnf >/dev/null 2>&1; then
                echo "Detected dnf-based system. Installing aide..."
                dnf install -y aide
              elif command -v apt-get >/dev/null 2>&1; then
                echo "Detected apt-based system. Installing aide..."
                apt-get update
                apt-get install -y aide
              elif command -v zypper >/dev/null 2>&1; then
                echo "Detected zypper-based system. Installing aide..."
                zypper install -y aide
              else
                echo "No supported package manager found. Please install AIDE manually."
                exit 1
              fi
            fi

            # Initialize AIDE database if not already initialized
            if [ ! -f /var/lib/aide/aide.db.gz ] && [ ! -f /var/lib/aide/aide.db ]; then
              echo "Initializing AIDE database..."
              aide --init
              cp /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz 2>/dev/null || true
              cp /var/lib/aide/aide.db.new /var/lib/aide/aide.db 2>/dev/null || true
            fi

            # Add cron job for daily check at 5AM if not already present
            AIDE_BIN="$(command -v aide || true)"
            if [ -z "$AIDE_BIN" ]; then
              echo "ERROR: aide not found" >&2
              exit 1
            fi
            CRON_LINE="0 5 * * * $AIDE_BIN --check"
            # `grep -v` exits 1 when it selects nothing, which is what happens when root has
            # no crontab at all. Without the `|| true` that status aborts the subshell under
            # `set -e`, so `crontab -` reads empty input and clears the crontab instead of
            # adding the entry.
            { crontab -l 2>/dev/null | grep -v -F "aide --check" || true; echo "$CRON_LINE"; } | crontab -

            echo "AIDE daily check scheduled at 5AM via cron."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to install AIDE, initialize its database, and run the check using a systemd timer. On Debian and Ubuntu systems change `ExecStart` to `/usr/bin/aide`:

            ```yaml
            ---
            - name: Configure daily AIDE check using systemd timer
              hosts: all
              become: true

              tasks:
                - name: Ensure AIDE is installed
                  ansible.builtin.package:
                    name: aide
                    state: present

                - name: Check whether the AIDE database exists
                  ansible.builtin.stat:
                    path: /var/lib/aide/aide.db.gz
                  register: aide_db

                - name: Initialize the AIDE database
                  ansible.builtin.command: aide --init
                  when: not aide_db.stat.exists

                - name: Copy the new AIDE database into place
                  ansible.builtin.command:
                    cmd: mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
                    creates: /var/lib/aide/aide.db.gz
                  when: not aide_db.stat.exists

                - name: Create systemd service unit for AIDE check
                  ansible.builtin.copy:
                    dest: /etc/systemd/system/aidecheck.service
                    owner: root
                    group: root
                    mode: '0644'
                    content: |
                      [Unit]
                      Description=Aide Check

                      [Service]
                      Type=simple
                      ExecStart=/usr/sbin/aide --check

                      [Install]
                      WantedBy=multi-user.target

                - name: Create systemd timer unit for daily AIDE check at 5AM
                  ansible.builtin.copy:
                    dest: /etc/systemd/system/aidecheck.timer
                    owner: root
                    group: root
                    mode: '0644'
                    content: |
                      [Unit]
                      Description=Aide check every day at 5AM

                      [Timer]
                      OnCalendar=*-*-* 05:00:00
                      Unit=aidecheck.service

                      [Install]
                      WantedBy=multi-user.target

                - name: Reload systemd daemon to recognize new units
                  ansible.builtin.systemd:
                    daemon_reload: true

                - name: Enable aidecheck.service (not started, only enabled)
                  ansible.builtin.systemd:
                    name: aidecheck.service
                    enabled: true

                - name: Enable and start aidecheck.timer
                  ansible.builtin.systemd:
                    name: aidecheck.timer
                    enabled: true
                    state: started
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to install AIDE, initialize its database, and run the check from a systemd timer. On Debian and Ubuntu systems change `ExecStart` to `/usr/bin/aide`:

            ```ruby
            package 'aide' do
              action :install
            end

            execute 'initialize the AIDE database' do
              command 'aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz'
              creates '/var/lib/aide/aide.db.gz'
            end

            systemd_unit 'aidecheck.service' do
              content <<~UNIT
                [Unit]
                Description=Aide Check

                [Service]
                Type=simple
                ExecStart=/usr/sbin/aide --check

                [Install]
                WantedBy=multi-user.target
              UNIT
              action %i(create enable)
            end

            systemd_unit 'aidecheck.timer' do
              content <<~UNIT
                [Unit]
                Description=Aide check every day at 5AM

                [Timer]
                OnCalendar=*-*-* 05:00:00
                Unit=aidecheck.service

                [Install]
                WantedBy=multi-user.target
              UNIT
              action %i(create enable start)
            end
            ```
