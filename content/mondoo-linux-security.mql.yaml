          return true
    mql: |
      defaultBlock = sshd.config.blocks.where(criteria.in([""]) == props.checkDefaultMatchBlock && criteria == "");

      userBlocks = sshd.config.blocks.where(criteria.contains(props.excludedMatchBlocks) == false && criteria != "");

      // A Match block only carries the parameters it sets itself; anything it does not set is
      // inherited from the default block. Only check the blocks that override these settings,
      // otherwise every Match block that leaves them alone is reported as unset.
      intervalBlocks = userBlocks.where(params["ClientAliveInterval"] != null);
      countMaxBlocks = userBlocks.where(params["ClientAliveCountMax"] != null);

      intervalBlocks.all(params.ClientAliveInterval >= 1)
      intervalBlocks.all(params.ClientAliveInterval <= 300)
      countMaxBlocks.all(params.ClientAliveCountMax > 0) && countMaxBlocks.all(params.ClientAliveCountMax <= 3)

      defaultBlock.all(params.ClientAliveInterval >= 1)
      defaultBlock.all(params.ClientAliveInterval <= 300)
      defaultBlock.all(params.ClientAliveCountMax > 0) && defaultBlock.all(params.ClientAliveCountMax <= 3)
    docs:
      desc: |
        This check verifies that the SSH server terminates sessions whose client has stopped responding.

        The check reads `ClientAliveInterval`, which must be between 1 and 300 seconds, and `ClientAliveCountMax`, which must be between 1 and 3. It evaluates the default section of `/etc/ssh/sshd_config` and any `Match` block that overrides these values, since a `Match` block inherits anything it does not set itself.

        **Why this matters**

        The two directives work together. `sshd` sends an encrypted keepalive every `ClientAliveInterval` seconds, and closes the session after `ClientAliveCountMax` of them go unanswered. The product is the longest a session can survive with no client on the other end.

        What this closes is the abandoned session. An administrator connects from a laptop, authenticates, and then closes the lid, loses the network, or walks away. The connection stays established on the server, holding an authenticated shell with that administrator's privileges. Anyone who reaches the client machine reaches that shell, with no authentication step in between, and the server has no way to distinguish them from the person who logged in.

        It also frees sessions stranded by network changes, which would otherwise accumulate and hold resources indefinitely.

        These directives use the encrypted channel, so they detect a dead peer rather than merely keeping a NAT mapping alive, which is what the unrelated `TCPKeepAlive` option does. Choose values that terminate an unattended session in minutes; long-running jobs should survive disconnection through `tmux`, `screen`, or a systemd unit rather than by relying on an open SSH session.
      audit: |
        Run this command to inspect the SSH server configuration file and any files it includes:

        ```bash
        grep -rEi '^\s*ClientAlive(Interval|CountMax)\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        A passing result shows `ClientAliveInterval` between `1` and `300` and `ClientAliveCountMax` between `1` and `3`. A failing result shows either value outside these ranges, or no output at all, which means the directives are absent.

        `Match` blocks are evaluated as well. A block that overrides these settings with a non-compliant value also fails the check, while a block that does not set them at all inherits the global values and is ignored. Run this command to list the `Match` blocks and the settings they override:

        ```bash
        grep -rniE '^\s*(Match|ClientAlive(Interval|CountMax))\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
        ```

        This check reads the configuration file rather than the effective configuration, so verify it with `grep` rather than `sshd -T`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            **Warning: avoid locking yourself out.** Before you restart SSH, keep your current session open. Validate the configuration with `sshd -t`, restart the service, then open a second SSH connection to confirm you can still log in. Only close your original session once the new one works.

            To set the SSH idle timeout interval, edit the `/etc/ssh/sshd_config` file and add or modify the `ClientAliveInterval` and `ClientAliveCountMax` parameters.

            Example:

            ```bash
            ClientAliveInterval 300
            ClientAliveCountMax 2
            ```

            The SSH daemon uses the first value it reads for each keyword, and the `Include` directive at the top of `/etc/ssh/sshd_config` loads `/etc/ssh/sshd_config.d/` first, in lexical order. Red Hat Enterprise Linux and Ubuntu ship their own snippets in that directory, so a value added to `/etc/ssh/sshd_config` has no effect once one of those snippets sets the same keyword. Check the directory, and where it is in use put the value in a drop-in numbered below the vendor snippets:

            ```bash
            grep -ri 'ClientAlive' /etc/ssh/sshd_config.d/
            touch /etc/ssh/sshd_config.d/00-hardening.conf
            chmod 600 /etc/ssh/sshd_config.d/00-hardening.conf
            echo 'ClientAliveInterval 300' >> /etc/ssh/sshd_config.d/00-hardening.conf
            echo 'ClientAliveCountMax 2' >> /etc/ssh/sshd_config.d/00-hardening.conf
            ```

            Validate the configuration and restart the SSH service to apply the changes:

            ```bash
            sshd -t
            ```

            Debian/Ubuntu distros:

            ```bash
            systemctl restart ssh
            ```

            OR

            All other Linux distros:

            ```bash
            systemctl restart sshd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            To set the SSH idle timeout interval, you can run the following bash script:

            ```bash
            #!/bin/bash
            set -e

            # sshd uses the first value it reads for each keyword, and the Include at the top of
            # sshd_config pulls in /etc/ssh/sshd_config.d in lexical order. Red Hat Enterprise
            # Linux and Ubuntu ship their own snippets in that directory, so a drop-in numbered
            # below theirs is the only place a new value reliably wins.
            if grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
              SSHD_CONFIG=/etc/ssh/sshd_config.d/00-hardening.conf
              mkdir -p /etc/ssh/sshd_config.d
              touch "$SSHD_CONFIG"
              chmod 600 "$SSHD_CONFIG"
            else
              SSHD_CONFIG=/etc/ssh/sshd_config
            fi

            if grep -q '^ClientAliveInterval' "$SSHD_CONFIG"; then
              echo "Updating existing ClientAliveInterval configuration value"
              sed -i 's/^ClientAliveInterval.*/ClientAliveInterval 300/' "$SSHD_CONFIG"
            else
              echo "Adding ClientAliveInterval configuration value to SSH config"
              echo 'ClientAliveInterval 300' >> "$SSHD_CONFIG"
            fi

            if grep -q '^ClientAliveCountMax' "$SSHD_CONFIG"; then
              echo "Updating existing ClientAliveCountMax configuration value"
              sed -i 's/^ClientAliveCountMax.*/ClientAliveCountMax 2/' "$SSHD_CONFIG"
            else
              echo "Adding ClientAliveCountMax configuration value to SSH config"
              echo 'ClientAliveCountMax 2' >> "$SSHD_CONFIG"
            fi

            # Validate the new configuration before restarting. A syntax error here can lock you out of SSH.
            sshd -t

            # Restart the SSH service. The unit is "ssh" on Debian/Ubuntu and "sshd" on other distributions.
            if systemctl list-unit-files | grep -q '^ssh\.service'; then
              systemctl restart ssh
            else
              systemctl restart sshd
            fi
