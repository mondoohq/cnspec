policies:
  - uid: mondoo-linux-workstation-security
    name: Mondoo Linux Workstation Security
    version: 1.1.1
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: linux
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Linux workstation access, firewall, and services
    docs:
      desc: |
        The Mondoo Linux Workstation Security policy identifies critical misconfigurations on Linux workstations that could leave end-user systems vulnerable to malware, unauthorized access, and data theft. Workstations are a frequent first foothold for attackers, with phishing, malicious downloads, and physical access threats all targeting the endpoint. Workstation hardening directly limits what an attacker can do once they get in.

        This policy provides security checks across key Linux workstation areas:

        - Secure Boot configuration
        - Disk encryption (LUKS) and removable media handling
        - Host firewall configuration
        - Screen lock and idle session policies
        - User authentication and password requirements
        - Automatic updates and patch posture

        This policy supports Red Hat, Debian, Ubuntu, and SUSE distributions on x86 and x64 platforms.

        Learn more about scanning Linux in the [cnspec Linux documentation](https://mondoo.com/docs/cnspec/os/linux).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Secure Boot
        filters: |
          asset.family.contains('linux')
          packages.where(name == /xorg|xserver|wayland/i).any(installed)
        checks:
          - uid: mondoo-linux-workstation-security-permissions-on-bootloader-config-are-configured
          - uid: mondoo-linux-workstation-security-secure-boot-is-enabled
      - title: Disk encryption
        filters: |
          asset.family.contains('linux')
          packages.where(name == /xorg|xserver|wayland/i).any(installed)
        checks:
          - uid: mondoo-linux-workstation-security-aes-encryption-algorithm
          - uid: mondoo-linux-workstation-security-root-and-home-are-encrypted
      - title: BIOS Firmware up-to-date
        filters: |
          asset.family.contains('linux')
          package('fwupd').installed
          packages.where(name == /xorg|xserver|wayland/i).any(installed)
        checks:
          - uid: mondoo-linux-workstation-security-bios-uptodate
    scoring_system: highest impact
queries:
  - uid: mondoo-linux-workstation-security-permissions-on-bootloader-config-are-configured
    title: Ensure permissions on bootloader config are configured
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      if (file("/boot/grub/grub.cfg").exists) {
        file("/boot/grub/grub.cfg") {
          path
          user.name == 'root'
          group.name == 'root'
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
        }
      }

      if (file("/boot/grub/menu.lst").exists) {
        file("/boot/grub/menu.lst") {
          path
          user.name == 'root'
          group.name == 'root'
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
        }
      }

      if (file("/boot/grub2/grub.cfg").exists) {
         file("/boot/grub2/grub.cfg") {
          path
          user.name == 'root'
          group.name == 'root'
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
         }
       }

      if (file("/boot/grub/user.cfg").exists) {
        file("/boot/grub/user.cfg") {
          path
          user.name == 'root'
          group.name == 'root'
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
        }
      }

      if (file("/boot/grub2/user.cfg").exists) {
         file("/boot/grub2/user.cfg") {
          path
          user.name == 'root'
          group.name == 'root'
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
         }
      }

      if (file("/boot/loader/loader.conf").exists) {
        file("/boot/loader/loader.conf") {
          path
          user.name == 'root'
          group.name == 'root'
          permissions.group_readable == false
          permissions.group_writeable == false
          permissions.group_executable == false
          permissions.other_readable == false
          permissions.other_writeable == false
          permissions.other_executable == false
        }
      }

      if(mount.list.where( fstype == 'vfat' && path == /boot/) != []) {
        mount.list.where( fstype == 'vfat' && path == /boot/) {
          device
          options['fmask'] == "0077"
        }
      }
    docs:
      desc: |
        This check verifies that the boot loader's configuration files are readable only by root, and that a UEFI system partition mounted from vfat carries an equivalent restriction.

        The files covered are `grub.cfg` and `menu.lst` under `/boot/grub` or `/boot/grub2`, the `user.cfg` file that holds GRUB's password hash, and `loader.conf` where systemd-boot is in use. Each must be owned by `root` and carry no group or other access at all. A vfat filesystem has no permission bits of its own, so for `/boot/efi` the restriction comes from the mount options in `/etc/fstab`, where `fmask=0077` denies group and other access to every file on it.

        **Why this matters**

        `user.cfg` holds the hash of the GRUB password, the one that gates editing a boot entry from the menu. If any local account can read that file, the hash goes to a cracking rig off the machine, at whatever rate the attacker's hardware allows and with no failed-attempt record left on the host. Recovering it converts console access into the ability to edit the kernel command line, and the standard edit from there appends `init=/bin/bash` for a root shell with no authentication at all.

        Even without the password, the configuration itself is reconnaissance for the same attack. It names the kernels and initramfs images available, the root device and how it is unlocked, and any command line parameters already in place, including whether SELinux or AppArmor is enforcing, whether the IOMMU is on, and whether the console is redirected to a serial port that reaches beyond the room.

        A group-writable or world-writable configuration file removes the need for any of that, because a kernel parameter added to it takes effect on the next reboot with no further access required.

        These permissions defend the boot path against a local account. They do not defend against someone who can detach the disk and attach it to another machine. Full-disk encryption covers that case, and a companion check in this policy requires it.
      audit: |
        Run these commands to inspect the ownership and permissions of the bootloader configuration files present on the system:

        ```bash
        stat -c '%n %U %G %A' /boot/grub/grub.cfg /boot/grub2/grub.cfg /boot/grub/menu.lst /boot/grub/user.cfg /boot/grub2/user.cfg /boot/loader/loader.conf 2>/dev/null
        mount | grep '/boot/efi'
        ```

        A passing result shows each existing file owned by `root:root` with no group or other access, and the `/boot/efi` mount including `fmask=0077`. A failing result shows group or other access on a configuration file, or a `/boot/efi` mount without the restrictive mask.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Bootloader configuration files must be owned by `root:root` with no group or other access. Run these commands to secure each bootloader configuration file present on the system:

            ```bash
            for f in /boot/grub/grub.cfg /boot/grub/menu.lst /boot/grub/user.cfg /boot/grub2/grub.cfg /boot/grub2/user.cfg /boot/loader/loader.conf; do
              if [ -e "$f" ]; then
                chown root:root "$f"
                chmod og-rwx "$f"
              fi
            done
            ```

            **If the system uses UEFI**, set restrictive masks on every vfat file system mounted under `/boot`. That is `/boot/efi` on most installs, and `/boot` itself where systemd-boot owns the EFI system partition. List them first:

            ```bash
            findmnt -t vfat -o TARGET,SOURCE,OPTIONS
            ```

            Then edit `/etc/fstab` and set the masks on each one:

            _Example:_

            ```text
            <device> /boot/efi vfat defaults,fmask=0077,dmask=0077,uid=0,gid=0 0 2
            ```

            Apply the new options to each mount point you changed:

            ```bash
            mount -o remount /boot/efi
            ```

            If the remount does not apply the new options, reboot the system.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to secure the bootloader configuration files:

            ```bash
            #!/bin/bash
            set -eu

            for f in /boot/grub/grub.cfg /boot/grub/menu.lst /boot/grub/user.cfg /boot/grub2/grub.cfg /boot/grub2/user.cfg /boot/loader/loader.conf; do
              if [ -e "$f" ]; then
                echo "Securing $f"
                chown root:root "$f"
                chmod og-rwx "$f"
              fi
            done

            # vfat has no permission model, so the mask has to come from the mount options.
            # Cover every vfat file system under /boot, which is /boot/efi on most installs
            # and /boot itself where systemd-boot owns the EFI system partition.
            vfat_mounts=$(findmnt -rn -t vfat -o TARGET | grep '^/boot' || true)

            if [ -n "$vfat_mounts" ]; then
              cp -p /etc/fstab /etc/fstab.bak
              echo "Saved a backup of /etc/fstab to /etc/fstab.bak"
            fi

            for mp in $vfat_mounts; do
              if grep -Eq "^[^#]+[[:space:]]+${mp}[[:space:]]+vfat[[:space:]]+[^[:space:]]*fmask=0077" /etc/fstab; then
                continue
              fi
              sed -i -E "s|^([^[:space:]]+[[:space:]]+${mp}[[:space:]]+vfat[[:space:]]+)[^[:space:]]+|\\1defaults,fmask=0077,dmask=0077,uid=0,gid=0|" /etc/fstab
              mount -o remount "$mp"
              echo "Updated $mp mount options"
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Secure the bootloader configuration files with the following Ansible playbook:

            ```yaml
            ---
            - name: Secure bootloader configuration files
              hosts: all
              become: true

              tasks:
                - name: Check which bootloader config files exist
                  ansible.builtin.stat:
                    path: "{{ item }}"
                  loop:
                    - /boot/grub/grub.cfg
                    - /boot/grub/menu.lst
                    - /boot/grub/user.cfg
                    - /boot/grub2/grub.cfg
                    - /boot/grub2/user.cfg
                    - /boot/loader/loader.conf
                  register: bootloader_files

                - name: Set ownership and permissions on bootloader config files
                  ansible.builtin.file:
                    path: "{{ item.stat.path }}"
                    owner: root
                    group: root
                    mode: '0600'
                  loop: "{{ bootloader_files.results | selectattr('stat.exists') | list }}"

                # vfat has no permission model, so the mask has to come from the mount
                # options. Cover every vfat file system under /boot, which is /boot/efi on
                # most installs and /boot itself where systemd-boot owns the EFI system
                # partition.
                - name: Find the vfat file systems mounted under /boot
                  ansible.builtin.set_fact:
                    boot_vfat_mounts: >-
                      {{ ansible_mounts
                         | selectattr('fstype', 'equalto', 'vfat')
                         | selectattr('mount', 'match', '^/boot')
                         | map(attribute='mount') | list }}

                - name: Set restrictive masks for the EFI system partition in /etc/fstab
                  ansible.builtin.replace:
                    path: /etc/fstab
                    regexp: '^(\S+\s+{{ item | regex_escape }}\s+vfat\s+)\S+'
                    replace: '\1defaults,fmask=0077,dmask=0077,uid=0,gid=0'
                  loop: "{{ boot_vfat_mounts }}"

                - name: Remount the EFI system partition with the new options
                  ansible.posix.mount:
                    path: "{{ item }}"
                    state: remounted
                  loop: "{{ boot_vfat_mounts }}"
            ```
  - uid: mondoo-linux-workstation-security-secure-boot-is-enabled
    title: Ensure Secure Boot is enabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      machine.secureboot.enabled
    docs:
      desc: |
        This check verifies that UEFI Secure Boot is enabled, so the firmware validates the signature of each boot component before executing it.

        Secure Boot builds a chain. The firmware verifies the shim or boot loader against keys held in the platform database, the boot loader verifies the kernel, and the kernel verifies the modules it loads. On Linux this works through a distribution shim signed by Microsoft's UEFI key, which most vendors ship trusted in firmware, and a distribution key that validates the loader and kernel behind it. The check reads the current state, which `mokutil --sb-state` reports.

        **Why this matters**

        Everything an operating system does to protect itself starts after the kernel is running. Code that executes before that point decides what the kernel is, which means it can hand control to a kernel modified to hide processes, ignore particular file reads, and accept an attacker's authentication, and no tool running on that system afterwards can report the difference. Secure Boot closes that window, because unsigned code in the boot path is refused rather than executed.

        For a workstation the way in is usually physical rather than remote. Laptops are left in hotel rooms, in checked luggage, and on desks in shared offices, and a few minutes of unattended access with a USB drive is enough to write a modified boot loader onto an unprotected disk. The device boots normally afterwards and behaves normally, which is precisely why the technique is used.

        An attacker who has already reached root locally has the same option available, and it is the one that survives a reinstall of the operating system.

        Secure Boot works alongside full-disk encryption rather than replacing it. Encryption keeps the data unreadable when the disk is removed; Secure Boot keeps the boot path trustworthy when the machine is started. A workstation needs both, and companion checks in this policy require the other pieces.
      audit: |
        Run this command to inspect the Secure Boot state:

        ```bash
        mokutil --sb-state
        ```

        A passing result prints `SecureBoot enabled`. A failing result prints `SecureBoot disabled` or reports that the platform does not support Secure Boot.
      remediation:
        - id: manual
          desc: |
            Enable Secure Boot in your computer's firmware and use a Linux distribution supporting Secure Boot.

            1. Restart your computer and enter the UEFI firmware settings (usually by pressing F2, F10, DEL, or ESC during startup).
            2. Locate the **Secure Boot** option under the **Boot** or **Security** tab.
            3. Set Secure Boot to **Enabled**.
            4. Save changes and exit the UEFI settings.
            5. Ensure your Linux distribution supports Secure Boot (most major distributions do).
  - uid: mondoo-linux-workstation-security-root-and-home-are-encrypted
    title: Ensure / and /home are encrypted
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |-
      mount.list.where( path == '/') {
        lsblkDevice = parse.json(content: command('lsblk -a --json -s ' + _.device).stdout).params
        lsblkDevice['blockdevices'][0]['children'][0]['type'] == 'crypt' || lsblkDevice['blockdevices'][0]['type'] == 'crypt'
      }
      if( mount.list.where( path == /home/) != [] ) {
        mount.list.where( path == '/home') {
          lsblkDevice = parse.json(content: command('lsblk -a --json -s ' + _.device).stdout).params
          lsblkDevice['blockdevices'][0]['children'][0]['type'] == 'crypt' || lsblkDevice['blockdevices'][0]['type'] == 'crypt'
        }
      }
    docs:
      desc: |
        This check verifies that the filesystems holding the operating system and the users' data sit on encrypted block devices.

        It resolves the devices backing `/` and, where it is mounted separately, `/home`, then walks the device stack for each and requires a `crypt` layer, the device-mapper target that an unlocked LUKS volume presents. `lsblk` shows the same relationship, with the crypt device sitting between the physical partition and the mounted filesystem. Where `/home` is part of the root filesystem rather than a separate mount, encrypting the root volume covers both.

        **Why this matters**

        A workstation leaves the building. Laptops are stolen from cars, left in taxis, taken in office break-ins, and lost in transit, and in every one of those cases the attacker ends up holding the disk with unlimited time and no need to defeat anything the operating system does. Login passwords, screen locks, and file permissions are enforced by a running kernel. Remove the drive, attach it to another machine, and none of them are involved: the filesystem mounts and every file is readable.

        What sits on that disk is the reason it matters. A developer or administrator workstation carries SSH private keys, cloud credentials in shell profiles and configuration directories, browser session cookies and saved passwords, VPN certificates, and local copies of whatever the person was working on. A stolen laptop with an unencrypted disk is therefore not an equipment loss, it is a credential compromise, and the attacker walks into the environment as that employee.

        Encrypting root as well as home matters because credentials do not stay in home directories. Service configuration, system-wide credential files, log files, swap, and the temporary directory all sit outside `/home` and all hold material worth reading.

        Encryption protects the disk at rest and nothing more. It gives no protection while the machine is running and unlocked, so pair it with screen locking and with a boot path validated by Secure Boot, which a companion check in this policy requires.
      audit: |
        Run these commands to identify the devices serving `/` and `/home` and confirm they are encrypted:

        ```bash
        df /  /home
        lsblk -o NAME,TYPE,MOUNTPOINT
        dmsetup status
        ```

        A passing result shows the devices backing `/` and `/home` mapped through a `crypt` device. A failing result shows either filesystem on a plain, unencrypted device.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            > **Warning:** Encrypting an existing installation rewrites the entire device and any mistake destroys data. Back up all data to external storage before you begin. The root filesystem cannot be encrypted while it is mounted, so both procedures below run from the distribution installer or a live system.

            The recommended path is a reinstall with full-disk encryption:

            1. Back up all user data to external storage.
            2. Boot the distribution installer and select the encrypted disk or encrypted LVM layout option.
            3. Restore user data after the installation completes.

            Alternatively, encrypt the existing filesystem in place from a live system. The `--reduce-device-size` option shrinks the device by 32 MiB to make room for the LUKS header, so the filesystem inside it must first be shrunk by at least that amount or it is truncated and data is lost. For an ext4 filesystem:

            ```bash
            DEVICE=/dev/sdX2
            e2fsck -f "$DEVICE"
            resize2fs -M "$DEVICE"
            cryptsetup reencrypt --encrypt --type luks2 --cipher aes-xts-plain64 --key-size 512 --reduce-device-size 32m "$DEVICE"
            cryptsetup open "$DEVICE" root
            resize2fs /dev/mapper/root
            ```

            The final `resize2fs` grows the filesystem back to fill the encrypted volume. For other filesystem types, use that filesystem's shrink tooling before re-encrypting.

            Replace `/dev/sdX2` with the partition serving `/` or `/home`. After encrypting, update `/etc/crypttab` and `/etc/fstab` to reference the mapped device, then regenerate the initramfs with `update-initramfs -u -k all` on Debian and Ubuntu or `dracut -f --regenerate-all` on Red Hat and SUSE distributions so the system can unlock the volume at boot.
        # No bash or ansible remediation: encrypting existing volumes is an offline, interactive, data-destructive procedure that must not be automated against a running system.
  - uid: mondoo-linux-workstation-security-aes-encryption-algorithm
    title: Ensure AES encryption algorithm is used
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      lsblk.list.any( fstype == /crypt/ )
      lsblk.list.where( fstype == /crypt/).all(
        parse.json(
          content: command('cryptsetup --dump-json-metadata luksDump /dev/disk/by-uuid/' + uuid).stdout
        ).params['segments']['0']['encryption'].contains('aes-xts') ||
        command('cryptsetup luksDump /dev/disk/by-uuid/' + uuid).stdout.lines.where( _ == /Cipher\:/).all(/aes/)
      )
    docs:
      desc: |
        This check verifies that every LUKS-encrypted volume uses AES in XTS mode.

        XTS is the mode designed for storage. A disk cipher has to encrypt each sector independently, because sectors are read and written in any order, and it has to do so without letting two sectors holding identical plaintext produce identical ciphertext. XTS achieves that by tweaking the encryption with the sector number. The check reads the cipher from each LUKS header and accepts an AES cipher in XTS mode, written as `aes-xts-plain64` on current systems and `aes-xts-benbi` on some older ones. `cryptsetup luksDump` shows the value in the Cipher field.

        **Why this matters**

        Full-disk encryption is either sound or it is decoration, and the cipher decides which. A volume set up with a legacy mode inherits attacks that XTS does not have. CBC with a predictable sector-derived initialization vector, which older installers configured, is vulnerable to watermarking: an attacker who can get a chosen file onto the volume, by emailing it or having it downloaded, can afterwards recognize its presence in the raw ciphertext of a stolen disk without holding any key. CBC also gives an attacker with write access to the device controlled bit flips in the following block, which is the basis for tampering with a volume between one boot and the next.

        Cipher choice is also where an obsolete algorithm hides. A volume created years ago and carried forward through reinstalls keeps whatever cipher it was made with, and nothing in normal operation surfaces it. The header says the disk is encrypted, the machine unlocks, and the strength of what is protecting the data is never questioned.

        Changing the cipher rewrites every sector of the volume. Back the data up first and run the conversion from a live system with the filesystem unmounted, because an interruption partway through leaves the volume unreadable.
      audit: |
        Run this command for each encrypted device to inspect the cipher in use:

        ```bash
        cryptsetup luksDump /dev/disk/by-uuid/<device-uuid>
        ```

        A passing result shows the `Cipher` field set to an `aes-xts` variant. A failing result shows a non-AES cipher or a mode other than XTS.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            > **Warning:** Converting the cipher rewrites every sector of the volume. Back up all data and ensure reliable power before you begin. Run the conversion from a live system with the filesystem unmounted.

            For LUKS2 volumes, convert the cipher in place without destroying data:

            ```bash
            DEVICE=/dev/sdX2
            cryptsetup reencrypt --cipher aes-xts-plain64 --key-size 512 "$DEVICE"
            ```

            For LUKS1 volumes, first convert the header to LUKS2, then re-encrypt:

            ```bash
            DEVICE=/dev/sdX2
            cryptsetup convert --type luks2 "$DEVICE"
            cryptsetup reencrypt --cipher aes-xts-plain64 --key-size 512 "$DEVICE"
            ```

            Replace `/dev/sdX2` with the LUKS partition. Verify the cipher after the conversion completes:

            ```bash
            DEVICE=/dev/sdX2
            cryptsetup luksDump "$DEVICE"
            ```
        # No bash or ansible remediation: cipher conversion is an offline, data-rewriting procedure that must not be automated against a running system.
  - uid: mondoo-linux-workstation-security-bios-uptodate
    title: Ensure system BIOS is running the latest available version
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      parse.json(content: command('fwupdmgr get-updates -y --json').stdout).params["Devices"].length == 0
    docs:
      desc: |
        This check verifies that the system firmware is at the latest version its vendor has published.

        The check queries `fwupdmgr` for pending updates and requires the list to be empty. The `fwupd` daemon retrieves metadata from the Linux Vendor Firmware Service, which most major hardware vendors publish to, and compares the advertised versions against what the machine currently runs. Because it needs that metadata, the check reports accurately only on a host that can reach the service, and it covers every device fwupd manages rather than the system BIOS alone.

        **Why this matters**

        Firmware runs before the kernel and keeps running underneath it, in a mode more privileged than the operating system can inspect. A flaw there is not contained by anything the operating system does: it is reachable before Secure Boot's chain begins, it survives a full reinstall, and it survives replacing the disk, because the code lives in flash on the board.

        The vulnerabilities fixed by these updates are of that kind. Firmware update routines that accepted unsigned images, System Management Mode handlers reachable from the operating system that let a local root account write to flash, and boot loader flaws allowing the Secure Boot chain to be bypassed have all shipped in mainstream hardware and been fixed by vendor releases. Until the release is applied, an attacker who reaches root once converts that into a foothold outlasting every response short of replacing the machine.

        Firmware updates also carry the processor microcode that mitigates hardware-level flaws, so a stale BIOS usually means missing mitigations as well as missing fixes.

        Two operational cautions. Updates are staged and applied during a reboot, so a machine that never restarts never receives them. And a firmware update changes the measurements that a TPM-sealed disk encryption key is bound to, so have the recovery passphrase to hand before applying one.
      audit: |
        Run this command to check for pending firmware updates:

        ```bash
        fwupdmgr get-updates --json
        ```

        A passing result reports no devices with available updates. A failing result lists one or more devices, including the system BIOS, with a newer firmware version available.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            The BIOS firmware should be updated to the latest version available from the Linux Vendor Firmware Service. Refresh the metadata first so the update check reflects the latest releases:

            ```bash
            fwupdmgr refresh --force
            fwupdmgr get-updates
            fwupdmgr update
            ```

            BIOS updates are staged and installed during the next boot. Reboot the system when prompted to complete the update.

            If the `fwupdmgr` tool is not available, you may need to download the latest BIOS firmware from your hardware vendor's website and follow their instructions to update it.
        - id: bash
          desc: |
            **Using a Bash Script**

            Use this Bash script to refresh firmware metadata and stage any available updates:

            ```bash
            #!/bin/bash
            set -eu

            fwupdmgr refresh --force
            if fwupdmgr get-updates; then
              fwupdmgr update -y --no-reboot-check
              echo "Firmware updates staged. Reboot the system to complete installation."
            else
              echo "No firmware updates available."
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Update the system BIOS firmware using fwupdmgr with the following Ansible playbook:

            ```yaml
            ---
            - name: Update system BIOS firmware
              hosts: all
              become: true

              tasks:
                - name: Refresh fwupd metadata
                  ansible.builtin.command: fwupdmgr refresh --force
                  changed_when: true

                - name: Apply firmware updates
                  ansible.builtin.command: fwupdmgr update -y --no-reboot-check
                  register: fwupd_result
                  changed_when: "'Successfully installed' in fwupd_result.stdout"
                  failed_when:
                    - fwupd_result.rc != 0
                    - "'No upgrades for' not in fwupd_result.stderr"
            ```
