    docs:
      desc: |
        This check verifies that authentication protocols incapable of multifactor authentication are blocked outright.

        Legacy authentication covers Exchange ActiveSync and the older mail clients grouped as other clients, which includes POP, IMAP, and SMTP AUTH. Microsoft 365 accepts these protocols by default, and they predate modern authentication and cannot present an interactive second factor, so a sign-in over them completes on a password alone regardless of what the tenant requires elsewhere. You block them with a Conditional Access policy in the Microsoft Entra admin center under **Protection > Conditional Access > Policies**, setting **Conditions > Client apps** to those legacy client types and **Grant** to block access. This check requires such a policy to be enabled rather than report-only or off. In infrastructure code it is the same conditional access policy resource with a blocking grant control.

        **Why this matters**

        Legacy endpoints are where password spraying goes, precisely because they answer with a yes or a no and nothing else. An attacker takes a list of your employees' addresses, which is largely derivable from your website and public profiles, tries one common seasonal password against all of them, and waits before the next attempt so no single account locks out. Every hit is a working session, and the multifactor policy the tenant is proud of never enters the conversation.

        The mailbox is the objective and it is reached directly. The attacker synchronizes mail over IMAP, which is quiet, produces no browser session, and copies the entire mailbox at once rather than page by page.

        Blocking the client types removes the whole class of attack rather than raising its cost, because there is no supported way to add a second factor to these protocols.

        Exclude an emergency access account, and inventory what still uses these protocols before you enable the policy, since multifunction printers, scan-to-email devices, and older line-of-business applications commonly authenticate this way and will stop working.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Protection** > **Conditional Access** > **Policies**.
        3. Look for an enabled policy whose **Conditions** > **Client apps** targets the legacy authentication client apps, Exchange ActiveSync and other clients, and whose **Grant** control is set to **Block access**.

        A passing tenant has at least one enabled policy that blocks legacy authentication. A failing tenant has no such policy, or it is in **Report-only** or **Off** state.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list Conditional Access policies:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgIdentityConditionalAccessPolicy |
          Where-Object { $_.State -eq "enabled" -and $_.GrantControls.BuiltInControls -contains "block" }
        ```

        A passing tenant returns at least one policy that blocks legacy authentication client app types. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To set up a Conditional Access policy that blocks legacy authentication:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Protection` > `Conditional Access` > `Policies`.
            3. Select `New policy`.
            4. Configure the policy:
               - Under `Users`, include `All users`, and under `Exclude`, add at least one emergency access account or directory role. This is required as a best practice so administrators are not locked out.
               - Under `Target resources`, choose `All cloud apps`.
               - Under `Conditions` > `Client apps`, set `Configure` to `Yes` and select only `Exchange ActiveSync clients` and `Other clients`.
               - Under `Access controls` > `Grant`, select `Block access`.
            5. Set `Enable policy` to `On`.
            6. Select `Create`.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess", "Policy.Read.All"
            ```

            2. Create a Conditional Access policy to block legacy authentication:

            ```powershell
            $params = @{
                displayName = "Block legacy authentication"
                state = "enabled"
                conditions = @{
                    users = @{
                        includeUsers = @("All")
                        excludeUsers = @("<breakglass-account-id>")  # Replace with break-glass account
                    }
                    applications = @{
                        includeApplications = @("All")
                    }
                    clientAppTypes = @("exchangeActiveSync", "other")
                }
                grantControls = @{
                    operator = "OR"
                    builtInControls = @("block")
                }
            }
            New-MgIdentityConditionalAccessPolicy -BodyParameter $params
            ```
        - id: terraform
          desc: |
            **Using Terraform (azuread provider)**

            ```hcl
            resource "azuread_conditional_access_policy" "block_legacy_auth" {
              display_name = "Block legacy authentication"
              state        = "enabled"

              conditions {
                users {
                  included_users = ["All"]
                  excluded_users = [azuread_user.breakglass.object_id]  # Break-glass account
                }
                applications {
                  included_applications = ["All"]
                }
                client_app_types = ["exchangeActiveSync", "other"]
              }

              grant_controls {
                operator          = "OR"
                built_in_controls = ["block"]
              }
            }
            ```

            For more details, see [azuread_conditional_access_policy](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/conditional_access_policy) in the Terraform Registry.
