  - uid: mondoo-m365-security-privileged-roles-limited-standing-holders
    title: Ensure few users hold privileged directory roles as standing assignments
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    props:
      - uid: mondooM365SecurityMaxStandingPrivilegedUsers
        title: Most users allowed to hold a privileged directory role as an active assignment
        mql: |
          return 5
    mql: |
      microsoft.users.list.where(
        directoryRoleAssignments.any(roleDefinition.isPrivileged)
      ).length <= props.mondooM365SecurityMaxStandingPrivilegedUsers
    docs:
      desc: |
        This check verifies that only a small number of users hold a privileged Microsoft Entra role at all times.

        Microsoft marks a directory role as privileged when it can manage identities, credentials, authentication, or other roles, so that holding it can lead to control of the tenant. Global Administrator, Privileged Role Administrator, User Administrator, Helpdesk Administrator, and Authentication Administrator are among them. The admin center shows them with a **PRIVILEGED** label under **Entra ID > Roles & admins**. This check counts the users who hold any such role as an active assignment, given to them directly or to a role-assignable group they belong to, and requires no more than five. The limit is configurable.

        **Why this matters**

        Every standing privileged assignment is an account that can take over the tenant the moment it is phished, and attackers pick the least defended one. Helpdesk and user administrators reset passwords and multifactor methods for other users, so taking one of them is enough to take a Global Administrator next.

        Standing assignments also outlive the reason they were granted. A role given for a migration or an incident stays until someone removes it, and nothing prompts that review.

        Hold these roles through Privileged Identity Management eligibility instead, so a user activates the role for a bounded window when the work needs it. Keep the standing count to your emergency access accounts and the few administrators who genuinely need the role every day.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Roles & admins**.
        3. For each role marked **PRIVILEGED**, open it and review the **Active assignments**, counting the members of any group listed.

        A passing tenant has no more than five users with an active assignment to a privileged role. A failing tenant has more.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and count the users holding a privileged role, directly or through a group:

        ```powershell
        Connect-MgGraph -Scopes "RoleManagement.Read.Directory", "GroupMember.Read.All"
        $privileged = Get-MgBetaRoleManagementDirectoryRoleDefinition -Filter "isPrivileged eq true" -All
        $holders = foreach ($role in $privileged) {
            foreach ($a in Get-MgRoleManagementDirectoryRoleAssignment -Filter "roleDefinitionId eq '$($role.Id)'" -All) {
                $obj = Get-MgDirectoryObject -DirectoryObjectId $a.PrincipalId
                switch ($obj.AdditionalProperties['@odata.type']) {
                    '#microsoft.graph.user'  { $a.PrincipalId }
                    '#microsoft.graph.group' { (Get-MgGroupMember -GroupId $a.PrincipalId -All).Id }
                }
            }
        }
        ($holders | Sort-Object -Unique).Count
        ```

        A passing tenant returns five or fewer. A failing tenant returns more.
      remediation:
        - id: console
          desc: |
            **To move privileged roles from standing to eligible assignments using the Microsoft Entra admin center:**

            Privileged Identity Management requires a Microsoft Entra ID P2 or Microsoft Entra ID Governance license.

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **ID Governance** > **Privileged Identity Management** > **Microsoft Entra roles** > **Roles**.
            3. For each privileged role, add an **Eligible** assignment for each user who needs it.
            4. Go to **Assignments** > **Active assignments** and remove the standing assignments that the eligible ones replace.
            5. Keep standing assignments only for emergency access accounts and administrators who need the role every day.
        - id: powershell
          desc: |
            **To replace a standing assignment with an eligible one using Microsoft Graph PowerShell:**

            1. Connect with the required scope:

            ```powershell
            Connect-MgGraph -Scopes "RoleManagement.ReadWrite.Directory"
            ```

            2. Create the eligible assignment:

            ```powershell
            New-MgRoleManagementDirectoryRoleEligibilityScheduleRequest -BodyParameter @{
                action           = "adminAssign"
                principalId      = "<user-object-id>"
                roleDefinitionId = "<role-definition-id>"
                directoryScopeId = "/"
                scheduleInfo     = @{ startDateTime = (Get-Date); expiration = @{ type = "afterDuration"; duration = "P180D" } }
            }
            ```

            3. Remove the standing assignment:

            ```powershell
            $assignment = Get-MgRoleManagementDirectoryRoleAssignment -Filter "principalId eq '<user-object-id>' and roleDefinitionId eq '<role-definition-id>'"
            Remove-MgRoleManagementDirectoryRoleAssignment -UnifiedRoleAssignmentId $assignment.Id
            ```
        - id: terraform
          desc: |
            **To keep standing privileged assignments few using Terraform:**

            Declare the remaining standing assignments explicitly with `azuread_directory_role_assignment`, so each one is reviewed in source control, and remove the resources for users who should activate the role through Privileged Identity Management instead.

            ```hcl
            resource "azuread_directory_role_assignment" "break_glass_global_admin" {
              role_id             = "62e90394-69f5-4237-9190-012177145e10"
              principal_object_id = azuread_user.break_glass.object_id
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/privileged-roles-permissions
        title: Privileged roles and permissions in Microsoft Entra ID
      - url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
        title: What is Microsoft Entra Privileged Identity Management
  # No Terraform variants: whether a user is a guest and which roles it holds are read from the live directory, not from configuration.
  - uid: mondoo-m365-security-guests-hold-no-directory-roles
    title: Ensure guest users hold no directory roles
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-m365-security-guests-hold-no-directory-roles-microsoft365
        tags:
          mondoo.com/filter-title: Microsoft 365
          mondoo.com/filter-icon: microsoft
      - uid: mondoo-m365-security-guests-hold-no-directory-roles-microsoft365-p2
        tags:
          mondoo.com/filter-title: Microsoft 365 with Entra ID P2
          mondoo.com/filter-icon: microsoft
    docs:
      desc: |
        This check verifies that no guest account holds a Microsoft Entra directory role.

        A guest is a user from another organization or a personal account, invited through Microsoft Entra B2B collaboration and authenticated by its home identity provider. Its directory roles are listed on the user under **Entra ID > Users**, on the **Assigned roles** page. This check requires every guest to have no active role assignment, whether given to the guest directly or to a role-assignable group the guest belongs to. On a tenant with Microsoft Entra ID P2, eligible assignments in Privileged Identity Management count too, since the holder can activate the role at any time.

        **Why this matters**

        A guest's credentials, multifactor methods, and account lifecycle are controlled by another organization. Your Conditional Access policies and sign-in risk policies still apply, but whether the account is protected, offboarded when the person leaves, or already compromised is decided somewhere you cannot see.

        A directory role on that account extends the outside organization's weakest point into your tenant's administration. An attacker who takes over the guest's home account inherits the role, and the takeover starts in an environment where your security team has no logs.

        Give external administrators a member account in your tenant that you provision, protect, and remove yourself, or delegate through a partner relationship that you can revoke.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Users** and filter by **User type** equal to **Guest**.
        3. For each guest, open **Assigned roles** and review the **Active assignments** and, on a tenant with Microsoft Entra ID P2, **Eligible assignments** tabs.

        A passing tenant has no guest with an assigned role. A failing tenant has at least one.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list role assignments held by guests, directly or through a group:

        ```powershell
        Connect-MgGraph -Scopes "User.Read.All", "RoleManagement.Read.Directory"
        Get-MgUser -Filter "userType eq 'Guest'" -All | ForEach-Object {
            $roles = Get-MgUserTransitiveMemberOfAsDirectoryRole -UserId $_.Id -All
            if ($roles) { [pscustomobject]@{ Guest = $_.UserPrincipalName; Roles = $roles.DisplayName -join ', ' } }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each guest and its roles.
      remediation:
        - id: console
          desc: |
            **To remove directory roles from guests using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Users** and open the guest.
            3. Select **Assigned roles**, select each role, and choose **Remove assignments**.
            4. If the role comes from a group, remove the guest from that group under **Entra ID** > **Groups**.
            5. Provision a member account for any external administrator who still needs the role.
        - id: powershell
          desc: |
            **To remove a guest's directory role assignments using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "RoleManagement.ReadWrite.Directory"
            Get-MgRoleManagementDirectoryRoleAssignment -Filter "principalId eq '<guest-object-id>'" -All |
                ForEach-Object { Remove-MgRoleManagementDirectoryRoleAssignment -UnifiedRoleAssignmentId $_.Id }
            ```

            Remove the guest from any role-assignable group with `Remove-MgGroupMemberByRef`.
        - id: terraform
          desc: |
            **To remove a guest's directory role using Terraform:**

            Delete the `azuread_directory_role_assignment` resource whose `principal_object_id` is the guest, and assign the role to a member account instead:

            ```hcl
            resource "azuread_directory_role_assignment" "exchange_admin" {
              role_id             = "29232cdf-9323-42fd-ade2-1d097af3e4de"
              principal_object_id = azuread_user.member_admin.object_id
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b
        title: B2B collaboration overview
      - url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices
        title: Best practices for Microsoft Entra roles
  # No Terraform variants: whether an account is disabled and which roles it holds are read from the live directory.
  - uid: mondoo-m365-security-disabled-users-hold-no-directory-roles
    title: Ensure disabled users hold no directory roles
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-3-ii-c-workforce-security-establish-termination-procedures
      compliance/iso-27001-2022: iso-27001-2022-a-5-18
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-5
      compliance/soc2-2017: soc2-control-cc6-2-2
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-m365-security-disabled-users-hold-no-directory-roles-microsoft365
        tags:
          mondoo.com/filter-title: Microsoft 365
          mondoo.com/filter-icon: microsoft
      - uid: mondoo-m365-security-disabled-users-hold-no-directory-roles-microsoft365-p2
        tags:
          mondoo.com/filter-title: Microsoft 365 with Entra ID P2
          mondoo.com/filter-icon: microsoft
    docs:
      desc: |
        This check verifies that accounts blocked from signing in no longer hold Microsoft Entra directory roles.

        Blocking sign-in on a user, shown as **Account enabled** set to **No** under **Entra ID > Users**, is a common first step when someone leaves, but it leaves the user's role assignments in place. This check requires every disabled user to have no active role assignment, directly or through a role-assignable group. On a tenant with Microsoft Entra ID P2, it also requires no eligible assignment in Privileged Identity Management.

        **Why this matters**

        A disabled account with a role is privilege waiting to be switched back on. Any administrator who can enable users, including a compromised helpdesk account, can re-enable it and sign in with the role already attached, and the event looks like a routine account change rather than a privilege grant.

        It also hides who holds a role. Reviews of administrator accounts skip disabled users, so a role parked on one is never reviewed.

        Remove the role assignments as part of offboarding, before or together with blocking sign-in.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Users** and filter by **Account enabled** equal to **No**.
        3. For each user, open **Assigned roles** and review the **Active assignments** and, on a tenant with Microsoft Entra ID P2, **Eligible assignments** tabs.

        A passing tenant has no disabled user with an assigned role. A failing tenant has at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "User.Read.All", "RoleManagement.Read.Directory"
        Get-MgUser -Filter "accountEnabled eq false" -All | ForEach-Object {
            $roles = Get-MgUserTransitiveMemberOfAsDirectoryRole -UserId $_.Id -All
            if ($roles) { [pscustomobject]@{ User = $_.UserPrincipalName; Roles = $roles.DisplayName -join ', ' } }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each disabled user and its roles.
      remediation:
        - id: console
          desc: |
            **To remove directory roles from disabled users using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Users** and open the disabled user.
            3. Select **Assigned roles**, select each role, and choose **Remove assignments**.
            4. Remove the user from any role-assignable group that grants a role.
        - id: powershell
          desc: |
            **To remove a disabled user's directory role assignments using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "RoleManagement.ReadWrite.Directory"
            Get-MgRoleManagementDirectoryRoleAssignment -Filter "principalId eq '<user-object-id>'" -All |
                ForEach-Object { Remove-MgRoleManagementDirectoryRoleAssignment -UnifiedRoleAssignmentId $_.Id }
            ```
        - id: terraform
          desc: |
            **To remove a disabled user's directory role using Terraform:**

            Delete the `azuread_directory_role_assignment` resources whose `principal_object_id` is the disabled user. When the user is managed as `azuread_user` with `account_enabled = false`, remove its role assignments in the same change.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/manage-roles-portal
        title: Assign Microsoft Entra roles
  # No Terraform variants: sign-in activity is runtime telemetry with no configuration counterpart.
  - uid: mondoo-m365-security-privileged-users-recent-sign-in
    title: Ensure users holding privileged directory roles have signed in recently
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-08
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-ii-c-information-access-management-access-establishment-and-modification
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-2-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    props:
      - uid: mondooM365SecurityPrivilegedUserInactiveDays
        title: Days without an interactive sign-in after which a privileged user is considered dormant
        mql: |
          return 90
    variants:
      - uid: mondoo-m365-security-privileged-users-recent-sign-in-microsoft365
        tags:
          mondoo.com/filter-title: Microsoft 365
          mondoo.com/filter-icon: microsoft
      - uid: mondoo-m365-security-privileged-users-recent-sign-in-microsoft365-p2
        tags:
          mondoo.com/filter-title: Microsoft 365 with Entra ID P2
          mondoo.com/filter-icon: microsoft
    docs:
      desc: |
        This check verifies that every account holding a privileged Microsoft Entra role is in active use.

        Microsoft Entra records each user's last interactive sign-in, shown under **Entra ID > Users** in the **Last sign-in** column and on the user's **Sign-in logs**. This check looks at every user holding a role Microsoft marks as privileged, as an active assignment given directly or through a role-assignable group, or on a tenant with Microsoft Entra ID P2 as an eligible assignment in Privileged Identity Management, and requires an interactive sign-in within the last 90 days. A user who has never signed in fails. The period is configurable, and the data requires a Microsoft Entra ID P1 or P2 license.

        **Why this matters**

        An administrator account nobody uses is an administrator account nobody would notice being used. Its owner does not see the multifactor prompts or the new devices, and its sign-ins stand out to no one because nobody expects any.

        Dormant privileged accounts are usually left over: a former project, a consultant who finished, a test account given a role. Each keeps the full power of its role while protecting it with whatever was configured when it was last used.

        Remove the role from accounts that no longer need it, or disable the account. Emergency access accounts are meant to be dormant; track them separately and alert on their sign-ins instead.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Roles & admins** and note the users holding each role marked **PRIVILEGED**.
        3. Go to **Entra ID** > **Users**, add the **Last sign-in** column, and find those users.

        A passing tenant shows a sign-in within the last 90 days for each of them. A failing tenant has one older than that, or none.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "User.Read.All", "AuditLog.Read.All", "RoleManagement.Read.Directory"
        $cutoff = (Get-Date).AddDays(-90)
        $ids = Get-MgBetaRoleManagementDirectoryRoleDefinition -Filter "isPrivileged eq true" -All | ForEach-Object {
            (Get-MgRoleManagementDirectoryRoleAssignment -Filter "roleDefinitionId eq '$($_.Id)'" -All).PrincipalId
        } | Sort-Object -Unique
        foreach ($id in $ids) {
            $u = Get-MgUser -UserId $id -Property UserPrincipalName,SignInActivity -ErrorAction SilentlyContinue
            if ($u -and ($null -eq $u.SignInActivity.LastSignInDateTime -or $u.SignInActivity.LastSignInDateTime -lt $cutoff)) {
                $u.UserPrincipalName
            }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists the dormant privileged users. The script covers direct assignments; review the members of groups holding a privileged role the same way.
      remediation:
        - id: console
          desc: |
            **To remove privileged roles from dormant accounts using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Users** and open the dormant user.
            3. Select **Assigned roles** and remove each privileged role the user no longer needs.
            4. If the account is no longer needed at all, set **Account enabled** to **No** and delete it after your retention period.
        - id: powershell
          desc: |
            **To remove a dormant user's privileged role assignments using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "RoleManagement.ReadWrite.Directory"
            Get-MgRoleManagementDirectoryRoleAssignment -Filter "principalId eq '<user-object-id>'" -All |
                ForEach-Object { Remove-MgRoleManagementDirectoryRoleAssignment -UnifiedRoleAssignmentId $_.Id }
            ```
        # No Terraform remediation: whether an account signs in is operational activity, not configuration Terraform manages.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/howto-manage-inactive-user-accounts
        title: How to manage inactive user accounts
  # No Terraform variants: whether an account is synchronized from on-premises Active Directory is decided by Microsoft Entra Connect, not by a Terraform resource.
  - uid: mondoo-m365-security-privileged-users-cloud-only
    title: Ensure users holding privileged directory roles are cloud-only accounts
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-m365-security-privileged-users-cloud-only-microsoft365
        tags:
          mondoo.com/filter-title: Microsoft 365
          mondoo.com/filter-icon: microsoft
      - uid: mondoo-m365-security-privileged-users-cloud-only-microsoft365-p2
        tags:
          mondoo.com/filter-title: Microsoft 365 with Entra ID P2
          mondoo.com/filter-icon: microsoft
    docs:
      desc: |
        This check verifies that accounts holding privileged Microsoft Entra roles exist only in the cloud and are not synchronized from on-premises Active Directory.

        Microsoft Entra Connect and Cloud Sync copy users from Active Directory into Microsoft Entra. A synchronized user shows **On-premises sync enabled** set to **Yes** under **Entra ID > Users**, and its password and attributes are controlled from Active Directory. This check requires every user holding a role Microsoft marks as privileged, directly or through a role-assignable group, to be a cloud-only account. On a tenant with Microsoft Entra ID P2, eligible assignments in Privileged Identity Management count too, since the holder can activate the role at any time.

        **Why this matters**

        A synchronized administrator ties the security of the cloud tenant to the on-premises domain. An attacker who compromises Active Directory, often the softer target, can reset that user's password on-premises and let synchronization carry it to the cloud, gaining the cloud role without touching any cloud defense.

        A cloud-only administrator account breaks that path. The domain can fall without handing over the tenant, which is the separation incident responders need when the on-premises environment is the one under attack.

        Create a dedicated cloud-only account for each administrator, assign the privileged roles to it, and remove them from the synchronized account.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Roles & admins** and note the users holding each role marked **PRIVILEGED**.
        3. Go to **Entra ID** > **Users**, add the **On-premises sync enabled** column, and find those users.

        A passing tenant shows **No** for each of them. A failing tenant shows **Yes** for at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "User.Read.All", "RoleManagement.Read.Directory"
        $ids = Get-MgBetaRoleManagementDirectoryRoleDefinition -Filter "isPrivileged eq true" -All | ForEach-Object {
            (Get-MgRoleManagementDirectoryRoleAssignment -Filter "roleDefinitionId eq '$($_.Id)'" -All).PrincipalId
        } | Sort-Object -Unique
        foreach ($id in $ids) {
            $u = Get-MgUser -UserId $id -Property UserPrincipalName,OnPremisesSyncEnabled -ErrorAction SilentlyContinue
            if ($u.OnPremisesSyncEnabled) { $u.UserPrincipalName }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists the synchronized privileged users.
      remediation:
        - id: console
          desc: |
            **To move privileged roles to cloud-only accounts using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Users** > **New user** > **Create new user** and create an account in an `onmicrosoft.com` or cloud-managed domain for the administrator.
            3. Assign the privileged roles to the new account under **Assigned roles**.
            4. Open the synchronized account and remove the same roles.
        - id: powershell
          desc: |
            **To create a cloud-only administrator account using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "User.ReadWrite.All", "RoleManagement.ReadWrite.Directory"
            $admin = New-MgUser -DisplayName "Admin - <name>" -UserPrincipalName "admin-<name>@<tenant>.onmicrosoft.com" `
                -MailNickname "admin-<name>" -AccountEnabled `
                -PasswordProfile @{ ForceChangePasswordNextSignIn = $true; Password = "<temporary-password>" }
            New-MgRoleManagementDirectoryRoleAssignment -PrincipalId $admin.Id -RoleDefinitionId "<role-definition-id>" -DirectoryScopeId "/"
            ```

            Then remove the role from the synchronized account with `Remove-MgRoleManagementDirectoryRoleAssignment`.
        - id: terraform
          desc: |
            **To assign privileged roles to cloud-only accounts using Terraform:**

            Create the administrator as an `azuread_user`, which is always cloud-only, and point the role assignment at it:

            ```hcl
            resource "azuread_user" "admin" {
              user_principal_name = "admin-jane@contoso.onmicrosoft.com"
              display_name        = "Admin - Jane"
              password            = var.initial_password
            }

            resource "azuread_directory_role_assignment" "admin_user_admin" {
              role_id             = "fe930be7-5e62-47db-91af-98c3a49a38b1"
              principal_object_id = azuread_user.admin.object_id
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/architecture/protect-m365-from-on-premises-attacks
        title: Protecting Microsoft 365 from on-premises attacks
  # No Terraform variants: the check covers every service principal's role holdings across the tenant, which no single azuread resource describes.
  - uid: mondoo-m365-security-service-principals-no-privileged-directory-roles
    title: Ensure service principals hold no privileged directory roles
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-5
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    props:
      - uid: mondooM365SecurityAllowedServicePrincipalRoles
        title: Template IDs of privileged directory roles a service principal may hold, such as Global Reader for a read-only scanner
        mql: |
          return ["f2ef992c-3afb-46b9-b7cf-a126ee74c451"]
    variants:
      - uid: mondoo-m365-security-service-principals-no-privileged-directory-roles-microsoft365
        tags:
          mondoo.com/filter-title: Microsoft 365
          mondoo.com/filter-icon: microsoft
      - uid: mondoo-m365-security-service-principals-no-privileged-directory-roles-microsoft365-p2
        tags:
          mondoo.com/filter-title: Microsoft 365 with Entra ID P2
          mondoo.com/filter-icon: microsoft
    docs:
      desc: |
        This check verifies that no application or workload identity holds a privileged Microsoft Entra role.

        Service principals, the identities of applications and managed identities in your tenant, can be assigned directory roles like users. Their roles are listed under **Entra ID > Enterprise apps**, on the application's **Roles and administrators** page. This check requires that no service principal holds a role Microsoft marks as privileged, directly or through a role-assignable group, other than roles on an allowlist. On a tenant with Microsoft Entra ID P2, eligible assignments in Privileged Identity Management count too. The allowlist starts with Global Reader, the read-only role security scanners commonly use, and is configurable.

        **Why this matters**

        A privileged service principal is a tenant administrator that never signs in with multifactor authentication. It authenticates with a secret or certificate, often stored in a pipeline, a configuration file, or a vendor's systems, and anyone holding that credential holds the role.

        Conditional Access for users does not apply to it, its sign-ins are not reviewed the way an administrator's are, and owners of the application can add new credentials to it. Attackers who reach a tenant look for these identities first, because they turn one leaked secret into persistent administrative access.

        Give applications Microsoft Graph application permissions scoped to the task instead of directory roles, and review any remaining role on a service principal as carefully as a Global Administrator.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Roles & admins**.
        3. For each role marked **PRIVILEGED**, open **Active assignments** and look for entries of type **ServicePrincipal**.

        A passing tenant has no service principal holding a privileged role other than Global Reader. A failing tenant has at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "RoleManagement.Read.Directory", "Application.Read.All"
        foreach ($role in Get-MgBetaRoleManagementDirectoryRoleDefinition -Filter "isPrivileged eq true" -All) {
            if ($role.TemplateId -eq 'f2ef992c-3afb-46b9-b7cf-a126ee74c451') { continue }
            foreach ($a in Get-MgRoleManagementDirectoryRoleAssignment -Filter "roleDefinitionId eq '$($role.Id)'" -All) {
                $sp = Get-MgServicePrincipal -ServicePrincipalId $a.PrincipalId -ErrorAction SilentlyContinue
                if ($sp) { [pscustomobject]@{ App = $sp.DisplayName; Role = $role.DisplayName } }
            }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each service principal and privileged role.
      remediation:
        - id: console
          desc: |
            **To remove privileged roles from service principals using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Roles & admins** and open the privileged role.
            3. Select the service principal under **Active assignments** and choose **Remove assignments**.
            4. Grant the application the specific Microsoft Graph application permissions it needs under **App registrations** > **API permissions** instead.
        - id: powershell
          desc: |
            **To remove a service principal's privileged role using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "RoleManagement.ReadWrite.Directory"
            Get-MgRoleManagementDirectoryRoleAssignment -Filter "principalId eq '<service-principal-object-id>'" -All |
                ForEach-Object { Remove-MgRoleManagementDirectoryRoleAssignment -UnifiedRoleAssignmentId $_.Id }
            ```
        - id: terraform
          desc: |
            **To remove a service principal's privileged role using Terraform:**

            Delete the `azuread_directory_role_assignment` resource whose `principal_object_id` is the service principal, and grant a scoped application permission with `azuread_app_role_assignment` instead:

            ```hcl
            resource "azuread_app_role_assignment" "read_users" {
              app_role_id         = azuread_service_principal.msgraph.app_role_ids["User.Read.All"]
              principal_object_id = azuread_service_principal.app.object_id
              resource_object_id  = azuread_service_principal.msgraph.object_id
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/privileged-roles-permissions
        title: Privileged roles and permissions in Microsoft Entra ID
      - url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identities-overview
        title: What are workload identities
  # No Terraform variants: plan and state record group members only as object IDs, which do not say whether a member is a user or a service principal.
  - uid: mondoo-m365-security-role-assignable-groups-no-service-principal-members
    title: Ensure role-assignable groups have no service principal members
    filters: |
      asset.platform == "microsoft365"
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-5
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      microsoft.groups.list.where(isAssignableToRole).all(
        transitiveMemberServicePrincipals.length == 0
      )
    docs:
      desc: |
        This check verifies that no application identity holds a directory role through membership in a role-assignable group.

        A role-assignable group is a Microsoft Entra group created with **Microsoft Entra roles can be assigned to the group** set to **Yes**. Every member holds the roles assigned to the group. Members can be users and service principals, which are listed under **Entra ID > Groups**, on the group's **Members** page. This check requires that no role-assignable group has a service principal among its members, directly or through a nested group.

        **Why this matters**

        Group membership is an indirect way to give an application a directory role, and it is easy to miss. Reviews of a service principal's roles look at its own assignments, while the group shows only that its members hold a role, so a privileged application in a group appears in neither list.

        The application then authenticates with a secret or certificate, outside the multifactor and Conditional Access controls that protect the human members, and anyone with that credential holds every role the group carries.

        Keep role-assignable groups for people, and give applications only the scoped permissions they need.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Groups** and filter for groups where **Microsoft Entra roles can be assigned to the group** is **Yes**.
        3. Open each group's **Members** and look for members of type **Service principal**, including inside nested groups.

        A passing tenant has none. A failing tenant has at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "Group.Read.All", "GroupMember.Read.All"
        Get-MgGroup -Filter "isAssignableToRole eq true" -All | ForEach-Object {
            $sps = Get-MgGroupTransitiveMemberAsServicePrincipal -GroupId $_.Id -All
            if ($sps) { [pscustomobject]@{ Group = $_.DisplayName; ServicePrincipals = $sps.DisplayName -join ', ' } }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each group and its service principal members.
      remediation:
        - id: console
          desc: |
            **To remove service principals from role-assignable groups using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Groups** and open the role-assignable group.
            3. Select **Members**, select the service principal, and choose **Remove**.
        - id: powershell
          desc: |
            **To remove a service principal from a role-assignable group using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "GroupMember.ReadWrite.All"
            Remove-MgGroupMemberByRef -GroupId "<group-object-id>" -DirectoryObjectId "<service-principal-object-id>"
            ```
        - id: terraform
          desc: |
            **To keep service principals out of a role-assignable group using Terraform:**

            Remove the `azuread_group_member` resource that adds the service principal, and list only user members on the group:

            ```hcl
            resource "azuread_group" "helpdesk_admins" {
              display_name       = "Helpdesk Admins"
              security_enabled   = true
              assignable_to_role = true
              members            = [azuread_user.alice.object_id, azuread_user.bob.object_id]
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/groups-concept
        title: Use Microsoft Entra groups to manage role assignments
  # No Terraform variants: whether an application is third-party and which permissions it was granted are read from the live tenant; a Terraform configuration only describes the grants it manages.
  - uid: mondoo-m365-security-third-party-apps-no-high-risk-graph-permissions
    title: Ensure third-party apps hold no high-risk Microsoft Graph app permissions
    filters: |
      asset.platform == "microsoft365"
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-5
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    props:
      - uid: mondooM365SecurityHighRiskGraphApplicationPermissions
        title: Microsoft Graph application permissions that allow taking over the tenant
        mql: |
          return [
            "RoleManagement.ReadWrite.Directory",
            "AppRoleAssignment.ReadWrite.All",
            "Application.ReadWrite.All",
            "Directory.ReadWrite.All",
            "Domain.ReadWrite.All",
            "UserAuthenticationMethod.ReadWrite.All",
            "Policy.ReadWrite.AuthenticationMethod",
            "Policy.ReadWrite.ConditionalAccess",
            "PrivilegedAccess.ReadWrite.AzureADGroup",
            "PrivilegedAssignmentSchedule.ReadWrite.AzureADGroup",
            "PrivilegedEligibilitySchedule.ReadWrite.AzureADGroup",
            "RoleAssignmentSchedule.ReadWrite.Directory",
            "RoleEligibilitySchedule.ReadWrite.Directory"
          ]
    mql: |
      microsoft.serviceprincipals.where(isFirstParty == false).all(
        permissions.where(
          type == "application" &&
          status == "granted" &&
          resource.appId == "00000003-0000-0000-c000-000000000000"
        ).none(name.in(props.mondooM365SecurityHighRiskGraphApplicationPermissions))
      )
    docs:
      desc: |
        This check verifies that no third-party application holds a Microsoft Graph permission that lets it take over the tenant.

        Application permissions let an application call Microsoft Graph as itself, with no user signed in. An administrator grants them under **Entra ID > Enterprise apps**, on the application's **Permissions** page. Some of them reach far beyond reading data: `RoleManagement.ReadWrite.Directory` assigns any directory role, `AppRoleAssignment.ReadWrite.All` grants any permission to any application, `Application.ReadWrite.All` adds credentials to any application, and `UserAuthenticationMethod.ReadWrite.All` registers sign-in methods on any account. This check requires that no application owned by an organization other than Microsoft holds one of these permissions on Microsoft Graph. The list is configurable.

        **Why this matters**

        Each of these permissions can be turned into control of the tenant. An application holding `RoleManagement.ReadWrite.Directory` can make any account a Global Administrator; one holding `AppRoleAssignment.ReadWrite.All` can grant itself that permission next. No user signs in, so multifactor authentication and Conditional Access for users never apply.

        For a third-party application, the credential that unlocks these permissions is held by the vendor, in its systems, under its security practices. A breach at the vendor becomes administrative access to every tenant that granted the permission.

        Grant third-party applications the narrowest permissions that do the job, prefer delegated permissions that act only as the signed-in user, and review every grant of the permissions on this list as you would a new Global Administrator.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Enterprise apps** and set **Application type** to **All applications**.
        3. For each application not published by Microsoft, open **Permissions** and review the **Admin consent** tab for Microsoft Graph permissions of type **Application**.

        A passing tenant has no third-party application with any of the permissions listed in the description. A failing tenant has at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "Application.Read.All"
        $risky = @("RoleManagement.ReadWrite.Directory","AppRoleAssignment.ReadWrite.All","Application.ReadWrite.All",
                   "Directory.ReadWrite.All","Domain.ReadWrite.All","UserAuthenticationMethod.ReadWrite.All",
                   "Policy.ReadWrite.AuthenticationMethod","Policy.ReadWrite.ConditionalAccess",
                   "PrivilegedAccess.ReadWrite.AzureADGroup","PrivilegedAssignmentSchedule.ReadWrite.AzureADGroup",
                   "PrivilegedEligibilitySchedule.ReadWrite.AzureADGroup","RoleAssignmentSchedule.ReadWrite.Directory",
                   "RoleEligibilitySchedule.ReadWrite.Directory")
        $graph = Get-MgServicePrincipal -Filter "appId eq '00000003-0000-0000-c000-000000000000'"
        $tenantId = (Get-MgContext).TenantId
        Get-MgServicePrincipalAppRoleAssignedTo -ServicePrincipalId $graph.Id -All | ForEach-Object {
            $role = ($graph.AppRoles | Where-Object Id -eq $_.AppRoleId).Value
            if ($role -in $risky) {
                $sp = Get-MgServicePrincipal -ServicePrincipalId $_.PrincipalId
                if ($sp.AppOwnerOrganizationId -ne 'f8cdef31-a31e-4b4a-93e4-5f571e91255a') {
                    [pscustomobject]@{ App = $sp.DisplayName; Permission = $role }
                }
            }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each third-party application and high-risk permission. Applications owned by your own tenant, `$tenantId`, are included because they are not published by Microsoft.
      remediation:
        - id: console
          desc: |
            **To revoke high-risk Microsoft Graph permissions from an application using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Enterprise apps** and open the application.
            3. Select **Permissions**, find the permission on the **Admin consent** tab, and choose **Revoke permission**.
            4. Ask the vendor for the narrowest permission the integration needs and grant only that.
        - id: powershell
          desc: |
            **To revoke an application permission using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "AppRoleAssignment.ReadWrite.All", "Application.Read.All"
            $sp = Get-MgServicePrincipal -Filter "displayName eq '<application name>'"
            Get-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $sp.Id -All |
                Where-Object AppRoleId -eq "<app-role-id>" |
                ForEach-Object { Remove-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $sp.Id -AppRoleAssignmentId $_.Id }
            ```
        - id: terraform
          desc: |
            **To revoke a high-risk application permission using Terraform:**

            Remove the `azuread_app_role_assignment` resource that grants the permission, and grant a narrower one instead:

            ```hcl
            resource "azuread_app_role_assignment" "vendor_read_users" {
              app_role_id         = azuread_service_principal.msgraph.app_role_ids["User.Read.All"]
              principal_object_id = azuread_service_principal.vendor.object_id
              resource_object_id  = azuread_service_principal.msgraph.object_id
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/graph/permissions-reference
        title: Microsoft Graph permissions reference
      - url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/manage-application-permissions
        title: Review permissions granted to enterprise applications
  # No Terraform variants: whether a consent grant is tenant-wide and which application holds it is read from the live tenant.
  - uid: mondoo-m365-security-no-tenant-wide-consent-high-risk-delegated-scopes
    title: Ensure third-party apps have no tenant-wide high-risk delegated consent
    filters: |
      asset.platform == "microsoft365"
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-5
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    props:
      - uid: mondooM365SecurityHighRiskDelegatedPermissions
        title: Delegated Microsoft Graph permissions that must not be consented for every user
        mql: |
          return [
            "Directory.AccessAsUser.All",
            "Directory.ReadWrite.All",
            "RoleManagement.ReadWrite.Directory",
            "Application.ReadWrite.All",
            "AppRoleAssignment.ReadWrite.All",
            "User.ReadWrite.All",
            "Group.ReadWrite.All",
            "Mail.ReadWrite",
            "Mail.Send",
            "MailboxSettings.ReadWrite",
            "Files.ReadWrite.All",
            "Sites.ReadWrite.All",
            "Sites.FullControl.All"
          ]
    mql: |
      microsoft.serviceprincipals.where(isFirstParty == false).all(
        permissions.where(
          type == "delegated" &&
          status == "granted" &&
          consentType == "AllPrincipals"
        ).none(name.in(props.mondooM365SecurityHighRiskDelegatedPermissions))
      )
    docs:
      desc: |
        This check verifies that no third-party application was given broad access to every user's data through tenant-wide consent.

        Delegated permissions let an application act as the signed-in user. An administrator can consent to them for the whole organization, shown under **Entra ID > Enterprise apps** on the application's **Permissions** page, **Admin consent** tab. From then on, any user who signs in to the application hands it that access without a prompt. This check requires that no application owned by an organization other than Microsoft has organization-wide consent to a high-risk delegated permission, such as `Mail.ReadWrite`, `Files.ReadWrite.All`, or `Directory.AccessAsUser.All`. The list is configurable.

        **Why this matters**

        A single administrator click grants the application the right to read and write the mailbox, files, or directory of every user who ever signs in to it. Users are never asked, so they never get the chance to notice that a calendar plug-in wants their whole mailbox.

        The application's tokens are held by its vendor. If the vendor is breached, or the application was malicious from the start, the attacker reads the organization's mail and documents through Microsoft Graph using refresh tokens that survive password resets and are not challenged for multifactor authentication.

        Prefer per-user consent for broad scopes, grant tenant-wide consent only to the narrow scopes an integration needs, and route requests through the admin consent workflow so each grant is reviewed.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Enterprise apps** and set **Application type** to **All applications**.
        3. For each application not published by Microsoft, open **Permissions** and review the **Admin consent** tab for delegated Microsoft Graph permissions.

        A passing tenant has no third-party application with organization-wide consent to a permission listed in the description. A failing tenant has at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "Directory.Read.All"
        $risky = @("Directory.AccessAsUser.All","Directory.ReadWrite.All","RoleManagement.ReadWrite.Directory",
                   "Application.ReadWrite.All","AppRoleAssignment.ReadWrite.All","User.ReadWrite.All",
                   "Group.ReadWrite.All","Mail.ReadWrite","Mail.Send","MailboxSettings.ReadWrite",
                   "Files.ReadWrite.All","Sites.ReadWrite.All","Sites.FullControl.All")
        Get-MgOauth2PermissionGrant -Filter "consentType eq 'AllPrincipals'" -All | ForEach-Object {
            $sp = Get-MgServicePrincipal -ServicePrincipalId $_.ClientId
            $hit = ($_.Scope -split ' ') | Where-Object { $_ -in $risky }
            if ($hit -and $sp.AppOwnerOrganizationId -ne 'f8cdef31-a31e-4b4a-93e4-5f571e91255a') {
                [pscustomobject]@{ App = $sp.DisplayName; Scopes = $hit -join ' ' }
            }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each application and its high-risk scopes.
      remediation:
        - id: console
          desc: |
            **To revoke tenant-wide consent using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Enterprise apps** and open the application.
            3. Select **Permissions**, find the delegated permission on the **Admin consent** tab, and choose **Revoke permission**.
            4. Under **Enterprise apps** > **Consent and permissions** > **Admin consent settings**, turn on the admin consent workflow so future requests are reviewed.
        - id: powershell
          desc: |
            **To remove a high-risk scope from a tenant-wide grant using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "DelegatedPermissionGrant.ReadWrite.All"
            $grant = Get-MgOauth2PermissionGrant -Filter "clientId eq '<service-principal-object-id>' and consentType eq 'AllPrincipals'"
            $keep = ($grant.Scope -split ' ') | Where-Object { $_ -notin @("Mail.ReadWrite","Files.ReadWrite.All") }
            if ($keep) {
                Update-MgOauth2PermissionGrant -OAuth2PermissionGrantId $grant.Id -Scope ($keep -join ' ')
            } else {
                Remove-MgOauth2PermissionGrant -OAuth2PermissionGrantId $grant.Id
            }
            ```
        - id: terraform
          desc: |
            **To limit a tenant-wide delegated grant using Terraform:**

            Keep only the narrow scopes in the `azuread_service_principal_delegated_permission_grant` resource. A grant without `user_object_id` applies to every user:

            ```hcl
            resource "azuread_service_principal_delegated_permission_grant" "vendor" {
              service_principal_object_id          = azuread_service_principal.vendor.object_id
              resource_service_principal_object_id = azuread_service_principal.msgraph.object_id
              claim_values                         = ["openid", "profile", "User.Read"]
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent
        title: Grant tenant-wide admin consent to an application
      - url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-admin-consent-workflow
        title: Configure the admin consent workflow
  # No Terraform variants: sign-in activity is runtime telemetry with no configuration counterpart.
  - uid: mondoo-m365-security-third-party-service-principals-recently-used
    title: Ensure third-party applications with granted permissions are in use
    filters: |
      asset.platform == "microsoft365"
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-ii-c-information-access-management-access-establishment-and-modification
      compliance/iso-27001-2022: iso-27001-2022-a-5-18
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-5-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    props:
      - uid: mondooM365SecurityServicePrincipalInactiveDays
        title: Days without a sign-in after which an application with granted permissions is considered unused
        mql: |
          return 90
    mql: |
      microsoft.serviceprincipals.where(
        isFirstParty == false &&
        permissions.any(status == "granted")
      ).all(
        lastSignInDateTime != empty &&
        lastSignInDateTime > time.now - props.mondooM365SecurityServicePrincipalInactiveDays * time.day
      )
    docs:
      desc: |
        This check verifies that applications holding permissions in the tenant are still in use.

        Microsoft Entra records when each application last signed in, shown under **Entra ID > Enterprise apps** in the **Usage & insights** report and on the application's **Sign-in logs**. This check looks at every application not published by Microsoft that holds a granted permission, and requires a sign-in within the last 90 days. An application that has never signed in fails. The period is configurable, and the data requires a Microsoft Entra ID P1 or P2 license. Microsoft refreshes the activity report periodically, so the most recent sign-ins can be missing for a few days.

        **Why this matters**

        An unused application keeps every permission it was granted. Integrations get trialed, replaced, or abandoned, and nobody removes the enterprise application, so its access to mail, files, or the directory stays live with no business owner watching it.

        Its credentials stay live too. A forgotten client secret in a retired build server or an old vendor account still unlocks those permissions, and because nothing legitimate signs in as the application, a sign-in by an attacker is the only activity it shows and nobody is looking.

        Remove applications nobody uses, or at least revoke their permissions and disable sign-in for them.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Enterprise apps** > **Usage & insights** > **Service principal sign-in activity**.
        3. Compare the list with the applications that hold permissions under each application's **Permissions** page.

        A passing tenant shows a sign-in within the last 90 days for every third-party application with permissions. A failing tenant has one with an older sign-in or none.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "AuditLog.Read.All", "Application.Read.All"
        $cutoff = (Get-Date).AddDays(-90)
        $activity = Get-MgBetaReportServicePrincipalSignInActivity -All
        Get-MgServicePrincipal -All | Where-Object AppOwnerOrganizationId -ne 'f8cdef31-a31e-4b4a-93e4-5f571e91255a' | ForEach-Object {
            $grants = Get-MgServicePrincipalAppRoleAssignment -ServicePrincipalId $_.Id -All
            $last = ($activity | Where-Object AppId -eq $_.AppId).LastSignInActivity.LastSignInDateTime
            if ($grants -and ($null -eq $last -or $last -lt $cutoff)) { [pscustomobject]@{ App = $_.DisplayName; LastSignIn = $last } }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each unused application. The script checks application permissions; check delegated grants with `Get-MgServicePrincipalOauth2PermissionGrant` the same way.
      remediation:
        - id: console
          desc: |
            **To remove an unused application using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Enterprise apps** and open the application.
            3. To keep the application but cut its access, select **Properties**, set **Enabled for users to sign-in?** to **No**, and revoke its permissions under **Permissions**.
            4. To remove it, select **Properties** > **Delete**.
        - id: powershell
          desc: |
            **To disable or delete an unused application using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "Application.ReadWrite.All"
            Update-MgServicePrincipal -ServicePrincipalId "<service-principal-object-id>" -AccountEnabled:$false
            Remove-MgServicePrincipal -ServicePrincipalId "<service-principal-object-id>"
            ```
        - id: terraform
          desc: |
            **To disable an unused application using Terraform:**

            Remove the `azuread_service_principal` resource, or disable sign-in while you confirm nothing depends on it:

            ```hcl
            resource "azuread_service_principal" "vendor" {
              client_id       = "<application-client-id>"
              account_enabled = false
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-usage-insights-report
        title: Usage and insights report
  # No Terraform variants: credential use is runtime telemetry with no configuration counterpart.
  - uid: mondoo-m365-security-application-credentials-recently-used
    title: Ensure application secrets and certificates are in use
    filters: |
      asset.platform == "microsoft365"
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-1
    props:
      - uid: mondooM365SecurityCredentialInactiveDays
        title: Days without a sign-in after which an application secret or certificate is considered unused
        mql: |
          return 90
    mql: |
      microsoft.applications.all(
        secrets.all(
          expired == true ||
          startDateTime > time.now - props.mondooM365SecurityCredentialInactiveDays * time.day ||
          lastSignInDateTime != empty && lastSignInDateTime > time.now - props.mondooM365SecurityCredentialInactiveDays * time.day
        )
      )
      microsoft.applications.all(
        certificates.all(
          expired == true ||
          startDateTime > time.now - props.mondooM365SecurityCredentialInactiveDays * time.day ||
          lastSignInDateTime != empty && lastSignInDateTime > time.now - props.mondooM365SecurityCredentialInactiveDays * time.day
        )
      )
    docs:
      desc: |
        This check verifies that every valid client secret and certificate on an application registration is actually used to sign in.

        Application registrations authenticate with client secrets and certificates, listed under **Entra ID > App registrations** on the application's **Certificates & secrets** page. Microsoft Entra records when each one was last used to sign in. This check requires every credential that has not expired to have signed in within the last 90 days, unless it was created within that period. The period is configurable, and the data requires a Microsoft Entra ID P1 or P2 license. Microsoft refreshes the activity report periodically, so the most recent sign-ins can be missing for a few days.

        **Why this matters**

        An unused credential is pure exposure. It grants the application's full access to whoever holds it, yet nothing depends on it, so revoking it costs nothing. These are typically secrets created during setup and copied into a script or ticket, credentials replaced during a rotation but never deleted, or certificates left from an old deployment.

        Attackers who gain access to a developer machine, a pipeline log, or a vendor's systems look for exactly these, and a credential nobody uses is one whose misuse nobody notices, since any sign-in at all is the anomaly.

        Delete credentials that are not in use, and keep one active secret or certificate per application wherever possible.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Enterprise apps** > **Usage & insights** > **Application credential activity**.
        3. Review the credentials with no recent sign-in.

        A passing tenant has no unexpired credential older than 90 days without a sign-in in that period. A failing tenant has at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "AuditLog.Read.All"
        $cutoff = (Get-Date).AddDays(-90)
        Get-MgBetaReportAppCredentialSignInActivity -All |
            Where-Object { $_.ExpirationDateTime -gt (Get-Date) -and $_.CreatedDateTime -lt $cutoff -and
                           ($null -eq $_.SignInActivity.LastSignInDateTime -or $_.SignInActivity.LastSignInDateTime -lt $cutoff) } |
            Select-Object AppId, KeyId, KeyType, CreatedDateTime
        ```

        A passing tenant returns nothing. A failing tenant lists each unused credential. The report lists credentials that signed in at least once; also compare each application's **Certificates & secrets** page against it for credentials that never signed in.
      remediation:
        - id: console
          desc: |
            **To delete an unused credential using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **App registrations** and open the application.
            3. Select **Certificates & secrets**, find the credential by its description or key ID, and choose **Delete**.
        - id: powershell
          desc: |
            **To delete an unused credential using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "Application.ReadWrite.All"
            $app = Get-MgApplication -Filter "appId eq '<application-client-id>'"
            Remove-MgApplicationPassword -ApplicationId $app.Id -KeyId "<secret-key-id>"
            Update-MgApplication -ApplicationId $app.Id -KeyCredentials ($app.KeyCredentials | Where-Object KeyId -ne "<certificate-key-id>")
            ```
        - id: terraform
          desc: |
            **To remove an unused secret using Terraform:**

            Delete the `azuread_application_password` resource for the unused secret, and keep a single rotated one:

            ```hcl
            resource "azuread_application_password" "current" {
              application_id = azuread_application.app.id
              end_date       = "2027-01-01T00:00:00Z"
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-usage-insights-report
        title: Usage and insights report
      - url: https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials
        title: Add and manage application credentials
  # No Terraform variants: the check joins granted permissions with ownership across all applications in the tenant.
  - uid: mondoo-m365-security-privileged-applications-no-service-principal-owners
    title: Ensure high-risk apps are not owned by service principals
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-4
      compliance/soc2-2017: soc2-control-cc6-2-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    props:
      - uid: mondooM365SecurityOwnerRestrictedGraphApplicationPermissions
        title: Microsoft Graph application permissions whose holders must not be owned by a service principal
        mql: |
          return [
            "RoleManagement.ReadWrite.Directory",
            "AppRoleAssignment.ReadWrite.All",
            "Application.ReadWrite.All",
            "Directory.ReadWrite.All",
            "Domain.ReadWrite.All",
            "UserAuthenticationMethod.ReadWrite.All",
            "Policy.ReadWrite.AuthenticationMethod",
            "Policy.ReadWrite.ConditionalAccess",
            "PrivilegedAccess.ReadWrite.AzureADGroup",
            "PrivilegedAssignmentSchedule.ReadWrite.AzureADGroup",
            "PrivilegedEligibilitySchedule.ReadWrite.AzureADGroup",
            "RoleAssignmentSchedule.ReadWrite.Directory",
            "RoleEligibilitySchedule.ReadWrite.Directory"
          ]
    mql: |
      highRiskAppIds = microsoft.serviceprincipals.where(
        permissions.any(
          type == "application" &&
          status == "granted" &&
          name.in(props.mondooM365SecurityOwnerRestrictedGraphApplicationPermissions)
        )
      ).map(appId)
      microsoft.applications.where(appId.in(highRiskAppIds)).all(ownerServicePrincipals.length == 0)
      microsoft.serviceprincipals.where(appId.in(highRiskAppIds)).all(ownerServicePrincipals.length == 0)
    docs:
      desc: |
        This check verifies that no application identity can take control of an application that holds tenant-level Microsoft Graph permissions.

        Owners of an application registration or enterprise application can manage it without any directory role, including adding a new client secret. Owners are listed under **Entra ID > App registrations** and **Entra ID > Enterprise apps**, on each application's **Owners** page, and an owner can be a user or another service principal. This check finds the applications holding a high-risk Microsoft Graph application permission, such as `RoleManagement.ReadWrite.Directory` or `Application.ReadWrite.All`, and requires that neither the application registration nor its enterprise application has a service principal among its owners. The permission list is configurable.

        **Why this matters**

        Ownership is a privilege escalation path that role reviews miss. A service principal that owns a privileged application can add a secret to it, sign in as it, and use its permissions, so whoever controls the owner controls the tenant, even if the owner itself holds nothing more than a read permission.

        The owning service principal usually belongs to an automation pipeline or a deployment tool, which authenticates with its own secret stored in that tool. A compromise of the pipeline then becomes a compromise of the tenant through two hops that no single assignment reveals.

        Give privileged applications human owners who are protected like administrators, and manage them through Privileged Identity Management or a dedicated administrator role instead of ownership by automation.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Identify the applications holding a permission listed in the description, under **Entra ID** > **Enterprise apps**, on each application's **Permissions** page.
        3. For each, open **Owners** on the enterprise application and on its entry under **Entra ID** > **App registrations**.

        A passing tenant lists only users as owners of those applications. A failing tenant lists a service principal.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "Application.Read.All"
        $sp = Get-MgServicePrincipal -Filter "appId eq '<application-client-id>'"
        Get-MgServicePrincipalOwnerAsServicePrincipal -ServicePrincipalId $sp.Id
        $app = Get-MgApplication -Filter "appId eq '<application-client-id>'"
        Get-MgApplicationOwnerAsServicePrincipal -ApplicationId $app.Id
        ```

        A passing application returns nothing from either command. A failing one returns a service principal.
      remediation:
        - id: console
          desc: |
            **To remove a service principal owner using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **App registrations**, open the application, and select **Owners**.
            3. Select the service principal and choose **Remove owners**.
            4. Repeat on the application's entry under **Entra ID** > **Enterprise apps**.
        - id: powershell
          desc: |
            **To remove a service principal owner using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "Application.ReadWrite.All"
            $app = Get-MgApplication -Filter "appId eq '<application-client-id>'"
            Remove-MgApplicationOwnerByRef -ApplicationId $app.Id -DirectoryObjectId "<owner-service-principal-object-id>"
            $sp = Get-MgServicePrincipal -Filter "appId eq '<application-client-id>'"
            Remove-MgServicePrincipalOwnerByRef -ServicePrincipalId $sp.Id -DirectoryObjectId "<owner-service-principal-object-id>"
            ```
        - id: terraform
          desc: |
            **To restrict application owners to users using Terraform:**

            List only user object IDs in `owners` on the application and its service principal:

            ```hcl
            resource "azuread_application" "automation" {
              display_name = "automation"
              owners       = [azuread_user.app_owner.object_id]
            }

            resource "azuread_service_principal" "automation" {
              client_id = azuread_application.automation.client_id
              owners    = [azuread_user.app_owner.object_id]
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/overview-assign-app-owners
        title: Overview of enterprise application ownership
  # No Terraform variants: access review decisions are recorded at run time by reviewers, not declared in configuration.
  - uid: mondoo-m365-security-access-reviews-fully-decided
    title: Ensure completed access reviews leave no access undecided
    filters: |
      asset.platform == "microsoft365"
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-08
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-ii-c-information-access-management-access-establishment-and-modification
      compliance/iso-27001-2022: iso-27001-2022-a-5-18
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-4
      compliance/soc2-2017: soc2-control-cc6-2-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      microsoft.identityAndAccess.accessReviews.all(
        instances.where(status == "Completed").all(
          decisions.none(decision == "NotReviewed")
        )
      )
    docs:
      desc: |
        This check verifies that every completed access review actually reached a decision on each person or application it covered.

        Microsoft Entra access reviews ask reviewers to approve or deny each principal's continued access to a group, application, access package, or role. Each run of a review is an instance, and each principal in it gets a decision, shown under **ID Governance > Access reviews** on the review's results. A principal nobody reviewed is left as **Not reviewed**. This check requires that no completed instance of any review still has a principal marked **Not reviewed**. A tenant with no access reviews passes. Access reviews require a Microsoft Entra ID P2 or Microsoft Entra ID Governance license.

        **Why this matters**

        An access review exists to produce evidence that someone looked. A completed review full of undecided entries is a record that nobody did, and access that nobody examined continues exactly as before, while the existence of the review suggests otherwise to auditors and to the security team.

        Undecided entries are usually the ones that matter most: guests nobody recognizes, accounts of people who left, and members added for a project long finished. Reviewers skip what they cannot identify, which is precisely the access an attacker would rely on.

        Turn on **Auto apply results to resource** with a default decision of **Remove access** for reviewers who do not respond, or follow up on undecided entries before closing each review.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **ID Governance** > **Access reviews**.
        3. For each review, open its completed instances and review the **Results** for entries with the outcome **Not reviewed**.

        A passing tenant has no completed instance with a **Not reviewed** entry. A failing tenant has at least one.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "AccessReview.Read.All"
        foreach ($def in Get-MgIdentityGovernanceAccessReviewDefinition -All) {
            foreach ($inst in Get-MgIdentityGovernanceAccessReviewDefinitionInstance -AccessReviewScheduleDefinitionId $def.Id -All |
                    Where-Object Status -eq 'Completed') {
                $open = Get-MgIdentityGovernanceAccessReviewDefinitionInstanceDecision -AccessReviewScheduleDefinitionId $def.Id `
                    -AccessReviewInstanceId $inst.Id -All | Where-Object Decision -eq 'NotReviewed'
                if ($open) { [pscustomobject]@{ Review = $def.DisplayName; Instance = $inst.Id; Undecided = @($open).Count } }
            }
        }
        ```

        A passing tenant returns nothing. A failing tenant lists each completed instance with undecided entries.
      remediation:
        - id: console
          desc: |
            **To make access reviews decide every entry using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **ID Governance** > **Access reviews** and open the review.
            3. Select **Settings**, turn on **Auto apply results to resource**, and set **If reviewers don't respond** to **Remove access**.
            4. Turn on reminders so reviewers are prompted before the instance ends.
            5. For instances already completed, review the **Not reviewed** entries and remove the access manually where it is no longer needed.
        - id: powershell
          desc: |
            **To set a default decision for reviewers who do not respond using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "AccessReview.ReadWrite.All"
            $def = Get-MgIdentityGovernanceAccessReviewDefinition -AccessReviewScheduleDefinitionId "<review-id>"
            $settings = $def.Settings
            $settings.DefaultDecisionEnabled = $true
            $settings.DefaultDecision = "Deny"
            $settings.AutoApplyDecisionsEnabled = $true
            $settings.ReminderNotificationsEnabled = $true
            Update-MgIdentityGovernanceAccessReviewDefinition -AccessReviewScheduleDefinitionId $def.Id -Settings $settings
            ```
        # No Terraform remediation: the azuread Terraform provider has no resource for access review definitions.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
        title: What are access reviews
      - url: https://learn.microsoft.com/en-us/entra/id-governance/complete-access-review
        title: Complete an access review of groups and applications
  # No Terraform variants: the tenant authorization policy has no resource in the azuread Terraform provider.
  - uid: mondoo-m365-security-guest-access-restricted
    title: Ensure guest access is restricted and only admins can invite guests
    filters: |
      asset.platform == "microsoft365"
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-15
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      microsoft.policies.tenantAuthorizationPolicy.guestUserRoleId == "2af84b1e-32c8-42b7-82bc-daa82404023b"
      microsoft.policies.tenantAuthorizationPolicy.allowInvitesFrom.in(["none", "adminsAndGuestInviters"])
    docs:
      desc: |
        This check verifies that guest users can see little of the directory and that only administrators decide who becomes a guest.

        Two settings in the Microsoft Entra admin center under **Entra ID > External Identities > External collaboration settings** control this. **Guest user access** offers three levels: the same access as members, limited access, and restricted access, which limits guests to their own profile and the groups they belong to. **Guest invite settings** decide who can invite guests, from anyone in the organization to no one. This check requires guest access to be the most restrictive level, and invitations to be limited to users in the Guest Inviter role and administrators, or turned off.

        **Why this matters**

        Every guest is an account whose security another organization controls. With member-level or limited access, a compromised guest can list users, groups, and their memberships, which is the reconnaissance that phishing and privilege escalation start from: who the administrators are, which groups grant access to what, and whose mailbox to target.

        Open invitations make the population of such accounts grow without review. Any user, or any attacker holding one user's session, can invite an outside account that then persists after the inviting user is gone.

        Restricting both keeps guests limited to the collaboration they were invited for, and puts each new external account in front of someone accountable for it.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **External Identities** > **External collaboration settings**.
        3. Review **Guest user access** and **Guest invite settings**.

        A passing tenant shows **Guest user access is restricted to properties and memberships of their own directory objects** and invitations limited to **Only users assigned to specific admin roles** or turned off. A failing tenant shows a broader setting for either.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgPolicyAuthorizationPolicy | Select-Object GuestUserRoleId, AllowInvitesFrom
        ```

        A passing tenant returns `GuestUserRoleId` `2af84b1e-32c8-42b7-82bc-daa82404023b` and `AllowInvitesFrom` `adminsAndGuestInviters` or `none`. A failing tenant returns a different role or a broader invite setting.
      remediation:
        - id: console
          desc: |
            **To restrict guest access and invitations using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **External Identities** > **External collaboration settings**.
            3. Under **Guest user access**, select **Guest user access is restricted to properties and memberships of their own directory objects**.
            4. Under **Guest invite settings**, select **Only users assigned to specific admin roles can invite guest users**.
            5. Select **Save**.
        - id: powershell
          desc: |
            **To restrict guest access and invitations using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.Authorization"
            Update-MgPolicyAuthorizationPolicy -GuestUserRoleId "2af84b1e-32c8-42b7-82bc-daa82404023b" `
                -AllowInvitesFrom "adminsAndGuestInviters"
            ```
        # No Terraform remediation: the tenant authorization policy has no resource in the azuread Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure
        title: Configure external collaboration settings
      - url: https://learn.microsoft.com/en-us/entra/identity/users/users-restrict-guest-permissions
        title: Restrict guest access permissions in Microsoft Entra ID
  # No Terraform variants: the tenant authorization policy has no resource in the azuread Terraform provider.
  - uid: mondoo-m365-security-default-users-cannot-create-tenants-or-security-groups
    title: Ensure users cannot create tenants or security groups
    filters: |
      asset.platform == "microsoft365"
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-15
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      microsoft.policies.tenantAuthorizationPolicy.defaultUserAllowedToCreateTenants == false
      microsoft.policies.tenantAuthorizationPolicy.defaultUserAllowedToCreateSecurityGroups == false
    docs:
      desc: |
        This check verifies that ordinary users cannot create new Microsoft Entra tenants or security groups on their own.

        Both are default user permissions in the Microsoft Entra admin center. **Restrict non-admin users from creating tenants** is under **Entra ID > Users > User settings**, and **Users can create security groups in Azure portals, API or PowerShell** is under **Entra ID > Groups > General**. This check requires tenant creation to be restricted and security group creation turned off for users without an administrator role.

        **Why this matters**

        A user who creates a tenant becomes its Global Administrator, outside every control your organization applies: no Conditional Access, no logging you collect, no offboarding. Data and applications moved into it, and identities created in it for external access, leave your governance entirely, and the tenant survives the user's departure.

        Security groups are the units that grant access to applications, SharePoint sites, and Azure resources. When any user can create them, groups that grant access appear without an owner or a review, and an attacker with one user's session can create a group, add themselves, and wait for someone to grant the group access.

        Restrict both and route requests through administrators or self-service group management with an approval step.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Users** > **User settings** and review **Restrict non-admin users from creating tenants**.
        3. Go to **Entra ID** > **Groups** > **General** and review **Users can create security groups in Azure portals, API or PowerShell**.

        A passing tenant shows **Yes** for the first and **No** for the second. A failing tenant shows either one open.

        ### Audit via PowerShell

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        (Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions |
            Select-Object AllowedToCreateTenants, AllowedToCreateSecurityGroups
        ```

        A passing tenant returns `False` for both. A failing tenant returns `True` for either.
      remediation:
        - id: console
          desc: |
            **To stop users from creating tenants and security groups using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Entra ID** > **Users** > **User settings** and set **Restrict non-admin users from creating tenants** to **Yes**.
            3. Go to **Entra ID** > **Groups** > **General** and set **Users can create security groups in Azure portals, API or PowerShell** to **No**.
            4. Select **Save** on each page.
        - id: powershell
          desc: |
            **To stop users from creating tenants and security groups using Microsoft Graph PowerShell:**

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.Authorization"
            Update-MgPolicyAuthorizationPolicy -DefaultUserRolePermissions @{
                AllowedToCreateTenants        = $false
                AllowedToCreateSecurityGroups = $false
            }
            ```
        # No Terraform remediation: the tenant authorization policy has no resource in the azuread Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/fundamentals/users-default-permissions
        title: Default user permissions in Microsoft Entra ID
      - url: https://learn.microsoft.com/en-us/entra/identity/users/groups-self-service-management
        title: Set up self-service group management
