      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies-bicep
        tags:
          mondoo.com/filter-title: Bicep
          mondoo.com/filter-icon: bicep
    docs:
      desc: |
        This check verifies that the tenant acts automatically when Microsoft Entra ID Protection concludes an identity itself is compromised.

        User risk is a judgment about the account rather than about one sign-in. It rises when Microsoft finds the account's credentials in a leaked credential dump, when Microsoft threat intelligence links the identity to known attacker activity, or when a pattern of behavior over time indicates compromise. Acting on it requires a Conditional Access policy, created in the Microsoft Entra admin center under **Protection > Conditional Access > Policies**, with **Conditions > User risk** set to high and **Grant** requiring both multifactor authentication and a password change. This check requires such a policy to exist and be enabled. Provisioned as code, it is the same conditional access policy resource with a user risk condition.

        **Why this matters**

        A high user risk score means Microsoft has concrete evidence the password is in somebody else's hands. Without a policy, that evidence produces a dashboard entry and nothing else, and the compromised credential keeps working until an analyst notices and acts manually. In practice that window is measured in days, and often nobody looks at all.

        The attacker does not wait. The leaked password that raised the score is the one they are already using, and the account continues serving mail, Teams history, and SharePoint content to them throughout.

        A user risk policy closes that gap without a human in the loop. The account is forced through a password change backed by a second factor at its next authentication, which invalidates the credential the attacker holds and requires them to defeat a factor they do not have to regain anything.

        Exclude an emergency access account so a false positive on the wrong identity cannot lock every administrator out of the tenant, and pair this with a sign-in risk policy, since the two cover different signals and a companion check in this policy tracks the other one.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Protection** > **Conditional Access** > **Policies**.
        3. Look for a policy that, under **Conditions**, sets **User risk** to one or more levels and, under **Grant**, requires multifactor authentication.

        A passing tenant has at least one enabled policy that targets user risk and requires MFA. A failing tenant has no such policy, or the policy is in **Report-only** or **Off** state.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list Conditional Access policies:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgIdentityConditionalAccessPolicy |
          Where-Object { $_.State -eq "enabled" -and $_.Conditions.UserRiskLevels }
        ```

        A passing tenant returns at least one policy. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure a user risk policy:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Protection` > `Conditional Access` > `Policies`.
            3. Select `New policy`.
            4. Configure the policy:
               - Under `Users or workload identities`, choose `All users` and exclude at least one emergency access account.
               - Under `Cloud apps or actions`, choose `All cloud apps`.
               - Under `Conditions` > `User risk`, set `Configure` to `Yes` and select the `High` risk level.
               - Under `Access controls` > `Grant`, select `Grant access`, then select `Require multifactor authentication` and `Require password change`.
               - Under `Session`, ensure `Sign-in frequency` is set to `Every time`.
            5. You may start the policy in `Report-only` mode to assess impact, but it must be set to `On` to be enforced.
            6. Select `Create`.

            **NOTE:** For more information about risk levels, refer to [Microsoft Entra ID Protection risks](https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks).
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess", "Policy.Read.All"
            ```

            2. Create a new Conditional Access policy for user risk. `clientAppTypes` is a required property of the conditions object, so the request fails without it. When the sign-in frequency interval is `everyTime`, `authenticationType` must be supplied and the `value` and `type` properties must be omitted:

            ```powershell
            $params = @{
                displayName = "User risk policy - Require MFA and password change for high risk users"
                state = "enabled"
                conditions = @{
                    clientAppTypes = @("all")
                    users = @{
                        includeUsers = @("All")
                        excludeUsers = @("<breakglass-account-id>")  # Replace with your emergency access account
                    }
                    applications = @{
                        includeApplications = @("All")
                    }
                    userRiskLevels = @("high")
                }
                grantControls = @{
                    operator = "AND"
                    builtInControls = @("mfa", "passwordChange")
                }
                sessionControls = @{
                    signInFrequency = @{
                        isEnabled = $true
                        frequencyInterval = "everyTime"
                        authenticationType = "primaryAndSecondaryAuthentication"
                    }
                }
            }
            New-MgIdentityConditionalAccessPolicy -BodyParameter $params
            ```
        - id: terraform
          desc: |
            **Using Terraform with the azuread provider**

            ```hcl
            resource "azuread_conditional_access_policy" "user_risk_policy" {
              display_name = "User risk policy - Require MFA and password change for high risk"
              state        = "enabled"

              conditions {
                client_app_types = ["all"]
                users {
                  included_users = ["All"]
                  excluded_users = [azuread_user.breakglass.object_id]
                }
                applications {
                  included_applications = ["All"]
                }
                user_risk_levels = ["high"]
              }

              grant_controls {
                operator          = "AND"
                built_in_controls = ["mfa", "passwordChange"]
              }

              session_controls {
                sign_in_frequency_interval            = "everyTime"
                sign_in_frequency_authentication_type = "primaryAndSecondaryAuthentication"
              }
            }
            ```

            For more details, see [azuread_conditional_access_policy](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/conditional_access_policy) in the Terraform Registry.
