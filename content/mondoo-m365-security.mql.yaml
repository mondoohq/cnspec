  - uid: mondoo-m365-security-ensure-unified-audit-log-enabled
    title: Ensure the Microsoft 365 unified audit log is enabled
    filters: |
      asset.platform == "microsoft365"
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      ms365.exchangeonline.unifiedAuditLogIngestionEnabled == true
    docs:
      desc: |
        This check verifies that the tenant records user and administrator activity in the unified audit log.

        The unified audit log collects activity from across Microsoft 365, covering Exchange Online, SharePoint Online, OneDrive, Microsoft Entra ID, Teams, and the other workloads into one searchable record. It is controlled from the Microsoft Purview portal under **Audit**, where a banner offers to start recording if it is off. This check requires audit log ingestion to be enabled for the tenant.

        **Why this matters**

        With the log off, the tenant is not merely under-monitored, it is unrecorded. The actions that define a compromise leave nothing behind: the mailbox rule that forwards mail to an attacker, the sudden download of an entire document library, the role assignment that made a new account a Global Administrator, the consent granted to an application nobody recognizes. None of it can be queried, because none of it was written down.

        The consequence lands during the incident. An attacker's access is discovered by some other means, and the response has to answer which accounts were used, what was read, whether data left the organization, and when it started. Those questions have no answers without the log, so the organization cannot scope the breach, cannot tell affected customers what was accessed, and cannot know whether the eviction was complete.

        Deliberate insider activity disappears the same way, since a person copying files or reading colleagues' mailboxes leaves no trace to review.

        Enabling it is a single change, and the log starts from that moment rather than backfilling, so turning it on today does nothing for what happened yesterday. Allow up to 60 minutes for the change to take effect across all workloads, and pair the log with retention and alerting appropriate to your licensing, since a record nobody queries is only useful after the fact.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Purview portal at `https://purview.microsoft.com`.
        2. Go to **Audit**.
        3. Confirm auditing is on. If auditing is disabled, a banner offers to start recording user and admin activity.

        A passing tenant shows auditing as enabled. A failing tenant shows the option to turn on auditing.

        ### Audit via PowerShell

        1. Connect to Exchange Online and read the audit log configuration:

        ```powershell
        Connect-ExchangeOnline
        (Get-AdminAuditLogConfig).UnifiedAuditLogIngestionEnabled
        ```

        A passing tenant returns `True`. A failing tenant returns `False`.
      remediation:
        - id: console
          desc: |
            **To enable the unified audit log using the Microsoft Purview portal:**

            1. Sign in to the [Microsoft Purview portal](https://purview.microsoft.com).
            2. Go to **Audit**.
            3. Select **Start recording user and admin activity** on the banner.
            4. Confirm the action.
        - id: powershell
          desc: |
            **Using Exchange Online PowerShell**

            Requires the ExchangeOnlineManagement module and an Exchange Administrator role.

            ```powershell
            Connect-ExchangeOnline

            # Enable unified audit log ingestion for the tenant
            Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true
            ```

            It can take up to 60 minutes for the change to take effect across all workloads.
        # No Terraform remediation: Exchange Online configuration has no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/purview/audit-log-enable-disable
        title: Turn auditing on or off
      - url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
        title: Microsoft Purview auditing solutions
