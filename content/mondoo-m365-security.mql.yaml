  - uid: mondoo-m365-security-block-external-email-auto-forwarding
    title: Ensure automatic external email forwarding is blocked
    filters: |
      asset.platform == "microsoft365"
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-12
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ds-5
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-7-1
      compliance/vda-isa-5: false
    mql: |
      ms365.exchangeonline.hostedOutboundSpamFilterPolicies.all(autoForwardingMode == "Off")
      ms365.exchangeonline.remoteDomains.all(autoForwardEnabled == false)
    docs:
      desc: |
        This check verifies that mailbox rules cannot silently relay mail out of the organization.

        Microsoft 365 permits automatic forwarding out of the box, and two settings govern it that both have to be closed. The outbound spam filter policies in the Microsoft Defender portal under **Email & collaboration > Policies & rules > Threat policies > Anti-spam** carry an automatic forwarding control that must be set to off, and each entry under **Mail flow > Remote domains** in the Exchange admin center carries an allow automatic forwarding option that must be cleared. This check requires forwarding to be off across the outbound spam policies and disabled on the remote domains.

        **Why this matters**

        Creating a forwarding rule is the first thing an attacker does with a mailbox they have taken, and it is close to the last thing anybody notices. The rule copies every incoming message to an address they control, so they no longer need to sign in. Whatever detection you have on anomalous authentication stops firing, because there are no more authentications.

        What flows out is everything the person receives from that day forward: the contract negotiation, the payroll file, the password reset links and one-time codes for every other system they use, and the internal threads that supply the tone and detail for a convincing fraudulent payment request later.

        The rule also outlives the response. A password reset evicts the attacker's session and leaves the forwarding rule in place, quietly exfiltrating mail until somebody inspects the mailbox rules specifically, which is not part of most incident checklists.

        Blocking at the tenant level neutralizes rules that already exist as well as ones created later, without needing to find the compromised mailbox first.

        Some remote domain entries exist specifically to permit forwarding to a trusted partner, so review each with its owners before saving. Where a narrow exception is genuinely needed, scope a dedicated outbound spam policy to those users instead of leaving a forwarding-enabled remote domain open to everyone.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Defender portal at `https://security.microsoft.com`.
        2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Anti-spam**.
        3. Open each outbound spam policy and review the automatic forwarding setting.

        A passing tenant has every outbound spam policy set to **Off - Forwarding is disabled**. A failing tenant has policies set to **Automatic** or **On**.

        ### Audit via PowerShell

        1. Connect to Exchange Online and review the outbound spam and remote domain settings:

        ```powershell
        Connect-ExchangeOnline
        Get-HostedOutboundSpamFilterPolicy | Select-Object Name, AutoForwardingMode
        Get-RemoteDomain Default | Select-Object DomainName, AutoForwardEnabled
        ```

        A passing tenant returns `AutoForwardingMode : Off` for every outbound spam policy and `AutoForwardEnabled : False` for the default remote domain. A failing tenant returns `Automatic`, `On`, or `True`.
      remediation:
        - id: console
          desc: |
            **To block automatic forwarding:**

            1. Sign in to the [Microsoft Defender portal](https://security.microsoft.com).
            2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Anti-spam**.
            3. Open each outbound spam policy and select **Edit automatic forwarding**.
            4. Set the forwarding rule to **Off - Forwarding is disabled**.
            5. Save the policy.
            6. Then open the [Exchange admin center](https://admin.exchange.microsoft.com), go to **Mail flow** > **Remote domains**, open each remote domain, and clear **Allow automatic forwarding**.

            **NOTE:** Some remote domain entries exist specifically to allow forwarding to trusted partner domains. Disabling the setting stops mailbox rules from relaying mail to those domains, so review each entry with its owners before saving. To keep a narrow exception for specific users, use a dedicated outbound spam policy scoped to those users instead of a forwarding-enabled remote domain.
        - id: powershell
          desc: |
            **Using Exchange Online PowerShell**

            Requires the ExchangeOnlineManagement module and an Exchange Administrator role.

            ```powershell
            Connect-ExchangeOnline

            # Block automatic forwarding on every outbound spam filter policy
            Get-HostedOutboundSpamFilterPolicy | ForEach-Object {
              Set-HostedOutboundSpamFilterPolicy -Identity $_.Name -AutoForwardingMode Off
            }

            # Disable automatic forwarding on every remote domain, not only Default
            Get-RemoteDomain | ForEach-Object {
              Set-RemoteDomain -Identity $_.Identity -AutoForwardEnabled $false
            }
            ```

            **NOTE:** Review the remote domain list before running the loop. Entries other than Default may exist to permit forwarding to specific partner domains, and this change disables that behavior for all of them.
        # No Terraform remediation: Exchange Online configuration has no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/defender-office-365/outbound-spam-policies-external-email-forwarding
        title: Control automatic external email forwarding in Microsoft 365
      - url: https://learn.microsoft.com/en-us/exchange/mail-flow-best-practices/remote-domains/remote-domains
        title: Remote domains in Exchange Online
  # No Terraform variants: the tenant authorization policy has no resource in the azuread Terraform provider.
  - uid: mondoo-m365-security-restrict-user-consent-to-applications
    title: Ensure users cannot consent to applications accessing company data
    filters: |
      asset.platform == "microsoft365"
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-d
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-9
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-3
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: |
      microsoft.policies.authorizationPolicy.defaultUserRolePermissions.permissionGrantPoliciesAssigned == empty
    docs:
      desc: |
        This check verifies that users cannot grant an application access to organizational data on their own authority.

        Consent settings live in the Microsoft Entra admin center under **Identity > Applications > Enterprise applications > Consent and permissions > User consent settings**. Choosing not to allow user consent removes the permission grant policies from the default user role, which is the state this check requires, and routes every request for application access to an administrator instead.

        **Why this matters**

        Consent phishing bypasses passwords and multifactor authentication entirely, because it never attacks either one. The user receives a link to a genuine Microsoft consent page for an application the attacker registered, often named to look like an internal tool or a familiar service. The page is real, the sign-in is real, and the second factor prompt is satisfied by the user themselves. All they are asked to do is approve access, and one click hands the attacker an OAuth token for their mailbox, their OneDrive files, and their Teams conversations.

        The token is the point. It is honored without re-prompting for a second factor, and it survives a password reset, so the standard response to a compromised account leaves the attacker's access untouched. They read mail through the Graph API at their own pace, with no sign-in events to notice.

        The blast radius is not limited to the person who clicked. An application requesting broad permissions reaches data far beyond that user's own mailbox, and a single approval can expose the wider tenant.

        Requiring administrator approval puts a review in front of every application that wants organizational data. Configure the admin consent workflow at the same time so users have a documented way to request the applications they genuinely need, which keeps the control from being routed around.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Identity** > **Applications** > **Enterprise applications** > **Consent and permissions** > **User consent settings**.
        3. Review the **User consent for applications** setting.

        A passing tenant has user consent set to **Do not allow user consent**. A failing tenant allows users to consent for some or all applications.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and read the tenant authorization policy:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        (Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions.PermissionGrantPoliciesAssigned
        ```

        A passing tenant returns no permission grant policies. A failing tenant returns one or more `ManagePermissionGrantsForSelf.*` policies.
      remediation:
        - id: console
          desc: |
            **To restrict user consent using the Microsoft Entra admin center:**

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Identity** > **Applications** > **Enterprise applications** > **Consent and permissions** > **User consent settings**.
            3. Under **User consent for applications**, select **Do not allow user consent**.
            4. Save the change.
            5. Optionally, configure the admin consent workflow so users can request approval for the apps they need.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.Authorization"

            # Remove all permission grant policies from the default user role
            $params = @{
                defaultUserRolePermissions = @{
                    permissionGrantPoliciesAssigned = @()
                }
            }
            Update-MgPolicyAuthorizationPolicy -BodyParameter $params
            ```
        # No Terraform remediation: the tenant authorization policy has no resource in the azuread Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-user-consent
        title: Configure how users consent to applications
      - url: https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-risky-oauth
        title: Investigate risky OAuth apps
  # No Terraform variants: Microsoft Entra PIM role eligibility has no resource in the azuread Terraform provider.
  - uid: mondoo-m365-security-require-pim-for-privileged-roles
    title: Ensure privileged roles are managed with Privileged Identity Management
    filters: |
      asset.platform == "microsoft365"
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      microsoft.identityAndAccess.roleEligibilityScheduleInstances != empty
    docs:
      desc: |
        This check verifies that privileged roles are held as activatable eligibility rather than as permanent standing access.

        Microsoft Entra Privileged Identity Management changes the shape of an administrative assignment. Instead of holding a role continuously, a user is made eligible for it and must activate it for a bounded window, optionally passing a multifactor prompt, supplying a justification, and waiting for approval. You configure this in the Microsoft Entra admin center under **Identity governance > Privileged Identity Management > Microsoft Entra roles**, adding assignments with the type set to eligible and setting the activation requirements per role. This check requires at least one eligible role assignment to exist in the tenant. The feature needs Microsoft Entra ID P2 or Microsoft Entra ID Governance licensing.

        **Why this matters**

        A permanent Global Administrator assignment is privilege that is live at three in the morning on a Sunday, whether or not the person is working. An attacker who takes that account inherits the role at the moment of sign-in, with no further step, and the tenant sees an ordinary authentication rather than a privilege event.

        Eligibility removes that. The stolen session lands on an account with no administrative rights until it activates the role, and activation is where the defenses sit: a multifactor prompt on a device the attacker does not have, a written justification, an approval request that reaches a human, and a log entry that stands out precisely because activations are rare.

        Standing assignments also accumulate silently. Nothing forces a review, so rights granted for one project remain years later on people who no longer need them, each one an independent path to the tenant.

        Keep at least one emergency access account with a standing assignment so a failure in the activation path cannot lock everyone out, make the eligibility itself time-bound and reviewed rather than permanent, and set an activation maximum duration so each activation expires on its own.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Identity governance** > **Privileged Identity Management** > **Microsoft Entra roles** > **Assignments**.
        3. Review the **Eligible assignments** tab for privileged roles such as Global Administrator.

        A passing tenant manages privileged roles through eligible assignments. A failing tenant has no eligible assignments and relies on permanent (active) assignments.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list role eligibility schedule instances:

        ```powershell
        Connect-MgGraph -Scopes "RoleManagement.Read.Directory"
        Get-MgRoleManagementDirectoryRoleEligibilityScheduleInstance
        ```

        A passing tenant returns one or more eligible role assignments. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To manage privileged roles with PIM using the Microsoft Entra admin center:**

            Privileged Identity Management requires a Microsoft Entra ID P2 or Microsoft Entra ID Governance license. Confirm licensing before you begin.

            1. Sign in to the [Microsoft Entra admin center](https://entra.microsoft.com).
            2. Go to **Identity governance** > **Privileged Identity Management** > **Microsoft Entra roles** > **Roles**.
            3. Select a privileged role, such as **Global Administrator**.
            4. Select **Add assignments**, choose the user, and set the assignment type to **Eligible**.
            5. For each role, open **Settings** and require MFA, justification, and approval on activation.
            6. Remove the corresponding permanent active assignment once the eligible assignment is in place, keeping at least one emergency access account with a standing assignment.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            Privileged Identity Management requires a Microsoft Entra ID P2 or Microsoft Entra ID Governance license; the request below fails without it.

            ```powershell
            Connect-MgGraph -Scopes "RoleManagement.ReadWrite.Directory"

            # Create a bounded eligible assignment for a privileged role.
            # Eligibility itself should be time-bound and reviewed periodically rather than permanent.
            $params = @{
                action           = "adminAssign"
                principalId      = "<user-object-id>"
                roleDefinitionId = "<role-definition-id>"
                directoryScopeId = "/"
                scheduleInfo     = @{
                    startDateTime = (Get-Date)
                    expiration    = @{
                        type        = "afterDuration"
                        duration    = "P180D"
                    }
                }
            }
            New-MgRoleManagementDirectoryRoleEligibilityScheduleRequest -BodyParameter $params
            ```

            The eligible assignment grants the ability to activate the role, not standing access. Enforce just-in-time access by setting the `Activation maximum duration` value in the role's PIM **Settings**, so each activation is itself time-limited and expires automatically.
        # No Terraform remediation: Microsoft Entra PIM role eligibility has no resource in the azuread Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
        title: What is Microsoft Entra Privileged Identity Management
      - url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-add-role-to-user
        title: Assign Microsoft Entra roles in PIM
  # No Terraform variants: DMARC records are published at an external DNS provider, not in Microsoft 365.
  - uid: mondoo-m365-security-ensure-dmarc-records-published
    title: Ensure DMARC records are published for all Exchange domains
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: false
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-8
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-5-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      microsoft.domains.where(isVerified == true && id != /\.onmicrosoft\.com$/).all(dns(id).dmarc.version == "DMARC1")
      microsoft.domains.where(isVerified == true && id != /\.onmicrosoft\.com$/).all(dns(id).dmarc.policy == /quarantine|reject/)
    docs:
      desc: |
        This check verifies that every custom domain publishes a DMARC record that tells receivers to act on authentication failures.

        DMARC is a TXT record at the `_dmarc` host of the domain. It ties the SPF and DKIM results to the address the recipient actually sees, and states what to do when neither aligns. The policy value is what matters: `p=none` observes and reports, while `quarantine` and `reject` are enforcement. This check requires every verified custom domain to publish a record and to set the policy to `quarantine` or `reject`.

        **Why this matters**

        SPF and DKIM answer whether a message authenticated. Neither instructs the receiving server to do anything about a message that did not, and neither one is checked against the visible From address on its own. DMARC supplies both the alignment requirement and the instruction, which is why a domain with SPF and DKIM but no enforcing DMARC policy is still spoofable in practice.

        The attack that exploits the gap is targeted at people who trust your name. A message with your domain in the sender field asks your customer's accounts payable team to update the bank details on file, or asks your own staff to review a document behind a sign-in page. Receiving servers see a failure, find no policy telling them to reject, and deliver it to the inbox.

        A missing or observing-only record also leaves you blind. Aggregate reports show who is sending as your domain, and without them you learn about a spoofing campaign when a customer calls about a payment they already made.

        Move in stages. Publish with `quarantine` and a reporting address, read the aggregate reports until every legitimate sender aligns, and only then move to `reject`, since going straight to enforcement will silently drop mail from a system nobody remembered.
      audit: |
        Verify that every verified custom domain publishes an enforcing DMARC record by querying the `_dmarc` TXT record:

        ```bash
        dig +short TXT _dmarc.example.com
        ```

        A passing domain returns a TXT record beginning with `v=DMARC1` and containing `p=quarantine` or `p=reject`. A failing domain returns no record, or a record with `p=none`.
      remediation:
        - id: console
          desc: |
            **To publish a DMARC record:**

            1. Confirm SPF and DKIM are already configured for the domain.
            2. At your DNS provider, add a TXT record for the host `_dmarc` (for example, `_dmarc.example.com`).
            3. Set the value to an enforcing policy, for example:

            ```text
            v=DMARC1; p=reject; rua=mailto:dmarc-reports@example.com; pct=100
            ```

            4. Start with `p=quarantine` and a reporting address, monitor the aggregate reports, then move to `p=reject` once legitimate senders are aligned.
        - id: cli
          desc: |
            **Using CLI tools**

            DMARC records are TXT records managed at your DNS provider. Use the example for your provider:

            **Using Azure DNS CLI:**
            ```bash
            az network dns record-set txt add-record \
              --resource-group <resource-group> \
              --zone-name <domain.com> \
              --record-set-name "_dmarc" \
              --value "v=DMARC1; p=reject; rua=mailto:dmarc-reports@domain.com; pct=100"
            ```

            **Using AWS Route 53 CLI:**
            ```bash
            aws route53 change-resource-record-sets \
              --hosted-zone-id <zone-id> \
              --change-batch '{
                "Changes": [{
                  "Action": "UPSERT",
                  "ResourceRecordSet": {
                    "Name": "_dmarc.domain.com",
                    "Type": "TXT",
                    "TTL": 3600,
                    "ResourceRecords": [{"Value": "\"v=DMARC1; p=reject; rua=mailto:dmarc-reports@domain.com; pct=100\""}]
                  }
                }]
              }'
            ```

            **Using Google Cloud DNS:**
            ```bash
            gcloud dns record-sets create _dmarc.domain.com. \
              --zone=<zone-name> \
              --type=TXT \
              --ttl=3600 \
              --rrdatas="v=DMARC1; p=reject; rua=mailto:dmarc-reports@domain.com; pct=100"
            ```
        - id: terraform
          desc: |
            **Using Terraform**

            Publish the DMARC TXT record at your DNS provider:

            **Azure DNS:**
            ```hcl
            resource "azurerm_dns_txt_record" "dmarc" {
              name                = "_dmarc"
              zone_name           = azurerm_dns_zone.example.name
              resource_group_name = azurerm_resource_group.example.name
              ttl                 = 3600

              record {
                value = "v=DMARC1; p=reject; rua=mailto:dmarc-reports@example.com; pct=100"
              }
            }
            ```

            **AWS Route 53:**
            ```hcl
            resource "aws_route53_record" "dmarc" {
              zone_id = aws_route53_zone.example.zone_id
              name    = "_dmarc.example.com"
              type    = "TXT"
              ttl     = 3600
              records = ["v=DMARC1; p=reject; rua=mailto:dmarc-reports@example.com; pct=100"]
            }
            ```

            **Google Cloud DNS:**
            ```hcl
            resource "google_dns_record_set" "dmarc" {
              name         = "_dmarc.example.com."
              managed_zone = google_dns_managed_zone.example.name
              type         = "TXT"
              ttl          = 3600
              rrdatas      = ["v=DMARC1; p=reject; rua=mailto:dmarc-reports@example.com; pct=100"]
            }
            ```
