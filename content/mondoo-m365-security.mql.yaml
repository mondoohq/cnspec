      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-bicep
        tags:
          mondoo.com/filter-title: Bicep
          mondoo.com/filter-icon: bicep
    docs:
      desc: |
        This check verifies that the tenant acts automatically on sign-ins Microsoft Entra ID Protection scores as risky.

        Entra ID Protection scores each authentication attempt using signals such as an anonymized IP address, impossible travel between two locations, a device previously linked to malware, and sign-in properties unfamiliar for that account. The score does nothing on its own. Turning it into enforcement takes a Conditional Access policy, created in the Microsoft Entra admin center under **Protection > Conditional Access > Policies**, with **Conditions > Sign-in risk** set to the high and medium levels and **Grant** requiring multifactor authentication. This check requires such a policy to exist and to be on rather than in report-only or off state. Where the tenant is provisioned as code, the same policy appears as a conditional access policy resource in the Terraform or Bicep definition.

        **Why this matters**

        Without the policy the risk signal becomes a report somebody reads the next morning. The attacker who triggered it has been inside for hours.

        The sequence is routine. A password recovered from an unrelated breach is replayed from a hosting provider through an anonymizing proxy, minutes after the real employee signed in from their office. Entra rates the attempt high risk and issues the session anyway, because nothing was configured to stop it. The attacker opens Outlook on the web, searches the mailbox for the word invoice, sets a mailbox rule that files their own messages away from the owner's view, and starts a conversation with the finance team.

        With the policy in place, that same attempt has to satisfy a multifactor prompt on a device the attacker does not hold, so it fails at the point of sign-in rather than at the point of discovery.

        Exclude at least one emergency access account from the policy before you enable it, and consider running it in report-only mode first to see who would have been challenged, but understand that report-only mode enforces nothing.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Protection** > **Conditional Access** > **Policies**.
        3. Look for a policy that, under **Conditions**, sets **Sign-in risk** to one or more levels and, under **Grant**, requires multifactor authentication.

        A passing tenant has at least one enabled policy that targets sign-in risk and requires MFA. A failing tenant has no such policy, or the policy is in **Report-only** or **Off** state.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list Conditional Access policies:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgIdentityConditionalAccessPolicy |
          Where-Object { $_.State -eq "enabled" -and $_.Conditions.SignInRiskLevels }
        ```

        A passing tenant returns at least one policy. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure a sign-in risk policy:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Protection` > `Conditional Access` > `Policies`.
            3. Select `New policy`.
            4. Configure the policy:
               - Under `Users or workload identities`, choose `All users` and exclude at least one emergency access account.
               - Under `Cloud apps or actions`, choose `All cloud apps`.
               - Under `Conditions` > `Sign-in risk`, set `Configure` to `Yes` and select the `High` and `Medium` risk levels.
               - Under `Access controls` > `Grant`, select `Grant access` and check `Require multifactor authentication`.
               - Under `Session`, select `Sign-in frequency` and choose `Every time`.
            5. You may start the policy in `Report-only` mode to assess impact, but it must be set to `On` to be enforced.
            6. Select `Create`.

            **NOTE:** For more information about risk levels, refer to [Microsoft Entra ID Protection risks](https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks).
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess", "Policy.Read.All", "Application.Read.All"
            ```

            2. Create a new Conditional Access policy for sign-in risk. `clientAppTypes` is a required property of the conditions object, so the request fails without it. When the sign-in frequency interval is `everyTime`, `authenticationType` must be supplied and the `value` and `type` properties must be omitted:

            ```powershell
            $params = @{
                displayName = "Sign-in risk policy - Require MFA for medium and high risk"
                state = "enabled"
                conditions = @{
                    clientAppTypes = @("all")
                    users = @{
                        includeUsers = @("All")
                        excludeUsers = @("<breakglass-account-id>")  # Replace with your emergency access account
                    }
                    applications = @{
                        includeApplications = @("All")
                    }
                    signInRiskLevels = @("high", "medium")
                }
                grantControls = @{
                    operator = "OR"
                    builtInControls = @("mfa")
                }
                sessionControls = @{
                    signInFrequency = @{
                        isEnabled = $true
                        frequencyInterval = "everyTime"
                        authenticationType = "primaryAndSecondaryAuthentication"
                    }
                }
            }
            New-MgIdentityConditionalAccessPolicy -BodyParameter $params
            ```
        - id: terraform
          desc: |
            **Using Terraform with the azuread provider**

            ```hcl
            resource "azuread_conditional_access_policy" "sign_in_risk_policy" {
              display_name = "Sign-in risk policy - Require MFA for medium and high risk"
              state        = "enabled"

              conditions {
                client_app_types = ["all"]
                users {
                  included_users = ["All"]
                  excluded_users = [azuread_user.breakglass.object_id]
                }
                applications {
                  included_applications = ["All"]
                }
                sign_in_risk_levels = ["high", "medium"]
              }

              grant_controls {
                operator          = "OR"
                built_in_controls = ["mfa"]
              }

              session_controls {
                sign_in_frequency_interval            = "everyTime"
                sign_in_frequency_authentication_type = "primaryAndSecondaryAuthentication"
              }
            }
            ```

            For more details, see [azuread_conditional_access_policy](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/conditional_access_policy) in the Terraform Registry.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
        title: Microsoft Entra Conditional Access
      - url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
        title: Microsoft Entra ID Protection Overview
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-microsoft365
    filters: |
      asset.platform == "microsoft365"
    mql: |
      microsoft.security.latestSecureScores.controls.where(controlName == 'SigninRiskPolicy').all(score == 7)
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == 'azuread_conditional_access_policy')
    mql: |
      terraform.resources('azuread_conditional_access_policy').any(
        arguments['state'] == 'enabled' &&
        blocks.where(type == 'conditions').any(arguments['sign_in_risk_levels'] != empty) &&
        blocks.where(type == 'grant_controls').any(arguments['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == 'azuread_conditional_access_policy')
    mql: |
      terraform.plan.resourceChanges.where(type == 'azuread_conditional_access_policy').any(
        change.after['state'] == 'enabled' &&
        change.after['conditions'].any(_['sign_in_risk_levels'] != empty) &&
        change.after['grant_controls'].any(_['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == 'azuread_conditional_access_policy')
    mql: |
