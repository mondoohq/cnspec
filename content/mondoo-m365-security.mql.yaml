policies:
  - uid: mondoo-m365-security
    name: Mondoo Microsoft 365 Security
    version: 2.5.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: microsoft365,saas
      mondoo.com/icon: ms365
    require:
      - provider: ms365
      - provider: terraform
      - provider: bicep
      - provider: network
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Microsoft 365 identity, email, and data sharing
    docs:
      desc: |
        The Mondoo Microsoft 365 Security policy identifies critical misconfigurations in Microsoft 365 tenants that could expose your organization to account takeover, data breaches, and unauthorized access across email, documents, and collaboration services. As the productivity hub for many organizations, M365 misconfigurations give attackers a path to corporate data, customer information, and identity-based access to dozens of downstream Microsoft and third-party services.

        This policy provides security checks across key Microsoft 365 areas:

        - Authentication: multi-factor authentication, security defaults, and password expiration
        - Conditional Access and Microsoft Entra ID Protection risk policies
        - Privileged access: who holds directory roles and how they are assigned
        - Applications and consent: user consent, third-party app permissions, and unused app identities and credentials
        - Identity governance: access reviews, guest access, and default user permissions
        - Email authentication and transport: SPF, DKIM, DMARC, TLS, and external forwarding
        - Email threat protection with Microsoft Defender for Office 365
        - SharePoint and OneDrive external sharing
        - Device management: Intune device encryption and password length
        - Unified audit logging

        Learn more about scanning Microsoft 365 in the [cnspec Microsoft 365 documentation](https://mondoo.com/docs/cnspec/saas/m365).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Authentication
        docs:
          desc: |
            Multi-factor authentication, security defaults, and password policy for every account in the tenant.
        checks:
          - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-administrative-roles
          - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-all-roles
          - uid: mondoo-m365-security-ensure-security-defaults-is-disabled-on-azure-active-directory
          - uid: mondoo-m365-security-ensure-that-ms-365-passwords-are-not-set-to-expire
      - title: Conditional Access & Identity Protection
        docs:
          desc: |
            Conditional Access policies that block legacy authentication and respond to sign-in and user risk detected by Microsoft Entra ID Protection.
        checks:
          - uid: mondoo-m365-security-enable-conditional-access-policies-to-block-legacy-authentication
          - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies
          - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies
      - title: Privileged Access
        docs:
          desc: |
            Who holds Microsoft Entra directory roles, how those roles are assigned, and whether the accounts holding them are still in use.
        checks:
          - uid: mondoo-m365-security-ensure-that-between-two-and-four-global-admins-are-designated
          - uid: mondoo-m365-security-require-pim-for-privileged-roles
          - uid: mondoo-m365-security-privileged-role-activation-requires-mfa
          - uid: mondoo-m365-security-privileged-roles-limited-standing-holders
          - uid: mondoo-m365-security-guests-hold-no-directory-roles
          - uid: mondoo-m365-security-disabled-users-hold-no-directory-roles
          - uid: mondoo-m365-security-privileged-users-recent-sign-in
          - uid: mondoo-m365-security-privileged-users-cloud-only
          - uid: mondoo-m365-security-service-principals-no-privileged-directory-roles
          - uid: mondoo-m365-security-role-assignable-groups-no-service-principal-members
      - title: Applications & Consent
        docs:
          desc: |
            Which applications users can consent to, what permissions third-party applications hold, and whether application identities and their credentials are still in use.
        checks:
          - uid: mondoo-m365-security-ensure-third-party-integrated-applications-are-not-allowed
          - uid: mondoo-m365-security-restrict-user-consent-to-applications
          - uid: mondoo-m365-security-third-party-apps-no-high-risk-graph-permissions
          - uid: mondoo-m365-security-no-tenant-wide-consent-high-risk-delegated-scopes
          - uid: mondoo-m365-security-privileged-applications-no-service-principal-owners
          - uid: mondoo-m365-security-third-party-service-principals-recently-used
          - uid: mondoo-m365-security-application-credentials-recently-used
      - title: Identity Governance
        docs:
          desc: |
            Access reviews, guest access, and what default users can create in the tenant.
        checks:
          - uid: mondoo-m365-security-access-reviews-fully-decided
          - uid: mondoo-m365-security-guest-access-restricted
          - uid: mondoo-m365-security-default-users-cannot-create-tenants-or-security-groups
      - title: Email Authentication & Transport
        docs:
          desc: |
            Sender authentication records for Exchange domains, TLS for external mail, and automatic forwarding to external recipients.
        checks:
          - uid: mondoo-m365-security-ensure-that-spf-records-are-published-for-all-exchange-domains
          - uid: mondoo-m365-security-ensure-dkim-signing-enabled-for-all-exchange-domains
          - uid: mondoo-m365-security-ensure-dmarc-records-published
          - uid: mondoo-m365-security-ensure-transport-rules-enforce-tls
          - uid: mondoo-m365-security-block-external-email-auto-forwarding
      - title: Email Threat Protection
        docs:
          desc: |
            Microsoft Defender for Office 365 policies that scan links and attachments and detect phishing.
        checks:
          - uid: mondoo-m365-security-ensure-anti-phishing-policies-enabled
          - uid: mondoo-m365-security-ensure-safe-links-policies-configured
          - uid: mondoo-m365-security-ensure-safe-attachments-policies-configured
      - title: SharePoint & OneDrive Sharing
        docs:
          desc: |
            The organization-wide external sharing level for SharePoint and OneDrive.
        checks:
          - uid: mondoo-m365-security-ensure-sharepoint-external-sharing-restricted
      - title: Device Management
        docs:
          desc: |
            Microsoft Intune device configuration profiles: storage encryption on Android and a minimum password length on Windows, macOS, iOS, and Android.
        checks:
          - uid: mondoo-m365-security-ensure-that-mobile-device-encryption-is-enabled-to-prevent-unauthorized-access-to-mobile-data
          - uid: mondoo-m365-security-ensure-that-mobile-devices-require-a-minimum-password-length-to-prevent-brute-force-attacks
      - title: Audit & Logging
        docs:
          desc: |
            Recording of user and administrator activity across Microsoft 365.
        checks:
          - uid: mondoo-m365-security-ensure-unified-audit-log-enabled
    scoring_system: highest impact
queries:
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies
    title: Enable Microsoft Entra ID Protection sign-in risk policies
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-03
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-16
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-de-cm-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-10
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-microsoft365
        tags:
          mondoo.com/filter-title: Microsoft 365
          mondoo.com/filter-icon: microsoft
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-bicep
        tags:
          mondoo.com/filter-title: Bicep
          mondoo.com/filter-icon: bicep
    docs:
      desc: |
        This check verifies that the tenant acts automatically on sign-ins Microsoft Entra ID Protection scores as risky.

        Entra ID Protection scores each authentication attempt using signals such as an anonymized IP address, impossible travel between two locations, a device previously linked to malware, and sign-in properties unfamiliar for that account. The score does nothing on its own. Turning it into enforcement takes a Conditional Access policy, created in the Microsoft Entra admin center under **Entra ID > Conditional Access > Policies**, with **Conditions > Sign-in risk** set to the high and medium levels and **Grant** requiring multifactor authentication. This check requires an enabled policy, not one in report-only or off state, that is assigned to all users and all resources, covers both the medium and high sign-in risk levels, and either requires multifactor authentication or an authentication strength or blocks access. Where the tenant is provisioned as code, the same policy appears as a conditional access policy resource in the Terraform or Bicep definition.

        **Why this matters**

        Without the policy the risk signal becomes a report somebody reads the next morning. The attacker who triggered it has been inside for hours.

        The sequence is routine. A password recovered from an unrelated breach is replayed from a hosting provider through an anonymizing proxy, minutes after the real employee signed in from their office. Entra rates the attempt high risk and issues the session anyway, because nothing was configured to stop it. The attacker opens Outlook on the web, searches the mailbox for the word invoice, sets a mailbox rule that files their own messages away from the owner's view, and starts a conversation with the finance team.

        With the policy in place, that same attempt has to satisfy a multifactor prompt on a device the attacker does not hold, so it fails at the point of sign-in rather than at the point of discovery.

        Exclude at least one emergency access account from the policy before you enable it, and consider running it in report-only mode first to see who would have been challenged, but understand that report-only mode enforces nothing.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Conditional Access** > **Policies**.
        3. Look for a policy that includes **All users**, targets **All resources**, sets **Conditions** > **Sign-in risk** to both **High** and **Medium**, and under **Grant** requires multifactor authentication or an authentication strength, or blocks access.

        A passing tenant has at least one such policy set to **On**. A failing tenant has no such policy, scopes it to selected users or apps only, leaves out one of the two risk levels, or has it in **Report-only** or **Off** state.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list Conditional Access policies:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgIdentityConditionalAccessPolicy |
          Where-Object {
            $_.State -eq "enabled" -and
            $_.Conditions.Users.IncludeUsers -contains "All" -and
            $_.Conditions.Applications.IncludeApplications -contains "All" -and
            $_.Conditions.SignInRiskLevels -contains "high" -and
            $_.Conditions.SignInRiskLevels -contains "medium" -and
            ($_.GrantControls.BuiltInControls -contains "mfa" -or $_.GrantControls.BuiltInControls -contains "block" -or $_.GrantControls.AuthenticationStrength.Id)
          }
        ```

        A passing tenant returns at least one policy. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure a sign-in risk policy:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Entra ID` > `Conditional Access` > `Policies`.
            3. Select `New policy`.
            4. Configure the policy:
               - Under `Users or workload identities`, choose `All users` and exclude at least one emergency access account.
               - Under `Target resources`, include `All resources (formerly 'All cloud apps')`.
               - Under `Conditions` > `Sign-in risk`, set `Configure` to `Yes` and select the `High` and `Medium` risk levels.
               - Under `Access controls` > `Grant`, select `Grant access` and check `Require multifactor authentication`.
               - Under `Session`, select `Sign-in frequency` and choose `Every time`.
            5. You may start the policy in `Report-only` mode to assess impact, but it must be set to `On` to be enforced.
            6. Select `Create`.

            **NOTE:** For more information about risk levels, refer to [Microsoft Entra ID Protection risks](https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks).
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess", "Policy.Read.All", "Application.Read.All"
            ```

            2. Create a new Conditional Access policy for sign-in risk. `clientAppTypes` is a required property of the conditions object, so the request fails without it. When the sign-in frequency interval is `everyTime`, `authenticationType` must be supplied and the `value` and `type` properties must be omitted:

            ```powershell
            $params = @{
                displayName = "Sign-in risk policy - Require MFA for medium and high risk"
                state = "enabled"
                conditions = @{
                    clientAppTypes = @("all")
                    users = @{
                        includeUsers = @("All")
                        excludeUsers = @("<breakglass-account-id>")  # Replace with your emergency access account
                    }
                    applications = @{
                        includeApplications = @("All")
                    }
                    signInRiskLevels = @("high", "medium")
                }
                grantControls = @{
                    operator = "OR"
                    builtInControls = @("mfa")
                }
                sessionControls = @{
                    signInFrequency = @{
                        isEnabled = $true
                        frequencyInterval = "everyTime"
                        authenticationType = "primaryAndSecondaryAuthentication"
                    }
                }
            }
            New-MgIdentityConditionalAccessPolicy -BodyParameter $params
            ```
        - id: terraform
          desc: |
            **Using Terraform with the azuread provider**

            ```hcl
            resource "azuread_conditional_access_policy" "sign_in_risk_policy" {
              display_name = "Sign-in risk policy - Require MFA for medium and high risk"
              state        = "enabled"

              conditions {
                client_app_types = ["all"]
                users {
                  included_users = ["All"]
                  excluded_users = [azuread_user.breakglass.object_id]
                }
                applications {
                  included_applications = ["All"]
                }
                sign_in_risk_levels = ["high", "medium"]
              }

              grant_controls {
                operator          = "OR"
                built_in_controls = ["mfa"]
              }

              session_controls {
                sign_in_frequency_interval            = "everyTime"
                sign_in_frequency_authentication_type = "primaryAndSecondaryAuthentication"
              }
            }
            ```

            For more details, see [azuread_conditional_access_policy](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/conditional_access_policy) in the Terraform Registry.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
        title: Microsoft Entra Conditional Access
      - url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
        title: Microsoft Entra ID Protection Overview
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-microsoft365
    filters: |
      asset.platform == "microsoft365"
    mql: |
      microsoft.conditionalAccess.policies.where(
        state == "enabled" &&
        conditions != empty &&
        conditions.users != empty &&
        conditions.applications != empty &&
        grantControls != empty
      ).where(
        grantControls.builtInControls.contains("mfa") ||
        grantControls.builtInControls.contains("block") ||
        grantControls.authenticationStrength != empty
      ).any(
        conditions.users.includeUsers.contains("All") &&
        conditions.applications.includeApplications.contains("All") &&
        conditions.signInRiskLevels.contains("high") &&
        conditions.signInRiskLevels.contains("medium")
      )
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == 'azuread_conditional_access_policy')
    mql: |
      terraform.resources('azuread_conditional_access_policy').any(
        arguments['state'] == 'enabled' &&
        blocks.where(type == 'conditions').any(arguments['sign_in_risk_levels'] != empty) &&
        blocks.where(type == 'grant_controls').any(arguments['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == 'azuread_conditional_access_policy')
    mql: |
      terraform.plan.resourceChanges.where(type == 'azuread_conditional_access_policy').any(
        change.after['state'] == 'enabled' &&
        change.after['conditions'].any(_['sign_in_risk_levels'] != empty) &&
        change.after['grant_controls'].any(_['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == 'azuread_conditional_access_policy')
    mql: |
      terraform.state.resources.where(type == 'azuread_conditional_access_policy').any(
        values['state'] == 'enabled' &&
        values['conditions'].any(_['sign_in_risk_levels'] != empty) &&
        values['grant_controls'].any(_['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-sign-in-risk-policies-bicep
    filters: asset.platform == "bicep" && bicep.resources.any(type == "Microsoft.Graph/conditionalAccessPolicies")
    mql: |
      bicep.resources.where(type == "Microsoft.Graph/conditionalAccessPolicies").any(
        body["state"] == "enabled" &&
        body["conditions"]["signInRiskLevels"] != empty &&
        body["grantControls"]["builtInControls"].any(_ == "mfa")
      )
  - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies
    title: Enable Microsoft Entra ID Protection user risk policies
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-03
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-16
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-de-cm-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-10
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies-microsoft365
        tags:
          mondoo.com/filter-title: Microsoft 365
          mondoo.com/filter-icon: microsoft
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
      - uid: mondoo-m365-security-enable-azure-ad-identity-protection-user-risk-policies-bicep
        tags:
          mondoo.com/filter-title: Bicep
          mondoo.com/filter-icon: bicep
    docs:
      desc: |
        This check verifies that the tenant acts automatically when Microsoft Entra ID Protection concludes an identity itself is compromised.

        User risk is a judgment about the account rather than about one sign-in. It rises when Microsoft finds the account's credentials in a leaked credential dump, when Microsoft threat intelligence links the identity to known attacker activity, or when a pattern of behavior over time indicates compromise. Acting on it requires a Conditional Access policy, created in the Microsoft Entra admin center under **Entra ID > Conditional Access > Policies**, with **Conditions > User risk** set to high and **Grant** set to **Require risk remediation**, or to the older combination of multifactor authentication and **Require password change**. This check requires an enabled policy, not one in report-only or off state, that is assigned to all users and all resources, covers the high user risk level, and forces a password change or risk remediation or blocks access. Multifactor authentication on its own does not satisfy it, because it leaves the leaked password valid. Provisioned as code, it is the same conditional access policy resource with a user risk condition and one of those grant controls.

        **Why this matters**

        A high user risk score means Microsoft has concrete evidence the password is in somebody else's hands. Without a policy, that evidence produces a dashboard entry and nothing else, and the compromised credential keeps working until an analyst notices and acts manually. In practice that window is measured in days, and often nobody looks at all.

        The attacker does not wait. The leaked password that raised the score is the one they are already using, and the account continues serving mail, Teams history, and SharePoint content to them throughout.

        A user risk policy closes that gap without a human in the loop. The account is forced through a password change backed by a second factor at its next authentication, which invalidates the credential the attacker holds and requires them to defeat a factor they do not have to regain anything.

        Exclude an emergency access account so a false positive on the wrong identity cannot lock every administrator out of the tenant, and pair this with a sign-in risk policy, since the two cover different signals and a companion check in this policy tracks the other one.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Entra ID** > **Conditional Access** > **Policies**.
        3. Look for a policy that includes **All users**, targets **All resources**, sets **Conditions** > **User risk** to include **High**, and under **Grant** requires risk remediation or a password change, or blocks access.

        A passing tenant has at least one such policy set to **On**. A failing tenant has no such policy, scopes it to selected users or apps only, grants access with multifactor authentication alone, or has it in **Report-only** or **Off** state.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list Conditional Access policies:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgIdentityConditionalAccessPolicy |
          Where-Object {
            $_.State -eq "enabled" -and
            $_.Conditions.Users.IncludeUsers -contains "All" -and
            $_.Conditions.Applications.IncludeApplications -contains "All" -and
            $_.Conditions.UserRiskLevels -contains "high" -and
            ($_.GrantControls.BuiltInControls -contains "passwordChange" -or $_.GrantControls.BuiltInControls -contains "riskRemediation" -or $_.GrantControls.BuiltInControls -contains "block")
          }
        ```

        A passing tenant returns at least one policy. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure a user risk policy:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Entra ID` > `Conditional Access` > `Policies`.
            3. Select `New policy`.
            4. Configure the policy:
               - Under `Users or workload identities`, choose `All users` and exclude at least one emergency access account.
               - Under `Target resources`, include `All resources (formerly 'All cloud apps')`.
               - Under `Conditions` > `User risk`, set `Configure` to `Yes` and select the `High` risk level.
               - Under `Access controls` > `Grant`, select `Grant access`, then select `Require risk remediation`. Tenants that have not moved to risk remediation can instead select `Require multifactor authentication` and `Require password change`.
               - Under `Session`, ensure `Sign-in frequency` is set to `Every time`.
            5. You may start the policy in `Report-only` mode to assess impact, but it must be set to `On` to be enforced.
            6. Select `Create`.

            **NOTE:** For more information about risk levels, refer to [Microsoft Entra ID Protection risks](https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks).
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess", "Policy.Read.All"
            ```

            2. Create a new Conditional Access policy for user risk. `clientAppTypes` is a required property of the conditions object, so the request fails without it. When the sign-in frequency interval is `everyTime`, `authenticationType` must be supplied and the `value` and `type` properties must be omitted:

            ```powershell
            $params = @{
                displayName = "User risk policy - Require MFA and password change for high risk users"
                state = "enabled"
                conditions = @{
                    clientAppTypes = @("all")
                    users = @{
                        includeUsers = @("All")
                        excludeUsers = @("<breakglass-account-id>")  # Replace with your emergency access account
                    }
                    applications = @{
                        includeApplications = @("All")
                    }
                    userRiskLevels = @("high")
                }
                grantControls = @{
                    operator = "AND"
                    builtInControls = @("mfa", "passwordChange")
                }
                sessionControls = @{
                    signInFrequency = @{
                        isEnabled = $true
                        frequencyInterval = "everyTime"
                        authenticationType = "primaryAndSecondaryAuthentication"
                    }
                }
            }
            New-MgIdentityConditionalAccessPolicy -BodyParameter $params
            ```
        - id: terraform
          desc: |
            **Using Terraform with the azuread provider**

            ```hcl
            resource "azuread_conditional_access_policy" "user_risk_policy" {
              display_name = "User risk policy - Require MFA and password change for high risk"
              state        = "enabled"

              conditions {
                client_app_types = ["all"]
                users {
                  included_users = ["All"]
                  excluded_users = [azuread_user.breakglass.object_id]
                }
                applications {
                  included_applications = ["All"]
                }
                user_risk_levels = ["high"]
              }

              grant_controls {
                operator          = "AND"
                built_in_controls = ["mfa", "passwordChange"]
              }

              session_controls {
                sign_in_frequency_interval            = "everyTime"
                sign_in_frequency_authentication_type = "primaryAndSecondaryAuthentication"
              }
            }
            ```

            For more details, see [azuread_conditional_access_policy](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/conditional_access_policy) in the Terraform Registry.
