    docs:
      desc: |
        This check verifies that every account in the tenant, not only the administrators, must present a second factor.

        The control is a Conditional Access policy created in the Microsoft Entra admin center under **Protection > Conditional Access > Policies**, with the **Users** assignment set to all users and **Grant** set to require multifactor authentication. A Microsoft 365 tenant with no such policy leaves ordinary accounts protected by a password alone. This check requires the policy to exist and be enabled. Declared as code, it is a conditional access policy resource including all users with a multifactor grant control.

        **Why this matters**

        Administrators are a handful of accounts that people watch. Everyone else is thousands of accounts that nobody watches, and an attacker only has to succeed against one of them.

        The value in an ordinary mailbox is routinely underestimated. It holds the password reset messages for every other system the person uses, the customer contracts they negotiated, the spreadsheets finance sends around, and the internal threads that make a follow-up message from that person entirely believable. Taking one non-privileged account gives an attacker a trusted identity inside the organization, which is the ideal position from which to phish the accounts that do have privilege. Business email compromise almost always starts here rather than at the top.

        A password reaches the attacker through reuse or a convincing sign-in page, and with no second factor that is the end of the story. With one, the harvested password is worth nothing on its own.

        Enforcing tenant-wide blocks sign-in for anyone who has not registered a method, so confirm registration coverage and communicate the change before turning the policy on, exclude at least one emergency access account, and use report-only mode first to find the service accounts and shared mailboxes that will need a different approach.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Protection** > **Conditional Access** > **Policies**.
        3. Look for an enabled policy whose **Users** assignment includes **All users** and whose **Grant** control requires multifactor authentication.

        A passing tenant has at least one enabled policy that requires MFA for all users. A failing tenant has no such policy, or it is in **Report-only** or **Off** state.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list Conditional Access policies:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgIdentityConditionalAccessPolicy |
          Where-Object { $_.State -eq "enabled" -and $_.Conditions.Users.IncludeUsers -contains "All" }
        ```

        A passing tenant returns at least one policy scoped to all users. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To enable multifactor authentication for all users:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Protection` > `Conditional Access` > `Policies`.
            3. Select `New policy`.
            4. Go to `Users` > `Include` and select `All users`.
            5. Under `Users` > `Exclude`, add at least one emergency access account so a failed MFA rollout cannot lock administrators out of the tenant.
            6. Go to `Target resources` > `Cloud apps` > `Include` and select `All cloud apps`.
            7. Under `Access controls` > `Grant`, select `Grant access` and check `Require multifactor authentication`.
            8. Start the policy in `Report-only` mode, review the sign-in logs for unintended impact, then set it to `On`.
            9. Select `Create`.

            **WARNING:** Enforcing MFA tenant wide blocks sign-in for any user who has not registered an authentication method. Communicate the change and confirm registration coverage before enabling the policy.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess", "Policy.Read.All"
            ```

            2. Create a Conditional Access policy requiring MFA for all users. `clientAppTypes` is a required property of the conditions object, so the request fails without it. Exclude at least one emergency access account:

            ```powershell
            $params = @{
                displayName = "Require MFA for all users"
                state = "enabled"
                conditions = @{
                    clientAppTypes = @("all")
                    users = @{
                        includeUsers = @("All")
                        excludeUsers = @("<breakglass-account-id>")  # Replace with your emergency access account
                    }
                    applications = @{
                        includeApplications = @("All")
                    }
                }
                grantControls = @{
                    operator = "OR"
                    builtInControls = @("mfa")
                }
            }
            New-MgIdentityConditionalAccessPolicy -BodyParameter $params
            ```
        - id: terraform
          desc: |
            **Using Terraform with the azuread provider**

            ```hcl
            resource "azuread_conditional_access_policy" "require_mfa_all_users" {
              display_name = "Require MFA for all users"
              state        = "enabled"

              conditions {
                client_app_types = ["all"]
                users {
                  included_users = ["All"]
                  excluded_users = [azuread_user.breakglass.object_id]
                }
                applications {
                  included_applications = ["All"]
                }
              }

              grant_controls {
                operator          = "OR"
                built_in_controls = ["mfa"]
              }
            }
            ```

            For more details, see [azuread_conditional_access_policy](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/conditional_access_policy) in the Terraform Registry.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks
        title: Microsoft Entra Multifactor Authentication
  - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-all-roles-microsoft365
    filters: |
      asset.platform == "microsoft365"
    mql: |
      microsoft.security.latestSecureScores.controls.where(controlName == 'MFARegistrationV2').all(score == 9)
  - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-all-roles-terraform-hcl
    filters: |
      asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == 'azuread_conditional_access_policy')
    mql: |
      terraform.resources('azuread_conditional_access_policy').any(
        arguments['state'] == 'enabled' &&
        blocks.where(type == 'conditions').any(blocks.where(type == 'users').any(arguments['included_users'].contains('All'))) &&
        blocks.where(type == 'grant_controls').any(arguments['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-all-roles-terraform-plan
    filters: |
      asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == 'azuread_conditional_access_policy')
    mql: |
      terraform.plan.resourceChanges.where(type == 'azuread_conditional_access_policy').any(
        change.after['state'] == 'enabled' &&
        change.after['conditions'].any(_['users'].any(_['included_users'].contains('All'))) &&
        change.after['grant_controls'].any(_['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-all-roles-terraform-state
    filters: |
      asset.platform == "terraform-state" && terraform.state.resources.contains(type == 'azuread_conditional_access_policy')
    mql: |
      terraform.state.resources.where(type == 'azuread_conditional_access_policy').any(
        values['state'] == 'enabled' &&
        values['conditions'].any(_['users'].any(_['included_users'].contains('All'))) &&
        values['grant_controls'].any(_['built_in_controls'].contains('mfa'))
      )
  - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-all-roles-bicep
    filters: asset.platform == "bicep" && bicep.resources.any(type == "Microsoft.Graph/conditionalAccessPolicies")
    mql: |
      bicep.resources.where(type == "Microsoft.Graph/conditionalAccessPolicies").any(
          body["state"] == "enabled" &&
          body["conditions"]["users"]["includeUsers"].any(_ == "All") &&
          body["grantControls"]["builtInControls"].any(_ == "mfa")
      )
  # No Terraform variants: the security defaults toggle has no azuread Terraform resource and can only be changed through the Graph API or portal.
  - uid: mondoo-m365-security-ensure-security-defaults-is-disabled-on-azure-active-directory
    title: Ensure Security Defaults is disabled on Microsoft Entra ID
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-01
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      microsoft.policies.identitySecurityDefaultsEnforcementPolicy.isEnabled == false
    docs:
      desc: |
        This check verifies that the tenant has moved off the Microsoft-managed baseline and onto its own explicit access policies.

        Security defaults is a single on or off switch in the Microsoft Entra admin center under **Identity > Overview > Properties > Manage security defaults**. It applies a fixed set of protections to everybody and cannot be scoped, tuned, or excepted. Critically, it is mutually exclusive with Conditional Access: while security defaults is on, the tenant cannot use Conditional Access policies at all. This check requires it to be disabled, which is what makes the policies the rest of this bundle looks for possible.

        **Why this matters**

        The gap security defaults leaves is not weak protection, it is inflexibility that forces bad choices. It has no exclusion mechanism, so there is no way to keep an emergency access account outside the multifactor requirement, and a tenant that loses access to its authentication methods has no way back in. It cannot condition access on sign-in risk or user risk, so the Entra ID Protection signals that identify a compromised credential cannot be acted on automatically. It cannot distinguish an administrator from a contractor, or a managed device from an unmanaged one.

        The result in practice is that organizations needing any of that turn security defaults off and then do not replace it, leaving a window with neither the baseline nor its successor. That window is where an attacker with a phished password walks in unchallenged.

        Disabling this is only correct as part of a migration, not on its own. Do not turn it off until the Conditional Access policies that replace it are built and enabled, including a tenant-wide multifactor requirement and a policy blocking legacy authentication, which companion checks in this policy verify. A small tenant without the licensing for Conditional Access is better served by leaving security defaults on and accepting this finding than by disabling it and enforcing nothing.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Identity** > **Overview** > **Properties**.
        3. Select **Manage security defaults** and review the **Security defaults** setting.

        A passing tenant has security defaults set to **Disabled**, with Conditional Access policies providing equivalent or stronger controls. A failing tenant has security defaults **Enabled**.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and read the security defaults policy:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgPolicyIdentitySecurityDefaultEnforcementPolicy | Select-Object IsEnabled
        ```

        A passing tenant returns `IsEnabled : False`. A failing tenant returns `IsEnabled : True`.
      remediation:
        - id: console
          desc: |
            **To disable security defaults:**

            1. Navigate to the `Microsoft Entra admin center` https://entra.microsoft.com.
            2. Select to expand `Identity` select `Overview`
            3. Select `Properties`.
            4. Select `Manage security defaults`.
            5. Set the `Security defaults` dropdown to `Disabled`.
            6. Select Save.

            **WARNING:** It is recommended not to disable security defaults until you are ready to implement conditional access rules in the benchmark. Rules such as requiring MFA for all users and blocking legacy protocols are required in CA in order to make up the gap by disabling defaults. Plan accordingly. See the reference section for more details on what coverage Security Defaults provide.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to the Microsoft Graph service:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess"
            ```

            2. Disable security defaults:

            ```powershell
            $params = @{ IsEnabled = $false }
            Update-MgPolicyIdentitySecurityDefaultEnforcementPolicy -BodyParameter $params
            ```

            **WARNING:** Ensure you have Conditional Access policies in place before disabling security defaults.
        # No Terraform remediation: the security defaults toggle has no azuread Terraform resource and can only be changed through the Graph API or portal.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
        title: Microsoft Entra Conditional Access
      - url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
        title: Microsoft Entra Security Defaults
  # No Terraform variants: this check counts live Global Administrator assignments, which Terraform source cannot enumerate because portal-created assignments are invisible to it.
  - uid: mondoo-m365-security-ensure-that-between-two-and-four-global-admins-are-designated
    title: Ensure that between two and four global admins are designated
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      microsoft.roles.where(displayName == "Global Administrator").all(assignments.length.inRange(2,4))
    docs:
      desc: |
        This check verifies that the Global Administrator role is held by a small named group, between two and four accounts.

        Global Administrator is the unrestricted role in Microsoft 365. Microsoft imposes no upper or lower bound on how many accounts hold it, so the count drifts in both directions. You review the assignments in the Microsoft Entra admin center under **Identity > Roles & admins > Roles**, and change them there or from the Microsoft 365 admin center under **Users > Active Users** using **Manage roles**. This check requires the number of assignments to fall between two and four.

        **Why this matters**

        Every Global Administrator is a complete path to the tenant, and an attacker needs only the weakest one. Where the role has been handed out for convenience, the weakest is usually someone who does not think of themselves as an administrator: the person granted it years ago to install one application, who signs in from a personal device and has never been the subject of a security conversation.

        What that access yields is total. Read any mailbox through granted access, reset any password, add an identity provider that issues tokens for any user, consent an application to tenant-wide permissions. The attacker's first move is usually to establish a second privileged identity of their own, so that discovering and resetting the original account does not evict them.

        The lower bound guards a different failure. A single Global Administrator means one lockout, one departure, or one compromise leaves nobody able to suspend accounts, revoke tokens, or run an investigation during the incident that just started.

        Move day-to-day work to least-privilege roles such as Exchange Administrator or User Administrator rather than leaving people at the top, and pair the small standing group with just-in-time activation, which a companion check in this policy verifies.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Identity** > **Roles & admins** > **Roles**.
        3. Select the **Global Administrator** role and review its **Assignments**.

        A passing tenant has between two and four accounts assigned the Global Administrator role. A failing tenant has fewer than two or more than four.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list the Global Administrator role members:

        ```powershell
        Connect-MgGraph -Scopes "RoleManagement.Read.Directory"
        $role = Get-MgDirectoryRole -Filter "roleTemplateId eq '62e90394-69f5-4237-9190-012177145e10'"
        Get-MgDirectoryRoleMember -DirectoryRoleId $role.Id
        ```

        A passing tenant returns between two and four members. A failing tenant returns fewer than two or more than four.
      remediation:
        - id: console
          desc: |
            **To correct the number of global tenant administrators:**

            1. Navigate to the `Microsoft 365 admin center` https://admin.microsoft.com
            2. Select `Users` > `Active Users`.
            3. In the `Search` field enter the name of the user to be made a Global Administrator.
            4. To create a new Global Admin:
              1. Select the user's name.
              2. A window will appear to the right.
              3. Select `Manage roles`.
              4. Select `Admin center access`.
              5. Check `Global Administrator`.
              6. Select `Save changes`.
            5. To remove Global Admins:
              1. Select User.
              2. Under `Roles` select `Manage roles`
              3. De-Select the appropriate role.
              4. Select `Save changes`.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "RoleManagement.ReadWrite.Directory", "User.Read.All"
            ```

            2. Get the Global Administrator role. The directory roles endpoint only supports filtering by role template ID, and the Global Administrator template ID is fixed across all tenants:

            ```powershell
            $globalAdminRole = Get-MgDirectoryRole -Filter "roleTemplateId eq '62e90394-69f5-4237-9190-012177145e10'"
            ```

            3. List current Global Administrators:

            ```powershell
            Get-MgDirectoryRoleMember -DirectoryRoleId $globalAdminRole.Id | ForEach-Object {
                Get-MgUser -UserId $_.Id | Select-Object DisplayName, UserPrincipalName
            }
            ```

            4. To add a user as Global Administrator:

            ```powershell
            $user = Get-MgUser -Filter "userPrincipalName eq 'user@domain.com'"
            $params = @{
                "@odata.id" = "https://graph.microsoft.com/v1.0/directoryObjects/$($user.Id)"
            }
            New-MgDirectoryRoleMemberByRef -DirectoryRoleId $globalAdminRole.Id -BodyParameter $params
            ```

            5. To remove a user from Global Administrator:

            ```powershell
            $user = Get-MgUser -Filter "userPrincipalName eq 'user@domain.com'"
            Remove-MgDirectoryRoleMemberByRef -DirectoryRoleId $globalAdminRole.Id -DirectoryObjectId $user.Id
            ```
        - id: terraform
          desc: |
            **Using Terraform (azuread provider)**

            Declare each Global Administrator assignment explicitly so the count is reviewable in source control. Key the `for_each` map by a static name rather than building a set from the user object IDs. Terraform rejects a `for_each` whose keys are only known after apply, so a set built from `object_id` values fails at plan time:

            ```hcl
            locals {
              global_admin_template_id = "62e90394-69f5-4237-9190-012177145e10"

              global_admins = {
                admin_one = azuread_user.admin_one.object_id
                admin_two = azuread_user.admin_two.object_id
              }
            }

            resource "azuread_directory_role_assignment" "global_admins" {
              for_each            = local.global_admins
              role_id             = local.global_admin_template_id
              principal_object_id = each.value
            }
            ```

            For more details, see [azuread_directory_role_assignment](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/directory_role_assignment) in the Terraform Registry.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
        title: Microsoft Entra Built-in Roles
  # No Terraform variants: Intune device configuration profiles have no resource in the azuread Terraform provider.
  - uid: mondoo-m365-security-ensure-that-mobile-device-encryption-is-enabled-to-prevent-unauthorized-access-to-mobile-data
    title: Ensure that Android mobile device encryption is enabled
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-uem-08
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-19
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-3-1-4
    mql: |
      microsoft.devicemanagement.deviceConfigurations.where(platformType == "android").all(settings.storageRequireDeviceEncryption == true)
    docs:
      desc: |
        This check verifies that managed Android devices are required to encrypt their storage.

        The requirement is expressed in a device configuration profile in the Microsoft Intune admin center under **Devices > Configuration**, where a device restrictions profile for the Android platform carries the `storageRequireDeviceEncryption` setting. Intune does not turn it on in a newly created profile, so it has to be set deliberately and the profile assigned to the device groups that need it. This check requires every Android device configuration profile to require storage encryption.

        **Why this matters**

        A managed phone holds a working copy of corporate data rather than a link to it. Cached mail going back weeks, attachments opened in Outlook, files synced from OneDrive and SharePoint, Teams message history, and the tokens that authenticate all of it without asking for a password again.

        Unencrypted, that copy survives the lock screen. A phone left in a taxi or lifted at a conference is not attacked through its interface; the storage is read directly, either by attaching the device to a computer in a diagnostic mode or by removing the flash storage entirely. The lock screen never participates. The attacker gets the mailbox contents and, more usefully, the refresh tokens, which let them continue authenticating as that user from their own machine until the tokens are revoked, long after the phone is written off as lost.

        Encryption ties the data to a key the lock credential releases, so the same physical access yields nothing readable.

        Android Enterprise work profile and fully managed enrollments enforce storage encryption on their own, so provisioning through Android Enterprise satisfies the requirement without a separate setting. The legacy Android device administrator path is deprecated and winding down in Intune, so treat any remaining profiles there as a migration task rather than a place to add new configuration.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Intune admin center at `https://intune.microsoft.com`.
        2. Go to **Devices** > **Configuration**.
        3. Open each device configuration profile and confirm that storage encryption is required.

        A passing tenant has every applicable device configuration profile requiring device storage encryption. A failing tenant has a profile that does not require encryption.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list device configuration profiles:

        ```powershell
        Connect-MgGraph -Scopes "DeviceManagementConfiguration.Read.All"
        Get-MgDeviceManagementDeviceConfiguration
        ```

        A passing tenant returns profiles that require storage encryption. A failing tenant returns a profile with encryption not required.
      remediation:
        - id: console
          desc: |
            **Using the Microsoft Intune admin center:**

            Android Enterprise is the recommended enrollment model. Android Enterprise work profile and fully managed devices enforce storage encryption automatically, so provisioning these devices through Android Enterprise satisfies the encryption requirement without a separate device restrictions setting.

            1. Sign in to the Microsoft Intune admin center at https://intune.microsoft.com.
            2. Go to `Devices` > `Manage devices` > `Configuration`.
            3. Select `Create` > `New policy`.
            4. For `Platform`, select `Android Enterprise`. For `Profile type`, select `Device restrictions` for the relevant management mode such as `Fully Managed, Dedicated, and Corporate-Owned Work Profile`.
            5. Confirm the device password and encryption settings enforce encryption, then assign the profile to the appropriate device groups and select `Create`.

            **Legacy fallback using Android device administrator:**

            Microsoft has deprecated Android device administrator management, and Intune has wound down support for device administrator enrollment. Use this path only for remaining device administrator profiles that have not yet migrated to Android Enterprise.

            1. In `Devices` > `Manage devices` > `Configuration`, select `Create` > `New policy`.
            2. For `Platform`, select `Android device administrator`. For `Profile type`, select `Device restrictions`.
            3. In the `Password` section, set `Encryption` to `Require`.
            4. Assign the profile to the appropriate device groups and select `Create`.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with Intune scopes:

            ```powershell
            Connect-MgGraph -Scopes "DeviceManagementConfiguration.ReadWrite.All"
            ```

            2. Create or update an Android device configuration policy requiring encryption:

            ```powershell
            $params = @{
                "@odata.type" = "#microsoft.graph.androidGeneralDeviceConfiguration"
                displayName = "Android Security Policy - Require Encryption"
                description = "Requires device encryption on Android devices"
                storageRequireDeviceEncryption = $true
            }

            # Create new policy
            New-MgDeviceManagementDeviceConfiguration -BodyParameter $params

            # Or update existing policy
            # Update-MgDeviceManagementDeviceConfiguration -DeviceConfigurationId <policy-id> -BodyParameter $params
            ```

            3. Assign the policy to a group:

            ```powershell
            $assignment = @{
                target = @{
                    "@odata.type" = "#microsoft.graph.allDevicesAssignmentTarget"
                }
            }
            New-MgDeviceManagementDeviceConfigurationAssignment -DeviceConfigurationId <policy-id> -BodyParameter $assignment
            ```
        # No Terraform remediation: Intune device configuration has no resource in the azuread Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/mem/intune/configuration/device-restrictions-android
        title: Android Device Restriction Settings in Microsoft Intune
  # No Terraform variants: Intune device configuration profiles have no resource in the azuread Terraform provider.
  - uid: mondoo-m365-security-ensure-that-mobile-devices-require-a-minimum-password-length-to-prevent-brute-force-attacks
    title: Ensure minimum password length is set to prevent brute force
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-3-1-4
    mql: |
      microsoft.devicemanagement.deviceConfigurations.where(platformType == "windows10").all(settings.passwordMinimumLength >= 8)
      microsoft.devicemanagement.deviceConfigurations.where(platformType == "macOS").all(settings.passwordMinimumLength >= 8)
      microsoft.devicemanagement.deviceConfigurations.where(platformType == "iOS").all(settings.passcodeMinimumLength >= 8)
      microsoft.devicemanagement.deviceConfigurations.where(platformType == "android").all(settings.passwordMinimumLength >= 8)
      microsoft.devicemanagement.deviceConfigurations.where(platformType == "androidWorkProfile").all(settings.passwordMinimumLength >= 8)
    docs:
      desc: |
        This check verifies that managed devices require a device password or passcode of at least 8 characters.

        The requirement is set per platform in a device restrictions profile in the Microsoft Intune admin center under **Devices > Configuration**, in the password section. This check reads the configured minimum for Windows 10 and later, macOS, iOS, Android, and Android Enterprise work profile devices, and requires every profile to enforce at least 8. On iOS and iPadOS the field is named minimum passcode length rather than password length. Intune leaves the value unset in a new profile, which means the device default or whatever the user chooses.

        **Why this matters**

        The device credential is the only thing between someone holding the hardware and the data on it, because it is also what releases the storage encryption key. A four-digit PIN gives ten thousand possibilities, which is not a search space, it is a short wait. Somebody who takes the phone from a hotel room can exhaust it, and shoulder-surfing or a smudge pattern narrows it further before they start.

        What is behind the credential is the whole point. Cached mail and attachments, files synced from OneDrive and SharePoint, Teams history, saved credentials in the browser, and the refresh tokens that let the attacker keep authenticating as that user from their own equipment after the device itself is wiped and forgotten.

        Eight characters is a floor rather than a target. It is the length below which offline and opportunistic guessing stops being meaningfully constrained, and it is the length recommended by current federal password guidance for memorized secrets.

        Set the value on every platform your organization manages rather than only the dominant one, since an unset profile leaves the choice to the user, and pair the length requirement with storage encryption, which a companion check in this policy verifies for Android.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Intune admin center at `https://intune.microsoft.com`.
        2. Go to **Devices** > **Configuration**.
        3. Open each device configuration profile and confirm the minimum password or passcode length is set to at least 8 characters.

        A passing tenant has every applicable device configuration profile enforcing a minimum password length of 8 or more. A failing tenant has a profile with a shorter or unset minimum length.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list device configuration profiles:

        ```powershell
        Connect-MgGraph -Scopes "DeviceManagementConfiguration.Read.All"
        Get-MgDeviceManagementDeviceConfiguration
        ```

        A passing tenant returns profiles enforcing a minimum password length of 8 or more. A failing tenant returns a profile with a shorter or unset value.
      remediation:
        - id: console
          desc: |
            **Using the Microsoft Intune admin center:**

            1. Sign in to the Microsoft Intune admin center at https://intune.microsoft.com.
            2. Go to `Devices` > `Manage devices` > `Configuration`.
            3. For each managed platform, Windows 10 and later, macOS, iOS/iPadOS, Android device administrator, and Android Enterprise work profile, create or edit a `Device restrictions` profile.
            4. In the `Password` section, set `Minimum password length` to `8` or higher. On iOS/iPadOS the setting is named `Minimum passcode length`.
            5. Assign each profile to the appropriate device groups and save it.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with Intune scopes:

            ```powershell
            Connect-MgGraph -Scopes "DeviceManagementConfiguration.ReadWrite.All"
            ```

            2. Create device configuration policies for each platform:

            **For Windows 10:**
            ```powershell
            $windowsParams = @{
                "@odata.type" = "#microsoft.graph.windows10GeneralConfiguration"
                displayName = "Windows 10 Password Policy"
                passwordMinimumLength = 8
            }
            New-MgDeviceManagementDeviceConfiguration -BodyParameter $windowsParams
            ```

            **For macOS:**
            ```powershell
            $macosParams = @{
                "@odata.type" = "#microsoft.graph.macOSGeneralDeviceConfiguration"
                displayName = "macOS Password Policy"
                passwordMinimumLength = 8
            }
            New-MgDeviceManagementDeviceConfiguration -BodyParameter $macosParams
            ```

            **For iOS:**
            ```powershell
            $iosParams = @{
                "@odata.type" = "#microsoft.graph.iosGeneralDeviceConfiguration"
                displayName = "iOS Password Policy"
                passcodeMinimumLength = 8
            }
            New-MgDeviceManagementDeviceConfiguration -BodyParameter $iosParams
            ```

            **For Android:**
            ```powershell
            $androidParams = @{
                "@odata.type" = "#microsoft.graph.androidGeneralDeviceConfiguration"
                displayName = "Android Password Policy"
                passwordMinimumLength = 8
            }
            New-MgDeviceManagementDeviceConfiguration -BodyParameter $androidParams
            ```

            **For Android Enterprise work profile:**
            ```powershell
            $workProfileParams = @{
                "@odata.type" = "#microsoft.graph.androidWorkProfileGeneralDeviceConfiguration"
                displayName = "Android Work Profile Password Policy"
                passwordMinimumLength = 8
            }
            New-MgDeviceManagementDeviceConfiguration -BodyParameter $workProfileParams
            ```

            3. Update the profiles that already enforce a shorter length. Creating a new profile leaves existing ones untouched, and this check evaluates every profile, so a single remaining profile with a shorter minimum keeps it failing:

            ```powershell
            # Review the existing profiles and their minimum lengths
            Get-MgDeviceManagementDeviceConfiguration |
              Select-Object Id, DisplayName, @{n="Type";e={$_.AdditionalProperties."@odata.type"}}

            # Raise the minimum on a profile that enforces fewer than 8 characters,
            # passing the parameter set that matches that profile's type
            Update-MgDeviceManagementDeviceConfiguration -DeviceConfigurationId <policy-id> -BodyParameter $windowsParams
            ```

            4. Assign policies to appropriate device groups.
        # No Terraform remediation: Intune device configuration has no resource in the azuread Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
        title: Microsoft Entra Password Protection
      - url: https://learn.microsoft.com/en-us/mem/intune/configuration/device-restrictions-configure
        title: Configure Device Restriction Settings in Microsoft Intune
  # No Terraform variants: per-domain password validity has no azuread Terraform resource and is set only through the Graph API.
  - uid: mondoo-m365-security-ensure-that-ms-365-passwords-are-not-set-to-expire
    title: Ensure password expiration policy is set to never expire
    filters: |
      asset.platform == "microsoft365"
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      microsoft.domains.all(passwordValidityPeriodInDays == 2147483647)
    docs:
      desc: |
        This check verifies that user passwords are not forced to rotate on a schedule.

        The setting lives in the Microsoft 365 admin center under **Settings > Org settings > Security & privacy > Password expiration policy**, where selecting the never expire option is what this check requires. Microsoft records it per domain as a `passwordValidityPeriodInDays` value of `2147483647`, the sentinel meaning no expiry. Tenants that have not changed it may still carry the older default of 90 days.

        **Why this matters**

        Forced rotation degrades the passwords it is meant to refresh. People do not generate a new secret every quarter; they increment the one they have. Autumn2024! becomes Winter2025!, and the pattern is so consistent that password-spray tooling derives the next season's guesses directly from a leaked earlier password. An attacker holding one historical credential for your organization can often produce the current one without guessing blindly.

        Rotation also pushes users away from the practices that actually help. A password that must be memorized and retyped every ninety days will not be a long random string from a password manager; it will be short, meaningful, and reused. And because staff are trained to expect periodic reset prompts, a phishing message that presents one is unremarkable.

        Removing expiry only helps if the password is not the sole defense. Current guidance from the national standards bodies and from Microsoft's own baselines is to drop scheduled rotation and rely on strong unique credentials, a second factor, and a reset triggered by evidence of compromise instead of by the calendar.

        Confirm multifactor authentication is enforced for all users, which a companion check in this policy verifies, and turn on Microsoft Entra Password Protection to block weak and previously breached passwords before you remove expiry. Without those, a compromised password stays valid indefinitely.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft 365 admin center at `https://admin.microsoft.com`.
        2. Go to **Settings** > **Org settings** > **Security & privacy**.
        3. Select **Password expiration policy** and review the setting.

        A passing tenant has **Set passwords to never expire** selected. A failing tenant has a finite password expiration period configured.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and read the password validity period for every domain:

        ```powershell
        Connect-MgGraph -Scopes "Domain.Read.All"
        Get-MgDomain | Select-Object Id, PasswordValidityPeriodInDays
        ```

        A passing tenant returns `PasswordValidityPeriodInDays : 2147483647` for every domain. A failing tenant returns a smaller value.
      remediation:
        - id: console
          desc: |
            **To set Microsoft 365 passwords to never expire:**

            Never-expiring passwords are only safe when they sit behind other controls. Confirm that multifactor authentication is enforced for all users and that Microsoft Entra Password Protection is enabled to block weak and breached passwords before removing expiration. Without those controls, a compromised password stays valid indefinitely.

            1. Navigate to the `Microsoft 365 admin center` at https://admin.microsoft.com.
            2. Go to `Settings` > `Org settings`.
            3. Under the `Security & privacy` tab, locate and select `Password expiration policy`.
            4. Check the box for `Set passwords to never expire (recommended)`.
            5. Select `Save changes`.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to the Microsoft Graph service:

            ```powershell
            Connect-MgGraph -Scopes "Domain.ReadWrite.All"
            ```

            2. Set passwords to never expire for each domain:

            ```powershell
            # Get all domains
            $domains = Get-MgDomain

            # Set password policy for each domain
            foreach ($domain in $domains) {
                Update-MgDomain -DomainId $domain.Id `
                    -PasswordValidityPeriodInDays 2147483647 `
                    -PasswordNotificationWindowInDays 30
            }
            ```

            Or for a specific domain:

            ```powershell
            Update-MgDomain -DomainId "contoso.com" `
                -PasswordValidityPeriodInDays 2147483647 `
                -PasswordNotificationWindowInDays 30
            ```
        # No Terraform remediation: per-domain password validity has no azuread Terraform resource and is set only through the Graph API.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
        title: Microsoft Entra Password Protection
  # No Terraform variants: this check inspects live published DNS records; the Terraform analog depends on which DNS provider hosts each domain and cannot be expressed as a single M365 resource.
  - uid: mondoo-m365-security-ensure-that-spf-records-are-published-for-all-exchange-domains
    title: Ensure that SPF records are published for all Exchange Domains
    filters: |
      asset.platform == "microsoft365"
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: false
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-8
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-5-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      microsoft.domains.where(isVerified == true && id != /\.onmicrosoft\.com$/).all(dns(id).spf != empty)
    docs:
      desc: |
        This check verifies that every custom domain in the tenant publishes an SPF record naming the servers allowed to send as it.

        Sender Policy Framework is a TXT record in the domain's own DNS zone listing authorized sending sources. For a domain that sends only through Exchange Online the record is `v=spf1 include:spf.protection.outlook.com -all`, and other sending systems are added as further include terms. Adding a domain to Microsoft 365 does not create it; it has to be published at your DNS provider. This check requires an SPF record on every verified domain other than the tenant's own onmicrosoft.com domain.

        **Why this matters**

        Without a published record, receiving mail servers have no way to distinguish a message your organization sent from one an attacker composed on a rented server. There is no vulnerability to exploit here. Sending mail claiming to be from your domain is a matter of setting a header field, and the only thing that ever objected was a policy you never published.

        That is the delivery mechanism for the two most costly email attacks. A message that appears to come from your finance team reaches your customer with new bank details for an outstanding invoice. A message that appears to come from your IT team reaches your own staff with a link to a credential-harvesting page. Both arrive with your domain in the sender field, which is the entire reason they work.

        The record also carries a policy on failure. The `-all` terminator tells receivers to reject mail from sources you did not authorize, where a softer terminator asks them to accept it and make a note.

        Enumerate every system that sends on your behalf before publishing, including marketing platforms, ticketing systems, and application servers, since a record that omits one will cause legitimate mail to be rejected. SPF is also a prerequisite for DMARC enforcement, which a companion check in this policy verifies.
      audit: |
        Verify that every Exchange domain publishes an SPF record by querying its DNS TXT records:

        ```bash
        dig +short TXT example.com
        ```

        A passing domain returns a TXT record beginning with `v=spf1`. A failing domain returns no `v=spf1` record.
      remediation:
        - id: console
          desc: |
            **To setup SPF records for Exchange Online accepted domains, perform the following steps:**

            1. If all email in your domain is sent from and received by Exchange Online, add the following TXT record for each Accepted Domain:

            ```text
            v=spf1 include:spf.protection.outlook.com -all
            ```

            2. If there are other systems that send email in the environment, ensure the SPF record includes all authorized email-sending systems. For example:

            ```text
            v=spf1 include:spf.protection.outlook.com include:<other-system> -all
            ```

            3. Use the Microsoft Defender portal to validate your SPF record configuration. Refer to this article for detailed guidance: [https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/how-office-365-uses-spf-to-prevent-spoofing](https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/how-office-365-uses-spf-to-prevent-spoofing).
        - id: cli
          desc: |
            **Using CLI tools**

            SPF records must be configured at your DNS provider. Use these CLI examples based on your provider:

            **Using Azure DNS CLI:**
            ```bash
            az network dns record-set txt add-record \
              --resource-group "example-rg" \
              --zone-name "example.com" \
              --record-set-name "@" \
              --value "v=spf1 include:spf.protection.outlook.com -all"
            ```

            **Using AWS Route 53 CLI:**
            ```bash
            aws route53 change-resource-record-sets \
              --hosted-zone-id "Z0000000EXAMPLE" \
              --change-batch '{
                "Changes": [{
                  "Action": "UPSERT",
                  "ResourceRecordSet": {
                    "Name": "example.com",
                    "Type": "TXT",
                    "TTL": 3600,
                    "ResourceRecords": [{"Value": "\"v=spf1 include:spf.protection.outlook.com -all\""}]
                  }
                }]
              }'
            ```

            **Using Google Cloud DNS:**
            ```bash
            gcloud dns record-sets create "example.com." \
              --zone="example-zone" \
              --type=TXT \
              --ttl=3600 \
              --rrdatas='"v=spf1 include:spf.protection.outlook.com -all"'
            ```
        - id: terraform
          desc: |
            **Using Terraform**

            Configure SPF records at your DNS provider:

            **Azure DNS:**
            ```hcl
            resource "azurerm_dns_txt_record" "spf" {
              name                = "@"
              zone_name           = azurerm_dns_zone.example.name
              resource_group_name = azurerm_resource_group.example.name
              ttl                 = 3600

              record {
                value = "v=spf1 include:spf.protection.outlook.com -all"
              }
            }
            ```

            **AWS Route 53:**
            ```hcl
            resource "aws_route53_record" "spf" {
              zone_id = aws_route53_zone.example.zone_id
              name    = "example.com"
              type    = "TXT"
              ttl     = 3600
              records = ["v=spf1 include:spf.protection.outlook.com -all"]
            }
            ```

            **Google Cloud DNS:**
            ```hcl
            resource "google_dns_record_set" "spf" {
              name         = "example.com."
              managed_zone = google_dns_managed_zone.example.name
              type         = "TXT"
              ttl          = 3600
              rrdatas      = ["v=spf1 include:spf.protection.outlook.com -all"]
            }
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/defender-office-365/email-authentication-about
        title: Email Authentication in Microsoft 365
      - url: https://learn.microsoft.com/en-us/exchange/security-and-compliance/security-and-compliance
        title: Exchange Online Security and Compliance
  # No Terraform variants: the tenant authorization policy has no resource in the azuread Terraform provider.
  - uid: mondoo-m365-security-ensure-third-party-integrated-applications-are-not-allowed
    title: Ensure that no third party integrated applications are allowed
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-d
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-9
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    mql: microsoft.policies.authorizationPolicy.defaultUserRolePermissions.allowedToCreateApps == false
    docs:
      desc: |
        This check verifies that ordinary users cannot register applications in the tenant directory.

        Application registration is governed by the tenant authorization policy, exposed in the Microsoft Entra admin center under **Identity > Users > User settings** as the users can register applications option. Microsoft ships it enabled, so any account in the tenant can create an application identity that reaches Microsoft 365 data. This check requires the setting to be off, recorded on the default user role as `allowedToCreateApps` set to `false`.

        **Why this matters**

        An application registration is a first-class identity in your directory. It can hold its own credentials, be granted Microsoft Graph permissions, and authenticate without a user present, which is exactly the profile of a persistent backdoor. When any of thousands of accounts can create one, the security team has no list of what exists and no review step before something appears.

        For an attacker who has compromised a single ordinary mailbox, this is the step that converts a temporary session into permanent access. They register an application, add a client secret they control, grant it what they can, and from then on authenticate as that application rather than as the user. Resetting the compromised user's password, revoking their sessions, and enforcing a second factor on their account changes nothing, because the attacker no longer needs the account.

        The everyday version is quieter and just as damaging. Staff connect productivity tools, automation platforms, and scripts that read mail and files, and corporate data starts flowing to services that were never assessed and are not covered by your data governance or retention obligations.

        Restricting registration to administrators means every application identity in the tenant has been through a review. Pair it with an approval path so people who legitimately need an integration have somewhere to ask, rather than routing around the control.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Identity** > **Users** > **User settings**.
        3. Review the **Users can register applications** setting.

        A passing tenant has **Users can register applications** set to **No**. A failing tenant has it set to **Yes**.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and read the tenant authorization policy:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        (Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions | Select-Object AllowedToCreateApps
        ```

        A passing tenant returns `AllowedToCreateApps : False`. A failing tenant returns `AllowedToCreateApps : True`.
      remediation:
        - id: console
          desc: |
            **Using the Microsoft Entra admin center:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Identity` > `Users` > `User settings`.
            3. Set `Users can register applications` to `No`.
            4. Select `Save`.
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.Authorization"
            ```

            2. Update the authorization policy to prevent users from creating apps:

            ```powershell
            $params = @{
                defaultUserRolePermissions = @{
                    allowedToCreateApps = $false
                }
            }
            Update-MgPolicyAuthorizationPolicy -BodyParameter $params
            ```

            3. Verify the change:

            ```powershell
            (Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions.AllowedToCreateApps
            ```
        # No Terraform remediation: the tenant authorization policy has no resource in the azuread Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-application-management
        title: Microsoft Entra Application Management
  # No Terraform variants: Exchange Online configuration has no Terraform provider.
  - uid: mondoo-m365-security-ensure-dkim-signing-enabled-for-all-exchange-domains
    title: Ensure DKIM signing is enabled for all Exchange domains
    filters: |
      asset.platform == "microsoft365"
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-i-transmission-security-integrity-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-5-4-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      ms365.exchangeonline.dkimSigningConfigs.all(enabled == true)
    docs:
      desc: |
        This check verifies that Exchange Online cryptographically signs outbound mail for every domain in the tenant.

        DomainKeys Identified Mail attaches a signature to each outgoing message, computed over the headers and body with a private key whose public half is published in the domain's DNS as two selector records. Receiving servers verify it and learn both that the message came from an authorized sender for that domain and that it was not modified in transit. Microsoft 365 signs with a shared default key, but per-domain signing must be turned on for each custom domain, in the Microsoft Defender portal under **Email & collaboration > Policies & rules > Threat policies > Email authentication settings** on the DKIM tab. This check requires signing to be enabled for every domain.

        **Why this matters**

        A forged message can copy your sender address, your formatting, and your signature block, but it cannot produce a valid signature without your private key. That is the difference between a spoof that arrives looking like you and one that arrives failing verification.

        The attacks this blocks are the expensive ones. An invoice with altered bank details sent to your customers under your name. A message to your own staff, apparently from a director, asking for gift cards or a password. Both depend entirely on the recipient's mail server having no cryptographic reason to doubt the sender.

        Signing also protects the message in flight, since any modification to the signed content invalidates the signature rather than passing silently.

        Enabling DKIM fails until the two selector records returned by the tenant are published in the domain's DNS zone, so publish them, allow propagation, then enable. On its own DKIM tells receivers a message verified; the instruction to reject one that did not comes from DMARC, which a companion check in this policy verifies.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Defender portal at `https://security.microsoft.com`.
        2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Email authentication settings**.
        3. Select the **DKIM** tab and review each domain.

        A passing tenant has DKIM signing enabled for every domain. A failing tenant has a domain with DKIM disabled.

        ### Audit via PowerShell

        1. Connect to Exchange Online and list the DKIM signing configuration:

        ```powershell
        Connect-ExchangeOnline
        Get-DkimSigningConfig | Select-Object Domain, Enabled
        ```

        A passing tenant returns `Enabled : True` for every domain. A failing tenant returns `Enabled : False` for a domain.
      remediation:
        - id: console
          desc: |
            **To enable DKIM signing:**

            1. Navigate to the [Microsoft Defender portal](https://security.microsoft.com).
            2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies**.
            3. Select **Email authentication settings** > **DKIM**.
            4. For each domain, select the domain and toggle **Sign messages for this domain with DKIM signatures** to **Enabled**.
            5. If DKIM keys have not been created, follow the prompts to publish the required CNAME records in your DNS.
        - id: powershell
          desc: |
            **Using Exchange Online PowerShell**

            Requires the ExchangeOnlineManagement module and an Exchange Administrator role.

            ```powershell
            Connect-ExchangeOnline

            # List DKIM signing configuration for all domains
            Get-DkimSigningConfig | Format-Table Domain, Enabled, Status

            # For a domain with no DKIM configuration yet, create one.
            # The output includes the two selector CNAME records to publish in DNS.
            New-DkimSigningConfig -DomainName "example.com" -Enabled $true

            # For a domain that already has a configuration, enable signing
            Set-DkimSigningConfig -Identity "example.com" -Enabled $true
            ```

            Enabling DKIM fails until the selector1 and selector2 CNAME records returned by `Get-DkimSigningConfig` are published in the domain's DNS zone. Publish the records, allow them to propagate, then run the enable command again.
        # No Terraform remediation: Exchange Online configuration has no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/email-authentication-dkim-configure
        title: Configure DKIM signing in Microsoft 365
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/email-authentication-about
        title: Email authentication in Microsoft 365
  # No Terraform variants: Exchange Online Safe Links policies have no Terraform provider.
  - uid: mondoo-m365-security-ensure-safe-links-policies-configured
    title: Ensure Safe Links policies are configured
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-02
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-7
      compliance/nis-2: nis-2-21-2-g
      compliance/nist-csf-1: nist-csf-1-de-cm-4
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-5-4-1
      compliance/soc2-2017: soc2-control-cc6-8-4
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      ms365.exchangeonline.safeLinksPolicies.length > 0
    docs:
      desc: |
        This check verifies that URLs in mail and documents are checked at the moment a user clicks them.

        Safe Links is the Microsoft Defender for Office 365 feature that rewrites links so they resolve through Microsoft's checking service, evaluating the destination when the click happens rather than when the message arrived. Policies are created in the Microsoft Defender portal under **Email & collaboration > Policies & rules > Threat policies > Safe Links**. A new tenant has none, so links reach users unexamined. This check requires at least one Safe Links policy to be configured.

        **Why this matters**

        Filtering at delivery is a snapshot, and attackers have built their delivery around that fact. The link in the message points at a page that is empty, or at a legitimate file-sharing service, or at a redirect that has not yet been pointed anywhere. The message passes inspection cleanly and lands in the inbox. Hours later, once the mail has been scanned and forgotten, the destination is switched to the credential-harvesting page, and every user who clicks from that point on reaches it.

        Checking at click time is what defeats that, because the evaluation happens against what the URL resolves to now rather than what it resolved to at delivery.

        Coverage matters beyond inbound mail. Internal messages carry links too, and a compromised colleague's account is the most effective phishing sender in the organization. Safe Links can be applied to internal mail, to Teams, and to links embedded in Word, Excel, and PowerPoint files.

        Click telemetry is the other benefit. The reports show which users are being targeted repeatedly and which campaigns are landing, which is the information that makes awareness work specific instead of generic.

        Configure the policy to cover all users, apply it to internal mail as well as inbound, and disable click-through on a blocked page so a determined user cannot override the verdict.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Defender portal at `https://security.microsoft.com`.
        2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Safe Links**.
        3. Review the configured Safe Links policies.

        A passing tenant has at least one Safe Links policy configured. A failing tenant has none.

        ### Audit via PowerShell

        1. Connect to Exchange Online and list Safe Links policies:

        ```powershell
        Connect-ExchangeOnline
        Get-SafeLinksPolicy
        ```

        A passing tenant returns at least one policy. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure Safe Links policies:**

            1. Navigate to the [Microsoft Defender portal](https://security.microsoft.com).
            2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies**.
            3. Select **Safe Links**.
            4. Click **Create** to create a new policy.
            5. Configure the policy:
               - Name the policy and add a description.
               - Under **Users and domains**, add all users or specific groups.
               - Under **URL & click protection settings**, enable **On: Safe Links checks a list of known, malicious links when users click links in email**.
               - Enable **Apply Safe Links to email messages sent within the organization**.
               - Enable **Do not let users click through to the original URL**.
            6. Click **Submit** to save the policy.
        - id: powershell
          desc: |
            **Using Exchange Online PowerShell**

            Requires the ExchangeOnlineManagement module and an Exchange Administrator role.

            ```powershell
            Connect-ExchangeOnline

            # Create a Safe Links policy
            New-SafeLinksPolicy -Name "Organization Safe Links Policy" `
              -EnableSafeLinksForEmail $true `
              -EnableSafeLinksForTeams $true `
              -EnableSafeLinksForOffice $true `
              -TrackClicks $true `
              -AllowClickThrough $false

            # Create a Safe Links rule to apply the policy
            New-SafeLinksRule -Name "Organization Safe Links Rule" `
              -SafeLinksPolicy "Organization Safe Links Policy" `
              -RecipientDomainIs "example.com"
            ```
        # No Terraform remediation: Exchange Online Safe Links policies have no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/safe-links-about
        title: Safe Links in Microsoft Defender for Office 365
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/safe-links-policies-configure
        title: Set up Safe Links policies
  # No Terraform variants: Exchange Online Safe Attachments policies have no Terraform provider.
  - uid: mondoo-m365-security-ensure-safe-attachments-policies-configured
    title: Ensure Safe Attachments policies are configured
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-02
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-7
      compliance/nis-2: nis-2-21-2-g
      compliance/nist-csf-1: nist-csf-1-de-cm-4
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-5-4-1
      compliance/soc2-2017: soc2-control-cc6-8-4
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      ms365.exchangeonline.safeAttachmentPolicies.length > 0
    docs:
      desc: |
        This check verifies that email attachments are detonated in a sandbox before they reach a mailbox.

        Safe Attachments is the Microsoft Defender for Office 365 feature that opens each attachment in an isolated virtual environment and watches what it does, rather than comparing it against known signatures. Policies are created in the Microsoft Defender portal under **Email & collaboration > Policies & rules > Threat policies > Safe Attachments**, where the unknown malware response decides whether a suspicious file is blocked or the message body is delivered while scanning continues. A new tenant has none. This check requires at least one Safe Attachments policy to be configured.

        **Why this matters**

        Signature matching only recognizes malware somebody has already seen and catalogued. The payload aimed at your organization is usually not that. It is a document generated for this campaign, or an off-the-shelf loader repacked so its bytes match nothing on file, delivered inside an archive or a document that looks like an invoice, a resume, or a shipping notice.

        Behavioral detonation asks a different question. The file is opened in a disposable environment and observed: whether it spawns a scripting host, reaches out to a server on the internet, writes itself into a startup location, or begins encrypting the sample files around it. Those behaviors identify a payload that has never been catalogued, which is the whole population that matters.

        Stopping it at the mail layer is stopping it before the foothold exists. Once the file runs on a workstation the attacker has code execution inside the network, and everything after that is response rather than prevention.

        Extending the policy to SharePoint, OneDrive, and Teams covers files that arrive by upload rather than by mail, which is where the same payload goes when mail is filtered. Choose dynamic delivery if the scanning delay is disruptive, since it releases the message body immediately and attaches the file once it clears.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Defender portal at `https://security.microsoft.com`.
        2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Safe Attachments**.
        3. Review the configured Safe Attachments policies.

        A passing tenant has at least one Safe Attachments policy configured. A failing tenant has none.

        ### Audit via PowerShell

        1. Connect to Exchange Online and list Safe Attachments policies:

        ```powershell
        Connect-ExchangeOnline
        Get-SafeAttachmentPolicy
        ```

        A passing tenant returns at least one policy. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure Safe Attachments policies:**

            1. Navigate to the [Microsoft Defender portal](https://security.microsoft.com).
            2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies**.
            3. Select **Safe Attachments**.
            4. Click **Create** to create a new policy.
            5. Configure the policy:
               - Name the policy and add a description.
               - Under **Users and domains**, add all users or specific groups.
               - Under **Settings**, select **Block** as the Safe Attachments unknown malware response. Choose **Dynamic Delivery** instead if you want the message body delivered while attachments are scanned.
               - Under **Quarantine policy**, keep the default AdminOnlyAccessPolicy unless your review workflow requires otherwise.
            6. Click **Submit** to save the policy.
        - id: powershell
          desc: |
            **Using Exchange Online PowerShell**

            Requires the ExchangeOnlineManagement module and an Exchange Administrator role.

            ```powershell
            Connect-ExchangeOnline

            # Create a Safe Attachments policy
            New-SafeAttachmentPolicy -Name "Organization Safe Attachments Policy" `
              -Enable $true `
              -Action Block

            # Create a Safe Attachments rule to apply the policy
            New-SafeAttachmentRule -Name "Organization Safe Attachments Rule" `
              -SafeAttachmentPolicy "Organization Safe Attachments Policy" `
              -RecipientDomainIs "example.com"
            ```
        # No Terraform remediation: Exchange Online Safe Attachments policies have no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/safe-attachments-about
        title: Safe Attachments in Microsoft Defender for Office 365
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/safe-attachments-policies-configure
        title: Set up Safe Attachments policies
  # No Terraform variants: Exchange Online anti-phishing policies have no Terraform provider.
  - uid: mondoo-m365-security-ensure-anti-phishing-policies-enabled
    title: Ensure anti-phishing policies are enabled
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-02
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-security-awareness-training-and-tools-protection-from-malicious-software
      compliance/iso-27001-2022: iso-27001-2022-a-8-7
      compliance/nis-2: nis-2-21-2-g
      compliance/nist-csf-1: nist-csf-1-de-cm-4
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-5-4-1
      compliance/soc2-2017: soc2-control-cc6-8-4
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      ms365.exchangeonline.antiPhishPolicies.any(
        enabled == true &&
        enableMailboxIntelligence == true &&
        enableMailboxIntelligenceProtection == true &&
        enableSpoofIntelligence == true
      )
    docs:
      desc: |
        This check verifies that impersonation protection is enabled and actually configured to act.

        An anti-phishing policy in Microsoft Defender for Office 365 carries several distinct protections, and this check requires an enabled policy with three of them on: spoof intelligence, which analyzes sending infrastructure to identify mail falsely claiming a legitimate domain; mailbox intelligence, which learns each user's normal correspondents; and mailbox intelligence protection, which is what allows action to be taken on the result. You configure them in the Microsoft Defender portal under **Email & collaboration > Policies & rules > Threat policies > Anti-phishing**.

        **Why this matters**

        The messages that cause the largest losses carry no attachment and no link. They are short, plausible, and impersonate somebody the recipient knows. A note from the chief executive's display name asking for an urgent transfer. A message from a supplier's finance contact, on a domain one character different from theirs, attaching updated bank details. Nothing in the message is technically malicious, so content filtering has nothing to catch.

        What identifies these is relationship context. Mailbox intelligence knows this user has never corresponded with this sender, and that the display name matches an internal executive while the address does not. Spoof intelligence knows the sending infrastructure has no relationship with the domain being claimed. Together they flag a message that reads perfectly.

        Turning the detection on without setting the action is the common failure. The mailbox intelligence protection action defaults to taking no action, which produces the same outcome as leaving the protection off, so set it explicitly to quarantine or an equivalent disposition.

        Name the executives, finance staff, and frequently impersonated partner domains explicitly in the impersonation protection lists, since those are the identities attackers actually borrow, and enable first-contact safety tips so users see a warning when a sender is new to them.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Defender portal at `https://security.microsoft.com`.
        2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Anti-phishing**.
        3. Review the configured anti-phishing policies.

        A passing tenant has at least one anti-phishing policy configured. A failing tenant has none.

        ### Audit via PowerShell

        1. Connect to Exchange Online and list anti-phishing policies:

        ```powershell
        Connect-ExchangeOnline
        Get-AntiPhishPolicy
        ```

        A passing tenant returns at least one policy. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure anti-phishing policies:**

            1. Navigate to the [Microsoft Defender portal](https://security.microsoft.com).
            2. Go to **Email & collaboration** > **Policies & rules** > **Threat policies**.
            3. Select **Anti-phishing**.
            4. Click **Create** to create a new policy (or edit the default policy).
            5. Configure the policy:
               - Under **Users and domains**, add users and domains to protect.
               - Under **Phishing threshold & protection**, set the phishing email threshold.
               - Enable **User impersonation protection** and add high-value users (executives, finance).
               - Enable **Domain impersonation protection** and add trusted domains.
               - Enable **Mailbox intelligence** and **Intelligence for impersonation protection**.
            6. Configure actions for detected impersonation attempts (quarantine recommended).
            7. Click **Submit** to save the policy.
        - id: powershell
          desc: |
            **Using Exchange Online PowerShell**

            Requires the ExchangeOnlineManagement module and an Exchange Administrator role.

            ```powershell
            Connect-ExchangeOnline

            # Create an anti-phishing policy
            New-AntiPhishPolicy -Name "Organization Anti-Phishing Policy" `
              -EnableMailboxIntelligence $true `
              -EnableMailboxIntelligenceProtection $true `
              -MailboxIntelligenceProtectionAction Quarantine `
              -EnableSpoofIntelligence $true `
              -EnableFirstContactSafetyTips $true `
              -PhishThresholdLevel 2

            # Create an anti-phishing rule to apply the policy
            New-AntiPhishRule -Name "Organization Anti-Phishing Rule" `
              -AntiPhishPolicy "Organization Anti-Phishing Policy" `
              -RecipientDomainIs "example.com"
            ```

            `MailboxIntelligenceProtectionAction` defaults to `NoAction`, which has the same effect as leaving mailbox intelligence protection off. Set it explicitly so detected impersonation attempts are acted on.
        # No Terraform remediation: Exchange Online anti-phishing policies have no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/anti-phishing-policies-about
        title: Anti-phishing policies in Microsoft 365
      - url: https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/anti-phishing-policies-mdo-configure
        title: Configure anti-phishing policies
  # No Terraform variants: SharePoint Online tenant settings have no Terraform provider.
  - uid: mondoo-m365-security-ensure-sharepoint-external-sharing-restricted
    title: Ensure SharePoint external sharing is restricted
    filters: |
      asset.platform == "microsoft365"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      ms365.sharepointonline.tenantConfiguration.sharingCapability != "ExternalUserAndGuestSharing"
    docs:
      desc: |
        This check verifies that SharePoint and OneDrive do not permit anonymous sharing links.

        External sharing is set organization-wide in the SharePoint admin center under **Policies > Sharing**. The most permissive level, recorded as ExternalUserAndGuestSharing and shown in the console as anyone, allows users to generate links that grant access to a file or folder without the recipient signing in. This check requires the tenant to sit at a more restrictive level, such as new and existing guests, existing guests only, or organization members only.

        **Why this matters**

        An anyone link is a bearer credential in the form of a URL. Whoever holds it has the file, and possession is the entire authorization test. The recipient forwards it to a colleague, who forwards it to a personal address, and it comes to rest in a mailbox at another company or in a message thread that later gets exposed. Every copy still works, and nobody in your organization is aware any of it happened.

        For an attacker who has taken one ordinary account, this is the exfiltration route that requires no tooling. They generate anyone links for the document libraries the account can reach and retrieve the content later from an entirely unauthenticated session, which never touches your tenant as that user again.

        The access logs cannot help afterwards. They record that a link was used, not who used it, so an investigation can establish that a document left and not where it went or how widely.

        Restricting to authenticated guests keeps external collaboration working while tying every access to an identity you can enumerate, review, and revoke. New and existing guests is the usual balance point for organizations that genuinely need to share outside, and per-site overrides can tighten specific libraries further.
      audit: |
        ### Audit via Console

        1. Sign in to the SharePoint admin center at `https://admin.microsoft.com/sharepoint`.
        2. Go to **Policies** > **Sharing**.
        3. Review the **External sharing** setting for SharePoint and OneDrive.

        A passing tenant has external sharing set to a level more restrictive than **Anyone**, so sharing does not allow both external users and anonymous guest links. A failing tenant allows **Anyone** links.

        ### Audit via PowerShell

        1. Connect to SharePoint Online and read the tenant sharing capability:

        ```powershell
        Connect-SPOService -Url https://contoso-admin.sharepoint.com
        Get-SPOTenant | Select-Object SharingCapability
        ```

        A passing tenant returns a `SharingCapability` other than `ExternalUserAndGuestSharing`. A failing tenant returns `ExternalUserAndGuestSharing`.
      remediation:
        - id: console
          desc: |
            **To restrict SharePoint external sharing:**

            1. Navigate to the [SharePoint admin center](https://admin.microsoft.com/sharepoint).
            2. Go to **Policies** > **Sharing**.
            3. Under **External sharing**, adjust the SharePoint slider to a more restrictive level:
               - **New and existing guests**: Requires authentication but allows sharing with anyone who signs in.
               - **Existing guests**: Only allows sharing with guests already in your directory.
               - **Only people in your organization**: Disables external sharing entirely.
            4. Click **Save**.

            For most organizations, "New and existing guests" provides a good balance of collaboration and security.
        - id: powershell
          desc: |
            **Using SharePoint Online PowerShell**

            Requires the Microsoft.Online.SharePoint.PowerShell module and the SharePoint Administrator role.

            ```powershell
            Connect-SPOService -Url https://yourtenant-admin.sharepoint.com

            # Set sharing to "New and existing guests" (ExternalUserSharingOnly)
            Set-SPOTenant -SharingCapability ExternalUserSharingOnly

            # Or set to "Existing guests" only
            Set-SPOTenant -SharingCapability ExistingExternalUserSharingOnly

            # Or disable external sharing entirely
            Set-SPOTenant -SharingCapability Disabled
            ```
        # No Terraform remediation: SharePoint Online tenant settings have no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/sharepoint/turn-external-sharing-on-or-off
        title: Manage sharing settings for SharePoint and OneDrive
      - url: https://learn.microsoft.com/en-us/sharepoint/external-sharing-overview
        title: Overview of external sharing in SharePoint and OneDrive
  # No Terraform variants: Exchange Online transport rules have no Terraform provider.
  - uid: mondoo-m365-security-ensure-transport-rules-enforce-tls
    title: Ensure Exchange transport rules enforce TLS for external email
    filters: |
      asset.platform == "microsoft365"
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      ms365.exchangeonline.transportRules.any(state == "Enabled" && routeMessageOutboundRequireTls == true)
    docs:
      desc: |
        This check verifies that outbound mail leaving the organization is required to travel over an encrypted connection.

        Exchange Online negotiates TLS opportunistically by default, which means it uses encryption when the receiving server offers it and delivers in plain text when it does not. Making it mandatory takes a mail flow rule, created in the Exchange admin center under **Mail flow > Rules**, applying to recipients outside the organization with the action set to require TLS encryption. This check requires at least one enabled transport rule that enforces outbound TLS.

        **Why this matters**

        Opportunistic encryption is decided by the other end, and the other end can be influenced. An attacker positioned on the path, or one able to manipulate DNS or the SMTP negotiation, strips the offer of encryption from the exchange. Exchange Online, doing exactly what it was configured to do, falls back to plain text and delivers the message unencrypted. Nothing about that looks like an incident, because from the sender's side it is a normal delivery.

        The content is then readable to anyone who can observe the traffic between the two mail systems. That is contract drafts, personal data sent to a processor, invoices, and the password reset and account notification messages that flow out to staff and customers.

        Requiring TLS removes the fallback. When a receiving server cannot negotiate an encrypted session the message is not delivered at all, which converts a silent confidentiality failure into a visible delivery failure somebody can act on.

        That trade is real and needs planning. Once the rule is active, mail to any partner whose server cannot negotiate TLS bounces and the sender receives a non-delivery report. Scope the rule to specific sensitive senders or named recipient domains first, watch the non-delivery reports for a period, and widen it only once you know which correspondents would break.
      audit: |
        ### Audit via Console

        1. Sign in to the Exchange admin center at `https://admin.exchange.microsoft.com`.
        2. Go to **Mail flow** > **Rules**.
        3. Review the enabled rules for one that requires TLS on outbound messages.

        A passing tenant has at least one enabled transport rule that requires outbound TLS. A failing tenant has none.

        ### Audit via PowerShell

        1. Connect to Exchange Online and list transport rules:

        ```powershell
        Connect-ExchangeOnline
        Get-TransportRule | Where-Object { $_.State -eq "Enabled" -and $_.RouteMessageOutboundRequireTls }
        ```

        A passing tenant returns at least one enabled rule that requires outbound TLS. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To configure a transport rule requiring TLS:**

            1. Navigate to the [Exchange admin center](https://admin.exchange.microsoft.com).
            2. Go to **Mail flow** > **Rules**.
            3. Click **Add a rule** > **Create a new rule**.
            4. Name the rule, for example `Require TLS for outbound email`.
            5. Under **Apply this rule if**, select **The recipient is external/internal** > **Outside the organization**.
            6. Under **Do the following**, select **Modify the message security** > **Require TLS encryption**.
            7. Click **Save** and enable the rule.

            **WARNING:** With this rule in place, messages addressed to mail servers that cannot negotiate TLS are not delivered and the sender receives a non-delivery report. Consider scoping the rule to sensitive senders or specific recipient domains first, then monitor non-delivery reports before extending it to all outbound mail.
        - id: powershell
          desc: |
            **Using Exchange Online PowerShell**

            Requires the ExchangeOnlineManagement module and an Exchange Administrator role.

            ```powershell
            Connect-ExchangeOnline

            # Create a transport rule requiring TLS for outbound email
            New-TransportRule -Name "Require TLS for outbound email" `
              -SentToScope NotInOrganization `
              -RouteMessageOutboundRequireTls $true `
              -Priority 0
            ```

            **WARNING:** Messages to recipients whose mail servers cannot negotiate TLS will bounce once this rule is active. Scope the rule with conditions such as `-RecipientDomainIs` for a staged rollout if your organization exchanges mail with partners that may not support TLS.
        # No Terraform remediation: Exchange Online transport rules have no Terraform provider.
    refs:
      - url: https://learn.microsoft.com/en-us/exchange/security-and-compliance/mail-flow-rules/mail-flow-rules
        title: Mail flow rules in Exchange Online
      - url: https://learn.microsoft.com/en-us/purview/exchange-online-uses-tls-to-secure-email-connections
        title: How Exchange Online uses TLS
