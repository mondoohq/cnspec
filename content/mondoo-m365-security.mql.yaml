      - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-administrative-roles-bicep
        tags:
          mondoo.com/filter-title: Bicep
          mondoo.com/filter-icon: bicep
    docs:
      desc: |
        This check verifies that holding a privileged directory role requires a second factor at sign-in.

        Microsoft 365 creates no such requirement on its own. It is a Conditional Access policy, built in the Microsoft Entra admin center under **Protection > Conditional Access > Policies**, with the **Users** assignment targeting directory roles rather than individuals and **Grant** set to require multifactor authentication. Scoping by role rather than by name is the important part, because the policy then covers whoever holds the role next. This check requires an enabled policy of that shape. Provisioned as code, it is a conditional access policy resource whose user condition names the administrative role template identifiers.

        **Why this matters**

        An administrative account is not a bigger version of a user account, it is a different object. A Global Administrator can read any mailbox by granting itself access, reset any password, add a federated identity provider that mints tokens for any user, and register an application with permissions over the whole tenant. Compromise of one is compromise of everything, and there is no containment step afterwards.

        Attackers know which accounts these are, because directory role membership is readable by anyone signed in to the tenant. The path is a targeted phishing message to an administrator, a password, and nothing else in the way. Once inside they create a second privileged identity of their own so that resetting the original password changes nothing.

        Requiring a second factor means the stolen password stops being sufficient. The attacker has to defeat a device or a key in the administrator's possession, which is a materially harder problem than sending a convincing email.

        Cover the roles that can grant privilege or read data rather than only Global Administrator, exclude at least one emergency access account so a failed rollout cannot lock every administrator out, and start in report-only mode long enough to confirm in the sign-in logs that nobody legitimate would be blocked.
      audit: |
        ### Audit via Console

        1. Sign in to the Microsoft Entra admin center at `https://entra.microsoft.com`.
        2. Go to **Protection** > **Conditional Access** > **Policies**.
        3. Look for an enabled policy whose **Users** assignment targets administrative directory roles and whose **Grant** control requires multifactor authentication.

        A passing tenant has at least one enabled policy that requires MFA for administrators. A failing tenant has no such policy, or it is in **Report-only** or **Off** state.

        ### Audit via PowerShell

        1. Connect to Microsoft Graph and list Conditional Access policies:

        ```powershell
        Connect-MgGraph -Scopes "Policy.Read.All"
        Get-MgIdentityConditionalAccessPolicy |
          Where-Object { $_.State -eq "enabled" -and $_.Conditions.Users.IncludeRoles }
        ```

        A passing tenant returns at least one policy scoped to administrative roles. A failing tenant returns nothing.
      remediation:
        - id: console
          desc: |
            **To enable multifactor authentication for administrators:**

            1. Sign in to the Microsoft Entra admin center at https://entra.microsoft.com.
            2. Go to `Protection` > `Conditional Access` > `Policies`.
            3. Select `New policy`.
            4. Go to `Users` > `Include` > `Select users and groups` and check `Directory roles`. At a minimum, select the directory roles listed below.
            5. Under `Users` > `Exclude`, add at least one emergency access account so a failed MFA rollout cannot lock all administrators out of the tenant.
            6. Go to `Target resources` > `Cloud apps` > `Include` and select `All cloud apps`.
            7. Under `Access controls` > `Grant`, select `Grant access` and check `Require multifactor authentication`.
            8. Start the policy in `Report-only` mode, confirm in the sign-in logs that no administrator would be blocked, then set it to `On`.
            9. Select `Create`.

            **At minimum these directory roles should be included for MFA:**

            - Application administrator
            - Authentication administrator
            - Billing administrator
            - Cloud application administrator
            - Conditional Access administrator
            - Exchange administrator
            - Global administrator
            - Global reader
            - Helpdesk administrator
            - Password administrator
            - Privileged authentication administrator
            - Privileged role administrator
            - Security administrator
            - SharePoint administrator
            - User administrator
        - id: powershell
          desc: |
            **Using Microsoft Graph PowerShell**

            1. Connect to Microsoft Graph with the required scopes:

            ```powershell
            Connect-MgGraph -Scopes "Policy.ReadWrite.ConditionalAccess", "Policy.Read.All", "RoleManagement.Read.Directory"
            ```

            2. Get the role template IDs for administrative roles:

            ```powershell
            $adminRoles = @(
                "9b895d92-2cd3-44c7-9d02-a6ac2d5ea5c3",  # Application Administrator
                "c4e39bd9-1100-46d3-8c65-fb160da0071f",  # Authentication Administrator
                "b0f54661-2d74-4c50-afa3-1ec803f12efe",  # Billing Administrator
                "158c047a-c907-4556-b7ef-446551a6b5f7",  # Cloud Application Administrator
                "b1be1c3e-b65d-4f19-8427-f6fa0d97feb9",  # Conditional Access Administrator
                "29232cdf-9323-42fd-ade2-1d097af3e4de",  # Exchange Administrator
                "62e90394-69f5-4237-9190-012177145e10",  # Global Administrator
                "f2ef992c-3afb-46b9-b7cf-a126ee74c451",  # Global Reader
                "729827e3-9c14-49f7-bb1b-9608f156bbb8",  # Helpdesk Administrator
                "966707d0-3269-4727-9be2-8c3a10f19b9d",  # Password Administrator
                "7be44c8a-adaf-4e2a-84d6-ab2649e08a13",  # Privileged Authentication Administrator
                "e8611ab8-c189-46e8-94e1-60213ab1f814",  # Privileged Role Administrator
                "194ae4cb-b126-40b2-bd5b-6091b380977d",  # Security Administrator
                "f28a1f50-f6e7-4571-818b-6a12f2af6b6c",  # SharePoint Administrator
                "fe930be7-5e62-47db-91af-98c3a49a38b1"   # User Administrator
            )
            ```

            3. Create the Conditional Access policy. `clientAppTypes` is a required property of the conditions object, so the request fails without it. Exclude at least one emergency access account, and consider creating the policy with `state = "enabledForReportingButNotEnforced"` first to validate impact:

            ```powershell
            $params = @{
                displayName = "Require MFA for administrative roles"
                state = "enabled"
                conditions = @{
                    clientAppTypes = @("all")
                    users = @{
                        includeRoles = $adminRoles
                        excludeUsers = @("<breakglass-account-id>")  # Replace with your emergency access account
                    }
                    applications = @{
                        includeApplications = @("All")
                    }
                }
                grantControls = @{
                    operator = "OR"
                    builtInControls = @("mfa")
                }
            }
            New-MgIdentityConditionalAccessPolicy -BodyParameter $params
            ```
        - id: terraform
          desc: |
            **Using Terraform with the azuread provider**

            ```hcl
            data "azuread_directory_roles" "admin_roles" {
            }

            locals {
              admin_role_names = [
                "Application Administrator",
                "Authentication Administrator",
                "Billing Administrator",
                "Cloud Application Administrator",
                "Conditional Access Administrator",
                "Exchange Administrator",
                "Global Administrator",
                "Global Reader",
                "Helpdesk Administrator",
                "Password Administrator",
                "Privileged Authentication Administrator",
                "Privileged Role Administrator",
                "Security Administrator",
                "SharePoint Administrator",
                "User Administrator"
              ]
            }

            resource "azuread_conditional_access_policy" "admin_mfa" {
              display_name = "Require MFA for administrative roles"
              state        = "enabled"

              conditions {
                client_app_types = ["all"]
                users {
                  included_roles = [for role in data.azuread_directory_roles.admin_roles.roles : role.template_id if contains(local.admin_role_names, role.display_name)]
                  excluded_users = [azuread_user.breakglass.object_id]
                }
                applications {
                  included_applications = ["All"]
                }
              }

              grant_controls {
                operator          = "OR"
                built_in_controls = ["mfa"]
              }
            }
            ```

            For more details, see [azuread_conditional_access_policy](https://registry.terraform.io/providers/hashicorp/azuread/latest/docs/resources/conditional_access_policy) in the Terraform Registry.
