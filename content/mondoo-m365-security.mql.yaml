  - uid: mondoo-m365-security-ensure-multifactor-authentication-is-enabled-for-all-users-in-all-roles
    title: Ensure multi-factor authentication (MFA) is enabled for all users
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
