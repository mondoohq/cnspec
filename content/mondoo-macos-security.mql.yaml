  - uid: mondoo-macos-security-ensure-macos-is-up-to-date
    title: Ensure macOS is up to date
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      macos.softwareupdate.updates.where(recommended == true) == empty
    docs:
      desc: |
        This check verifies that the Mac has applied every update Apple currently recommends for it.

        The check reads the pending update list and requires that no recommended update remains outstanding. Where the other update checks in this policy confirm the machine is configured to find and fetch updates, this one confirms the result.

        **Why this matters**

        The other update checks in this policy confirm the machine is configured to find and fetch updates. This one confirms the result, which is the only part that affects whether the machine is actually exposed.

        The two can differ for ordinary reasons. Updates that require a restart wait for one, and a laptop that is only ever closed rather than restarted can carry a pending update for weeks. Low disk space, a deferral policy in the management platform, or a user repeatedly postponing the prompt all produce the same outcome: a machine correctly configured, aware of what it needs, and still unpatched.

        The exposure that creates is specific rather than general. Apple publishes what each update fixes at the moment it ships, so the release itself tells an attacker exactly which vulnerabilities work against machines that have not applied it. Proof-of-concept code for macOS vulnerabilities frequently appears within days.

        Where this fails, look for the reason rather than reapplying the setting. A pending restart, insufficient disk space, and a deferral window are the common causes, and each needs a different response.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Software Update**.
        3. Review whether any updates are listed as available.

        A passing result shows the system reporting that macOS is up to date. A failing result shows one or more pending updates.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. List available software updates:

           ```bash
           softwareupdate -l
           ```

        A passing result reports `No new software available`. A failing result lists one or more recommended updates.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to check for available updates:

            ```bash
            softwareupdate -l
            ```

            To install all available updates, run:

            ```bash
            sudo softwareupdate -i -a
            ```

            Updates that require a restart will prompt for one; add `-R` to restart automatically after installation.

            **Impact:**

            Updating macOS ensures that the system is protected against known vulnerabilities. However, updates may require a system restart and could temporarily disrupt workflows. Plan updates during maintenance windows to minimize impact.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Software Update**
            4. Select **Update Now**

            On macOS 12 and earlier, open **System Preferences**, select **Software Update**, and select **Update Now**.

            **Impact:**

            Updating macOS ensures that the system is protected against known vulnerabilities. However, updates may require a system restart and could temporarily disrupt workflows. Plan updates during maintenance windows to minimize impact.
        - id: ansible
          desc: |
            **Using Ansible**

            To check for available updates using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Check for available updates
              hosts: all
              become: true
              tasks:
                - name: Check for available updates
                  ansible.builtin.command: softwareupdate -l
            ```

            To install all available updates, run:

            ```yaml
            ---
            - name: Install all available updates
              hosts: all
              become: true
              tasks:
                - name: Install all available updates
                  ansible.builtin.command: softwareupdate -i -a
            ```

            **Impact:**

            Updating macOS ensures that the system is protected against known vulnerabilities. However, updates may require a system restart and could temporarily disrupt workflows. Plan updates during maintenance windows to minimize impact.
