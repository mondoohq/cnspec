      - url: https://support.apple.com/guide/mac-help/keep-your-mac-up-to-date-mchlpx1065/mac
        title: Apple - Keep Your Mac Up to Date
  - uid: mondoo-macos-security-firewall-block-all-incoming
    title: Ensure macOS firewall blocks all incoming connections
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      macos.firewall.blockAllIncoming == true
    docs:
      desc: |
        This check verifies that the macOS firewall is set to block all incoming connections.

        This is the strictest firewall mode. It refuses inbound connections to every application except the small set of services the system requires for basic network operation, rather than deciding application by application. The check reads `macos.firewall.blockAllIncoming`, which must be `true`.

        **Why this matters**

        The default per-application model depends on someone answering the prompt correctly each time a new program asks to accept connections. Users answer those prompts while trying to do something else, and the answer that makes the interruption stop is to allow it. Over the life of a machine the allowed list accumulates entries nobody would approve deliberately.

        Blocking all incoming removes the decision. Nothing accepts inbound connections regardless of what is installed, what was allowed previously, or what a user clicked, which means a development server left running, a collaboration tool's helper daemon, and a listener installed by malware are all equally unreachable from the network.

        This suits a workstation because a workstation initiates connections rather than receiving them. Browsing, mail, chat, and conferencing all work normally, since outbound connections and their replies are unaffected.

        Machines that genuinely must accept inbound connections, such as a developer running a service others test against, need the per-application mode instead. That is a deliberate exception rather than the default posture.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **Network**, then **Firewall**.
        3. Select **Options** and review **Block all incoming connections**.

        A passing result shows **Block all incoming connections** turned on. A failing result shows it turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the firewall block-all setting:

           ```bash
           /usr/libexec/ApplicationFirewall/socketfilterfw --getblockall
           ```

        A passing result reports `Firewall has block all state set to enabled.` A failing result reports `Firewall has block all state set to disabled.`
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to block all incoming connections:

            ```bash
            sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setblockall on
            ```

            **Impact:**

            Blocking all incoming connections will prevent any application from receiving inbound network traffic, except for essential system services like DHCP and Bonjour. This may disrupt services that rely on incoming connections, such as file sharing, screen sharing, or remote management. Ensure this setting is appropriate for the device's role before enabling.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **Network**
            3. Select **Firewall**
            4. Select **Options**
            5. Enable **Block all incoming connections**

            **Impact:**

            Blocking all incoming connections will prevent any application from receiving inbound network traffic, except for essential system services like DHCP and Bonjour. This may disrupt services that rely on incoming connections, such as file sharing, screen sharing, or remote management. Ensure this setting is appropriate for the device's role before enabling.
        - id: ansible
          desc: |
            **Using Ansible**

            To block all incoming connections using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Block all incoming firewall connections
              hosts: all
              become: true
              tasks:
                - name: Block all incoming connections
                  ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --setblockall on
            ```

            **Impact:**

            Blocking all incoming connections will prevent any application from receiving inbound network traffic, except for essential system services like DHCP and Bonjour. This may disrupt services that rely on incoming connections, such as file sharing, screen sharing, or remote management. Ensure this setting is appropriate for the device's role before enabling, especially when applying it to many machines at once.
    refs:
      - url: https://support.apple.com/guide/mac-help/block-connections-to-your-mac-with-a-firewall-mh34041/mac
        title: Apple - Block Connections with Firewall
