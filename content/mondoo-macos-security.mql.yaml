  - uid: mondoo-macos-security-disable-remote-login
    title: Disable Remote Login
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.systemsetup.remoteLogin == "Off"
    docs:
      desc: |
        This check verifies that Remote Login, the macOS control for the SSH server, is turned off.

        When Remote Login is on, `sshd` listens on the network and accounts on the Mac can be used to open a remote shell. The check reads `macos.systemsetup.remoteLogin`, which must be `Off`.

        **Why this matters**

        Turning this on gives a workstation a network-facing interactive login path, which is the single most valuable thing an attacker can find on a machine. It accepts password authentication by default, so every account on the Mac becomes a guessing target, and the accounts on a Mac are usually protected by a password a person chose rather than by a key.

        The exposure travels with the machine. A laptop with Remote Login enabled listens on every network it joins, and on a café or hotel network the other occupants of that network are strangers. Internet-wide scanning finds exposed SSH within minutes of it becoming reachable.

        Workstations are also not managed like servers. The SSH configuration on a Mac is whatever Apple shipped, without the hardening applied elsewhere in an estate.

        Where remote access to a workstation is genuinely required, enable it deliberately, restrict it to specific accounts, require key authentication, and confine it to a management network rather than leaving it listening everywhere.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Remote Login** setting.

        A passing result shows **Remote Login** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the Remote Login status:

           ```bash
           sudo systemsetup -getremotelogin
           ```

        A passing result returns `Remote Login: Off`. A failing result returns `Remote Login: On`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Remote Login:

            ```bash
            sudo systemsetup -f -setremotelogin off
            ```

            The `-f` flag suppresses the interactive confirmation prompt. On macOS 13 and later, the terminal application running this command must be granted Full Disk Access in System Settings under Privacy & Security.

            **Warning:**

            Disabling Remote Login immediately ends SSH access to this machine. If you are connected over SSH or manage this system remotely, you will lose access and must use the local console or another remote management channel to get back in. Confirm an alternative access path exists before running this command.

            **Impact:**

            Disabling Remote Login prevents the use of the SSH server on macOS. For systems requiring SSH access, ensure proper hardening measures are in place, such as restricting access to trusted IP addresses and using secure authentication methods. Standard user computers should not act as servers, especially in environments where they frequently change locations or IP addresses.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Remote Login**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Remote Login**.

            **Impact:**

            Disabling Remote Login prevents the use of the SSH server on macOS. For systems requiring SSH access, ensure proper hardening measures are in place, such as restricting access to trusted IP addresses and using secure authentication methods. Standard user computers should not act as servers, especially in environments where they frequently change locations or IP addresses.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Remote Login using Ansible, you can use the following playbook. The `-f` flag is required so the command does not wait for interactive confirmation:

            ```yaml
            ---
            - name: Disable Remote Login
              hosts: all
              become: true
              tasks:
                - name: Disable Remote Login
                  ansible.builtin.command: systemsetup -f -setremotelogin off
            ```

            **Warning:**

            If Ansible reaches this host over SSH, this task disconnects it and all subsequent tasks fail. Run it last, and confirm console or MDM access exists before applying.

            **Impact:**

            Disabling Remote Login prevents the use of the SSH server on macOS. For systems requiring SSH access, ensure proper hardening measures are in place, such as restricting access to trusted IP addresses and using secure authentication methods.
    refs:
      - url: https://support.apple.com/guide/mac-help/allow-a-remote-computer-to-access-your-mac-mchlp1066/mac
        title: Apple - Remote Access Settings
  - uid: mondoo-macos-security-disable-remote-management
    title: Disable Remote Management
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.remoteManagement == false
    docs:
      desc: |
        This check verifies that Remote Management is turned off.

        Remote Management is the Apple Remote Desktop agent. It gives an operator on the network screen viewing and control, file copy in both directions, command execution, and the ability to observe the user. The check reads `macos.sharing.remoteManagement`, which must be `false`.

        **Why this matters**

        This is the most capable remote access service macOS offers, and the capability list is the risk. An attacker who reaches it does not need to escalate or move laterally to accomplish anything: they already have the screen, the keyboard, the filesystem, and command execution as the logged-in user.

        The observation mode deserves particular attention, because it can be configured to watch without displaying any indicator to the person using the machine. Someone whose Mac is being viewed has no way to tell.

        The agent has also had authentication vulnerabilities allowing access without valid credentials, and it listens on well-known ports that scanning tools check for by default.

        Where an organization uses Apple Remote Desktop for legitimate management, that deployment should be scoped to a management network, restricted to named administrator accounts rather than allowing all users, and configured so the user is informed when their screen is observed. On machines outside that program, the agent should be off.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Remote Management** setting.

        A passing result shows **Remote Management** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Check whether the Apple Remote Desktop agent is running:

           ```bash
           ps -axc | grep ARDAgent
           ```

        A passing result returns no output, confirming the agent is not running. A failing result lists `ARDAgent`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Remote Management:

            ```bash
            sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop
            ```

            **Impact:**

            Disabling Remote Management may affect organizations that rely on Apple Remote Desktop for client management. Ensure alternative management solutions are in place if required.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Remote Management**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Remote Management**.

            **Impact:**

            Disabling Remote Management may affect organizations that rely on Apple Remote Desktop for client management. Ensure alternative management solutions are in place if required.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Remote Management using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Remote Management
              hosts: all
              become: true
              tasks:
                - name: Disable Remote Management
                  ansible.builtin.command: /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop
            ```

            **Impact:**

            Disabling Remote Management may affect organizations that rely on Apple Remote Desktop for client management. Ensure alternative management solutions are in place if required.
    refs:
      - url: https://support.apple.com/guide/mac-help/allow-a-remote-computer-to-access-your-mac-mchlp1066/mac
        title: Apple - Remote Access Settings
  - uid: mondoo-macos-security-disable-screen-sharing
    title: Disable Screen Sharing
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.screenSharing == false
    docs:
      desc: |
        This check verifies that Screen Sharing is turned off.

        Screen Sharing is the macOS VNC server. It lets a remote user see the display and control the keyboard and mouse. The check reads `macos.sharing.screenSharing`, which must be `false`.

        **Why this matters**

        Screen control is equivalent to sitting at the machine. Anyone who reaches the service and authenticates has the user's session, their applications, their unlocked password manager and browser sessions, and their access to everything the organization has granted them. Nothing further has to be exploited.

        The service is protected by a password, which makes it a guessing target, and VNC on the standard port is one of the things internet-wide scanners look for continuously. On a laptop the listener follows the machine onto every network it joins.

        Screen sharing also exposes whatever is on the display at the time, which on a workstation is frequently more sensitive than what is on disk: an open mail client, a customer record, an authenticated administrative console.

        Where screen sharing is needed for support, use a tool that requires the user to approve each session and that records it, rather than a service that listens continuously.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Screen Sharing** setting.

        A passing result shows **Screen Sharing** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Check whether the screen sharing daemon is loaded:

           ```bash
           sudo launchctl list | grep com.apple.screensharing
           ```

        A passing result returns no output, confirming the service is not loaded. A failing result lists `com.apple.screensharing`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run these commands to disable Screen Sharing:

            ```bash
            sudo launchctl disable system/com.apple.screensharing
            sudo launchctl bootout system/com.apple.screensharing
            ```

            The `disable` command marks the daemon disabled so it does not start again, and `bootout` stops it now. The `bootout` command reports an error if the service is not currently running; that error is harmless. On older macOS versions you can use the legacy form `sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.screensharing.plist`.

            **Impact:**

            Disabling Screen Sharing prevents remote access to the system's screen. For environments requiring remote support, ensure alternative secure methods are in place, such as using dedicated remote management tools with proper access controls.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Screen Sharing**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Screen Sharing**.

            **Impact:**

            Disabling Screen Sharing prevents remote access to the system's screen. For environments requiring remote support, ensure alternative secure methods are in place, such as using dedicated remote management tools with proper access controls.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Screen Sharing using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Screen Sharing
              hosts: all
              become: true
              tasks:
                - name: Disable the Screen Sharing daemon
                  ansible.builtin.command: launchctl disable system/com.apple.screensharing
                - name: Stop the Screen Sharing daemon
                  ansible.builtin.command: launchctl bootout system/com.apple.screensharing
                  register: bootout_result
                  failed_when: false
                  changed_when: bootout_result.rc == 0
            ```

            The `bootout` task exits non-zero harmlessly when the daemon is not running; that failure is suppressed with `failed_when: false`, and `changed` is reported only when it actually stops the service. The `disable` task runs `launchctl` through `ansible.builtin.command`, which always reports `changed` even when the daemon is already disabled, so this playbook is not fully idempotent.

            **Impact:**

            Disabling Screen Sharing prevents remote access to the system's screen. For environments requiring remote support, ensure alternative secure methods are in place, such as using dedicated remote management tools with proper access controls.
    refs:
      - url: https://support.apple.com/guide/mac-help/allow-a-remote-computer-to-access-your-mac-mchlp1066/mac
        title: Apple - Remote Access Settings
  - uid: mondoo-macos-security-do-not-enable-the-root-account
    title: Do not enable the "root" account
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      command("dscl . -read /Users/root AuthenticationAuthority").stderr.contains("No such key: AuthenticationAuthority")
    docs:
      desc: |
        This check verifies that the `root` account is disabled.

        macOS ships with `root` disabled, and administrative work is done through `sudo` from an administrator account. Running `dsenableroot` restores a directly usable superuser login. The check reads the account's authentication authority through `dscl`, which must report no such key.

        **Why this matters**

        An enabled `root` account is a credential shared by everyone who knows it, and shared credentials cannot be attributed. Once several administrators know the password, an action taken as `root` cannot be traced to a person, so neither an investigation nor a routine review can establish who did what.

        It is also a credential that is never rotated. Unlike a user account it is not tied to anyone's employment, so it survives people leaving and outlives the reason it was enabled in the first place.

        The account name is the one an attacker never has to discover, which makes it the default target for guessing, and a successful guess yields complete control with no escalation step.

        `sudo` provides the same capability while authenticating each administrator with their own password, logging the specific command, and allowing access to be revoked per person. Keep `root` disabled.
      audit: |
        Verify that the root account is disabled from the macOS shell.

        1. Open the **Terminal** app.
        2. Query the root account's authentication authority:

           ```bash
           dscl . -read /Users/root AuthenticationAuthority
           ```

        A passing result reports `No such key: AuthenticationAuthority`, confirming the root account is disabled. A failing result returns an `AuthenticationAuthority` value, indicating the root account is enabled.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable the root account:

            ```bash
            sudo dsenableroot -d
            ```

            The command prompts for an administrator account password before disabling root.

            **Impact:**

            Disabling the root account may affect legacy POSIX software that expects an available root account. Ensure alternative administrative methods are in place if required.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **/System/Library/CoreServices/Applications/Directory Utility**
            2. Select the lock icon to unlock the service
            3. Select **Edit**
            4. Select **Disable Root User**

            **Impact:**

            Disabling the root account may affect legacy POSIX software that expects an available root account. Ensure alternative administrative methods are in place if required.
        - id: ansible
          desc: |
            **Using Ansible**

            The `dsenableroot -d` command prompts interactively for an administrator password, so a plain command task hangs. Use the expect module and supply credentials from Ansible Vault:

            ```yaml
            ---
            - name: Disable root account
              hosts: all
              become: true
              tasks:
                - name: Disable root account
                  ansible.builtin.expect:
                    command: dsenableroot -d -u "{{ macos_admin_user }}"
                    responses:
                      'password:': "{{ macos_admin_password }}"
                  no_log: true
            ```

            Store `macos_admin_user` and `macos_admin_password` in Ansible Vault and never in plain text.

            **Impact:**

            Disabling the root account may affect legacy POSIX software that expects an available root account. Ensure alternative administrative methods are in place if required.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-enable-filevault
    title: Enable FileVault
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      macos.filevault.enabled == true
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath = "/Library/Managed Preferences/" + name + "/complete.plist"
        a = file(filePath).exists == true && [filePath].where(file(_).exists) {
            parse.plist(filePath).params["com.apple.MCX"]["dontAllowFDEDisable"]["value"] == true
          }
        filePath2 = "/Library/Managed Preferences/com.apple.MCX.plist"
        b = file(filePath2).exists && parse.plist(filePath2).params['dontAllowFDEDisable'] == true
        a || b
      }
    docs:
      desc: |-
        This check verifies that FileVault full-disk encryption is enabled.

        FileVault encrypts the contents of the internal drive at rest, so they are readable only after someone authenticates at startup. The check reads `macos.filevault.enabled`, which must be `true`, and confirms that the managed preference enforcing it is applied for each non-system user account.

        **Why this matters**

        Without FileVault, the account password protects nothing about the data. An attacker with the machine in hand removes the drive, or boots the Mac from an external volume or into recovery mode, and reads the entire filesystem without ever encountering a login prompt. Nothing about the operating system's access controls applies when the operating system is not the one running.

        Laptops are lost and stolen routinely, and the value on them is not the hardware. A workstation drive holds cached mail, documents, saved credentials, source code, browser session tokens, and SSH and cloud keys that are live and will keep working after the machine is gone.

        The consequences also extend past the device. Most data breach notification regimes treat the loss of an encrypted device very differently from an unencrypted one, so encryption changes an incident that must be disclosed into one that generally does not.

        Escrow the recovery key through your management platform when enabling FileVault. Encryption without a recoverable key turns a forgotten password into permanent data loss.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **Privacy & Security**.
        3. Review the **FileVault** section.

        A passing result shows FileVault turned on for the startup disk. A failing result shows FileVault turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the FileVault status:

           ```bash
           fdesetup status
           ```

        A passing result returns `FileVault is On`. A failing result returns `FileVault is Off`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable FileVault:

            ```bash
            sudo fdesetup enable
            ```

            You will be prompted to provide a password for the user account and will receive a recovery key. Store the recovery key securely, as it will be required to unlock the disk if the password is forgotten.

            Note: To pass this check and make sure encryption cannot be turned off by the system, you need to [make sure that the Device Management Profile property `dontAllowFDEDisable` is set to 'true'.](https://developer.apple.com/documentation/devicemanagement/fdefilevaultoptions). To do so you can use an macOS configuration profile [similar to this one.](https://github.com/gregneagle/profiles/blob/master/cant_disable_filevault.mobileconfig)

            **Impact:**

            Enabling FileVault may impact system performance during encryption and decryption processes. However, the security benefits of full-disk encryption outweigh the potential performance impact, especially for devices handling sensitive data.
        - id: gui
          desc: |
            **Using the GUI**

            Perform the following to enable FileVault:

            1. Open **System Settings**
            2. Select **Privacy & Security**
            3. Select **FileVault**
            4. Select **Turn On**

            On macOS 12 and earlier, open **System Preferences**, select **Security & Privacy**, select **FileVault**, and select **Turn On FileVault**.

            Record the recovery key shown during setup and store it securely. The recovery key is required to unlock the disk if every enabled account password is forgotten.

            Note: To pass this check and ensure users cannot turn encryption off, the Device Management profile property [`dontAllowFDEDisable` must be set to true](https://developer.apple.com/documentation/devicemanagement/fdefilevaultoptions). You can deploy a macOS configuration profile [similar to this one](https://github.com/gregneagle/profiles/blob/master/cant_disable_filevault.mobileconfig).

            **Impact:**

            Enabling FileVault may impact system performance during encryption and decryption processes. However, the security benefits of full-disk encryption outweigh the potential performance impact, especially for devices handling sensitive data.
        - id: ansible
          desc: |
            **Using Ansible**

            A bare `fdesetup enable` prompts for a password and cannot run unattended. Use deferred enablement, which activates FileVault at the user's next logout:

            ```yaml
            ---
            - name: Configure deferred FileVault enablement
              hosts: all
              become: true
              tasks:
                - name: Enable FileVault at next logout
                  ansible.builtin.command: fdesetup enable -defer /var/db/filevault-recovery.plist
            ```

            The recovery key is not generated when this task runs. `fdesetup` writes the property list only once the designated user supplies their password at logout, which is why collecting it is a second pass rather than the next task in the same play. Run the following play after the users have logged out:

            ```yaml
            ---
            - name: Escrow the FileVault recovery key
              hosts: all
              become: true
              tasks:
                - name: Check whether the user has completed enablement
                  ansible.builtin.stat:
                    path: /var/db/filevault-recovery.plist
                  register: filevault_recovery
                - name: Fetch the recovery key for escrow
                  ansible.builtin.fetch:
                    src: /var/db/filevault-recovery.plist
                    dest: filevault-keys/
                  when: filevault_recovery.stat.exists
                - name: Remove the local recovery key copy
                  ansible.builtin.file:
                    path: /var/db/filevault-recovery.plist
                    state: absent
                  when: filevault_recovery.stat.exists
            ```

            The `stat` guard matters in both directions: without it the fetch fails on every host whose user has not logged out yet, and the removal task deletes the escrow file on a host where the fetch never ran. Store the fetched recovery keys in a secure escrow location. If the recovery key is lost and a user forgets their password, the encrypted data cannot be recovered. In MDM-managed fleets, prefer enabling FileVault through an MDM profile with institutional key escrow instead.

            Note: To pass this check and ensure users cannot turn encryption off, the Device Management profile property [`dontAllowFDEDisable` must be set to true](https://developer.apple.com/documentation/devicemanagement/fdefilevaultoptions).

            **Impact:**

            Enabling FileVault may impact system performance during encryption and decryption processes. However, the security benefits of full-disk encryption outweigh the potential performance impact, especially for devices handling sensitive data.
    refs:
      - url: https://support.apple.com/guide/mac-help/protect-data-on-your-mac-with-filevault-mh11785/mac
        title: Apple - Protect Data with FileVault
  - uid: mondoo-macos-security-enable-firewall
    title: Enable Firewall
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: macos.firewall.enabled == true
    docs:
      desc: |
        This check verifies that the macOS application firewall is enabled.

        The application firewall controls which programs may accept incoming network connections, deciding per application rather than per port. It is off by default on macOS. The check reads `macos.firewall.enabled`, which must be `true`.

        **Why this matters**

        The firewall is off by default on macOS, so an unmanaged Mac accepts inbound connections to anything that listens. Workstations listen for more than their users realize: sharing services, collaboration and conferencing tools, development servers started for a local test and never stopped, and helper daemons installed alongside ordinary applications.

        None of that is a problem on a trusted network with a perimeter. It becomes one the moment the laptop joins a network where the other devices are strangers, which for a mobile workstation is most of them. A development server bound to all interfaces and left running is directly reachable by everyone in the café.

        The per-application model is what makes the control practical. Rather than requiring the user to know which ports their software needs, the firewall prompts when a new program first tries to accept connections and remembers the answer.

        Enable the firewall, and pair it with stealth mode and a block-all-incoming policy where the machine's role allows.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **Network**, then **Firewall**.
        3. Review the firewall toggle.

        A passing result shows the firewall turned on. A failing result shows it turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the global firewall state:

           ```bash
           /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
           ```

        A passing result reports `Firewall is enabled`. A failing result reports `Firewall is disabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable the firewall:

            ```bash
            sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
            ```

            **Impact:**

            Enabling the firewall may block legitimate traffic. Unsigned applications may require special handling to function properly.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **Network**
            3. Select **Firewall**
            4. Turn on the **Firewall** toggle

            On macOS 12 and earlier, open **System Preferences**, select **Security & Privacy**, select **Firewall**, and select **Turn On Firewall**.

            **Impact:**

            Enabling the firewall may block legitimate traffic. Unsigned applications may require special handling to function properly.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable the firewall using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Enable Firewall
              hosts: all
              become: true
              tasks:
                - name: Enable Firewall
                  ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
            ```

            **Impact:**

            Enabling the firewall may block legitimate traffic. Unsigned applications may require special handling to function properly.
    refs:
      - url: https://support.apple.com/guide/mac-help/change-firewall-settings-on-mac-mh11783/mac
        title: Apple - Firewall Settings
  - uid: mondoo-macos-security-enable-firewall-stealth-mode
    title: Enable Firewall Stealth Mode
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: macos.firewall.stealthEnabled == true
    docs:
      desc: |-
        This check verifies that firewall stealth mode is enabled.

        Stealth mode makes the Mac ignore probes it would otherwise answer, including ICMP echo requests and connection attempts to ports where nothing is listening, so the machine stops confirming its own existence to unsolicited traffic. The check reads `macos.firewall.stealthEnabled`, which must be `true`.

        **Why this matters**

        Without stealth mode, a Mac answers a ping and returns a reset for closed ports. Both replies confirm that a host is at that address, which is exactly what a scanner is looking for.

        That confirmation is the first step of every attack against the machine. On a shared network an attacker enumerates what is present before deciding what to attempt, and a host that responds moves onto the list while a host that stays silent is frequently skipped, because scanning tools have a whole subnet to work through and no reason to spend time on an address that appears empty.

        Stealth mode does not make the machine invisible. Services that are deliberately listening still answer, and a determined attacker who already knows the address can establish that something is there. What it removes is the cheap, passive discovery that decides who gets targeted in the first place.

        Some network monitoring relies on hosts answering pings. Where that applies, allow the monitoring source explicitly rather than turning stealth mode off.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **Network**, then **Firewall**.
        3. Select **Options** and review **Enable stealth mode**.

        A passing result shows **Enable stealth mode** turned on. A failing result shows it turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the firewall stealth mode setting:

           ```bash
           /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode
           ```

        A passing result reports `Firewall stealth mode is on`. A failing result reports `Firewall stealth mode is off`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable Stealth Mode:

            ```bash
            sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
            ```

            **Impact:**

            Enabling Stealth Mode may prevent traditional network discovery tools like ping from succeeding. However, approved applications and other network tools will function as expected. This setting is particularly useful for laptops frequently connected to untrusted networks, but it may not be necessary for devices on trusted LANs with static IP addresses.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **Network**
            3. Select **Firewall**
            4. Select **Options**
            5. Turn on **Enable stealth mode**

            On macOS 12 and earlier, open **System Preferences**, select **Security & Privacy**, select **Firewall Options**, and turn on **Enable stealth mode**.

            **Impact:**

            Enabling Stealth Mode may prevent traditional network discovery tools like ping from succeeding. However, approved applications and other network tools will function as expected. This setting is particularly useful for laptops frequently connected to untrusted networks, but it may not be necessary for devices on trusted LANs with static IP addresses.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable Stealth Mode using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Enable Firewall Stealth Mode
              hosts: all
              become: true
              tasks:
                - name: Enable Firewall Stealth Mode
                  ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
            ```

            **Impact:**

            Enabling Stealth Mode may prevent traditional network discovery tools like ping from succeeding. However, approved applications and other network tools will function as expected. This setting is particularly useful for laptops frequently connected to untrusted networks, but it may not be necessary for devices on trusted LANs with static IP addresses.
    refs:
      - url: https://support.apple.com/guide/mac-help/change-firewall-settings-on-mac-mh11783/mac
        title: Apple - Firewall Settings
  - uid: mondoo-macos-security-enable-gatekeeper
    title: Enable Gatekeeper
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-11
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-9
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      macos.gatekeeper.enabled == true
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath1 = "/Library/Managed Preferences/" + name + "/complete.plist"
        a = file(filePath1).exists == true && [filePath1].where(file(_).exists) {
          parse.plist(filePath1).params["com.apple.systempolicy.control"]["AllowIdentifiedDevelopers"]["value"] == true
          parse.plist(filePath1).params["com.apple.systempolicy.control"]["EnableAssessment"]["value"] == true
        }
        filePath2 = "/Library/Managed Preferences/com.apple.systempolicy.control.plist"
        b = file(filePath2).exists == true && [filePath2].where(file(_).exists) {
          parse.plist(filePath2).params["AllowIdentifiedDevelopers"] == true
          parse.plist(filePath2).params["EnableAssessment"] == true
        }
        a || b
      }
    docs:
      desc: |
        This check verifies that Gatekeeper is enforcing.

        Gatekeeper checks an application's signature and notarization status before allowing it to run for the first time, blocking software that is unsigned or that Apple has not scanned. The check reads `macos.gatekeeper.enabled`, which must be `true`, and confirms that the managed preference enforcing it is applied for each non-system user account.

        **Why this matters**

        Gatekeeper is the main barrier between a user downloading something and that thing running. It verifies the application was signed by an identified developer and that Apple's notarization service scanned it for known malware, and it refuses to launch what fails either test.

        Turning it off removes that check for everything, permanently, on the basis of one decision made once. macOS malware is overwhelmingly delivered as an application the user was persuaded to download, frequently a cracked commercial tool or a fake installer or update, and Gatekeeper is what stops the majority of it at the point of launch.

        Notarization also provides revocation. If a signing certificate is later found to have been used for malware, Apple can revoke it and machines with Gatekeeper enabled stop running software signed with it, including copies already downloaded.

        Where a specific unsigned internal tool must run, approve that application individually rather than disabling Gatekeeper for the system.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **Privacy & Security**.
        3. Review the **Allow applications downloaded from** setting.

        A passing result shows **App Store and identified developers** selected. A failing result shows **Anywhere** or that Gatekeeper is otherwise disabled.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the Gatekeeper assessment status:

           ```bash
           spctl --status
           ```

        A passing result returns `assessments enabled`. A failing result returns `assessments disabled`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable Gatekeeper assessments:

            ```bash
            sudo spctl --global-enable
            ```

            On older macOS versions the equivalent command is `sudo spctl --master-enable`. Starting with macOS Sequoia, Apple restricts command-line changes to Gatekeeper policy; if the command reports the operation is not permitted, enforce the setting with a configuration profile instead.

            Note: To pass this check, you must also deploy a Device Management configuration profile with the [`com.apple.systempolicy.control`](https://developer.apple.com/documentation/devicemanagement/systempolicycontrol) payload that sets `EnableAssessment` to true and `AllowIdentifiedDevelopers` to true. Without that managed preference the check fails even when `spctl --status` reports assessments enabled.

            **Impact:**

            Enabling Gatekeeper may block applications from unverified sources. Ensure that any required applications are properly signed or explicitly allowed by the user.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **Privacy & Security**
            3. Under **Security**, set **Allow applications downloaded from** to **App Store and identified developers**

            On macOS 12 and earlier, open **System Preferences**, select **Security & Privacy**, select **General**, and set **Allow apps downloaded from** to **App Store and identified developers**.

            Note: To pass this check, you must also deploy a Device Management configuration profile with the [`com.apple.systempolicy.control`](https://developer.apple.com/documentation/devicemanagement/systempolicycontrol) payload that sets `EnableAssessment` to true and `AllowIdentifiedDevelopers` to true.

            **Impact:**

            Enabling Gatekeeper may block applications from unverified sources. Ensure that any required applications are properly signed or explicitly allowed by the user.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable Gatekeeper using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Enable Gatekeeper
              hosts: all
              become: true
              tasks:
                - name: Enable Gatekeeper assessments
                  ansible.builtin.command: spctl --global-enable
            ```

            On macOS versions that restrict `spctl` policy changes, deploy a Device Management configuration profile with the `com.apple.systempolicy.control` payload instead. That profile is also required for this check to pass.

            **Impact:**

            Enabling Gatekeeper may block applications from unverified sources. Ensure that any required applications are properly signed or explicitly allowed by the user.
    refs:
      - url: https://support.apple.com/guide/security/gatekeeper-and-runtime-protection-sec5599b66df/web
        title: Apple Platform Security - Gatekeeper
  - uid: mondoo-macos-security-enable-security-auditing
    title: Enable security auditing
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      service('com.apple.auditd').enabled == true
    docs:
      desc: |
        This check verifies that macOS security auditing is running.

        The auditing subsystem records security-relevant events at the system level, including authentication, privilege use, and administrative actions, writing them to the audit trail in `/var/audit`. The check reads the `com.apple.auditd` service, which must be enabled.

        **Why this matters**

        The unified log records what applications chose to report and rolls over quickly. The audit trail is the separate, structured record of security events, and it is the one that answers who authenticated, when privilege was used, and what administrative changes were made.

        Without it those questions have no answer. An investigation into a compromised Mac can describe the state the machine is in but not how it got there, which is the part that determines whether credentials need rotating, whether other machines are affected, and whether the way in is still open.

        Auditing has to be running before the event, not after. There is no way to reconstruct activity that was never recorded, so a service that is disabled at the moment it matters is equivalent to never having had it.

        Forward the audit trail off the machine where the environment allows. Records held only on the Mac are editable by anyone who obtains administrative access to it.
      audit: |
        Verify that the audit daemon is enabled from the macOS shell.

        1. Open the **Terminal** app.
        2. Check whether the `auditd` daemon is loaded:

           ```bash
           sudo launchctl list | grep com.apple.auditd
           ```

        A passing result lists `com.apple.auditd`, confirming the audit service is loaded. A failing result returns no output.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            On macOS 14 and later the audit subsystem is disabled by default and no `/etc/security/audit_control` is installed, so clearing the launchd override on its own leaves `auditd` unable to start. Provision the configuration file from the template Apple ships, clear the override, then restart:

            ```bash
            sudo cp -n /etc/security/audit_control.example /etc/security/audit_control
            sudo launchctl enable system/com.apple.auditd
            ```

            Restart the system to finish. `auditd` reads `/etc/security/audit_control` only at startup, so it does not begin collecting events until the restart completes. The `cp -n` form leaves an existing configuration file untouched.

            On macOS 13 and earlier the configuration file is already present and the daemon can be started in place instead:

            ```bash
            sudo launchctl enable system/com.apple.auditd
            sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.auditd.plist
            ```

            The `enable` command clears the disabled override so the daemon starts again, and `bootstrap` loads it now. The `bootstrap` command reports an error if the service is already loaded; that error is harmless.

            **Impact:**

            Enabling `auditd` may increase system resource usage due to logging. Ensure sufficient storage is available for audit logs, and regularly review and archive logs to maintain system performance.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable `auditd` using Ansible, you can use the following playbook. It provisions the configuration file that macOS 14 and later no longer install, clears the launchd override, and restarts the host so `auditd` picks the configuration up:

            ```yaml
            ---
            - name: Enable security auditing
              hosts: all
              become: true
              tasks:
                - name: Provision the audit configuration file if it is missing
                  ansible.builtin.copy:
                    src: /etc/security/audit_control.example
                    dest: /etc/security/audit_control
                    remote_src: true
                    force: false
                    owner: root
                    group: wheel
                    mode: '0600'
                - name: Clear the disabled override on the audit daemon
                  ansible.builtin.command: launchctl enable system/com.apple.auditd
                - name: Restart so the audit daemon starts with the new configuration
                  ansible.builtin.reboot:
            ```

            `force: false` leaves an existing configuration file untouched, so the task is safe to re-run and does not overwrite a tuned retention policy. The `enable` task runs `launchctl` through `ansible.builtin.command`, which always reports `changed` even when the daemon is already enabled, so this playbook is not fully idempotent.

            **Impact:**

            Enabling `auditd` may increase system resource usage due to logging. Ensure sufficient storage is available for audit logs, and regularly review and archive logs to maintain system performance.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-enable-show-wifi-status
    title: Enable "Show Wi-Fi status in menu bar"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath1 = home + "/Library/Preferences/ByHost/com.apple.controlcenter." + os.machineid.upcase + ".plist"
        a = file(filePath1).exists == true && [filePath1].where(file(_).exists) {
          parse.plist(filePath1).params["WiFi"] == 18
          || parse.plist(filePath1).params["WiFi"] == 2
        }
        filePath2 = "/Library/Managed Preferences/" + name + "/complete.plist"
        b = file(filePath2).exists == true && [filePath2].where(file(_).exists) {
          parse.plist(filePath2).params["com.apple.controlcenter"]["WiFi"]["value"] == 18
            || parse.plist(filePath2).params["com.apple.controlcenter"]["WiFi"]["value"] == 2
        }
        filePath3 = "/Library/Managed Preferences/com.apple.controlcenter.plist"
        c = file(filePath3).exists == true && [filePath3].where(file(_).exists) {
          parse.plist(filePath3).params["WiFi"] == 18
            || parse.plist(filePath3).params["WiFi"] == 2
        }
        a || b || c
      }
    docs:
      desc: |
        This check verifies that the Wi-Fi status item is shown in the menu bar.

        The menu bar item displays which network the Mac is joined to and gives one-click access to switch or disconnect. The check reads the Control Center preference for each non-system user account.

        **Why this matters**

        This is a visibility control rather than a technical one, and it is worth being direct about that: it prevents nothing on its own. What it does is put the current network name permanently in the user's field of view.

        That matters because the attacks users are expected to notice are network attacks. A Mac that silently associates with an attacker's access point impersonating a known network, or that falls back to an open network when the expected one is unavailable, behaves normally in every visible way. The connection works, pages load, and nothing prompts. The network name in the menu bar is frequently the only signal available.

        It also gives the user a way to act on that signal immediately, disconnecting without hunting through settings, which matters when the correct response is to get off the network quickly.

        Treat this as support for user awareness alongside the technical controls, not as a substitute for them.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **Control Center**.
        3. Review the **Wi-Fi** menu bar setting.

        A passing result shows Wi-Fi set to **Show in Menu Bar**. A failing result shows it hidden from the menu bar.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Read the Control Center Wi-Fi preference for the logged-in user:

           ```bash
           defaults -currentHost read com.apple.controlcenter.plist WiFi
           ```

        A passing result returns `18` or `2`. A failing result returns another value or reports that the key does not exist.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable the Wi-Fi status in the menu bar:

            ```bash
            sudo -u <username> defaults -currentHost write com.apple.controlcenter.plist WiFi -int 18
            ```

            _Example:_

            ```bash
            sudo -u firstuser defaults -currentHost write com.apple.controlcenter.plist WiFi -int 18
            ```

            _Note: Both `18` and `2` are valid values for this parameter._

            This preference is stored per user, so repeat the command for every account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Enabling the Wi-Fi status in the menu bar provides users with a quick and visible way to monitor their wireless network connectivity.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **Control Center**
            3. Set **Wi-Fi** to **Show in Menu Bar**

            On macOS 12 and earlier, open **System Preferences**, select **Network**, select **Wi-Fi**, and enable **Show Wi-Fi status in menu bar**.

            **Impact:**

            Enabling the Wi-Fi status in the menu bar provides users with a quick and visible way to monitor their wireless network connectivity.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable the Wi-Fi status in the menu bar using Ansible, run the task as the user whose preference you are changing:

            ```yaml
            ---
            - name: Enable Wi-Fi status in menu bar
              hosts: all
              become: true
              become_user: firstuser
              tasks:
                - name: Enable Wi-Fi status in menu bar
                  ansible.builtin.command: defaults -currentHost write com.apple.controlcenter.plist WiFi -int 18
            ```

            Replace `firstuser` with the account being configured. Both `18` and `2` are valid values for this parameter. This preference is stored per user, so run the task with `become_user` set to each account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Enabling the Wi-Fi status in the menu bar provides users with a quick and visible way to monitor their wireless network connectivity.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-ensure-airdrop-is-disabled
    title: Ensure AirDrop Is Disabled
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath1 = home + "/Library/Preferences/com.apple.NetworkBrowser.plist"
        a = file(filePath1).exists && parse.plist(filePath1).params["DisableAirDrop"] == true
        filePath2 = "/Library/Managed Preferences/" + name + "/complete.plist"
        b = file(filePath2).exists == true && [filePath2].where(file(_).exists) {
            parse.plist(filePath2).params["com.apple.applicationaccess"]["allowAirDrop"]["value"] == false
          }
        filePath3 = "/Library/Managed Preferences/com.apple.NetworkBrowser.plist"
        c = file(filePath3).exists && parse.plist(filePath3).params['DisableAirDrop'] == true
        a || b || c
      }
    docs:
      desc: |
        This check verifies that AirDrop is disabled.

        AirDrop transfers files directly between Apple devices using Bluetooth for discovery and a peer-to-peer Wi-Fi link for the transfer, without either device joining a common network. The check reads `DisableAirDrop` for each non-system user account, which must be `true`.

        **Why this matters**

        AirDrop creates a transfer path that leaves no trace anywhere the organization can see. The link is established directly between the two devices, so nothing traverses a corporate network, no proxy inspects it, and no data loss prevention system evaluates it. A file moved this way has simply left, and there is no record that it did.

        The inbound direction is the more immediate risk. With receiving set to everyone, anyone within Wi-Fi range can send unsolicited files, which is used both for harassment and to deliver a payload that a curious user opens.

        Discovery is a third issue. Establishing whether a nearby device will accept a transfer involves exchanging identifiers derived from the user's contact details, and weaknesses in that exchange have allowed nearby devices to recover the phone number or email address associated with a target.

        Where AirDrop is needed, restrict receiving to contacts only rather than everyone, and provide a managed transfer service for moving files off a machine deliberately.
      audit: |
        Verify that AirDrop is turned off from the macOS shell. The **Allow me to be discovered by** control in Finder and the **AirDrop** control in **System Settings** set discoverability only, so neither answers this question.

        1. Open the **Terminal** app.
        2. Read the AirDrop preference for the logged-in user:

           ```bash
           defaults read com.apple.NetworkBrowser DisableAirDrop
           ```

        3. On a managed Mac, read the restriction delivered by a configuration profile instead:

           ```bash
           defaults read /Library/Managed\ Preferences/com.apple.applicationaccess allowAirDrop
           ```

        A passing result returns `1` for `DisableAirDrop`, or `0` for `allowAirDrop`. A failing result returns `0` for `DisableAirDrop`, or reports that neither key exists.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable AirDrop:

            ```bash
            sudo -u <username> defaults write com.apple.NetworkBrowser DisableAirDrop -bool true
            ```

            _Example:_

            ```bash
            sudo -u firstuser defaults write com.apple.NetworkBrowser DisableAirDrop -bool true
            ```

            This preference is stored per user, so repeat the command for every account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Disabling AirDrop can limit the ability to move files quickly over the network without using file shares.
        - id: gui
          desc: |
            **Using the GUI**

            macOS provides no graphical control for the preference that turns AirDrop off. The **Allow me to be discovered by** control in Finder and the **AirDrop** control in **System Settings** under **General**, **AirDrop & Handoff** change discoverability only. They leave AirDrop itself available and do not resolve this finding. Use the CLI command above, or deploy a configuration profile with the `com.apple.applicationaccess` payload that sets `allowAirDrop` to false.

            **Impact:**

            Disabling AirDrop can limit the ability to move files quickly over the network without using file shares.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable AirDrop using Ansible, run the task as the user whose preference you are changing:

            ```yaml
            ---
            - name: Disable AirDrop
              hosts: all
              become: true
              become_user: firstuser
              tasks:
                - name: Disable AirDrop for the user
                  ansible.builtin.command: defaults write com.apple.NetworkBrowser DisableAirDrop -bool true
            ```

            Replace `firstuser` with the account being configured. This preference is stored per user, so run the task with `become_user` set to each account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Disabling AirDrop can limit the ability to move files quickly over the network without using file shares.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-ensure-firewall-is-configured-to-log
    title: Ensure Firewall is configured to log
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: macos.firewall.loggingEnabled == true
    docs:
      desc: |
        This check verifies that the macOS firewall writes a log.

        Firewall logging records the connection attempts the application firewall handles, including which applications requested access and which inbound connections were blocked. The check reads `macos.firewall.loggingEnabled`, which must be `true`.

        **Why this matters**

        A firewall without logging enforces policy and tells nobody what it enforced. The blocks still happen, so the machine is protected, but the information that would explain why is discarded as it is generated.

        That information has two uses. After an incident, the log shows what tried to reach the machine and when, which is how an investigator establishes whether the Mac was targeted specifically or swept up in something broad, and which network it was on at the time. Before an incident, the same records show an application on the machine repeatedly attempting to accept connections that nobody configured, which is how unexpected listeners are noticed.

        Logging is also what makes the firewall diagnosable. When an application does not work as expected, the log distinguishes a firewall block from a network fault, and without it that question is answered by turning the firewall off to see whether the problem goes away.

        Collect the log centrally where the environment allows, so that the record survives the machine.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **Network**, then **Firewall**.
        3. Select **Options** and review the firewall logging setting.

        A passing result shows firewall logging turned on. A failing result shows it turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the firewall logging mode:

           ```bash
           /usr/libexec/ApplicationFirewall/socketfilterfw --getloggingmode
           ```

        A passing result reports `Log mode is on`. A failing result reports `Log mode is off`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable logging for the firewall:

            ```bash
            sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setloggingmode on
            ```

            **Impact:**

            Enabling detailed logging may result in increased storage usage. Regular log review and archiving are recommended to manage disk space effectively.
        - id: gui
          desc: |
            **Using the GUI**

            macOS provides no graphical control for application firewall logging. Use the CLI command to enable it:

            ```bash
            sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setloggingmode on
            ```

            **Impact:**

            Enabling detailed logging may result in increased storage usage. Regular log review and archiving are recommended to manage disk space effectively.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable firewall logging using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Enable Firewall logging
              hosts: all
              become: true
              tasks:
                - name: Enable Firewall logging
                  ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --setloggingmode on
            ```

            **Impact:**

            Enabling detailed logging may result in increased storage usage. Regular log review and archiving are recommended to manage disk space effectively.
    refs:
      - url: https://support.apple.com/guide/mac-help/change-firewall-settings-on-mac-mh11783/mac
        title: Apple - Firewall Settings
  - uid: mondoo-macos-security-ensure-http-server-is-not-running
    title: Ensure http server is not running
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      service('org.apache.httpd') {
        enabled == false
        running == false
      }
    docs:
      desc: |
        This check verifies that the Apache web server included with macOS is not running.

        macOS ships Apache but does not start it by default. When it is enabled, the Mac serves HTTP to the network. The check reads the `org.apache.httpd` service, which must be neither running nor enabled.

        **Why this matters**

        A web server on a workstation is almost always there by accident. It was enabled during development work, or turned on to share a file once, and then left running because nothing about a listening daemon is visible in daily use.

        That listener has no owner, which is what makes it dangerous. It is not in the inventory that drives patching, its configuration was never reviewed, and its logs are not going anywhere anyone reads. The version macOS ships is frequently behind current Apache, since it updates only with the operating system.

        The default configuration serves the contents of a document root, and a directory listing of a developer's working files can expose source code, configuration, and credentials. On a laptop the server follows the machine onto untrusted networks, offering the same content to whoever is there.

        Development work needs a server bound to the loopback interface rather than to all interfaces. On a workstation the system Apache should stay stopped and disabled.
      audit: |
        Verify that the Apache HTTP server is not running from the macOS shell.

        1. Open the **Terminal** app.
        2. Check whether the Apache daemon is loaded:

           ```bash
           sudo launchctl list | grep org.apache.httpd
           ```

        A passing result returns no output, confirming the HTTP server is not loaded. A failing result lists `org.apache.httpd`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable the HTTP server services:

            ```bash
            sudo launchctl unload -w /System/Library/LaunchDaemons/org.apache.httpd.plist
            ```

            **Impact:**

            Disabling the HTTP server prevents the system from being used as a web server, reducing its visibility and potential attack surface. For environments requiring web services, hardened web servers or appropriate cloud services should be used instead.
        - id: gui
          desc: |
            **Using the GUI**

            macOS no longer provides a graphical control for the built-in Apache web server. Apple removed the Web Sharing option from the Sharing pane. Use the CLI command to disable the service:

            ```bash
            sudo launchctl unload -w /System/Library/LaunchDaemons/org.apache.httpd.plist
            ```

            **Impact:**

            Disabling the HTTP server prevents the system from being used as a web server, reducing its visibility and potential attack surface. For environments requiring web services, hardened web servers or appropriate cloud services should be used instead.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable the HTTP server using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable HTTP server
              hosts: all
              become: true
              tasks:
                - name: Disable HTTP server
                  ansible.builtin.command: launchctl unload -w /System/Library/LaunchDaemons/org.apache.httpd.plist
            ```

            **Impact:**

            Disabling the HTTP server prevents the system from being used as a web server, reducing its visibility and potential attack surface. For environments requiring web services, hardened web servers or appropriate cloud services should be used instead.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-ensure-nfs-server-is-not-running
    title: Ensure NFS server is not running
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      service('com.apple.nfsd') {
        enabled == false
        running == false
      }
    docs:
      desc: |
        This check verifies that the NFS server included with macOS is not running.

        When `nfsd` runs, directories listed in `/etc/exports` become available to other machines over NFS. The check reads the `com.apple.nfsd` service, which must be neither running nor enabled.

        **Why this matters**

        NFS decides who you are by trusting the user and group IDs the client sends. There is no authentication in the protocol beyond a check that the connection came from a permitted address, so anyone with administrative access on a permitted client, or the ability to appear as one, can present any identity they choose and read the corresponding files.

        That trust model was designed for a controlled server network. On a workstation, and particularly a mobile one, the set of machines that can reach the service is whoever happens to be on the current network.

        The export configuration is also easy to get wrong in a way that is invisible afterward. An export written for a one-time transfer, without a host restriction, stays in place and stays available.

        Workstations should not export filesystems. Use a managed file service with real authentication, and leave `nfsd` stopped and disabled.
      audit: |
        Verify that the NFS server is not running from the macOS shell.

        1. Open the **Terminal** app.
        2. Query the NFS daemon status:

           ```bash
           sudo nfsd status
           ```

        A passing result reports that `nfsd` is disabled and not running. A failing result reports that `nfsd` is enabled or running.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable the NFS server services:

            ```bash
            sudo nfsd disable
            ```

            **Impact:**

            Disabling the NFS server prevents the system from being used as a file server, reducing its visibility and potential attack surface. For environments requiring file sharing, hardened servers should be used instead of user endpoints.
        - id: gui
          desc: |
            **Using the GUI**

            macOS provides no graphical control for the NFS server. The Sharing pane does not manage `nfsd`. Use the CLI command to disable it:

            ```bash
            sudo nfsd disable
            ```

            Also remove or empty `/etc/exports` so the service does not restart with active exports.

            **Impact:**

            Disabling the NFS server prevents the system from being used as a file server, reducing its visibility and potential attack surface. For environments requiring file sharing, hardened servers should be used instead of user endpoints.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable the NFS server using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable NFS server
              hosts: all
              become: true
              tasks:
                - name: Disable NFS server
                  ansible.builtin.command: nfsd disable
            ```

            **Impact:**

            Disabling the NFS server prevents the system from being used as a file server, reducing its visibility and potential attack surface. For environments requiring file sharing, hardened servers should be used instead of user endpoints.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-ensure-security-auditing-retention
    title: Ensure security auditing retention
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      file("/etc/security/audit_control").exists;
      ["/etc/security/audit_control"].where(file(_).exists) {
        file(_).content.lines.where( _ == /^expire-after/) {
          _.split(":")[1] == /^([6-9]\d|[1-9]\d{2,})d$/ || _.split(":")[1] == /^[1-9]\d*G$/
        }
      }
    docs:
      desc: |
        This check verifies that macOS keeps audit records long enough to be useful in an investigation.

        Retention is configured in `/etc/security/audit_control` by the `expire-after` setting, which can be expressed as an age, a total size, or both. The check reads that setting, which must be at least `60d` or at least `1G`.

        **Why this matters**

        Audit records are only useful for as long as they still exist, and the default retention on macOS expires them well before most intrusions are discovered. Compromises are typically found weeks or months after the initial access, by which time a short window has already discarded the records describing how the attacker arrived.

        What survives is the recent activity, which shows the current state of a compromise but not its origin. That is the part an investigation most needs, because it determines whether other machines are affected and whether the entry point is still open.

        The expiry is also drivable by an attacker. Generating a large volume of ordinary auditable activity pushes older records out of a size-bounded trail without touching a file or producing anything that looks like tampering.

        Retention on the machine is a floor, not the plan. Forward the audit trail to a central collector where it is beyond the reach of anyone with administrative access to this Mac.
      audit: |
        Verify the audit retention policy from the macOS shell.

        1. Open the **Terminal** app.
        2. Read the `expire-after` setting from the audit configuration file:

           ```bash
           grep expire-after /etc/security/audit_control
           ```

        A passing result shows `expire-after` set to at least `60d` or `1G`. A failing result shows a shorter retention period or no `expire-after` line.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            On macOS 14 and later no `/etc/security/audit_control` is installed until you provision one, so create it from the template Apple ships before editing it:

            ```bash
            sudo cp -n /etc/security/audit_control.example /etc/security/audit_control
            ```

            The `cp -n` form leaves an existing configuration file untouched. Then edit the file to set the audit retention length. The `expire-after` parameter controls how long audit logs are retained.

            ```bash
            sudo vi /etc/security/audit_control
            ```

            Add or modify the `expire-after` line to set the desired retention period:

            ```text
            expire-after:60d
            ```

            If an `expire-after` line already exists, you can update it with `sed` instead:

            ```bash
            sudo sed -i '' 's/^expire-after:.*/expire-after:60d/' /etc/security/audit_control
            ```

            The `sed` command only changes an existing line. If the file has no `expire-after` line, add one with the editor. Then apply the new configuration:

            ```bash
            sudo audit -s
            ```

            **Note:** The `/etc/security/audit_control` file is a plain text configuration file, not a plist. Use a text editor or `sed` to modify it.

            **Impact:**

            Retaining at least 60 days or 1 gigabyte of audit records ensures sufficient data for analysis. Systems with limited disk space may encounter issues retaining the recommended amount of data.
        - id: ansible
          desc: |
            **Using Ansible**

            To set the audit retention length using Ansible, you can use the following playbook. The first task provisions the configuration file that macOS 14 and later no longer install, because `lineinfile` fails outright on a path that does not exist:

            ```yaml
            ---
            - name: Set audit retention length
              hosts: all
              become: true
              tasks:
                - name: Provision the audit configuration file if it is missing
                  ansible.builtin.copy:
                    src: /etc/security/audit_control.example
                    dest: /etc/security/audit_control
                    remote_src: true
                    force: false
                    owner: root
                    group: wheel
                    mode: '0600'
                - name: Set audit retention to 60 days
                  ansible.builtin.lineinfile:
                    path: /etc/security/audit_control
                    regexp: '^expire-after:'
                    line: 'expire-after:60d'
                    state: present
            ```

            **Note:** The `/etc/security/audit_control` file is a plain text configuration file, not a plist. Use `lineinfile` to modify it.

            **Impact:**

            Retaining at least 60 days or 1 gigabyte of audit records ensures sufficient data for analysis. Systems with limited disk space may encounter issues retaining the recommended amount of data.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-password-age
    title: Password Age
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath = "/Library/Managed Preferences/" + name + "/complete.plist"
        a = file(filePath).exists == true && [filePath].where(file(_).exists) {
          parse.plist(filePath).params["com.apple.mobiledevice.passwordpolicy"]["maxPINAgeInDays"]["value"] != empty &&
            parse.plist(filePath).params["com.apple.mobiledevice.passwordpolicy"]["maxPINAgeInDays"]["value"] <= 365
        }
        b = macos.globalAccountPolicies['policyCategoryPasswordChange'] != empty &&
          macos.globalAccountPolicies['policyCategoryPasswordChange'].any(_['policyParameters']['policyAttributeDaysUntilExpiration'] <= 365)
        filePath2 = "/Library/Managed Preferences/com.apple.mobiledevice.passwordpolicy.plist"
        c = file(filePath2).exists == true &&
          parse.plist(filePath2).params['maxPINAgeInDays'] <= 365
        a || b || c
      }
    docs:
      desc: |
        This check verifies that a maximum password age is enforced for user accounts.

        A maximum age requires each account's password to be changed after a set period. The check reads the `maxPINAgeInDays` policy from the managed preferences applied to each non-system user account.

        **Why this matters**

        The value of a rotation policy is bounded and worth stating honestly. Current guidance from NIST advises against routine expiry for its own sake, because it drives users toward predictable variations of one password and toward writing them down, and modern guidance favors length, screening against known-breached passwords, and multi-factor authentication instead.

        Where expiry still earns its place is as a backstop for exposure nobody detected. Credentials leak through reuse on a breached third-party site, through a phishing page, or through a machine that was compromised and cleaned without anyone realizing a password was taken. In each case the credential stays valid indefinitely unless something forces a change, and a maximum age puts an upper bound on how long a quietly stolen password keeps working.

        Several compliance regimes also require it as a discrete control regardless of the current research.

        Choose a period long enough not to push users toward weak patterns, and treat it as one layer beneath multi-factor authentication and breached-password screening rather than as the primary defense.
      audit: |
        Verify the maximum password age from the macOS shell.

        1. Open the **Terminal** app.
        2. Read the account policies, which is where macOS records a policy delivered by a configuration profile:

           ```bash
           pwpolicy -getaccountpolicies
           ```

        3. Read the legacy global policy, which still applies on hosts configured before account policies replaced it:

           ```bash
           pwpolicy -n /Local/Default -getglobalpolicy
           ```

        A passing result shows a `policyCategoryPasswordChange` entry expiring the password after 365 days or fewer, or `maxMinutesUntilChangePassword` set to `525600` minutes or fewer. A failing result shows a longer interval or no expiration policy at all. Apple marks the global policy commands deprecated, so on a Mac whose policy arrives by configuration profile the legacy command prints nothing and only the account policies show the setting.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to require that passwords expire after at most 365 days:

            ```bash
            sudo pwpolicy -n /Local/Default -setglobalpolicy "maxMinutesUntilChangePassword=<value≤525600>"
            ```

            _Example:_

            ```bash
            sudo pwpolicy -n /Local/Default -setglobalpolicy "maxMinutesUntilChangePassword=43200"
            ```

            Apple marks `-setglobalpolicy` deprecated in favor of account policies. On a managed Mac, deploy an MDM passcode configuration profile that sets `maxPINAgeInDays` to 365 or less, which is the form macOS records and reports through `pwpolicy -getaccountpolicies`.

            **Impact:**

            Enforcing password expiration may lead to some locked computers requiring administrative assistance. Ensure users are informed of the policy to minimize disruptions.
        - id: gui
          desc: |
            **Using the GUI**

            macOS provides no graphical setting for password expiration on local accounts. Use the CLI command, or deploy an MDM passcode configuration profile that sets `maxPINAgeInDays` to 365 or less.

            **Impact:**

            Enforcing password expiration may lead to some locked computers requiring administrative assistance. Ensure users are informed of the policy to minimize disruptions.
        - id: ansible
          desc: |
            **Using Ansible**

            To set a maximum password age of 365 days using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Set maximum password age
              hosts: all
              become: true
              tasks:
                - name: Set maximum password age to 365 days
                  ansible.builtin.command: pwpolicy -n /Local/Default -setglobalpolicy "maxMinutesUntilChangePassword=43200"
            ```

            **Impact:**

            Enforcing password expiration may lead to some locked computers requiring administrative assistance. Ensure users are informed of the policy to minimize disruptions.
    refs:
      - url: https://support.apple.com/guide/mac-help/change-lock-screen-settings-mchlp2996/mac
        title: Apple - Lock Screen Settings
  - uid: mondoo-macos-security-password-history
    title: Password History
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath = "/Library/Managed Preferences/" + name + "/complete.plist"
        a = file(filePath).exists == true && [filePath].where(file(_).exists) {
          parse.plist(filePath).params["com.apple.mobiledevice.passwordpolicy"]["pinHistory"]["value"] != empty &&
            parse.plist(filePath).params["com.apple.mobiledevice.passwordpolicy"]["pinHistory"]["value"] >= 15
          }
        b = macos.globalAccountPolicies['policyCategoryPasswordContent'] != empty &&
          macos.globalAccountPolicies['policyCategoryPasswordContent'].any(_['policyParameters']['policyAttributePasswordHistoryDepth'] >= 15 )
        filePath2 = "/Library/Managed Preferences/com.apple.mobiledevice.passwordpolicy.plist"
        c = file(filePath2).exists == true &&
          parse.plist(filePath2).params['pinHistory'] != empty &&
            parse.plist(filePath2).params['pinHistory'] >= 15
        a || b || c
      }
    docs:
      desc: |
        This check verifies that password history is enforced for user accounts.

        A history policy records previously used passwords and prevents them from being set again. The check reads the `pinHistory` policy from the managed preferences applied to each non-system user account.

        **Why this matters**

        Without history, a maximum password age accomplishes nothing. A user prompted to change their password sets it to something new, and then either immediately or at the next prompt sets it back to what it was before. The rotation requirement is satisfied on paper and the credential never actually changes.

        That matters most in exactly the case rotation exists for. When a password has been exposed without anyone knowing, the forced change is the only thing that invalidates it, and reuse of the old value hands the attacker their access back.

        History also blocks the shortest cycle of the pattern users adopt under rotation pressure, where a small number of passwords are alternated indefinitely.

        Set the history depth deep enough that returning to an old password is impractical rather than merely delayed. A depth of five or more is typical, and it should be paired with the maximum age policy, since neither control does much without the other.
      audit: |
        Verify the password history depth from the macOS shell.

        1. Open the **Terminal** app.
        2. Read the account policies, which is where macOS records a policy delivered by a configuration profile:

           ```bash
           pwpolicy -getaccountpolicies
           ```

        3. Read the legacy global policy, which still applies on hosts configured before account policies replaced it:

           ```bash
           pwpolicy -n /Local/Default -getglobalpolicy
           ```

        A passing result shows a `policyCategoryPasswordContent` entry with a history depth of 15 or greater, or `usingHistory` set to `15` or greater. A failing result shows a smaller value or no history policy. Apple marks the global policy commands deprecated, so on a Mac whose policy arrives by configuration profile the legacy command prints nothing and only the account policies show the setting.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to require that the password must be different from at least the last 15 passwords:

            ```bash
            sudo pwpolicy -n /Local/Default -setglobalpolicy "usingHistory=<value≥15>"
            ```

            _Example:_

            ```bash
            sudo pwpolicy -n /Local/Default -setglobalpolicy "usingHistory=15"
            ```

            Apple marks `-setglobalpolicy` deprecated in favor of account policies. On a managed Mac, deploy an MDM passcode configuration profile that sets `pinHistory` to 15 or more, which is the form macOS records and reports through `pwpolicy -getaccountpolicies`.

            **Impact:**

            Enforcing password history may lead to some locked computers requiring administrative assistance. Ensure users are informed of the policy to minimize disruptions.
        - id: gui
          desc: |
            **Using the GUI**

            macOS provides no graphical setting for password history on local accounts. Use the CLI command, or deploy an MDM passcode configuration profile that sets `pinHistory` to 15 or more.

            **Impact:**

            Enforcing password history may lead to some locked computers requiring administrative assistance. Ensure users are informed of the policy to minimize disruptions.
        - id: ansible
          desc: |
            **Using Ansible**

            To set a password history of 15 passwords using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Set password history
              hosts: all
              become: true
              tasks:
                - name: Set password history to 15 passwords
                  ansible.builtin.command: pwpolicy -n /Local/Default -setglobalpolicy "usingHistory=15"
            ```

            **Impact:**

            Enforcing password history may lead to some locked computers requiring administrative assistance. Ensure users are informed of the policy to minimize disruptions.
