  - uid: mondoo-macos-security-disable-media-sharing
    title: Disable Media Sharing
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.mediaSharing == false
    docs:
      desc: |
        This check verifies that Media Sharing is turned off.

        Media Sharing publishes this Mac's music, video, and photo libraries to other devices and users on the local network and advertises them through Bonjour. The check reads `macos.sharing.mediaSharing`, which must be `false`.

        **Why this matters**

        The service opens a listening port and announces the library to the network. The direct content exposure is usually modest, since a corporate Mac rarely holds sensitive media, but two effects are not.

        The advertisement identifies the machine and its owner. Shared libraries are announced with a human-readable name derived from the account, so the service broadcasts who is using the laptop to everyone on the segment, including on public networks.

        The listener is the more durable concern. It is a network-facing daemon on a workstation, receiving requests from any device on the segment, doing work that nobody deployed intentionally and that nobody is monitoring. It is patched on the operating system's schedule rather than a server's, and it will keep listening on every network the laptop joins.

        Nothing on a managed workstation requires Media Sharing. Turn it off.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Media Sharing** setting.

        A passing result shows **Media Sharing** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Read the media sharing preference for the logged-in user:

           ```bash
           defaults read com.apple.amp.mediasharingd home-sharing-enabled
           ```

        A passing result returns `0` or reports that the key does not exist. A failing result returns `1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Media Sharing:

            ```bash
            sudo -u <username> defaults write com.apple.amp.mediasharingd home-sharing-enabled -int 0
            ```

            This preference is stored per user, so repeat the command for every account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Disabling Media Sharing prevents the system from being used as a media server, reducing its visibility and potential attack surface. For environments requiring media sharing, dedicated servers should be used instead of user endpoints.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Media Sharing**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Media Sharing**.

            **Impact:**

            Disabling Media Sharing prevents the system from being used as a media server, reducing its visibility and potential attack surface. For environments requiring media sharing, dedicated servers should be used instead of user endpoints.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Media Sharing using Ansible, run the task as the user whose preference you are changing:

            ```yaml
            ---
            - name: Disable Media Sharing
              hosts: all
              become: true
              become_user: firstuser
              tasks:
                - name: Disable Media Sharing for the user
                  ansible.builtin.command: defaults write com.apple.amp.mediasharingd home-sharing-enabled -int 0
            ```

            Replace `firstuser` with the account that has Media Sharing enabled. This preference is stored per user, so run the task with `become_user` set to each account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Disabling Media Sharing prevents the system from being used as a media server, reducing its visibility and potential attack surface. For environments requiring media sharing, dedicated servers should be used instead of user endpoints.
