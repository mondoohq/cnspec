policies:
  - uid: mondoo-macos-security
    name: Mondoo macOS Security
    version: 1.4.4
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: macos
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure macOS firewall, FileVault, Gatekeeper, and more
    docs:
      desc: |
        The Mondoo macOS Security policy identifies critical misconfigurations on macOS systems that could leave end-user devices vulnerable to malware, unauthorized access, and data exfiltration. This policy helps organizations detect and remediate hardening gaps before attackers can exploit them to access sensitive data through file sharing services, gain unauthorized remote access, or compromise systems through network-based attacks.

        This policy provides security checks across key macOS areas:

        - FileVault full-disk encryption
        - Application firewall configuration
        - Gatekeeper and System Integrity Protection
        - Sharing services such as Screen Sharing, File Sharing, and Remote Login
        - Remote access configurations
        - Network security settings and Bluetooth controls
        - Software update posture

        This policy was tested against Apple macOS 10.15, 11, 12, 13, and 14.

        Learn more about scanning macOS in the [cnspec macOS documentation](https://mondoo.com/docs/cnspec/os/mac).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Core
        filters: |
          asset.platform == "macos"
        checks:
          - uid: mondoo-macos-security-disable-bluetooth-sharing
          - uid: mondoo-macos-security-disable-bonjour-advertising-service
          - uid: mondoo-macos-security-disable-content-caching
          - uid: mondoo-macos-security-disable-file-sharing
          - uid: mondoo-macos-security-disable-internet-sharing
          - uid: mondoo-macos-security-disable-media-sharing
          - uid: mondoo-macos-security-disable-printer-sharing
          - uid: mondoo-macos-security-disable-remote-apple-events
          - uid: mondoo-macos-security-disable-remote-login
          - uid: mondoo-macos-security-disable-remote-management
          - uid: mondoo-macos-security-disable-screen-sharing
          - uid: mondoo-macos-security-enable-filevault
          - uid: mondoo-macos-security-enable-firewall
          - uid: mondoo-macos-security-enable-firewall-stealth-mode
          - uid: mondoo-macos-security-firewall-block-all-incoming
          - uid: mondoo-macos-security-enable-gatekeeper
          - uid: mondoo-macos-security-enable-show-wifi-status
          - uid: mondoo-macos-security-ensure-airdrop-is-disabled
          - uid: mondoo-macos-security-ensure-http-server-is-not-running
          - uid: mondoo-macos-security-ensure-nfs-server-is-not-running
          - uid: mondoo-macos-security-software-updates-automatic-check-enabled
          - uid: mondoo-macos-security-software-updates-automatic-download
          - uid: mondoo-macos-security-software-updates-install-critical-updates
          - uid: mondoo-macos-security-ensure-macos-is-up-to-date
      - title: Account Security
        filters: |
          asset.platform == "macos"
        checks:
          - uid: mondoo-macos-security-do-not-enable-the-root-account
          - uid: mondoo-macos-security-password-age
          - uid: mondoo-macos-security-password-history
          - uid: mondoo-macos-security-reduce-the-sudo-timeout-period
          - uid: mondoo-macos-security-set-a-minimum-password-length
      - title: Logging
        filters: |
          asset.platform == "macos"
        checks:
          - uid: mondoo-macos-security-control-access-to-audit-records
          - uid: mondoo-macos-security-enable-security-auditing
          - uid: mondoo-macos-security-ensure-firewall-is-configured-to-log
          - uid: mondoo-macos-security-ensure-security-auditing-retention
          - uid: mondoo-macos-security-retain-install-log-for-365-or-more-days
queries:
  - uid: mondoo-macos-security-control-access-to-audit-records
    title: Control access to audit records
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      auditControlPath = [
        "/etc/security/audit_control",
      ]
      auditControlPath.where(file(_).exists) {
        file(_) {
        path
        permissions.user_readable
        permissions.user_writeable
        permissions.user_executable == false

        permissions.group_writeable == false
        permissions.group_executable == false

        permissions.other_readable == false
        permissions.other_writeable == false
        permissions.other_executable == false

        user.name == "root"
        group.name == "wheel"
        }
      }
      files.find(from: "/var/audit/", type: "file,dir", xdev: false).all(user.name == "root" && group.name == "wheel" && permissions.other_readable == false && permissions.other_writeable == false && permissions.other_executable == false)
    docs:
      desc: |
        This check verifies that the macOS audit trail and its configuration are readable only by the system.

        The audit records in `/var/audit` and the `/etc/security/audit_control` file that governs what gets recorded should be owned by `root` and the `wheel` group. The check reads their ownership and mode, which must grant no access to other users.

        **Why this matters**

        The audit trail is the record of who authenticated, when privilege was used, and what administrative changes were made. Its value depends entirely on it being trustworthy, and a file that the subject of an investigation can modify is not evidence.

        Write access is the direct problem. An attacker who has escalated on the Mac and can edit the trail removes the records of how they arrived and what they did, and nothing about the resulting file indicates that anything was taken out.

        Write access to `audit_control` is worse, because it acts prospectively. Narrowing what the system records means the events never enter the trail at all, which leaves no gap to notice: the file is intact, the service is running, and the activity was simply never captured.

        Read access matters too. The trail describes which accounts exist, when they are used, and what administrators do, which is a map of the machine's activity that no ordinary account needs.

        Local permissions protect the copy on disk. Forward the trail off the machine so a record survives anyone who obtains administrative access to it.
      audit: |
        Verify the ownership and permissions of the audit configuration file and audit logs from the macOS shell.

        1. Open the **Terminal** app.
        2. Check the configuration file:

           ```bash
           ls -le /etc/security/audit_control
           ```

        3. Check the audit log directory:

           ```bash
           ls -le /var/audit/
           ```

        A passing result shows `/etc/security/audit_control` and every entry under `/var/audit/` owned by `root:wheel` with no read, write, or execute access for other users. A failing result shows another owner or group, or any permission granted to group or other beyond the expected read-only access.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run the following commands to secure the audit configuration file and audit logs:

            ```bash
            sudo chown root:wheel /etc/security/audit_control
            sudo chmod 600 /etc/security/audit_control
            sudo chown -R root:wheel /var/audit
            sudo find /var/audit -type d -exec chmod 700 {} +
            sudo find /var/audit -type f -exec chmod 600 {} +
            ```

            **Note:**

            Before applying these changes, verify the current access controls and investigate any unexpected modifications to the audit logs. If unauthorized changes are detected and cannot be traced, consider reinstalling the system to ensure its integrity.

            **Impact:**

            Securing audit logs prevents unauthorized access and tampering, ensuring the reliability of audit records for security monitoring and forensic analysis. However, improper permissions may disrupt legitimate access for system processes, so changes should be tested in a controlled environment before deployment.
        - id: ansible
          desc: |
            **Using Ansible**

            To secure the audit logs and configuration files using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Secure audit logs and configuration files
              hosts: all
              become: true
              tasks:
                - name: Set ownership and permissions for audit_control
                  ansible.builtin.file:
                    path: /etc/security/audit_control
                    owner: root
                    group: wheel
                    mode: '0600'
                - name: Set ownership of audit logs
                  ansible.builtin.command: find /var/audit -exec chown root:wheel {} +
                - name: Set audit log directory mode
                  ansible.builtin.command: find /var/audit -type d -exec chmod 700 {} +
                - name: Set audit log file mode
                  ansible.builtin.command: find /var/audit -type f -exec chmod 600 {} +
            ```

            **Note:**

            Before applying these changes, verify the current access controls and investigate any unexpected modifications to the audit logs. If unauthorized changes are detected and cannot be traced, consider reinstalling the system to ensure its integrity.

            **Impact:**

            Securing audit logs prevents unauthorized access and tampering, ensuring the reliability of audit records for security monitoring and forensic analysis. However, improper permissions may disrupt legitimate access for system processes, so changes should be tested in a controlled environment before deployment.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-disable-bluetooth-sharing
    title: Disable Bluetooth Sharing
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.bluetoothSharing == false
    docs:
      desc: |-
        This check verifies that Bluetooth Sharing is turned off.

        Bluetooth Sharing lets nearby Bluetooth devices push files to this Mac and browse a designated folder on it, making the machine a file transfer endpoint for whoever is in radio range. The check reads `macos.sharing.bluetoothSharing`, which must be `false`.

        **Why this matters**

        Bluetooth range is a physical boundary, not an authenticated one. Anyone within roughly ten meters, which includes an adjacent office, a café table, or a seat on the same train, can attempt to reach the service. There is no network to traverse, so none of the organization's firewalls, proxies, or network monitoring sees any of it.

        The service accepts inbound files into a folder on the Mac. That gives an attacker in range a way to place content on the machine without any prior access, which is the first step for a payload that a user is then persuaded to open. It also exposes the sharing folder for browsing, so material a user placed there for a colleague is readable by anyone who pairs.

        The Bluetooth stack itself is a second concern. It parses attacker-controlled input from unpaired devices, and vulnerabilities in that parsing have been found across every major implementation.

        Turn Bluetooth Sharing off and use AirDrop with a restricted receiving mode, or an approved file transfer service, when files need to move between machines.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Bluetooth Sharing** setting.

        A passing result shows **Bluetooth Sharing** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Read the current host Bluetooth preference:

           ```bash
           defaults -currentHost read com.apple.Bluetooth PrefKeyServicesEnabled
           ```

        A passing result returns `0` or reports that the key does not exist. A failing result returns `1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run the following command to disable Bluetooth Sharing for a specific user:

            ```bash
            sudo -u <username> defaults -currentHost write com.apple.Bluetooth PrefKeyServicesEnabled -bool false
            ```

            **Example:**

            ```bash
            sudo -u firstuser defaults -currentHost write com.apple.Bluetooth PrefKeyServicesEnabled -bool false
            ```

            This preference is stored per user and per host, so repeat the command for every account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Disabling Bluetooth Sharing prevents the system from accepting file transfers over Bluetooth, reducing the risk of unauthorized access or exploitation of Bluetooth vulnerabilities.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Bluetooth Sharing**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Bluetooth Sharing**.

            **Impact:**

            Disabling Bluetooth Sharing prevents the system from accepting file transfers over Bluetooth, reducing the risk of unauthorized access or exploitation of Bluetooth vulnerabilities.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Bluetooth Sharing using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Bluetooth Sharing
              hosts: all
              become: true
              become_user: <username>
              tasks:
                - name: Disable Bluetooth Sharing for user
                  ansible.builtin.command: defaults -currentHost write com.apple.Bluetooth PrefKeyServicesEnabled -bool false
            ```

            This preference is stored per user and per host, so run the task with `become_user` set to each account on the system. For fleet-wide enforcement, deploy a configuration profile through your MDM instead, which applies the setting to all current and future users.

            **Impact:**

            Disabling Bluetooth Sharing prevents the system from accepting file transfers over Bluetooth, reducing the risk of unauthorized access or exploitation of Bluetooth vulnerabilities.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-disable-bonjour-advertising-service
    title: Disable Bonjour advertising service
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath1 = "/Library/Managed Preferences/" + name + "/complete.plist"
        a = file(filePath1).exists == true && [filePath1].where(file(_).exists) {
          parse.plist(filePath1).params["com.apple.mDNSResponder"]["NoMulticastAdvertisements"]["value"] == true
        }
        filePath2 = "/Library/Preferences/com.apple.mDNSResponder.plist"
        b = file(filePath2).exists && parse.plist(filePath2).params["NoMulticastAdvertisements"] == true
        filePath3 = "/Library/Managed Preferences/com.apple.mDNSResponder.plist"
        c = file(filePath3).exists && parse.plist(filePath3).params["NoMulticastAdvertisements"] == true
        a || b || c
      }
    docs:
      desc: |
        This check verifies that the Mac does not advertise itself over Bonjour.

        Bonjour is Apple's zero-configuration networking service. It resolves names on the local network and it announces this Mac's own presence and services to everyone on the subnet, and the announcing half can be turned off independently. The check reads the managed preference `NoMulticastAdvertisements` for each non-system user account, which must be set.

        **Why this matters**

        Advertising broadcasts the machine's hostname, addresses, and the services it offers to every device on the segment, continuously and without being asked. On a corporate network that is an inventory an attacker does not have to work for. On an untrusted network such as a hotel, airport, or conference Wi-Fi it is worse, because the hostname of a company laptop frequently identifies both the user and the employer.

        That information shapes what happens next. An attacker on the same segment learns which machines are present and which are worth targeting without sending a probe that any monitoring would register as a scan, because they only had to listen.

        Disabling advertising does not break DNS or the ability to find printers and other devices. macOS still resolves Bonjour names and still discovers services offered by others. What stops is this Mac announcing itself.
      audit: |
        Verify that multicast advertising is disabled from the macOS shell.

        1. Open the **Terminal** app.
        2. Read the `mDNSResponder` preference:

           ```bash
           defaults read /Library/Preferences/com.apple.mDNSResponder.plist NoMulticastAdvertisements
           ```

        A passing result returns `1`. A failing result returns `0` or reports that the key does not exist.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Bonjour advertising services:

            ```bash
            sudo defaults write /Library/Preferences/com.apple.mDNSResponder.plist NoMulticastAdvertisements -bool true
            ```

            Restart the system for the change to take effect, because `mDNSResponder` only reads this preference at startup. The setting is inert until that reboot, so do not assume multicast advertising stops the moment the command runs. Plan the restart for a maintenance window on a server or shared Mac, where a reboot is disruptive.

            **Impact:**

            Some applications, such as Final Cut Studio and AirPort Base Station management, may not operate properly if multicast advertising is turned off.
        - id: gui
          desc: |
            **Using the GUI**

            macOS provides no graphical control for Bonjour multicast advertising. Use the CLI command above, or deploy a configuration profile that sets `NoMulticastAdvertisements` to true in the `com.apple.mDNSResponder` preference domain.

            **Impact:**

            Some applications, such as Final Cut Studio and AirPort Base Station management, may not operate properly if multicast advertising is turned off.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Bonjour advertising services using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Bonjour advertising services
              hosts: all
              become: true
              tasks:
                - name: Disable Bonjour advertising
                  ansible.builtin.command: defaults write /Library/Preferences/com.apple.mDNSResponder.plist NoMulticastAdvertisements -bool true
            ```

            **Impact:**

            Some applications, such as Final Cut Studio and AirPort Base Station management, may not operate properly if the `mDNSResponder` is turned off.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-disable-content-caching
    title: Disable Content Caching
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.contentCaching == false
    docs:
      desc: |
        This check verifies that Content Caching is turned off.

        Content Caching turns a Mac into a local distribution point for Apple software updates and iCloud data, serving them to other Apple devices on the same network. The check reads `macos.sharing.contentCaching`, which must be `false`.

        **Why this matters**

        Content Caching makes the Mac a server. It opens a listening port, advertises itself to peers, and hands content to any device on the network that asks, which is a role a user workstation should not be taking on.

        The exposure follows the machine. A laptop with the service enabled continues to offer it on whatever network it joins, so it starts serving content on hotel, airport, and home networks where the peers are strangers. Devices there will accept cached content from it, and it will accept requests from them.

        It also consumes substantial disk space and network bandwidth without the user being aware, and the cache holds copies of content associated with the iCloud accounts of devices that used it.

        Content Caching is a legitimate feature on a managed, stationary Mac deployed deliberately as a caching server on a controlled network. Turn it off on user workstations and laptops.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Content Caching** setting.

        A passing result shows **Content Caching** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the Content Caching status:

           ```bash
           AssetCacheManagerUtil status
           ```

        A passing result reports `Activated: false` and `Active: false`. A failing result reports `Activated: true`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Content Caching:

            ```bash
            sudo AssetCacheManagerUtil deactivate
            ```

            The output will include `Content caching deactivated`.

            **Impact:**

            Disabling Content Caching may increase bandwidth usage between local subnets and the internet, particularly when downloading large updates or content from Apple servers.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Content Caching**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Content Caching**.

            **Impact:**

            Disabling Content Caching may increase bandwidth usage between local subnets and the internet, particularly when downloading large updates or content from Apple servers.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Content Caching using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Content Caching
              hosts: all
              become: true
              tasks:
                - name: Disable Content Caching
                  ansible.builtin.command: AssetCacheManagerUtil deactivate
            ```

            **Impact:**

            Disabling Content Caching may increase bandwidth usage between local subnets and the internet, particularly when downloading large updates or content from Apple servers.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-disable-file-sharing
    title: Disable File Sharing
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.fileSharing == false
    docs:
      desc: |
        This check verifies that File Sharing is turned off.

        File Sharing exports folders over SMB so that other machines on the network can mount and read them. The check reads `macos.sharing.fileSharing`, which must be `false`.

        **Why this matters**

        SMB is the most heavily targeted protocol on any network. It is what an attacker scans for first after gaining a foothold, because a reachable share frequently leads straight to data or to credentials.

        Two paths matter on a Mac. Shares are easy to create casually, for a one-time handoff to a colleague, and then stay exported indefinitely with permissions nobody revisits. And SMB authentication can be relayed: a machine that speaks SMB can be coerced into authenticating to an attacker who forwards those credentials elsewhere and acts as the user. Neither requires a software vulnerability.

        The mobility of the machine compounds this. A laptop with File Sharing enabled offers those same shares on every network it joins, including networks where every other device is a stranger.

        Where files need to move between people, use a managed file service that authenticates and logs access. Turn File Sharing off on workstations.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **File Sharing** setting.

        A passing result shows **File Sharing** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Check whether the SMB daemon is loaded:

           ```bash
           sudo launchctl list | grep com.apple.smbd
           ```

        A passing result returns no output, confirming the SMB service is not loaded. A failing result lists `com.apple.smbd`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run these commands to disable SMB file sharing:

            ```bash
            sudo launchctl disable system/com.apple.smbd
            sudo launchctl bootout system/com.apple.smbd
            ```

            The `bootout` command reports an error if the service is not currently running; that error is harmless. On older macOS versions you can use the legacy form `sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.smbd.plist`.

            **Impact:**

            Disabling File Sharing prevents the system from being used as a file server, reducing its visibility and potential attack surface. For environments requiring file sharing, hardened servers should be used instead of user endpoints.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **File Sharing**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **File Sharing**.

            **Impact:**

            Disabling File Sharing prevents the system from being used as a file server, reducing its visibility and potential attack surface. For environments requiring file sharing, hardened servers should be used instead of user endpoints.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable File Sharing using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable File Sharing
              hosts: all
              become: true
              tasks:
                - name: Disable the SMB daemon
                  ansible.builtin.command: launchctl disable system/com.apple.smbd
                - name: Stop the SMB daemon
                  ansible.builtin.command: launchctl bootout system/com.apple.smbd
                  register: bootout_result
                  failed_when: false
                  changed_when: bootout_result.rc == 0
            ```

            The `bootout` task exits non-zero harmlessly when the daemon is not running; that failure is suppressed with `failed_when: false`, and `changed` is reported only when it actually stops the service. The `disable` task runs `launchctl` through `ansible.builtin.command`, which always reports `changed` even when the daemon is already disabled, so this playbook is not fully idempotent.

            **Impact:**

            Disabling File Sharing prevents the system from being used as a file server, reducing its visibility and potential attack surface. For environments requiring file sharing, hardened servers should be used instead of user endpoints.
