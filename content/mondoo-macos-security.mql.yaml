  - uid: mondoo-macos-security-disable-remote-apple-events
    title: Disable Remote Apple Events
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.systemsetup.remoteAppleEvents == "Off"
    docs:
      desc: |
        This check verifies that Remote Apple Events is turned off.

        Remote Apple Events lets applications on other machines send AppleScript commands to applications on this Mac, driving them as though a local script were doing it. The check reads `macos.systemsetup.remoteAppleEvents`, which must be `Off`.

        **Why this matters**

        AppleScript is an automation language with reach across the whole desktop. It can read and send mail, open and modify documents, drive the browser, take screenshots, and in many applications execute arbitrary shell commands through a scripting interface. Remote Apple Events exposes that capability to the network.

        The result is a remote control channel that does not look like one. Commands arrive as application events rather than as a login, so there is no shell session, no SSH connection, and nothing in the places an investigator would normally look for remote access. The actions appear to have been performed by the user, in their own applications, with their own permissions and their own access to whatever those applications hold.

        Almost no modern workflow uses this. Where cross-machine automation is required, use a mechanism with its own authentication and logging rather than one that grants scripting access to every application on the desktop.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Remote Apple Events** setting.

        A passing result shows **Remote Apple Events** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the Remote Apple Events status:

           ```bash
           sudo systemsetup -getremoteappleevents
           ```

        A passing result returns `Remote Apple Events: Off`. A failing result returns `Remote Apple Events: On`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Remote Apple Events:

            ```bash
            sudo systemsetup -setremoteappleevents off
            ```

            On macOS 13 and later, the terminal application running this command must be granted Full Disk Access in System Settings under Privacy & Security. Without it, `systemsetup` cannot change the setting.

            **Impact:**

            With Remote Apple Events enabled, an AppleScript program running on another Mac can interact with the local computer, potentially leading to unauthorized access or misuse.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Remote Apple Events**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Remote Apple Events**.

            **Impact:**

            With Remote Apple Events enabled, an AppleScript program running on another Mac can interact with the local computer, potentially leading to unauthorized access or misuse.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Remote Apple Events using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Remote Apple Events
              hosts: all
              become: true
              tasks:
                - name: Disable Remote Apple Events
                  ansible.builtin.command: systemsetup -setremoteappleevents off
            ```

            **Impact:**

            With Remote Apple Events enabled, an AppleScript program running on another Mac can interact with the local computer, potentially leading to unauthorized access or misuse.
