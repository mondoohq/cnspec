  - uid: mondoo-macos-security-reduce-the-sudo-timeout-period
    title: Reduce the sudo timeout period
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      sudoers.defaults.where(parameter == "timestamp_timeout") != empty
      sudoers.defaults.where(parameter == "timestamp_timeout").all(value == "0")
    docs:
      desc: |
        This check verifies that `sudo` requires a password every time rather than caching the authentication.

        After a successful `sudo`, macOS normally caches the authorization for five minutes, during which further `sudo` commands run without prompting. The check reads the `timestamp_timeout` default in the sudoers configuration, which must be present and set to `0`.

        **Why this matters**

        The cached authorization is not attached to the person, it is attached to the terminal session. For as long as it lasts, anything that can write to that session runs privileged commands without a password.

        That is the exposure in both the physical and the software case. A user who authenticates and then steps away leaves a terminal from which anyone at the keyboard has administrative access with no credential. And malicious code already running as the user can watch for the cached timestamp and issue its own privileged commands during the window, escalating without ever needing to capture the password or present a prompt the user might find suspicious.

        macOS defaults to a five minute window, which is ample time for either.

        Setting the timeout to `0` means one password prompt per privileged command. That is a real friction cost for administrators doing sustained work, and it is the trade this control makes deliberately: privilege escalation should require an explicit act each time rather than being inherited from something that happened minutes ago.
      audit: |
        Verify the sudo authentication timeout from the macOS shell.

        1. Open the **Terminal** app.
        2. Display the sudo configuration:

           ```bash
           sudo -V | grep "Authentication timestamp timeout"
           ```

        A passing result reports `Authentication timestamp timeout: 0.0 minutes`. A failing result reports a non-zero timeout.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            This is an interactive editor procedure rather than a single runnable command. Open the sudoers file with `visudo`, which checks the syntax when you save so a typo cannot be written out and silently break every `sudo` invocation:

            ```bash
            sudo visudo
            ```

            Add the following line under the `Override built-in defaults` section:

            ```bash
            Defaults timestamp_timeout=0
            ```

            Save and exit. If `visudo` reports a syntax error, return to the editor and correct it. Do not bypass that validation, because a malformed sudoers file can lock out all privileged access. Keep your existing root or `sudo` session open in a separate terminal until you have confirmed that `sudo` still works in a fresh session.

            **Impact:**

            Reducing the sudo timeout period to zero may inconvenience users who frequently use sudo commands, as they will need to re-enter their password for each command. Organizations should weigh the security benefits against the potential impact on user productivity and consider alternative measures if necessary.
        - id: ansible
          desc: |
            **Using Ansible**

            To reduce the sudo timeout period using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Reduce sudo timeout period
              hosts: all
              become: true
              tasks:
                - name: Add sudo timestamp timeout setting
                  ansible.builtin.lineinfile:
                    path: /etc/sudoers
                    line: 'Defaults timestamp_timeout=0'
                    validate: 'visudo -cf %s'
                    state: present
            ```

            **Impact:**

            Reducing the sudo timeout period to zero may inconvenience users who frequently use sudo commands, as they will need to re-enter their password for each command. Organizations should weigh the security benefits against the potential impact on user productivity and consider alternative measures if necessary.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-retain-install-log-for-365-or-more-days
    title: Retain install.log for 365 or more days with no maximum size
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      file('/etc/asl/com.apple.install') {
        content != /all_max/
        content == /ttl=(36[5-9]|3[7-9]\d|[4-9]\d{2}|[1-9]\d{3,})/
      }
    docs:
      desc: |
        This check verifies that macOS keeps a year of software installation history.

        `install.log` records software installation and removal, including operating system updates, applications, and packages installed by administrators or by installers a user ran. The check reads `/etc/asl/com.apple.install`, which must set `ttl` to `365` or higher and must not impose a maximum size.

        **Why this matters**

        This log answers what was installed on the machine and when, which after a compromise is often the single most useful question. Malicious software on macOS usually arrives through an installer, so the record of that installation is the pivot from noticing a problem to knowing when it started and what else arrived alongside it.

        The default retention is far shorter than the interval at which compromises are discovered. By the time an investigation begins, a short window has already discarded the entry describing the installation, and what remains shows a machine with something on it and no account of how it got there.

        Removing the size cap matters as much as the age. A size-bounded log discards on volume rather than on time, so a busy period of legitimate installation activity silently pushes out older entries, and an attacker can produce that volume deliberately.

        A year of installation history is a small amount of disk for a record that is frequently the starting point of an investigation.
      audit: |
        Verify the install log retention policy from the macOS shell.

        1. Open the **Terminal** app.
        2. Display the install log configuration:

           ```bash
           cat /etc/asl/com.apple.install
           ```

        A passing result shows the `file` line with `ttl` set to `365` or greater and no `all_max` setting. A failing result shows a shorter `ttl`, a missing `ttl`, or an `all_max` value present.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to set the install log retention policy:

            ```bash
            sudo vi /etc/asl/com.apple.install
            ```

            Add or modify the `ttl` value to `365` or greater on the `file` line, and remove the `all_max=` setting and value from the `file` line.

            **Impact:**

            Without proper log retention, system maintenance and security forensics cannot be effectively performed. Ensure sufficient storage is available to accommodate the extended retention period.
        - id: ansible
          desc: |
            **Using Ansible**

            To set the install log retention policy using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Set install log retention policy
              hosts: all
              become: true
              tasks:
                - name: Set install log retention policy to 365 days
                  ansible.builtin.replace:
                    path: /etc/asl/com.apple.install
                    regexp: '(^\* file .*)ttl=\d+(\s*)$'
                    replace: '\1ttl=365\2'
                    backup: yes
                - name: Remove any all_max= entries from the file
                  ansible.builtin.replace:
                    path: /etc/asl/com.apple.install
                    regexp: '\s*all_max=[^\s]+'
                    replace: ''
            ```

            **Impact:**

            Without proper log retention, system maintenance and security forensics cannot be effectively performed. Ensure sufficient storage is available to accommodate the extended retention period.
    refs:
      - url: https://support.apple.com/guide/security/welcome/web
        title: Apple Platform Security Guide
  - uid: mondoo-macos-security-set-a-minimum-password-length
    title: Set a minimum password length
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      users.where(name != /^_/ && shell != "/usr/bin/false" && name != "root") {
        name
        filePath1 = "/Library/Managed Preferences/" + name + "/complete.plist"
        a = file(filePath1).exists == true && [filePath1].where(file(_).exists) {
          parse.plist(filePath1).params["com.apple.mobiledevice.passwordpolicy"]["minLength"]["value"] != empty &&
            parse.plist(filePath1).params["com.apple.mobiledevice.passwordpolicy"]["minLength"]["value"] >= 15
        }
        b = macos.globalAccountPolicies['policyCategoryPasswordContent'] != empty &&
          macos.globalAccountPolicies['policyCategoryPasswordContent'].any(_['policyParameters']['minimumLength'] >= 15)
        filePath2 = "/Library/Managed Preferences/com.apple.mobiledevice.passwordpolicy.plist"
        c = file(filePath2).exists == true &&
          parse.plist(filePath2).params["minLength"] >= 15
        a || b || c
      }
    docs:
      desc: |
        This check verifies that a minimum password length is enforced for user accounts.

        The minimum length is the shortest password macOS will accept when one is set or changed. The check reads the `minLength` policy from the managed preferences applied to each non-system user account.

        **Why this matters**

        Length is the property that determines how long a password survives an offline attack, and it dominates every other rule. Each additional character multiplies the search space, while complexity requirements mostly change which predictable substitutions users make.

        The attack this defends against is offline. An attacker who obtains the password hashes from a Mac, whether by taking the machine or by escalating on it, attacks them at whatever rate their hardware allows, with no lockout, no rate limiting, and no record of the attempts. Modern graphics hardware works through the entire space of short passwords in a time measured in hours. Length is what moves the answer from hours to something impractical.

        Short passwords are also what make credential stuffing work. A password short enough to be cracked quickly on one machine is a password that will be tried against every other system the person uses.

        Set the minimum to at least fifteen characters and encourage passphrases, which reach that length without becoming unmemorable, rather than layering complexity rules onto a short password.
      audit: |
        Verify the minimum password length from the macOS shell.

        1. Open the **Terminal** app.
        2. Read the account policies, which is where macOS records a policy delivered by a configuration profile:

           ```bash
           pwpolicy -getaccountpolicies
           ```

        3. Read the legacy global policy, which still applies on hosts configured before account policies replaced it:

           ```bash
           pwpolicy -n /Local/Default -getglobalpolicy
           ```

        A passing result shows a `policyCategoryPasswordContent` entry with a `minimumLength` of 15 or greater, or `minChars` set to `15` or greater. A failing result shows a smaller value or no minimum length policy. Apple marks the global policy commands deprecated, so on a Mac whose policy arrives by configuration profile the legacy command prints nothing and only the account policies show the setting.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to set a minimum password length of 15 characters:

            ```bash
            sudo pwpolicy -n /Local/Default -setglobalpolicy "minChars=15"
            ```

            Apple marks `-setglobalpolicy` deprecated in favor of account policies. On a managed Mac, deploy an MDM passcode configuration profile that sets `minLength` to 15 or more, which is the form macOS records and reports through `pwpolicy -getaccountpolicies`.

            **Impact:**

            Enforcing a minimum password length may inconvenience users accustomed to shorter passwords. However, the security benefits outweigh the potential inconvenience, especially in environments handling sensitive data.

            **Note:** This setting cannot be configured through System Settings. Use the CLI command above or deploy an MDM configuration profile to enforce minimum password length policies.
        - id: ansible
          desc: |
            **Using Ansible**

            To set a minimum password length of 15 characters using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Set minimum password length
              hosts: all
              become: true
              tasks:
                - name: Set minimum password length to 15 characters
                  ansible.builtin.command: pwpolicy -n /Local/Default -setglobalpolicy "minChars=15"
            ```

            **Impact:**

            Enforcing a minimum password length may inconvenience users accustomed to shorter passwords. However, the security benefits outweigh the potential inconvenience, especially in environments handling sensitive data.
    refs:
      - url: https://support.apple.com/guide/mac-help/change-lock-screen-settings-mchlp2996/mac
        title: Apple - Lock Screen Settings
  - uid: mondoo-macos-security-software-updates-automatic-check-enabled
    title: Ensure automatic checking of software updates enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.softwareupdate.autoCheckEnabled == true
    docs:
      desc: |
        This check verifies that the Mac checks for software updates automatically.

        Automatic checking makes the machine contact Apple's update service on a schedule to learn whether updates are available, rather than waiting for someone to look. The check reads `macos.softwareupdate.autoCheckEnabled`, which must be `true`.

        **Why this matters**

        Every other part of the update process depends on this one. A Mac that does not check does not know an update exists, so it will not download it, will not install it, and will not tell the user or the management platform that anything is outstanding. The machine reports nothing wrong while falling further behind.

        That silence is what makes the setting matter more than it appears. An unpatched machine that is visibly unpatched gets attention. One that has stopped checking looks the same as one that is fully current, and the gap can run for months before anything reveals it.

        The exposure that accumulates in that time is not theoretical. Apple's security updates address vulnerabilities that are already being exploited often enough that the company ships out-of-band fixes for them, and the details become public when the update does, which is the point at which unpatched machines become straightforward targets.

        Enable checking, and pair it with automatic download and automatic installation of critical updates so that discovery leads to action.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Software Update**.
        3. Select the info button next to **Automatic updates** and review **Check for updates**.

        A passing result shows **Check for updates** turned on. A failing result shows it turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Read the automatic check preference:

           ```bash
           defaults read /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled
           ```

        A passing result returns `1`. A failing result returns `0`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable automatic update checks:

            ```bash
            sudo /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled -bool true
            ```

            **Impact:**

            Enabling automatic update checks ensures that the system stays informed about available updates. However, users must still manually approve or install updates unless additional automatic update settings are enabled.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Software Update**
            4. Select the info button next to **Automatic updates**
            5. Turn on **Check for updates**

            On macOS 12 and earlier, open **System Preferences**, select **Software Update**, select **Advanced**, and enable **Check for updates**.

            **Impact:**

            Enabling automatic update checks ensures that the system stays informed about available updates. However, users must still manually approve or install updates unless additional automatic update settings are enabled.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable automatic update checks using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Enable automatic update checks
              hosts: all
              become: true
              tasks:
                - name: Enable automatic update checks
                  ansible.builtin.command: /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled -bool true
            ```

            **Impact:**

            Enabling automatic update checks ensures that the system stays informed about available updates. However, users must still manually approve or install updates unless additional automatic update settings are enabled.
    refs:
      - url: https://support.apple.com/guide/mac-help/keep-your-mac-up-to-date-mchlpx1065/mac
        title: Apple - Keep Your Mac Up to Date
  - uid: mondoo-macos-security-software-updates-automatic-download
    title: Ensure automatic download of software updates enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.softwareupdate.autoDownloadEnabled == true
    docs:
      desc: |
        This check verifies that the Mac downloads available software updates automatically.

        Automatic download retrieves updates in the background once they are found, so the files are already present when the update is installed. The check reads `macos.softwareupdate.autoDownloadEnabled`, which must be `true`.

        **Why this matters**

        Downloading is where update processes stall in practice. When the download only begins after the user agrees to install, the prompt arrives carrying a wait of tens of minutes, and it arrives while they are working. The reliable outcome is that the update is deferred, and then deferred again, and the machine stays vulnerable not because anyone decided against patching but because the moment was never convenient.

        Pre-downloading removes that. The transfer happens in the background over whatever time it needs, and when the user is asked to install, the cost of saying yes is a restart rather than a restart plus a download.

        It also removes a dependency on the network at the moment of installation. A laptop that has already fetched an update can apply it on a slow hotel connection or a tethered phone, which is frequently exactly when the user finally has time to restart.

        Enable automatic download alongside automatic checking. Checking without downloading produces a machine that knows it is out of date and stays that way.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Software Update**.
        3. Select the info button next to **Automatic updates** and review **Download new updates when available**.

        A passing result shows **Download new updates when available** turned on. A failing result shows it turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Read the automatic download preference:

           ```bash
           defaults read /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload
           ```

        A passing result returns `1`. A failing result returns `0`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to enable automatic downloads:

            ```bash
            sudo /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload -bool true
            ```

            **Impact:**

            Enabling automatic downloads ensures that updates are readily available for installation. However, users must still manually approve or install updates unless additional automatic update settings are enabled.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Software Update**
            4. Select the info button next to **Automatic updates**
            5. Turn on **Download new updates when available**

            On macOS 12 and earlier, open **System Preferences**, select **Software Update**, select **Advanced**, and enable **Download new updates when available**.

            **Impact:**

            Enabling automatic downloads ensures that updates are readily available for installation. However, users must still manually approve or install updates unless additional automatic update settings are enabled.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable automatic downloads using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Enable automatic downloads of software updates
              hosts: all
              become: true
              tasks:
                - name: Enable automatic downloads of software updates
                  ansible.builtin.command: /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload -bool true
            ```

            **Impact:**

            Enabling automatic downloads ensures that updates are readily available for installation. However, users must still manually approve or install updates unless additional automatic update settings are enabled.
    refs:
      - url: https://support.apple.com/guide/mac-help/keep-your-mac-up-to-date-mchlpx1065/mac
        title: Apple - Keep Your Mac Up to Date
  - uid: mondoo-macos-security-software-updates-install-critical-updates
    title: Ensure critical updates are installed automatically
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      macos.softwareupdate.installSystemDataFiles == true
      macos.softwareupdate.installSecurityResponses == true
    docs:
      desc: |
        This check verifies that the Mac installs Apple's urgent security content automatically.

        Two channels deliver protection without a full software update: system data files carry the XProtect malware definitions, and Security Responses ship urgent fixes between releases. The check reads `macos.softwareupdate.installSystemDataFiles` and `macos.softwareupdate.installSecurityResponses`, both of which must be `true`.

        **Why this matters**

        These two channels exist precisely because the normal update cycle is too slow for the situations they address.

        XProtect definitions are how macOS recognizes known malware at launch. Apple updates them as new families appear, and the update is small, requires no restart, and is useless if it does not arrive. A machine that does not take these automatically is checking downloads against a signature set that is however many weeks old the last full update was.

        Security Responses are shipped when a vulnerability is being exploited in the wild and Apple is not prepared to wait for the next release. The window that matters for one of these is measured in days, and manual application does not happen in that window across an estate.

        Neither channel requires the disruption that discourages users from installing updates. There is very little reason to leave them off.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Software Update**.
        3. Select the info button next to **Automatic updates** and review **Install Security Responses and system files**.

        A passing result shows **Install Security Responses and system files** turned on. A failing result shows it turned off.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Read the critical update preferences:

           ```bash
           defaults read /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall
           defaults read /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall
           ```

        A passing result returns `1` for both keys. A failing result returns `0` for either key.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run these commands to enable automatic installation of system data files and critical security updates:

            ```bash
            sudo /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall -bool true
            sudo /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall -bool true
            ```

            Both keys are required: `ConfigDataInstall` controls system data files such as XProtect definitions, and `CriticalUpdateInstall` controls security responses.

            **Impact:**

            Enabling automatic installation of critical updates ensures that essential patches are applied without user intervention. However, users should monitor update logs to verify successful installations and address any issues promptly.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Software Update**
            4. Select the info button next to **Automatic updates**
            5. Turn on **Install Security Responses and system files**

            On macOS 12 and earlier, open **System Preferences**, select **Software Update**, select **Advanced**, and enable **Install system data files and security updates**.

            **Impact:**

            Enabling automatic installation of critical updates ensures that essential patches are applied without user intervention. However, users should monitor update logs to verify successful installations and address any issues promptly.
        - id: ansible
          desc: |
            **Using Ansible**

            To enable automatic installation of critical updates using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Enable automatic installation of critical updates
              hosts: all
              become: true
              tasks:
                - name: Enable automatic installation of system data files
                  ansible.builtin.command: /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall -bool true
                - name: Enable automatic installation of security responses
                  ansible.builtin.command: /usr/bin/defaults write /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall -bool true
            ```

            **Impact:**

            Enabling automatic installation of critical updates ensures that essential patches are applied without user intervention. However, users should monitor update logs to verify successful installations and address any issues promptly.
