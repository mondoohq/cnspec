  - uid: mondoo-macos-security-disable-printer-sharing
    title: Disable Printer Sharing
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.printerSharing == false
    docs:
      desc: |
        This check verifies that Printer Sharing is turned off.

        Printer Sharing re-exports printers attached to this Mac so that other machines on the network can print through it, using the CUPS printing system. The check reads `macos.sharing.printerSharing`, which must be `false`.

        **Why this matters**

        Enabling the feature starts a CUPS server on the Mac and opens it to the network. CUPS is a considerably larger piece of software than the task suggests, with its own network protocol, its own web administration interface, and a history of remotely reachable vulnerabilities, including a 2024 chain in which an attacker who could reach the printing service could get commands to run when a print job was subsequently sent.

        That server then follows the laptop onto every network it joins, including untrusted ones, where the peers who can reach it are strangers.

        Print jobs themselves carry content. A shared printer means documents from other users transit and are spooled on this machine, so material belonging to other people ends up in temporary files on a workstation that was not chosen to hold it.

        Print to network printers directly or through a managed print server. Turn Printer Sharing off.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Printer Sharing** setting.

        A passing result shows **Printer Sharing** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Query the CUPS printer sharing setting:

           ```bash
           cupsctl | grep _share_printers
           ```

        A passing result returns `_share_printers=0`. A failing result returns `_share_printers=1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Printer Sharing:

            ```bash
            sudo cupsctl --no-share-printers
            ```

            **Impact:**

            Disabling Printer Sharing prevents the system from being used as a print server. For environments requiring shared printing, dedicated print servers or direct IP printing should be used instead.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Printer Sharing**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Printer Sharing**.

            **Impact:**

            Disabling Printer Sharing prevents the system from being used as a print server. For environments requiring shared printing, dedicated print servers or direct IP printing should be used instead.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Printer Sharing using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Printer Sharing
              hosts: all
              become: true
              tasks:
                - name: Disable Printer Sharing
                  ansible.builtin.command: cupsctl --no-share-printers
            ```

            **Impact:**

            Disabling Printer Sharing prevents the system from being used as a print server. For environments requiring shared printing, dedicated print servers or direct IP printing should be used instead.
