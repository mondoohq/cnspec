  - uid: mondoo-macos-security-disable-internet-sharing
    title: Disable Internet Sharing
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: macos.sharing.internetSharing == false
    docs:
      desc: |
        This check verifies that Internet Sharing is turned off.

        Internet Sharing turns a Mac into a router and wireless access point, forwarding traffic from devices that connect to it out through one of its own network interfaces. The check reads `macos.sharing.internetSharing`, which must be `false`.

        **Why this matters**

        A machine sharing its connection is bridging two networks, and on a corporate laptop one of those networks is the corporate one. Any device that associates with the Mac reaches whatever the Mac can reach, without passing through the network access control, firewalls, or monitoring that every other device on that network had to satisfy.

        That is an unmanaged entry point into the internal network, created by a user, invisible to the network team, and moving around the building. The devices connecting through it are by definition ones that could not or did not join the network normally.

        The access point it creates is also a target in its own right. It is configured by the user rather than by the network team, so its encryption and passphrase are whatever the sharing dialog defaulted to.

        Where a device genuinely needs connectivity, put it on a guest network. Internet Sharing should stay off on managed machines.
      audit: |
        ### Audit via System Settings

        1. Open **System Settings**.
        2. Select **General**, then **Sharing**.
        3. Review the **Internet Sharing** setting.

        A passing result shows **Internet Sharing** turned off. A failing result shows it turned on.

        ### Audit via CLI

        1. Open the **Terminal** app.
        2. Read the NAT preference:

           ```bash
           defaults read /Library/Preferences/SystemConfiguration/com.apple.nat NAT
           ```

        A passing result reports `Enabled = 0` or that the file does not exist. A failing result reports `Enabled = 1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Run this command to disable Internet Sharing:

            ```bash
            sudo defaults write /Library/Preferences/SystemConfiguration/com.apple.nat NAT -dict Enabled -int 0
            ```

            **Impact:**

            Disabling Internet Sharing prevents the system from being used as a router, reducing its visibility and potential attack surface. For environments requiring internet sharing, dedicated routers or firewalls should be used instead of user endpoints.
        - id: gui
          desc: |
            **Using the GUI**

            1. Open **System Settings**
            2. Select **General**
            3. Select **Sharing**
            4. Turn off **Internet Sharing**

            On macOS 12 and earlier, open **System Preferences**, select **Sharing**, and uncheck **Internet Sharing**.

            **Impact:**

            Disabling Internet Sharing prevents the system from being used as a router, reducing its visibility and potential attack surface. For environments requiring internet sharing, dedicated routers or firewalls should be used instead of user endpoints.
        - id: ansible
          desc: |
            **Using Ansible**

            To disable Internet Sharing using Ansible, you can use the following playbook:

            ```yaml
            ---
            - name: Disable Internet Sharing
              hosts: all
              become: true
              tasks:
                - name: Disable Internet Sharing
                  ansible.builtin.command: defaults write /Library/Preferences/SystemConfiguration/com.apple.nat NAT -dict Enabled -int 0
            ```

            **Impact:**

            Disabling Internet Sharing prevents the system from being used as a router, reducing its visibility and potential attack surface. For environments requiring internet sharing, dedicated routers or firewalls should be used instead of user endpoints.
