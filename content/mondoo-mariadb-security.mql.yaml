policies:
  - uid: mondoo-mariadb-security
    name: Mondoo MariaDB Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: linux,mariadb
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden MariaDB server networking, authentication, encryption, and audit logging
    docs:
      desc: |
        The Mondoo MariaDB Security policy assesses the on-disk option files of a self-managed MariaDB installation. It reads the option file chain, resolving the `!include` and `!includedir` directives so every fragment contributes, and normalizes option names so `-` and `_` are interchangeable exactly as the server treats them.

        This policy provides security checks across eight areas:

        - Connection surface and network exposure
        - Transport encryption and certificate material
        - Password policy enforced by the MariaDB password plugins
        - Filesystem privileges and server-side code execution
        - Error logging and the server audit plugin
        - Encryption at rest for tables, logs, and temporary files
        - Galera cluster replication security
        - Protection of option files and the credentials they hold

        **Scope and limitations**

        This policy reads configuration as it is written to disk. It does not open a SQL connection to the server, so it cannot assess accounts, granted privileges, or the effective value of a dynamic variable. Checks describe the configuration the server would load on its next restart.

        MySQL and Percona Server are covered by the Mondoo MySQL Security policy instead. Although the two products share an option file format, their security options differ substantially: MariaDB enforces password rules through the `simple_password_check` and `password_reuse_check` plugins rather than a `validate_password` component, audits through the `server_audit` plugin rather than an audit log plugin, and adds encryption and Galera cluster options that have no MySQL equivalent. The underlying resource returns nothing on a host running MySQL, so the checks here do not apply to those servers.

        Learn more about scanning Linux in the [cnspec Linux documentation](https://mondoo.com/docs/cnspec/os/linux).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Connection and Network Exposure
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-bind-address-restricted
          - uid: mondoo-mariadb-security-skip-name-resolve-enabled
          - uid: mondoo-mariadb-security-skip-show-database-enabled
      - title: Transport Encryption
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-require-secure-transport-enabled
          - uid: mondoo-mariadb-security-tls-version-modern
          - uid: mondoo-mariadb-security-server-certificate-configured
          - uid: mondoo-mariadb-security-client-ca-configured
      - title: Authentication and Password Policy
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-skip-grant-tables-disabled
          - uid: mondoo-mariadb-security-simple-password-check-plugin-loaded
          - uid: mondoo-mariadb-security-simple-password-check-length-sufficient
          - uid: mondoo-mariadb-security-simple-password-check-composition-required
          - uid: mondoo-mariadb-security-password-reuse-check-configured
      - title: Filesystem Privileges and Code Execution
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-runs-as-dedicated-account
          - uid: mondoo-mariadb-security-local-infile-disabled
          - uid: mondoo-mariadb-security-secure-file-priv-restricted
          - uid: mondoo-mariadb-security-symbolic-links-disabled
          - uid: mondoo-mariadb-security-allow-suspicious-udfs-disabled
          - uid: mondoo-mariadb-security-log-bin-trust-function-creators-disabled
          - uid: mondoo-mariadb-security-automatic-sp-privileges-disabled
      - title: Logging and Audit
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-error-log-configured
          - uid: mondoo-mariadb-security-log-warnings-includes-warnings
          - uid: mondoo-mariadb-security-log-output-retained
          - uid: mondoo-mariadb-security-general-log-disabled
          - uid: mondoo-mariadb-security-server-audit-logging-enabled
          - uid: mondoo-mariadb-security-server-audit-events-cover-connect-and-query
          - uid: mondoo-mariadb-security-server-audit-no-excluded-users
      - title: Encryption at Rest
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-innodb-encrypt-tables-enforced
          - uid: mondoo-mariadb-security-innodb-encrypt-log-enabled
          - uid: mondoo-mariadb-security-encrypt-binlog-enabled
          - uid: mondoo-mariadb-security-encrypt-tmp-disk-tables-enabled
          - uid: mondoo-mariadb-security-file-key-management-configured
          - uid: mondoo-mariadb-security-file-key-management-key-file-protected
      - title: Galera Cluster Replication
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-galera-replication-encrypted
          - uid: mondoo-mariadb-security-galera-sst-method-secure
      - title: Credential and Option File Protection
        filters: |
          asset.family.contains("linux") &&
          mariadb.conf.file.exists
        checks:
          - uid: mondoo-mariadb-security-client-options-no-plaintext-password
          - uid: mondoo-mariadb-security-option-files-restricted-permissions
          - uid: mondoo-mariadb-security-user-option-files-protected
queries:
  - uid: mondoo-mariadb-security-bind-address-restricted
    title: Ensure bind_address does not expose MariaDB on every interface
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mariadb.conf.bindAddress.none(_ == "*" || _ == "0.0.0.0" || _ == "::")
    docs:
      desc: |
        This check verifies that the server answers TCP connections only on addresses an administrator has named, rather than on every interface the host happens to have.

        `bind_address` is written as `bind-address` under the `[mysqld]` group of the server option file, typically `/etc/mysql/mariadb.conf.d/50-server.cnf` or a fragment under `/etc/my.cnf.d`. It takes a comma-separated list of addresses. The check fails the wildcard forms `*`, `0.0.0.0`, and `::`, and it also fails an installation that never sets the option, because an unset value means the same thing. The option cannot be changed at runtime, so it has to be written to the option file and the server restarted.

        **Why this matters**

        An unrestricted listener is found by scanning, not by targeting. Anyone with a route to the host sweeps port 3306, gets a version banner from the handshake, and starts guessing passwords against accounts defined for `'%'`. The database never had to be advertised anywhere for this to begin.

        The distinction that carries the weight here is local socket against network. Applications on the same host reach MariaDB over its Unix socket and need no TCP listener at all, so on a single-host deployment the listener is pure exposure. Where nothing off-box needs to connect, `skip_networking` removes the TCP listener entirely and is stronger than any address list.

        Binding narrowly also keeps a firewall mistake from becoming an immediate breach. A security group opened one rule too wide reaches a database that still refuses the packet, because the server was never listening on that address.

        Replicas, cluster members, and application tiers on other hosts legitimately need a network listener. Name the private address they reach the server on and leave the rest of the host's interfaces alone.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'bind_address';"
        ```

        2. Confirm which addresses the server is actually bound to:

        ```bash
        sudo ss -lntp | grep mariadbd
        ```

        A passing result names specific addresses such as `127.0.0.1` or a private address. A failing result reports `*`, `0.0.0.0`, or `::`, or shows the server listening on `0.0.0.0:3306`.
      remediation:
        - id: cli
          desc: |
            To bind MariaDB to specific addresses using the CLI:

            1. Set `bind-address` in the server option file.
            2. Restart MariaDB, because this option cannot be changed at runtime.
            3. Confirm the resulting listeners.

            ```bash
            sudo sed -i -E "/^\s*#?\s*bind-address/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nbind-address = 127.0.0.1,10.0.0.5\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo ss -lntp | grep mariadbd
            ```
        - id: script
          desc: |
            To bind MariaDB to specific addresses using a bash script:

            1. Set the addresses the server must serve.
            2. Replace an existing option or append one under the server group.
            3. Restart MariaDB and report the resulting listeners.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            ADDRESSES="127.0.0.1,10.0.0.5"

            if grep -qE "^\s*bind[-_]address" "$MYCNF"; then
              sed -i "s|^\s*bind[-_]address.*|bind-address = ${ADDRESSES}|" "$MYCNF"
            else
              printf "[mysqld]\nbind-address = %s\n" "$ADDRESSES" >>"$MYCNF"
            fi

            systemctl restart mariadb
            ss -lntp | grep mariadbd
            ```
        - id: ansible
          desc: |
            To bind MariaDB to specific addresses using Ansible:

            1. Set `bind-address` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restrict the MariaDB bind address
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_bind_address: "127.0.0.1,10.0.0.5"
              tasks:
                - name: Set bind-address
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: bind-address
                    value: "{{ mariadb_bind_address }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-skip-name-resolve-enabled
    title: Ensure skip_name_resolve is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-15
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mariadb.conf.skipNameResolve == true
    docs:
      desc: |
        This check verifies that the server decides which account a connection matches from the client's IP address alone, without consulting a naming service.

        `skip_name_resolve` belongs under `[mysqld]` in the server option file. When it is off, MariaDB performs a reverse lookup on every incoming connection and matches the answer against the host part of each account. An account defined as `'app'@'build.example.com'` is therefore authorized on the strength of whatever a resolver returns at the moment the connection arrives.

        **Why this matters**

        That turns DNS into part of the authorization decision. An attacker who controls the reverse record for an address they own, whether through a compromised resolver, a poisoned cache, or a delegated `in-addr.arpa` zone the organization forgot it delegated, points that record at a trusted name. Their connection from an untrusted address then matches an account scoped to a trusted host, and they authenticate as it. Nothing on the database side was compromised to make that work.

        It also removes a failure mode with nothing to do with attackers. Every connection waits on a resolver before it can proceed, so a slow or unreachable naming service stalls or refuses new connections while the database itself is healthy.

        Enabling this option changes which accounts match. Any account whose host part is a hostname stops matching anything at all once name resolution is off, so redefine those accounts against addresses or address patterns first. On MariaDB the account definitions live in `mysql.global_priv`, and the privilege each account holds is what has to be re-issued against the new host pattern before the option is set and the server restarted.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'skip_name_resolve';"
        ```

        2. Identify accounts still defined against a hostname rather than an address:

        ```bash
        sudo mariadb -e "SELECT user, host FROM mysql.global_priv WHERE host NOT REGEXP '^[0-9a-fA-F:.%]+$';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, and the second query lists accounts that must be redefined against addresses before the option is enabled.
      remediation:
        - id: cli
          desc: |
            To disable client hostname resolution using the CLI:

            1. Redefine any account scoped to a hostname so it names an address or address pattern.
            2. Set `skip_name_resolve` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo mariadb -e "SELECT user, host FROM mysql.global_priv WHERE host NOT REGEXP '^[0-9a-fA-F:.%]+$';"
            sudo sed -i -E "/^\s*#?\s*skip[-_]name[-_]resolve/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nskip_name_resolve = ON\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'skip_name_resolve';"
            ```
        - id: script
          desc: |
            To disable client hostname resolution using a bash script:

            1. Refuse to proceed while accounts are still scoped to hostnames, because they would stop matching.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            hostname_accounts=$(mariadb -N -B -e \
              "SELECT count(*) FROM mysql.global_priv WHERE host NOT REGEXP '^[0-9a-fA-F:.%]+\$';")

            if [ "$hostname_accounts" -gt 0 ]; then
              echo "$hostname_accounts account(s) are scoped to hostnames; redefine them first" >&2
              exit 1
            fi

            if grep -qE "^\s*skip[-_]name[-_]resolve" "$MYCNF"; then
              sed -i "s|^\s*skip[-_]name[-_]resolve.*|skip_name_resolve = ON|" "$MYCNF"
            else
              printf "[mysqld]\nskip_name_resolve = ON\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            ```
        - id: ansible
          desc: |
            To disable client hostname resolution using Ansible:

            1. Set `skip_name_resolve` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Disable MariaDB client hostname resolution
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set skip_name_resolve
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: skip_name_resolve
                    value: "ON"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-skip-show-database-enabled
    title: Ensure skip_show_database is enabled
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mariadb.conf.skipShowDatabase == true
    docs:
      desc: |
        This check verifies that listing the schemas on the server is a privilege an account has to be granted rather than something every authenticated connection can do.

        `skip_show_database` belongs under `[mysqld]` in the server option file. With it off, any account that authenticates can run `SHOW DATABASES` and receive every schema name on the server, including schemas it holds no privilege to read. With it on, the statement returns results only to accounts that hold the `SHOW DATABASES` privilege, so grant that privilege to the administrative accounts that genuinely need it before making the change.

        **Why this matters**

        Schema names are reconnaissance. An attacker who has obtained one low-privilege application credential, from a leaked configuration file or an injected query, runs the statement and learns the shape of the whole server: which other applications share it, which tenants or customers are named, whether `staging` and `prod` sit side by side, whether a schema called `billing` or `pii_archive` exists. That list is what decides where they spend their next effort, and it costs them a single statement.

        On a shared server the disclosure crosses a customer boundary. One tenant's compromised credential reveals the names of every other tenant on the instance, which is information those tenants never agreed to publish.

        Making catalog visibility a privilege rather than a default is the same argument as any other least-privilege decision, applied to metadata instead of rows. An account that can only read one schema has no reason to be told the others exist.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'skip_show_database';"
        ```

        2. Review which accounts hold the privilege that grants enumeration anyway:

        ```bash
        sudo mariadb -e "SELECT user, host FROM mysql.user WHERE Show_db_priv = 'Y';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning every authenticated account can enumerate all schemas.
      remediation:
        - id: cli
          desc: |
            To restrict schema enumeration using the CLI:

            1. Grant `SHOW DATABASES` to the administrative accounts that genuinely need it.
            2. Set `skip_show_database` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo mariadb -e "GRANT SHOW DATABASES ON *.* TO 'dba'@'10.0.0.%';"
            sudo sed -i -E "/^\s*#?\s*skip[-_]show[-_]database/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nskip_show_database = ON\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'skip_show_database';"
            ```
        - id: script
          desc: |
            To restrict schema enumeration using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            if grep -qE "^\s*skip[-_]show[-_]database" "$MYCNF"; then
              sed -i "s|^\s*skip[-_]show[-_]database.*|skip_show_database = ON|" "$MYCNF"
            else
              printf "[mysqld]\nskip_show_database = ON\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'skip_show_database';"
            ```
        - id: ansible
          desc: |
            To restrict schema enumeration using Ansible:

            1. Set `skip_show_database` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restrict MariaDB schema enumeration
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set skip_show_database
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: skip_show_database
                    value: "ON"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-require-secure-transport-enabled
    title: Ensure require_secure_transport is enabled
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mariadb.conf.requireSecureTransport == true
    docs:
      desc: |
        This check verifies that the server refuses any connection that is neither encrypted nor made over a local Unix socket.

        `require_secure_transport` belongs under `[mysqld]` in the server option file. Installing certificate material makes TLS available to clients that ask for it, but MariaDB still accepts a plain unencrypted TCP connection from a client that does not. This option removes the choice from the client: an unencrypted TCP connection is rejected at the handshake. Local socket connections still succeed, because they never cross a network.

        **Why this matters**

        Without it, a client library that defaults to no TLS, or one whose TLS configuration silently failed, connects in cleartext and nobody notices, because the connection works. Everything then crosses the network readable: the authentication exchange, the queries, and every row returned. An attacker with a tap on a switch, a compromised host on the same subnet running ARP spoofing, or access to a mirrored port captures a working database credential and then the data itself, without touching either endpoint.

        Per-account `REQUIRE SSL` clauses achieve the same outcome for the accounts that carry them, which is why they are not a substitute. They have to be remembered on every account, including the one a colleague creates during an incident at two in the morning, and one omission reopens the whole path.

        Enable this only once the server has usable certificate material. A server with no certificate that also refuses unencrypted transport refuses every remote connection, so a companion check in this policy on the certificate and key should be satisfied first. Because this reads the option file, a runtime change does not count: the value has to be written to the file to survive a restart.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'require_secure_transport';"
        ```

        2. Confirm the server has usable TLS material:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'have_ssl';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning unencrypted TCP connections are still accepted.
      remediation:
        - id: cli
          desc: |
            To require encrypted connections using the CLI:

            1. Confirm TLS material is configured and the server reports it is available.
            2. Set `require_secure_transport` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo mariadb -e "SHOW VARIABLES LIKE 'have_ssl';"
            sudo sed -i -E "/^\s*#?\s*require[-_]secure[-_]transport/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nrequire_secure_transport = ON\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'require_secure_transport';"
            ```
        - id: script
          desc: |
            To require encrypted connections using a bash script:

            1. Refuse to proceed unless the server has usable TLS material, because enabling the requirement would lock out every remote client.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            tls_state=$(mariadb -N -B -e "SELECT @@have_ssl;" 2>/dev/null || echo "UNKNOWN")
            if [ "$tls_state" != "YES" ]; then
              echo "server reports TLS availability as $tls_state; configure certificates first" >&2
              exit 1
            fi

            if grep -qE "^\s*require[-_]secure[-_]transport" "$MYCNF"; then
              sed -i "s|^\s*require[-_]secure[-_]transport.*|require_secure_transport = ON|" "$MYCNF"
            else
              printf "[mysqld]\nrequire_secure_transport = ON\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            ```
        - id: ansible
          desc: |
            To require encrypted connections using Ansible:

            1. Verify the server has usable TLS material.
            2. Set `require_secure_transport` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Require encrypted MariaDB connections
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Read TLS availability
                  ansible.builtin.command:
                    cmd: mariadb -N -B -e "SELECT @@have_ssl;"
                  changed_when: false
                  register: have_ssl

                - name: Fail when TLS material is missing
                  ansible.builtin.fail:
                    msg: "Configure ssl_cert and ssl_key before requiring secure transport."
                  when: have_ssl.stdout | trim != "YES"

                - name: Set require_secure_transport
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: require_secure_transport
                    value: "ON"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-tls-version-modern
    title: Ensure tls_version excludes TLS 1.0 and TLS 1.1
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mariadb.conf.tlsVersion != empty
      mariadb.conf.tlsVersion.none(_.downcase == "tlsv1" || _.downcase == "tlsv1.1")
    docs:
      desc: |
        This check verifies that the server offers only modern TLS versions, and that the accepted set is stated in configuration rather than inherited from the build.

        `tls_version` belongs under `[mysqld]` in the server option file and takes a comma-separated list such as `TLSv1.2,TLSv1.3`. The check fails when the option is unset and when the list names `TLSv1` or `TLSv1.1`. TLS 1.0 and TLS 1.1 rely on obsolete hashing and cipher constructions, have no authenticated encryption modes, and are not adequate for carrying authentication material.

        **Why this matters**

        A version the server still offers is a version an attacker can steer the handshake toward. An interposed attacker who can modify packets in flight tampers with the client hello so the negotiation lands on TLS 1.0, then attacks the weaker construction rather than the strong one the client was willing to use. The client sees an encrypted connection throughout. Removing the old versions from the server's offer is what makes that impossible, because there is nothing to downgrade to.

        Leaving the option unset does not mean the server is strict. It means the accepted set comes from whatever the build was compiled against, which differs between distributions, between MariaDB releases, and between a package upgrade and the version it replaced. A server that was strict last year can quietly widen after a routine upgrade, and nothing in the configuration records that it changed.

        Confirm that every client library in use negotiates TLS 1.2 or above before restricting the list, because an old connector pinned to TLS 1.0 stops connecting the moment the server stops offering it.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'tls_version';"
        ```

        2. Confirm which version connections actually negotiate:

        ```bash
        sudo mariadb -e "SHOW SESSION STATUS LIKE 'Ssl_version';"
        ```

        A passing result names only `TLSv1.2` and `TLSv1.3`. A failing result includes `TLSv1` or `TLSv1.1`, or is unset so the compiled-in default applies.
      remediation:
        - id: cli
          desc: |
            To restrict accepted TLS versions using the CLI:

            1. Confirm every client library supports TLS 1.2 or above.
            2. Set `tls_version` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*tls[-_]version/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\ntls_version = TLSv1.2,TLSv1.3\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'tls_version';"
            ```
        - id: script
          desc: |
            To restrict accepted TLS versions using a bash script:

            1. Define the accepted versions.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            VERSIONS="TLSv1.2,TLSv1.3"

            if grep -qE "^\s*tls[-_]version" "$MYCNF"; then
              sed -i "s|^\s*tls[-_]version.*|tls_version = ${VERSIONS}|" "$MYCNF"
            else
              printf "[mysqld]\ntls_version = %s\n" "$VERSIONS" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'tls_version';"
            ```
        - id: ansible
          desc: |
            To restrict accepted TLS versions using Ansible:

            1. Set `tls_version` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restrict accepted MariaDB TLS versions
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_tls_versions: "TLSv1.2,TLSv1.3"
              tasks:
                - name: Set tls_version
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: tls_version
                    value: "{{ mariadb_tls_versions }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-server-certificate-configured
    title: Ensure ssl_cert and ssl_key are configured
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mariadb.conf.sslCertFile != empty
      mariadb.conf.sslKeyFile != empty
    docs:
      desc: |
        This check verifies that the server presents an identity clients can verify, by naming both a certificate and the private key that belongs to it.

        `ssl_cert` and `ssl_key` belong under `[mysqld]` in the server option file and name file paths the account running the server can read. Both are required. A certificate with no key, or a key with no certificate, leaves the server unable to complete a TLS handshake at all.

        **Why this matters**

        Encryption without identity protects against a passive observer and nothing else. An attacker who can redirect traffic, through DNS, ARP, or a route they control, stands up their own listener, terminates the client's TLS session against material they generated, and relays the connection onward to the real database. The client sees encryption and connects. The attacker reads every credential and every row that passes through. A certificate the client can chain to a trusted authority is the only thing that distinguishes the real server from that listener.

        Naming the material explicitly also makes it manageable. A certificate at a known path is one you can watch for expiry, replace on a schedule, and reissue when a key is suspected of exposure. Nothing about a certificate that nobody can point to is any of those things.

        This is also the prerequisite for requiring encrypted transport. Turning on that requirement against a server with no usable certificate does not harden it, it takes it offline for every remote client, so configure the material first and verify the key matches the certificate before restarting.
      audit: |
        ### Audit via CLI

        1. Read the configured paths from a running server:

        ```bash
        sudo mariadb -e "SHOW VARIABLES WHERE Variable_name IN ('ssl_cert','ssl_key','ssl_ca');"
        ```

        2. Confirm the certificate is valid and note its expiry:

        ```bash
        sudo openssl x509 -in /etc/mysql/ssl/server-cert.pem -noout -subject -issuer -dates
        ```

        A passing result names both files and shows a certificate issued by your authority with a future expiry. A failing result leaves either option empty.
      remediation:
        - id: cli
          desc: |
            To configure server certificate material using the CLI:

            1. Install the certificate and key where the server account can read them.
            2. Set `ssl_cert` and `ssl_key` in the server option file.
            3. Restart MariaDB and confirm the paths.

            ```bash
            sudo install -o mysql -g mysql -m 0600 server-key.pem /etc/mysql/ssl/server-key.pem
            sudo install -o mysql -g mysql -m 0644 server-cert.pem /etc/mysql/ssl/server-cert.pem
            sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null <<'EOF'
            [mysqld]
            ssl_cert = /etc/mysql/ssl/server-cert.pem
            ssl_key  = /etc/mysql/ssl/server-key.pem
            EOF
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES WHERE Variable_name IN ('ssl_cert','ssl_key');"
            ```
        - id: script
          desc: |
            To configure server certificate material using a bash script:

            1. Verify the key matches the certificate before changing configuration.
            2. Set both options, replacing any existing values.
            3. Restart MariaDB.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            CERT="/etc/mysql/ssl/server-cert.pem"
            KEY="/etc/mysql/ssl/server-key.pem"

            cert_mod=$(openssl x509 -in "$CERT" -noout -modulus)
            key_mod=$(openssl rsa -in "$KEY" -noout -modulus)
            if [ "$cert_mod" != "$key_mod" ]; then
              echo "private key does not match the certificate" >&2
              exit 1
            fi

            chown mysql:mysql "$KEY" "$CERT"
            chmod 0600 "$KEY"
            chmod 0644 "$CERT"

            mysqld_appended=0

            set_option() {
              local key="$1" value="$2"
              if grep -qE "^\s*${key}\b" "$MYCNF"; then
                sed -i "s|^\s*${key}\b.*|${key} = ${value}|" "$MYCNF"
                return
              fi
              if [ "$mysqld_appended" -eq 0 ]; then
                printf "\n[mysqld]\n" >>"$MYCNF"
                mysqld_appended=1
              fi
              printf "%s = %s\n" "$key" "$value" >>"$MYCNF"
            }

            set_option ssl_cert "$CERT"
            set_option ssl_key "$KEY"

            systemctl restart mariadb
            ```
        - id: ansible
          desc: |
            To configure server certificate material using Ansible:

            1. Place the certificate and key with ownership the server can read.
            2. Set `ssl_cert` and `ssl_key` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Configure MariaDB server certificate material
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_ssl_cert: /etc/mysql/ssl/server-cert.pem
                mariadb_ssl_key: /etc/mysql/ssl/server-key.pem
              tasks:
                - name: Protect the private key
                  ansible.builtin.file:
                    path: "{{ mariadb_ssl_key }}"
                    owner: mysql
                    group: mysql
                    mode: "0600"

                - name: Set the certificate options
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "ssl_cert", value: "{{ mariadb_ssl_cert }}" }
                    - { option: "ssl_key", value: "{{ mariadb_ssl_key }}" }
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-client-ca-configured
    title: Ensure a certificate authority is configured for client verification
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mariadb.conf.sslCaFile != empty || mariadb.conf.sslCaPath != empty
    docs:
      desc: |
        This check verifies that the server holds a trust anchor it can validate client certificates against.

        `ssl_ca` names a single authority certificate file and `ssl_capath` names a directory of them; both belong under `[mysqld]` in the server option file, and either one satisfies this check. Without one, the server has nothing to check a presented client certificate against, so an account created with `REQUIRE X509`, `REQUIRE ISSUER`, or `REQUIRE SUBJECT` cannot be enforced at all.

        **Why this matters**

        An account requirement that cannot be evaluated is worse than no requirement, because it reads as a control during a review. Someone scopes a high-privilege account to certificate authentication, records that decision, and moves on. The server, lacking an anchor, is left with the password as the only real barrier on an account whose password policy was relaxed precisely because a certificate was supposed to be doing the work.

        A configured authority is also what bounds who can mint an identity the server will accept. Only certificates chaining to it are honored, so an attacker who generates their own self-signed client certificate is rejected rather than admitted. It gives you a place to distrust a certificate whose key has leaked, which is not possible when there is no chain at all.

        The same authority completes the other direction. Clients that verify the server's certificate rather than merely encrypting to it need to trust the issuer, so distributing the authority alongside the server material is what makes strict client-side verification practical instead of theoretical.
      audit: |
        ### Audit via CLI

        1. Read the configured trust anchor:

        ```bash
        sudo mariadb -e "SHOW VARIABLES WHERE Variable_name IN ('ssl_ca','ssl_capath','ssl_crl');"
        ```

        2. Identify accounts that depend on client certificates:

        ```bash
        sudo mariadb -e "SELECT user, host, ssl_type FROM mysql.user WHERE ssl_type <> '';"
        ```

        A passing result names an authority file or directory. A failing result leaves both empty, in which case any account requiring X.509 cannot be validated.
      remediation:
        - id: cli
          desc: |
            To configure a client certificate authority using the CLI:

            1. Install the issuing authority certificate where the server can read it.
            2. Set `ssl_ca` in the server option file.
            3. Restart MariaDB and confirm the value.

            ```bash
            sudo install -o mysql -g mysql -m 0644 ca.pem /etc/mysql/ssl/ca.pem
            sudo sed -i -E "/^\s*#?\s*ssl[-_]ca\b/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nssl_ca = /etc/mysql/ssl/ca.pem\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'ssl_ca';"
            ```
        - id: script
          desc: |
            To configure a client certificate authority using a bash script:

            1. Verify the authority certificate is present and parseable.
            2. Set `ssl_ca`, replacing any existing value.
            3. Restart MariaDB.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            CA_FILE="/etc/mysql/ssl/ca.pem"

            if ! openssl x509 -in "$CA_FILE" -noout >/dev/null 2>&1; then
              echo "authority certificate missing or unparseable: $CA_FILE" >&2
              exit 1
            fi

            chown mysql:mysql "$CA_FILE"
            chmod 0644 "$CA_FILE"

            if grep -qE "^\s*ssl[-_]ca\b" "$MYCNF"; then
              sed -i "s|^\s*ssl[-_]ca\b.*|ssl_ca = ${CA_FILE}|" "$MYCNF"
            else
              printf "[mysqld]\nssl_ca = %s\n" "$CA_FILE" >>"$MYCNF"
            fi

            systemctl restart mariadb
            ```
        - id: ansible
          desc: |
            To configure a client certificate authority using Ansible:

            1. Place the authority certificate with ownership the server can read.
            2. Set `ssl_ca` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Configure the MariaDB client certificate authority
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_ssl_ca: /etc/mysql/ssl/ca.pem
              tasks:
                - name: Install the authority certificate
                  ansible.builtin.copy:
                    src: ca.pem
                    dest: "{{ mariadb_ssl_ca }}"
                    owner: mysql
                    group: mysql
                    mode: "0644"

                - name: Set ssl_ca
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: ssl_ca
                    value: "{{ mariadb_ssl_ca }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-skip-grant-tables-disabled
    title: Ensure skip_grant_tables is not enabled
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mariadb.conf.skipGrantTables == false
    docs:
      desc: |
        This check verifies that the privilege system is loaded, by confirming that no option file anywhere in the include chain asks the server to start without it.

        `skip_grant_tables` belongs, when it belongs anywhere, under `[mysqld]`, and the check searches the whole chain including every `!include` and `!includedir` fragment. The option is enabled by its presence: a bare `skip_grant_tables` line with no value counts exactly as much as an explicit `ON`, and both fail.

        **Why this matters**

        With the option in effect, the server has no privilege system. Every connection is accepted with no password, and every connection acts with full privileges on every schema. There is no account to compromise and no credential to steal, because none is asked for. Anyone who can reach the port reads every table, writes to every table, and reads the account table itself so the password hashes can be cracked offline for use against the other servers where those people reused them.

        The option exists for one legitimate reason: recovering a server whose administrative password has been lost. That procedure is meant to run for a few minutes with networking disabled and the option removed again immediately afterward. What this check catches is the version of that procedure that ended with the operator restoring service and forgetting the line. It survives every restart from then on, and the server looks entirely normal from the outside.

        Remove the option from every file that declares it, not only the main one, and restart so the privilege system is loaded again. Nothing else in this policy has any effect while it is present.
      audit: |
        ### Audit via CLI

        1. Confirm the privilege system is active on a running server:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'skip_grant_tables';"
        ```

        2. Search every option file for the option, including include fragments:

        ```bash
        sudo grep -rniE "^\s*skip[-_]grant[-_]tables" /etc/mysql/ /etc/my.cnf /etc/my.cnf.d/ 2>/dev/null
        ```

        A passing result reports `OFF` and finds no matching line. A failing result reports `ON`, or finds the option written as a bare flag.
      remediation:
        - id: cli
          desc: |
            To restore the privilege system using the CLI:

            1. Remove the option from every option file that declares it.
            2. Restart MariaDB so the privilege system is loaded.
            3. Confirm the option is off.

            ```bash
            sudo sed -i -E "/^\s*skip[-_]grant[-_]tables/d" /etc/mysql/mariadb.conf.d/50-server.cnf
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'skip_grant_tables';"
            ```
        - id: script
          desc: |
            To restore the privilege system using a bash script:

            1. Remove the option from the main file and every include fragment.
            2. Restart MariaDB.
            3. Fail if the option survives anywhere.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            for dir in /etc/mysql /etc/my.cnf.d; do
              [ -d "$dir" ] || continue
              find "$dir" -type f -name "*.cnf" -exec \
                sed -i -E "/^[[:space:]]*skip[-_]grant[-_]tables/d" {} +
            done

            if [ -f /etc/my.cnf ]; then
              sed -i -E "/^[[:space:]]*skip[-_]grant[-_]tables/d" /etc/my.cnf
            fi

            systemctl restart mariadb

            state=$(mariadb -N -B -e "SELECT @@skip_grant_tables;")
            if [ "$state" != "0" ] && [ "$state" != "OFF" ]; then
              echo "privilege system still disabled" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To restore the privilege system using Ansible:

            1. Remove the option from every option file.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restore the MariaDB privilege system
              hosts: mariadb
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Remove skip_grant_tables
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*skip[-_]grant[-_]tables'
                    state: absent
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-simple-password-check-plugin-loaded
    title: Ensure the simple_password_check plugin is loaded at startup
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mariadb.conf.pluginLoad.any(_ == /simple_password_check/)
    docs:
      desc: |
        This check verifies that password strength rules are in force from the instant the server starts, by confirming the plugin that enforces them is loaded from configuration.

        The `simple_password_check` plugin has to be named in `plugin_load` or `plugin_load_add` under `[mysqld]` in the server option file. MariaDB ships with no password rules of its own, so until this plugin is active the server accepts whatever an account is created with: a single character, the account name, or the word `password`.

        **Why this matters**

        Installing the plugin at runtime rather than in the option file leaves a real gap. A runtime installation is recorded in server state, so it survives a restart on a healthy host, but it does not survive a rebuild, a restore from an image, or a node built from configuration management that never knew about it. Anything that stands the server up from its option files stands it up with no password policy, and the accounts created during that window are the ones nobody audits afterward.

        The concrete outcome is an account with a guessable password. An attacker who can reach the port runs a short wordlist against the application account and is in, without needing a leak or an exploit, because nothing on the server ever refused the password when it was set.

        This is also the prerequisite for the rest of the password checks in this group. The minimum length and character composition options are read by this plugin, so they have no effect at all until it is loaded, and a configuration that sets them without loading it enforces nothing while looking like it does.
      audit: |
        ### Audit via CLI

        1. Confirm the plugin is active:

        ```bash
        sudo mariadb -e "SELECT plugin_name, plugin_status FROM information_schema.plugins WHERE plugin_name LIKE 'simple_password%';"
        ```

        2. Confirm the resulting policy variables are present:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'simple_password_check%';"
        ```

        A passing result shows the plugin `ACTIVE` and the policy variables present. A failing result returns no rows, meaning no password rules are enforced.
      remediation:
        - id: cli
          desc: |
            To load password validation at startup using the CLI:

            1. Install the plugin so it is registered with the server.
            2. Add it to the option file so it loads on every start.
            3. Restart MariaDB and confirm the policy variables appear.

            ```bash
            sudo mariadb -e "INSTALL SONAME 'simple_password_check';"
            sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null <<'EOF'
            [mysqld]
            plugin_load_add = simple_password_check.so
            EOF
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'simple_password_check%';"
            ```
        - id: script
          desc: |
            To load password validation at startup using a bash script:

            1. Install the plugin when it is not already active.
            2. Add the load option when it is absent.
            3. Restart MariaDB and confirm the policy variables are present.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            active=$(mariadb -N -B -e "SELECT count(*) FROM information_schema.plugins
              WHERE plugin_name LIKE 'simple_password%' AND plugin_status = 'ACTIVE';")

            if [ "$active" -eq 0 ]; then
              mariadb -e "INSTALL SONAME 'simple_password_check';"
            fi

            if ! grep -qE "^\s*plugin[-_]load([-_]add)?\s*=.*simple_password_check" "$MYCNF"; then
              printf "[mysqld]\nplugin_load_add = simple_password_check.so\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'simple_password_check%';"
            ```
        - id: ansible
          desc: |
            To load password validation at startup using Ansible:

            1. Install the plugin.
            2. Add the load option to the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Load MariaDB password validation at startup
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Install the simple_password_check plugin
                  ansible.builtin.command:
                    cmd: mariadb -e "INSTALL SONAME 'simple_password_check';"
                  register: install_plugin
                  changed_when: install_plugin.rc == 0
                  failed_when: >-
                    install_plugin.rc != 0 and
                    'already' not in install_plugin.stderr

                - name: Load the plugin on every start
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: plugin_load_add
                    value: simple_password_check.so
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-simple-password-check-length-sufficient
    title: Ensure simple_password_check_minimal_length is at least 14
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mariadb.conf.simplePasswordCheckMinimalLength >= 14
    docs:
      desc: |
        This check verifies that a password has to be at least 14 characters before the server will accept it.

        `simple_password_check_minimal_length` belongs under `[mysqld]` in the server option file and is read by the `simple_password_check` plugin. The plugin's own default is 8. The check also fails when the option is absent, which reads as 0, so the minimum has to be written down rather than inherited.

        **Why this matters**

        The threat this addresses is offline, not online. An attacker who obtains the account table, through a filesystem read, a stolen backup, a copied data directory, or a `SELECT` on a server where privileges were too broad, takes the password hashes away and attacks them at their leisure on hardware you do not control. No rate limit applies and no failed-login alert fires, because nothing is connecting to your server any more.

        Against that attack length is the variable that matters most. Each additional character multiplies the search space, so the cost of exhausting it grows exponentially while composition rules only widen the alphabet by a constant factor. Eight characters is inside the reach of commodity GPUs for common hash constructions; 14 keeps a randomly chosen password out of reach of exhaustive search, and stays out of reach as cracking hardware improves.

        Longer passwords are also less likely to appear verbatim in a breach corpus, which is what defeats credential stuffing from an unrelated site's leak. Writing the minimum explicitly means it is visible in the option file rather than sitting at whatever the plugin's default happens to be in the installed release.
      audit: |
        ### Audit via CLI

        1. Read the effective minimum length:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'simple_password_check_minimal_length';"
        ```

        2. Confirm the minimum is enforced by attempting a short password on a test account:

        ```bash
        sudo mariadb -e "CREATE USER 'pwtest'@'localhost' IDENTIFIED BY 'Short1!';" 2>&1 | head -n 2
        ```

        A passing result reports 14 or greater. A failing result reports a smaller number such as 8, or returns no row because the plugin is not loaded.
      remediation:
        - id: cli
          desc: |
            To raise the minimum password length using the CLI:

            1. Set the option in the server option file.
            2. Restart MariaDB.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*simple_password_check_minimal_length/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nsimple_password_check_minimal_length = 14\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'simple_password_check_minimal_length';"
            ```
        - id: script
          desc: |
            To raise the minimum password length using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            MIN_LENGTH=14

            if grep -qE "^\s*simple_password_check_minimal_length" "$MYCNF"; then
              sed -i "s|^\s*simple_password_check_minimal_length.*|simple_password_check_minimal_length = ${MIN_LENGTH}|" "$MYCNF"
            else
              printf "[mysqld]\nsimple_password_check_minimal_length = %s\n" "$MIN_LENGTH" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'simple_password_check_minimal_length';"
            ```
        - id: ansible
          desc: |
            To raise the minimum password length using Ansible:

            1. Set the option in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Raise the MariaDB minimum password length
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_password_min_length: 14
              tasks:
                - name: Set simple_password_check_minimal_length
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: simple_password_check_minimal_length
                    value: "{{ mariadb_password_min_length }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-simple-password-check-composition-required
    title: Ensure simple_password_check requires mixed character classes
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mariadb.conf.simplePasswordCheckDigits >= 1
      mariadb.conf.simplePasswordCheckLetters >= 1
      mariadb.conf.simplePasswordCheckOtherCharacters >= 1
    docs:
      desc: |
        This check verifies that an accepted password has to draw on more than one class of character, by requiring a nonzero minimum for digits, for letters of each case, and for symbols.

        Three options under `[mysqld]` in the server option file control this, all read by the `simple_password_check` plugin: `simple_password_check_digits`, `simple_password_check_letters_same_case`, and `simple_password_check_other_characters`. Each has to be at least 1. Any one of them set to 0 removes that class from the requirement entirely, and an option that is absent reads as 0.

        **Why this matters**

        They are evaluated together because each covers a different part of the keyspace and any single zero collapses the requirement. Leave the symbol minimum at 0 and a password of nothing but lowercase letters satisfies the policy on length alone, which is exactly the shape a person picks when asked for something long and memorable.

        That shape is what a cracking rig is optimized for. Attackers working a stolen hash do not start from the full character space, they start from dictionary words, then those words with predictable mutations, then all-lowercase strings by length. A password drawn from one class falls in the first few hours of that ordering. Requiring digits, both letter cases, and a symbol pushes the candidate out of the cheap part of the search and into the expensive part.

        The rules apply when a password is set, so they shape the credentials that enter the account table rather than judging the ones already there. Passwords set before the plugin was loaded are unaffected and should be rotated deliberately.
      audit: |
        ### Audit via CLI

        1. Read all three effective values:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'simple_password_check%';"
        ```

        2. Confirm the composition requirement is enforced:

        ```bash
        sudo mariadb -e "CREATE USER 'pwtest'@'localhost' IDENTIFIED BY 'alllowercaseletters';" 2>&1 | head -n 2
        ```

        A passing result reports 1 or greater for digits, letters, and other characters. A failing result reports 0 for any of them, or returns no rows because the plugin is not loaded.
      remediation:
        - id: cli
          desc: |
            To require mixed character classes using the CLI:

            1. Set all three options in the server option file.
            2. Restart MariaDB.
            3. Confirm the effective values.

            ```bash
            sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null <<'EOF'
            [mysqld]
            simple_password_check_digits            = 2
            simple_password_check_letters_same_case = 2
            simple_password_check_other_characters  = 2
            EOF
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'simple_password_check%';"
            ```
        - id: script
          desc: |
            To require mixed character classes using a bash script:

            1. Set each option, replacing any existing value.
            2. Restart MariaDB and report the effective values.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            mysqld_appended=0

            set_option() {
              local key="$1" value="$2"
              if grep -qE "^\s*${key}\b" "$MYCNF"; then
                sed -i "s|^\s*${key}\b.*|${key} = ${value}|" "$MYCNF"
                return
              fi
              if [ "$mysqld_appended" -eq 0 ]; then
                printf "\n[mysqld]\n" >>"$MYCNF"
                mysqld_appended=1
              fi
              printf "%s = %s\n" "$key" "$value" >>"$MYCNF"
            }

            set_option simple_password_check_digits 2
            set_option simple_password_check_letters_same_case 2
            set_option simple_password_check_other_characters 2

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'simple_password_check%';"
            ```
        - id: ansible
          desc: |
            To require mixed character classes using Ansible:

            1. Set all three options in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Require mixed character classes in MariaDB passwords
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set the composition options
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "simple_password_check_digits", value: "2" }
                    - { option: "simple_password_check_letters_same_case", value: "2" }
                    - { option: "simple_password_check_other_characters", value: "2" }
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-password-reuse-check-configured
    title: Ensure password_reuse_check_interval prevents password reuse
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-7
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mariadb.conf.passwordReuseCheckInterval > 0
    docs:
      desc: |
        This check verifies that the server records password history and enforces a retention window, by requiring an explicit positive number of days.

        `password_reuse_check_interval` belongs under `[mysqld]` in the server option file. It is read by the `password_reuse_check` plugin, which is not loaded by default, so the plugin has to be named in the plugin load options as well. The check requires a value greater than 0, which is also what shows that this server has the reuse control configured at all rather than leaving the option absent.

        **Why this matters**

        Rotation without a history check produces no new secret. An account told to change its password sets it back to the value it just replaced, or alternates between two familiar ones indefinitely, and the rotation record shows a change on every cycle while the credential in circulation never actually changed.

        That matters most for the credential you already know leaked. A password exposed in a repository commit, a log file, or a support ticket is supposed to be dead the moment it is rotated. If nothing stops the owner from setting it again three months later, an attacker who filed it away and retried it periodically gets back in on a credential everyone believes was retired.

        The interval also decides how far back the server remembers, so it is worth choosing against the rotation cadence rather than picking a number. A retention window shorter than the interval between forced changes lets a password age out of history before the next rotation asks for it, and the account can cycle straight back to it.

        Set the plugin load option and the interval together in the option file, since a plugin installed only at runtime leaves the history unenforced after a rebuild.
      audit: |
        ### Audit via CLI

        1. Confirm the plugin is active and read the interval:

        ```bash
        sudo mariadb -e "SELECT plugin_name, plugin_status FROM information_schema.plugins WHERE plugin_name LIKE 'password_reuse%';"
        sudo mariadb -e "SHOW VARIABLES LIKE 'password_reuse_check_interval';"
        ```

        2. Confirm history is being recorded:

        ```bash
        sudo mariadb -e "SELECT count(*) FROM mysql.password_reuse_check_history;"
        ```

        A passing result reports a positive number of days. A failing result reports 0, or returns no row because the plugin is not loaded.
      remediation:
        - id: cli
          desc: |
            To prevent password reuse using the CLI:

            1. Install the plugin and add it to the option file so it loads on every start.
            2. Set the interval.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo mariadb -e "INSTALL SONAME 'password_reuse_check';"
            sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null <<'EOF'
            [mysqld]
            plugin_load_add               = password_reuse_check.so
            password_reuse_check_interval = 365
            EOF
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'password_reuse_check_interval';"
            ```
        - id: script
          desc: |
            To prevent password reuse using a bash script:

            1. Install the plugin when it is not already active.
            2. Set the load option and the interval.
            3. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            INTERVAL=365

            active=$(mariadb -N -B -e "SELECT count(*) FROM information_schema.plugins
              WHERE plugin_name LIKE 'password_reuse%' AND plugin_status = 'ACTIVE';")

            if [ "$active" -eq 0 ]; then
              mariadb -e "INSTALL SONAME 'password_reuse_check';"
            fi

            if ! grep -qE "^\s*plugin[-_]load([-_]add)?\s*=.*password_reuse_check" "$MYCNF"; then
              printf "[mysqld]\nplugin_load_add = password_reuse_check.so\n" >>"$MYCNF"
            fi

            if grep -qE "^\s*password_reuse_check_interval" "$MYCNF"; then
              sed -i "s|^\s*password_reuse_check_interval.*|password_reuse_check_interval = ${INTERVAL}|" "$MYCNF"
            else
              printf "[mysqld]\npassword_reuse_check_interval = %s\n" "$INTERVAL" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'password_reuse_check_interval';"
            ```
        - id: ansible
          desc: |
            To prevent password reuse using Ansible:

            1. Install the plugin.
            2. Set the load option and the interval in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Prevent MariaDB password reuse
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_password_reuse_interval: 365
              tasks:
                - name: Install the password_reuse_check plugin
                  ansible.builtin.command:
                    cmd: mariadb -e "INSTALL SONAME 'password_reuse_check';"
                  register: install_plugin
                  changed_when: install_plugin.rc == 0
                  failed_when: >-
                    install_plugin.rc != 0 and
                    'already' not in install_plugin.stderr

                - name: Configure the plugin and interval
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "plugin_load_add", value: "password_reuse_check.so" }
                    - { option: "password_reuse_check_interval", value: "{{ mariadb_password_reuse_interval }}" }
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-runs-as-dedicated-account
    title: Ensure the server does not run as the root account
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mariadb.conf.serverOptions["user"] != empty && mariadb.conf.serverOptions["user"].downcase != "root"
    docs:
      desc: |
        This check verifies that the server drops to a dedicated unprivileged operating system account rather than running as `root`.

        The `user` option belongs under `[mysqld]` in the server option file and names the account the server switches to after it has bound its port. On a packaged install that is `mysql`. The check fails when the option names `root` and when it is absent, because an unset option leaves the server holding the identity of whichever account started it, which for a service started at boot is `root`.

        **Why this matters**

        This is the boundary that keeps a database compromise from becoming a host compromise. MariaDB hands sufficiently privileged accounts several ways to write a file: `SELECT ... INTO OUTFILE`, a user-defined function library loaded from the plugin directory, and the log destinations themselves. Each of those writes runs as the operating system account the server holds.

        Running as `root`, that write primitive is full control of the machine. An attacker who reaches a privileged database account appends a key to `/root/.ssh/authorized_keys`, drops a file into `/etc/cron.d`, or overwrites a systemd unit, and comes back as the host administrator on the next connection or the next minute. None of that requires a MariaDB exploit; it is the ordinary use of a documented statement by an account that should never have had it aimed at those paths.

        Running as a dedicated account, the same primitive reaches only what that account owns, which is the data directory and the log directory and nothing else on the host.

        Create the account, transfer ownership of the data directory to it, then set the option and restart. Confirm the running process actually holds the identity afterward, because the option is only honored when the server has the privilege to make the switch.
      audit: |
        ### Audit via CLI

        1. Read the account the server is configured to use:

        ```bash
        sudo grep -rniE "^\s*user\s*=" /etc/mysql/ /etc/my.cnf 2>/dev/null
        ```

        2. Confirm the identity the running process actually holds:

        ```bash
        ps -o user= -C mariadbd
        ```

        3. Confirm the data directory is owned by that account:

        ```bash
        sudo ls -ld "$(sudo mariadb -N -B -e 'SELECT @@datadir;')"
        ```

        A passing result names a dedicated account such as `mysql`, and the process runs as that account. A failing result names `root`, leaves the option unset, or shows the process running as `root`.
      remediation:
        - id: cli
          desc: |
            To run the server as a dedicated account using the CLI:

            1. Create the account when it does not exist.
            2. Transfer ownership of the data directory and log directory to it.
            3. Set the `user` option, restart the server, and confirm the running identity.

            ```bash
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin mysql || true
            sudo chown -R mysql:mysql /var/lib/mysql /var/log/mysql
            sudo sed -i -E "/^\s*#?\s*user\s*=/d" /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nuser = mysql\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            ps -o user= -C mariadbd
            ```
        - id: script
          desc: |
            To run the server as a dedicated account using a bash script:

            1. Create the account when it is missing.
            2. Transfer ownership of the data directory reported by the server.
            3. Set the option, restart, and fail if the process still runs as root.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            ACCOUNT="mysql"

            if ! id "$ACCOUNT" >/dev/null 2>&1; then
              useradd --system --no-create-home --shell /usr/sbin/nologin "$ACCOUNT"
            fi

            datadir=$(mariadb -N -B -e "SELECT @@datadir;")
            chown -R "${ACCOUNT}:${ACCOUNT}" "$datadir"

            if grep -qE "^\s*user\s*=" "$MYCNF"; then
              sed -i "s|^\s*user\s*=.*|user = ${ACCOUNT}|" "$MYCNF"
            else
              printf "[mysqld]\nuser = %s\n" "$ACCOUNT" >>"$MYCNF"
            fi

            systemctl restart mariadb

            running_as=$(ps -o user= -C mariadbd | tr -d ' ' | head -n1)
            if [ "$running_as" = "root" ]; then
              echo "mariadbd is still running as root" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To run the server as a dedicated account using Ansible:

            1. Create the dedicated account.
            2. Transfer ownership of the data directory.
            3. Set the `user` option and restart the server.

            ```yaml
            - name: Run MariaDB as a dedicated account
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_account: mysql
                mariadb_datadir: /var/lib/mysql
              tasks:
                - name: Create the dedicated account
                  ansible.builtin.user:
                    name: "{{ mariadb_account }}"
                    system: true
                    create_home: false
                    shell: /usr/sbin/nologin

                - name: Own the data directory
                  ansible.builtin.file:
                    path: "{{ mariadb_datadir }}"
                    owner: "{{ mariadb_account }}"
                    group: "{{ mariadb_account }}"
                    recurse: true

                - name: Set the user option
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: user
                    value: "{{ mariadb_account }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-local-infile-disabled
    title: Ensure local_infile is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mariadb.conf.localInfile == false
    docs:
      desc: |
        This check verifies that the server does not accept `LOAD DATA LOCAL INFILE`, the form of the bulk load statement that reads a file from the connecting client rather than from the server.

        `local_infile` belongs under `[mysqld]` in the server option file and has to be set to `OFF` explicitly. MariaDB's own default for this option is on, so a server that never mentions it is accepting the statement.

        **Why this matters**

        The danger is the direction of the transfer. In the `LOCAL` form the server sends the client a request naming a path, and a compliant client library opens that path on its own filesystem and uploads the contents. Nothing about that exchange requires any privilege on the server, because the file read happens on the client.

        That gives two concrete attacks. An attacker who can inject a statement into an application's database connection, through SQL injection or a compromised query builder, has the server ask the application host for `/etc/passwd`, for the application's own configuration file with its credentials in it, for a cloud instance credential on disk, or for a private key. The contents arrive as rows in a table the attacker can read. Alternatively an attacker who stands up a malicious server and persuades a client to connect to it, through a hostname they control or a redirected connection, requests files from every client that connects, harvesting configuration from developer workstations and CI runners.

        Bulk loading has a safe counterpart. The server-side `LOAD DATA INFILE` reads from the server's own filesystem, confined by `secure_file_priv`, so confirm no job depends on the client-side form before turning it off.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'local_infile';"
        ```

        2. Confirm the statement is refused:

        ```bash
        sudo mariadb -e "LOAD DATA LOCAL INFILE '/etc/hostname' INTO TABLE mysql.help_topic;" 2>&1 | head -n 2
        ```

        A passing result reports `OFF` and the statement is rejected. A failing result reports `ON`.
      remediation:
        - id: cli
          desc: |
            To disable local file loading using the CLI:

            1. Confirm no bulk load job depends on the client-side form.
            2. Set `local_infile` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*local[-_]infile/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nlocal_infile = OFF\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'local_infile';"
            ```
        - id: script
          desc: |
            To disable local file loading using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            if grep -qE "^\s*local[-_]infile" "$MYCNF"; then
              sed -i "s|^\s*local[-_]infile.*|local_infile = OFF|" "$MYCNF"
            else
              printf "[mysqld]\nlocal_infile = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'local_infile';"
            ```
        - id: ansible
          desc: |
            To disable local file loading using Ansible:

            1. Set `local_infile` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Disable MariaDB client-side file loading
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set local_infile
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: local_infile
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-secure-file-priv-restricted
    title: Ensure secure_file_priv confines server-side file access
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mariadb.conf.secureFilePriv != empty
    docs:
      desc: |
        This check verifies that the server's file-reading and file-writing statements are confined, by requiring `secure_file_priv` to hold a value rather than being empty.

        The option belongs under `[mysqld]` in the server option file. A directory path confines both `LOAD DATA INFILE` and `SELECT ... INTO OUTFILE` to that directory. The literal value `NULL` disables both statements outright and is the stronger choice where no bulk file exchange is needed. Either satisfies this check; only an empty value fails, because an empty value removes the restriction entirely.

        **Why this matters**

        Unrestricted, those two statements are an arbitrary file read and an arbitrary file write anywhere the server account can reach, available to any account holding the `FILE` privilege.

        The read side turns a database credential into a filesystem credential. An attacker selects the server's own option files to find where the TLS key and the encryption key file live, then reads those, then reads whatever else on the host the server account can open. Nothing they take that way appears in a query log as anything but an ordinary bulk load.

        The write side is worse, because it is persistence. A file written into a web root that the same host serves is a web shell. A file written into `/etc/cron.d` runs as the account that owns it. A file appended to an authorized keys file is a login. Each is a single statement, and each converts read access to a database into code execution on the machine.

        Set a directory owned by the server account and used for nothing else, or set `NULL` and be done with it.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'secure_file_priv';"
        ```

        2. Identify accounts holding the privilege the option constrains:

        ```bash
        sudo mariadb -e "SELECT user, host FROM mysql.user WHERE File_priv = 'Y';"
        ```

        A passing result reports a directory path or `NULL`. A failing result reports an empty value, meaning file statements are unrestricted.
      remediation:
        - id: cli
          desc: |
            To confine server-side file access using the CLI:

            1. Create a directory owned by the server account for file exchange, or choose `NULL` to disable the statements.
            2. Set `secure_file_priv` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo install -d -o mysql -g mysql -m 0750 /var/lib/mysql-files
            sudo sed -i -E "/^\s*#?\s*secure[-_]file[-_]priv/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nsecure_file_priv = /var/lib/mysql-files\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'secure_file_priv';"
            ```
        - id: script
          desc: |
            To confine server-side file access using a bash script:

            1. Create the exchange directory with restrictive ownership.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and fail if the value is still empty.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            FILE_DIR="/var/lib/mysql-files"

            install -d -o mysql -g mysql -m 0750 "$FILE_DIR"

            if grep -qE "^\s*secure[-_]file[-_]priv" "$MYCNF"; then
              sed -i "s|^\s*secure[-_]file[-_]priv.*|secure_file_priv = ${FILE_DIR}|" "$MYCNF"
            else
              printf "[mysqld]\nsecure_file_priv = %s\n" "$FILE_DIR" >>"$MYCNF"
            fi

            systemctl restart mariadb

            value=$(mariadb -N -B -e "SELECT @@secure_file_priv;")
            if [ -z "$value" ]; then
              echo "secure_file_priv is still unrestricted" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To confine server-side file access using Ansible:

            1. Create the exchange directory owned by the server account.
            2. Set `secure_file_priv` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Confine MariaDB server-side file access
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_file_dir: /var/lib/mysql-files
              tasks:
                - name: Create the file exchange directory
                  ansible.builtin.file:
                    path: "{{ mariadb_file_dir }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"

                - name: Set secure_file_priv
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: secure_file_priv
                    value: "{{ mariadb_file_dir }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-symbolic-links-disabled
    title: Ensure symbolic_links is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mariadb.conf.symbolicLinks == false
    docs:
      desc: |
        This check verifies that the data directory is a real boundary, by confirming the server will not follow a symbolic link out of it when it opens a table file.

        `symbolic_links` belongs under `[mysqld]` in the server option file and has to be off. With the feature enabled, a table's data file may be a symbolic link pointing anywhere the server account can write, and the server follows it without complaint.

        **Why this matters**

        The whole rest of the file protection in this policy assumes the server reads and writes inside its data directory. A symbolic link breaks that assumption silently, because the path in the catalog still looks local while the bytes land somewhere else.

        Two routes get an attacker there. An account that can issue `CREATE TABLE` with a `DATA DIRECTORY` clause chooses where the table's storage lives, and every subsequent insert writes to that location as the server account. An attacker who has any file write inside the data directory, from a bulk export or from a compromised backup process, replaces a table file with a link and lets the server itself do the writing through it on the next flush.

        Either way, table content the attacker controls is written to a path they chose, as an account the host trusts. That is the same escalation the file privilege checks in this policy are trying to close, arriving through the storage layer instead of through a statement.

        Look for existing links inside the data directory before changing this. Any table that currently relies on one becomes unreadable when the option is turned off, and a link you did not put there is worth investigating before it is broken.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'have_symlink';"
        ```

        2. Look for existing links inside the data directory:

        ```bash
        sudo find "$(sudo mariadb -N -B -e 'SELECT @@datadir;')" -type l -ls
        ```

        A passing result reports `DISABLED` and finds no links. A failing result reports `YES`, and any link found should be investigated before the option is changed.
      remediation:
        - id: cli
          desc: |
            To disable symbolic link support using the CLI:

            1. Confirm no table currently relies on a link, because those tables become unreadable.
            2. Set `symbolic_links` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo find "$(sudo mariadb -N -B -e 'SELECT @@datadir;')" -type l -ls
            sudo sed -i -E "/^\s*#?\s*symbolic[-_]links/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nsymbolic_links = OFF\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'have_symlink';"
            ```
        - id: script
          desc: |
            To disable symbolic link support using a bash script:

            1. Refuse to proceed while links exist in the data directory.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            datadir=$(mariadb -N -B -e "SELECT @@datadir;")
            links=$(find "$datadir" -type l -print)

            if [ -n "$links" ]; then
              echo "symbolic links present in the data directory; relocate these tables first:" >&2
              printf '%s\n' "$links" >&2
              exit 1
            fi

            if grep -qE "^\s*symbolic[-_]links" "$MYCNF"; then
              sed -i "s|^\s*symbolic[-_]links.*|symbolic_links = OFF|" "$MYCNF"
            else
              printf "[mysqld]\nsymbolic_links = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            ```
        - id: ansible
          desc: |
            To disable symbolic link support using Ansible:

            1. Set `symbolic_links` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Disable MariaDB symbolic link support
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set symbolic_links
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: symbolic_links
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-allow-suspicious-udfs-disabled
    title: Ensure allow_suspicious_udfs is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mariadb.conf.allowSuspiciousUdfs == false
    docs:
      desc: |
        This check verifies that the server refuses to load a shared library as a user-defined function unless the library is shaped like a real one.

        `allow_suspicious_udfs` belongs under `[mysqld]` in the server option file, and the check searches the whole include chain for it. With it off, the server requires a function library to export the auxiliary initialization and deinitialization symbols alongside the main function symbol. With it on, a library exporting only the main symbol is accepted.

        **Why this matters**

        A library that exports only that one symbol is almost never a user-defined function that someone wrote. It is the shape of an arbitrary shared object being pointed at the server so its code runs inside the server process, which is a long-established way of turning database access into host code execution.

        The technique runs like this. An attacker who has reached an account with enough privilege gets a shared object into the plugin directory, often by writing it there with the file statements this policy also restricts, registers it as a function with `CREATE FUNCTION` or by using `INSERT` on `mysql.func` directly, and calls it. The library's code then executes in the server process, with the server account's full access to the data directory, the encryption key file, the TLS private key, and the network. From there they no longer need the database at all.

        Refusing the malformed libraries does not stop a determined attacker who compiles a properly formed one, but it removes the off-the-shelf version of the attack, which is the one that arrives inside an automated toolkit.

        Legitimate functions are unaffected, because a correctly written user-defined function exports the symbols the server is asking for. Review the functions currently registered and the plugin directory contents when the option is found enabled.
      audit: |
        ### Audit via CLI

        1. Search the option files for the option:

        ```bash
        sudo grep -rniE "^\s*allow[-_]suspicious[-_]udfs" /etc/mysql/ /etc/my.cnf /etc/my.cnf.d/ 2>/dev/null
        ```

        2. Review the functions currently registered and the plugin directory they load from:

        ```bash
        sudo mariadb -e "SELECT * FROM mysql.func;"
        sudo ls -l "$(sudo mariadb -N -B -e 'SELECT @@plugin_dir;')"
        ```

        A passing result finds no matching line and shows only expected functions. A failing result finds the option enabled, in which case the registered functions and the plugin directory contents should be reviewed for unexpected libraries.
      remediation:
        - id: cli
          desc: |
            To reject suspicious function libraries using the CLI:

            1. Remove the option from every option file that declares it.
            2. Review the registered functions for anything unexpected.
            3. Restart MariaDB.

            ```bash
            sudo sed -i -E "/^\s*allow[-_]suspicious[-_]udfs/d" /etc/mysql/mariadb.conf.d/50-server.cnf
            sudo mariadb -e "SELECT * FROM mysql.func;"
            sudo systemctl restart mariadb
            ```
        - id: script
          desc: |
            To reject suspicious function libraries using a bash script:

            1. Remove the option from the main file and every include fragment.
            2. Report the registered functions so unexpected entries are visible.
            3. Restart MariaDB.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            for dir in /etc/mysql /etc/my.cnf.d; do
              [ -d "$dir" ] || continue
              find "$dir" -type f -name "*.cnf" -exec \
                sed -i -E "/^[[:space:]]*allow[-_]suspicious[-_]udfs/d" {} +
            done

            if [ -f /etc/my.cnf ]; then
              sed -i -E "/^[[:space:]]*allow[-_]suspicious[-_]udfs/d" /etc/my.cnf
            fi

            echo "registered user-defined functions:"
            mariadb -N -B -e "SELECT name, dl FROM mysql.func;"

            systemctl restart mariadb
            ```
        - id: ansible
          desc: |
            To reject suspicious function libraries using Ansible:

            1. Remove the option from every option file.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Reject suspicious MariaDB function libraries
              hosts: mariadb
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Remove allow_suspicious_udfs
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*allow[-_]suspicious[-_]udfs'
                    state: absent
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-log-bin-trust-function-creators-disabled
    title: Ensure log_bin_trust_function_creators is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mariadb.conf.logBinTrustFunctionCreators == false
    docs:
      desc: |
        This check verifies that the extra privilege check on stored function creation is still in place while binary logging is active.

        `log_bin_trust_function_creators` belongs under `[mysqld]` in the server option file and has to be off. Off, creating a stored function requires the `SUPER` privilege in addition to `CREATE ROUTINE`. On, that additional requirement is removed and `CREATE ROUTINE` alone is enough.

        **Why this matters**

        A stored function is server-side code that persists in the schema and runs under a definer's rights whenever anything calls it. That makes routine creation a persistence mechanism, and the privilege required to do it decides how many accounts hold one.

        An attacker who has compromised an ordinary application account, which usually holds routine privileges on its own schema so migrations work, installs a function and then arranges for something to call it: a trigger, a view, a scheduled event, or the application's own next query. The function can read tables the application account can read and write what it can write, and it survives a password rotation on the account that created it, because the code is now part of the schema. Keeping this behind `SUPER`, which is granted to few accounts and audited, is what keeps that path closed to application credentials.

        The option's original purpose is replication correctness rather than security. A nondeterministic function produces different results on a primary and on its replicas under statement-based replication, so the requirement exists to make someone with broad privilege take responsibility for that. The security value is a side effect worth keeping.

        Confirm no deployment process relies on creating routines without `SUPER` before restoring the requirement.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators';"
        ```

        2. Review the routines that exist and who defined them:

        ```bash
        sudo mariadb -e "SELECT db, name, type, definer FROM mysql.proc;"
        ```

        A passing result reports `OFF`. A failing result reports `ON`, and the routine list should be reviewed for definers that are not administrative accounts.
      remediation:
        - id: cli
          desc: |
            To restore the routine creation safety check using the CLI:

            1. Confirm no deployment process depends on creating routines without `SUPER`.
            2. Set the option in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*log[-_]bin[-_]trust[-_]function[-_]creators/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nlog_bin_trust_function_creators = OFF\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators';"
            ```
        - id: script
          desc: |
            To restore the routine creation safety check using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            if grep -qE "^\s*log[-_]bin[-_]trust[-_]function[-_]creators" "$MYCNF"; then
              sed -i "s|^\s*log[-_]bin[-_]trust[-_]function[-_]creators.*|log_bin_trust_function_creators = OFF|" "$MYCNF"
            else
              printf "[mysqld]\nlog_bin_trust_function_creators = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators';"
            ```
        - id: ansible
          desc: |
            To restore the routine creation safety check using Ansible:

            1. Set `log_bin_trust_function_creators` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restore the MariaDB routine creation safety check
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set log_bin_trust_function_creators
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: log_bin_trust_function_creators
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-automatic-sp-privileges-disabled
    title: Ensure automatic_sp_privileges is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mariadb.conf.automaticSpPrivileges == false
    docs:
      desc: |
        This check verifies that every privilege on a stored routine was granted deliberately, rather than appearing because someone created the routine.

        `automatic_sp_privileges` belongs under `[mysqld]` in the server option file and has to be set to `OFF` explicitly. The server's own default is on, which means that whenever an account creates a stored routine it is silently granted `EXECUTE` and `ALTER ROUTINE` on that routine, with no statement recorded anywhere saying so.

        **Why this matters**

        The problem is that the grant tables stop being a record of decisions. Reviewing what an account can do means reading its grants; when some of those grants materialized as a side effect of a `CREATE PROCEDURE` run months ago by a migration job, the reviewer cannot tell intended access from accumulated access, and the natural response to an unexpected routine privilege becomes to assume it arrived automatically and move on.

        That assumption is what an attacker relies on. An account that can create routines accumulates the ability to execute and alter them, so a compromised deployment credential that was only ever meant to install code also holds the ability to run it and to rewrite it afterward. Separating creation from execution means an attacker who takes the deployment account still needs a second credential to make the code run.

        Turning the option off does not revoke anything already granted. Grant `EXECUTE` explicitly to the accounts that call existing routines before the change, then review the routine-level grants that are already recorded, since the ones that arrived automatically look identical to the ones somebody chose.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'automatic_sp_privileges';"
        ```

        2. Review the routine-level grants that currently exist:

        ```bash
        sudo mariadb -e "SELECT user, host, db, routine_name, proc_priv FROM mysql.procs_priv;"
        ```

        A passing result reports `OFF`. A failing result reports `ON`, meaning routine creators receive privileges automatically.
      remediation:
        - id: cli
          desc: |
            To require explicit routine privileges using the CLI:

            1. Grant `EXECUTE` explicitly to the accounts that need to call existing routines.
            2. Set `automatic_sp_privileges` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo mariadb -e "GRANT EXECUTE ON PROCEDURE appdb.sync_orders TO 'app'@'10.0.0.%';"
            sudo sed -i -E "/^\s*#?\s*automatic[-_]sp[-_]privileges/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nautomatic_sp_privileges = OFF\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'automatic_sp_privileges';"
            ```
        - id: script
          desc: |
            To require explicit routine privileges using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MariaDB and report the existing routine grants for review.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            if grep -qE "^\s*automatic[-_]sp[-_]privileges" "$MYCNF"; then
              sed -i "s|^\s*automatic[-_]sp[-_]privileges.*|automatic_sp_privileges = OFF|" "$MYCNF"
            else
              printf "[mysqld]\nautomatic_sp_privileges = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mariadb

            echo "existing routine-level grants:"
            mariadb -N -B -e "SELECT concat(user,'@',host), db, routine_name, proc_priv FROM mysql.procs_priv;"
            ```
        - id: ansible
          desc: |
            To require explicit routine privileges using Ansible:

            1. Set `automatic_sp_privileges` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Require explicit MariaDB routine privileges
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set automatic_sp_privileges
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: automatic_sp_privileges
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-error-log-configured
    title: Ensure log_error names a dedicated error log destination
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mariadb.conf.logError != empty
    docs:
      desc: |
        This check verifies that the server writes its diagnostics to a file you can name, rather than to whatever its standard error stream happened to be attached to.

        `log_error` belongs under `[mysqld]` in the server option file and names a path in a directory the server account owns. When the option is empty, output goes to standard error, where its fate depends entirely on how the service was started: captured by the journal on one host, redirected to a file that nobody rotates on another, and discarded into the void on a third.

        **Why this matters**

        The error log is where the evidence of an attack in progress accumulates. Repeated failed connection attempts from one address, a client that keeps aborting mid-handshake, an authentication failure against an account that should never be authenticating from outside, all land here and nowhere else on a server that is not running a separate audit plugin. Responders reach for this file first, and finding that it was never written is the point at which an investigation stops being able to establish anything.

        It is also where you find out whether the rest of this policy actually took effect. A plugin that failed to load, an option the server parsed and rejected, a certificate file it could not read, all of these are reported at startup and then never again. A server that discards its startup output is a server where a password validation plugin can fail silently and the configuration keeps saying it is enabled.

        Create the log directory owned by the server account before setting the path, and confirm entries are appearing after the restart.
      audit: |
        ### Audit via CLI

        1. Read the effective destination:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'log_error';"
        ```

        2. Confirm the file exists and is being written:

        ```bash
        sudo ls -l /var/log/mysql/error.log && sudo tail -n 20 /var/log/mysql/error.log
        ```

        A passing result names a path and shows recent entries. A failing result reports an empty value, meaning diagnostics go to the standard error stream.
      remediation:
        - id: cli
          desc: |
            To configure a dedicated error log using the CLI:

            1. Create the log directory owned by the server account.
            2. Set `log_error` in the server option file.
            3. Restart MariaDB and confirm the destination.

            ```bash
            sudo install -d -o mysql -g mysql -m 0750 /var/log/mysql
            sudo sed -i -E "/^\s*#?\s*log[-_]error\b/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nlog_error = /var/log/mysql/error.log\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'log_error';"
            ```
        - id: script
          desc: |
            To configure a dedicated error log using a bash script:

            1. Create the log directory with restrictive ownership.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and fail if the destination is still empty.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            LOG_FILE="/var/log/mysql/error.log"

            install -d -o mysql -g mysql -m 0750 "$(dirname "$LOG_FILE")"

            if grep -qE "^\s*log[-_]error\b" "$MYCNF"; then
              sed -i "s|^\s*log[-_]error\b.*|log_error = ${LOG_FILE}|" "$MYCNF"
            else
              printf "[mysqld]\nlog_error = %s\n" "$LOG_FILE" >>"$MYCNF"
            fi

            systemctl restart mariadb

            value=$(mariadb -N -B -e "SELECT @@log_error;")
            if [ -z "$value" ] || [ "$value" = "stderr" ]; then
              echo "error log destination is still not a file" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To configure a dedicated error log using Ansible:

            1. Create the log directory owned by the server account.
            2. Set `log_error` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Configure a dedicated MariaDB error log
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_log_dir: /var/log/mysql
              tasks:
                - name: Create the log directory
                  ansible.builtin.file:
                    path: "{{ mariadb_log_dir }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"

                - name: Set log_error
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: log_error
                    value: "{{ mariadb_log_dir }}/error.log"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-log-warnings-includes-warnings
    title: Ensure log_warnings records warnings and aborted connections
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mariadb.conf.logWarnings >= 2
    docs:
      desc: |
        This check verifies that the error log records aborted connections and warnings, not only hard errors, by requiring a verbosity of at least 2.

        `log_warnings` belongs under `[mysqld]` in the server option file. MariaDB uses a numeric level here rather than the named severities used elsewhere, and 2 is the level at which notes about aborted connections begin to appear. At 1 those messages are suppressed, and the check fails 1 and 0 alike.

        **Why this matters**

        Failed authentication does not produce an error on this server, it produces an aborted connection. That means a server at level 1 can be under a sustained password guessing attack, thousands of attempts an hour against every account name the attacker can think of, and the error log stays completely quiet. The first evidence anyone sees is the successful login, which looks like every other successful login.

        Level 2 is where that signal starts. A run of aborted connections from one address, or against one account name, is the pattern that distinguishes an attack from a misconfigured client, and it is only distinguishable if the individual events were recorded.

        The same level surfaces options the server accepted the file for but then ignored, which is the difference between a hardening change that took effect and one that was silently dropped for a typo or a version mismatch.

        The cost is modest. Warnings add far less volume than statement logging while carrying most of the security-relevant signal, so this is the setting to raise before considering anything that records queries.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'log_warnings';"
        ```

        2. Confirm aborted connection notes are present in the log:

        ```bash
        sudo grep -ciE "aborted connection|access denied" /var/log/mysql/error.log
        ```

        A passing result reports 2 or greater. A failing result reports 1 or 0, meaning aborted connections are not recorded.
      remediation:
        - id: cli
          desc: |
            To record warnings in the error log using the CLI:

            1. Set `log_warnings` in the server option file.
            2. Restart MariaDB.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*log[-_]warnings/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nlog_warnings = 2\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'log_warnings';"
            ```
        - id: script
          desc: |
            To record warnings in the error log using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            LEVEL=2

            if grep -qE "^\s*log[-_]warnings" "$MYCNF"; then
              sed -i "s|^\s*log[-_]warnings.*|log_warnings = ${LEVEL}|" "$MYCNF"
            else
              printf "[mysqld]\nlog_warnings = %s\n" "$LEVEL" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'log_warnings';"
            ```
        - id: ansible
          desc: |
            To record warnings in the error log using Ansible:

            1. Set `log_warnings` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Record warnings in the MariaDB error log
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_log_warnings: 2
              tasks:
                - name: Set log_warnings
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: log_warnings
                    value: "{{ mariadb_log_warnings }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-log-output-retained
    title: Ensure log_output is not set to NONE
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mariadb.conf.logOutput != empty
      mariadb.conf.logOutput.none(_.downcase == "none")
    docs:
      desc: |
        This check verifies that the general and slow query logs actually write somewhere, by requiring `log_output` to name a real destination.

        The option belongs under `[mysqld]` in the server option file and accepts `FILE`, `TABLE`, or both. The check fails the value `NONE`, which discards the output of both logs while leaving the logs themselves switched on, and it fails an unset option.

        **Why this matters**

        `NONE` produces a configuration that lies to a reviewer. `slow_query_log` reads as `ON`, the log appears in every inventory of enabled controls, and not a single record exists anywhere. Someone signs off on query logging being in place, and the evidence it was meant to produce was never written.

        The practical loss is the slow query log, which is the one of the two that should be on. It is the record that shows a query returning far more rows than the application ever asks for, a full table scan against a table that is always queried by key, or a statement shape that nothing in the codebase generates. Those are the fingerprints of data being pulled out in bulk through a legitimate credential, and they are the difference between noticing an exfiltration and reading about it later.

        Set `FILE` for a destination that a log pipeline can ship off the host, or `TABLE` where the records need to be queryable on the server. Note that this option decides only where output goes, not what is recorded; the general query log is a separate decision and a companion check in this policy requires it to stay off.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'log_output';"
        ```

        2. Confirm the slow query log is producing records:

        ```bash
        sudo mariadb -e "SHOW VARIABLES WHERE Variable_name IN ('slow_query_log','slow_query_log_file');"
        ```

        A passing result names `FILE`, `TABLE`, or both. A failing result reports `NONE`, or is unset.
      remediation:
        - id: cli
          desc: |
            To retain query log output using the CLI:

            1. Set `log_output` in the server option file.
            2. Restart MariaDB.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*log[-_]output/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nlog_output = FILE\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'log_output';"
            ```
        - id: script
          desc: |
            To retain query log output using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MariaDB and fail if the value is still `NONE`.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            if grep -qE "^\s*log[-_]output" "$MYCNF"; then
              sed -i "s|^\s*log[-_]output.*|log_output = FILE|" "$MYCNF"
            else
              printf "[mysqld]\nlog_output = FILE\n" >>"$MYCNF"
            fi

            systemctl restart mariadb

            value=$(mariadb -N -B -e "SELECT @@log_output;")
            if [ "$value" = "NONE" ]; then
              echo "log output is still discarded" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To retain query log output using Ansible:

            1. Set `log_output` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Retain MariaDB query log output
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set log_output
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: log_output
                    value: FILE
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-general-log-disabled
    title: Ensure the general query log is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mariadb.conf.generalLog == false
    docs:
      desc: |
        This check verifies that the general query log is off, which is the opposite of what the other logging checks in this policy ask for, and for a specific reason.

        `general_log` belongs under `[mysqld]` in the server option file. When on, the server writes every statement it receives to the log verbatim, in cleartext, including the statements that set passwords.

        **Why this matters**

        That means a `CREATE USER` or a `SET PASSWORD` statement lands in the file with the password written out in full. An enabled general query log is therefore a credential store, holding every database password created or changed while it was running, in plain text, in a file with ordinary log permissions.

        Everyone who can read logs then holds those credentials. That is a much wider group than the people who hold database administration rights: the monitoring agent shipping logs off the host, the log aggregation service and everyone with a search box on it, the backup that captured `/var/log`, and the support engineer given read access to diagnose something unrelated. An attacker who gets a foothold anywhere in that chain, or who exfiltrates the log file outright, walks away with working passwords rather than hashes, and no cracking is required.

        The performance cost is real too, since every statement is written synchronously, but the credential exposure is the reason this check exists.

        Use the `server_audit` plugin where a durable activity record is needed. It records connections and statements in a form built for retention and does not capture password arguments the way this log does. When the option is found on, treat the existing log file as exposed: rotate it, remove it securely, and rotate every credential that was set while it was running.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES WHERE Variable_name IN ('general_log','general_log_file');"
        ```

        2. When the log is enabled, check whether it already contains credentials:

        ```bash
        sudo grep -ciE "identified by|set password" "$(sudo mariadb -N -B -e 'SELECT @@general_log_file;')"
        ```

        A passing result reports `OFF`. A failing result reports `ON`, and any existing log file should be treated as a credential exposure and rotated.
      remediation:
        - id: cli
          desc: |
            To disable the general query log using the CLI:

            1. Set `general_log` in the server option file.
            2. Restart MariaDB.
            3. Remove or rotate any existing general log, because it may contain passwords.

            ```bash
            sudo sed -i -E "/^\s*#?\s*general[-_]log\b/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\ngeneral_log = OFF\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo shred -u /var/log/mysql/general.log
            ```
        - id: script
          desc: |
            To disable the general query log using a bash script:

            1. Capture the current log path before changing the option.
            2. Set the option and restart MariaDB.
            3. Securely remove the previous log, since it may hold cleartext passwords.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            log_path=$(mariadb -N -B -e "SELECT @@general_log_file;" 2>/dev/null || true)

            if grep -qE "^\s*general[-_]log\b" "$MYCNF"; then
              sed -i "s|^\s*general[-_]log\b.*|general_log = OFF|" "$MYCNF"
            else
              printf "[mysqld]\ngeneral_log = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mariadb

            if [ -n "$log_path" ] && [ -f "$log_path" ]; then
              echo "removing previous general log, which may contain cleartext passwords: $log_path"
              shred -u "$log_path"
            fi
            ```
        - id: ansible
          desc: |
            To disable the general query log using Ansible:

            1. Set `general_log` in the server option group.
            2. Notify a handler that restarts the server.
            3. Remove any existing general log file.

            ```yaml
            - name: Disable the MariaDB general query log
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_general_log_file: /var/log/mysql/general.log
              tasks:
                - name: Set general_log
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: general_log
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mariadb

                - name: Remove the previous general log
                  ansible.builtin.file:
                    path: "{{ mariadb_general_log_file }}"
                    state: absent
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-server-audit-logging-enabled
    title: Ensure server_audit_logging is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mariadb.conf.serverAuditLogging == true
    docs:
      desc: |
        This check verifies that the audit plugin is actually recording, not merely installed.

        `server_audit_logging` belongs under `[mysqld]` in the server option file and has to be on. The distinction it captures is easy to miss during a review: the `server_audit` plugin can be loaded, present in the plugin list, and reported as active, while writing nothing at all, because logging is a separate switch from loading.

        **Why this matters**

        An installed-but-idle plugin is the worst of both states. The configuration shows an audit mechanism, the compliance inventory records one, and there is no record. Nobody discovers this until an incident, at which point the questions that auditing exists to answer, which accounts connected, from where, and what they ran, have no answer for any period before the day someone noticed.

        With logging on, the plugin produces the durable activity record MariaDB provides for this purpose. It captures connections and statements in a consistent parseable format suited to shipping into a log pipeline, and it does so without the problem that rules out the general query log, which writes passwords in cleartext and cannot be retained.

        The record is what makes incident response possible rather than speculative. Given a compromised credential and a date, responders can establish which sessions used it, from which addresses, and what those sessions touched, which is what decides the scope of a breach notification.

        Set the plugin load option, the logging state, and the destination together in the option file so all three survive a restart, then confirm records are appearing.
      audit: |
        ### Audit via CLI

        1. Confirm the plugin is installed and active:

        ```bash
        sudo mariadb -e "SELECT plugin_name, plugin_status FROM information_schema.plugins WHERE plugin_name LIKE 'SERVER_AUDIT%';"
        ```

        2. Read the logging state and destination:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'server_audit%';"
        ```

        3. Confirm records are being written:

        ```bash
        sudo tail -n 5 /var/log/mysql/server_audit.log
        ```

        A passing result reports `ON` and shows recent records. A failing result reports `OFF`, meaning nothing is recorded even if the plugin is loaded.
      remediation:
        - id: cli
          desc: |
            To enable server auditing using the CLI:

            1. Install the plugin and add it to the option file so it loads on every start.
            2. Enable logging and set the destination.
            3. Restart MariaDB and confirm records appear.

            ```bash
            sudo mariadb -e "INSTALL SONAME 'server_audit';"
            sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null <<'EOF'
            [mysqld]
            plugin_load_add        = server_audit.so
            server_audit_logging   = ON
            server_audit_events    = CONNECT,QUERY,TABLE
            server_audit_file_path = /var/log/mysql/server_audit.log
            EOF
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'server_audit_logging';"
            ```
        - id: script
          desc: |
            To enable server auditing using a bash script:

            1. Install the plugin when it is not already active.
            2. Create the log directory, then set the load option, the logging state, and the destination.
            3. Restart MariaDB and confirm logging is on.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            AUDIT_LOG="/var/log/mysql/server_audit.log"

            active=$(mariadb -N -B -e "SELECT count(*) FROM information_schema.plugins
              WHERE plugin_name LIKE 'SERVER_AUDIT%' AND plugin_status = 'ACTIVE';")

            if [ "$active" -eq 0 ]; then
              mariadb -e "INSTALL SONAME 'server_audit';"
            fi

            install -d -o mysql -g mysql -m 0750 "$(dirname "$AUDIT_LOG")"

            mysqld_appended=0

            set_option() {
              local key="$1" value="$2"
              if grep -qE "^\s*${key}\b" "$MYCNF"; then
                sed -i "s|^\s*${key}\b.*|${key} = ${value}|" "$MYCNF"
                return
              fi
              if [ "$mysqld_appended" -eq 0 ]; then
                printf "\n[mysqld]\n" >>"$MYCNF"
                mysqld_appended=1
              fi
              printf "%s = %s\n" "$key" "$value" >>"$MYCNF"
            }

            if ! grep -qE "^\s*plugin[-_]load([-_]add)?\s*=.*server_audit" "$MYCNF"; then
              printf "\n[mysqld]\nplugin_load_add = server_audit.so\n" >>"$MYCNF"
              mysqld_appended=1
            fi

            set_option server_audit_logging "ON"
            set_option server_audit_file_path "$AUDIT_LOG"

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'server_audit_logging';"
            ```
        - id: ansible
          desc: |
            To enable server auditing using Ansible:

            1. Install the plugin.
            2. Set the load option, the logging state, and the destination.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Enable MariaDB server auditing
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_audit_log: /var/log/mysql/server_audit.log
              tasks:
                - name: Install the server_audit plugin
                  ansible.builtin.command:
                    cmd: mariadb -e "INSTALL SONAME 'server_audit';"
                  register: install_plugin
                  changed_when: install_plugin.rc == 0
                  failed_when: >-
                    install_plugin.rc != 0 and
                    'already' not in install_plugin.stderr

                - name: Create the log directory
                  ansible.builtin.file:
                    path: "{{ mariadb_audit_log | dirname }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"

                - name: Configure the audit plugin
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "plugin_load_add", value: "server_audit.so" }
                    - { option: "server_audit_logging", value: "ON" }
                    - { option: "server_audit_file_path", value: "{{ mariadb_audit_log }}" }
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-server-audit-events-cover-connect-and-query
    title: Ensure server_audit_events records connections and queries
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mariadb.conf.serverAuditEvents.any(_.downcase == "connect")
      mariadb.conf.serverAuditEvents.any(_.downcase == "query")
    docs:
      desc: |
        This check verifies that the audit record covers both who connected and what they ran, by requiring `server_audit_events` to include `CONNECT` and `QUERY`.

        The option belongs under `[mysqld]` in the server option file and takes a comma-separated list of event classes. The check fails when either class is missing and when the option is empty, which leaves only the plugin's own default in force rather than a stated selection.

        **Why this matters**

        The two classes answer different questions and neither is useful alone. `CONNECT` records the authentication events: which account, from which address, and whether the attempt succeeded. That is what makes a password guessing run visible as a run rather than as unrelated events, and what identifies the moment a stolen credential was first used.

        `QUERY` records the statements. That is what establishes what an attacker actually did once inside, which tables they read, whether they created an account or altered a grant, and whether data left. Connection records without statements tell you someone was there and nothing more; statements without connection records tell you what happened with no way to attribute it.

        An audit log that captures neither is a file that grows without answering anything, which is the state a plugin left at its default can be in without anyone noticing.

        Adding the `TABLE` class narrows attribution further by recording the objects each statement touched, which is worth the extra volume on servers holding regulated data. Name the classes explicitly rather than relying on a default, so the selection is visible in the option file and does not change under the server on an upgrade.
      audit: |
        ### Audit via CLI

        1. Read the effective event classes:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'server_audit_events';"
        ```

        2. Confirm both classes appear in the audit file:

        ```bash
        sudo awk -F, '{ print $3 }' /var/log/mysql/server_audit.log | sort | uniq -c
        ```

        A passing result names at least `CONNECT` and `QUERY`. A failing result omits either class, or is empty so only the plugin default applies.
      remediation:
        - id: cli
          desc: |
            To record connections and queries using the CLI:

            1. Set `server_audit_events` in the server option file.
            2. Restart MariaDB.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*server[-_]audit[-_]events/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nserver_audit_events = CONNECT,QUERY,TABLE\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'server_audit_events';"
            ```
        - id: script
          desc: |
            To record connections and queries using a bash script:

            1. Define the event classes to record.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            EVENTS="CONNECT,QUERY,TABLE"

            if grep -qE "^\s*server[-_]audit[-_]events" "$MYCNF"; then
              sed -i "s|^\s*server[-_]audit[-_]events.*|server_audit_events = ${EVENTS}|" "$MYCNF"
            else
              printf "[mysqld]\nserver_audit_events = %s\n" "$EVENTS" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'server_audit_events';"
            ```
        - id: ansible
          desc: |
            To record connections and queries using Ansible:

            1. Set `server_audit_events` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Record MariaDB connections and queries in the audit log
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_audit_events: "CONNECT,QUERY,TABLE"
              tasks:
                - name: Set server_audit_events
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: server_audit_events
                    value: "{{ mariadb_audit_events }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-server-audit-no-excluded-users
    title: Ensure server_audit_excl_users does not exempt accounts from auditing
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mariadb.conf.serverAuditExclUsers == empty
    docs:
      desc: |
        This check verifies that no account is exempt from the audit record, by requiring the exclusion list to be empty.

        `server_audit_excl_users` belongs under `[mysqld]` in the server option file and names accounts whose activity the audit plugin will not record at all. Every name on it is a hole in the record, and the check fails when the list holds anything.

        **Why this matters**

        The list is almost always populated for volume rather than for secrecy. A busy application account or a monitoring account generates most of the traffic on the server, the audit file grows faster than anyone wants, and silencing that one account brings the volume back under control.

        That account is also the one an attacker most wants. It holds broad access across the schemas the application uses, its credential is sitting in an application configuration file on a host with a much larger attack surface than the database, and its traffic is expected, so nothing about it looks unusual. Exempting it means an attacker who obtains it operates completely unrecorded: every table they read, every row they exported, every grant they altered, absent from the audit file with no gap to notice, because excluded activity leaves no trace of having been excluded.

        The remedy for volume is to narrow what is recorded rather than who is recorded. Reducing the event classes in `server_audit_events`, or dropping the object-level class if it is enabled, cuts the file size without creating an identity-shaped blind spot.

        Before removing the list, record which accounts were on it, since anything they did while exempt is not in the record and cannot be reconstructed from it.
      audit: |
        ### Audit via CLI

        1. Read the excluded account list:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'server_audit_excl_users';"
        ```

        2. Confirm whether an inclusion list is in use instead, which has the same effect of narrowing coverage:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'server_audit_incl_users';"
        ```

        A passing result reports an empty list. A failing result names one or more accounts whose activity is not recorded.
      remediation:
        - id: cli
          desc: |
            To audit every account using the CLI:

            1. Remove the exclusion list from the server option file.
            2. Narrow `server_audit_events` instead if the change produces too much volume.
            3. Restart MariaDB and confirm the list is empty.

            ```bash
            sudo sed -i -E "/^\s*server[-_]audit[-_]excl[-_]users/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'server_audit_excl_users';"
            ```
        - id: script
          desc: |
            To audit every account using a bash script:

            1. Report which accounts are currently exempt before changing anything.
            2. Remove the exclusion list from every option file.
            3. Restart MariaDB and confirm the list is empty.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            current=$(mariadb -N -B -e "SELECT @@server_audit_excl_users;" 2>/dev/null || true)
            if [ -n "$current" ]; then
              echo "removing audit exemptions for: $current"
            fi

            for dir in /etc/mysql /etc/my.cnf.d; do
              [ -d "$dir" ] || continue
              find "$dir" -type f -name "*.cnf" -exec \
                sed -i -E "/^[[:space:]]*server[-_]audit[-_]excl[-_]users/d" {} +
            done

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'server_audit_excl_users';"
            ```
        - id: ansible
          desc: |
            To audit every account using Ansible:

            1. Remove the exclusion list from every option file.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Audit every MariaDB account
              hosts: mariadb
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Remove audit exemptions
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*server[-_]audit[-_]excl[-_]users'
                    state: absent
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-innodb-encrypt-tables-enforced
    title: Ensure innodb_encrypt_tables is set to ON or FORCE
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mariadb.conf.innodbEncryptTables.downcase == "on" || mariadb.conf.innodbEncryptTables.downcase == "force"
    docs:
      desc: |
        This check verifies that InnoDB tables are encrypted on disk, by requiring `innodb_encrypt_tables` to be `ON` or `FORCE`.

        The option belongs under `[mysqld]` in the server option file and takes three values rather than the two most options in this policy take. `OFF` encrypts nothing. `ON` encrypts tables unless a statement opts out with `ENCRYPTED=NO`. `FORCE` refuses to create an unencrypted table at all. Either of the latter two satisfies this check.

        **Why this matters**

        Encryption at rest is what stands between the files and someone who has them but not the running server. A decommissioned disk that left the building without being wiped, a snapshot copied to a bucket that turns out to be readable, a backup archive on a share, a stolen laptop with a restored dump: in every one of those the attacker has the data directory and no credential at all. Encrypted tablespaces are inert without the keys; unencrypted ones open in any tool that understands the file format.

        It also contains an attacker who has reached the host but not a privileged database account. Reading the table files directly out of the data directory bypasses every grant the server would have enforced, and encryption is what makes that read produce nothing.

        `FORCE` is the stronger of the two acceptable values because it removes the per-table opt-out, so no migration script and no application can create an unencrypted table by accident, and no attacker can create one deliberately as a staging area.

        Encryption needs a key source. Confirm a key management plugin is configured before making the change, because table creation fails without one, and convert the tablespaces that already exist afterward.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'innodb_encrypt_tables';"
        ```

        2. Identify tables that are not encrypted:

        ```bash
        sudo mariadb -e "SELECT name, encryption_scheme FROM information_schema.innodb_tablespaces_encryption WHERE encryption_scheme = 0;"
        ```

        A passing result reports `ON` or `FORCE`. A failing result reports `OFF`, and the second query lists tablespaces that need converting.
      remediation:
        - id: cli
          desc: |
            To encrypt InnoDB tables using the CLI:

            1. Confirm a key management plugin is configured, because encryption cannot work without one.
            2. Set `innodb_encrypt_tables` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo mariadb -e "SELECT plugin_name, plugin_status FROM information_schema.plugins WHERE plugin_name LIKE '%key_management%';"
            sudo sed -i -E "/^\s*#?\s*innodb[-_]encrypt[-_]tables/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\ninnodb_encrypt_tables = FORCE\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'innodb_encrypt_tables';"
            ```
        - id: script
          desc: |
            To encrypt InnoDB tables using a bash script:

            1. Refuse to proceed when no key management plugin is active, because table creation would fail.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and report tables that remain unencrypted.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            keyplugin=$(mariadb -N -B -e "SELECT count(*) FROM information_schema.plugins
              WHERE plugin_name LIKE '%key_management%' AND plugin_status = 'ACTIVE';")

            if [ "$keyplugin" -eq 0 ]; then
              echo "no key management plugin is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*innodb[-_]encrypt[-_]tables" "$MYCNF"; then
              sed -i "s|^\s*innodb[-_]encrypt[-_]tables.*|innodb_encrypt_tables = FORCE|" "$MYCNF"
            else
              printf "[mysqld]\ninnodb_encrypt_tables = FORCE\n" >>"$MYCNF"
            fi

            systemctl restart mariadb

            echo "tablespaces still unencrypted:"
            mariadb -N -B -e "SELECT name FROM information_schema.innodb_tablespaces_encryption
              WHERE encryption_scheme = 0;"
            ```
        - id: ansible
          desc: |
            To encrypt InnoDB tables using Ansible:

            1. Set `innodb_encrypt_tables` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt MariaDB InnoDB tables
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_encrypt_tables: FORCE
              tasks:
                - name: Set innodb_encrypt_tables
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: innodb_encrypt_tables
                    value: "{{ mariadb_encrypt_tables }}"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-innodb-encrypt-log-enabled
    title: Ensure innodb_encrypt_log is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mariadb.conf.innodbEncryptLog == true
    docs:
      desc: |
        This check verifies that the InnoDB redo log is encrypted on disk, closing the copy of recent data that table encryption alone leaves readable.

        `innodb_encrypt_log` belongs under `[mysqld]` in the server option file and has to be on. It needs the same key management plugin that table encryption needs.

        **Why this matters**

        The redo log holds the contents of recently modified pages so the server can recover after a crash. Those page contents are table data. Encrypting the tables and leaving the redo log in cleartext therefore leaves the most recent writes to those tables sitting readable in a second file, inside the same data directory, written continuously.

        For an attacker, that is often the better target. The tables are the whole dataset and take effort to work through; the redo log is what changed recently, which is where the new orders, the new accounts, and the freshly rotated credentials are. Anyone who can read the data directory, whether through a filesystem foothold, a copied snapshot, or a backup that captured the whole directory, recovers those changes without ever holding a database credential and without touching the encrypted tablespaces at all.

        The gap is invisible from inside the database. Every table reports as encrypted, and the audit that checks table encryption passes, while the file next to them is plaintext.

        Confirm the key management plugin is active before enabling this, then restart. Data written to the redo log before the change is not retroactively protected, so treat any existing log content as exposed if the data directory was ever accessible.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'innodb_encrypt_log';"
        ```

        2. Confirm the key management plugin backing the encryption is active:

        ```bash
        sudo mariadb -e "SELECT plugin_name, plugin_status FROM information_schema.plugins WHERE plugin_name LIKE '%key_management%';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning recent changes to encrypted tables remain readable in the redo log.
      remediation:
        - id: cli
          desc: |
            To encrypt the InnoDB redo log using the CLI:

            1. Confirm a key management plugin is active.
            2. Set `innodb_encrypt_log` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*innodb[-_]encrypt[-_]log/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\ninnodb_encrypt_log = ON\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'innodb_encrypt_log';"
            ```
        - id: script
          desc: |
            To encrypt the InnoDB redo log using a bash script:

            1. Refuse to proceed when no key management plugin is active.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            keyplugin=$(mariadb -N -B -e "SELECT count(*) FROM information_schema.plugins
              WHERE plugin_name LIKE '%key_management%' AND plugin_status = 'ACTIVE';")

            if [ "$keyplugin" -eq 0 ]; then
              echo "no key management plugin is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*innodb[-_]encrypt[-_]log" "$MYCNF"; then
              sed -i "s|^\s*innodb[-_]encrypt[-_]log.*|innodb_encrypt_log = ON|" "$MYCNF"
            else
              printf "[mysqld]\ninnodb_encrypt_log = ON\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'innodb_encrypt_log';"
            ```
        - id: ansible
          desc: |
            To encrypt the InnoDB redo log using Ansible:

            1. Set `innodb_encrypt_log` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt the MariaDB InnoDB redo log
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set innodb_encrypt_log
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: innodb_encrypt_log
                    value: "ON"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-encrypt-binlog-enabled
    title: Ensure encrypt_binlog is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mariadb.conf.encryptBinlog == true
    docs:
      desc: |
        This check verifies that binary and relay log files are encrypted on disk.

        `encrypt_binlog` belongs under `[mysqld]` in the server option file and has to be on. It depends on the same key management plugin as the other encryption options here, and it takes effect for newly written files, so the logs have to be rotated after the restart for existing files to be replaced.

        **Why this matters**

        The binary log records the row images of every change the server makes. That is not metadata about the data, it is the data, written a second time in a different file. A server with encrypted tables and a cleartext binary log has published its entire change history in the clear.

        Binary logs also travel further than tables do. They are pulled by every replica, so the content lands on every replica host and on the relay logs there. They are captured by backup jobs, often into a different retention tier with different access controls. They are read by change-data-capture pipelines, which frequently run on hosts the database team does not administer. Each copy is another place an attacker only needs read access to a file to reconstruct the rows.

        They also live longer than people expect. An expiry setting that was tuned for disk space rather than for retention leaves months of changes on disk, so the exposure covers not just what the tables hold now but every value they have held since.

        Confirm a key management plugin is active, set the option, restart, and rotate the logs so the current files are rewritten encrypted.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES WHERE Variable_name IN ('encrypt_binlog','log_bin');"
        ```

        2. Confirm the current log files exist and are being rotated:

        ```bash
        sudo mariadb -e "SHOW BINARY LOGS;"
        ```

        A passing result reports `ON`. A failing result reports `OFF` while binary logging is active, meaning the log files are readable.
      remediation:
        - id: cli
          desc: |
            To encrypt binary logs using the CLI:

            1. Confirm a key management plugin is active.
            2. Set `encrypt_binlog` in the server option file.
            3. Restart MariaDB, then rotate the logs so new files are encrypted.

            ```bash
            sudo sed -i -E "/^\s*#?\s*encrypt[-_]binlog/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nencrypt_binlog = ON\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "FLUSH BINARY LOGS;"
            sudo mariadb -e "SHOW VARIABLES LIKE 'encrypt_binlog';"
            ```
        - id: script
          desc: |
            To encrypt binary logs using a bash script:

            1. Refuse to proceed when no key management plugin is active.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and rotate the logs so new files are written encrypted.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            keyplugin=$(mariadb -N -B -e "SELECT count(*) FROM information_schema.plugins
              WHERE plugin_name LIKE '%key_management%' AND plugin_status = 'ACTIVE';")

            if [ "$keyplugin" -eq 0 ]; then
              echo "no key management plugin is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*encrypt[-_]binlog" "$MYCNF"; then
              sed -i "s|^\s*encrypt[-_]binlog.*|encrypt_binlog = ON|" "$MYCNF"
            else
              printf "[mysqld]\nencrypt_binlog = ON\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "FLUSH BINARY LOGS;"
            ```
        - id: ansible
          desc: |
            To encrypt binary logs using Ansible:

            1. Set `encrypt_binlog` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt MariaDB binary logs
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set encrypt_binlog
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: encrypt_binlog
                    value: "ON"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-encrypt-tmp-disk-tables-enabled
    title: Ensure encrypt_tmp_disk_tables is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mariadb.conf.encryptTmpDiskTables == true
    docs:
      desc: |
        This check verifies that the internal temporary tables the server spills to disk are encrypted.

        `encrypt_tmp_disk_tables` belongs under `[mysqld]` in the server option file and has to be on. The files it covers are written to the directory named by `tmpdir`, which is frequently a different filesystem from the data directory and frequently has different access controls.

        **Why this matters**

        Whenever a sort, a join, or an aggregate exceeds the in-memory limit, the server writes the intermediate result to disk as a temporary table. That table holds real rows drawn from the tables being queried, so a query against an encrypted table can write its contents to an unencrypted file a few directories away.

        This is the encryption gap that is easiest to miss, because these files are transient and nobody thinks of them as storage. Transience is not protection. A file only has to exist for as long as it takes to copy, and on a busy reporting server these files exist more or less constantly. An attacker with read access to the temporary directory, which is often more permissive than the data directory precisely because it is thought of as scratch space, watches it and collects the results of other people's queries, including the large analytical ones that touch the most sensitive tables.

        A nonzero count of disk temporary tables on a running server shows the gap is not theoretical but actively in use.

        Confirm the key management plugin is active before enabling the option, and check where `tmpdir` actually points while you are there, since a temporary directory on shared storage widens who can reach these files in the first place.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'encrypt_tmp_disk_tables';"
        ```

        2. Confirm where temporary files are written and how often the server spills to disk:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'tmpdir';"
        sudo mariadb -e "SHOW GLOBAL STATUS LIKE 'Created_tmp_disk_tables';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, and a nonzero disk temporary table count shows the gap is actively being used.
      remediation:
        - id: cli
          desc: |
            To encrypt temporary disk tables using the CLI:

            1. Confirm a key management plugin is active.
            2. Set `encrypt_tmp_disk_tables` in the server option file.
            3. Restart MariaDB and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*encrypt[-_]tmp[-_]disk[-_]tables/d" \
              /etc/mysql/mariadb.conf.d/50-server.cnf
            printf '[mysqld]\nencrypt_tmp_disk_tables = ON\n' | sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'encrypt_tmp_disk_tables';"
            ```
        - id: script
          desc: |
            To encrypt temporary disk tables using a bash script:

            1. Refuse to proceed when no key management plugin is active.
            2. Set the option, replacing any existing value.
            3. Restart MariaDB and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"

            keyplugin=$(mariadb -N -B -e "SELECT count(*) FROM information_schema.plugins
              WHERE plugin_name LIKE '%key_management%' AND plugin_status = 'ACTIVE';")

            if [ "$keyplugin" -eq 0 ]; then
              echo "no key management plugin is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*encrypt[-_]tmp[-_]disk[-_]tables" "$MYCNF"; then
              sed -i "s|^\s*encrypt[-_]tmp[-_]disk[-_]tables.*|encrypt_tmp_disk_tables = ON|" "$MYCNF"
            else
              printf "[mysqld]\nencrypt_tmp_disk_tables = ON\n" >>"$MYCNF"
            fi

            systemctl restart mariadb
            mariadb -e "SHOW VARIABLES LIKE 'encrypt_tmp_disk_tables';"
            ```
        - id: ansible
          desc: |
            To encrypt temporary disk tables using Ansible:

            1. Set `encrypt_tmp_disk_tables` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt MariaDB temporary disk tables
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
              tasks:
                - name: Set encrypt_tmp_disk_tables
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: encrypt_tmp_disk_tables
                    value: "ON"
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-file-key-management-configured
    title: Ensure file_key_management_filename names an encryption key file
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-6-1
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mariadb.conf.fileKeyManagementFilename != empty
    docs:
      desc: |
        This check verifies that the server has a key source for encryption at rest, by requiring `file_key_management_filename` to name a key file.

        The option belongs under `[mysqld]` in the server option file and is read by the `file_key_management` plugin, which also has to be named in the plugin load options. The key file holds one or more key identifiers with their hex keys.

        **Why this matters**

        Every encryption option in this policy depends on a key source, and none of them does anything without one. A server configured to encrypt tables, redo logs, binary logs, and temporary tables, with no key source, does not encrypt anything: table creation fails or the options are inert, depending on which one, and the configuration reads as fully hardened throughout.

        That is the failure this check catches. The at-rest posture on paper says the data directory is unreadable without keys; the reality is a directory of plaintext files, and nobody finds out until a disk goes missing and someone tries to argue that the loss was covered.

        Naming the file explicitly also makes the key a managed artifact rather than an implicit one. A key file at a known path is something you can back up separately from the data it protects, add a new key version to when rotating, and account for when a host is decommissioned.

        Where a dedicated key management service is used instead of the file-based plugin, this check will fail, because it reads only the file-based plugin's option. That is a legitimate exception worth recording rather than working around. When a key file is used, a companion check in this policy covers its permissions, which matter as much as its existence.
      audit: |
        ### Audit via CLI

        1. Read the configured key file:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'file_key_management%';"
        ```

        2. Confirm the plugin is active:

        ```bash
        sudo mariadb -e "SELECT plugin_name, plugin_status FROM information_schema.plugins WHERE plugin_name LIKE '%key_management%';"
        ```

        A passing result names a key file and shows the plugin `ACTIVE`. A failing result leaves the option empty, meaning no key source is configured for the file-based plugin.
      remediation:
        - id: cli
          desc: |
            To configure the encryption key file using the CLI:

            1. Generate a key file containing at least one key identifier and a hex key.
            2. Restrict it to the server account, then name it in the option file along with the plugin.
            3. Restart MariaDB and confirm the plugin is active.

            ```bash
            sudo install -d -o mysql -g mysql -m 0750 /etc/mysql/encryption
            printf '1;%s\n' "$(openssl rand -hex 32)" | sudo tee /etc/mysql/encryption/keyfile.enc >/dev/null
            sudo chown mysql:mysql /etc/mysql/encryption/keyfile.enc
            sudo chmod 0600 /etc/mysql/encryption/keyfile.enc
            sudo tee -a /etc/mysql/mariadb.conf.d/50-server.cnf >/dev/null <<'EOF'
            [mysqld]
            plugin_load_add              = file_key_management.so
            file_key_management_filename = /etc/mysql/encryption/keyfile.enc
            EOF
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'file_key_management%';"
            ```
        - id: script
          desc: |
            To configure the encryption key file using a bash script:

            1. Create the key file only when it does not already exist, so an existing key is never overwritten.
            2. Restrict it to the server account.
            3. Set the plugin and filename options, then restart MariaDB.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mariadb.conf.d/50-server.cnf"
            KEY_FILE="/etc/mysql/encryption/keyfile.enc"

            install -d -o mysql -g mysql -m 0750 "$(dirname "$KEY_FILE")"

            if [ -s "$KEY_FILE" ]; then
              echo "key file already present, leaving it unchanged: $KEY_FILE"
            else
              printf '1;%s\n' "$(openssl rand -hex 32)" >"$KEY_FILE"
            fi

            chown mysql:mysql "$KEY_FILE"
            chmod 0600 "$KEY_FILE"

            mysqld_appended=0

            if ! grep -qE "^\s*plugin[-_]load([-_]add)?\s*=.*file_key_management" "$MYCNF"; then
              printf "\n[mysqld]\nplugin_load_add = file_key_management.so\n" >>"$MYCNF"
              mysqld_appended=1
            fi

            if grep -qE "^\s*file[-_]key[-_]management[-_]filename" "$MYCNF"; then
              sed -i "s|^\s*file[-_]key[-_]management[-_]filename.*|file_key_management_filename = ${KEY_FILE}|" "$MYCNF"
            else
              if [ "$mysqld_appended" -eq 0 ]; then
                printf "\n[mysqld]\n" >>"$MYCNF"
              fi
              printf "file_key_management_filename = %s\n" "$KEY_FILE" >>"$MYCNF"
            fi

            systemctl restart mariadb
            ```
        - id: ansible
          desc: |
            To configure the encryption key file using Ansible:

            1. Create the key directory and generate a key file only when one is absent.
            2. Set the plugin and filename options.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Configure the MariaDB encryption key file
              hosts: mariadb
              become: true
              vars:
                mariadb_conf: /etc/mysql/mariadb.conf.d/50-server.cnf
                mariadb_key_file: /etc/mysql/encryption/keyfile.enc
              tasks:
                - name: Create the key directory
                  ansible.builtin.file:
                    path: "{{ mariadb_key_file | dirname }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"

                - name: Check whether a key file already exists
                  ansible.builtin.stat:
                    path: "{{ mariadb_key_file }}"
                  register: key_file

                - name: Generate a key file when absent
                  ansible.builtin.shell:
                    cmd: printf '1;%s\n' "$(openssl rand -hex 32)" > {{ mariadb_key_file }}
                  when: not key_file.stat.exists

                - name: Restrict the key file
                  ansible.builtin.file:
                    path: "{{ mariadb_key_file }}"
                    owner: mysql
                    group: mysql
                    mode: "0600"

                - name: Configure the plugin and key file
                  community.general.ini_file:
                    path: "{{ mariadb_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "plugin_load_add", value: "file_key_management.so" }
                    - { option: "file_key_management_filename", value: "{{ mariadb_key_file }}" }
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-file-key-management-key-file-protected
    title: Ensure the encryption key file is readable only by the server account
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-6-1
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mariadb.conf.fileKeyManagementFilename == empty || file(mariadb.conf.fileKeyManagementFilename).permissions.group_readable == false && file(mariadb.conf.fileKeyManagementFilename).permissions.other_readable == false
    docs:
      desc: |
        This check verifies that the encryption key file can be read only by the account that runs the server.

        The file is the one named by `file_key_management_filename`, and the check requires that neither its group nor other accounts can read it, which is the mode `-rw-------` owned by the server account. A server with no key file configured passes, because there is no file on disk to protect.

        **Why this matters**

        That file holds the keys themselves. Any account that can read it can decrypt every encrypted table, every encrypted log, and every encrypted temporary file the server has ever written. It is not one control among several, it is the single secret the whole at-rest posture reduces to.

        The realistic failure is that the key and the data travel together. A backup job that captures the configuration directory alongside the data directory puts both into the same archive, and that archive is now equivalent to an unencrypted copy. A container image built with the key baked in ships it to every registry the image reaches. A host snapshot taken for troubleshooting carries both to wherever it is restored. In each case the encryption did exactly what it was configured to do and provided nothing.

        A group-readable key file also collapses the local boundary. Another service account on the same host, one compromised through an unrelated web application, reads the key and then the data files, without ever authenticating to the database or appearing in any of its logs.

        Nothing warns you about this. The plugin does not refuse to start on a permissive key file, so the file mode is the entire control. Restrict the directory holding it as well, since a traversable directory reintroduces the exposure.
      audit: |
        ### Audit via CLI

        1. Read the configured key file path:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'file_key_management_filename';"
        ```

        2. Inspect its ownership and permissions:

        ```bash
        sudo ls -l "$(sudo mariadb -N -B -e 'SELECT @@file_key_management_filename;')"
        ```

        3. Confirm the directory holding it is not traversable by other accounts:

        ```bash
        sudo ls -ld /etc/mysql/encryption
        ```

        A passing result shows the file owned by the server account as `-rw-------`, or reports no key file because a key management service is used instead. A failing result shows a mode such as `-rw-r--r--` or `-rw-r-----`.
      remediation:
        - id: cli
          desc: |
            To protect the encryption key file using the CLI:

            1. Set ownership to the server account and remove group and world access.
            2. Restrict the directory holding it as well.
            3. Confirm the resulting permissions.

            ```bash
            KEY_FILE=$(sudo mariadb -N -B -e 'SELECT @@file_key_management_filename;')
            sudo chown mysql:mysql "$KEY_FILE"
            sudo chmod 0600 "$KEY_FILE"
            sudo chmod 0750 "$(dirname "$KEY_FILE")"
            sudo ls -l "$KEY_FILE"
            ```
        - id: script
          desc: |
            To protect the encryption key file using a bash script:

            1. Resolve the key file path from the server rather than assuming a location.
            2. Apply ownership and mode to the file and its directory.
            3. Fail if group or world access remains.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            KEY_FILE=$(mariadb -N -B -e "SELECT @@file_key_management_filename;")

            if [ -z "$KEY_FILE" ]; then
              echo "no file-based key management configured; nothing to protect"
              exit 0
            fi

            if [ ! -f "$KEY_FILE" ]; then
              echo "configured key file does not exist: $KEY_FILE" >&2
              exit 1
            fi

            chown mysql:mysql "$KEY_FILE"
            chmod 0600 "$KEY_FILE"
            chmod 0750 "$(dirname "$KEY_FILE")"

            if find "$KEY_FILE" -perm /0077 | grep -q .; then
              echo "group or world access remains on $KEY_FILE" >&2
              exit 1
            fi

            ls -l "$KEY_FILE"
            ```
        - id: ansible
          desc: |
            To protect the encryption key file using Ansible:

            1. Resolve the key file path from the server.
            2. Apply ownership and mode to the file and its directory.

            ```yaml
            - name: Protect the MariaDB encryption key file
              hosts: mariadb
              become: true
              tasks:
                - name: Resolve the key file path
                  ansible.builtin.command:
                    cmd: mariadb -N -B -e "SELECT @@file_key_management_filename;"
                  changed_when: false
                  register: key_path

                - name: Restrict the key directory
                  ansible.builtin.file:
                    path: "{{ key_path.stdout | trim | dirname }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"
                  when: key_path.stdout | trim | length > 0

                - name: Restrict the key file
                  ansible.builtin.file:
                    path: "{{ key_path.stdout | trim }}"
                    owner: mysql
                    group: mysql
                    mode: "0600"
                  when: key_path.stdout | trim | length > 0
            ```

  - uid: mondoo-mariadb-security-galera-replication-encrypted
    title: Ensure Galera replication traffic is encrypted
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mariadb.conf.wsrepOn == false || mariadb.conf.wsrepProviderOptions == /socket\.ssl/
    docs:
      desc: |
        This check verifies that a Galera cluster node encrypts the replication channel it uses to talk to the other nodes.

        The transport is configured through `wsrep_provider_options`, where the `socket.ssl_key`, `socket.ssl_cert`, and `socket.ssl_ca` entries name the node's key, its certificate, and the authority that issued them. Nodes that are not part of a cluster are not asked for cluster settings: the check applies only where `wsrep_on` is enabled, so a standalone server passes.

        **Why this matters**

        The cluster link carries write sets, and a write set contains the row images of the change being replicated. Every insert and every update crosses this channel with its actual values in it, so an unencrypted link exposes the same data the tables hold, continuously, as it changes.

        This is a separate transport from the one clients use, which is what makes it easy to miss. Requiring TLS on client connections and installing a server certificate does nothing here. A cluster can present a perfectly configured encrypted front door to applications while replicating everything in cleartext behind it.

        Nodes are also usually further apart than the client tier is. Cluster members are deliberately placed in different racks, different data halls, or different availability zones so that losing one does not lose the cluster, which means the replication traffic crosses more network, and more of it that somebody else operates, than a client connection does.

        Install certificate material readable by the server account on every node, add the entries, and restart the nodes one at a time. All nodes have to agree on the transport before the cluster re-forms, so a partial rollout leaves the joiner unable to connect.
      audit: |
        ### Audit via CLI

        1. Confirm whether the node is part of a cluster:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'wsrep_on';"
        ```

        2. Read the provider options and look for the TLS entries:

        ```bash
        sudo mariadb -e "SHOW VARIABLES LIKE 'wsrep_provider_options'\G" | tr ';' '\n' | grep -i ssl
        ```

        3. Confirm the negotiated cluster state:

        ```bash
        sudo mariadb -e "SHOW STATUS WHERE Variable_name IN ('wsrep_cluster_size','wsrep_connected');"
        ```

        A passing result either reports `wsrep_on` as `OFF`, or shows `socket.ssl_key`, `socket.ssl_cert`, and `socket.ssl_ca` populated. A failing result shows a cluster node with no TLS entries.
      remediation:
        - id: cli
          desc: |
            To encrypt Galera replication traffic using the CLI:

            1. Install certificate material readable by the server account on every node.
            2. Add the TLS entries to `wsrep_provider_options`.
            3. Restart the cluster in a rolling fashion, because all nodes must agree on the transport.

            ```bash
            sudo install -o mysql -g mysql -m 0600 galera.key /etc/mysql/ssl/galera.key
            sudo install -o mysql -g mysql -m 0644 galera.crt /etc/mysql/ssl/galera.crt
            sudo sed -i -E "/^\s*#?\s*wsrep_provider_options/d" \
              /etc/mysql/mariadb.conf.d/60-galera.cnf
            printf '[galera]\nwsrep_provider_options = socket.ssl_key=/etc/mysql/ssl/galera.key;socket.ssl_cert=/etc/mysql/ssl/galera.crt;socket.ssl_ca=/etc/mysql/ssl/ca.pem\n' | sudo tee -a /etc/mysql/mariadb.conf.d/60-galera.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW STATUS LIKE 'wsrep_cluster_size';"
            ```
        - id: script
          desc: |
            To encrypt Galera replication traffic using a bash script:

            1. Verify the certificate material is present before changing configuration.
            2. Set the provider options in the Galera option file.
            3. Report that every node needs the same change before the cluster will re-form.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            GALERA_CNF="/etc/mysql/mariadb.conf.d/60-galera.cnf"
            SSL_KEY="/etc/mysql/ssl/galera.key"
            SSL_CERT="/etc/mysql/ssl/galera.crt"
            SSL_CA="/etc/mysql/ssl/ca.pem"

            for f in "$SSL_KEY" "$SSL_CERT" "$SSL_CA"; do
              if [ ! -s "$f" ]; then
                echo "missing Galera TLS material: $f" >&2
                exit 1
              fi
            done

            chown mysql:mysql "$SSL_KEY" "$SSL_CERT" "$SSL_CA"
            chmod 0600 "$SSL_KEY"

            options="socket.ssl_key=${SSL_KEY};socket.ssl_cert=${SSL_CERT};socket.ssl_ca=${SSL_CA}"

            if grep -qE "^\s*wsrep_provider_options" "$GALERA_CNF"; then
              sed -i "s|^\s*wsrep_provider_options.*|wsrep_provider_options = ${options}|" "$GALERA_CNF"
            else
              printf "wsrep_provider_options = %s\n" "$options" >>"$GALERA_CNF"
            fi

            echo "apply this change on every node, then restart them in a rolling fashion" >&2
            ```
        - id: ansible
          desc: |
            To encrypt Galera replication traffic using Ansible:

            1. Place the certificate material on every node.
            2. Set the provider options in the Galera option file.
            3. Restart nodes one at a time using a serial play so the cluster stays available.

            ```yaml
            - name: Encrypt Galera replication traffic
              hosts: mariadb_galera
              become: true
              serial: 1
              vars:
                galera_conf: /etc/mysql/mariadb.conf.d/60-galera.cnf
                galera_ssl_key: /etc/mysql/ssl/galera.key
                galera_ssl_cert: /etc/mysql/ssl/galera.crt
                galera_ssl_ca: /etc/mysql/ssl/ca.pem
              tasks:
                - name: Protect the Galera private key
                  ansible.builtin.file:
                    path: "{{ galera_ssl_key }}"
                    owner: mysql
                    group: mysql
                    mode: "0600"

                - name: Set the provider TLS options
                  community.general.ini_file:
                    path: "{{ galera_conf }}"
                    section: galera
                    option: wsrep_provider_options
                    value: >-
                      socket.ssl_key={{ galera_ssl_key }};socket.ssl_cert={{ galera_ssl_cert
                      }};socket.ssl_ca={{ galera_ssl_ca }}
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-galera-sst-method-secure
    title: Ensure wsrep_sst_method does not use unencrypted rsync
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mariadb.conf.wsrepOn == false || mariadb.conf.wsrepSstMethod.downcase != "rsync"
    docs:
      desc: |
        This check verifies that a Galera node does not use the `rsync` method to transfer a full state snapshot to a joining node.

        `wsrep_sst_method` is set in the Galera option file, and the check applies only to nodes with `wsrep_on` enabled, so a standalone server is not asked about cluster settings. A state snapshot transfer is what happens when a node joins or rejoins the cluster too far behind to catch up incrementally: an existing node sends it the entire dataset.

        **Why this matters**

        That is the single largest data exposure in a cluster's lifetime. Ordinary replication moves the changes; a snapshot transfer moves everything, all of it, in one operation, over a separate connection on its own port.

        The `rsync` method carries it with neither encryption nor authentication. Anyone able to observe the network between the two nodes during a transfer captures the complete database, and because a joining node initiates the request, an attacker who can reach the donor's transfer port during the window has a path to ask for it. Node joins are also not rare or unpredictable: they follow every restart, every host replacement, and every recovery, which are exactly the moments when attention is elsewhere.

        The `mariabackup` method is the appropriate choice for a cluster holding sensitive data, because it supports encrypting and authenticating the transfer rather than trusting the network between nodes.

        Install the backup package on every node before changing the method, since a node that cannot find the tool fails its next join rather than falling back, and roll the change through the cluster one node at a time.
      audit: |
        ### Audit via CLI

        1. Confirm whether the node is part of a cluster and read the transfer method:

        ```bash
        sudo mariadb -e "SHOW VARIABLES WHERE Variable_name IN ('wsrep_on','wsrep_sst_method');"
        ```

        2. Review the transfer account configuration used by the method:

        ```bash
        sudo grep -rniE "^\s*wsrep_sst_(method|auth)" /etc/mysql/ 2>/dev/null
        ```

        3. Confirm recent transfer activity and its outcome:

        ```bash
        sudo mariadb -e "SHOW STATUS WHERE Variable_name IN ('wsrep_local_state_comment','wsrep_cluster_status');"
        ```

        A passing result either reports `wsrep_on` as `OFF`, or names a method such as `mariabackup`. A failing result names `rsync`.
      remediation:
        - id: cli
          desc: |
            To use an encrypted snapshot transfer method using the CLI:

            1. Install the `mariadb-backup` package on every node.
            2. Create the transfer account and set `wsrep_sst_method` and `wsrep_sst_auth`.
            3. Restart nodes in a rolling fashion and confirm the method took effect.

            ```bash
            sudo apt-get install -y mariadb-backup
            sudo mariadb -e "CREATE USER 'sst'@'localhost' IDENTIFIED BY 'changeme';"
            sudo mariadb -e "GRANT RELOAD, PROCESS, LOCK TABLES, BINLOG MONITOR ON *.* TO 'sst'@'localhost';"
            sudo sed -i -E "/^\s*#?\s*wsrep_sst_method/d" \
              /etc/mysql/mariadb.conf.d/60-galera.cnf
            printf '[galera]\nwsrep_sst_method = mariabackup\n' | sudo tee -a /etc/mysql/mariadb.conf.d/60-galera.cnf >/dev/null
            sudo systemctl restart mariadb
            sudo mariadb -e "SHOW VARIABLES LIKE 'wsrep_sst_method';"
            ```
        - id: script
          desc: |
            To use an encrypted snapshot transfer method using a bash script:

            1. Refuse to proceed unless the backup tool is installed, because the method would fail on the next node join.
            2. Set the method in the Galera option file.
            3. Report that every node needs the same change.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            GALERA_CNF="/etc/mysql/mariadb.conf.d/60-galera.cnf"

            if ! command -v mariabackup >/dev/null 2>&1; then
              echo "mariabackup is not installed; install mariadb-backup first" >&2
              exit 1
            fi

            if grep -qE "^\s*wsrep_sst_method" "$GALERA_CNF"; then
              sed -i "s|^\s*wsrep_sst_method.*|wsrep_sst_method = mariabackup|" "$GALERA_CNF"
            else
              printf "wsrep_sst_method = mariabackup\n" >>"$GALERA_CNF"
            fi

            echo "apply this change on every node, then restart them in a rolling fashion" >&2
            ```
        - id: ansible
          desc: |
            To use an encrypted snapshot transfer method using Ansible:

            1. Install the backup package on every node.
            2. Set `wsrep_sst_method` in the Galera option file.
            3. Restart nodes one at a time using a serial play so the cluster stays available.

            ```yaml
            - name: Use an encrypted Galera snapshot transfer method
              hosts: mariadb_galera
              become: true
              serial: 1
              vars:
                galera_conf: /etc/mysql/mariadb.conf.d/60-galera.cnf
              tasks:
                - name: Install the backup tool
                  ansible.builtin.package:
                    name: mariadb-backup
                    state: present

                - name: Set wsrep_sst_method
                  community.general.ini_file:
                    path: "{{ galera_conf }}"
                    section: galera
                    option: wsrep_sst_method
                    value: mariabackup
                    mode: "0640"
                  notify: Restart mariadb
              handlers:
                - name: Restart mariadb
                  ansible.builtin.service:
                    name: mariadb
                    state: restarted
            ```

  - uid: mondoo-mariadb-security-client-options-no-plaintext-password
    title: Ensure no plaintext password is stored in the client option groups
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mariadb.conf.clientOptions["password"] == empty
    docs:
      desc: |
        This check verifies that no database password is written into the client option groups of a shared option file.

        The `password` option is what the check looks for, in the groups the MariaDB client programs read: `[client]`, `[client-server]`, `[client-mariadb]`, and `[mariadb-client]`. A password in any of them is available to every program that reads the file and to every account on the host that can open it.

        **Why this matters**

        A credential in a system-wide option file does not stay in that file. Configuration management checks it into a repository, where it reaches everyone with read access to that repository and stays in the history after it is removed. Backups copy it. Container images bake it into a layer that is then pushed to a registry. Host snapshots taken for troubleshooting carry it to wherever they are restored. Each copy is a working password, not a hash, usable directly against the database.

        Locally the exposure is immediate. Any account on the host that can read the option file authenticates as whatever that credential names, which on a shared host is a much larger set of principals than the database team intended, and none of them appear in the database's own access controls as having been granted anything.

        Keep the credential out of the shared file instead. A per-user option file in a home directory, restricted to its owner, keeps it scoped to one account, and a companion check in this policy covers those files' permissions. Supplying it from a secret store at run time keeps it off disk entirely.

        When one is found, remove it and rotate it. A password written into a shared file has to be treated as already compromised, because you cannot enumerate the copies.
      audit: |
        ### Audit via CLI

        1. Search the option files for a password option:

        ```bash
        sudo grep -rniE "^\s*password\s*=" /etc/mysql/ /etc/my.cnf /etc/my.cnf.d/ 2>/dev/null
        ```

        2. Check the permissions on any file that declares one:

        ```bash
        sudo ls -l /etc/mysql/my.cnf
        ```

        A passing result finds no password option in the client groups. A failing result shows a `password` line, and that credential should be treated as exposed and rotated.
      remediation:
        - id: cli
          desc: |
            To remove plaintext client passwords using the CLI:

            1. Move the credential into a per-user option file restricted to its owner, or supply it from a secret store.
            2. Remove the password option from the shared option file.
            3. Rotate the exposed password, because it must be assumed compromised.

            ```bash
            printf '[client]\npassword = new-password\n' | install -m 0600 /dev/stdin ~/.my.cnf
            sudo sed -i -E "/^\s*password\s*=/d" /etc/mysql/my.cnf
            sudo mariadb -e "SET PASSWORD FOR 'app'@'localhost' = PASSWORD('new-password');"
            sudo grep -rniE "^\s*password\s*=" /etc/mysql/ || echo "no plaintext passwords remain"
            ```
        - id: script
          desc: |
            To remove plaintext client passwords using a bash script:

            1. Report every file and line that declares a password before changing anything.
            2. Remove the option from each file, keeping a backup.
            3. Remind the operator to rotate the exposed credentials.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            found=0

            for dir in /etc/mysql /etc/my.cnf.d; do
              [ -d "$dir" ] || continue
              while IFS= read -r file; do
                if grep -qE "^[[:space:]]*password[[:space:]]*=" "$file"; then
                  echo "removing plaintext password from $file"
                  grep -nE "^[[:space:]]*password[[:space:]]*=" "$file"
                  cp -a "$file" "${file}.bak"
                  sed -i -E "/^[[:space:]]*password[[:space:]]*=/d" "$file"
                  found=1
                fi
              done < <(find "$dir" -type f -name "*.cnf")
            done

            if [ "$found" -eq 1 ]; then
              echo "rotate every password that was stored in these files; treat them as compromised" >&2
            fi
            ```
        - id: ansible
          desc: |
            To remove plaintext client passwords using Ansible:

            1. Find the option files.
            2. Remove any password option they declare.
            3. Report that the credentials need rotating.

            ```yaml
            - name: Remove plaintext MariaDB client passwords
              hosts: mariadb
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Remove password options
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*password\s*='
                    state: absent
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
                  register: removed

                - name: Report credentials that must be rotated
                  ansible.builtin.debug:
                    msg: "A stored password was removed. Rotate the affected accounts."
                  when: removed is changed
            ```

  - uid: mondoo-mariadb-security-option-files-restricted-permissions
    title: Ensure option files are not group or world accessible
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mariadb.conf.files != empty
      mariadb.conf.files.all(permissions.group_writeable == false && permissions.other_readable == false && permissions.other_writeable == false)
    docs:
      desc: |
        This check verifies that every file the server reads its configuration from is protected, not just the one at the top of the chain.

        The server resolves a chain of option files, following each `!include` and `!includedir` directive, and this check requires that none of them is group writable or accessible to other accounts. That is the mode `-rw-------` or `-rw-r-----` owned by an account the server can read as. MariaDB does not refuse to start when an option file is world readable, so a permissive mode produces no warning anywhere.

        **Why this matters**

        Read access to these files is a map of the server. They name the data directory, the paths to the TLS certificate and private key, the location of the encryption key file, the plugin directory, and the log destinations. An attacker with a foothold as any unprivileged account on the host reads them first, and every subsequent step is aimed rather than exploratory.

        Write access is worse, because it is control of the server on its next restart. An account that can modify any fragment in the chain adds `skip_grant_tables` and waits for a reboot, at which point the database accepts every connection with no password and no privilege check. It could equally repoint the encryption key file, disable audit logging, or widen the bind address.

        The fragments are where this usually goes wrong. MariaDB packages ship several files under `mariadb.conf.d`, and configuration management tooling adds more with whatever permissions happened to be in effect when it wrote them, so a single world readable drop-in undoes a correctly restricted main file. Apply ownership and mode across the whole directory, not only the entry point.
      audit: |
        ### Audit via CLI

        1. List the option files the server actually reads, in order:

        ```bash
        mariadbd --verbose --help 2>/dev/null | grep -A1 "Default options are read from"
        ```

        2. Inspect the permissions on the main file and every fragment:

        ```bash
        sudo ls -l /etc/mysql/my.cnf
        sudo ls -lR /etc/mysql/mariadb.conf.d/ /etc/mysql/conf.d/ 2>/dev/null
        ```

        A passing result shows each file with no group write bit and no world access, which is `-rw-------` or `-rw-r-----`. A failing result shows a mode such as `-rw-r--r--` on the main file or any fragment.
      remediation:
        - id: cli
          desc: |
            To restrict option file permissions using the CLI:

            1. Set ownership so the server account can read the files.
            2. Remove group write and world access from every file in the chain.
            3. Confirm the resulting permissions.

            ```bash
            sudo chown -R root:mysql /etc/mysql
            sudo find /etc/mysql -type f -name "*.cnf" -exec chmod 0640 {} +
            sudo find /etc/mysql -type d -exec chmod 0750 {} +
            sudo ls -lR /etc/mysql
            ```
        - id: script
          desc: |
            To restrict option file permissions using a bash script:

            1. Apply ownership and mode across the configuration directory.
            2. Include the traditional single-file location when present.
            3. Report any file that still allows world access.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            for target in /etc/mysql /etc/my.cnf.d; do
              [ -d "$target" ] || continue
              chown -R root:mysql "$target"
              find "$target" -type f -name "*.cnf" -exec chmod 0640 {} +
              find "$target" -type d -exec chmod 0750 {} +
            done

            if [ -f /etc/my.cnf ]; then
              chown root:mysql /etc/my.cnf
              chmod 0640 /etc/my.cnf
            fi

            remaining=$(find /etc/mysql /etc/my.cnf /etc/my.cnf.d -name "*.cnf" -perm /0007 -print 2>/dev/null || true)
            if [ -n "$remaining" ]; then
              echo "files still world accessible:" >&2
              printf '%s\n' "$remaining" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To restrict option file permissions using Ansible:

            1. Find every option file in the chain.
            2. Apply ownership and mode to each of them.

            ```yaml
            - name: Restrict MariaDB option file permissions
              hosts: mariadb
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Protect option files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    group: mysql
                    mode: "0640"
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
            ```

  - uid: mondoo-mariadb-security-user-option-files-protected
    title: Ensure per-user option files are not readable by other accounts
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mariadb.conf.userFiles.all(file.permissions.group_readable == false && file.permissions.other_readable == false)
    docs:
      desc: |
        This check verifies that the option files sitting in users' home directories, which hold their database credentials, are readable only by the account that owns them.

        Two files matter here. A `.my.cnf` holds its password as plain text. A `.mylogin.cnf` is the obfuscated credential store, and obfuscation is not encryption: the format is documented and reversible, so anyone who can read the file can recover what is in it. A host with no such files passes this check, because there is nothing to protect.

        **Why this matters**

        These files exist so a person or a service does not have to type a password, which means they contain working credentials that authenticate directly to the database. The file mode is the only thing standing between those credentials and the other accounts on the host. There is no second factor, no address restriction, and nothing in the database that would treat a connection using them as unusual.

        The concrete path is lateral movement on a shared host. An attacker who compromises an unrelated service on the machine, through a web application or an exposed agent, has a local unprivileged account. If a developer's `.my.cnf` or an operator's `.mylogin.cnf` is group readable, that foothold becomes a database credential, and the resulting connection is indistinguishable from the legitimate owner's. It authenticates as a real account, from a real host, and lands in the audit log as ordinary work.

        Restrict each file to its owner, then rotate any credential that was readable, since a file that other accounts could open has to be assumed to have been opened.
      audit: |
        ### Audit via CLI

        1. Find per-user option files and check their permissions:

        ```bash
        sudo find /home /root -maxdepth 2 \( -name ".my.cnf" -o -name ".mylogin.cnf" \) -ls 2>/dev/null
        ```

        2. Inspect the contents of a plain-text file to confirm whether it holds a credential:

        ```bash
        sudo grep -l "password" /home/*/.my.cnf 2>/dev/null
        ```

        A passing result shows every file as `-rw-------`, or finds no such files. A failing result shows a mode such as `-rw-r--r--` or `-rw-r-----`, meaning other accounts can read the credential.
      remediation:
        - id: cli
          desc: |
            To protect per-user option files using the CLI:

            1. Restrict every per-user option file to its owner.
            2. Confirm the resulting permissions.
            3. Rotate any credential that was readable, because it must be assumed exposed.

            ```bash
            sudo find /home /root -maxdepth 2 \( -name ".my.cnf" -o -name ".mylogin.cnf" \) \
              -exec chmod 0600 {} +
            sudo find /home /root -maxdepth 2 \( -name ".my.cnf" -o -name ".mylogin.cnf" \) -ls
            sudo mariadb -e "SET PASSWORD FOR 'app'@'localhost' = PASSWORD('new-password');"
            ```
        - id: script
          desc: |
            To protect per-user option files using a bash script:

            1. Report each file that is readable beyond its owner before changing it.
            2. Restrict the mode.
            3. Remind the operator to rotate credentials that were exposed.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            exposed=0

            while IFS= read -r file; do
              mode=$(stat -c "%a" "$file")
              if [ "$mode" != "600" ]; then
                echo "restricting $file (was mode $mode)"
                chmod 0600 "$file"
                exposed=1
              fi
            done < <(find /home /root -maxdepth 2 \( -name ".my.cnf" -o -name ".mylogin.cnf" \) 2>/dev/null)

            if [ "$exposed" -eq 1 ]; then
              echo "rotate the credentials stored in these files; treat them as compromised" >&2
            fi
            ```
        - id: ansible
          desc: |
            To protect per-user option files using Ansible:

            1. Find per-user option files under the home directories.
            2. Restrict each of them to its owner.

            ```yaml
            - name: Protect per-user MariaDB option files
              hosts: mariadb
              become: true
              tasks:
                - name: Find per-user option files
                  ansible.builtin.find:
                    paths:
                      - /home
                      - /root
                    patterns:
                      - ".my.cnf"
                      - ".mylogin.cnf"
                    hidden: true
                    recurse: true
                    depth: 2
                  register: user_option_files
                  failed_when: false

                - name: Restrict them to their owner
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    mode: "0600"
                  loop: "{{ user_option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
            ```
