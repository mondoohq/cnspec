policies:
  - uid: mondoo-mikrotik-security
    name: Mondoo MikroTik RouterOS Security
    version: 1.1.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: mikrotik,networkdevice
      mondoo.com/icon: mikrotik
    require:
      - provider: mikrotik
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure MikroTik RouterOS routers, switches, and access points
    docs:
      desc: |
        The Mondoo MikroTik RouterOS Security policy identifies critical misconfigurations on MikroTik devices running RouterOS that could leave your network exposed to attackers. This policy helps organizations detect and remediate hardening gaps before they can be exploited, reducing the likelihood of unauthorized device access, credential interception, open-resolver abuse, and disruption of network services.

        This policy provides security checks across key RouterOS areas:

        - Insecure management services such as Telnet, FTP, cleartext HTTP, and the cleartext API
        - Management plane access control, SSH and TLS hardening
        - Layer 2 management exposure through MAC server, neighbor discovery, and RoMON
        - Local user accounts, RADIUS, and script permissions
        - SNMP, logging, time synchronization, and DNS resolver settings
        - IPv4 and IPv6 firewall input filtering
        - PPTP, L2TP, and IPsec VPN settings
        - Wireless authentication and Layer 2 hardening

        Learn more about scanning MikroTik in the [cnspec documentation](https://mondoo.com/docs/cnspec/network/mikrotik).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Insecure Management Services
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-telnet-service-disabled
          - uid: mondoo-mikrotik-security-ftp-service-disabled
          - uid: mondoo-mikrotik-security-www-service-disabled
          - uid: mondoo-mikrotik-security-api-service-disabled
      - title: Management Plane Access Control
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-services-source-restricted
          - uid: mondoo-mikrotik-security-tls-services-modern-version
          - uid: mondoo-mikrotik-security-service-certificate-valid
          - uid: mondoo-mikrotik-security-ssh-strong-crypto
          - uid: mondoo-mikrotik-security-ssh-forwarding-disabled
      - title: Layer 2 Management Exposure
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-mac-telnet-restricted
          - uid: mondoo-mikrotik-security-mac-winbox-restricted
          - uid: mondoo-mikrotik-security-neighbor-discovery-restricted
          - uid: mondoo-mikrotik-security-romon-secured
      - title: User Account Security
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-default-admin-disabled
          - uid: mondoo-mikrotik-security-users-source-restricted
          - uid: mondoo-mikrotik-security-radius-message-authenticator
          - uid: mondoo-mikrotik-security-script-permissions-enforced
      - title: SNMP Security
        filters: asset.platform == "mikrotik" && mikrotik.snmp.enabled
        checks:
          - uid: mondoo-mikrotik-security-snmp-no-default-trap-community
          - uid: mondoo-mikrotik-security-snmp-no-default-community
          - uid: mondoo-mikrotik-security-snmp-community-read-only
          - uid: mondoo-mikrotik-security-snmp-v3-auth-priv
          - uid: mondoo-mikrotik-security-snmp-community-source-restricted
      - title: Logging and Time Synchronization
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-ntp-client-enabled
          - uid: mondoo-mikrotik-security-logging-remote-syslog
      - title: DNS Resolver Security
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-dns-doh-cert-verified
          - uid: mondoo-mikrotik-security-dns-remote-requests-disabled
      - title: Firewall Filtering
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-firewall-input-drop-rule
          - uid: mondoo-mikrotik-security-firewall-drop-invalid
          - uid: mondoo-mikrotik-security-ipv6-firewall-input-drop-rule
      - title: VPN Security
        filters: asset.platform == "mikrotik"
        checks:
          - uid: mondoo-mikrotik-security-pptp-server-disabled
          - uid: mondoo-mikrotik-security-l2tp-ipsec-required
          - uid: mondoo-mikrotik-security-ipsec-proposal-strong-algorithms
      - title: Wireless Security
        filters: asset.platform == "mikrotik" && mikrotik.wifiInterfaces != empty
        checks:
          - uid: mondoo-mikrotik-security-wifi-no-open-auth
          - uid: mondoo-mikrotik-security-wifi-wpa3-enabled
      - title: Layer 2 Hardening
        filters: asset.platform == "mikrotik" && mikrotik.bridges != empty
        checks:
          - uid: mondoo-mikrotik-security-bridge-stp-enabled
    scoring_system: average
queries:
  # ==========================================
  # Insecure Management Services
  # ==========================================
  - uid: mondoo-mikrotik-security-telnet-service-disabled
    title: Ensure the Telnet service is disabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-21
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mikrotik.services.where(name == "telnet").all(disabled == true)
    docs:
      desc: |
        This check verifies that remote administration over Telnet is turned off.

        Telnet is the original RouterOS remote console, and it carries the login exchange and every subsequent command in clear text. RouterOS enables it by default, so a device that has never been hardened is listening on TCP 23. Operators turn it off with `/ip service disable telnet`, or by disabling the `telnet` row under **IP > Services** in WinBox, leaving SSH as the remote console.

        **Why this matters**

        An attacker positioned anywhere on the path between an administrator and the router reads the password as it is typed. That includes a compromised host on the same LAN running ARP spoofing, an upstream provider, and every hop in between when the device is managed across the internet. Nothing has to be broken for this to work; Telnet simply publishes the credential.

        The credential it publishes is almost always the full-access one. RouterOS administration is rarely privilege-separated on the small deployments these devices serve, so the account an operator logs in with can rewrite the firewall, change the DNS servers handed to every client behind the router, add a new user, or install a hostile firmware image. The Meris botnet and the VPNFilter campaign both grew by collecting MikroTik management credentials at scale and reusing them, and both persisted because these routers are installed once and rarely revisited.

        The same clear-text session can be modified, not only read. An on-path attacker can alter a command in flight or inject one of their own, so an administrator watching a clean-looking terminal has no assurance the router received what was sent.

        If a legacy console server or provisioning tool still requires Telnet, confine it to a serial or dedicated out-of-band path rather than leaving the network service enabled, and confirm SSH access works before disabling Telnet so the device does not become unreachable.
      audit: |
        To verify that the Telnet service is disabled from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the management services:

           ```text
           /ip service print
           ```

        3. Inspect the `telnet` row in the `FLAGS` / `DISABLED` column.

        If the `telnet` service shows as disabled (`X` flag), the check passes. If it is enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable the Telnet service using the RouterOS CLI:

            Confirm SSH access works before disabling Telnet so you do not lose remote management. Then disable the service:

            ```text
            /ip service disable telnet
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/103841820/Services
        title: MikroTik RouterOS Services

  - uid: mondoo-mikrotik-security-ftp-service-disabled
    title: Ensure the FTP service is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-21
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mikrotik.services.where(name == "ftp").all(disabled == true)
    docs:
      desc: |
        This check verifies that file transfer to the device over unencrypted FTP is turned off.

        RouterOS runs an FTP server that authenticates with the same local accounts used for administration and exposes the device's file store, which holds configuration exports, backup files, and firmware packages. It is enabled out of the box. Operators turn it off with `/ip service disable ftp` and move transfers onto SCP or SFTP, which ride the existing SSH service and reach the same files.

        **Why this matters**

        FTP authenticates in clear text, so the password that opens the router's console travels the wire in plain view on every transfer. An attacker who captures it does not gain file access alone; the account is a device administrator.

        The files themselves are worth taking. A RouterOS configuration export names the site's IP ranges, VPN peers, firewall exceptions, and SNMP communities, and a backup file can be restored onto attacker-controlled hardware and studied at leisure. In the other direction, an attacker who can write to the file store can stage a script or a firmware package that the device later runs.

        Because FTP provides no integrity protection, a file in transit can be altered rather than merely observed. An operator uploading a firmware package across an untrusted path has no way to tell that what landed differs from what was sent.

        Backup or build systems that only speak FTP are the usual reason this service stays enabled. Point them at SFTP over the SSH service instead; RouterOS serves the same file store through it, so nothing else about the workflow changes.
      audit: |
        To verify that the FTP service is disabled from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the management services:

           ```text
           /ip service print
           ```

        3. Inspect the `ftp` row.

        If the `ftp` service shows as disabled (`X` flag), the check passes. If it is enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable the FTP service using the RouterOS CLI:

            ```text
            /ip service disable ftp
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/103841820/Services
        title: MikroTik RouterOS Services

  - uid: mondoo-mikrotik-security-www-service-disabled
    title: Ensure the cleartext HTTP (www) service is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-21
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mikrotik.services.where(name == "www").all(disabled == true)
    docs:
      desc: |
        This check verifies that the web management interface is not served over unencrypted HTTP.

        WebFig is the RouterOS browser interface, and RouterOS publishes it through two separate service entries: `www` over plain HTTP and `www-ssl` over TLS. Both are configured under `/ip service`, and `www` is the one enabled from the factory. Operators disable it with `/ip service disable www` once `www-ssl` has a certificate attached.

        **Why this matters**

        WebFig submits the administrator password to the router as an ordinary form post. Over the `www` service that post is readable by anything on the path, and unlike a console session it is typically issued from a laptop on a shared or wireless network where a hostile neighbor is a realistic assumption rather than a theoretical one.

        After login the session identifier travels the same way. Capturing it lets an attacker resume the administrator's session without ever learning the password, and RouterOS offers no second factor behind the web interface to stop them.

        The unprotected direction matters just as much. Plain HTTP gives the browser no assurance that the page came from the router, so an on-path attacker can rewrite the interface, harvest the credential through a page the administrator already trusts, or quietly change the values a form submits back to the device.

        A router that must be administered from a browser should use `www-ssl` with a certificate the administrators actually verify. Disabling `www` before `www-ssl` works leaves only the console paths, so confirm SSH or WinBox access first.
      audit: |
        To verify that the cleartext web service is disabled from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the management services:

           ```text
           /ip service print
           ```

        3. Inspect the `www` row.

        If the `www` service shows as disabled (`X` flag), the check passes. If it is enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable the cleartext web service using the RouterOS CLI:

            Ensure the TLS-protected `www-ssl` service is configured with a certificate before disabling `www`, then disable the cleartext listener:

            ```text
            /ip service disable www
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/103841820/Services
        title: MikroTik RouterOS Services

  - uid: mondoo-mikrotik-security-api-service-disabled
    title: Ensure the cleartext API service is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-21
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mikrotik.services.where(name == "api").all(disabled == true)
    docs:
      desc: |
        This check verifies that programmatic access to the device is not offered over an unencrypted API port.

        RouterOS exposes its configuration API twice: the plain `api` service on TCP 8728 and `api-ssl` on TCP 8729. Provisioning systems, monitoring tools, and hotspot integrations use it to read and rewrite the running configuration. Operators disable the cleartext listener with `/ip service disable api` and repoint automation at `api-ssl`.

        **Why this matters**

        API credentials are worth more than any single administrator's password. Automation accounts are typically shared across an entire fleet, so one capture on one link yields a credential that works on every router the platform manages. They also tend to be granted full access, because narrowing RouterOS group permissions to exactly what a tool needs is fiddly and rarely revisited.

        The cleartext API sends that login and every subsequent call in the clear, so an attacker on the path collects both the credential and a working transcript of how the fleet is configured. The transcript is what turns one capture into a mass compromise: the same calls that add a legitimate firewall rule add an attacker's, and they can be replayed against every device at once.

        An attacker with no credential at all still benefits from the open port. TCP 8728 is a distinctive fingerprint that identifies a device as MikroTik to internet-wide scanners, and RouterOS API parsing has been the subject of past remote vulnerabilities, so an exposed listener is a standing target through the long stretch between a disclosure and a firmware update these devices rarely receive.

        Some older tooling only speaks the plain API. Where it cannot be replaced, keep the service off the internet by binding it to a management network with the service's `address` restriction rather than leaving it open to any source.
      audit: |
        To verify that the cleartext API service is disabled from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the management services:

           ```text
           /ip service print
           ```

        3. Inspect the `api` row.

        If the `api` service shows as disabled (`X` flag), the check passes. If it is enabled, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable the cleartext API service using the RouterOS CLI:

            Configure `api-ssl` with a certificate for any automation that needs API access, then disable the cleartext listener:

            ```text
            /ip service disable api
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/47579160/API
        title: MikroTik RouterOS API

  # ==========================================
  # Management Plane Access Control
  # ==========================================
  - uid: mondoo-mikrotik-security-services-source-restricted
    title: Ensure management services restrict allowed source addresses
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.services
        .where(disabled != true && name.in(["api", "api-ssl", "ftp", "ssh", "telnet", "winbox", "www", "www-ssl"]))
        .all(address != empty && address != /(^|,)(0\.0\.0\.0\/0|::\/0)(,|$)/)
    docs:
      desc: |
        This check verifies that every management service the device is running accepts connections only from a defined set of administrative addresses.

        Each management entry under `/ip service` carries a field holding the IPv4 and IPv6 prefixes allowed to reach that listener. Older RouterOS releases call it `address`, and current releases print it as `available-from` while still accepting `address` when setting it. RouterOS leaves it empty, which means any host that can route to the device may open a session on SSH, WinBox, WebFig, or the API. Operators populate it per service with `/ip service set ssh address=192.168.88.0/24`, or through the **IP > Services** dialog in WinBox. The check covers the `api`, `api-ssl`, `ftp`, `ssh`, `telnet`, `winbox`, `www`, and `www-ssl` services and fails when an enabled one has no restriction or allows `0.0.0.0/0` or `::/0`.

        **Why this matters**

        An empty address list on an internet-facing router puts the login prompt in front of every scanner on the internet. These devices are found in minutes; WinBox on TCP 8291 and the API port are unmistakable, and the installed population is large enough that campaigns scanning specifically for MikroTik hardware run continuously. The password then becomes the only thing standing between an attacker and the device.

        Passwords are not the only thing that fails. When a remote vulnerability in a management service is published, an unrestricted listener is exploitable the moment a proof of concept circulates. That is the pattern behind the mass MikroTik compromises: an unpatched management plane reachable from anywhere, on hardware nobody logs into after the day it was installed. A source restriction keeps the flaw out of reach while the fix goes un-applied, which on these devices can mean permanently.

        Restricting the source also changes what a stolen credential is worth. A password lifted from a technician's laptop or reused from an unrelated breach only works from inside the listed ranges, which usually means the attacker has to establish a foothold on the management network first.

        Where a service must be reachable from changing locations, terminate a VPN on the device and list the VPN pool rather than opening the service to any address. Include the address you are working from before you apply the change; a restriction that omits it ends the session applying it.
      audit: |
        To verify that management services restrict source addresses from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the services with their allowed address ranges:

           ```text
           /ip service print detail
           ```

        3. For each management service that is not disabled, inspect the `address` or `available-from` field.

        If every enabled management service is scoped to trusted management networks, the check passes. If any is empty, which allows any source, or includes `0.0.0.0/0` or `::/0`, the check fails.
      remediation:
        - id: cli
          desc: |
            To restrict management services to trusted source addresses using the RouterOS CLI:

            Set the `address` field on every service that `/ip service print` reports as enabled. The field takes a comma-separated list of IPv4 and IPv6 prefixes, so several administrative networks can be permitted at once:

            ```text
            /ip service set ssh address=192.168.88.0/24,10.10.0.0/24
            /ip service set winbox address=192.168.88.0/24,10.10.0.0/24
            /ip service set www-ssl address=192.168.88.0/24,10.10.0.0/24
            ```

            A service left without a restriction still accepts connections from any host, so repeat the command for each remaining enabled service.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/103841820/Services
        title: MikroTik RouterOS Services

  - uid: mondoo-mikrotik-security-tls-services-modern-version
    title: Ensure TLS-protected services enforce a modern TLS version
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mikrotik.services
        .where(disabled != true && tlsVersion != empty)
        .all(tlsVersion != "any")
    docs:
      desc: |
        This check verifies that the encrypted management services negotiate a pinned, modern TLS version instead of accepting whatever a client offers.

        `www-ssl`, `api-ssl`, and on current releases `reverse-proxy` each carry a `tls-version` setting under `/ip service`. RouterOS ships it as `any`, which lets the service fall back to obsolete protocol versions for the benefit of old clients. Operators pin it with `/ip service set www-ssl tls-version=only-1.2`, and the same for every other enabled service that has the setting.

        **Why this matters**

        A service willing to speak an obsolete protocol version can be made to do so. An attacker on the path strips the modern options out of the client's handshake, the router agrees to what is left, and the session runs under a protocol whose weaknesses have public tooling. The administrator sees a padlock and a working session throughout.

        What that downgraded session protects is the router's administrative credential and the configuration it carries. Recovering it does not require breaking the negotiated cipher outright; the older protocol versions have practical attacks against the handshake and the record layer that recover selected plaintext, and selected plaintext is enough when the interesting bytes are a password or a session cookie.

        Leaving the floor at `any` also hides the problem from anyone auditing by inspection. The service reports itself as TLS-protected and an ordinary browser connects over a current version, so the weakness surfaces only when the attacker, rather than the client, chooses the version.

        Pin the highest version every management client supports. If an old provisioning tool cannot reach the router afterwards, update or replace that tool rather than returning the whole service to `any`.
      audit: |
        To verify the minimum TLS version of TLS-protected services from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the services in detail:

           ```text
           /ip service print detail
           ```

        3. For each enabled service that shows a `tls-version` field, inspect its value.

        If every enabled TLS service sets `tls-version` to a specific modern value (for example `only-1.2`), the check passes. If any is set to `any`, the check fails.
      remediation:
        - id: cli
          desc: |
            To enforce a modern minimum TLS version using the RouterOS CLI:

            ```text
            /ip service set www-ssl tls-version=only-1.2
            /ip service set api-ssl tls-version=only-1.2
            /ip service set reverse-proxy tls-version=only-1.2
            ```

            Skip `reverse-proxy` on releases that do not list it under `/ip service`.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/103841820/Services
        title: MikroTik RouterOS Services

  # ==========================================
  # User Account Security
  # ==========================================
  - uid: mondoo-mikrotik-security-default-admin-disabled
    title: Ensure the default admin account is disabled or removed
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mikrotik.users.where(name == "admin").all(disabled == true)
    docs:
      desc: |
        This check verifies that the factory `admin` account can no longer be used to log in.

        RouterOS creates a single local user named `admin` at the factory, and on older releases it has no password until someone sets one. Administration is meant to move to per-person accounts under `/user`, after which the factory account is disabled with `/user disable admin` or deleted with `/user remove admin`.

        **Why this matters**

        `admin` is the first username every credential-guessing tool tries against a MikroTik device, so leaving it active hands an attacker half the login for free. The password becomes the entire defense, and on this hardware it is frequently the one an installer chose once and reused across every site they built.

        That reuse is the specific mechanism behind the large MikroTik botnets. VPNFilter and Meris did not need a novel exploit on each device; a known account name combined with a default or shared password recruited routers in bulk, and the routers stayed recruited because nobody logs into them again.

        An account nobody owns is also an account nobody watches. A log entry attributing a configuration change to `admin` names no person, so a change made by an intruder reads exactly like routine work by whoever happened to be on shift, and the intrusion is discovered by its effects rather than by its trail.

        Create the replacement account and confirm you can log in with it before disabling `admin`. A device left with no usable full-access account is recovered only by a reset that erases its configuration, and for a router at an unstaffed site that means someone has to drive there.
      audit: |
        To verify that the default admin account is disabled from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the local user accounts:

           ```text
           /user print
           ```

        3. Look for an account named `admin`.

        If no `admin` account exists, or it is present but disabled, the check passes. If an enabled `admin` account exists, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable the default admin account using the RouterOS CLI:

            First create a replacement administrator account and confirm you can log in with it, so disabling `admin` does not leave the device without an administrator:

            ```text
            /user add name=netadmin group=full password=<strong-password>
            ```

            Then disable (or remove) the default account:

            ```text
            /user disable admin
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978504/User
        title: MikroTik RouterOS User Management

  - uid: mondoo-mikrotik-security-users-source-restricted
    title: Ensure local user accounts restrict allowed source addresses
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.users
        .where(disabled != true)
        .all(address != empty && address != /(^|,)(0\.0\.0\.0\/0|::\/0)(,|$)/)
    docs:
      desc: |
        This check verifies that each local account able to log in is bound to the networks it may log in from.

        Alongside the per-service restriction under `/ip service`, RouterOS carries an `address` field on every entry in `/user`. It lists the prefixes from which that specific account may authenticate, on any service, and it is empty by default. Operators set it with `/user set netadmin address=192.168.88.0/24`.

        **Why this matters**

        The service restriction decides which hosts may reach a login prompt; this one decides which hosts a given credential works from. The difference shows up whenever the two should not match: a monitoring account that only one collector should ever use, or a contractor's account that should only work from the site they maintain, can be pinned tightly even though the service itself stays open to the whole management network.

        That turns a stolen password into a much narrower asset. An attacker who lifts an operator's credential from a compromised workstation, recovers it from a configuration backup, or replays one reused from an unrelated breach still has to originate from inside the listed prefixes for it to be worth anything.

        It also limits what a compromised host on the management network can reach. Management segments accumulate jump boxes, monitoring servers, and technician laptops, and any of them is a plausible foothold. Binding accounts individually means a foothold in one corner of that network cannot use the credentials belonging to another.

        Accounts held by people who roam belong pinned to a VPN pool rather than left open. As with any change that can lock you out, confirm the address you are working from falls inside the range before applying it to your own account.
      audit: |
        To verify that user accounts restrict source addresses from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the user accounts in detail:

           ```text
           /user print detail
           ```

        3. For each enabled account, inspect the `address` field.

        If every enabled account has an `address` scoped to trusted networks, the check passes. If any enabled account has an empty `address` or one that includes `0.0.0.0/0` or `::/0`, the check fails.
      remediation:
        - id: cli
          desc: |
            To restrict a user account to trusted source addresses using the RouterOS CLI:

            ```text
            /user set netadmin address=192.168.88.0/24
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978504/User
        title: MikroTik RouterOS User Management

  # ==========================================
  # SNMP Security
  # ==========================================
  - uid: mondoo-mikrotik-security-snmp-no-default-trap-community
    title: Ensure the SNMP trap community is not the default 'public'
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: false
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mikrotik.snmp.trapCommunity != "public"
    docs:
      desc: |
        This check verifies that SNMP traps leaving the device are not tagged with the factory community string `public`.

        The trap community is the shared secret RouterOS presents when it sends unsolicited SNMP notifications to a monitoring host, and it names one of the entries defined under `/snmp community`. RouterOS ships that list with a single entry called `public` and points the trap community at it. Operators define a unique community and select it with `/snmp set trap-community=<unique-community-string>`.

        **Why this matters**

        In SNMP v1 and v2c the community string is the whole of the authentication scheme, and it crosses the network in clear text. A value of `public` means it is not a secret at all: it is the first string every SNMP scanner sends and the default every tool assumes.

        A monitoring host that accepts traps under `public` accepts them from anyone who can reach it. An attacker forging traps can raise alarms that pull operators toward the wrong part of the network while the real activity happens elsewhere, or flood the receiver until a genuine alert about the intrusion is lost among fabricated ones. Trap data is also commonly fed straight into dashboards and ticketing systems that treat it as trustworthy input and act on it automatically.

        The untouched default usually signals that the read community was never changed either, and a readable SNMP agent hands over interface names, addressing, routing neighbors, uptime, and the exact RouterOS version. That is precisely the reconnaissance an attacker needs to decide whether the device is worth an exploit and which one to reach for.

        Where the monitoring platform supports it, move to SNMP v3 with authentication and privacy instead of a shared community, and restrict the agent to the monitoring hosts using the community's own `address` field.
      audit: |
        To verify the SNMP trap community from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the SNMP configuration:

           ```text
           /snmp print
           ```

        3. Inspect the `trap-community` field.

        If `trap-community` is set to a unique value, the check passes. If it is `public`, the check fails.
      remediation:
        - id: cli
          desc: |
            To set a non-default SNMP trap community using the RouterOS CLI:

            The `trap-community` setting selects one of the communities defined under `/snmp community`, so the community has to exist before it can be selected. Create it first, scoped to the hosts allowed to reach the agent:

            ```text
            /snmp community add name=<unique-community-string> address=<management-subnet> read-access=yes write-access=no
            /snmp set trap-community=<unique-community-string>
            ```

            RouterOS ships with a community named `public`. If you would rather not add a second entry, rename the shipped one and select that instead. This also changes the string existing pollers must present, so update them at the same time:

            ```text
            /snmp community set [find name=public] name=<unique-community-string> address=<management-subnet> write-access=no
            /snmp set trap-community=<unique-community-string>
            ```

            Where practical, also migrate to SNMP v3 with authentication and encryption and restrict SNMP access to trusted management hosts.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978519/SNMP
        title: MikroTik RouterOS SNMP

  # ==========================================
  # Time Synchronization
  # ==========================================
  - uid: mondoo-mikrotik-security-ntp-client-enabled
    title: Ensure the NTP client is enabled with at least one server
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-45
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mikrotik.ntpClient.enabled == true
      mikrotik.ntpClient.servers != empty
    docs:
      desc: |
        This check verifies that the device keeps its clock synchronized against a time source.

        Most RouterOS hardware has no battery-backed real-time clock, so a router that is not synchronizing starts from the firmware build date after every reboot and drifts from there. The client lives at `/system ntp client`, and operators turn it on with `/system ntp client set enabled=yes servers=time.cloudflare.com,pool.ntp.org`.

        **Why this matters**

        Without it, the device's log timestamps are fiction. When something does happen on the network, the router's account of it cannot be lined up against the firewall, the switch, or the server logs, and the one device that actually saw the traffic becomes the one device whose evidence is unusable. RouterOS keeps only a small in-memory log by default, so the remote syslog that would have preserved the record inherits the wrong times too.

        A wrong clock also breaks certificate validation. A router whose date sits far in the past accepts certificates that have since expired or been revoked; one wrong in the other direction rejects valid ones, taking down the encrypted resolver, the TLS management services, and certificate-authenticated VPN tunnels at once. Failures of that shape are usually misdiagnosed as network problems and worked around by switching verification off, which is how a clock fault becomes a lasting exposure.

        Anything scheduled stops being dependable as well. Time-based firewall rules, scheduler scripts, DHCP lease expiry, and hotspot session limits all key off a clock that is silently wrong.

        Configure more than one server so a single unreachable source does not leave the device unsynchronized, and prefer sources the router can reach without traversing tunnels whose own certificates depend on the clock.
      audit: |
        To verify that the NTP client is enabled from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the NTP client configuration:

           ```text
           /system ntp client print
           ```

        3. Inspect the `enabled` and `servers` fields.

        If `enabled` is `yes` and `servers` lists at least one server, the check passes. If the client is disabled or has no servers configured, the check fails.
      remediation:
        - id: cli
          desc: |
            To enable and configure the NTP client using the RouterOS CLI:

            ```text
            /system ntp client set enabled=yes servers=time.cloudflare.com,pool.ntp.org
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/40992869/NTP
        title: MikroTik RouterOS NTP

  # ==========================================
  # DNS Resolver Security
  # ==========================================
  - uid: mondoo-mikrotik-security-dns-doh-cert-verified
    title: Ensure DNS over HTTPS verifies the server certificate
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-i-transmission-security-integrity-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-23
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mikrotik.dns.useDohServer == "" || mikrotik.dns.verifyDohCert == true
    docs:
      desc: |
        This check verifies that when the router resolves names over DNS over HTTPS, it authenticates the resolver it is talking to.

        RouterOS can forward DNS queries to a DoH endpoint named in `/ip dns use-doh-server`, and it carries a separate `verify-doh-cert` switch deciding whether that endpoint's TLS certificate is checked against the imported certificate authorities. The switch is off by default, so DoH can be running with no verification behind it. Operators import the trusted roots and set `/ip dns set verify-doh-cert=yes`.

        **Why this matters**

        The router is the resolver for everything behind it. Whatever answer it accepts is the answer every client at the site receives, so control of its DNS is control of where the site's traffic goes: the update server, the VPN concentrator, the payment endpoint, the login page.

        With verification off, seizing that control needs no certificate an attacker could not produce themselves. Anything on the path between the router and the provider can present its own certificate, the router accepts it, and the encrypted channel terminates at the attacker. From the router's side this looks exactly like working DoH, which is the trap: an operator who enabled DoH believing it stopped DNS tampering has only stopped the passive observer while handing the active one a clean interception point.

        The redirection is durable and hard to spot. It changes no configuration on the router, logs no error, and survives until somebody thinks to inspect the answers coming back rather than the setting that says DoH is on.

        Verification depends on the device holding current CA certificates and a correct clock, so import the resolver's root and confirm time synchronization before enabling it, or name resolution stops entirely.
      audit: |
        To verify DoH certificate validation from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the DNS settings:

           ```text
           /ip dns print
           ```

        3. Inspect the `use-doh-server` and `verify-doh-cert` fields.

        If no DoH server is configured, or a DoH server is configured with `verify-doh-cert=yes`, the check passes. If a DoH server is configured with `verify-doh-cert=no`, the check fails.
      remediation:
        - id: cli
          desc: |
            To enable DoH certificate verification using the RouterOS CLI:

            Ensure the appropriate root CA certificates are imported, then enable verification:

            ```text
            /ip dns set verify-doh-cert=yes
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/37748767/DNS
        title: MikroTik RouterOS DNS

  # ==========================================
  # Firewall Filtering
  # ==========================================
  - uid: mondoo-mikrotik-security-firewall-input-drop-rule
    title: Ensure the firewall input chain drops unmatched traffic
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-4
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      inputRules = mikrotik.firewallRules.where(chain == "input" && disabled != true && invalid != true)
      inputRules != empty
      inputRules.last {
        action.in(["drop", "reject"])
        protocol == empty
        srcAddress == empty
        dstAddress == empty
        srcAddressList == empty
        dstAddressList == empty
        srcPort == empty
        dstPort == empty
        inInterface == empty
        connectionState == empty
      }
    docs:
      desc: |
        This check verifies that traffic addressed to the router itself is denied unless a rule explicitly permits it.

        The `input` chain in `/ip firewall filter` governs packets destined for the router rather than passing through it, and RouterOS accepts anything no rule matches. A default-deny posture therefore has to be written out: accept rules for established connections and for trusted management sources, then a closing `/ip firewall filter add chain=input action=drop` at the end of the chain.

        The check requires the last enabled rule of the input chain to drop or reject without matching on protocol, source or destination address, address list, port, input interface, or connection state. A final rule such as `action=drop protocol=tcp dst-port=23` blocks one service and lets everything else through, so it fails. RouterOS also supports matchers the check cannot see, such as `in-interface-list`. A final rule limited only by one of those, like the default configuration's `in-interface-list=!LAN` drop, passes.

        **Why this matters**

        Everything the device listens on sits behind that chain. Without the closing drop, SSH, WinBox, WebFig, the API, DNS, SNMP, and any VPN responder are reachable from every network the router can be routed from, which on a WAN interface means the whole internet. Disabling the services nobody uses narrows the list, but whatever remains is still exposed to the world rather than to the operators.

        That exposure is what the large MikroTik compromises fed on. Scanners sweep for the distinctive WinBox and API ports continuously, so a device answering from a public address is inventoried long before anyone attacks it. When the next management-plane vulnerability is published, the attacker already holds the target list, and these routers are seldom patched in the window that follows.

        An open input chain also makes the device itself a resource to abuse. Its DNS resolver can be enlisted as an amplifier in reflection attacks against third parties, and connection tracking and CPU on small hardware can be consumed by unsolicited traffic until legitimate forwarding suffers.

        The drop rule takes effect the instant it is added, so place the accept rules for established traffic and for your own source address above it and work in Safe Mode. A lockout on a router at an unstaffed site is resolved by a site visit.
      audit: |
        To verify the firewall input chain from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the firewall filter rules for the input chain:

           ```text
           /ip firewall filter print where chain=input
           ```

        3. Find the last rule in the list that is not disabled.

        If that last enabled input rule has `action=drop` or `action=reject` and no protocol, address, address list, port, `in-interface`, or `connection-state` matcher, the check passes. If the chain is empty, ends in any other action, or ends in a drop limited by one of those matchers, the check fails, because traffic that reaches the end of the chain is accepted.
      remediation:
        - id: cli
          desc: |
            To add a default-deny rule to the input chain using the RouterOS CLI:

            **Warning**: the drop rule takes effect the moment it is added and ends any management session whose source address is not covered by an accept rule above it. Enter Safe Mode first by pressing `[CTRL]+[X]` in the terminal or clicking **Safe Mode** in WinBox. RouterOS undoes every change made during a Safe Mode session if that session ends abnormally, so a rule that locks you out is rolled back once the connection drops.

            Add the accept rules **before** the drop. The router has to accept established and related connections so replies to its own traffic are not discarded, and management access from your trusted sources so administration keeps working. Append the drop last:

            ```text
            /ip firewall filter add chain=input connection-state=established,related action=accept
            /ip firewall filter add chain=input src-address=192.168.88.0/24 action=accept
            /ip firewall filter add chain=input action=drop
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/48660574/Filter
        title: MikroTik RouterOS Firewall Filter

  - uid: mondoo-mikrotik-security-firewall-drop-invalid
    title: Ensure the firewall drops invalid connection-state packets
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-4
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.firewallRules
        .where(disabled != true && invalid != true && action == "drop")
        .any(connectionState == /invalid/)
    docs:
      desc: |
        This check verifies that packets connection tracking cannot associate with any known session are discarded.

        RouterOS marks a packet `invalid` when its connection tracker holds no state matching it: a mid-stream segment for a session the router never saw open, a response with no request, or a packet whose flags contradict the state it claims. The recommended ruleset discards them early with `/ip firewall filter add chain=input connection-state=invalid action=drop`, repeated for the `forward` chain.

        **Why this matters**

        Invalid packets are the raw material of firewall evasion. Scanners send crafted segments belonging to no session precisely because rules written around normal traffic often let them slip past, and whatever comes back reveals which ports are open and what sits behind them. Dropping the class outright ends that line of probing instead of answering it.

        Passing invalid packets along also produces outcomes nobody intended. Later rules evaluate them without state context, so a packet that would be denied on its merits can match an accept rule written for the established traffic it is imitating, and a source-spoofed segment can be forwarded into an internal network on the strength of that match.

        There is a resource dimension on the small hardware this software usually runs on. Every unsolicited packet costs tracker lookups and CPU, and a sustained stream of them is a cheap way to degrade forwarding for real traffic on a device with little headroom to spare.

        Asymmetric routing is the one arrangement where this rule legitimately causes trouble, because the router genuinely sees only one direction of a flow and marks the other half invalid. Correct the routing or scope the rule to the paths it does not affect, rather than dropping it from the ruleset.
      audit: |
        To verify that invalid packets are dropped from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the firewall filter rules:

           ```text
           /ip firewall filter print
           ```

        3. Look for a rule with `connection-state=invalid` and `action=drop` that is not disabled.

        If such an enabled rule exists, the check passes. If none does, or the only such rule is disabled, the check fails.
      remediation:
        - id: cli
          desc: |
            To drop invalid connection-state packets using the RouterOS CLI:

            ```text
            /ip firewall filter add chain=input connection-state=invalid action=drop
            /ip firewall filter add chain=forward connection-state=invalid action=drop
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/130220087/Connection+tracking
        title: MikroTik RouterOS Connection Tracking

  # ==========================================
  # Wireless Security
  # ==========================================
  - uid: mondoo-mikrotik-security-wifi-no-open-auth
    title: Ensure WiFi access points require authentication
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-18
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1-2
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mikrotik.wifiInterfaces.where(disabled != true && mode == "ap").all(authenticationTypes != empty)
    docs:
      desc: |
        This check verifies that no wireless network the device broadcasts lets clients associate without credentials.

        A RouterOS access-point interface carries a list of authentication types in its security settings, and an empty list means an open network: any device in range associates and lands on the LAN. Operators populate it with `/interface/wifi/set [find name=wifi1] security.authentication-types=wpa2-psk,wpa3-psk` alongside a passphrase.

        **Why this matters**

        An open SSID puts the internal network within reach of anyone in the parking lot. There is no credential to steal or guess; association is the whole of it, and from there the attacker is an ordinary host on the segment, able to reach the router's own management services, the printers, the point-of-sale terminals, and whatever else shares the VLAN.

        Open networks carry no link-layer encryption either, so every client's traffic is readable out of the air by anyone with a radio, whether or not they associate at all. That includes the credentials clients send to internal systems and the DNS queries that map out what those systems are.

        Because the access point is usually also the gateway, a foothold gained this way is a foothold on the device that carries the entire site. From an associated position an attacker can work directly against the management plane, and the small sites where these units are deployed rarely have anything watching the wireless segment to notice the attempt.

        A deliberately public network is a legitimate case, but it belongs on its own VLAN and bridge, denied any path to the management addresses or the internal ranges, rather than on an open SSID bridged straight to the LAN.
      audit: |
        To verify WiFi authentication from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the WiFi interfaces and their security settings:

           ```text
           /interface/wifi/print detail
           ```

        3. For each enabled access-point interface, inspect the `security.authentication-types` value.

        If every enabled access-point interface has at least one authentication type configured, the check passes. If any has none (open network), the check fails.
      remediation:
        - id: cli
          desc: |
            To require authentication on a WiFi access point using the RouterOS CLI:

            Configure a passphrase and authentication types on the interface (or its security profile):

            ```text
            /interface/wifi/set [find name=wifi1] security.authentication-types=wpa2-psk,wpa3-psk security.passphrase=<strong-passphrase>
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/224559120/WiFi
        title: MikroTik RouterOS WiFi

  - uid: mondoo-mikrotik-security-wifi-wpa3-enabled
    title: Ensure WiFi access points support WPA3
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mikrotik.wifiInterfaces
        .where(disabled != true && mode == "ap")
        .all(authenticationTypes.any(_ == /wpa3/))
    docs:
      desc: |
        This check verifies that the wireless networks the device broadcasts offer WPA3 rather than only the older WPA2 pre-shared key.

        WPA3 replaces WPA2's four-way handshake with Simultaneous Authentication of Equals, which exposes nothing an eavesdropper can attack away from the network. RouterOS lists it as an authentication type beside WPA2, so operators enable it with `/interface/wifi/set [find name=wifi1] security.authentication-types=wpa2-psk,wpa3-psk` and can run both while older clients migrate.

        **Why this matters**

        Against WPA2-PSK an attacker does not need to linger near the network. Capturing one client's association, or forcing one by deauthenticating a client that is already connected, yields material that can be carried away and guessed offline at whatever rate the attacker's hardware allows. Site passphrases are commonly the business name, the street address, or something printed on a card by the door, and those fall in seconds.

        Recovering the passphrase yields more than a way in. Every WPA2 client on that SSID derives its session keys from the same shared secret, so an attacker holding it can decrypt traffic recorded earlier from other clients as well. WPA3 breaks both halves of that: guessing has to happen online against the access point, where it is rate-limited and visible, and each session gets forward secrecy, so a passphrase recovered next year does not open traffic captured today.

        The exposure lasts as long as the deployment does. A wireless passphrase at a small site is changed almost never, so a capture taken now stays useful for years, and the access point that would have to be reconfigured is the one nobody visits.

        Mixed WPA2 and WPA3 mode keeps legacy clients working, but it leaves the WPA2 path fully available to attack, so treat it as a migration state and retire WPA2 once the client inventory allows.
      audit: |
        To verify WPA3 support from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the WiFi interfaces and their security settings:

           ```text
           /interface/wifi/print detail
           ```

        3. For each enabled access-point interface, inspect `security.authentication-types`.

        If every enabled access-point interface includes a WPA3 authentication type (for example `wpa3-psk`), the check passes. If any offers only WPA2 or weaker, the check fails.
      remediation:
        - id: cli
          desc: |
            To enable WPA3 on a WiFi access point using the RouterOS CLI:

            Add a WPA3 authentication type (mixed WPA2/WPA3 mode shown for client compatibility):

            ```text
            /interface/wifi/set [find name=wifi1] security.authentication-types=wpa2-psk,wpa3-psk
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/224559120/WiFi
        title: MikroTik RouterOS WiFi

  # ==========================================
  # Layer 2 Hardening
  # ==========================================
  - uid: mondoo-mikrotik-security-bridge-stp-enabled
    title: Ensure bridges run a spanning-tree protocol
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-4
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mikrotik.bridges.where(disabled != true).all(protocolMode != "none")
    docs:
      desc: |
        This check verifies that each bridge on the device runs a spanning-tree protocol rather than forwarding with no loop protection.

        A RouterOS bridge joins ports into a single Layer 2 domain, and its `protocol-mode` selects `stp`, `rstp`, `mstp`, or `none`. Set to `none`, the bridge forwards frames without exchanging topology information and with no mechanism to block a redundant path. Operators enable it with `/interface bridge set [find name=bridge1] protocol-mode=rstp`.

        **Why this matters**

        A loop on a bridge with no spanning tree does not degrade the network, it stops it. Broadcast frames circulate with no hop count to retire them, multiply at every pass, and saturate the segment within seconds. The router loses the capacity to answer its own management traffic, so the device an operator would use to fix the problem goes unreachable at the same moment the problem starts.

        Creating that loop takes one patch cable in the wrong pair of ports, and at the small unstaffed sites these devices serve it is as likely to come from a tidy-minded person plugging in a spare lead as from anyone hostile. It is also trivially reproducible by an attacker with a moment of physical access, and it leaves nothing behind afterwards to explain what happened.

        Recovery is the expensive part. There is no remote fix for a saturated segment; somebody has to reach the site and unplug something, and until they do the site is off the network entirely. For infrastructure whose whole appeal is that it can be installed and left alone, an outage that requires a visit is the worst failure mode on offer.

        A bridge with a single uplink and no physical possibility of a second path is the case where `none` is defensible, and even there RSTP costs nothing to leave running. Where the bridge faces user ports, pair it with edge-port and BPDU controls so a device plugged into an access port cannot influence the topology.
      audit: |
        To verify the bridge spanning-tree configuration from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the bridges and their protocol modes:

           ```text
           /interface bridge print
           ```

        3. For each enabled bridge, inspect the `protocol-mode` field.

        If every enabled bridge uses `stp`, `rstp`, or `mstp`, the check passes. If any uses `none`, the check fails.
      remediation:
        - id: cli
          desc: |
            To enable a spanning-tree protocol on a bridge using the RouterOS CLI:

            ```text
            /interface bridge set [find name=bridge1] protocol-mode=rstp
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/328068/Bridging+and+Switching
        title: MikroTik RouterOS Bridging and Switching

  # ==========================================
  # Management Plane Hardening
  # ==========================================
  - uid: mondoo-mikrotik-security-ssh-strong-crypto
    title: Ensure the SSH server uses strong cryptography only
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mikrotik.ssh.strongCrypto == true
    docs:
      desc: |
        This check verifies that the SSH server refuses weak ciphers, MACs, and key exchange parameters.

        RouterOS controls SSH algorithm selection with the `strong-crypto` setting under `/ip ssh`. It ships as `no`, which keeps SHA-1 and MD5 MACs, 1024-bit Diffie-Hellman groups, and 128-bit ciphers on offer for older clients. Setting `strong-crypto=yes` limits the server to 192-bit and 256-bit ciphers, SHA-256 MACs, and 2048-bit Diffie-Hellman primes, and disables null encryption.

        **Why this matters**

        SSH negotiates the strongest algorithm both sides offer, so an attacker on the path who can tamper with the handshake can steer the session toward the weakest one the router still accepts. The Logjam research showed that most servers share a few standard 1024-bit Diffie-Hellman primes and that precomputation against one of them is within reach of a well-resourced adversary. A session negotiated that way exposes the administrator's password and every command typed after it.

        SSH is the remote console that replaces Telnet on a hardened router, so its strength is the strength of the management plane. Leaving the weak options enabled only for compatibility means the weakest client anywhere in the organization sets the protection level for every administrator.

        Current SSH clients all support the strong set. Confirm that automation tools and older terminal programs can still connect after the change.
      audit: |
        To verify SSH algorithm hardening from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the SSH server settings:

           ```text
           /ip ssh print
           ```

        3. Inspect the `strong-crypto` field.

        If `strong-crypto` is `yes`, the check passes. If it is `no`, the check fails.
      remediation:
        - id: cli
          desc: |
            To restrict the SSH server to strong algorithms using the RouterOS CLI:

            ```text
            /ip ssh set strong-crypto=yes
            ```

            Existing sessions are not interrupted. Open a new session afterwards to confirm your client still connects.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/132350014/SSH
        title: MikroTik RouterOS SSH

  - uid: mondoo-mikrotik-security-ssh-forwarding-disabled
    title: Ensure SSH port forwarding is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.ssh.forwardingEnabled == "no"
    docs:
      desc: |
        This check verifies that the router does not tunnel other connections for SSH clients.

        The `forwarding-enabled` setting under `/ip ssh` accepts `no`, `local`, `remote`, and `both`. With `local`, an SSH client can open connections from the router to any host the router can reach, including dynamic SOCKS forwarding. With `remote`, a client can make the router listen on a port and relay inbound connections back through the session. The check requires `no`, which is the RouterOS default.

        **Why this matters**

        Port forwarding turns an SSH login into a network pivot. Anyone holding a working credential, including a stolen one, can reach internal hosts through the router without touching the firewall's forward chain, because the traffic originates from the router itself. Remote forwarding goes further and lets an outside party publish an internal service through the router.

        Tunnelled connections are also invisible to the filtering and logging an operator relies on. They appear only as an SSH session to the router, so the access they grant leaves no trace in the forward chain.

        If an administrator needs to reach an internal host, use a VPN that terminates on the router and is governed by firewall rules instead of SSH tunnelling.
      audit: |
        To verify that SSH forwarding is disabled from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the SSH server settings:

           ```text
           /ip ssh print
           ```

        3. Inspect the `forwarding-enabled` field.

        If `forwarding-enabled` is `no`, the check passes. If it is `local`, `remote`, or `both`, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable SSH port forwarding using the RouterOS CLI:

            ```text
            /ip ssh set forwarding-enabled=no
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/132350014/SSH
        title: MikroTik RouterOS SSH

  - uid: mondoo-mikrotik-security-mac-telnet-restricted
    title: Ensure MAC-Telnet is limited to trusted interfaces
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.macServer.allowedInterfaceList != empty
      mikrotik.macServer.allowedInterfaceList.in(["all", "static", "dynamic"]) == false
    docs:
      desc: |
        This check verifies that the MAC-Telnet server answers only on interfaces facing a trusted network.

        MAC-Telnet is a MikroTik protocol that opens a console session over Layer 2, addressed by MAC address, so it works even when the router has no IP configuration. The `allowed-interface-list` setting under `/tool mac-server` decides where it listens. The built-in lists `all`, `static`, and `dynamic` each include upstream and tunnel interfaces, so the check requires `none` or an interface list the operator defined for the management network, such as `LAN`.

        **Why this matters**

        A MAC-layer login service bypasses the IP firewall entirely. Rules in `/ip firewall filter` never see it, so a router whose input chain is locked down still offers a login prompt to any host on the same Layer 2 segment as an enabled interface. On an upstream port that segment can include the provider's access network, other customers on a shared broadband segment, or anything on a colocation VLAN.

        The prompt accepts the same credentials as SSH and WinBox, so it is one more place to guess passwords that the IP-level source restrictions do not cover. Many hardening guides, including MikroTik's own, set this list to `none`.

        Confirm that you have IP-level access to the router before setting the list to `none`, because MAC-Telnet is often the recovery path when IP access is lost.
      audit: |
        To verify the MAC-Telnet interface list from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the MAC server settings:

           ```text
           /tool mac-server print
           ```

        3. Inspect the `allowed-interface-list` field.

        If it is `none` or an operator-defined list containing only trusted interfaces, the check passes. If it is `all`, `static`, or `dynamic`, the check fails.
      remediation:
        - id: cli
          desc: |
            To restrict MAC-Telnet using the RouterOS CLI:

            1. Disable MAC-Telnet entirely:

               ```text
               /tool mac-server set allowed-interface-list=none
               ```

            2. Or, if MAC-Telnet is needed on the management network, create an interface list that contains only the trusted interfaces and select it:

               ```text
               /interface list add name=MGMT
               /interface list member add list=MGMT interface=bridge
               /tool mac-server set allowed-interface-list=MGMT
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/98795539/MAC+server
        title: MikroTik RouterOS MAC server
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/328353/Securing+your+router
        title: Securing your router

  - uid: mondoo-mikrotik-security-mac-winbox-restricted
    title: Ensure MAC-WinBox is limited to trusted interfaces
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.macServer.winboxAllowedInterfaceList != empty
      mikrotik.macServer.winboxAllowedInterfaceList.in(["all", "static", "dynamic"]) == false
    docs:
      desc: |
        This check verifies that WinBox connections over Layer 2 are accepted only on interfaces facing a trusted network.

        WinBox can reach a router by MAC address as well as by IP, which lets an administrator configure a device that has no IP address yet. The `allowed-interface-list` setting under `/tool mac-server mac-winbox` decides which interfaces answer. The built-in lists `all`, `static`, and `dynamic` each include upstream and tunnel interfaces, so the check requires `none` or an interface list the operator defined for the management network.

        **Why this matters**

        MAC-WinBox sits below the IP firewall. Input chain rules and the per-service address restriction on the `winbox` service apply only to WinBox over IP, so a router that looks fully restricted from an IP point of view still offers full graphical administration to any host on the same Layer 2 segment as an enabled interface.

        WinBox is the management interface MikroTik routers are most often attacked through, and its login accepts the same full-access credentials as every other service. Exposing it on an upstream segment hands a password-guessing target to neighbours the operator does not control.

        Keep IP-level WinBox or SSH access working before restricting this list, since MAC-WinBox is a common recovery path.
      audit: |
        To verify the MAC-WinBox interface list from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the MAC-WinBox settings:

           ```text
           /tool mac-server mac-winbox print
           ```

        3. Inspect the `allowed-interface-list` field.

        If it is `none` or an operator-defined list containing only trusted interfaces, the check passes. If it is `all`, `static`, or `dynamic`, the check fails.
      remediation:
        - id: cli
          desc: |
            To restrict MAC-WinBox using the RouterOS CLI:

            1. Disable MAC-WinBox entirely:

               ```text
               /tool mac-server mac-winbox set allowed-interface-list=none
               ```

            2. Or limit it to an interface list that contains only trusted interfaces:

               ```text
               /tool mac-server mac-winbox set allowed-interface-list=MGMT
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/98795539/MAC+server
        title: MikroTik RouterOS MAC server
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/328353/Securing+your+router
        title: Securing your router

  - uid: mondoo-mikrotik-security-neighbor-discovery-restricted
    title: Ensure neighbor discovery runs only on trusted interfaces
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.discoverySettings.discoverInterfaceList != empty
      mikrotik.discoverySettings.discoverInterfaceList.in(["all", "static", "dynamic"]) == false
    docs:
      desc: |
        This check verifies that the router announces itself with neighbor discovery protocols only on trusted interfaces.

        RouterOS speaks MNDP, CDP, and LLDP, and both sends and answers discovery packets on every interface in the `discover-interface-list` under `/ip neighbor discovery-settings`. The default is `static`, which covers every configured interface including the upstream port. The check requires `none` or an interface list the operator defined for trusted networks.

        **Why this matters**

        Discovery packets announce the router's identity, model, exact RouterOS version, MAC addresses, and interface addresses to anything on the segment. On an upstream port that is reconnaissance delivered for free: an attacker learns which device sits there and which published vulnerabilities apply to that version without sending a single probe.

        MNDP is also how the WinBox neighbors list finds routers, so leaving it on an untrusted segment advertises a management target alongside the version information.

        Limit discovery to the networks where administrators and network management tools actually use it.
      audit: |
        To verify the neighbor discovery interface list from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the discovery settings:

           ```text
           /ip neighbor discovery-settings print
           ```

        3. Inspect the `discover-interface-list` field.

        If it is `none` or an operator-defined list containing only trusted interfaces, the check passes. If it is `all`, `static`, or `dynamic`, the check fails.
      remediation:
        - id: cli
          desc: |
            To restrict neighbor discovery using the RouterOS CLI:

            1. Limit discovery to an interface list that contains only trusted interfaces:

               ```text
               /ip neighbor discovery-settings set discover-interface-list=LAN
               ```

               `LAN` is the interface list the RouterOS default configuration creates. Use a list that contains only trusted interfaces if your device does not have it.

            2. Or turn discovery off on every interface:

               ```text
               /ip neighbor discovery-settings set discover-interface-list=none
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/24805517/Neighbor+discovery
        title: MikroTik RouterOS Neighbor discovery
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/328353/Securing+your+router
        title: Securing your router

  - uid: mondoo-mikrotik-security-romon-secured
    title: Ensure RoMON is disabled or protected with a secret
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.romon.enabled == false || mikrotik.romon.hasSecrets == true
    docs:
      desc: |
        This check verifies that the Router Management Overlay Network is either off or limited to routers that share a secret.

        RoMON builds its own Layer 2 overlay between MikroTik devices so an administrator can reach a router through its neighbors even when IP routing is broken, and it carries WinBox and SSH sessions over that overlay. It is enabled under `/tool romon`. The `secrets` setting holds the shared secrets used to hash RoMON messages, and RoMON messages are sent unhashed when the list is empty. The check passes when RoMON is disabled or at least one secret is configured.

        **Why this matters**

        RoMON forwarding operates outside the IP firewall. Without a secret, any MikroTik device an attacker controls on an adjacent segment can join the overlay, discover every RoMON-enabled router behind it, and open management sessions to them through hops the IP firewall never inspects.

        A shared secret keeps foreign devices from joining the overlay, so management traffic only travels between routers the operator configured.

        Disable RoMON where it is not used. Where it is, configure the same secret on every participating router.
      audit: |
        To verify the RoMON configuration from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the RoMON settings:

           ```text
           /tool romon print
           ```

        3. Inspect the `enabled` and `secrets` fields.

        If `enabled` is `no`, or `secrets` holds at least one value, the check passes. If RoMON is enabled with an empty `secrets` list, the check fails.
      remediation:
        - id: cli
          desc: |
            To secure RoMON using the RouterOS CLI:

            1. Disable RoMON if it is not used:

               ```text
               /tool romon set enabled=no
               ```

            2. Or configure a shared secret, using the same value on every router in the RoMON domain:

               ```text
               /tool romon set secrets=<shared-secret>
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978569/RoMON
        title: MikroTik RouterOS RoMON

  - uid: mondoo-mikrotik-security-service-certificate-valid
    title: Ensure TLS management services do not present an expired certificate
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mikrotik.services
        .where(disabled != true && certificateRef != empty)
        .all(certificateRef.expired == false)
    docs:
      desc: |
        This check verifies that every enabled TLS management service presents a certificate that is still within its validity period.

        `www-ssl`, `api-ssl`, and other TLS-capable entries under `/ip service` each select a certificate from `/certificate`. RouterOS keeps serving a certificate after its `invalid-after` date passes. The check reads the certificate bound to each enabled service and fails when it has expired.

        **Why this matters**

        An expired certificate trains administrators to click through warnings. Once every connection to the router produces a certificate error, an interception attempt that presents a forged certificate produces the same error, and the administrator accepts it out of habit. TLS then protects nothing against the on-path attacker it exists to stop.

        Automation suffers the same way. API clients that hit validation errors are routinely reconfigured to skip certificate checks, and that setting tends to outlive the certificate renewal that would have made it unnecessary.

        Renew the certificate before it expires and bind the new one to every service that used the old one.
      audit: |
        To verify the certificates bound to TLS services from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the services and the certificate each one uses:

           ```text
           /ip service print detail
           ```

        3. For each enabled service with a certificate other than `none`, display that certificate:

           ```text
           /certificate print detail where name=<certificate-name>
           ```

        4. Compare its `invalid-after` date with the current date.

        If every bound certificate is still valid, the check passes. If any enabled service presents an expired certificate, the check fails.
      remediation:
        - id: cli
          desc: |
            To replace an expired service certificate using the RouterOS CLI:

            1. Import a renewed certificate and its private key, or issue a new one from a local CA:

               ```text
               /certificate import file-name=router.crt passphrase=""
               /certificate import file-name=router.key passphrase=""
               ```

            2. Bind the new certificate to each TLS service that used the expired one:

               ```text
               /ip service set www-ssl certificate=router.crt_0
               /ip service set api-ssl certificate=router.crt_0
               ```

            3. Remove the expired certificate once nothing references it:

               ```text
               /certificate remove [find where expired]
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/2555969/Certificates
        title: MikroTik RouterOS Certificates
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/103841820/Services
        title: MikroTik RouterOS Services

  # ==========================================
  # Authentication and Scripting
  # ==========================================
  - uid: mondoo-mikrotik-security-radius-message-authenticator
    title: Ensure RADIUS clients require the Message-Authenticator attribute
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-i-transmission-security-integrity-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-23
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mikrotik.radiusClients
        .where(disabled != true)
        .all(requireMessageAuth != empty && requireMessageAuth != "no")
    docs:
      desc: |
        This check verifies that the router rejects RADIUS responses that are not protected by a Message-Authenticator attribute.

        Every entry under `/radius` carries a `require-message-auth` setting. Current RouterOS releases default it to `yes-for-request-resp`, which requires the attribute on responses. The value `no` accepts responses without it. The check fails for any enabled RADIUS client set to `no`.

        **Why this matters**

        The Blast-RADIUS attack, CVE-2024-3596, lets an attacker on the path between the router and its RADIUS server turn an Access-Reject into a valid Access-Accept. It works by forging an MD5 collision against the RADIUS response authenticator, and the only defense on the client side is to insist on the HMAC-based Message-Authenticator attribute, which the collision cannot forge.

        RADIUS on a MikroTik router typically authorizes administrator logins, VPN users, and hotspot or wireless clients. A forged Access-Accept grants whichever of those the RADIUS entry serves to someone who does not know the password.

        Confirm that the RADIUS server sends Message-Authenticator in its responses before enforcing it, or logins will fail.
      audit: |
        To verify RADIUS response authentication from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the RADIUS client entries:

           ```text
           /radius print detail
           ```

        3. Inspect the `require-message-auth` field of each enabled entry.

        If every enabled entry requires the Message-Authenticator attribute, the check passes. If any is set to `no`, the check fails.
      remediation:
        - id: cli
          desc: |
            To require the Message-Authenticator attribute using the RouterOS CLI:

            ```text
            /radius set [find] require-message-auth=yes-for-request-resp
            ```

            Update the RADIUS server first if it does not yet include Message-Authenticator in every response.
    refs:
      - url: https://www.blastradius.fail/
        title: BLAST RADIUS

  - uid: mondoo-mikrotik-security-script-permissions-enforced
    title: Ensure scripts do not bypass permission checks
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      mikrotik.scripts.all(dontRequirePermissions != true)
    docs:
      desc: |
        This check verifies that stored scripts run with no more rights than the user or service that starts them.

        Each script in `/system script` has a `dont-require-permissions` setting. When it is `yes`, RouterOS skips the permission check when the script runs, so the script executes with its own policy regardless of who or what invoked it. The default is `no`, and the check fails if any script sets it to `yes`.

        **Why this matters**

        A script that bypasses permission checks is a privilege escalation path. Any account that can run it, and any service that can trigger it, such as Netwatch, the scheduler, or a DHCP lease script, gains the script's full policy. An attacker who can edit the script or influence what it reads then runs arbitrary configuration commands without holding an account with those rights.

        Persistence on compromised MikroTik routers commonly takes the form of scripts and scheduled tasks, so a script with elevated rights is also an attractive place to hide changes that survive a password reset.

        Run scripts from an account or scheduler entry whose policy covers what the script needs, instead of disabling the check.
      audit: |
        To verify script permission checks from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the stored scripts:

           ```text
           /system script print detail
           ```

        3. Inspect the `dont-require-permissions` field of each script.

        If no script sets `dont-require-permissions=yes`, the check passes. If any script does, the check fails.
      remediation:
        - id: cli
          desc: |
            To enforce permission checks for scripts using the RouterOS CLI:

            1. Find the scripts that bypass permission checks:

               ```text
               /system script print where dont-require-permissions=yes
               ```

            2. Turn the bypass off:

               ```text
               /system script set [find where dont-require-permissions=yes] dont-require-permissions=no
               ```

            3. If a script now fails, grant the policies it needs through the `policy` setting of the script or of the scheduler entry that runs it.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/47579229/Scripting
        title: MikroTik RouterOS Scripting

  # ==========================================
  # SNMP Security (communities)
  # ==========================================
  - uid: mondoo-mikrotik-security-snmp-no-default-community
    title: Ensure no SNMP community uses a default name
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mikrotik.snmpCommunities
        .where(disabled != true)
        .all(usesDefaultCommunityName == false)
    docs:
      desc: |
        This check verifies that no enabled SNMP community answers to a well-known name such as `public` or `private`.

        In SNMP v1 and v2c the community name is the password, and in SNMP v3 it is the user name. RouterOS ships `/snmp community` with one entry named `public` that grants read access from any address. The check fails if any enabled community uses `public`, `private`, or another name that SNMP tools try by default.

        **Why this matters**

        A default community name is not a secret. Every SNMP scanner sends `public` first, so an agent that answers to it hands over interface names and addresses, the routing table, ARP and neighbor tables, uptime, and the exact RouterOS version to anyone who can reach UDP 161. That is a complete map of the network behind the router and the information needed to pick an exploit for it.

        If the community also has write access, the default name gives the same anonymous party the ability to change configuration.

        Replace the default entry with a community whose name is unique to the organization, or with an SNMP v3 user, and restrict it to the monitoring hosts.
      audit: |
        To verify SNMP community names from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the SNMP communities:

           ```text
           /snmp community print detail
           ```

        3. Inspect the `name` of each community that is not disabled.

        If no enabled community is named `public`, `private`, or another well-known default, the check passes. If one is, the check fails.
      remediation:
        - id: cli
          desc: |
            To replace a default SNMP community name using the RouterOS CLI:

            1. Rename the shipped community and restrict it to the monitoring hosts:

               ```text
               /snmp community set [find name=public] name=<unique-community-string> addresses=<monitoring-host>/32
               ```

            2. Update the trap community if it pointed at the old name:

               ```text
               /snmp set trap-community=<unique-community-string>
               ```

            3. Update every poller with the new community name.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978519/SNMP
        title: MikroTik RouterOS SNMP

  - uid: mondoo-mikrotik-security-snmp-community-read-only
    title: Ensure SNMP communities do not grant write access
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      mikrotik.snmpCommunities
        .where(disabled != true)
        .all(writeAccess == false)
    docs:
      desc: |
        This check verifies that SNMP can only read the router's state, not change it.

        Each entry under `/snmp community` has a `write-access` setting. With `write-access=yes`, SNMP set requests can change configuration values the RouterOS MIB exposes and run scripts stored on the router. The check fails if any enabled community grants write access.

        **Why this matters**

        SNMP v1 and v2c authenticate with a community name sent in clear text, so anyone who captures one poll from the monitoring network holds the credential. With write access that credential is a configuration interface that bypasses the logging and source restrictions applied to SSH and WinBox.

        Monitoring needs read access only. Configuration changes belong in SSH, WinBox, or the API, where they are attributed to a named account.
      audit: |
        To verify SNMP write access from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the SNMP communities:

           ```text
           /snmp community print detail
           ```

        3. Inspect the `write-access` field of each enabled community.

        If every enabled community has `write-access=no`, the check passes. If any has `write-access=yes`, the check fails.
      remediation:
        - id: cli
          desc: |
            To remove SNMP write access using the RouterOS CLI:

            ```text
            /snmp community set [find write-access=yes] write-access=no
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978519/SNMP
        title: MikroTik RouterOS SNMP

  - uid: mondoo-mikrotik-security-snmp-v3-auth-priv
    title: Ensure SNMP communities use SNMPv3 with authentication and encryption
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mikrotik.snmpCommunities
        .where(disabled != true)
        .all(security == "private" && hasAuthenticationPassword == true && hasEncryptionPassword == true)
    docs:
      desc: |
        This check verifies that SNMP access is authenticated and encrypted.

        Each entry under `/snmp community` has a `security` setting: `none` accepts SNMP v1 and v2c requests and unauthenticated v3, `authorized` requires SNMP v3 authentication without encryption, and `private` requires both. The check requires `security=private` with an authentication password and an encryption password configured on every enabled community.

        **Why this matters**

        With `security=none` the community name travels in clear text in every request, so any host on the path between the poller and the router can capture it and replay it. The responses travel in clear text as well and carry the router's addressing, routing, and neighbor tables.

        SNMP v3 with `authPriv` replaces the shared name with a per-user key, rejects modified or replayed messages, and encrypts the data in transit.

        Choose SHA-based authentication and AES encryption where the monitoring platform supports them, and confirm the poller is configured for v3 before changing the router.
      audit: |
        To verify SNMP security levels from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the SNMP communities:

           ```text
           /snmp community print detail
           ```

        3. Inspect the `security`, `authentication-password`, and `encryption-password` fields of each enabled community.

        If every enabled community has `security=private` with both passwords set, the check passes. If any is `none` or `authorized`, or lacks a password, the check fails.
      remediation:
        - id: cli
          desc: |
            To require SNMP v3 with authentication and encryption using the RouterOS CLI:

            1. Create an SNMP v3 community restricted to the monitoring host:

               ```text
               /snmp community add name=<v3-user> addresses=<monitoring-host>/32 security=private authentication-protocol=SHA1 authentication-password=<auth-password> encryption-protocol=AES encryption-password=<priv-password> read-access=yes write-access=no
               ```

            2. Point the poller at the new user and confirm it collects data.
            3. Disable or remove the communities that do not use `security=private`:

               ```text
               /snmp community disable [find security!=private]
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978519/SNMP
        title: MikroTik RouterOS SNMP

  - uid: mondoo-mikrotik-security-snmp-community-source-restricted
    title: Ensure SNMP communities restrict allowed source addresses
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.snmpCommunities
        .where(disabled != true)
        .all(addresses != empty && addresses != /(^|,)(0\.0\.0\.0\/0|::\/0)(,|$)/)
    docs:
      desc: |
        This check verifies that every enabled SNMP community answers only to the monitoring hosts allowed to use it.

        Each entry under `/snmp community` has an `addresses` setting listing the source prefixes it accepts. The shipped `public` community uses `::/0`, which places no restriction on the source. The check fails if an enabled community has no addresses or includes `0.0.0.0/0` or `::/0`.

        **Why this matters**

        An SNMP agent that accepts any source is reachable by every host that can send UDP to the router. Community names leak through captured traffic, configuration backups, and monitoring server compromises, and SNMP has no lockout, so a name can also be guessed at high speed.

        Limiting each community to its pollers means a leaked name only works from those hosts, and the agent stops answering scanners on other networks altogether.
      audit: |
        To verify SNMP source restrictions from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the SNMP communities:

           ```text
           /snmp community print detail
           ```

        3. Inspect the `addresses` field of each enabled community.

        If every enabled community lists only specific monitoring prefixes, the check passes. If any is empty or includes `0.0.0.0/0` or `::/0`, the check fails.
      remediation:
        - id: cli
          desc: |
            To restrict SNMP communities to monitoring hosts using the RouterOS CLI:

            ```text
            /snmp community set [find name=<community-name>] addresses=192.168.88.10/32,10.10.0.0/24
            ```

            Repeat for every enabled community.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/8978519/SNMP
        title: MikroTik RouterOS SNMP

  # ==========================================
  # Logging
  # ==========================================
  - uid: mondoo-mikrotik-security-logging-remote-syslog
    title: Ensure log messages are sent to a remote syslog server
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-3-3
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mikrotik.loggingRules
        .where(disabled != true && invalid != true)
        .any(action.target == "remote" && action.remote != empty && action.remote != "0.0.0.0" && action.remote != "::")
    docs:
      desc: |
        This check verifies that the router forwards its log messages to an external syslog server.

        RouterOS logging has two parts. Actions under `/system logging action` define destinations, and rules under `/system logging` route topics to an action. The shipped `remote` action points at `0.0.0.0`, and no rule uses it. The check passes when at least one enabled rule routes to an action with `target=remote` and a real collector address.

        **Why this matters**

        By default RouterOS keeps its log in memory, where it holds the last 1,000 entries and is erased by a reboot. An attacker who logs in can read and clear it, and a burst of activity pushes the evidence out of the buffer within minutes. Either way the record of who logged in and what changed is gone when someone goes looking.

        A remote collector keeps a copy the router cannot alter afterwards. It is also where failed logins, configuration changes, and firewall log hits from many devices can be correlated and alerted on.

        Route at least the `info`, `warning`, `error`, and `critical` topics, which include account and configuration events, to the remote action.
      audit: |
        To verify remote logging from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the logging actions:

           ```text
           /system logging action print detail
           ```

        3. Note each action with `target=remote` and a `remote` address other than `0.0.0.0`.
        4. List the logging rules:

           ```text
           /system logging print
           ```

        If an enabled rule uses one of those actions, the check passes. If no enabled rule routes to a remote action with a real collector address, the check fails.
      remediation:
        - id: cli
          desc: |
            To send log messages to a remote syslog server using the RouterOS CLI:

            1. Point a remote action at the collector:

               ```text
               /system logging action set [find name=remote] remote=192.168.88.20 remote-port=514
               ```

            2. Route the relevant topics to it:

               ```text
               /system logging add topics=info action=remote
               /system logging add topics=warning action=remote
               /system logging add topics=error action=remote
               /system logging add topics=critical action=remote
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/328094/Log
        title: MikroTik RouterOS Log

  # ==========================================
  # DNS Resolver Security (remote requests)
  # ==========================================
  - uid: mondoo-mikrotik-security-dns-remote-requests-disabled
    title: Ensure the DNS resolver does not answer remote requests
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mikrotik.dns.allowRemoteRequests == false
    docs:
      desc: |
        This check verifies that the router's DNS cache is not offered as a resolver to other hosts.

        The `allow-remote-requests` setting under `/ip dns` decides whether the router answers DNS queries arriving from the network on UDP and TCP port 53. When it is `no`, which is the RouterOS default, only the router itself uses the resolver. The check requires `no`.

        **Why this matters**

        A resolver that answers anyone is an open resolver. Attackers send it small queries with a spoofed source address and it sends much larger answers to the victim, so the router becomes a participant in reflection and amplification attacks on third parties. The input chain then carries that load, which on small hardware degrades forwarding for real users.

        An exposed resolver can also be probed for cache contents, which reveals what the hosts behind the router have been looking up.

        If the router must serve DNS to clients on the LAN, enable remote requests only together with input chain rules that drop port 53 from every untrusted interface, and accept this finding as reviewed.
      audit: |
        To verify the DNS remote request setting from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the DNS settings:

           ```text
           /ip dns print
           ```

        3. Inspect the `allow-remote-requests` field.

        If `allow-remote-requests` is `no`, the check passes. If it is `yes`, the check fails.
      remediation:
        - id: cli
          desc: |
            To stop the router from answering remote DNS requests using the RouterOS CLI:

            ```text
            /ip dns set allow-remote-requests=no
            ```

            **Warning**: clients that use the router as their DNS server stop resolving names. Hand them another resolver through DHCP before applying the change, or keep remote requests enabled and drop port 53 in the input chain on every interface that faces an untrusted network. `WAN` is the interface list the RouterOS default configuration creates for upstream interfaces:

            ```text
            /ip firewall filter add chain=input in-interface-list=WAN protocol=udp dst-port=53 action=drop
            /ip firewall filter add chain=input in-interface-list=WAN protocol=tcp dst-port=53 action=drop
            ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/37748767/DNS
        title: MikroTik RouterOS DNS
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/328353/Securing+your+router
        title: Securing your router

  # ==========================================
  # Firewall Filtering (IPv6)
  # ==========================================
  - uid: mondoo-mikrotik-security-ipv6-firewall-input-drop-rule
    title: Ensure the IPv6 firewall input chain drops unmatched traffic
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-4
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      ipv6InUse = mikrotik.ipv6Addresses.where(disabled != true && invalid != true && address != /^::1\//) != empty
      inputRules = mikrotik.ipv6FirewallRules.where(chain == "input" && disabled != true && invalid != true)
      ipv6InUse == false || inputRules != empty &&
        inputRules.last.action.in(["drop", "reject"]) &&
        inputRules.last.protocol == empty &&
        inputRules.last.srcAddress == empty &&
        inputRules.last.dstAddress == empty &&
        inputRules.last.srcAddressList == empty &&
        inputRules.last.dstAddressList == empty &&
        inputRules.last.srcPort == empty &&
        inputRules.last.dstPort == empty &&
        inputRules.last.inInterface == empty &&
        inputRules.last.connectionState == empty
    docs:
      desc: |
        This check verifies that IPv6 traffic addressed to the router itself is denied unless a rule explicitly permits it.

        IPv6 has its own firewall under `/ipv6 firewall filter`, independent of the IPv4 rules, and its `input` chain accepts anything no rule matches. RouterOS assigns link-local IPv6 addresses to interfaces automatically, so the router is reachable over IPv6 even when nobody configured IPv6 on purpose. The check applies whenever the router has an IPv6 address other than loopback. It requires the last enabled rule of the IPv6 input chain to drop or reject without matching on protocol, source or destination address, address list, port, input interface, or connection state, so a narrow final rule such as `action=drop protocol=tcp dst-port=23` fails. Matchers the check cannot see, such as `in-interface-list`, are not evaluated, so a final drop limited only by one of them passes.

        **Why this matters**

        Every management service RouterOS runs listens on IPv6 as well as IPv4. A carefully written IPv4 input chain does nothing for those listeners over IPv6, so SSH, WinBox, the API, DNS, and SNMP stay reachable from any IPv6 neighbor, and from the internet once a provider delegates a prefix.

        IPv6 exposure is easy to miss because scanners and audits often look only at IPv4. An attacker on the same segment needs no global address: link-local addresses and neighbor discovery are enough to find the router and reach its services.

        Accept established and related traffic, ICMPv6, and the DHCPv6 and management traffic you need above the final drop, and work in Safe Mode while adding it.
      audit: |
        To verify the IPv6 firewall input chain from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the IPv6 addresses:

           ```text
           /ipv6 address print
           ```

        3. List the IPv6 firewall input rules in order:

           ```text
           /ipv6 firewall filter print where chain=input
           ```

        If the router has no IPv6 address other than loopback, or the last enabled input rule drops or rejects with no protocol, address, address list, port, `in-interface`, or `connection-state` matcher, the check passes. If the chain is empty, ends in a rule that accepts, or ends in a drop limited by one of those matchers, the check fails.
      remediation:
        - id: cli
          desc: |
            To add a default-deny rule to the IPv6 input chain using the RouterOS CLI:

            **Warning**: the drop rule takes effect the moment it is added. Enter Safe Mode first by pressing `[CTRL]+[X]` in the terminal or clicking **Safe Mode** in WinBox, so the change is rolled back if your session drops.

            1. Accept the traffic the router needs, then append the drop last. `LAN` is the interface list the RouterOS default configuration creates for trusted interfaces:

               ```text
               /ipv6 firewall filter add chain=input connection-state=established,related,untracked action=accept
               /ipv6 firewall filter add chain=input connection-state=invalid action=drop
               /ipv6 firewall filter add chain=input protocol=icmpv6 action=accept
               /ipv6 firewall filter add chain=input in-interface-list=LAN action=accept
               /ipv6 firewall filter add chain=input action=drop
               ```

            2. If the router does not use IPv6 at all, you can instead disable it:

               ```text
               /ipv6 settings set disable-ipv6=yes
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/328513/Building+Your+First+Firewall
        title: Building Advanced Firewall

  # ==========================================
  # VPN Security
  # ==========================================
  - uid: mondoo-mikrotik-security-pptp-server-disabled
    title: Ensure the PPTP server is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mikrotik.pptpServer == empty || mikrotik.pptpServer.enabled == false
    docs:
      desc: |
        This check verifies that the router does not accept PPTP VPN connections.

        PPTP authenticates with MS-CHAPv2 and encrypts with MPPE, which derives its RC4 keys from the user's password hash. RouterOS includes a PPTP server under `/interface pptp-server server`, disabled by default. The check requires it to stay disabled.

        **Why this matters**

        MS-CHAPv2 reduces to a single DES key search, and public tooling has recovered the password-equivalent hash from a captured PPTP handshake in under a day since 2012. Anyone who records one login can then authenticate as that user and decrypt the captured sessions, because MPPE keys come from the same hash.

        MikroTik's own documentation states that PPTP has many known security issues and is not recommended. A PPTP server on the router is a remote access entry point protected by broken cryptography.

        Move remote users to WireGuard, IKEv2, or L2TP over IPsec, then disable PPTP.
      audit: |
        To verify the PPTP server state from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the PPTP server settings:

           ```text
           /interface pptp-server server print
           ```

        3. Inspect the `enabled` field.

        If `enabled` is `no`, the check passes. If it is `yes`, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable the PPTP server using the RouterOS CLI:

            1. Move the remaining PPTP users to a supported VPN such as WireGuard or IKEv2.
            2. Disable the server:

               ```text
               /interface pptp-server server set enabled=no
               ```
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/2031638/PPTP
        title: MikroTik RouterOS PPTP

  - uid: mondoo-mikrotik-security-l2tp-ipsec-required
    title: Ensure the L2TP server requires IPsec
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mikrotik.l2tpServer == empty || mikrotik.l2tpServer.enabled == false || mikrotik.l2tpServer.useIpsec == "required"
    docs:
      desc: |
        This check verifies that an enabled L2TP server accepts only tunnels protected by IPsec.

        L2TP provides tunnelling but no encryption of its own. The `use-ipsec` setting under `/interface l2tp-server server` accepts `no`, `yes`, and `required`. With `yes`, RouterOS offers IPsec but still accepts plain L2TP connections. Only `required` rejects L2TP that did not arrive inside IPsec. The check passes when the server is disabled or `use-ipsec` is `required`.

        **Why this matters**

        L2TP without IPsec sends the tunnelled traffic in clear text, and the PPP authentication inside it uses PAP, CHAP, or MS-CHAP exchanges that an observer can capture and attack offline. A client that is misconfigured, or an attacker who strips the IPsec offer, can connect without encryption when the server merely offers IPsec.

        Requiring IPsec makes encryption a property of the server, not of each client's configuration.
      audit: |
        To verify the L2TP server IPsec setting from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. Display the L2TP server settings:

           ```text
           /interface l2tp-server server print
           ```

        3. Inspect the `enabled` and `use-ipsec` fields.

        If the server is disabled or `use-ipsec` is `required`, the check passes. If the server is enabled with `use-ipsec` set to `no` or `yes`, the check fails.
      remediation:
        - id: cli
          desc: |
            To require IPsec for L2TP using the RouterOS CLI:

            ```text
            /interface l2tp-server server set use-ipsec=required ipsec-secret=<pre-shared-key>
            ```

            Clients that connect without IPsec are refused afterwards, so update them first.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/2031631/L2TP
        title: MikroTik RouterOS L2TP

  - uid: mondoo-mikrotik-security-ipsec-proposal-strong-algorithms
    title: Ensure IPsec proposals do not offer weak algorithms
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mikrotik.ipsecProposals
        .where(disabled != true)
        .all(
          encAlgorithms.none(_ == "null" || _ == "des" || _ == "3des" || _ == "blowfish") &&
          authAlgorithms.none(_ == "null" || _ == "md5")
        )
    docs:
      desc: |
        This check verifies that IPsec security associations cannot be negotiated with broken or obsolete algorithms.

        Proposals under `/ip ipsec proposal` list the encryption and authentication algorithms the router accepts for phase 2 security associations, which protect the tunnelled traffic itself. RouterOS supports `null`, `des`, `3des`, and `blowfish` for encryption and `null` and `md5` for authentication alongside current AES and SHA-2 options. The check fails if any enabled proposal offers one of those weak algorithms.

        **Why this matters**

        IPsec negotiates from the intersection of both peers' lists, so a weak algorithm the router still accepts can be selected by a misconfigured peer or by an attacker who controls one end. DES keys fall to exhaustive search, 3DES and Blowfish use 64-bit blocks that the Sweet32 attack exploits on long-lived tunnels, and `null` leaves traffic unencrypted or unauthenticated outright.

        The default proposal offers AES-CBC with SHA-1 and passes. Proposals added for compatibility with old peers are where weak options usually appear.
      audit: |
        To verify IPsec proposal algorithms from the RouterOS CLI:

        1. Open an SSH session to the device.
        2. List the IPsec proposals:

           ```text
           /ip ipsec proposal print detail
           ```

        3. Inspect the `enc-algorithms` and `auth-algorithms` fields of each enabled proposal.

        If no enabled proposal lists `null`, `des`, `3des`, `blowfish`, or `md5`, the check passes. If any does, the check fails.
      remediation:
        - id: cli
          desc: |
            To remove weak algorithms from IPsec proposals using the RouterOS CLI:

            ```text
            /ip ipsec proposal set [find name=<proposal-name>] enc-algorithms=aes-256-gcm,aes-256-cbc auth-algorithms=sha256
            ```

            Confirm that the remote peers support the remaining algorithms before applying the change, or their tunnels will not re-establish.
    refs:
      - url: https://help.mikrotik.com/docs/spaces/ROS/pages/11993097/IPsec
        title: MikroTik RouterOS IPsec
