policies:
  - uid: mondoo-mysql-security
    name: Mondoo MySQL Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: linux,mysql
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden MySQL server networking, authentication, privileges, and audit logging
    docs:
      desc: |
        The Mondoo MySQL Security policy assesses the on-disk option files of a self-managed MySQL or Percona Server installation. It reads the option file chain, resolving the `!include` and `!includedir` directives so every fragment contributes, and normalizes option names so `-` and `_` are interchangeable exactly as the server treats them.

        This policy provides security checks across seven areas:

        - Connection surface and network exposure
        - Transport encryption and certificate material
        - Authentication plugins and password policy
        - Filesystem privileges and server-side code execution
        - Error, general, and audit logging
        - Encryption at rest for tables and logs
        - Protection of option files and the credentials they hold

        **Scope and limitations**

        This policy reads configuration as it is written to disk. It does not open a SQL connection to the server, so it cannot assess accounts, granted privileges, the `mysql.user` table, or the effective value of a dynamic variable. Checks describe the configuration the server would load on its next restart.

        Options changed with `SET PERSIST` are written to `mysqld-auto.cnf` in the data directory rather than to an option file. The server applies that file after the option files, so it takes precedence over everything this policy reads. Remediation steps therefore edit the option file directly, which keeps the effective configuration and the audited configuration in agreement. Where an option has already been persisted that way, clear it with `RESET PERSIST <option>` so the option file value takes effect again.

        MariaDB is covered by the Mondoo MariaDB Security policy instead. The underlying resource returns nothing on a host running MariaDB, so the checks here do not apply to those servers.

        Learn more about scanning Linux in the [cnspec Linux documentation](https://mondoo.com/docs/cnspec/os/linux).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Connection and Network Exposure
        filters: |
          asset.family.contains("linux") &&
          mysql.conf.file.exists
        checks:
          - uid: mondoo-mysql-security-bind-address-restricted
          - uid: mondoo-mysql-security-skip-name-resolve-enabled
          - uid: mondoo-mysql-security-skip-show-database-enabled
      - title: Transport Encryption
        filters: |
          asset.family.contains("linux") &&
          mysql.conf.file.exists
        checks:
          - uid: mondoo-mysql-security-require-secure-transport-enabled
          - uid: mondoo-mysql-security-tls-version-modern
          - uid: mondoo-mysql-security-server-certificate-configured
          - uid: mondoo-mysql-security-client-ca-configured
      - title: Authentication and Password Policy
        filters: |
          asset.family.contains("linux") &&
          mysql.conf.file.exists
        checks:
          - uid: mondoo-mysql-security-skip-grant-tables-disabled
          - uid: mondoo-mysql-security-strong-authentication-plugin
          - uid: mondoo-mysql-security-validate-password-plugin-loaded
          - uid: mondoo-mysql-security-validate-password-policy-strong
          - uid: mondoo-mysql-security-validate-password-length-sufficient
          - uid: mondoo-mysql-security-validate-password-checks-user-name
          - uid: mondoo-mysql-security-password-expiry-configured
          - uid: mondoo-mysql-security-password-reuse-restricted
          - uid: mondoo-mysql-security-password-require-current-enabled
      - title: Filesystem Privileges and Code Execution
        filters: |
          asset.family.contains("linux") &&
          mysql.conf.file.exists
        checks:
          - uid: mondoo-mysql-security-runs-as-dedicated-account
          - uid: mondoo-mysql-security-local-infile-disabled
          - uid: mondoo-mysql-security-secure-file-priv-restricted
          - uid: mondoo-mysql-security-symbolic-links-disabled
          - uid: mondoo-mysql-security-allow-suspicious-udfs-disabled
          - uid: mondoo-mysql-security-log-bin-trust-function-creators-disabled
          - uid: mondoo-mysql-security-automatic-sp-privileges-disabled
      - title: Logging and Audit
        filters: |
          asset.family.contains("linux") &&
          mysql.conf.file.exists
        checks:
          - uid: mondoo-mysql-security-error-log-configured
          - uid: mondoo-mysql-security-log-error-verbosity-includes-warnings
          - uid: mondoo-mysql-security-log-output-retained
          - uid: mondoo-mysql-security-general-log-disabled
          - uid: mondoo-mysql-security-audit-log-enabled
      - title: Encryption at Rest
        filters: |
          asset.family.contains("linux") &&
          mysql.conf.file.exists
        checks:
          - uid: mondoo-mysql-security-default-table-encryption-enabled
          - uid: mondoo-mysql-security-binlog-encryption-enabled
          - uid: mondoo-mysql-security-innodb-redo-log-encryption-enabled
          - uid: mondoo-mysql-security-innodb-undo-log-encryption-enabled
      - title: Credential and Option File Protection
        filters: |
          asset.family.contains("linux") &&
          mysql.conf.file.exists
        checks:
          - uid: mondoo-mysql-security-client-options-no-plaintext-password
          - uid: mondoo-mysql-security-option-files-restricted-permissions
          - uid: mondoo-mysql-security-user-option-files-protected
queries:
  - uid: mondoo-mysql-security-bind-address-restricted
    title: Ensure bind_address does not expose MySQL on every interface
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      mysql.conf.bindAddress.none(_ == "*" || _ == "0.0.0.0" || _ == "::")
    docs:
      desc: |
        This check verifies that the server answers TCP connections only on addresses an administrator has named, rather than on every interface the host happens to have.

        `bind_address` is written under the `[mysqld]` group of the server option file, typically `/etc/mysql/mysql.conf.d/mysqld.cnf` or a fragment under `/etc/my.cnf.d`. From MySQL 8.0.13 onward it accepts a comma-separated list, so a server that genuinely has to serve several networks can name each address instead of falling back to a wildcard. The check fails `*`, `0.0.0.0`, and `::`, and it fails an installation that never sets the option, since the server's own default is the wildcard.

        **Why this matters**

        An unrestricted listener is found by scanning rather than by targeting. Anyone with a route to the host sweeps port 3306, reads the version out of the handshake, and starts guessing passwords against accounts defined for `'%'`. Nothing had to advertise the database for that to begin, and a cloud instance that acquires a public address during a rebuild is exposed from the moment it boots.

        The distinction worth stating is local socket against network. Applications on the same host reach MySQL through its Unix socket and need no TCP listener at all, so on a single-host deployment the listener is exposure with no corresponding use. Where nothing off the box connects, `skip_networking` removes the listener entirely and is stronger than any address list.

        Naming addresses also keeps a firewall mistake from being immediately fatal. A security group opened one rule too wide reaches a server that still refuses the packet, because it was never listening on that address in the first place.

        Replicas and application tiers on other hosts do need a listener. Name the private address they connect to and leave the host's other interfaces alone. This option cannot be changed at runtime, so it belongs in the option file and takes effect on restart.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'bind_address';"
        ```

        2. Confirm which addresses the server is actually bound to:

        ```bash
        sudo ss -lntp | grep mysqld
        ```

        A passing result names specific addresses such as `127.0.0.1` or a private address. A failing result reports `*`, `0.0.0.0`, or `::`, or shows the server listening on `0.0.0.0:3306`.
      remediation:
        - id: cli
          desc: |
            To bind MySQL to specific addresses using the CLI:

            1. Set `bind_address` in the server option file.
            2. Restart MySQL, because this option cannot be changed at runtime.
            3. Confirm the resulting listeners.

            ```bash
            sudo sed -i -E "/^\s*#?\s*bind-address/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nbind-address = 127.0.0.1,10.0.0.5\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo ss -lntp | grep mysqld
            ```
        - id: script
          desc: |
            To bind MySQL to specific addresses using a bash script:

            1. Set the addresses the server must serve.
            2. Replace an existing option or append one under the server group.
            3. Restart MySQL and report the resulting listeners.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            ADDRESSES="127.0.0.1,10.0.0.5"

            if grep -qE "^\s*bind[-_]address" "$MYCNF"; then
              sed -i "s|^\s*bind[-_]address.*|bind-address = ${ADDRESSES}|" "$MYCNF"
            else
              printf "bind-address = %s\n" "$ADDRESSES" >>"$MYCNF"
            fi

            systemctl restart mysql
            ss -lntp | grep mysqld
            ```
        - id: ansible
          desc: |
            To bind MySQL to specific addresses using Ansible:

            1. Set `bind-address` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restrict the MySQL bind address
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_bind_address: "127.0.0.1,10.0.0.5"
              tasks:
                - name: Set bind-address
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: bind-address
                    value: "{{ mysql_bind_address }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-skip-name-resolve-enabled
    title: Ensure skip_name_resolve is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-15
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mysql.conf.skipNameResolve == true
    docs:
      desc: |
        This check verifies that the server decides which account an incoming connection matches from its IP address alone, without asking a naming service.

        `skip_name_resolve` belongs under `[mysqld]` in the server option file. While it is off, MySQL performs a reverse lookup on every connection and compares the answer to the host part of each account, so an account defined as `'app'@'jobs.example.com'` is authorized on the strength of whatever a resolver returns at the moment the connection arrives.

        **Why this matters**

        That makes DNS part of the authorization decision, and DNS is not an authorization system. An attacker who controls the reverse record for an address they own, through a resolver they compromised, a poisoned cache, or an `in-addr.arpa` delegation the organization no longer tracks, points that record at a trusted name. Their connection from an untrusted address then matches an account scoped to a trusted host, and they authenticate as it. No database credential was cracked and nothing on the server was exploited.

        It also removes a failure mode that has nothing to do with attackers. Every connection waits on a lookup before it can proceed, so a slow resolver adds latency to every new session and an unreachable one stalls or refuses connections while the database itself is perfectly healthy.

        Enabling this changes which accounts match. Once name resolution is off, any account whose host part is a hostname stops matching anything at all. Look through the account definitions in `mysql.user` first, and reissue the privilege each of those accounts holds against an address or address pattern before setting the option and restarting.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'skip_name_resolve';"
        ```

        2. Identify accounts still defined against a hostname rather than an address:

        ```bash
        sudo mysql -e "SELECT user, host FROM mysql.user WHERE host NOT REGEXP '^[0-9a-fA-F:.%]+$';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, and the second query lists accounts that must be redefined against addresses before the option is enabled.
      remediation:
        - id: cli
          desc: |
            To disable client hostname resolution using the CLI:

            1. Redefine any account scoped to a hostname so it names an address or address pattern.
            2. Set `skip_name_resolve` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo mysql -e "SELECT user, host FROM mysql.user WHERE host NOT REGEXP '^[0-9a-fA-F:.%]+$';"
            sudo sed -i -E "/^\s*#?\s*skip[-_]name[-_]resolve/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nskip_name_resolve = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'skip_name_resolve';"
            ```
        - id: script
          desc: |
            To disable client hostname resolution using a bash script:

            1. Refuse to proceed while accounts are still scoped to hostnames, because they would stop matching.
            2. Set the option, replacing any existing value.
            3. Restart MySQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            hostname_accounts=$(mysql -N -B -e \
              "SELECT count(*) FROM mysql.user WHERE host NOT REGEXP '^[0-9a-fA-F:.%]+\$';")

            if [ "$hostname_accounts" -gt 0 ]; then
              echo "$hostname_accounts account(s) are scoped to hostnames; redefine them first" >&2
              exit 1
            fi

            if grep -qE "^\s*skip[-_]name[-_]resolve" "$MYCNF"; then
              sed -i "s|^\s*skip[-_]name[-_]resolve.*|skip_name_resolve = ON|" "$MYCNF"
            else
              printf "skip_name_resolve = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            ```
        - id: ansible
          desc: |
            To disable client hostname resolution using Ansible:

            1. Set `skip_name_resolve` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Disable MySQL client hostname resolution
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set skip_name_resolve
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: skip_name_resolve
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-skip-show-database-enabled
    title: Ensure skip_show_database is enabled
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mysql.conf.skipShowDatabase == true
    docs:
      desc: |
        This check verifies that listing the schemas on the server is a privilege an account has to hold, rather than something any authenticated connection can do.

        `skip_show_database` belongs under `[mysqld]` in the server option file. With it off, every account that authenticates can run `SHOW DATABASES` and get back every schema name on the server, including the ones it has no privilege to read a single row from. With it on, the statement answers only accounts that hold the `SHOW DATABASES` privilege, so grant that to the administrative accounts that need it before making the change.

        **Why this matters**

        Schema names are reconnaissance, and they are cheap. An attacker holding one low-privilege application credential, recovered from a configuration file or obtained through an injected query, runs a single statement and learns the layout of the server: which other applications share it, which customers or tenants are named, whether a `staging` schema sits beside `prod`, whether something called `payments` or `pii_archive` exists. That list decides where the next hour of their effort goes.

        On a shared instance the disclosure crosses a boundary between customers. One tenant's leaked credential reveals the names of every other tenant on the server, which those tenants never agreed to publish and which is often enough on its own to be a reportable event.

        Treating catalog visibility as a privilege is the same least-privilege reasoning applied to metadata rather than to rows. An account that can read one schema has no operational need to be told which others exist.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'skip_show_database';"
        ```

        2. Review which accounts hold the privilege that grants enumeration anyway:

        ```bash
        sudo mysql -e "SELECT user, host FROM mysql.user WHERE Show_db_priv = 'Y';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning every authenticated account can enumerate all schemas.
      remediation:
        - id: cli
          desc: |
            To restrict schema enumeration using the CLI:

            1. Grant `SHOW DATABASES` to the administrative accounts that genuinely need it.
            2. Set `skip_show_database` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo mysql -e "GRANT SHOW DATABASES ON *.* TO 'dba'@'10.0.0.%';"
            sudo sed -i -E "/^\s*#?\s*skip[-_]show[-_]database/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nskip_show_database = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'skip_show_database';"
            ```
        - id: script
          desc: |
            To restrict schema enumeration using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*skip[-_]show[-_]database" "$MYCNF"; then
              sed -i "s|^\s*skip[-_]show[-_]database.*|skip_show_database = ON|" "$MYCNF"
            else
              printf "skip_show_database = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'skip_show_database';"
            ```
        - id: ansible
          desc: |
            To restrict schema enumeration using Ansible:

            1. Set `skip_show_database` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restrict MySQL schema enumeration
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set skip_show_database
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: skip_show_database
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-require-secure-transport-enabled
    title: Ensure require_secure_transport is enabled
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mysql.conf.requireSecureTransport == true
    docs:
      desc: |
        This check verifies that the server refuses any connection that is neither encrypted nor made over a local Unix socket.

        `require_secure_transport` belongs under `[mysqld]` in the server option file. Installing certificate material makes TLS available to clients that ask for it, but MySQL still accepts a plain unencrypted TCP connection from a client that does not ask. This option takes the choice away from the client: an unencrypted TCP connection is rejected during the handshake. Local socket connections continue to work, because they never touch a network.

        **Why this matters**

        Without it, a connector that defaults to no TLS, or one whose TLS setup silently failed and fell back, connects in cleartext and nobody notices, because from the application's point of view everything works. What crosses the network readable is the authentication exchange, every query, and every row returned. An attacker with a tap on a switch, a compromised host on the same subnet running ARP spoofing, or access to a mirrored port collects a working credential and then the data itself, without touching either endpoint and without leaving anything in a log.

        Per-account `REQUIRE SSL` clauses cover the accounts that carry them, which is exactly why they are not a substitute for the server-wide setting. They have to be applied to every account, including the one created in a hurry during an incident, and a single omission reopens the whole path.

        Turn this on only once the server has usable certificate material, because a server that refuses unencrypted transport and has no certificate refuses every remote connection. A companion check in this policy covers the certificate and key. Since this check reads the option file, a runtime change does not satisfy it and would not survive a restart in any case.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'require_secure_transport';"
        ```

        2. Confirm current connections are encrypted:

        ```bash
        sudo mysql -e "SELECT connection_type, count(*) FROM performance_schema.threads t JOIN performance_schema.socket_instances s USING (thread_id) GROUP BY connection_type;"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning unencrypted TCP connections are still accepted.
      remediation:
        - id: cli
          desc: |
            To require encrypted connections using the CLI:

            1. Confirm TLS material is configured and the server reports it is available.
            2. Set `require_secure_transport` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo mysql -e "SHOW VARIABLES LIKE 'have_ssl';"
            sudo sed -i -E "/^\s*#?\s*require[-_]secure[-_]transport/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nrequire_secure_transport = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'require_secure_transport';"
            ```
        - id: script
          desc: |
            To require encrypted connections using a bash script:

            1. Refuse to proceed unless the server has usable TLS material, because enabling the requirement would lock out every remote client.
            2. Set the option, replacing any existing value.
            3. Restart MySQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            tls_state=$(mysql -N -B -e "SELECT @@have_ssl;" 2>/dev/null || echo "UNKNOWN")
            if [ "$tls_state" != "YES" ]; then
              echo "server reports TLS availability as $tls_state; configure certificates first" >&2
              exit 1
            fi

            if grep -qE "^\s*require[-_]secure[-_]transport" "$MYCNF"; then
              sed -i "s|^\s*require[-_]secure[-_]transport.*|require_secure_transport = ON|" "$MYCNF"
            else
              printf "require_secure_transport = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            ```
        - id: ansible
          desc: |
            To require encrypted connections using Ansible:

            1. Verify the server has usable TLS material.
            2. Set `require_secure_transport` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Require encrypted MySQL connections
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Read TLS availability
                  ansible.builtin.command:
                    cmd: mysql -N -B -e "SELECT @@have_ssl;"
                  changed_when: false
                  register: have_ssl

                - name: Fail when TLS material is missing
                  ansible.builtin.fail:
                    msg: "Configure ssl_cert and ssl_key before requiring secure transport."
                  when: have_ssl.stdout | trim != "YES"

                - name: Set require_secure_transport
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: require_secure_transport
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-tls-version-modern
    title: Ensure tls_version excludes TLS 1.0 and TLS 1.1
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mysql.conf.tlsVersion != empty
      mysql.conf.tlsVersion.none(_.downcase == "tlsv1" || _.downcase == "tlsv1.1")
    docs:
      desc: |
        This check verifies that the server offers only modern TLS versions, and that the accepted set is stated in configuration rather than inherited from whatever the build supports.

        `tls_version` belongs under `[mysqld]` in the server option file and takes a comma-separated list such as `TLSv1.2,TLSv1.3`. The check fails an unset option, and it fails a list naming `TLSv1` or `TLSv1.1`. Those two versions depend on obsolete hashing and cipher constructions, offer no authenticated encryption modes, and are not adequate for carrying authentication material.

        **Why this matters**

        Any version the server still offers is a version an attacker can steer a handshake toward. Someone positioned to modify packets in flight tampers with the client hello so negotiation settles on TLS 1.0, then attacks that weaker construction rather than the strong one the client would happily have used. The client sees an encrypted session the whole time. Removing the old versions from what the server offers is what makes the downgrade impossible, because there is nothing left to fall back to.

        Leaving the option unset is not the same as being strict. It means the accepted set comes from the versions the build was compiled to support, which varies between distributions, between MySQL releases, and between a package upgrade and the version it replaced. A server that was strict last year can quietly widen after routine patching, with nothing in the configuration recording the change and nothing in the logs announcing it.

        Confirm every connector in use negotiates TLS 1.2 or above before restricting the list. An old client library pinned to TLS 1.0 stops connecting the instant the server stops offering it, and that failure surfaces in production rather than in the change window.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'tls_version';"
        ```

        2. Confirm which version connections actually negotiate:

        ```bash
        sudo mysql -e "SHOW SESSION STATUS LIKE 'Ssl_version';"
        ```

        A passing result names only `TLSv1.2` and `TLSv1.3`. A failing result includes `TLSv1` or `TLSv1.1`, or is unset so the compiled-in default applies.
      remediation:
        - id: cli
          desc: |
            To restrict accepted TLS versions using the CLI:

            1. Confirm every client library supports TLS 1.2 or above.
            2. Set `tls_version` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*tls[-_]version/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\ntls_version = TLSv1.2,TLSv1.3\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'tls_version';"
            ```
        - id: script
          desc: |
            To restrict accepted TLS versions using a bash script:

            1. Define the accepted versions.
            2. Set the option, replacing any existing value.
            3. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            VERSIONS="TLSv1.2,TLSv1.3"

            if grep -qE "^\s*tls[-_]version" "$MYCNF"; then
              sed -i "s|^\s*tls[-_]version.*|tls_version = ${VERSIONS}|" "$MYCNF"
            else
              printf "tls_version = %s\n" "$VERSIONS" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'tls_version';"
            ```
        - id: ansible
          desc: |
            To restrict accepted TLS versions using Ansible:

            1. Set `tls_version` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restrict accepted MySQL TLS versions
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_tls_versions: "TLSv1.2,TLSv1.3"
              tasks:
                - name: Set tls_version
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: tls_version
                    value: "{{ mysql_tls_versions }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-server-certificate-configured
    title: Ensure ssl_cert and ssl_key are configured
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      mysql.conf.sslCertFile != empty
      mysql.conf.sslKeyFile != empty
    docs:
      desc: |
        This check verifies that the server presents an identity clients can verify, by requiring both a certificate and the matching private key to be named explicitly.

        `ssl_cert` and `ssl_key` belong under `[mysqld]` in the server option file and point at files the account running the server can read. Both are needed. What makes this different from most TLS checks is that MySQL does not go without when no material is provided:, it generates a self-signed certificate and key on first start, so TLS negotiates successfully and looks fine while offering nothing a client can validate against a trusted authority.

        **Why this matters**

        Encryption without a verifiable identity defends against a passive listener and nothing more. An attacker able to redirect traffic, through DNS, ARP, or a route they control, stands up a listener of their own, terminates the client's TLS session against material they generated, and relays the connection to the real database. The client sees encryption and proceeds. The attacker reads every credential and every row that passes through. A certificate the client can chain to an authority it already trusts is the only thing that tells the real server from that listener, and the auto-generated one chains to nothing.

        Naming the material also makes it manageable. A certificate at a known path is one you can watch for expiry, replace on a schedule, and reissue when a key is suspected of exposure. None of that is possible for a file the server quietly created for itself and nobody records.

        This is the prerequisite for requiring encrypted transport, so configure it first, and verify the key matches the certificate before restarting.
      audit: |
        ### Audit via CLI

        1. Read the configured paths from a running server:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('ssl_cert','ssl_key','ssl_ca');"
        ```

        2. Confirm the certificate is valid and note its expiry:

        ```bash
        sudo openssl x509 -in /etc/mysql/ssl/server-cert.pem -noout -subject -issuer -dates
        ```

        A passing result names both files and shows a certificate issued by your authority with a future expiry. A failing result leaves either option empty.
      remediation:
        - id: cli
          desc: |
            To configure server certificate material using the CLI:

            1. Install the certificate and key where the server account can read them.
            2. Set `ssl_cert` and `ssl_key` in the server option file.
            3. Restart MySQL and confirm the paths.

            ```bash
            sudo install -o mysql -g mysql -m 0600 server-key.pem /etc/mysql/ssl/server-key.pem
            sudo install -o mysql -g mysql -m 0644 server-cert.pem /etc/mysql/ssl/server-cert.pem
            sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null <<'EOF'
            [mysqld]
            ssl_cert = /etc/mysql/ssl/server-cert.pem
            ssl_key  = /etc/mysql/ssl/server-key.pem
            EOF
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('ssl_cert','ssl_key');"
            ```
        - id: script
          desc: |
            To configure server certificate material using a bash script:

            1. Verify the certificate and key are present and that the key matches the certificate.
            2. Set both options, replacing any existing values.
            3. Restart MySQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            CERT="/etc/mysql/ssl/server-cert.pem"
            KEY="/etc/mysql/ssl/server-key.pem"

            cert_mod=$(openssl x509 -in "$CERT" -noout -modulus)
            key_mod=$(openssl rsa -in "$KEY" -noout -modulus)
            if [ "$cert_mod" != "$key_mod" ]; then
              echo "private key does not match the certificate" >&2
              exit 1
            fi

            chown mysql:mysql "$KEY" "$CERT"
            chmod 0600 "$KEY"
            chmod 0644 "$CERT"

            set_option() {
              local key="$1" value="$2"
              if grep -qE "^\s*${key}\b" "$MYCNF"; then
                sed -i "s|^\s*${key}\b.*|${key} = ${value}|" "$MYCNF"
              else
                printf "%s = %s\n" "$key" "$value" >>"$MYCNF"
              fi
            }

            set_option ssl_cert "$CERT"
            set_option ssl_key "$KEY"

            systemctl restart mysql
            ```
        - id: ansible
          desc: |
            To configure server certificate material using Ansible:

            1. Place the certificate and key with ownership the server can read.
            2. Set `ssl_cert` and `ssl_key` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Configure MySQL server certificate material
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_ssl_cert: /etc/mysql/ssl/server-cert.pem
                mysql_ssl_key: /etc/mysql/ssl/server-key.pem
              tasks:
                - name: Protect the private key
                  ansible.builtin.file:
                    path: "{{ mysql_ssl_key }}"
                    owner: mysql
                    group: mysql
                    mode: "0600"

                - name: Set the certificate options
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "ssl_cert", value: "{{ mysql_ssl_cert }}" }
                    - { option: "ssl_key", value: "{{ mysql_ssl_key }}" }
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-client-ca-configured
    title: Ensure a certificate authority is configured for client verification
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mysql.conf.sslCaFile != empty || mysql.conf.sslCaPath != empty
    docs:
      desc: |
        This check verifies that the server holds a trust anchor it can validate presented client certificates against.

        `ssl_ca` names a single authority certificate file and `ssl_capath` names a directory of them. Both belong under `[mysqld]` in the server option file, and either satisfies this check. Without one, the server has nothing to check a client certificate against, so an account created with `REQUIRE X509`, `REQUIRE ISSUER`, or `REQUIRE SUBJECT` cannot be enforced at all.

        **Why this matters**

        An account requirement that cannot be evaluated is worse than none, because it reads as a control. Someone scopes a high-privilege account to certificate authentication, records that decision in a design document, and moves on. The server, with no anchor, is left with the password as the only real barrier on an account whose password handling was relaxed precisely because a certificate was supposed to carry the weight.

        A configured authority is also what bounds who can mint an identity the server will accept. Only certificates chaining to it are honored, so an attacker who generates their own self-signed client certificate is turned away rather than admitted. It gives you somewhere to distrust a certificate whose key has leaked, which is not possible when there is no chain in the first place.

        The same anchor serves the other direction. Clients connecting with `VERIFY_CA` or `VERIFY_IDENTITY` need to trust the issuer of the server's certificate, so distributing the authority alongside the server material is what makes strict client-side verification practical rather than aspirational. Inspect the authority contents when one is configured, since a bundle that accumulated public roots trusts far more issuers than intended.
      audit: |
        ### Audit via CLI

        1. Read the configured trust anchor:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('ssl_ca','ssl_capath','ssl_crl');"
        ```

        2. Identify accounts that depend on client certificates:

        ```bash
        sudo mysql -e "SELECT user, host, ssl_type FROM mysql.user WHERE ssl_type <> '';"
        ```

        3. Inspect the authority contents when one is configured:

        ```bash
        sudo openssl x509 -in /etc/mysql/ssl/ca.pem -noout -subject -dates
        ```

        A passing result names an authority file or directory. A failing result leaves both empty, in which case any account requiring X.509 cannot be validated.
      remediation:
        - id: cli
          desc: |
            To configure a client certificate authority using the CLI:

            1. Install the issuing authority certificate where the server can read it.
            2. Set `ssl_ca` in the server option file.
            3. Restart MySQL and confirm the value.

            ```bash
            sudo install -o mysql -g mysql -m 0644 ca.pem /etc/mysql/ssl/ca.pem
            sudo sed -i -E "/^\s*#?\s*ssl[-_]ca\b/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nssl_ca = /etc/mysql/ssl/ca.pem\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'ssl_ca';"
            ```
        - id: script
          desc: |
            To configure a client certificate authority using a bash script:

            1. Verify the authority certificate is present and parseable.
            2. Set `ssl_ca`, replacing any existing value.
            3. Restart MySQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            CA_FILE="/etc/mysql/ssl/ca.pem"

            if ! openssl x509 -in "$CA_FILE" -noout >/dev/null 2>&1; then
              echo "authority certificate missing or unparseable: $CA_FILE" >&2
              exit 1
            fi

            chown mysql:mysql "$CA_FILE"
            chmod 0644 "$CA_FILE"

            if grep -qE "^\s*ssl[-_]ca\b" "$MYCNF"; then
              sed -i "s|^\s*ssl[-_]ca\b.*|ssl_ca = ${CA_FILE}|" "$MYCNF"
            else
              printf "ssl_ca = %s\n" "$CA_FILE" >>"$MYCNF"
            fi

            systemctl restart mysql
            ```
        - id: ansible
          desc: |
            To configure a client certificate authority using Ansible:

            1. Place the authority certificate with ownership the server can read.
            2. Set `ssl_ca` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Configure the MySQL client certificate authority
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_ssl_ca: /etc/mysql/ssl/ca.pem
              tasks:
                - name: Install the authority certificate
                  ansible.builtin.copy:
                    src: ca.pem
                    dest: "{{ mysql_ssl_ca }}"
                    owner: mysql
                    group: mysql
                    mode: "0644"

                - name: Set ssl_ca
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: ssl_ca
                    value: "{{ mysql_ssl_ca }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-skip-grant-tables-disabled
    title: Ensure skip_grant_tables is not enabled
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mysql.conf.skipGrantTables == false
    docs:
      desc: |
        This check verifies that the privilege system is loaded, by confirming that no option file in the include chain asks the server to start without it.

        `skip_grant_tables` belongs, if anywhere, under `[mysqld]`, and the check searches every fragment the server reads, not only the main file. The option is enabled by its presence: a bare `skip_grant_tables` line with no value counts exactly as much as an explicit `ON`, and both fail.

        **Why this matters**

        With the option in effect the server has no privilege system. Grant tables are not read, no password is asked for, and every session acts with full rights on every schema. MySQL narrows the blast radius somewhat by enabling `skip_networking` at the same time, so remote connections are refused, but that only moves the boundary rather than restoring it. Every local account on the host is now a database administrator, as is every process in a container that shares the socket, every scheduled job, and any attacker with the smallest foothold on the machine.

        What they take is not limited to the current data. The account table itself is readable, so the password hashes leave with them and are cracked offline, then tried against the other servers where the same people reused those passwords. Failed-login tracking and account locking are also disabled, and loadable functions and events registered in the system tables do not load, so the server is running in a state nothing else in this policy applies to.

        The option exists to recover a server whose administrative password has been lost, and is meant to be used for minutes. What this check catches is the recovery that ended with service restored and the line forgotten. It survives every restart from then on, and the server looks entirely ordinary from the outside.
      audit: |
        ### Audit via CLI

        1. Confirm the privilege system is active on a running server:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'skip_grant_tables';"
        ```

        2. Search every option file for the option, including include fragments:

        ```bash
        sudo grep -rniE "^\s*skip[-_]grant[-_]tables" /etc/mysql/ /etc/my.cnf /etc/my.cnf.d/ 2>/dev/null
        ```

        A passing result reports `OFF` and finds no matching line. A failing result reports `ON`, or finds the option written as a bare flag.
      remediation:
        - id: cli
          desc: |
            To restore the privilege system using the CLI:

            1. Remove the option from every option file that declares it.
            2. Restart MySQL so the privilege system is loaded.
            3. Confirm the option is off and that authentication is required.

            ```bash
            sudo sed -i -E "/^\s*skip[-_]grant[-_]tables/d" /etc/mysql/mysql.conf.d/mysqld.cnf
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'skip_grant_tables';"
            ```
        - id: script
          desc: |
            To restore the privilege system using a bash script:

            1. Remove the option from the main file and every include fragment.
            2. Restart MySQL.
            3. Fail if the option survives anywhere.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            for dir in /etc/mysql /etc/my.cnf.d; do
              [ -d "$dir" ] || continue
              find "$dir" -type f -name "*.cnf" -exec \
                sed -i -E "/^[[:space:]]*skip[-_]grant[-_]tables/d" {} +
            done

            if [ -f /etc/my.cnf ]; then
              sed -i -E "/^[[:space:]]*skip[-_]grant[-_]tables/d" /etc/my.cnf
            fi

            systemctl restart mysql

            state=$(mysql -N -B -e "SELECT @@skip_grant_tables;")
            if [ "$state" != "0" ] && [ "$state" != "OFF" ]; then
              echo "privilege system still disabled" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To restore the privilege system using Ansible:

            1. Remove the option from every option file.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restore the MySQL privilege system
              hosts: mysql
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Remove skip_grant_tables
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*skip[-_]grant[-_]tables'
                    state: absent
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-strong-authentication-plugin
    title: Ensure mysql_native_password is not the default authentication plugin
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.defaultAuthenticationPlugin.downcase != "mysql_native_password"
    docs:
      desc: |
        This check verifies that the server has not been configured to create new accounts with the legacy `mysql_native_password` authentication plugin.

        `default_authentication_plugin` belongs under `[mysqld]` in the server option file and decides which plugin an account gets when `CREATE USER` does not name one. MySQL 8.0 already defaults to `caching_sha2_password`, so the check treats an unset option as compliant and fails only where the weaker plugin has been selected deliberately. On 8.0.27 and later this option is superseded by `authentication_policy`, which expresses the same choice as a list of factors.

        **Why this matters**

        The difference is in what the account table holds. `mysql_native_password` stores a single unsalted SHA-1 based value, so the same password produces the same stored value for every account on every server in the world. An attacker who obtains the table matches those values against precomputed sets rather than cracking anything, and recovers passwords for the common ones instantly.

        Worse, that stored value is itself sufficient to authenticate. The protocol proves knowledge of the hash, not of the password, so an attacker who reads the account table can connect as those accounts without ever recovering the plaintext. Reading the table is equivalent to holding the credentials.

        `caching_sha2_password` salts and iterates, so identical passwords produce different stored values, precomputation does not apply, and the stored value is not directly replayable. It also insists the password reach the server over TLS or an RSA key exchange rather than in the clear.

        Migration is not automatic. Changing the option affects new accounts only; existing ones keep their plugin until each password is set again, so identify those accounts and plan the reset rather than assuming the restart finished the job.
      audit: |
        ### Audit via CLI

        1. Read the effective plugin selection:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('default_authentication_plugin','authentication_policy');"
        ```

        2. Identify accounts still using the weaker plugin:

        ```bash
        sudo mysql -e "SELECT user, host, plugin FROM mysql.user WHERE plugin = 'mysql_native_password';"
        ```

        A passing result reports `caching_sha2_password` or leaves the option unset. A failing result reports `mysql_native_password`, and the second query lists accounts that need their passwords reset after the change.
      remediation:
        - id: cli
          desc: |
            To select a stronger authentication plugin using the CLI:

            1. Confirm every client library supports `caching_sha2_password`.
            2. Set the option in the server option file and restart the server.
            3. Migrate existing accounts, which requires setting each password again.

            ```bash
            sudo sed -i -E "/^\s*#?\s*default[-_]authentication[-_]plugin/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\ndefault_authentication_plugin = caching_sha2_password\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "ALTER USER 'app'@'10.0.0.%' IDENTIFIED WITH caching_sha2_password BY 'new-password';"
            sudo mysql -e "SELECT user, host, plugin FROM mysql.user WHERE plugin = 'mysql_native_password';"
            ```
        - id: script
          desc: |
            To select a stronger authentication plugin using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL.
            3. Report the accounts that still need migrating rather than resetting passwords automatically.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*default[-_]authentication[-_]plugin" "$MYCNF"; then
              sed -i "s|^\s*default[-_]authentication[-_]plugin.*|default_authentication_plugin = caching_sha2_password|" "$MYCNF"
            else
              printf "default_authentication_plugin = caching_sha2_password\n" >>"$MYCNF"
            fi

            systemctl restart mysql

            echo "accounts still using mysql_native_password:"
            mysql -N -B -e \
              "SELECT concat(user,'@',host) FROM mysql.user WHERE plugin = 'mysql_native_password';"
            ```
        - id: ansible
          desc: |
            To select a stronger authentication plugin using Ansible:

            1. Set the option in the server option group.
            2. Notify a handler that restarts the server.
            3. Report accounts that still need migrating.

            ```yaml
            - name: Select a stronger MySQL authentication plugin
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set default_authentication_plugin
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: default_authentication_plugin
                    value: caching_sha2_password
                    mode: "0640"
                  notify: Restart mysql

                - name: Flush handlers so the new plugin applies
                  ansible.builtin.meta: flush_handlers

                - name: Find accounts using the weaker plugin
                  ansible.builtin.command:
                    cmd: >-
                      mysql -N -B -e "SELECT concat(user,'@',host) FROM mysql.user
                      WHERE plugin = 'mysql_native_password';"
                  changed_when: false
                  register: legacy_accounts

                - name: Report accounts needing migration
                  ansible.builtin.debug:
                    msg: "Reset the password for: {{ legacy_accounts.stdout_lines }}"
                  when: legacy_accounts.stdout_lines | length > 0
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-validate-password-plugin-loaded
    title: Ensure the validate_password component is loaded at startup
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.pluginLoad.any(_ == /validate_password/)
    docs:
      desc: |
        This check verifies that password strength rules are in force from the moment the server starts, by requiring the component that enforces them to be named in the option file.

        `validate_password` has to appear in `plugin_load` or `plugin_load_add` under `[mysqld]`. Without it the server has no opinion about passwords at all and accepts whatever an account is created with, including a single character, the account name, or the string `password` itself.

        **Why this matters**

        Registering it only at runtime leaves a real gap. Runtime registration lives in server state, so it survives an ordinary restart on a healthy host, but it does not survive a rebuild, a restore from an image, or a node stood up by configuration management that only knows about the option files. Anything that builds the server from configuration builds it with no password policy, and the accounts created during that window are exactly the ones nobody audits afterward.

        The outcome is an account with a guessable password sitting on a server that believes it enforces a policy. An attacker who can reach the port works a short wordlist against the application account name and gets in, with no exploit, no leak, and no unusual traffic, because nothing ever refused the password at the point it was set.

        This is also the prerequisite for the rest of the password checks in this group. The policy class, the minimum length, and the account name comparison are all settings this component reads, so a configuration that sets them without loading it enforces nothing while presenting as fully configured. Confirm the policy variables actually appear after the restart rather than assuming the load succeeded.
      audit: |
        ### Audit via CLI

        1. Confirm the component is active:

        ```bash
        sudo mysql -e "SELECT * FROM mysql.component WHERE component_urn LIKE '%validate_password%';"
        ```

        2. Confirm the resulting policy variables are present:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'validate_password%';"
        ```

        A passing result shows the component installed and the policy variables present. A failing result returns no rows, meaning no password rules are enforced.
      remediation:
        - id: cli
          desc: |
            To load password validation at startup using the CLI:

            1. Install the component so it is registered with the server.
            2. Add it to the option file so it loads on every start.
            3. Restart MySQL and confirm the policy variables appear.

            ```bash
            sudo mysql -e "INSTALL COMPONENT 'file://component_validate_password';"
            sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null <<'EOF'
            [mysqld]
            plugin_load_add = validate_password.so
            EOF
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'validate_password%';"
            ```
        - id: script
          desc: |
            To load password validation at startup using a bash script:

            1. Install the component when it is not already registered.
            2. Add the load option when it is absent.
            3. Restart MySQL and confirm the policy variables are present.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            installed=$(mysql -N -B -e \
              "SELECT count(*) FROM mysql.component WHERE component_urn LIKE '%validate_password%';")

            if [ "$installed" -eq 0 ]; then
              mysql -e "INSTALL COMPONENT 'file://component_validate_password';"
            fi

            if ! grep -qE "^\s*plugin[-_]load([-_]add)?\s*=.*validate_password" "$MYCNF"; then
              printf "plugin_load_add = validate_password.so\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'validate_password%';"
            ```
        - id: ansible
          desc: |
            To load password validation at startup using Ansible:

            1. Install the component.
            2. Add the load option to the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Load MySQL password validation at startup
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Install the validate_password component
                  ansible.builtin.command:
                    cmd: mysql -e "INSTALL COMPONENT 'file://component_validate_password';"
                  register: install_component
                  changed_when: install_component.rc == 0
                  failed_when: >-
                    install_component.rc != 0 and
                    'already exists' not in install_component.stderr

                - name: Load the component on every start
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: plugin_load_add
                    value: validate_password.so
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-validate-password-policy-strong
    title: Ensure validate_password.policy is MEDIUM or STRONG
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.validatePasswordPolicy.downcase == "medium" || mysql.conf.validatePasswordPolicy.downcase == "strong"
    docs:
      desc: |
        This check verifies that accepted passwords have to satisfy more than a length requirement, by requiring the policy class to be `MEDIUM` or `STRONG`.

        `validate_password.policy` belongs under `[mysqld]` in the server option file and takes one of three values. `LOW` enforces length and nothing else, so a string of repeated lowercase letters passes. `MEDIUM` adds requirements for numeric, mixed case, and special characters. `STRONG` adds a dictionary check on top of that. The check fails `LOW` and fails an unset value.

        **Why this matters**

        At `LOW`, the shape of password people actually choose when told to make it long defeats the policy completely. A memorable all-lowercase phrase satisfies the rule, and that is precisely the first region a cracking rig searches. Attackers working a stolen hash do not start from the full character space; they start from dictionary words, then those words with predictable substitutions, then all-lowercase strings ordered by length. A password from that region falls in the first hours of the run.

        `MEDIUM` pushes the candidate out of the cheap part of that ordering, since a password must draw on several character classes at once and the combinations a human generates from a phrase no longer qualify. `STRONG` screens against a dictionary file directly, so known words are rejected outright rather than merely made more expensive.

        The requirement lands almost entirely on passwords chosen by people, or generated by scripts written before any policy existed. A service credential produced at high entropy from a secret manager already satisfies `STRONG` with no effort and no exception needed.

        The rules apply when a password is set, so they shape what enters the account table rather than judging what is already there. Rotate credentials set before the component was loaded.
      audit: |
        ### Audit via CLI

        1. Read the effective policy class:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'validate_password.policy';"
        ```

        2. Confirm the policy is actually enforced by testing a weak password:

        ```bash
        sudo mysql -e "SELECT VALIDATE_PASSWORD_STRENGTH('password');"
        ```

        A passing result reports `MEDIUM` or `STRONG`. A failing result reports `LOW`, or returns no row because the component is not loaded.
      remediation:
        - id: cli
          desc: |
            To strengthen the password policy class using the CLI:

            1. Set `validate_password.policy` in the server option file.
            2. Restart MySQL.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*validate_password\.policy/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nvalidate_password.policy = STRONG\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'validate_password.policy';"
            ```
        - id: script
          desc: |
            To strengthen the password policy class using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            POLICY="STRONG"

            if grep -qE "^\s*validate_password\.policy" "$MYCNF"; then
              sed -i "s|^\s*validate_password\.policy.*|validate_password.policy = ${POLICY}|" "$MYCNF"
            else
              printf "validate_password.policy = %s\n" "$POLICY" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'validate_password.policy';"
            ```
        - id: ansible
          desc: |
            To strengthen the password policy class using Ansible:

            1. Set `validate_password.policy` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Strengthen the MySQL password policy class
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_password_policy: STRONG
              tasks:
                - name: Set validate_password.policy
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: validate_password.policy
                    value: "{{ mysql_password_policy }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-validate-password-length-sufficient
    title: Ensure validate_password.length is at least 14 characters
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.validatePasswordLength >= 14
    docs:
      desc: |
        This check verifies that the server refuses any password shorter than 14 characters.

        `validate_password.length` belongs under `[mysqld]` in the server option file and is read by the password validation component. MySQL's own default is 8. The check also fails when the option is absent, which reads as 0, so the minimum has to be written down rather than left to whatever the installed release ships.

        **Why this matters**

        The attack this defends against happens offline and out of your sight. An attacker who obtains the account table, through a filesystem read, a stolen backup, a copied data directory, or a query on a server where privileges were too broad, takes the hashes away and attacks them on hardware you do not control. No rate limit applies. No failed-login alert fires. Nothing is connecting to your server any more, so nothing in your monitoring can tell you it is happening.

        Against that attack, length is the variable that matters most. Each additional character multiplies the search space, so cost grows exponentially with length while composition rules widen the alphabet only by a constant factor. Eight characters is within reach of commodity GPUs for common hash constructions, and the margin shrinks every year. Fourteen keeps a randomly chosen password outside exhaustive search and stays there as hardware improves.

        Longer passwords are also less likely to appear verbatim in a breach corpus, which is what defeats credential stuffing from an unrelated site's leak rather than from yours.

        Writing the minimum explicitly puts it in the option file where it can be reviewed, instead of leaving it at a default that differs between versions and can move under you.
      audit: |
        ### Audit via CLI

        1. Read the effective minimum length:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'validate_password.length';"
        ```

        2. Confirm the minimum is enforced:

        ```bash
        sudo mysql -e "SELECT VALIDATE_PASSWORD_STRENGTH('Short1!');"
        ```

        A passing result reports 14 or greater. A failing result reports a smaller number such as 8, or returns no row because the component is not loaded.
      remediation:
        - id: cli
          desc: |
            To raise the minimum password length using the CLI:

            1. Set `validate_password.length` in the server option file.
            2. Restart MySQL.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*validate_password\.length/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nvalidate_password.length = 14\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'validate_password.length';"
            ```
        - id: script
          desc: |
            To raise the minimum password length using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            MIN_LENGTH=14

            if grep -qE "^\s*validate_password\.length" "$MYCNF"; then
              sed -i "s|^\s*validate_password\.length.*|validate_password.length = ${MIN_LENGTH}|" "$MYCNF"
            else
              printf "validate_password.length = %s\n" "$MIN_LENGTH" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'validate_password.length';"
            ```
        - id: ansible
          desc: |
            To raise the minimum password length using Ansible:

            1. Set `validate_password.length` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Raise the MySQL minimum password length
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_password_min_length: 14
              tasks:
                - name: Set validate_password.length
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: validate_password.length
                    value: "{{ mysql_password_min_length }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-validate-password-checks-user-name
    title: Ensure validate_password.check_user_name is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.validatePasswordCheckUserName == true
    docs:
      desc: |
        This check verifies that a password cannot be the account name it belongs to, forwards or reversed.

        `validate_password.check_user_name` belongs under `[mysqld]` in the server option file and is read by the password validation component. With it on, the server compares a proposed password against the account name at the moment the password is set and rejects a match in either direction. The check fails when the option is off and when the component is not loaded, since the comparison then never happens.

        **Why this matters**

        The account name is the first thing anyone guesses, and unlike a password it is not a secret. Account names are visible in application configuration, in connection error messages, in monitoring dashboards, in infrastructure code committed to a repository, and in the names of the services they belong to. An attacker enumerating a server tries the obvious ones first, and `backup` with the password `backup` costs them one attempt.

        The pattern this rejects is specific and common: a service account is created during a deployment, someone needs a password immediately, and the name is right there. That credential then persists for years, because nothing about it ever fails and no rotation touches an account nobody remembers owning.

        Covering the reversed form closes the trivial evasion, where the same person types the name backwards and considers the problem solved.

        Because the comparison runs when the password is set, this only shapes credentials created after the option is on. Accounts that already carry their own name as a password are unaffected and have to be found and rotated separately.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'validate_password.check_user_name';"
        ```

        2. Confirm the rule is enforced by testing an account name as a password:

        ```bash
        sudo mysql -e "SELECT VALIDATE_PASSWORD_STRENGTH('appuser');"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, or returns no row because the component is not loaded.
      remediation:
        - id: cli
          desc: |
            To reject account names as passwords using the CLI:

            1. Set `validate_password.check_user_name` in the server option file.
            2. Restart MySQL.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*validate_password\.check_user_name/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nvalidate_password.check_user_name = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'validate_password.check_user_name';"
            ```
        - id: script
          desc: |
            To reject account names as passwords using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*validate_password\.check_user_name" "$MYCNF"; then
              sed -i "s|^\s*validate_password\.check_user_name.*|validate_password.check_user_name = ON|" "$MYCNF"
            else
              printf "validate_password.check_user_name = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'validate_password.check_user_name';"
            ```
        - id: ansible
          desc: |
            To reject account names as passwords using Ansible:

            1. Set `validate_password.check_user_name` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Reject MySQL account names used as passwords
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set validate_password.check_user_name
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: validate_password.check_user_name
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-password-expiry-configured
    title: Ensure default_password_lifetime enforces password rotation
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-9
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.defaultPasswordLifetime > 0
    docs:
      desc: |
        This check verifies that passwords on this server have a finite lifetime, by requiring a rotation interval in days.

        `default_password_lifetime` belongs under `[mysqld]` in the server option file and is expressed in days. MySQL 8.0 defaults it to 0, which means no password on the server ever expires, and the check fails that value.

        **Why this matters**

        Without an interval, a credential stays valid until a person notices something. That is the failure mode: nobody notices. A password pasted into a support ticket in 2021, committed to a repository and later removed from the working tree but not the history, or read out of a log by a contractor who has since left, still authenticates today, and the only signal that anything is wrong would be someone using it.

        A finite lifetime bounds how long a leak stays useful without requiring anyone to detect the leak. An attacker who obtained a password and has been using it quietly loses it at the next rotation, whether or not their access was ever noticed. Rotation also surfaces the accounts nobody owns any more, because the expiry is what forces someone to go looking for who is responsible for a service that just stopped connecting.

        The exception belongs on the account, not on the server. An account that authenticates with a certificate or a socket plugin, or one whose credential is managed by a secret store on its own schedule, is marked `PASSWORD EXPIRE NEVER` individually. That records the decision against the account where a reviewer will see it, rather than removing expiry for everything.

        Identify accounts already older than the new interval before restarting, since they expire at once and their applications stop connecting.
      audit: |
        ### Audit via CLI

        1. Read the effective lifetime:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'default_password_lifetime';"
        ```

        2. Identify accounts that override the default and never expire:

        ```bash
        sudo mysql -e "SELECT user, host, password_lifetime, password_last_changed FROM mysql.user WHERE password_lifetime = 0;"
        ```

        A passing result reports a positive number of days. A failing result reports 0, meaning no password on the server ever expires.
      remediation:
        - id: cli
          desc: |
            To enforce password rotation using the CLI:

            1. Set `default_password_lifetime` in the server option file.
            2. Mark accounts that must not rotate so they are exempt deliberately.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*default[-_]password[-_]lifetime/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\ndefault_password_lifetime = 90\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo mysql -e "ALTER USER 'replica'@'10.0.0.%' PASSWORD EXPIRE NEVER;"
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'default_password_lifetime';"
            ```
        - id: script
          desc: |
            To enforce password rotation using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL.
            3. Report accounts whose passwords are already older than the new interval.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            LIFETIME=90

            if grep -qE "^\s*default[-_]password[-_]lifetime" "$MYCNF"; then
              sed -i "s|^\s*default[-_]password[-_]lifetime.*|default_password_lifetime = ${LIFETIME}|" "$MYCNF"
            else
              printf "default_password_lifetime = %s\n" "$LIFETIME" >>"$MYCNF"
            fi

            systemctl restart mysql

            echo "accounts whose password is already older than ${LIFETIME} days:"
            mysql -N -B -e "SELECT concat(user,'@',host) FROM mysql.user
              WHERE password_last_changed < now() - interval ${LIFETIME} day;"
            ```
        - id: ansible
          desc: |
            To enforce password rotation using Ansible:

            1. Set `default_password_lifetime` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Enforce MySQL password rotation
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_password_lifetime: 90
              tasks:
                - name: Set default_password_lifetime
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: default_password_lifetime
                    value: "{{ mysql_password_lifetime }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-password-reuse-restricted
    title: Ensure password reuse is restricted by history or interval
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-7
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.passwordHistory > 0 || mysql.conf.passwordReuseInterval > 0
    docs:
      desc: |
        This check verifies that a password change cannot restore a password the account previously used, by requiring a history depth, a reuse interval, or both.

        `password_history` counts how many recent passwords are blocked, and `password_reuse_interval` blocks any password used within a number of days. Both belong under `[mysqld]` in the server option file, and both default to 0. Either being positive satisfies this check; setting both is stronger.

        **Why this matters**

        Rotation with no history check produces no new secret. An account told to change its password sets it back to the value it just replaced, or alternates between two familiar ones on every cycle, and the audit trail shows a dutiful change each time while the credential actually in circulation never changed at all.

        That matters most for the password you already know leaked. A credential exposed in a commit, a log file, or a ticket is supposed to be dead the moment it is rotated. If nothing prevents the owner from setting it again next quarter, an attacker who filed it away and retries it periodically gets back in, on a credential everyone believes was retired, and the successful login looks entirely legitimate.

        The two options cover different rotation patterns, which is why both exist. A count-based limit is defeated by an account that cycles through enough throwaway passwords in one sitting to push the old one out of history; a time-based limit is defeated by an account that rotates rarely enough for the window to expire. Setting both closes each gap with the other.

        History is recorded from the moment the options take effect, so the first rotation after the change is the first one they can actually constrain.
      audit: |
        ### Audit via CLI

        1. Read both effective values:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('password_history','password_reuse_interval');"
        ```

        2. Confirm history is being recorded:

        ```bash
        sudo mysql -e "SELECT user, host, count(*) FROM mysql.password_history GROUP BY user, host;"
        ```

        A passing result reports a positive value for at least one option. A failing result reports 0 for both, meaning any previous password can be restored.
      remediation:
        - id: cli
          desc: |
            To restrict password reuse using the CLI:

            1. Set both options in the server option file.
            2. Restart MySQL.
            3. Confirm the effective values.

            ```bash
            sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null <<'EOF'
            [mysqld]
            password_history = 5
            password_reuse_interval = 365
            EOF
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('password_history','password_reuse_interval');"
            ```
        - id: script
          desc: |
            To restrict password reuse using a bash script:

            1. Set both options, replacing any existing values.
            2. Restart MySQL and report the effective values.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            set_option() {
              local key="$1" value="$2"
              if grep -qE "^\s*${key}\b" "$MYCNF"; then
                sed -i "s|^\s*${key}\b.*|${key} = ${value}|" "$MYCNF"
              else
                printf "%s = %s\n" "$key" "$value" >>"$MYCNF"
              fi
            }

            set_option password_history 5
            set_option password_reuse_interval 365

            systemctl restart mysql
            mysql -e "SHOW VARIABLES WHERE Variable_name IN ('password_history','password_reuse_interval');"
            ```
        - id: ansible
          desc: |
            To restrict password reuse using Ansible:

            1. Set both options in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restrict MySQL password reuse
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set the reuse options
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "password_history", value: "5" }
                    - { option: "password_reuse_interval", value: "365" }
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-password-require-current-enabled
    title: Ensure password_require_current is enabled
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.passwordRequireCurrent == true
    docs:
      desc: |
        This check verifies that changing an account's password requires knowing the current one.

        `password_require_current` belongs under `[mysqld]` in the server option file and is off by default. While it is off, any session that has already authenticated can replace its own account's password without proving it knows the value it is replacing.

        **Why this matters**

        This closes the gap between holding a session and holding the credential, and those are not the same thing. A session can be obtained without ever learning the password: an application connection hijacked through a compromised web process, a pooled connection reachable from injected code, a client left open on an unlocked workstation, or a connection handed over by a bug in a proxy layer.

        From any of those, an attacker with the option off runs one statement and now owns the account outright. The new password works from anywhere, survives the session ending, survives the application being restarted, and survives the vulnerability that gave them the session being patched. What was a temporary foothold becomes durable access on a credential of their own choosing.

        It also locks out the legitimate owner, which is how this is usually discovered, and the resulting incident is treated as an application fault long before anyone reads it as a takeover.

        Requiring the current password means the same attacker gets only what the session already allows, and loses it when the session ends.

        Individual accounts can override the server default in either direction, so review the accounts that do. An automation account whose password is rotated by a secret store without presenting the old value is a legitimate exception, and it belongs on that account rather than on the whole server.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'password_require_current';"
        ```

        2. Identify accounts that override the server default:

        ```bash
        sudo mysql -e "SELECT user, host, Password_require_current FROM mysql.user WHERE Password_require_current <> 'N';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning any authenticated session can replace its own password.
      remediation:
        - id: cli
          desc: |
            To require the current password for changes using the CLI:

            1. Set `password_require_current` in the server option file.
            2. Restart MySQL.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*password[-_]require[-_]current/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\npassword_require_current = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'password_require_current';"
            ```
        - id: script
          desc: |
            To require the current password for changes using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*password[-_]require[-_]current" "$MYCNF"; then
              sed -i "s|^\s*password[-_]require[-_]current.*|password_require_current = ON|" "$MYCNF"
            else
              printf "password_require_current = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'password_require_current';"
            ```
        - id: ansible
          desc: |
            To require the current password for changes using Ansible:

            1. Set `password_require_current` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Require the current MySQL password for changes
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set password_require_current
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: password_require_current
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-runs-as-dedicated-account
    title: Ensure the server does not run as the root account
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mysql.conf.serverOptions["user"] != empty && mysql.conf.serverOptions["user"].downcase != "root"
    docs:
      desc: |
        This check verifies that the server drops to a dedicated unprivileged operating system account instead of running as `root`.

        The `user` option belongs under `[mysqld]` in the server option file and names the account the server switches to once it has bound its port. On a packaged install that account is `mysql`. The check fails when the option names `root` and when it is absent, because an unset option leaves the server holding the identity of whatever started it, which for a service started at boot is `root`.

        **Why this matters**

        This is the boundary that keeps a database compromise from becoming a host compromise. MySQL hands sufficiently privileged accounts several ways to write a file: `SELECT ... INTO OUTFILE`, a user-defined function library loaded from the plugin directory, and the log destinations themselves. Every one of those writes runs as the operating system account the server holds.

        Running as `root`, that write primitive is control of the machine. An attacker who reaches a privileged database account appends a key to `/root/.ssh/authorized_keys`, drops a file into `/etc/cron.d`, or overwrites a systemd unit, and returns as the host administrator on the next connection or the next minute. None of that needs a MySQL vulnerability. It is the documented behavior of a documented statement, aimed at paths it was never meant to reach.

        Running as a dedicated account, the same primitive reaches only what that account owns, which is the data directory and the log directory, and nothing else on the host.

        Create the account, transfer ownership of the data directory to it, then set the option and restart. Confirm the running process actually holds that identity afterward, since the switch only happens when the server had the privilege to make it.
      audit: |
        ### Audit via CLI

        1. Read the account the server is configured to use:

        ```bash
        sudo grep -rniE "^\s*user\s*=" /etc/mysql/ /etc/my.cnf 2>/dev/null
        ```

        2. Confirm the identity the running process actually holds:

        ```bash
        ps -o user= -C mysqld
        ```

        3. Confirm the data directory is owned by that account:

        ```bash
        sudo ls -ld "$(sudo mysql -N -B -e 'SELECT @@datadir;')"
        ```

        A passing result names a dedicated account such as `mysql`, and the process runs as that account. A failing result names `root`, leaves the option unset, or shows the process running as `root`.
      remediation:
        - id: cli
          desc: |
            To run the server as a dedicated account using the CLI:

            1. Create the account when it does not exist.
            2. Transfer ownership of the data directory and log directory to it.
            3. Set the `user` option, restart the server, and confirm the running identity.

            ```bash
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin mysql || true
            sudo chown -R mysql:mysql /var/lib/mysql /var/log/mysql
            sudo sed -i -E "/^\s*#?\s*user\s*=/d" /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nuser = mysql\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            ps -o user= -C mysqld
            ```
        - id: script
          desc: |
            To run the server as a dedicated account using a bash script:

            1. Create the account when it is missing.
            2. Transfer ownership of the data directory reported by the server.
            3. Set the option, restart, and fail if the process still runs as root.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            ACCOUNT="mysql"

            if ! id "$ACCOUNT" >/dev/null 2>&1; then
              useradd --system --no-create-home --shell /usr/sbin/nologin "$ACCOUNT"
            fi

            datadir=$(mysql -N -B -e "SELECT @@datadir;")
            chown -R "${ACCOUNT}:${ACCOUNT}" "$datadir"

            if grep -qE "^\s*user\s*=" "$MYCNF"; then
              sed -i "s|^\s*user\s*=.*|user = ${ACCOUNT}|" "$MYCNF"
            else
              printf "user = %s\n" "$ACCOUNT" >>"$MYCNF"
            fi

            systemctl restart mysql

            running_as=$(ps -o user= -C mysqld | tr -d ' ' | head -n1)
            if [ "$running_as" = "root" ]; then
              echo "mysqld is still running as root" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To run the server as a dedicated account using Ansible:

            1. Create the dedicated account.
            2. Transfer ownership of the data directory.
            3. Set the `user` option and restart the server.

            ```yaml
            - name: Run MySQL as a dedicated account
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_account: mysql
                mysql_datadir: /var/lib/mysql
              tasks:
                - name: Create the dedicated account
                  ansible.builtin.user:
                    name: "{{ mysql_account }}"
                    system: true
                    create_home: false
                    shell: /usr/sbin/nologin

                - name: Own the data directory
                  ansible.builtin.file:
                    path: "{{ mysql_datadir }}"
                    owner: "{{ mysql_account }}"
                    group: "{{ mysql_account }}"
                    recurse: true

                - name: Set the user option
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: user
                    value: "{{ mysql_account }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-local-infile-disabled
    title: Ensure local_infile is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mysql.conf.localInfile == false
    docs:
      desc: |
        This check verifies that the server does not accept `LOAD DATA LOCAL INFILE`, the form of the bulk load statement that reads a file from the connecting client rather than from the server.

        `local_infile` belongs under `[mysqld]` in the server option file. MySQL 8.0 ships with it off, so the failing case is a server where someone turned it on for a one-off import and left it that way.

        **Why this matters**

        The danger is the direction of the transfer. In the `LOCAL` form the server sends the client a request naming a path, and a compliant client library opens that path on its own filesystem and uploads the contents. No privilege on the server is involved, because the file read happens on the client.

        That yields two concrete attacks. An attacker who can inject a statement into an application's database connection, through SQL injection or a compromised query builder, makes the server ask the application host for `/etc/passwd`, for the application's own configuration file with its credentials in it, for an instance credential written to disk, or for a private key. The contents come back as rows the attacker can read. Alternatively, an attacker who stands up a malicious server and gets clients to connect to it, through a hostname they control or a redirected connection, requests files from every client that arrives, harvesting configuration from developer laptops and CI runners that connected to what they thought was a test database.

        Server-side `LOAD DATA INFILE` is the safe counterpart. It reads from the server's own filesystem and is confined by `secure_file_priv`, so confirm no bulk load job depends on the client-side form before turning the option off.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'local_infile';"
        ```

        2. Confirm the statement is refused:

        ```bash
        sudo mysql -e "LOAD DATA LOCAL INFILE '/etc/hostname' INTO TABLE mysql.help_topic;" 2>&1 | head -n 2
        ```

        A passing result reports `OFF` and the statement is rejected. A failing result reports `ON`.
      remediation:
        - id: cli
          desc: |
            To disable local file loading using the CLI:

            1. Confirm no bulk load job depends on the client-side form.
            2. Set `local_infile` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*local[-_]infile/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nlocal_infile = OFF\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'local_infile';"
            ```
        - id: script
          desc: |
            To disable local file loading using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*local[-_]infile" "$MYCNF"; then
              sed -i "s|^\s*local[-_]infile.*|local_infile = OFF|" "$MYCNF"
            else
              printf "local_infile = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'local_infile';"
            ```
        - id: ansible
          desc: |
            To disable local file loading using Ansible:

            1. Set `local_infile` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Disable MySQL client-side file loading
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set local_infile
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: local_infile
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-secure-file-priv-restricted
    title: Ensure secure_file_priv confines server-side file access
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mysql.conf.secureFilePriv != empty
    docs:
      desc: |
        This check verifies that the server's file-reading and file-writing statements are confined, by requiring `secure_file_priv` to hold a value instead of being empty.

        The option belongs under `[mysqld]` in the server option file. A directory path confines both `LOAD DATA INFILE` and `SELECT ... INTO OUTFILE` to that directory. The literal `NULL` disables both statements outright and is the stronger choice where no bulk file exchange is needed. Either satisfies this check; only an empty value fails, because an empty value removes the restriction entirely.

        **Why this matters**

        Unrestricted, those two statements amount to an arbitrary file read and an arbitrary file write anywhere the server account can reach, available to any account holding the `FILE` privilege.

        The read side turns a database credential into a filesystem credential. An attacker selects the server's own option files to learn where the TLS private key and the keyring data live, reads those, and then reads whatever else on the host the server account can open. In a query log none of it looks like anything but an ordinary bulk load.

        The write side is worse, because it is persistence. A file written into a web root the same host serves is a web shell. A file written into `/etc/cron.d` runs on a schedule as its owner. A line appended to an authorized keys file is a login. Each is one statement, and each converts read access to a database into code execution on the machine.

        Point the option at a directory owned by the server account and used for nothing else, or set `NULL` and remove the statements from play. Review which accounts hold the privilege the option constrains while you are there.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'secure_file_priv';"
        ```

        2. Identify accounts holding the privilege the option constrains:

        ```bash
        sudo mysql -e "SELECT user, host FROM mysql.user WHERE File_priv = 'Y';"
        ```

        A passing result reports a directory path or `NULL`. A failing result reports an empty value, meaning file statements are unrestricted.
      remediation:
        - id: cli
          desc: |
            To confine server-side file access using the CLI:

            1. Create a directory owned by the server account for file exchange, or choose `NULL` to disable the statements.
            2. Set `secure_file_priv` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo install -d -o mysql -g mysql -m 0750 /var/lib/mysql-files
            sudo sed -i -E "/^\s*#?\s*secure[-_]file[-_]priv/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nsecure_file_priv = /var/lib/mysql-files\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'secure_file_priv';"
            ```
        - id: script
          desc: |
            To confine server-side file access using a bash script:

            1. Create the exchange directory with restrictive ownership.
            2. Set the option, replacing any existing value.
            3. Restart MySQL and fail if the value is still empty.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            FILE_DIR="/var/lib/mysql-files"

            install -d -o mysql -g mysql -m 0750 "$FILE_DIR"

            if grep -qE "^\s*secure[-_]file[-_]priv" "$MYCNF"; then
              sed -i "s|^\s*secure[-_]file[-_]priv.*|secure_file_priv = ${FILE_DIR}|" "$MYCNF"
            else
              printf "secure_file_priv = %s\n" "$FILE_DIR" >>"$MYCNF"
            fi

            systemctl restart mysql

            value=$(mysql -N -B -e "SELECT @@secure_file_priv;")
            if [ -z "$value" ]; then
              echo "secure_file_priv is still unrestricted" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To confine server-side file access using Ansible:

            1. Create the exchange directory owned by the server account.
            2. Set `secure_file_priv` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Confine MySQL server-side file access
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_file_dir: /var/lib/mysql-files
              tasks:
                - name: Create the file exchange directory
                  ansible.builtin.file:
                    path: "{{ mysql_file_dir }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"

                - name: Set secure_file_priv
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: secure_file_priv
                    value: "{{ mysql_file_dir }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-symbolic-links-disabled
    title: Ensure symbolic_links is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mysql.conf.symbolicLinks == false
    docs:
      desc: |
        This check verifies that the data directory is a real boundary, by confirming the server will not follow a symbolic link out of it when opening a table file.

        `symbolic_links` belongs under `[mysqld]` in the server option file and has to be off. With the feature enabled, a `.frm` or data file may be a symbolic link pointing anywhere the server account can write, and the server follows it without comment.

        **Why this matters**

        The rest of the file protections in this policy assume the server reads and writes inside its data directory. A symbolic link breaks that assumption invisibly, because the catalog still records an ordinary local path while the bytes land somewhere else entirely.

        There are two routes in. An account that can issue `CREATE TABLE` with a `DATA DIRECTORY` clause chooses where the table's storage lives, and every insert afterward writes there as the server account. An attacker who has any file write inside the data directory, from a bulk export or a compromised backup process, replaces a table file with a link and lets the server do the writing through it on the next flush.

        Either way, content the attacker controls is written to a path they chose, by a process the host trusts. That is the same escalation the file privilege checks here are trying to prevent, arriving through the storage layer instead of through a statement.

        Look for existing links inside the data directory before changing this. A table that currently depends on one becomes unreadable when the option is turned off, and a link nobody put there deliberately is worth investigating before it is broken.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'have_symlink';"
        ```

        2. Look for existing links inside the data directory:

        ```bash
        sudo find "$(sudo mysql -N -B -e 'SELECT @@datadir;')" -type l -ls
        ```

        A passing result reports `DISABLED` and finds no links. A failing result reports `YES`, and any link found should be investigated before the option is changed.
      remediation:
        - id: cli
          desc: |
            To disable symbolic link support using the CLI:

            1. Confirm no table currently relies on a link, because those tables become unreadable.
            2. Set `symbolic_links` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo find "$(sudo mysql -N -B -e 'SELECT @@datadir;')" -type l -ls
            sudo sed -i -E "/^\s*#?\s*symbolic[-_]links/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nsymbolic_links = OFF\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'have_symlink';"
            ```
        - id: script
          desc: |
            To disable symbolic link support using a bash script:

            1. Refuse to proceed while links exist in the data directory.
            2. Set the option, replacing any existing value.
            3. Restart MySQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            datadir=$(mysql -N -B -e "SELECT @@datadir;")
            links=$(find "$datadir" -type l -print)

            if [ -n "$links" ]; then
              echo "symbolic links present in the data directory; relocate these tables first:" >&2
              printf '%s\n' "$links" >&2
              exit 1
            fi

            if grep -qE "^\s*symbolic[-_]links" "$MYCNF"; then
              sed -i "s|^\s*symbolic[-_]links.*|symbolic_links = OFF|" "$MYCNF"
            else
              printf "symbolic_links = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            ```
        - id: ansible
          desc: |
            To disable symbolic link support using Ansible:

            1. Set `symbolic_links` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Disable MySQL symbolic link support
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set symbolic_links
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: symbolic_links
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-allow-suspicious-udfs-disabled
    title: Ensure allow_suspicious_udfs is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mysql.conf.allowSuspiciousUdfs == false
    docs:
      desc: |
        This check verifies that the server refuses to load a shared library as a user-defined function unless the library is shaped like a real one.

        `allow_suspicious_udfs` belongs under `[mysqld]` in the server option file, and the check searches the whole include chain for it. With it off, a function library must export the auxiliary initialization and deinitialization symbols alongside the main function symbol. With it on, a library exporting only the main symbol is accepted.

        **Why this matters**

        A library exporting only that symbol is almost never something written as a user-defined function. It is the shape of an arbitrary shared object being pointed at the server so its code runs inside the server process, which is a long-established route from database access to host code execution.

        The technique goes like this. An attacker who has reached a sufficiently privileged account gets a shared object into the plugin directory, often by writing it there with the file statements this policy also restricts, registers it as a function with `CREATE FUNCTION` or by using `INSERT` on `mysql.func` directly, and calls it. The code then runs in the server process with the server account's full reach: the data directory, the keyring material, the TLS private key, and the network. From that point the database is incidental.

        Refusing malformed libraries does not stop someone who compiles a properly formed one, but it removes the off-the-shelf version, which is the version that arrives inside an automated post-exploitation toolkit.

        Correctly written functions export the symbols the server asks for and are unaffected. Where the option is found enabled, review the registered functions and the contents of the plugin directory before assuming the server is clean.
      audit: |
        ### Audit via CLI

        1. Search the option files for the option:

        ```bash
        sudo grep -rniE "^\s*allow[-_]suspicious[-_]udfs" /etc/mysql/ /etc/my.cnf /etc/my.cnf.d/ 2>/dev/null
        ```

        2. Review the functions currently registered and the plugin directory they load from:

        ```bash
        sudo mysql -e "SELECT * FROM mysql.func;"
        sudo ls -l "$(sudo mysql -N -B -e 'SELECT @@plugin_dir;')"
        ```

        A passing result finds no matching line and shows only expected functions. A failing result finds the option enabled, in which case the registered functions and the plugin directory contents should be reviewed for unexpected libraries.
      remediation:
        - id: cli
          desc: |
            To reject suspicious function libraries using the CLI:

            1. Remove the option from every option file that declares it.
            2. Review the registered functions and the plugin directory for anything unexpected.
            3. Restart MySQL.

            ```bash
            sudo sed -i -E "/^\s*allow[-_]suspicious[-_]udfs/d" /etc/mysql/mysql.conf.d/mysqld.cnf
            sudo mysql -e "SELECT * FROM mysql.func;"
            sudo systemctl restart mysql
            ```
        - id: script
          desc: |
            To reject suspicious function libraries using a bash script:

            1. Remove the option from the main file and every include fragment.
            2. Report the registered functions so unexpected entries are visible.
            3. Restart MySQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            for dir in /etc/mysql /etc/my.cnf.d; do
              [ -d "$dir" ] || continue
              find "$dir" -type f -name "*.cnf" -exec \
                sed -i -E "/^[[:space:]]*allow[-_]suspicious[-_]udfs/d" {} +
            done

            if [ -f /etc/my.cnf ]; then
              sed -i -E "/^[[:space:]]*allow[-_]suspicious[-_]udfs/d" /etc/my.cnf
            fi

            echo "registered user-defined functions:"
            mysql -N -B -e "SELECT name, dl FROM mysql.func;"

            systemctl restart mysql
            ```
        - id: ansible
          desc: |
            To reject suspicious function libraries using Ansible:

            1. Remove the option from every option file.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Reject suspicious MySQL function libraries
              hosts: mysql
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Remove allow_suspicious_udfs
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*allow[-_]suspicious[-_]udfs'
                    state: absent
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-log-bin-trust-function-creators-disabled
    title: Ensure log_bin_trust_function_creators is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mysql.conf.logBinTrustFunctionCreators == false
    docs:
      desc: |
        This check verifies that the extra privilege requirement on stored function creation is still in place while binary logging is active.

        `log_bin_trust_function_creators` belongs under `[mysqld]` in the server option file and has to be off. Off, creating a stored function requires the `SUPER` privilege in addition to `CREATE ROUTINE`. On, that additional requirement disappears and `CREATE ROUTINE` alone is enough.

        **Why this matters**

        A stored function is server-side code that lives in the schema and runs under a definer's rights whenever anything calls it. That makes routine creation a persistence mechanism, and the privilege it demands decides how many accounts hold one.

        An attacker who has compromised an ordinary application account, which typically holds routine privileges on its own schema so that migrations work, installs a function and then arranges for something to invoke it: a trigger, a view, a scheduled event, or the application's own next query. The function reads what that account can read and writes what it can write, and it outlives a password rotation on the account that created it, because the code is now part of the schema rather than part of a session. Keeping this behind `SUPER`, which is granted to few accounts and reviewed, is what keeps that path shut to application credentials.

        The requirement was introduced for replication correctness rather than for security. A nondeterministic function produces different results on a source and on its replicas under statement-based replication, so the check exists to make someone with broad privilege take responsibility for that. The security benefit is a side effect worth keeping.

        Confirm no deployment process depends on creating routines without `SUPER` before restoring it.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators';"
        ```

        2. Review the routines that exist and who defined them:

        ```bash
        sudo mysql -e "SELECT db, name, type, definer FROM mysql.proc;"
        ```

        A passing result reports `OFF`. A failing result reports `ON`, and the routine list should be reviewed for definers that are not administrative accounts.
      remediation:
        - id: cli
          desc: |
            To restore the routine creation safety check using the CLI:

            1. Confirm no deployment process depends on creating routines without `SUPER`.
            2. Set the option in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*log[-_]bin[-_]trust[-_]function[-_]creators/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nlog_bin_trust_function_creators = OFF\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators';"
            ```
        - id: script
          desc: |
            To restore the routine creation safety check using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*log[-_]bin[-_]trust[-_]function[-_]creators" "$MYCNF"; then
              sed -i "s|^\s*log[-_]bin[-_]trust[-_]function[-_]creators.*|log_bin_trust_function_creators = OFF|" "$MYCNF"
            else
              printf "log_bin_trust_function_creators = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators';"
            ```
        - id: ansible
          desc: |
            To restore the routine creation safety check using Ansible:

            1. Set `log_bin_trust_function_creators` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Restore the MySQL routine creation safety check
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set log_bin_trust_function_creators
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: log_bin_trust_function_creators
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-automatic-sp-privileges-disabled
    title: Ensure automatic_sp_privileges is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      mysql.conf.automaticSpPrivileges == false
    docs:
      desc: |
        This check verifies that every privilege on a stored routine was granted deliberately rather than appearing because somebody created the routine.

        `automatic_sp_privileges` belongs under `[mysqld]` in the server option file and has to be set to `OFF` explicitly. The server's default is on, which means that whenever an account creates a stored routine it is silently granted `EXECUTE` and `ALTER ROUTINE` on it, with no statement anywhere recording the decision.

        **Why this matters**

        The consequence is that the grant tables stop being a record of decisions. Reviewing what an account can do means reading its grants, and when some of them materialized as a side effect of a `CREATE PROCEDURE` run by a migration job months ago, a reviewer cannot separate intended access from accumulated access. The natural response to an unexpected routine privilege becomes to assume it arrived automatically and move on, which is exactly the reasoning an attacker needs nobody to question.

        It also couples two capabilities that are more useful apart. An account that can create routines automatically gains the ability to execute and to alter them, so a compromised deployment credential meant only to install code also holds the ability to run it and to rewrite it afterward. Separating creation from execution means an attacker who takes the deployment account still needs a second credential before the code they installed does anything.

        Turning the option off revokes nothing that already exists. Grant `EXECUTE` explicitly to the accounts that call existing routines before the change, then review the routine-level grants already recorded, since the ones that appeared automatically are indistinguishable from the ones someone chose.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'automatic_sp_privileges';"
        ```

        2. Review the routine-level grants that currently exist:

        ```bash
        sudo mysql -e "SELECT user, host, db, routine_name, proc_priv FROM mysql.procs_priv;"
        ```

        A passing result reports `OFF`. A failing result reports `ON`, meaning routine creators receive privileges automatically.
      remediation:
        - id: cli
          desc: |
            To require explicit routine privileges using the CLI:

            1. Grant `EXECUTE` explicitly to the accounts that need to call existing routines.
            2. Set `automatic_sp_privileges` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo mysql -e "GRANT EXECUTE ON PROCEDURE appdb.sync_orders TO 'app'@'10.0.0.%';"
            sudo sed -i -E "/^\s*#?\s*automatic[-_]sp[-_]privileges/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nautomatic_sp_privileges = OFF\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'automatic_sp_privileges';"
            ```
        - id: script
          desc: |
            To require explicit routine privileges using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the existing routine grants for review.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*automatic[-_]sp[-_]privileges" "$MYCNF"; then
              sed -i "s|^\s*automatic[-_]sp[-_]privileges.*|automatic_sp_privileges = OFF|" "$MYCNF"
            else
              printf "automatic_sp_privileges = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mysql

            echo "existing routine-level grants:"
            mysql -N -B -e "SELECT concat(user,'@',host), db, routine_name, proc_priv FROM mysql.procs_priv;"
            ```
        - id: ansible
          desc: |
            To require explicit routine privileges using Ansible:

            1. Set `automatic_sp_privileges` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Require explicit MySQL routine privileges
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set automatic_sp_privileges
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: automatic_sp_privileges
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-error-log-configured
    title: Ensure log_error names a dedicated error log destination
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mysql.conf.logError != empty
    docs:
      desc: |
        This check verifies that the server writes diagnostics to a file you can name, rather than to whatever its standard error stream happens to be attached to.

        `log_error` belongs under `[mysqld]` in the server option file and names a path in a directory the server account owns. When the option is empty, output goes to standard error, and its fate depends entirely on how the service was started: captured by the journal on one host, redirected into an unrotated file on another, and thrown away on a third.

        **Why this matters**

        The error log is where the evidence of an attack in progress accumulates. Repeated failed connection attempts from one address, clients aborting mid-handshake, authentication failures against an account that has no business authenticating from outside: on a server without a separate audit plugin, these land here and nowhere else. Responders open this file first, and finding it was never written is the point at which an investigation stops being able to establish anything about what happened or when.

        It is also where you learn whether the rest of this policy took effect. A component that failed to register, an option the server parsed and rejected, a certificate file it could not read: each of these is reported once at startup and never again. On a server that discards its startup output, a password validation component can fail to load and the configuration goes on saying the policy is enforced, with nothing anywhere contradicting it.

        Create the log directory owned by the server account before setting the path, restart, and confirm entries are actually appearing rather than assuming the destination is writable.
      audit: |
        ### Audit via CLI

        1. Read the effective destination:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'log_error';"
        ```

        2. Confirm the file exists and is being written:

        ```bash
        sudo ls -l /var/log/mysql/error.log && sudo tail -n 20 /var/log/mysql/error.log
        ```

        A passing result names a path and shows recent entries. A failing result reports an empty value, meaning diagnostics go to the standard error stream.
      remediation:
        - id: cli
          desc: |
            To configure a dedicated error log using the CLI:

            1. Create the log directory owned by the server account.
            2. Set `log_error` in the server option file.
            3. Restart MySQL and confirm the destination.

            ```bash
            sudo install -d -o mysql -g mysql -m 0750 /var/log/mysql
            sudo sed -i -E "/^\s*#?\s*log[-_]error\b/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nlog_error = /var/log/mysql/error.log\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'log_error';"
            ```
        - id: script
          desc: |
            To configure a dedicated error log using a bash script:

            1. Create the log directory with restrictive ownership.
            2. Set the option, replacing any existing value.
            3. Restart MySQL and fail if the destination is still empty.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            LOG_FILE="/var/log/mysql/error.log"

            install -d -o mysql -g mysql -m 0750 "$(dirname "$LOG_FILE")"

            if grep -qE "^\s*log[-_]error\b" "$MYCNF"; then
              sed -i "s|^\s*log[-_]error\b.*|log_error = ${LOG_FILE}|" "$MYCNF"
            else
              printf "log_error = %s\n" "$LOG_FILE" >>"$MYCNF"
            fi

            systemctl restart mysql

            value=$(mysql -N -B -e "SELECT @@log_error;")
            if [ -z "$value" ] || [ "$value" = "stderr" ]; then
              echo "error log destination is still not a file" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To configure a dedicated error log using Ansible:

            1. Create the log directory owned by the server account.
            2. Set `log_error` in the server option group.
            3. Notify a handler that restarts the server.

            ```yaml
            - name: Configure a dedicated MySQL error log
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_log_dir: /var/log/mysql
              tasks:
                - name: Create the log directory
                  ansible.builtin.file:
                    path: "{{ mysql_log_dir }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"

                - name: Set log_error
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: log_error
                    value: "{{ mysql_log_dir }}/error.log"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-log-error-verbosity-includes-warnings
    title: Ensure log_error_verbosity records warnings
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mysql.conf.logErrorVerbosity >= 2
    docs:
      desc: |
        This check verifies that the error log records warnings and not only errors, by requiring `log_error_verbosity` to be at least 2.

        The option belongs under `[mysqld]` in the server option file and takes 1 for errors alone, 2 for errors and warnings, and 3 for errors, warnings, and informational messages. The check fails 1.

        **Why this matters**

        Failed authentication does not produce an error on this server. It produces a warning about an aborted connection. That means a server at verbosity 1 can be under sustained password guessing, thousands of attempts an hour against every account name an attacker can think of, and the error log stays entirely silent. The first entry anyone sees is the successful login, which is indistinguishable from every other successful login.

        Verbosity 2 is where that signal begins. A run of aborted connections from a single address, or against a single account name, is the pattern that separates an attack from a misconfigured client, and it is only a pattern if the individual events were recorded in the first place.

        The same level surfaces options the server read and then ignored, which is the difference between a hardening change that took effect and one that was silently dropped because of a typo or a variable that does not exist in this release. Deprecation notices arrive here too, which is how you find out a setting you rely on is going away before an upgrade removes it.

        The cost is modest. Warnings add far less volume than statement logging while carrying most of the security-relevant signal, so this is the level to raise before considering anything that records queries.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'log_error_verbosity';"
        ```

        2. Confirm warnings are present in the log:

        ```bash
        sudo grep -ci "warning" /var/log/mysql/error.log
        ```

        A passing result reports 2 or 3. A failing result reports 1, meaning only errors are recorded.
      remediation:
        - id: cli
          desc: |
            To record warnings in the error log using the CLI:

            1. Set `log_error_verbosity` in the server option file.
            2. Restart MySQL.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*log[-_]error[-_]verbosity/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nlog_error_verbosity = 3\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'log_error_verbosity';"
            ```
        - id: script
          desc: |
            To record warnings in the error log using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            VERBOSITY=3

            if grep -qE "^\s*log[-_]error[-_]verbosity" "$MYCNF"; then
              sed -i "s|^\s*log[-_]error[-_]verbosity.*|log_error_verbosity = ${VERBOSITY}|" "$MYCNF"
            else
              printf "log_error_verbosity = %s\n" "$VERBOSITY" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'log_error_verbosity';"
            ```
        - id: ansible
          desc: |
            To record warnings in the error log using Ansible:

            1. Set `log_error_verbosity` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Record warnings in the MySQL error log
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_log_error_verbosity: 3
              tasks:
                - name: Set log_error_verbosity
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: log_error_verbosity
                    value: "{{ mysql_log_error_verbosity }}"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-log-output-retained
    title: Ensure log_output is not set to NONE
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mysql.conf.logOutput != empty
      mysql.conf.logOutput.none(_.downcase == "none")
    docs:
      desc: |
        This check verifies that the general and slow query logs actually write somewhere, by requiring `log_output` to name a real destination.

        The option belongs under `[mysqld]` in the server option file and accepts `FILE`, `TABLE`, or both. The check fails the value `NONE`, which discards the output of both logs while leaving the logs themselves switched on, and it fails an unset option.

        **Why this matters**

        `NONE` produces a configuration that misleads a reviewer. `slow_query_log` reads as `ON`, the control appears in every inventory of what is enabled, and not one record exists anywhere. Somebody signs off on query logging being in place, and the evidence it was supposed to produce was never written at all.

        The practical loss is the slow query log, which is the one of the two that belongs on. It is the record that shows a query returning far more rows than the application would ever ask for, a full table scan on a table that is always accessed by key, or a statement shape nothing in the codebase generates. Those are the fingerprints of bulk extraction through a legitimate credential, and they are the difference between noticing an exfiltration while it is happening and reading about it afterward.

        Set `FILE` where a log pipeline ships records off the host, or `TABLE` where they need to be queryable on the server itself.

        This option decides only where output goes, not what is recorded. What gets logged is a separate decision, and a companion check in this policy requires the general query log to stay off, because unlike the slow query log it captures credentials.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'log_output';"
        ```

        2. Confirm the slow query log is producing records:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('slow_query_log','slow_query_log_file');"
        ```

        A passing result names `FILE`, `TABLE`, or both. A failing result reports `NONE`, or is unset.
      remediation:
        - id: cli
          desc: |
            To retain query log output using the CLI:

            1. Set `log_output` in the server option file.
            2. Restart MySQL.
            3. Confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*log[-_]output/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nlog_output = FILE\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'log_output';"
            ```
        - id: script
          desc: |
            To retain query log output using a bash script:

            1. Set the option, replacing any existing value.
            2. Restart MySQL and fail if the value is still `NONE`.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            if grep -qE "^\s*log[-_]output" "$MYCNF"; then
              sed -i "s|^\s*log[-_]output.*|log_output = FILE|" "$MYCNF"
            else
              printf "log_output = FILE\n" >>"$MYCNF"
            fi

            systemctl restart mysql

            value=$(mysql -N -B -e "SELECT @@log_output;")
            if [ "$value" = "NONE" ]; then
              echo "log output is still discarded" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To retain query log output using Ansible:

            1. Set `log_output` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Retain MySQL query log output
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set log_output
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: log_output
                    value: FILE
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-general-log-disabled
    title: Ensure the general query log is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.generalLog == false
    docs:
      desc: |
        This check verifies that the general query log is off, which is the opposite of what the other logging checks in this policy ask for, and for a specific reason.

        `general_log` belongs under `[mysqld]` in the server option file. When on, the server writes every statement it receives to the log verbatim and in cleartext, including the statements that set passwords.

        **Why this matters**

        A `CREATE USER` or an `ALTER USER ... IDENTIFIED BY` statement lands in the file with the password spelled out in full. An enabled general query log is therefore a credential store, holding every database password created or changed while it was running, in plain text, in a file carrying ordinary log permissions.

        Everyone who can read logs then holds those credentials, and that is a far wider group than the people who hold database administration rights. It includes the agent shipping logs off the host, the aggregation service and everyone with a search box on it, the backup that swept up `/var/log`, and the engineer granted read access to diagnose something unrelated last quarter. An attacker with a foothold anywhere along that chain, or who exfiltrates the file outright, walks away with working passwords rather than hashes, so nothing needs cracking and nothing rate-limits them.

        There is a real performance cost as well, since every statement is written before it runs, but the credential exposure is why this check exists.

        Use the audit log where a durable activity record is needed, because it redacts the arguments of password-setting statements. When the option is found on, treat the existing file as an exposure: rotate it, remove it securely, and rotate every credential that was set while it was running.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('general_log','general_log_file');"
        ```

        2. When the log is enabled, check whether it already contains credentials:

        ```bash
        sudo grep -ciE "identified by|set password" "$(sudo mysql -N -B -e 'SELECT @@general_log_file;')"
        ```

        A passing result reports `OFF`. A failing result reports `ON`, and any existing log file should be treated as a credential exposure and rotated.
      remediation:
        - id: cli
          desc: |
            To disable the general query log using the CLI:

            1. Set `general_log` in the server option file.
            2. Restart MySQL.
            3. Remove or rotate any existing general log, because it may contain passwords.

            ```bash
            sudo sed -i -E "/^\s*#?\s*general[-_]log\b/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\ngeneral_log = OFF\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo shred -u /var/log/mysql/general.log
            ```
        - id: script
          desc: |
            To disable the general query log using a bash script:

            1. Capture the current log path before changing the option.
            2. Set the option and restart MySQL.
            3. Securely remove the previous log, since it may hold cleartext passwords.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            log_path=$(mysql -N -B -e "SELECT @@general_log_file;" 2>/dev/null || true)

            if grep -qE "^\s*general[-_]log\b" "$MYCNF"; then
              sed -i "s|^\s*general[-_]log\b.*|general_log = OFF|" "$MYCNF"
            else
              printf "general_log = OFF\n" >>"$MYCNF"
            fi

            systemctl restart mysql

            if [ -n "$log_path" ] && [ -f "$log_path" ]; then
              echo "removing previous general log, which may contain cleartext passwords: $log_path"
              shred -u "$log_path"
            fi
            ```
        - id: ansible
          desc: |
            To disable the general query log using Ansible:

            1. Set `general_log` in the server option group.
            2. Notify a handler that restarts the server.
            3. Remove any existing general log file.

            ```yaml
            - name: Disable the MySQL general query log
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_general_log_file: /var/log/mysql/general.log
              tasks:
                - name: Set general_log
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: general_log
                    value: "OFF"
                    mode: "0640"
                  notify: Restart mysql

                - name: Remove the previous general log
                  ansible.builtin.file:
                    path: "{{ mysql_general_log_file }}"
                    state: absent
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-audit-log-enabled
    title: Ensure audit_log_policy records server activity
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      mysql.conf.auditLogPolicy != empty && mysql.conf.auditLogPolicy.downcase != "none"
    docs:
      desc: |
        This check verifies that the audit log is recording a class of activity rather than sitting loaded and idle.

        `audit_log_policy` belongs under `[mysqld]` in the server option file and takes `ALL`, `LOGINS`, or `QUERIES`. The check fails `NONE`, which records nothing, and fails an empty value. The audit log plugin itself is available in MySQL Enterprise and as an equivalent plugin in Percona Server, and it has to be loaded from the option file for the policy setting to mean anything.

        **Why this matters**

        Auditing is the mechanism that answers the questions incident response actually asks: which accounts connected, from where, when, and what they ran. Without it, a compromised credential leaves a server that can tell you its current state and nothing about how it got there. The scope of a breach notification then rests on assumption rather than on evidence, which usually means assuming the worst.

        `LOGINS` captures connection activity, so a run of failed attempts and the moment a stolen credential was first used are both visible and attributable to an address. `QUERIES` captures statements, so what an attacker did once inside is on record: which tables were read, whether an account was created, whether a grant was altered. `ALL` captures both, which is what most servers holding regulated data want.

        The reason to use this rather than the general query log is redaction. The audit log records that a password-setting statement ran without writing the password into the file, so it can be retained and shipped to a pipeline. The general query log cannot, and a companion check in this policy requires it to stay off for exactly that reason.

        Set the policy, the destination, and the format together, and confirm records appear.
      audit: |
        ### Audit via CLI

        1. Confirm the plugin is loaded:

        ```bash
        sudo mysql -e "SELECT plugin_name, plugin_status FROM information_schema.plugins WHERE plugin_name LIKE 'audit%';"
        ```

        2. Read the policy, destination, and format:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('audit_log_policy','audit_log_file','audit_log_format');"
        ```

        3. Confirm records are being written:

        ```bash
        sudo tail -n 5 /var/log/mysql/audit.log
        ```

        A passing result reports `ALL`, `LOGINS`, or `QUERIES`. A failing result reports `NONE` or an empty value, meaning nothing is recorded.
      remediation:
        - id: cli
          desc: |
            To record server activity in the audit log using the CLI:

            1. Load the audit log plugin, which is available in MySQL Enterprise and as an equivalent plugin in Percona Server.
            2. Set the policy, destination, and format in the server option file.
            3. Restart MySQL and confirm records are written.

            ```bash
            sudo mysql -e "INSTALL PLUGIN audit_log SONAME 'audit_log.so';"
            sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null <<'EOF'
            [mysqld]
            plugin_load_add  = audit_log.so
            audit_log_policy = ALL
            audit_log_file   = /var/log/mysql/audit.log
            audit_log_format = JSON
            EOF
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'audit_log_policy';"
            ```
        - id: script
          desc: |
            To record server activity in the audit log using a bash script:

            1. Refuse to proceed when no audit plugin is available, rather than writing options the server will ignore.
            2. Set the policy, destination, and format.
            3. Restart MySQL and confirm the policy took effect.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"
            PLUGIN_DIR=$(mysql -N -B -e "SELECT @@plugin_dir;")

            if [ ! -f "${PLUGIN_DIR}/audit_log.so" ]; then
              echo "audit_log.so not present in ${PLUGIN_DIR}; install an audit plugin first" >&2
              exit 1
            fi

            set_option() {
              local key="$1" value="$2"
              if grep -qE "^\s*${key}\b" "$MYCNF"; then
                sed -i "s|^\s*${key}\b.*|${key} = ${value}|" "$MYCNF"
              else
                printf "%s = %s\n" "$key" "$value" >>"$MYCNF"
              fi
            }

            install -d -o mysql -g mysql -m 0750 /var/log/mysql

            set_option plugin_load_add "audit_log.so"
            set_option audit_log_policy "ALL"
            set_option audit_log_file "/var/log/mysql/audit.log"
            set_option audit_log_format "JSON"

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'audit_log_policy';"
            ```
        - id: ansible
          desc: |
            To record server activity in the audit log using Ansible:

            1. Set the plugin load option along with the policy, destination, and format.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Record MySQL server activity in the audit log
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
                mysql_audit_log_file: /var/log/mysql/audit.log
              tasks:
                - name: Create the log directory
                  ansible.builtin.file:
                    path: "{{ mysql_audit_log_file | dirname }}"
                    state: directory
                    owner: mysql
                    group: mysql
                    mode: "0750"

                - name: Configure the audit log
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: "{{ item.option }}"
                    value: "{{ item.value }}"
                    mode: "0640"
                  loop:
                    - { option: "plugin_load_add", value: "audit_log.so" }
                    - { option: "audit_log_policy", value: "ALL" }
                    - { option: "audit_log_file", value: "{{ mysql_audit_log_file }}" }
                    - { option: "audit_log_format", value: "JSON" }
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-default-table-encryption-enabled
    title: Ensure default_table_encryption is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mysql.conf.defaultTableEncryption == true
    docs:
      desc: |
        This check verifies that new schemas and general tablespaces are encrypted at rest unless a statement explicitly asks otherwise.

        `default_table_encryption` belongs under `[mysqld]` in the server option file and defaults to off. While it is off, encryption depends on every `CREATE TABLE` remembering to request it, which means it depends on every migration script, every ORM, and every developer who has never read this policy.

        **Why this matters**

        Encryption at rest is what stands between the files and someone who has them but not a running server. A decommissioned disk that left the building unwiped, a snapshot copied into a bucket that turns out to be readable, a backup archive on a share with inherited permissions, a laptop with a restored dump on it: in every one of those the attacker holds the data directory and no credential at all. Encrypted tablespaces are inert without the keyring; unencrypted ones open in any tool that understands the file format.

        It also contains an attacker who has reached the host but not a privileged database account. Reading table files straight out of the data directory bypasses every grant the server would otherwise have enforced, and encryption is what makes that read produce nothing usable.

        Turning the default on inverts where the burden falls. A table created by a script that knows nothing about the policy is still encrypted, and an unencrypted table now requires an explicit clause that shows up in code review as a deliberate exception rather than an oversight nobody sees.

        Encryption needs a keyring component configured, since table creation fails without one, and existing tablespaces are not converted by the change. Identify them and convert them afterward.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'default_table_encryption';"
        ```

        2. Identify tablespaces that are not encrypted:

        ```bash
        sudo mysql -e "SELECT space, name, encryption FROM information_schema.innodb_tablespaces WHERE encryption <> 'Y';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, and the second query lists tablespaces that need converting.
      remediation:
        - id: cli
          desc: |
            To encrypt new tables by default using the CLI:

            1. Confirm a keyring component is configured, because encryption cannot work without one.
            2. Set `default_table_encryption` in the server option file.
            3. Restart MySQL, then convert existing tablespaces.

            ```bash
            sudo mysql -e "SELECT * FROM performance_schema.keyring_component_status;"
            sudo sed -i -E "/^\s*#?\s*default[-_]table[-_]encryption/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\ndefault_table_encryption = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "ALTER TABLESPACE innodb_system ENCRYPTION = 'Y';"
            ```
        - id: script
          desc: |
            To encrypt new tables by default using a bash script:

            1. Refuse to proceed when no keyring is active, because encryption would fail at table creation.
            2. Set the option, replacing any existing value.
            3. Restart MySQL and report tablespaces that remain unencrypted.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            keyring=$(mysql -N -B -e \
              "SELECT count(*) FROM performance_schema.keyring_component_status;" 2>/dev/null || echo 0)

            if [ "$keyring" -eq 0 ]; then
              echo "no keyring component is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*default[-_]table[-_]encryption" "$MYCNF"; then
              sed -i "s|^\s*default[-_]table[-_]encryption.*|default_table_encryption = ON|" "$MYCNF"
            else
              printf "default_table_encryption = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql

            echo "tablespaces still unencrypted:"
            mysql -N -B -e \
              "SELECT name FROM information_schema.innodb_tablespaces WHERE encryption <> 'Y';"
            ```
        - id: ansible
          desc: |
            To encrypt new tables by default using Ansible:

            1. Set `default_table_encryption` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt new MySQL tables by default
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set default_table_encryption
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: default_table_encryption
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-binlog-encryption-enabled
    title: Ensure binlog_encryption is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mysql.conf.binlogEncryption == true
    docs:
      desc: |
        This check verifies that binary and relay log files are encrypted at rest.

        `binlog_encryption` belongs under `[mysqld]` in the server option file and depends on the same keyring component the other encryption options here use. It applies to newly written files, so the logs have to be rotated after the restart before the current files are replaced with encrypted ones.

        **Why this matters**

        The binary log records the row images of every change the server makes. That is not metadata about the data, it is the data, written a second time into a different file. A server with encrypted tables and a cleartext binary log has published its entire change history in the open, and an attacker who reads it reconstructs the rows without decrypting anything.

        Binary logs also travel much further than tables do. Every replica pulls them, so the content lands on every replica host and in the relay logs there. Backup jobs capture them, often into a different retention tier with different access controls and a longer life. Change-data-capture pipelines read them, and those frequently run on hosts the database team does not administer. Each copy is another place where read access to a file is enough.

        They also persist longer than people expect. An expiry tuned for disk space rather than for retention leaves months of changes on disk, so the exposure covers not only what the tables hold now but every value they have held since the oldest surviving file.

        Confirm the keyring is active, set the option, restart, and rotate the logs so the current files are rewritten encrypted rather than left as they are.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES WHERE Variable_name IN ('binlog_encryption','log_bin');"
        ```

        2. Confirm the current log files are encrypted:

        ```bash
        sudo mysql -e "SHOW BINARY LOGS;"
        sudo mysql -e "SELECT * FROM performance_schema.log_status\G"
        ```

        A passing result reports `ON`. A failing result reports `OFF` while binary logging is active, meaning the log files are readable.
      remediation:
        - id: cli
          desc: |
            To encrypt binary logs using the CLI:

            1. Confirm a keyring component is active.
            2. Set `binlog_encryption` in the server option file.
            3. Restart MySQL, then rotate the logs so new files are encrypted.

            ```bash
            sudo sed -i -E "/^\s*#?\s*binlog[-_]encryption/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\nbinlog_encryption = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "FLUSH BINARY LOGS;"
            sudo mysql -e "SHOW VARIABLES LIKE 'binlog_encryption';"
            ```
        - id: script
          desc: |
            To encrypt binary logs using a bash script:

            1. Refuse to proceed when no keyring is active.
            2. Set the option, replacing any existing value.
            3. Restart MySQL and rotate the logs so new files are written encrypted.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            keyring=$(mysql -N -B -e \
              "SELECT count(*) FROM performance_schema.keyring_component_status;" 2>/dev/null || echo 0)

            if [ "$keyring" -eq 0 ]; then
              echo "no keyring component is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*binlog[-_]encryption" "$MYCNF"; then
              sed -i "s|^\s*binlog[-_]encryption.*|binlog_encryption = ON|" "$MYCNF"
            else
              printf "binlog_encryption = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "FLUSH BINARY LOGS;"
            ```
        - id: ansible
          desc: |
            To encrypt binary logs using Ansible:

            1. Set `binlog_encryption` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt MySQL binary logs
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set binlog_encryption
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: binlog_encryption
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-innodb-redo-log-encryption-enabled
    title: Ensure innodb_redo_log_encrypt is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      mysql.conf.innodbRedoLogEncrypt == true
    docs:
      desc: |
        This check verifies that the InnoDB redo log is encrypted at rest, closing the copy of recent data that table encryption alone leaves readable.

        `innodb_redo_log_encrypt` belongs under `[mysqld]` in the server option file and needs the same keyring component that table encryption needs.

        **Why this matters**

        The redo log holds the contents of recently modified pages so the server can recover after a crash, and those page contents are table data. Encrypting the tables while leaving the redo log in cleartext therefore leaves the most recent writes to those tables sitting readable in a second file, inside the same data directory, written continuously as the server runs.

        For an attacker that is often the better target. The tables are the whole dataset and take work to sift; the redo log is what changed recently, which is where the new orders, the new accounts, and the freshly rotated credentials are. Anyone who can read the data directory, whether through a foothold on the host, a copied snapshot, or a backup that captured the whole directory, recovers those changes without holding a database credential and without touching the encrypted tablespaces at all.

        The gap is invisible from inside the database. Every table reports as encrypted, the check that covers table encryption passes, and the file next to them is plaintext.

        Confirm the keyring is active before enabling this and restart. Data already written to the redo log is not retroactively protected, so treat existing log content as exposed if the data directory has ever been reachable by anyone outside the server account.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'innodb_redo_log_encrypt';"
        ```

        2. Confirm the keyring backing the encryption is active:

        ```bash
        sudo mysql -e "SELECT * FROM performance_schema.keyring_component_status;"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning recent changes to encrypted tables remain readable in the redo log.
      remediation:
        - id: cli
          desc: |
            To encrypt the InnoDB redo log using the CLI:

            1. Confirm a keyring component is active.
            2. Set `innodb_redo_log_encrypt` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*innodb[-_]redo[-_]log[-_]encrypt/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\ninnodb_redo_log_encrypt = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'innodb_redo_log_encrypt';"
            ```
        - id: script
          desc: |
            To encrypt the InnoDB redo log using a bash script:

            1. Refuse to proceed when no keyring is active.
            2. Set the option, replacing any existing value.
            3. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            keyring=$(mysql -N -B -e \
              "SELECT count(*) FROM performance_schema.keyring_component_status;" 2>/dev/null || echo 0)

            if [ "$keyring" -eq 0 ]; then
              echo "no keyring component is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*innodb[-_]redo[-_]log[-_]encrypt" "$MYCNF"; then
              sed -i "s|^\s*innodb[-_]redo[-_]log[-_]encrypt.*|innodb_redo_log_encrypt = ON|" "$MYCNF"
            else
              printf "innodb_redo_log_encrypt = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'innodb_redo_log_encrypt';"
            ```
        - id: ansible
          desc: |
            To encrypt the InnoDB redo log using Ansible:

            1. Set `innodb_redo_log_encrypt` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt the InnoDB redo log
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set innodb_redo_log_encrypt
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: innodb_redo_log_encrypt
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-innodb-undo-log-encryption-enabled
    title: Ensure innodb_undo_log_encrypt is enabled
    impact: 70
    tags:
