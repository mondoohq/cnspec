    docs:
      desc: |
        This check verifies that InnoDB undo logs are encrypted at rest.

        `innodb_undo_log_encrypt` belongs under `[mysqld]` in the server option file and depends on the same keyring component as the rest of the encryption options here.

        **Why this matters**

        Undo logs retain the previous version of every modified row, so that a transaction can be rolled back and so that other sessions can be served a consistent read of the data as it was when their statement began. Those previous versions are table data. An unencrypted undo log therefore holds readable copies of rows from encrypted tables, which is precisely the disclosure table encryption was configured to prevent.

        The retention is what makes it worse than it sounds. A row version stays in the undo log for as long as any transaction might still need it, so one long-running reporting query or one session that opened a transaction and never committed pins historical values on disk for hours. What an attacker recovers there is not only the current state but the values before an update, which is the part that is often the most sensitive: the balance before the correction, the address before it was redacted, the password hash before it was rotated.

        Reading it needs no database credential. Anyone with access to the data directory, through a host foothold, a snapshot, or a backup, reads the undo tablespaces directly.

        Confirm the keyring is active, set the option, and restart. Review the undo tablespaces and their encryption state afterward, since the setting governs what is written from that point on.
      audit: |
        ### Audit via CLI

        1. Read the effective value:

        ```bash
        sudo mysql -e "SHOW VARIABLES LIKE 'innodb_undo_log_encrypt';"
        ```

        2. Review the undo tablespaces and their encryption state:

        ```bash
        sudo mysql -e "SELECT space, name, encryption FROM information_schema.innodb_tablespaces WHERE name LIKE '%undo%';"
        ```

        A passing result reports `ON`. A failing result reports `OFF`, meaning previous row versions remain readable on disk.
      remediation:
        - id: cli
          desc: |
            To encrypt InnoDB undo logs using the CLI:

            1. Confirm a keyring component is active.
            2. Set `innodb_undo_log_encrypt` in the server option file.
            3. Restart MySQL and confirm the effective value.

            ```bash
            sudo sed -i -E "/^\s*#?\s*innodb[-_]undo[-_]log[-_]encrypt/d" \
              /etc/mysql/mysql.conf.d/mysqld.cnf
            printf '[mysqld]\ninnodb_undo_log_encrypt = ON\n' | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf >/dev/null
            sudo systemctl restart mysql
            sudo mysql -e "SHOW VARIABLES LIKE 'innodb_undo_log_encrypt';"
            ```
        - id: script
          desc: |
            To encrypt InnoDB undo logs using a bash script:

            1. Refuse to proceed when no keyring is active.
            2. Set the option, replacing any existing value.
            3. Restart MySQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            MYCNF="/etc/mysql/mysql.conf.d/mysqld.cnf"

            keyring=$(mysql -N -B -e \
              "SELECT count(*) FROM performance_schema.keyring_component_status;" 2>/dev/null || echo 0)

            if [ "$keyring" -eq 0 ]; then
              echo "no keyring component is active; configure one before enabling encryption" >&2
              exit 1
            fi

            if grep -qE "^\s*innodb[-_]undo[-_]log[-_]encrypt" "$MYCNF"; then
              sed -i "s|^\s*innodb[-_]undo[-_]log[-_]encrypt.*|innodb_undo_log_encrypt = ON|" "$MYCNF"
            else
              printf "innodb_undo_log_encrypt = ON\n" >>"$MYCNF"
            fi

            systemctl restart mysql
            mysql -e "SHOW VARIABLES LIKE 'innodb_undo_log_encrypt';"
            ```
        - id: ansible
          desc: |
            To encrypt InnoDB undo logs using Ansible:

            1. Set `innodb_undo_log_encrypt` in the server option group.
            2. Notify a handler that restarts the server.

            ```yaml
            - name: Encrypt InnoDB undo logs
              hosts: mysql
              become: true
              vars:
                mysql_conf: /etc/mysql/mysql.conf.d/mysqld.cnf
              tasks:
                - name: Set innodb_undo_log_encrypt
                  community.general.ini_file:
                    path: "{{ mysql_conf }}"
                    section: mysqld
                    option: innodb_undo_log_encrypt
                    value: "ON"
                    mode: "0640"
                  notify: Restart mysql
              handlers:
                - name: Restart mysql
                  ansible.builtin.service:
                    name: mysql
                    state: restarted
            ```

  - uid: mondoo-mysql-security-client-options-no-plaintext-password
    title: Ensure no plaintext password is stored in the client option groups
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.clientOptions["password"] == empty
    docs:
      desc: |
        This check verifies that no database password is written into the client option groups of a shared option file.

        The `password` option is what the check looks for, in the groups the MySQL client programs read: `[client]`, `[client-server]`, and `[mysql]`. A password in any of them is available to every client program that reads the file and to every account on the host that can open it.

        **Why this matters**

        A credential in a system-wide option file does not stay in that file. Configuration management checks it into a repository, where everyone with read access has it and where it stays in the history long after it is removed from the working tree. Backups copy it. Container images bake it into a layer that is pushed to a registry. Host snapshots taken for troubleshooting carry it wherever they are restored. Each copy is a working password rather than a hash, usable directly against the database with nothing to crack.

        Locally the exposure is immediate. Any account on the host that can read the file authenticates as whatever that credential names, which on a shared host is a far larger set of principals than the database team ever intended, and none of them appear anywhere in the database's own access controls as having been granted anything.

        Keep the credential out of the shared file instead. A login path created with `mysql_config_editor` stores it in a per-user file that is scoped to one account, and a companion check in this policy covers the permissions on those files. Supplying it from a secret store at run time keeps it off disk entirely.

        When one is found, remove it and rotate it. A password in a shared file has to be treated as already compromised, because the copies cannot be enumerated.
      audit: |
        ### Audit via CLI

        1. Search the option files for a password option:

        ```bash
        sudo grep -rniE "^\s*password\s*=" /etc/mysql/ /etc/my.cnf /etc/my.cnf.d/ 2>/dev/null
        ```

        2. Check the permissions on any file that declares one:

        ```bash
        sudo ls -l /etc/mysql/my.cnf
        ```

        3. List the login paths already configured for the current account:

        ```bash
        mysql_config_editor print --all
        ```

        A passing result finds no password option in the client groups. A failing result shows a `password` line, and that credential should be treated as exposed and rotated.
      remediation:
        - id: cli
          desc: |
            To remove plaintext client passwords using the CLI:

            1. Create a login path so the credential is stored in a per-user obfuscated file.
            2. Remove the password option from the shared option file.
            3. Rotate the exposed password, because it must be assumed compromised.

            ```bash
            mysql_config_editor set --login-path=local --host=localhost --user=app --password
            sudo sed -i -E "/^\s*password\s*=/d" /etc/mysql/my.cnf
            sudo mysql -e "ALTER USER 'app'@'localhost' IDENTIFIED BY 'new-password';"
            sudo grep -rniE "^\s*password\s*=" /etc/mysql/ || echo "no plaintext passwords remain"
            ```
        - id: script
          desc: |
            To remove plaintext client passwords using a bash script:

            1. Report every file and line that declares a password before changing anything.
            2. Remove the option from each file, keeping a backup.
            3. Remind the operator to rotate the exposed credentials.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            found=0

            for dir in /etc/mysql /etc/my.cnf.d; do
              [ -d "$dir" ] || continue
              while IFS= read -r file; do
                if grep -qE "^[[:space:]]*password[[:space:]]*=" "$file"; then
                  echo "removing plaintext password from $file"
                  grep -nE "^[[:space:]]*password[[:space:]]*=" "$file"
                  cp -a "$file" "${file}.bak"
                  sed -i -E "/^[[:space:]]*password[[:space:]]*=/d" "$file"
                  found=1
                fi
              done < <(find "$dir" -type f -name "*.cnf")
            done

            if [ "$found" -eq 1 ]; then
              echo "rotate every password that was stored in these files; treat them as compromised" >&2
            fi
            ```
        - id: ansible
          desc: |
            To remove plaintext client passwords using Ansible:

            1. Find the option files.
            2. Remove any password option they declare.
            3. Report that the credentials need rotating.

            ```yaml
            - name: Remove plaintext MySQL client passwords
              hosts: mysql
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Remove password options
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^\s*password\s*='
                    state: absent
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
                  register: removed

                - name: Report credentials that must be rotated
                  ansible.builtin.debug:
                    msg: "A stored password was removed. Rotate the affected accounts."
                  when: removed is changed
            ```

  - uid: mondoo-mysql-security-option-files-restricted-permissions
    title: Ensure option files are not group or world accessible
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      mysql.conf.files != empty
      mysql.conf.files.all(permissions.group_writeable == false && permissions.other_readable == false && permissions.other_writeable == false)
    docs:
      desc: |
        This check verifies that every file the server reads configuration from is protected, not only the one at the top of the chain.

        The server follows a chain of option files, resolving each include directive, and this check requires that none of them is group writable or accessible to other accounts. That is the mode `-rw-------` or `-rw-r-----`, owned by an account the server can read as. MySQL does not refuse to start when an option file is world readable, so a permissive mode produces no warning anywhere and nothing surfaces it.

        **Why this matters**

        Read access to these files is a map of the server. They name the data directory, the paths to the TLS certificate and private key, the keyring data location, the plugin directory, and the log destinations. An attacker with a foothold as any unprivileged account on the host reads them first, and everything they do afterward is aimed rather than exploratory.

        Write access is worse, because it is control of the server on its next restart. An account that can modify any fragment in the chain adds `skip_grant_tables` and waits for a reboot, at which point the server starts with no privilege system at all. It could as easily repoint the keyring, disable the audit log, or widen the bind address, and each of those survives as long as nobody re-reads the file.

        The fragments are where this usually goes wrong. Configuration management tooling writes drop-in files under `mysql.conf.d` or `my.cnf.d` with whatever permissions were in effect at the time, so one world readable drop-in undoes a correctly restricted main file. Apply ownership and mode across the whole directory rather than to the entry point alone.
      audit: |
        ### Audit via CLI

        1. List the option files the server actually read, in order:

        ```bash
        mysqld --verbose --help 2>/dev/null | grep -A1 "Default options are read from"
        ```

        2. Inspect the permissions on the main file and every fragment:

        ```bash
        sudo ls -l /etc/mysql/my.cnf
        sudo ls -lR /etc/mysql/mysql.conf.d/ /etc/mysql/conf.d/ 2>/dev/null
        ```

        A passing result shows each file with no group write bit and no world access, which is `-rw-------` or `-rw-r-----`. A failing result shows a mode such as `-rw-r--r--` on the main file or any fragment.
      remediation:
        - id: cli
          desc: |
            To restrict option file permissions using the CLI:

            1. Set ownership so the server account can read the files.
            2. Remove group write and world access from every file in the chain.
            3. Confirm the resulting permissions.

            ```bash
            sudo chown -R root:mysql /etc/mysql
            sudo find /etc/mysql -type f -name "*.cnf" -exec chmod 0640 {} +
            sudo find /etc/mysql -type d -exec chmod 0750 {} +
            sudo ls -lR /etc/mysql
            ```
        - id: script
          desc: |
            To restrict option file permissions using a bash script:

            1. Apply ownership and mode across the configuration directory.
            2. Include the traditional single-file location when present.
            3. Report any file that still allows world access.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            for target in /etc/mysql /etc/my.cnf.d; do
              [ -d "$target" ] || continue
              chown -R root:mysql "$target"
              find "$target" -type f -name "*.cnf" -exec chmod 0640 {} +
              find "$target" -type d -exec chmod 0750 {} +
            done

            if [ -f /etc/my.cnf ]; then
              chown root:mysql /etc/my.cnf
              chmod 0640 /etc/my.cnf
            fi

            remaining=$(find /etc/mysql /etc/my.cnf /etc/my.cnf.d -name "*.cnf" -perm /0007 -print 2>/dev/null || true)
            if [ -n "$remaining" ]; then
              echo "files still world accessible:" >&2
              printf '%s\n' "$remaining" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To restrict option file permissions using Ansible:

            1. Find every option file in the chain.
            2. Apply ownership and mode to each of them.

            ```yaml
            - name: Restrict MySQL option file permissions
              hosts: mysql
              become: true
              tasks:
                - name: Find option files
                  ansible.builtin.find:
                    paths:
                      - /etc/mysql
                      - /etc/my.cnf.d
                    patterns: "*.cnf"
                    recurse: true
                  register: option_files
                  failed_when: false

                - name: Protect option files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    group: mysql
                    mode: "0640"
                  loop: "{{ option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
            ```

  - uid: mondoo-mysql-security-user-option-files-protected
    title: Ensure per-user option files are not readable by other accounts
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      mysql.conf.userFiles.all(file.permissions.group_readable == false && file.permissions.other_readable == false)
    docs:
      desc: |
        This check verifies that the option files sitting in users' home directories, which hold their database credentials, are readable only by the account that owns them.

        Two files matter. A `.my.cnf` holds its password as plain text. A `.mylogin.cnf` is the login path store written by `mysql_config_editor`, and it is obfuscated rather than encrypted: the format is documented and reversible, so anyone who can read the file can recover what is in it. A host with no such files passes, because there is nothing to protect.

        **Why this matters**

        These files exist so that a person or a service does not have to supply a password, which means they contain working credentials that authenticate directly to the database. The file mode is the only thing between those credentials and the other accounts on the host. There is no second factor, no address restriction, and nothing in the database that would treat a connection using them as anything but routine.

        The concrete path is lateral movement on a shared machine. An attacker who compromises an unrelated service on the host, through a web application or an exposed agent, has a local unprivileged account. If a developer's `.my.cnf` or an operator's `.mylogin.cnf` is group readable, that foothold becomes a database credential immediately, and the resulting connection is indistinguishable from the owner's own work: a real account, from a real host, landing in the audit log as ordinary activity.

        Restrict each file to its owner, then rotate any credential that was readable. A file other accounts could open has to be assumed to have been opened.
      audit: |
        ### Audit via CLI

        1. Find per-user option files and check their permissions:

        ```bash
        sudo find /home /root -maxdepth 2 -name ".my.cnf" -o -maxdepth 2 -name ".mylogin.cnf" -ls 2>/dev/null
        ```

        2. Confirm which login paths are stored for a given account:

        ```bash
        sudo -u appuser mysql_config_editor print --all
        ```

        A passing result shows every file as `-rw-------`, or finds no such files. A failing result shows a mode such as `-rw-r--r--` or `-rw-r-----`, meaning other accounts can read the credential.
      remediation:
        - id: cli
          desc: |
            To protect per-user option files using the CLI:

            1. Restrict every per-user option file to its owner.
            2. Confirm the resulting permissions.
            3. Rotate any credential that was readable, because it must be assumed exposed.

            ```bash
            sudo find /home /root -maxdepth 2 \( -name ".my.cnf" -o -name ".mylogin.cnf" \) \
              -exec chmod 0600 {} +
            sudo find /home /root -maxdepth 2 \( -name ".my.cnf" -o -name ".mylogin.cnf" \) -ls
            sudo mysql -e "ALTER USER 'app'@'localhost' IDENTIFIED BY 'new-password';"
            ```
        - id: script
          desc: |
            To protect per-user option files using a bash script:

            1. Report each file that is readable beyond its owner before changing it.
            2. Restrict the mode and confirm the owner still matches the home directory.
            3. Remind the operator to rotate credentials that were exposed.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            exposed=0

            while IFS= read -r file; do
              mode=$(stat -c "%a" "$file")
              if [ "$mode" != "600" ]; then
                echo "restricting $file (was mode $mode)"
                chmod 0600 "$file"
                exposed=1
              fi
            done < <(find /home /root -maxdepth 2 \( -name ".my.cnf" -o -name ".mylogin.cnf" \) 2>/dev/null)

            if [ "$exposed" -eq 1 ]; then
              echo "rotate the credentials stored in these files; treat them as compromised" >&2
            fi
            ```
        - id: ansible
          desc: |
            To protect per-user option files using Ansible:

            1. Find per-user option files under the home directories.
            2. Restrict each of them to its owner.

            ```yaml
            - name: Protect per-user MySQL option files
              hosts: mysql
              become: true
              tasks:
                - name: Find per-user option files
                  ansible.builtin.find:
                    paths:
                      - /home
                      - /root
                    patterns:
                      - ".my.cnf"
                      - ".mylogin.cnf"
                    hidden: true
                    recurse: true
                    depth: 2
                  register: user_option_files
                  failed_when: false

                - name: Restrict them to their owner
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    mode: "0600"
                  loop: "{{ user_option_files.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
            ```
