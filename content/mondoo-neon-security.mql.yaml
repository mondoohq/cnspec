policies:
  - uid: mondoo-neon-security
    name: Mondoo Neon Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: neon-organization
    require:
      - provider: neon
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden Neon organization multi-factor authentication, network exposure, and password storage
    docs:
      desc: |
        The Mondoo Neon Security policy connects to a Neon serverless Postgres organization and reads its organization settings along with the configuration of every project it contains. Because it evaluates what the Neon API reports for the organization and its projects, the checks reflect the controls Neon is actually enforcing rather than a file on disk.

        This policy focuses on the account-level guardrails that protect a Neon organization and the databases it hosts. It verifies that the organization requires multi-factor authentication for its members, so a stolen password alone cannot reach the control plane. It confirms that projects block public connections, keeping databases reachable only through configured private networking or allowed IP ranges rather than from anywhere on the internet. It also checks whether Neon retains project role passwords, since password storage widens the blast radius of a control-plane or API-key compromise.

        Learn more about scanning databases in the [cnspec documentation](https://mondoo.com/docs/cnspec).
    groups:
      - title: Authentication
        checks:
          - uid: mondoo-neon-security-org-require-mfa
      - title: Network Access
        checks:
          - uid: mondoo-neon-security-project-block-public-connections
      - title: Data Protection
        checks:
          - uid: mondoo-neon-security-project-no-stored-passwords
    scoring_system: highest impact
queries:
  # No Terraform variant: neither published Neon provider declares an organization resource.
  # kislerdm/neon reaches org scope only through neon_org_api_key, and
  # terraform-community-providers/neon stops at projects, so organization MFA cannot be expressed
  # in HCL. It is also read-only in the API, which is why the remediation is console-only.
  - uid: mondoo-neon-security-org-require-mfa
    filters: asset.platform == "neon-organization"
    title: Ensure the Neon organization requires multi-factor authentication
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      neon.organizations.all(requireMfa == true)
    docs:
      desc: |
        This check verifies that every Neon organization requires its members to sign in with a second factor.

        The requirement is set in the Neon Console by opening Organization and then Settings, where multi-factor authentication is turned on for the organization as a whole rather than left to each member. The organization record returned by the Neon API carries the same value as `require_mfa`. This check requires the setting to be on for each organization the API key can see.

        **Why this matters**

        A Neon organization member holds the control plane, and for a managed database the control plane is a route to the data rather than a layer above it. A member creates and deletes projects, resets the password of any database role, and reads connection details. So an attacker who signs in as a member never has to break the database itself. They reset a role password from the console, take the connection string, and connect to production Postgres as that role.

        Without a required second factor, the password is the whole of that defense, and passwords leave the user's control routinely. They are reused on sites that get breached, typed into phishing pages that copy the Neon sign-in screen, and scraped out of browsers by infostealer malware. Any one of those hands over a working sign-in, and none of them is visible to you until it is used.

        Branch history makes the exposure larger than the current state of the database. Neon keeps branches and point-in-time history, so a member account also reaches earlier states of the data, including rows that were deleted precisely because they should no longer exist anywhere.

        Set the requirement at the organization rather than asking members to enroll individually, because an organization-wide requirement covers people who join later and leaves nobody able to opt out. Confirm that existing members enroll after the change, since an account that has not yet added a factor is the one an attacker will go looking for.
      audit: |-
        ### Audit via the Neon Console

        1. Sign in to the Neon Console and open **Organization** > **Settings**.
        2. Locate the multi-factor authentication (MFA) requirement.
        3. Confirm that MFA is required for organization members.

        If MFA is required, the check passes. If it is not required, the check fails.

        ### Audit via the API

        1. Query the organization with the Neon API and read the `require_mfa` setting:

           ```bash
           curl -s \
             --header "Authorization: Bearer $NEON_API_KEY" \
             --header "Accept: application/json" \
             "https://console.neon.tech/api/v2/organizations/<org_id>"
           ```

        If MFA is required for the organization, the check passes. If it is not required, the check fails.
      remediation:
        - id: console
          desc: |-
            To require multi-factor authentication in the Neon Console:

            1. Open **Organization** > **Settings**.
            2. Enable the requirement that members use multi-factor authentication.
            3. Save the change and confirm existing members enroll a second factor.
    refs:
      - url: https://neon.tech/docs/manage/organizations
        title: Neon Organizations
  - uid: mondoo-neon-security-project-block-public-connections
    title: Ensure Neon projects block public connections
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-neon-security-project-block-public-connections-neon-organization
        tags:
          mondoo.com/filter-title: Neon Organization
          mondoo.com/filter-icon: neon
      - uid: mondoo-neon-security-project-block-public-connections-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-neon-security-project-block-public-connections-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-neon-security-project-block-public-connections-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Neon project refuses connections arriving from the public internet.

        Neon exposes a project's Postgres endpoint to the internet unless told otherwise. The block is set in the Neon Console by opening the project, then Settings, then Network Security, the same page that holds the allowed IP ranges and the private networking configuration legitimate clients use instead. The Neon CLI sets it with `neon projects update <project_id> --block-public-connections`, and the `neon_project` Terraform resource takes `block_public_connections = "yes"`. This check requires the block to be in effect.

        **Why this matters**

        An open Postgres endpoint is found by scanning, not by leaking. Internet-wide scanners sweep the Postgres port continuously and record every host that completes a handshake, so a project reachable from anywhere lands on a target list within hours of being created, whether or not its hostname was ever published.

        From there an attacker needs only a credential, and credentials escape constantly. A connection string committed to a repository, pasted into an issue, or read out of an application's environment is enough on its own when the endpoint accepts connections from any source. With public connections blocked, that same leaked string is inert from an address the project does not know, which turns a credential leak from an immediate compromise into an incident with room to rotate.

        The open endpoint also hands the attacker unlimited attempts. Password guessing against a database role runs at whatever rate they choose, from as many addresses as they care to rent, with no application in front of it to rate-limit the attempts or record them.

        Blocking public connections needs the private path to exist first, so configure the allowed IP ranges or private networking for the application and for operators before switching it on. Otherwise the change takes the database away from its legitimate clients along with everyone else, and the pressure to reopen it will be immediate.
      audit: |-
        ### Audit via the Neon Console

        1. Sign in to the Neon Console and open each project.
        2. Go to **Settings** > **Network Security**.
        3. Confirm that public connections are blocked and that allowed IPs or private networking are configured.

        If public connections are blocked, the check passes. If public connections are allowed, the check fails.

        ### Audit via the API

        1. Query each project with the Neon API and read the setting that blocks public connections:

           ```bash
           curl -s \
             --header "Authorization: Bearer $NEON_API_KEY" \
             --header "Accept: application/json" \
             "https://console.neon.tech/api/v2/projects/<project_id>"
           ```

        If public connections are blocked for the project, the check passes. If they are allowed, the check fails.
      remediation:
        - id: console
          desc: |-
            To block public connections in the Neon Console:

            1. Open the affected project and go to **Settings** > **Network Security**.
            2. Enable the option to block public connections.
            3. Configure the allowed IP ranges or private networking that legitimate clients need, then save the change.
        - id: cli
          desc: |-
            To block public connections with the Neon CLI, update the project settings:

            ```bash
            neon projects update <project_id> --block-public-connections
            ```
        - id: terraform
          desc: |-
            To block public connections with the Neon Terraform provider, set the network configuration on the `neon_project` resource:

            ```hcl
            resource "neon_project" "example" {
              name = "example"

              block_public_connections = "yes"
            }
            ```
    refs:
      - url: https://neon.tech/docs/introduction/ip-allow
        title: Neon IP Allow
      - url: https://neon.com/docs/cli/projects
        title: Neon CLI projects command
  - uid: mondoo-neon-security-project-block-public-connections-neon-organization
    filters: asset.platform == "neon-organization"
    mql: |
      neon.projects.all(blockPublicConnections == true)
  # block_public_connections is a string enum, not a bool: the provider documents 'yes' to activate,
  # 'no' to deactivate, and omission to keep the platform default. Neon allows public connections by
  # default, so an absent argument is an exposed project and fails.
  - uid: mondoo-neon-security-project-block-public-connections-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "neon_project")
    mql: |
      terraform.resources("neon_project").all(arguments["block_public_connections"] == "yes")
  - uid: mondoo-neon-security-project-block-public-connections-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "neon_project")
    mql: |
      terraform.plan.resourceChanges.where(type == "neon_project").all(change.after["block_public_connections"] == "yes")
  - uid: mondoo-neon-security-project-block-public-connections-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "neon_project")
    mql: |
      terraform.state.resources.where(type == "neon_project").all(values["block_public_connections"] == "yes")
  - uid: mondoo-neon-security-project-no-stored-passwords
    title: Ensure Neon does not retain project role passwords
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ekm-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-neon-security-project-no-stored-passwords-neon-organization
        tags:
          mondoo.com/filter-title: Neon Organization
          mondoo.com/filter-icon: neon
      - uid: mondoo-neon-security-project-no-stored-passwords-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-neon-security-project-no-stored-passwords-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-neon-security-project-no-stored-passwords-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a Neon project does not retain its database role passwords in a form the control plane can hand back.

        When password storage is on, Neon keeps role passwords so that the console and API can return a complete connection string on demand. With it off, a password is shown once when the role is created and never again. The API accepts `store_passwords` only in the request that creates the project, and the `neon_project` Terraform resource takes `store_password = "no"` on the same terms, so this is a decision made at creation rather than a setting to be flipped later. This check requires storage to be off.

        **Why this matters**

        Retained passwords turn one leaked API key into database access. A Neon API key that ends up in a CI log, a committed file, or a compromised laptop is by itself control-plane reach and nothing more. Where passwords are stored, the holder of that key queries the projects endpoint, reads back the connection strings for every role in every project the key covers, and connects straight to Postgres with credentials that were never theirs. Nothing is reset, so nothing breaks, and the legitimate application keeps running alongside them with no sign that anyone else is connected.

        With storage off, the same key still permits damage, but the attacker has to reset a role password before they can use the database, and a reset breaks the running application. The noise is the point: it turns a silent read of production data into an outage somebody investigates within minutes.

        The control has a genuine cost. Deploy workflows that fetch a connection string from the API, and console users who expect to copy credentials whenever they need them, both stop working. Route those to a secret manager holding the password captured at creation before turning storage off.

        Because the choice is fixed when the project is created, bringing an existing project into line means creating a replacement with storage off, migrating its databases and roles, and then deleting the original.
      audit: |-
        ### Audit via the Neon Console

        1. Sign in to the Neon Console and open each project.
        2. Go to **Settings** and locate the option that stores role passwords.
        3. Confirm that password storage is disabled.

        If password storage is disabled, the check passes. If it is enabled, the check fails.

        ### Audit via the API

        1. Query each project with the Neon API and read the setting that controls storing role passwords:

           ```bash
           curl -s \
             --header "Authorization: Bearer $NEON_API_KEY" \
             --header "Accept: application/json" \
             "https://console.neon.tech/api/v2/projects/<project_id>"
           ```

        If password storage is disabled for the project, the check passes. If it is enabled, the check fails.
      remediation:
        - id: console
          desc: |-
            To stop retaining role passwords in the Neon Console:

            1. Create a replacement project with password storage turned off. The Neon API accepts `store_passwords` only when the project is created, so an existing project keeps the setting it was created with.
            2. Migrate the databases and roles from the affected project to the replacement.
            3. Delete the original project, keeping in mind that workflows relying on stored connection strings will need another way to retrieve credentials.
        - id: api
          desc: |-
            Password storage is fixed when the project is created, so an existing project cannot be updated in place. Create the replacement project with `store_passwords` off and migrate the data to it:

            ```bash
            curl -s -X POST \
              --header "Authorization: Bearer $NEON_API_KEY" \
              --header "Content-Type: application/json" \
              --data '{"project":{"name":"example","store_passwords":false}}' \
              "https://console.neon.tech/api/v2/projects"
            ```
        - id: terraform
          desc: |-
            To create a project that does not retain role passwords with the Neon Terraform provider, set `store_password` on the `neon_project` resource. The setting applies at creation, so changing it on an existing project replaces that project:

            ```hcl
            resource "neon_project" "example" {
              name = "example"

              store_password = "no"
            }
            ```
    refs:
      - url: https://neon.tech/docs/manage/projects
        title: Neon Projects
      - url: https://neon.com/docs/reference/api-reference
        title: Neon API reference
  - uid: mondoo-neon-security-project-no-stored-passwords-neon-organization
    filters: asset.platform == "neon-organization"
    mql: |
      neon.projects.all(storePasswords == false)
  # store_password is a string enum, not a bool, and it is singular where the API field is plural.
  # Neon stores role passwords by default, so an absent argument keeps them stored and fails.
  - uid: mondoo-neon-security-project-no-stored-passwords-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "neon_project")
    mql: |
      terraform.resources("neon_project").all(arguments["store_password"] == "no")
  - uid: mondoo-neon-security-project-no-stored-passwords-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "neon_project")
    mql: |
      terraform.plan.resourceChanges.where(type == "neon_project").all(change.after["store_password"] == "no")
  - uid: mondoo-neon-security-project-no-stored-passwords-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "neon_project")
    mql: |
      terraform.state.resources.where(type == "neon_project").all(values["store_password"] == "no")
