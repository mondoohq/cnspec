policies:
  - uid: mondoo-netlify-security
    name: Mondoo Netlify Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: netlify-account
    require:
      - provider: netlify
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Enforce Netlify account multi-factor authentication and HTTPS on published sites
    docs:
      desc: |
        The Mondoo Netlify Security policy connects to a Netlify account and reads its team accounts and published sites. Because it evaluates what the Netlify API reports for the account and its sites, the checks reflect the controls Netlify is actually enforcing rather than a file on disk.

        This policy focuses on the account-level guardrails that protect a Netlify team and its visitors. It verifies that every team account enforces multi-factor authentication for its members, so a stolen password alone cannot sign in. It also confirms that every published site forces HTTPS, so visitors never exchange data with the site over an unencrypted connection.

        Learn more about scanning with cnspec in the [cnspec documentation](https://mondoo.com/docs/cnspec).
    groups:
      - title: Authentication
        filters: asset.platform == "netlify-account"
        checks:
          - uid: mondoo-netlify-security-account-enforce-mfa
      - title: Transport Encryption
        filters: asset.platform == "netlify-account"
        checks:
          - uid: mondoo-netlify-security-sites-force-ssl
    scoring_system: highest impact
queries:
  # No Terraform variant or remediation: MFA enforcement has no Terraform surface. The netlify/netlify provider
  # exposes no team security resource, and the public Netlify API carries no MFA field, so the UI is the only
  # place the setting can be read or changed.
  - uid: mondoo-netlify-security-account-enforce-mfa
    filters: asset.platform == "netlify-account"
    title: Ensure Netlify accounts enforce multi-factor authentication
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      # enforceMfa is a string, and not_enforced is its only documented negative
      # value; every other value requires enrollment. Test the sentinel rather
      # than guessing how the positive case is spelled.
      netlify.accounts.all(enforceMfa != "not_enforced")
    docs:
      desc: |
        This check verifies that every Netlify team requires its members to sign in with a second factor.

        The setting is found in the Netlify UI by opening Team settings and then the Security section, where it appears as Enforce multi-factor authentication. Turning it on requires each member to enroll a second factor before they can continue working in the team. The team record reports the state as `enforceMfa`, whose only documented negative value is `not_enforced`, and this check requires the team to be in any other state. Enforcement is a paid-team capability, so a team on the free plan cannot satisfy this check without an upgrade.

        **Why this matters**

        A Netlify team member controls what visitors receive from every site the team publishes. An attacker who signs in as one deploys a build of their choosing, and that build then runs in each visitor's browser: a script that reads session cookies from the site's own origin, a checkout page that posts card numbers to an endpoint the attacker controls, a redirect that quietly sends traffic elsewhere. Because the deploy travels through Netlify's normal pipeline and is served on the site's real domain under a valid certificate, nothing a visitor can see distinguishes it from a legitimate release.

        The same account reaches the team's environment variables, which typically hold the API keys and database credentials the site's functions use at runtime, and the domain settings, where control of DNS is enough to take delivery of certificate validation for the domain itself.

        A password alone protects none of that, and passwords are lost in bulk rather than one at a time. They are reused on sites that later get breached, entered on phishing pages that copy the Netlify sign-in screen, and pulled straight out of browsers by infostealer malware.

        Enforce at the team level rather than asking members to enroll on their own, because the team setting covers people who join later and removes the choice from members who would otherwise skip it. Confirm that existing members have enrolled afterwards, since an account still lacking a factor is exactly the one worth attacking.
      audit: |-
        ### Audit via the Netlify UI

        1. Sign in to the Netlify UI and open **Team settings**.
        2. Open the **Security** section.
        3. Confirm that **Enforce multi-factor authentication** is on for the team.

        If MFA enforcement is on, the check passes. If it is off, the check fails.
      remediation:
        - id: console
          desc: |-
            To enforce multi-factor authentication in the Netlify UI:

            1. Open **Team settings** and go to the **Security** section.
            2. Enable **Enforce multi-factor authentication**.
            3. Save the change and confirm existing members enroll a second factor.
    refs:
      - url: https://docs.netlify.com/accounts-and-billing/team-management/team-level-security/
        title: Netlify team-level security
  # No Terraform variant or remediation: the netlify/netlify provider has no site resource and its
  # netlify_site_domain_settings resource has no forced-TLS attribute, so forced HTTPS cannot be expressed in
  # HCL. The API does carry force_ssl on the site, which is why the remediation below uses it. Revisit if the
  # provider grows the attribute.
  - uid: mondoo-netlify-security-sites-force-ssl
    filters: asset.platform == "netlify-account"
    title: Ensure Netlify sites force HTTPS
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netlify.sites.all(forceSsl == true)
    docs:
      desc: |
        This check verifies that every Netlify site redirects HTTP requests to HTTPS.

        The setting is found in the Netlify UI by opening a site, then Site configuration, then Domain management, then HTTPS, where it appears as Force HTTPS. The sites API exposes the same state as `force_ssl`. A provisioned certificate has to be in place before the redirect can be turned on. This check requires the redirect to be in effect for each site the team publishes.

        **Why this matters**

        Without the redirect, the site answers on plain HTTP as well as HTTPS, and the plain answer is the one many visitors get. A hostname typed into the address bar, an old bookmark, a link in a mail client that strips the scheme, and every place a bare domain appears in print or conversation all resolve to HTTP first.

        That first request is what an attacker on the network path takes. On a shared network, a public hotspot, a hotel connection, a home router someone else already owns, they answer it themselves and return a modified copy of the page. The visitor's browser has nothing to object to, because an unencrypted response carries no certificate to fail. The modified copy can include a script that reads whatever the visitor types, so a login form on the site sends credentials to the attacker instead of to the origin, and a payment form sends card details the same way.

        Passive reading is available on the same terms even when nothing is changed. Everything the visitor submits over HTTP, including session cookies that were not marked secure, is readable by everyone between them and the site, and a stolen session cookie needs no password at all.

        Turning on the redirect closes the plain path for requests that reach Netlify. Pair it with a Strict-Transport-Security response header, set through the site's headers configuration, so that a returning browser goes straight to HTTPS and never sends the first insecure request that the redirect exists to catch.
      audit: |-
        ### Audit via the Netlify UI

        1. Sign in to the Netlify UI and open each site.
        2. Go to **Site configuration > Domain management > HTTPS**.
        3. Confirm that **Force HTTPS** is enabled for the site.

        If forced HTTPS is enabled, the check passes. If it is disabled, the check fails.

        ### Audit via the Netlify API

        1. List the sites and read each site's `force_ssl` field:

           ```bash
           curl -s \
             --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
             "https://api.netlify.com/api/v1/sites" \
             | jq '.[] | {name, force_ssl}'
           ```

        If every site reports `force_ssl` as true, the check passes. If any site reports false, the check fails.
      remediation:
        - id: console
          desc: |-
            To force HTTPS in the Netlify UI:

            1. Open the affected site and go to **Site configuration > Domain management > HTTPS**.
            2. Provision an SSL/TLS certificate for the site if one is not already in place.
            3. Enable **Force HTTPS** so all HTTP requests redirect to HTTPS.
        - id: api
          desc: |-
            To force HTTPS with the Netlify API, set `force_ssl` on the site. The site needs a provisioned certificate before the redirect can be enforced:

            ```bash
            curl -s -X PATCH \
              --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"force_ssl":true}' \
              "https://api.netlify.com/api/v1/sites/$SITE_ID"
            ```
    refs:
      - url: https://docs.netlify.com/domains-https/https-ssl/
        title: Netlify HTTPS/SSL
      - url: https://open-api.netlify.com/#tag/site/operation/updateSite
        title: Netlify API updateSite
