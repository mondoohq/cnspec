  - uid: mondoo-netscaler-security-gateway-account-lockout
    title: Ensure Gateway virtual servers lock out repeated failed logons
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-4
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      netscaler.gatewayVirtualServers.all(maxLoginAttempts > 0 && maxLoginAttempts <= 10)
    docs:
      desc: |
        This check verifies that every NetScaler Gateway virtual server locks out a user after repeated failed logons.

        The **Max Login Attempts** setting of a Gateway virtual server sets how many failed logons a user may make before the account is locked out on that virtual server, and **Failed Login Timeout** sets how many minutes the lockout lasts. A value of 0 turns lockout off, which is the factory setting. The check requires a limit between 1 and 10 on every Gateway virtual server.

        **Why this matters**

        A Gateway logon page is reachable from the internet and checks passwords against the corporate directory. Without a lockout it is an unlimited password guessing endpoint for every domain account, and password spraying against Gateway portals is a standard technique of ransomware operators.

        The lockout applies at the Gateway only, so the directory's own lockout policy still applies behind it. Set the limit below the directory's lockout threshold so that an attack is stopped at the Gateway before it locks domain accounts.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show vpn vserver
           ```

        2. Read `Max Login Attempts` for each virtual server.

        A passing result shows a value between 1 and 10 for every virtual server. A failing result shows 0 or a value above 10.
      remediation:
        - id: console
          desc: |
            To enable account lockout using the NetScaler GUI:

            1. Navigate to **NetScaler Gateway > Virtual Servers**.
            2. Select the virtual server and select **Edit**.
            3. In **Basic Settings**, select the edit icon and expand **More**.
            4. Set **Max Login Attempts** to `5` and **Failed Login Timeout** to `30`.
            5. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To enable account lockout using the NetScaler CLI:

            ```text
            set vpn vserver <vserver_name> -maxLoginAttempts 5 -failedLoginTimeout 30
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

