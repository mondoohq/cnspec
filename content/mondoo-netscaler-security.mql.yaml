  - uid: mondoo-netscaler-security-gateway-hsts-enabled
    title: Ensure Gateway virtual servers send HTTP Strict Transport Security
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.gatewayVirtualServers.all(
        ssl != null && ssl.profile != null && ssl.profile.hsts == true ||
          ssl != null && ssl.profile == null && ssl.hsts == true
      )
    docs:
      desc: |
        This check verifies that NetScaler Gateway portals tell browsers to reach them over HTTPS only.

        HTTP Strict Transport Security, or HSTS, is a response header that makes a browser refuse plain HTTP connections to the site for a set period. On NetScaler it is set in the SSL profile bound to the virtual server, or on the virtual server itself when default SSL profiles are off. The check reads the setting wherever it takes effect and requires HSTS on every Gateway virtual server.

        **Why this matters**

        Users reach the Gateway by typing its name or following a bookmark, and the first request often goes out over HTTP. An attacker on a hotel or airport network answers that request, keeps the user on HTTP, and proxies the logon page, collecting the password and MFA code as they are typed. HSTS makes the browser skip the HTTP request after the first visit, which closes that downgrade.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run the following for each Gateway virtual server:

           ```text
           show ssl vserver <vserver_name>
           ```

        2. Read `HSTS`, or, when an SSL profile is bound, run `show ssl profile <profile_name>` and read `HSTS` there.

        A passing result shows `HSTS: ENABLED` where the setting takes effect. A failing result shows `DISABLED`.
      remediation:
        - id: console
          desc: |
            To enable HSTS using the NetScaler GUI:

            1. Navigate to **System > Profiles > SSL Profile**, and edit the profile bound to the Gateway virtual server. When default SSL profiles are off, edit the SSL parameters of the virtual server under **NetScaler Gateway > Virtual Servers** instead.
            2. Select **HSTS** and set **Max Age** to `31536000`.
            3. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To enable HSTS using the NetScaler CLI, set it on the SSL profile bound to the virtual server:

            ```text
            set ssl profile <profile_name> -HSTS ENABLED -maxage 31536000
            save ns config
            ```

            When default SSL profiles are off, set it on the virtual server instead:

            ```text
            set ssl vserver <vserver_name> -HSTS ENABLED -maxage 31536000
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/netscaler-cryptographic-recommendations.html
        title: NetScaler cryptographic recommendations

  - uid: mondoo-netscaler-security-ssl-vserver-tls12-minimum
    title: Ensure SSL virtual servers do not accept SSLv3, TLS 1.0, or TLS 1.1
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.sslVirtualServers.all(
        profile != null && profile.ssl3 == false && profile.tls1 == false && profile.tls11 == false ||
          profile == null && ssl3 == false && tls1 == false && tls11 == false && dtls1 != true
      )
    docs:
      desc: |
        This check verifies that every virtual server that terminates TLS on the appliance accepts only TLS 1.2 and later.

        NetScaler sets protocol versions in one of two places. With default SSL profiles enabled, the SSL profile bound to the virtual server governs them. With default profiles disabled, each virtual server carries its own settings, and a new virtual server starts with SSLv3, TLS 1.0, and TLS 1.1 enabled. The check reads whichever applies to each load-balancing, content-switching, Gateway, and AAA virtual server and requires SSLv3, TLS 1.0, TLS 1.1, and DTLS 1.0 to be disabled.

        **Why this matters**

        SSLv3 is broken by the POODLE attack, and TLS 1.0 and 1.1 depend on SHA-1 and on CBC constructions that BEAST and Lucky Thirteen exploit. RFC 8996 deprecates TLS 1.0, TLS 1.1, and DTLS 1.0. A virtual server that still offers them lets an attacker in the path force a client down to the weakest version both sides support.

        Clients that cannot negotiate TLS 1.2 are a decade old. Find them in the appliance's SSL statistics before the change and plan their replacement, rather than keeping the old versions for every client.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run the following and note whether `Default profile` is `ENABLED`:

           ```text
           show ssl parameter
           ```

        2. Run the following for each SSL virtual server:

           ```text
           show ssl vserver <vserver_name>
           ```

        3. With default profiles enabled, read the bound profile with `show ssl profile <profile_name>`. Otherwise read the protocol line of the virtual server, for example `SSLv3: DISABLED  TLSv1.0: DISABLED  TLSv1.1: DISABLED  TLSv1.2: ENABLED`.

        A passing result shows SSLv3, TLS 1.0, TLS 1.1, and on DTLS virtual servers DTLS 1.0, disabled everywhere they take effect. A failing result shows any of them enabled.
      remediation:
        - id: console
          desc: |
            To disable obsolete protocol versions using the NetScaler GUI:

            1. With default SSL profiles enabled, navigate to **System > Profiles > SSL Profile** and edit each front-end profile bound to a virtual server. Otherwise edit the **SSL Parameters** of each SSL virtual server.
            2. In **Protocol**, clear **SSLv3**, **TLSv1**, and **TLSv1.1**, and keep **TLSv1.2** and **TLSv1.3** selected.
            3. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To disable obsolete protocol versions using the NetScaler CLI, set them on each front-end SSL profile bound to a virtual server:

            ```text
            set ssl profile <profile_name> -ssl3 DISABLED -tls1 DISABLED -tls11 DISABLED -tls12 ENABLED -tls13 ENABLED
            save ns config
            ```

            When default SSL profiles are off, set them on each SSL virtual server instead, and disable DTLS 1.0 on DTLS virtual servers:

            ```text
            set ssl vserver <vserver_name> -ssl3 DISABLED -tls1 DISABLED -tls11 DISABLED -tls12 ENABLED
            set ssl vserver <dtls_vserver_name> -dtls1 DISABLED -dtls12 ENABLED
            save ns config
            ```
    refs:
      - url: https://www.rfc-editor.org/rfc/rfc8996
        title: "RFC 8996: Deprecating TLS 1.0 and TLS 1.1"

  - uid: mondoo-netscaler-security-ssl-secure-renegotiation
    title: Ensure insecure TLS renegotiation is denied
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.sslParameters.defaultProfile == false &&
        netscaler.sslParameters.denySslRenegotiation != empty &&
        netscaler.sslParameters.denySslRenegotiation != "NO" ||
        netscaler.sslParameters.defaultProfile == true &&
        netscaler.sslProfiles.where(profileType == "FrontEnd").all(denySslRenegotiation != empty && denySslRenegotiation != "NO")
    docs:
      desc: |
        This check verifies that the appliance does not allow insecure TLS renegotiation.

        The **Deny SSL Renegotiation** setting takes `NO`, which allows every renegotiation, or one of `YES`, `FRONTEND_CLIENT`, `FRONTEND_CLIENTSERVER`, `ALL`, and `NONSECURE`, which deny renegotiation from some or all peers or allow only secure renegotiation. With default SSL profiles disabled the global SSL parameter applies; with them enabled each SSL profile carries its own value. The check reads whichever applies and fails when any front-end setting is `NO`.

        **Why this matters**

        Insecure renegotiation, CVE-2009-3555, lets an attacker in the path splice their own request in front of a victim's authenticated session, so that the server processes the attacker's request with the victim's credentials. Client-initiated renegotiation also costs the server far more work than the client, which makes it a cheap way to exhaust the appliance's TLS capacity.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show ssl parameter
           ```

        2. With `Default profile: DISABLED`, read `Deny SSL Renegotiation` there. With it enabled, run `show ssl profile` and read `Deny SSL Renegotiation` for each front-end profile.

        A passing result shows any value other than `NO`. A failing result shows `NO`.
      remediation:
        - id: console
          desc: |
            To deny insecure renegotiation using the NetScaler GUI:

            1. With default SSL profiles disabled, navigate to **Traffic Management > SSL > Change advanced SSL settings**. With them enabled, edit each front-end profile under **System > Profiles > SSL Profile**.
            2. Set **Deny SSL Renegotiation** to **NONSECURE**, or to **ALL** if no application needs renegotiation.
            3. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To deny insecure renegotiation using the NetScaler CLI with default SSL profiles disabled:

            ```text
            set ssl parameter -denySSLReneg NONSECURE
            save ns config
            ```

            With default SSL profiles enabled, set it on each front-end profile:

            ```text
            set ssl profile <profile_name> -denySSLReneg NONSECURE
            save ns config
            ```
    refs:
      - url: https://nvd.nist.gov/vuln/detail/CVE-2009-3555
        title: CVE-2009-3555 Detail

  - uid: mondoo-netscaler-security-ssl-certificates-not-expired
    title: Ensure certificates bound to SSL virtual servers are not expired
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      netscaler.sslVirtualServers.all(certificates.all(notAfter > time.now))
    docs:
      desc: |
        This check verifies that no SSL virtual server presents an expired server certificate.

        Each SSL virtual server is bound to one or more certificate-key pairs, which it presents to clients during the TLS handshake. The check examines every server certificate bound to a load-balancing, content-switching, Gateway, or AAA virtual server and requires its validity period to extend past the current time. Certificates installed on the appliance but not bound to a virtual server are not examined.

        **Why this matters**

        An expired certificate breaks every client that validates it, which takes the application offline. The more lasting damage is what follows: users and support staff learn to click through certificate warnings, and an attacker who intercepts the connection with their own certificate then meets no resistance. Automated clients are often reconfigured to skip validation to restore service, and the setting outlives the incident.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **Traffic Management > SSL > Certificates > Server Certificates**.
        2. Read the **Status** and **Days to Expire** columns of each certificate bound to a virtual server.

        ### Audit via the NetScaler CLI

        1. Run the following for each SSL virtual server and note the bound certificate-key pairs:

           ```text
           show ssl vserver <vserver_name>
           ```

        2. Run the following for each of them and read `Status` and `Not After`:

           ```text
           show ssl certKey <certkey_name>
           ```

        A passing result shows `Status: Valid` for every bound certificate. A failing result shows `Expired` for any of them.
      remediation:
        - id: console
          desc: |
            To replace an expired certificate using the NetScaler GUI:

            1. Obtain a renewed certificate from the issuing CA.
            2. Navigate to **Traffic Management > SSL > Certificates > Server Certificates**.
            3. Select the certificate-key pair and choose **Update**.
            4. Select the renewed certificate file and its key, select **OK**, and **Save** the configuration.
        - id: cli
          desc: |
            To replace an expired certificate using the NetScaler CLI, upload the renewed certificate and key to `/nsconfig/ssl/`, then update the certificate-key pair in place so every binding keeps working:

            ```text
            update ssl certKey <certkey_name> -cert <renewed_cert.pem> -key <renewed_key.pem>
            save ns config
            ```

            If the new certificate names a different host than the old one, NetScaler refuses the update until `-noDomainCheck` is added.

            Enable expiry monitoring so the appliance alerts before the next expiry:

            ```text
            set ssl certKey <certkey_name> -expiryMonitor ENABLED -notificationPeriod 30
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/netscaler-cryptographic-recommendations.html
        title: NetScaler cryptographic recommendations

  - uid: mondoo-netscaler-security-ssl-certificates-strong-key
    title: Ensure certificates bound to SSL virtual servers use strong keys
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      netscaler.sslVirtualServers.all(
        certificates.all(
          publicKeyAlgorithm == "rsaEncryption" && publicKeySize >= 2048 ||
            publicKeyAlgorithm == "id-ecPublicKey" && publicKeySize >= 256
        )
      )
    docs:
      desc: |
        This check verifies that every server certificate bound to an SSL virtual server uses a key of adequate strength.

        The public key of a server certificate authenticates the virtual server to its clients. The check examines every server certificate bound to a load-balancing, content-switching, Gateway, or AAA virtual server and requires an RSA key of at least 2048 bits or an elliptic curve key of at least 256 bits. A certificate with any other key type fails.

        **Why this matters**

        RSA keys of 1024 bits and below are within reach of well-funded attackers, and CAs stopped issuing them in 2013. An attacker who factors the key impersonates the virtual server to every client and, where RSA key exchange is still allowed, decrypts recorded traffic. NetScaler's own cryptographic recommendations call for 2048-bit RSA keys.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run the following for each certificate-key pair bound to an SSL virtual server:

           ```text
           show ssl certKey <certkey_name>
           ```

        2. Read `Public Key Algorithm` and `Public Key size`.

        A passing result shows `rsaEncryption` with 2048 or more, or an EC key of 256 or more. A failing result shows a smaller key.
      remediation:
        - id: console
          desc: |
            To replace a weak certificate key using the NetScaler GUI:

            1. Navigate to **Traffic Management > SSL > SSL Files**, open the **Keys** tab, and create an RSA key of 2048 bits or more, or an ECDSA key on the P-256 or P-384 curve.
            2. Create a certificate signing request for it on the **CSRs** tab and have the CA sign it.
            3. Navigate to **Traffic Management > SSL > Certificates > Server Certificates**, select the certificate-key pair, choose **Update**, and select the new certificate and key.
            4. **Save** the configuration.
        - id: cli
          desc: |
            To replace a weak certificate key using the NetScaler CLI:

            ```text
            create ssl rsakey /nsconfig/ssl/<name>.key 2048 -exponent F4 -keyform PEM
            create ssl certReq /nsconfig/ssl/<name>.csr -keyFile /nsconfig/ssl/<name>.key -countryName <CC> -stateName <state> -organizationName <org> -commonName <fqdn>
            ```

            Have the CA sign the request, upload the certificate to `/nsconfig/ssl/`, and update the certificate-key pair:

            ```text
            update ssl certKey <certkey_name> -cert <name>.pem -key <name>.key
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/netscaler-cryptographic-recommendations.html
        title: NetScaler cryptographic recommendations

  - uid: mondoo-netscaler-security-ssl-certificates-sha2-signature
    title: Ensure certificates bound to SSL virtual servers have SHA-2 signatures
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-i-transmission-security-integrity-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      netscaler.sslVirtualServers.all(certificates.all(signatureAlgorithm == /sha(256|384|512)|ed25519|ed448/i))
    docs:
      desc: |
        This check verifies that every server certificate bound to an SSL virtual server is signed with a SHA-2 or EdDSA algorithm.

        The signature algorithm of a certificate is the algorithm its issuer signed it with, for example `sha256WithRSAEncryption`. The check examines every server certificate bound to a load-balancing, content-switching, Gateway, or AAA virtual server and fails on signatures over MD5 or SHA-1.

        **Why this matters**

        Collisions for MD5 and SHA-1 are practical, and in 2008 researchers used an MD5 collision to create a rogue CA certificate that browsers trusted. A certificate signed over a broken hash cannot be distinguished from a forged one that shares its signature. Current browsers reject SHA-1 server certificates outright, so such a certificate also breaks the application for modern clients.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run the following for each certificate-key pair bound to an SSL virtual server:

           ```text
           show ssl certKey <certkey_name>
           ```

        2. Read `Signature Algorithm`.

        A passing result shows a SHA-256, SHA-384, or SHA-512 based algorithm. A failing result shows one based on MD5 or SHA-1.
      remediation:
        - id: console
          desc: |
            To replace a certificate with a SHA-1 or MD5 signature using the NetScaler GUI:

            1. Request a new certificate for the same key, or a new key, from a CA that signs with SHA-256 or stronger.
            2. Navigate to **Traffic Management > SSL > Certificates > Server Certificates**.
            3. Select the certificate-key pair, choose **Update**, and select the new certificate file.
            4. **Save** the configuration.
        - id: cli
          desc: |
            To replace a certificate with a SHA-1 or MD5 signature using the NetScaler CLI, upload the reissued certificate to `/nsconfig/ssl/` and update the certificate-key pair:

            ```text
            update ssl certKey <certkey_name> -cert <reissued_cert.pem> -key <key.pem>
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/netscaler-cryptographic-recommendations.html
        title: NetScaler cryptographic recommendations

  # The netscaler resources do not expose the global syslog policy bindings,
  # so this check can confirm that a remote syslog server is defined but not
  # that a bound policy sends logs to it. Revisit when the bindings are exposed.
  - uid: mondoo-netscaler-security-syslog-remote-server
    title: Ensure a remote syslog server is defined
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-09
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-3-3
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      netscaler.syslogActions.where(logLevels.none(_ == "NONE")).any(serverIp != empty || serverDomainName != empty)
    docs:
      desc: |
        This check verifies that the appliance has a remote syslog server defined to receive its audit logs.

        NetScaler sends audit logs to a remote server through a syslog action, which names the server and the severities to send, and a syslog policy bound globally, which activates the action. The check requires at least one syslog action that names a server by IP address or domain name and does not have its log level set to `NONE`. It cannot see the policy bindings, so the audit steps below include confirming that a global syslog policy uses the action.

        **Why this matters**

        Attackers who compromise a NetScaler routinely clear or edit the local logs under `/var/log` and `/var/nslog`, as seen in the post-exploitation activity after CVE-2023-3519 and CVE-2023-4966. A copy already shipped to a remote collector is the record that survives. It is also the only way to correlate Gateway logons and administrative actions with the rest of the environment and to alert on them while an attack is in progress.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **System > Auditing > Syslog**.
        2. On the **Servers** tab, confirm that a remote server is listed with a log level other than **NONE**.
        3. On the **Policies** tab, confirm that a policy uses that server, and under **Advanced Policy Global Bindings** that the policy is bound.

        ### Audit via the NetScaler CLI

        1. Run the following and confirm that an action names a remote server and that its `Loglevel` is not `NONE`:

           ```text
           show audit syslogAction
           ```

        2. Run the following and confirm that a bound policy uses that action:

           ```text
           show audit syslogPolicy
           show audit syslogGlobal
           ```

        A passing result shows a remote server bound through a global policy. A failing result shows no syslog action, or one that no global policy uses.
      remediation:
        - id: console
          desc: |
            To send audit logs to a remote syslog server using the NetScaler GUI:

            1. Navigate to **System > Auditing > Syslog** and open the **Servers** tab.
            2. Select **Add**, enter the server's IP address or domain name and port, set **Log Levels** to **ALL**, and set **Transport Type** to **TCP**.
            3. Open the **Policies** tab, select **Add**, set the expression to `true`, and choose the new server.
            4. Select **Advanced Policy Global Bindings**, bind the policy, and **Save** the configuration.
        - id: cli
          desc: |
            To send audit logs to a remote syslog server using the NetScaler CLI:

            ```text
            add audit syslogAction <action_name> <server_ip> -serverPort 514 -logLevel ALL -transport TCP
            add audit syslogPolicy <policy_name> true <action_name>
            bind audit syslogGlobal -policyName <policy_name> -priority 100
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/citrix-adc/current-release/system/audit-logging/configuring-audit-logging.html
        title: Configuring NetScaler appliance for audit logging
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/logging-and-monitoring.html
        title: Logging and monitoring

  - uid: mondoo-netscaler-security-ntp-servers-configured
    title: Ensure NTP servers are configured
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-6-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      netscaler.ntpServers != empty
    docs:
      desc: |
        This check verifies that the appliance has at least one NTP server to synchronize its clock with.

        NetScaler keeps its clock with the NTP servers listed under **System > NTP Servers**. The check requires at least one to be configured.

        **Why this matters**

        Audit logs, Gateway session records, and SAML and Kerberos validation all depend on the appliance's clock. A clock that drifts produces log entries that do not line up with the directory, firewall, and SIEM, which breaks the timeline of an incident exactly when it is needed. SAML assertions and Kerberos tickets carry validity windows, so a drifting clock also produces logon failures that look like attacks, or hides real ones among them.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show ntp server
           ```

        A passing result lists at least one server. A failing result lists none.
      remediation:
        - id: console
          desc: |
            To configure NTP servers using the NetScaler GUI:

            1. Navigate to **System > NTP Servers**.
            2. Select **Add**, enter the IP address or name of a trusted NTP server, and select **Create**.
            3. Add a second server for redundancy and **Save** the configuration.
        - id: cli
          desc: |
            To configure NTP servers using the NetScaler CLI:

            ```text
            add ntp server <ntp_server_1>
            add ntp server <ntp_server_2>
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/logging-and-monitoring.html
        title: Logging and monitoring
      - url: https://docs.netscaler.com/en-us/citrix-adc/current-release/getting-started-with-citrix-adc/configure-system-settings/configure-clock-sync.html
        title: Clock synchronization

  - uid: mondoo-netscaler-security-ntp-sync-enabled
    title: Ensure NTP synchronization is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      netscaler.ntpSyncEnabled == true
    docs:
      desc: |
        This check verifies that the appliance synchronizes its clock with its NTP servers.

        Configuring NTP servers does not start synchronization on NetScaler. The NTP daemon runs only once synchronization is enabled with **NTP Synchronization** in the GUI or `enable ntp sync` in the CLI. The check requires synchronization to be enabled.

        **Why this matters**

        With synchronization off, the configured servers are never contacted and the clock drifts freely. Log timestamps stop lining up with the rest of the environment, and SAML assertions and Kerberos tickets with short validity windows start failing or are accepted outside the window they were meant for.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show ntp sync
           ```

        A passing result shows `NTP Synchronization: ENABLED`. A failing result shows `DISABLED`.
      remediation:
        - id: console
          desc: |
            To enable NTP synchronization using the NetScaler GUI:

            1. Navigate to **System > NTP Servers**.
            2. Select **Action > NTP Synchronization** and choose **Enable**.
            3. **Save** the configuration.
        - id: cli
          desc: |
            To enable NTP synchronization using the NetScaler CLI:

            ```text
            enable ntp sync
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/logging-and-monitoring.html
        title: Logging and monitoring
