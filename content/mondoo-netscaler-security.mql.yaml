policies:
  - uid: mondoo-netscaler-security
    name: Mondoo NetScaler ADC Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: netscaler,networkdevice
      mondoo.com/icon: netscaler
    require:
      - provider: netscaler
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden NetScaler ADC and Gateway firmware, management access, authentication, TLS, and logging
    docs:
      desc: |
        The Mondoo NetScaler ADC Security policy identifies misconfigurations on NetScaler ADC and NetScaler Gateway appliances, formerly Citrix ADC and Citrix Gateway. These appliances sit at the network perimeter and terminate remote access, single sign-on, and TLS for the applications behind them, which makes them a frequent target of mass exploitation. This policy helps organizations find the hardening gaps that turn a perimeter appliance into an entry point.

        This policy provides security checks across key NetScaler areas:

        - **Firmware**: A release line that still receives security fixes
        - **Management access**: No Telnet, FTP, or cleartext HTTP management, and no management on virtual server addresses
        - **Management accounts**: Password complexity, length, history, default password change, and session timeouts
        - **Gateway and AAA authentication**: Encrypted and verified LDAP, RADIUS Message-Authenticator, SAML signature enforcement, and account lockout
        - **TLS**: Obsolete protocol versions, renegotiation, HSTS, and certificate validity, key size, and signature algorithm
        - **Logging and time**: Remote syslog and NTP synchronization

        Scan with an account bound to a command policy that allows the `show system` commands. The built-in `read-only` command policy denies them, so checks that read management accounts and system settings cannot complete with it.

        Learn more about scanning NetScaler in the [cnspec NetScaler documentation](https://mondoo.com/docs/cnspec/network/netscaler).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Firmware
        filters: asset.family.contains("netscaler")
        checks:
          - uid: mondoo-netscaler-security-firmware-supported-release
      - title: Management Access
        filters: asset.family.contains("netscaler")
        checks:
          - uid: mondoo-netscaler-security-management-telnet-disabled
          - uid: mondoo-netscaler-security-management-ftp-disabled
          - uid: mondoo-netscaler-security-management-gui-https-only
          - uid: mondoo-netscaler-security-vip-management-access-disabled
      - title: Management Accounts
        filters: asset.family.contains("netscaler")
        checks:
          - uid: mondoo-netscaler-security-password-complexity-enabled
          - uid: mondoo-netscaler-security-password-minimum-length
          - uid: mondoo-netscaler-security-password-history-enabled
          - uid: mondoo-netscaler-security-force-default-password-change
          - uid: mondoo-netscaler-security-management-session-timeout
      - title: Gateway and AAA Authentication
        filters: asset.family.contains("netscaler")
        checks:
          - uid: mondoo-netscaler-security-ldap-action-encrypted
          - uid: mondoo-netscaler-security-ldap-action-validate-server-certificate
          - uid: mondoo-netscaler-security-radius-action-message-authenticator
          - uid: mondoo-netscaler-security-saml-action-reject-unsigned-assertions
          - uid: mondoo-netscaler-security-saml-action-sha2-signatures
          - uid: mondoo-netscaler-security-saml-idp-reject-unsigned-requests
          - uid: mondoo-netscaler-security-saml-idp-acs-url-restricted
          - uid: mondoo-netscaler-security-saml-idp-sha2-signatures
          - uid: mondoo-netscaler-security-gateway-account-lockout
          - uid: mondoo-netscaler-security-aaa-vserver-account-lockout
          - uid: mondoo-netscaler-security-gateway-hsts-enabled
      - title: TLS
        filters: asset.family.contains("netscaler")
        checks:
          - uid: mondoo-netscaler-security-ssl-vserver-tls12-minimum
          - uid: mondoo-netscaler-security-ssl-secure-renegotiation
          - uid: mondoo-netscaler-security-ssl-certificates-not-expired
          - uid: mondoo-netscaler-security-ssl-certificates-strong-key
          - uid: mondoo-netscaler-security-ssl-certificates-sha2-signature
      - title: Logging and Time
        filters: asset.family.contains("netscaler")
        checks:
          - uid: mondoo-netscaler-security-syslog-remote-server
      # NetScaler CPX takes its time from the container host and rejects every
      # NTP command ("Feature not supported on this platform"), so the NTP
      # checks apply to MPX, VPX, and SDX instances only.
      - title: Time Synchronization
        filters: |
          asset.family.contains("netscaler") &&
          netscaler.system.model != /CPX/
        checks:
          - uid: mondoo-netscaler-security-ntp-servers-configured
          - uid: mondoo-netscaler-security-ntp-sync-enabled
    scoring_system: highest impact
queries:
  # The table follows the NetScaler ADC and Gateway Firmware rows of the Citrix
  # Product Matrix, last checked 2026-11-14. Each date is the end of maintenance,
  # after which a release receives no further code-level fixes. 13.0 and 12.1
  # are past end of life and are absent on purpose.
  - uid: mondoo-netscaler-security-firmware-supported-release
    title: Ensure the firmware release still receives security fixes
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sa-22
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-12-3-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      netscaler.system.release == "14.1" && time.now < parse.date("2029-08-08") ||
        netscaler.system.release == "13.1" && time.now < parse.date("2026-09-15")
    docs:
      desc: |
        This check verifies that the appliance runs a NetScaler firmware release that is still within its maintenance period.

        NetScaler publishes firmware in release lines such as 13.1 and 14.1, and each line has an end-of-maintenance date in the Citrix Product Matrix. After that date the line receives no further code-level maintenance, which includes fixes for newly disclosed vulnerabilities. The check compares the release the appliance reports against the published end-of-maintenance dates and fails for a release past its date or one it does not recognize. A release that is still maintained can still run a vulnerable build, so pair this check with vulnerability scanning of the firmware build.

        **Why this matters**

        NetScaler Gateway and AAA virtual servers face the internet by design, and their vulnerabilities are among the most heavily exploited in the industry. Flaws such as CVE-2019-19781, CVE-2023-3519, CVE-2023-4966, and CVE-2025-5777 were used to gain remote code execution or steal session tokens on unpatched appliances within days of disclosure, and the advisories for them list fixed builds only for release lines that were still maintained.

        An appliance on a release past its end of maintenance cannot be patched for the next advisory. The only fix is a release upgrade, which then has to happen during an active exploitation campaign instead of a planned window.
      audit: |
        ### Audit via the NetScaler GUI

        1. Log in to the NetScaler GUI.
        2. Navigate to **System** and open the **System Information** tab.
        3. Note the release in the **Software Version** field, for example `NS14.1`.
        4. Compare the release with the end-of-maintenance date in the [Citrix Product Matrix](https://www.citrix.com/support/product-lifecycle/product-matrix.html).

        ### Audit via the NetScaler CLI

        1. Connect to the NSIP over SSH and run:

           ```text
           show ns version
           ```

        2. Read the release from the version string, for example `NetScaler NS14.1: Build 73.30.nc`.

        A passing result shows a release whose end-of-maintenance date has not passed. A failing result shows a release past that date, such as 13.0 or 12.1.
      remediation:
        - id: console
          desc: |
            To upgrade to a maintained release using the NetScaler GUI:

            1. Download a current build of a maintained release from the NetScaler downloads site.
            2. Save the running configuration with **Save** in the top bar, and download a backup under **System > Backup and Restore**.
            3. Navigate to **System**, open the **System Information** tab, and select **System Upgrade**.
            4. Choose the build file, select **Upgrade**, and let the appliance reboot.
            5. Confirm the new release on the **System Information** tab.

            **Upgrade the secondary node of a high-availability pair first.** Fail over to it, confirm that traffic flows, then upgrade the former primary so both nodes run the same build.
        - id: cli
          desc: |
            To upgrade to a maintained release using the NetScaler CLI:

            1. Save and back up the configuration:

               ```text
               save ns config
               create system backup pre-upgrade -level full
               ```

            2. Copy the build file to `/var/nsinstall/<build>/` on the appliance with SCP.
            3. Enter the shell and run the installer from that directory:

               ```text
               shell
               cd /var/nsinstall/<build>
               tar -xzvf build-<release>-<build>_nc_64.tgz
               ./installns
               ```

            4. Answer `y` when the installer asks to reboot, then confirm the release with `show ns version`.

            **The appliance stops forwarding traffic while it reboots.** Upgrade the secondary node of a high-availability pair first and fail over before upgrading the primary.
    refs:
      - url: https://www.citrix.com/support/product-lifecycle/product-matrix.html
        title: Citrix Product Matrix
      - url: https://www.citrix.com/support/product-lifecycle/
        title: Citrix Product Lifecycle Support Policy

  - uid: mondoo-netscaler-security-management-telnet-disabled
    title: Ensure Telnet management access is disabled
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-6-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.ipAddresses.where(managementAccess == true).all(telnet == false)
    docs:
      desc: |
        This check verifies that no NetScaler address that accepts management connections offers Telnet.

        Every NetScaler IP address carries its own set of management applications: Telnet, FTP, the GUI, SSH, and SNMP. They take effect on the NSIP and on any subnet IP address with management access enabled, and are set under **System > Network > IPs** in the **Application Access Controls** section. The check examines every address with management access and requires Telnet to be disabled on each.

        **Why this matters**

        Telnet sends the administrator's user name, password, and every command in cleartext. Anyone who can observe the management network, through a compromised host, a mirrored switch port, or an ARP spoofing attack, captures `nsroot` or another superuser credential and gains full control of the appliance, including its TLS private keys and the credentials it stores for LDAP and RADIUS.

        Older releases enable Telnet on the NSIP by default. SSH provides the same CLI with encryption and should be the only remote CLI.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **System > Network > IPs**.
        2. Open the NSIP and every SNIP whose **Management Access** column is enabled.
        3. In **Application Access Controls**, check whether **Telnet** is selected.

        ### Audit via the NetScaler CLI

        1. Run `show ns ip` to list the addresses, then run the following for the NSIP and each SNIP:

           ```text
           show ns ip <ip_address>
           ```

        2. For each address that shows `management access: Enabled`, read the `telnet` value. Use `show ns ip6 <ipv6_address>` for IPv6 addresses.

        A passing result shows `telnet: Disabled` on every address with management access. A failing result shows `telnet: Enabled` on any of them.
      remediation:
        - id: console
          desc: |
            To disable Telnet management access using the NetScaler GUI:

            1. Navigate to **System > Network > IPs**.
            2. Select the NSIP or management SNIP and select **Edit**.
            3. In **Application Access Controls**, clear **Telnet**.
            4. Select **Done**, then **Save** the configuration.
            5. Repeat for every address with management access.
        - id: cli
          desc: |
            To disable Telnet management access using the NetScaler CLI, run the following for the NSIP and every address with management access, then save the configuration:

            ```text
            set ns ip <ip_address> -telnet DISABLED
            save ns config
            ```

            IPv6 addresses, including the link-local address of the NSIP, take the prefix length:

            ```text
            set ns ip6 <ipv6_address>/<prefix_length> -telnet DISABLED
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

  - uid: mondoo-netscaler-security-management-ftp-disabled
    title: Ensure FTP management access is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-6-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.ipAddresses.where(managementAccess == true).all(ftp == false)
    docs:
      desc: |
        This check verifies that no NetScaler address that accepts management connections offers FTP.

        FTP is one of the management applications set per IP address under **System > Network > IPs** in the **Application Access Controls** section. It gives file-level access to the appliance, including `/nsconfig`, where the configuration, certificates, and private keys are stored. The check examines the NSIP and every subnet IP address with management access and requires FTP to be disabled on each.

        **Why this matters**

        FTP authenticates with the administrator's password in cleartext and transfers files unencrypted. An attacker on the management network captures the credential and can then read or replace `ns.conf`, the TLS private keys under `/nsconfig/ssl`, and the license files, or upload a modified configuration that takes effect at the next reboot.

        SCP and SFTP over SSH cover every file transfer task FTP does, with encryption.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **System > Network > IPs**.
        2. Open the NSIP and every SNIP whose **Management Access** column is enabled.
        3. In **Application Access Controls**, check whether **FTP** is selected.

        ### Audit via the NetScaler CLI

        1. Run `show ns ip` to list the addresses, then run the following for the NSIP and each SNIP:

           ```text
           show ns ip <ip_address>
           ```

        2. For each address that shows `management access: Enabled`, read the `ftp` value. Use `show ns ip6 <ipv6_address>` for IPv6 addresses.

        A passing result shows `ftp: Disabled` on every address with management access. A failing result shows `ftp: Enabled` on any of them.
      remediation:
        - id: console
          desc: |
            To disable FTP management access using the NetScaler GUI:

            1. Navigate to **System > Network > IPs**.
            2. Select the NSIP or management SNIP and select **Edit**.
            3. In **Application Access Controls**, clear **FTP**.
            4. Select **Done**, then **Save** the configuration.
            5. Repeat for every address with management access.
        - id: cli
          desc: |
            To disable FTP management access using the NetScaler CLI, run the following for the NSIP and every address with management access, then save the configuration:

            ```text
            set ns ip <ip_address> -ftp DISABLED
            save ns config
            ```

            IPv6 addresses, including the link-local address of the NSIP, take the prefix length:

            ```text
            set ns ip6 <ipv6_address>/<prefix_length> -ftp DISABLED
            ```

            Transfer files with SCP or SFTP over SSH instead.
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

  - uid: mondoo-netscaler-security-management-gui-https-only
    title: Ensure the management GUI is reachable over HTTPS only
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-7
      compliance/soc2-2017: soc2-control-cc6-6-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.ipAddresses.where(managementAccess == true).all(gui == "SECUREONLY" || gui == "DISABLED")
    docs:
      desc: |
        This check verifies that the NetScaler GUI and NITRO API cannot be reached over cleartext HTTP on any management address.

        The **GUI** setting of each NetScaler IP address takes three values: **Enabled** serves the GUI and the NITRO API over both HTTP and HTTPS, **Secure only** serves them over HTTPS only, and **Disabled** turns them off. The check examines the NSIP and every subnet IP address with management access and requires **Secure only** or **Disabled** on each.

        **Why this matters**

        With HTTP allowed, a browser session or NITRO API client that connects to port 80 sends the administrator's credentials and session cookie in cleartext. Automation that talks to NITRO is the usual culprit, because a script pointed at `http://` keeps working and nobody notices. An attacker on the path captures the credential or the session and has the same control over the appliance as the administrator.

        The factory setting on the NSIP is **Enabled**, so this check fails on an appliance that was never hardened.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **System > Network > IPs**.
        2. Open the NSIP and every SNIP whose **Management Access** column is enabled.
        3. In **Application Access Controls**, read the **GUI** setting.

        ### Audit via the NetScaler CLI

        1. Run `show ns ip` to list the addresses, then run the following for the NSIP and each SNIP:

           ```text
           show ns ip <ip_address>
           ```

        2. For each address that shows `management access: Enabled`, read the `gui` value. Use `show ns ip6 <ipv6_address>` for IPv6 addresses.

        A passing result shows `gui: SecureOnly` or `gui: Disabled` on every address with management access. A failing result shows `gui: Enabled` on any of them.
      remediation:
        - id: console
          desc: |
            To restrict the GUI to HTTPS using the NetScaler GUI:

            1. Navigate to **System > Network > IPs**.
            2. Select the NSIP or management SNIP and select **Edit**.
            3. In **Application Access Controls**, set **GUI** to **Secure only**.
            4. Select **Done**, then **Save** the configuration.
            5. Repeat for every address with management access, and reconnect to the GUI with `https://`.
        - id: cli
          desc: |
            To restrict the GUI and NITRO API to HTTPS using the NetScaler CLI, run the following for the NSIP and every address with management access, then save the configuration:

            ```text
            set ns ip <ip_address> -gui SECUREONLY
            save ns config
            ```

            IPv6 addresses, including the link-local address of the NSIP, take the prefix length:

            ```text
            set ns ip6 <ipv6_address>/<prefix_length> -gui SECUREONLY
            ```

            **Point every NITRO client at `https://` before making the change.** Clients that still use `http://` stop working once it takes effect.
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

  - uid: mondoo-netscaler-security-vip-management-access-disabled
    title: Ensure management access is disabled on virtual server addresses
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      netscaler.ipAddresses.where(type == "VIP").all(managementAccess == false)
    docs:
      desc: |
        This check verifies that no virtual IP address of the appliance accepts management connections.

        A virtual IP address, or VIP, is the address that clients reach a load-balancing, content-switching, Gateway, or AAA virtual server on. NetScaler lets management access be enabled on any address, including a VIP. The check requires **Management Access** to be disabled on every VIP so that the GUI, NITRO API, SSH, and SNMP are offered only on the NSIP or a dedicated management SNIP.

        **Why this matters**

        VIPs are the addresses the appliance publishes to its users, often to the whole internet. Management access on a VIP puts the administrative login and the NITRO API on that same address, in front of every client and every scanner. Several NetScaler advisories, such as CVE-2020-8193 and CVE-2020-8195, affected the management interface and were exploitable only by an attacker who could reach it.

        Keep management on a separate network that only administrators and monitoring systems can reach.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **System > Network > IPs**.
        2. Filter the list on the **Type** `Virtual IP`.
        3. Read the **Management Access** column.

        ### Audit via the NetScaler CLI

        1. Run `show ns ip` and note every address of type `VIP`.
        2. Run the following for each of them and read `management access`:

           ```text
           show ns ip <vip_address>
           ```

        A passing result shows `management access: Disabled` on every VIP. A failing result shows `Enabled` on any VIP.
      remediation:
        - id: console
          desc: |
            To disable management access on a VIP using the NetScaler GUI:

            1. Navigate to **System > Network > IPs**.
            2. Select the VIP and select **Edit**.
            3. In **Application Access Controls**, clear **Enable Management Access control to support the below listed applications**.
            4. Select **Done**, then **Save** the configuration.
        - id: cli
          desc: |
            To disable management access on a VIP using the NetScaler CLI, run the following for each VIP, then save the configuration:

            ```text
            set ns ip <vip_address> -mgmtAccess DISABLED
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

  - uid: mondoo-netscaler-security-password-complexity-enabled
    title: Ensure strong password requirements are enforced for system users
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      netscaler.systemParameters.strongPassword == "enableall" ||
        netscaler.systemParameters.strongPassword == "enablelocal"
    docs:
      desc: |
        This check verifies that NetScaler enforces password complexity for its management accounts.

        The **Strong Password** system setting makes NetScaler reject passwords that lack lowercase letters, uppercase letters, digits, or special characters. It takes three values: `enableall` applies the rule to every password and secret the appliance stores, `enablelocal` applies it to local passwords and exempts a list of object types, and `disabled` turns it off. The check requires `enableall` or `enablelocal`. The factory setting is `disabled`.

        **Why this matters**

        Without the requirement an administrator can set a password such as `nsroot1` or a single dictionary word. NetScaler management interfaces are reached over SSH and HTTPS from wherever the NSIP is routable, and password spraying against exposed management interfaces is a routine first step for attackers who target perimeter appliances. A superuser account with a guessable password gives full control of the appliance.

        Pair complexity with a minimum length, because a complex but short password is still short.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **System > Settings > Change Global System Settings**.
        2. Read the **Strong Password** setting.

        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show system parameter
           ```

        2. Read the `Strongpassword` value.

        A passing result shows `enableall` or `enablelocal`. A failing result shows `disabled`.
      remediation:
        - id: console
          desc: |
            To enforce strong passwords using the NetScaler GUI:

            1. Navigate to **System > Settings > Change Global System Settings**.
            2. Set **Strong Password** to **Enable All**.
            3. Select **OK**, then **Save** the configuration.
        - id: cli
          desc: |
            To enforce strong passwords using the NetScaler CLI:

            ```text
            set system parameter -strongpassword enableall
            save ns config
            ```

            **The rule applies when a password is next set, not to existing passwords.** Change the passwords of existing accounts after enabling it.
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts
      - url: https://docs.netscaler.com/en-us/citrix-adc/current-release/system/authentication-and-authorization-for-system-user/user-account-and-password-management
        title: User account and password management

  - uid: mondoo-netscaler-security-password-minimum-length
    title: Ensure system user passwords are at least 14 characters long
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      netscaler.systemParameters.minPasswordLength >= 14
    docs:
      desc: |
        This check verifies that NetScaler requires management passwords of at least 14 characters.

        The **Min Password Length** system setting sets the shortest password NetScaler accepts for a system user. The factory value is 1 with strong passwords disabled and 8 with them enabled, and turning strong passwords off resets the setting to 1. The check requires 14 or more.

        **Why this matters**

        Length is the main factor in how long an offline guessing attack takes. NetScaler configuration backups and `ns.conf` copies circulate in support bundles, ticket attachments, and configuration management repositories, and every system user's password hash travels with them. A short password falls to an offline attack on a single stolen backup, and the result is a working superuser credential for the appliance.

        Fourteen characters puts an offline attack out of practical reach while remaining usable for passphrases.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **System > Settings > Change Global System Settings**.
        2. Read the **Min Password Length** setting.

        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show system parameter
           ```

        2. Read the `Minpasswordlen` value.

        A passing result shows 14 or more. A failing result shows a lower value.
      remediation:
        - id: console
          desc: |
            To require passwords of at least 14 characters using the NetScaler GUI:

            1. Navigate to **System > Settings > Change Global System Settings**.
            2. Set **Min Password Length** to `14` or more.
            3. Select **OK**, then **Save** the configuration.
        - id: cli
          desc: |
            To require passwords of at least 14 characters using the NetScaler CLI:

            ```text
            set system parameter -strongpassword enableall -minpasswordlen 14
            save ns config
            ```

            The new length applies when a password is next set. Change existing passwords that are shorter.

            **Setting `-strongpassword disabled` resets the minimum length to 1.** Keep strong passwords enabled so the length holds.
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

  - uid: mondoo-netscaler-security-password-history-enabled
    title: Ensure system users cannot reuse their recent passwords
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-7
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      netscaler.systemParameters.passwordHistoryControl == true &&
        netscaler.systemParameters.passwordHistoryCount >= 4
    docs:
      desc: |
        This check verifies that NetScaler prevents system users from reusing recent passwords.

        The **Password History Control** system setting makes NetScaler remember a number of previous passwords for each system user and reject a new password that matches one of them. The check requires the setting to be enabled with a history of at least four passwords. Releases that do not offer the setting, such as 13.1, fail this check.

        **Why this matters**

        When a password has to be changed because it leaked or was shared, history control stops the user from switching back to the same value a moment later. Without it a credential that an attacker already holds can quietly return to service after every rotation, and the rotation achieves nothing.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show system parameter
           ```

        2. Read the `Passwordhistorycontrol` and `Pwdhistorycount` values.

        A passing result shows `Passwordhistorycontrol: ENABLED` and a `Pwdhistorycount` of 4 or more. A failing result shows `DISABLED`, a lower count, or neither value because the release lacks the setting.
      remediation:
        - id: console
          desc: |
            To enable password history using the NetScaler GUI:

            1. Navigate to **System > Settings > Change Global System Settings**.
            2. Enable **Password History Control** and set the number of remembered passwords to `4` or more.
            3. Select **OK**, then **Save** the configuration.
        - id: cli
          desc: |
            To enable password history using the NetScaler CLI:

            ```text
            set system parameter -passwordhistorycontrol ENABLED -pwdhistoryCount 6
            save ns config
            ```

            On a release without the setting, upgrade to 14.1 first.
    refs:
      - url: https://docs.netscaler.com/en-us/citrix-adc/current-release/system/authentication-and-authorization-for-system-user/user-account-and-password-management
        title: User account and password management

  - uid: mondoo-netscaler-security-force-default-password-change
    title: Ensure the default nsroot password must be changed at first logon
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-2
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      netscaler.systemParameters.forcePasswordChange == true
    docs:
      desc: |
        This check verifies that NetScaler forces the `nsroot` administrator to replace the default password at first logon.

        Every NetScaler ships with the superuser account `nsroot`, which cannot be deleted. The **Force Password Change** system setting makes the appliance refuse management access with the default `nsroot` password until a new one is set. The check requires the setting to be enabled.

        **Why this matters**

        The default `nsroot` password is public, and on several platforms it is predictable from information such as the instance ID. An appliance that is rebuilt, reset, or restored from a template comes up with that password, and without this setting it accepts logons with it indefinitely. Automated scanners try vendor default credentials against every management interface they find.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show system parameter
           ```

        2. Read the `ForcePasswordChange` value.

        A passing result shows `ENABLED`. A failing result shows `DISABLED`.
      remediation:
        - id: console
          desc: |
            To force a change of the default password using the NetScaler GUI:

            1. Navigate to **System > Settings > Change Global System Settings**.
            2. Enable **Force Password Change**.
            3. Select **OK**, then **Save** the configuration.
        - id: cli
          desc: |
            To force a change of the default password using the NetScaler CLI:

            ```text
            set system parameter -forcePasswordChange ENABLED
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

  - uid: mondoo-netscaler-security-management-session-timeout
    title: Ensure idle management sessions time out within 15 minutes
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iii-access-control-automatic-logoff
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-11
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-8
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      netscaler.systemParameters.timeout > 0 && netscaler.systemParameters.timeout <= 900
      netscaler.systemUsers.all(timeout > 0 && timeout <= 900)
    docs:
      desc: |
        This check verifies that idle management sessions on the appliance end within 15 minutes.

        NetScaler applies an idle timeout to CLI, GUI, and NITRO sessions. A timeout set on a system user takes precedence over one set on its group, which takes precedence over the global setting. The check requires the global timeout and the effective timeout of every system user to be between 1 and 900 seconds. A value of 0 means sessions never expire.

        **Why this matters**

        An unattended management session is a logged-in superuser for anyone who reaches the administrator's workstation or hijacks the session cookie. The longer a session stays valid after the administrator walks away, the longer that window stays open. A timeout set on one user overrides the global value, so a single account with timeouts disabled undoes the global setting for exactly that user.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show system parameter
           ```

        2. Read the `Timeout` value.
        3. Run the following for each system user and read its `Timeout` value:

           ```text
           show system user <username>
           ```

        A passing result shows values between 1 and 900 everywhere. A failing result shows 0 or a value above 900 for the global setting or any user.
      remediation:
        - id: console
          desc: |
            To set a 15-minute idle timeout using the NetScaler GUI:

            1. Navigate to **System > Settings > Change Global System Settings** and set the CLI session timeout to `900` or less.
            2. Navigate to **System > User Administration > Users**, and for each user with its own timeout, set **CLI Session Timeout** to `900` or less.
            3. Repeat for groups under **System > User Administration > Groups**.
            4. **Save** the configuration.
        - id: cli
          desc: |
            To set a 15-minute idle timeout using the NetScaler CLI:

            ```text
            set system parameter -timeout 900 -restrictedtimeout ENABLED
            set system user <username> -timeout 900
            set system group <groupname> -timeout 900
            save ns config
            ```

            Restricted timeout keeps any later timeout between 5 minutes and 1 day, so it cannot be set to 0 again.
    refs:
      - url: https://docs.netscaler.com/us/en/netscaler-adc-secure-deployment/netscaler-adc-secure-deployment/administration-and-management/system-and-user-accounts.html
        title: System and user accounts

  - uid: mondoo-netscaler-security-ldap-action-encrypted
    title: Ensure LDAP authentication servers are reached over TLS
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-6-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.ldapActions.all(securityType == "SSL" || securityType == "TLS")
    docs:
      desc: |
        This check verifies that every LDAP authentication action encrypts its connection to the directory.

        An LDAP action defines a directory server that NetScaler Gateway, AAA virtual servers, or system users authenticate against. Its **Security Type** is `PLAINTEXT`, `TLS` for StartTLS, or `SSL` for LDAPS. The check requires `SSL` or `TLS` on every LDAP action. The factory value is `PLAINTEXT`.

        **Why this matters**

        To authenticate a user, NetScaler binds to the directory with the user's own password, after binding with its service account to look the user up. Over a plaintext connection every Gateway logon sends a domain password across the network in cleartext, along with the service account's bind password. An attacker on any segment between the appliance and the domain controller collects domain credentials for every remote user who signs in.

        An action used only to extract attributes still sends the bind password, so it is held to the same rule.
      audit: |
        ### Audit via the NetScaler GUI

        1. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > Actions > LDAP**.
        2. Read the **Security Type** column.

        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show authentication ldapAction
           ```

        2. Read the `Secure Type` of each action.

        A passing result shows `SSL` or `TLS` for every action. A failing result shows `PLAINTEXT` for any action.
      remediation:
        - id: console
          desc: |
            To encrypt LDAP connections using the NetScaler GUI:

            1. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > Actions > LDAP**.
            2. Select the action and select **Edit**.
            3. Set **Security Type** to **SSL** and **Port** to `636`, or **Security Type** to **TLS** to keep port `389` with StartTLS.
            4. Select **Test LDAP Reachability**, then **OK**, and **Save** the configuration.
        - id: cli
          desc: |
            To encrypt LDAP connections using the NetScaler CLI:

            ```text
            set authentication ldapAction <action_name> -secType SSL -serverPort 636
            save ns config
            ```

            The directory server must present a certificate for LDAPS or StartTLS to succeed. Enable certificate validation on the action as well.
    refs:
      - url: https://docs.netscaler.com/en-us/citrix-adc/current-release/aaa-tm/authentication-methods/citrix-adc-aaa-ldap-authentication-policies
        title: LDAP authentication

  - uid: mondoo-netscaler-security-ldap-action-validate-server-certificate
    title: Ensure LDAP authentication servers present a validated certificate
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-i-transmission-security-integrity-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-23
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-6-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      netscaler.ldapActions.where(securityType == "SSL" || securityType == "TLS").all(validateServerCertificate == true)
    docs:
      desc: |
        This check verifies that NetScaler validates the certificate of every directory server it reaches over LDAPS or StartTLS.

        The **Validate LDAP Server Certificate** option of an LDAP action makes NetScaler check that the directory server's certificate chains to a trusted CA and matches the host name in **LDAP Host Name**. The check examines every LDAP action whose security type is `SSL` or `TLS` and requires the option to be enabled. The factory value is disabled. Actions that do not encrypt at all fail the companion check on LDAP encryption.

        **Why this matters**

        Encryption without server authentication stops a passive eavesdropper but not an active one. An attacker who can redirect the appliance's LDAP traffic, through DNS poisoning, ARP spoofing, or a rogue route, presents any certificate, terminates the TLS session, and receives the user and service account passwords in the clear. With validation disabled the appliance accepts that certificate without complaint.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show authentication ldapAction
           ```

        2. For each action with `Secure Type` `SSL` or `TLS`, read `Validate LDAP Server Certificate`.

        A passing result shows `YES` on every encrypted action. A failing result shows `NO` on any of them.
      remediation:
        - id: console
          desc: |
            To validate LDAP server certificates using the NetScaler GUI:

            1. Install the CA certificate that issued the directory server's certificate under **Traffic Management > SSL > Certificates > CA Certificates**.
            2. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > Actions > LDAP**.
            3. Select the action and select **Edit**.
            4. Select **Validate LDAP Server Certificate** and enter the server's name in **LDAP Host Name**.
            5. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To validate LDAP server certificates using the NetScaler CLI:

            ```text
            set authentication ldapAction <action_name> -validateServerCert YES -ldapHostname <directory_fqdn>
            save ns config
            ```

            The name in `-ldapHostname` must match the certificate the directory server presents, or every logon through the action fails.
    refs:
      - url: https://docs.netscaler.com/en-us/citrix-adc/current-release/aaa-tm/authentication-methods/citrix-adc-aaa-ldap-authentication-policies
        title: LDAP authentication

  - uid: mondoo-netscaler-security-radius-action-message-authenticator
    title: Ensure RADIUS authentication is protected against response forgery
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-23
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      netscaler.radiusActions.all(messageAuthenticator == true || transport == "TLS")
    docs:
      desc: |
        This check verifies that every RADIUS authentication action is protected against the BlastRADIUS response forgery attack.

        A RADIUS action defines a RADIUS server that users authenticate against, often for a second factor at the Gateway. Two settings protect it: the **Message Authenticator** option adds the Message-Authenticator attribute to every Access-Request, and a **Transport** of `TLS` wraps the whole exchange in TLS. The check requires one of the two on every RADIUS action. Message Authenticator is available and on by default from 14.1 build 43. RADIUS over TLS is available on 13.1 and later and runs through a load-balancing virtual server.

        **Why this matters**

        CVE-2024-3596, known as BlastRADIUS, lets an attacker between NetScaler and the RADIUS server turn an Access-Reject into a valid Access-Accept by exploiting an MD5 collision in the response authenticator. Against a Gateway that uses RADIUS for its second factor, the attacker passes the MFA prompt without the token. The Message-Authenticator attribute and TLS transport both remove the forgery path.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show authentication radiusAction
           ```

        2. Read the `Message Authenticator` and `Transport` values of each action.

        A passing result shows `Message Authenticator: ON` or `Transport: TLS` for every action. A failing result shows neither for any action, including on a release that does not offer the Message Authenticator option.
      remediation:
        - id: console
          desc: |
            To protect RADIUS authentication using the NetScaler GUI:

            1. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > Actions > RADIUS**.
            2. Select the action and select **Edit**.
            3. Select **Message Authenticator**. On a release without the option, set **Transport** to **TLS** with a target load-balancing virtual server that reaches the RADIUS server.
            4. Select **OK** and **Save** the configuration.

            Configure the RADIUS server to require the Message-Authenticator attribute as well, so it rejects requests without one.
        - id: cli
          desc: |
            To protect RADIUS authentication using the NetScaler CLI on 14.1, enable the Message-Authenticator attribute:

            ```text
            set authentication radiusAction <action_name> -messageAuthenticator ON
            save ns config
            ```

            Releases without the option, such as 13.1, need RADIUS over TLS instead. NetScaler sends RADIUS over TLS through a load-balancing virtual server that reaches the RADIUS server, and the action then references it with `-transport TLS` and `-targetLBVserver`. RADIUS accounting is not available over TLS. Follow the RADIUS over TLS section of the NetScaler documentation for the virtual server setup, or upgrade to 14.1 and enable the Message-Authenticator attribute.
    refs:
      - url: https://docs.netscaler.com/en-us/citrix-adc/current-release/aaa-tm/authentication-methods/citrix-adc-aaa-radius-authentication-policy.html
        title: RADIUS authentication

  - uid: mondoo-netscaler-security-saml-action-reject-unsigned-assertions
    title: Ensure SAML service provider actions reject unsigned assertions
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      netscaler.samlActions.all(rejectUnsignedAssertion == "ON" || rejectUnsignedAssertion == "STRICT")
    docs:
      desc: |
        This check verifies that NetScaler, acting as a SAML service provider, accepts only signed assertions from the identity provider.

        A SAML action delegates authentication to an external identity provider. Its **Reject Unsigned Assertion** option takes `ON`, which requires the assertion to be signed, `STRICT`, which additionally requires the signature to cover the whole response, or `OFF`, which accepts unsigned assertions. The check requires `ON` or `STRICT` on every SAML action.

        **Why this matters**

        The signature is the only thing that ties an assertion to the identity provider. With unsigned assertions accepted, anyone who reaches the Gateway or AAA logon page posts a hand-written SAML response naming any user, and NetScaler logs them in as that user. No password, MFA token, or access to the identity provider is needed.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show authentication samlAction
           ```

        2. Read `Reject unsigned assertion` for each action.

        A passing result shows `ON` or `STRICT` for every action. A failing result shows `OFF` for any action.
      remediation:
        - id: console
          desc: |
            To reject unsigned SAML assertions using the NetScaler GUI:

            1. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > Actions > SAML**.
            2. Select the action and select **Edit**.
            3. Set **Reject Unsigned Assertion** to **ON** or **STRICT**.
            4. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To reject unsigned SAML assertions using the NetScaler CLI:

            ```text
            set authentication samlAction <action_name> -samlRejectUnsignedAssertion STRICT
            save ns config
            ```

            Use `ON` instead of `STRICT` if the identity provider signs the assertion but not the response.
    refs:
      - url: https://docs.netscaler.com/us/en/citrix-adc/current-release/aaa-tm/authentication-methods/saml-authentication/citrix-adc-saml-idp.html
        title: NetScaler as a SAML IdP

  - uid: mondoo-netscaler-security-saml-action-sha2-signatures
    title: Ensure SAML service provider actions use SHA-2 signatures
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-11
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      netscaler.samlActions.all(signatureAlgorithm == /^RSA-SHA(256|384|512)$/ && digestMethod == /^SHA(256|384|512)$/)
    docs:
      desc: |
        This check verifies that SAML exchanges between NetScaler and the identity provider are signed with a SHA-2 algorithm.

        Each SAML action sets a **Signature Algorithm** and a **Digest Method** for the messages it signs and the signatures it verifies. NetScaler offers RSA-SHA1 and SHA1 alongside the SHA-2 options. The check requires a SHA-2 signature algorithm and digest method on every SAML action.

        **Why this matters**

        SHA-1 is broken for collision resistance, and chosen-prefix collisions against it are practical. A signature scheme built on a collision-prone hash lets an attacker who can get one document signed produce a second document that verifies under the same signature, which for SAML means a forged assertion or request the other side accepts as genuine.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show authentication samlAction
           ```

        2. Read `Signature Method` and `Digest Method` for each action.

        A passing result shows `RSA-SHA256` and `SHA256`, or a stronger SHA-2 pair, for every action. A failing result shows `RSA-SHA1` or `SHA1` for any action.
      remediation:
        - id: console
          desc: |
            To use SHA-2 SAML signatures using the NetScaler GUI:

            1. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > Actions > SAML**.
            2. Select the action and select **Edit**.
            3. Set **Signature Algorithm** to **RSA-SHA256** and **Digest Method** to **SHA256**.
            4. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To use SHA-2 SAML signatures using the NetScaler CLI:

            ```text
            set authentication samlAction <action_name> -signatureAlg RSA-SHA256 -digestMethod SHA256
            save ns config
            ```

            The identity provider must use the same algorithms. Change both sides in the same window.
    refs:
      - url: https://docs.netscaler.com/us/en/citrix-adc/current-release/aaa-tm/authentication-methods/saml-authentication/citrix-adc-saml-idp.html
        title: NetScaler as a SAML IdP

  - uid: mondoo-netscaler-security-saml-idp-reject-unsigned-requests
    title: Ensure SAML identity provider profiles reject unsigned requests
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      netscaler.samlIdpProfiles.all(rejectUnsignedRequests == true)
    docs:
      desc: |
        This check verifies that NetScaler, acting as a SAML identity provider, accepts authentication requests only when the service provider signed them.

        A SAML IdP profile makes NetScaler issue assertions to another application. Its **Reject Unsigned Requests** option makes NetScaler verify the service provider's signature on each authentication request, using the certificate in **SP Certificate Name**, and refuse requests without one. The check requires the option on every IdP profile.

        **Why this matters**

        An unsigned request can name any assertion consumer service URL and any parameters, and NetScaler cannot tell a genuine request from one an attacker built. Combined with a loose ACS URL rule, a crafted request makes NetScaler send a signed assertion for the logged-on user to an address the attacker controls, where it is replayed to the real application.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show authentication samlIdPProfile
           ```

        2. Read `Reject Unsigned Requests` for each profile.

        A passing result shows `ON` for every profile. A failing result shows `OFF` for any profile.
      remediation:
        - id: console
          desc: |
            To reject unsigned SAML requests using the NetScaler GUI:

            1. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > SAML IDP**, and open the **Profiles** tab.
            2. Select the profile and select **Edit**.
            3. Select **Reject Unsigned Requests** and choose the service provider's signing certificate in **SP Certificate Name**.
            4. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To reject unsigned SAML requests using the NetScaler CLI:

            ```text
            set authentication samlIdPProfile <profile_name> -rejectUnsignedRequests ON -samlSPCertName <sp_certificate>
            save ns config
            ```
    refs:
      - url: https://docs.netscaler.com/us/en/citrix-adc/current-release/aaa-tm/authentication-methods/saml-authentication/citrix-adc-saml-idp.html
        title: NetScaler as a SAML IdP

  - uid: mondoo-netscaler-security-saml-idp-acs-url-restricted
    title: Ensure SAML identity provider profiles restrict the ACS URL
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      netscaler.samlIdpProfiles.all(acsUrlRule != empty && acsUrlRule != /^\s*true\s*$/i)
    docs:
      desc: |
        This check verifies that every SAML identity provider profile limits where NetScaler sends the assertions it issues.

        The **ACS URL Rule** of a SAML IdP profile is an expression that the assertion consumer service URL in each incoming request must satisfy. When it is empty, NetScaler sends the assertion to whatever URL the request names. The check requires every IdP profile to carry a rule other than an empty one or `true`.

        **Why this matters**

        A signed assertion is a bearer token for the user's session at the service provider. If the identity provider sends it wherever the request asks, an attacker sends a victim a link to the NetScaler IdP with a request pointing at the attacker's server. The victim's browser, already signed in, delivers a valid assertion to the attacker, who replays it to the real application as the victim.

        The rule is only as strong as its expression. Anchor it to the full URL, for example `AAA.LOGIN.SAML_REQ_ACS_URL.REGEX_MATCH(re#^https://app.example.com/saml/acs$#)`, so that a prefix or suffix cannot slip through.
      audit: |
        ### Audit via the NetScaler CLI

        1. Run:

           ```text
           show authentication samlIdPProfile
           ```

        2. Read `ACS URL Rule` for each profile.

        A passing result shows an expression that matches only the service provider's ACS URLs. A failing result shows an empty rule or `true`.
      remediation:
        - id: console
          desc: |
            To restrict the ACS URL using the NetScaler GUI:

            1. Navigate to **Security > AAA - Application Traffic > Policies > Authentication > Advanced Policies > SAML IDP**, and open the **Profiles** tab.
            2. Select the profile and select **Edit**.
            3. In **ACS URL Rule**, enter an expression anchored to the service provider's full ACS URL.
            4. Select **OK** and **Save** the configuration.
        - id: cli
          desc: |
            To restrict the ACS URL using the NetScaler CLI:

            ```text
            set authentication samlIdPProfile <profile_name> -acsUrlRule "AAA.LOGIN.SAML_REQ_ACS_URL.REGEX_MATCH(re#^https://app.example.com/saml/acs$#)"
            save ns config
            ```

            Replace the URL with the service provider's ACS URL. Keep the `^` and `$` anchors so nothing can be added before or after it.
    refs:
      - url: https://docs.netscaler.com/us/en/citrix-adc/current-release/aaa-tm/authentication-methods/saml-authentication/citrix-adc-saml-idp.html
        title: NetScaler as a SAML IdP

