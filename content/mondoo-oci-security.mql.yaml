  - uid: mondoo-oci-security-certificates-auto-renewal-enabled
    title: Ensure managed certificates have auto-renewal enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-oci-security-certificates-auto-renewal-enabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-certificates-auto-renewal-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-certificates-auto-renewal-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-certificates-auto-renewal-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every active certificate issued by an internal certificate authority in the OCI Certificates service renews itself automatically through an attached renewal rule.

        A certificate can carry a rule of type `CERTIFICATE_RENEWAL_RULE`, which tells the service to issue a new version on a defined interval and an advance window before the current version expires. No such rule is attached when a certificate is created, so automatic renewal is something you turn on rather than something you inherit. Imported certificates cannot renew through the service, since the issuing authority sits outside OCI, and the check excludes them. Attach the rule under Identity & Security > Certificates in the Console or with `oci certs-mgmt certificate update`.

        **Why this matters**

        Without a rule, renewal is a calendar entry. It depends on a reminder someone set, a ticket due date, and a person still in the role when it fires. Personnel changes, holiday schedules, and oncall handoff gaps break all three, and the failure stays silent until every service depending on the certificate fails its handshake in the same instant.

        The recovery is worse than the outage. Operators restoring service under pressure routinely disable certificate verification in the affected clients to get traffic flowing, and that setting outlives the incident by months.

        Manual renewal also opens a window that automation does not. Cutting over by hand means someone places new certificate material into production out of band, and anyone with influence over that process can substitute a certificate of their own without the swap looking unusual. Automated renewal issues a new version from the same authority under the same rule while the current one is still valid, which is both harder to subvert and visible in the service's own record.

        A rule finally makes the renewal interval a declared value rather than a consequence of who was available. The certificate lifetime the organization intended is the lifetime it gets, and it is auditable as configuration.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** in the OCI Console and navigate to **Certificates** -> **Certificates**.
        2. Filter for internally-issued certificates (config type **Issued by Internal CA**).
        3. Select each certificate and open the **Rules** tab.
        4. Verify that a **Certificate Renewal Rule** is present in the rules list.

        A passing certificate shows at least one **Certificate Renewal Rule** on the Rules tab. A failing certificate has no renewal rule configured.

        ### Audit via CLI

        1. List active internally-issued certificates and check whether auto-renewal is enabled on each:

        ```bash
        oci certs-mgmt certificate list \
          --compartment-id <compartment-ocid> \
          --lifecycle-state ACTIVE \
          --query 'data.items[*].{name:name, configType:"config-type", certificateRules:"certificate-rules"}' \
          --output json
        ```

        A passing certificate of config type `ISSUED_BY_INTERNAL_CA` shows a `certificateRules` array that contains an entry with `ruleType` equal to `CERTIFICATE_RENEWAL_RULE`. A failing certificate shows an empty `certificateRules` array or a value of `null`.
      remediation:
        - id: console
          desc: |
            Add a renewal rule to internally-issued certificates that lack one:

            1. Open **Identity & Security** → **Certificates** → **Certificates** → select the certificate.
            2. Open **Rules** → **Add Rule**.
            3. Pick **Certificate Renewal Rule**, set **Renewal interval** (e.g. `P365D`), and set **Advance renewal period** (e.g. `P30D`).
            4. Save. Future renewals trigger automatically inside the advance-renewal window.
        - id: cli
          desc: |
            Add a renewal rule to an existing internally-issued certificate:

            ```bash
            oci certs-mgmt certificate update \
              --certificate-id <certificate-ocid> \
              --certificate-rules '[{"ruleType":"CERTIFICATE_RENEWAL_RULE","advanceRenewalPeriod":"P30D","renewalInterval":"P365D"}]'
            ```
        - id: terraform
          desc: |
            Declare a `certificate_rules` block with `rule_type = "CERTIFICATE_RENEWAL_RULE"` on every internally-issued certificate:

            ```hcl
            resource "oci_certificates_management_certificate" "app" {
              compartment_id = var.compartment_ocid
              name           = "app-tls-cert"

              certificate_config {
                config_type                     = "ISSUED_BY_INTERNAL_CA"
                issuer_certificate_authority_id = oci_certificates_management_certificate_authority.internal.id
                key_algorithm                   = "RSA2048"
                signature_algorithm             = "SHA256_WITH_RSA"

                subject {
                  common_name = "app.example.com"
                }
              }

              certificate_rules {
                rule_type              = "CERTIFICATE_RENEWAL_RULE"
                advance_renewal_period = "P30D"
                renewal_interval       = "P365D"
              }
            }
            ```
