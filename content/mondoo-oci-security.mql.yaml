        values.ingress_security_rules.where(_['source'] == "0.0.0.0/0" && _['protocol'] == "17").none(_['udp_options'] == empty)
      )
  - uid: mondoo-oci-security-vcn-no-stateless-ingress-from-internet
    title: Ensure VCN security lists have no stateless rules from internet
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-stateless-ingress-from-internet-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/icon: oci
      - uid: mondoo-oci-security-vcn-no-stateless-ingress-from-internet-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-stateless-ingress-from-internet-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-stateless-ingress-from-internet-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that internet-facing ingress relies on stateful connection tracking rather than stateless packet matching.

        Security list rules in OCI are stateful by default: traffic allowed inbound has its return traffic permitted automatically, and the reverse holds for egress. Marking a rule stateless turns that off, and each packet is then matched on its own against the rule set with no memory of the connection it belongs to. The check requires that no ingress rule whose source is `0.0.0.0/0` carries `isStateless: true`. The flag is a checkbox in the Console rule editor and a field in the payload of `oci network security-list update`.

        **Why this matters**

        A stateless internet-facing rule admits packets with no notion of whether they belong to a session anyone established. Crafted packets that claim to be mid-connection are matched on their headers alone, and the connection-tracking layer that would have discarded them is not there to do it.

        The knock-on effect is usually the larger one. Return traffic for a stateless rule needs its own matching egress rule, and when the return path breaks the fastest fix is a wide outbound allowance. The stateless ingress rule that looked narrow ends up paired with an egress rule that is not.

        These rules also hide well. The stateless setting is one checkbox in the Console and one field in a CLI response, so a reviewer scanning security lists sees a rule with a specific protocol and port and no reason to look further, while that rule is bypassing connection tracking entirely.

        Reserve stateless rules for high-throughput internal paths where per-instance connection-tracking limits are a documented and measured constraint, never for anything sourced from the internet. In Terraform the same flag is spelled `stateless`, and writing `stateless = false` explicitly on ingress blocks makes the choice visible in code review instead of leaving it to a default.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Virtual Cloud Networks**.
        2. Select the VCN you want to inspect.
        3. Select **Security Lists** from the left-hand resources menu.
        4. For each security list, select it and review the **Ingress Rules** tab.
        5. Look for any rule where the **Source** is `0.0.0.0/0` and the **Stateless** column is checked.

        A passing security list has no stateless ingress rules from `0.0.0.0/0`. A failing security list has at least one ingress rule from `0.0.0.0/0` marked as stateless.

        ### Audit via CLI

        1. Retrieve all ingress rules for a security list and check for stateless rules from `0.0.0.0/0`:

        ```bash
        oci network security-list get --security-list-id <security-list-ocid> --query 'data."ingress-security-rules"[?source==`0.0.0.0/0` && "is-stateless"==`true`]'
        ```

        A passing security list returns an empty array. A failing security list returns one or more ingress rules where `is-stateless` is `true` and the source is `0.0.0.0/0`.
      remediation:
        - id: console
          desc: |
            To convert stateless ingress rules to stateful using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list with the stateless internet-facing rule.
            5. Edit the ingress rule from 0.0.0.0/0 and uncheck **Stateless**.
            6. Select **Save Changes**.
        - id: cli
          desc: |
            To convert stateless ingress rules to stateful using the OCI CLI, update the security list with `isStateless` set to `false`.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, set `isStateless` to `false` only on the internet-facing rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id SECURITY_LIST_OCID \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json`, setting `"isStateless": false` on the rule from `0.0.0.0/0` and leaving the other rules untouched. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id SECURITY_LIST_OCID \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            To ensure ingress rules from the internet are stateful in Terraform, set `stateless` to `false`:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              ingress_security_rules {
                protocol  = "6" # TCP
                source    = "0.0.0.0/0"
                stateless = false

                tcp_options {
                  min = 443
                  max = 443
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: OCI security list documentation
  - uid: mondoo-oci-security-vcn-no-stateless-ingress-from-internet-oci
    filters: asset.platform == "oci-network-securitylist"
    mql: |
      oci.network.securityList.ingressRules.where(
        source == "0.0.0.0/0"
      ).none(stateless == true)
  - uid: mondoo-oci-security-vcn-no-stateless-ingress-from-internet-terraform-hcl
