  # No Terraform variants: this is a tenancy-level posture check ("at least one zone exists somewhere in the tenancy"). The Terraform-asset equivalent would have to either fire on every Terraform asset (flagging every config that doesn't manage Cloud Guard, even unrelated ones) or gate on the resource type (which then can't detect absence). Same scoping limitation as `mondoo-oci-security-iam-mfa-enabled-for-active-users`.
  - uid: mondoo-oci-security-cloudguard-security-zones-configured
    title: Ensure at least one Cloud Guard security zone is configured
    impact: 80
    filters: asset.platform == 'oci'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-03
      compliance/dora: dora-art-10
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-23
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-2
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-1-5-1
    mql: |
      oci.cloudGuard.securityZones.length > 0
    docs:
      desc: |
        This check verifies that the tenancy has preventive guardrails in place, in the form of at least one Cloud Guard security zone.

        A security zone binds a compartment to a security zone recipe, a set of policies such as requiring customer-managed encryption keys, forbidding public buckets, and forbidding public network endpoints. Operations in a zoned compartment that violate the recipe are refused at the API layer at create time. Cloud Guard detectors are the other half of the service and behave differently: they observe resources after the fact and report problems for an operator to act on. This check requires at least one zone to exist. Create one in the Console under Identity & Security > Security Zones, or with `oci cloud-guard security-zone create`.

        **Why this matters**

        Without any zone, the tenancy relies entirely on detective controls, which leave a window between the moment a misconfiguration is created and the moment an operator responds. A bucket created with public access in an unzoned compartment is publicly readable for the whole of that window; in a zoned compartment the create call is refused and no exposure ever occurs.

        Detective findings can also be argued with. An operator holding sufficient permissions can dismiss or ignore a finding with no friction, whereas inside a zone the API enforces the recipe regardless of operator intent.

        Zones cover ground detection frequently misses, including customer-managed encryption requirements, public-endpoint restrictions, and network-exposure policies that a detector recipe may never have been configured to look for.

        Enforcement is also more durable. Zone policies survive changes to detector rules and monitoring configuration, so detective tooling that is retuned, silenced, or broken by an automated pipeline does not weaken the guardrail. The result is a posture that prevents at create time instead of alerting afterward, reducing the exposure window for covered operations from hours or days to zero.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** in the OCI Console and navigate to **Cloud Guard** -> **Security Zones**.
        2. Verify that at least one security zone is listed with status **Active**.

        A passing tenancy shows one or more active security zones. A failing tenancy shows an empty security zones list.

        ### Audit via CLI

        1. List all security zones in the tenancy root compartment:

        ```bash
        oci cloud-guard security-zone-collection list-security-zones \
          --compartment-id <tenancy-ocid> \
          --lifecycle-state ACTIVE \
          --query 'data.items[*].{name:"display-name", id:id}' \
          --output table
        ```

        A passing tenancy returns at least one row in the output. A failing tenancy returns an empty list.
      remediation:
        - id: console
          desc: |
            Create a security zone covering the tenancy's production compartments:

            1. Open **Identity & Security** -> **Cloud Guard** -> **Security Zones**.
            2. Select **Create Security Zone**, choose the production compartment, and apply the Oracle-managed maximum-security recipe.
            3. Build a custom recipe only when a specific policy must be relaxed; document the deviation.
        - id: cli
          desc: |
            Create a security zone bound to a target compartment:

            ```bash
            oci cloud-guard security-zone create \
              --compartment-id <compartment-ocid> \
              --display-name <name> \
              --security-zone-recipe-id <recipe-ocid>
            ```
        - id: terraform
          desc: |
            Declare at least one security zone in your IaC:

            ```hcl
            resource "oci_cloud_guard_security_zone" "production" {
              compartment_id           = var.production_compartment_ocid
              display_name             = "production-zone"
              security_zone_recipe_id  = var.security_zone_recipe_id
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/cloud-guard/using/security-zones.htm
        title: OCI Cloud Guard Security Zones
  - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete
    title: Ensure Cloud Guard security zones inherit protection after deletion
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-32
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-3
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc8-1-1
      compliance/vda-isa-5: vda-isa-5-1-5-1
    variants:
      - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that protection survives the deletion of a security zone, by requiring inheritance after delete on every Cloud Guard security zone.

        A security zone applies its recipe policies to the compartment it is attached to and, through nesting, to compartments beneath it. `is_inheritance_after_delete_enabled` controls what happens to those descendants when the zone itself is removed: with it set to `true`, child compartments keep the enforcement they inherited; with it off, they lose it the moment the parent zone is deleted. This check requires the setting to be `true` on every zone. Set it in the Console under Identity & Security > Security Zones when creating or editing a zone, or with `oci cloud-guard security-zone update`.

        **Why this matters**

        Deleting a parent zone without inheritance enabled strips zone enforcement from every child compartment immediately, and nothing in the audit log records that those compartments are no longer screened by zone policies. The API-enforcement layer is simply gone.

        The deletion that triggers this is rarely a security event in its own right. A recipe rebuild, a tenancy reorganization, or a misconfigured infrastructure-as-code pipeline all produce it, and none of them look like anything a monitoring tool would raise.

        Nesting multiplies the blast radius. A single parent-zone deletion can expose several child compartments at once, so one routine operation opens a broad and invisible gap.

        Nothing closes that gap on its own. It persists until an operator notices and manually recreates the zone or applies a replacement, and there is no automatic healing mechanism to fall back on.

        With inheritance enabled, child compartments retain parent-zone enforcement through delete-and-recreate cycles, and an unintended deletion is limited to the parent zone rather than cascading downward. Oracle recommends enabling inheritance after deletion as the default posture for production security zones, and it costs nothing to carry.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** in the OCI Console and navigate to **Cloud Guard** -> **Security Zones**.
        2. Select each security zone and open its details page.
        3. In the zone settings, verify that **Inherit parent security zone after deletion** is enabled.

        A passing security zone shows **Inherit parent security zone after deletion** set to **Enabled**. A failing security zone shows this setting as **Disabled**.

        ### Audit via CLI

        1. List security zones and check the `is-inheritance-after-delete-enabled` flag for each:

        ```bash
        oci cloud-guard security-zone-collection list-security-zones \
          --compartment-id <compartment-ocid> \
          --query 'data.items[*].{name:"display-name", inheritAfterDelete:"is-inheritance-after-delete-enabled"}' \
          --output table
        ```

        A passing security zone returns `"is-inheritance-after-delete-enabled": true`. A failing security zone returns `"is-inheritance-after-delete-enabled": false`.
      remediation:
        - id: console
          desc: |
            Toggle the inheritance setting on each zone:

            1. Open **Identity & Security** -> **Cloud Guard** -> **Security Zones** -> select the zone.
            2. Select **Edit** and enable **Inherit parent security zone after deletion**.
            3. Save. The change is in-place.
        - id: cli
          desc: |
            Update the zone in place:

            ```bash
            oci cloud-guard security-zone update \
              --security-zone-id <zone-ocid> \
              --display-name <zone-display-name> \
              --is-inheritance-after-delete-enabled true
            ```
        - id: terraform
          desc: |
            Set `is_inheritance_after_delete_enabled = true` on every zone:

            ```hcl
            resource "oci_cloud_guard_security_zone" "production" {
              compartment_id                       = var.production_compartment_ocid
              display_name                         = "production-zone"
              security_zone_recipe_id              = var.recipe_id
              is_inheritance_after_delete_enabled  = true
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/cloud-guard/using/security-zones.htm
        title: OCI Cloud Guard Security Zones
  - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.cloudGuard.securityZones.all(isInheritanceAfterDeleteEnabled == true)
  - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_cloud_guard_security_zone')
    mql: |
      terraform.resources('oci_cloud_guard_security_zone').all(
        arguments['is_inheritance_after_delete_enabled'] == true
      )
  - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_cloud_guard_security_zone')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_cloud_guard_security_zone').all(
        change.after['is_inheritance_after_delete_enabled'] == true
      )
  - uid: mondoo-oci-security-cloudguard-security-zone-inherit-after-delete-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_cloud_guard_security_zone')
    mql: |
      terraform.state.resources.where(type == 'oci_cloud_guard_security_zone').all(
        values['is_inheritance_after_delete_enabled'] == true
      )
  - uid: mondoo-oci-security-iam-password-policy-strong
    title: Ensure the IAM password policy enforces strong complexity requirements
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    variants:
      - uid: mondoo-oci-security-iam-password-policy-strong-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-iam-password-policy-strong-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-password-policy-strong-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-password-policy-strong-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that password complexity is enforced strongly enough to resist guessing, requiring a minimum length of 14 characters, at least one uppercase letter, one lowercase letter, one numeral, and one special character, and passwords that do not contain the username.

        OCI keeps password rules in two places, and both are checked. The legacy tenancy-wide authentication policy applies to local IAM users and is edited with `oci iam authentication-policy update` against the tenancy. A tenancy using identity domains keeps a separate password policy per domain under Identity & Security > Domains, and that is the policy the domain's users actually authenticate against, so a hardened tenancy policy sitting alongside a default domain policy still leaves real accounts weakly protected. A tenancy with no identity domains is judged on the tenancy-wide policy alone. The OCI default enforces only a 12-character minimum with a single character drawn from three of the four character classes.

        **Why this matters**

        Length is what defeats offline cracking. Every additional character multiplies the search space an attacker has to cover, and requiring all four character classes rather than three of four removes the shortcut of a wordlist run over lowercase and digits alone. Two extra characters over the default is a large multiplier against hardware measuring its throughput in guesses per second.

        Blocking username containment removes the most predictable pattern in any password corpus. A password built around the account name is the first thing a targeted guessing run tries, and it is derivable from information the attacker already has, since the username is often just an email address.

        These rules also carry compliance weight. Frameworks including PCI DSS and CIS prescribe length and complexity floors above what OCI ships with, so a tenancy left on defaults fails on configuration alone.

        Set the rules in every identity domain as well as at the tenancy level, and pair them with multi-factor authentication, which is what limits the damage when a strong password is phished rather than cracked.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console as an administrator.
        2. Navigate to **Identity & Security > Domains**, select the default domain, then open **Settings > Password policy** (or **Identity & Security > Authentication Settings** for the legacy IAM experience).
        3. Review the minimum length and character-class requirements.

        A passing tenancy requires at least 14 characters, all four character classes, and disallows username containment. A failing tenancy allows shorter or simpler passwords or permits the username inside the password.

        ### Audit via CLI

        1. Retrieve the authentication policy for the tenancy:

        ```bash
        oci iam authentication-policy get --compartment-id <tenancy-ocid>
        ```

        A passing tenancy returns `password-policy` with `minimum-password-length` of 14 or more, each `is-*-characters-required` set to `true`, and `is-username-containment-allowed` set to `false`. A failing tenancy returns weaker values.
      remediation:
        - id: console
          desc: |
            To strengthen the password policy using the OCI Console:

            1. Navigate to **Identity & Security > Domains**, select the default domain, then open **Settings > Password policy**.
            2. Set the minimum length to **14**.
            3. Require **uppercase**, **lowercase**, **numeric**, and **special** characters.
            4. Disable **Allow username in password**.
            5. Select **Save changes**.
            6. In tenancies where the legacy **Identity & Security > Authentication Settings** page is available, apply the same values there, because this check evaluates the tenancy authentication policy. If the page is not available, use the CLI command in the CLI remediation to update the authentication policy directly.
        - id: cli
          desc: |
            A tenancy on identity domains keeps a password policy per domain, and that is the one its users authenticate against. Set both the legacy tenancy policy and every domain policy, or the domain users stay on the weaker settings.

            1. Update the legacy tenancy authentication policy:

            ```bash
            oci iam authentication-policy update --compartment-id <tenancy-ocid> \
              --password-policy '{"minimumPasswordLength": 14, "isUppercaseCharactersRequired": true, "isLowercaseCharactersRequired": true, "isNumericCharactersRequired": true, "isSpecialCharactersRequired": true, "isUsernameContainmentAllowed": false}'
            ```

            2. Update the password policy in each identity domain, using that domain's own endpoint:

            ```bash
            oci identity-domains password-policy patch \
              --endpoint https://<domain-url> \
              --password-policy-id <password-policy-id> \
              --schemas '["urn:ietf:params:scim:api:messages:2.0:PatchOp"]' \
              --operations '[{"op":"replace","path":"minLength","value":14},{"op":"replace","path":"minUpperCase","value":1},{"op":"replace","path":"minLowerCase","value":1},{"op":"replace","path":"minNumerals","value":1},{"op":"replace","path":"minSpecialChars","value":1},{"op":"replace","path":"userNameDisallowed","value":true}]'
            ```
        - id: terraform
          desc: |
            To enforce a strong password policy in Terraform, configure the `password_policy` block on the authentication policy:

            ```hcl
            resource "oci_identity_authentication_policy" "example" {
              compartment_id = var.tenancy_ocid

              password_policy {
                minimum_password_length          = 14
                is_uppercase_characters_required = true
                is_lowercase_characters_required = true
                is_numeric_characters_required   = true
                is_special_characters_required   = true
                is_username_containment_allowed  = false
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Reference/iampolicyreference.htm
        title: OCI authentication policy documentation
  - uid: mondoo-oci-security-iam-password-policy-strong-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.identity.authenticationPolicy.minimumPasswordLength >= 14
      oci.identity.authenticationPolicy.passwordRequiresUppercase == true
      oci.identity.authenticationPolicy.passwordRequiresLowercase == true
      oci.identity.authenticationPolicy.passwordRequiresNumeric == true
      oci.identity.authenticationPolicy.passwordRequiresSpecial == true
      oci.identity.authenticationPolicy.passwordUsernameContainmentAllowed == false
      # authenticationPolicy is the legacy tenancy-wide policy. A tenancy on identity
      # domains keeps a separate password policy per domain, and that is the one its
      # users actually authenticate against. Vacuously true on a tenancy with no domains.
      oci.identity.domains.all(passwordPolicy.minLength >= 14)
      oci.identity.domains.all(passwordPolicy.minUpperCase >= 1)
      oci.identity.domains.all(passwordPolicy.minLowerCase >= 1)
      oci.identity.domains.all(passwordPolicy.minNumerals >= 1)
      oci.identity.domains.all(passwordPolicy.minSpecialChars >= 1)
      oci.identity.domains.all(passwordPolicy.userNameDisallowed == true)
  - uid: mondoo-oci-security-iam-password-policy-strong-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_identity_authentication_policy')
    mql: |
      terraform.resources('oci_identity_authentication_policy').all(
        blocks.where(type == 'password_policy').all(
          arguments['minimum_password_length'] >= 14 &&
          arguments['is_uppercase_characters_required'] == true &&
          arguments['is_lowercase_characters_required'] == true &&
          arguments['is_numeric_characters_required'] == true &&
          arguments['is_special_characters_required'] == true &&
          arguments['is_username_containment_allowed'] == false
        )
      )
  - uid: mondoo-oci-security-iam-password-policy-strong-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_identity_authentication_policy')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_identity_authentication_policy').all(
        change.after['password_policy'][0]['minimum_password_length'] >= 14 &&
        change.after['password_policy'][0]['is_uppercase_characters_required'] == true &&
        change.after['password_policy'][0]['is_lowercase_characters_required'] == true &&
        change.after['password_policy'][0]['is_numeric_characters_required'] == true &&
        change.after['password_policy'][0]['is_special_characters_required'] == true &&
        change.after['password_policy'][0]['is_username_containment_allowed'] == false
      )
  - uid: mondoo-oci-security-iam-password-policy-strong-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_identity_authentication_policy')
    mql: |
      terraform.state.resources.where(type == 'oci_identity_authentication_policy').all(
        values['password_policy'][0]['minimum_password_length'] >= 14 &&
        values['password_policy'][0]['is_uppercase_characters_required'] == true &&
        values['password_policy'][0]['is_lowercase_characters_required'] == true &&
        values['password_policy'][0]['is_numeric_characters_required'] == true &&
        values['password_policy'][0]['is_special_characters_required'] == true &&
        values['password_policy'][0]['is_username_containment_allowed'] == false
      )
  # No Terraform variants: API key age is runtime-only telemetry derived from each key's creation timestamp; the `oci_identity_api_key` Terraform resource exposes no `time_created` argument and cannot evidence rotation cadence.
  - uid: mondoo-oci-security-iam-api-keys-rotated
    title: Ensure IAM user API signing keys are rotated within 90 days
    impact: 70
    filters: asset.platform == "oci-identity-user"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-9
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      oci.identity.user.apiKeys.where(state == "ACTIVE").all(
        time.now - created <= 90 * time.day
      )
    docs:
      desc: |
        This check verifies that API signing keys are rotated on a fixed cadence, by requiring every active key to have been created within the last 90 days.

        An API signing key is an RSA key pair. The public half is uploaded against the user and identified by its fingerprint, while the private half stays on the caller and signs every request made to the OCI REST APIs, the SDKs, and the `oci` CLI. Keys carry no expiry: once uploaded, a key authenticates until an administrator deletes it, which makes an unrotated key a permanent static credential. They are managed on the user under Identity & Security > Domains > Users and with `oci iam user api-key list` and `oci iam user api-key delete`, which takes the fingerprint of the key to remove.

        **Why this matters**

        Nothing about the key ages out on its own, so a private key leaked into a Git history, a build log, or an image layer stays usable for as long as the account exists. Rotation is the only mechanism that ever ends that window, and a 90-day cadence bounds it to a quarter rather than leaving it open indefinitely.

        The same applies after people and systems move on. A key issued to an engineer who has left, or to an automation since retired, keeps signing valid API calls until it is explicitly removed, and the cadence caps that residual access even when the offboarding step is missed.

        Rotation also forces reissuance through a controlled path. Each replacement makes someone confirm which system still needs the key and where the private half is stored, which is how forgotten copies are found before an attacker finds them.

        A user may hold up to three API keys at once, leaving room to rotate without an outage: generate a new pair, upload the public key, cut the consuming system over, verify it signs successfully, then delete the superseded key by fingerprint. Automating that sequence keeps the cadence from slipping.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Identity & Security > Users**.
        2. Select the user you want to inspect.
        3. Under **Resources**, select **API Keys**.
        4. For each active key, review the **Created** date.

        A passing user has all active API keys created within the last 90 days. A failing user has one or more active API keys older than 90 days.

        ### Audit via CLI

        1. List the API keys for a user:

        ```bash
        oci iam user api-key list --user-id <user-ocid>
        ```

        2. For each key in `ACTIVE` state, compare `time-created` with the current date.

        A passing user returns only keys created within the last 90 days. A failing user returns one or more active keys older than 90 days.
      remediation:
        - id: console
          desc: |
            To rotate an API signing key using the OCI Console:

            1. Open **Identity & Security** → **Users** → select the user → **API Keys**.
            2. Select **Add API Key** and upload or generate a new key pair.
            3. Update the consuming application or SDK configuration to use the new key.
            4. **Delete** the old API key once the new key is confirmed working.
        - id: cli
          desc: |
            To rotate an API signing key using the OCI CLI, upload a replacement public key and delete the old one:

            ```bash
            oci iam user api-key upload --user-id <user-ocid> --key-file ./new_public_key.pem
            oci iam user api-key delete --user-id <user-ocid> --fingerprint <old-key-fingerprint>
            ```
        # No Terraform remediation: API key creation timestamps are runtime-only; the `oci_identity_api_key` Terraform resource has no field that controls or evidences rotation age.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/managingcredentials.htm
        title: OCI managing user credentials documentation
  - uid: mondoo-oci-security-kms-keys-hsm-protected
    title: Ensure KMS master encryption keys are protected by an HSM
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-oci-security-kms-keys-hsm-protected-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-kms-keys-hsm-protected-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-kms-keys-hsm-protected-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-kms-keys-hsm-protected-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that master encryption keys are held in tamper-resistant hardware by requiring the `HSM` protection mode rather than `SOFTWARE`.

        Protection mode determines where a Vault key's material lives and where cryptographic operations run. An `HSM` key is generated inside a FIPS 140-2 Level 3 validated hardware security module and its private material never leaves that module; the service can only ask the module to encrypt, decrypt, or sign. A `SOFTWARE` key is generated and stored in the service's software layer, where it is protected by a root key but can be created as exportable and retrieved through the key export API. You choose the mode under Identity & Security > Vault > Keys > Create key, or with `oci kms management key create --protection-mode HSM`, and in Terraform through the `protection_mode` argument on `oci_kms_key`. The check evaluates keys in the enabled state.

        **Why this matters**

        Non-exportable material changes what a control plane compromise is worth. An attacker who reaches the key management API of a software key may be able to walk away with the raw bytes and then decrypt captured data offline, forever, with no further access to your tenancy. The same attacker holding an HSM key can only issue operations while the access lasts, and every one of those operations is logged in OCI Audit.

        The hardware itself resists physical and logical tampering and is certified to do so, which is the assurance regulators are asking for when a framework requires that keys protecting regulated data be held in validated hardware security modules.

        Protection mode is fixed when the key is created. `oci kms management key update` can change a key's display name, tags, and rotation settings, but it cannot convert a software key to an HSM key. Remediating an existing software key therefore means creating a replacement HSM key and re-keying or re-encrypting the resources that depend on it.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Identity & Security > Vault**.
        2. Open each vault and review its **Master Encryption Keys**.
        3. Check the **Protection Mode** column for each key.

        A passing key shows **HSM** as the protection mode. A failing key shows **Software**.

        ### Audit via CLI

        1. List the keys in a vault and review their protection mode:

        ```bash
        oci kms management key list --compartment-id <compartment-ocid> --endpoint <vault-management-endpoint> --query 'data[*].{name:"display-name", protection:"protection-mode"}'
        ```

        A passing key returns `HSM` for `protection-mode`. A failing key returns `SOFTWARE`.
      remediation:
        - id: console
          desc: |
            To protect a master encryption key with an HSM using the OCI Console:

            1. Navigate to **Identity & Security > Vault** and open the target vault.
            2. Select **Create Key**.
            3. For **Protection Mode**, choose **HSM**.
            4. Complete the key shape and name, then select **Create Key**.
            5. Re-assign the new HSM key to the resources that previously used a software key.
        - id: cli
          desc: |
            To create an HSM-protected master encryption key using the OCI CLI:

            ```bash
            oci kms management key create --compartment-id <compartment-ocid> \
              --display-name "hsm-key" \
              --key-shape '{"algorithm": "AES", "length": 32}' \
              --protection-mode HSM \
              --endpoint <vault-management-endpoint>
            ```
        - id: terraform
          desc: |
            To create an HSM-protected master encryption key in Terraform, set `protection_mode` to `HSM`:

            ```hcl
            resource "oci_kms_key" "example" {
              compartment_id      = var.compartment_ocid
              display_name        = "hsm-key"
              management_endpoint = oci_kms_vault.example.management_endpoint
              protection_mode     = "HSM"

              key_shape {
                algorithm = "AES"
                length    = 32
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/KeyManagement/Concepts/keyoverview.htm
        title: OCI Vault key management documentation
  - uid: mondoo-oci-security-kms-keys-hsm-protected-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.kms.vaults.all(
        keys.where(state == "ENABLED").all(protectionMode == "HSM")
      )
  - uid: mondoo-oci-security-kms-keys-hsm-protected-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_kms_key')
    mql: |
      terraform.resources('oci_kms_key').all(
        arguments['protection_mode'] == "HSM"
      )
  - uid: mondoo-oci-security-kms-keys-hsm-protected-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_kms_key')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_kms_key').all(
        change.after['protection_mode'] == "HSM"
      )
  - uid: mondoo-oci-security-kms-keys-hsm-protected-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_kms_key')
    mql: |
      terraform.state.resources.where(type == 'oci_kms_key').all(
        values['protection_mode'] == "HSM"
      )
  - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled
    title: Ensure KMS master encryption keys have automatic rotation enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-6-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that master encryption keys are rotated on a schedule by the service rather than left as permanent key material.

        Rotating a Vault key creates a new key version and makes it the one used for all subsequent encrypt operations, while earlier versions stay available so previously encrypted data remains readable. Nothing is re-encrypted at rotation time, so the operation is safe to automate. OCI accepts a rotation interval between 60 and 365 days. You enable it under Identity & Security > Vault > Keys > Edit in the Console, with `oci kms management key update --key-id <id> --is-auto-rotation-enabled true` supplying the rotation details, or in Terraform through `is_auto_rotation_enabled` alongside an `auto_key_rotation_details` block. The check evaluates keys in the enabled state.

        **Why this matters**

        A key that never rotates behaves like a long-lived static secret. Every object ever encrypted under it is protected by a single version, so one compromised version exposes the entire history of that key's use rather than a slice of it. Automatic rotation bounds how much data any one version covers, which directly bounds what a single disclosure costs.

        Manual rotation is the alternative, and it is the kind of scheduled maintenance that gets deferred. Each cycle requires an operator to remember, to pick a window, and to confirm dependents still work, so intervals stretch and eventually stop. Service-managed rotation removes the human step and produces an auditable record that the cadence was actually met, which is what several regulatory frameworks ask for.

        Choose an interval that satisfies your compliance obligations while remaining operationally practical, and confirm that the resources bound to the key handle version changes transparently before shortening it. Rotation of the master key does not by itself refresh data encryption keys already issued to storage resources, so pair it with periodic re-keying where a framework requires the protecting material to be replaced end to end.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Identity & Security > Vault**.
        2. Open each vault and review its **Master Encryption Keys**.
        3. Open each key and check whether **Automatic key rotation** is enabled.

        A passing key has automatic key rotation enabled. A failing key has it disabled.

        ### Audit via CLI

        1. List the keys in a vault and review their rotation configuration:

        ```bash
        oci kms management key list --compartment-id <compartment-ocid> --endpoint <vault-management-endpoint> --query 'data[*].{name:"display-name", autoRotation:"auto-key-rotation-details"}'
        ```

        A passing key returns a populated `auto-key-rotation-details` object with rotation enabled. A failing key returns `null`.
      remediation:
        - id: console
          desc: |
            To enable automatic key rotation using the OCI Console:

            1. Navigate to **Identity & Security > Vault** and open the vault.
            2. Open the master encryption key.
            3. Select **Edit** and enable **Automatic key rotation**.
            4. Set the rotation interval.
            5. Select **Save Changes**.
        - id: cli
          desc: |
            To enable automatic key rotation using the OCI CLI, update the key with both the rotation flag and the rotation schedule details:

            ```bash
            oci kms management key update --key-id <key-ocid> \
              --is-auto-rotation-enabled true \
              --auto-key-rotation-details '{"rotationIntervalInDays": 90}' \
              --endpoint <vault-management-endpoint>
            ```
        - id: terraform
          desc: |
            To enable automatic key rotation in Terraform, set `is_auto_rotation_enabled = true` and configure the `auto_key_rotation_details` block on the key:

            ```hcl
            resource "oci_kms_key" "example" {
              compartment_id      = var.compartment_ocid
              display_name        = "example-key"
              management_endpoint = oci_kms_vault.example.management_endpoint

              is_auto_rotation_enabled = true

              key_shape {
                algorithm = "AES"
                length    = 32
              }

              auto_key_rotation_details {
                rotation_interval_in_days = 90
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/KeyManagement/Tasks/rotatingkeys.htm
        title: OCI Vault key rotation documentation
  - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.kms.vaults.all(
        keys.where(state == "ENABLED").all(isAutoRotationEnabled == true)
      )
  - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_kms_key')
    mql: |
      terraform.resources('oci_kms_key').all(
        blocks.where(type == 'auto_key_rotation_details') != empty &&
        arguments['is_auto_rotation_enabled'] == true
      )
  - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_kms_key')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_kms_key').all(
        change.after['auto_key_rotation_details'] != empty &&
        change.after['is_auto_rotation_enabled'] == true
      )
  - uid: mondoo-oci-security-kms-keys-auto-rotation-enabled-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_kms_key')
    mql: |
      terraform.state.resources.where(type == 'oci_kms_key').all(
        values['auto_key_rotation_details'] != empty &&
        values['is_auto_rotation_enabled'] == true
      )
  - uid: mondoo-oci-security-block-volume-customer-managed-encryption
    title: Ensure block volumes use customer-managed encryption keys
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-oci-security-block-volume-customer-managed-encryption-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-block-volume-customer-managed-encryption-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-block-volume-customer-managed-encryption-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-block-volume-customer-managed-encryption-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that block volumes are encrypted under a key you control in OCI Vault instead of the Oracle-managed default.

        Every block volume is encrypted at rest whether or not you do anything, so the gap this closes is not missing encryption but missing key custody. With the default, the Block Volume service owns the key hierarchy, and there is no key you can point at, disable, or audit separately from the storage service itself. Assigning a Vault key gives you a distinct object with its own lifecycle. You set it under Storage > Block Volumes > Assign encryption key, or with `oci bv volume update --volume-id <id> --kms-key-id <ocid>`, and in Terraform through `kms_key_id` on `oci_core_volume`. The key must live in the same region as the volume, and the Block Volume service needs permission to use it, granted with a statement such as `allow service blockstorage to use keys in compartment KeyVault`.

        **Why this matters**

        Key custody makes revocation a real, immediate control. Disabling the key in Vault stops the service from unwrapping the volume's data encryption key, so the volume can no longer be attached and reads on an already attached volume begin to fail. That is a cryptographic erase you can perform in seconds, without touching the storage itself, and it works even for data you no longer have an operational path to delete.

        The same power is why deletion demands care. Scheduling a key for deletion destroys the ability to read every volume it protects, along with the backups and clones that inherited the key reference, and copying a backup to another region requires a key present in that region.

        Custody also separates duties: the team administering storage is not the team administering keys, so the two roles have independent IAM policies and independent audit trails.

        Frameworks such as HIPAA and PCI DSS expect you to demonstrate control over the keys protecting regulated data, which an Oracle-managed key does not let you show.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Storage > Block Volumes**.
        2. Open each volume and locate the **Encryption** section.
        3. Verify that a customer-managed key from OCI Vault is assigned.

        A passing volume shows a customer-managed KMS key OCID. A failing volume shows **Oracle-managed key** or an empty encryption key field.

        ### Audit via CLI

        1. Retrieve the KMS key assignment for a volume:

        ```bash
        oci bv volume get --volume-id <volume-ocid> --query 'data.{name:"display-name", kmsKeyId:"kms-key-id"}'
        ```

        A passing volume returns a non-empty OCID in `kmsKeyId`. A failing volume returns `null`.
      remediation:
        - id: console
          desc: |
            To assign a customer-managed encryption key to a block volume using the OCI Console:

            1. Navigate to **Storage > Block Volumes** and open the volume.
            2. Select **Edit**.
            3. Under **Encryption**, choose **Encrypt using customer-managed keys**.
            4. Select the vault, master encryption key, and key version.
            5. Select **Save Changes**.
        - id: cli
          desc: |
            To assign a customer-managed encryption key to a block volume using the OCI CLI:

            ```bash
            oci bv volume-kms-key update --volume-id <volume-ocid> --kms-key-id <key-ocid>
            ```
        - id: terraform
          desc: |
            To assign a customer-managed encryption key to a block volume in Terraform, reference the key in the volume resource:

            ```hcl
            resource "oci_core_volume" "example" {
              compartment_id      = var.compartment_ocid
              availability_domain = var.availability_domain
              display_name        = "example-volume"
              kms_key_id          = oci_kms_key.example.id
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Block/Concepts/overview.htm
        title: OCI Block Volume encryption documentation
  - uid: mondoo-oci-security-block-volume-customer-managed-encryption-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.compute.blockVolumes.all(kmsKey != null)
  - uid: mondoo-oci-security-block-volume-customer-managed-encryption-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_core_volume')
    mql: |
      terraform.resources('oci_core_volume').all(
        arguments['kms_key_id'] != null && arguments['kms_key_id'] != ""
      )
  - uid: mondoo-oci-security-block-volume-customer-managed-encryption-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_core_volume')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_core_volume').all(
        change.after['kms_key_id'] != null && change.after['kms_key_id'] != ""
      )
  - uid: mondoo-oci-security-block-volume-customer-managed-encryption-terraform-state
