      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_apigateway_deployment')
    mql: |
      terraform.resources('oci_apigateway_deployment').all(
        blocks.where(type == 'specification') != empty &&
        blocks.where(type == 'specification').all(
          blocks.where(type == 'request_policies') != empty &&
          blocks.where(type == 'request_policies').all(
            blocks.where(type == 'authentication') != empty &&
            blocks.where(type == 'authentication').all(
              arguments['type'] != null && arguments['type'] != ""
            )
          )
        )
      )
  - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_apigateway_deployment')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_apigateway_deployment').all(
        change.after['specification'] != null && change.after['specification'].length > 0 &&
        change.after['specification'].all(
          _['request_policies'] != null && _['request_policies'].length > 0 &&
          _['request_policies'].all(
            _['authentication'] != null && _['authentication'].length > 0 &&
            _['authentication'].all(
              _['type'] != null && _['type'] != ""
            )
          )
        )
      )
  - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_apigateway_deployment')
    mql: |
      terraform.state.resources.where(type == 'oci_apigateway_deployment').all(
        values['specification'] != null && values['specification'].length > 0 &&
        values['specification'].all(
          _['request_policies'] != null && _['request_policies'].length > 0 &&
          _['request_policies'].all(
            _['authentication'] != null && _['authentication'].length > 0 &&
            _['authentication'].all(
              _['type'] != null && _['type'] != ""
            )
          )
        )
      )
  - uid: mondoo-oci-security-apigateway-deployment-mtls-verified
    title: Ensure API Gateway mTLS deployments verify client certificates
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-6-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-oci-security-apigateway-deployment-mtls-verified-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-apigateway-deployment-mtls-verified-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-mtls-verified-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-mtls-verified-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that API Gateway deployments configured for mutual TLS actually require a verified client certificate.

        The `mutual_tls` block inside a deployment's request policies tells the gateway to ask for a client certificate during the TLS handshake, and `mutualTls.isVerifiedCertificateRequired` decides whether the gateway rejects the handshake when no valid certificate arrives. The block can be configured with verification disabled, in which case the gateway advertises mutual TLS support but still accepts connections from clients that present no certificate, providing no stronger authentication than standard TLS. This check requires `is_verified_certificate_required = true` wherever a mutual TLS configuration exists. Configure it in the Console under Developer Services > API Management > Gateways on the deployment's request policies, or with `oci api-gateway deployment update`.

        **Why this matters**

        The unenforced form is security theater. Operators reading the deployment configuration see a `mutual_tls` block and assume client certificate authentication is enforced, when without the verification flag the block has no authentication effect whatsoever.

        Clients with no certificate still complete the TLS handshake and reach upstream backends, because the gateway has been told not to reject the handshake on verification failure. The `allowed_sans` list, which is meant to act as an allowlist of trusted client identities, cannot filter certificates that are never verified in the first place, so it degrades into advisory metadata.

        Compliance reviews that look only for the presence of a mutual TLS configuration will pass a deployment where verification is off, producing a documented but non-functional control that survives audit after audit.

        Turning verification on forces every client to present a certificate that chains to the configured certificate authority bundle, which makes mutual TLS a real authentication layer rather than a configuration artifact and activates `allowed_sans` as an actual authorization boundary over which client identities may reach the API. Deployments with no mutual TLS configuration are out of scope here; they should still enforce an authentication policy of their own.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Developer Services** > **API Gateway** > **Deployments**.
        2. For each deployment, select it and open **API Request Policies** > **Mutual TLS**.
        3. If a mutual TLS policy is configured, check whether **Require verified client certificate** is toggled on. If that option is off, the gateway advertises mTLS support but does not reject clients that lack a valid certificate.

        A passing deployment either has no mutual TLS policy configured, or has one where **Require verified client certificate** is on. A failing deployment has a mutual TLS policy where **Require verified client certificate** is off.

        ### Audit via CLI

        1. Retrieve the deployment specification and check the mTLS verification flag:

        ```bash
        oci api-gateway deployment get \
          --deployment-id <deployment-ocid> \
          --query 'data.specification."request-policies"."mutual-tls"."is-verified-certificate-required"' \
          --output json
        ```

        A passing deployment returns `true` or `null` (no mTLS block present). A failing deployment returns `false` when a mutual TLS block is configured.
      remediation:
        - id: console
          desc: |
            Enable certificate verification on the deployment's mutual TLS policy:

            1. Open **Developer Services** → **API Gateway** → **Deployments** → select the deployment → **API Request Policies**.
            2. Open **Mutual TLS**.
            3. Set **Require verified client certificate** to on.
            4. Confirm the CA bundle and allowed SANs are appropriate, then save and deploy.
        - id: cli
          desc: |
            Update the deployment specification with `isVerifiedCertificateRequired: true` in the mutual TLS block.

            **Warning: `--specification` replaces the COMPLETE deployment specification.** The specification is a large nested document covering every route, backend, and policy. Whatever you pass becomes the entire spec, so anything you omit is removed. Retrieve the current spec first, edit only the mutual TLS block, then resubmit the entire document.

            1. Export the current specification so you keep every route and backend:

            ```bash
            oci api-gateway deployment get \
              --deployment-id <deployment-ocid> \
              --query 'data.specification' > specification.json
            ```

            2. In `specification.json`, set the mutual TLS block to `"isVerifiedCertificateRequired": true`, leaving all other routes and backends intact. Resubmit the full document:

            ```bash
            oci api-gateway deployment update \
              --deployment-id <deployment-ocid> \
              --specification file://specification.json
            ```
        - id: terraform
          desc: |
            Set `is_verified_certificate_required = true` on every `mutual_tls` block in deployment specifications:

            ```hcl
            resource "oci_apigateway_deployment" "app" {
              compartment_id = var.compartment_ocid
              gateway_id     = oci_apigateway_gateway.app.id
              path_prefix    = "/v1"

              specification {
                request_policies {
                  mutual_tls {
                    is_verified_certificate_required = true
                    allowed_sans                     = ["client.app.example.com"]
                  }
                  authentication {
                    type                        = "JWT_AUTHENTICATION"
                    is_anonymous_access_allowed = false
                    issuers                     = ["https://idp.example.com/"]
                    audiences                   = ["api.example.com"]

                    public_keys {
                      type                       = "REMOTE_JWKS"
                      uri                        = "https://idp.example.com/.well-known/jwks.json"
                      max_cache_duration_in_hours = 1
                    }
                  }
                }
                routes {
                  path    = "/orders"
                  methods = ["GET"]
                  backend {
                    type = "HTTP_BACKEND"
                    url  = "https://backend.internal/orders"
                  }
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/APIGateway/Tasks/apigatewayaddingmTLS.htm
        title: OCI - API Gateway Mutual TLS
  - uid: mondoo-oci-security-apigateway-deployment-mtls-verified-oci
