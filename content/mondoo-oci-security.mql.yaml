    docs:
      desc: |
        This check verifies that obsolete administrative and file-sharing protocols are not exposed to the internet.

        The rejected shape is TCP ingress from `0.0.0.0/0` covering FTP on 21, Telnet on 23, the NetBIOS ports 135, 137, 138 and 139, or SMB on 445, including a rule with no port range, which covers all of them. These protocols predate the assumption that a network path might be hostile, and each fails in its own way once it is. Rules are removed on the security list details page under Networking > Virtual Cloud Networks or with `oci network security-list update`.

        **Why this matters**

        Port 445 is the one with a body count. SMB exposure carried WannaCry and NotPetya across the internet in 2017, and the EternalBlue family of exploits behind them is still folded into commodity tooling, so an open 445 remains directly exploitable rather than merely inadvisable.

        Telnet on 23 and FTP on 21 carry credentials in cleartext. Anyone positioned on the path between client and server, which across the public internet means any of the networks the packets traverse, reads the username and password verbatim, and FTP's separate data channel makes the transferred content just as readable.

        NetBIOS on 135, 137, 138 and 139 is a reconnaissance gift. A remote query returns Windows hostnames, domain and workgroup membership, logged-on users, the security identifiers known as SIDs, and a list of available shares, which is precisely the input an attacker needs to choose a target account and plan privilege escalation before touching anything else.

        No production cloud workload has a legitimate reason to answer these ports from the internet. Replace FTP with SFTP or an HTTPS transfer endpoint, replace Telnet with SSH, and carry SMB between sites over a VPN or a zero trust network access broker. Where a legacy system genuinely cannot be changed, move it to a private subnet and reach it through a bastion.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Networking** > **Virtual Cloud Networks**.
        2. For each VCN, open **Security Lists** and select each security list.
        3. Under **Ingress Rules**, look for any rule where **Source** is `0.0.0.0/0`, **Protocol** is `TCP`, and the **Destination Port Range** covers any of: 21 (FTP), 23 (Telnet), 135 (RPC), 137-139 (NetBIOS), or 445 (SMB).

        A passing security list has no ingress rule that allows `0.0.0.0/0` TCP access to any of those legacy admin or file-sharing ports. A failing security list contains at least one such rule.

        ### Audit via CLI

        1. List all security lists and retrieve ingress rules:

        ```bash
        oci network security-list get \
          --security-list-id <security-list-ocid> \
          --query 'data."ingress-security-rules"[?source==`0.0.0.0/0` && protocol==`6`].{Source:source, MinPort:"tcp-options"."destination-port-range".min, MaxPort:"tcp-options"."destination-port-range".max}' \
          --output table
        ```

        A passing security list returns no TCP ingress rules from `0.0.0.0/0` whose port range covers 21, 23, 135, 137, 138, 139, or 445. A failing security list returns at least one rule covering one of those ports.
      remediation:
        - id: console
          desc: |
            Remove legacy-port ingress rules from the security list:

            1. Open **Networking** → **Virtual Cloud Networks** → the parent VCN → **Security Lists** → select the flagged list.
            2. Identify and delete any ingress rule whose source is `0.0.0.0/0` and destination port covers 21, 23, 135, 137-139, or 445.
            3. If file-sharing is actually required, provision a VPN or FastConnect path and scope the security-list rule to the resulting private CIDR block.
        - id: cli
          desc: |
            Replace the security list's ingress rules with a set that omits these ports.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the offending rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id <security-list-ocid> \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json`, deleting the public legacy-port rules or restricting them to an internal source such as `{"source":"10.0.0.0/8","protocol":"6","tcpOptions":{"destinationPortRange":{"min":445,"max":445}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id <security-list-ocid> \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            Drop any `ingress_security_rules` blocks that combine `source = "0.0.0.0/0"` with TCP port ranges covering 21, 23, 135, 137, 138, 139, or 445; require an internal CIDR for any legitimate file-sharing use case:

            ```hcl
            resource "oci_core_security_list" "internal" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.main.id
              display_name   = "internal-fileshare"

              ingress_security_rules {
                source      = "10.0.0.0/8"
                source_type = "CIDR_BLOCK"
                protocol    = "6"

                tcp_options {
                  min = 445
                  max = 445
                }
              }
            }
            ```
