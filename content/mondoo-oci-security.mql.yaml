  - uid: mondoo-oci-security-apigateway-deployment-no-wildcard-cors
    title: Ensure API Gateway deployments do not use wildcard CORS origins
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-12
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-oci-security-apigateway-deployment-no-wildcard-cors-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-apigateway-deployment-no-wildcard-cors-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-no-wildcard-cors-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-no-wildcard-cors-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that API Gateway deployments restrict cross-origin resource sharing to a named allowlist of origins rather than the wildcard value `"*"`.

        The CORS policy inside a deployment's request policies publishes which browser origins may read responses from the API. Its `allowedOrigins` list is the allowlist, and the wildcard entry `*` tells every browser that any page on the internet may share the response. OCI enforces no wildcard restriction of its own, and wildcard origins are commonly introduced for local development and then shipped to production unchanged. This check requires that `allowed_origins` either be absent or contain no wildcard entry. Edit it in the Console under Developer Services > API Management > Gateways on the deployment's request policies, or with `oci api-gateway deployment update`.

        **Why this matters**

        With a wildcard in place, any malicious page loaded in a user's browser can issue requests to the API and read the responses. Wildcard CORS removes the same-origin protection browsers rely on to keep session data scoped to the application that owns it, which turns a logged-in user's browser into an access path for whoever controls the page they happen to visit.

        The dangerous pair is the wildcard together with credentials. The CORS specification forbids combining a wildcard origin with `Access-Control-Allow-Credentials: true`, precisely because it would let arbitrary origins make authenticated cross-origin calls, but some servers honor the combination anyway and expose session tokens and cookies to any origin that asks.

        An explicit list of frontend origins is also a useful artifact for access-control audits. A wildcard leaves no record of which origins were ever intended to be legitimate, so there is nothing to review against.

        Replacing the wildcard with named origins re-enables browser enforcement for authenticated APIs, closes the credentials-plus-wildcard combination, and makes every new consumer a reviewed addition to the list. A genuinely public, unauthenticated, read-only endpoint is the one place a wildcard is defensible, and it belongs in its own deployment.
      audit: |
        ### Audit via Console

        1. Open **Developer Services** in the OCI Console and navigate to **API Gateway** -> **Deployments**.
        2. For each deployment, open the deployment details and select **API Request Policies**.
        3. Expand the **CORS** section and review the **Allowed Origins** list.
        4. Check whether the wildcard value `*` appears in the origins list.

        A passing deployment has no `*` entry in Allowed Origins. A failing deployment lists `*` as one of the allowed origins.

        ### Audit via CLI

        1. List all API Gateway deployments across the compartment, then retrieve each deployment's specification to inspect the CORS allowed origins:

        ```bash
        oci api-gateway deployment list \
          --compartment-id <compartment-ocid> \
          --query 'data.items[*].{id:id, displayName:"display-name"}' \
          --output table

        oci api-gateway deployment get \
          --deployment-id <deployment-ocid> \
          --query 'data.specification."request-policies".cors."allowed-origins"'
        ```

        A passing deployment returns a list that does not contain `"*"`. A failing deployment returns a list that includes `"*"`.
      remediation:
        - id: console
          desc: |
            Replace the wildcard CORS origin with an explicit allowlist:

            1. Open **Developer Services** → **API Gateway** → **Deployments** → select the deployment → **API Request Policies**.
            2. Open **CORS** and remove the `*` entry from **Allowed Origins**.
            3. Add each legitimate front-end origin (e.g. `https://app.example.com`) explicitly.
            4. Save and deploy. Verify that production front-ends still load the API.
        - id: cli
          desc: |
            Update the deployment with a CORS specification whose `allowedOrigins` is an explicit list.

            **Warning: `--specification` replaces the COMPLETE deployment specification.** The specification is a large nested document covering every route, backend, and policy. Whatever you pass becomes the entire spec, so anything you omit is removed. Retrieve the current spec first, edit only the CORS block, then resubmit the entire document.

            1. Export the current specification so you keep every route and backend:

            ```bash
            oci api-gateway deployment get \
              --deployment-id <deployment-ocid> \
              --query 'data.specification' > specification.json
            ```

            2. In `specification.json`, replace `"*"` in the CORS `allowedOrigins` list with an explicit list of trusted origins, leaving all other routes and backends intact. Resubmit the full document:

            ```bash
            oci api-gateway deployment update \
              --deployment-id <deployment-ocid> \
              --specification file://specification.json
            ```
        - id: terraform
          desc: |
            Replace `"*"` in `allowed_origins` with an explicit list of trusted origins:

            ```hcl
            resource "oci_apigateway_deployment" "app" {
              compartment_id = var.compartment_ocid
              gateway_id     = oci_apigateway_gateway.app.id
              path_prefix    = "/v1"

              specification {
                request_policies {
                  cors {
                    allowed_origins             = ["https://app.example.com"]
                    allowed_methods             = ["GET", "POST"]
                    allowed_headers             = ["Content-Type", "Authorization"]
                    is_allow_credentials_enabled = true
                    max_age_in_seconds          = 600
                  }
                }
                routes {
                  path    = "/orders"
                  methods = ["GET"]
                  backend {
                    type = "HTTP_BACKEND"
                    url  = "https://backend.internal/orders"
                  }
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/APIGateway/Tasks/apigatewayusingcorspolicies.htm
        title: OCI - API Gateway CORS Policies
  - uid: mondoo-oci-security-apigateway-deployment-no-wildcard-cors-oci
