  # No Terraform variants: requires correlating user lifecycle-state with API-key state, both of which are runtime-only — `oci_identity_api_key` has no `state` argument and `oci_identity_user` has no field that exposes ACTIVE/INACTIVE lifecycle.
  - uid: mondoo-oci-security-iam-inactive-users-no-active-api-keys
    title: Ensure inactive users have no active API keys
    impact: 80
    filters: asset.platform == "oci-identity-user" && oci.identity.user.state != "ACTIVE"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-2-2
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      oci.identity.user.apiKeys.none(state == "ACTIVE")
    docs:
      desc: |
        This check verifies that programmatic credentials are revoked when a user account is deactivated, by requiring that users outside the active lifecycle state hold no API signing key in the active state.

        An OCI API signing key is an RSA key pair. The public half is uploaded against the user and identified by fingerprint, and the private half signs every REST API and SDK request that user makes. Deactivating the user changes the account lifecycle state and blocks Console sign-in, but it does nothing to the keys. They stay listed against the account and stay usable. Removing them is a separate action, taken under Identity & Security > Domains > Users on the user's API keys, or with `oci iam user api-key delete` against the key fingerprint.

        **Why this matters**

        An active key on a deactivated account is a working credential for an identity that is supposed to have no access. Every policy that once applied to that user still applies to requests signed by the key, so the API path stays fully open while the Console path looks closed. Whoever last held the private key, a departed employee, a decommissioned build agent, or an attacker who copied it earlier, keeps that access.

        The exposure is also unusually long-lived. Deactivated accounts drop out of the reviews that focus on active users, so nobody is looking. A leaked key belonging to a deactivated identity can be exercised for months before anyone connects the API activity to an account everyone believed was shut down.

        Frameworks that govern identity lifecycle require credentials to be revoked at deprovisioning, not merely disabled at the sign-in surface. An active key on an inactive account is a direct, demonstrable gap against that requirement.

        Fold key deletion into the deactivation runbook so both happen together, and enumerate credentials across all users rather than only active ones, which is the only way to find the keys earlier offboardings missed.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Identity & Security > Users**.
        3. Filter or identify users whose **State** is not **Active**.
        4. For each inactive user, select the user name.
        5. Under **Resources**, select **API Keys**.
        6. Review whether any listed API keys have a state of **Active**.

        A passing inactive user has no API keys in the **Active** state. A failing inactive user has one or more API keys listed as **Active**.

        ### Audit via CLI

        1. List API keys for an inactive user and check their state:

        ```bash
        oci iam user api-key list --user-id <USER_OCID>
        ```

        A passing inactive user returns no keys with `"lifecycle-state": "ACTIVE"`. A failing inactive user returns one or more keys with `"lifecycle-state": "ACTIVE"`.
      remediation:
        - id: console
          desc: |
            To remove active API keys from inactive users using the OCI Console:

            1. Navigate to **Identity & Security > Users**.
            2. Select the inactive user.
            3. Under **Resources**, select **API Keys**.
            4. Delete all active API keys associated with the user.
        - id: cli
          desc: |
            To remove active API keys from inactive users using the OCI CLI, start by listing the keys for the user:

            ```bash
            oci iam user api-key list --user-id USER_OCID
            ```

            For each key with an `ACTIVE` state, delete it by specifying its fingerprint:

            ```bash
            oci iam user api-key delete --user-id USER_OCID --fingerprint KEY_FINGERPRINT
            ```
        # No Terraform remediation: API key active state is runtime-only telemetry; the `oci_identity_api_key` Terraform resource has no `state` argument that reflects or controls whether a key is active or inactive.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/managingcredentials.htm
        title: OCI API key management
  # No Terraform variants: requires correlating user lifecycle-state with auth-token state, both of which are runtime-only — `oci_identity_auth_token` has no `state` argument and `oci_identity_user` has no field that exposes ACTIVE/INACTIVE lifecycle.
  - uid: mondoo-oci-security-iam-inactive-users-no-active-auth-tokens
    title: Ensure inactive users have no active auth tokens
    impact: 80
    filters: asset.platform == "oci-identity-user" && oci.identity.user.state != "ACTIVE"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-2-2
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      oci.identity.user.authTokens.none(state == "ACTIVE")
    docs:
      desc: |
        This check verifies that token credentials are revoked at deprovisioning, by requiring that users outside the active lifecycle state hold no auth token in the active state.

        An OCI auth token is an Oracle-generated password string used where request signing is not an option, notably for `docker login` against Container Registry, for the Swift API in front of Object Storage, and for service integrations such as Autonomous Database. The token value is displayed once at creation and never again, and each user may hold at most two. Deactivating the account leaves those tokens in place and usable. Deleting them is a separate step, taken on the user under Identity & Security > Domains > Users or with `oci iam auth-token delete`.

        **Why this matters**

        An active token on an inactive account is a fully functional bearer credential that walks straight past the deactivation. Anything the token was minted for still works: pushing and pulling images from a registry, listing and downloading buckets over Swift. Unlike a signing key, a token needs no private file to be useful, so a copy pasted into a pipeline variable or a wiki page is immediately usable by whoever reads it.

        Tokens are also the credential type most often missed. They do not appear in the user-facing dashboards people check during offboarding, and because the secret was shown only once, it typically lives inside a CI system or a container build rather than anywhere identity administrators look. The account is closed, the reviewer sees nothing, and the token keeps authenticating.

        Leaving them behind directly contradicts the intent of the deactivation and creates compliance exposure, since the identity is recorded as deprovisioned while a working credential for it remains.

        Add token deletion to the offboarding checklist alongside key revocation, automate enumeration and removal for any account transitioning out of the active state, and periodically list credentials on inactive accounts to catch what earlier passes left behind.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Identity & Security > Users**.
        3. Filter or identify users whose **State** is not **Active**.
        4. For each inactive user, select the user name.
        5. Under **Resources**, select **Auth Tokens**.
        6. Review whether any listed auth tokens have a state of **Active**.

        A passing inactive user has no auth tokens in the **Active** state. A failing inactive user has one or more auth tokens listed as **Active**.

        ### Audit via CLI

        1. List auth tokens for an inactive user and check their state:

        ```bash
        oci iam auth-token list --user-id <USER_OCID>
        ```

        A passing inactive user returns no tokens with `"lifecycle-state": "ACTIVE"`. A failing inactive user returns one or more tokens with `"lifecycle-state": "ACTIVE"`.
      remediation:
        - id: console
          desc: |
            To remove active auth tokens from inactive users using the OCI Console:

            1. Navigate to **Identity & Security > Users**.
            2. Select the inactive user.
            3. Under **Resources**, select **Auth Tokens**.
            4. Delete all active auth tokens associated with the user.
        - id: cli
          desc: |
            To remove active auth tokens from inactive users using the OCI CLI, start by listing the tokens for the user:

            ```bash
            oci iam auth-token list --user-id USER_OCID
            ```

            For each token with an `ACTIVE` state, delete it:

            ```bash
            oci iam auth-token delete --user-id USER_OCID --auth-token-id TOKEN_OCID
            ```
        # No Terraform remediation: auth token active state is runtime-only telemetry; the `oci_identity_auth_token` Terraform resource has no `state` argument that reflects or controls whether a token is active on an inactive user account.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/managingcredentials.htm
        title: OCI auth token management
  - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible
    title: Ensure Object Storage buckets are not publicly accessible
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that anonymous, unauthenticated access to an Object Storage bucket is disabled by requiring the public access type `NoPublicAccess`.

        Every bucket carries a public access type that decides whether a caller must prove who it is. `NoPublicAccess` forces each request to present a signed identity that IAM then authorizes. `ObjectRead` lets anyone on the internet both list the bucket and download its objects, and `ObjectReadWithoutList` still serves object data to anonymous callers while withholding only the listing. New buckets are created as `NoPublicAccess`, so a public bucket is always a deliberate change. Restore it under Storage > Buckets on the bucket detail page, or run `oci os bucket update --namespace <namespace> --name <bucket> --public-access-type NoPublicAccess`.

        **Why this matters**

        A publicly accessible bucket hands any internet user the stored objects without authentication. In practice that means sensitive files, credentials, backups, and application data leave the tenancy with no record of who took them and no way to revoke what was already copied.

        Object Storage endpoints are predictable. Bucket names are unique within a tenancy namespace and region, so once an attacker learns your namespace they can grind candidate names against a fixed URL pattern. Scanning tools do exactly this continuously, which is why a bucket that turns public is found in hours rather than months.

        Visibility is also easy to flip by accident during routine bucket management, and one such change exposes an entire bucket's contents at once. GDPR, HIPAA, and PCI DSS all require access to personal and payment data to be restricted to authorized parties, and a public bucket violates that outright.

        When something genuinely must be shared outside the tenancy, issue a pre-authenticated request instead. It grants revocable, time-limited access scoped to a single object or a name prefix rather than opening the whole bucket. Treat any bucket whose access type deviates from `NoPublicAccess` as a change that needs documented business justification, and enumerate access types continuously so a deviation raises an alert rather than waiting for an audit.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Object Storage > Buckets**.
        3. For each bucket in the list, review the **Visibility** column.

        A passing bucket shows **Visibility: Private**. A failing bucket shows **Visibility: Public**.

        ### Audit via CLI

        1. List all buckets in a namespace and compartment, then check the access type for each:

        ```bash
        oci os bucket get --bucket-name <BUCKET_NAME> --query "data.{Name:name, AccessType:\"public-access-type\"}" --output table
        ```

        A passing bucket returns `NoPublicAccess` in the `AccessType` field. A failing bucket returns `ObjectRead`, `ObjectReadWithoutList`, or any value other than `NoPublicAccess`.
      remediation:
        - id: console
          desc: |
            To restrict public access on an Object Storage bucket using the OCI Console:

            1. Navigate to **Object Storage > Buckets**.
            2. Select the bucket identified in this finding.
            3. Select **Edit Visibility**.
            4. Set visibility to **Private**.
            5. Select **Save Changes**.
        - id: cli
          desc: |
            To restrict public access on an Object Storage bucket using the OCI CLI, set the access type to `NoPublicAccess`:

            ```bash
            oci os bucket update --bucket-name BUCKET_NAME --public-access-type NoPublicAccess
            ```
        - id: terraform
          desc: |
            To restrict public access on an Object Storage bucket in Terraform, set the `access_type` to `NoPublicAccess`:

            ```hcl
            resource "oci_objectstorage_bucket" "example" {
              compartment_id = var.compartment_ocid
              namespace      = var.namespace
              name           = "example-bucket"
              access_type    = "NoPublicAccess"
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/managingbuckets.htm
        title: CIS OCI Foundations Benchmark 4.1.1
  - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-oci
    filters: asset.platform == "oci-objectstorage-bucket"
    mql: |
      oci.objectStorage.bucket.publicAccessType == "NoPublicAccess"
  - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_objectstorage_bucket")
    mql: |
      terraform.resources("oci_objectstorage_bucket").all(
        arguments.access_type == "NoPublicAccess" || arguments.access_type == empty
      )
  - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_objectstorage_bucket").all(
        change.after.access_type == "NoPublicAccess" || change.after.access_type == empty
      )
  - uid: mondoo-oci-security-object-storage-buckets-not-publicly-accessible-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.state.resources.where(type == "oci_objectstorage_bucket").all(
        values.access_type == "NoPublicAccess" || values.access_type == empty
      )
  - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled
    title: Ensure Object Storage buckets have versioning enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-13
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that object versioning is enabled on Object Storage buckets, so that overwriting or deleting an object preserves the copy that was there before.

        With versioning set to `Enabled`, each write creates a new version and a delete only writes a delete marker, leaving the previous version retrievable by its version ID. Buckets are created with versioning off, so version retention has to be turned on deliberately, either in the Console under Storage > Buckets on the bucket detail page or with `oci os bucket update --namespace <namespace> --name <bucket> --versioning Enabled`. Once enabled, versioning can be suspended but never returned to the disabled state, so versions already captured stay available.

        **Why this matters**

        Without versioning, a deleted object is permanently gone the moment the delete call returns. There is no undo, no grace period, and no way to tell after the fact what the object contained. With versioning on, the previous version is restored in place with no data loss and no dependency on a separate backup system.

        Versioning also limits the blast radius of destructive operations. Ransomware that encrypts files by overwriting them in place produces new versions rather than destroying the originals, so an earlier clean version of every affected object remains available for recovery.

        Retained versions form an implicit audit trail of how an object changed and when, which is what forensic investigations and compliance reviews need in order to demonstrate data integrity over time.

        Apply versioning to every bucket holding data that cannot be easily regenerated, including backups, logs, and application state. Pair it with object lifecycle rules that expire noncurrent versions after a defined retention period, otherwise storage cost grows with every write and never comes back down. Finally, periodically retrieve a previous version for real, because a recovery procedure that has never been exercised is an assumption rather than a capability.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Object Storage > Buckets**.
        3. Select each bucket to open its details page.
        4. Locate the **Versioning** field in the bucket details.

        A passing bucket shows **Versioning: Enabled**. A failing bucket shows **Versioning: Disabled** or **Versioning: Suspended**.

        ### Audit via CLI

        1. Retrieve versioning status for a bucket:

        ```bash
        oci os bucket get --bucket-name <BUCKET_NAME> --query "data.{Name:name, Versioning:versioning}" --output table
        ```

        A passing bucket returns `Enabled` in the `Versioning` field. A failing bucket returns `Disabled` or `Suspended`.
      remediation:
        - id: console
          desc: |
            To enable versioning on an Object Storage bucket using the OCI Console:

            1. Navigate to **Object Storage > Buckets**.
            2. Select the bucket identified in this finding.
            3. Select **Edit Versioning**.
            4. Enable versioning.
            5. Select **Save Changes**.
        - id: cli
          desc: |
            To enable versioning on an Object Storage bucket using the OCI CLI, update the bucket's versioning setting:

            ```bash
            oci os bucket update --bucket-name BUCKET_NAME --versioning Enabled
            ```
        - id: terraform
          desc: |
            To enable versioning on an Object Storage bucket in Terraform, set the `versioning` attribute to `Enabled`:

            ```hcl
            resource "oci_objectstorage_bucket" "example" {
              compartment_id = var.compartment_ocid
              namespace      = var.namespace
              name           = "example-bucket"
              versioning     = "Enabled"
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/usingversioning.htm
        title: OCI Object Storage versioning documentation
  - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled-oci
    filters: asset.platform == "oci-objectstorage-bucket"
    mql: |
      oci.objectStorage.bucket.versioning == "Enabled"
  - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_objectstorage_bucket")
    mql: |
      terraform.resources("oci_objectstorage_bucket").all(
        arguments.versioning == "Enabled"
      )
  - uid: mondoo-oci-security-object-storage-buckets-versioning-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_objectstorage_bucket").all(
