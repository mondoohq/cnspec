        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every active certificate in the OCI Certificates service is backed by a key algorithm from the approved set: `RSA2048`, `RSA4096`, `ECDSA_P256`, or `ECDSA_P384`.

        The service handles two kinds of certificate. Ones it issues from a managed certificate authority take the key algorithm chosen at creation time. Imported ones carry whatever key the external issuer generated, and OCI applies no algorithm-strength gate at import, so a certificate holding a 1024-bit RSA key enters the inventory looking identical to a freshly issued one. Set the algorithm on the certificate configuration under Identity & Security > Certificates in the Console or with `oci certs-mgmt certificate create`, and reissue imported certificates that fall short.

        **Why this matters**

        A 1024-bit RSA key is considered factorable by a well-resourced attacker and is explicitly prohibited by NIST SP 800-131A. Every session protected by such a certificate inherits that weakness, and so does every signature the certificate has already produced, because recovering the private key unlocks all of it retroactively.

        Certificate lifetimes make the exposure durable. A certificate issued today is typically valid for one to several years, so a weak key accepted now is a liability for that whole term, across which the tooling and hardware available to an attacker only improve.

        Strength is not the only reason the approved list is narrow. Short elliptic-curve keys and curves outside the NIST set are rejected outright by strict TLS stacks, so an unusual choice produces intermittent connection failures that look like a network problem and get chased as one. Holding to the four approved algorithms avoids that availability failure alongside the cryptographic one.

        Imported certificates are where this check earns its keep. They are the population nobody deliberately chose a key for, and the only route by which a pre-standard algorithm reaches production traffic without anyone making a decision about it.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** in the OCI Console and navigate to **Certificates** -> **Certificates**.
        2. Select each active certificate and open its details page.
        3. In the **Certificate information** section, locate the **Key algorithm** field.
        4. Verify the value is one of: `RSA2048`, `RSA4096`, `ECDSA_P256`, or `ECDSA_P384`.

        A passing certificate shows a key algorithm of `RSA2048`, `RSA4096`, `ECDSA_P256`, or `ECDSA_P384`. A failing certificate shows a weaker algorithm such as `RSA1024`.

        ### Audit via CLI

        1. List active certificates and retrieve the key algorithm for each:

        ```bash
        oci certs-mgmt certificate list \
          --compartment-id <compartment-ocid> \
          --lifecycle-state ACTIVE \
          --query 'data.items[*].{name:name, keyAlgorithm:"key-algorithm"}' \
          --output table
        ```

        A passing certificate returns a `keyAlgorithm` value of `RSA2048`, `RSA4096`, `ECDSA_P256`, or `ECDSA_P384`. A failing certificate returns any other value.
      remediation:
        - id: console
          desc: |
            Re-issue certificates with weak key algorithms using a strong key:

            1. Open **Identity & Security** → **Certificates** → **Certificates** → identify certificates with weak key algorithms.
            2. For internally-issued certificates, choose **Issue New Version** and select **RSA2048**, **RSA4096**, **ECDSA_P256**, or **ECDSA_P384** as the key algorithm.
            3. For imported certificates, regenerate the certificate externally with a strong key algorithm and re-import.
            4. Update consumers to pick up the new version, then deprecate the old version.
        - id: cli
          desc: |
            Key algorithms cannot be changed on an existing certificate. Issue a replacement internally-issued certificate with a strong key algorithm and migrate consumers:

            ```bash
            oci certs-mgmt certificate create-certificate-issued-by-internal-ca \
              --compartment-id <compartment-ocid> \
              --name app-tls-cert-v2 \
              --issuer-certificate-authority-id <ca-ocid> \
              --key-algorithm RSA2048 \
              --signature-algorithm SHA256_WITH_RSA \
              --subject '{"commonName":"app.example.com"}' \
              --validity '{"timeOfValidityNotAfter":"2027-01-01T00:00:00Z"}'
            ```
        - id: terraform
          desc: |
            This Terraform fix applies only to internally-issued certificates. Imported certificates have no `key_algorithm` argument in HCL because their key material is generated outside OCI, so a weak imported certificate must be re-issued externally with a strong key algorithm and re-imported.

            Set `certificate_config.key_algorithm` to a strong value on every internally-issued certificate:

            ```hcl
            resource "oci_certificates_management_certificate" "app" {
              compartment_id = var.compartment_ocid
              name           = "app-tls-cert"

              certificate_config {
                config_type                  = "ISSUED_BY_INTERNAL_CA"
                issuer_certificate_authority_id = oci_certificates_management_certificate_authority.internal.id
                key_algorithm                = "RSA2048"
                signature_algorithm          = "SHA256_WITH_RSA"

                subject {
                  common_name = "app.example.com"
                }

                validity {
                  time_of_validity_not_after = "2027-01-01T00:00:00Z"
                }
              }

              certificate_rules {
                rule_type              = "CERTIFICATE_RENEWAL_RULE"
                advance_renewal_period = "P30D"
                renewal_interval       = "P365D"
              }
            }
            ```
