queries:
  # No Terraform variants: MFA activation is operational telemetry exposed by the IAM API at runtime; the `oci_identity_user` Terraform resource has no field that toggles or evidences MFA enrollment.
  - uid: mondoo-oci-security-iam-mfa-enabled-for-active-users
    title: Ensure MFA is enabled for all active IAM users
    impact: 90
    filters: asset.platform == "oci-identity-user" && oci.identity.user.state == "ACTIVE"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      oci.identity.user.mfaActivated == true
    docs:
      desc: |
        This check verifies that multi-factor authentication is activated for every user in the active lifecycle state.

        Multi-factor authentication in OCI binds a Console sign-in to a registered TOTP authenticator app in addition to the account password. Enrollment is never automatic. OCI creates users with password authentication alone, and the account stays single-factor until the user or an administrator registers a device under Identity & Security > Domains > Users, so a tenancy that has never run an enrollment campaign is a tenancy where every account is one stolen password away from being used.

        **Why this matters**

        A password is a replayable secret. A phishing page, a credential-stuffing run against a password reused from a breached site, and offline brute force against a leaked hash all end the same way, with an attacker holding a string that signs in. A registered second factor defeats all three at the authentication step, because the stolen string no longer completes a login on its own.

        The accounts worth enrolling first are the ones that can rewrite the environment. A member of the `Administrators` group, or of any group holding `allow group <group> to manage all-resources in tenancy`, can attach policies, mint API signing keys for other identities, open security lists, and read storage in every compartment. One compromised administrator password is a full tenancy takeover, so this is where a second factor buys the most.

        MFA also gives the audit trail meaning. Without it, a log entry asserts only that someone knew a password. With it, the sign-in carries far stronger assurance that the recorded principal really was the account owner, which is exactly the assurance an incident investigation runs on.

        Enroll administrators and operators first, extend to the remaining active users, and audit enrollment continuously so an account whose device registration lapses is caught rather than quietly falling back to a password alone.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Identity & Security > Users**.
        3. For each active user in the list, select the user name.
        4. Under **Resources**, select **Multi-Factor Authentication**.
        5. Confirm whether MFA is shown as enabled.

        A passing user shows MFA status as **Enabled**. A failing user shows MFA as **Not enabled** or has no MFA device enrolled.

        ### Audit via CLI

        1. List all active users and their MFA status:

        ```bash
        oci iam user list --query "data[?\"lifecycle-state\"=='ACTIVE'].{Name:name, MFAActivated:\"is-mfa-activated\"}" --output table
        ```

        A passing user returns `true` in the `MFAActivated` column. A failing user returns `false`.
      remediation:
        - id: console
          desc: |
            An administrator can require and initiate MFA, but each user completes the TOTP device enrollment from their own profile. The check passes only once the user finishes enrollment.

            As an administrator, require MFA through a sign-on policy:

            1. Navigate to **Identity & Security > Domains** → select the domain → **Security** → **Sign-on policies**.
            2. Add or edit a sign-on rule that requires multi-factor authentication for the relevant users or groups.
            3. Save the policy.

            Each affected user then enrolls a TOTP device themselves:

            1. The user signs in to the OCI Console and opens their own **My profile**.
            2. They select **Security** → **Set up** for multi-factor authentication.
            3. They scan the QR code with an authenticator app and confirm the generated code.

            Repeat the user-enrollment step for each active user that has not yet completed MFA enrollment.
        - id: cli
          desc: |
            MFA must be enabled by each user through the Console. To identify users without MFA using the OCI CLI, list their MFA status:

            ```bash
            oci iam user list --query "data[?\"is-mfa-activated\"==\`false\`].{Name:name, MFA:\"is-mfa-activated\"}" --output table
            ```

            Contact each listed user and direct them to enable MFA through their OCI Console profile settings.
        # No Terraform remediation: MFA activation is end-user runtime state; the `oci_identity_user` Terraform resource has no field that toggles or evidences MFA enrollment.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/usingmfa.htm
        title: CIS OCI Foundations Benchmark 1.7
  # No Terraform variants: email verification is end-user-driven runtime state on the IAM identity; the `oci_identity_user` Terraform resource sets the email but cannot express whether it has been verified.
  - uid: mondoo-oci-security-iam-user-emails-verified
    title: Ensure IAM user email addresses are verified
    impact: 60
    filters: asset.platform == "oci-identity-user" && oci.identity.user.state == "ACTIVE" && oci.identity.user.email != ""
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-6
      compliance/nist-csf-2: nist-csf-2-pr-aa-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      oci.identity.user.emailVerified == true
    docs:
      desc: |
        This check verifies that every active user carrying an email address has proven ownership of that address.

        OCI stores a user's email as soon as an administrator or the user sets it, and tracks separately whether the address has been verified. Verification completes only when the recipient follows the confirmation link OCI mails out, so until then the attribute is present but unproven. Administrators review the state and resend the confirmation from Identity & Security > Domains > Users. The check looks at users in the active state that actually have an address on file and requires the verified flag to be set.

        **Why this matters**

        Email is the account recovery channel. Password reset links and one-time codes are delivered to the recorded address, so an unverified address means a locked-out user may be unable to self-recover, and it leaves open the worse possibility that recovery mail is arriving at an address the organization does not control and cannot audit.

        It is also the security notification channel. OCI mails users about suspicious sign-in activity and about identity changes affecting their account. An unverified address drops those messages silently. Nothing bounces, nobody escalates, and the first visible sign of a compromised account becomes whatever the attacker chooses to do with it.

        An unverified address on an active account is a useful signal in its own right. It usually means the person never finished setup, which frequently means the account was provisioned for someone who never started or who left before completing onboarding. What remains is an active identity holding whatever group memberships it was given, with no owner reading anything OCI sends about it.

        Make verification a required step of onboarding so no account reaches active status unproven, review active users for unverified addresses on a schedule, and deactivate accounts that remain unverified past a defined grace period rather than letting them accumulate.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Identity & Security > Users**.
        3. For each active user that has an email address configured, select the user name.
        4. Review the **Email Verified** field in the user details.

        A passing user shows **Email Verified: Yes**. A failing user shows **Email Verified: No**.

        ### Audit via CLI

        1. List active users with their email verification status:

        ```bash
        oci iam user list --query "data[?\"lifecycle-state\"=='ACTIVE' && email!=null].{Name:name, Email:email, Verified:\"email-verified\"}" --output table
        ```

        A passing user returns `true` in the `Verified` column. A failing user returns `false`.
      remediation:
        - id: console
          desc: |
            To verify IAM user email addresses using the OCI Console:

            1. Navigate to **Identity & Security > Users**.
            2. Identify users with unverified email addresses.
            3. Contact those users and ask them to verify their email through their user profile settings.
        - id: cli
          desc: |
            To identify users with unverified email addresses using the OCI CLI, list their verification status:

            ```bash
            oci iam user list --query "data[?\"lifecycle-state\"=='ACTIVE' && \"email-verified\"==\`false\` && email!=null].{Name:name, Email:email, Verified:\"email-verified\"}" --output table
            ```

            Contact each listed user and ask them to verify their email through the OCI Console.
        # No Terraform remediation: email verification is end-user-driven runtime state; the `oci_identity_user` Terraform resource sets the email address but cannot express whether it has been verified.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/managingusers.htm
        title: OCI IAM user management
  - uid: mondoo-oci-security-iam-no-overly-permissive-policies
    title: Ensure no IAM policies grant manage all-resources in tenancy
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-oci-security-iam-no-overly-permissive-policies-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-iam-no-overly-permissive-policies-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-no-overly-permissive-policies-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-no-overly-permissive-policies-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no IAM policy grants unrestricted administrative control across the entire tenancy.

        OCI policies are written as statements in a sentence-like language rather than as JSON documents. A statement reads `allow group <group> to <verb> <resource-type> in <scope>`, where the verb is `inspect`, `read`, `use`, or `manage` in increasing order of power. The statement rejected here is `allow group <group> to manage all-resources in tenancy`, combining the strongest verb, the widest resource type, and the root scope in one line. A new tenancy carries no such grant outside the built-in policy for `Administrators`, so it must be written deliberately, under Identity & Security > Policies, through `oci iam policy update`, or from Terraform, which this check also inspects as configuration, plan, and state.

        **Why this matters**

        Scope in OCI inherits downward. `in tenancy` is not simply a larger compartment than `in compartment X`; it is the root, so the grant reaches every compartment beneath it, including compartments created later. A group holding it can create, modify, and delete any resource of any type anywhere: users and policies, VCNs and security lists, block volumes, Object Storage buckets, and databases.

        That makes such a policy an escalation terminus. An attacker who phishes one member of the group, or who finds an API signing key belonging to one, is already a tenancy administrator with no further pivot to perform and no compartment boundary left to cross. An automation credential attached to the group by convenience carries the same reach.

        Broad grants also destroy the readability of access. When a single policy answers yes to everything, an access review cannot state which team reaches which data, and an investigation cannot narrow who was capable of a given change.

        Grant the resource families a group actually operates, inside the compartments it owns, using statements such as `manage instance-family` or `manage virtual-network-family` in a named compartment. Review tenancy-level policies regularly and narrow anything broader than the current workload requires.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Identity & Security > Policies**.
        3. Review each policy listed at the tenancy (root compartment) level.
        4. Expand each policy and inspect its statements for any that contain `manage all-resources in tenancy`.

        A passing policy contains no statements granting `manage all-resources in tenancy`. A failing policy contains at least one such statement.

        ### Audit via CLI

        1. List all policies in the tenancy and inspect their statements:

        ```bash
        oci iam policy list --compartment-id <TENANCY_OCID> --all --query "data[].{Name:name, Statements:statements}" --output json
        ```

        A passing policy returns no statements matching `manage all-resources in tenancy`. A failing policy returns one or more statements with that permission.
      remediation:
        - id: console
          desc: |
            To replace overly permissive IAM policies with scoped policies using the OCI Console:

            1. Navigate to **Identity & Security > Policies**.
            2. Identify policies containing `manage all-resources in tenancy`.
            3. Replace with scoped policies that grant access to specific resource types in specific compartments:

            ```text
            # Instead of:
            Allow group Admins to manage all-resources in tenancy

            # Use scoped policies:
            Allow group NetworkAdmins to manage virtual-network-family in compartment NetworkCompartment
            Allow group ComputeAdmins to manage instance-family in compartment ComputeCompartment
            ```
        - id: cli
          desc: |
            To identify and replace overly permissive IAM policies using the OCI CLI, start by listing all policies in the tenancy:

            ```bash
            oci iam policy list --compartment-id TENANCY_OCID --all --query "data[].{Name:name, Statements:statements}" --output table
            ```

            Review the output for any statements containing `manage all-resources in tenancy`. For each match, update the policy to use compartment-scoped statements with specific resource types.

            **Warning: `--statements` replaces the COMPLETE set of statements on the policy.** Whatever you pass becomes the entire statement list, so any statement you omit is silently dropped. Retrieve the current statements first, replace only the overly permissive one, then resubmit every statement you want to keep.

            1. Export the current statements so you keep every statement you still need:

            ```bash
            oci iam policy get --policy-id POLICY_OCID --query 'data.statements' > statements.json
            ```

            2. Edit `statements.json`, replacing the `manage all-resources in tenancy` statement with scoped statements such as `Allow group NetworkAdmins to manage virtual-network-family in compartment NetworkCompartment`. Resubmit the edited file so every statement you kept is preserved:

            ```bash
            oci iam policy update --policy-id POLICY_OCID \
              --statements file://statements.json
            ```
        - id: terraform
          desc: |
            To enforce scoped IAM policies in Terraform, define policies that grant access to specific resource types in specific compartments instead of `manage all-resources in tenancy`:

            ```hcl
            resource "oci_identity_policy" "network_admins" {
              compartment_id = var.tenancy_ocid
              name           = "NetworkAdminPolicy"
              description    = "Scoped policy for network admins"

              statements = [
                "Allow group NetworkAdmins to manage virtual-network-family in compartment NetworkCompartment",
              ]
            }

            resource "oci_identity_policy" "compute_admins" {
              compartment_id = var.tenancy_ocid
              name           = "ComputeAdminPolicy"
              description    = "Scoped policy for compute admins"

              statements = [
                "Allow group ComputeAdmins to manage instance-family in compartment ComputeCompartment",
              ]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policies.htm
        title: CIS OCI Foundations Benchmark 1.1
