  # No Terraform variants: last-login recency is runtime telemetry; the `oci_identity_user` Terraform resource has no `last-successful-login-time` field.
  - uid: mondoo-oci-security-iam-stale-active-users
    title: Ensure active IAM users have logged in within the last 90 days
    impact: 70
    filters: asset.platform == "oci-identity-user" && oci.identity.user.state == "ACTIVE" && oci.identity.user.lastLogin != empty
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-07
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-18
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-2-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      oci.identity.user.lastLogin > time.now - 90 * time.day
    docs:
      desc: |
        This check verifies that access is only retained where it is actually being used, by requiring every active user with a recorded sign-in to have logged in within the last 90 days.

        OCI records the timestamp of a user's most recent successful sign-in and never acts on it. There is no inactivity expiry, no automatic deactivation, and no warning, so an account keeps its group memberships and its credentials indefinitely whether it is used daily or was last touched two years ago. Administrators see the last sign-in on the user under Identity & Security > Domains > Users and deactivate an account from the same page. Accounts that have never signed in at all are outside this check and need their own review.

        **Why this matters**

        A stale account is usually an account whose owner is gone. Offboarding that removed a person from mail and chat but never reached OCI leaves an identity holding whatever it held on their last working day, including any compartment access and any policy grants attached to its groups. Nothing shrank when the person left.

        Dormancy also removes the detection signal that catches misuse. An account used every morning has a rhythm, so activity at three in the morning from an unfamiliar region stands out. An account with no activity has no baseline to break, which is why attackers favor them and why intrusions through them run long before anyone notices.

        Every unused account is also pure attack surface, one phished password or leaked key away from becoming an entry point. Access reviews depend on this data being honest: a review that certifies access without last sign-in evidence certifies a list of names, not a set of people who need what they hold.

        Flag and deactivate accounts idle beyond the window automatically, connect identity lifecycle to the HR offboarding trigger so departures reach the tenancy, and require documented justification to keep an unused account active.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Identity & Security > Users**.
        3. For each active user, review the **Last Sign-In** column.
        4. Identify users whose last sign-in date is more than 90 days ago.

        A passing user shows a **Last Sign-In** date within the last 90 days. A failing user shows a **Last Sign-In** date older than 90 days.

        ### Audit via CLI

        1. List all active users and their last successful login time:

        ```bash
        oci iam user list --compartment-id <TENANCY_OCID> --all --query "data[?\"lifecycle-state\"=='ACTIVE'].{Name:name, LastLogin:\"last-successful-login-time\"}" --output table
        ```

        A passing user returns a `LastLogin` timestamp within the last 90 days. A failing user returns a `LastLogin` timestamp older than 90 days or a `null` value.
      remediation:
        - id: console
          desc: |
            To identify and remediate stale active users using the OCI Console:

            1. Navigate to **Identity & Security > Users**.
            2. Review the **Last Sign-In** column for each active user.
            3. For users who have not signed in within 90 days, select the user.
            4. Select **Disable** or **Delete** depending on your organization's offboarding policy.
        - id: cli
          desc: |
            To identify stale active users using the OCI CLI, list users and filter by login activity:

            ```bash
            oci iam user list --compartment-id TENANCY_OCID --all --query "data[?\"lifecycle-state\"=='ACTIVE'].{Name:name, LastLogin:\"last-successful-login-time\"}" --output table
            ```

            The OCI CLI does not support disabling a user directly. For each user whose last login exceeds 90 days, remove the credentials that grant access:

            ```bash
            oci iam user api-key delete --user-id USER_OCID --fingerprint KEY_FINGERPRINT
            oci iam auth-token delete --user-id USER_OCID --auth-token-id TOKEN_OCID
            ```

            Disable or delete the account itself through the OCI Console following your offboarding policy.
        # No Terraform remediation: last-login recency is runtime telemetry; the `oci_identity_user` Terraform resource has no field for `last-successful-login-time` and there is no HCL change that marks an account stale or active.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/managingusers.htm
        title: CIS OCI Foundations Benchmark 1.13
  - uid: mondoo-oci-security-iam-no-broad-compartment-policies
    title: Ensure no IAM policies grant manage all-resources in compartment
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-oci-security-iam-no-broad-compartment-policies-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/icon: oci
      - uid: mondoo-oci-security-iam-no-broad-compartment-policies-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-iam-no-broad-compartment-policies-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-iam-no-broad-compartment-policies-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that IAM grants inside a compartment are scoped to specific resource types rather than conveying full control of everything in it.

        The statement rejected here is `allow group <group> to manage all-resources in compartment <name>`. It is narrower than the tenancy-wide form because the compartment boundary still holds, but within that boundary it is absolute: the strongest verb applied to every resource type OCI offers. Compartments exist to bound what a team can reach, and this statement spends that boundary on the outer edge while scoping nothing inside it. Statements are managed under Identity & Security > Policies or with `oci iam policy update`, and this check inspects live policies as well as Terraform configuration, plans, and state.

        **Why this matters**

        A compartment is rarely small. Production compartments commonly hold the compute instances, the VCN and its security lists, the block volumes, the Object Storage buckets, and the databases for a whole application. A group with this grant can create, reconfigure, and delete all of it, so a credential issued for one narrow job, such as a pipeline that only replaces instances, can also open a security list or empty a bucket.

        That breadth turns a single compromise into a compartment-wide incident. An attacker landing on any principal in the group needs no further IAM step: every resource is already in reach, and each is a candidate for staging further access.

        It also blurs the picture the compartment model was built to make clear. When several groups each hold everything within a compartment, an access review cannot say which team owns which resource type.

        Rewrite these into named resource families matching what each group operates, such as `manage instance-family` or `manage virtual-network-family`, and add resource types only when a documented need appears. Remember also that a policy attached at the tenancy root reaches this compartment too, so narrowing the compartment policy is only half the work.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Identity & Security > Policies**.
        3. Review policies in each compartment.
        4. Expand each policy and inspect its statements for any that contain `manage all-resources in compartment`.

        A passing policy contains no statements granting `manage all-resources in compartment`. A failing policy contains at least one such statement.

        ### Audit via CLI

        1. List all policies in the tenancy and inspect their statements:

        ```bash
        oci iam policy list --compartment-id <TENANCY_OCID> --all --query "data[].{Name:name, Statements:statements}" --output json
        ```

        A passing policy returns no statements matching `manage all-resources in compartment`. A failing policy returns one or more statements with that permission.
      remediation:
        - id: console
          desc: |
            To replace overly permissive compartment policies using the OCI Console:

            1. Navigate to **Identity & Security > Policies**.
            2. Identify policies containing `manage all-resources in compartment`.
            3. Replace with scoped policies that grant access to specific resource types:

            ```text
            # Instead of:
            Allow group DevOps to manage all-resources in compartment Production

            # Use scoped policies:
            Allow group DevOps to manage instance-family in compartment Production
            Allow group DevOps to manage virtual-network-family in compartment Production
            ```
        - id: cli
          desc: |
            To identify and replace overly permissive compartment policies using the OCI CLI, list all policies:

            ```bash
            oci iam policy list --compartment-id TENANCY_OCID --all --query "data[].{Name:name, Statements:statements}" --output table
            ```

            Review for statements containing `manage all-resources in compartment`. Update each policy to use specific resource types.

            **Warning: `--statements` replaces the COMPLETE set of statements on the policy.** Whatever you pass becomes the entire statement list, so any statement you omit is silently dropped. Retrieve the current statements first, replace only the broad statement, then resubmit every statement you want to keep.

            1. Export the current statements so you keep every statement you still need:

            ```bash
            oci iam policy get --policy-id POLICY_OCID --query 'data.statements' > statements.json
            ```

            2. Edit `statements.json`, replacing the `manage all-resources in compartment` statement with scoped statements such as `Allow group DevOps to manage instance-family in compartment Production`. Resubmit the edited file so every statement you kept is preserved:

            ```bash
            oci iam policy update --policy-id POLICY_OCID \
              --statements file://statements.json
            ```
        - id: terraform
          desc: |
            To enforce scoped compartment policies in Terraform, use specific resource types instead of `all-resources`:

            ```hcl
            resource "oci_identity_policy" "devops" {
              compartment_id = var.tenancy_ocid
              name           = "DevOpsPolicy"
              description    = "Scoped policy for DevOps team"

              statements = [
                "Allow group DevOps to manage instance-family in compartment Production",
                "Allow group DevOps to manage virtual-network-family in compartment Production",
              ]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policies.htm
        title: CIS OCI Foundations Benchmark 1.2
