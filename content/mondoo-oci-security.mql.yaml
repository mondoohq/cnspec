        values.ingress_security_rules.where(_['source'] == "0.0.0.0/0" && _['protocol'] == "6").none(
          _['tcp_options'] == empty ||
          _['tcp_options']['destination_port_range']['min'] <= 21 && _['tcp_options']['destination_port_range']['max'] >= 21 ||
          _['tcp_options']['destination_port_range']['min'] <= 23 && _['tcp_options']['destination_port_range']['max'] >= 23 ||
          _['tcp_options']['destination_port_range']['min'] <= 135 && _['tcp_options']['destination_port_range']['max'] >= 135 ||
          _['tcp_options']['destination_port_range']['min'] <= 137 && _['tcp_options']['destination_port_range']['max'] >= 137 ||
          _['tcp_options']['destination_port_range']['min'] <= 138 && _['tcp_options']['destination_port_range']['max'] >= 138 ||
          _['tcp_options']['destination_port_range']['min'] <= 139 && _['tcp_options']['destination_port_range']['max'] >= 139 ||
          _['tcp_options']['destination_port_range']['min'] <= 445 && _['tcp_options']['destination_port_range']['max'] >= 445
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress
    title: Ensure VCN security lists block unrestricted ICMP ingress from 0.0.0.0/0
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that ICMP reachable from the internet is scoped to specific message types rather than opened wholesale.

        An OCI ingress rule selects ICMP with protocol `1` for IPv4 or `58` for ICMPv6, and an optional `icmpOptions` block narrows it to a type and a code. A rule from `0.0.0.0/0` that names either ICMP protocol, or names all protocols, without an `icmpOptions` block admits every ICMP message the stack will answer, and that is the shape the check flags. Type and code are set in the rule editor in the Console or in the payload of `oci network security-list update`.

        **Why this matters**

        ICMP is how a scanner draws the map before it starts knocking. Echo requests establish which addresses are live, and timestamp and address mask requests, which many stacks still answer, narrow the operating system family by the way each one replies. That turns an unknown address range into a list of hosts with probable platforms, which is the input every later stage depends on.

        Internet-wide scanning services publish those results. An open ICMP rule reliably places the VCN's public addresses in commercial and free asset indexes, where anyone can search for them by cloud region or organization long after the scan itself is forgotten.

        ICMP also carries data. Echo request and reply payloads are arbitrary bytes, so a tunnel built over ping is a well-worn way to move a command channel or staged data past controls that only examine TCP and UDP, and the packets read as ordinary reachability testing in flow records.

        Some ICMP must survive. Type 3 code 4, Destination Unreachable with Fragmentation Needed, is what makes Path MTU discovery work, and blocking it produces connections that establish and then stall. Scope internet-facing ICMP rules to that type and code, and where an operations team needs broader ICMP for monitoring, restrict the source CIDR to the NOC ranges instead of the whole internet.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Networking** > **Virtual Cloud Networks**.
        2. For each VCN, open **Security Lists** and select each security list.
        3. Under **Ingress Rules**, look for any rule where **Source** is `0.0.0.0/0`, **Protocol** is `ICMP`, and no **ICMP Type/Code** filter is configured (the type and code fields are blank or allow all).

        A passing security list has no unrestricted ICMP ingress rule from `0.0.0.0/0` — either ICMP ingress is absent, scoped to a non-public source CIDR, or restricted to specific ICMP type/code values. A failing security list contains an ICMP ingress rule from `0.0.0.0/0` with no type or code restriction.

        ### Audit via CLI

        1. Retrieve ingress rules and check for unfiltered ICMP from `0.0.0.0/0`:

        ```bash
        oci network security-list get \
          --security-list-id <security-list-ocid> \
          --query 'data."ingress-security-rules"[?source==`0.0.0.0/0` && (protocol==`1` || protocol==`58` || protocol==`all`)].{Source:source, Protocol:protocol, ICMPOptions:"icmp-options"}' \
          --output json
        ```

        A passing security list returns no entries where `ICMPOptions` is null or empty for rules sourced from `0.0.0.0/0`. A failing security list returns one or more ICMP rules from `0.0.0.0/0` with no `icmp-options` type/code filter.
      remediation:
        - id: console
          desc: |
            Scope or remove unrestricted ICMP ingress:

            1. Open **Networking** → **Virtual Cloud Networks** → the parent VCN → **Security Lists** → select the flagged list.
            2. Edit the flagged ICMP rule: either delete it, or set an `icmpOptions` type/code filter (commonly type 3 for Destination Unreachable) and tighten the source CIDR.
            3. For monitoring use cases, limit the source to your NOC / monitoring subnet rather than `0.0.0.0/0`.
        - id: cli
          desc: |
            Replace the security list's ingress rules with a set whose ICMP rule is scoped.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the offending rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id <security-list-ocid> \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json`, giving each public ICMP rule an `icmpOptions` type and code, such as `{"source":"10.0.0.0/8","protocol":"1","icmpOptions":{"type":3,"code":4},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id <security-list-ocid> \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            Add an `icmp_options` block that scopes the ICMP type/code on every `0.0.0.0/0` ingress rule that uses ICMP (protocol `1`), ICMPv6 (`58`), or `all` protocols:

            ```hcl
            resource "oci_core_security_list" "main" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.main.id
              display_name   = "main"

              # PMTU discovery - allow only ICMP type 3 code 4 from anywhere
              ingress_security_rules {
                source      = "0.0.0.0/0"
                source_type = "CIDR_BLOCK"
                protocol    = "1"

                icmp_options {
                  type = 3
                  code = 4
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: OCI - Security Lists
      - url: https://datatracker.ietf.org/doc/html/rfc792
        title: RFC 792 - Internet Control Message Protocol
  - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-oci
    filters: asset.platform == "oci-network-securitylist"
    mql: |
      oci.network.securityList.ingressRules.where(
        source == "0.0.0.0/0" && icmpType == null
      ).none(
        protocol.in(["1", "58", "all"])
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_core_security_list")
    mql: |
      # An ingress rule from 0.0.0.0/0 that uses ICMP (protocol 1 or 58) or all-protocols must declare an icmp_options block scoping the type/code.
      terraform.resources("oci_core_security_list").all(
        blocks.where(type == "ingress_security_rules" && arguments.source == "0.0.0.0/0").all(
          arguments.protocol != "1" && arguments.protocol != "58" && arguments.protocol != "all" ||
          blocks.where(type == "icmp_options") != empty
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_core_security_list")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_core_security_list").all(
        change.after.ingress_security_rules.where(_['source'] == "0.0.0.0/0" && _['icmp_options'] == empty).none(
          _['protocol'].in(["1", "58", "all"])
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-icmp-ingress-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_core_security_list")
    mql: |
      terraform.state.resources.where(type == "oci_core_security_list").all(
        values.ingress_security_rules.where(_['source'] == "0.0.0.0/0" && _['icmp_options'] == empty).none(
          _['protocol'].in(["1", "58", "all"])
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress
    title: Ensure VCN security lists block unrestricted IPv6 ingress from ::/0
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that IPv6 ingress is held to the same restrictions as IPv4 ingress.

        `::/0` is the IPv6 counterpart of `0.0.0.0/0`, and OCI carries it as a separate rule with its own source value, so hardening one address family does nothing for the other. The check rejects a rule from `::/0` that allows all protocols, a TCP rule with no destination port range, a TCP range covering SSH on 22 or RDP on 3389, and a UDP rule with no port range. Review both families side by side on the security list details page or in the output of `oci network security-list get`.

        **Why this matters**

        The failure is procedural rather than technical. A team tightens `0.0.0.0/0` rules during a hardening pass, ships the change, and never touches the `::/0` rules sitting beside them, because the review that prompted the work listed only IPv4 findings. The subnet ends up hardened on one address family and open on the other, and nothing in the rule listing makes the asymmetry obvious.

        Detection is thinner on the IPv6 side too. Log pipelines, dashboards and intrusion detection signatures written years ago frequently key on IPv4 address formats, so traffic arriving over IPv6 passes through a monitoring stack that looks complete on paper and records nothing useful.

        Attackers know the gap is systemic. Probing `::/0` reachability is a routine step precisely because IPv4 access control lists are tightly monitored and the IPv6 path often is not, and scanning services now enumerate published cloud IPv6 allocations rather than trying to brute force the address space, which removes the size advantage IPv6 was once assumed to provide.

        Treat the two families as one change, so every time an ingress rule for `0.0.0.0/0` is written or narrowed the `::/0` rule is reviewed alongside it. Where no workload in the VCN requires IPv6 at all, leaving the VCN without an IPv6 CIDR block removes the parallel surface rather than requiring it to be maintained.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Networking** > **Virtual Cloud Networks**.
        2. For each IPv6-enabled VCN, open **Security Lists** and select each security list.
        3. Under **Ingress Rules**, look for any rule where **Source** is `::/0` (IPv6 default route) and the protocol is `All Protocols`, or where the protocol is `TCP` with no port-range restriction or a port range covering SSH (22) or RDP (3389), or where the protocol is `UDP` with no port-range restriction.

        A passing security list has no ingress rule permitting all-protocol, unrestricted-TCP, or unrestricted-UDP traffic from `::/0`. A failing security list contains at least one such rule.

        ### Audit via CLI

        1. Retrieve ingress rules and filter for `::/0` source entries:

        ```bash
        oci network security-list get \
          --security-list-id <security-list-ocid> \
          --query 'data."ingress-security-rules"[?source==`::/0`].{Source:source, Protocol:protocol, TCPOptions:"tcp-options", UDPOptions:"udp-options"}' \
          --output json
        ```

        A passing security list returns no rules from `::/0` with `protocol` equal to `all`, and no TCP rules from `::/0` without port restrictions, and no UDP rules from `::/0` without port restrictions. A failing security list returns at least one rule matching any of those patterns.
      remediation:
        - id: console
          desc: |
            Remove or scope IPv6 ingress rules:

            1. Open **Networking** → **Virtual Cloud Networks** → the parent VCN → **Security Lists** → select the flagged list.
            2. Identify each ingress rule whose source is `::/0` and that allows SSH/RDP, all TCP ports, all UDP ports, or all protocols.
            3. Delete the rule, or restrict the source to a specific IPv6 CIDR (e.g., your corporate IPv6 transit prefix) and/or tighten the port range.
            4. Consider disabling IPv6 entirely on the VCN if no workload on it uses IPv6.
        - id: cli
          desc: |
            Replace the ingress rules with a scoped IPv6 set. The export below covers the IPv4 rules as well, which the same parameter would otherwise delete.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the offending rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id <security-list-ocid> \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json`, scoping each `::/0` rule to a trusted prefix and an explicit port range, such as `{"source":"2001:db8:abcd::/48","protocol":"6","tcpOptions":{"destinationPortRange":{"min":443,"max":443}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id <security-list-ocid> \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            Apply the same scoping rules to `::/0` ingress that the IPv4 ingress checks require: never `protocol = "all"`, always declare `tcp_options` / `udp_options`, and exclude SSH (22) and RDP (3389) from public TCP rules:

            ```hcl
            resource "oci_core_security_list" "main" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.main.id
              display_name   = "main"

              # IPv6: HTTPS from anywhere - explicit tcp_options scoped to 443
              ingress_security_rules {
                source      = "::/0"
                source_type = "CIDR_BLOCK"
                protocol    = "6"

                tcp_options {
                  min = 443
                  max = 443
                }
              }

              # IPv6: SSH only from a trusted IPv6 prefix
              ingress_security_rules {
                source      = "2001:db8:abcd::/48" # RFC 3849 documentation prefix - replace with your trusted IPv6 prefix
                source_type = "CIDR_BLOCK"
                protocol    = "6"

                tcp_options {
                  min = 22
                  max = 22
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: OCI - Security Lists
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/ipv6.htm
        title: OCI - IPv6 Addressing
  - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-oci
    filters: asset.platform == "oci-network-securitylist"
    mql: |
      oci.network.securityList.ingressRules.where(source == "::/0").none(
        protocol == "all" ||
        protocol == "6" && destinationPortMin == null ||
        protocol == "6" && destinationPortMin <= 22 && destinationPortMax >= 22 ||
        protocol == "6" && destinationPortMin <= 3389 && destinationPortMax >= 3389 ||
        protocol == "17" && destinationPortMin == null
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_core_security_list")
    mql: |
      # Three separate datapoints, one per failure mode: no all-protocol IPv6 rule, all-UDP IPv6 rules must scope udp_options, and TCP IPv6 rules must scope tcp_options away from ports 22/3389.
      terraform.resources("oci_core_security_list").all(
        blocks.where(type == "ingress_security_rules" && arguments.source == "::/0").none(arguments.protocol == "all")
      )
      terraform.resources("oci_core_security_list").all(
        blocks.where(type == "ingress_security_rules" && arguments.source == "::/0" && arguments.protocol == "17").all(
          blocks.where(type == "udp_options") != empty
        )
      )
      terraform.resources("oci_core_security_list").all(
        blocks.where(type == "ingress_security_rules" && arguments.source == "::/0" && arguments.protocol == "6").none(
          blocks.where(type == "tcp_options") == empty ||
          blocks.where(type == "tcp_options").any(
            arguments.min <= 22 && arguments.max >= 22 ||
            arguments.min <= 3389 && arguments.max >= 3389
          )
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_core_security_list")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_core_security_list").all(
        change.after.ingress_security_rules.where(_['source'] == "::/0").none(
          _['protocol'] == "all" ||
          _['protocol'] == "6" && _['tcp_options'] == empty ||
          _['protocol'] == "6" && _['tcp_options']['destination_port_range']['min'] <= 22 && _['tcp_options']['destination_port_range']['max'] >= 22 ||
          _['protocol'] == "6" && _['tcp_options']['destination_port_range']['min'] <= 3389 && _['tcp_options']['destination_port_range']['max'] >= 3389 ||
          _['protocol'] == "17" && _['udp_options'] == empty
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ipv6-ingress-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_core_security_list")
    mql: |
      terraform.state.resources.where(type == "oci_core_security_list").all(
        values.ingress_security_rules.where(_['source'] == "::/0").none(
          _['protocol'] == "all" ||
          _['protocol'] == "6" && _['tcp_options'] == empty ||
          _['protocol'] == "6" && _['tcp_options']['destination_port_range']['min'] <= 22 && _['tcp_options']['destination_port_range']['max'] >= 22 ||
          _['protocol'] == "6" && _['tcp_options']['destination_port_range']['min'] <= 3389 && _['tcp_options']['destination_port_range']['max'] >= 3389 ||
          _['protocol'] == "17" && _['udp_options'] == empty
        )
      )
  - uid: mondoo-oci-security-database-backups-customer-managed-encryption
    title: Ensure database backups are encrypted with customer-managed keys
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-8-9
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-oci-security-database-backups-customer-managed-encryption-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-database-backups-customer-managed-encryption-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-database-backups-customer-managed-encryption-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-database-backups-customer-managed-encryption-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that database backups are encrypted under a key the tenancy controls, covering both VM and bare metal DB system backups and Autonomous Database backups.

        Backups are encrypted either with an Oracle-managed key or with a master encryption key held in an OCI Vault that belongs to the tenancy. The default is Oracle-managed, which means the decryption capability lives entirely inside Oracle's infrastructure and there is no tenant-side operation that withdraws it. A customer-managed key is assigned by giving the database a vault key at provisioning under Identity & Security > Vault, backed by a statement such as `allow service database to use keys in compartment Security`. Backups then inherit the key of the database they came from.

        **Why this matters**

        A backup is a portable copy of the database with none of its network posture. The live database may sit behind a private endpoint in a locked-down subnet, but a principal holding `manage db-backups` can restore that data into a new DB system in a different compartment, a different subnet, or a different region, and the restored copy answers to whatever controls exist there. With a customer-managed key the restore also requires `use keys` on the vault key, so the vault policy becomes a second gate that the network controls alone never provided.

        Retention widens the exposure further. Backups persist after the source database is terminated, are written to Object Storage destinations that may be replicated across regions, and are frequently the oldest surviving copy of data that has since been deleted for compliance reasons.

        Key control is the only way to end that. Disabling or scheduling deletion of the vault key renders every backup encrypted under it permanently unreadable, which is the one action that reliably retires historical copies whose locations are no longer fully known.

        Before revoking a key, confirm which backups depend on it, because the effect is immediate and applies to restores you may still need.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Oracle Database** > **Autonomous Databases** (or **DB Systems** for VM/BM databases).
        2. Select each database and view its **Encryption** settings.
        3. Confirm that **Customer-Managed Key** is shown under the encryption configuration and that a vault and KMS key OCID are populated.
        4. Repeat for backups by navigating to **Backups** for each database and verifying the backup encryption key is listed.

        A passing database shows a customer-managed KMS key associated with the database (and therefore its backups). A failing database shows Oracle-managed encryption with no customer KMS key configured.

        ### Audit via CLI

        1. List Autonomous Database backups and check their KMS key association:

        ```bash
        oci db autonomous-database-backup list \
          --compartment-id <compartment-ocid> \
          --all \
          --query 'data[].{Name:"display-name", DBID:"autonomous-database-id", KMSKey:"kms-key-id"}' \
          --output table
        ```

        2. List DB System database backups:

        ```bash
        oci db backup list \
          --compartment-id <compartment-ocid> \
          --all \
          --query 'data[].{Name:"display-name", DatabaseID:"database-id", KMSKey:"kms-key-id"}' \
          --output table
        ```

        A passing result shows a non-null `KMSKey` value for every backup entry. A failing result shows at least one backup entry where `KMSKey` is `None` or empty.
      remediation:
        - id: console
          desc: |
            Assign a customer-managed KMS key to the parent database so future backups inherit it:

            1. Open **Oracle Database** → **Autonomous Database** (or **DB Systems** → the database) → select the database.
            2. Under **Encryption**, select **Edit** and choose **Encrypt using a customer-managed key**.
            3. Select the vault and master encryption key, then save.
            4. Subsequent automatic and on-demand backups inherit the new key. Existing backups remain encrypted with the previous key — re-create critical long-term backups after the rotation.
        - id: cli
          desc: |
            Re-keying the parent database only fixes backups taken after the change. Existing backups stay on the old key, so this finding persists for them until those backups are re-created. Plan to re-create any critical long-term backups you need to keep.

            Switch the parent database to a customer-managed KMS key so subsequent backups inherit it.

            For an Autonomous Database:

            ```bash
            oci db autonomous-database configure-key \
              --autonomous-database-id <adb-ocid> \
              --kms-key-id <key-ocid> \
              --vault-id <vault-ocid>
            ```

            For a database within a DB system:

            ```bash
            oci db database migrate-vault-key \
              --database-id <database-ocid> \
              --kms-key-id <key-ocid> \
              --vault-id <vault-ocid>
            ```

            Existing backups remain encrypted with the previous key. Re-create critical long-term backups after the migration.
        - id: terraform
          desc: |
            Set `kms_key_id` (and `vault_id` for autonomous databases) on every database resource so its backups inherit customer-managed encryption:

            ```hcl
            resource "oci_kms_vault" "app" {
              compartment_id = var.compartment_ocid
              display_name   = "app-vault"
              vault_type     = "DEFAULT"
            }

            resource "oci_kms_key" "app" {
              compartment_id      = var.compartment_ocid
              display_name        = "app-db-key"
              management_endpoint = oci_kms_vault.app.management_endpoint

              key_shape {
                algorithm = "AES"
                length    = 32
              }
            }

            resource "oci_database_autonomous_database" "app" {
              compartment_id           = var.compartment_ocid
              db_name                  = "appdb"
              admin_password           = var.adb_admin_password
              cpu_core_count           = 1
              data_storage_size_in_tbs = 1

              kms_key_id = oci_kms_key.app.id
              vault_id   = oci_kms_vault.app.id
            }

            resource "oci_database_database" "app" {
              db_home_id = oci_database_db_home.app.id
              source     = "NONE"

              database {
                admin_password = var.db_admin_password
                db_name        = "APPDB"
                kms_key_id     = oci_kms_key.app.id
              }
            }
            ```
