  - uid: mondoo-oci-security-compute-metadata-no-secrets
    title: Ensure compute instance metadata does not contain credentials
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ds-5
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    variants:
      - uid: mondoo-oci-security-compute-metadata-no-secrets-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-compute-metadata-no-secrets-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-metadata-no-secrets-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-metadata-no-secrets-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no credential material has been placed in compute instance metadata, where it would be readable without any secret-management control.

        Instance metadata is a free-form key and value map supplied at launch and used for legitimate purposes such as SSH authorized keys and the cloud-init `user_data` payload. This check inspects it for two things: keys named like credentials, including `password`, `passwd`, `secret`, `api_token`, `bearer_token`, `db_password`, `private_key`, `access_key`, `client_secret`, `connection_string`, `oci_api_key`, `aws_access_key_id`, `aws_secret_access_key`, and `aws_session_token`; and values shaped like credentials, meaning AWS access key identifiers, PEM blocks that open with `-----BEGIN` and carry a `PRIVATE KEY-----` header, and JSON Web Tokens. Any hit fails.

        **Why this matters**

        Metadata is readable by anyone holding the `compute-instance:read` IAM permission on the compartment, so a single API call retrieves the value and the audience is far wider than the instance owner. It is simultaneously readable by every process on the host through the metadata endpoint at 169.254.169.254, with no IAM permission required at all, which means any compromised application or sidecar container reads it too.

        A credential parked there is scoped to nothing. It cannot be restricted to one process, one container, or one time window, and it persists for the entire life of the instance.

        Rotation is destructive rather than routine. A secret in OCI Vault is replaced with a new version in place, but a value baked into instance metadata generally requires recreating the instance to change, and the old value stays exposed until that happens.

        Treat anything found here as already compromised: revoke and reissue it before making any other change. Store application credentials in OCI Vault and fetch them at runtime through instance or resource principal authentication, and review Terraform modules, cloud-init files, and launch configurations so no value is passed through the `metadata` map in the first place.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Compute > Instances**.
        2. Select the instance you want to inspect.
        3. Select the **Metadata** tab (or find the **Custom Metadata** section in the instance details).
        4. Review each key-value pair for credential-named keys such as `password`, `secret`, `api_token`, `private_key`, `aws_access_key_id`, or similar names, and inspect values for AWS access key patterns, PEM private key blocks (`-----BEGIN ... PRIVATE KEY-----`), or JWT token shapes.

        A passing instance shows metadata keys and values that contain no credential patterns. A failing instance shows one or more metadata keys matching known credential names or values matching credential-shaped patterns.

        ### Audit via CLI

        1. Retrieve the instance metadata:

        ```bash
        oci compute instance get --instance-id <instance-ocid> --query 'data.metadata'
        ```

        2. Review the returned key-value pairs. Flag any key whose lowercase name matches `password`, `passwd`, `secret`, `access_key`, `api_token`, `bearer_token`, `private_key`, `client_secret`, `connection_string`, `db_password`, `oci_api_key`, `oci_secret`, `aws_access_key_id`, `aws_secret_access_key`, or `aws_session_token`. Also inspect values for AWS access key ID patterns (`AKIA…`, `ASIA…`), PEM blocks (`-----BEGIN`), or JWT token format (`eyJ…`).

        A passing instance returns metadata with no credential-named keys and no credential-shaped values. A failing instance returns one or more metadata entries whose key name or value matches a known credential pattern.
      remediation:
        - id: console
          desc: |
            Remove credentials from instance metadata:

            1. Rotate any credentials that appeared in metadata immediately, assuming they are compromised.
            2. Open **Compute** → **Instances** → select the instance → **Metadata**.
            3. Remove the credential key-value pair. If the metadata field cannot be cleared in place, recreate the instance without the offending metadata.
            4. Replace the usage with Vault-backed configuration or a resource principal, neither of which leaves values visible in `GetInstance`.
        - id: cli
          desc: |
            Rotate any exposed credential first. Then retrieve the current metadata, remove only the credential keys, and write the remaining map back. The update must include the `ssh_authorized_keys` and `user_data` values exactly as launched, because OCI rejects any update that adds, changes, or removes those keys:

            ```bash
            oci compute instance get --instance-id <instance-ocid> --query 'data.metadata'

            oci compute instance update --instance-id <instance-ocid> \
              --metadata file://metadata-without-credentials.json
            ```
        - id: terraform
          desc: |
            Keep the `metadata` map free of credential-named keys and credential-shaped values; fetch secrets at runtime via the resource principal and OCI Vault instead of pinning them into the instance definition:

            ```hcl
            resource "oci_core_instance" "app" {
              compartment_id      = var.compartment_ocid
              availability_domain = var.ad
              shape               = "VM.Standard.E4.Flex"

              metadata = {
                ssh_authorized_keys = file("~/.ssh/id_rsa.pub")
                # Do NOT place credentials here. Read secrets from OCI Vault at boot:
                vault_secret_ocid = oci_vault_secret.db_password.id
              }

              source_details {
                source_type = "image"
                source_id   = var.image_ocid
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Compute/Tasks/gettingmetadata.htm
        title: OCI - Instance Metadata
      - url: https://docs.oracle.com/en-us/iaas/Content/KeyManagement/Concepts/keyoverview.htm
        title: OCI Vault
  - uid: mondoo-oci-security-compute-metadata-no-secrets-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.compute.instances.all(
        metadata.keys.none(
          _.downcase == /^aws_access_key_id$|^aws_secret_access_key$|^aws_session_token$|^oci_api_key$|^oci_secret$|^api_token$|^bearer_token$|^db_password$|^private_key$|^password$|^passwd$|^secret$|^access_key$|^client_secret$|^connection_string$/
        ) &&
        metadata.values.none(
          _.find(/(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}/) != empty ||
          _.contains("-----BEGIN") && _.contains("PRIVATE KEY-----") ||
          _.find(/\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b/) != empty
        )
      )
  - uid: mondoo-oci-security-compute-metadata-no-secrets-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_core_instance')
    mql: |
      # Two datapoints: instances with a metadata map must not have credential-named keys, and must not have credential-shaped values. Instances without a metadata map are filtered out by .where().
      terraform.resources('oci_core_instance').where(arguments['metadata'] != null).all(
        arguments['metadata'].keys.none(
          _.downcase == /^aws_access_key_id$|^aws_secret_access_key$|^aws_session_token$|^oci_api_key$|^oci_secret$|^api_token$|^bearer_token$|^db_password$|^private_key$|^password$|^passwd$|^secret$|^access_key$|^client_secret$|^connection_string$/
        )
      )
      terraform.resources('oci_core_instance').where(arguments['metadata'] != null).all(
        arguments['metadata'].values.none(
          _.find(/(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}/) != empty ||
          _.contains("-----BEGIN") && _.contains("PRIVATE KEY-----") ||
          _.find(/\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b/) != empty
        )
      )
  - uid: mondoo-oci-security-compute-metadata-no-secrets-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_core_instance')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_core_instance' && change.after['metadata'] != null).all(
