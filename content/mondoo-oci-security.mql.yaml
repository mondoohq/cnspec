  - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access
    title: Ensure API Gateway deployments do not allow anonymous access
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-15
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that anonymous access is disabled on every API Gateway deployment, so no request reaches an upstream backend without a credential.

        A deployment carries a specification whose `request_policies` section holds the `authentication` policy applied to every route it serves. Inside that policy, `isAnonymousAccessAllowed` decides whether callers presenting no credential are admitted anyway. A deployment can be created with `is_anonymous_access_allowed = true`, and when it is, unauthenticated requests pass through even though an authentication policy is attached, turning that policy into an optional rather than an enforced control. This check requires the setting to be false or absent. Administer it in the Console under Developer Services > API Management > Gateways on the deployment's request policies, or with `oci api-gateway deployment update`.

        **Why this matters**

        An authentication policy combined with allowed anonymous access is the optional-authentication anti-pattern. The policy is bypassed for unauthenticated clients, so it delivers none of the protection it was written to provide, and every route in the specification inherits that bypass rather than only the one route the operator had in mind.

        Anonymous access is typically enabled for a single public route during development and left in place when the deployment is promoted. Nothing in the promotion path surfaces it, so the authentication requirement silently disappears from all routes.

        Everything downstream assumes an authenticated principal. WAF rules, rate-limiting policies, and authorization middleware are keyed on a caller identity, and anonymous traffic invalidates every assumption those layers were designed around. Audit log entries for anonymous requests carry no principal identity at all, so actions cannot be attributed and abuse patterns cannot be detected after the fact.

        Disabling the setting forces every request through the configured authentication policy, ensuring only authenticated callers reach upstream backends, restoring the audit trail, and giving rate limiting a stable key to count against. If one route genuinely must be public, publish it as its own deployment rather than opening anonymous access across the whole specification.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Developer Services** > **API Gateway** > **Deployments**.
        2. For each deployment, select it and open **API Request Policies** > **Authentication**.
        3. Check whether **Enable anonymous access** is toggled on. If enabled, the deployment allows requests to bypass the authentication policy.

        A passing deployment shows **Enable anonymous access** set to off (or the option is absent because no anonymous access is permitted). A failing deployment shows **Enable anonymous access** toggled on.

        ### Audit via CLI

        1. List all API Gateway deployments:

        ```bash
        oci api-gateway deployment list \
          --compartment-id <compartment-ocid> \
          --all \
          --query 'data.items[].{Name:"display-name", OCID:id}' \
          --output table
        ```

        2. For each deployment, retrieve its specification and check the anonymous access flag:

        ```bash
        oci api-gateway deployment get \
          --deployment-id <deployment-ocid> \
          --query 'data.specification."request-policies".authentication."is-anonymous-access-allowed"' \
          --output json
        ```

        A passing deployment returns `false` or `null` for `is-anonymous-access-allowed`. A failing deployment returns `true`.
      remediation:
        - id: console
          desc: |
            Disable anonymous access on the deployment's authentication policy:

            1. Open **Developer Services** → **API Gateway** → **Deployments** → select the deployment.
            2. Open **API Request Policies** → **Authentication**.
            3. Clear **Enable anonymous access** (or set it to off).
            4. Save and deploy.
        - id: cli
          desc: |
            Update a deployment's specification with `isAnonymousAccessAllowed: false` in the authentication block.

            **Warning: `--specification` replaces the COMPLETE deployment specification.** The specification is a large nested document covering every route, backend, and policy. Whatever you pass becomes the entire spec, so anything you omit is removed. Retrieve the current spec first, edit only the authentication block, then resubmit the entire document.

            1. Export the current specification so you keep every route and backend:

            ```bash
            oci api-gateway deployment get \
              --deployment-id <deployment-ocid> \
              --query 'data.specification' > specification.json
            ```

            2. In `specification.json`, set the authentication block to `"isAnonymousAccessAllowed": false`, leaving all other routes and backends intact. Resubmit the full document:

            ```bash
            oci api-gateway deployment update \
              --deployment-id <deployment-ocid> \
              --specification file://specification.json
            ```
        - id: terraform
          desc: |
            Set `is_anonymous_access_allowed = false` on every `authentication` block in every deployment specification:

            ```hcl
            resource "oci_apigateway_deployment" "app" {
              compartment_id = var.compartment_ocid
              gateway_id     = oci_apigateway_gateway.app.id
              path_prefix    = "/v1"

              specification {
                request_policies {
                  authentication {
                    type                        = "JWT_AUTHENTICATION"
                    is_anonymous_access_allowed = false
                    issuers                     = ["https://idp.example.com/"]
                    audiences                   = ["api.example.com"]

                    public_keys {
                      type                       = "REMOTE_JWKS"
                      uri                        = "https://idp.example.com/.well-known/jwks.json"
                      max_cache_duration_in_hours = 1
                    }
                  }
                }
                routes {
                  path    = "/orders"
                  methods = ["GET", "POST"]
                  backend {
                    type = "HTTP_BACKEND"
                    url  = "https://backend.internal/orders"
                  }
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/APIGateway/Tasks/apigatewayusingauthenticationpolicies.htm
        title: OCI - API Gateway Authentication Policies
  - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-oci
    filters: asset.platform == "oci-apigateway-deployment"
    mql: |
      oci.apigateway.deployment.isAnonymousAccessAllowed != true
  - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_apigateway_deployment')
    mql: |
      terraform.resources('oci_apigateway_deployment').all(
        blocks.where(type == 'specification').all(
          blocks.where(type == 'request_policies').all(
            blocks.where(type == 'authentication').all(
              arguments['is_anonymous_access_allowed'] != true
            )
          )
        )
      )
  - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_apigateway_deployment')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_apigateway_deployment').all(
        change.after['specification'].all(
          _['request_policies'].all(
            _['authentication'].all(
              _['is_anonymous_access_allowed'] != true
            )
          )
        )
      )
  - uid: mondoo-oci-security-apigateway-deployment-no-anonymous-access-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_apigateway_deployment')
    mql: |
      terraform.state.resources.where(type == 'oci_apigateway_deployment').all(
        values['specification'].all(
          _['request_policies'].all(
            _['authentication'].all(
              _['is_anonymous_access_allowed'] != true
            )
          )
        )
      )
  - uid: mondoo-oci-security-apigateway-deployment-authentication-configured
    title: Ensure API Gateway deployments require authentication
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-15
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every API Gateway deployment declares an explicit authentication type and never leaves it missing or set to `NONE`.

        The authentication policy inside a deployment's `request_policies` block names the identity model the gateway enforces before a request is routed. `JWT_AUTHENTICATION` validates a signed token against the issuers, audiences, and public keys configured on the policy. `TOKEN_AUTHENTICATION` and `CUSTOM_AUTHENTICATION` hand the credential to an authorizer function running on OCI Functions, which returns an allow or deny decision plus context the gateway can pass to the backend. This check requires one of those types to be present and non-empty. Set it in the Console under Developer Services > API Management > Gateways on the deployment's request policies, or with `oci api-gateway deployment update`.

        **Why this matters**

        A deployment created without any authentication policy accepts every request as unauthenticated, and there is no per-route opt-out that adds authentication back for individual routes. The whole specification is publicly callable from the moment it is deployed.

        This is the end state of a "we'll add auth later" API development workflow. The API is built and tested against an open gateway, the deployment is promoted, and nothing in the path asks whether the identity model was ever chosen.

        Rate-limiting attribution, authorization policies, and audit trails all depend on a caller identity that does not exist when no authentication policy is configured. That makes a missing policy a stronger failure than a policy with anonymous access allowed, because there is no authentication mechanism at all to selectively bypass or later tighten.

        Requiring an explicit type forces teams to make a deliberate choice about which identity model the API uses before it reaches any environment that accepts real traffic, and closes the path where a deployment ships with no authentication simply because the default was never changed. Pair it with disabling anonymous access, since a configured type is inert when unauthenticated callers are admitted regardless.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Developer Services** > **API Gateway** > **Deployments**.
        2. For each deployment, select it and open **API Request Policies** > **Authentication**.
        3. Confirm that an authentication type is configured — it should show one of JWT, OAuth 2.0 / Token, or Custom. If the authentication section is absent or set to **None**, the deployment accepts all requests unauthenticated.

        A passing deployment shows a configured authentication policy with a type other than None. A failing deployment shows no authentication policy or an authentication type of None.

        ### Audit via CLI

        1. Retrieve each deployment's specification and inspect the authentication type:

        ```bash
        oci api-gateway deployment get \
          --deployment-id <deployment-ocid> \
          --query 'data.specification."request-policies".authentication.type' \
          --output json
        ```

        A passing deployment returns `"JWT_AUTHENTICATION"`, `"TOKEN_AUTHENTICATION"`, or `"CUSTOM_AUTHENTICATION"`. A failing deployment returns `null`, an empty string, or `"NONE"`.
      remediation:
        - id: console
          desc: |
            Attach an authentication policy to the deployment:

            1. Open **Developer Services** → **API Gateway** → **Deployments** → select the deployment → **API Request Policies**.
            2. Open **Authentication** → **Add**. Pick **JWT**, **OAuth 2.0**, or **Custom** based on the application's identity model.
            3. Configure issuers / audiences / public keys (for JWT) or the auth function OCID (for Custom).
            4. Set **Enable anonymous access** to off.
            5. Save and deploy.
        - id: cli
          desc: |
            Update the deployment with a specification whose `requestPolicies.authentication.type` is set.

            **Warning: `--specification` replaces the COMPLETE deployment specification.** The specification is a large nested document covering every route, backend, and policy. Whatever you pass becomes the entire spec, so anything you omit is removed. Retrieve the current spec first, add only the authentication block, then resubmit the entire document.

            1. Export the current specification so you keep every route and backend:

            ```bash
            oci api-gateway deployment get \
              --deployment-id <deployment-ocid> \
              --query 'data.specification' > specification.json
            ```

            2. In `specification.json`, declare an `authentication` block with `"type": "JWT_AUTHENTICATION"` (or `TOKEN_AUTHENTICATION` / `CUSTOM_AUTHENTICATION`), leaving all other routes and backends intact. Resubmit the full document:

            ```bash
            oci api-gateway deployment update \
              --deployment-id <deployment-ocid> \
              --specification file://specification.json
            ```
        - id: terraform
          desc: |
            Declare an `authentication` block with a non-empty `type` on every deployment specification:

            ```hcl
            resource "oci_apigateway_deployment" "app" {
              compartment_id = var.compartment_ocid
              gateway_id     = oci_apigateway_gateway.app.id
              path_prefix    = "/v1"

              specification {
                request_policies {
                  authentication {
                    type                        = "JWT_AUTHENTICATION"
                    is_anonymous_access_allowed = false
                    issuers                     = ["https://idp.example.com/"]
                    audiences                   = ["api.example.com"]

                    public_keys {
                      type                       = "REMOTE_JWKS"
                      uri                        = "https://idp.example.com/.well-known/jwks.json"
                      max_cache_duration_in_hours = 1
                    }
                  }
                }
                routes {
                  path    = "/orders"
                  methods = ["GET"]
                  backend {
                    type = "HTTP_BACKEND"
                    url  = "https://backend.internal/orders"
                  }
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/APIGateway/Tasks/apigatewayusingauthenticationpolicies.htm
        title: OCI - API Gateway Authentication Policies
  - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-oci
    filters: asset.platform == "oci-apigateway-deployment"
    mql: |
      oci.apigateway.deployment.authenticationType != null && oci.apigateway.deployment.authenticationType != "NONE"
  - uid: mondoo-oci-security-apigateway-deployment-authentication-configured-terraform-hcl
