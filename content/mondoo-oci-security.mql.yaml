  - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2
    title: Ensure load balancer HTTPS listeners only allow TLS 1.2 or newer
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every HTTPS and HTTP/2 listener on an OCI load balancer negotiates only TLS 1.2 or TLS 1.3, with TLS 1.0, TLS 1.1, and SSL 3.0 removed from the offered protocol set.

        A listener that terminates TLS carries an SSL configuration whose protocol list names the versions it will accept. Oracle's default configuration permits older protocol versions, so a listener created without an explicit list can still answer a client that asks for a deprecated one. The check requires that the list contain none of `TLSv1`, `TLSv1.1`, or `SSLv3`, leaving `TLSv1.2` and `TLSv1.3` as the only possible outcomes. Edit the list under Networking > Load balancers > Listeners in the Console, or with `oci lb listener update`.

        **Why this matters**

        Keeping a deprecated version in the offered set creates a negotiated downgrade path. An attacker who can influence the handshake steers the client onto TLS 1.0 or TLS 1.1, and the session then runs under the guarantees of the weaker version rather than the stronger one the client was capable of.

        Both versions are formally deprecated and carry published attacks. BEAST, POODLE, CRIME, and LUCKY13 allow partial or full plaintext recovery from an intercepted session, and each targets structure that TLS 1.2 and TLS 1.3 removed. Legacy versions also force support for CBC-mode cipher suites, whose lack of authenticated encryption is what makes padding-oracle recovery workable in the first place.

        Many security and payment frameworks prohibit protocol versions older than TLS 1.2 for any system handling sensitive data, so a listener that still offers them is an audit finding as well as an exposure.

        Clients that genuinely require TLS 1.0 are running software long past end of support. If one must be accommodated, isolate it behind a dedicated listener with a documented retirement date rather than widening the protocol list on the listener that serves everyone else.
      audit: |
        ### Audit via Console

        1. Open **Networking** → **Load Balancers** and select the load balancer to inspect.
        2. Select **Listeners** from the left-hand menu.
        3. For each HTTPS or HTTP/2 listener, click the listener name and review **SSL Configuration** → **TLS Versions**.

        A passing listener shows only `TLSv1.2` and/or `TLSv1.3` in the TLS Versions list. A failing listener shows `TLSv1`, `TLSv1.1`, or `SSLv3` in the list.

        ### Audit via CLI

        1. List all load balancers in the compartment, then retrieve listener SSL configuration for each:

        ```bash
        oci lb load-balancer list \
          --compartment-id <compartment-ocid> \
          --query 'data[*].{id:id,name:"display-name"}'
        ```

        2. For each load balancer, retrieve listener details and inspect the `ssl-configuration.protocols` field:

        ```bash
        oci lb load-balancer get \
          --load-balancer-id <lb-ocid> \
          --query 'data.listeners.*.{name:name,protocol:protocol,protocols:"ssl-configuration".protocols}'
        ```

        A passing listener returns a `protocols` list that contains only `TLSv1.2` and/or `TLSv1.3`. A failing listener returns a list that includes `TLSv1`, `TLSv1.1`, or `SSLv3`.
      remediation:
        - id: console
          desc: |
            Update listener SSL configuration to require TLS 1.2+:

            1. Open **Networking** → **Load Balancers** → select the load balancer → **Listeners**.
            2. Edit the HTTPS / HTTP/2 listener → **SSL Configuration**.
            3. In **TLS Version**, select **TLSv1.2** or higher (do not include TLSv1 or TLSv1.1).
            4. Update. Existing connections finish, new connections are required to use TLS 1.2+.
        - id: cli
          desc: |
            Update the listener's SSL configuration to TLS 1.2+:

            ```bash
            oci lb listener update \
              --load-balancer-id <lb-ocid> \
              --listener-name <listener-name> \
              --protocol HTTPS \
              --port 443 \
              --default-backend-set-name <backend> \
              --ssl-certificate-name <cert-name> \
              --cipher-suite-name oci-default-ssl-cipher-suite-v1 \
              --protocols '["TLSv1.2","TLSv1.3"]'
            ```
        - id: terraform
          desc: |
            Declare every HTTPS / HTTP2 listener with an `ssl_configuration` block whose `protocols` list is restricted to TLS 1.2 and 1.3:

            ```hcl
            resource "oci_load_balancer_listener" "https" {
              load_balancer_id         = oci_load_balancer_load_balancer.app.id
              name                     = "https"
              default_backend_set_name = oci_load_balancer_backend_set.app.name
              protocol                 = "HTTPS"
              port                     = 443

              ssl_configuration {
                certificate_name        = oci_load_balancer_certificate.app.certificate_name
                cipher_suite_name       = "oci-default-ssl-cipher-suite-v1"
                protocols               = ["TLSv1.2", "TLSv1.3"]
                server_order_preference = "ENABLED"
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Balance/Tasks/managingsslconfigs.htm
        title: OCI - Managing SSL Configurations
  - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-oci
    filters: asset.platform == "oci-loadbalancer"
    mql: |
      oci.loadBalancer.loadBalancer.listeners.where(protocol.in(["HTTPS", "HTTP2"])).all(
        sslProtocols.containsNone(["TLSv1", "TLSv1.1", "SSLv3"])
      )
  - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_load_balancer_listener')
    mql: |
      # HTTPS / HTTP2 listeners must declare an ssl_configuration block whose protocols list excludes legacy TLS / SSL versions.
      terraform.resources('oci_load_balancer_listener')
        .where(arguments['protocol'].in(['HTTPS', 'HTTP2']) || blocks.where(type == "ssl_configuration") != empty)
        .all(
          blocks.where(type == 'ssl_configuration') != empty &&
          blocks.where(type == 'ssl_configuration').all(
            arguments['protocols'] != null &&
            arguments['protocols'].containsNone(['TLSv1', 'TLSv1.1', 'SSLv3'])
          )
        )
  - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_load_balancer_listener')
    mql: |
      terraform.plan.resourceChanges
        .where(type == 'oci_load_balancer_listener')
        .where(change.after['protocol'].in(['HTTPS', 'HTTP2']))
        .all(
          change.after['ssl_configuration'] != null && change.after['ssl_configuration'].length > 0 &&
          change.after['ssl_configuration'].all(
            _['protocols'] != null &&
            _['protocols'].containsNone(['TLSv1', 'TLSv1.1', 'SSLv3'])
          )
        )
  - uid: mondoo-oci-security-loadbalancer-tls-minimum-1-2-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_load_balancer_listener')
    mql: |
      terraform.state.resources
        .where(type == 'oci_load_balancer_listener')
        .where(values['protocol'].in(['HTTPS', 'HTTP2']))
        .all(
          values['ssl_configuration'] != null && values['ssl_configuration'].length > 0 &&
          values['ssl_configuration'].all(
            _['protocols'] != null &&
            _['protocols'].containsNone(['TLSv1', 'TLSv1.1', 'SSLv3'])
          )
        )
