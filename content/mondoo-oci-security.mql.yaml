        blocks.where(type == 'db_home').all(
          blocks.where(type == 'database').all(
            arguments['kms_key_id'] != null && arguments['kms_key_id'] != ""
          )
        )
      )
  - uid: mondoo-oci-security-dbsystem-customer-managed-encryption-terraform-plan
    filters: |
