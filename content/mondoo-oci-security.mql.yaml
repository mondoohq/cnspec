  - uid: mondoo-oci-security-dbsystem-customer-managed-encryption
    title: Ensure DB systems use customer-managed encryption keys
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-oci-security-dbsystem-customer-managed-encryption-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-dbsystem-customer-managed-encryption-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-dbsystem-customer-managed-encryption-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-dbsystem-customer-managed-encryption-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a DB system database encrypts its data files under a Transparent Data Encryption master key that the tenancy holds in an OCI Vault rather than one Oracle manages.

        Transparent Data Encryption is always on for an OCI DB system database, so nothing here is about whether data at rest is encrypted. What differs is custody of the master key that unwraps the tablespace keys. By default Oracle holds it. With a customer-managed key, the master key is a versioned object in a vault in the tenancy, referenced when the database is created inside the DB home, and usable by the service only because of a statement such as `allow service database to use keys in compartment Security`. Set it in the Encryption section when creating the database under Oracle Database > Bare Metal, VM, and Exadata.

        **Why this matters**

        A DB system is infrastructure the tenancy operates, and that is what makes key custody meaningful here. Data files, redo, and wallet material sit on storage attached to hosts that administrators can reach. Someone who copies a datafile off the host, clones the block volume, or images the node walks away with ciphertext and nothing else, because the master key never leaves the vault and its use is authorized by a policy the DBA does not administer.

        That separation is the point. Database administration and key administration become different grants, so no single compromised operator account both reads the data and controls the ability to decrypt it, and a decommissioned DB system's residual storage stops being a live copy the moment the key is disabled.

        Vault keys also produce evidence. Rotation is scheduled per key, and every cryptographic operation appears in OCI Audit, so control over the keys protecting regulated data can be demonstrated rather than asserted, which is what frameworks such as HIPAA and PCI DSS ask for.

        Plan rotation against the database's maintenance windows, since it needs the service policy in place to succeed.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Oracle Database > Bare Metal, VM, and Exadata**.
        2. Open each DB system, then open the database.
        3. Locate the **Encryption** section and review the encryption key.

        A passing database shows a customer-managed KMS key OCID. A failing database shows **Oracle-managed key**.

        ### Audit via CLI

        1. Retrieve the KMS key assignment for a database:

        ```bash
        oci db database get --database-id <database-ocid> --query 'data.{name:"db-name", kmsKeyId:"kms-key-id"}'
        ```

        A passing database returns a non-empty OCID in `kmsKeyId`. A failing database returns `null`.
      remediation:
        - id: console
          desc: |
            To use a customer-managed encryption key for a DB system database using the OCI Console:

            1. Navigate to **Oracle Database > Bare Metal, VM, and Exadata** and open the DB system.
            2. Open the database and select **Administer Encryption Key**.
            3. Select **Change Key Management Type**, then choose **Encrypt using customer-managed keys**.
            4. Select the vault and master encryption key.
            5. Confirm the change.
        - id: cli
          desc: |
            To migrate a DB system database to a customer-managed encryption key using the OCI CLI:

            ```bash
            oci db database migrate-vault-key --database-id <database-ocid> --kms-key-id <key-ocid> --vault-id <vault-ocid>
            ```
        - id: terraform
          desc: |
            To use a customer-managed encryption key for a DB system database in Terraform, set `kms_key_id` in the `database` block:

            ```hcl
            resource "oci_database_db_system" "example" {
              compartment_id      = var.compartment_ocid
              availability_domain = var.availability_domain
              shape               = "VM.Standard2.2"
              subnet_id           = var.subnet_ocid
              ssh_public_keys     = [var.ssh_public_key]
              hostname            = "exampledb"
              cpu_core_count      = 2

              db_home {
                db_version = "19.0.0.0"

                database {
                  admin_password = var.db_admin_password
                  db_name        = "exampledb"
                  kms_key_id     = oci_kms_key.example.id
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Database/Concepts/overview.htm
        title: OCI Database service documentation
  - uid: mondoo-oci-security-dbsystem-customer-managed-encryption-oci
