      )
  - uid: mondoo-oci-security-redis-cluster-supported-version
    title: Ensure OCI Cache clusters use a supported software version
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-7
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-oci-security-redis-cluster-supported-version-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-redis-cluster-supported-version-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-redis-cluster-supported-version-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-redis-cluster-supported-version-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every OCI Cache cluster runs an engine version that still receives security patches.

        Oracle's OCI Cache service has transitioned from Redis to Valkey, the community fork that now carries upstream development. Legacy `REDIS_*` version tracks no longer receive upstream security updates from the Valkey project, and older Valkey minor versions drop out of Oracle's patch matrix once a successor reaches general availability. This check requires the cluster's software version to be `VALKEY_7_2` or `VALKEY_8_1`. Review and change it in the Console under Databases > OCI Cache on the cluster's details page, or with `oci redis redis-cluster update`.

        **Why this matters**

        Unsupported engine versions do not receive CVE fixes. A vulnerability discovered after a version reaches end of life remains permanently unpatched in any cluster still running it, and no amount of network hardening changes that.

        The impact of such a vulnerability is high because of where the engine sits. Cache engines typically run with elevated privileges inside the VCN, so a remote-code-execution flaw in an unsupported version is a direct path to in-memory data exfiltration and to lateral movement toward whatever else the subnet can reach.

        Discovering an unsupported version during incident response or an audit forces a disruptive upgrade under time pressure. The same migration, planned in advance, is a maintenance window.

        The Redis to Valkey shift makes this sharper than a normal end-of-life question. A cluster on a `REDIS_*` track has no upstream project producing fixes at all, regardless of whether Oracle continues to publish patches of its own.

        Holding clusters on `VALKEY_7_2` or `VALKEY_8_1` keeps them on branches the Valkey project actively maintains and inside Oracle's published patch cadence. Keep this list current as Oracle's supported set moves, and treat a version falling off it as a scheduled migration rather than emergency remediation.
      audit: |
        ### Audit via Console

        1. Open **Databases** in the OCI Console and navigate to **OCI Cache** -> **Clusters**.
        2. For each cluster, note the **Software version** column.
        3. Verify the version is one of the currently supported values: `VALKEY_7_2` or `VALKEY_8_1`.

        A passing cluster shows a software version of `VALKEY_7_2` or `VALKEY_8_1`. A failing cluster shows an end-of-life or unsupported version.

        ### Audit via CLI

        1. List OCI Cache clusters and retrieve the software version for each:

        ```bash
        oci redis redis-cluster redis-cluster-summary list-redis-clusters \
          --compartment-id <compartment-ocid> \
          --query 'data.items[*].{name:"display-name", softwareVersion:"software-version"}' \
          --output table
        ```

        A passing cluster returns a `softwareVersion` of `VALKEY_7_2` or `VALKEY_8_1`. A failing cluster returns a version string outside the supported set.
      remediation:
        - id: console
          desc: |
            Upgrade the cluster's engine version:

            1. Open **Databases** -> **OCI Cache** -> select the cluster.
            2. Select **Edit** and choose a supported `softwareVersion`.
            3. Apply the change. OCI Cache supports in-place engine version updates.
        - id: cli
          desc: |
            Update the engine version in place:

            ```bash
            oci redis redis-cluster redis-cluster update \
              --redis-cluster-id <cluster-ocid> \
              --software-version VALKEY_8_1
            ```
        - id: terraform
          desc: |
            Pin `software_version` to a supported value:

            ```hcl
            resource "oci_redis_redis_cluster" "app" {
              compartment_id     = var.compartment_ocid
              display_name       = "app-cache"
              node_count         = 3
              node_memory_in_gbs = 4
              software_version   = "VALKEY_8_1"
              subnet_id          = oci_core_subnet.cache_private.id
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ocicache/home.htm
        title: OCI Cache Overview
  # The supported version literal `["VALKEY_7_2", "VALKEY_8_1"]` is repeated in all four variant queries below. cnspec policy YAML does not support anchors inside MQL block scalars and the OCI policy file does not use `props:`, so the list cannot be defined once. When Oracle adds or deprecates a version, update the literal in all four variants together.
  - uid: mondoo-oci-security-redis-cluster-supported-version-oci
    filters: asset.platform == "oci-redis-cluster"
    mql: |
      # MAINTAIN-TOGETHER: keep this version list in sync with the other three variants of mondoo-oci-security-redis-cluster-supported-version
