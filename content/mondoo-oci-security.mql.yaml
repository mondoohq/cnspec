  - uid: mondoo-oci-security-object-storage-buckets-replication-enabled
    title: Ensure Object Storage buckets have replication enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-14
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ds-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/icon: oci
      - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that Object Storage buckets replicate their objects to a second region, so that no single region holds the only copy of the data.

        A replication policy names a destination bucket in another region and continuously copies new and updated objects to it. Buckets have no replication by default. Create a policy in the Console under the bucket's Replication panel or with `oci os replication create-replication-policy`, and first allow the service to write at the destination with a statement of the form `allow service objectstorage-<region> to manage object-family in compartment <compartment>`. While a policy is active the destination bucket accepts writes only from replication, so the replica cannot quietly diverge. The Terraform versions of this check expect a replication policy resource for every bucket the configuration declares.

        **Why this matters**

        A regional outage or a regional disaster takes the only copy of the data with it when replication is off. The bucket is not corrupted, it is simply unreachable, and every service that depends on it stops until the region returns.

        Recovering without a replica means restoring from backup media by hand, object by object or archive by archive, which stretches an outage from minutes into hours or days. A synchronized replica in another region is ready to serve reads or absorb writes as soon as traffic is redirected.

        Many data protection and business continuity frameworks require geographically separated copies of critical data, and a single-region bucket cannot demonstrate that separation.

        Prioritize buckets holding regulated, business-critical, or irreplaceable data, and pick a destination region that satisfies your jurisdictional, latency, and compliance constraints. Where data residency rules forbid copying outside a jurisdiction, that is a legitimate reason to leave replication off and rely on in-region durability. Replication is asynchronous and it propagates deletes, so it is an availability control rather than a backup. Pair it with versioning or retention rules to survive destructive writes, and monitor policy status so replication lag or a stalled policy is alerted on rather than discovered during a failover.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Storage > Object Storage > Buckets**.
        2. Select the bucket you want to inspect.
        3. In the bucket details page, select **Replication Policy** under the **Resources** section on the left.
        4. Review whether a replication policy is listed.

        A passing bucket shows at least one active replication policy. A failing bucket shows no replication policies configured.

        ### Audit via CLI

        1. List all buckets in the compartment:

        ```bash
        oci os bucket list --compartment-id <compartment-ocid> --query 'data[*].name'
        ```

        2. For each bucket, list its replication policies:

        ```bash
        oci os replication list-replication-policies --bucket-name <bucket-name>
        ```

        A passing bucket returns a non-empty JSON array of replication policy objects. A failing bucket returns an empty array `[]` or a 404 response.
      remediation:
        - id: console
          desc: |
            Before creating a replication policy, two prerequisites must be in place or the policy creation fails: the destination bucket must already exist with object versioning enabled, and an IAM policy must grant the Object Storage service permission to manage objects in the destination compartment, for example `Allow service objectstorage-<region> to manage object-family in compartment <destination-compartment>`.

            To enable replication on an Object Storage bucket using the OCI Console:

            1. Navigate to **Object Storage > Buckets**.
            2. Select the bucket identified in this finding.
            3. Under **Resources**, select **Replication Policy**.
            4. Select **Create Policy**.
            5. Choose the destination region and destination bucket.
            6. Select **Create**.
        - id: cli
          desc: |
            Before creating a replication policy, two prerequisites must be in place or the policy creation fails: the destination bucket must already exist with object versioning enabled, and an IAM policy must grant the Object Storage service permission to manage objects in the destination compartment, for example `Allow service objectstorage-<region> to manage object-family in compartment <destination-compartment>`.

            To enable replication on an Object Storage bucket using the OCI CLI, create a replication policy:

            ```bash
            oci os replication create-replication-policy --bucket-name SOURCE_BUCKET_NAME \
              --destination-bucket DESTINATION_BUCKET_NAME \
              --destination-region DESTINATION_REGION \
              --name "cross-region-replication"
            ```
        - id: terraform
          desc: |
            To enable replication on an Object Storage bucket in Terraform, create a replication policy resource. The destination bucket must already exist with object versioning enabled, and an IAM policy must grant the Object Storage service permission to manage objects in the destination compartment, or the policy creation fails. The example below declares both prerequisites:

            ```hcl
            resource "oci_objectstorage_bucket" "destination" {
              compartment_id = var.destination_compartment_ocid
              namespace      = var.namespace
              name           = "backups-replica"
              versioning     = "Enabled"
            }

            resource "oci_identity_policy" "replication" {
              compartment_id = var.destination_compartment_ocid
              name           = "objectstorage-replication"
              description    = "Allow Object Storage to replicate into the destination compartment"

              statements = [
                "Allow service objectstorage-${var.destination_region} to manage object-family in compartment id ${var.destination_compartment_ocid}",
              ]
            }

            resource "oci_objectstorage_replication_policy" "example" {
              bucket           = oci_objectstorage_bucket.source.name
              namespace        = var.namespace
              name             = "cross-region-replication"
              destination_bucket_name   = oci_objectstorage_bucket.destination.name
              destination_region_name   = var.destination_region
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/usingreplication.htm
        title: OCI Object Storage replication documentation
  - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-oci
    filters: asset.platform == "oci-objectstorage-bucket"
    mql: |
      oci.objectStorage.bucket.replicationEnabled == true
  - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_objectstorage_bucket")
    mql: |
      terraform.resources("oci_objectstorage_replication_policy").length >= terraform.resources("oci_objectstorage_bucket").length
  - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_objectstorage_replication_policy").length >= terraform.plan.resourceChanges.where(type == "oci_objectstorage_bucket").length
  - uid: mondoo-oci-security-object-storage-buckets-replication-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.state.resources.where(type == "oci_objectstorage_replication_policy").length >= terraform.state.resources.where(type == "oci_objectstorage_bucket").length
  - uid: mondoo-oci-security-object-storage-archive-buckets-versioning
    title: Ensure Object Storage archive buckets have versioning enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-13
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/icon: oci
      - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that Object Storage buckets on the `Archive` tier keep prior object versions, so long-term records survive an overwrite or a delete.

        A bucket's storage tier is fixed at creation and cannot be changed afterward, and `Archive` is chosen for data meant to sit untouched for years: backups, compliance records, and historical logs. Versioning is a separate setting and is off unless requested, so an archive bucket can silently be a single-copy store. Turn it on from the bucket detail page or with `oci os bucket update --namespace <namespace> --name <bucket> --versioning Enabled`.

        **Why this matters**

        The data in an archive bucket is usually the copy of last resort. When versioning is off, a mistaken delete or an overwrite of the wrong object name destroys the record with nothing behind it, and the mistake is typically discovered months later when someone finally goes looking. Versioning makes that reversible without involving a separate backup system.

        It also removes permanent destruction from an attacker's reach. Write access alone is no longer enough to erase archived data, because older versions remain and can be recovered, which matters for both ransomware and a departing insider with retained credentials.

        Regulations and audit obligations frequently require archived records to stay recoverable and unaltered for a defined retention period, and only retained versions can prove the record was never quietly replaced.

        Recovery from a version is also cheaper and far faster than rebuilding from a secondary backup copy on different media, even accounting for the restore step that `Archive` objects require before they can be downloaded, which can take up to an hour.

        Enable versioning when the bucket is created so it is never overlooked, and configure lifecycle rules that expire noncurrent versions once your retention window closes, since `Archive` bills a 90-day minimum retention per object and unbounded version growth is expensive. For compliance-critical archives, combine versioning with a locked retention rule, which is OCI's write-once-read-many control and blocks deletion even by privileged users.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Storage > Object Storage > Buckets**.
        2. Filter or identify buckets with the **Archive** storage tier.
        3. Select the archive bucket you want to inspect.
        4. In the bucket details page, locate the **Versioning** field under **Bucket Information**.

        A passing bucket shows **Versioning: Enabled**. A failing bucket shows **Versioning: Disabled** or **Versioning: Suspended**.

        ### Audit via CLI

        1. List all buckets in the compartment and retrieve their storage tier and versioning status:

        ```bash
        oci os bucket list --compartment-id <compartment-ocid> --fields versioning,storageTier --all --query 'data[?"storage-tier"==`Archive`].{name: name, versioning: versioning}'
        ```

        A passing bucket returns `"versioning": "Enabled"` for every archive-tier entry. A failing bucket returns `"versioning": "Disabled"` or `"versioning": "Suspended"` for one or more archive-tier entries.
      remediation:
        - id: console
          desc: |
            To enable versioning on an archive-tier bucket using the OCI Console:

            1. Navigate to **Object Storage > Buckets**.
            2. Select the archive-tier bucket identified in this finding.
            3. Select **Edit Versioning**.
            4. Enable versioning.
            5. Select **Save Changes**.
        - id: cli
          desc: |
            To enable versioning on an archive-tier bucket using the OCI CLI:

            ```bash
            oci os bucket update --bucket-name BUCKET_NAME --versioning Enabled
            ```
        - id: terraform
          desc: |
            To enable versioning on an archive-tier bucket in Terraform, set the `versioning` attribute:

            ```hcl
            resource "oci_objectstorage_bucket" "archive" {
              compartment_id = var.compartment_ocid
              namespace      = var.namespace
              name           = "archive-bucket"
              storage_tier   = "Archive"
              versioning     = "Enabled"
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/usingversioning.htm
        title: OCI Object Storage versioning documentation
  - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-oci
    filters: asset.platform == "oci-objectstorage-bucket" && oci.objectStorage.bucket.storageTier == "Archive"
    mql: |
      oci.objectStorage.bucket.versioning == "Enabled"
  - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_objectstorage_bucket")
    mql: |
      terraform.resources("oci_objectstorage_bucket").where(arguments.storage_tier == "Archive").all(
        arguments.versioning == "Enabled"
      )
  - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_objectstorage_bucket" && change.after.storage_tier == "Archive").all(
        change.after.versioning == "Enabled"
      )
  - uid: mondoo-oci-security-object-storage-archive-buckets-versioning-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.state.resources.where(type == "oci_objectstorage_bucket" && values.storage_tier == "Archive").all(
        values.versioning == "Enabled"
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress
    title: Ensure VCN security lists block SSH ingress from 0.0.0.0/0
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that SSH administrative access is never reachable from the entire internet.

        The rule shape the check rejects is TCP, protocol number `6`, with source `0.0.0.0/0` and a destination port range that covers 22, including a rule that names no port range at all and therefore covers 22 by omission. A security list applies to every VNIC in its subnet, so one such rule exposes port 22 on every instance there, including instances whose owners never intended to accept remote logins. Tighten the source on the security list details page in the Console or with `oci network security-list update`.

        **Why this matters**

        Port 22 on a fresh public address is found in minutes. Botnets sweep the whole IPv4 space continuously and feed the hits into credential stuffing runs that replay username and password pairs harvested from unrelated breaches, then into password spraying against `root`, `opc` and other predictable account names that Oracle Linux images ship with.

        Credentials are not the only route in. Unpatched SSH daemons are periodically affected by remote code execution CVEs, and an unrestricted rule means a bug of that kind is exploitable by anyone before any authentication step is reached.

        What follows an SSH compromise is worse than the login. The attacker holds an interactive shell inside the VCN and uses it as a pivot toward internal resources that were never meant to be reachable from outside, and the encrypted channel doubles as an exfiltration path that looks exactly like legitimate administration in flow logs.

        Restrict the source to the CIDR blocks of your corporate VPN, bastion subnet or jump host, or remove the rule entirely and reach instances through the OCI Bastion service, which brokers sessions without port 22 ever being open. Disabling password authentication in the SSH daemon closes the brute force path even during a window when the port is briefly reachable.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Virtual Cloud Networks**.
        2. Select the VCN you want to inspect.
        3. Select **Security Lists** from the left-hand resources menu.
        4. For each security list, select it and review the **Ingress Rules** tab.
        5. Look for any rule where the **Source** is `0.0.0.0/0`, the **Protocol** is TCP, and the **Destination Port Range** includes port 22.

        A passing security list has no ingress rule allowing TCP port 22 from `0.0.0.0/0`. A failing security list has at least one such rule.

        ### Audit via CLI

        1. List all security lists in the VCN:

        ```bash
        oci network security-list list --compartment-id <compartment-ocid> --vcn-id <vcn-ocid> --all --query 'data[*].{id: id, name: "display-name", ingress: "ingress-security-rules"[?source==`0.0.0.0/0` && protocol==`6`]}'
        ```

        2. For any returned security list, inspect whether the ingress rules for `0.0.0.0/0` TCP cover port 22:

        ```bash
        oci network security-list get --security-list-id <security-list-ocid> --query 'data."ingress-security-rules"[?source==`0.0.0.0/0` && protocol==`6`]'
        ```

        A passing security list returns no rules that include port 22 in the destination port range from `0.0.0.0/0`. A failing security list returns one or more rules where the destination port range covers port 22.
      remediation:
        - id: console
          desc: |
            To restrict SSH ingress in a VCN security list using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list with the SSH rule.
            5. Edit the TCP ingress rule for port 22 from 0.0.0.0/0 to use a specific trusted source CIDR block (e.g., your corporate network or bastion subnet).
        - id: cli
          desc: |
            To restrict SSH ingress in a VCN security list using the OCI CLI, narrow the source CIDR on the port 22 rule.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the offending rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id <security-list-ocid> \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json`, changing the source on the port 22 rule from `0.0.0.0/0` to a trusted CIDR such as `{"source":"10.0.0.0/24","protocol":"6","tcpOptions":{"destinationPortRange":{"min":22,"max":22}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id <security-list-ocid> \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            To restrict SSH ingress in a VCN security list in Terraform, specify a trusted source CIDR instead of 0.0.0.0/0:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              ingress_security_rules {
                protocol  = "6" # TCP
                source    = "10.0.0.0/24" # Bastion subnet only
                stateless = false

                tcp_options {
                  min = 22
                  max = 22
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: CIS OCI Foundations Benchmark 2.3
  - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-oci
    filters: asset.platform == "oci-network-securitylist"
    mql: |
      oci.network.securityList.ingressRules.where(
        source == "0.0.0.0/0" && protocol == "6"
      ).none(
        destinationPortMin == empty || destinationPortMin <= 22 && destinationPortMax >= 22
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_core_security_list")
    mql: |
      terraform.resources("oci_core_security_list").all(
        blocks.where(type == "ingress_security_rules" && arguments.source == "0.0.0.0/0" && arguments.protocol == "6").none(
          blocks.where(type == "tcp_options") == empty ||
          blocks.where(type == "tcp_options").any(
            arguments.min == 22 || arguments.max == 22 ||
            arguments.min <= 22 && arguments.max >= 22
          )
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_core_security_list")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_core_security_list").all(
        change.after.ingress_security_rules.where(_['source'] == "0.0.0.0/0" && _['protocol'] == "6").none(
          _['tcp_options'] == empty || _['tcp_options'].any(
            _['destination_port_range'].any(_['min'] <= 22 && _['max'] >= 22)
          )
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ssh-ingress-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_core_security_list")
    mql: |
      terraform.state.resources.where(type == "oci_core_security_list").all(
        values.ingress_security_rules.where(_['source'] == "0.0.0.0/0" && _['protocol'] == "6").none(
          _['tcp_options'] == empty || _['tcp_options'].any(
            _['destination_port_range'].any(_['min'] <= 22 && _['max'] >= 22)
          )
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-rdp-ingress
    title: Ensure VCN security lists block RDP ingress from 0.0.0.0/0
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
