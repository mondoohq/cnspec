      - uid: mondoo-oci-security-oke-secrets-customer-managed-encryption-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-secrets-customer-managed-encryption-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-secrets-customer-managed-encryption-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that OKE encrypts Kubernetes secrets at rest in etcd with a customer-managed key held in OCI Vault instead of the Oracle-managed key applied by default.

        Oracle Kubernetes Engine (OKE) already encrypts etcd, so the gap this closes is not missing encryption but missing customer control over the key that protects application secrets, service-account tokens, and every other sensitive object the control plane stores. The check requires a master encryption key to be assigned to the cluster. Choose it under Advanced options when creating the cluster with Encrypt Kubernetes secrets using a KMS key, or pass `--kms-key-id` to `oci ce cluster create`, and grant the service access with a statement such as `allow service oke to use keys in compartment <compartment-name>`.

        **Why this matters**

        A customer-managed key gives you a kill switch. Disabling or deleting the key in OCI Vault renders every Kubernetes secret in the cluster unreadable, which is the fastest containment action available when a cluster is suspected of being compromised. With the Oracle-managed default there is no equivalent lever to pull.

        Holding the key in a vault you control also separates key management from cluster administration. The people who can operate the cluster and the people who can authorize use of the key become distinct sets of principals with distinct IAM policies, and key operations land in an audit trail that a cluster administrator cannot quietly edit.

        Frameworks such as HIPAA and PCI DSS ask for demonstrable control over the keys protecting regulated data, and secrets sitting in a Kubernetes control plane are squarely inside that scope. An Oracle-managed key is encryption you can attest to but not key custody you can evidence.

        The key must be assigned when the cluster is created, because the secrets-encryption key cannot be added or changed afterward; retrofitting means building a new cluster and migrating workloads to it. Once assigned, configure rotation on the key and review OCI Audit for key operations touching the cluster. Note that this protects control-plane storage, so pair it with a runtime flow where pods fetch credentials from Vault rather than relying on long-lived Kubernetes secrets.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Developer Services > Kubernetes Clusters (OKE)**.
        2. Open each cluster and review the **Cluster details**.
        3. Locate the **Kubernetes Secrets Encryption** (KMS key) field.

        A passing cluster shows a customer-managed KMS key OCID. A failing cluster shows no KMS key, indicating the default Oracle-managed encryption.

        ### Audit via CLI

        1. Retrieve the KMS key assignment for a cluster:

        ```bash
        oci ce cluster get --cluster-id <cluster-ocid> --query 'data.{name:name,kmsKeyId:"kms-key-id"}'
        ```

        A passing cluster returns a non-empty OCID in `kmsKeyId`. A failing cluster returns `null`.
      remediation:
        - id: console
          desc: |
            To encrypt Kubernetes secrets with a customer-managed key using the OCI Console:

            1. Navigate to **Developer Services > Kubernetes Clusters (OKE)** and select **Create cluster**.
            2. In the cluster configuration, expand **Advanced options**.
            3. Enable **Encrypt Kubernetes secrets using a KMS key** and select the vault and master encryption key.
            4. Create the cluster and migrate workloads from any cluster that uses the default Oracle-managed key, because the secrets-encryption key cannot be added to an existing cluster.
        - id: cli
          desc: |
            To create an OKE cluster that encrypts Kubernetes secrets with a customer-managed key using the OCI CLI:

            ```bash
            oci ce cluster create --compartment-id <compartment-ocid> --name secure-cluster --vcn-id <vcn-ocid> --kubernetes-version <version> --kms-key-id <key-ocid>
            ```
        - id: terraform
          desc: |
            To encrypt Kubernetes secrets with a customer-managed key in Terraform, set `kms_key_id` on the cluster resource:

            ```hcl
            resource "oci_containerengine_cluster" "example" {
              compartment_id     = var.compartment_ocid
              name               = "secure-cluster"
              vcn_id             = oci_core_vcn.example.id
              kubernetes_version = "v1.29.1"
              kms_key_id         = oci_kms_key.example.id
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/contengencryptingkubernetessecretsatrest.htm
        title: OCI - Encrypting Kubernetes Secrets at Rest in Etcd
  - uid: mondoo-oci-security-oke-secrets-customer-managed-encryption-oci
    filters: asset.platform == "oci-oke-cluster"
    mql: |
      oci.oke.cluster.kmsKey != null
  - uid: mondoo-oci-security-oke-secrets-customer-managed-encryption-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_containerengine_cluster')
    mql: |
      terraform.resources('oci_containerengine_cluster').all(
        arguments['kms_key_id'] != null && arguments['kms_key_id'] != ""
      )
  - uid: mondoo-oci-security-oke-secrets-customer-managed-encryption-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_containerengine_cluster')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_containerengine_cluster').all(
        change.after['kms_key_id'] != null && change.after['kms_key_id'] != ""
      )
  - uid: mondoo-oci-security-oke-secrets-customer-managed-encryption-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_containerengine_cluster')
    mql: |
      terraform.state.resources.where(type == 'oci_containerengine_cluster').all(
        values['kms_key_id'] != null && values['kms_key_id'] != ""
      )
  - uid: mondoo-oci-security-adb-mtls-or-restricted
    title: Ensure Autonomous Databases require mTLS or restrict access via ACL / NSG
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-adb-mtls-or-restricted-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-adb-mtls-or-restricted-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-adb-mtls-or-restricted-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-adb-mtls-or-restricted-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Autonomous Database gates connections behind either mutual TLS or a network restriction, so that stolen credentials alone cannot open a session.

        Autonomous Database admits clients in one of two handshake modes. With mutual TLS required, the client must present the certificate packaged in the database's connection wallet, and the handshake fails before any credential is evaluated if that certificate is missing or has been rotated out. With mutual TLS optional, no wallet participates and the session is admitted on credentials alone. This check passes a database that requires mutual TLS, and also one that constrains who can reach it at all: a private endpoint address, a non-empty access control list of permitted sources, or attached network security groups. All of these live under Oracle Database > Autonomous Database > Network in the Console, or in `oci db autonomous-database update`.

        **Why this matters**

        A public Autonomous Database with mutual TLS optional and an empty access control list is the weakest posture the service permits. An empty list is not a closed door but the absence of one: with no entries there is nothing to filter against, so any address on the internet may attempt a connection. A leaked application password is then the whole attack, and the SQL*Net listener absorbs continuous brute-force and vulnerability scanning.

        Wallets leak during ordinary operations. They are committed to code repositories, pasted into ticketing systems, and forwarded over support channels. Requiring mutual TLS does not make that harmless, but it splits the compromise in two, since the attacker now needs wallet material as well as credentials.

        An access control list or a network security group is a different kind of gate, one that still holds when both credentials and wallet leak, because it filters before the listener is reached. Oracle treats required mutual TLS or private endpoint access as the expected posture for production.

        Where a platform genuinely cannot distribute wallets, making mutual TLS optional is defensible only alongside a private endpoint or a tightly scoped allowlist.
      audit: |
        ### Audit via Console

        1. Open **Oracle Database** → **Autonomous Database** and select the database.
        2. Navigate to **Database Details** and review the **Network** section.
        3. Confirm that at least one of the following is in effect: **Require mutual TLS (mTLS) authentication** is enabled, the database uses **Private endpoint access**, an IP allowlist is configured under **Access Control List**, or at least one NSG is attached.

        A passing database shows mTLS required, a private endpoint assigned, a non-empty access control list, or at least one NSG. A failing database shows mTLS disabled with no private endpoint, no ACL entries, and no NSGs.

        ### Audit via CLI

        1. Retrieve Autonomous Database details and inspect the relevant network fields:

        ```bash
        oci db autonomous-database get \
          --autonomous-database-id <adb-ocid> \
          --query 'data.{mtlsRequired:"is-mtls-connection-required",privateEndpointIp:"private-endpoint-ip",whitelistedIps:"whitelisted-ips",nsgIds:"nsg-ids"}'
        ```

        A passing database returns `"mtlsRequired": true`, a non-null `privateEndpointIp`, a non-empty `whitelistedIps` list, or a non-empty `nsgIds` list. A failing database returns `"mtlsRequired": false`, `"privateEndpointIp": null`, an empty `whitelistedIps`, and an empty `nsgIds`.
      remediation:
        - id: console
          desc: |
            Harden the Autonomous Database's network posture:

            1. Open **Oracle Database** → **Autonomous Database** → select the DB.
            2. Pick the most restrictive network path that still meets application requirements:
               - **Secure access from everywhere with mTLS**: require mTLS (`Require mutual TLS (mTLS) authentication`).
               - **Allow secure access from specified IPs and VCNs**: configure an IP / NSG allowlist.
               - **Private endpoint access only**: attach a private endpoint in a dedicated subnet.
            3. Save. Applications that were relying on TLS-only mode must switch to mTLS wallets.
        - id: cli
          desc: |
            Require mTLS on an existing ADB:

            ```bash
            oci db autonomous-database update \
              --autonomous-database-id <adb-ocid> \
              --is-mtls-connection-required true
            ```
        - id: terraform
          desc: |
            Configure each Autonomous Database with at least one of `is_mtls_connection_required = true`, a private endpoint, an IP allowlist, or attached NSGs:

            ```hcl
            resource "oci_database_autonomous_database" "app" {
              compartment_id           = var.compartment_ocid
              db_name                  = "appdb"
              admin_password           = var.adb_admin_password
              cpu_core_count           = 1
              data_storage_size_in_tbs = 1

              # Option A: require mTLS for public-network access
              is_mtls_connection_required = true

              # Option B: confine to a private endpoint (alternative to public + mTLS)
              # subnet_id  = oci_core_subnet.adb_private.id
              # nsg_ids    = [oci_core_network_security_group.adb.id]

              # Option C: ACL the public listener to known networks
              # whitelisted_ips = ["10.0.0.0/16"]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/autonomous-database-serverless/doc/network-access-types.html
        title: OCI - Autonomous Database Network Access
  - uid: mondoo-oci-security-adb-mtls-or-restricted-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.database.autonomousDatabases.all(
        isMtlsConnectionRequired == true ||
        privateEndpointIp != null ||
        whitelistedIps.length > 0 ||
        securityGroups.length > 0
      )
  - uid: mondoo-oci-security-adb-mtls-or-restricted-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_database_autonomous_database')
    mql: |
      terraform.resources('oci_database_autonomous_database').all(
        arguments['is_mtls_connection_required'] == true ||
        arguments['private_endpoint_ip'] != null ||
        arguments['whitelisted_ips'] != null && arguments['whitelisted_ips'].length > 0 ||
        arguments['nsg_ids'] != null && arguments['nsg_ids'].length > 0
      )
  - uid: mondoo-oci-security-adb-mtls-or-restricted-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_database_autonomous_database')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_database_autonomous_database').all(
        change.after['is_mtls_connection_required'] == true ||
        change.after['private_endpoint_ip'] != null ||
        change.after['whitelisted_ips'] != null && change.after['whitelisted_ips'].length > 0 ||
        change.after['nsg_ids'] != null && change.after['nsg_ids'].length > 0
      )
  - uid: mondoo-oci-security-adb-mtls-or-restricted-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_database_autonomous_database')
    mql: |
      terraform.state.resources.where(type == 'oci_database_autonomous_database').all(
        values['is_mtls_connection_required'] == true ||
        values['private_endpoint_ip'] != null ||
        values['whitelisted_ips'] != null && values['whitelisted_ips'].length > 0 ||
        values['nsg_ids'] != null && values['nsg_ids'].length > 0
      )
  - uid: mondoo-oci-security-adb-no-public-management-urls
    title: Ensure Autonomous Databases do not expose public management URLs
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-adb-no-public-management-urls-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-adb-no-public-management-urls-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-adb-no-public-management-urls-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-adb-no-public-management-urls-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that an Autonomous Database's browser-based management interfaces are served only inside the virtual cloud network and never on a public endpoint.

        Every Autonomous Database publishes a set of management URLs alongside the SQL listener: the service console, Database Actions with its SQL Developer Web worksheet, Oracle REST Data Services or ORDS, Oracle APEX, GraphStudio, and Machine Learning Notebooks. A database provisioned into a subnet resolves those URLs only through its private endpoint. A database provisioned without one gets a public copy of each interface, and the existence of that copy does not depend on whether an IP access control list or a network security group is attached. Choose private endpoint access in the Network section when creating the database under Oracle Database > Autonomous Database, or supply a subnet to `oci db autonomous-database create`.

        **Why this matters**

        The management surface is much wider than the listener. Database Actions runs arbitrary SQL as the connected schema, loads data files, and publishes REST endpoints. An unauthenticated request that reaches these URLs already gets a login form that accepts database usernames for credential stuffing and a precise fingerprint of the ORDS and APEX versions behind it, which is what an attacker needs to select an exploit.

        ORDS and APEX have both shipped pre-authentication vulnerabilities, the class that requires no credentials at all. When the management URLs answer only inside the virtual cloud network, that entire class becomes unreachable from the internet regardless of what the database's authentication settings say.

        Access control lists rot. Networks are renumbered, VPN exit addresses are recycled to other tenants, and permissive ranges added for one debugging session are never removed. A private endpoint database cannot be made internet-reachable by that drift, which is why this is a stronger control than mutual TLS or an allowlist.

        Teams that need APEX or Database Actions from outside the virtual cloud network should reach them through a bastion or reverse proxy inside it, not by reopening the public endpoint.
      audit: |
        ### Audit via Console

        1. Open **Oracle Database** → **Autonomous Database** and select the database.
        2. Navigate to **Database Details** → **Network** and locate the **Access type** field.
        3. Verify the access type is **Private endpoint access only**.
        4. Confirm that **Connection URLs** or the **Tools** section shows no publicly reachable management URLs (APEX, SQL Developer Web, ORDS, GraphStudio, ML Notebooks).

        A passing database shows **Private endpoint access only** with no public connection URLs listed. A failing database shows public or mixed access with management URLs exposed on a public hostname.

        ### Audit via CLI

        1. Retrieve Autonomous Database details and inspect the `connection-urls` field:

        ```bash
        oci db autonomous-database get \
          --autonomous-database-id <adb-ocid> \
          --query 'data.{subnetId:"subnet-id",connectionUrls:"connection-urls",privateEndpointIp:"private-endpoint-ip"}'
        ```

        A passing database returns a non-null `subnetId` (indicating private endpoint mode) and a `null` or empty `connectionUrls` object. A failing database returns `"subnetId": null` and a populated `connectionUrls` object containing public management URLs.
      remediation:
        - id: console
          desc: |
            Switch the database to private endpoint access:

            1. Open **Oracle Database** → **Autonomous Database** → select the database.
            2. From **More actions**, select **Update network access**.
            3. Choose **Private endpoint access only** and select a subnet with **Prohibit public IP on VNIC** enabled, plus any NSGs.
            4. Select **Update**. The database is briefly unavailable while the endpoint switches, and clients must download new connection strings and wallets.
        - id: cli
          desc: |
            Switch the existing database to a private endpoint:

            ```bash
            oci db autonomous-database update \
              --autonomous-database-id <adb-ocid> \
              --subnet-id <private-subnet-ocid> \
              --nsg-ids '["<nsg-ocid>"]'
            ```

            The database is briefly unavailable while the endpoint switches, and clients must download new connection strings and wallets.
        - id: terraform
          desc: |
            Provision Autonomous Databases with `subnet_id` set so the ADB is created in private-endpoint mode and surfaces no public management URLs:

            ```hcl
            resource "oci_database_autonomous_database" "app" {
              compartment_id           = var.compartment_ocid
              db_name                  = "appdb"
              admin_password           = var.adb_admin_password
              cpu_core_count           = 1
              data_storage_size_in_tbs = 1

              # Private endpoint mode — no public connection URLs are surfaced
              subnet_id = oci_core_subnet.adb_private.id
              nsg_ids   = [oci_core_network_security_group.adb.id]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/autonomous-database-serverless/doc/network-access-types.html
        title: OCI - Autonomous Database Network Access
      - url: https://docs.oracle.com/en-us/iaas/autonomous-database-serverless/doc/private-endpoint-overview.html
        title: OCI - Configure Private Endpoint Access
  - uid: mondoo-oci-security-adb-no-public-management-urls-oci
    filters: asset.platform == 'oci'
    mql: |
      # publicConnectionUrls carries the copies of the management interfaces served on the
      # database's public endpoint, so it is populated only when one exists. connectionUrls
      # is also populated for an NSG-allowed private endpoint, which is not what this asks.
      oci.database.autonomousDatabases.all(publicConnectionUrls == null)
  - uid: mondoo-oci-security-adb-no-public-management-urls-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_database_autonomous_database')
    mql: |
      terraform.resources('oci_database_autonomous_database').all(
        arguments['subnet_id'] != null
      )
  - uid: mondoo-oci-security-adb-no-public-management-urls-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_database_autonomous_database')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_database_autonomous_database').all(
        change.after['subnet_id'] != null
      )
  - uid: mondoo-oci-security-adb-no-public-management-urls-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_database_autonomous_database')
    mql: |
      terraform.state.resources.where(type == 'oci_database_autonomous_database').all(
        values['subnet_id'] != null
      )
  # No Terraform variants: requires cross-resource lookup from `oci_database_db_system` to its referenced `oci_core_subnet` to read `prohibit_public_ip_on_vnic`. Cross-resource graph traversal is fragile in HCL/plan/state and unsupported by the patterns used elsewhere in this file.
  - uid: mondoo-oci-security-dbsystem-private-subnet
    title: Ensure DB systems are deployed in subnets that prohibit public IPs on VNICs
    impact: 90
    filters: asset.platform == 'oci'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      oci.database.dbSystems.all(
        subnet.prohibitPublicIpOnVnic == true
      )
    docs:
      desc: |
        This check verifies that DB systems sit in subnets that structurally forbid a public IP address on any attached VNIC.

        An OCI subnet carries a `prohibitPublicIpOnVnic` setting. Created with `prohibitPublicIpOnVnic = true` and reported by the API as `prohibitPublicIpOnVnic: true`, the subnet refuses a public address to every VNIC in it, and the restriction is enforced by the subnet rather than by the resource placed in it. When the flag is `false`, a DB system's VNIC can take a public IP, and the Oracle listener answers directly from the internet. The setting is fixed when the subnet is created, chosen as a private subnet under Networking > Virtual Cloud Networks > Subnets, and readable with `oci network subnet get`.

        **Why this matters**

        An Oracle listener on a public address is found within hours. Internet-wide scanners fingerprint the TNS layer, replay default credentials for accounts such as `SYSTEM` and `DBSNMP`, and test unpatched Oracle Database CVEs against whatever version the handshake discloses. There is no human in that loop and no ramp-up period.

        Databases also get none of the protections that normally sit in front of internet-facing services. A web application has a WAF, DDoS mitigation, and rate limiting between it and the internet. A DB system VNIC has only its security lists and network security groups, so every request that those permit lands directly on the listener with no inspection and no throttling.

        The public address is a path outward as well as inward. A host compromised through an application tier or a stolen operating system credential can stream table contents straight to an attacker-controlled address, because the interface used to reach the database is also a route off it.

        Because the prohibition lives on the subnet, it survives DB system replacement, scaling, and reconfiguration. An operator who later launches a node with a public IP request in that subnet gets a failure instead of an exposure, which is what makes this a durable control rather than a setting to reaudit after every change.
      audit: |
        ### Audit via Console

        1. Open **Oracle Database** → **DB Systems** and select the DB system.
        2. Navigate to **DB System Details** and locate the **Subnet** field under the **Network** section.
        3. Click the linked subnet name to open the subnet details.
        4. Verify that **Prohibit public IP on VNIC** is set to **Yes**.

        A passing DB system is deployed in a subnet where **Prohibit public IP on VNIC** is **Yes**. A failing DB system is deployed in a subnet where this setting is **No**, allowing VNICs in the subnet to receive public IPs.

        ### Audit via CLI

        1. List DB systems and retrieve the subnet ID for each:

        ```bash
        oci db system list \
          --compartment-id <compartment-ocid> \
          --query 'data[*].{id:id,displayName:"display-name",subnetId:"subnet-id"}'
        ```

        2. For each subnet ID, check the `prohibit-public-ip-on-vnic` flag:

        ```bash
        oci network subnet get \
          --subnet-id <subnet-ocid> \
          --query 'data.{subnetId:id,prohibitPublicIp:"prohibit-public-ip-on-vnic"}'
        ```

        A passing DB system's subnet returns `"prohibitPublicIp": true`. A failing DB system's subnet returns `"prohibitPublicIp": false`.
      remediation:
        - id: console
          desc: |
            Move the DB system to a private subnet:

            1. Identify or create a subnet with **Prohibit public IP on VNIC** set to **Yes**.
            2. Since DB system subnet cannot be changed after creation, provision a replacement DB system in the private subnet.
            3. Migrate data to the replacement via Data Pump, Data Guard, or RMAN.
            4. Terminate the DB system in the public subnet once traffic has cut over.
        - id: cli
          desc: |
            Create a private subnet, launch a replacement DB system in it, then migrate and terminate the original:

            ```bash
            oci network subnet create \
              --compartment-id <compartment-ocid> \
              --vcn-id <vcn-ocid> \
              --cidr-block 10.0.10.0/24 \
              --prohibit-public-ip-on-vnic true \
              --display-name private-db-subnet

            oci db system launch \
              --compartment-id <compartment-ocid> \
              --subnet-id <private-subnet-ocid> \
              --availability-domain <AD> \
              --shape <shape> \
              --hostname <hostname> \
              --cpu-core-count <count> \
              --ssh-authorized-keys-file <public-key-file>
            ```

            Migrate data to the replacement via Data Pump, Data Guard, or RMAN, then terminate the DB system in the public subnet:

            ```bash
            oci db system terminate --db-system-id <old-db-system-ocid>
            ```
        # No Terraform remediation: this check requires cross-resource lookup from `oci_database_db_system` to its referenced `oci_core_subnet` to read `prohibit_public_ip_on_vnic`; cross-resource graph traversal is fragile in HCL/plan/state and unsupported by the patterns used elsewhere in this file.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Database/Concepts/databaseoverview.htm
        title: OCI - Database Service Overview
  # No Terraform variants: requires walking from `oci_database_db_system` to its subnet to that subnet's `oci_core_route_table` and inspecting route rules for an internet-gateway target. Three-hop cross-resource traversal is fragile in HCL/plan/state and unsupported by the patterns used elsewhere in this file.
  - uid: mondoo-oci-security-dbsystem-subnet-no-internet-gateway
    title: Ensure DB system subnets have no route to an internet gateway
    impact: 80
    filters: asset.platform == 'oci'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      oci.database.dbSystems.all(
        subnet.routeTable.routes.none(
          destination == "0.0.0.0/0" && internetGateway != null
        )
      )
    docs:
      desc: |
        This check verifies that the subnet hosting a DB system has no default route to an internet gateway, so that a compromised database host has no direct path off the network.

        A route table entry that sends `0.0.0.0/0` to an internet gateway makes every resource in the subnet capable of originating outbound connections to any internet address, and of receiving return traffic on those connections. This is independent of whether the DB system has a public IP: an instance with only a private address still egresses through the gateway if the route exists. Inspect and edit the association under Networking > Virtual Cloud Networks > Route Tables, or with `oci network route-table update`.

        **Why this matters**

        Unrestricted egress is what turns database access into data loss. An attacker with code execution on the host, whether through an unpatched database CVE or stolen operating system credentials, can open a session to any address and stream tablespace contents out at line rate. No inspection point sees the transfer, because there is none between the host and the gateway.

        Ransomware operators depend on that path. Current practice is to exfiltrate before encrypting, so that refusing to pay still costs the victim a disclosure. An open egress route is what converts an availability incident into a confirmed breach with regulatory notification obligations attached.

        Routes outlive the resources that motivated them. An internet gateway route added years ago for a jump host remains in the table after that host is deleted and silently applies to every DB system placed in the subnet afterward, which is why a subnet inherited from another team is worth checking before it is used for a database.

        Hosts do legitimately need outbound access for patch downloads and OCI service calls. Route that traffic through a NAT gateway with flow logs enabled, or through a service gateway for OCI endpoints, so the same functionality exists but every destination is recorded and unusual ones can be alarmed on.
      audit: |
        ### Audit via Console

        1. Open **Oracle Database** → **DB Systems** and select the DB system.
        2. Navigate to **DB System Details** → **Network** and click the linked subnet name.
        3. From the subnet page, locate the **Route Table** and click it to open the route table details.
        4. Review each route rule and check whether any rule has **Destination: 0.0.0.0/0** and **Target Type: Internet Gateway**.

        A passing DB system's subnet has no route rule targeting an internet gateway for the default route. A failing DB system's subnet has a route rule with destination `0.0.0.0/0` pointing to an internet gateway.

        ### Audit via CLI

        1. Retrieve the DB system's subnet ID, then the route table ID, then inspect the route rules:

        ```bash
        # Get DB system subnet
        oci db system get \
          --db-system-id <db-system-ocid> \
          --query 'data.{subnetId:"subnet-id"}'

        # Get the route table for the subnet
        oci network subnet get \
          --subnet-id <subnet-ocid> \
          --query 'data.{routeTableId:"route-table-id"}'

        # Inspect route rules for IGW routes
        oci network route-table get \
          --rt-id <route-table-ocid> \
          --query 'data."route-rules"[?destination==`0.0.0.0/0`].{destination:destination,target:"network-entity-id"}'
        ```

        A passing route table returns no route rules matching `0.0.0.0/0` with an internet gateway target. A failing route table returns one or more rules where the destination is `0.0.0.0/0` and the `network-entity-id` contains `internetgateway`.
      remediation:
        - id: console
          desc: |
            Remove the internet gateway route from the DB subnet:

            1. Open **Networking** → **Virtual Cloud Networks** → the DB subnet's VCN → **Route Tables** → the route table associated with the DB subnet.
            2. Delete any route rule whose **Destination** is `0.0.0.0/0` and whose **Target Type** is **Internet Gateway**.
            3. If egress is required for patching or integrations, replace with a route to a NAT gateway or service gateway.
            4. Verify the DB continues to reach OCI services through the service gateway.
        - id: cli
          desc: |
            **Warning: `--route-rules` replaces the entire existing set of route rules.** Whatever you pass becomes the whole route table, so any rule you omit is deleted, including routes the database depends on. Retrieve the current rules first, remove only the internet-gateway route, then resubmit the rest.

            1. Export the current route rules so you keep every route you still need:

            ```bash
            oci network route-table get --rt-id <route-table-ocid> \
              --query 'data."route-rules"' > route-rules.json
            ```

            2. Edit `route-rules.json`, deleting the rule whose destination is `0.0.0.0/0` and whose target is an internet gateway. Where the database still needs egress, replace it with a NAT or service gateway route such as `{"destination":"all-<region>-services-in-oracle-services-network","destinationType":"SERVICE_CIDR_BLOCK","networkEntityId":"<service-gateway-ocid>"}`. Resubmit the edited file so every route you kept is preserved:

            ```bash
            oci network route-table update \
              --rt-id <route-table-ocid> \
              --route-rules file://route-rules.json
            ```
        # No Terraform remediation: this check requires three-hop cross-resource traversal from `oci_database_db_system` to its subnet to the subnet's route table to inspect individual route rules; this graph walk is fragile in HCL/plan/state and unsupported by the patterns used elsewhere in this file.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingroutetables.htm
        title: OCI - Managing Route Tables
  - uid: mondoo-oci-security-vault-secrets-rotation-enabled
    title: Ensure OCI Vault secrets older than a year have scheduled rotation enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    variants:
      - uid: mondoo-oci-security-vault-secrets-rotation-enabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-vault-secrets-rotation-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vault-secrets-rotation-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vault-secrets-rotation-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that scheduled rotation is enabled on Vault secrets that have already exceeded a one year lifetime, so that no credential remains valid indefinitely.

        OCI Vault can replace a secret's contents on its own cadence rather than waiting for an operator. A rotation configuration names the target system holding the credential, either an Autonomous Database or an OCI Function that performs the change, along with a rotation interval expressed as an ISO 8601 duration. Vault then creates a new secret version, updates the target system, and promotes that version to current. You configure it under Identity & Security > Vault > Secrets in the Console or with `oci vault secret update`, and in Terraform it is a `rotation_config` block with `is_scheduled_rotation_enabled` set to true. The check evaluates active secrets created more than 365 days ago. Because Terraform cannot know how old a secret will be, the Terraform version of this check requires the rotation configuration on every managed secret.

        **Why this matters**

        A secret that has never rotated is only as strong as its weakest moment across its entire history. Any disclosure at any point in those 365 days or more remains a live attack path today, because nothing has invalidated the value.

        That history includes people and systems that are no longer trusted. Employees, contractors, and third-party tools that once read the plaintext keep working access regardless of later IAM changes, and a secret pulled by a compromised CI pipeline or developer laptop stays fully effective even after the compromised host itself is rebuilt.

        Enabling rotation converts an open-ended exposure into a bounded one: a leaked value is useful only until the next rotation window, and every stale copy dies with it. It also forces consuming applications to read the current value from Vault at runtime rather than caching plaintext, which is the habit that quietly defeats rotation.

        Many frameworks additionally mandate a defined rotation interval, and a secret with no schedule cannot demonstrate one.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** → **Vault** and select the vault.
        2. Navigate to **Secrets** and select each active secret.
        3. Under **Secret Details** → **Secret Generation and Rotation**, verify that **Scheduled rotation** is enabled and that a rotation interval is configured.

        A passing secret shows **Scheduled rotation: Enabled** with a defined rotation interval. A failing secret shows rotation disabled or no rotation configuration present.

        ### Audit via CLI

        1. List secrets in the vault and inspect the `is-auto-rotation-enabled` field:

        ```bash
        oci vault secret list \
          --compartment-id <compartment-ocid> \
          --query 'data[?"lifecycle-state"==`ACTIVE`].{id:id,name:"secret-name",rotationEnabled:"rotation-config"."is-scheduled-rotation-enabled",created:"time-created"}'
        ```

        A passing secret returns `"rotationEnabled": true`. A failing secret (that is older than 365 days) returns `"rotationEnabled": false` or `null`.
      remediation:
        - id: console
          desc: |
            Enable scheduled rotation on secrets that have lived for more than a year:

            1. Open **Identity & Security** → **Vault** → the parent vault → **Secrets** → select the secret.
            2. Under **Secret Generation and Rotation**, select **Edit**.
            3. Enable **Auto-Generation** and configure **Scheduled Rotation** with an interval appropriate for the secret (P30D = 30 days for API tokens, P90D for database passwords, etc.).
            4. Provide a rotation target (e.g., database auth function) that Vault invokes on the rotation schedule.
        - id: cli
          desc: |
            Enable scheduled rotation on an existing Vault secret by setting its rotation configuration:

            ```bash
            oci vault secret update \
              --secret-id <secret-ocid> \
              --rotation-config '{"isScheduledRotationEnabled":true,"rotationInterval":"P90D","targetSystemDetails":{"targetSystemType":"FUNCTION","functionId":"<function-ocid>"}}'
            ```
        - id: terraform
          desc: |
            Declare a `rotation_config` block on each Vault secret with `is_scheduled_rotation_enabled = true` and a rotation function target:

            ```hcl
            resource "oci_vault_secret" "db_password" {
              compartment_id = var.compartment_ocid
              vault_id       = oci_kms_vault.app.id
              key_id         = oci_kms_key.app.id
              secret_name    = "db-password"

              secret_content {
                content_type = "BASE64"
                content      = base64encode(var.initial_db_password)
              }

              rotation_config {
                is_scheduled_rotation_enabled = true
                rotation_interval             = "P90D"

                target_system_details {
                  target_system_type = "FUNCTION"
                  function_id        = oci_functions_function.rotate_db_password.id
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/KeyManagement/Tasks/managingsecrets.htm
        title: OCI - Managing Secrets
  - uid: mondoo-oci-security-vault-secrets-rotation-enabled-oci
    filters: |
      asset.platform == "oci-vault-secret" &&
      oci.vault.secret.state == "ACTIVE" &&
      time.now - oci.vault.secret.created > 365 * time.day
    mql: |
      oci.vault.secret.isScheduledRotationEnabled == true
  - uid: mondoo-oci-security-vault-secrets-rotation-enabled-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_vault_secret')
    mql: |
      # Terraform cannot tell whether a secret is older than 365 days, so this stricter variant requires every managed `oci_vault_secret` to declare a rotation_config block with is_scheduled_rotation_enabled = true.
      terraform.resources('oci_vault_secret').all(
        blocks.where(type == 'rotation_config') != empty &&
        blocks.where(type == 'rotation_config').all(
          arguments['is_scheduled_rotation_enabled'] == true
        )
      )
  - uid: mondoo-oci-security-vault-secrets-rotation-enabled-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_vault_secret')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_vault_secret').all(
        change.after['rotation_config'] != null && change.after['rotation_config'].length > 0 &&
        change.after['rotation_config'].all(
          _['is_scheduled_rotation_enabled'] == true
        )
      )
  - uid: mondoo-oci-security-vault-secrets-rotation-enabled-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_vault_secret')
    mql: |
      terraform.state.resources.where(type == 'oci_vault_secret').all(
        values['rotation_config'] != null && values['rotation_config'].length > 0 &&
        values['rotation_config'].all(
          _['is_scheduled_rotation_enabled'] == true
        )
      )
  # No Terraform variants: `timeOfCurrentVersionExpiry` is runtime telemetry on the current secret version; the `oci_vault_secret` Terraform resource has no field that exposes whether the active version is past its expiry time.
  - uid: mondoo-oci-security-vault-secrets-not-expired
    title: Ensure OCI Vault active secret versions are not past their expiry time
    impact: 60
    filters: |
      asset.platform == "oci-vault-secret" &&
      oci.vault.secret.state == "ACTIVE"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-17
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      oci.vault.secret.timeOfCurrentVersionExpiry == null ||
      oci.vault.secret.timeOfCurrentVersionExpiry > time.now
    docs:
      desc: |
        This check verifies that the credential lifetime declared on a Vault secret is being honored, by requiring the current version's expiry timestamp to be unset or still in the future.

        An expiry time is attached to a secret version when that version is created, either in the Console under Identity & Security > Vault > Secrets when you add a version, or through `oci vault secret update` supplying new secret content with an expiry. The timestamp is a statement of intent: after this moment, the version should no longer be the one in use. The check passes an active secret whose current version has no expiry set and fails one whose current version expired in the past.

        **Why this matters**

        An expired version that is still current is direct evidence that the rotation pipeline did not finish. The scheduled rotation function either never ran or failed partway, and every dependent is now authenticating with credential material the organization has already declared out of policy.

        The failure is silent by default. Applications that cached the value keep authenticating successfully and log nothing unusual, so the first visible symptom often arrives only when the downstream system finally rejects the credential and the workload breaks in production.

        Where the expiry was chosen to satisfy a mandated rotation cadence, a past-due version means that interval was not met, and the gap is auditable.

        A version that is expired yet still in active use also tends to expose an incomplete dependency map. It usually means at least one consumer of the secret was never identified when rotation was configured, so the rotation target list is wrong and will fail the same way next cycle.

        Alert on past-expiry secrets rather than waiting for the outage, then fix the rotation target configuration instead of simply extending the expiry, so that what Vault records as the credential lifetime matches what applications actually use.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** → **Vault** and select the vault.
        2. Navigate to **Secrets** and review the list of active secrets.
        3. Select each secret and under **Versions**, check the **Expiry** column for the current version. Verify the expiry date is in the future or that no expiry is set.

        A passing secret has a current version whose expiry is in the future, or has no expiry set. A failing secret has a current version whose expiry date has already passed.

        ### Audit via CLI

        1. List active secrets and inspect the `time-of-current-version-expiry` field:

        ```bash
        oci vault secret list \
          --compartment-id <compartment-ocid> \
          --query 'data[?"lifecycle-state"==`ACTIVE`].{id:id,name:"secret-name",versionExpiry:"time-of-current-version-expiry"}'
        ```

        A passing secret returns `"versionExpiry": null` (no expiry set) or a timestamp in the future. A failing secret returns a `versionExpiry` timestamp that is earlier than the current date and time.
      remediation:
        - id: console
          desc: |
            Investigate and repair expired secret versions:

            1. Open **Identity & Security** → **Vault** → the parent vault → **Secrets** → select the expired secret.
            2. Under **Versions**, confirm which version is current and why its expiry has passed.
            3. Trigger a rotation (either manually or by waiting for the scheduled rotation function to run).
            4. Verify consumers pick up the new version; update downstream systems that cache the old version.
        - id: cli
          desc: |
            Rotate an expired Vault secret:

            ```bash
            oci vault secret rotate --secret-id <secret-ocid>
            ```
        # No Terraform remediation: `timeOfCurrentVersionExpiry` is runtime telemetry on the active secret version; the `oci_vault_secret` Terraform resource has no field that exposes whether the current version is past its expiry, and there is no HCL change that resolves an expired version.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/KeyManagement/Tasks/rotatingsecrets.htm
        title: OCI - Rotating Secrets
  - uid: mondoo-oci-security-functions-config-no-credentials
    title: Ensure OCI Functions applications do not store credentials in config
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ds-5
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    variants:
      - uid: mondoo-oci-security-functions-config-no-credentials-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-functions-config-no-credentials-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-functions-config-no-credentials-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-functions-config-no-credentials-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that OCI Functions applications hold no credentials in their configuration map, neither under a credential-shaped key name nor as a credential-shaped value.

        An application's config map is a set of key-value pairs that OCI Functions injects as environment variables into every function in the application. The check rejects key names such as `password`, `db_password`, `aws_access_key_id`, `aws_secret_access_key`, `aws_session_token`, `oci_api_key`, `api_token`, `bearer_token`, `private_key`, `client_secret`, and `connection_string`, and it separately inspects the values for AWS access key IDs, PEM private key blocks that open with `-----BEGIN` and close with `PRIVATE KEY-----`, and JSON Web Tokens. Review the map under Developer Services > Functions on the application's configuration page, or with `oci fn application update --config`.

        **Why this matters**

        The config map is not a secret store. `GetApplication` returns the whole map to any principal holding `functions-application:read`, which a statement as ordinary as `allow group Developers to read fn-app in compartment Apps` confers. The audience for anything written there is everyone with read access to the compartment, not just the people who maintain the function.

        The scope is wrong in the other direction too. Application config is inherited by every function in the application, so a credential added for one function is handed to all of them, including functions that have no business holding it and functions added later by someone who never saw it go in.

        Values placed there also escape the config map. Environment variables are captured by observability backends, logging pipelines, and Terraform state, which extends a secret's lifetime and reach well past the moment it is deleted from the application. And unlike a managed secret, a config value has no rotation lifecycle and no access log recording who read it.

        OCI Vault exists for exactly this: a function should fetch its credentials at runtime using its resource principal, which is audited, rotatable, and scoped to the one function that needs it. Anything this check finds should be treated as already compromised and rotated before it is removed, since it has been readable all along. Non-secret settings such as endpoints, timeouts, and feature flags are what the config map is for and are not what the check objects to.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Developer Services** > **Functions** > **Applications**.
        2. For each application, select it and open **Configuration**.
        3. Review all key-value pairs in the configuration map. Look for keys named `password`, `secret`, `api_token`, `bearer_token`, `private_key`, `db_password`, `connection_string`, `access_key`, or similar credential-sounding names. Look for values that resemble AWS access key IDs (`AKIA...`), PEM private key blocks (`-----BEGIN ... PRIVATE KEY-----`), or JWT tokens (three base64url segments separated by dots starting with `eyJ`).

        A passing application shows a configuration map with no credential-named keys and no credential-shaped values. A failing application shows one or more keys or values matching the patterns above.

        ### Audit via CLI

        1. List all Functions applications and retrieve their configuration:

        ```bash
        oci fn application list --compartment-id <compartment-ocid> --all \
          --query 'data[].{Name:"display-name", OCID:id}' --output table
        ```

        2. For each application, retrieve its configuration:

        ```bash
        oci fn application get --application-id <application-ocid> \
          --query 'data.config' --output json
        ```

        A passing application returns a configuration map with no credential-named keys and no credential-shaped values. A failing application returns one or more keys or values that match known credential patterns.
      remediation:
        - id: console
          desc: |
            Move credentials out of Functions application config:

            1. Rotate any credentials found in `config` immediately — assume they are compromised.
            2. Open **Developer Services** → **Functions** → the application → **Configuration**.
            3. Remove the credential key-value pair.
            4. In the function code, fetch the secret from Vault at startup using the function's resource principal:
               ```python
               import oci
               signer = oci.auth.signers.get_resource_principals_signer()
               vault = oci.vault.VaultsClient(config={}, signer=signer)
               ```
        - id: cli
          desc: |
            Remove credential entries from a Functions application config. The `--config` parameter replaces the entire map, so retrieve the current config first and resubmit every key you intend to keep, omitting only the credential entries:

            ```bash
            oci fn application get --application-id <app-ocid> --query 'data.config'

            oci fn application update --application-id <app-ocid> \
              --config '{"DB_PASSWORD_SECRET_OCID":"ocid1.vaultsecret.oc1..example","LOG_LEVEL":"info"}'
            ```
        - id: terraform
          desc: |
            Keep the Functions application `config` map free of credential-named keys and credential-shaped values; reference Vault secret OCIDs and let function code resolve them at runtime via the resource principal:

            ```hcl
            resource "oci_functions_application" "app" {
              compartment_id = var.compartment_ocid
              display_name   = "app"
              subnet_ids     = [oci_core_subnet.private.id]

              config = {
                # Do NOT place credentials here. Reference the Vault secret OCID instead:
                DB_PASSWORD_SECRET_OCID = oci_vault_secret.db_password.id
                LOG_LEVEL               = "info"
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Functions/Tasks/functionsusingconfigparams.htm
        title: OCI - Passing Custom Configuration Parameters to Functions
      - url: https://docs.oracle.com/en-us/iaas/Content/Functions/Tasks/functionsaccessingociresources.htm
        title: OCI - Accessing OCI Resources from Running Functions
