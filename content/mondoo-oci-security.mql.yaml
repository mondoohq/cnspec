      - uid: mondoo-oci-security-vcn-no-unrestricted-rdp-ingress-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that Windows remote desktop access is not exposed to the whole internet.

        The check rejects TCP ingress, protocol number `6`, from source `0.0.0.0/0` whose destination port range covers 3389, and equally a rule that specifies no port range, since that covers 3389 as well. Because a security list governs the entire subnet, the rule reaches every Windows instance placed in it. Rules are edited on the security list details page under Networking > Virtual Cloud Networks, or with `oci network security-list update`.

        **Why this matters**

        Internet-facing RDP is the single most common entry point in ransomware intrusions. An access broker buys or brute forces a valid Windows account, sells the foothold, and the buyer moves laterally through the domain before deploying an encryption payload, so the port exposure and the ransom note can be weeks apart.

        The preauthentication surface is the other half of the problem. BlueKeep and DejaBlue were remote code execution flaws in the RDP stack itself that required no credentials at all, and both were exploited in the wild against internet-exposed endpoints. A rule opening 3389 to `0.0.0.0/0` makes every future bug of that class immediately reachable.

        Windows accounts on a public 3389 also absorb continuous brute force with no rate limiting anywhere in the network path. Account lockout policies that protect an on-premises domain then work against you, handing an attacker a denial of service against your own administrators.

        Limit the source to the CIDR blocks of a corporate VPN or management subnet, or run sessions through the OCI Bastion service so 3389 never faces the internet. Require Network Level Authentication, or NLA, on every Windows instance so unauthenticated connection attempts are rejected before a session is established, and keep it in place after the rule is tightened.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Virtual Cloud Networks**.
        2. Select the VCN you want to inspect.
        3. Select **Security Lists** from the left-hand resources menu.
        4. For each security list, select it and review the **Ingress Rules** tab.
        5. Look for any rule where the **Source** is `0.0.0.0/0`, the **Protocol** is TCP, and the **Destination Port Range** includes port 3389.

        A passing security list has no ingress rule allowing TCP port 3389 from `0.0.0.0/0`. A failing security list has at least one such rule.

        ### Audit via CLI

        1. List all security lists in the VCN:

        ```bash
        oci network security-list list --compartment-id <compartment-ocid> --vcn-id <vcn-ocid> --all --query 'data[*].{id: id, name: "display-name", ingress: "ingress-security-rules"[?source==`0.0.0.0/0` && protocol==`6`]}'
        ```

        2. For any returned security list, inspect whether the ingress rules for `0.0.0.0/0` TCP cover port 3389:

        ```bash
        oci network security-list get --security-list-id <security-list-ocid> --query 'data."ingress-security-rules"[?source==`0.0.0.0/0` && protocol==`6`]'
        ```

        A passing security list returns no rules that include port 3389 in the destination port range from `0.0.0.0/0`. A failing security list returns one or more rules where the destination port range covers port 3389.
      remediation:
        - id: console
          desc: |
            To restrict RDP ingress in a VCN security list using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list with the RDP rule.
            5. Edit the TCP ingress rule for port 3389 from 0.0.0.0/0 to use a specific trusted source CIDR block.
        - id: cli
          desc: |
            To restrict RDP ingress in a VCN security list using the OCI CLI, narrow the source CIDR on the port 3389 rule.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the offending rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id <security-list-ocid> \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json`, changing the source on the port 3389 rule from `0.0.0.0/0` to a trusted CIDR such as `{"source":"10.0.0.0/24","protocol":"6","tcpOptions":{"destinationPortRange":{"min":3389,"max":3389}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id <security-list-ocid> \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            To restrict RDP ingress in a VCN security list in Terraform, specify a trusted source CIDR instead of 0.0.0.0/0:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              ingress_security_rules {
                protocol  = "6" # TCP
                source    = "10.0.0.0/24" # Management subnet only
                stateless = false

                tcp_options {
                  min = 3389
                  max = 3389
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: CIS OCI Foundations Benchmark 2.4
