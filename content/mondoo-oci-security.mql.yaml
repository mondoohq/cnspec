      - uid: mondoo-oci-security-certificates-strong-signature-algorithms-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every active certificate in the OCI Certificates service is signed with a SHA-2 family algorithm: `SHA256_WITH_RSA`, `SHA384_WITH_RSA`, `SHA512_WITH_RSA`, `SHA256_WITH_ECDSA`, `SHA384_WITH_ECDSA`, or `SHA512_WITH_ECDSA`.

        The signature algorithm is what binds a certificate's contents to the authority that issued it. For certificates OCI issues, the algorithm is part of the certificate configuration you supply. For imported certificates it is whatever the external authority used, and the service enforces no signature-algorithm gate at import, so a deprecated SHA-1 or MD5 signature can enter the inventory without warning. Set or review the algorithm under Identity & Security > Certificates in the Console or with `oci certs-mgmt certificate update`.

        **Why this matters**

        SHA-1 collisions have been publicly demonstrated since 2017 and have only grown cheaper. The consequence is concrete: an attacker with sufficient resources can obtain a signature over benign content and transplant it onto a certificate naming a service they do not own, producing something that chains to a legitimate authority and defeats the identity assurance the certificate exists to provide.

        MD5 was retired even earlier and is worse. Collisions against it are computable on ordinary hardware, so a certificate still signed with MD5 is best treated as a forgery primitive rather than a credential.

        Weak signatures survive because browsers are not the only relying party. Public clients stopped accepting SHA-1 years ago, but internally issued certificates are frequently still honored by scripts, agents, and legacy services that never had a policy engine to update. Those trust paths are exploitable and invisible in routine monitoring, precisely because nothing complains about them.

        Reissuing under a SHA-2 algorithm keeps the inventory aligned with NIST SP 800-131A guidance on retired hash functions, and it is usually a configuration change rather than a migration, because the subject key itself does not have to change.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** in the OCI Console and navigate to **Certificates** -> **Certificates**.
        2. Select each active certificate and open its details page.
        3. In the **Certificate information** section, locate the **Signature algorithm** field.
        4. Verify the value is one of: `SHA256_WITH_RSA`, `SHA384_WITH_RSA`, `SHA512_WITH_RSA`, `SHA256_WITH_ECDSA`, `SHA384_WITH_ECDSA`, or `SHA512_WITH_ECDSA`.

        A passing certificate shows a SHA-2 family signature algorithm. A failing certificate shows a deprecated algorithm such as `SHA1_WITH_RSA`.

        ### Audit via CLI

        1. List active certificates and retrieve the signature algorithm for each:

        ```bash
        oci certs-mgmt certificate list \
          --compartment-id <compartment-ocid> \
          --lifecycle-state ACTIVE \
          --query 'data.items[*].{name:name, signatureAlgorithm:"signature-algorithm"}' \
          --output table
        ```

        A passing certificate returns a `signatureAlgorithm` value in the SHA-2 family (`SHA256_WITH_RSA`, `SHA384_WITH_RSA`, `SHA512_WITH_RSA`, `SHA256_WITH_ECDSA`, `SHA384_WITH_ECDSA`, or `SHA512_WITH_ECDSA`). A failing certificate returns a value outside that set.
      remediation:
        - id: console
          desc: |
            Re-issue certificates with weak signatures using a SHA-2 algorithm:

            1. Open **Identity & Security** → **Certificates** → **Certificates** → identify certificates with weak signature algorithms.
            2. For internally-issued certificates, choose **Issue New Version** and pick a `SHA256_WITH_*`, `SHA384_WITH_*`, or `SHA512_WITH_*` signature algorithm.
            3. For imported certificates, re-issue them externally using a SHA-2 signature and re-import.
        - id: cli
          desc: |
            Signature algorithms cannot be changed on an existing certificate. Issue a replacement internally-issued certificate with a SHA-2 signature algorithm and migrate consumers:

            ```bash
            oci certs-mgmt certificate create-certificate-issued-by-internal-ca \
              --compartment-id <compartment-ocid> \
              --name app-tls-cert-v2 \
              --issuer-certificate-authority-id <ca-ocid> \
              --key-algorithm RSA2048 \
              --signature-algorithm SHA256_WITH_RSA \
              --subject '{"commonName":"app.example.com"}' \
              --validity '{"timeOfValidityNotAfter":"2027-01-01T00:00:00Z"}'
            ```
        - id: terraform
          desc: |
            This Terraform fix applies only to internally-issued certificates. Imported certificates have no `signature_algorithm` argument in HCL because they are signed outside OCI, so a weak imported certificate must be re-issued externally with a strong signature algorithm and re-imported.

            Set `certificate_config.signature_algorithm` to a SHA-2 value on every internally-issued certificate:

            ```hcl
            resource "oci_certificates_management_certificate" "app" {
              compartment_id = var.compartment_ocid
              name           = "app-tls-cert"

              certificate_config {
                config_type                  = "ISSUED_BY_INTERNAL_CA"
                issuer_certificate_authority_id = oci_certificates_management_certificate_authority.internal.id
                key_algorithm                = "RSA2048"
                signature_algorithm          = "SHA256_WITH_RSA"

                subject {
                  common_name = "app.example.com"
                }

                validity {
                  time_of_validity_not_after = "2027-01-01T00:00:00Z"
                }
              }
            }
            ```
