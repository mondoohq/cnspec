    variants:
      - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that object-level event emission is enabled on Object Storage buckets, so that changes to stored data produce records another service can act on.

        When object events are on, the bucket publishes a message to the OCI Events service every time an object is created, updated, or deleted, using the event types `com.oraclecloud.objectstorage.createobject`, `com.oraclecloud.objectstorage.updateobject`, and `com.oraclecloud.objectstorage.deleteobject`. New buckets have emission turned off, so nothing is published until it is switched on with the Emit Object Events setting on the bucket detail page or with `oci os bucket update --namespace <namespace> --name <bucket> --object-events-enabled true`.

        **Why this matters**

        Without object events the data plane is silent. The Audit service records the control-plane call that created or reconfigured the bucket, but not the objects written into it, so an attacker holding valid credentials can stage, modify, and remove objects without generating a single reviewable record. That is a blind spot precisely where the data lives.

        Events are also the input to automated response rather than just a log to read later. An Events rule can route matches to Notifications, Functions, or Streaming, and Service Connector Hub can forward them onward to a SIEM, so a burst of deletes against a backup bucket raises an alert while the incident is still in progress instead of surfacing in the next quarterly review. Many regulatory frameworks require demonstrating that access to sensitive data is logged, and these per-operation records are what satisfies that requirement.

        Object events cover writes, not reads. If you also need to know who downloaded an object, enable Object Storage read access logs through the Logging service alongside this setting. Retain both for a period consistent with your regulatory retention requirements so an investigation has history to work with, and turn emission on for every bucket that holds sensitive or regulated data rather than only the ones currently in an audit's scope.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Object Storage > Buckets**.
        3. Select each bucket to open its details page.
        4. Locate the **Object Events** field in the bucket details.

        A passing bucket shows **Object Events: Enabled**. A failing bucket shows **Object Events: Disabled**.

        ### Audit via CLI

        1. Retrieve event logging status for a bucket:

        ```bash
        oci os bucket get --bucket-name <BUCKET_NAME> --query "data.{Name:name, EventsEnabled:\"object-events-enabled\"}" --output table
        ```

        A passing bucket returns `true` in the `EventsEnabled` field. A failing bucket returns `false`.
      remediation:
        - id: console
          desc: |
            To enable object event logging on an Object Storage bucket using the OCI Console:

            1. Navigate to **Object Storage > Buckets**.
            2. Select the bucket identified in this finding.
            3. Select **Edit**.
            4. Enable **Emit Object Events**.
            5. Select **Save Changes**.
        - id: cli
          desc: |
            To enable object event logging on an Object Storage bucket using the OCI CLI, update the bucket's event setting:

            ```bash
            oci os bucket update --bucket-name BUCKET_NAME --object-events-enabled true
            ```
        - id: terraform
          desc: |
            To enable object event logging on an Object Storage bucket in Terraform, set the `object_events_enabled` attribute to `true`:

            ```hcl
            resource "oci_objectstorage_bucket" "example" {
              compartment_id        = var.compartment_ocid
              namespace             = var.namespace
              name                  = "example-bucket"
              object_events_enabled = true
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/managingbuckets.htm
        title: OCI Object Storage events documentation
  - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-oci
    filters: asset.platform == "oci-objectstorage-bucket"
    mql: |
      oci.objectStorage.bucket.objectEventsEnabled == true
  - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_objectstorage_bucket")
    mql: |
      terraform.resources("oci_objectstorage_bucket").all(
        arguments.object_events_enabled == true
      )
  - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_objectstorage_bucket").all(
        change.after.object_events_enabled == true
      )
  - uid: mondoo-oci-security-object-storage-buckets-event-logging-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.state.resources.where(type == "oci_objectstorage_bucket").all(
        values.object_events_enabled == true
      )
  - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption
    title: Ensure Object Storage buckets use customer-managed encryption keys
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    variants:
      - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Object Storage buckets encrypt data with a customer-managed key held in OCI Vault rather than the default Oracle-managed key.

        All Object Storage data is encrypted at rest regardless of this setting, so the exposure here is not missing encryption but missing control over the key lifecycle. Assigning a Vault master encryption key to a bucket puts key creation, rotation, disabling, and deletion in your hands. Assign one in the Console through the bucket's Encryption Key setting or with `oci os bucket update --namespace <namespace> --name <bucket> --kms-key-id <key_ocid>`, and grant the service access to it first with a policy statement of the form `allow service objectstorage-<region> to use keys in compartment <compartment>`.

        **Why this matters**

        A customer-managed key gives you a revocation switch. Disabling or scheduling deletion of the key in Vault renders every object encrypted under it unreadable immediately, which is the only fast containment move available when a bucket's contents must be denied to an attacker. An Oracle-managed key offers no such control.

        Holding the key in a vault you control separates key management from data management. The people who administer buckets and the people who administer keys can be different groups with different policies and separate audit trails, so compromising one role does not automatically yield plaintext.

        HIPAA, PCI DSS, and FedRAMP all expect an organization to demonstrate control over the keys protecting regulated data, and an Oracle-managed key cannot satisfy that evidence requirement because you cannot show who used it or withdraw it.

        Provision the vault and master encryption key before the bucket is created, since assigning a key later applies to newly written objects while existing objects stay encrypted under the previous key until they are rewritten. Set a rotation policy on each key to bound the exposure window if one is ever compromised, and review Audit logs for key operations so unexpected use or an unauthorized key management change is noticed.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Object Storage > Buckets**.
        3. Select each bucket to open its details page.
        4. Locate the **Encryption Key** section.
        5. Verify that a customer-managed key from OCI Vault is assigned.

        A passing bucket shows a customer-managed KMS key OCID in the **Encryption Key** field. A failing bucket shows **Oracle-managed encryption** or an empty encryption key field.

        ### Audit via CLI

        1. Retrieve the KMS key assignment for a bucket:

        ```bash
        oci os bucket get --bucket-name <BUCKET_NAME> --query "data.{Name:name, KmsKeyId:\"kms-key-id\"}" --output table
        ```

        A passing bucket returns a non-empty OCID in the `KmsKeyId` field. A failing bucket returns `null` or an empty value.
      remediation:
        - id: console
          desc: |
            To assign a customer-managed encryption key to an Object Storage bucket using the OCI Console:

            1. Navigate to **Object Storage > Buckets**.
            2. Select the bucket identified in this finding.
            3. Select **Assign** next to Encryption Key.
            4. Choose **Encrypt using customer-managed keys**.
            5. Select the vault, master encryption key, and key version.
            6. Select **Assign**.
        - id: cli
          desc: |
            To assign a customer-managed encryption key to an Object Storage bucket using the OCI CLI, update the bucket with the KMS key OCID:

            ```bash
            oci os bucket update --bucket-name BUCKET_NAME --kms-key-id KEY_OCID
            ```
        - id: terraform
          desc: |
            To assign a customer-managed encryption key to an Object Storage bucket in Terraform, create a vault and key, then reference the key in the bucket resource:

            ```hcl
            resource "oci_kms_vault" "example" {
              compartment_id = var.compartment_ocid
              display_name   = "example-vault"
              vault_type     = "DEFAULT"
            }

            resource "oci_kms_key" "example" {
              compartment_id = var.compartment_ocid
              display_name   = "example-bucket-key"
              management_endpoint = oci_kms_vault.example.management_endpoint

              key_shape {
                algorithm = "AES"
                length    = 32
              }
            }

            resource "oci_objectstorage_bucket" "example" {
              compartment_id = var.compartment_ocid
              namespace      = var.namespace
              name           = "example-bucket"
              kms_key_id     = oci_kms_key.example.id
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/managingbuckets_topic-Server_Side_Encryption_SSE.htm
        title: CIS OCI Foundations Benchmark 4.1.2
  - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-oci
    filters: asset.platform == "oci-objectstorage-bucket"
    mql: |
      oci.objectStorage.bucket.kmsKeyId != ""
  - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_objectstorage_bucket")
    mql: |
      terraform.resources("oci_objectstorage_bucket").all(
        arguments.kms_key_id != empty
      )
  - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_objectstorage_bucket").all(
        change.after.kms_key_id != empty
      )
  - uid: mondoo-oci-security-object-storage-buckets-customer-managed-encryption-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_objectstorage_bucket")
    mql: |
      terraform.state.resources.where(type == "oci_objectstorage_bucket").all(
        values.kms_key_id != empty
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols
    title: Ensure VCN security lists block unrestricted ingress from 0.0.0.0/0
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no VCN security list admits every network protocol from the public internet.

        A security list is the subnet-level firewall of an OCI Virtual Cloud Network, and every VNIC placed in the subnet inherits its rules. An ingress rule that pairs `protocol: all` with `source: 0.0.0.0/0` and a `sourceType` of `CIDR_BLOCK` matches TCP, UDP, ICMP and every other IP protocol in a single line, so the subnet boundary stops filtering anything inbound. The check requires that no rule combines those two values. Rules live under Networking > Virtual Cloud Networks > Security Lists in the Console and are edited with `oci network security-list update`.

        **Why this matters**

        All ports and all protocols on every instance in the affected subnet become reachable from any host on the internet, which removes the network layer from the defense stack entirely. Host firewalls and application authentication are then the only barriers left, and they are the layers most likely to be incomplete on a freshly provisioned image.

        Automated scanners sweep published cloud address ranges continuously. An all-protocols rule guarantees that every service listening on any instance in the subnet is enumerated, catalogued and targeted, including services the team had forgotten were running.

        The damage does not stop at the perimeter. Once one instance in the subnet is compromised, the same rule lets the attacker reach its neighbors directly over non-standard protocols such as GRE or ESP that no port-based control would have anticipated.

        Replace the rule with ingress rules that name the protocol number and the destination port range each workload actually needs, and narrow the source to the CIDR blocks that legitimately originate that traffic. Where instances in one subnet need different exposure, attach network security groups to their VNICs so access is decided per instance rather than for the whole subnet at once. An NSG is the instance-level companion to a security list and applies alongside it, adding a second layer rather than replacing the first.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Networking > Virtual Cloud Networks**.
        3. Select each VCN.
        4. Select **Security Lists** from the left menu.
        5. For each security list, select it and review the **Ingress Rules** tab.
        6. Check whether any rule has **Source: 0.0.0.0/0** and **IP Protocol: All Protocols**.

        A passing security list has no ingress rule with source `0.0.0.0/0` and protocol `All`. A failing security list contains at least one such rule.

        ### Audit via CLI

        1. List ingress rules for a security list and inspect for unrestricted all-protocol rules:

        ```bash
        oci network security-list get --security-list-id <SECURITY_LIST_OCID> --query "data.{Name:\"display-name\", IngressRules:\"ingress-security-rules\"}" --output json
        ```

        A passing security list returns no ingress rule with `"source": "0.0.0.0/0"` and `"protocol": "all"`. A failing security list returns one or more such rules.
      remediation:
        - id: console
          desc: |
            To restrict unrestricted ingress rules in a VCN security list using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list with the overly permissive rule.
            5. Edit or remove the ingress rule that allows all protocols from 0.0.0.0/0, replacing it with rules for specific protocols, ports, and trusted source CIDR blocks.
        - id: cli
          desc: |
            To restrict unrestricted ingress rules in a VCN security list using the OCI CLI, update the security list with scoped rules that specify protocols, ports, and trusted source CIDR blocks.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the all-protocols rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id SECURITY_LIST_OCID \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json`, replacing the all-protocols rule from `0.0.0.0/0` with scoped rules such as `{"source":"10.0.0.0/16","protocol":"6","tcpOptions":{"destinationPortRange":{"min":443,"max":443}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id SECURITY_LIST_OCID \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            To restrict unrestricted ingress in a VCN security list in Terraform, define ingress rules with specific protocols, port ranges, and restricted source CIDR blocks instead of allowing all traffic from 0.0.0.0/0:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              ingress_security_rules {
                protocol  = "6" # TCP
                source    = "10.0.0.0/16"
                stateless = false

                tcp_options {
                  min = 443
                  max = 443
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: CIS OCI Foundations Benchmark 2.1
  - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-oci
    filters: asset.platform == "oci-network-securitylist"
    mql: |
      oci.network.securityList.ingressRules.none(
        source == "0.0.0.0/0" && protocol == "all"
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_core_security_list")
    mql: |
      terraform.resources("oci_core_security_list").all(
        blocks.where(type == "ingress_security_rules").none(arguments.source == "0.0.0.0/0" && arguments.protocol == "all")
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_core_security_list")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_core_security_list").all(
        change.after.ingress_security_rules.none(_['source'] == "0.0.0.0/0" && _['protocol'] == "all")
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-protocols-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_core_security_list")
    mql: |
      terraform.state.resources.where(type == "oci_core_security_list").all(
        values.ingress_security_rules.none(_['source'] == "0.0.0.0/0" && _['protocol'] == "all")
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-tcp-ports
    title: Ensure VCN security lists block unrestricted TCP ingress
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-tcp-ports-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-tcp-ports-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-tcp-ports-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-ingress-all-tcp-ports-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every TCP ingress rule accepting traffic from the public internet is scoped to a destination port range.

        An OCI security list rule names its protocol by IANA number, so TCP is `6`, and the destination port range lives in an optional `tcpOptions` block, written `tcp_options` in Terraform. Omitting that block is not a neutral default. A rule with protocol `6`, source `0.0.0.0/0` and no `tcpOptions` opens all 65535 TCP ports on every instance in the subnet. The port range is set in the rule editor on the security list details page in the Console, or in the ingress rules payload passed to `oci network security-list update`.

        **Why this matters**

        Portless rules are usually written by accident. An operator opens a web tier, leaves the port fields blank in the Console form, and ships a rule that also exposes SSH on 22, RDP on 3389, and whatever database listener the application happens to run alongside it.

        Management ports are found first. Credential brute force and known-vulnerability scanning begin against 22 and 3389 within minutes of the instance answering on a public address, and neither the security list nor the subnet applies any rate limiting to the attempts.

        An open database or application port also gives an attacker who already holds a foothold a clean route back out. Data leaves over an ordinary TCP session to a port the rule permits, with no further network control to circumvent and nothing anomalous about the connection itself.

        Give every internet-facing TCP ingress rule explicit minimum and maximum port values covering only the service ports required, and keep management ports restricted to administrative CIDR blocks whether or not the range is scoped. Sweeping existing security lists for TCP rules that carry no port options is the fastest way to find the ones already deployed.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Networking > Virtual Cloud Networks**.
        3. Select each VCN.
        4. Select **Security Lists** from the left menu.
        5. For each security list, select it and review the **Ingress Rules** tab.
        6. Check for any TCP ingress rule with **Source: 0.0.0.0/0** that has no destination port range specified.

        A passing security list has no TCP ingress rule from `0.0.0.0/0` that omits destination port restrictions. A failing security list has a TCP rule from `0.0.0.0/0` with no port range, allowing all TCP ports.

        ### Audit via CLI

        1. List ingress rules for a security list and check for TCP rules without port ranges:

        ```bash
        oci network security-list get --security-list-id <SECURITY_LIST_OCID> --query "data.{Name:\"display-name\", IngressRules:\"ingress-security-rules\"}" --output json
        ```

        A passing security list returns no TCP ingress rule with `"source": "0.0.0.0/0"` that has a `null` or missing `tcp-options` field. A failing security list returns one or more TCP rules from `0.0.0.0/0` with no `tcp-options` defined.
      remediation:
        - id: console
          desc: |
            To restrict unrestricted TCP ingress rules in a VCN security list using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list.
            5. Edit TCP ingress rules from 0.0.0.0/0 to specify destination port ranges, allowing only the ports required for your workload.
        - id: cli
          desc: |
            To restrict unrestricted TCP ingress rules in a VCN security list using the OCI CLI, update the security list with rules that include specific port ranges.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the unrestricted TCP rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id SECURITY_LIST_OCID \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json` so every `0.0.0.0/0` TCP rule carries an explicit `tcpOptions` port range, such as `{"source":"0.0.0.0/0","protocol":"6","tcpOptions":{"destinationPortRange":{"min":443,"max":443}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id SECURITY_LIST_OCID \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            To restrict unrestricted TCP ingress in a VCN security list in Terraform, always specify `tcp_options` with explicit port ranges:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              ingress_security_rules {
                protocol  = "6" # TCP
                source    = "0.0.0.0/0"
                stateless = false

                tcp_options {
                  min = 443
                  max = 443
                }
              }

              ingress_security_rules {
                protocol  = "6" # TCP
                source    = "10.0.0.0/16"
                stateless = false

                tcp_options {
                  min = 22
                  max = 22
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: CIS OCI Foundations Benchmark 2.2
