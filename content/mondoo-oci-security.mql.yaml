  - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports
    title: Ensure VCN security lists block unrestricted TCP egress
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that outbound TCP to the internet is limited to the destination ports a workload actually needs.

        An egress rule with protocol `6`, destination `0.0.0.0/0`, a `destinationType` of `CIDR_BLOCK` and no `tcpOptions` block lets an instance open a TCP connection to any port on any host on the internet. Most workloads need `443` and very little else, so the check requires a destination port range on any TCP egress rule aimed at the whole internet. Egress rules are edited on the security list details page in the Console or with `oci network security-list update`.

        **Why this matters**

        Post-exploitation tooling depends on outbound TCP. The initial foothold is usually small, and the operator's next move is to pull down the real toolkit, a backdoor or a ransomware payload from a staging host. A port-scoped egress rule breaks that step; an unscoped one funds it.

        Command and control follows the same path in reverse. Implants prefer high-numbered or unusual ports precisely because inspection tends to be weakest there, and a rule that allows every port makes an outbound session on 8443 or 4444 indistinguishable at the network layer from a legitimate API call.

        Exfiltration then needs no cleverness at all. A compromised instance with unrestricted outbound TCP writes data straight to a listener the attacker controls, with no egress control between the process and the internet to record or interrupt it. Regulatory frameworks that require egress filtering exist for exactly this case, and an unscoped rule will not satisfy them.

        Give each TCP egress rule the ports its workload needs, typically `443` for HTTPS, and restrict the destination CIDR wherever the set of external endpoints is known. Route the remainder through a NAT gateway with an egress policy, and enable VCN flow logs so unexpected outbound connections stay visible after the rules are tightened.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Virtual Cloud Networks**.
        2. Select the VCN you want to inspect.
        3. Select **Security Lists** from the left-hand resources menu.
        4. For each security list, select it and review the **Egress Rules** tab.
        5. Look for any rule where the **Destination** is `0.0.0.0/0`, the **Protocol** is TCP, and no destination port range is specified (all TCP ports allowed).

        A passing security list has no TCP egress rule to `0.0.0.0/0` without an explicit destination port range. A failing security list has at least one TCP egress rule to `0.0.0.0/0` with no port restriction.

        ### Audit via CLI

        1. Retrieve all egress rules for a security list and filter for unrestricted TCP egress:

        ```bash
        oci network security-list get --security-list-id <security-list-ocid> --query 'data."egress-security-rules"[?destination==`0.0.0.0/0` && protocol==`6`]'
        ```

        A passing security list returns no results, or returns only TCP egress rules that include a `tcp-options` block with an explicit destination port range. A failing security list returns one or more TCP egress rules to `0.0.0.0/0` where `tcp-options` is absent (all TCP ports allowed).
      remediation:
        - id: console
          desc: |
            To restrict unrestricted TCP egress rules in a VCN security list using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list.
            5. Edit TCP egress rules to 0.0.0.0/0 to specify destination port ranges, allowing only the ports required for your workload (e.g., 443 for HTTPS).
        - id: cli
          desc: |
            To restrict unrestricted TCP egress rules in a VCN security list using the OCI CLI, update the security list with rules that include specific port ranges.

            **Warning: `--egress-security-rules` replaces the COMPLETE set of egress rules.** Whatever you pass becomes the entire egress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the unrestricted TCP rule, then resubmit the full list.

            1. Export the current egress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id SECURITY_LIST_OCID \
              --query 'data."egress-security-rules"' > egress-rules.json
            ```

            2. Edit `egress-rules.json` so every `0.0.0.0/0` TCP rule carries an explicit `tcpOptions` port range, such as `{"destination":"0.0.0.0/0","protocol":"6","tcpOptions":{"destinationPortRange":{"min":443,"max":443}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id SECURITY_LIST_OCID \
              --egress-security-rules file://egress-rules.json
            ```
        - id: terraform
          desc: |
            To restrict unrestricted TCP egress in a VCN security list in Terraform, always specify `tcp_options` with explicit port ranges:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              egress_security_rules {
                protocol    = "6" # TCP
                destination = "0.0.0.0/0"
                stateless   = false

                tcp_options {
                  min = 443
                  max = 443
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: OCI security list documentation
  - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-oci
    filters: asset.platform == "oci-network-securitylist"
    mql: |
      oci.network.securityList.egressRules.where(
        destination == "0.0.0.0/0" && protocol == "6"
      ).none(destinationPortMin == null)
  - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_core_security_list")
    mql: |
      terraform.resources("oci_core_security_list").all(
        blocks.where(type == "egress_security_rules" && arguments.destination == "0.0.0.0/0" && arguments.protocol == "6").all(
          blocks.where(type == "tcp_options") != empty
        )
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_core_security_list")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_core_security_list").all(
        change.after.egress_security_rules.where(_['destination'] == "0.0.0.0/0" && _['protocol'] == "6").none(_['tcp_options'] == empty)
      )
  - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-tcp-ports-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_core_security_list")
    mql: |
      terraform.state.resources.where(type == "oci_core_security_list").all(
        values.egress_security_rules.where(_['destination'] == "0.0.0.0/0" && _['protocol'] == "6").none(_['tcp_options'] == empty)
      )
  - uid: mondoo-oci-security-compute-instance-tagging
    title: Ensure compute instances have freeform tags applied
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dcs-06
      compliance/dora: dora-art-8
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-9
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-id-am-1
      compliance/nist-csf-2: nist-csf-2-id-am-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-1
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-1
      compliance/vda-isa-5: vda-isa-5-1-3-1
    variants:
      - uid: mondoo-oci-security-compute-instance-tagging-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-compute-instance-tagging-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-instance-tagging-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-instance-tagging-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every running compute instance carries resource attribution metadata in the form of at least one freeform tag.

        Freeform tags are unstructured key and value labels that any user with write access to the instance can apply, unlike defined tags, which are drawn from a tag namespace and can be pushed onto new resources through compartment tag defaults. Instances launch with an empty freeform tag map unless the launch request supplies one. You add them under Compute > Instances > Add tags in the Console, with `oci compute instance update --instance-id <id> --freeform-tags`, or through the `freeform_tags` argument in Terraform. The check requires the map to be non-empty on every instance in the running state.

        **Why this matters**

        Without tags, an instance cannot be tied to a team, project, cost center, or environment, so cloud spending cannot be allocated accurately and no one can be named as the owner when the instance misbehaves.

        Tag-based access control stops working entirely. OCI supports conditional statements such as `allow group Developers to manage instance-family in compartment Dev where target.resource.tag.Environment = 'dev'`, and an instance with no tags does not match any tag condition, so the intended restriction silently fails to apply to it.

        During a security incident, identifying the owner and purpose of an untagged instance adds real delay to investigation and containment, at exactly the moment when delay is most expensive. The same gap makes orphan detection impossible: an instance abandoned by its original owner looks identical to a deliberately running workload, so cost and unpatched risk accumulate unnoticed.

        Define a mandatory tag set such as `Owner`, `Environment`, `Project`, and `CostCenter`, and set `freeform_tags` in the Terraform modules and launch templates that create instances so nothing can be built without meeting the minimum. Pair that with compartment-level tag defaults, and audit compartments periodically to catch instances created outside the approved pipeline.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Compute > Instances**.
        2. Select the instance you want to inspect.
        3. In the instance details page, scroll to the **Tags** section (or select the **Tags** tab).
        4. Review whether any freeform tags are listed under **Freeform Tags**.

        A passing instance shows at least one freeform tag key-value pair. A failing instance shows no freeform tags.

        ### Audit via CLI

        1. List all running instances in the compartment with their freeform tags:

        ```bash
        oci compute instance list --compartment-id <compartment-ocid> --lifecycle-state RUNNING --query 'data[*].{id: id, name: "display-name", tags: "freeform-tags"}' --all
        ```

        A passing instance returns a non-empty object for `tags`. A failing instance returns `{}` or `null` for `freeform-tags`.
      remediation:
        - id: console
          desc: |
            To add tags to a compute instance using the OCI Console:

            1. Navigate to **Compute > Instances**.
            2. Select the untagged instance.
            3. Under **More Actions**, select **Add Tags**.
            4. Add freeform tags following your organization's tagging policy (e.g., `Owner`, `Environment`, `Project`).
            5. Select **Add Tags**.
        - id: cli
          desc: |
            To add freeform tags to a compute instance using the OCI CLI:

            ```bash
            oci compute instance update --instance-id INSTANCE_OCID \
              --freeform-tags '{"Owner":"team-name","Environment":"production","Project":"my-project"}'
            ```
        - id: terraform
          desc: |
            To ensure compute instances have tags in Terraform, set the `freeform_tags` attribute:

            ```hcl
            resource "oci_core_instance" "example" {
              compartment_id      = var.compartment_ocid
              availability_domain = var.availability_domain
              shape               = "VM.Standard.E4.Flex"
              display_name        = "example-instance"

              freeform_tags = {
                Owner       = "team-name"
                Environment = "production"
                Project     = "my-project"
              }

              # ... other configuration
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Tagging/Concepts/taggingoverview.htm
        title: OCI tagging documentation
  - uid: mondoo-oci-security-compute-instance-tagging-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.compute.instances.where(state == "RUNNING").all(
        freeformTags != empty
      )
  - uid: mondoo-oci-security-compute-instance-tagging-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_core_instance')
    mql: |
      terraform.resources('oci_core_instance').all(
        arguments['freeform_tags'] != empty
      )
  - uid: mondoo-oci-security-compute-instance-tagging-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_core_instance')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_core_instance').all(
        change.after['freeform_tags'] != empty
      )
  - uid: mondoo-oci-security-compute-instance-tagging-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_core_instance')
    mql: |
      terraform.state.resources.where(type == 'oci_core_instance').all(
        values['freeform_tags'] != empty
      )
  # No Terraform variants: auth-token expiry/created timestamps are runtime-only — `oci_identity_auth_token` exposes neither `expires` nor `time_created` as configurable arguments.
  - uid: mondoo-oci-security-iam-auth-tokens-short-lived
    title: Ensure IAM auth tokens are rotated within 90 days of creation
    impact: 70
    filters: asset.platform == "oci-identity-user"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-9
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      oci.identity.user.authTokens.where(state == "ACTIVE").all(
        created > time.now - 90 * time.day
      )
    docs:
      desc: |
        This check verifies that auth tokens are rotated on a fixed cadence, by requiring every active token to have been created within the last 90 days.

        An auth token is an Oracle-generated password used by services that accept a shared secret instead of a signed request, including Container Registry, the Swift interface to Object Storage, and Autonomous Database integrations. Tokens have no expiry of any kind: once created, a token stays valid until somebody deletes it, which makes an unrotated token a permanent static credential in everything but name. Tokens are listed and deleted on the user under Identity & Security > Domains > Users, or with `oci iam auth-token list` and `oci iam auth-token delete`.

        **Why this matters**

        Because nothing expires, the exposure window on a leaked token is the remaining life of the tenancy. A token committed to a repository, echoed into a CI log, or pasted into a third-party service is still good years later, and no built-in event will ever invalidate it. A 90-day ceiling turns an unbounded window into a bounded one.

        Copies also multiply with age. The longer a token exists, the more archives, container image layers, backup snapshots, and incident tickets contain it, so the number of places a single credential can leak from grows steadily even when nothing about the token changes. Rotation resets that count.

        Rotation further caps residual access after people leave. A departed engineer's token stays live until it is explicitly deleted, and a fixed cadence bounds that gap even when the offboarding step is skipped.

        Each user may hold only two auth tokens at once, which shapes how rotation must run: create the replacement into the free slot, deploy and verify it in the consuming system, then delete the superseded one. Automating that sequence is the practical way to hold the cadence, since it removes the temptation to leave a working token in place because replacing it by hand is disruptive.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Identity & Security > Users**.
        2. Select the user you want to inspect.
        3. Under **Resources**, select **Auth Tokens**.
        4. For each active token, check the **Created** column.
        5. Verify that each token was created within the last 90 days.

        A passing user has all active auth tokens created within the last 90 days. A failing user has one or more active tokens older than 90 days.

        ### Audit via CLI

        1. List all auth tokens for a user:

        ```bash
        oci iam auth-token list --user-id <user-ocid>
        ```

        2. For each token in `ACTIVE` state, check `time-created`. The token must be no more than 90 days old.

        A passing user returns only active tokens whose `time-created` is within the last 90 days. A failing user returns one or more active tokens created more than 90 days ago.
      remediation:
        - id: console
          desc: |
            Revoke and reissue long-lived tokens:

            1. Open **Identity & Security** → **Users** → select the user → **Auth Tokens**.
            2. Delete any token that was created more than 90 days ago or is no longer needed.
            3. Generate a replacement token and record its creation date.
            4. Distribute the new token to the owning system and verify it works, then schedule the next rotation within 90 days.
        - id: cli
          desc: |
            Delete long-lived auth tokens via the OCI CLI:

            ```bash
            oci iam auth-token delete --user-id <user-ocid> --auth-token-id <token-ocid>
            ```

            Issue a replacement token and record its creation date so it can be rotated again within 90 days:

            ```bash
            oci iam auth-token create --user-id <user-ocid> --description "Rotated on $(date +%Y-%m-%d)"
            ```
        # No Terraform remediation: auth token expiry and creation timestamps are runtime-only fields; the `oci_identity_auth_token` Terraform resource exposes neither `expires` nor `time_created` as configurable arguments.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/managingcredentials.htm
        title: OCI - Managing User Credentials
  # No Terraform variants: counting members of an admin-named group requires aggregating across all `oci_identity_user_group_membership` resources that reference each group, which has no clean equivalent in HCL/plan/state without cross-resource graph traversal.
  - uid: mondoo-oci-security-iam-admin-group-membership-limited
    title: Ensure groups with tenancy-wide admin access have limited membership
    impact: 70
    filters: asset.platform == 'oci'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      # A group is administrative because of the grant it holds, not because of what it is
      # called. parsedStatements makes the grant readable, so a group named for a team can
      # no longer hold `manage all-resources in tenancy` unnoticed. The name patterns stay
      # for groups that are called administrative but hold their access some other way.
      oci.identity.groups.where(
        name.downcase == /^admins?$|^administrators?$|^tenancy[-_]?admins?$|^root[-_]?admins?$|^super[-_]?users?$/ ||
        name.downcase.in(
          oci.identity.policies.map(parsedStatements).flat
            .where(effect == "allow" && verb == "manage" && resourceType == "all-resources" && scopeType == "tenancy")
            .map(subjectNames).flat.map(_.downcase)
        )
      ).all(members.length <= 5)
    docs:
      desc: |
        This check verifies that tenancy-wide administrative privilege is held by a small, deliberate set of accounts, by requiring any group with that privilege to have no more than five members.

        A group counts as administrative here on the strength of what it can do, not what it is named. Any group named as the subject of a statement granting `manage all-resources in tenancy` qualifies, and so do groups whose names follow the conventional administrative patterns such as `Administrators`, `tenancy-admins`, or `superusers`, which catches groups reaching the same power by another route. Membership is managed under Identity & Security > Domains > Groups and listed with `oci iam group list-users`.

        **Why this matters**

        Every member of such a group can do everything the tenancy permits: attach and rewrite policies, create credentials for other identities, and read, alter, or destroy resources in every compartment. Compromising any single member through phishing, a stolen signing key, or a hijacked session yields the entire tenancy, so the group's size is simply the number of independent paths to total control.

        These groups grow quietly. Admin access granted for a migration weekend or an incident is almost never revoked afterward, and departures that miss the group leave former employees holding the highest privilege in the environment long after their last day.

        Size also degrades attribution. When a dozen accounts share the top privilege level, an audit log narrows a destructive change to any of a dozen people, which is not an answer an investigation can act on.

        Naming is the trap worth watching. A group named after a team can carry exactly the same tenancy-wide grant as `Administrators`, so a review that reads group names rather than the statements pointing at them walks straight past the largest privileges in the tenancy.

        Hold the group to a documented list of people who genuinely need tenancy-wide access, give occasional users a break-glass account activated on demand instead of standing membership, and review the roster on a schedule.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Identity & Security > Groups**.
        2. Identify any group whose name matches an admin-style pattern such as `Administrators`, `Admins`, `TenancyAdmins`, `RootAdmins`, or `SuperUsers`.
        3. Select the group and review its **Members** list.
        4. Count the number of members in the group.

        A passing group has five or fewer members. A failing group has more than five members.

        ### Audit via CLI

        1. List all groups in the tenancy:

        ```bash
        oci iam group list --compartment-id <tenancy-ocid> --all --query 'data[*].{id: id, name: name}'
        ```

        2. For any group with an admin-style name, list its members:

        ```bash
        oci iam group list-users --group-id <group-ocid> --all
        ```

        A passing group returns five or fewer user entries. A failing group returns more than five user entries.
      remediation:
        - id: console
          desc: |
            Trim the admin group to the minimum set of required members:

            1. Open **Identity & Security** → **Groups** → select the flagged group.
            2. Review each member against a documented list of personnel who require admin access.
            3. **Remove user from group** for every member who no longer needs the privilege.
            4. For users who only need occasional admin access, move them to a break-glass workflow (separate account activated only when needed).
        - id: cli
          desc: |
            Remove a user from an over-populated admin group:

            ```bash
            oci iam group remove-user --user-id <user-ocid> --group-id <group-ocid>
            ```
        # No Terraform remediation: group membership count is cross-resource runtime state; Terraform resources for `oci_identity_user_group_membership` manage individual memberships and there is no HCL expression that enforces a maximum member count across all memberships referencing a group.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/managinggroups.htm
        title: OCI - Managing Groups
  - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports
    title: Ensure NSGs do not permit SSH or RDP ingress from 0.0.0.0/0
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no network security group admits SSH or RDP ingress from the entire internet.

        A network security group is a set of stateful ingress and egress rules that Oracle Cloud Infrastructure applies at the VNIC level, the more granular successor to subnet security lists. Each ingress rule names a source CIDR, an IP protocol, and for TCP, which OCI records as protocol `6`, a destination port range. The check fails any rule whose source is `0.0.0.0/0` or `::/0` and whose TCP port range covers 22 for SSH or 3389 for RDP, and it counts a rule declaring no destination port range as covering both, because such a rule opens every TCP port. Rules live under Networking > Virtual cloud networks > Network security groups, and `oci network nsg rules update` edits them.

        **Why this matters**

        Because groups attach per VNIC, one permissive rule negates otherwise strict subnet controls. The gap is invisible to any review that looks only at security lists: the subnet can be locked down correctly while a single instance answers the internet on port 22.

        Automated scanners identify open SSH and RDP ports on a new public IP address within minutes of instance launch. What follows is continuous password spraying, credential stuffing, and exploitation of known vulnerabilities in the listening service, none of it rate limited at the network layer.

        Blocking only IPv4 is not enough: a rule set that denies `0.0.0.0/0` while permitting `::/0` leaves the same two ports reachable over IPv6 from the whole internet, which is why both sources are tested.

        Where administrative access must reach an instance, replace the open source with the ranges operators connect from: bastion hosts, VPN gateways, or a management subnet. Better still, route that access through the OCI Bastion service, which brokers time limited and audited SSH and RDP sessions without either port being published. Treat group hardening as a complement to subnet security lists, not a replacement, so both layers enforce the same admin port policy.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Network Security Groups**.
        2. Select the NSG you want to inspect.
        3. Select the **Security Rules** tab and filter for **Ingress** direction.
        4. Look for any rule where the **Source** is `0.0.0.0/0` or `::/0`, the **Protocol** is TCP, and the **Destination Port Range** includes port 22 or port 3389.

        A passing NSG has no ingress rule permitting TCP port 22 or 3389 from `0.0.0.0/0` or `::/0`. A failing NSG has at least one such rule.

        ### Audit via CLI

        1. List all NSGs in the compartment:

        ```bash
        oci network nsg list --compartment-id <compartment-ocid> --all --query 'data[*].{id: id, name: "display-name"}'
        ```

        2. For each NSG, list its security rules and inspect for unrestricted admin-port ingress:

        ```bash
        oci network nsg rules list --nsg-id <nsg-ocid> --direction INGRESS --query 'data[?source==`0.0.0.0/0` || source==`::/0`]'
        ```

        A passing NSG returns no TCP ingress rules from `0.0.0.0/0` or `::/0` that cover port 22 or 3389. A failing NSG returns one or more rules where the TCP destination port range includes port 22 or 3389 and the source is `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            Tighten NSG rules to remove internet-wide admin access:

            1. Open **Networking** → **Network Security Groups** → select the flagged NSG.
            2. Under **Security Rules**, select the over-permissive ingress rule (source `0.0.0.0/0`, protocol TCP, destination port 22 or 3389).
            3. Either delete it or restrict the source to specific bastion / VPN CIDR ranges.
            4. For administrative access, route through OCI Bastion or an approved VPN instead of opening SSH/RDP to the world.
        - id: cli
          desc: |
            Remove an over-permissive ingress rule from an NSG:

            ```bash
            oci network nsg rules remove \
              --nsg-id <nsg-ocid> \
              --security-rule-ids '["<rule-id>"]'
            ```
        - id: terraform
          desc: |
            Define NSG ingress rules with `tcp_options.destination_port_range` blocks that exclude SSH (22) and RDP (3389), or restrict the source to a trusted CIDR rather than `0.0.0.0/0` / `::/0`:

            ```hcl
            resource "oci_core_network_security_group_security_rule" "https_in" {
              network_security_group_id = oci_core_network_security_group.app.id
              direction                 = "INGRESS"
              protocol                  = "6"
              source                    = "0.0.0.0/0"
              source_type               = "CIDR_BLOCK"

              tcp_options {
                destination_port_range {
                  min = 443
                  max = 443
                }
              }
            }

            resource "oci_core_network_security_group_security_rule" "ssh_from_bastion" {
              network_security_group_id = oci_core_network_security_group.app.id
              direction                 = "INGRESS"
              protocol                  = "6"
              source                    = "10.0.0.0/16"
              source_type               = "CIDR_BLOCK"

              tcp_options {
                destination_port_range {
                  min = 22
                  max = 22
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/networksecuritygroups.htm
        title: OCI - Network Security Groups
      - url: https://docs.oracle.com/en-us/iaas/Content/Bastion/Concepts/bastionoverview.htm
        title: OCI Bastion Service
  - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.network.networkSecurityGroups.all(
        ingressRules.where(
          source == "0.0.0.0/0" || source == "::/0"
        ).where(protocol == "6").none(
          destinationPortMin == empty || destinationPortMin <= 22 && destinationPortMax >= 22
        )
        &&
        ingressRules.where(
          source == "0.0.0.0/0" || source == "::/0"
        ).where(protocol == "6").none(
          destinationPortMin == empty || destinationPortMin <= 3389 && destinationPortMax >= 3389
        )
      )
  - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_core_network_security_group_security_rule')
    mql: |
      # An ingress rule from 0.0.0.0/0 or ::/0 over TCP must declare a tcp_options block with a destination_port_range that excludes both 22 and 3389 (range entirely below 22, between 22 and 3389 exclusive, or above 3389).
      terraform.resources('oci_core_network_security_group_security_rule')
        .where(arguments['direction'] == 'INGRESS')
        .where(arguments['protocol'] == '6')
        .where(arguments['source'] == '0.0.0.0/0' || arguments['source'] == '::/0')
        .all(
          blocks.where(type == 'tcp_options') != empty &&
          blocks.where(type == 'tcp_options').all(
            blocks.where(type == 'destination_port_range') != empty &&
            blocks.where(type == 'destination_port_range').all(
              arguments['max'] < 22 ||
              arguments['min'] > 22 && arguments['max'] < 3389 ||
              arguments['min'] > 3389
            )
          )
        )
  - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_core_network_security_group_security_rule')
    mql: |
      terraform.plan.resourceChanges
        .where(type == 'oci_core_network_security_group_security_rule')
        .where(change.after['direction'] == 'INGRESS')
        .where(change.after['protocol'] == '6')
        .where(change.after['source'] == '0.0.0.0/0' || change.after['source'] == '::/0')
        .all(
          change.after['tcp_options'] != null && change.after['tcp_options'].length > 0 &&
          change.after['tcp_options'].all(
            _['destination_port_range'] != null && _['destination_port_range'].length > 0 &&
            _['destination_port_range'].all(
              _['max'] < 22 ||
              _['min'] > 22 && _['max'] < 3389 ||
              _['min'] > 3389
            )
          )
        )
  - uid: mondoo-oci-security-nsg-no-unrestricted-admin-ports-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_core_network_security_group_security_rule')
    mql: |
      terraform.state.resources
        .where(type == 'oci_core_network_security_group_security_rule')
        .where(values['direction'] == 'INGRESS')
        .where(values['protocol'] == '6')
        .where(values['source'] == '0.0.0.0/0' || values['source'] == '::/0')
        .all(
          values['tcp_options'] != null && values['tcp_options'].length > 0 &&
          values['tcp_options'].all(
            _['destination_port_range'] != null && _['destination_port_range'].length > 0 &&
            _['destination_port_range'].all(
              _['max'] < 22 ||
              _['min'] > 22 && _['max'] < 3389 ||
              _['min'] > 3389
            )
          )
        )
  - uid: mondoo-oci-security-public-vnic-has-nsg
    title: Ensure public compute VNICs are gated by a network security group
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-public-vnic-has-nsg-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-public-vnic-has-nsg-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-public-vnic-has-nsg-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-public-vnic-has-nsg-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every compute instance holding a public IP address is filtered by a network security group that does not admit traffic from any address.

        Network security groups are the per-workload segmentation mechanism in Oracle Cloud Infrastructure, evaluated at the VNIC rather than at the subnet. OCI treats an absent group exactly the way it treats a wide open one: with no group attached, the VNIC has no VNIC-level ingress filter at all and falls back entirely on the subnet's security lists. The check therefore fails both the instance with a permissive group and the instance with none. Attach groups under Compute > Instances > Attached VNICs > Edit VNIC, with `oci network vnic update --nsg-ids`, or through `nsg_ids` inside the VNIC details of a Terraform instance.

        **Why this matters**

        Without a group, every inbound port the subnet security list allows is reachable from the internet on that specific VNIC, and there is no host-level override available to narrow it.

        Subnets shared by several workloads accumulate relaxed security-list rules, because the list has to accommodate the broadest workload on it. Attaching no group means inheriting all of that permissiveness instead of scoping ingress to the services this host actually offers.

        The failure is quiet. An operator who forgets the attachment produces an internet-exposed instance that passes any review focused on security lists alone, so the gap stays hidden until something explicitly examines VNIC-level controls.

        Make group attachment a mandatory step in the instance launch path, enforced in infrastructure-as-code templates and by the access policies that govern who may launch. Define one group per workload type, such as web servers, databases, and management hosts, with ingress rules that permit only the ports that workload must expose, then attach it to every VNIC serving that workload. Where an instance has no reason to hold a public IP address at all, move it to a private subnet and remove the VNIC-level internet exposure entirely.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Compute > Instances**.
        2. Select an instance.
        3. Under **Resources**, select **Attached VNICs**.
        4. Select the VNIC and check whether it has a public IP assigned.
        5. If a public IP is assigned, scroll to the **Network Security Groups** field and verify at least one NSG is listed.

        A passing VNIC with a public IP shows one or more NSGs attached. A failing VNIC shows a public IP with no NSGs attached.

        ### Audit via CLI

        1. List all VNICs for a compute instance and check their public IP and NSG assignments:

        ```bash
        oci compute instance list-vnics --instance-id <instance-ocid> --query 'data[*].{id: id, publicIp: "public-ip", nsgIds: "nsg-ids"}'
        ```

        A passing VNIC that has a non-empty `publicIp` returns a non-empty `nsgIds` list. A failing VNIC shows a non-null `publicIp` value with an empty `nsgIds` list.
      remediation:
        - id: console
          desc: |
            Attach an NSG to the flagged VNIC:

            1. Open **Compute** → **Instances** → select the instance → **Attached VNICs** → select the VNIC.
            2. **Edit VNIC** → **Network Security Groups** → **Add Network Security Group**.
            3. Pick an NSG whose ingress rules match the services the host should expose.
            4. Save. If no appropriate NSG exists, create one first scoped to the workload.
        - id: cli
          desc: |
            Attach an NSG to a VNIC:

            ```bash
            oci network vnic update --vnic-id <vnic-ocid> --nsg-ids '["<nsg-ocid>"]'
            ```
        - id: terraform
          desc: |
            Whenever the instance assigns a public IP, populate `nsg_ids` on the `create_vnic_details` block:

            ```hcl
            resource "oci_core_instance" "web" {
              compartment_id      = var.compartment_ocid
              availability_domain = var.ad
              shape               = "VM.Standard.E4.Flex"

              create_vnic_details {
                subnet_id        = oci_core_subnet.public.id
                assign_public_ip = true
                nsg_ids          = [oci_core_network_security_group.web.id]
              }

              source_details {
                source_type = "image"
                source_id   = var.image_ocid
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/networksecuritygroups.htm
        title: OCI - Network Security Groups
  - uid: mondoo-oci-security-public-vnic-has-nsg-oci
    filters: asset.platform == 'oci'
    mql: |
      # exposure.securityGroupAllowsIngress is true both when an attached network security
      # group admits any address and when no group is attached at all, which is OCI's
      # default-open posture. Counting attached groups misses the first case entirely.
      oci.compute.instances.where(exposure.hasPublicIp == true).all(
        exposure.securityGroupAllowsIngress == false
      )
  - uid: mondoo-oci-security-public-vnic-has-nsg-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_core_instance')
    mql: |
      # When create_vnic_details has assign_public_ip = true (or omits it — default is true on a public subnet), nsg_ids must be a non-empty list.
      terraform.resources('oci_core_instance').all(
        blocks.where(type == 'create_vnic_details').all(
          arguments['assign_public_ip'] == false ||
          arguments['nsg_ids'] != null && arguments['nsg_ids'].length > 0
        )
      )
  - uid: mondoo-oci-security-public-vnic-has-nsg-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_core_instance')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_core_instance').all(
        change.after['create_vnic_details'] == null ||
        change.after['create_vnic_details'].all(
          _['assign_public_ip'] == false ||
          _['nsg_ids'] != null && _['nsg_ids'].length > 0
        )
      )
  - uid: mondoo-oci-security-public-vnic-has-nsg-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_core_instance')
    mql: |
      terraform.state.resources.where(type == 'oci_core_instance').all(
        values['create_vnic_details'] == null ||
        values['create_vnic_details'].all(
          _['assign_public_ip'] == false ||
          _['nsg_ids'] != null && _['nsg_ids'].length > 0
        )
      )
  - uid: mondoo-oci-security-compute-imds-v2-only
    title: Ensure compute instances have the legacy IMDSv1 endpoints disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-oci-security-compute-imds-v2-only-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-compute-imds-v2-only-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-imds-v2-only-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-imds-v2-only-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that compute instances accept only authenticated instance metadata requests, by requiring `instanceOptions.areLegacyImdsEndpointsDisabled` to be true.

        The Instance Metadata Service answers requests at the link-local address 169.254.169.254 and hands out instance configuration, cloud-init `user_data`, and, crucially, short-lived instance principal tokens. Version 1 of that service answers any plain HTTP GET with no authentication at all. Version 2 requires the caller to first obtain a session token through a PUT request and then present it on every read. Disabling the legacy endpoints is set under Compute > Instances > Edit > Instance metadata service in the Console, with `oci compute instance update --instance-id <id> --instance-options`, or through `are_legacy_imds_endpoints_disabled = true` in the `instance_options` block of an `oci_core_instance` Terraform resource.

        **Why this matters**

        A server-side request forgery flaw in any application on the instance is enough to read IMDSv1. The attacker only needs to coerce the application into fetching a URL, and a GET to 169.254.169.254 returns metadata with no credential of any kind. The PUT-plus-header handshake that IMDSv2 demands is something most SSRF primitives cannot produce, because they control a URL and not an HTTP method or header.

        What comes back is not just configuration. Instance principals are the mechanism by which compute gets OCI credentials without an API key: a dynamic group matches the instance by rule, and IAM policies grant that dynamic group permissions. A token pulled from IMDSv1 carries exactly those permissions, so the blast radius is whatever the dynamic group was granted across the tenancy.

        Every process on the host can reach the legacy endpoints, including application containers and third-party agents, so the exposure is not limited to one privileged service.

        The OCI SDK and CLI speak IMDSv2 by default, so correctly written workloads are unaffected. Before enforcing, audit bootstrap scripts and automation that call the metadata address directly and update them to request a session token first, then set the flag in your Terraform module defaults so new instances launch with it off.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Compute > Instances**.
        2. Select the instance you want to inspect.
        3. Select **More Actions > Edit** and expand **Show advanced options**.
        4. Select the **Security** tab and check the value of **Legacy MetaData service endpoint**.

        A passing instance shows **Legacy MetaData service endpoint: Disabled**. A failing instance shows **Legacy MetaData service endpoint: Enabled**.

        ### Audit via CLI

        1. Retrieve the instance details and inspect `instance-options`:

        ```bash
        oci compute instance get --instance-id <instance-ocid> --query 'data."instance-options"'
        ```

        A passing instance returns `{"are-legacy-imds-endpoints-disabled": true}`. A failing instance returns `{"are-legacy-imds-endpoints-disabled": false}` or omits the field entirely (legacy endpoints are enabled by default).
      remediation:
        - id: console
          desc: |
            Disable legacy IMDS endpoints on the instance:

            1. Open **Compute** → **Instances** → select the instance.
            2. **More Actions** → **Edit** → expand **Show advanced options** → **Security**.
            3. Set **Legacy MetaData service endpoint** to **Disabled**.
            4. Save. The setting takes effect immediately. Once legacy IMDS is disabled, any application still calling IMDSv1 fails immediately, so update those applications to IMDSv2 (which sends a PUT request to obtain a session token and includes that token as a header on subsequent calls) before disabling, then restart those applications.
        - id: cli
          desc: |
            Disable legacy IMDS endpoints via the OCI CLI:

            ```bash
            oci compute instance update \
              --instance-id <instance-ocid> \
              --instance-options '{"areLegacyImdsEndpointsDisabled": true}'
            ```
        - id: terraform
          desc: |
            Declare an `instance_options` block on every `oci_core_instance` and set `are_legacy_imds_endpoints_disabled = true`:

            ```hcl
            resource "oci_core_instance" "app" {
              compartment_id      = var.compartment_ocid
              availability_domain = var.ad
              shape               = "VM.Standard.E4.Flex"

              instance_options {
                are_legacy_imds_endpoints_disabled = true
              }

              source_details {
                source_type = "image"
                source_id   = var.image_ocid
              }
            }
            ```
    refs:
