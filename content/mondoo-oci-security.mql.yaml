  - uid: mondoo-oci-security-vcn-no-unrestricted-udp-ingress
    title: Ensure VCN security lists block unrestricted UDP ingress
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-udp-ingress-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-udp-ingress-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-udp-ingress-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-udp-ingress-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/icon: terraform
    docs:
      desc: |
        This check verifies that every UDP ingress rule accepting internet traffic names the destination ports it opens.

        UDP is protocol `17` in an OCI security list rule, and its port range lives in an optional `udpOptions` block. A rule with source `0.0.0.0/0`, protocol `17` and no `udpOptions` exposes every UDP port on every instance in the subnet, so the check requires the port range to be present. Set it in the rule editor on the security list details page in the Console, or in the ingress rules payload of `oci network security-list update`.

        **Why this matters**

        The danger with UDP is not only what reaches you but what you are made to send. DNS on 53, NTP on 123 and SNMP on 161 all answer with far more bytes than they receive, so an exposed instance is drafted as a reflector in a distributed denial-of-service amplification attack. The attacker spoofs a victim's address, your instance replies to the victim, and the tenancy is billed for the outbound bandwidth of an attack it is unwittingly carrying out.

        SNMP leaks on the way in as well. An unauthenticated read from the internet returns interface tables, routing information, running processes and system descriptions, which amounts to a topology map handed to whoever asked for it.

        Detection is weaker here than on TCP. Connectionless traffic has no handshake to correlate, so flow records show packets without sessions, and abuse of an open UDP port is far harder to separate from ordinary noise than the equivalent TCP activity would be.

        Name the exact port range each UDP workload requires rather than leaving the options block off, and keep the source restricted to known ranges even when a range is present. Where a UDP service must answer the public internet, place it behind rate limiting and confirm it is not configured to respond to spoofed or recursive queries.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Virtual Cloud Networks**.
        2. Select the VCN you want to inspect.
        3. Select **Security Lists** from the left-hand resources menu.
        4. For each security list, select it and review the **Ingress Rules** tab.
        5. Look for any rule where the **Source** is `0.0.0.0/0`, the **Protocol** is UDP, and no destination port range is specified (all UDP ports allowed).

        A passing security list has no UDP ingress rule from `0.0.0.0/0` without an explicit destination port range. A failing security list has at least one UDP ingress rule from `0.0.0.0/0` with no port restriction.

        ### Audit via CLI

        1. Retrieve all ingress rules for a security list and filter for UDP rules from `0.0.0.0/0`:

        ```bash
        oci network security-list get --security-list-id <security-list-ocid> --query 'data."ingress-security-rules"[?source==`0.0.0.0/0` && protocol==`17`]'
        ```

        A passing security list returns no results, or returns only UDP rules that include a `udp-options` block with an explicit destination port range. A failing security list returns one or more UDP rules from `0.0.0.0/0` where `udp-options` is absent (all UDP ports allowed).
      remediation:
        - id: console
          desc: |
            To restrict unrestricted UDP ingress rules in a VCN security list using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list.
            5. Edit UDP ingress rules from 0.0.0.0/0 to specify destination port ranges, allowing only the ports required for your workload.
        - id: cli
          desc: |
            To restrict unrestricted UDP ingress rules in a VCN security list using the OCI CLI, give every public UDP rule an explicit port range.

            **Warning: `--ingress-security-rules` replaces the COMPLETE set of ingress rules.** Whatever you pass becomes the entire ingress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the offending rule, then resubmit the full list.

            1. Export the current ingress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id <security-list-ocid> \
              --query 'data."ingress-security-rules"' > ingress-rules.json
            ```

            2. Edit `ingress-rules.json` so each `0.0.0.0/0` UDP rule carries a `udpOptions` port range, such as `{"source":"10.0.0.0/16","protocol":"17","udpOptions":{"destinationPortRange":{"min":53,"max":53}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id <security-list-ocid> \
              --ingress-security-rules file://ingress-rules.json
            ```
        - id: terraform
          desc: |
            To restrict unrestricted UDP ingress in a VCN security list in Terraform, always specify `udp_options` with explicit port ranges:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              ingress_security_rules {
                protocol  = "17" # UDP
                source    = "10.0.0.0/16"
                stateless = false

                udp_options {
                  min = 53
                  max = 53
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: CIS OCI Foundations Benchmark 2.5
