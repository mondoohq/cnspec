  - uid: mondoo-oci-security-container-instances-approved-registry
    title: Ensure container instances pull images from the tenancy's OCIR registry
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ais-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-21
      compliance/nis-2: nis-2-21-2-d
      compliance/nist-csf-1: nist-csf-1-id-sc-2
      compliance/nist-csf-2: nist-csf-2-id-ra-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sr-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-1-3-3
    variants:
      - uid: mondoo-oci-security-container-instances-approved-registry-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-container-instances-approved-registry-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-container-instances-approved-registry-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-container-instances-approved-registry-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every container running on an OCI Container Instance is pulled from the tenancy's own registry rather than from an arbitrary external one.

        Each container in an instance carries an image URL, and the check requires it to begin with a regional OCI Container Registry (OCIR) hostname matching the `*.ocir.io` pattern, meaning a region key followed by `.ocir.io`, such as `iad.ocir.io` or `phx.ocir.io`. By default Container Instances accept any image URL at all, including references to public registries such as Docker Hub or GitHub Container Registry that the tenancy neither controls nor can audit. Image URLs are set per container when the instance is created under Developer Services > Container Instances, and the Terraform versions additionally require at least one container to be declared, so an instance with no containers block cannot pass by default.

        **Why this matters**

        An image pulled from outside the tenancy skips every control the tenancy has built. Vulnerability scanning, signature verification, and tag immutability are enforced on OCIR content; none of them apply to a tag someone pulled straight from a public registry, so an instance can be running code that no scanner in the estate has ever examined.

        Public registries are an actively worked attack surface. Typosquatted names sit one character away from popular images, and compromised CI pipelines have repeatedly pushed crypto-mining payloads and backdoored base images under legitimate-looking tags. A mutable public tag can also change under a running deployment, so the image validated last month is not necessarily the image that starts tonight.

        The dependency is operational as well as adversarial. Pulling from a third-party registry ties instance startup to that registry's uptime, rate limits, and policy decisions, any of which can stop a scale-out or a restart at the worst possible moment.

        Requiring OCIR keeps an auditable record of every image version that has run in production, which external registries simply do not provide. The practical workflow is to mirror approved third-party images into OCIR, scan them on push, and reference the mirrored copy from the instance. The check accepts any region's OCIR endpoint, so this does not pin workloads to a single region.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Developer Services** > **Container Instances**.
        2. For each container instance, select it and view the **Containers** tab.
        3. For each container listed, note the **Image** field. Verify that the image URL begins with a regional OCIR hostname in the format `<region-key>.ocir.io/<namespace>/...`.

        A passing container instance shows all container images sourced from `*.ocir.io`. A failing container instance shows at least one container image referencing an external registry such as `docker.io`, `ghcr.io`, or `quay.io`.

        ### Audit via CLI

        1. List all container instances and their containers:

        ```bash
        oci container-instances container-instance list \
          --compartment-id <compartment-ocid> --all \
          --query 'data.items[].{Name:"display-name", OCID:id}' --output table
        ```

        2. For each instance, retrieve the container image URLs:

        ```bash
        oci container-instances container-instance get \
          --container-instance-id <instance-ocid> \
          --query 'data.containers[].{Container:"display-name", Image:"image-url"}' \
          --output table
        ```

        A passing container instance returns image URLs that all begin with `<region>.ocir.io/`. A failing container instance returns at least one image URL that does not match that pattern.
      remediation:
        - id: console
          desc: |
            Mirroring an image into OCIR is done with the local Docker CLI, not in the OCI Console. Before you can push, you must authenticate to OCIR with `docker login`. The password is an OCIR auth token generated from your user profile, not your console password. The username is `<namespace>/<your-username>` (or `<namespace>/oracleidentitycloudservice/<your-username>` for federated users).

            1. Authenticate the Docker CLI to OCIR:

            ```bash
            docker login <region>.ocir.io
            # Username: <namespace>/<your-username>
            # Password: <your OCIR auth token>
            ```

            2. Mirror the required image into OCIR:

            ```bash
            docker pull <external>:<tag>
            docker tag <external>:<tag> <region>.ocir.io/<namespace>/<repo>:<tag>
            docker push <region>.ocir.io/<namespace>/<repo>:<tag>
            ```

            3. Scan the mirrored image via OCIR's integrated vulnerability scanning.
            4. In the container instance spec, change the `imageUrl` to the OCIR path.
            5. Recreate the container instance with the updated spec.
        - id: cli
          desc: |
            Recreate the container instance pointing at the OCIR copy:

            ```bash
            oci container-instances container-instance create \
              --compartment-id <compartment-ocid> \
              --display-name <name> \
              --availability-domain <ad> \
              --shape CI.Standard.E4.Flex \
              --shape-config '{"ocpus":1,"memoryInGBs":2}' \
              --vnics '[{"subnetId":"<subnet-ocid>"}]' \
              --containers '[{"displayName":"app","imageUrl":"<region>.ocir.io/<namespace>/<repo>:<tag>"}]'
            ```
        - id: terraform
          desc: |
            Set every `containers` block's `image_url` to a path under `<region>.ocir.io/<namespace>/<repo>:<tag>` rather than a public registry such as Docker Hub or GHCR:

            ```hcl
            resource "oci_container_instances_container_instance" "app" {
              compartment_id      = var.compartment_ocid
              display_name        = "app"
              availability_domain = var.ad
              shape               = "CI.Standard.E4.Flex"

              shape_config {
                ocpus         = 1
                memory_in_gbs = 2
              }

              vnics {
                subnet_id = oci_core_subnet.app.id
              }

              containers {
                display_name = "app"
                image_url    = "iad.ocir.io/examplenamespace/app:1.0.0"
              }
            }
            ```

            Write the region key, namespace, and tag as literal values for your tenancy. Interpolated variables cannot be evaluated during static analysis and fail the check.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/container-instances/overview.htm
        title: OCI Container Instances Overview
      - url: https://docs.oracle.com/en-us/iaas/Content/Registry/Concepts/registryoverview.htm
        title: OCI Registry (OCIR)
  - uid: mondoo-oci-security-container-instances-approved-registry-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.containerInstances.instances.all(
        containers.all(imageUrl == /^[a-z0-9-]+\.ocir\.io\//)
      )
  - uid: mondoo-oci-security-container-instances-approved-registry-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_container_instances_container_instance')
    mql: |
      # Every nested `containers` block must have an image_url pointing at an OCIR registry. Without the existence guard, an instance with no containers block would silently pass.
      terraform.resources('oci_container_instances_container_instance').all(
        blocks.where(type == 'containers') != empty &&
        blocks.where(type == 'containers').all(
          arguments['image_url'] == /^[a-z0-9-]+\.ocir\.io\//
        )
      )
  - uid: mondoo-oci-security-container-instances-approved-registry-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_container_instances_container_instance')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_container_instances_container_instance').all(
        change.after['containers'] != null && change.after['containers'].length > 0 &&
        change.after['containers'].all(
          _['image_url'] == /^[a-z0-9-]+\.ocir\.io\//
        )
      )
  - uid: mondoo-oci-security-container-instances-approved-registry-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_container_instances_container_instance')
    mql: |
      terraform.state.resources.where(type == 'oci_container_instances_container_instance').all(
        values['containers'] != null && values['containers'].length > 0 &&
        values['containers'].all(
          _['image_url'] == /^[a-z0-9-]+\.ocir\.io\//
        )
      )
  - uid: mondoo-oci-security-object-storage-retention-rules-locked
    title: Ensure object storage bucket retention rules are locked
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-16
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-5-33
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ip-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-7-1-1
    variants:
      - uid: mondoo-oci-security-object-storage-retention-rules-locked-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-object-storage-retention-rules-locked-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-retention-rules-locked-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-retention-rules-locked-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every retention rule on an Object Storage bucket is locked and that its lock has already taken effect.

        A retention rule blocks deletion and modification of covered objects for its duration, but a rule created without a lock time can be shortened or removed at will by anyone who can administer the bucket. Locking makes the commitment binding: once the lock time passes, no principal in the tenancy can delete the rule or reduce its duration, including the `Administrators` group, and the duration can only be extended. Set the lock time on the bucket's Retention Rules panel or with `oci os retention-rule create --namespace <namespace> --bucket-name <bucket> --time-rule-locked <timestamp>`. It must be at least 14 days in the future, a deliberate delay that leaves you a window to cancel a mistake before the rule becomes permanent.

        **Why this matters**

        An unlocked retention rule is functionally identical to no retention rule. It stops accidents, but the attacker scenario retention exists for is one where the adversary already holds administrative credentials, and that adversary deletes the rule first and the objects second.

        Ransomware operators work this way by design. They locate the backup and archive stores, strip the controls that would shorten their leverage, and only then encrypt or delete, precisely so the victim has no clean recovery point. A locked rule survives that sequence, because the attacker's own privileges cannot revoke it, and objects covered by an in-effect rule cannot be deleted or overwritten at all.

        Compliance frameworks requiring immutable audit logs or fixed data retention depend on the guarantee being non-revocable for the whole period. A rule a single compromised account can erase does not meet that bar, even though a configuration audit shows it as though it does.

        Because the 14-day delay is also the window in which an attacker could cancel a newly created lock, alert on retention rule creation and deletion. The Terraform version of this check requires only that a lock time is declared, since configuration cannot show whether the delay has already elapsed.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Storage** > **Buckets**.
        2. For each bucket that holds regulated or backup data, select the bucket and click the **Retention Rules** tab.
        3. For each retention rule listed, check the **Rule Locked Time** column. Confirm that a lock time is set and that the date shown is in the past (meaning the lock has taken effect).

        A passing bucket shows every retention rule with a **Rule Locked Time** that is non-empty and in the past. A failing bucket shows a retention rule with no lock time set, or a lock time that is still in the future.

        ### Audit via CLI

        1. List all retention rules for a bucket:

        ```bash
        oci os retention-rule list \
          --namespace-name <namespace> \
          --bucket-name <bucket-name> \
          --output json
        ```

        2. Inspect the `time-rule-locked` field in each rule entry.

        A passing bucket returns rules where every `time-rule-locked` value is non-null and in the past. A failing bucket returns at least one rule where `time-rule-locked` is `null` or is a future timestamp.
      remediation:
        - id: console
          desc: |
            Lock retention rules on every bucket that stores data with retention requirements:

            1. Open **Storage** → **Buckets** → select the bucket → **Retention Rules**.
            2. For each unlocked rule, select **Edit** → set **Rule Locked Time** to a date no sooner than 14 days in the future (OCI enforces a 14-day grace period before the lock takes effect).
            3. Save. After the grace period passes, the rule becomes non-deletable for the duration of its lifetime.
            4. Plan retention carefully. After the lock takes effect, the duration can only be increased, and the rule can only be removed by deleting the bucket.
        - id: cli
          desc: |
            Lock an existing retention rule:

            ```bash
            oci os retention-rule update \
              --namespace-name <namespace> \
              --bucket-name <bucket> \
              --retention-rule-id <rule-ocid> \
              --time-rule-locked 2099-01-01T00:00:00Z # set to a real future RFC 3339 timestamp ≥ 14 days from now
            ```

            Set the lock time to a real RFC 3339 timestamp at least 14 days in the future (OCI enforces a 14-day grace period before the lock takes effect). This is irreversible: once the lock takes effect the duration can only be increased, and the rule becomes non-deletable for the bucket's lifetime, so the only way to remove it is to delete the entire bucket. Plan the retention duration carefully before locking.
        - id: terraform
          desc: |
            Set `time_rule_locked` on every `retention_rules` block to an RFC 3339 timestamp at least 14 days in the future so the rule transitions to a non-deletable lock. Use a fixed value committed in your repository. Do not use `timeadd(timestamp(), ...)` directly on this attribute, because `timestamp()` evaluates on every plan and would produce a perpetual diff. Update the value when you intentionally roll the lock, and add `lifecycle.ignore_changes = [retention_rules]` after the first apply if you want Terraform to stop tracking drift on the locked rule:

            ```hcl
            resource "oci_objectstorage_bucket" "backups" {
              compartment_id = var.compartment_ocid
              namespace      = var.namespace
              name           = "backups"
              access_type    = "NoPublicAccess"

              retention_rules {
                display_name     = "regulatory-90d"
                time_rule_locked = "2099-01-01T00:00:00Z" # set to a real future RFC 3339 timestamp ≥ 14 days from apply

                duration {
                  time_amount = 90
                  time_unit   = "DAYS"
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/usingretentionrules.htm
        title: OCI - Using Retention Rules
  - uid: mondoo-oci-security-object-storage-retention-rules-locked-oci
    filters: asset.platform == "oci-objectstorage-bucket"
    mql: |
      oci.objectStorage.bucket.retentionRules.all(
        timeRuleLocked != null && timeRuleLocked <= time.now
      )
  - uid: mondoo-oci-security-object-storage-retention-rules-locked-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_objectstorage_bucket')
    mql: |
      # Every retention_rules block on the bucket must declare a non-null time_rule_locked. Terraform cannot evaluate "lock time has passed" at plan time, so this stricter variant requires the lock time to be set at all.
      terraform.resources('oci_objectstorage_bucket').all(
        blocks.where(type == 'retention_rules').all(
          arguments['time_rule_locked'] != null
        )
      )
  - uid: mondoo-oci-security-object-storage-retention-rules-locked-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_objectstorage_bucket')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_objectstorage_bucket').all(
        change.after['retention_rules'] == null ||
        change.after['retention_rules'].all(
          _['time_rule_locked'] != null
        )
      )
  - uid: mondoo-oci-security-object-storage-retention-rules-locked-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_objectstorage_bucket')
    mql: |
      terraform.state.resources.where(type == 'oci_objectstorage_bucket').all(
        values['retention_rules'] == null ||
        values['retention_rules'].all(
          _['time_rule_locked'] != null
        )
      )
  - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum
    title: Ensure object storage retention rules are at least 30 days
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-16
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-5-33
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ip-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-7-1-1
    variants:
      - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Object Storage retention rules hold objects long enough to be useful, requiring at least 30 days or at least 1 year for rules expressed in years.

        A retention rule's duration is an amount plus a unit of `DAYS` or `YEARS`, and OCI accepts any positive value, including a one-day rule that satisfies a configuration audit while protecting essentially nothing. This check accepts a duration of 30 days or more, or 1 year or more when the unit is years. Adjust the value on the bucket's Retention Rules panel or with `oci os retention-rule update`, keeping in mind that a locked rule's duration can be extended but never shortened.

        **Why this matters**

        Retention length is calibrated against how long an intruder stays before acting. Ransomware operators commonly hold persistence for more than 14 days before triggering encryption, mapping the environment and identifying backups first. A retention window shorter than the dwell time means every retained copy was already written under the attacker's control by the time recovery starts, so there is no clean point to restore from.

        A short rule is worse than an absent one in one specific way: it reports as a control in place. Configuration reviews, compliance evidence, and dashboards all show retention enabled, and nobody discovers the window was too small to matter until the recovery attempt fails.

        Ordinary data loss needs a similar margin. Storage corruption and accidental deletions are frequently noticed long after the fact, and resolving them usually requires more than a week of history, not a couple of days.

        Common regulatory frameworks state retention in months or years rather than days, so a sub-30-day window falls below the lower bound of what an auditor will accept. Treating 30 days as the floor keeps at least one recovery point outside typical dwell time and puts the organization inside that lower bound, while regulated records generally need a much longer window derived from the specific obligation rather than from this minimum.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Storage** > **Buckets**.
        2. For each bucket, select it and click the **Retention Rules** tab.
        3. For each retention rule, check the **Duration** column. Confirm that the duration is at least 30 days (or at least 1 year for year-denominated rules).

        A passing bucket shows all retention rules with a duration of 30 days or more (or 1 year or more). A failing bucket shows at least one retention rule with a duration shorter than 30 days.

        ### Audit via CLI

        1. List all retention rules and their durations for a bucket:

        ```bash
        oci os retention-rule list \
          --namespace-name <namespace> \
          --bucket-name <bucket-name> \
          --query 'data[].{RuleID:id, TimeUnit:"duration"."time-unit", TimeAmount:"duration"."time-amount"}' \
          --output table
        ```

        A passing bucket returns rules where every `TimeUnit` / `TimeAmount` pair satisfies at least 30 DAYS or at least 1 YEARS. A failing bucket returns at least one rule with a `TimeAmount` below the minimum for its unit.
      remediation:
        - id: console
          desc: |
            Extend short retention durations:

            1. Open **Storage** → **Buckets** → select the bucket → **Retention Rules**.
            2. Edit the rule and set **Duration** to at least 30 days (or longer per your data-retention policy).
            3. Save and, where possible, lock the rule (`timeRuleLocked`) so the longer duration cannot be reverted.
        - id: cli
          desc: |
            Extend an existing retention rule:

            ```bash
            oci os retention-rule update \
              --namespace-name <namespace> \
              --bucket-name <bucket> \
              --retention-rule-id <rule-ocid> \
              --time-amount 30 \
              --time-unit DAYS
            ```
        - id: terraform
          desc: |
            This check verifies the retention `duration`, so the fix is to declare every `retention_rules.duration` block with at least 30 days, or 1 year for year-denominated rules:

            ```hcl
            resource "oci_objectstorage_bucket" "backups" {
              compartment_id = var.compartment_ocid
              namespace      = var.namespace
              name           = "backups"
              access_type    = "NoPublicAccess"

              retention_rules {
                display_name = "regulatory-90d"

                duration {
                  time_amount = 90
                  time_unit   = "DAYS"
                }
              }
            }
            ```

            Locking the rule with `time_rule_locked` is a separate hardening step that prevents the duration from being shortened later. It is optional for this check. If you add it, set it to a fixed RFC 3339 timestamp committed in your repository rather than `timeadd(timestamp(), ...)`, because `timestamp()` re-evaluates on every plan and produces a perpetual diff.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/usingretentionrules.htm
        title: OCI - Using Retention Rules
  - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-oci
    filters: asset.platform == "oci-objectstorage-bucket"
    mql: |
      oci.objectStorage.bucket.retentionRules.all(
        durationTimeUnit == "DAYS" && durationAmount >= 30 ||
        durationTimeUnit == "YEARS" && durationAmount >= 1
      )
  - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_objectstorage_bucket')
    mql: |
      # Each retention_rules block must declare a duration block whose time_unit/time_amount meet the minimum (>=30 DAYS or >=1 YEARS).
      terraform.resources('oci_objectstorage_bucket').all(
        blocks.where(type == 'retention_rules').all(
          blocks.where(type == 'duration') != empty &&
          blocks.where(type == 'duration').all(
            arguments['time_unit'] == 'DAYS' && arguments['time_amount'] >= 30 ||
            arguments['time_unit'] == 'YEARS' && arguments['time_amount'] >= 1
          )
        )
      )
  - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_objectstorage_bucket')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_objectstorage_bucket').all(
        change.after['retention_rules'] == null ||
        change.after['retention_rules'].all(
          _['duration'] != null && _['duration'].length > 0 &&
          _['duration'].all(
            _['time_unit'] == 'DAYS' && _['time_amount'] >= 30 ||
            _['time_unit'] == 'YEARS' && _['time_amount'] >= 1
          )
        )
      )
  - uid: mondoo-oci-security-object-storage-retention-duration-meets-minimum-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_objectstorage_bucket')
    mql: |
      terraform.state.resources.where(type == 'oci_objectstorage_bucket').all(
        values['retention_rules'] == null ||
        values['retention_rules'].all(
          _['duration'] != null && _['duration'].length > 0 &&
          _['duration'].all(
            _['time_unit'] == 'DAYS' && _['time_amount'] >= 30 ||
            _['time_unit'] == 'YEARS' && _['time_amount'] >= 1
          )
        )
      )
  - uid: mondoo-oci-security-iam-no-any-user-policies
    title: Ensure no IAM policies grant access to any-user
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-oci-security-iam-no-any-user-policies-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-iam-no-any-user-policies-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-no-any-user-policies-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-no-any-user-policies-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every IAM grant names a specific principal, by rejecting statements written against the `any-user` subject.

        OCI statements normally name their subject: `allow group <group> to ...`, `allow dynamic-group <group> to ...`, or `allow service <service> to ...`. The language also accepts `allow any-user to ...`, which matches every identity in the tenancy at once. Nothing prevents it, and OCI applies it exactly as written. Statements are edited under Identity & Security > Policies or with `oci iam policy update`, and this check inspects live statements alongside Terraform configuration, plans, and state.

        **Why this matters**

        The grant is only as narrow as the rest of the statement, and the rest is often not narrow. Paired with a wide scope, as in `allow any-user to read all-resources in tenancy`, it makes every resource in the tenancy readable by every principal that can reach the API, including service accounts created for one small job and any identity an attacker manages to obtain.

        It also erases the mechanism the rest of the model depends on. Groups and dynamic groups exist so access can be reasoned about by membership: you look at who is in the group and you know who holds the permission. An `any-user` statement makes that reasoning meaningless for the permissions it covers, because no membership decision changes who is allowed.

        Attribution suffers the same way. A permission granted to everyone traces back to no group, so audit records show an action any identity in the tenancy was entitled to take, which an investigator cannot narrow.

        These statements are unusually persistent. They tend to enter through a runbook or automation script that needed something working quickly, and are rarely revisited, so a temporary convenience becomes a standing overpermissive grant.

        Replace the subject with the named group, dynamic group, or service that genuinely needs the access, which limits the grant to the identities requiring it and restores an audit trail able to name the member who acted.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Identity & Security** > **Policies**.
        2. Select each policy in the tenancy (and in each compartment).
        3. Read the policy statements. Flag any statement that begins with `Allow any-user` without a narrowing service qualifier such as `Allow service <service-name>`.

        A passing policy contains no statements granting permissions to the bare `any-user` principal. A failing policy contains at least one statement of the form `Allow any-user to <verb> <resource> in <scope>`.

        ### Audit via CLI

        1. List all policies in the tenancy and search for `any-user` statements:

        ```bash
        oci iam policy list \
          --compartment-id <tenancy-ocid> \
          --all \
          --query 'data[].{Name:name, Statements:statements}' \
          --output json
        ```

        2. Search the output for statements matching the `any-user` pattern:

        ```bash
        oci iam policy list --compartment-id <tenancy-ocid> --all --output json | \
          python3 -c "import sys,json; [print(p['name'], s) for p in json.load(sys.stdin)['data'] for s in p['statements'] if 'any-user' in s.lower()]"
        ```

        A passing tenancy returns no output from that filter. A failing tenancy prints one or more policy names and the offending `any-user` statements.
      remediation:
        - id: console
          desc: |
            Remove or scope-down `any-user` grants:

            1. Open **Identity & Security** → **Policies** → select the flagged policy.
            2. Identify every statement beginning with `Allow any-user …`.
            3. Replace with a group-scoped statement (`Allow group <group-name> …`) or a service-principal statement (`Allow service <service-name> …`) matching the legitimate consumer.
            4. Remove the `any-user` statement entirely if no legitimate consumer can be identified.
        - id: cli
          desc: |
            List every policy in the tenancy and inspect statements:

            ```bash
            oci iam policy list --compartment-id <tenancy-ocid> --all --query "data[].{Name:name, Statements:statements}" --output json
            ```

            **Warning: `--statements` replaces the COMPLETE set of statements on the policy.** Whatever you pass becomes the entire statement list, so any statement you omit is silently dropped. Retrieve the current statements first, replace only the `any-user` statement, then resubmit every statement you want to keep.

            1. Export the current statements so you keep every statement you still need:

            ```bash
            oci iam policy get --policy-id <policy-ocid> --query 'data.statements' > statements.json
            ```

            2. Edit `statements.json`, replacing each `Allow any-user ...` statement with a group- or service-scoped one such as `Allow group <group-name> to read buckets in compartment <compartment-name>`. Resubmit the edited file so every statement you kept is preserved:

            ```bash
            oci iam policy update --policy-id <policy-ocid> \
              --statements file://statements.json
            ```
        - id: terraform
          desc: |
            Scope every `oci_identity_policy` statement to a specific group, dynamic group, or service principal — never the bare `any-user` principal:

            ```hcl
            resource "oci_identity_policy" "ops_readers" {
              compartment_id = var.tenancy_ocid
              name           = "OpsReaders"
              description    = "Read access for the operations team"

              statements = [
                "Allow group OpsReaders to read all-resources in compartment Workloads",
                "Allow service objectstorage-${var.region} to manage object-family in compartment Backups",
              ]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policysyntax.htm
        title: OCI - Policy Syntax
  - uid: mondoo-oci-security-iam-no-any-user-policies-oci
    filters: asset.platform == "oci-identity-policy"
    mql: |
      oci.identity.policy.parsedStatements.none(effect == "allow" && subjectType == "any-user")
  - uid: mondoo-oci-security-iam-no-any-user-policies-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "oci_identity_policy")
    mql: |
      terraform.resources("oci_identity_policy").none(
        arguments.statements.any(_ == /\ballow\s+(dynamic-group\s+|service\s+)?any-user\b/i)
      )
  - uid: mondoo-oci-security-iam-no-any-user-policies-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "oci_identity_policy")
    mql: |
      terraform.plan.resourceChanges.where(type == "oci_identity_policy").none(
        change.after.statements.any(_ == /\ballow\s+(dynamic-group\s+|service\s+)?any-user\b/i)
      )
  - uid: mondoo-oci-security-iam-no-any-user-policies-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "oci_identity_policy")
    mql: |
      terraform.state.resources.where(type == "oci_identity_policy").none(
        values.statements.any(_ == /\ballow\s+(dynamic-group\s+|service\s+)?any-user\b/i)
      )
  - uid: mondoo-oci-security-iam-no-cross-tenant-policies
    title: Ensure no IAM policies grant cross-tenancy access via Endorse or Admit
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-19
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-id-sc-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc9-2-1
      compliance/vda-isa-5: vda-isa-5-5-3-4
    variants:
      - uid: mondoo-oci-security-iam-no-cross-tenant-policies-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-iam-no-cross-tenant-policies-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-no-cross-tenant-policies-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-iam-no-cross-tenant-policies-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the tenancy's trust boundary is not extended to outside parties, by rejecting the `Endorse` and `Admit` statements that establish cross-tenancy access.

        Cross-tenancy access in OCI takes two statements working as a pair. `Endorse` is written in the source tenancy and exports a permission outward, declaring that its groups may act in another tenancy. `Admit` is written in the destination tenancy and accepts inbound principals, declaring which foreign subjects may operate on its resources. Neither is blocked by default, and both are ordinary statements managed under Identity & Security > Policies or through `oci iam policy update`. The check inspects live statements and Terraform configuration, plans, and state, since these grants often arrive as infrastructure code from a vendor.

        **Why this matters**

        An `Admit` statement lets principals you do not manage operate inside your compartments. You cannot see the other tenancy's group memberships, enforce MFA on its users, or revoke its credentials. Grants written broadly at onboarding tend to stay as written long after the integration they were for has narrowed or ended.

        That makes a partner's security posture part of yours. An attacker who compromises the remote tenancy inherits every `Admit` grant pointing at it and reaches your resources without ever touching your identities, passwords, or keys.

        `Endorse` carries the mirror-image risk. It sends your groups' permissions outward, so if the partner tenancy is breached your data moves through a path you authorized and cannot watch.

        The governance gap is what makes both dangerous in practice. Cross-tenancy statements typically arrive through a vendor onboarding runbook, applied by whoever ran the integration, and never reach the team accountable for access, so the grant exists with no owner and no review date.

        Inventory every `Endorse` and `Admit` statement on a regular cadence so lapsed partnerships leave no permanent access behind, and when a cross-tenancy grant is genuinely required, scope it to the narrowest resource type, verb, and compartment that makes the integration work.
      audit: |
        ### Audit via Console

        1. Open the OCI Console and navigate to **Identity & Security** > **Policies**.
        2. Select each policy in the tenancy root compartment (cross-tenancy policies must live at the root).
        3. Read the policy statements. Flag any statement that begins with `Endorse` or `Admit`.

        A passing policy contains no `Endorse` or `Admit` statements, or those present have been reviewed and carry documented business justification. A failing policy contains at least one `Endorse` or `Admit` statement with no confirmed current business need.

        ### Audit via CLI

        1. List all tenancy-level policies and search for cross-tenancy statements:

        ```bash
        oci iam policy list \
          --compartment-id <tenancy-ocid> \
          --all \
          --query 'data[?contains(join(`" "`, statements), `Endorse`) || contains(join(`" "`, statements), `Admit`)].{Name:name, Statements:statements}' \
          --output json
        ```

        A passing tenancy returns an empty list. A failing tenancy returns one or more policies whose statements include `Endorse` or `Admit` verbs.
      remediation:
        - id: console
          desc: |
            This check fails on the presence of ANY `Endorse` or `Admit` statement. The only way to make it pass is to remove every such statement. The single non-removal path is to retain the statement and file a documented exception for this check.

            Review and tighten cross-tenancy policy statements:

            1. Open **Identity & Security** → **Policies** → select the flagged policy.
            2. For each `Endorse` or `Admit` statement, confirm the remote tenancy OCID is still an active partner and the grant matches the current business need.
            3. Remove any statement whose business justification can no longer be demonstrated.
            4. Where a cross-tenancy grant is genuinely still required, narrow the resource and action scope, document the justification, and record an exception for this check. The check continues to report the policy as failing for as long as the statement remains, so the exception is the only supported way to keep it.
        - id: cli
          desc: |
            This check fails on the presence of ANY `Endorse` or `Admit` statement. The only way to make it pass is to remove every such statement. The single non-removal path is to retain the statement and file a documented exception for this check.

            List policies and find cross-tenancy statements:

            ```bash
            oci iam policy list --compartment-id <tenancy-ocid> --all \
              --query "data[?contains(join(' ', statements), 'Endorse') || contains(join(' ', statements), 'Admit')].{Name:name, Statements:statements}" \
              --output json
            ```

            Remove the cross-tenancy statements, replacing them with in-tenancy grants where access is still needed.

            **Warning: `--statements` replaces the COMPLETE set of statements on the policy.** Whatever you pass becomes the entire statement list, so any statement you omit is silently dropped. Retrieve the current statements first, remove only the `Endorse`/`Admit` statements, then resubmit every statement you want to keep.

            1. Export the current statements so you keep every statement you still need:

            ```bash
            oci iam policy get --policy-id <policy-ocid> --query 'data.statements' > statements.json
            ```

            2. Edit `statements.json`, removing the `Endorse` and `Admit` statements and leaving the rest untouched. Resubmit the edited file so every statement you kept is preserved:

            ```bash
            oci iam policy update --policy-id <policy-ocid> \
              --statements file://statements.json
            ```
        - id: terraform
          desc: |
            Prefer in-tenancy grants over cross-tenancy statements:

            ```hcl
            resource "oci_identity_policy" "in_tenancy" {
              compartment_id = var.tenancy_ocid
              name           = "AppReaders"
              description    = "Read access for the application team"

              statements = [
                "Allow group AppReaders to read objects in compartment AppData",
              ]
            }
            ```

            Any `oci_identity_policy` containing Endorse or Admit statements fails this check and must carry a documented exception.
    refs:
