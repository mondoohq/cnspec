          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-loadbalancer-no-weak-cipher-suites-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-loadbalancer-no-weak-cipher-suites-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-loadbalancer-no-weak-cipher-suites-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every HTTPS and HTTP/2 listener on an OCI load balancer is bound to a modern Oracle-managed cipher suite rather than one that still offers RC4, 3DES, or non-AEAD CBC-mode algorithms.

        A listener's SSL configuration names exactly one cipher suite. The check accepts `oci-modern-ssl-cipher-suite-v1`, `oci-default-ssl-cipher-suite-v1`, and the version-specific `oci-tls-1-2-*` and `oci-tls-1-3-*` suites. It rejects `oci-compatible-ssl-cipher-suite-v1`, which Oracle ships mainly for interoperability with old clients and which includes known-weak ciphers that make it unsuitable for production, along with any custom suite outside the approved names. Select the suite in the listener's SSL configuration under Networking > Load balancers > Listeners in the Console, or with `oci lb listener update`.

        **Why this matters**

        RC4 has well-documented statistical biases that let an attacker recover plaintext from enough captured sessions, and 3DES falls to the Sweet32 birthday attack at traffic volumes a busy listener reaches in hours. Neither is theoretical at the scale a public load balancer operates.

        CBC-mode suites without authenticated encryption leave ciphertext malleable, which is the condition padding-oracle attacks need to peel a session apart. Modern suites restrict negotiation to GCM and ChaCha20 authenticated encryption, where that condition does not exist.

        Weak suites also tend to permit static RSA key exchange. A session negotiated that way is decryptable by anyone who later obtains the server's private key, whether from a backup, a misfiled export, or a future compromise. The ECDHE key exchange that the modern suites require makes captured traffic worthless afterward, because the secret that would decrypt it no longer exists anywhere.

        There is no practical client left that needs these algorithms. By 2026, anything demanding them is past its end of life and should be rebuilt rather than accommodated at the load balancer edge, and removing the legacy fallback closes an entire class of negotiated-downgrade attack at the same time.
      audit: |
        ### Audit via Console

        1. Open **Networking** → **Load Balancers** and select the load balancer.
        2. Select **SSL Cipher Suites** from the left-hand menu.
        3. For each HTTPS or HTTP/2 listener, verify that the assigned cipher suite is one of: `oci-modern-ssl-cipher-suite-v1`, `oci-default-ssl-cipher-suite-v1`, or a suite matching the pattern `oci-tls-1-2-*` or `oci-tls-1-3-*`.

        A passing listener shows a modern Oracle-managed cipher suite name. A failing listener shows `oci-compatible-ssl-cipher-suite-v1` or a custom suite name that includes weak ciphers.

        ### Audit via CLI

        1. Retrieve the listener configuration for the load balancer and inspect the `ssl-configuration.cipher-suite-name` field:

        ```bash
        oci lb load-balancer get \
          --load-balancer-id <lb-ocid> \
          --query 'data.listeners.*.{name:name,protocol:protocol,cipherSuite:"ssl-configuration"."cipher-suite-name"}'
        ```

        A passing listener returns a cipher suite name of `oci-modern-ssl-cipher-suite-v1`, `oci-default-ssl-cipher-suite-v1`, or a suite prefixed with `oci-tls-1-2-` or `oci-tls-1-3-`. A failing listener returns `oci-compatible-ssl-cipher-suite-v1` or another weak suite name.
      remediation:
        - id: console
          desc: |
            Switch the listener to a modern cipher suite:

            1. Open **Networking** → **Load Balancers** → select the load balancer → **SSL Cipher Suites**.
            2. Change the listener's cipher suite to `oci-modern-ssl-cipher-suite-v1` (or the appropriate `oci-tls-1-2-*` / `oci-tls-1-3-*` variant for your compliance context).
            3. Test with a non-legacy client to confirm handshakes still succeed before rolling out broadly.
        - id: cli
          desc: |
            Update a listener to use a modern cipher suite:

            ```bash
            oci lb listener update \
              --load-balancer-id <lb-ocid> \
              --listener-name <listener-name> \
              --protocol HTTPS \
              --port 443 \
              --default-backend-set-name <backend> \
              --ssl-certificate-name <cert-name> \
              --cipher-suite-name oci-modern-ssl-cipher-suite-v1 \
              --protocols '["TLSv1.2","TLSv1.3"]'
            ```
        - id: terraform
          desc: |
            Set `cipher_suite_name` on every HTTPS / HTTP2 listener's `ssl_configuration` block to a modern Oracle-managed suite:

            ```hcl
            resource "oci_load_balancer_listener" "https" {
              load_balancer_id         = oci_load_balancer_load_balancer.app.id
              name                     = "https"
              default_backend_set_name = oci_load_balancer_backend_set.app.name
              protocol                 = "HTTPS"
              port                     = 443

              ssl_configuration {
                certificate_name  = oci_load_balancer_certificate.app.certificate_name
                cipher_suite_name = "oci-modern-ssl-cipher-suite-v1"
                protocols         = ["TLSv1.2", "TLSv1.3"]
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Balance/References/predefinedsslciphersuites.htm
        title: OCI - Predefined SSL Cipher Suites
  - uid: mondoo-oci-security-loadbalancer-no-weak-cipher-suites-oci
    filters: asset.platform == "oci-loadbalancer"
    mql: |
      oci.loadBalancer.loadBalancer.listeners.where(protocol.in(["HTTPS", "HTTP2"])).all(
        sslCipherSuite.name.downcase == /^oci-modern-ssl-cipher-suite-v1$|^oci-tls-1-2-[a-z0-9-]+$|^oci-tls-1-3-[a-z0-9-]+$|^oci-default-ssl-cipher-suite-v1$/
      )
  - uid: mondoo-oci-security-loadbalancer-no-weak-cipher-suites-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_load_balancer_listener')
    mql: |
      terraform.resources('oci_load_balancer_listener')
        .where(arguments['protocol'].in(['HTTPS', 'HTTP2']) || blocks.where(type == "ssl_configuration") != empty)
        .all(
          blocks.where(type == 'ssl_configuration') != empty &&
          blocks.where(type == 'ssl_configuration').all(
            arguments['cipher_suite_name'] != null &&
            arguments['cipher_suite_name'].downcase == /^oci-modern-ssl-cipher-suite-v1$|^oci-tls-1-2-[a-z0-9-]+$|^oci-tls-1-3-[a-z0-9-]+$|^oci-default-ssl-cipher-suite-v1$/
          )
        )
  - uid: mondoo-oci-security-loadbalancer-no-weak-cipher-suites-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_load_balancer_listener')
    mql: |
      terraform.plan.resourceChanges
        .where(type == 'oci_load_balancer_listener')
        .where(change.after['protocol'].in(['HTTPS', 'HTTP2']))
        .all(
          change.after['ssl_configuration'] != null && change.after['ssl_configuration'].length > 0 &&
          change.after['ssl_configuration'].all(
            _['cipher_suite_name'] != null &&
            _['cipher_suite_name'].downcase == /^oci-modern-ssl-cipher-suite-v1$|^oci-tls-1-2-[a-z0-9-]+$|^oci-tls-1-3-[a-z0-9-]+$|^oci-default-ssl-cipher-suite-v1$/
          )
        )
  - uid: mondoo-oci-security-loadbalancer-no-weak-cipher-suites-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_load_balancer_listener')
    mql: |
      terraform.state.resources
        .where(type == 'oci_load_balancer_listener')
        .where(values['protocol'].in(['HTTPS', 'HTTP2']))
        .all(
          values['ssl_configuration'] != null && values['ssl_configuration'].length > 0 &&
          values['ssl_configuration'].all(
            _['cipher_suite_name'] != null &&
            _['cipher_suite_name'].downcase == /^oci-modern-ssl-cipher-suite-v1$|^oci-tls-1-2-[a-z0-9-]+$|^oci-tls-1-3-[a-z0-9-]+$|^oci-default-ssl-cipher-suite-v1$/
          )
        )
  # No Terraform variants: this is a per-load-balancer existence check (each LB with an HTTP listener must also have an HTTPS / HTTP2 listener) that requires aggregating `oci_load_balancer_listener` resources by their `load_balancer_id` reference. Cross-resource grouping is fragile in HCL/plan/state and unsupported by the patterns used elsewhere in this file.
  - uid: mondoo-oci-security-loadbalancer-http-listener-has-https
    title: Ensure load balancers that run HTTP listeners also expose HTTPS
    impact: 70
    filters: |
      asset.platform == "oci-loadbalancer" &&
      oci.loadBalancer.loadBalancer.listeners.any(protocol == "HTTP")
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      oci.loadBalancer.loadBalancer.listeners.any(protocol.in(["HTTPS", "HTTP2"]))
    docs:
      desc: |
        This check verifies that any OCI load balancer publishing an HTTP listener also publishes at least one HTTPS or HTTP/2 listener, so the service has an encrypted path clients can be moved onto.

        A load balancer answering only on plain HTTP gives the application no transport security to offer. Credentials, session cookies, and form submissions cross every network between the client and the load balancer in cleartext. Add a TLS listener under Networking > Load balancers > Listeners in the Console with protocol `HTTPS` or `HTTP2` and an SSL configuration that references a certificate, or run `oci lb listener create` with the same values. The check is satisfied once one such listener exists. It does not require the HTTP listener to be removed, since serving a redirect is a legitimate reason to keep it.

        **Why this matters**

        Anything an authenticated session carries over HTTP is recoverable by any observer on the path, and the path is longer than it looks: shared Wi-Fi, the customer's ISP, and every transit network in between. A stolen session cookie needs no password to replay.

        Redirecting HTTP clients to HTTPS requires somewhere to redirect them to. With no HTTPS listener the application cannot enforce transport security at all, and the headers that would carry that enforcement are inert. HSTS, CSP, and the `Secure` cookie attribute mean something only when the response carrying them arrived over TLS.

        Cleartext responses are modifiable in flight, not merely readable. An attacker on the path can inject a script, a tracking pixel, or a redirect into a page the user believes came from you, which turns passive eavesdropping into active compromise of the browser session.

        Browsers and search crawlers increasingly flag HTTP-only endpoints as insecure, so an unencrypted listener costs user trust and discoverability on top of the exposure. Once the HTTPS listener exists, follow it by redirecting the HTTP listener to it rather than leaving both serving content.
      audit: |
        ### Audit via Console

        1. Open **Networking** → **Load Balancers** and select each load balancer.
        2. Select **Listeners** from the left-hand menu.
        3. Check whether the listener list includes at least one listener with **Protocol: HTTP**.
        4. If an HTTP listener is present, verify that the same load balancer also has at least one listener with **Protocol: HTTPS** or **Protocol: HTTP2**.

        A passing load balancer either has no HTTP listener, or has an HTTP listener accompanied by at least one HTTPS or HTTP/2 listener. A failing load balancer has an HTTP listener with no HTTPS or HTTP/2 listener on the same load balancer.

        ### Audit via CLI

        1. Retrieve the listener list for each load balancer and inspect the protocols in use:

        ```bash
        oci lb load-balancer get \
          --load-balancer-id <lb-ocid> \
          --query 'data.listeners.*.{name:name,protocol:protocol}'
        ```

        A passing load balancer returns a list that, if it contains a listener with `protocol: HTTP`, also contains at least one listener with `protocol: HTTPS` or `protocol: HTTP2`. A failing load balancer returns a list with `HTTP` but no `HTTPS` or `HTTP2` entry.
      remediation:
        - id: console
          desc: |
            Add an HTTPS listener to the load balancer:

            1. Open **Networking** → **Load Balancers** → select the LB → **Listeners**.
            2. Select **Create Listener** → **Protocol: HTTPS** → **Port: 443**.
            3. Attach an SSL certificate (BYO certificate or Oracle Certificate Authority).
            4. Select a modern SSL configuration (TLS 1.2+, `oci-modern-ssl-cipher-suite-v1`).
            5. Route to the same backend set as the HTTP listener, or add an application-layer redirect to HTTPS.
        - id: cli
          desc: |
            Create an HTTPS listener on the existing load balancer:

            ```bash
            oci lb listener create \
              --load-balancer-id <lb-ocid> \
              --name https-listener \
              --protocol HTTPS \
              --port 443 \
              --default-backend-set-name <backend> \
              --ssl-certificate-name <cert-name> \
              --cipher-suite-name oci-modern-ssl-cipher-suite-v1 \
              --protocols '["TLSv1.2","TLSv1.3"]'
            ```
        # No Terraform remediation: this check requires cross-resource correlation — grouping `oci_lb_listener` resources by their `load_balancer_id` and asserting that each group containing an HTTP listener also contains an HTTPS listener — which has no clean equivalent in HCL/plan/state without unsupported cross-resource graph traversal.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Balance/Tasks/managinglisteners.htm
        title: OCI - Managing Listeners
  - uid: mondoo-oci-security-oke-public-endpoint-disabled
    title: Ensure OKE cluster Kubernetes API endpoints are not exposed to the internet
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-oke-public-endpoint-disabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-oke-public-endpoint-disabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-public-endpoint-disabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-public-endpoint-disabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the Kubernetes API server of every Oracle Kubernetes Engine (OKE) cluster is reachable only from inside the virtual cloud network, with no public IP address on its endpoint.

        A cluster's endpoint configuration decides whether the control plane receives a public address alongside its private one. Oracle assigns a public endpoint when `is_public_ip_enabled` is not explicitly set to false, so a cluster provisioned without deliberate network hardening is internet-exposed from its first minute. The check requires that configuration to exist and to disable the public IP; the Terraform versions insist on the `endpoint_config` block being declared at all, because a manifest that omits it silently inherits Oracle's public default. The setting is chosen at creation time under Developer Services > Kubernetes Clusters (OKE) in the cluster's network configuration.

        **Why this matters**

        The API server is the single most privileged endpoint in any cluster. Whoever reaches `kube-apiserver` with a valid credential, or with an exploitable bug, controls every namespace and workload: reading every secret, scheduling a privileged pod that mounts the host filesystem, and executing commands inside running containers.

        Kubernetes ships auth-bypass, SSRF, and privilege-escalation fixes on a regular cadence. A public endpoint converts each disclosure into an immediate internet-wide attack window in which the only defense is how quickly Oracle patches the control plane. Between CVEs the endpoint is still continuously scanned, and kubeconfig credentials leaked from a laptop or a CI log get replayed against it by automated credential-stuffing tools.

        Even the traffic that fails costs something, filling audit logs with noise that hides real authentication events and consuming control-plane request capacity that legitimate controllers need.

        With the public IP removed, administrators reach the cluster through an OCI Bastion session, an IPSec VPN or FastConnect circuit, or a peered VCN, every one of which is identity-gated and auditable. The practical effect on the next Kubernetes CVE is that exploiting it requires network adjacency rather than an internet route.
      audit: |
        ### Audit via Console

        1. Open **Developer Services** → **Kubernetes Clusters (OKE)**.
        2. Select the cluster and navigate to **Cluster Details**.
        3. Under **Kubernetes API endpoint**, review the **Endpoint type** field.

        A passing cluster shows **Private endpoint** as the endpoint type, with no public IP assigned to the Kubernetes API server. A failing cluster shows **Public endpoint** or has a public IP address listed next to the API server address.

        ### Audit via CLI

        1. List clusters and inspect the `endpoint-config.is-public-ip-enabled` field:

        ```bash
        oci ce cluster list \
          --compartment-id <compartment-ocid> \
          --query 'data[*].{id:id,name:name,publicIpEnabled:"endpoint-config"."is-public-ip-enabled"}'
        ```

        A passing cluster returns `"publicIpEnabled": false`. A failing cluster returns `"publicIpEnabled": true` or `null` (Oracle defaults to a public endpoint when the field is absent).
      remediation:
        - id: console
          desc: |
            Disable the public IP on the cluster's Kubernetes API endpoint:

            1. Open **Developer Services** → **Kubernetes Clusters (OKE)** → select the cluster.
            2. Select **Edit** on the cluster details page.
            3. Under **Kubernetes API endpoint**, switch off **Assign a public IP address to the API endpoint**.
            4. Select **Update** and wait for the cluster to become active again.
            5. Access the private endpoint via OCI Bastion, a VPN gateway, or VCN peering. Clusters that are not VCN-native must be recreated with a VCN-native private endpoint.
        - id: cli
          desc: |
            Disable the public IP on the cluster's API endpoint in place:

            ```bash
            oci ce cluster update-endpoint-config \
              --cluster-id <cluster-ocid> \
              --is-public-ip-enabled false
            ```

            This applies to VCN-native clusters. Clusters without a VCN-native endpoint must be recreated with a private endpoint subnet.
        - id: terraform
          desc: |
            Declare an `endpoint_config` block on every `oci_containerengine_cluster` and set `is_public_ip_enabled = false`, with the endpoint anchored in a private subnet:

            ```hcl
            resource "oci_containerengine_cluster" "main" {
              compartment_id     = var.compartment_ocid
              name               = "prod"
              vcn_id             = oci_core_vcn.main.id
              kubernetes_version = var.kubernetes_version # use a currently supported OKE version

              endpoint_config {
                subnet_id            = oci_core_subnet.api_endpoint_private.id
                is_public_ip_enabled = false
                nsg_ids              = [oci_core_network_security_group.api_endpoint.id]
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm
        title: OCI - OKE Network Configuration
  - uid: mondoo-oci-security-oke-public-endpoint-disabled-oci
    filters: asset.platform == "oci-oke-cluster"
    mql: |
      oci.oke.cluster.isPublicEndpointEnabled == false
  - uid: mondoo-oci-security-oke-public-endpoint-disabled-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_containerengine_cluster')
    mql: |
      # Cluster must declare an endpoint_config block with is_public_ip_enabled = false. Without the existence guard, clusters that omit endpoint_config (Oracle defaults to a public endpoint) would silently pass.
      terraform.resources('oci_containerengine_cluster').all(
        blocks.where(type == 'endpoint_config') != empty &&
        blocks.where(type == 'endpoint_config').all(
          arguments['is_public_ip_enabled'] == false
        )
      )
  - uid: mondoo-oci-security-oke-public-endpoint-disabled-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_containerengine_cluster')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_containerengine_cluster').all(
        change.after['endpoint_config'] != null && change.after['endpoint_config'].length > 0 &&
        change.after['endpoint_config'].all(
          _['is_public_ip_enabled'] == false
        )
      )
  - uid: mondoo-oci-security-oke-public-endpoint-disabled-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_containerengine_cluster')
    mql: |
      terraform.state.resources.where(type == 'oci_containerengine_cluster').all(
        values['endpoint_config'] != null && values['endpoint_config'].length > 0 &&
        values['endpoint_config'].all(
          _['is_public_ip_enabled'] == false
        )
      )
  # No Terraform variants: `availableKubernetesUpgrades` is runtime telemetry derived from Oracle's supported-version list at scan time; no `oci_containerengine_cluster` argument exposes the count of pending upgrades.
  - uid: mondoo-oci-security-oke-supported-kubernetes-version
    title: Ensure OKE clusters run a supported Kubernetes version
    impact: 70
    filters: asset.platform == "oci-oke-cluster"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-7
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      oci.oke.cluster.availableKubernetesUpgrades.length < 3
    docs:
      desc: |
        This check verifies that OKE clusters run a Kubernetes version still inside Oracle's supported release window rather than one that has drifted toward or past its end-of-support date.

        Oracle Kubernetes Engine (OKE) publishes the upgrade targets available to each cluster, and the length of that list measures how far behind the control plane has fallen. The check fails a cluster with three or more upgrades pending, which places it at least three releases behind current and near or past the point where Oracle stops shipping security backports for it. The Console shows the same state as an Upgrade Available banner on the cluster's detail page. Control plane and node pools move separately: `oci ce cluster update --kubernetes-version` advances the control plane, and each node pool then needs its own upgrade or a recreate of its nodes.

        **Why this matters**

        Oracle backports security fixes only to supported minor versions. Once a cluster falls out of that window it accumulates every CVE disclosed after its drop date with no remediation path short of a major version upgrade, exactly the sort of disruptive change teams keep deferring, so the gap widens rather than closes.

        The vulnerability classes involved are not cosmetic. Many Kubernetes CVEs are auth-bypass or privilege-escalation flaws, which makes an unpatched cluster a tenant-to-tenant pivot in shared infrastructure: a workload that should only ever see its own namespace becomes a route into the rest of the estate.

        Falling behind destabilizes the cluster on its own terms too. Large gaps between the control plane version and the version running on node pools produce feature incompatibilities that surface as failing workloads or degraded scheduling long before anyone connects the symptom to version skew. Regulatory and contractual obligations also routinely require running supported, patched software, so an end-of-life cluster is a compliance finding as well as a security one.

        Staying inside the window, ideally within two releases of the newest version OKE offers, keeps security backports flowing, keeps the cluster eligible for Oracle support and incident response, and replaces emergency major-version migrations with routine incremental upgrades.
      audit: |
        ### Audit via Console

        1. Open **Developer Services** → **Kubernetes Clusters (OKE)**.
        2. Select the cluster and review **Cluster Details**.
        3. Check the **Kubernetes version** field and look for an **Upgrade Available** banner or notification indicating pending version upgrades.
        4. If three or more upgrades are available, the cluster is running a version that is significantly behind Oracle's current supported releases.

        A passing cluster shows fewer than three available Kubernetes version upgrades. A failing cluster shows three or more pending upgrades listed in the upgrade path.

        ### Audit via CLI

        1. Retrieve cluster details and inspect `available-kubernetes-upgrades`:

        ```bash
        oci ce cluster get \
          --cluster-id <cluster-ocid> \
          --query 'data.{version:"kubernetes-version",availableUpgrades:"available-kubernetes-upgrades"}'
        ```

        A passing cluster returns an `availableUpgrades` list with fewer than three entries. A failing cluster returns a list with three or more version strings.
      remediation:
        - id: console
          desc: |
            Upgrade OKE clusters to a supported version:

            1. Open **Developer Services** → **Kubernetes Clusters (OKE)** → select the cluster.
            2. **Upgrade Available** → review the target version and upgrade path.
            3. Upgrade the control plane first, then each node pool (recreate nodes or use blue/green rollout).
            4. Confirm the cluster is within two releases of the newest version OKE offers, which is what keeps it on a supported track.
        - id: cli
          desc: |
            Upgrade the OKE control plane:

            ```bash
            oci ce cluster update --cluster-id <cluster-ocid> --kubernetes-version <new-version>
            ```
        # No Terraform remediation: `availableKubernetesUpgrades` is runtime telemetry derived from Oracle's supported-version list at scan time; no `oci_containerengine_cluster` Terraform argument exposes the count of pending upgrades, so there is no static HCL change that resolves this finding.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengupgradingk8smasternode.htm
        title: OCI - Upgrading Kubernetes on a Cluster
  - uid: mondoo-oci-security-oke-image-policy-enabled
    title: Ensure OKE clusters enable container image signature verification
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ais-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-21
      compliance/nis-2: nis-2-21-2-d
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-id-ra-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-8-5
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-oci-security-oke-image-policy-enabled-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-oke-image-policy-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-image-policy-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-image-policy-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that container image signature verification is enforced on every OKE cluster, so that only images signed by a key the cluster trusts are admitted to run.

        An Oracle Kubernetes Engine (OKE) image verification policy binds a cluster to one or more master encryption keys held in OCI Vault. With the policy enabled, the cluster resolves each image's signature in OCI Container Registry and refuses to create the container when the signature is absent or was produced by a key outside that list. The check requires the image policy configuration to exist and to be enabled, since a cluster that never declares one accepts whatever a pod spec names. Enable it under Developer Services > Kubernetes Clusters (OKE) > Image Verification Policies, or with `oci ce cluster update --image-policy-config`, and add at least one Key Management master encryption key as the signing authority.

        **Why this matters**

        Without a signature gate, the cluster pulls and runs any image reference with no authenticity verification at all. A compromised registry, a typo-squatted image name, or a man-in-the-middle during the pull silently substitutes a malicious image for a trusted one, and nothing in the deployment path notices.

        The manifest is as soft a target as the registry. An attacker with write access to a Helm chart, a Kustomize overlay, or a CI pipeline can swap an image reference without ever touching the running cluster, and the change reads as an ordinary version bump in review. Widely used public base images have themselves been trojanized through maintainer account takeover, injecting malicious code into images that thousands of clusters pull on the next deploy.

        Signature verification puts a cryptographic requirement in front of all of those paths. Substituting an image no longer means pushing to a registry or rewriting a manifest; it means forging or stealing a signing key held in Vault, a far narrower and far better guarded target. That verifiable chain of custody from build to deploy is also what supply-chain frameworks such as SLSA ask for.

        Restrict use of the signing key so only the build pipeline can sign, and pair the policy with a rule requiring images come from the tenancy's own registry, since verification covers only what the named keys actually signed.
      audit: |
        ### Audit via Console

        1. Open **Developer Services** → **Kubernetes Clusters (OKE)**.
        2. Select the cluster and navigate to **Image Verification Policies** (or review **Cluster Details** → **Image policy**).
        3. Confirm that **Enable image verification** is toggled on and that at least one KMS signing key is listed.

        A passing cluster shows image verification enabled with one or more signing keys configured. A failing cluster shows image verification disabled or no signing keys present.

        ### Audit via CLI

        1. Retrieve cluster details and inspect the `image-policy-config` field:

        ```bash
        oci ce cluster get \
          --cluster-id <cluster-ocid> \
          --query 'data.{imagePolicyEnabled:"image-policy-config"."is-policy-enabled",keyDetails:"image-policy-config"."key-details"}'
        ```

        A passing cluster returns `"imagePolicyEnabled": true` with at least one entry in `keyDetails`. A failing cluster returns `"imagePolicyEnabled": false` or `null`.
      remediation:
        - id: console
          desc: |
            Enable image policy on the cluster and configure signing keys:

            1. Open **Developer Services** → **Kubernetes Clusters (OKE)** → select the cluster → **Image Verification Policies**.
            2. Toggle **Enable image verification**.
            3. Add at least one **Key Management (KMS) master encryption key** from an approved signing authority.
            4. Verify by attempting to deploy an unsigned image. OKE should reject the pod.
        - id: cli
          desc: |
            Update the cluster to enable image policy and attach signing keys:

            ```bash
            oci ce cluster update \
              --cluster-id <cluster-ocid> \
              --image-policy-config '{"isPolicyEnabled":true,"keyDetails":[{"kmsKeyId":"<kms-key-ocid>"}]}'
            ```
        - id: terraform
          desc: |
            Declare an `image_policy_config` block with `is_policy_enabled = true` and at least one signing key:

            ```hcl
            resource "oci_containerengine_cluster" "main" {
              compartment_id     = var.compartment_ocid
              name               = "prod"
              vcn_id             = oci_core_vcn.main.id
              kubernetes_version = var.kubernetes_version # use a currently supported OKE version

              image_policy_config {
                is_policy_enabled = true

                key_details {
                  kms_key_id = oci_kms_key.image_signing.id
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/contengsigningimages_topic-Signing_Container_Images_Using_OCI_Registry.htm
        title: OCI - Signing Container Images
  - uid: mondoo-oci-security-oke-image-policy-enabled-oci
    filters: asset.platform == "oci-oke-cluster"
    mql: |
      oci.oke.cluster.isImagePolicyEnabled == true
  - uid: mondoo-oci-security-oke-image-policy-enabled-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_containerengine_cluster')
    mql: |
      # Cluster must declare an image_policy_config block with is_policy_enabled = true. Without the existence guard, clusters that omit image_policy_config would silently pass.
      terraform.resources('oci_containerengine_cluster').all(
        blocks.where(type == 'image_policy_config') != empty &&
        blocks.where(type == 'image_policy_config').all(
          arguments['is_policy_enabled'] == true
        )
      )
  - uid: mondoo-oci-security-oke-image-policy-enabled-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_containerengine_cluster')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_containerengine_cluster').all(
        change.after['image_policy_config'] != null && change.after['image_policy_config'].length > 0 &&
        change.after['image_policy_config'].all(
          _['is_policy_enabled'] == true
        )
      )
  - uid: mondoo-oci-security-oke-image-policy-enabled-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_containerengine_cluster')
    mql: |
      terraform.state.resources.where(type == 'oci_containerengine_cluster').all(
        values['image_policy_config'] != null && values['image_policy_config'].length > 0 &&
        values['image_policy_config'].all(
          _['is_policy_enabled'] == true
        )
      )
  # No Terraform variants: requires cross-resource lookup from `oci_containerengine_node_pool` to its referenced `oci_core_subnet` to read `prohibit_public_ip_on_vnic`. Cross-resource graph traversal is fragile in HCL/plan/state and unsupported by the patterns used elsewhere in this file.
  - uid: mondoo-oci-security-oke-node-pool-private-subnets
    title: Ensure OKE node pool worker nodes are placed in private subnets
    impact: 80
    filters: asset.platform == "oci-oke-cluster"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      oci.oke.cluster.nodePools.all(
        subnets.all(prohibitPublicIpOnVnic == true)
      )
    docs:
      desc: |
        This check verifies that OKE worker nodes cannot be given a public IP address, by requiring every subnet a node pool uses to prohibit public IPs on its VNICs.

        Oracle Kubernetes Engine (OKE) worker nodes inherit their internet reachability from the subnet they sit in. A subnet created with `prohibitPublicIpOnVnic = true`, returned by the API as `prohibitPublicIpOnVnic: true`, refuses to assign a public IP to any VNIC placed in it, which is the structural form of a private subnet; a subnet without the flag lets a worker node come up with a public address. The check requires the flag on every subnet backing every node pool. It is fixed when the subnet is created under Networking > Virtual Cloud Networks, so a public worker subnet is corrected by building a private subnet and moving the node pool, not by editing the existing one.

        **Why this matters**

        A worker node with a public IP puts the kubelet on port 10250, the container runtime socket, and any pod using `hostPort` or `hostNetwork` directly in front of internet scanning and exploitation. These are not endpoints designed to survive hostile exposure; the kubelet's read and exec surfaces exist for the control plane to use over a trusted network.

        A single worker is a rich prize. A foothold there typically yields in-memory service-account tokens, secrets cached by running pods, and a lateral path into the rest of the cluster, so the node's exposure is really the cluster's exposure.

        Public-addressed workers also route outbound traffic straight to the internet, bypassing the NAT gateway and service gateway paths where egress is logged, filtered, and alarmed. That removes the one place where command-and-control or exfiltration traffic from a compromised pod would have been visible.

        Because the prohibition lives on the subnet rather than the node pool, it holds even when pools are replaced, scaled, or added, a failure mode no node-pool-level setting covers. Administrators reach private workers through a bastion host or an OCI Bastion session, and inbound application traffic arrives through a load balancer in a separate public subnet, so nothing legitimate requires a worker node to hold a public IP.
      audit: |
        ### Audit via Console

        1. Open **Developer Services** → **Kubernetes Clusters (OKE)** and select the cluster.
        2. Navigate to **Node Pools** and select each node pool.
        3. Under **Node Pool Details**, locate the **Subnets** used for worker placement.
        4. For each listed subnet, navigate to **Networking** → **Virtual Cloud Networks** → the VCN → **Subnets** → the subnet, and verify that **Prohibit public IP on VNIC** is set to **Yes**.

        A passing node pool uses only subnets with **Prohibit public IP on VNIC: Yes**. A failing node pool references at least one subnet where **Prohibit public IP on VNIC** is set to **No**.

        ### Audit via CLI

        1. List node pools for the cluster and retrieve the subnet IDs used in placement configs:

        ```bash
        oci ce node-pool list \
          --cluster-id <cluster-ocid> \
          --compartment-id <compartment-ocid> \
          --query 'data[*].{id:id,name:name,placements:"node-config-details"."placement-configs"[*]."subnet-id"}'
        ```

        2. For each subnet ID returned, verify the `prohibit-public-ip-on-vnic` flag:

        ```bash
        oci network subnet get \
          --subnet-id <subnet-ocid> \
          --query 'data.{subnetId:id,prohibitPublicIp:"prohibit-public-ip-on-vnic"}'
        ```

        A passing subnet returns `"prohibitPublicIp": true`. A failing subnet returns `"prohibitPublicIp": false`.
      remediation:
        - id: console
          desc: |
            Move the node pool to private subnets:

            1. Identify or create subnets with **Prohibit public IP on VNIC** set to **Yes** in the cluster's VCN.
            2. Open **Developer Services** → **Kubernetes Clusters (OKE)** → select the cluster → **Node Pools** → select the node pool.
            3. Select **Edit** and update the **Placement configuration** to target subnets with **Prohibit public IP on VNIC** set to **Yes**.
            4. Save the change. Existing worker nodes are terminated and replaced in the new subnets, so cordon and drain workloads before saving.
        - id: cli
          desc: |
            Update the node pool placement configuration to a private subnet. Existing worker nodes are terminated and recreated in the new subnet, so cordon and drain workloads first:

            ```bash
            oci ce node-pool update \
              --node-pool-id <node-pool-ocid> \
              --placement-configs '[{"availabilityDomain":"<AD>","subnetId":"<private-subnet-ocid>"}]'
            ```
        - id: terraform
          desc: |
            Place node pool workers in subnets that prohibit public IPs on VNICs:

            ```hcl
            resource "oci_core_subnet" "workers_private" {
              compartment_id             = var.compartment_ocid
              vcn_id                     = oci_core_vcn.cluster.id
              cidr_block                 = "10.0.10.0/24"
              prohibit_public_ip_on_vnic = true
              prohibit_internet_ingress  = true
            }

            resource "oci_containerengine_node_pool" "app" {
              cluster_id         = oci_containerengine_cluster.app.id
              compartment_id     = var.compartment_ocid
              kubernetes_version = var.k8s_version
              name               = "app-pool"
              node_shape         = "VM.Standard.E4.Flex"

              node_config_details {
                placement_configs {
                  availability_domain = var.availability_domain
                  subnet_id           = oci_core_subnet.workers_private.id
                }
                size = 3
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm
        title: OCI - Network resource configuration for Kubernetes clusters
  - uid: mondoo-oci-security-oke-node-pool-nsgs-attached
    title: Ensure OKE node pool worker nodes have NSGs attached
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-oke-node-pool-nsgs-attached-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-oke-node-pool-nsgs-attached-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-node-pool-nsgs-attached-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-oke-node-pool-nsgs-attached-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every OKE node pool has at least one Network Security Group attached to its worker node VNICs, so that node traffic has a firewall boundary of its own rather than only the subnet's security lists.

        A Network Security Group (NSG) is a per-VNIC rule set that follows the resources placed in it, while a security list applies to every VNIC in the subnet regardless of what runs there. The check requires the node pool's network configuration to name at least one NSG, and the Terraform versions require the node configuration block to exist with a non-empty `nsg_ids` list, since a node pool that omits the block gets no NSG at all. Attach one in the node pool's network settings under Developer Services > Kubernetes Clusters (OKE), or through the node configuration details passed to `oci ce node-pool update`.

        **Why this matters**

        With only a security list in play, the rules governing worker nodes are the rules governing everything else in the subnet, including non-OKE workloads. Tightening them to what the kubelet and CNI actually need risks breaking a neighboring service, so in practice the rules stay looser than the node pool warrants and nobody can safely narrow them.

        The two rule types also differ in what they can express. Security list rules are IP-range based, whereas NSG rules can name another NSG as their source or destination. Rules written against the load balancer NSG or the cluster API NSG stay correct as addresses change, while IP-range rules drift out of sync with the infrastructure they were meant to describe and are then widened to compensate.

        The failure is quiet, too. One overly permissive rule added to a shared subnet's security list widens the node pool's exposure with no signal at the node pool level, because nothing in the pool's own configuration records the change.

        Attaching an NSG does not by itself narrow anything: OCI permits traffic that either the subnet's security lists or an attached NSG allows. Treat this as the prerequisite step, then pare the shared security list back to the minimum so the NSG becomes the layer that actually decides what reaches the nodes.
      audit: |
        ### Audit via Console

        1. Open **Developer Services** → **Kubernetes Clusters (OKE)** and select the cluster.
        2. Navigate to **Node Pools** and select each node pool.
        3. Under **Advanced options**, review the **Network security groups** field.

        A passing node pool shows at least one NSG listed under **Network security groups**. A failing node pool shows no NSGs attached.

        ### Audit via CLI

        1. List node pools and inspect the `nsg-ids` field within `node-config-details`:

        ```bash
        oci ce node-pool list \
          --cluster-id <cluster-ocid> \
          --compartment-id <compartment-ocid> \
          --query 'data[*].{id:id,name:name,nsgIds:"node-config-details"."nsg-ids"}'
        ```

        A passing node pool returns a non-empty `nsgIds` list containing at least one NSG OCID. A failing node pool returns an empty list or `null` for `nsgIds`.
      remediation:
        - id: console
          desc: |
            Attach an NSG to the node pool:

            1. Open **Developer Services** → **Kubernetes Clusters (OKE)** → select the cluster → **Node Pools** → select the node pool.
            2. Click **Edit** → expand **Advanced options** → **Network security groups**.
            3. Select an existing NSG (or create one) that defines the desired ingress and egress rules for worker nodes.
            4. Save. New nodes provisioned by the pool inherit the NSG; existing nodes pick up the NSG on the next cycle.
        - id: cli
          desc: |
            Attach an NSG to the node pool. New nodes provisioned by the pool inherit the NSG; existing nodes pick up the NSG on the next cycle.

            ```bash
            oci ce node-pool update \
              --node-pool-id <node-pool-ocid> \
              --nsg-ids '["<nsg-ocid>"]'
            ```
        - id: terraform
          desc: |
            Configure each `oci_containerengine_node_pool` with `nsg_ids` inside `node_config_details`:

            ```hcl
            resource "oci_core_network_security_group" "oke_workers" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.cluster.id
              display_name   = "oke-workers"
            }

            resource "oci_containerengine_node_pool" "app" {
              cluster_id         = oci_containerengine_cluster.app.id
              compartment_id     = var.compartment_ocid
              kubernetes_version = var.k8s_version
              name               = "app-pool"
              node_shape         = "VM.Standard.E4.Flex"

              node_config_details {
                placement_configs {
                  availability_domain = var.availability_domain
                  subnet_id           = oci_core_subnet.workers_private.id
                }
                nsg_ids = [oci_core_network_security_group.oke_workers.id]
                size    = 3
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm
        title: OCI - Network resource configuration for Kubernetes clusters
  - uid: mondoo-oci-security-oke-node-pool-nsgs-attached-oci
