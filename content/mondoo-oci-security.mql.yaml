  # No Terraform variants: the runtime check resolves the cluster's typed `subnet` reference and reads `prohibitPublicIpOnVnic`. Terraform stores subnet references as opaque strings (`oci_core_subnet.foo.id`) that cannot be cross-resolved against `oci_core_subnet.arguments['prohibit_public_ip_on_vnic']` without brittle reference-string parsing. The same limitation is documented on `mondoo-oci-security-oke-node-pool-private-subnets`.
  - uid: mondoo-oci-security-redis-cluster-private-subnet
    title: Ensure OCI Cache clusters are deployed in private subnets
    impact: 90
    filters: asset.platform == "oci-redis-cluster"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      oci.redis.cluster.subnet.prohibitPublicIpOnVnic == true
    docs:
      desc: |
        This check verifies that every OCI Cache cluster sits behind a private endpoint, in a subnet configured to prohibit public IP addresses on VNICs.

        OCI Cache runs a managed in-memory data store reachable over a private endpoint inside a VCN subnet. OCI subnets allow public IP assignment by default, and a cache cluster placed in such a subnet can be given a public IP that exposes the in-memory store to internet scanning with no application layer between the attacker and the data. This check requires the cluster's subnet to prohibit public IPs on its VNICs. Create the subnet that way in the Console under Networking > Virtual Cloud Networks, or with `oci network subnet create --prohibit-public-ip-on-vnic true`, then place the cluster there from Databases > OCI Cache.

        **Why this matters**

        Cache engines historically default to no authentication, and even with authentication enabled, direct internet reachability means any authentication weakness or future CVE becomes immediately exploitable from anywhere on the internet rather than only from inside the VCN.

        The data these clusters hold is exactly what an attacker wants: session identifiers, OAuth refresh tokens, cached query results containing personal information, and feature-flag configurations that drive application behavior. Read access alone is a session hijacking primitive.

        Write access is worse. An attacker who can reach the cache directly can modify feature-flag and rate-limit entries to bypass application logic and throttling, which amplifies the impact well beyond data theft.

        A public IP assigned to a VNIC in a permissive subnet can persist across cluster restarts and updates unless the subnet itself prohibits it. Enforcing the restriction at the subnet is structural: the endpoint is never assigned an internet-routable address at any point in the cluster's lifecycle, and the restriction cannot be undone by a later change to the cluster alone. All cache traffic is then forced through VCN routes, network security groups, and service gateways, where it can be logged and filtered.
      audit: |
        ### Audit via Console

        1. Open **Databases** in the OCI Console and navigate to **OCI Cache** -> **Clusters**.
        2. Select each cluster and open its details page.
        3. Under the **Network** section, click the linked **Subnet** to open the subnet details.
        4. Verify that **Prohibit public IP on VNIC** is set to **Yes**.

        A passing cluster is connected to a subnet showing **Prohibit public IP on VNIC: Yes**. A failing cluster is connected to a subnet where that setting is **No**.

        ### Audit via CLI

        1. List OCI Cache clusters, then check the subnet of each to confirm public IPs are prohibited:

        ```bash
        oci redis redis-cluster redis-cluster-summary list-redis-clusters \
          --compartment-id <compartment-ocid> \
          --query 'data.items[*].{name:"display-name", subnetId:"subnet-id"}' \
          --output table

        oci network subnet get \
          --subnet-id <subnet-id> \
          --query 'data.{name:"display-name", prohibitPublicIp:"prohibit-public-ip-on-vnic"}'
        ```

        A passing cluster's subnet returns `"prohibit-public-ip-on-vnic": true`. A failing cluster's subnet returns `"prohibit-public-ip-on-vnic": false`.
      remediation:
        - id: console
          desc: |
            Move the cluster to a private subnet:

            1. Identify or create a subnet in the cluster's VCN with **Prohibit public IP on VNIC** set to **Yes**.
            2. The cluster's subnet is set at create time and cannot be changed in place.
            3. Take a backup of the existing cluster, then recreate it in the private subnet from the backup.
            4. Update application connection strings to the new cluster endpoint, then delete the old cluster.
        - id: cli
          desc: |
            Take a backup, then recreate the cluster from the backup in a private subnet:

            ```bash
            oci redis oci-cache-backup oci-cache-backup create \
              --compartment-id <compartment-ocid> \
              --source-cluster-id <old-cluster-ocid> \
              --display-name pre-migration

            oci redis redis-cluster redis-cluster create \
              --compartment-id <compartment-ocid> \
              --display-name <name> \
              --node-count <n> \
              --node-memory-in-gbs <gb> \
              --software-version VALKEY_8_1 \
              --subnet-id <private-subnet-ocid> \
              --backup-id <backup-ocid>
            ```
        - id: terraform
          desc: |
            Reference a subnet that prohibits public IPs:

            ```hcl
            resource "oci_core_subnet" "cache_private" {
              compartment_id             = var.compartment_ocid
              vcn_id                     = oci_core_vcn.app.id
              cidr_block                 = "10.0.20.0/24"
              prohibit_public_ip_on_vnic = true
              prohibit_internet_ingress  = true
            }

            resource "oci_redis_redis_cluster" "app" {
              compartment_id     = var.compartment_ocid
              display_name       = "app-cache"
              node_count         = 3
              node_memory_in_gbs = 4
              software_version   = "VALKEY_8_1"
              subnet_id          = oci_core_subnet.cache_private.id
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ocicache/home.htm
        title: OCI Cache Overview
  - uid: mondoo-oci-security-redis-cluster-nsg-attached
    title: Ensure OCI Cache clusters have Network Security Groups attached
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-redis-cluster-nsg-attached-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-redis-cluster-nsg-attached-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-redis-cluster-nsg-attached-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-redis-cluster-nsg-attached-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that access to every OCI Cache cluster is scoped by at least one Network Security Group rather than by subnet membership alone.

        Subnet security lists are the only network control OCI applies to a cache cluster by default, and they treat every VNIC in the subnet identically. A Network Security Group is attached to the cluster itself and carries rules that can name other NSGs as sources, which is the layer Oracle's connection guide recommends for restricting which workloads may reach an OCI Cache endpoint. This check requires at least one NSG on the cluster. Attach one in the Console under Databases > OCI Cache on the cluster's network configuration, or by setting `nsg_ids` with `oci redis redis-cluster update`.

        **Why this matters**

        Subnet security lists are coarse. They apply to every VNIC in the subnet, so adding any new workload to that subnet silently inherits bidirectional cache access, expanding the attack surface with no explicit grant and no review step.

        That coarseness is a lateral movement path. Under a subnet-only model, a compromised workload sharing the subnet can reach the cache even when its own NSG would otherwise isolate it, because subnet rules offer no per-source-resource scoping.

        NSGs are also the unit Oracle's flow-log integration uses to capture per-cluster network telemetry. With no NSG on the cluster, traffic to and from the cache cannot be separated from general subnet traffic in logs, so there is nothing for security monitoring to isolate.

        Access changes suffer the same problem. Granting a new application tier access without NSG scoping means editing shared subnet rules, which affects every resource in the subnet rather than the intended consumer alone.

        An NSG on the cluster admits only explicitly named source NSGs, blocks lateral access from unrelated workloads, decouples cache access from subnet membership, and gives flow logs a clean boundary. Pair it with a subnet that prohibits public IPs so the network controls stack rather than substitute for each other.
      audit: |
        ### Audit via Console

        1. Open **Databases** in the OCI Console and navigate to **OCI Cache** -> **Clusters**.
        2. Select each cluster and open its details page.
        3. Under the **Network** section, locate **Network Security Groups**.
        4. Verify that at least one NSG is listed.

        A passing cluster shows one or more Network Security Groups attached under the Network section. A failing cluster shows no Network Security Groups.

        ### Audit via CLI

        1. List OCI Cache clusters and check the `nsg-ids` field for each:

        ```bash
        oci redis redis-cluster redis-cluster-summary list-redis-clusters \
          --compartment-id <compartment-ocid> \
          --query 'data.items[*].{name:"display-name", nsgIds:"nsg-ids"}' \
          --output table
        ```

        A passing cluster returns a `nsgIds` array with at least one entry. A failing cluster returns an empty array or `null`.
      remediation:
        - id: console
          desc: |
            Attach an NSG to the cluster:

            1. Open **Databases** -> **OCI Cache** -> select the cluster.
            2. Under **Network**, select **Edit network security groups**.
            3. Add at least one NSG whose ingress rules cover the application tier's expected source.
        - id: cli
          desc: |
            Update the cluster to attach NSGs:

            ```bash
            oci redis redis-cluster redis-cluster update \
              --redis-cluster-id <cluster-ocid> \
              --nsg-ids '["<nsg-ocid-1>","<nsg-ocid-2>"]'
            ```
        - id: terraform
          desc: |
            Set `nsg_ids` on the cluster:

            ```hcl
            resource "oci_core_network_security_group" "cache" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.app.id
              display_name   = "cache-nsg"
            }

            resource "oci_redis_redis_cluster" "app" {
              compartment_id     = var.compartment_ocid
              display_name       = "app-cache"
              node_count         = 3
              node_memory_in_gbs = 4
              software_version   = "VALKEY_8_1"
              subnet_id          = oci_core_subnet.cache_private.id
              nsg_ids            = [oci_core_network_security_group.cache.id]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/ocicache/connecttocluster.htm
        title: OCI Cache - Connect to a Cluster
