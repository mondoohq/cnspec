          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-certificate-authorities-customer-managed-keys-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every active certificate authority in the OCI Certificates service has its private key material protected by a customer-managed key in OCI Vault.

        An authority can be created against a key the customer owns in Vault or left under Oracle-managed encryption. The default path means the organization's own key-management policies, its Vault IAM statements such as `allow group KeyAdmins to use keys in compartment Security`, and its HSM-backed key-shape requirements cannot be applied to the material that controls every certificate the authority will ever issue. Bind the key when creating the authority under Identity & Security > Certificate Authorities in the Console, or supply the key OCID to `oci certs-mgmt certificate-authority create`.

        **Why this matters**

        A certificate authority's private key is the master credential of the entire public key infrastructure it anchors. Whoever can use it can mint a trusted certificate for any service name in the tenancy, for partner domains, and for the SaaS endpoints your clients resolve. No per-certificate control limits that, because the ability to issue is the control.

        Containment is what customers discover too late. With an Oracle-managed key there is no Vault policy to revoke, so a suspected compromise cannot be stopped by any change the customer makes and requires Oracle to intervene. With a customer-managed key, disabling or rotating it cuts off access to the private material immediately and without rebuilding the authority.

        The same gap applies to evidence. Key operations under Oracle management leave no entry in the customer's Vault audit log, so signing activity is visible only through the authority's own service records. A customer-managed key puts every use of the private material into a log the customer controls, independent of the service performing the operation.

        Subordinate authorities inherit the problem rather than escaping it. A subordinate created without a customer-managed key is still a fully capable issuer whose key material the customer can neither control nor independently audit.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** in the OCI Console and navigate to **Certificates** -> **Certificate Authorities**.
        2. Select each active certificate authority and open its details page.
        3. In the **Encryption** section, verify that a **KMS Key** is listed.

        A passing certificate authority shows a populated **KMS Key** field referencing a customer-managed key. A failing certificate authority shows no KMS key configured.

        ### Audit via CLI

        1. List active certificate authorities and check the `kms-key-id` field for each:

        ```bash
        oci certs-mgmt certificate-authority list \
          --compartment-id <compartment-ocid> \
          --lifecycle-state ACTIVE \
          --query 'data.items[*].{name:name, id:id, kmsKeyId:"kms-key-id"}' \
          --output table
        ```

        A passing certificate authority returns a non-null, non-empty `kmsKeyId`. A failing certificate authority returns `null` or an empty string for `kmsKeyId`.
      remediation:
        - id: console
          desc: |
            Re-create CAs without customer-managed encryption using a vault-backed key. (CA encryption keys are set at create time and cannot be changed in place.)

            1. Open **Identity & Security** → **Certificates** → **Certificate Authorities** → identify CAs without a Vault key.
            2. Decide whether the CA can be retired (preferred) or must be replaced.
            3. To replace: create a new CA in **Create Certificate Authority** with **KMS Vault** and **KMS Key** set to a customer-managed key, re-issue subordinate CAs and certificates from the new root, then schedule deletion of the old CA.
        - id: cli
          desc: |
            Create a replacement root CA backed by a customer-managed KMS key. (CA encryption keys are set at create time; existing CAs without a CMK must be replaced.)

            ```bash
            oci certs-mgmt certificate-authority create-root-ca-by-generating-config-details \
              --compartment-id <compartment-ocid> \
              --name internal-root-ca-v2 \
              --kms-key-id <kms-key-ocid> \
              --signing-algorithm SHA256_WITH_RSA \
              --subject '{"commonName":"Internal Root CA"}' \
              --validity '{"timeOfValidityNotAfter":"2031-01-01T00:00:00Z"}'
            ```
        - id: terraform
          desc: |
            Set `kms_key_id` on every `oci_certificates_management_certificate_authority` to reference a customer-managed key:

            ```hcl
            resource "oci_kms_vault" "pki" {
              compartment_id = var.compartment_ocid
              display_name   = "pki-vault"
              vault_type     = "DEFAULT"
            }

            resource "oci_kms_key" "pki" {
              compartment_id      = var.compartment_ocid
              display_name        = "pki-ca-key"
              management_endpoint = oci_kms_vault.pki.management_endpoint
              protection_mode     = "HSM"

              key_shape {
                algorithm = "RSA"
                length    = 256 # bytes; 256 bytes = RSA-2048
              }
            }

            resource "oci_certificates_management_certificate_authority" "root" {
              compartment_id = var.compartment_ocid
              name           = "internal-root-ca"
              kms_key_id     = oci_kms_key.pki.id

              certificate_authority_config {
                config_type         = "ROOT_CA_GENERATED_INTERNALLY"
                signing_algorithm   = "SHA256_WITH_RSA"

                subject {
                  common_name = "Internal Root CA"
                }

                validity {
                  time_of_validity_not_after = "2031-01-01T00:00:00Z"
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/certificates/managing-certificate-authorities.htm
        title: OCI - Managing Certificate Authorities
  - uid: mondoo-oci-security-certificate-authorities-customer-managed-keys-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.certificates.certificateAuthorities.where(state == "ACTIVE").all(
        kmsKey != null
