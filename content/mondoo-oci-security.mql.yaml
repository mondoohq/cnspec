  - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-protocols
    title: Ensure VCN security lists block unrestricted egress to 0.0.0.0/0
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-protocols-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-protocols-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-protocols-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-vcn-no-unrestricted-egress-all-protocols-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no VCN security list permits outbound traffic on every protocol to every destination on the internet.

        Egress rules govern traffic leaving the subnet and carry a `destination` plus a `destinationType`, which is either `CIDR_BLOCK` for an arbitrary range or `SERVICE_CIDR_BLOCK` for an Oracle services label reached through a service gateway. A rule combining `protocol: all` with `destination: 0.0.0.0/0` places no constraint at all on what an instance may talk to. The check requires that no egress rule holds both values. Egress rules are managed on the security list details page in the Console or through `oci network security-list update`.

        **Why this matters**

        Unrestricted egress is what turns a single compromised instance into a data breach. The attacker already has code running; the rule supplies an unconstrained path for moving whatever that code can read to infrastructure they control.

        It also keeps the intrusion alive. An implant can reach a command-and-control endpoint on any protocol and any port, so address and DNS blocklists become the only detection surface, and beaconing hidden inside an unusual protocol never touches them.

        The tenancy carries the third-party consequences. An instance with open egress can be used to scan, brute force or flood external targets, and the abuse reports, the bandwidth charges and the reputational damage land on the tenancy owner rather than on the attacker.

        Replace the rule with egress rules naming the destination CIDR, protocol and port range each workload needs, and use a `SERVICE_CIDR_BLOCK` destination for traffic to Oracle services so it never traverses the internet at all. Route what genuinely must leave through a NAT gateway fronted by a firewall or proxy that can inspect and log it, and alert on large or unusual outbound transfers.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Networking > Virtual Cloud Networks**.
        3. Select each VCN.
        4. Select **Security Lists** from the left menu.
        5. For each security list, select it and review the **Egress Rules** tab.
        6. Check whether any rule has **Destination: 0.0.0.0/0** and **IP Protocol: All Protocols**.

        A passing security list has no egress rule with destination `0.0.0.0/0` and protocol `All`. A failing security list contains at least one such rule.

        ### Audit via CLI

        1. List egress rules for a security list and inspect for unrestricted all-protocol rules:

        ```bash
        oci network security-list get --security-list-id <SECURITY_LIST_OCID> --query "data.{Name:\"display-name\", EgressRules:\"egress-security-rules\"}" --output json
        ```

        A passing security list returns no egress rule with `"destination": "0.0.0.0/0"` and `"protocol": "all"`. A failing security list returns one or more such rules.
      remediation:
        - id: console
          desc: |
            To restrict unrestricted egress rules in a VCN security list using the OCI Console:

            1. Navigate to **Networking > Virtual Cloud Networks**.
            2. Select the VCN.
            3. Select **Security Lists**.
            4. Select the security list.
            5. Edit egress rules to specify destination CIDR blocks and protocols, replacing any rule that allows all traffic to 0.0.0.0/0.
        - id: cli
          desc: |
            To restrict unrestricted egress rules in a VCN security list using the OCI CLI, update the security list with scoped rules that specify destinations and protocols.

            **Warning: `--egress-security-rules` replaces the COMPLETE set of egress rules.** Whatever you pass becomes the entire egress rule list, so any rule you omit is deleted. Retrieve the current rules first, edit only the all-protocols rule, then resubmit the full list.

            1. Export the current egress rules so you keep every rule you still need:

            ```bash
            oci network security-list get --security-list-id SECURITY_LIST_OCID \
              --query 'data."egress-security-rules"' > egress-rules.json
            ```

            2. Edit `egress-rules.json`, replacing the all-protocols rule to `0.0.0.0/0` with scoped rules such as `{"destination":"10.0.0.0/16","protocol":"6","tcpOptions":{"destinationPortRange":{"min":443,"max":443}},"isStateless":false}`. Resubmit the edited file so every rule you kept is preserved:

            ```bash
            oci network security-list update --security-list-id SECURITY_LIST_OCID \
              --egress-security-rules file://egress-rules.json
            ```
        - id: terraform
          desc: |
            To restrict unrestricted egress in a VCN security list in Terraform, define egress rules with specific destination CIDR blocks and protocols instead of allowing all traffic to 0.0.0.0/0:

            ```hcl
            resource "oci_core_security_list" "example" {
              compartment_id = var.compartment_ocid
              vcn_id         = oci_core_vcn.example.id
              display_name   = "example-security-list"

              egress_security_rules {
                protocol    = "6" # TCP
                destination = "10.0.0.0/16"
                stateless   = false

                tcp_options {
                  min = 443
                  max = 443
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
        title: OCI security list documentation
