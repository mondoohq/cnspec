  # No Terraform variants: VCN and subnet flow logs are separate `oci_logging_log` resources whose `configuration.source` references the VCN or subnet OCID; statically correlating each log back to the network resource it covers requires reference-string parsing that Terraform assets do not support reliably.
  - uid: mondoo-oci-security-vcn-flow-logs-enabled
    title: Ensure VCN flow logs are enabled
    impact: 60
    filters: asset.platform == 'oci'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-16
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      # A VCN-level flow log covers every subnet in the VCN; otherwise each subnet needs its
      # own. Asserting only the VCN level failed a VCN that is fully covered subnet by
      # subnet, and passed nothing it should have. Checking both catches partial coverage.
      oci.network.vcns.all(
        flowLogs.where(isEnabled == true) != empty ||
        subnets.all(flowLogs.where(isEnabled == true) != empty)
      )
    docs:
      desc: |
        This check verifies that network traffic in every Virtual Cloud Network is being recorded.

        VCN flow logs are a service log emitted through OCI Logging that captures accepted and rejected connections crossing the VCN's subnets, along with source and destination addresses, ports, protocol, byte and packet counts, and the action taken. A log enabled on the VCN itself covers every subnet beneath it; otherwise each subnet needs its own. The check accepts either arrangement, so a VCN covered subnet by subnet is not reported as a gap. Nothing is recorded until someone enables it, under Observability & Management > Logging > Logs once a log group exists, or with `oci logging log create` using a service log configuration.

        **Why this matters**

        Without flow logs there is no record that an attack happened. Port scans, a burst of rejected connections against an internal address, and lateral movement between subnets leave their only trace at the network layer, and nothing running on the instance is obliged to notice any of it.

        During an incident the same records answer the questions that decide scope. Which hosts talked to the compromised instance, when the first connection arrived, how much data left and to where, and whether a rule that has since been fixed was ever actually used. Reconstructing that from instance logs alone is usually impossible, particularly once the instance has been terminated.

        Rejected-connection records earn their place as well. A security list doing its job drops traffic silently, and the flow log is the only place that drop becomes visible, which is the difference between a rule you believe is protecting you and a rule you can demonstrate is protecting you.

        Send flow logs to a log group whose retention period matches your incident response and compliance obligations, since investigations routinely begin weeks after the activity they examine. Forward them to a central destination and alert on the patterns worth waking someone for rather than relying on anyone browsing them.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Observability & Management > Logging > Logs**.
        2. Filter by log type **Service** and look for **Flow Logs** entries.
        3. Confirm that an enabled flow log exists for each VCN subnet.

        A passing VCN has at least one enabled flow log covering its subnets. A failing VCN has no enabled flow logs.

        ### Audit via CLI

        1. List the logs in the flow-log log group and review their enabled state:

        ```bash
        oci logging log list --log-group-id <log-group-ocid> --query 'data[*].{name:"display-name", isEnabled:"is-enabled", source:configuration.source.resource}'
        ```

        A passing VCN has a log with `is-enabled` set to `true` whose `source.resource` matches one of its subnets. A failing VCN has none.
      remediation:
        - id: console
          desc: |
            To enable flow logs for a VCN subnet using the OCI Console:

            1. Navigate to **Observability & Management > Logging > Log Groups** and create or select a log group.
            2. Select **Logs**, then **Enable service log**.
            3. For **Service**, choose **Flow Logs**; for **Resource**, select the subnet.
            4. Choose the log group and set a log name.
            5. Select **Enable Log**.
        - id: cli
          desc: |
            To enable a flow log for a subnet using the OCI CLI:

            ```bash
            oci logging log create --log-group-id <log-group-ocid> \
              --display-name "subnet-flow-log" \
              --log-type SERVICE \
              --is-enabled true \
              --configuration '{"source": {"sourceType": "OCISERVICE", "service": "flowlogs", "resource": "<subnet-ocid>", "category": "all"}, "compartmentId": "<compartment-ocid>"}'
            ```
        - id: terraform
          desc: |
            To enable flow logs in Terraform, create a log group and a flow log that references the subnet:

            ```hcl
            resource "oci_logging_log_group" "example" {
              compartment_id = var.compartment_ocid
              display_name   = "vcn-flow-logs"
            }

            resource "oci_logging_log" "subnet_flow_log" {
              display_name = "subnet-flow-log"
              log_group_id = oci_logging_log_group.example.id
              log_type     = "SERVICE"
              is_enabled   = true

              configuration {
                compartment_id = var.compartment_ocid

                source {
                  category    = "all"
                  resource    = oci_core_subnet.example.id
                  service     = "flowlogs"
                  source_type = "OCISERVICE"
                }
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/vcnflowlogs.htm
        title: OCI VCN flow logs documentation
  - uid: mondoo-oci-security-ipsec-tunnel-ikev2
    title: Ensure IPSec VPN tunnels negotiate IKEv2
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-oci-security-ipsec-tunnel-ikev2-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-ipsec-tunnel-ikev2-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-ipsec-tunnel-ikev2-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-ipsec-tunnel-ikev2-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every tunnel in a site-to-site VPN connection negotiates Internet Key Exchange version 2 rather than the legacy IKEv1.

        An Oracle Cloud Infrastructure IPSec connection provisions two tunnels for redundancy, and the IKE version is selected per tunnel, not per connection. Connections built against older customer-premises equipment may still sit on IKEv1, whose key-exchange design is weaker than its successor. The check requires that each tunnel reports version `V2`. Set it under Networking > Customer connectivity > Site-to-Site VPN by editing the tunnel, with `oci network ip-sec-tunnel update --ipsc-id <ipsec-connection-ocid> --tunnel-id <tunnel-ocid> --ike-version V2`, or through `ike_version` in the Terraform tunnel management resource.

        **Why this matters**

        IKEv2 uses a more robust key-agreement and rekeying design than IKEv1, which narrows exposure to key-recovery attacks and to downgrade attempts against the tunnel's negotiated parameters.

        Session handling is more resilient as well. The built-in liveness checks and MOBIKE support in IKEv2 re-establish a tunnel far faster after a network interruption, shrinking the window in which traffic could fail open onto an unencrypted path or be rerouted somewhere unintended.

        The version also carries compliance weight. Security frameworks that mandate strong cryptography for data in transit expect IKEv2, and IKEv1 is widely deprecated, so an IKEv1 tunnel is an audit finding as well as a technical weakness.

        Change both tunnels of each connection together, and confirm first that the customer-premises equipment on the far side can negotiate IKEv2, because a one-sided change simply leaves the tunnel down. Where a device cannot negotiate it at all, the fix is to replace or upgrade that endpoint rather than to leave the connection on IKEv1 indefinitely.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Customer connectivity > Site-to-Site VPN**.
        2. Open each IPSec connection and review its **Tunnels**.
        3. For each tunnel, open **Edit** and check the **IKE version** field.

        A passing tunnel shows **IKEv2**. A failing tunnel shows **IKEv1**.

        ### Audit via CLI

        1. List the tunnels for an IPSec connection and inspect `ike-version`:

        ```bash
        oci network ip-sec-tunnel list --ipsc-id <ipsec-connection-ocid> --query 'data[].{id:id,ikeVersion:"ike-version"}'
        ```

        A passing tunnel returns `"ikeVersion": "V2"`. A failing tunnel returns `"ikeVersion": "V1"`.
      remediation:
        - id: console
          desc: |
            To set an IPSec tunnel to IKEv2 using the OCI Console:

            1. Navigate to **Networking > Customer connectivity > Site-to-Site VPN** and open the IPSec connection.
            2. Select the tunnel, then select **Edit**.
            3. Set **IKE version** to **IKEv2**.
            4. Select **Save changes** and confirm the customer-premises equipment is configured for IKEv2.
        - id: cli
          desc: |
            To set an IPSec tunnel to IKEv2 using the OCI CLI:

            ```bash
            oci network ip-sec-tunnel update --ipsc-id <ipsec-connection-ocid> --tunnel-id <tunnel-ocid> --ike-version V2
            ```
        - id: terraform
          desc: |
            To set an IPSec tunnel to IKEv2 in Terraform, set `ike_version` on the tunnel management resource:

            ```hcl
            resource "oci_core_ipsec_connection_tunnel_management" "example" {
              ipsec_id    = oci_core_ipsec.example.id
              tunnel_id   = data.oci_core_ipsec_connection_tunnels.example.ip_sec_connection_tunnels[0].id
              ike_version = "V2"
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/settingupIPsec.htm
        title: OCI Site-to-Site VPN documentation
  - uid: mondoo-oci-security-ipsec-tunnel-ikev2-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.network.ipsecConnections.all(
        tunnels.all(ikeVersion == "V2")
      )
  - uid: mondoo-oci-security-ipsec-tunnel-ikev2-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_core_ipsec_connection_tunnel_management')
    mql: |
      terraform.resources('oci_core_ipsec_connection_tunnel_management').all(
        arguments['ike_version'] == "V2"
      )
  - uid: mondoo-oci-security-ipsec-tunnel-ikev2-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_core_ipsec_connection_tunnel_management')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_core_ipsec_connection_tunnel_management').all(
        change.after['ike_version'] == "V2"
      )
  - uid: mondoo-oci-security-ipsec-tunnel-ikev2-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_core_ipsec_connection_tunnel_management')
    mql: |
      terraform.state.resources.where(type == 'oci_core_ipsec_connection_tunnel_management').all(
        values['ike_version'] == "V2"
      )
  - uid: mondoo-oci-security-compute-vnic-source-dest-check
    title: Ensure compute instance VNICs enforce source/destination check
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-compute-vnic-source-dest-check-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-compute-vnic-source-dest-check-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-vnic-source-dest-check-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-compute-vnic-source-dest-check-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that compute instance VNICs keep the source and destination check enabled, so a VNIC may only send and receive traffic addressed to its own IP address.

        Oracle Cloud Infrastructure exposes this as a per-VNIC flag named `skipSourceDestCheck`, and the check requires it to be `false`. Setting it to `true` turns the VNIC into a forwarder: it may then emit packets carrying a source address that is not its own and accept packets destined for somewhere else, which is what a purpose-built network appliance such as a NAT instance or a firewall needs and what a general-purpose instance never does. Left disabled on an ordinary workload it enables IP spoofing and unauthorized routing. The flag lives under Compute > Instances > Attached VNICs > Edit VNIC, and `oci network vnic update --vnic-id <vnic-ocid> --skip-source-dest-check false` restores it.

        **Why this matters**

        With the check enabled, a compromised instance cannot impersonate other hosts, because packets carrying a forged source address are dropped by the fabric before they reach anything.

        It also contains traffic. An instance cannot silently relay or route packets between subnets that the network design never intended to connect, which is a path around security lists and network security groups that leaves no obvious trace.

        That containment is what limits lateral movement. An attacker who lands on one host cannot turn it into a router and pivot arbitrary traffic deeper into the network from there.

        Disable the check only on instances explicitly designed to route or forward, and treat each one as a deliberate exception rather than a convenience. Where forwarding really is required, document the instance as a network appliance and compensate for the loss of fabric-level filtering with strict security lists and tightly scoped network security groups around it.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Compute > Instances**.
        2. Open each instance and select **Attached VNICs**.
        3. Open each VNIC and review the **Skip Source/Destination Check** setting.

        A passing VNIC has **Skip Source/Destination Check** disabled (source/destination check enforced). A failing VNIC has it enabled.

        ### Audit via CLI

        1. List the VNIC attachments for an instance, then inspect each VNIC:

        ```bash
        oci network vnic get --vnic-id <vnic-ocid> --query 'data.{name:"display-name", skipSourceDestCheck:"skip-source-dest-check"}'
        ```

        A passing VNIC returns `false` for `skipSourceDestCheck`. A failing VNIC returns `true`.
      remediation:
        - id: console
          desc: |
            To re-enable the source/destination check on a VNIC using the OCI Console:

            1. Navigate to **Compute > Instances** and open the instance.
            2. Select **Attached VNICs** and open the VNIC.
            3. Select **Edit**.
            4. Clear **Skip Source/Destination Check**.
            5. Select **Save Changes**.
        - id: cli
          desc: |
            To re-enable the source/destination check on a VNIC using the OCI CLI:

            ```bash
            oci network vnic update --vnic-id <vnic-ocid> --skip-source-dest-check false
            ```
        - id: terraform
          desc: |
            To enforce the source/destination check in Terraform, set `skip_source_dest_check` to `false` in the instance `create_vnic_details` block:

            ```hcl
            resource "oci_core_instance" "example" {
              compartment_id      = var.compartment_ocid
              availability_domain = var.availability_domain
              shape               = "VM.Standard.E4.Flex"
              display_name        = "example-instance"

              create_vnic_details {
                subnet_id              = var.subnet_ocid
                skip_source_dest_check = false
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingVNICs.htm
        title: OCI VNIC management documentation
  - uid: mondoo-oci-security-compute-vnic-source-dest-check-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.compute.instances.all(
        vnics.all(skipSourceDestCheck == false)
      )
  - uid: mondoo-oci-security-compute-vnic-source-dest-check-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_core_instance')
    mql: |
      terraform.resources('oci_core_instance').all(
        blocks.where(type == 'create_vnic_details').all(
          arguments['skip_source_dest_check'] != true
        )
      )
  - uid: mondoo-oci-security-compute-vnic-source-dest-check-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_core_instance')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_core_instance').all(
        change.after['create_vnic_details'][0]['skip_source_dest_check'] != true
      )
  - uid: mondoo-oci-security-compute-vnic-source-dest-check-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_core_instance')
    mql: |
      terraform.state.resources.where(type == 'oci_core_instance').all(
        values['create_vnic_details'][0]['skip_source_dest_check'] != true
      )
  # No Terraform variants: internetReachable is a runtime exposure verdict computed by correlating an instance's VNIC public IP with the attached NSG ingress rules and the subnet's internet-ingress policy. No single Terraform resource expresses this cross-resource result; the underlying public-IP-plus-NSG configuration is covered by mondoo-oci-security-public-vnic-has-nsg, which ships Terraform variants.
  - uid: mondoo-oci-security-compute-instance-not-internet-reachable
    title: Ensure compute instances are not directly reachable from the internet
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: asset.platform == "oci"
    mql: |
      oci.compute.instances.all(
        exposure.internetReachable == false
      )
    docs:
      desc: |
        This check verifies that no compute instance is directly reachable from the public internet, taking both its addressing and its network path into account.

        An instance is internet-reachable when it holds a public IP address and the path to it admits inbound traffic from any source, whether through a Network Security Group rule open to `0.0.0.0/0` or a subnet whose security list allows internet ingress. Both conditions must hold, so a public IP behind a properly scoped NSG does not fail, and a permissive NSG on a private instance does not either. You control the addressing at launch, or afterwards under Compute > Instances > Attached VNICs, and the path under Networking > Virtual cloud networks in the security lists and network security groups attached to the VNIC.

        **Why this matters**

        A directly reachable instance offers its operating system, its SSH or RDP daemon, and every listening application port to continuous internet-wide scanning. Exposure is measured in minutes after the address is assigned, and it does not depend on anyone knowing the host exists.

        Traffic arriving that way also skips the controls you built. TLS termination, web application firewall inspection, request rate limiting, and access logging all live on the load balancer or API gateway that the direct path bypasses, so the protections are present in the architecture diagram and absent from the actual request.

        An internet-facing host is the natural first hop for lateral movement. Once compromised, it is already inside the VCN and can reach private subnets, database endpoints, and the instance principal credentials that its dynamic group grants. Removing direct reachability shrinks what a single vulnerable host is worth.

        Front workloads with a load balancer or API gateway and keep the instances in private subnets with a NAT gateway for egress. Reach them administratively through the OCI Bastion service or a jump host rather than a public IP. Where a public IP is genuinely unavoidable, scope NSG ingress to specific administrative CIDR ranges instead of any address.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Compute > Instances** and select an instance.
        3. Under **Attached VNICs**, open each VNIC and note whether a **Public IP address** is assigned.
        4. For any VNIC with a public IP, review the attached NSGs and the subnet security lists for ingress rules that allow `0.0.0.0/0`.

        A passing instance has no public IP, or its ingress is restricted to specific source CIDRs. A failing instance has a public IP and admits inbound traffic from any address.

        ### Audit via CLI

        1. List instances in a compartment, then inspect each instance's VNICs for a public IP:

        ```bash
        oci compute instance list-vnics --instance-id <instance-ocid> \
          --query 'data[].{privateIp:"private-ip",publicIp:"public-ip",nsgIds:"nsg-ids"}'
        ```

        A passing instance returns `"publicIp": null`. A failing instance returns a non-null `publicIp` reachable through permissive ingress.
      remediation:
        - id: console
          desc: |
            Remove direct internet reachability from the instance:

            1. Open **Compute > Instances** and select the instance.
            2. Under **Attached VNICs**, edit the VNIC and remove the assigned public IP, or recreate the instance in a private subnet.
            3. Front any required inbound access with a load balancer, API gateway, or the OCI Bastion service.
        - id: cli
          desc: |
            Remove the public IP from the instance's VNIC. Which command applies depends on the IP's lifetime, which `oci network public-ip get` reports as `lifetime`.

            An ephemeral public IP cannot be unassigned; deleting it is what releases it from the VNIC:

            ```bash
            oci network public-ip delete --public-ip-id <public-ip-ocid> --force
            ```

            A reserved public IP is unassigned by clearing its private IP association, which returns it to your pool:

            ```bash
            oci network public-ip update --public-ip-id <public-ip-ocid> --private-ip-id ""
            ```
        # No Terraform remediation: the finding is a runtime exposure verdict with no single Terraform argument; the public-IP-plus-NSG configuration that produces it is remediated in Terraform by mondoo-oci-security-public-vnic-has-nsg.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingpublicIPs.htm
        title: OCI - Public IP Addresses
  - uid: mondoo-oci-security-adb-not-internet-reachable
    title: Ensure Autonomous Databases are not reachable from the public internet
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: asset.platform == "oci"
    mql: |
      oci.database.autonomousDatabases.all(
        internetReachable == false
      )
    docs:
      desc: |
        This check verifies that no Autonomous Database is actually reachable from the public internet, judged on the combination of endpoint type and access control rather than on any single setting.

        A database counts as internet-reachable when it has a public endpoint, has no private endpoint, and either has access control switched off or carries an allowlist that admits any address. That last condition is what makes this stricter than a test for whether an allowlist exists. A database whose access control list contains a single entry of `0.0.0.0/0` has a list, has entries, and is nonetheless open to everything. Review the setting under Oracle Database > Autonomous Database > Network, and prefer a private endpoint in a subnet over any allowlist on a public one.

        **Why this matters**

        A reachable listener is attacked whether or not authentication is strong. It fields connection attempts from every scanning host on the internet, which produces continuous brute-force pressure against known schema accounts, enumeration of the database version and service names from the handshake, and a steady supply of noise that buries real signals in the audit trail.

        Requiring mutual TLS does not remove that exposure. The handshake happens after the packet arrives, so pre-authentication defects in the listener and the management interfaces are reached by an attacker who has no wallet and no credentials at all. Network unreachability is the control that stops the packet, and authentication is what protects the session once one is allowed.

        Allowlists erode in a direction that is hard to notice. Ranges get widened during an incident, office networks are renumbered, and a cloud provider address permitted for one integration is later reassigned to someone else's workload. None of that changes the listener, only who can talk to it, and nobody reviews it.

        Where a public endpoint is unavoidable, enable access control, scope it to named networks rather than provider-wide ranges, and require mutual TLS on top so that reachability alone does not become a session.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Oracle Database > Autonomous Database** and select the database.
        3. Review the **Network** section under **Database Details** for the access type and access control configuration.

        A passing database uses private endpoint access, or has a public endpoint with an allowlist scoped to specific networks. A failing database has a public endpoint with access control disabled or an allowlist that admits any address.

        ### Audit via CLI

        1. Retrieve the database and inspect its network configuration:

        ```bash
        oci db autonomous-database get --autonomous-database-id <adb-ocid> \
          --query 'data.{privateEndpointIp:"private-endpoint-ip",accessControlEnabled:"is-access-control-enabled",whitelistedIps:"whitelisted-ips"}'
        ```

        A passing database returns a non-null `privateEndpointIp`, or access control enabled with a scoped `whitelistedIps`. A failing database returns a null `privateEndpointIp` with access control disabled or an allowlist admitting any address.
      remediation:
        - id: console
          desc: |
            Remove public reachability from the Autonomous Database:

            1. Open **Oracle Database > Autonomous Database** and select the database.
            2. In the **Network** section, switch to **Private endpoint access only**, or enable **Access Control** and add only the specific networks that require access.
            3. Save and update client connections to use the private endpoint or an allowed source.
        - id: cli
          desc: |
            Scope the public listener to a known network by enabling an access control list:

            ```bash
            oci db autonomous-database update --autonomous-database-id <adb-ocid> \
              --whitelisted-ips '["10.0.0.0/16"]'
            ```
        # No Terraform remediation: internetReachable is a runtime verdict derived from the private-endpoint, access-control, and allowlist state; the configuration that drives it is remediated in Terraform by mondoo-oci-security-adb-mtls-or-restricted.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/autonomous-database-serverless/doc/network-access-types.html
        title: OCI - Autonomous Database Network Access
  # No Terraform variants: standbyWhitelistedIps is the effective access control list reported for the Data Guard standby at runtime, and reflects the resolution of are_primary_whitelisted_ips_used. A static Terraform argument cannot express the resolved standby allowlist, so this evaluates the runtime value only.
  - uid: mondoo-oci-security-adb-standby-acl-not-open
    title: Ensure Autonomous Database standby ACLs exclude any-address entries
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: asset.platform == "oci"
    mql: |
      oci.database.autonomousDatabases.all(
        standbyWhitelistedIps.none(_ == "0.0.0.0/0" || _ == "0.0.0.0" || _ == "::/0")
      )
    docs:
      desc: |
        This check verifies that the access control list guarding an Autonomous Database's Data Guard standby contains no any-address entry, specifically `0.0.0.0/0`, a bare `0.0.0.0`, or the IPv6 equivalent `::/0`.

        An Autonomous Data Guard standby keeps an access control list of its own, separate from the primary's and editable independently. The two are configured in different places in the Console, under the primary database's Network section and its Autonomous Data Guard section, so they diverge quietly. An any-address entry on the standby means its endpoint accepts connection attempts from every network on the internet, including the ones the primary's list was written to exclude.

        **Why this matters**

        The standby is not a partial copy or a lagging summary. It applies redo continuously and holds the same rows, the same columns, and the same regulated fields as the primary, so an attacker who reaches it reads production data. Read-only access is still full disclosure.

        The exposure is invisible from the place people look. A reviewer who opens the primary database, confirms a tight allowlist, and moves on has verified nothing about the standby, and dashboards that summarize network posture per database commonly report the primary's setting. The gap persists until someone audits the disaster recovery configuration directly, or until a switchover promotes the open standby into the primary role and carries its permissive list into production traffic.

        An open standby also undermines the reasoning behind every control on the primary. Restricting the primary to a handful of application subnets is only meaningful if the same data is not simultaneously answering from an unrestricted second endpoint in another availability domain or region.

        Mirror the primary's source networks onto the standby, replace any-address entries with the specific ranges that genuinely need standby access such as reporting or disaster recovery test hosts, and audit both lists together whenever Autonomous Data Guard is enabled or a switchover is rehearsed.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Oracle Database > Autonomous Database** and select a Data Guard enabled database.
        3. Open the **Access Control List** configuration and review the entries applied to the standby.

        A passing standby lists only specific source networks. A failing standby lists an any-address entry such as `0.0.0.0/0`.

        ### Audit via CLI

        1. Retrieve the database and inspect the standby allowlist:

        ```bash
        oci db autonomous-database get --autonomous-database-id <adb-ocid> \
          --query 'data."standby-whitelisted-ips"'
        ```

        A passing database returns a list of specific networks or an empty list. A failing database returns a list containing `0.0.0.0/0`, `0.0.0.0`, or `::/0`.
      remediation:
        - id: console
          desc: |
            Restrict the standby allowlist:

            1. Open **Oracle Database > Autonomous Database** and select the database.
            2. Edit the **Access Control List** and remove any-address entries from the standby configuration, or set the standby to reuse the primary's allowlist.
            3. Save the change.
        - id: cli
          desc: |
            Configure the standby to reuse the primary's allowlist so it inherits the same restrictions:

            ```bash
            oci db autonomous-database update --autonomous-database-id <adb-ocid> \
              --are-primary-whitelisted-ips-used true
            ```
        # No Terraform remediation: the check evaluates the resolved runtime standby allowlist, which reflects are_primary_whitelisted_ips_used at scan time and has no static Terraform representation.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/autonomous-database-serverless/doc/autonomous-data-guard-enable.html
        title: OCI - Autonomous Data Guard
  # No Terraform variants: endpoint_type and network_security_group_ids on oci_apigateway_gateway are covered by the Terraform variants below.
  - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg
    title: Ensure public API gateways restrict access with a network security group
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that network-layer access control is applied to every API gateway that exposes a public endpoint.

        An API gateway created with an endpoint type of `PUBLIC` receives an internet-routable address, and with no Network Security Group attached it inherits a default-open posture that accepts inbound traffic from any source. An NSG attached to the gateway carries ingress rules that name the source CIDRs, load balancer ranges, or peer NSGs permitted to reach it, restricting access at the network layer in addition to the authentication policies enforced on individual deployments. This check requires at least one NSG on every public gateway; private gateways are out of scope. Attach one in the Console under Developer Services > API Management > Gateways, or by setting `network_security_group_ids` with `oci api-gateway gateway update`.

        **Why this matters**

        A public gateway with no NSG is reachable from the entire internet. It is exposed to scanning and volumetric abuse before any request-level policy runs, so the cost of unwanted traffic is paid at the gateway regardless of whether the request would ultimately have been rejected.

        Network-layer restriction is the defense-in-depth layer under deployment authentication. When a deployment is misconfigured, or when a new one is added to the gateway before its authentication policy is finalized, the NSG is what keeps it from being immediately reachable by arbitrary sources.

        Narrowing the admissible source ranges also cuts the volume of traffic that reaches request routing and authentication at all, which reduces both the noise in gateway logs and the surface an attacker can probe.

        Scope the rules to the specific CIDRs or load balancer ranges that front the gateway rather than to broad ranges that only look restrictive. Where every consumer is internal, prefer a private endpoint type outright so the gateway has no public address to protect in the first place.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Developer Services > API Management > Gateways** and select a gateway.
        3. Review the **Endpoint type** and the attached **Network Security Groups**.

        A passing gateway is private, or is public with at least one NSG attached. A failing gateway is public with no NSG.

        ### Audit via CLI

        1. List gateways in a compartment and inspect their endpoint type and NSGs:

        ```bash
        oci api-gateway gateway list --compartment-id <compartment-ocid> \
          --query 'data.items[].{name:"display-name",endpointType:"endpoint-type",nsgIds:"network-security-group-ids"}'
        ```

        A passing gateway returns `"endpointType": "PRIVATE"`, or `"endpointType": "PUBLIC"` with a non-empty `nsgIds`. A failing gateway returns `"endpointType": "PUBLIC"` with an empty `nsgIds`.
      remediation:
        - id: console
          desc: |
            Attach a Network Security Group to the public gateway:

            1. Open **Developer Services > API Management > Gateways** and select the gateway.
            2. Edit the gateway and add one or more Network Security Groups whose rules admit only the required source ranges.
            3. Save the change.
        - id: cli
          desc: |
            Attach a Network Security Group to an existing gateway:

            ```bash
            oci api-gateway gateway update --gateway-id <gateway-ocid> \
              --network-security-group-ids '["<nsg-ocid>"]'
            ```
        - id: terraform
          desc: |
            Attach a Network Security Group to any public API gateway:

            ```hcl
            resource "oci_apigateway_gateway" "app" {
              compartment_id = var.compartment_ocid
              endpoint_type  = "PUBLIC"
              subnet_id      = oci_core_subnet.public.id

              # Restrict the public endpoint at the network layer
              network_security_group_ids = [oci_core_network_security_group.gateway.id]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/APIGateway/Tasks/apigatewaycreatinggateway.htm
        title: OCI - Creating an API Gateway
  - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.apigateway.gateways.all(
        endpointType != "PUBLIC" ||
        networkSecurityGroups.length > 0
      )
  - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_apigateway_gateway')
    mql: |
      terraform.resources('oci_apigateway_gateway').all(
        arguments['endpoint_type'] != 'PUBLIC' ||
        arguments['network_security_group_ids'] != null && arguments['network_security_group_ids'].length > 0
      )
  - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_apigateway_gateway')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_apigateway_gateway').all(
        change.after['endpoint_type'] != 'PUBLIC' ||
        change.after['network_security_group_ids'] != null && change.after['network_security_group_ids'].length > 0
      )
  - uid: mondoo-oci-security-apigateway-gateway-public-restricted-by-nsg-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_apigateway_gateway')
    mql: |
      terraform.state.resources.where(type == 'oci_apigateway_gateway').all(
        values['endpoint_type'] != 'PUBLIC' ||
        values['network_security_group_ids'] != null && values['network_security_group_ids'].length > 0
      )
  # No Terraform variants: promptInjectionEnabled reflects the guardrail configuration applied to the running Generative AI endpoint. This check evaluates the endpoint's live guardrail state; the endpoint's prompt-injection configuration is managed through the service and is not represented by a verified Terraform resource argument.
  - uid: mondoo-oci-security-genai-endpoint-prompt-injection-detection
    title: Ensure Generative AI endpoints enable prompt injection detection
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-26
      compliance/nis-2: false
      compliance/nist-ai-100-1: nist-ai-100-1-measure-2-7
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-10
      compliance/nist-sp-800-171: false
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm01
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    filters: asset.platform == "oci-ai-generativeai-endpoint"
    mql: |
      oci.ai.generativeAi.endpoint.promptInjectionEnabled == true
    docs:
      desc: |
        This check verifies that adversarial prompt screening is active on every OCI Generative AI endpoint.

        Prompt injection detection inspects incoming prompts for adversarial instructions that attempt to override the model's guardrails, exfiltrate the system prompt, or coerce the model into unintended actions. It is part of the content moderation guardrail configuration attached to an endpoint on a dedicated AI cluster, set under Analytics & AI > Generative AI > Endpoints when the endpoint is created or updated. The check requires `promptInjectionEnabled` to be on, and detection should be set to block rather than merely record so a flagged prompt is rejected before the model acts on it.

        **Why this matters**

        Instruction hijacking is the direct attack. An attacker embeds hidden directives in text the model will read, whether that is a chat message, an uploaded document, or a retrieved web page, and the model treats those directives as though they came from the operator. The payload asks the model to ignore its constraints, print its system prompt, or reveal the tenancy details baked into its instructions. An endpoint with no detection processes that prompt with no defense at all.

        The damage compounds once the endpoint is wired into tools or retrieval. A model that can call a function, query a data store, or fetch a URL becomes an execution surface: the injected instruction steers it into invoking an action or surfacing records the requesting user has no right to see. The model is acting with the endpoint's privileges, not the caller's, so injection is a privilege escalation path rather than a content problem.

        Manipulated output is also an input to whatever consumes it. When a downstream system parses a completion and acts on it, an injected instruction that survives into the response becomes an untrusted instruction inside a trusted pipeline. Detecting the injection at the endpoint stops that propagation at its source.

        Feed detection results into monitoring rather than treating a block as the end of the story, because a rising count of flagged prompts against one endpoint is the signal that someone is working through an attack sequence. Endpoints reachable only by trusted internal automation with fully controlled input may reasonably run with detection in recording mode, but any endpoint that sees text from a user or a third-party document should block.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Analytics & AI > Generative AI > Endpoints** and select an endpoint.
        3. Review the **Guardrails** or **Content moderation** configuration for the prompt injection setting.

        A passing endpoint shows prompt injection detection enabled. A failing endpoint shows it disabled.

        ### Audit via CLI

        1. List endpoints in a compartment and inspect their guardrail configuration:

        ```bash
        oci generative-ai endpoint-collection list-endpoints --compartment-id <compartment-ocid> \
          --query 'data.items[].{name:"display-name",promptInjection:"prompt-injection-config"}'
        ```

        A passing endpoint reports a prompt injection configuration that is enabled. A failing endpoint reports it disabled or unset.
      remediation:
        - id: console
          desc: |
            Enable prompt injection detection on the endpoint:

            1. Open **Analytics & AI > Generative AI > Endpoints** and select the endpoint.
            2. Edit the guardrail configuration and enable prompt injection detection, choosing block mode where the application can tolerate it.
            3. Save the change.
        - id: cli
          desc: |
            Enable prompt injection detection on an existing endpoint:

            ```bash
            oci generative-ai endpoint update --endpoint-id <endpoint-ocid> \
              --prompt-injection-config '{"mode": "BLOCK"}'
            ```
        # No Terraform remediation: the endpoint's prompt-injection guardrail is a service-side setting with no verified Terraform resource argument; manage it through the console or CLI.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/generative-ai/home.htm
        title: OCI - Generative AI
  # No Terraform variants: piiDetectionEnabled reflects the guardrail configuration applied to the running Generative AI endpoint. This check evaluates the endpoint's live guardrail state; the endpoint's PII-detection configuration is managed through the service and is not represented by a verified Terraform resource argument.
  - uid: mondoo-oci-security-genai-endpoint-pii-detection
    title: Ensure Generative AI endpoints enable PII detection
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-12
      compliance/nis-2: false
      compliance/nist-ai-100-1: nist-ai-100-1-measure-2-10
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm02
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    filters: asset.platform == "oci-ai-generativeai-endpoint"
    mql: |
      oci.ai.generativeAi.endpoint.piiDetectionEnabled == true
    docs:
      desc: |
        This check verifies that sensitive personal data is screened out of traffic through every OCI Generative AI endpoint.

        Personally identifiable information detection inspects both prompts and responses for sensitive personal data such as names, government identifiers, and financial details. It is configured alongside the other guardrails on a Generative AI endpoint under Analytics & AI > Generative AI > Endpoints. The check requires `piiDetectionEnabled` to be on, and the detection mode should be set to block or redact so sensitive values are masked or rejected rather than passed through in the clear.

        **Why this matters**

        Without detection, personal data entered in a prompt or generated in a response flows unredacted into everything downstream of the endpoint. Transcripts, application logs, observability pipelines, and the connected systems that consume completions all receive the raw values. A support agent pasting a customer record into a prompt has, in effect, copied that record into every log sink the application writes to, and nobody involved intended it.

        The regulatory exposure follows from the same mechanic. Privacy regimes require data minimization and protection of personal data wherever it is processed, and an inference endpoint that neither detects nor masks it is processing that data without controls. The organization cannot demonstrate what personal data passed through the model, which is precisely the accounting an audit asks for.

        Retention amplifies the problem. Data captured in model interactions is routinely kept far longer than anyone intended, because interaction logs are stored for debugging and quality work rather than governed as a personal data store. Every extra month of retention widens the window in which a breach of that store exposes the data. Pair detection with short retention on interaction logs so that even the records that do capture personal data expire quickly.

        An endpoint serving a workload that legitimately reasons over personal data, such as a claims or clinical application, still benefits from detection in redact mode on the response path even when the prompt path must pass values through.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Analytics & AI > Generative AI > Endpoints** and select an endpoint.
        3. Review the **Guardrails** or **Content moderation** configuration for the PII detection setting.

        A passing endpoint shows PII detection enabled. A failing endpoint shows it disabled.

        ### Audit via CLI

        1. List endpoints in a compartment and inspect their guardrail configuration:

        ```bash
        oci generative-ai endpoint-collection list-endpoints --compartment-id <compartment-ocid> \
          --query 'data.items[].{name:"display-name",piiDetection:"pii-detection-config"}'
        ```

        A passing endpoint reports a PII detection configuration that is enabled. A failing endpoint reports it disabled or unset.
      remediation:
        - id: console
          desc: |
            Enable PII detection on the endpoint:

            1. Open **Analytics & AI > Generative AI > Endpoints** and select the endpoint.
            2. Edit the guardrail configuration and enable PII detection, choosing block or redact mode where the application can tolerate it.
            3. Save the change.
        - id: cli
          desc: |
            Enable PII detection on an existing endpoint:

            ```bash
            oci generative-ai endpoint update --endpoint-id <endpoint-ocid> \
              --pii-detection-config '{"mode": "BLOCK"}'
            ```
        # No Terraform remediation: the endpoint's PII-detection guardrail is a service-side setting with no verified Terraform resource argument; manage it through the console or CLI.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/generative-ai/home.htm
        title: OCI - Generative AI
  # No Terraform variants: contentModerationEnabled reflects the guardrail configuration applied to the running Generative AI endpoint. This check evaluates the endpoint's live guardrail state; the endpoint's content-moderation configuration is managed through the service and is not represented by a verified Terraform resource argument.
  - uid: mondoo-oci-security-genai-endpoint-content-moderation
    title: Ensure Generative AI endpoints enable content moderation
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-ai-100-1: nist-ai-100-1-measure-2-6
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm05
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    filters: asset.platform == "oci-ai-generativeai-endpoint"
    mql: |
      oci.ai.generativeAi.endpoint.contentModerationEnabled == true
    docs:
      desc: |
        This check verifies that harmful content screening is active on every OCI Generative AI endpoint.

        Content moderation screens prompts and responses for abusive, unsafe, or policy-violating content and applies the configured action when a match is found. It is one of the guardrails set on an endpoint attached to a dedicated AI cluster, administered under Analytics & AI > Generative AI > Endpoints. The check requires `contentModerationEnabled` to be on, and the moderation mode should be set to block where the workload allows, so flagged content is rejected rather than only recorded.

        **Why this matters**

        An endpoint with moderation off will produce whatever a crafted prompt steers it toward. Models are trained to be helpful and will follow a request that is framed persuasively enough, so the absence of moderation is not a neutral default: it is the removal of the only input and output filter standing between a determined prompt and disallowed output.

        Scale is what turns that from an incident into a liability. An unmoderated endpoint exposed to users is a machine for generating harmful material on demand, and the volume it can produce is bounded only by the cluster's throughput. The organization owns the output because it owns the endpoint, and both the reputational and the legal consequences follow the tenancy rather than the caller.

        Moderation is also the third leg of the guardrail set. Prompt injection detection defends the model's instructions and personal data detection defends the data that moves through it; moderation defends the content itself. Enabling only some of the three leaves an obvious gap for anyone probing what the endpoint will accept.

        Route moderation events into monitoring so that a cluster of flagged requests from one caller is visible as an abuse pattern rather than a set of isolated blocks. An endpoint whose only consumers are internal and whose output is never surfaced to a person is the one case where recording mode is a defensible choice.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Analytics & AI > Generative AI > Endpoints** and select an endpoint.
        3. Review the **Content moderation** configuration.

        A passing endpoint shows content moderation enabled. A failing endpoint shows it disabled.

        ### Audit via CLI

        1. List endpoints in a compartment and inspect their content moderation configuration:

        ```bash
        oci generative-ai endpoint-collection list-endpoints --compartment-id <compartment-ocid> \
          --query 'data.items[].{name:"display-name",contentModeration:"content-moderation-config"}'
        ```

        A passing endpoint reports a content moderation configuration that is enabled. A failing endpoint reports it disabled or unset.
      remediation:
        - id: console
          desc: |
            Enable content moderation on the endpoint:

            1. Open **Analytics & AI > Generative AI > Endpoints** and select the endpoint.
            2. Edit the configuration and enable content moderation, choosing block mode where the application can tolerate it.
            3. Save the change.
        - id: cli
          desc: |
            Enable content moderation on an existing endpoint:

            ```bash
            oci generative-ai endpoint update --endpoint-id <endpoint-ocid> \
              --content-moderation-config '{"mode": "BLOCK"}'
            ```
        # No Terraform remediation: the endpoint's content-moderation guardrail is a service-side setting with no verified Terraform resource argument; manage it through the console or CLI.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/generative-ai/home.htm
        title: OCI - Generative AI
  # No Terraform variants: generativeAiPrivateEndpointID reflects the private endpoint bound to the running Generative AI endpoint. This check evaluates the endpoint's live association; the binding is managed through the service and is not represented by a verified Terraform resource argument.
  - uid: mondoo-oci-security-genai-endpoint-private-endpoint
    title: Ensure Generative AI endpoints use a private endpoint
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm02
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: asset.platform == "oci-ai-generativeai-endpoint"
    mql: |
      oci.ai.generativeAi.endpoint.generativeAiPrivateEndpointID != empty
    docs:
      desc: |
        This check verifies that inference traffic to every OCI Generative AI endpoint stays on the customer's private network.

        A Generative AI private endpoint places the service behind an address inside a subnet of the customer's virtual cloud network, so callers reach the model over private paths instead of public internet routes. It is provisioned under Analytics & AI > Generative AI > Private endpoints and then associated with the inference endpoint. The check requires the endpoint to carry a private endpoint association rather than leaving `generativeAiPrivateEndpointID` empty.

        **Why this matters**

        Prompts and responses are among the most sensitive traffic an application generates. A prompt carries whatever context the application assembled, which routinely means customer records, source code, internal documents, or credentials pasted by a user, and the response carries the model's reasoning over all of it. Sending that over public paths puts business data on network segments the organization neither owns nor observes.

        Reachability is the other half. An endpoint with no private endpoint is addressable from outside the private network, which means the attack surface includes anyone who learns the endpoint identifier and holds a credential, rather than only the workloads on the network. Confining the endpoint to a subnet removes that entire class of caller before authentication is even reached.

        Traffic that stays inside the virtual cloud network also inherits the controls already built there. Network security groups, flow logs, route tables, and the monitoring already watching the subnet all apply to inference traffic once it runs on private addresses, whereas traffic leaving over public paths is governed by none of them.

        Provision the private endpoint in the same network as the consuming application and route that application to it over private addresses, then govern the backing subnet with network security groups so the endpoint is reachable only from the workloads that should call it. An endpoint used solely for public-facing evaluation with no proprietary context is the narrow case where a public path is acceptable.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Analytics & AI > Generative AI > Endpoints** and select an endpoint.
        3. Review whether a **Generative AI private endpoint** is associated with the endpoint.

        A passing endpoint has a private endpoint associated. A failing endpoint has none.

        ### Audit via CLI

        1. List endpoints in a compartment and inspect the private endpoint association:

        ```bash
        oci generative-ai endpoint-collection list-endpoints --compartment-id <compartment-ocid> \
          --query 'data.items[].{name:"display-name",privateEndpointId:"generative-ai-private-endpoint-id"}'
        ```

        A passing endpoint returns a non-null `privateEndpointId`. A failing endpoint returns null.
      remediation:
        - id: console
          desc: |
            Associate the endpoint with a Generative AI private endpoint:

            1. Provision a Generative AI private endpoint in the target VCN under **Analytics & AI > Generative AI**.
            2. Open the endpoint and edit it to associate the private endpoint.
            3. Save the change and route consumers over the private network.
        - id: cli
          desc: |
            Associate an existing endpoint with a Generative AI private endpoint:

            ```bash
            oci generative-ai endpoint update --endpoint-id <endpoint-ocid> \
              --generative-ai-private-endpoint-id <private-endpoint-ocid>
            ```
        # No Terraform remediation: the private endpoint binding is a service-side association with no verified Terraform resource argument; manage it through the console or CLI.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/generative-ai/home.htm
        title: OCI - Generative AI
  # No Terraform variants: privateEndpointID reflects the Data Science private endpoint bound to the running notebook session. This check evaluates the session's live association; the binding is set at session creation and is not verified against a Terraform resource argument here.
  - uid: mondoo-oci-security-datascience-notebook-private-endpoint
    title: Ensure Data Science notebook sessions use a private endpoint
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm02
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    filters: asset.platform == "oci"
    mql: |
      oci.ai.dataScience.notebookSessions.all(
        privateEndpointID != empty
      )
    docs:
      desc: |
        This check verifies that every OCI Data Science notebook session has its network reach confined to the customer's private network.

        A Data Science private endpoint places a notebook session's connectivity inside a subnet of a virtual cloud network rather than allowing it to reach resources over public paths. It is created under Analytics & AI > Data Science > Private endpoints and assigned to a session when the session is created, since the binding cannot be added afterward. The check requires each session to carry a `privateEndpointID` rather than leaving it empty.

        **Why this matters**

        A notebook session is an interactive shell with a data science library stack in front of it. It routinely holds the data sets an analyst is working on, model artifacts, and the credentials needed to reach object storage buckets, databases, and internal APIs. Whoever controls the session controls all of that, which makes the session's network reach a meaningful part of the tenancy's attack surface rather than a developer convenience setting.

        Without a private endpoint the session's connectivity is unbounded by the network. Code running in the notebook can open outbound connections to arbitrary internet destinations, which is exactly the channel an attacker needs to exfiltrate a data set or a set of instance principal credentials. A malicious package pulled from a public index is enough to trigger it; the analyst does not have to do anything wrong.

        Binding the session to a private endpoint puts its traffic back under the controls that already exist. Route tables decide where it can go, network security groups decide what it can talk to, and flow logs record what it did, so a compromised notebook is contained by the same machinery that contains every other workload on the network.

        Apply network security groups and monitoring to the subnet backing the private endpoint so the containment is real rather than nominal. Sessions used purely for offline work against public sample data are the one case where the added networking is more overhead than benefit.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console.
        2. Navigate to **Analytics & AI > Data Science**, open a project, and select a notebook session.
        3. Review the **Networking** configuration for an associated private endpoint.

        A passing notebook session has a private endpoint associated. A failing session has none.

        ### Audit via CLI

        1. List notebook sessions in a compartment and inspect the private endpoint association:

        ```bash
        oci data-science notebook-session list --compartment-id <compartment-ocid> \
          --query 'data[].{name:"display-name",privateEndpointId:"notebook-session-config-details"."private-endpoint-id"}'
        ```

        A passing session returns a non-null private endpoint id. A failing session returns null.
      remediation:
        - id: console
          desc: |
            Place notebook sessions behind a Data Science private endpoint:

            1. Under **Analytics & AI > Data Science**, create a Data Science private endpoint in the target VCN.
            2. Create notebook sessions with the private endpoint selected under **Networking**, since the association is set at creation.
            3. Recreate existing sessions that lack a private endpoint.
        - id: cli
          desc: |
            Create a notebook session bound to a Data Science private endpoint by supplying it in the configuration details:

            ```bash
            oci data-science notebook-session create --project-id <project-ocid> \
              --compartment-id <compartment-ocid> \
              --config-details '{"privateEndpointId": "<private-endpoint-ocid>", "shape": "VM.Standard2.1", "blockStorageSizeInGBs": 50, "subnetId": "<subnet-ocid>"}'
            ```
        # No Terraform remediation: the notebook session's private endpoint is set at creation and is not verified against a Terraform resource argument here; manage it through the console or CLI.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/data-science/using/pe-concepts.htm
        title: OCI - Data Science Private Endpoints

  # ---------------------------------------------------------------------------
  # Network Firewall
  # ---------------------------------------------------------------------------
  - uid: mondoo-oci-security-network-firewall-decryption-profile-strict
    title: Ensure Network Firewall decryption profiles block unsafe TLS sessions
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-23
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Network Firewall decryption profiles block the TLS sessions they cannot validate rather than passing them through.

        A decryption profile tells the firewall what to do when TLS inspection encounters something it cannot handle. Every one of the relevant settings defaults to permissive, so a profile created without changing them decrypts and forwards sessions whose certificate is expired, whose issuer is untrusted, or whose cipher suite or protocol version the firewall does not support. This check requires `isUnsupportedVersionBlocked` and `isUnsupportedCipherBlocked` on every profile, and additionally requires `isExpiredCertificateBlocked`, `isUntrustedIssuerBlocked`, `isRevocationStatusTimeoutBlocked`, and `isUnknownRevocationStatusBlocked` on profiles of type `SSL_FORWARD_PROXY`. The certificate settings are forward-proxy only and read as unset on an inbound-inspection profile, so they are asserted only where they mean something. Edit profiles in the Console under Identity & Security > Network Firewall on the firewall policy, or with `oci network-firewall decryption-profile update`.

        **Why this matters**

        A permissive profile forwards exactly what inspection exists to catch. An expired certificate or an untrusted issuer is the signal that a session is being intercepted or served by an impostor, and a profile left at its defaults passes that session on to the destination anyway.

        Unsupported ciphers and protocol versions bypass inspection entirely. A session the firewall cannot decrypt is forwarded undecrypted unless blocking is turned on, so an attacker who negotiates an unsupported suite becomes invisible to every rule sitting behind the firewall.

        The failure mode is that the defaults read as configured. A profile exists and is attached to a policy, so a Console review shows decryption in place while nothing is actually being enforced against a session that fails validation.

        Turning the settings on makes validation failure a block rather than a warning. Expect some breakage on first enforcement from internal services using self-signed or long-expired certificates, and fix those certificates rather than reverting the profile.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Network Firewall > Policies**.
        2. Open each policy and select **Decryption profiles**.
        3. Open each profile and review its blocking settings.

        A passing profile blocks unsupported versions and ciphers, and for a forward-proxy profile also blocks expired certificates, untrusted issuers, and unknown or timed-out revocation status. A failing profile leaves any of these off.

        ### Audit via CLI

        1. List the decryption profiles in a policy:

        ```bash
        oci network-firewall decryption-profile list --network-firewall-policy-id <policy-ocid>
        ```

        A passing profile returns `true` for each blocking field. A failing profile returns `false`.
      remediation:
        - id: console
          desc: |
            To harden a decryption profile using the OCI Console:

            1. Navigate to **Networking > Network Firewall > Policies** and open the policy.
            2. Select **Decryption profiles** and open the profile.
            3. Enable blocking for unsupported versions and unsupported ciphers, and on a forward-proxy profile also for expired certificates, untrusted issuers, and unknown or timed-out revocation status.
            4. Select **Save changes** and apply the policy.
        - id: cli
          desc: |
            To harden a decryption profile using the OCI CLI:

            ```bash
            oci network-firewall decryption-profile update \
              --network-firewall-policy-id <policy-ocid> --decryption-profile-name <profile-name> \
              --type SSL_FORWARD_PROXY \
              --decryption-profile-details '{"isExpiredCertificateBlocked":true,"isUntrustedIssuerBlocked":true,"isRevocationStatusTimeoutBlocked":true,"isUnknownRevocationStatusBlocked":true,"isUnsupportedCipherBlocked":true,"isUnsupportedVersionBlocked":true,"isOutOfCapacityBlocked":true}'
            ```
        - id: terraform
          desc: |
            To harden a decryption profile in Terraform, set every blocking flag:

            ```hcl
            resource "oci_network_firewall_network_firewall_policy_decryption_profile" "example" {
              name                                 = "forward-proxy"
              network_firewall_policy_id           = oci_network_firewall_network_firewall_policy.example.id
              type                                 = "SSL_FORWARD_PROXY"
              is_expired_certificate_blocked       = true
              is_untrusted_issuer_blocked          = true
              is_revocation_status_timeout_blocked = true
              is_unknown_revocation_status_blocked = true
              is_unsupported_cipher_blocked        = true
              is_unsupported_version_blocked       = true
              is_out_of_capacity_blocked           = true
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/network-firewall/decryption-profiles.htm
        title: OCI Network Firewall decryption profiles
  - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-oci
    filters: asset.platform == 'oci'
    mql: |
      # The certificate settings are forward-proxy only and read null on an inbound-inspection
      # profile, so asserting them everywhere would compare null to true on profiles the
      # setting does not exist for.
      oci.networkFirewall.policies.all(
        decryptionProfiles.all(
          isUnsupportedVersionBlocked == true &&
          isUnsupportedCipherBlocked == true
        ) &&
        decryptionProfiles.where(type == "SSL_FORWARD_PROXY").all(
          isExpiredCertificateBlocked == true &&
          isUntrustedIssuerBlocked == true &&
          isRevocationStatusTimeoutBlocked == true &&
          isUnknownRevocationStatusBlocked == true
        )
      )
  - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_network_firewall_network_firewall_policy_decryption_profile')
    mql: |
      terraform.resources('oci_network_firewall_network_firewall_policy_decryption_profile').all(
        arguments['is_unsupported_version_blocked'] == true &&
        arguments['is_unsupported_cipher_blocked'] == true
      )
      terraform.resources('oci_network_firewall_network_firewall_policy_decryption_profile').where(
        arguments['type'] == 'SSL_FORWARD_PROXY'
      ).all(
        arguments['is_expired_certificate_blocked'] == true &&
        arguments['is_untrusted_issuer_blocked'] == true &&
        arguments['is_revocation_status_timeout_blocked'] == true &&
        arguments['is_unknown_revocation_status_blocked'] == true
      )
  - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_network_firewall_network_firewall_policy_decryption_profile')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_network_firewall_network_firewall_policy_decryption_profile').map(change.after).all(
        _['is_unsupported_version_blocked'] == true &&
        _['is_unsupported_cipher_blocked'] == true
      )
      terraform.plan.resourceChanges.where(type == 'oci_network_firewall_network_firewall_policy_decryption_profile').map(change.after).where(_['type'] == 'SSL_FORWARD_PROXY').all(
        _['is_expired_certificate_blocked'] == true &&
        _['is_untrusted_issuer_blocked'] == true &&
        _['is_revocation_status_timeout_blocked'] == true &&
        _['is_unknown_revocation_status_blocked'] == true
      )
  - uid: mondoo-oci-security-network-firewall-decryption-profile-strict-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_network_firewall_network_firewall_policy_decryption_profile')
    mql: |
      terraform.state.resources.where(type == 'oci_network_firewall_network_firewall_policy_decryption_profile').map(values).all(
        _['is_unsupported_version_blocked'] == true &&
        _['is_unsupported_cipher_blocked'] == true
      )
      terraform.state.resources.where(type == 'oci_network_firewall_network_firewall_policy_decryption_profile').map(values).where(_['type'] == 'SSL_FORWARD_PROXY').all(
        _['is_expired_certificate_blocked'] == true &&
        _['is_untrusted_issuer_blocked'] == true &&
        _['is_revocation_status_timeout_blocked'] == true &&
        _['is_unknown_revocation_status_blocked'] == true
      )

  - uid: mondoo-oci-security-network-firewall-no-allow-any-source
    title: Ensure Network Firewall allow rules name a source address list
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-network-firewall-no-allow-any-source-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-network-firewall-no-allow-any-source-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-network-firewall-no-allow-any-source-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-network-firewall-no-allow-any-source-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every Network Firewall rule granting an `ALLOW` verdict is scoped to a named source address list.

        A security rule's match condition is expressed by naming lists of sources, destinations, applications, and services. A condition that omits the source key does not match a narrow set of sources; it matches every source. An allow rule written without one therefore permits the named traffic from anywhere on the internet. An empty source list behaves the same way as an absent one, so this check treats both as unscoped and requires a non-empty source address list on every allow rule. Define the lists and reference them in the Console under Identity & Security > Network Firewall on the firewall policy, or with `oci network-firewall security-rule update`.

        **Why this matters**

        An omitted key is not a narrow rule, it is no rule. The condition reads as configured and the policy applies cleanly, but the absent source means the firewall extends the allow verdict to traffic arriving from any address at all.

        The defect is silent in review. A rule that lists a destination and an application looks properly scoped, and the missing source is visible only to a reviewer who already knows that absence means any.

        The firewall is the boundary, which is what makes this expensive. Traffic admitted by this rule has already passed the outermost control, so whatever downstream security list or network security group happens to be in the path is the only remaining barrier, and those are usually written on the assumption that the firewall already filtered by source.

        Name a source address list on every allow rule, defining the ranges the traffic is genuinely expected from. Order allow rules after an explicit catch-all drop so the policy is deny by default and a single unscoped rule cannot quietly become the effective policy.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Networking > Network Firewall > Policies**.
        2. Open each policy and select **Security rules**.
        3. For each rule whose action is **Allow**, review the **Source** condition.

        A passing rule names one or more source address lists. A failing rule leaves the source empty, which matches any address.

        ### Audit via CLI

        1. List the security rules in a policy:

        ```bash
        oci network-firewall security-rule list --network-firewall-policy-id <policy-ocid>
        ```

        A passing `ALLOW` rule returns a non-empty `sourceAddress` in its `condition`. A failing rule returns none.
      remediation:
        - id: console
          desc: |
            To scope an allow rule using the OCI Console:

            1. Navigate to **Networking > Network Firewall > Policies** and open the policy.
            2. Select **Security rules** and open the rule.
            3. Add one or more source address lists to the rule's condition, or change the action to **Drop**.
            4. Select **Save changes** and apply the policy.
        - id: cli
          desc: |
            To scope an allow rule using the OCI CLI:

            ```bash
            oci network-firewall security-rule update --network-firewall-policy-id <policy-ocid> \
              --security-rule-name <rule-name> --action ALLOW \
              --condition '{"sourceAddress":["corporate-ranges"],"destinationAddress":["app-tier"]}'
            ```
        - id: terraform
          desc: |
            To scope an allow rule in Terraform, name a source address list in the `condition` block:

            ```hcl
            resource "oci_network_firewall_network_firewall_policy_security_rule" "example" {
              name                       = "allow-partner-api"
              network_firewall_policy_id = oci_network_firewall_network_firewall_policy.example.id
              action                     = "ALLOW"
              inspection                 = "INTRUSION_PREVENTION"

              condition {
                source_address      = ["corporate-ranges"]
                destination_address = ["app-tier"]
              }

              position {
                after_rule = "deny-all"
              }
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/network-firewall/security-rules.htm
        title: OCI Network Firewall security rules
  - uid: mondoo-oci-security-network-firewall-no-allow-any-source-oci
    filters: asset.platform == 'oci'
    mql: |
      # An absent or empty sourceAddress key matches every source, so both cases have to
      # count as unscoped; != empty covers null and the empty list together.
      oci.networkFirewall.policies.all(
        securityRules.where(action == "ALLOW").all(
          condition["sourceAddress"] != empty
        )
      )
  - uid: mondoo-oci-security-network-firewall-no-allow-any-source-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_network_firewall_network_firewall_policy_security_rule')
    mql: |
      terraform.resources('oci_network_firewall_network_firewall_policy_security_rule').where(
        arguments['action'] == 'ALLOW'
      ).all(
        blocks.where(type == "condition") != empty &&
        blocks.where(type == "condition").all(arguments['source_address'] != empty)
      )
  - uid: mondoo-oci-security-network-firewall-no-allow-any-source-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_network_firewall_network_firewall_policy_security_rule')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_network_firewall_network_firewall_policy_security_rule').map(change.after).where(
        _['action'] == 'ALLOW'
      ).all(
        _['condition'] != empty &&
        _['condition'].all(_['source_address'] != empty)
      )
  - uid: mondoo-oci-security-network-firewall-no-allow-any-source-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_network_firewall_network_firewall_policy_security_rule')
    mql: |
      terraform.state.resources.where(type == 'oci_network_firewall_network_firewall_policy_security_rule').map(values).where(
        _['action'] == 'ALLOW'
      ).all(
        _['condition'] != empty &&
        _['condition'].all(_['source_address'] != empty)
      )

  # ---------------------------------------------------------------------------
  # Bastion
  # ---------------------------------------------------------------------------
  - uid: mondoo-oci-security-bastion-client-cidr-not-open
    title: Ensure bastions do not accept sessions from every address
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    variants:
      - uid: mondoo-oci-security-bastion-client-cidr-not-open-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-bastion-client-cidr-not-open-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-bastion-client-cidr-not-open-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-bastion-client-cidr-not-open-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no bastion accepts session creation from every address on the internet.

        The OCI Bastion service brokers access into a private subnet through three session types: a managed SSH session to an instance running the Oracle Cloud Agent Bastion plugin, an SSH port forwarding session to a specific host and port, and a dynamic port forwarding session that opens a SOCKS5 proxy. Every one of them is gated by the same list, `clientCidrBlockAllowList`, which names the source ranges a session may be created and connected from. The check fails a bastion whose list contains `0.0.0.0/0` or `::/0`. Narrow it under Identity & Security > Bastion, with `oci bastion bastion update --bastion-id <bastion-ocid> --client-cidr-list '["203.0.113.0/24"]'`, or through `client_cidr_block_allow_list` in Terraform.

        **Why this matters**

        A bastion exists precisely because the hosts behind it are not reachable any other way, so its allow list is the boundary those hosts depend on. Widen it to the whole internet and the one designed path in becomes a public one.

        Session creation then becomes reachable from anywhere, which makes the bastion a permanent target. Credential attacks against it never stop, and the audit trail fills with attempts from everywhere rather than from the handful of places your operators actually work.

        The entry is almost always a leftover. `0.0.0.0/0` gets added to unblock a remote incident or an onboarding, the immediate problem is solved, and nobody narrows it again once the reason has passed.

        List the ranges operators genuinely connect from, which is corporate egress addresses and VPN pools, and keep the list short enough that each entry is recognizable. Review it on a schedule, and treat any range added during an incident as expiring when that incident closes.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Identity & Security > Bastion**.
        2. Open each bastion and review **CIDR block allowlist**.

        A passing bastion lists only specific ranges. A failing bastion lists `0.0.0.0/0`.

        ### Audit via CLI

        1. List the bastions in a compartment and review their allow lists:

        ```bash
        oci bastion bastion list --compartment-id <compartment-ocid> --query 'data[].{name:name,cidrs:"client-cidr-block-allow-list"}'
        ```

        A passing bastion returns an allow list without `0.0.0.0/0`. A failing bastion includes it.
      remediation:
        - id: console
          desc: |
            To narrow a bastion's allow list using the OCI Console:

            1. Navigate to **Identity & Security > Bastion** and open the bastion.
            2. Select **Edit** and replace `0.0.0.0/0` in **CIDR block allowlist** with the ranges operators connect from.
            3. Select **Save changes**.
        - id: cli
          desc: |
            To narrow a bastion's allow list using the OCI CLI:

            ```bash
            oci bastion bastion update --bastion-id <bastion-ocid> \
              --client-cidr-list '["203.0.113.0/24"]'
            ```
        - id: terraform
          desc: |
            To scope a bastion's allow list in Terraform, name the ranges in `client_cidr_block_allow_list`:

            ```hcl
            resource "oci_bastion_bastion" "example" {
              bastion_type                 = "STANDARD"
              compartment_id               = var.compartment_ocid
              target_subnet_id             = oci_core_subnet.private.id
              name                         = "ops-bastion"
              client_cidr_block_allow_list = ["203.0.113.0/24"]
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Bastion/Concepts/bastionoverview.htm
        title: OCI Bastion overview
  - uid: mondoo-oci-security-bastion-client-cidr-not-open-oci
    filters: asset.platform == 'oci'
    mql: |
      oci.bastion.bastions.all(
        clientCidrBlockAllowList.none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-oci-security-bastion-client-cidr-not-open-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_bastion_bastion')
    mql: |
      terraform.resources('oci_bastion_bastion').all(
        arguments['client_cidr_block_allow_list'] == empty ||
        arguments['client_cidr_block_allow_list'].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-oci-security-bastion-client-cidr-not-open-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_bastion_bastion')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_bastion_bastion').map(change.after).all(
        _['client_cidr_block_allow_list'] == empty ||
        _['client_cidr_block_allow_list'].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-oci-security-bastion-client-cidr-not-open-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_bastion_bastion')
    mql: |
      terraform.state.resources.where(type == 'oci_bastion_bastion').map(values).all(
        _['client_cidr_block_allow_list'] == empty ||
        _['client_cidr_block_allow_list'].none(_ == "0.0.0.0/0" || _ == "::/0")
      )

  - uid: mondoo-oci-security-bastion-session-ttl-limited
    title: Ensure bastion sessions expire within one hour
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iii-access-control-automatic-logoff
      compliance/iso-27001-2022: iso-27001-2022-a-5-15
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-11
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-oci-security-bastion-session-ttl-limited-oci
        tags:
          mondoo.com/filter-title: OCI
          mondoo.com/filter-icon: oci
      - uid: mondoo-oci-security-bastion-session-ttl-limited-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-bastion-session-ttl-limited-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-oci-security-bastion-session-ttl-limited-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every bastion caps how long a session may stay open at one hour or less.

        `maxSessionTtlInSeconds` on an OCI Bastion is the ceiling applied to every session created through it, managed SSH and port forwarding alike, after which the session ends and has to be recreated. Oracle permits values up to three hours, and the check requires 3600 seconds or fewer. A bastion that reports no limit at all fails as well, because an unbounded lifetime is not a bounded one. Because a bastion session is privileged access into a private subnet, that ceiling is the window in which a session left open on an unattended workstation, or captured from one, remains usable. Set it under Identity & Security > Bastion, with `oci bastion bastion update --bastion-id <bastion-ocid> --max-session-ttl 3600`, or through `max_session_ttl_in_seconds` in Terraform.

        **Why this matters**

        A live session needs no credentials. Whoever reaches the terminal inherits the access already established there, so the ceiling on session length is directly the ceiling on that exposure.

        Sessions also outlive the work that justified them. Access opened for a twenty-minute task stays open for hours when nothing forces it closed, and the operator has long since moved on to something else.

        Recreating a session costs a single command, so a short ceiling is cheap. It bounds every session on the bastion at once, without anyone having to remember to close one.

        Set the maximum to one hour or less and let long-running work reconnect, since the ceiling only decides how long a forgotten session survives. Individual sessions can request less than the bastion maximum, and routine access rarely needs the full hour, so prefer per-session lifetimes well below the ceiling rather than treating the maximum as the default.
      audit: |
        ### Audit via Console

        1. Sign in to the OCI Console and navigate to **Identity & Security > Bastion**.
        2. Open each bastion and review **Maximum session time-to-live**.

        A passing bastion shows 3600 seconds or less. A failing bastion shows more.

        ### Audit via CLI

        1. List the bastions in a compartment and review their maximum session TTL:

        ```bash
        oci bastion bastion list --compartment-id <compartment-ocid> --query 'data[].{name:name,ttl:"max-session-ttl-in-seconds"}'
        ```

        A passing bastion returns a `maxSessionTtlInSeconds` of 3600 or less. A failing bastion returns more.
      remediation:
        - id: console
          desc: |
            To shorten a bastion's session lifetime using the OCI Console:

            1. Navigate to **Identity & Security > Bastion** and open the bastion.
            2. Select **Edit** and set **Maximum session time-to-live** to 3600 seconds or less.
            3. Select **Save changes**.
        - id: cli
          desc: |
            To shorten a bastion's session lifetime using the OCI CLI:

            ```bash
            oci bastion bastion update --bastion-id <bastion-ocid> \
              --max-session-ttl 3600
            ```
        - id: terraform
          desc: |
            To cap session lifetime in Terraform, set `max_session_ttl_in_seconds`:

            ```hcl
            resource "oci_bastion_bastion" "example" {
              bastion_type                 = "STANDARD"
              compartment_id               = var.compartment_ocid
              target_subnet_id             = oci_core_subnet.private.id
              name                         = "ops-bastion"
              client_cidr_block_allow_list = ["203.0.113.0/24"]
              max_session_ttl_in_seconds   = 3600
            }
            ```
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/Bastion/Tasks/managingbastions.htm
        title: Managing OCI bastions
  - uid: mondoo-oci-security-bastion-session-ttl-limited-oci
    filters: asset.platform == 'oci'
    mql: |
      # maxSessionTtlInSeconds is null when the bastion reports no limit, which is not a
      # bounded lifetime, so presence is asserted before the comparison.
      oci.bastion.bastions.all(
        maxSessionTtlInSeconds != empty && maxSessionTtlInSeconds <= 3600
      )
  - uid: mondoo-oci-security-bastion-session-ttl-limited-terraform-hcl
    filters: |
      asset.platform == 'terraform-hcl' && terraform.resources.contains(nameLabel == 'oci_bastion_bastion')
    mql: |
      terraform.resources('oci_bastion_bastion').all(
        arguments['max_session_ttl_in_seconds'] != empty &&
        arguments['max_session_ttl_in_seconds'] <= 3600
      )
  - uid: mondoo-oci-security-bastion-session-ttl-limited-terraform-plan
    filters: |
      asset.platform == 'terraform-plan' && terraform.plan.resourceChanges.contains(type == 'oci_bastion_bastion')
    mql: |
      terraform.plan.resourceChanges.where(type == 'oci_bastion_bastion').map(change.after).all(
        _['max_session_ttl_in_seconds'] != empty &&
        _['max_session_ttl_in_seconds'] <= 3600
      )
  - uid: mondoo-oci-security-bastion-session-ttl-limited-terraform-state
    filters: |
      asset.platform == 'terraform-state' && terraform.state.resources.contains(type == 'oci_bastion_bastion')
    mql: |
      terraform.state.resources.where(type == 'oci_bastion_bastion').map(values).all(
        _['max_session_ttl_in_seconds'] != empty &&
        _['max_session_ttl_in_seconds'] <= 3600
      )

