  # No Terraform variants: certificate validity is dynamic operational telemetry derived from the issuance time and validity duration of the current cert version. The Terraform resource declares the validity duration but cannot predict scan-time expiry, so a static check would either be vacuous or require time-of-scan logic that lives outside HCL/plan/state.
  # No Terraform remediation: same reason — there is no HCL change that "fixes" an expired cert; the fix is to issue a new version through the OCI Certificates Management service.
  - uid: mondoo-oci-security-certificates-not-expired
    title: Ensure managed certificates are not expired or near expiry
    impact: 80
    filters: asset.platform == 'oci'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      oci.certificates.certificates.where(state == "ACTIVE").all(
        validityNotAfter - time.now > 30 * time.day
      )
    docs:
      desc: |
        This check verifies that every active certificate held in the OCI Certificates service carries more than 30 days of remaining validity.

        The service both issues certificates from a managed certificate authority and stores certificates imported from an external one. Renewal is not automatic for every certificate type, so a certificate with no renewal rule attached simply runs down its validity period and expires. The check reads the expiry date of each certificate in the `ACTIVE` state and requires more than 30 days of headroom, which is enough for a renewal pipeline to run on its own schedule. Certificates and their renewal rules live under Identity & Security > Certificates in the Console and are edited with `oci certs-mgmt certificate update`.

        **Why this matters**

        Expiry is an availability event before it is a security one. The moment a certificate passes its expiry date, every consumer's TLS handshake fails at once, and nothing short of issuing and deploying a new certificate version restores service. Load balancers, internal service calls, and monitoring pipelines break together, because they all trusted the same object.

        What happens next is the security problem. Operators working a live outage reach for the fastest fix available, which is usually disabling certificate verification in the client. That switch is rarely turned back on, and the deployment keeps running with verification off long after a valid certificate is in place.

        A short-notice renewal also skips the steps that govern planned issuance. Approval, pinning updates, and monitoring registration are what make a new certificate trustworthy, and a replacement rushed out mid-incident bypasses all of them, which is precisely when an unauthorized substitution would go unnoticed.

        Flagging certificates 30 days out converts all of that into scheduled work and surfaces renewal failures before any downstream consumer notices. The continuous result doubles as audit evidence that the certificate inventory is actively maintained rather than rediscovered during outages.
      audit: |
        ### Audit via Console

        1. Open **Identity & Security** in the OCI Console and navigate to **Certificates** -> **Certificates**.
        2. Review the **Status** column for each certificate and check the **Validity not after** date.
        3. Flag any certificate whose expiry is within 30 days of today or has already passed.

        A passing certificate shows a **Validity not after** date more than 30 days in the future with status **Active**. A failing certificate shows an expiry within 30 days or shows status **Expired**.

        ### Audit via CLI

        1. List all active certificates and check their validity end dates:

        ```bash
        oci certs-mgmt certificate list \
          --compartment-id <compartment-ocid> \
          --lifecycle-state ACTIVE \
          --query 'data.items[*].{name:name, id:id, notAfter:"current-version-summary"."validity"."time-of-validity-not-after"}' \
          --output table
        ```

        A passing certificate shows a `notAfter` value more than 30 days from the current date. A failing certificate shows a `notAfter` value within 30 days or in the past.
      remediation:
        - id: console
          desc: |
            Issue a new version for each near-expiry or expired certificate:

            1. Open **Identity & Security** → **Certificates** → **Certificates** → select the certificate.
            2. Choose **Issue New Version**.
            3. For internally issued certificates, enable a `CERTIFICATE_RENEWAL_RULE` so future versions auto-renew.
            4. Trigger the new version, verify the consumers pick it up, and remove the old version once dependents have rotated.
        - id: cli
          desc: |
            A renewal rule only governs future renewals, so a near-expiry certificate still expires this cycle unless you issue a new version now. Do both: issue a fresh version immediately, then add a renewal rule so this does not recur.

            1. Issue a new version immediately so the certificate stops failing this cycle:

            ```bash
            oci certs-mgmt certificate update-certificate-managed-internally \
              --certificate-id <certificate-ocid> \
              --version-name <new-version-name> \
              --force
            ```

            2. Add or update a renewal rule so the next version is issued automatically before the current one expires:

            ```bash
            oci certs-mgmt certificate update-certificate-managed-internally \
              --certificate-id <certificate-ocid> \
              --certificate-rules '[{"ruleType":"CERTIFICATE_RENEWAL_RULE","advanceRenewalPeriod":"P30D","renewalInterval":"P365D"}]'
            ```
        # No Terraform remediation: certificate expiry is dynamic operational telemetry derived from the issuance time and validity duration of the current cert version; there is no HCL change that resolves an expired or near-expiry certificate — the fix is to issue a new version through the OCI Certificates Management service.
    refs:
      - url: https://docs.oracle.com/en-us/iaas/Content/certificates/managing-certificates.htm
        title: OCI - Managing Certificates
