      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    props:
      - uid: mondooOktaSecurityOktaPasswordMaxAge
        title: Length in days a password is valid before expiry
        mql: "90"
    variants:
      - uid: mondoo-okta-security-password-settings-max-age-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-password-settings-max-age-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-max-age-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-max-age-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every password policy expires passwords rather than letting one credential remain valid forever.

        Password expiry is set per policy in the Admin Console under Security > Authentication, where a password policy states how many days a password stays valid. Okta does not expire passwords unless a maximum age is configured. This check requires an expiry that is set and no longer than 90 days.

        **Why this matters**

        A credential that never expires is a credential whose compromise never ends. Passwords leak in ways the org never learns about, through a reused copy at a service that was breached, an infostealer on a home machine, or a phishing harvest sold on months later, and none of those events produce an alert in the org's own logs. Expiry is the only mechanism that invalidates a quietly stolen password without anyone knowing it was stolen.

        The same argument covers accounts nobody is watching. Dormant accounts, contractors whose engagement ended without an offboarding ticket, and shared service identities keep working indefinitely on a password set years earlier, and an expiry cycle either forces attention to them or takes them out of service.

        Expiry is contested guidance and the objection is real: forced rotation on a short cycle pushes users toward incremental passwords and toward writing them down, which can cost more than it buys. That objection lands against short cycles combined with weak length and history rules, not against a bounded lifetime as such.

        Choose an interval long enough that users treat each change as a real choice, and support it with a deep password history and a minimum age so the new password cannot be the old one. Where the org has phishing-resistant authentication and monitors for breached credentials, a longer interval is a defensible tradeoff, but an unbounded lifetime is not.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Authentication**.
        2. Open the **Password** tab and select the password policy to review.
        3. Under **Password settings**, locate the **Age** section and read the **Password expires** value.

        A passing result shows passwords expiring within 90 days for every policy; a failing result shows expiry set to 0 (never) or longer than 90 days.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=PASSWORD"
        ```

        A passing response has `settings.password.age.maxAgeDays` greater than 0 and 90 or less for every policy; a failing response has it set to 0 or greater than 90.
      remediation:
        - id: console
          desc: |
            ### Set a maximum password age

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select **Password**. On Okta Classic Engine orgs, go to **Security > Authentication** and select the **Password** tab.
            2. Locate the policy and select **Edit**.
            3. Under **Password settings**, in **Age**, enable **Password expires after** and set it to 90 days or fewer. A value of 0 disables expiry and leaves passwords valid indefinitely.
            4. Select **Update Policy**.
        - id: terraform
          desc: |
            Set this attribute inside your single, consolidated `okta_policy_password_default` resource alongside your other password settings. The snippet below shows only the attribute relevant to this check. Applying a standalone resource that defines just this one attribute resets every other password setting on the default policy back to the Terraform provider defaults, so merge it with your existing definition rather than applying it on its own.

            ```hcl
            resource "okta_policy_password_default" "default" {
              password_max_age_days = 90
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/content/topics/security/policies/configure-password-policies.htm
        title: Okta Password Policies
