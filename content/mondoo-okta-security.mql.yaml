        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-enable-okta-verify-with-push-for-mfa-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Okta Verify is available for enrollment in at least one multifactor enrollment policy.

        Okta Verify is Okta's own authenticator app. It proves possession of a registered device through a push approval or a time-based code, and on supported platforms it binds the approval to that device. Its availability is set in the Admin Console under Security > Authenticators, where Okta Verify must be required or optional on the enrollment tab of a policy. This check requires at least one enrollment policy to offer it.

        **Why this matters**

        Without a strong authenticator available, the org's multifactor story falls back to whatever weak factor remains, and an attacker holding a password from a breach reuse list or a phishing page meets a challenge the same page can defeat. Okta Verify moves the second factor onto hardware the attacker does not have.

        Number challenge closes the gap that plain push leaves open. Plain push approvals can be defeated by volume: an attacker with a valid password fires request after request until a tired or confused user taps approve, a pattern that has produced real breaches at large organizations. Requiring the user to select a number displayed on the sign-in screen means an approval cannot be harvested from someone who is not looking at the attacker's session.

        Device binding matters for the same reason. An Okta Verify enrollment ties the factor to a device the user carries, so an attacker with a stolen password and no device has no way to satisfy the challenge from their own machine.

        Okta Verify raises the bar but is not phishing resistant on its own, since a proxy kit can still relay a plain push or a typed code. Where the risk warrants it, add a WebAuthn security key or platform authenticator for administrators, and pair enrollment with a sign-on rule that actually requires a factor at sign-in.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Multifactor**.
        2. Select **Factor Enrollment** and open each policy.
        3. Confirm that Okta Verify is set to optional or required in at least one policy.

        A passing result shows Okta Verify available for enrollment; a failing result shows Okta Verify disabled across all factor enrollment policies.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=MFA_ENROLL"
        ```

        For each policy, inspect the settings. Orgs on Okta Classic Engine list factors under `settings.factors`; a passing response shows the `okta_otp` factor enabled in at least one policy. Orgs on Okta Identity Engine list authenticators under `settings.authenticators`; a passing response shows the `okta_verify` authenticator set to optional or required in at least one policy. A failing response has no policy with Okta Verify enabled. The authenticator can also be confirmed with `GET /api/v1/authenticators`.
      remediation:
        - id: console
          desc: |
            ### Enable Okta Verify with push for MFA

            1. On Okta Identity Engine orgs, go to **Security > Authenticators**. If Okta Verify is not listed, select **Add authenticator** and add **Okta Verify**. Select **Edit** on Okta Verify and enable **Push notification** as a verification option.
            2. On Okta Classic Engine orgs, go to **Security > Multifactor**, open the **Factor Types** tab, select **Okta Verify**, set it to **Active**, and enable **Okta Verify with Push**.
            3. Open the factor enrollment policies: the **Enrollment** tab under **Security > Authenticators** on Identity Engine, or **Factor Enrollment** under **Security > Multifactor** on Classic Engine.
            4. Set Okta Verify to **Required** or **Optional** in at least one active enrollment policy.
            5. Select **Update Policy**.
        - id: terraform
          desc: |
            For orgs on Okta Classic Engine:

            ```hcl
            resource "okta_policy_mfa_default" "classic_example" {
              is_oie = false

              okta_otp = {
                enroll = "REQUIRED"
              }

              okta_push = {
                enroll = "REQUIRED"
              }
            }
            ```

            For orgs on Okta Identity Engine, Okta Verify covers both push and one-time codes:

            ```hcl
            resource "okta_policy_mfa_default" "oie_example" {
              is_oie = true

              okta_password = {
                enroll = "REQUIRED"
              }

              okta_verify = {
                enroll = "REQUIRED"
              }
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/content/topics/security/mfa/mfa-home.htm
        title: Okta Multifactor Authentication
