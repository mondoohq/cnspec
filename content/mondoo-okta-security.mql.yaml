        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every password policy makes a user wait before they can change their password again.

        Minimum password age is set per policy in the Admin Console under Security > Authentication, where a password policy states how long a new password must be kept before another change is allowed. Okta enforces no waiting period unless one is configured. This check requires at least 60 minutes in every policy.

        **Why this matters**

        Without a waiting period, password history is decorative. A user required to pick something new and unwilling to do so can change the password as many times as the history depth demands, in a single sitting, and then set it back to the value they started with. The org's records show a rotation that never happened and a history buffer full of throwaway values.

        That matters after a compromise, not only at routine rotation. When an incident forces a password change, the whole point is that the old credential stops working, and a user who cycles straight back to it hands the attacker a credential the org believes it retired.

        A waiting period also blunts a specific attack. An attacker holding a session but not the password can change it to a value they choose, and an owner who changes it back immediately produces a race the attacker can simply rerun. A minimum age gives the org's revocation and reset processes time to act rather than trading changes with an intruder.

        Set the interval long enough to break the cycling loop and short enough that a user who mistypes a new password into a password manager, or genuinely needs a second change, is not blocked for a working day.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Authentication**.
        2. Open the **Password** tab and select the password policy to review.
        3. Under **Password settings**, locate the **Age** section and read the **Minimum password age** value.

        A passing result shows a minimum password age of 60 minutes or more for every policy; a failing result shows a minimum age below 60 minutes or no minimum set.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=PASSWORD"
        ```

        A passing response has `settings.password.age.minAgeMinutes` of 60 or greater for every policy; a failing response has a value below 60.
      remediation:
        - id: console
          desc: |
            ### Enforce a minimum password age

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select **Password**. On Okta Classic Engine orgs, go to **Security > Authentication** and select the **Password** tab.
            2. Locate the policy and select **Edit**.
            3. Under **Password settings**, in **Age**, set the minimum password age to at least 1 hour so users cannot cycle through their password history immediately. The console expresses this value in hours, which corresponds to 60 minutes in the API.
            4. Select **Update Policy**.
        - id: terraform
          desc: |
            Set this attribute inside your single, consolidated `okta_policy_password_default` resource alongside your other password settings. The snippet below shows only the attribute relevant to this check. Applying a standalone resource that defines just this one attribute resets every other password setting on the default policy back to the Terraform provider defaults, so merge it with your existing definition rather than applying it on its own.

            ```hcl
            resource "okta_policy_password_default" "default" {
              password_min_age_minutes = 60
            }
            ```
