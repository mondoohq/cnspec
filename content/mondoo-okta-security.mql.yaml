  - uid: mondoo-okta-security-password-settings-max-lockout-attempts
    title: Enforce strong password policy - max lockout attempts
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-4
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    props:
      - uid: mondooOktaSecurityOktaPasswordMaxLockoutAttempts
        mql: "5"
    variants:
      - uid: mondoo-okta-security-password-settings-max-lockout-attempts-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-password-settings-max-lockout-attempts-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-max-lockout-attempts-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-max-lockout-attempts-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every password policy locks an account after a small number of consecutive failed sign-in attempts.

        The lockout threshold is set per policy in the Admin Console under Security > Authentication, where a password policy states how many unsuccessful attempts are allowed before the account is locked. This check requires a threshold that is actually set and no higher than five, since a value of zero means no lockout at all.

        **Why this matters**

        Without a lockout, an attacker can guess against a single account until they succeed. Rate limiting slows that down, but an attacker working from a wordlist ordered by real-world frequency does not need many guesses, and a password chosen from the shapes people actually use falls well inside what an unlimited attempt budget allows.

        A low threshold is what makes password spraying expensive. Spraying works by trying one common password against every account rather than many passwords against one, precisely to stay under lockout thresholds, and a limit of five leaves an attacker very few passes across the directory before locked accounts start appearing in the log as an obvious signal.

        Lockouts also convert a silent attack into a visible one. An account that locks itself repeatedly is a report a security team can act on, and it arrives while the attacker is still guessing rather than after they have found a working credential.

        Lockouts can be turned against the org, since an attacker who knows usernames can lock people out deliberately. Pair the threshold with an automatic unlock interval so a denial-of-service attempt expires on its own, and with a network blocklist so the traffic driving those lockouts is stopped before it reaches the credential check.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Authentication**.
        2. Select the **Password** tab and open each policy.
        3. Confirm the **Lock out** setting limits invalid attempts to your approved maximum.

        A passing result shows every password policy enforcing a lockout threshold within the limit; a failing result shows a policy with no lockout or too high a threshold.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=PASSWORD"
        ```

        For each policy, inspect `settings.password.lockout.maxAttempts`. A passing response shows that value at or below your approved maximum for every policy; a failing response shows a policy exceeding it.
      remediation:
        - id: console
          desc: |
            ### Limit failed sign-in attempts before lockout

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select **Password**. On Okta Classic Engine orgs, go to **Security > Authentication** and select the **Password** tab.
            2. Locate the policy and select **Edit**.
            3. Under **Password settings**, in **Lock out**, enable the option to lock out users after unsuccessful attempts and set the limit to 5 or fewer. Do not leave the value at 0, which disables lockout entirely.
            4. Select **Update Policy**.
        - id: terraform
          desc: |
            Set this attribute inside your single, consolidated `okta_policy_password_default` resource alongside your other password settings. The snippet below shows only the attribute relevant to this check. Applying a standalone resource that defines just this one attribute resets every other password setting on the default policy back to the Terraform provider defaults, so merge it with your existing definition rather than applying it on its own.

            ```hcl
            resource "okta_policy_password_default" "default" {
              password_max_lockout_attempts = 5
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/content/topics/security/policies/configure-password-policies.htm
        title: Okta Password Policies
