  - uid: mondoo-okta-security-password-settings-minimum-length
    title: Enable strong password settings for password policies - minimum length
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    props:
      - uid: mondooOktaSecurityOktaPasswordLength
        mql: "15"
    variants:
      - uid: mondoo-okta-security-password-settings-minimum-length-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-password-settings-minimum-length-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-minimum-length-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-minimum-length-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every password policy sets a minimum password length long enough to resist offline cracking.

        Minimum length is set per policy in the Admin Console under Security > Authentication, among a password policy's complexity requirements. This check requires at least 15 characters in every policy the org defines.

        **Why this matters**

        Length is the only password property that reliably costs an attacker time. Cracking rigs work through short passwords exhaustively whatever character classes they contain, so an eight character password with a symbol and a digit falls in the same session as an eight character word. Each additional character multiplies the search space, and around fifteen characters brute force stops being the cheap path.

        That matters because Okta credentials rarely stay inside Okta. Users reuse them, and the copy that leaks is usually held by a smaller service with weaker hashing. Once an attacker has a hash from somewhere else, the org's lockout thresholds and rate limits do not apply, because the guessing happens offline against a file. Length is what remains.

        A long minimum also pushes users away from the patterns attackers model. Wordlist and rule-based attacks target the shapes people produce under short limits, a capitalized word followed by a year and a punctuation mark, and those shapes do not stretch to fifteen characters without becoming a passphrase.

        Set the requirement alongside a check against common passwords, since length alone does not stop a user from choosing a long phrase that already sits in a wordlist. Where a legacy integration cannot accept long passwords, scope a separate policy to it rather than lowering the minimum for the whole org.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Authentication**.
        2. Select the **Password** tab and open each policy.
        3. Confirm the minimum password length meets your approved threshold.

        A passing result shows every password policy enforcing a strong minimum length; a failing result shows a policy with a length below the threshold.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=PASSWORD"
        ```

        For each policy, inspect `settings.password.complexity.minLength`. A passing response shows that value at or above your minimum length threshold for every policy; a failing response shows a policy below it.
      remediation:
        - id: console
          desc: |
            ### Set a strong minimum password length

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select **Password**. On Okta Classic Engine orgs, go to **Security > Authentication** and select the **Password** tab.
            2. Locate the policy and select **Edit**.
            3. Under **Password settings**, set **Minimum length** to at least 15 characters.
            4. Select **Update Policy**.
