  - uid: mondoo-okta-security-threatinsight-action-block
    title: Ensure ThreatInsight is configured to block suspicious login attempts
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-okta-security-threatinsight-action-block-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-threatinsight-action-block-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-threatinsight-action-block-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-threatinsight-action-block-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Okta ThreatInsight enforces against traffic from known-malicious IP addresses instead of only recording it.

        ThreatInsight scores inbound authentication requests using threat intelligence Okta gathers across its customer base, and its action setting decides what happens to a request from an address that scores badly. The setting is in the Admin Console under Security > General, in the ThreatInsight section, with options to log and enforce, to log only, or to do nothing. This check requires the enforcing option.

        **Why this matters**

        The difference between logging and enforcing is whether the attacker's guesses reach a password check at all. Set to log only, ThreatInsight writes an entry and passes the request through, so a credential stuffing run against the org proceeds at full speed with a running commentary in the System Log. Every attempt is still a chance to hit a reused password, and the log only helps if someone is reading it while the attack is happening.

        Enforcement also protects the users who are not compromised. Requests stopped before credential evaluation do not increment lockout counters, so an attacker spraying the directory cannot lock the workforce out of every federated application as a side effect of failing. In log-only mode that denial of service happens whether or not the attacker guesses anything correctly.

        The intelligence is what makes this cheap to run. The addresses ThreatInsight scores are those seen attacking other Okta orgs, so the org gets enforcement against infrastructure already burned elsewhere without building or maintaining a list of its own.

        Enforcement can catch a legitimate user behind a shared or previously abused address, so exempt the network zones the org trusts rather than dropping the whole org back to log-only mode.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > General**.
        2. Locate the **Okta ThreatInsight settings** section.
        3. Read the configured action.

        A passing result shows **Log and enforce security based on threat level**; a failing result shows **Log authentication attempts from malicious IPs**, which records without enforcing, or **No Action**, which disables enforcement entirely.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/threats/configuration"
        ```

        A passing response has `action` set to `block`; a failing response shows `audit` or `none`.
      remediation:
        - id: console
          desc: |
            ### Configure ThreatInsight to block suspicious login attempts

            1. In the Admin Console, go to **Security > General**.
            2. In the **Okta ThreatInsight settings** section, select **Edit**.
            3. Select **Log and enforce security based on threat level**. This is the only setting that maps to the `block` action the check reads. **Log authentication attempts from malicious IPs** records the attempt and lets it through, and **No Action** disables enforcement while data collection continues.
            4. Optionally, add trusted network zones to the exclude list to prevent false positives.
            5. Select **Save**. The change can take a few minutes to take effect.
        - id: terraform
          desc: |
            ```hcl
            resource "okta_threat_insight_settings" "default" {
              action = "block"
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/Content/Topics/Security/threat-insight/configure-threatinsight.htm
        title: Configure Okta ThreatInsight
      - url: https://help.okta.com/en-us/Content/Topics/Security/healthinsight/healthinsight-security-task-recomendations.htm
        title: HealthInsight tasks and recommendations
  - uid: mondoo-okta-security-threatinsight-action-block-api
    filters: asset.platform == "okta-org"
    mql: okta.organization.threatInsightSettings.action == "block"
  - uid: mondoo-okta-security-threatinsight-action-block-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.providers.any( nameLabel == "okta" )
    mql: |
      terraform.resources("okta_threat_insight_settings").all( arguments['action'] == "block" )
