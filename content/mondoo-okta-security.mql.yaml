  - uid: mondoo-okta-security-okta-mfa-access
    title: Require at least one factor in every MFA enrollment policy
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-4-2
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-okta-security-okta-mfa-access-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-okta-mfa-access-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-okta-mfa-access-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-okta-mfa-access-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that multifactor enrollment reaches every user in the org rather than a self-selected subset.

        Enrollment policies decide which authenticators a population must register and which people they apply to. They are configured in the Admin Console under Security > Authenticators, on the enrollment tab, where each policy is assigned to one or more groups and each authenticator within it is required, optional, or disallowed. This check requires an active enrollment policy that covers the built-in Everyone group with at least one authenticator set to required.

        **Why this matters**

        Coverage gaps in enrollment are invisible from the outside and obvious from the inside. When a policy is scoped to the engineering group and the finance group, then contractors, accounts used for interactive service sign-in, and anyone hired into a group nobody remembered to add hold a password and nothing else. An attacker looking for a way into the org does not need to defeat multifactor authentication; they need to find the one person who never had to enroll.

        Assigning a policy to Everyone removes that search. New users inherit coverage on their first sign-in rather than at whatever point someone notices the omission, and a group reorganization cannot silently drop a population out of scope.

        Making an authenticator required rather than optional is what turns coverage into enrollment. An optional authenticator leaves the choice with the user, and users deferring enrollment indefinitely produces the same password-only accounts a missing policy would.

        Enrollment is not enforcement. A user can hold a registered authenticator and still sign in without ever being challenged for it, so pair this with the companion check in this policy that requires a factor at sign-in.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Multifactor**.
        2. Select **Factor Enrollment** and review the policy list.
        3. Confirm that at least one policy is active and assigned to the Everyone group, then open it and confirm it sets at least one factor to required.

        A passing result shows an active enrollment policy assigned to the Everyone group; a failing result shows no active policy scoped to all users. The scan verdict rests on that assignment, so review the factor settings by hand as well, because a policy scoped to Everyone that requires nothing still leaves users unprotected.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=MFA_ENROLL"
        ```

        A passing response includes a policy with `status` of `ACTIVE` whose `conditions.people.groups.include` contains the Everyone group ID; a failing response has no active policy scoped to that group. Inspect that policy's `settings.factors` on Okta Classic Engine, or `settings.authenticators` on Okta Identity Engine, to confirm a factor is set to `REQUIRED`.
      remediation:
        - id: console
          desc: |
            ### Require a factor for all users in an MFA enrollment policy

            Step 2 is what makes this check pass, because the verdict rests on whether an active enrollment policy is scoped to the Everyone group. Step 3 is what makes that policy actually protect anyone, so complete both.

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select the **Enrollment** tab. On Okta Classic Engine orgs, go to **Security > Multifactor** and select **Factor Enrollment**.
            2. Confirm that an active enrollment policy is assigned to the **Everyone** group. If none is, edit a policy and add the Everyone group under **Assigned to groups**.
            3. Select **Edit** on that policy and set at least one factor, such as Okta Verify, to **Required**.
            4. Select **Update Policy**.
            5. To prompt users to enroll, edit the policy rule and choose to enroll users the first time they sign in or the first time they are challenged for MFA.

            Before requiring a factor for everyone, account for service, break-glass, and API-only accounts that cannot complete interactive enrollment. Requiring a factor org-wide can lock those accounts out. Place them in a dedicated group and scope or exclude that group from the required-factor policy, and confirm at least one break-glass admin retains working access before you save.
        - id: terraform
          desc: |
            The default MFA enrollment policy applies to all users in the org:

            ```hcl
            resource "okta_policy_mfa_default" "default" {
              is_oie = true

              okta_password = {
                enroll = "REQUIRED"
              }

              okta_verify = {
                enroll = "REQUIRED"
              }
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/content/topics/security/mfa/mfa-home.htm
        title: Okta Multifactor Authentication
      - url: https://help.okta.com/en-us/content/topics/security/policies/policies-home.htm
        title: Okta Security Policies
