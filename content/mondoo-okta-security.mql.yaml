      - uid: mondoo-okta-security-password-settings-email-recovery-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that users have a self-service path to recover a forgotten password through their verified email address.

        Recovery factors are set per policy in the Admin Console under Security > Authentication, where a password policy lists which methods a user may use to reset a forgotten password. This check requires the email recovery factor to be active in every policy.

        **Why this matters**

        The alternative to self-service recovery is the help desk, and the help desk is the softest identity control most organizations have. Resetting an account for a caller means a human judging whether the voice on the phone belongs to the employee whose name it claims, under time pressure, with no strong evidence available. Attackers target that judgment directly, and several large intrusions have begun with a convincing call rather than any technical exploit.

        Every reset a user completes themselves is a call that never reaches that queue. Cutting the volume of legitimate reset traffic also makes the fraudulent request easier to notice, because a support team handling a handful of resets a week can scrutinize each one in a way a team handling dozens a day cannot.

        Email recovery ties the reset to a mailbox the org controls and can audit, and it leaves an artifact in the user's own inbox, so an attacker who triggers a reset the user did not request cannot do it silently.

        Email is a recovery path, not a strong authenticator, so it should not stand alone for accounts that matter. Require an additional factor during recovery for administrators, and make sure the recovery mailbox is not itself an account that can be reset through the same flow.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Authentication**.
        2. Open the **Password** tab and select the password policy to review.
        3. Under **Recovery settings**, confirm that **Email** is enabled as a recovery factor.

        A passing result shows email recovery active for every policy; a failing result shows it inactive.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=PASSWORD"
        ```

        A passing response has `settings.recovery.factors.okta_email.status` set to `ACTIVE` for every policy; a failing response shows it as `INACTIVE`.
      remediation:
        - id: console
          desc: |
            ### Enable email as a recovery factor

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select **Password**. On Okta Classic Engine orgs, go to **Security > Authentication** and select the **Password** tab.
            2. Locate the policy and select **Edit**.
            3. In the **Account recovery** section, enable **Email** as a self-service recovery option.
            4. Select **Update Policy**.
        - id: terraform
          desc: |
            Set this attribute inside your single, consolidated `okta_policy_password_default` resource alongside your other password settings. The snippet below shows only the attribute relevant to this check. Applying a standalone resource that defines just this one attribute resets every other password setting on the default policy back to the Terraform provider defaults, so merge it with your existing definition rather than applying it on its own.

            ```hcl
            resource "okta_policy_password_default" "default" {
              email_recovery = "ACTIVE"
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/content/topics/security/policies/configure-password-policies.htm
        title: Okta Password Policies
