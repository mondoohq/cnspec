    filters: asset.platform == "okta-org"
    mql: |
      okta.policies.password.all( settings['password']['age']['maxAgeDays'] != 0 && settings['password']['age']['maxAgeDays'] <= 90 )
  - uid: mondoo-okta-security-password-settings-max-age-terraform-hcl
