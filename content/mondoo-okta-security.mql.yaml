      - uid: mondoo-okta-security-password-settings-expire-warning-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every password policy warns users before their password expires.

        The expiration warning tells a user how many days remain on their current password and prompts them to change it before it lapses. It is set per policy in the Admin Console under Security > Authentication, alongside the password expiry interval. This check requires a warning period of 15 days.

        **Why this matters**

        The security value of a warning lies in what it stops users from doing. A password that expires without notice strands the user at whatever moment they next try to sign in, often the moment they most need access, and the resulting change is made in a hurry. Passwords chosen in a hurry are incremental variations on the previous one, which is exactly what password history and rotation exist to prevent.

        An unwarned expiry also pushes the user to the help desk. Help desk password resets are a target, because that is the process an attacker impersonates when calling support as a locked-out employee, and every legitimate reset in the queue makes the fraudulent one harder to spot. Cutting the volume of urgent resets makes the remaining ones easier to scrutinize.

        A warning period protects the rotation policy itself. Users who repeatedly experience expiry as an ambush lobby to have it relaxed or find ways around it, while users given two weeks of notice treat it as routine.

        Set a warning long enough to cover a normal absence, since a user on leave when the notice fires should still see it before coming back to a locked account.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Authentication**.
        2. Open the **Password** tab and select the password policy to review.
        3. Under **Password settings**, locate the **Age** section and read the **Prompt user to change password before expiration** value.

        A passing result shows a 15 day warning period for every policy; a failing result shows a different value or no warning configured.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=PASSWORD"
        ```

        A passing response has `settings.password.age.expireWarnDays` set to 15 for every policy; a failing response has 0 or any other value.
      remediation:
        - id: console
          desc: |
            ### Warn users before password expiry

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select **Password**. On Okta Classic Engine orgs, go to **Security > Authentication** and select the **Password** tab.
            2. Locate the policy and select **Edit**.
            3. Under **Password settings**, in **Age**, set the prompt that warns users before their password expires to exactly 15 days.
            4. Select **Update Policy**.
        - id: terraform
          desc: |
            Set this attribute inside your single, consolidated `okta_policy_password_default` resource alongside your other password settings. The snippet below shows only the attribute relevant to this check. Applying a standalone resource that defines just this one attribute resets every other password setting on the default policy back to the Terraform provider defaults, so merge it with your existing definition rather than applying it on its own.

            ```hcl
            resource "okta_policy_password_default" "default" {
              password_expire_warn_days = 15
            }
            ```
