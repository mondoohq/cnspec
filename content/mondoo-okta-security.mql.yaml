        _.settings['factors']['okta_otp']['enroll']['self'] == /(OPTIONAL|REQUIRED)/ ||
        _.settings['authenticators'] != null && _.settings['authenticators'].any( _['key'] == "okta_verify" && _['enroll']['self'] == /(OPTIONAL|REQUIRED)/ )
