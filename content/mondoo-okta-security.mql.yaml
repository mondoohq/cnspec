  - uid: mondoo-okta-security-okta-auth-openid-saml
    title: Enable SAML or OIDC authentication for supported apps
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-okta-security-okta-auth-openid-saml-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-okta-auth-openid-saml-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-okta-auth-openid-saml-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that applications authenticate through federation rather than by having Okta replay a stored password on the user's behalf.

        Okta supports several sign-on methods per application, selected in the Admin Console under Applications, on an application's sign-on tab. SAML 2.0 and OpenID Connect federate: Okta asserts who the user is and the application trusts the assertion, so no password for that application exists. Secure Web Authentication does the opposite, storing a username and password and filling them into the vendor's own login form. This check requires every active application capable of federation to use SAML or OIDC.

        **Why this matters**

        With Secure Web Authentication the org holds a working password for the downstream application and hands it over on every sign-in. That password can be recovered from the browser at fill time, it survives an Okta deactivation because the credential is still valid at the vendor, and it can be used from anywhere with no reference to the org's sign-on policy. Deprovisioning a user in Okta removes the tile, not the account.

        Federation removes the credential entirely. A SAML or OIDC application has nothing to steal, phish, or reuse, because access depends on an assertion Okta mints per sign-in and can stop minting the moment an account is suspended. Session revocation, sign-on rules, and factor requirements all apply, which is not true of a password the vendor keeps.

        Federation also restores visibility. A SAML or OIDC sign-in is an event in the System Log tied to a user, a device, and a policy decision, while a form-filled password produces a login the vendor sees and the org does not.

        Not every application can federate. Bookmark applications and the Active Directory integration have no sign-on protocol to configure and are out of scope here, and a vendor that sells federation only on a higher tier may leave Secure Web Authentication as the only option. Where that is the case, assign the application to a narrow group and treat its stored password as a credential that needs rotation.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Applications > Applications**.
        2. Review each active application and note its sign-on method.
        3. Confirm that supported apps use SAML or OIDC rather than SWA.

        A passing result shows active, supported applications configured for SAML or OIDC; a failing result shows a supported app still using SWA.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/apps"
        ```

        For each active application, inspect the `signOnMode` field. A passing response shows supported apps with `signOnMode` of `SAML_2_0` or `OPENID_CONNECT`; a failing response shows a supported app using a password-based sign-on mode.
      remediation:
        - id: console
          desc: |
            ### Replace SWA integrations with SAML or OIDC

            1. In the Admin Console, go to **Applications > Applications** and identify active apps whose sign-on method is SWA.
            2. For each such app, check the **Okta Integration Network** with **Browse App Catalog** for a SAML 2.0 or OIDC version of the integration, or select **Create App Integration** and choose **SAML 2.0** or **OIDC - OpenID Connect** for a custom app.
            3. Configure the new integration with the application vendor, assign the same users and groups, and verify sign-in works.
            4. Deactivate the old SWA integration once users have migrated.
        - id: terraform
          desc: |
            ### Configure a SAML application with Terraform

            >Note: If you receive the error `You do not have permission to access the feature you are requesting`, contact support and request the feature flag `ADVANCED_SSO` for your org.

            ```hcl
            resource "okta_app_saml" "example" {
              label                    = "example"
              sso_url                  = "https://example.com"
              recipient                = "https://example.com"
              destination              = "https://example.com"
              audience                 = "https://example.com/audience"
              subject_name_id_template = "$${user.userName}"
              subject_name_id_format   = "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
              response_signed          = true
              signature_algorithm      = "RSA_SHA256"
              digest_algorithm         = "SHA256"
              honor_force_authn        = false
              authn_context_class_ref  = "urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport"
            }
            ```

            ### Configure an OIDC application with Terraform

            ```hcl
            resource "okta_app_oauth" "example" {
              label          = "example"
              type           = "web"
              grant_types    = ["authorization_code"]
              redirect_uris  = ["https://app.example.com/oauth2/callback"]
              response_types = ["code"]
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/content/topics/security/policies/configure-signon-policies.htm
        title: Okta Sign-On Policies
      - url: https://help.okta.com/en-us/content/topics/security/security-home.htm
        title: Okta Security Administration
  - uid: mondoo-okta-security-okta-auth-openid-saml-api
    filters: asset.platform == "okta-org"
    mql: |
      okta.applications.where(signOnMode != "BOOKMARK" && name != "active_directory" && status == "ACTIVE").all(_.signOnMode.in(["OPENID_CONNECT", "SAML_2_0"]))
    docs:
      desc: |
        This check verifies that every application in the live org uses SAML or OpenID Connect for sign-on, as read from the org itself rather than from infrastructure code.

        Applications and their sign-on methods are listed in the Admin Console under Applications. The live org is the only place that shows applications added by hand, pulled from the Okta Integration Network catalog, or created outside the org's Terraform, so it is where drift from the intended configuration becomes visible. Bookmark applications and the Active Directory integration are excluded, because neither has a sign-on protocol to configure.

        **Why this matters**

        Applications accumulate outside code. An administrator adding a vendor from the catalog in a hurry takes whatever sign-on method that catalog entry offers, and for a vendor without federation support that method is Secure Web Authentication, which stores the user's password and fills it into the vendor's login form. None of this appears in a Terraform plan, so a review of the repository reports a clean federated estate the org does not actually have.

        Each of those stored passwords is a credential that keeps working at the vendor after the user is suspended in Okta, that no sign-on rule or factor requirement applies to, and that produces no assertion the org can revoke. Reading the live org is what finds them.

        Treat a failure here as a scoping question first. An application that genuinely cannot federate should be assigned to a narrow group or deactivated rather than left active for the whole workforce with a password behind it.
  - uid: mondoo-okta-security-okta-auth-openid-saml-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == /^okta_(app|idp)_/)
    mql: |
      terraform.resources.any( nameLabel == "okta_idp_oidc" || nameLabel == "okta_app_saml" || nameLabel == "okta_app_oauth" )
  - uid: mondoo-okta-security-okta-auth-openid-saml-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains( providerName == /okta/ )
    mql: |
      terraform.plan.resourceChanges.any( type == /okta_idp_oidc/ || type == /okta_app_saml/ || type == /okta_app_oauth/ )
  # No Terraform variants: outstanding OAuth 2.0 refresh tokens are runtime state
  # minted by the authorization server, not a configurable resource, so Terraform
  # HCL, plan, and state have no analog to assert against.
  - uid: mondoo-okta-security-app-refresh-tokens-short-lived
    title: Ensure application OAuth refresh tokens are short-lived
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-okta-security-app-refresh-tokens-short-lived-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
    docs:
      desc: |
        This check ensures that outstanding OAuth 2.0 refresh tokens Okta has issued for applications carry an expiration and that the span between issue and expiry stays inside a bounded window, currently 90 days. The comparison is against the token's own creation time rather than the present moment, so what is measured is the lifetime the token was minted with: a five-year token is failed the day it is issued and every day after, instead of passing once it happens to drift within 90 days of expiring. A refresh token is standing access: for as long as it lives, the application can silently mint new access tokens carrying the token's scopes with the user no longer present, so a token that never expires or is valid for years outlasts the session, the password change, and even the application assignment that produced it.

        **Why this matters**

        - **Refresh tokens are standing access:** A live refresh token keeps producing access tokens without any user interaction, so its lifetime is the real window of exposure if it leaks.
        - **Long lifetimes defeat revocation hygiene:** A token valid for years survives password resets, offboarding, and access reviews, leaving access that no one remembers to revoke.
        - **Scope is inherited silently:** The access tokens minted from a refresh token carry its OAuth scopes, so a broadly scoped standing token quietly reaches everything those scopes allow.

        **Risk mitigation**

        - **Bound refresh token lifetime:** Configure the authorization server so refresh tokens expire, and keep the maximum lifetime short.
        - **Revoke standing tokens:** Revoke outstanding refresh tokens for applications that no longer need them, especially broadly scoped ones tied to departed users.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > API > Authorization Servers**.
        2. Open each authorization server and review its **Access Policies** and token lifetime rules for refresh tokens.
        3. For a given application, review the outstanding grants and tokens under the application's **Okta API Scopes** and sign-on activity.

        A passing result shows refresh tokens configured with a bounded expiration; a failing result shows tokens that never expire or remain valid for very long periods.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/apps/{appId}/tokens"
        ```

        For each returned token, inspect `status`, `created`, `expiresAt`, and `scopes`, and compare `expiresAt` against `created` rather than against today. A passing response shows active tokens whose `expiresAt` falls within 90 days of their `created` timestamp; a failing response shows an active token with no `expiresAt`, or one whose `expiresAt` sits further than 90 days past the moment it was issued.
      remediation:
        - id: console
          desc: |
            ### Shorten refresh token lifetime and revoke standing tokens

            1. In the Admin Console, go to **Security > API > Authorization Servers** and open the authorization server that issues the application's tokens.
            2. Edit the access policy rule and set a bounded **Refresh token lifetime**, and require that refresh tokens expire if left unused.
            3. Go to **Applications > Applications**, open the application, and revoke outstanding grants and tokens that are no longer needed, prioritizing broadly scoped tokens and tokens issued for departed users.
            4. Review outstanding refresh tokens on a recurring schedule so long-lived grants are revoked promptly.
        - id: api
          desc: |
            ### Revoke an outstanding refresh token through the API

            Revoke a specific standing refresh token by its id:

            ```bash
            curl -s -X DELETE -H "Authorization: SSWS $OKTA_API_TOKEN" \
              "https://$OKTA_ORG.okta.com/api/v1/apps/{appId}/tokens/{tokenId}"
            ```
    refs:
      - url: https://developer.okta.com/docs/guides/refresh-tokens/main/
        title: Refresh tokens and their lifetime
      - url: https://help.okta.com/en-us/content/topics/security/security-home.htm
        title: Okta Security Administration
  - uid: mondoo-okta-security-app-refresh-tokens-short-lived-api
    filters: asset.platform == "okta-org"
    mql: |
      okta.applications.all(tokens.all(status == "REVOKED" || expiresAt != empty && created != empty && expiresAt < created + 90 * time.day))
  - uid: mondoo-okta-security-enable-suspicious-activity-reporting
    title: Enable Suspicious Activity Reporting
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-03
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-6-8
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-de-cm-3
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    variants:
      - uid: mondoo-okta-security-enable-suspicious-activity-reporting-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-enable-suspicious-activity-reporting-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-enable-suspicious-activity-reporting-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-enable-suspicious-activity-reporting-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that end users can report account activity they do not recognize.

        Suspicious activity reporting adds a report link to the security notification emails Okta sends a user, so someone who receives notice of a sign-in or an authenticator change they did not perform can flag it in one click. It is turned on in the Admin Console under Security > General, in the security notification emails section, and reports raise a dedicated System Log event that monitoring can alert on.

        **Why this matters**

        The user is often the only party who knows an event was not theirs. A sign-in from a new device in a plausible location, an authenticator enrolled during working hours, or a password reset following a help desk call all look ordinary in the log, and no detection rule can separate them from the same actions performed legitimately. The person whose account it is can.

        Without a reporting path that knowledge goes nowhere useful. A user who notices something wrong emails a manager, mentions it in a chat channel, or decides it was probably fine, and the security team learns about the compromise days later from its consequences. A report link turns a vague suspicion into a timestamped event attached to the exact sign-in or authenticator change the user saw.

        Speed is the whole value. Account takeover through Okta is followed quickly by authenticator enrollment, application access, and sometimes an API token that outlives the session, so the difference between a report in minutes and a discovery in days is the difference between revoking a session and running an incident.

        Reporting only helps if someone is listening. Route the report event to the team that can suspend an account and revoke sessions, and tell users what the link does, because a channel nobody has heard of is a channel nobody uses.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > General**.
        2. In the **Security notification emails** section, review **Report suspicious activity via email**.
        3. Confirm the option is enabled.

        A passing result shows Suspicious Activity Reporting enabled; a failing result shows the option turned off.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG-admin.okta.com/api/internal/org/settings/security-notification-settings"
        ```

        The response is the org's security notification email settings, and exposes a `reportSuspiciousActivityEnabled` field. A passing response shows that field set to `true`; a failing response shows it set to `false`.

        Note the host: security notification settings live on the `-admin` subdomain under `/api/internal/`, not on the org host under `/api/v1/`. Okta does not document this endpoint and it is not in the published Management API spec, so it can change without notice. The Admin Console click-through above is the supported path; this call is the same one the console makes, for when an automated check is worth more than a stable contract.
      remediation:
        - id: console
          desc: |
            ### Enable suspicious activity reporting

            1. In the Admin Console, go to **Security > General**.
            2. Scroll to the **Security notification emails** section and select **Edit**.
            3. Set **Report suspicious activity via email** to **Enabled**. This adds a Report Suspicious Activity button to the new sign-on, authenticator enrolled, authenticator reset, and password changed notification emails.
            4. Select **Save**.

            When an end user selects the button, Okta records a `user.account.report_suspicious_activity_by_enduser` event in the System Log and surfaces it in the Admin Console for review.
        - id: terraform
          desc: |
            ```hcl
            resource "okta_security_notification_emails" "example" {
              report_suspicious_activity_enabled       = true
              send_email_for_factor_enrollment_enabled = true
              send_email_for_factor_reset_enabled      = true
              send_email_for_new_device_enabled        = true
              send_email_for_password_changed_enabled  = true
            }
            ```
    refs:
      - url: https://help.okta.com/en-us/content/topics/security/threat-insight/ti-index.htm
        title: Okta ThreatInsight
      - url: https://help.okta.com/en-us/content/topics/security/security-home.htm
        title: Okta Security Administration
  - uid: mondoo-okta-security-enable-suspicious-activity-reporting-api
    filters: asset.platform == "okta-org"
    mql: okta.organization.reportSuspiciousActivityEnabled == true
  - uid: mondoo-okta-security-enable-suspicious-activity-reporting-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.providers.any( nameLabel == "okta" )
    mql: terraform.resources("okta_security_notification_emails").all( arguments['report_suspicious_activity_enabled'] == /var/ || arguments['report_suspicious_activity_enabled'] == true )
  - uid: mondoo-okta-security-enable-suspicious-activity-reporting-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains( providerName == /okta/ )
    mql: terraform.plan.resourceChanges.where( type == /okta_security_notification_emails/ ).all( change.after['report_suspicious_activity_enabled'] == true )
  - uid: mondoo-okta-security-enable-suspicious-activity-reporting-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains( type == /okta_security_notification_emails/ )
    mql: terraform.state.resources.where( type == /okta_security_notification_emails/ ).all( values['report_suspicious_activity_enabled'] == true )
  - uid: mondoo-okta-security-sign-on-notifications-for-end-users
    title: Enable sign-on notifications for end users
    impact: 80
    tags:
