      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    props:
      - uid: mondooOktaSecurityOktaPasswordDictionaryLookup
        title: Setting to check passwords against common password dictionary
        mql: "true"
    variants:
      - uid: mondoo-okta-security-password-settings-dictionary-lookup-api
        tags:
          mondoo.com/filter-title: Okta Organization
          mondoo.com/filter-icon: okta
      - uid: mondoo-okta-security-password-settings-dictionary-lookup-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-dictionary-lookup-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-okta-security-password-settings-dictionary-lookup-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every password policy screens new passwords against a list of commonly used passwords and rejects a match.

        Okta compares a proposed password against a dictionary of widely used values at the moment it is set, during enrollment, a change, or a reset. The rule is enabled per policy in the Admin Console under Security > Authentication among the password complexity requirements. This check requires it to be on in every policy.

        **Why this matters**

        Attackers do not guess passwords at random. They guess from ordered lists built out of previous breaches, and the top of those lists covers a startling share of real accounts, which is why password spraying works at all. A password on that list is not weak in some abstract sense; it is a password the attacker will try in their first few attempts against every account in the org.

        Length and character class rules do not catch these. A common password can be fifteen characters long and contain every character class the policy demands and still sit near the top of every wordlist, because people converge on the same memorable phrases and the same substitutions. Only a comparison against the list itself finds them.

        Screening at the moment the password is set is what makes the control cheap. The user picks something else immediately, before the credential ever protects an account, rather than the org discovering the problem when the account is taken over.

        Okta's dictionary covers common passwords, not every credential exposed in a breach, so a password unique to the user but reused from a service that leaked will still pass. Where the org needs that coverage, pair the setting with a breached credential feed and with a length requirement that keeps short memorable choices out.
      audit: |
        ### Audit via Admin Console

        1. In the Admin Console, go to **Security > Authentication**.
        2. Open the **Password** tab and select the password policy to review.
        3. Under **Password settings**, confirm that **Common password check** is enabled.

        A passing result shows the common password check enabled for every policy; a failing result shows it disabled.

        ### Audit via API

        Query the Okta API and inspect the result:

        ```bash
        curl -s -H "Authorization: SSWS $OKTA_API_TOKEN" \
          "https://$OKTA_ORG.okta.com/api/v1/policies?type=PASSWORD"
        ```

        A passing response has `settings.password.complexity.dictionary.common.exclude` set to `true` for every policy; a failing response has it set to `false`.
      remediation:
        - id: console
          desc: |
            ### Screen passwords against a common password dictionary

            1. On Okta Identity Engine orgs, go to **Security > Authenticators** and select **Password**. On Okta Classic Engine orgs, go to **Security > Authentication** and select the **Password** tab.
            2. Locate the policy and select **Edit**.
            3. Under **Password settings**, in **Common password check**, enable **Restrict use of common passwords** so passwords are screened against a list of commonly used and breached passwords.
            4. Select **Update Policy**.
        - id: terraform
          desc: |
            Set this attribute inside your single, consolidated `okta_policy_password_default` resource alongside your other password settings. The snippet below shows only the attribute relevant to this check. Applying a standalone resource that defines just this one attribute resets every other password setting on the default policy back to the Terraform provider defaults, so merge it with your existing definition rather than applying it on its own.

            ```hcl
            resource "okta_policy_password_default" "default" {
              password_dictionary_lookup = true
            }
            ```
