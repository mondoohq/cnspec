  - uid: mondoo-openstack-security-server-has-security-group
    title: Ensure compute servers have at least one security group attached
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-openstack-security-server-has-security-group-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-server-has-security-group-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-server-has-security-group-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-server-has-security-group-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every compute instance is covered by a network firewall policy.

        A security group is the stateful firewall Neutron applies to an instance's ports. One is attached at boot with `--security-group` on `openstack server create`, added later with `openstack server add security group`, or declared through the `security_groups` argument on the `openstack_compute_instance_v2` Terraform resource. This check requires at least one to be present on every server.

        **Why this matters**

        Security groups are the only barrier between instances sharing a tenant network. An instance with none applied answers connections from every other instance the network reaches, so a single compromised workload anywhere on that network reaches the unprotected instance's SSH daemon, its database listener, and any debugging service left running on it.

        Operators sometimes assume an instance with no group attached is closed by default. It is not. The group is what closes it, and its absence leaves filtering entirely to whatever the underlying network does, which on many deployments is nothing at all.

        The gap is silent from every angle an operator normally looks. Nothing about a running instance advertises that it has no firewall policy, no console view highlights it, and the omission is usually discovered by the traffic that exploits it.

        Attaching a group with no ingress rules is a valid way to satisfy this while adding permissions deliberately, and it makes the intent visible in the instance's own configuration.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Compute** then **Instances**.
        3. Select each instance and review the **Security Groups** section on its overview tab.

        A passing result shows at least one security group attached to every instance; a failing result shows an instance with no security groups.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack server show <id>
        ```

        A passing result shows one or more entries under `security_groups`; a failing result shows an empty `security_groups` list.
      remediation:
        - id: console
          desc: |
            Attaching a security group gives the instance an enforceable per-VM firewall instead of leaving its exposure to whatever the network plane defaults to. Pick a group scoped to the instance's role so it only opens the ports that role needs.

            1. Navigate to **Compute → Instances** in Horizon.
            2. From the instance's action menu, select **Edit Security Groups**.
            3. Add the security group that matches the instance's role and save.
        - id: cli
          desc: |
            ```bash
            openstack server add security group web-01 app-sg
            ```
        - id: terraform
          desc: |
            Always set `security_groups` on `openstack_compute_instance_v2`, or attach security groups via `openstack_networking_port_v2` and reference that port from the instance:

            ```hcl
            resource "openstack_networking_secgroup_v2" "web" {
              name        = "web"
              description = "Allow HTTPS from the internet"
            }

            resource "openstack_compute_instance_v2" "app" {
              name            = "app"
              image_id        = data.openstack_images_image_v2.ubuntu.id
              flavor_id       = data.openstack_compute_flavor_v2.standard.id
              key_pair        = openstack_compute_keypair_v2.ops.name
              security_groups = [openstack_networking_secgroup_v2.web.name]
            }
            ```
    refs:
      - url: https://docs.openstack.org/nova/latest/admin/security-groups.html
        title: OpenStack Nova security groups

  - uid: mondoo-openstack-security-server-has-security-group-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.servers.all(securityGroups.length > 0)
  - uid: mondoo-openstack-security-server-has-security-group-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_compute_instance_v2")
    mql: |
      terraform.resources("openstack_compute_instance_v2").all(
        arguments['security_groups'] != null && arguments['security_groups'].length > 0
      )
  - uid: mondoo-openstack-security-server-has-security-group-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_compute_instance_v2")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_compute_instance_v2").all(
        change.after.security_groups != null && change.after.security_groups.length > 0
      )
  - uid: mondoo-openstack-security-server-has-security-group-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_compute_instance_v2")
    mql: |
      terraform.state.resources.where(type == "openstack_compute_instance_v2").all(
        values.security_groups != null && values.security_groups.length > 0
      )

  # Security-only check (compliance mapping intentionally omitted per maintainer).
  # No Terraform variants: internetReachable is a runtime-computed exposure signal (IP + security group/firewall reachability) with no static config analog.
  - uid: mondoo-openstack-security-server-not-internet-reachable
    title: Ensure compute servers are not reachable from the internet
    impact: 85
    filters: asset.platform == "openstack-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      openstack.servers.all( exposure.internetReachable == false )
    docs:
      desc: |
        This check verifies that compute instances have no live path from the public internet to a listening service.

        Reachability here means a public edge and a rule that lets traffic through it at the same time: a floating IP or a port on an external network, together with a security group rule admitting inbound traffic from a public source. Both sides are managed with `openstack floating ip` and `openstack security group rule` commands, and this check requires that the two do not line up on the same instance.

        **Why this matters**

        An instance meeting both conditions is under continuous scan. Internet-wide scanners reach every routable address within hours of it going live, and any service listening behind an open rule is enumerated, fingerprinted, and tested against known exploits without anyone targeting the operator specifically.

        A compromise there does not stay on the one instance. The attacker lands inside the tenant network holding that instance's own network position, and from there reaches peers whose only protection was that nobody outside could address them.

        Correlating the address with the rules is what makes the finding worth acting on. A floating IP with no permissive ingress rule exposes nothing, and a wide-open group on an instance with no public edge exposes nothing either. The combination is what turns two configuration choices into a reachable service.

        Bastion hosts, public web servers, and other deliberately published instances will fail this and should be exempted once someone has confirmed that the services listening on them are the ones intended to be public.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Compute** then **Instances** and review each instance's **IP Address** and floating IP assignment.
        3. Open **Network** then **Security Groups** and review the ingress rules of the groups attached to each reachable instance.

        A passing result shows that any instance with a floating IP or an external-network port has no security-group ingress rule permitting traffic from `0.0.0.0/0` or `::/0`; a failing result shows an instance that has both a public edge and a permissive ingress rule.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack server list --long
        openstack security group rule list <group>
        ```

        A passing result shows no server that combines a floating IP (or external-network port) with an ingress rule open to `0.0.0.0/0` or `::/0`; a failing result shows a server that has both.
      remediation:
        - id: console
          desc: |
            Close the internet-reachable path by tightening the security group or removing the public edge. Keep management access while you do it.

            1. Navigate to **Network → Security Groups** in Horizon and open the group attached to the affected instance.
            2. Replace any ingress rule sourced from `0.0.0.0/0` or `::/0` with a rule scoped to a specific trusted CIDR, then confirm legitimate clients still reach the service.
            3. If the server does not need a public edge at all, navigate to **Compute → Instances**, open the instance, and disassociate its floating IP under the action menu.
        - id: cli
          desc: |
            ```bash
            # Scope the world-open ingress rule to a trusted CIDR
            openstack security group rule create app-sg \
              --ingress --protocol tcp --dst-port 443 --remote-ip 203.0.113.0/24
            openstack security group rule delete 4a4ee176-43e6-4b48-8bcf-5acd1c403fbf
            # Or, if the server needs no public edge, remove its floating IP
            openstack server remove floating ip web-01 203.0.113.50
            ```
    refs:
      - url: https://docs.openstack.org/security-guide/networking.html
        title: OpenStack Neutron security groups

  - uid: mondoo-openstack-security-no-unrestricted-ssh
    title: Ensure no security group allows unrestricted inbound SSH (port 22)
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-openstack-security-no-unrestricted-ssh-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-no-unrestricted-ssh-openstack-security-group
        tags:
          mondoo.com/filter-title: OpenStack Security Group
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-no-unrestricted-ssh-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-no-unrestricted-ssh-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-no-unrestricted-ssh-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that remote shell access over SSH is confined to known source networks.

        A Neutron security group rule opens a port to a source range, and this check looks for ingress rules reaching TCP port 22 from a public source. A source counts as public when it is a broad prefix such as `0.0.0.0/0` or `::/0`, when it is a remote address group holding such a range, or when the rule names no remote at all, which Neutron treats as any source. Rules are managed with `openstack security group rule create` or the `openstack_networking_secgroup_rule_v2` Terraform resource.

        **Why this matters**

        SSH open to the internet is the most reliably attacked port on any cloud. Automated campaigns sweep address space continuously, and a listener on 22 starts receiving credential attempts within minutes of becoming reachable, drawn from lists of vendor defaults and passwords recovered from unrelated breaches.

        The exposure is never one host. A security group is applied to many instances at once, so a single permissive rule publishes SSH on every instance carrying that group, including ones added to it long after the rule was written and by people who never read it.

        Key-based authentication helps but does not close the hole. The daemon itself is still reachable, so any vulnerability in the SSH server, and any drift that re-enables password authentication on one instance, is exposed to the entire internet rather than to a single bastion.

        Route administrative access through a bastion host or a VPN and scope the rule to that host's address, so the reachable SSH surface is one hardened instance instead of the fleet.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Network** then **Security Groups**.
        3. For each security group, open **Manage Rules** and review the ingress rules.

        A passing result shows no ingress rule allowing TCP port 22 from `0.0.0.0/0` or `::/0`; a failing result shows such a rule.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack security group rule list <group>
        ```

        A passing result shows no ingress TCP rule covering port 22 with a remote IP prefix of `0.0.0.0/0` or `::/0`; a failing result shows one.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Network → Security Groups** in Horizon and open the affected security group.
            2. Add a new ingress rule for TCP port 22 with **CIDR** set to a specific trusted range.
            3. Confirm you can still reach the affected instances from the trusted range, then delete the rule open to `0.0.0.0/0` or `::/0`. Removing the open rule drops live SSH sessions that arrived through it.
        - id: cli
          desc: |
            ```bash
            # Add the scoped rule first so management access survives the change
            openstack security group rule create web-sg \
              --ingress --protocol tcp --dst-port 22 --remote-ip 203.0.113.0/24
            # Then remove the world-open rule; live sessions through it are dropped
            openstack security group rule delete 4a4ee176-43e6-4b48-8bcf-5acd1c403fbf
            ```
        - id: terraform
          desc: |
            Scope inbound SSH `remote_ip_prefix` to a specific trusted CIDR, never `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "openstack_networking_secgroup_rule_v2" "ssh" {
              direction         = "ingress"
              ethertype         = "IPv4"
              protocol          = "tcp"
              port_range_min    = 22
              port_range_max    = 22
              remote_ip_prefix  = "203.0.113.0/24"
              security_group_id = openstack_networking_secgroup_v2.web.id
            }
            ```
