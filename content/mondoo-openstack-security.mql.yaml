    docs:
      desc: |
        This check verifies that Windows remote desktop access is confined to known source networks.

        This check looks for Neutron ingress rules reaching TCP port 3389, the Remote Desktop Protocol listener, from a public source. A source counts as public when it is a broad prefix such as `0.0.0.0/0` or `::/0`, when it is a remote address group holding such a range, or when the rule names no remote, which Neutron treats as any source. Rules are managed with `openstack security group rule create` or the `openstack_networking_secgroup_rule_v2` Terraform resource.

        **Why this matters**

        Exposed RDP is the most common initial-access vector in ransomware intrusions. Access brokers buy lists of reachable 3389 listeners, spray credentials harvested from other breaches, and resell the ones that work, so the instance is often compromised by a broker weeks before the attacker who uses it ever sees it.

        What follows is fast. An RDP session is an interactive desktop with the privileges of whichever account logged in, so the attacker needs no exploit chain to move from access to credential dumping, enumeration of connected systems, and encryption of everything the host can write to.

        Because the permission lives on a security group rather than a host, one permissive rule publishes the desktop of every Windows instance carrying that group, and the rule outlives whatever short-term need produced it.

        Where remote desktop is genuinely required, put it behind a VPN or a remote desktop gateway and scope the rule to that entry point rather than to the internet.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Network** then **Security Groups**.
        3. For each security group, open **Manage Rules** and review the ingress rules.

        A passing result shows no ingress rule allowing TCP port 3389 from `0.0.0.0/0` or `::/0`; a failing result shows such a rule.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack security group rule list <group>
        ```

        A passing result shows no ingress TCP rule covering port 3389 with a remote IP prefix of `0.0.0.0/0` or `::/0`; a failing result shows one.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Network → Security Groups** in Horizon and open the affected security group.
            2. Add a new ingress rule for TCP port 3389 with **CIDR** set to a specific trusted range.
            3. Confirm RDP still works from the trusted range, then delete the rule open to `0.0.0.0/0` or `::/0`. Removing the open rule drops live RDP sessions that arrived through it.
        - id: cli
          desc: |
            ```bash
            # Add the scoped rule first so management access survives the change
            openstack security group rule create windows-sg \
              --ingress --protocol tcp --dst-port 3389 --remote-ip 203.0.113.0/24
            # Then remove the world-open rule; live sessions through it are dropped
            openstack security group rule delete 4a4ee176-43e6-4b48-8bcf-5acd1c403fbf
            ```
        - id: terraform
          desc: |
            Scope inbound RDP `remote_ip_prefix` to a specific trusted CIDR, never `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "openstack_networking_secgroup_rule_v2" "rdp" {
              direction         = "ingress"
              ethertype         = "IPv4"
              protocol          = "tcp"
              port_range_min    = 3389
              port_range_max    = 3389
              remote_ip_prefix  = "203.0.113.0/24"
              security_group_id = openstack_networking_secgroup_v2.windows.id
            }
            ```
