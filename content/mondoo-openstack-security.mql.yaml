        values.tls_disabled != true
      )

  - uid: mondoo-openstack-security-cluster-template-no-floating-ip
    title: Ensure Magnum cluster templates do not enable floating IPs
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-openstack-security-cluster-template-no-floating-ip-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-cluster-template-no-floating-ip-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-cluster-template-no-floating-ip-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-cluster-template-no-floating-ip-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that clusters built by Magnum keep their nodes off public addresses.

        When a Magnum cluster template enables floating IPs, Magnum assigns a public address to each node it creates, control plane nodes included. Create templates without `--floating-ip-enabled`, or leave the `floating_ip_enabled` argument unset on the `openstack_containerinfra_clustertemplate_v1` Terraform resource.

        **Why this matters**

        A control plane node with a public address puts the Kubernetes API server on the internet, where scanners find it within hours. From there an attacker works through credential attacks, any anonymous access binding left in the cluster's role bindings, and known flaws in the API server version, none of which they could attempt from outside the tenant network.

        Worker nodes are no better. The kubelet, the container runtime, node metrics endpoints, and anything a workload binds to the host interface all become reachable, and the kubelet in particular can grant command execution inside running pods when its authorization is misconfigured.

        The template decides this for every cluster built from it, so the exposure is created by whoever runs the cluster creation command rather than by whoever chose the setting, and those are usually different people working months apart.

        Clusters that must be reachable from outside should be fronted by a load balancer with restricted source ranges, so one controlled entry point is published instead of every node in the cluster.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Container Infra** then **Cluster Templates**.
        3. Select each template and review whether **Enable Floating IP** is set.

        A passing result shows floating IPs disabled for every template; a failing result shows a template with floating IPs enabled.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack coe cluster template show <template>
        ```

        A passing result shows `floating_ip_enabled` set to `False`; a failing result shows it set to `True`.
      remediation:
        - id: console
          desc: |
            1. Open **Container Infra → Cluster Templates** in Horizon.
            2. If no cluster references the template, fix it with the CLI, since Horizon does not expose template patching.
            3. If clusters reference the template, create a replacement template with **Enable Floating IP** left unset, rebuild each cluster from it, move workloads, then delete the old clusters and template.
        - id: cli
          desc: |
            Magnum locks a cluster template once any cluster references it, so a referenced template cannot be changed in place. Create a replacement template with floating IPs disabled and rebuild clusters from it:

            ```bash
            # A referenced template cannot be patched; create a replacement with floating IPs disabled
            openstack coe cluster template create secure-template-v2 \
              --image fedora-coreos-38 --keypair ops-key \
              --external-network public --coe kubernetes \
              --flavor m1.small --docker-volume-size 10 \
              --master-lb-enabled --floating-ip-disabled
            ```

            Rebuild clusters from the new template, move workloads, then retire the old clusters and template.
        - id: terraform
          desc: |
            Either omit `floating_ip_enabled` on `openstack_containerinfra_clustertemplate_v1` (the default is `false`) or set it explicitly, and front the API server with a load balancer:

            ```hcl
            resource "openstack_containerinfra_clustertemplate_v1" "k8s" {
              name                = "k8s"
              image               = "fedora-coreos"
              coe                 = "kubernetes"
              external_network_id = openstack_networking_network_v2.public.id
              floating_ip_enabled = false
              master_lb_enabled   = true
            }
            ```
    refs:
      - url: https://docs.openstack.org/magnum/latest/user/index.html
        title: OpenStack Magnum cluster templates

  - uid: mondoo-openstack-security-cluster-template-no-floating-ip-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.clusterTemplates.all(floatingIpEnabled == false)
  - uid: mondoo-openstack-security-cluster-template-no-floating-ip-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_containerinfra_clustertemplate_v1")
    mql: |
      terraform.resources("openstack_containerinfra_clustertemplate_v1").all(
        arguments['floating_ip_enabled'] != true
      )
  - uid: mondoo-openstack-security-cluster-template-no-floating-ip-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_containerinfra_clustertemplate_v1")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_containerinfra_clustertemplate_v1").all(
        change.after.floating_ip_enabled != true
      )
  - uid: mondoo-openstack-security-cluster-template-no-floating-ip-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_containerinfra_clustertemplate_v1")
    mql: |
      terraform.state.resources.where(type == "openstack_containerinfra_clustertemplate_v1").all(
        values.floating_ip_enabled != true
      )

  - uid: mondoo-openstack-security-cluster-template-no-insecure-registry
    title: Ensure Magnum cluster templates do not allow insecure registries
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that clusters built by Magnum pull container images only over authenticated, encrypted connections.

        The `insecure_registry` property of a Magnum cluster template names a registry that cluster nodes may contact over plaintext HTTP with certificate validation skipped. Leave it empty when creating the template with `openstack coe cluster template create`, or leave the `insecure_registry` argument unset on the `openstack_containerinfra_clustertemplate_v1` Terraform resource.

        **Why this matters**

        Skipping certificate validation means the node cannot tell the registry apart from anything else that answers for its address. An attacker positioned on the network, or one able to influence DNS resolution on the node, serves their own image for the tag the cluster asked for, and the workload starts running attacker code inside the cluster's network with the service account it was given.

        Plaintext exposes the pull itself as well. Registry credentials sent over HTTP are readable on the path, and image layers can be modified in transit with no signature check anywhere in the flow to notice the substitution.

        Every cluster created from the template carries the entry, so the trusted registry list grows silently. A registry stood up for one experiment stays trusted by clusters built long after the experiment ended, including ones later given production workloads.

        Give the registry a certificate the nodes trust, from a public authority or from an internal CA distributed to the cluster, rather than turning validation off to work around a certificate problem.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Container Infra** then **Cluster Templates**.
        3. Select each template and review the **Insecure Registry** field.

        A passing result shows an empty **Insecure Registry** for every template; a failing result shows a template with an insecure registry set.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack coe cluster template show <template>
        ```

        A passing result shows `insecure_registry` empty; a failing result shows a host:port value in `insecure_registry`.
      remediation:
        - id: console
          desc: |
            1. Open **Container Infra → Cluster Templates** in Horizon.
            2. If no cluster references the template, fix it in place with the CLI, since Horizon does not expose template patching.
            3. If clusters reference the template, create a replacement template with **Insecure Registry** left empty. Existing clusters cannot switch templates: rebuild each cluster from the new template, move its workloads, then delete the old cluster and template.
        - id: cli
          desc: |
            ```bash
            # Fix the template in place while no clusters reference it
            openstack coe cluster template update secure-template remove insecure_registry

            # If clusters reference it, create a replacement that omits --insecure-registry
            # and rebuild clusters from it
            openstack coe cluster template create secure-template \
              --image fedora-coreos-38 --keypair ops-key \
              --external-network public --coe kubernetes \
              --flavor m1.small --docker-volume-size 10
            ```
        - id: terraform
          desc: |
            Do not set `insecure_registry` on `openstack_containerinfra_clustertemplate_v1`; rely on a TLS-protected registry instead:

            ```hcl
            resource "openstack_containerinfra_clustertemplate_v1" "k8s" {
              name                = "k8s"
              image               = "fedora-coreos"
              coe                 = "kubernetes"
              external_network_id = openstack_networking_network_v2.public.id
              # insecure_registry intentionally omitted; pull only from TLS-protected registries
            }
            ```
    refs:
      - url: https://docs.openstack.org/magnum/latest/user/index.html
        title: OpenStack Magnum cluster templates

  - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.clusterTemplates.all(insecureRegistry == "")
  - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_containerinfra_clustertemplate_v1")
    mql: |
      terraform.resources("openstack_containerinfra_clustertemplate_v1").all(
        arguments['insecure_registry'] == null || arguments['insecure_registry'] == ""
      )
  - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_containerinfra_clustertemplate_v1")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_containerinfra_clustertemplate_v1").all(
        change.after.insecure_registry == null || change.after.insecure_registry == ""
      )
  - uid: mondoo-openstack-security-cluster-template-no-insecure-registry-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_containerinfra_clustertemplate_v1")
    mql: |
      terraform.state.resources.where(type == "openstack_containerinfra_clustertemplate_v1").all(
        values.insecure_registry == null || values.insecure_registry == ""
      )

  # No Terraform variants: this check inspects the runtime network addresses Trove assigned to the instance (operational telemetry), which has no configuration analog. The terraform-provider-openstack openstack_db_instance_v1 resource attaches the instance to a network by UUID, and whether that network is publicly reachable is a cross-resource property the check cannot assert from the resource alone. Re-evaluate if a first-class public/private toggle is added upstream.
  - uid: mondoo-openstack-security-database-not-public
    title: Ensure Trove database instances are not publicly reachable
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.databaseInstances.all(
        addresses.none(_['type'] == "public")
      )
    docs:
      desc: |
        This check verifies that managed database instances are reachable only from the tenant network.

        A Trove instance takes its addresses from the networks it is created on, and an address of type `public` places the database engine's listener on a routable address outside the tenant network. Networks are chosen with `--nic` on `openstack database instance create`, and this check requires that no instance ends up with a public address.

        **Why this matters**

        A public database listener is scanned and attacked continuously. The engine's default accounts, credentials from unrelated breaches, and any account created with a convenient password during setup are all tried automatically, and a success delivers the data itself rather than whatever an application would have chosen to return.

        The engine's own defenses assume a private network. Transport encryption is frequently left off, authentication plugins are chosen for compatibility with in-network clients, and connection limits are sized for a known client population, none of which holds up in front of arbitrary internet traffic.

        Reaching the listener also places the engine's protocol parser in front of untrusted input, so an authentication bypass or deserialization flaw in the running version becomes directly exploitable without the attacker needing a foothold anywhere else in the cloud first.

        Keep the instance on private networks and reach it through the application tier or a bastion. Where an external system genuinely must connect, terminate that path on something that authenticates the caller rather than exposing the engine.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Database** then **Instances**.
        3. Select each instance and review the addresses listed on its **Overview** tab.

        A passing result shows only private addresses for every instance; a failing result shows an instance with a public address.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack database instance show <instance>
        ```

        A passing result shows no address of type `public`; a failing result shows a public address assigned to the instance.
      remediation:
        - id: console
          desc: |
            The Horizon database panel does not expose the instance access setting; use the CLI.
        - id: cli
          desc: |
            ```bash
            # Remove public access in place; Trove releases the public address
            openstack database instance update db-instance-1 --is-private
            ```

            If the instance was built directly on an external network rather than made public by Trove, launch a replacement on a private network, migrate the data, and delete the original:

            ```bash
            openstack database instance create db-private \
              --flavor m1.small --size 10 \
              --datastore mysql --datastore-version 8.0 \
              --nic net-id=6f2c1b3a-7e8d-4a5b-9c0d-1e2f3a4b5c6d
            ```
        # No Terraform remediation: see the note above the check — the public/private posture is a property of the network the instance attaches to, not a setting on the openstack_db_instance_v1 resource itself.
    refs:
      - url: https://docs.openstack.org/trove/latest/user/index.html
        title: OpenStack Trove database instances

  # No Terraform variants: the set of end-of-life datastore versions is defined per deployment by
  # the operator's configured Trove datastores rather than a fixed managed catalog, and the version
  # lives in the nested datastore block of openstack_db_instance_v1. A static EOL allowlist asserted
  # against HCL, plan, or state would be unreliable across deployments, so this check is runtime-only.
  - uid: mondoo-openstack-security-database-supported-version
    title: Ensure Trove database instances run a supported engine version
    impact: 70
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.databaseInstances.where(datastoreType.downcase == "mysql").all(datastoreVersion.notIn(["5.5", "5.6", "5.7"]))
      openstack.databaseInstances.where(datastoreType.downcase == "mariadb").all(datastoreVersion.notIn(["5.5", "10.0", "10.1", "10.2", "10.3", "10.4", "10.5"]))
      openstack.databaseInstances.where(datastoreType.downcase == "postgresql").all(datastoreVersion.notIn(["9.4", "9.5", "9.6", "10", "11", "12", "13"]))
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    docs:
      desc: |
        This check verifies that managed database instances run an engine version that still receives security fixes.

        Trove records the datastore and version an instance runs, chosen at creation with `--datastore` and `--datastore-version` on `openstack database instance create`. This check flags MySQL 5.5 through 5.7, MariaDB 5.5 and 10.0 through 10.5, and PostgreSQL 9.4 through 13, all of which have passed upstream end of life. The list tracks upstream dates and needs revision as further releases age out.

        **Why this matters**

        An end-of-life engine stops receiving patches while research into it carries on. Vulnerabilities disclosed after the cutoff are published in enough detail to exploit and are never fixed for that release, so the gap between what is publicly known and what is patched on the instance only widens with time.

        These are the flaws attackers prefer, because the target population can be identified. Version banners and behavior fingerprints let a scanner pick out unpatched instances specifically, so an old engine is not merely at risk in a general sense, it is selected for.

        Upgrading also gets harder the longer it waits. Trove migrations across distant major versions frequently require a dump and reload rather than an in-place upgrade, so a deployment that defers this ends up choosing between running unpatched and taking an outage it could have avoided by moving sooner.

        Plan the move before the version reaches end of life, and where an application pins an old engine, treat the pin as the thing to fix rather than as the reason to stay.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Database** then **Instances**.
        3. Review the datastore type and version for each instance.

        A passing instance runs a datastore version still supported upstream. A failing instance runs an end-of-life version such as MySQL 5.6 or 5.7, MariaDB 10.5 or older, or PostgreSQL 13 or older.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result. Treat the datastore versions the deployment currently offers as the authoritative supported set:

        ```bash
        openstack database instance list
        openstack datastore version list <datastore>
        ```

        A passing instance runs a version the operator still offers and that upstream still supports. A failing instance runs a version past its upstream end-of-life date.
      remediation:
        - id: console
          desc: |
            Trove does not perform an in-place major-version upgrade through Horizon. Create a replacement instance on a supported datastore version and migrate the data:

            1. Open **Database → Instances** and note the datastore type, version, flavor, and network of the affected instance.
            2. Launch a new instance on a supported datastore version with the same flavor and network.
            3. Migrate the data with the engine's native tools, repoint applications, and delete the original instance once verified.
        - id: cli
          desc: |
            Create a replacement instance on a supported datastore version and migrate the data, since Trove does not perform an in-place major-version upgrade:

            ```bash
            openstack datastore version list mysql
            openstack database instance create db-upgraded \
              --flavor m1.small --size 10 \
              --datastore mysql --datastore-version 8.0 \
              --nic net-id=6f2c1b3a-7e8d-4a5b-9c0d-1e2f3a4b5c6d
            ```

            Migrate the data with the engine's native tools, repoint applications, then delete the original instance.
        # No Terraform remediation: Trove does not support an in-place major-version upgrade, and the
        # supported version set is deployment-specific, so the fix is a data migration to a new
        # instance rather than a Terraform field change.
    refs:
      - url: https://docs.openstack.org/trove/latest/user/index.html
        title: OpenStack Trove database instances

  - uid: mondoo-openstack-security-container-no-wildcard-write
    title: Ensure object storage containers do not grant wildcard write access
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-openstack-security-container-no-wildcard-write-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-container-no-wildcard-write-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-container-no-wildcard-write-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-container-no-wildcard-write-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that write access to object storage containers is granted only to named principals.

        A Swift container write ACL lists the accounts and users allowed to upload, overwrite, and delete objects. A wildcard entry such as `*` or `*:*` extends that to every authenticated identity in the deployment. The list is set with `openstack container set --write-acl` or the `container_write` argument on the `openstack_objectstorage_container_v1` Terraform resource.

        **Why this matters**

        On a multi-tenant cloud, every authenticated identity means every other project. Any user of the cloud can write into the container, so an attacker who compromises the least significant account anywhere on the deployment reaches storage belonging to a project they have no relationship with at all.

        Writing is worse than reading for the workloads these containers usually serve. A container holding backups can be silently corrupted so the restore fails at the moment it is finally needed, and a container serving static assets or installer packages becomes a distribution channel for whatever the attacker uploads to paths that clients already trust.

        A wildcard also erases attribution. The write is authorized, so it looks entirely legitimate in Swift's logs, and there is no principal to trace it back to beyond an account that may itself have been borrowed for the purpose.

        Name the specific `account` or `account:user` principals that need write access, and where a workload must accept uploads from untrusted callers, put an application in front of the container rather than widening the ACL.
      audit: |
        ### Audit via Console

        1. Log in to the OpenStack Horizon dashboard.
        2. Navigate to **Project** > **Object Store** > **Containers** and open each container.
        3. Review the container's access/metadata for the write ACL.

        A passing container scopes write access to specific principals. A failing container has a `*` or `*:*` entry in its write ACL.

        ### Audit via CLI

        1. Show each container's write ACL:

        ```bash
        swift stat <container>
        ```

        A passing container shows a `Write ACL` restricted to named principals. A failing container shows `*` or `*:*` in the `Write ACL`.
      remediation:
        - id: console
          desc: |
            In the OpenStack Horizon dashboard, open the container and edit its access settings so the write ACL lists only the specific project principals that need write access, removing any `*` / `*:*` entry.
        - id: cli
          desc: |
            Replace a wildcard write ACL with a scoped one using the `swift` client:

            ```bash
            # Clear the write ACL entirely
            swift post <container> -w ""
            # Or restrict write to the project's authenticated users only
            swift post <container> -w "<project-id>:*"
            ```
        - id: terraform
          desc: |
            Never set `container_write = "*"` (or `"*:*"`) on `openstack_objectstorage_container_v1`. Scope it to specific principals, or omit it to keep the container non-writable by others:

            ```hcl
            resource "openstack_objectstorage_container_v1" "backups" {
              name            = "backups"
              container_write = "${var.project_id}:automation"
            }
            ```
    refs:
      - url: https://docs.openstack.org/swift/latest/overview_acl.html
        title: OpenStack Swift container ACLs
  - uid: mondoo-openstack-security-container-no-wildcard-write-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.objectStorageContainers.all(writeACL.all(_.contains("*") == false))
  - uid: mondoo-openstack-security-container-no-wildcard-write-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_objectstorage_container_v1")
    mql: |
      terraform.resources("openstack_objectstorage_container_v1").all(
        arguments['container_write'] == null || arguments['container_write'].contains("*") == false
      )
  - uid: mondoo-openstack-security-container-no-wildcard-write-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_objectstorage_container_v1")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_objectstorage_container_v1").all(
        change.after.container_write == null || change.after.container_write.contains("*") == false
      )
  - uid: mondoo-openstack-security-container-no-wildcard-write-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_objectstorage_container_v1")
    mql: |
      terraform.state.resources.where(type == "openstack_objectstorage_container_v1").all(
        values.container_write == null || values.container_write.contains("*") == false
      )

  # No Terraform variants: Keystone service-catalog endpoints are cloud-operator
  # infrastructure surfaced by the running deployment; tenant Terraform does not
  # define the service catalog, so endpoint URLs are only observable at runtime.
  - uid: mondoo-openstack-security-endpoints-use-https
    title: Ensure Keystone service catalog endpoints use HTTPS
    impact: 80
    filters: asset.platform == "openstack-project"
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a11
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      openstack.identityEndpoints.all(url == /^https:/)
    docs:
      desc: |
        This check verifies that the service endpoints clients discover through Keystone are reached over TLS.

        The Keystone service catalog is the directory every client reads to locate the other OpenStack APIs, holding a URL for each service's public, internal, and admin interface. Entries are registered with `openstack endpoint create` and changed with `openstack endpoint set --url`, and this check requires each to use an `https://` scheme.

        **Why this matters**

        A client that reads an `http://` entry sends its Keystone token to that service in cleartext. Anyone on the path, including a compromised host on the management network, lifts the token off the wire and replays it against every other service in the catalog until it expires, acting throughout as the user who leaked it.

        The exposure does not stop at tokens. The requests and responses that follow carry instance configuration, volume data in transit, image content, and injected user data, all readable to the same observer with no further effort.

        Plaintext also means no server authentication. An attacker who can answer for the endpoint address stands up a substitute API, harvests tokens from every client that trusts the catalog, and returns whatever responses suit them, with no certificate warning anywhere to give it away.

        Internal and admin interfaces need this as much as the public one, because a control plane on a private network is still fully exposed to any attacker who gains a foothold on that network.
      audit: |
        ### Audit via CLI

        1. List the service catalog endpoints and review each URL:

        ```bash
        openstack endpoint list
        ```

        A passing endpoint's URL begins with `https://`. A failing endpoint's URL begins with `http://`.
      remediation:
        - id: console
          desc: |
            In the OpenStack Horizon admin dashboard, open **Admin** > **System** > **System Information** > **Services** and update each service's endpoints so their URLs use `https://` backed by a trusted certificate. Endpoint management is an operator task.
        - id: cli
          desc: |
            Update each catalog endpoint to an HTTPS URL with the `openstack` client:

            ```bash
            openstack endpoint set --url https://service.example.com:9292 <endpoint-id>
            ```

            Repeat for the public, internal, and admin interfaces of each service.
        # No Terraform remediation: the Keystone service catalog is operator
        # infrastructure with no tenant-facing Terraform resource; endpoints are
        # managed through the openstack client or Horizon admin dashboard.
    refs:
      - url: https://docs.openstack.org/keystone/latest/admin/manage-services.html
        title: Manage services and endpoints in Keystone

  - uid: mondoo-openstack-security-app-credential-no-admin
    title: Ensure application credentials do not grant the admin role
    impact: 85
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a12
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-openstack-security-app-credential-no-admin-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-app-credential-no-admin-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-app-credential-no-admin-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-app-credential-no-admin-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that automation credentials are held to least privilege and cannot act as an administrator.

        An application credential inherits a subset of its owner's role assignments, chosen with `--role` on `openstack application credential create` or the `roles` argument on the `openstack_identity_application_credential_v3` Terraform resource. Requesting `admin` gives the credential the full administrative role within its scope, and this check requires that no credential does so.

        **Why this matters**

        An `admin` application credential is the most useful thing an attacker can find in a source repository. It is a single string that authenticates without a second factor, and on most deployments the `admin` role reaches well past the owning project into cloud-wide operations such as reading other tenants' images, listing every instance, and creating users.

        Credentials sit where secrets are hardest to protect: pipeline variables, container images, configuration management vaults, and developer laptops. Pairing that exposure with the highest privilege on the cloud turns a leak from any one of those places into a full compromise rather than a scoped incident.

        Automation almost never needs the role. A backup job needs to create volume snapshots, a deployment job needs to boot servers, and both work with narrow roles. Granting `admin` is usually a shortcut taken when the specific permission was hard to identify and never revisited afterward.

        Where a task genuinely requires administrative rights, issue a separate short-lived credential for that task alone and keep the general-purpose automation credential scoped to the roles it actually uses.
      audit: |
        ### Audit via CLI

        1. List application credentials for each user and review their roles:

        ```bash
        openstack application credential list
        ```

        A passing credential lists only non-admin roles. A failing credential includes `admin` in its roles.
      remediation:
        - id: console
          desc: |
            Application credential roles cannot be changed after creation. In Horizon, delete the credential that carries `admin` and create a replacement scoped to only the non-admin roles the workload needs, then update the consumer with the new secret.
        - id: cli
          desc: |
            Recreate the credential with only the required non-admin roles using the `openstack` client:

            ```bash
            openstack application credential delete <name>
            openstack application credential create <name> --role <non-admin-role>
            ```

            Update the automation that consumes the credential with the new secret.
        - id: terraform
          desc: |
            Set `roles` explicitly on `openstack_identity_application_credential_v3` to the required non-admin roles, and never include `admin`. Omitting `roles` inherits all of the owning user's roles, which may include `admin`:

            ```hcl
            resource "openstack_identity_application_credential_v3" "automation" {
              name  = "automation"
              roles = ["member"]
            }
            ```
    refs:
      - url: https://docs.openstack.org/keystone/latest/user/application_credentials.html
        title: OpenStack Keystone application credentials
  - uid: mondoo-openstack-security-app-credential-no-admin-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.users.all(applicationCredentials.all(roleNames.none(_ == "admin")))
  - uid: mondoo-openstack-security-app-credential-no-admin-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_identity_application_credential_v3")
    mql: |
      terraform.resources("openstack_identity_application_credential_v3").all(
        arguments['roles'] == null || arguments['roles'].contains("admin") == false
      )
  - uid: mondoo-openstack-security-app-credential-no-admin-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_identity_application_credential_v3")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_identity_application_credential_v3").all(
        change.after.roles == null || change.after.roles.contains("admin") == false
      )
  - uid: mondoo-openstack-security-app-credential-no-admin-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_identity_application_credential_v3")
    mql: |
      terraform.state.resources.where(type == "openstack_identity_application_credential_v3").all(
        values.roles == null || values.roles.contains("admin") == false
      )

  - uid: mondoo-openstack-security-ipsec-policy-encrypts
    title: Ensure IPsec policies encrypt traffic and do not use bare AH
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-openstack-security-ipsec-policy-encrypts-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-ipsec-policy-encrypts-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-ipsec-policy-encrypts-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-ipsec-policy-encrypts-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that site-to-site VPN tunnels encrypt their payload rather than only authenticating it.

        The transform protocol of a Neutron VPNaaS IPsec policy decides what the tunnel does to traffic. Authentication Header, written `ah`, provides integrity and origin authentication but no confidentiality, while Encapsulating Security Payload, written `esp`, encrypts, and `ah-esp` does both. It is set with `openstack vpn ipsec policy set --transform-protocol` or the `transform_protocol` argument on the `openstack_vpnaas_ipsec_policy_v2` Terraform resource.

        **Why this matters**

        A tunnel built on bare `ah` sends the original packets across the internet readable. Everything the VPN was carrying, database replication, internal API calls, directory traffic, and file transfers between sites, is available to anyone with a position on the path, exactly as though the tunnel had never been built.

        The failure is silent because the tunnel works. The connection establishes, monitoring reports it up, applications on both sides behave normally, and the operator has every reason to believe traffic between the sites is protected.

        `ah` also breaks in the environments where it is deployed, because it authenticates the IP header and so any NAT on the path invalidates the packet. That means the configuration frequently fails outright rather than degrading quietly, and the fix applied under time pressure is rarely a careful one.

        Use `esp` for encryption, and `ah-esp` only where a specific requirement calls for header authentication alongside it and no NAT sits on the path.
      audit: |
        ### Audit via CLI

        1. List the IPsec policies and review the transform protocol of each:

        ```bash
        openstack vpn ipsec policy list --long
        ```

        A passing policy uses `esp` or `ah-esp`. A failing policy uses bare `ah`.
      remediation:
        - id: console
          desc: |
            In the OpenStack Horizon dashboard, open **Project** > **Network** > **VPN** > **IPsec Policies**, edit the policy, and set the transform protocol to `esp` (or `ah-esp`), then re-establish affected connections.
        - id: cli
          desc: |
            Set the transform protocol to `esp` with the `openstack` client:

            ```bash
            openstack vpn ipsec policy set --transform-protocol esp <ipsec-policy>
            ```
        - id: terraform
          desc: |
            Set `transform_protocol = "esp"` on `openstack_vpnaas_ipsec_policy_v2` (this is also the default; never set it to `ah`):

            ```hcl
            resource "openstack_vpnaas_ipsec_policy_v2" "policy" {
              name               = "ipsec-policy"
              transform_protocol = "esp"
            }
            ```
    refs:
      - url: https://docs.openstack.org/neutron/latest/admin/vpnaas-scenario.html
        title: OpenStack Neutron VPNaaS
  - uid: mondoo-openstack-security-ipsec-policy-encrypts-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.vpnIpsecPolicies.all(transformProtocol != "ah")
  - uid: mondoo-openstack-security-ipsec-policy-encrypts-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_vpnaas_ipsec_policy_v2")
    mql: |
      terraform.resources("openstack_vpnaas_ipsec_policy_v2").all(
        arguments['transform_protocol'] == null || arguments['transform_protocol'] != "ah"
      )
  - uid: mondoo-openstack-security-ipsec-policy-encrypts-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_vpnaas_ipsec_policy_v2")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_vpnaas_ipsec_policy_v2").all(
        change.after.transform_protocol == null || change.after.transform_protocol != "ah"
      )
  - uid: mondoo-openstack-security-ipsec-policy-encrypts-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_vpnaas_ipsec_policy_v2")
    mql: |
      terraform.state.resources.where(type == "openstack_vpnaas_ipsec_policy_v2").all(
        values.transform_protocol == null || values.transform_protocol != "ah"
      )

