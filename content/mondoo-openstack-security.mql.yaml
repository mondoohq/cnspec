          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that container and cluster control plane endpoints are not reachable from the public internet.

        This check looks for Neutron ingress rules reaching orchestration control ports from a public source: 6443 for the Kubernetes API server, 10250 for the kubelet API, 2379 and 2380 for etcd client and peer traffic, and 2375 and 2376 for the Docker daemon. A source counts as public when it is a broad prefix such as `0.0.0.0/0` or `::/0`, a remote address group holding such a range, or a rule naming no remote, which Neutron treats as any source. Rules are managed with `openstack security group rule create` or the `openstack_networking_secgroup_rule_v2` Terraform resource.

        **Why this matters**

        Two of these ports are unauthenticated by design. The Docker daemon on 2375 accepts container creation from anyone who connects, and an attacker uses that to start a privileged container mounting the host filesystem, which is root on the node in a single request. etcd on 2379 and 2380 likewise expects the network to protect it, and it holds every Kubernetes secret in the cluster in a form that can be read straight off the wire.

        The kubelet API on 10250 grants command execution inside running pods wherever anonymous access is still permitted, which older cluster builds allow by default. That is a shell inside a workload without any interaction with the API server or its authorization rules.

        The API server on 6443 does authenticate, but publishing it puts cluster authentication in front of the entire internet, where token handling flaws, certificate issues, and any anonymous-access binding left in the cluster's role bindings become globally reachable rather than reachable from the tenant network.

        Reach these endpoints over a private network, a VPN, or a scoped bastion. Where the API server genuinely must be published, front it with a load balancer whose source ranges are restricted instead of opening the port on the nodes.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Network** then **Security Groups**.
        3. For each security group, open **Manage Rules** and review the ingress rules.

        A passing result shows no ingress rule allowing an orchestration port such as 6443, 10250, 2379, 2380, 2375, or 2376 from `0.0.0.0/0` or `::/0`; a failing result shows such a rule.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack security group rule list <group>
        ```

        A passing result shows no ingress rule covering an orchestration control-plane port with a remote IP prefix of `0.0.0.0/0` or `::/0`; a failing result shows one.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Network → Security Groups** in Horizon and open the affected security group.
            2. Add a replacement ingress rule for the orchestration port with **CIDR** scoped to a specific trusted range, or a **Remote Security Group** rule that allows only the cluster's own security group.
            3. Confirm cluster nodes and operators can still reach the control plane, then delete the rule open to `0.0.0.0/0` or `::/0`. Removing the open rule drops connections established through it.
        - id: cli
          desc: |
            ```bash
            # Add the scoped rule first so the cluster keeps control-plane access
            openstack security group rule create k8s-sg \
              --ingress --protocol tcp --dst-port 6443 --remote-ip 203.0.113.0/24
            # Then remove the world-open rule; connections established through it are dropped
            openstack security group rule delete 4a4ee176-43e6-4b48-8bcf-5acd1c403fbf
            ```
        - id: terraform
          desc: |
            Constrain orchestration ingress with `remote_group_id` or a private `remote_ip_prefix`, never `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "openstack_networking_secgroup_rule_v2" "k8s_api" {
              direction         = "ingress"
              ethertype         = "IPv4"
              protocol          = "tcp"
              port_range_min    = 6443
              port_range_max    = 6443
              remote_ip_prefix  = "203.0.113.0/24"
              security_group_id = openstack_networking_secgroup_v2.k8s.id
            }
            ```
    refs:
      - url: https://docs.openstack.org/security-guide/networking.html
        title: OpenStack Neutron security groups
      - url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
        title: Kubernetes ports and protocols

