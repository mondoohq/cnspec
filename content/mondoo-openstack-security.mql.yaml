        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-no-unrestricted-db-ports-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that database listeners are not reachable from the public internet.

        This check looks for Neutron ingress rules reaching common database ports from a public source: 3306 for MySQL and MariaDB, 5432 for PostgreSQL, 27017 for MongoDB, 6379 for Redis, 11211 for Memcached, 9200 for Elasticsearch, 1433 for Microsoft SQL Server, and 1521 for Oracle. A source counts as public when it is a broad prefix such as `0.0.0.0/0` or `::/0`, a remote address group holding such a range, or a rule naming no remote at all, which Neutron treats as any source. Rules are managed with `openstack security group rule create` or the `openstack_networking_secgroup_rule_v2` Terraform resource.

        **Why this matters**

        Several of these services treat the network as the security boundary. Redis and Memcached accept commands with no authentication in their default configuration, and Elasticsearch spent much of its life shipping an open HTTP API, so reaching the port is the entire attack. Scanners that find them read or destroy the contents in a single pass, and the ransom-note campaigns against exposed MongoDB and Elasticsearch instances have run continuously for years.

        The engines that do authenticate are attacked on credentials instead. A reachable MySQL or PostgreSQL listener collects login attempts using default accounts and passwords from other breaches, and a success hands the attacker the data directly rather than through an application that might have limited what it returned.

        Reaching the port also puts the engine's wire protocol parser in front of untrusted input, so any deserialization or authentication bypass flaw in the running version becomes exploitable by anyone rather than only by traffic that already passed the application tier.

        Databases belong behind the application tier, with the rule scoped to the security group or CIDR of the servers that query them. Where remote administration is needed, reach it through a bastion rather than by widening the rule.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Network** then **Security Groups**.
        3. For each security group, open **Manage Rules** and review the ingress rules.

        A passing result shows no ingress rule allowing a database port such as 3306, 5432, 27017, 6379, 11211, 9200, 1433, or 1521 from `0.0.0.0/0` or `::/0`; a failing result shows such a rule.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack security group rule list <group>
        ```

        A passing result shows no ingress rule covering a common database port with a remote IP prefix of `0.0.0.0/0` or `::/0`; a failing result shows one.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Network → Security Groups** in Horizon and open the affected security group.
            2. Add a replacement ingress rule for the database port with **CIDR** scoped to a specific trusted range, or a **Remote Security Group** rule that allows only the application tier's security group.
            3. Confirm the application tier can still reach the database, then delete the rule open to `0.0.0.0/0` or `::/0`. Removing the open rule drops connections established through it.
        - id: cli
          desc: |
            ```bash
            # Add the scoped rule first so the application tier keeps its database access
            openstack security group rule create db-sg \
              --ingress --protocol tcp --dst-port 3306 --remote-group app-sg
            # Then remove the world-open rule; connections established through it are dropped
            openstack security group rule delete 4a4ee176-43e6-4b48-8bcf-5acd1c403fbf
            ```
        - id: terraform
          desc: |
            Constrain database ingress with `remote_group_id` or a private `remote_ip_prefix`:

            ```hcl
            resource "openstack_networking_secgroup_rule_v2" "db_from_app" {
              direction         = "ingress"
              ethertype         = "IPv4"
              protocol          = "tcp"
              port_range_min    = 3306
              port_range_max    = 3306
              remote_group_id   = openstack_networking_secgroup_v2.app.id
              security_group_id = openstack_networking_secgroup_v2.db.id
            }
            ```
    refs:
      - url: https://docs.openstack.org/security-guide/networking.html
        title: OpenStack Neutron security groups

