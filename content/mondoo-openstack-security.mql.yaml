    docs:
      desc: |
        This check verifies that the Windows remote management channel is confined to known source networks.

        Windows Remote Management carries PowerShell Remoting and the tooling built on it, listening on TCP port 5985 for the plaintext transport and 5986 for the TLS one. This check looks for Neutron ingress rules reaching either port from a public source, meaning a broad prefix such as `0.0.0.0/0` or `::/0`, a remote address group holding such a range, or a rule naming no remote at all, which Neutron treats as any source. Rules are managed with `openstack security group rule create` or the `openstack_networking_secgroup_rule_v2` Terraform resource.

        **Why this matters**

        WinRM is a command execution service. An attacker who authenticates to it runs PowerShell on the host with the rights of the account used, so nothing stands between reaching the listener with valid credentials and controlling the instance outright.

        Port 5985 carries that session without TLS. An on-path observer reads it, and the NTLM authentication commonly used over it is relayable, so an attacker who can influence traffic destined for the host reaches authenticated command execution without ever learning a password.

        Configuration management tooling opens WinRM during provisioning and the rule regularly outlives the build. A group written so a deployment host could reach new instances stays attached to them, and the source range that was convenient during setup is very often the whole internet.

        Restrict the rule to the address of the configuration management host or a bastion, and prefer 5986 with a valid certificate so the channel stays encrypted even inside the tenant network.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Network** then **Security Groups**.
        3. For each security group, open **Manage Rules** and review the ingress rules.

        A passing result shows no ingress rule allowing TCP port 5985 or 5986 from `0.0.0.0/0` or `::/0`; a failing result shows such a rule.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack security group rule list <group>
        ```

        A passing result shows no ingress TCP rule covering port 5985 or 5986 with a remote IP prefix of `0.0.0.0/0` or `::/0`; a failing result shows one.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Network → Security Groups** in Horizon and open the affected security group.
            2. Add a new ingress rule covering TCP ports 5985 and 5986 with **CIDR** set to a specific trusted range.
            3. Confirm WinRM still works from the trusted range, then delete the rule open to `0.0.0.0/0` or `::/0`. Removing the open rule drops live WinRM sessions that arrived through it.
        - id: cli
          desc: |
            ```bash
            # Add the scoped rule first so management access survives the change
            openstack security group rule create windows-sg \
              --ingress --protocol tcp --dst-port 5985:5986 --remote-ip 203.0.113.0/24
            # Then remove the world-open rule; live sessions through it are dropped
            openstack security group rule delete 4a4ee176-43e6-4b48-8bcf-5acd1c403fbf
            ```
        - id: terraform
          desc: |
            Scope inbound WinRM `remote_ip_prefix` to a specific trusted CIDR, never `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "openstack_networking_secgroup_rule_v2" "winrm" {
              direction         = "ingress"
              ethertype         = "IPv4"
              protocol          = "tcp"
              port_range_min    = 5985
              port_range_max    = 5986
              remote_ip_prefix  = "203.0.113.0/24"
              security_group_id = openstack_networking_secgroup_v2.windows.id
            }
            ```
