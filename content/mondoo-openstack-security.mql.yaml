  - uid: mondoo-openstack-security-container-not-public
    title: Ensure Swift containers are not publicly readable
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-22
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-openstack-security-container-not-public-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-container-not-public-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-container-not-public-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-container-not-public-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that object storage containers do not serve their contents to unauthenticated callers.

        Swift grants anonymous read access through a container read ACL containing `.r:*`, which lets anyone fetch objects over HTTP without presenting a token. The ACL is set with `openstack container set --read-acl` or the `container_read` argument on the `openstack_objectstorage_container_v1` Terraform resource, and removing the wildcard restores the requirement to authenticate.

        **Why this matters**

        Anonymous read makes the URL the credential, and URLs leak constantly through referrer headers, browser history, shared links, error pages, and search engine crawlers. Once one object address is known the container listing is frequently available too, and everything else follows from a single request.

        What Swift containers hold makes that severe. Database dumps, application logs carrying tokens and session identifiers, build artifacts, customer uploads, and infrastructure backups are the normal contents, and any one of them is a complete breach on its own.

        None of the reading looks like an attack from the owner's side. The requests appear as ordinary object retrievals from arbitrary addresses, so exposure of this kind is usually discovered by a third party finding the data rather than by the operator noticing the access.

        Containers meant to serve public assets are a legitimate exception, but keep them separate from containers holding anything else rather than relying on object naming to keep the two apart.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Object Store** then **Containers**.
        3. Select each container and review whether **Public Access** is enabled.

        A passing result shows **Public Access** disabled for every container; a failing result shows a container with public read access enabled.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack container show <name>
        ```

        A passing result shows no `.r:*` entry in the container read ACL; a failing result shows `.r:*` in the read ACL, which can also be confirmed with `swift stat <container>`.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Object Store → Containers** in Horizon.
            2. Select the affected container and clear the **Public Access** checkbox.
        - id: cli
          desc: |
            ```bash
            # Clear the read ACL entirely
            swift post backups -r ""
            # Or restrict to the project's authenticated users only
            swift post backups -r "f47ac10b58cc4372a5670e02b2c3d479:*"
            ```
        - id: terraform
          desc: |
            Never set `container_read = ".r:*"` on `openstack_objectstorage_container_v1`. Omit `container_read` to keep the container private, or scope it to the project:

            ```hcl
            resource "openstack_objectstorage_container_v1" "backups" {
              name           = "backups"
              container_read = "${var.project_id}:*"
            }
            ```
    refs:
      - url: https://docs.openstack.org/swift/latest/overview_acl.html
        title: OpenStack Swift container ACLs

  - uid: mondoo-openstack-security-container-not-public-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.objectStorageContainers.all(public == false)
  - uid: mondoo-openstack-security-container-not-public-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_objectstorage_container_v1")
    mql: |
      terraform.resources("openstack_objectstorage_container_v1").all(
        arguments['container_read'] == null || arguments['container_read'].contains(".r:*") == false
      )
  - uid: mondoo-openstack-security-container-not-public-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_objectstorage_container_v1")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_objectstorage_container_v1").all(
        change.after.container_read == null || change.after.container_read.contains(".r:*") == false
      )
  - uid: mondoo-openstack-security-container-not-public-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_objectstorage_container_v1")
    mql: |
      terraform.state.resources.where(type == "openstack_objectstorage_container_v1").all(
        values.container_read == null || values.container_read.contains(".r:*") == false
      )

  - uid: mondoo-openstack-security-listener-modern-tls
    title: Ensure Octavia HTTPS listeners disable legacy TLS protocol versions
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-openstack-security-listener-modern-tls-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-listener-modern-tls-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-listener-modern-tls-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-listener-modern-tls-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that load balancer TLS termination refuses obsolete protocol versions.

        An Octavia listener with `protocol` set to `TERMINATED_HTTPS` decrypts client traffic at the load balancer, and its `tls_versions` list states which protocol versions it will negotiate. The list is set with `openstack loadbalancer listener set --tls-version` or the `tls_versions` argument on the `openstack_lb_listener_v2` Terraform resource, and this check requires that SSLv2, SSLv3, TLSv1.0, and TLSv1.1 are absent from it.

        **Why this matters**

        Offering an old version does not mean clients choose it. An on-path attacker interferes with the handshake so negotiation falls back to the weakest version both sides accept, and then uses the attacks the newer versions were designed to prevent: POODLE against SSLv3 padding, BEAST against TLSv1.0 record chaining, and the RC4 biases that the older suites still permit.

        What that yields is the session itself. These attacks recover the plaintext the load balancer is terminating, so the attacker walks away with session cookies and authentication headers and then acts as the user without ever needing their password.

        Keeping the legacy versions listed also pins the whole service to the weakest cipher suites they allow, which rules out the authenticated encryption modes that TLSv1.2 and TLSv1.3 depend on for integrity as well as confidentiality.

        Confirm the client population before removing TLSv1.0 and TLSv1.1, since embedded devices and long-lived appliances are the usual reason they remain, and treat those clients as a migration to plan rather than a permanent exception.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Network** then **Load Balancers**.
        3. Select each load balancer, open its **Listeners** tab, and review the TLS settings of every `TERMINATED_HTTPS` listener.

        A passing result shows only TLSv1.2 and TLSv1.3 permitted; a failing result shows SSLv2, SSLv3, TLSv1.0, or TLSv1.1 still allowed.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack loadbalancer listener show <id>
        ```

        A passing result shows `tls_versions` limited to TLSv1.2 and TLSv1.3; a failing result shows SSLv2, SSLv3, TLSv1.0, or TLSv1.1 in `tls_versions`.
      remediation:
        - id: console
          desc: |
            The Horizon load balancer panels expose the TLS cipher string but not the allowed TLS protocol versions; use the CLI to restrict TLS versions.
        - id: cli
          desc: |
            ```bash
            openstack loadbalancer listener set https-listener \
              --tls-version TLSv1.2 --tls-version TLSv1.3
            ```
        - id: terraform
          desc: |
            Set `tls_versions` explicitly on every `openstack_lb_listener_v2` whose `protocol` is `TERMINATED_HTTPS`:

            ```hcl
            resource "openstack_lb_listener_v2" "https" {
              name                      = "https"
              protocol                  = "TERMINATED_HTTPS"
              protocol_port             = 443
              loadbalancer_id           = openstack_lb_loadbalancer_v2.web.id
              default_tls_container_ref = openstack_keymanager_container_v1.tls.container_ref
              tls_versions              = ["TLSv1.2", "TLSv1.3"]
            }
            ```
    refs:
      - url: https://docs.openstack.org/octavia/latest/user/guides/basic-cookbook.html
        title: OpenStack Octavia listener configuration

  - uid: mondoo-openstack-security-listener-modern-tls-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.listeners.where(protocol == "TERMINATED_HTTPS").all(
        tlsVersions.none(
          _ == "TLSv1.0" || _ == "TLSv1.1" || _ == "SSLv2" || _ == "SSLv3"
        )
      )
  - uid: mondoo-openstack-security-listener-modern-tls-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_lb_listener_v2")
    mql: |
      terraform.resources("openstack_lb_listener_v2").all(
        arguments['protocol'] != "TERMINATED_HTTPS" ||
        arguments['tls_versions'] != null && arguments['tls_versions'].none(
          _ == "TLSv1.0" || _ == "TLSv1.1" || _ == "SSLv2" || _ == "SSLv3"
        )
      )
  - uid: mondoo-openstack-security-listener-modern-tls-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_lb_listener_v2")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_lb_listener_v2").all(
        change.after.protocol != "TERMINATED_HTTPS" ||
        change.after.tls_versions != null && change.after.tls_versions.none(
          _ == "TLSv1.0" || _ == "TLSv1.1" || _ == "SSLv2" || _ == "SSLv3"
        )
      )
  - uid: mondoo-openstack-security-listener-modern-tls-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_lb_listener_v2")
    mql: |
      terraform.state.resources.where(type == "openstack_lb_listener_v2").all(
        values.protocol != "TERMINATED_HTTPS" ||
        values.tls_versions != null && values.tls_versions.none(
          _ == "TLSv1.0" || _ == "TLSv1.1" || _ == "SSLv2" || _ == "SSLv3"
        )
      )

  # No Terraform variants: this check scopes to internet-facing load balancers using the runtime
  # exposure correlation (a VIP on an external network or with a floating IP plus a listener open
  # to the world) and then asserts no plaintext listener. The internet-exposure determination is
  # resolved from live Neutron and Octavia state and has no analog in openstack_lb_loadbalancer_v2
  # or openstack_lb_listener_v2 HCL; the listener-modern-tls check already covers the
  # Terraform-expressible TLS posture per listener.
  - uid: mondoo-openstack-security-listener-no-plaintext-internet
    title: Ensure internet-facing Octavia load balancers enforce TLS
    impact: 85
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.loadBalancers.where(exposure.internetReachable == true).all(enforcesTls == true)
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    docs:
      desc: |
        This check verifies that internet-facing load balancers carry client traffic only over encrypted protocols.

        An Octavia load balancer counts as internet-facing when its virtual IP sits on an external network or holds a floating IP and at least one listener accepts traffic from any source. A listener using `HTTP`, `TCP`, `UDP`, `SCTP`, or `PROMETHEUS` on such a load balancer moves that traffic in the clear. Listener protocols are chosen with `--protocol` on `openstack loadbalancer listener create`.

        **Why this matters**

        Traffic on a plaintext public listener crosses networks the operator does not run. Session cookies, authentication headers, API keys, and form submissions are readable at every hop between the client and the load balancer, and capturing them requires only a position on one of those hops rather than any access to the cloud itself.

        Reading is the smaller problem. Without TLS nothing binds the response to the service, so an attacker on the path rewrites what the client receives, injects script into a page, or steers the client to a host they control, and the client has no way to detect any of it.

        A `PROMETHEUS` listener deserves separate mention, because it publishes the load balancer's own metrics. On a public address that is an unauthenticated feed of backend membership, request rates, and error patterns, which is reconnaissance handed over without any interaction at all.

        A plaintext listener that exists only to redirect clients to an HTTPS listener is a reasonable pattern. Confirm it serves nothing else and that the redirect happens before any request body is accepted.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Network** then **Load Balancers**.
        3. For each load balancer whose VIP is on an external network or has a floating IP, open the **Listeners** tab and review the protocol of every listener.

        A passing internet-facing load balancer has only `HTTPS`, `TERMINATED_HTTPS`, or otherwise encrypted listeners. A failing internet-facing load balancer has a plaintext `HTTP`, `TCP`, `UDP`, `SCTP`, or `PROMETHEUS` listener.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack loadbalancer list
        openstack loadbalancer listener list --loadbalancer <id>
        ```

        A passing internet-facing load balancer lists only encrypted listener protocols. A failing internet-facing load balancer lists a plaintext protocol.
      remediation:
        - id: console
          desc: |
            1. Open **Network → Load Balancers** in Horizon and select the internet-facing load balancer.
            2. On the **Listeners** tab, replace each plaintext listener with a `TERMINATED_HTTPS` listener and an attached TLS certificate, or move the service behind an HTTPS listener.
            3. Where an HTTP listener must remain for redirects, configure it to redirect to the HTTPS listener rather than serving content.
        - id: cli
          desc: |
            Create an encrypted listener and remove the plaintext one. The TLS material is referenced from a Barbican container:

            ```bash
            openstack loadbalancer listener create <lb> \
              --name https --protocol TERMINATED_HTTPS --protocol-port 443 \
              --default-tls-container-ref <barbican-container-ref>
            openstack loadbalancer listener delete <plaintext-listener>
            ```
        # No Terraform remediation: the internet-facing determination is a runtime correlation of
        # the VIP's external-network or floating-IP placement with its open listeners and has no
        # single configuration analog. Use the listener-modern-tls Terraform remediation to define
        # encrypted listeners.
    refs:
      - url: https://docs.openstack.org/octavia/latest/user/guides/basic-cookbook.html
        title: OpenStack Octavia listener configuration

