    mql: |
      terraform.state.resources.where(type == "openstack_lb_listener_v2").all(
        values.allowed_cidrs != null &&
        values.allowed_cidrs.length > 0 &&
        values.allowed_cidrs.containsNone(["0.0.0.0/0", "::/0"])
      )

  # No Terraform variants: terraform-provider-openstack has no Keystone trust resource. Trusts are created imperatively (CLI/API or by the Keystone-to-Keystone federation flow), so there is no HCL/plan/state representation to assert against. Re-evaluate if an openstack_identity_trust_v3 resource is added upstream.
  - uid: mondoo-openstack-security-trust-impersonation-expiry
    title: Ensure Keystone trusts allowing impersonation have an expiration
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-1
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.trusts.where(impersonation == true).all(expiresAt != null)
    docs:
      desc: |
        This check verifies that Keystone delegations granting impersonation lapse on a fixed date.

        A Keystone trust delegates a chosen set of the trustor's roles to a trustee. When the trust allows impersonation, tokens the trustee obtains through it are issued in the trustor's name rather than the trustee's own. The lifetime is set with `--expiration` on `openstack trust create`, and without it the delegation never ends.

        **Why this matters**

        Impersonation is the strongest delegation Keystone offers. Actions the trustee takes are recorded as the trustor's, so an attacker holding a trustee account uses a non-expiring impersonating trust to act as a privileged user indefinitely while the audit trail points at someone else entirely.

        Trusts are created programmatically by services such as Heat and by automation that must act on a user's behalf, and they routinely outlive the workflows that created them. A trust whose trustor left the organization keeps working for as long as that account exists in Keystone.

        Expiry is the only self-clearing control here. Nothing in Keystone reviews trusts, they do not appear in the usual offboarding checklists, and no role assignment change revokes one, so a delegation with no end date persists until an operator happens to enumerate them.

        Where a workflow genuinely needs standing delegation, prefer a trust without impersonation so the trustee acts under its own identity and the audit trail stays accurate.
      audit: |
        ### Audit via Horizon

        The Horizon dashboard does not expose trust management. Use the CLI.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack trust list
        openstack trust show <trust-id>
        ```

        A passing result shows every trust with `impersonation` set to `True` carrying a populated `expires_at` value; a failing result shows an impersonating trust with an empty `expires_at`.
      remediation:
        - id: console
          desc: |
            Horizon does not expose trust management; use the CLI to create the replacement trust with an expiration before deleting the old one.
        - id: cli
          desc: |
            ```bash
            # Trusts are immutable; create the replacement first, then delete the old trust.
            # Run the create command as the trustor, since Keystone only lets a user
            # delegate their own roles.
            openstack trust create alice deploy-bot \
              --project web-project --role member \
              --impersonate --expiration 2026-12-31T00:00:00
            # Update consumers to the new trust ID, then remove the non-expiring trust
            openstack trust delete 9d3b2c1a-5f6e-4d7c-8b9a-0e1f2a3b4c5d
            ```
        # No Terraform remediation: terraform-provider-openstack has no Keystone trust resource (see the note above the check). Trusts are managed only through the CLI/API.
    refs:
      - url: https://docs.openstack.org/keystone/latest/user/trusts.html
        title: OpenStack Keystone trusts

  - uid: mondoo-openstack-security-share-not-public
    title: Ensure Manila shares are not visible to all projects
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-22
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-openstack-security-share-not-public-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-share-not-public-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-share-not-public-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-share-not-public-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that shared file systems are visible only to the project that owns them.

        A Manila share marked public is listed to every project on the cloud, and any project that can see it may attempt to mount it under whatever access rules the share carries. Shares are created without `--public` and the flag is cleared with `openstack share set --no-public`, or by leaving `is_public` unset on the `openstack_sharedfilesystem_share_v2` Terraform resource.

        **Why this matters**

        Discovery is what changes here. A private share with a loose access rule is exposed to whoever already knows the export exists, while a public one advertises the export path and the share server address to every tenant on the deployment, so a weak rule that would have gone unnoticed becomes something any other project can find just by listing shares.

        The two failures compound directly. Manila access rules are often written against a broad client network because the operator reasoned that only their own project could see the share, and marking the share public invalidates that reasoning without changing a single rule.

        Shares hold the data instances treat as local. Home directories, application state, and shared datasets sit there, so a mount from an unrelated project reads, and frequently writes, the working data of the project that owns it.

        Where another project needs the data, export it deliberately with access rules naming that project's client addresses, rather than making the share visible cloud-wide and relying on the rules alone.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Share** then **Shares**.
        3. Select each share and review its **Public** attribute.

        A passing result shows **Public** set to **No** for every share; a failing result shows a share marked **Public: Yes**.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack share show <share>
        ```

        A passing result shows `is_public` set to `False`; a failing result shows `is_public` set to `True`.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Share → Shares** in Horizon.
            2. Open the affected share's **Edit Share** dialog and clear the **Public** setting.
        - id: cli
          desc: |
            ```bash
            openstack share set --public false data-share
            ```
        - id: terraform
          desc: |
            Either omit `is_public` on `openstack_sharedfilesystem_share_v2` (the default is `false`) or set it explicitly:

            ```hcl
            resource "openstack_sharedfilesystem_share_v2" "data" {
              name        = "data"
              share_proto = "NFS"
              size        = 10
              is_public   = false
            }
            ```
    refs:
      - url: https://docs.openstack.org/manila/latest/user/create-and-manage-shares.html
        title: OpenStack Manila shared file systems

  - uid: mondoo-openstack-security-share-not-public-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.shares.all(isPublic == false)
  - uid: mondoo-openstack-security-share-not-public-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_sharedfilesystem_share_v2")
    mql: |
      terraform.resources("openstack_sharedfilesystem_share_v2").all(
        arguments['is_public'] != true
      )
  - uid: mondoo-openstack-security-share-not-public-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_sharedfilesystem_share_v2")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_sharedfilesystem_share_v2").all(
        change.after.is_public != true
      )
  - uid: mondoo-openstack-security-share-not-public-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_sharedfilesystem_share_v2")
    mql: |
      terraform.state.resources.where(type == "openstack_sharedfilesystem_share_v2").all(
        values.is_public != true
      )

  - uid: mondoo-openstack-security-share-no-world-access
    title: Ensure Manila shares are not exported to all source IP addresses
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-openstack-security-share-no-world-access-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-share-no-world-access-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-share-no-world-access-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-share-no-world-access-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that shared file system exports name the client networks allowed to mount them.

        A Manila access rule of type `ip` grants mount rights to a source address or CIDR, and a value of `0.0.0.0/0` or `::/0` grants them to every address there is. Rules are managed with `openstack share access create` or through the `openstack_sharedfilesystem_share_access_v2` Terraform resource.

        **Why this matters**

        For NFS the access rule is the authentication. The protocol trusts the client to state which user is making each request, so any host that mounts the export presents whatever user and group identifiers it chooses and reads files as their owner. An all-addresses rule therefore does not weaken access control on the share, it removes it.

        What can reach the share server is broader than it appears. Every instance on any network with a route to it qualifies, including workloads belonging to other projects and any instance an attacker starts themselves, so the exposure spans the cloud rather than the owning project.

        Where the rule also grants write, the export becomes shared writable storage for anyone who mounts it. Files that other systems consume, configuration read at boot, and backups relied on for recovery can all be replaced without the owner seeing anything out of the ordinary.

        Scope each rule to the specific client CIDR that mounts the share, and where the client set cannot be pinned down, prefer a share protocol with real authentication over widening the address rule.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Share** then **Shares**.
        3. Select each share, open its **Rules** tab, and review the IP access rules.

        A passing result shows no IP access rule with **Access to** set to `0.0.0.0/0` or `::/0`; a failing result shows such a rule.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack share access list <share>
        ```

        A passing result shows no `ip` access rule whose **Access To** is `0.0.0.0/0` or `::/0`; a failing result shows one.
      remediation:
        - id: console
          desc: |
            1. Navigate to **Share → Shares** in Horizon and open the share's **Rules** tab.
            2. Add a replacement rule scoped to the specific client CIDR that needs the share, with the access level those clients require.
            3. Confirm the clients can still reach the share, then delete the rule whose **Access to** is `0.0.0.0/0` or `::/0`. Removing it cuts off any client still relying on it.
        - id: cli
          desc: |
            ```bash
            # Grant the scoped rule first so existing clients keep access;
            # match the access level the clients actually need
            openstack share access create data-share ip 203.0.113.0/24 --access-level rw
            # Then remove the world-open rule
            openstack share access delete data-share 4a4ee176-43e6-4b48-8bcf-5acd1c403fbf
            ```
        - id: terraform
          desc: |
            Scope `access_to` on `openstack_sharedfilesystem_share_access_v2` to a specific trusted CIDR, never `0.0.0.0/0` or `::/0`:

            ```hcl
            resource "openstack_sharedfilesystem_share_access_v2" "clients" {
              share_id     = openstack_sharedfilesystem_share_v2.data.id
              access_type  = "ip"
              access_to    = "203.0.113.0/24"
              access_level = "ro"
            }
            ```
    refs:
      - url: https://docs.openstack.org/manila/latest/user/share-management.html
        title: OpenStack Manila share access rules

  - uid: mondoo-openstack-security-share-no-world-access-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.shares.all(
        accessRules.where(accessType == "ip").none(accessTo == "0.0.0.0/0" || accessTo == "::/0")
      )
  - uid: mondoo-openstack-security-share-no-world-access-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_sharedfilesystem_share_access_v2")
    mql: |
      terraform.resources("openstack_sharedfilesystem_share_access_v2").where(arguments['access_type'] == "ip").none(
        arguments['access_to'] == "0.0.0.0/0" || arguments['access_to'] == "::/0"
      )
  - uid: mondoo-openstack-security-share-no-world-access-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "openstack_sharedfilesystem_share_access_v2")
    mql: |
      terraform.plan.resourceChanges.where(type == "openstack_sharedfilesystem_share_access_v2").where(change.after.access_type == "ip").none(
        change.after.access_to == "0.0.0.0/0" || change.after.access_to == "::/0"
      )
  - uid: mondoo-openstack-security-share-no-world-access-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "openstack_sharedfilesystem_share_access_v2")
    mql: |
      terraform.state.resources.where(type == "openstack_sharedfilesystem_share_access_v2").where(values.access_type == "ip").none(
        values.access_to == "0.0.0.0/0" || values.access_to == "::/0"
      )

  - uid: mondoo-openstack-security-cluster-template-tls-enabled
    title: Ensure Magnum cluster templates do not disable control plane TLS
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-openstack-security-cluster-template-tls-enabled-openstack
        tags:
          mondoo.com/filter-title: OpenStack Project
          mondoo.com/filter-icon: openstack
      - uid: mondoo-openstack-security-cluster-template-tls-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-cluster-template-tls-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-openstack-security-cluster-template-tls-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that clusters built by Magnum authenticate and encrypt their control plane API.

        A Magnum cluster template with `tls_disabled` set to true produces clusters whose orchestration API, the Kubernetes API server on a Kubernetes cluster, listens without TLS and without the client certificate authentication that accompanies it. Leave the flag off when creating the template with `openstack coe cluster template create`, or leave the `tls_disabled` argument unset on the `openstack_containerinfra_clustertemplate_v1` Terraform resource.

        **Why this matters**

        With TLS disabled the API server has no way to identify callers, so anyone who reaches the port is effectively the cluster administrator. They create privileged pods, read every secret held in etcd, and schedule workloads on any node, which is complete control of the cluster and of the OpenStack credentials the cluster holds for provisioning volumes and load balancers on its own behalf.

        The traffic is readable as well. Kubeconfig bearer tokens and service account tokens cross the network in the clear, so an observer anywhere on the path collects credentials that stay valid long after the connection they were captured from has ended.

        Because this lives on a template, the setting is not one cluster's problem. Every cluster created from it inherits the posture, including ones built months later by people who never saw the template definition and have no reason to question it.

        Correcting the template does not change clusters already created from it, so remediate by fixing the template and then rebuilding the clusters that inherited the setting.
      audit: |
        ### Audit via Horizon

        1. Sign in to the OpenStack Horizon dashboard as a project member.
        2. Open **Container Infra** then **Cluster Templates**.
        3. Select each template and review whether **Disable TLS** is set.

        A passing result shows **Disable TLS** unset for every template; a failing result shows a template with TLS disabled.

        ### Audit via CLI

        Run the OpenStack CLI and inspect the result:

        ```bash
        openstack coe cluster template show <template>
        ```

        A passing result shows `tls_disabled` set to `False`; a failing result shows `tls_disabled` set to `True`.
      remediation:
        - id: console
          desc: |
            1. Open **Container Infra → Cluster Templates** in Horizon.
            2. If no cluster references the template, fix it in place with the CLI, since Horizon does not expose template patching.
            3. If clusters reference the template, create a replacement template with **Disable TLS** left unset. Existing clusters cannot switch templates: rebuild each cluster from the new template, move its workloads, then delete the old cluster and template.
        - id: cli
          desc: |
            Magnum locks a cluster template once any cluster references it: a referenced template cannot be updated or deleted until every cluster built from it is gone. In-place patching therefore only works on templates that no cluster references yet. Even then, the docs do not enumerate which attributes accept a patch, so a `tls_disabled` update may be rejected; if it is, fall back to creating a replacement template.

            ```bash
            # Confirm no cluster references the template before attempting a patch
            openstack coe cluster list

            # Patch the template in place only while it is unreferenced; this may be
            # rejected if Magnum treats tls_disabled as non-updatable
            openstack coe cluster template update secure-template replace tls_disabled=false

            # If clusters reference it (or the patch is rejected), create a
            # TLS-enabled replacement (tls_disabled defaults to false) and rebuild
            # clusters from it, then retire the old clusters and template
            openstack coe cluster template create secure-template-v2 \
              --image fedora-coreos-38 --keypair ops-key \
              --external-network public --coe kubernetes \
              --flavor m1.small --docker-volume-size 10
            ```
        - id: terraform
          desc: |
            Either omit `tls_disabled` on `openstack_containerinfra_clustertemplate_v1` (the default is `false`) or set it explicitly:

            ```hcl
            resource "openstack_containerinfra_clustertemplate_v1" "k8s" {
              name                = "k8s"
              image               = "fedora-coreos"
              coe                 = "kubernetes"
              external_network_id = openstack_networking_network_v2.public.id
              tls_disabled        = false
            }
            ```
    refs:
      - url: https://docs.openstack.org/magnum/latest/user/index.html
        title: OpenStack Magnum cluster templates

  - uid: mondoo-openstack-security-cluster-template-tls-enabled-openstack
    filters: asset.platform == "openstack-project"
    mql: |
      openstack.clusterTemplates.all(tlsDisabled == false)
  - uid: mondoo-openstack-security-cluster-template-tls-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "openstack_containerinfra_clustertemplate_v1")
    mql: |
