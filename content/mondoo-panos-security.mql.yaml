policies:
  - uid: mondoo-panos-security
    name: Mondoo Palo Alto Networks PAN-OS Security
    version: 2.0.4
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: panos,networkdevice
    require:
      - provider: panos
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure PAN-OS firewalls and Panorama configurations
    docs:
      desc: |
        The Mondoo Palo Alto Networks PAN-OS Security policy identifies critical misconfigurations on PAN-OS firewalls and Panorama management platforms that could leave your network security infrastructure vulnerable to attackers. This policy helps organizations detect and remediate hardening gaps before they can be exploited, reducing the likelihood of unauthorized device access, policy bypass, encrypted threat blindness, and disruption of protected zones.

        This policy provides security checks across key PAN-OS areas:

        - **License management**: Active and unexpired security subscriptions
        - **System configuration**: Operational mode and system parameters
        - **Zone security**: Protection profiles, packet buffer protection, and logging
        - **Security rule hygiene**: App-ID enforcement, threat profiles, and traffic logging
        - **Network interfaces**: Zone assignment, management profiles, and addressing
        - **VPN and IPsec**: IKE and IPsec tunnel configuration
        - **Decryption policy**: Proper profiles and logging
        - **Routing security**: Virtual router and static route configuration

        Learn more about scanning Palo Alto PAN-OS in the [cnspec Palo Alto PAN-OS documentation](https://mondoo.com/docs/cnspec/network/panos).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).

    groups:
      - title: System Configuration
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-operational-mode-normal
      - title: Software and Content Versions
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-threat-content-installed
          - uid: mondoo-panos-security-antivirus-content-installed
          - uid: mondoo-panos-security-wildfire-content-installed
          - uid: mondoo-panos-security-app-content-installed
      - title: License Management
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-no-expired-licenses
          - uid: mondoo-panos-security-threat-prevention-license
          - uid: mondoo-panos-security-wildfire-license
          - uid: mondoo-panos-security-url-filtering-license
          - uid: mondoo-panos-security-dns-security-license
      - title: Zone Security
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-zone-protection-profile
          - uid: mondoo-panos-security-zone-packet-buffer-protection
          - uid: mondoo-panos-security-zone-log-forwarding
      - title: Security Rule Hygiene
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-no-allow-any-rules
          - uid: mondoo-panos-security-rules-use-app-id
          - uid: mondoo-panos-security-rules-have-security-profiles
          - uid: mondoo-panos-security-rules-url-filtering
          - uid: mondoo-panos-security-rules-logging-enabled
          - uid: mondoo-panos-security-no-disabled-rules
          - uid: mondoo-panos-security-rules-wildfire-profile
      - title: Network Interface Hardening
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-interface-management-profile
          - uid: mondoo-panos-security-no-dhcp-interfaces
          - uid: mondoo-panos-security-interfaces-assigned-to-zone
      - title: VPN/IPsec Security
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-ike-version-v2
          - uid: mondoo-panos-security-ike-certificate-auth
          - uid: mondoo-panos-security-ike-dead-peer-detection
          - uid: mondoo-panos-security-ike-no-aggressive-mode
          - uid: mondoo-panos-security-ipsec-anti-replay
          - uid: mondoo-panos-security-ipsec-tunnel-monitoring
      - title: Decryption Policy
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-decryption-profile
          - uid: mondoo-panos-security-decryption-log-failures
      - title: Routing Security
        filters: asset.platform == "pan-os"
        checks:
          - uid: mondoo-panos-security-default-route-exists
          - uid: mondoo-panos-security-ospf-interface-authentication
          - uid: mondoo-panos-security-ospf-virtual-link-authentication
          - uid: mondoo-panos-security-ospf-no-rfc1583
          - uid: mondoo-panos-security-ospf-reject-default-route
queries:
  - uid: mondoo-panos-security-antivirus-content-installed
    title: Ensure antivirus content version is installed
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: panos.system.avVersion != ""
    docs:
      desc: |
        This check verifies that the firewall has antivirus content installed.

        Antivirus content is a separate update stream from the Applications and Threats package. It carries the malware signatures the antivirus profile uses to inspect files moving over HTTP, SMTP, IMAP, POP3, FTP, and SMB, and it is released on a much faster cadence than threat content. The installed version is listed as the Antivirus package under Device > Dynamic Updates, and this check requires it to be present rather than blank.

        **Why this matters**

        File inspection sits between a user clicking a link and a payload landing on their disk. Without antivirus content, an attacker delivering a commodity loader over a web download or a mail attachment needs no evasion at all; the sample can be years old and widely detected everywhere else and it still crosses the perimeter, because the appliance has nothing to match it against.

        Because the antivirus package updates on its own schedule and under its own entitlement, it can be missing while threat content is perfectly current. Administrators who confirm the Applications and Threats version looks recent frequently never notice that the antivirus slot is empty.

        The failure is also asymmetric in the direction that matters least for alerting. No signatures means no antivirus log entries, so the absence of detections reads as the absence of malware.

        Devices deployed purely as internal segmentation firewalls that never carry file transfers gain less from this content, though the download costs nothing and leaves the option open. Note that these signatures only inspect traffic on rules that actually reference an antivirus profile or a profile group, so pair this check with the rule-level profile checks in this policy.
      audit: |
        ### Audit via the PAN-OS web interface

        1. Log in to the PAN-OS web interface.
        2. Navigate to **Device → Dynamic Updates**.
        3. Locate the **Antivirus** section and review the **Currently Installed** version.

        If the Antivirus section shows an installed version, the check passes. If no version is installed, the check fails.

        ### Audit via the PAN-OS CLI

        1. Open an SSH session to the firewall.
        2. Run the following command:

           ```text
           show system info | match av-version
           ```

        If the command returns a non-empty `av-version` value, the check passes. If the value is empty, the check fails.
      remediation:
        - id: console
          desc: |
            **Using the PAN-OS Web Interface**

            1. Navigate to **Device → Dynamic Updates**
            2. Click **Check Now** to retrieve the latest available content versions
            3. Locate the **Antivirus** entry and click **Download**, then **Install**

            To configure automatic updates so content stays current:

            1. Navigate to **Device → Dynamic Updates**
            2. Click the schedule link next to **Antivirus**
            3. Set the recurrence to hourly and enable **Install**
            4. Click **OK** and commit the configuration
        - id: cli
          desc: |
            **Using the CLI**

            Download and install the latest antivirus content:

            ```text
            request anti-virus upgrade download latest
            request anti-virus upgrade install version latest
            ```

    refs:
      - url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin
        title: PAN-OS Administrator's Guide
      - url: https://docs.paloaltonetworks.com/best-practices
        title: Palo Alto Networks Best Practices
  - uid: mondoo-panos-security-app-content-installed
    title: Ensure application content version is installed
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: panos.system.appVersion != ""
    docs:
      desc: |
        This check verifies that the firewall has application identification content installed.

        Application content is the decoder and signature set that lets the firewall name the application behind a session instead of inferring it from the port number. It ships in the same Applications and Threats package as threat content, and the installed version is shown under Device > Dynamic Updates. This check requires an application content version to be present.

        **Why this matters**

        Without this content, every rule that names an application stops matching what its author intended. Traffic falls through to whatever rule matches next, and in most rulebases that is either a broad allow near the bottom or the interzone default deny. The first outcome silently widens access; the second causes an outage. Neither is what the rule says.

        The decoders are also what makes threat inspection work. Security profiles operate on the decoded application stream, so an unidentified application means files inside it are not extracted, URLs inside it are not categorized, and the session is inspected far more shallowly than the attached profiles imply.

        For an attacker, a firewall without application content has been reduced to port matching. Tunneling a command-and-control channel over 443 or 53 stops requiring any real effort, because nothing left on the device distinguishes it from the legitimate traffic sharing that port.

        Newly staged appliances report no content until their first update completes. Because application and threat content ride the same package, this check failing alongside the threat content check almost always points at update connectivity rather than at two separate problems.
      audit: |
        ### Audit via the PAN-OS web interface

        1. Log in to the PAN-OS web interface.
        2. Navigate to **Device → Dynamic Updates**.
        3. Locate the **Applications and Threats** section and review the **Currently Installed** version.

        If the Applications and Threats section shows an installed version, the check passes. If no version is installed, the check fails.

        ### Audit via the PAN-OS CLI

        1. Open an SSH session to the firewall.
        2. Run the following command:

           ```text
           show system info | match app-version
           ```

        If the command returns a non-empty `app-version` value, the check passes. If the value is empty, the check fails.
      remediation:
        - id: console
          desc: |
            **Using the PAN-OS Web Interface**

            1. Navigate to **Device → Dynamic Updates**
            2. Click **Check Now** to retrieve the latest available content versions
            3. Locate the **Applications and Threats** entry and click **Download**, then **Install**

            To configure automatic updates:

            1. Navigate to **Device → Dynamic Updates**
            2. Click the schedule link next to **Applications and Threats**
            3. Set the recurrence (daily recommended) and enable **Install**
            4. Enable **Threshold**, which delays installation until the content has been available for a set number of hours, reducing the risk of deploying a faulty update
            5. Click **OK** and commit the configuration
        - id: cli
          desc: |
            **Using the CLI**

            Download and install the latest application and threat content:

            ```text
            request content upgrade download latest
            request content upgrade install version latest
            ```

    refs:
      - url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin
        title: PAN-OS Administrator's Guide
      - url: https://docs.paloaltonetworks.com/best-practices
        title: Palo Alto Networks Best Practices
  - uid: mondoo-panos-security-dns-security-license
    title: Ensure DNS Security license is active
    impact: 75
    filters: panos.licenses != empty
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      panos.licenses.
        where(feature.downcase.contains("dns") && expired == "no").
        length > 0
    docs:
      desc: |
        This check verifies that the firewall carries an active DNS Security subscription.

        DNS Security adds a real-time cloud lookup on the domains the firewall observes in DNS queries, classifying them against categories such as command and control, malware, dynamic DNS, newly registered domains, and algorithmically generated names. It is switched on through the DNS policies of an Anti-Spyware profile, and its entitlement is listed under Device > Licenses, where this check requires an entry for the DNS feature that is not expired.

        **Why this matters**

        DNS is the one protocol allowed out of nearly every network, which is precisely why malware uses it for rendezvous and for exfiltration. A beacon resolving a fresh domain every few minutes produces no unusual pattern at the transport layer; the only distinguishing feature is the domain itself.

        Domain generation algorithms exist to defeat blocklists, cycling through thousands of candidate names so no static list keeps up. Cloud-side analysis is what makes them tractable, because classification happens against a live feed rather than against content downloaded hours ago.

        DNS tunneling is the exfiltration case. Data encoded into query labels leaves as a stream of ordinary lookups to a nameserver the attacker controls, and without query-level analysis nothing in the session log looks wrong.

        This control only sees queries that traverse the firewall, so environments where endpoints reach an external resolver over encrypted DNS or use a third-party service directly need those paths blocked or redirected first. Configure sinkholing in the Anti-Spyware profile as well, so a matched domain resolves somewhere the infected host can actually be identified.
      audit: |
        ### Audit via the PAN-OS web interface

        1. Log in to the PAN-OS web interface.
        2. Navigate to **Device → Licenses**.
        3. Locate the **DNS Security** entry and review its **Expires** date and status.

        If a DNS Security license is present and not expired, the check passes. If the license is missing or expired, the check fails.

        ### Audit via the PAN-OS CLI

        1. Open an SSH session to the firewall.
        2. Run the following command:

           ```text
           request license info
           ```

        If the output lists a DNS Security feature with an expiry date in the future, the check passes. If no DNS Security feature is listed or it is expired, the check fails.
      remediation:
        - id: console
          desc: |
            **Using the PAN-OS Web Interface**

            1. Contact your Palo Alto Networks sales representative or authorized reseller to purchase a DNS Security subscription
            2. Log into the [Customer Support Portal](https://support.paloaltonetworks.com) and retrieve the license activation code
            3. Navigate to **Device → Licenses**
            4. Click **Retrieve license keys from license server** to activate the subscription
            5. Navigate to **Objects → Security Profiles → Anti-Spyware** and enable DNS Security in the relevant profiles
            6. Ensure the Anti-Spyware profile with DNS Security is applied to your security policy rules
            7. Commit the configuration
        - id: cli
          desc: |
            **Using the CLI**

            Retrieve the license key after purchase and verify activation:

            ```text
            request license fetch
            request license info
            ```

    refs:
      - url: https://docs.paloaltonetworks.com/best-practices
        title: Palo Alto Networks Best Practices
  - uid: mondoo-panos-security-no-expired-licenses
    title: Ensure no licenses are expired
    impact: 90
    filters: panos.licenses != empty
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: panos.licenses.where(expired == "yes") == []
    docs:
      desc: |
        This check verifies that no subscription on the firewall has expired.

        PAN-OS keeps a license entry for every subscription and capability on the device, each with its own expiry date, and marks entries past that date as expired. The full list is visible under Device > Licenses, and this check requires that none of those entries carry an expired status.

        **Why this matters**

        Subscriptions do not fail loudly when they lapse. The feature usually keeps running on whatever content it last downloaded, so the device continues to inspect traffic, continues to write logs, and continues to look healthy while its view of the threat landscape is frozen on the day the subscription ended. Every vulnerability disclosed after that date is invisible to it.

        That gap is valuable to an attacker precisely because it is quiet. Exploitation of newly disclosed edge-device vulnerabilities is now measured in days, and a firewall running content from three months ago will not recognize any of it.

        Expiry is also rarely limited to one feature. Subscriptions are commonly bought as a bundle with a shared renewal date, so a missed renewal takes threat prevention, URL filtering, WildFire, and DNS Security out together, removing several independent layers at once rather than one.

        Some entries cover perpetual capabilities or evaluation features that were never meant to be renewed, and those will fail this check without representing a real gap. Review the list and remove licenses the organization has deliberately let go, rather than leaving expired entries in place where they mask a renewal that genuinely was missed.
      audit: |
        ### Audit via the PAN-OS web interface

        1. Log in to the PAN-OS web interface.
        2. Navigate to **Device → Licenses**.
        3. Review the **Expires** date and status of every listed subscription.

        If no subscription shows an expired status, the check passes. If any subscription is expired, the check fails.

        ### Audit via the PAN-OS CLI

        1. Open an SSH session to the firewall.
        2. Run the following command:

           ```text
           request license info
           ```

        If every feature listed shows an expiry date in the future, the check passes. If any feature is expired, the check fails.
      remediation:
        - id: console
          desc: |
            **Using the PAN-OS Web Interface**

            1. Navigate to **Device → Licenses** to review the status and expiration date of each subscription
            2. Log into the [Customer Support Portal](https://support.paloaltonetworks.com)
            3. Navigate to **Assets → Devices** and select the device with expired licenses
            4. Renew the required subscriptions through your Palo Alto Networks sales representative or authorized reseller
            5. After renewal, return to **Device → Licenses** in the PAN-OS web interface
            6. Click **Retrieve license keys from license server** to activate the renewed subscriptions
            7. Verify all licenses now show as active with updated expiration dates

            Set up license expiration alerts to avoid future lapses by configuring email notifications in the Customer Support Portal.
        - id: cli
          desc: |
            **Using the CLI**

            Fetch renewed license keys and verify their status:

            ```text
            request license fetch
            request license info
            ```

    refs:
      - url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin
        title: PAN-OS Administrator's Guide
  - uid: mondoo-panos-security-operational-mode-normal
    title: Ensure device operational mode is normal
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-1
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: panos.system.operationalMode.downcase == "normal"
    docs:
      desc: |
        This check verifies that the firewall is running in normal operational mode.

        PAN-OS reports an operational mode describing which runtime the system booted into. Normal mode is the state in which the dataplane forwards traffic and the security policy is enforced; other states, such as maintenance mode or a partially initialized boot, mean the system is not doing that work. The mode appears in the General Information section of the Dashboard and in the output of `show system info`, and this check requires it to be normal.

        **Why this matters**

        A firewall that is not in normal mode is not a firewall. Depending on the platform and the deployment, traffic either stops at the device, which blacks out every site behind it, or passes without inspection, which quietly removes the perimeter while every upstream dashboard still shows the appliance as present. The second failure is worse than the outage nobody misses.

        Maintenance mode in particular is a recovery state reached after a failed content install, a corrupted configuration, or a disk problem. It offers console access and image recovery, and it does not run the security policy. A device sitting in maintenance mode since an unattended reboot has been out of the enforcement path for however long that reboot went unnoticed.

        The mode is also a signal about hardware. Appliances that fail power-on diagnostics or lose a dataplane processor often come up degraded rather than refusing to boot, so an unexpected operational mode is frequently the first visible symptom of a failing device.

        Firewalls deliberately placed in FIPS-CC mode, or being rebuilt during a maintenance window, will fail this check by design; confirm the mode against the change record before treating it as an incident. Pair the check with out-of-band console access, because a device found in maintenance mode cannot be recovered over the network.
      audit: |
        ### Audit via the PAN-OS CLI

        1. Open an SSH session to the firewall.
        2. Run the following command:

           ```text
           show system info | match oper
           ```

        If `operational-mode` reports `normal`, the check passes. If it reports any other value, the check fails.
      remediation:
        - id: console
          desc: |
            **Using the PAN-OS Web Interface**

            1. Review **Monitor → System Logs** for errors or warnings that indicate why the device entered a non-normal state

            If the device is in maintenance mode:

            1. Connect to the device via console cable
            2. Review the maintenance mode menu for options to reboot into normal mode or restore the configuration
            3. If prompted, select **Continue with normal boot** or **Reboot to normal mode**

            If the device entered maintenance mode after a failed software upgrade:

            1. From the maintenance mode menu, select **Reboot** to attempt a normal boot
            2. If the device re-enters maintenance mode, use the option to restore the previous software version

            If the device cannot return to normal mode, contact [Palo Alto Networks Support](https://support.paloaltonetworks.com) for assistance.
        - id: cli
          desc: |
            **Using the CLI**

            Check the current operational mode:

            ```text
            show system info | match oper
            ```

            If the mode is not normal, investigate the system logs and the maintenance mode console before taking action. A restart is usually required to return to normal mode, but it reboots the entire device and interrupts all traffic, so run it only during an approved maintenance window:

            ```text
            request restart system
            ```

    refs:
      - url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/getting-started/integrate-the-firewall-into-your-management-network
        title: PAN-OS Device Management
  - uid: mondoo-panos-security-threat-content-installed
    title: Ensure threat content version is installed
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-id-ra-1
      compliance/nist-csf-2: nist-csf-2-id-ra-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: panos.system.threatVersion != ""
    docs:
      desc: |
        This check verifies that the firewall has threat prevention content installed.

        Threat content is the signature package behind vulnerability protection, anti-spyware, and the rest of the intrusion prevention engine. It arrives through the Applications and Threats update, and the installed version is shown under Device > Dynamic Updates and in the Dashboard's General Information panel. This check requires a threat content version to be present rather than blank.

        **Why this matters**

        An appliance with no threat content still matches traffic against the security policy, but the profiles attached to those rules have nothing to compare packets against. An attacker sending a known exploit for an unpatched mail server, load balancer, or VPN appliance behind the firewall gets a clean pass, and the traffic log records an allowed session rather than a blocked threat.

        The gap is invisible from the outside. Rules still show vulnerability and anti-spyware profiles attached, threat logs still exist, and the only difference is that they stay empty. Teams reading a quiet threat log as evidence that nothing is attacking them will not question it until an endpoint is already compromised.

        Missing content usually means the device cannot reach the update servers, that the subscription lapsed, or that a scheduled download completed while the install step failed. Each of those is silent, so the absence tends to persist for weeks.

        A firewall that has just been factory reset or newly staged will legitimately report no content until its first update runs. Pair this check with the license checks in this policy, because downloads stop the moment the underlying subscription expires even though the last installed version stays on disk and keeps this check passing.
      audit: |
        ### Audit via the PAN-OS web interface

        1. Log in to the PAN-OS web interface.
        2. Navigate to **Device → Dynamic Updates**.
        3. Locate the **Applications and Threats** section and review the **Currently Installed** version.

        If the Applications and Threats section shows an installed version, the check passes. If no version is installed, the check fails.

        ### Audit via the PAN-OS CLI

        1. Open an SSH session to the firewall.
        2. Run the following command:

           ```text
           show system info | match threat-version
           ```

        If the command returns a non-empty `threat-version` value, the check passes. If the value is empty, the check fails.
      remediation:
        - id: console
          desc: |
            **Using the PAN-OS Web Interface**

            1. Navigate to **Device → Dynamic Updates**
            2. Click **Check Now** to retrieve the latest available content versions
            3. Locate the **Applications and Threats** entry and click **Download**, then **Install**

            To configure automatic updates so threat content stays current:

            1. Navigate to **Device → Dynamic Updates**
            2. Click the schedule link next to **Applications and Threats**
            3. Set the recurrence (daily recommended) and enable **Install**
            4. Enable **Threshold** to delay installation until the content has been available for a set number of hours, reducing the risk of deploying a faulty update
            5. Click **OK** and commit the configuration

            Note: Threat content and application content are delivered together in the Applications and Threats update package. An active Threat Prevention license is required to receive these updates.
        - id: cli
          desc: |
            **Using the CLI**

            Download and install the latest threat content:

            ```text
            request content upgrade download latest
            request content upgrade install version latest
            ```

    refs:
      - url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin
        title: PAN-OS Administrator's Guide
