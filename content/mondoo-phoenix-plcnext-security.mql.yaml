  - uid: phoenix-plcnext-22
    title: Ensure SSH password authentication is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      sshd.config.params["PasswordAuthentication"] == "no"
      sshd.config.params["PubkeyAuthentication"] == "yes"
    docs:
      desc: |
        This check verifies that the controller requires SSH key authentication and does not accept passwords.

        The check reads the SSH configuration and requires `PasswordAuthentication` to be `no` and `PubkeyAuthentication` to be `yes`. Both are needed: disabling passwords without keys enabled would leave no way in, and enabling keys while passwords remain accepted leaves the weaker path open alongside the stronger one.

        **Why this matters**

        A password on a controller is a shared secret in the worst environment for one. It is handed to plant engineers, to the integrator who commissioned the line, and to vendor support during a callout, it is written in the commissioning documentation, and it is frequently identical across every controller in the plant because that is what made installation practical. It is almost never changed afterward, because changing it means coordinating with everyone who holds it.

        That single password is also guessable over the network. Controllers rarely have account lockout, rate limiting, or any monitoring that would notice sustained attempts, so an attacker who reaches the SSH port can work at it indefinitely and quietly.

        Keys remove the shared secret. Each person or system gets their own, access is revoked by deleting one line without affecting anyone else, and there is nothing to guess over the network because the private key never leaves the client.

        Before applying this, confirm the authorized keys are in place and a working key-based login has been tested. Disabling password authentication on a controller you cannot otherwise reach means a trip to the plant floor with a serial cable.
      audit: |
        Run `grep -riE '^\s*(Password|Pubkey)Authentication' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null` and review both values together.

        A passing controller sets `PasswordAuthentication no` and `PubkeyAuthentication yes`, so logins require a key. A failing controller allows password authentication, or leaves either directive unset. `PubkeyAuthentication` defaults to `yes`, but this check expects it to be set explicitly, so confirm the directive is present rather than relying on the default.
      remediation: |-
        Set up key-based authentication for your administrative account before disabling password authentication. If you disable password authentication without a working key, you lose SSH access to the controller.

        1. Generate an SSH key pair on your engineering workstation and install the public key for the management account on the controller:

           ```bash
           mkdir -p /home/admin/.ssh
           chmod 700 /home/admin/.ssh
           echo 'ssh-ed25519 AAAA...your-public-key... user@workstation' >> /home/admin/.ssh/authorized_keys
           chmod 600 /home/admin/.ssh/authorized_keys
           chown -R admin /home/admin/.ssh
           ```

        2. From a new terminal, confirm that key-based login works while keeping your current session open.
        3. Edit the `/etc/ssh/sshd_config` file to set the `PasswordAuthentication` and `PubkeyAuthentication` parameters:

           ```text
           PasswordAuthentication no
           PubkeyAuthentication yes
           ```

        4. Validate the configuration with `sshd -t`, restart the SSH service, and verify key-based login again before closing your session.

        > **Warning:** Applying `PasswordAuthentication no` without a tested key locks all users out of SSH on the controller. Keep an active session open until you confirm key-based access works.
    refs:
      - url: https://pxc1.esc-eu-central-1.empolisservices.com/service-express/portal/project1_p/document/en-so-30b315c3-3e44-4292-97d4-6883672cd34c?context=%7B%7D
        title: How to set up key-based SSH authentication to a PLCnext Control device
