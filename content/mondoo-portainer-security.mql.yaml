  - uid: mondoo-portainer-security-settings-no-device-mapping-for-regular-users
    title: Ensure regular users cannot map host devices into containers
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-portainer-security-settings-no-device-mapping-for-regular-users-portainer
        tags:
          mondoo.com/filter-title: Portainer
      - uid: mondoo-portainer-security-settings-no-device-mapping-for-regular-users-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
      - uid: mondoo-portainer-security-settings-no-device-mapping-for-regular-users-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
      - uid: mondoo-portainer-security-settings-no-device-mapping-for-regular-users-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
    docs:
      desc: |
        This check verifies that users who are not administrators cannot expose host devices to the containers they deploy.

        Device mapping passes a node from the host's `/dev` tree into a container along with permission to read it, write it, and create device nodes from it. Portainer calls the restriction **Hide device mappings for non-administrators**, in the **Docker security settings** on an environment's **Setup** page under **Host** or **Swarm**, and this check requires it to be in force on every managed environment as well as in the instance defaults. In Terraform it is `allow_device_mapping` inside the `security_settings` block of a `portainer_endpoint_settings` resource, which must not be `true`.

        **Why this matters**

        Mapping a block device such as `/dev/sda` hands the container the raw disk that holds the host root filesystem and every other container's layers. File ownership and permissions are enforced by the filesystem driver, and reading the block device goes underneath all of it, so an attacker with a standard account dumps the partition, carves out `/etc/shadow` and any secret ever written to disk, and never mounts anything Portainer would display.

        Writing to that device is worse than reading it. A crafted write into the host filesystem persists after the container is deleted, so the mapping becomes a way to install a backdoor that outlives the account being disabled.

        Devices other than disks are just as useful to an attacker. Where they exist, `/dev/mem` and `/dev/kmem` are direct physical memory access, and mapping a hardware token, a TPM device node, or a serial console gives a container control of hardware the operator assumed only the host could touch.

        GPU workloads, USB and serial peripherals, and some storage tooling do need device access. Deploy those as an administrator, or dedicate an environment to them, rather than relaxing the restriction for every standard user on the instance.
      audit: |
        ### Audit via Portainer UI

        1. Sign in as an administrator and open **Settings**.
        2. Confirm **Allow device mapping for regular users** is disabled.
        3. Open each environment's **Settings** and confirm no override re-enables device mapping.

        A passing result shows device mapping disabled instance-wide and on every environment.

        ### Audit via API

        ```bash
        curl -s -H "x-api-key: $PORTAINER_ACCESS_TOKEN" \
          https://portainer.example.com/api/settings
        ```

        A passing response has no permissive `allowDeviceMappingForRegularUsers` flag; confirm the same for each endpoint's `SecuritySettings`.
      remediation:
        - id: console
          desc: |
            To disable device mapping for regular users in the Portainer UI:

            1. Sign in as an administrator and open **Settings**.
            2. Disable **Allow device mapping for regular users**.
            3. Disable any per-environment override that allows device mapping.
            4. Save the changes.
        - id: terraform
          desc: |
            To disable device mapping on a managed environment with the Portainer Terraform provider:

            ```hcl
            resource "portainer_endpoint_settings" "example" {
              endpoint_id = portainer_environment.example.id

              security_settings {
                allow_device_mapping = false
              }
            }
            ```
    refs:
      - url: https://docs.portainer.io/admin/environments/access
        title: Portainer Environment Access and Security Settings
  - uid: mondoo-portainer-security-settings-no-device-mapping-for-regular-users-portainer
    filters: asset.platform == "portainer-server"
    mql: |
      portainer.settings.allowDeviceMappingForRegularUsers == false
      portainer.environments.all(securitySettings['allowDeviceMappingForRegularUsers'] != true)
  - uid: mondoo-portainer-security-settings-no-device-mapping-for-regular-users-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "portainer_endpoint_settings")
