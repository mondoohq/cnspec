  - uid: mondoo-portainer-security-settings-no-volume-browser-for-regular-users
    title: Ensure regular users cannot browse volume contents
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a12
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-portainer-security-settings-no-volume-browser-for-regular-users-portainer
        tags:
          mondoo.com/filter-title: Portainer
      - uid: mondoo-portainer-security-settings-no-volume-browser-for-regular-users-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
      - uid: mondoo-portainer-security-settings-no-volume-browser-for-regular-users-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
      - uid: mondoo-portainer-security-settings-no-volume-browser-for-regular-users-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
    docs:
      desc: |
        This check verifies that users who are not administrators cannot read and download the contents of Docker volumes from the Portainer interface.

        The volume browser opens a file manager over any volume on a managed environment, listing directories, downloading files, and uploading replacements, regardless of which container owns the volume or whether the user has access to that container. Portainer calls this **Enable volume management for non-administrators**, in the **Host and filesystem** section of an environment's **Setup** page under **Host** or **Swarm**, and this check requires it to be off on every managed environment as well as in the instance defaults. In Terraform it is `allow_volume_browser` inside the `security_settings` block of a `portainer_endpoint_settings` resource, which must not be `true`.

        **Why this matters**

        Volumes are where the data actually is. Database files, TLS private keys, application configuration holding API keys, and environment files sit in them precisely because the container filesystem is ephemeral and the volume is not. A standard account with the browser copies them out through the web interface, without deploying anything and without ever running a container the operator would notice.

        The browser writes as well as reads, which turns it into code execution. Replacing a configuration file, a startup script, or a job definition inside a volume means the owning workload runs the attacker's content the next time it starts or reloads, in a workload the attacker had no permission to touch.

        Both directions go through Portainer's own connection to the environment, so the application whose data is being read or rewritten observes nothing. There is no failed authentication, no unfamiliar client, and no entry in its log.

        Where a team genuinely needs file-level access to data it owns, relax the restriction on an environment dedicated to that team rather than instance-wide, so the reach of the capability matches the reach of the team. Note that the toggle is only available on environments running the Portainer Agent, so an environment connected directly to a container runtime socket has nothing to loosen here.
      audit: |
        ### Audit via Portainer UI

        1. Sign in as an administrator and open **Settings**.
        2. Confirm **Allow volume browser for regular users** is disabled.
        3. Open each environment's **Settings** and confirm no override re-enables the volume browser.

        A passing result shows the volume browser disabled instance-wide and on every environment.

        ### Audit via API

        ```bash
        curl -s -H "x-api-key: $PORTAINER_ACCESS_TOKEN" \
          https://portainer.example.com/api/settings
        ```

        A passing response has no permissive `allowVolumeBrowserForRegularUsers` flag; confirm the same for each endpoint's `SecuritySettings`.
      remediation:
        - id: console
          desc: |
            To disable the volume browser for regular users in the Portainer UI:

            1. Sign in as an administrator and open **Settings**.
            2. Disable **Allow volume browser for regular users**.
            3. Disable any per-environment override that allows the volume browser.
            4. Save the changes.
        - id: terraform
          desc: |
            To disable the volume browser on a managed environment with the Portainer Terraform provider:

            ```hcl
            resource "portainer_endpoint_settings" "example" {
              endpoint_id = portainer_environment.example.id

              security_settings {
                allow_volume_browser = false
              }
            }
            ```
    refs:
      - url: https://docs.portainer.io/admin/environments/access
        title: Portainer Environment Access and Security Settings
  - uid: mondoo-portainer-security-settings-no-volume-browser-for-regular-users-portainer
    filters: asset.platform == "portainer-server"
    mql: |
      portainer.settings.allowVolumeBrowserForRegularUsers == false
      portainer.environments.all(securitySettings['allowVolumeBrowserForRegularUsers'] != true)
  - uid: mondoo-portainer-security-settings-no-volume-browser-for-regular-users-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "portainer_endpoint_settings")
    mql: |
