  # ----------------------------------------------------------------------------
  # Authentication
  # ----------------------------------------------------------------------------
  - uid: mondoo-portainer-security-settings-external-authentication
    title: Ensure authentication is delegated to an external identity provider
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a12
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-portainer-security-settings-external-authentication-portainer
        tags:
          mondoo.com/filter-title: Portainer
      - uid: mondoo-portainer-security-settings-external-authentication-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
      - uid: mondoo-portainer-security-settings-external-authentication-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
      - uid: mondoo-portainer-security-settings-external-authentication-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
    docs:
      desc: |
        This check verifies that user identity is established by an external identity provider rather than by Portainer's own account database.

        Portainer can authenticate users against its internal database, against LDAP or Active Directory, or against an OAuth provider. Portainer calls this **Authentication method**, under **Settings**, **Authentication**, and this check requires any option other than **Internal**. In Terraform it is `authentication_method` on a `portainer_settings` resource, where `1` selects internal authentication, `2` LDAP, and `3` OAuth.

        **Why this matters**

        Internal accounts exist only inside Portainer, so none of the controls the organization already runs on identity apply to them. There is no second factor available, which means a password taken by a phishing page, an infostealer on a laptop, or a credential-stuffing list is by itself enough to sign in to a console that can deploy a container on every managed node.

        Deprovisioning is the failure that surfaces later. When someone leaves, the directory account is disabled and the Portainer account is not, because it is on nobody's list. The credential keeps working, and it keeps working with whatever role it had, which for an operations tool is frequently administrator.

        Detection disappears in the same way. Impossible-travel alerts, risky sign-in scoring, device compliance, and the ability to revoke every session for a person at once all live in the identity provider and never observe an internal login.

        Delegating authentication is not the same as adding a second factor. LDAP centralizes the account but inherits only what the directory itself enforces, so pair it with a provider that actually requires multi-factor authentication. Keeping one internal administrator as a break-glass account for when the provider is unreachable is reasonable, provided its credential is stored properly and its use raises an alert.
      audit: |
        ### Audit via Portainer UI

        1. Sign in as an administrator and open **Settings > Authentication**.
        2. Confirm the active authentication method is **LDAP** or **OAuth**, not **Internal**.

        A passing result shows an external authentication method selected; a failing result shows internal authentication.

        ### Audit via API

        ```bash
        curl -s -H "x-api-key: $PORTAINER_ACCESS_TOKEN" \
          https://portainer.example.com/api/settings
        ```

        A passing response shows `AuthenticationMethod` of `2` (LDAP) or `3` (OAuth); a failing response shows `1` (internal).
      remediation:
        - id: console
          desc: |
            To delegate authentication to an external identity provider in the Portainer UI:

            1. Sign in as an administrator and open **Settings > Authentication**.
            2. Select **LDAP** or **OAuth** and complete the provider configuration.
            3. Save the changes and verify that an existing account can sign in through the provider before removing internal accounts.
        - id: terraform
          desc: |
            To configure an external authentication method with the Portainer Terraform provider (`2` = LDAP, `3` = OAuth):

            ```hcl
            resource "portainer_settings" "example" {
              authentication_method = 3
            }
            ```
    refs:
      - url: https://docs.portainer.io/admin/settings/authentication
        title: Portainer Authentication Settings
  - uid: mondoo-portainer-security-settings-external-authentication-portainer
    filters: asset.platform == "portainer-server"
    mql: |
      portainer.settings.authenticationMethod != "internal"
  - uid: mondoo-portainer-security-settings-external-authentication-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "portainer_settings")
    mql: |
      terraform.resources("portainer_settings").all(arguments.authentication_method != 1)
  - uid: mondoo-portainer-security-settings-external-authentication-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "portainer_settings")
    mql: |
      terraform.plan.resourceChanges.where(type == "portainer_settings").all(change.after.authentication_method != 1)
  - uid: mondoo-portainer-security-settings-external-authentication-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "portainer_settings")
    mql: |
      terraform.state.resources.where(type == "portainer_settings").all(values.authentication_method != 1)

  - uid: mondoo-portainer-security-settings-minimum-password-length
    title: Ensure internal authentication enforces a minimum password length
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: false
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    props:
      - uid: mondooPortainerSecurityMinPasswordLength
        title: Minimum password length enforced for internal authentication
        mql: "12"
    variants:
      - uid: mondoo-portainer-security-settings-minimum-password-length-portainer
        tags:
          mondoo.com/filter-title: Portainer
      - uid: mondoo-portainer-security-settings-minimum-password-length-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
      - uid: mondoo-portainer-security-settings-minimum-password-length-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
      - uid: mondoo-portainer-security-settings-minimum-password-length-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
    docs:
      desc: |
        This check verifies that accounts held in Portainer's own user database must use a password of at least a set minimum length.

        When internal authentication is in use, length is effectively the only password rule Portainer applies: there is no complexity requirement, no history, no reuse check, and no comparison against known-breached passwords. The value is a slider under **Settings**, **Authentication**, in the **Password rules** section, described there as the minimum length for user-generated passwords. This check requires at least 12 characters by default and the threshold is adjustable through the check's property. In Terraform it is `required_password_length` inside the `internal_auth_settings` block of a `portainer_settings` resource.

        **Why this matters**

        A Portainer account is not an ordinary application login. It can deploy a workload onto the hosts and clusters it has access to, which on a permissively configured instance is equivalent to a shell on those nodes. That makes the sign-in page worth attacking with password spraying, where one common password is tried against every username rather than many passwords against one.

        Length is what decides whether that works. Eight-character passwords drawn from ordinary human patterns fall to a wordlist on commodity hardware if the stored hashes are ever obtained, and they fall to spraying with no hashes at all. Twelve characters moves a password out of reach of the untargeted attacks that make up almost all of the volume.

        It also matters that this is a floor rather than advice. Users who are told to pick something longer largely will not, and users who cannot save a shorter one have no choice in the matter.

        Where an identity provider is available, moving off internal authentication entirely is a stronger control than tuning this number, because it brings multi-factor authentication and central deprovisioning with it. A Terraform configuration that never declares the value is not failed here, because there is nothing to read and the instance keeps whatever it already had.
      audit: |
        ### Audit via Portainer UI

        1. Sign in as an administrator and open **Settings > Authentication**.
        2. With internal authentication selected, confirm the minimum password length is set to 12 or greater.

        A passing result shows a required length of at least 12; a failing result shows a smaller value.

        ### Audit via API

        ```bash
        curl -s -H "x-api-key: $PORTAINER_ACCESS_TOKEN" \
          https://portainer.example.com/api/settings
        ```

        A passing response shows `InternalAuthSettings.RequiredPasswordLength` of 12 or greater.
      remediation:
        - id: console
          desc: |
            To raise the minimum password length in the Portainer UI:

            1. Sign in as an administrator and open **Settings > Authentication**.
            2. With internal authentication selected, set the minimum password length to 12 or greater.
            3. Save the changes.
        - id: terraform
          desc: |
            To enforce a minimum password length for internally managed accounts with the Portainer Terraform provider:

            ```hcl
            resource "portainer_settings" "example" {
              internal_auth_settings {
                required_password_length = 12
              }
            }
            ```
    refs:
      - url: https://docs.portainer.io/admin/settings/authentication
        title: Portainer Authentication Settings
  - uid: mondoo-portainer-security-settings-minimum-password-length-portainer
    filters: asset.platform == "portainer-server"
    props:
      - uid: mondooPortainerSecurityMinPasswordLength
        mql: "12"
    mql: |
      portainer.settings.requiredPasswordLength >= props.mondooPortainerSecurityMinPasswordLength
  - uid: mondoo-portainer-security-settings-minimum-password-length-terraform-hcl
