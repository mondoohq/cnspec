policies:
  - uid: mondoo-postgresql-security
    name: Mondoo PostgreSQL Security
    version: 1.0.1
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: linux,postgresql
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden PostgreSQL server transport, host-based authentication, and audit logging
    docs:
      desc: |
        The Mondoo PostgreSQL Security policy assesses the on-disk configuration of a self-managed PostgreSQL server. It inspects `postgresql.conf` together with the fragments pulled in by its `include`, `include_if_exists`, and `include_dir` directives, plus the `pg_hba.conf` host-based authentication rules and the `pg_ident.conf` identity mappings.

        This policy provides security checks across four areas:

        - Connection surface and TLS transport settings
        - Host-based authentication rules and identity mapping
        - Audit logging coverage and log file protection
        - Ownership and permissions on the configuration files themselves

        **Scope and limitations**

        This policy reads configuration as it is written to disk. It does not open a SQL connection to the server, so it cannot assess roles, role attributes, object privileges, installed extensions, or the server version. Checks describe the configuration the server would load on its next start or reload.

        Settings changed with `ALTER SYSTEM` are written to `postgresql.auto.conf` in the data directory rather than to `postgresql.conf`. PostgreSQL applies that file last, so it takes precedence over everything this policy reads. Remediation steps therefore edit `postgresql.conf` directly, which keeps the effective configuration and the audited configuration in agreement. Where a setting has already been overridden with `ALTER SYSTEM`, reset it with `ALTER SYSTEM RESET <parameter>` so the value in `postgresql.conf` takes effect again.

        Learn more about scanning Linux in the [cnspec Linux documentation](https://mondoo.com/docs/cnspec/os/linux).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Connection and Transport Security
        filters: |
          asset.family.contains("linux") &&
          postgresql.conf.file.exists
        checks:
          - uid: mondoo-postgresql-security-listen-addresses-restricted
          - uid: mondoo-postgresql-security-tls-enabled
          - uid: mondoo-postgresql-security-tls-min-protocol-version
          - uid: mondoo-postgresql-security-tls-strong-ciphers
          - uid: mondoo-postgresql-security-tls-prefer-server-ciphers
          - uid: mondoo-postgresql-security-tls-client-ca-configured
      - title: Authentication and Host-Based Access Control
        filters: |
          asset.family.contains("linux") &&
          postgresql.conf.file.exists
        checks:
          - uid: mondoo-postgresql-security-password-encryption-scram
          - uid: mondoo-postgresql-security-hba-no-trust-auth
          - uid: mondoo-postgresql-security-hba-no-plaintext-password-auth
          - uid: mondoo-postgresql-security-hba-no-md5-auth
          - uid: mondoo-postgresql-security-hba-no-unrestricted-client-addresses
          - uid: mondoo-postgresql-security-hba-remote-connections-require-tls
          - uid: mondoo-postgresql-security-hba-replication-restricted
          - uid: mondoo-postgresql-security-hba-cert-auth-requires-verify-full
          - uid: mondoo-postgresql-security-ident-no-superuser-mappings
          - uid: mondoo-postgresql-security-ident-no-catch-all-mappings
          - uid: mondoo-postgresql-security-db-user-namespace-disabled
      - title: Logging and Auditing
        filters: |
          asset.family.contains("linux") &&
          postgresql.conf.file.exists
        checks:
          - uid: mondoo-postgresql-security-logging-collector-enabled
          - uid: mondoo-postgresql-security-log-destination-configured
          - uid: mondoo-postgresql-security-log-connections-enabled
          - uid: mondoo-postgresql-security-log-disconnections-enabled
          - uid: mondoo-postgresql-security-log-statement-captures-ddl
          - uid: mondoo-postgresql-security-log-line-prefix-includes-context
          - uid: mondoo-postgresql-security-log-error-verbosity-not-terse
          - uid: mondoo-postgresql-security-log-file-mode-restricted
          - uid: mondoo-postgresql-security-pgaudit-extension-enabled
      - title: Configuration File Protection
        filters: |
          asset.family.contains("linux") &&
          postgresql.conf.file.exists
        checks:
          - uid: mondoo-postgresql-security-conf-files-restricted-permissions
          - uid: mondoo-postgresql-security-hba-file-restricted-permissions
          - uid: mondoo-postgresql-security-local-preload-libraries-empty
queries:
  - uid: mondoo-postgresql-security-listen-addresses-restricted
    title: Ensure listen_addresses does not bind PostgreSQL to every interface
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      postgresql.conf.listenAddresses.none(_ == "*" || _ == "0.0.0.0" || _ == "::")
    docs:
      desc: |
        This check verifies that the server binds only to the network interfaces an operator named, instead of to every address the host holds.

        `listen_addresses` in `postgresql.conf` decides which interfaces the postmaster opens a socket on. The check fails on the wildcard forms `*`, `0.0.0.0`, and `::`, and passes when the value lists `localhost` or the specific private addresses the database is meant to serve. PostgreSQL reads this setting only at startup, so a restart is required; a reload leaves the existing sockets bound.

        **Why this matters**

        A wildcard bind puts port 5432 on every network the host touches, including a management VLAN, a second interface added months later, and the public address of a cloud instance. Internet-wide scanners sweep that port continuously, and PostgreSQL answers an unauthenticated startup packet with enough detail to fingerprint the server, so a newly exposed cluster is catalogued within hours of becoming reachable.

        Once an attacker can open a socket, they spray passwords against `postgres` and against the application roles whose names they harvested from a leaked connection string or a public repository. Every attempt reaches the authentication code path directly, and if any host-based authentication rule is broad enough to match their source address, the credential is the only thing left between them and the tables.

        Packaged installations and container images widen this to `*` so the server answers during setup, and the widened value is rarely narrowed once the deployment works.

        Keep the list to loopback plus the application subnets, and confirm what the server is actually listening on after the restart rather than trusting the file alone. A host that genuinely serves several networks should name each address explicitly rather than falling back to the wildcard.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW listen_addresses;"
        ```

        2. Read the value as written to the configuration file:

        ```bash
        sudo -u postgres grep -E "^\s*listen_addresses" /etc/postgresql/16/main/postgresql.conf
        ```

        3. Confirm which addresses the server is actually bound to:

        ```bash
        sudo ss -lntp | grep postgres
        ```

        A passing result lists only loopback addresses or specific private addresses the database is meant to serve. A failing result shows `*`, `0.0.0.0`, or `::`, or shows the server listening on `0.0.0.0:5432`.
      remediation:
        - id: cli
          desc: |
            To bind PostgreSQL to specific interfaces using the CLI:

            1. Edit `postgresql.conf` and set `listen_addresses` to the addresses the server must serve.
            2. Restart PostgreSQL, because this setting cannot be applied with a reload.
            3. Confirm the server is bound only to the intended addresses.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*listen_addresses.*/listen_addresses = 'localhost,10.0.0.5'/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl restart postgresql
            sudo ss -lntp | grep postgres
            ```
        - id: script
          desc: |
            To bind PostgreSQL to specific interfaces using a bash script:

            1. Set the addresses the server must serve.
            2. Replace an existing `listen_addresses` directive or append one when none is present.
            3. Restart PostgreSQL and report the resulting listeners.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            ADDRESSES="localhost,10.0.0.5"

            if grep -qE "^\s*listen_addresses" "$PGCONF"; then
              sed -i "s|^\s*listen_addresses.*|listen_addresses = '${ADDRESSES}'|" "$PGCONF"
            else
              printf "listen_addresses = '%s'\n" "$ADDRESSES" >>"$PGCONF"
            fi

            systemctl restart postgresql
            ss -lntp | grep postgres
            ```
        - id: ansible
          desc: |
            To bind PostgreSQL to specific interfaces using Ansible:

            1. Set `listen_addresses` in `postgresql.conf` with `lineinfile`.
            2. Notify a handler that restarts the server, because this setting cannot be applied with a reload.

            ```yaml
            - name: Restrict PostgreSQL listen_addresses
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_listen_addresses: "localhost,10.0.0.5"
              tasks:
                - name: Set listen_addresses
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*listen_addresses'
                    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
                    state: present
                  notify: Restart postgresql
              handlers:
                - name: Restart postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: restarted
            ```

  - uid: mondoo-postgresql-security-tls-enabled
    title: Ensure TLS is enabled for client connections
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      postgresql.conf.sslEnabled == true
    docs:
      desc: |
        This check verifies that the server offers an encrypted channel to connecting clients.

        The `ssl` directive in `postgresql.conf` turns the TLS listener on. It needs a server certificate and private key the server account can read, and a reload applies the change once those files are in place. PostgreSQL ships with the directive off.

        **Why this matters**

        While it is off, every session runs in cleartext from the first packet. In a database the traffic is the data rather than a pointer to it, so anyone on the network path reads the statement text and the result rows: personal records, payment details, session tokens. A span port on a switch, a compromised hypervisor, or a cloud traffic mirror yields the contents of the tables without the attacker ever authenticating to the server.

        The authentication exchange rides the same wire. An attacker who captures a session recovers whatever the configured method exposes, and where cleartext password authentication is permitted that is the password itself, reusable against this cluster and against every other system that shares the credential.

        Cleartext also means the attacker can write and not only read. Without integrity protection they can inject a statement into an established session or rewrite a result set on its way back to the application, so the application acts on data the database never returned.

        This directive is the prerequisite for the rest of the transport controls in this policy. Minimum protocol version, cipher selection, and client certificate verification have no effect while it remains off. Because `ALTER SYSTEM` writes to `postgresql.auto.conf` and that file is applied last, clear any override there so the value in the main file is the one the server uses.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW ssl;"
        ```

        2. Confirm whether individual sessions actually negotiate TLS:

        ```bash
        sudo -u postgres psql -c "SELECT datname, usename, ssl, version FROM pg_stat_ssl JOIN pg_stat_activity USING (pid);"
        ```

        A passing result reports `on` for `SHOW ssl` and shows `t` in the `ssl` column for remote sessions. A failing result reports `off`.
      remediation:
        - id: cli
          desc: |
            To enable TLS using the CLI:

            1. Install a server certificate and private key that PostgreSQL can read.
            2. Set `ssl`, `ssl_cert_file`, and `ssl_key_file` in `postgresql.conf`.
            3. Reload PostgreSQL and confirm the setting took effect.

            ```bash
            sudo install -o postgres -g postgres -m 0600 server.key /etc/ssl/private/postgresql.key
            sudo install -o postgres -g postgres -m 0644 server.crt /etc/ssl/certs/postgresql.crt
            sudo -u postgres tee -a /etc/postgresql/16/main/postgresql.conf >/dev/null <<'EOF'
            ssl = on
            ssl_cert_file = '/etc/ssl/certs/postgresql.crt'
            ssl_key_file = '/etc/ssl/private/postgresql.key'
            EOF
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW ssl;"
            ```
        - id: script
          desc: |
            To enable TLS using a bash script:

            1. Verify the certificate and key are present and readable by the server account.
            2. Set the three TLS directives, replacing any existing values.
            3. Reload PostgreSQL and report the effective setting.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            CERT="/etc/ssl/certs/postgresql.crt"
            KEY="/etc/ssl/private/postgresql.key"

            for f in "$CERT" "$KEY"; do
              if [ ! -s "$f" ]; then
                echo "missing TLS material: $f" >&2
                exit 1
              fi
            done

            chown postgres:postgres "$KEY"
            chmod 0600 "$KEY"

            set_directive() {
              local key="$1" value="$2"
              if grep -qE "^\s*#?\s*${key}\b" "$PGCONF"; then
                sed -i "s|^\s*#\?\s*${key}\b.*|${key} = ${value}|" "$PGCONF"
              else
                printf "%s = %s\n" "$key" "$value" >>"$PGCONF"
              fi
            }

            set_directive ssl "on"
            set_directive ssl_cert_file "'${CERT}'"
            set_directive ssl_key_file "'${KEY}'"

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW ssl;'"
            ```
        - id: ansible
          desc: |
            To enable TLS using Ansible:

            1. Place the certificate and key with ownership and permissions the server accepts.
            2. Set the TLS directives in `postgresql.conf`.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Enable TLS for PostgreSQL
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_cert: /etc/ssl/certs/postgresql.crt
                postgresql_key: /etc/ssl/private/postgresql.key
              tasks:
                - name: Protect the private key
                  ansible.builtin.file:
                    path: "{{ postgresql_key }}"
                    owner: postgres
                    group: postgres
                    mode: "0600"

                - name: Enable TLS directives
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: "^\\s*#?\\s*{{ item.key }}\\b"
                    line: "{{ item.key }} = {{ item.value }}"
                    state: present
                  loop:
                    - { key: "ssl", value: "on" }
                    - { key: "ssl_cert_file", value: "'{{ postgresql_cert }}'" }
                    - { key: "ssl_key_file", value: "'{{ postgresql_key }}'" }
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-tls-min-protocol-version
    title: Ensure ssl_min_protocol_version is set to TLSv1.2 or higher
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      postgresql.conf.sslMinProtocolVersion == /^TLSv1\.[23]$/
    docs:
      desc: |
        This check verifies that the server refuses to negotiate an obsolete TLS version.

        `ssl_min_protocol_version` in `postgresql.conf` sets the floor for the handshake. The check passes on `TLSv1.2` and `TLSv1.3` and fails on the older values or on an unset directive. A reload applies the new floor to connections established afterwards.

        **Why this matters**

        TLS 1.0 and TLS 1.1 build their handshake on MD5 and SHA-1 and their record layer on CBC modes without authenticated encryption. Those constructions are broken in practice, not merely deprecated, and the published attacks against them target exactly the part of the session an attacker wants: the early records, where the authentication exchange sits.

        An attacker in the network path does not need to break the server to use them. They interfere with the handshake so the client retries with a lower version, and if the server still accepts TLS 1.0 the session proceeds on a protocol whose padding and record structure leak plaintext block by block. The credential exchanged at the start of the session is recovered from that leak, and the attacker then connects as the role with a normal client.

        Recent PostgreSQL releases default to `TLSv1.2`, but the directive is often carried forward at a lower value in a configuration file copied from an older host, and a version upgrade does not correct an explicit setting.

        Pin the floor explicitly so it cannot drift downward with the file. Raise it to `TLSv1.3` where every client library supports it, and confirm the client fleet before doing so, because a client that cannot reach the floor is refused rather than downgraded.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW ssl_min_protocol_version;"
        ```

        2. Confirm which protocol versions active sessions negotiated:

        ```bash
        sudo -u postgres psql -c "SELECT DISTINCT version FROM pg_stat_ssl WHERE ssl;"
        ```

        A passing result reports `TLSv1.2` or `TLSv1.3`. A failing result reports `TLSv1`, `TLSv1.1`, or an empty value.
      remediation:
        - id: cli
          desc: |
            To pin the minimum TLS version using the CLI:

            1. Set `ssl_min_protocol_version` in `postgresql.conf`.
            2. Reload PostgreSQL so the new floor applies to subsequent connections.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*ssl_min_protocol_version.*/ssl_min_protocol_version = 'TLSv1.2'/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW ssl_min_protocol_version;"
            ```
        - id: script
          desc: |
            To pin the minimum TLS version using a bash script:

            1. Choose the lowest protocol version your client fleet supports.
            2. Replace an existing directive or append one when none is present.
            3. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            MIN_VERSION="TLSv1.2"

            if grep -qE "^\s*#?\s*ssl_min_protocol_version" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*ssl_min_protocol_version.*|ssl_min_protocol_version = '${MIN_VERSION}'|" "$PGCONF"
            else
              printf "ssl_min_protocol_version = '%s'\n" "$MIN_VERSION" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW ssl_min_protocol_version;'"
            ```
        - id: ansible
          desc: |
            To pin the minimum TLS version using Ansible:

            1. Set `ssl_min_protocol_version` in `postgresql.conf` with `lineinfile`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Pin the PostgreSQL minimum TLS version
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_min_tls: TLSv1.2
              tasks:
                - name: Set ssl_min_protocol_version
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*ssl_min_protocol_version'
                    line: "ssl_min_protocol_version = '{{ postgresql_min_tls }}'"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-tls-strong-ciphers
    title: Ensure ssl_ciphers restricts negotiation to strong cipher suites
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      postgresql.conf.sslCiphers != empty
      postgresql.conf.sslCiphers == /HIGH/
      postgresql.conf.sslCiphers == /!aNULL/
    docs:
      desc: |
        This check verifies that the server offers only cipher suites that authenticate it and provide adequate key strength.

        `ssl_ciphers` in `postgresql.conf` is handed straight to the TLS library. The check requires the value to be set, to be built on the `HIGH` grouping, and to exclude the unauthenticated `aNULL` suites explicitly. A reload applies the list to subsequent handshakes.

        **Why this matters**

        The `aNULL` suites perform key exchange with no server certificate at all. When one is negotiated the client encrypts the session to whoever answered the socket, which is exactly what an attacker sitting between the application and the database wants. They terminate the connection on their own host, present a session the client accepts as encrypted, read the credential and every statement and result, and forward the traffic on so nothing looks broken.

        A permissive value such as `ALL` re-admits those suites along with the export-grade and single-DES suites the library still carries for compatibility. Those keys are recoverable with rented compute, so an attacker who records the traffic decrypts it afterwards even without an active position on the path.

        The `HIGH` grouping keeps negotiation to suites with acceptable key lengths, and naming the exclusions after it means a library update that adds a weak suite to a broader group does not silently widen what this server accepts.

        Extend the list with the other exclusions your platform needs rather than replacing it with a permissive one, and expand the value with your TLS tooling after a change to confirm no suite without server authentication survives.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW ssl_ciphers;"
        ```

        2. Expand the value to see exactly which suites it admits:

        ```bash
        openssl ciphers -v "$(sudo -u postgres psql -tAc 'SHOW ssl_ciphers;')"
        ```

        A passing result is built on `HIGH` and contains `!aNULL`, and the expansion lists no suite whose authentication column reads `Au=None`. A failing result uses `ALL`, omits `!aNULL`, or is unset.
      remediation:
        - id: cli
          desc: |
            To restrict cipher negotiation using the CLI:

            1. Set `ssl_ciphers` in `postgresql.conf` to a hardened list.
            2. Reload PostgreSQL so subsequent handshakes use the new list.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*ssl_ciphers.*/ssl_ciphers = 'HIGH:!aNULL:!eNULL:!MD5:!3DES:!RC4'/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW ssl_ciphers;"
            ```
        - id: script
          desc: |
            To restrict cipher negotiation using a bash script:

            1. Define the hardened cipher list.
            2. Replace an existing directive or append one when none is present.
            3. Reload PostgreSQL and expand the list to confirm no unauthenticated suites remain.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            CIPHERS="HIGH:!aNULL:!eNULL:!MD5:!3DES:!RC4"

            if grep -qE "^\s*#?\s*ssl_ciphers" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*ssl_ciphers.*|ssl_ciphers = '${CIPHERS}'|" "$PGCONF"
            else
              printf "ssl_ciphers = '%s'\n" "$CIPHERS" >>"$PGCONF"
            fi

            systemctl reload postgresql
            openssl ciphers -v "$CIPHERS" | awk '$0 ~ /Au=None/ { print "unauthenticated suite admitted: " $1; rc=1 } END { exit rc+0 }'
            ```
        - id: ansible
          desc: |
            To restrict cipher negotiation using Ansible:

            1. Set `ssl_ciphers` in `postgresql.conf` with `lineinfile`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Harden PostgreSQL cipher selection
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_ciphers: "HIGH:!aNULL:!eNULL:!MD5:!3DES:!RC4"
              tasks:
                - name: Set ssl_ciphers
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*ssl_ciphers'
                    line: "ssl_ciphers = '{{ postgresql_ciphers }}'"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-tls-prefer-server-ciphers
    title: Ensure ssl_prefer_server_ciphers is not disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      postgresql.conf.params["ssl_prefer_server_ciphers"] == empty || postgresql.conf.params["ssl_prefer_server_ciphers"].downcase == "on"
    docs:
      desc: |
        This check verifies that the server's cipher ordering, not the client's, decides which suite a session uses.

        `ssl_prefer_server_ciphers` in `postgresql.conf` controls whose preference wins during the handshake. PostgreSQL enables it by default, so the check treats an absent directive as compliant and fails only when the setting has been turned off explicitly. A reload restores it.

        **Why this matters**

        When the client's preference wins, the client chooses from the intersection of the two lists, and a client is free to prefer the weakest suite in that set. Any of them is acceptable to the library on the far side, so a hostile or badly configured client steers every one of its sessions onto the oldest construction the server still admits, and the ordering an administrator expressed in `ssl_ciphers` never takes effect.

        That is a downgrade an attacker can arrange without touching the server. Malware on an application host, or a driver configured from a copied snippet, connects with a cipher list that names one legacy suite first; the server agrees, and the traffic for that session is protected by whatever the attacker picked rather than by what the operator chose. The credential and the result rows are exposed to the same offline analysis that suite was retired for.

        Leaving the server in charge also makes the posture uniform. Every client converges on the same preferred suite regardless of the defaults its own library ships with, so a single review of the server list describes what is actually negotiated across the fleet.

        Turning this off is only defensible when a specific client needs a suite the server would otherwise deprioritize, and even then narrowing the server list is the better fix.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW ssl_prefer_server_ciphers;"
        ```

        2. Confirm the directive is not disabled in the configuration file:

        ```bash
        sudo -u postgres grep -rE "^\s*ssl_prefer_server_ciphers" /etc/postgresql/16/main/
        ```

        A passing result reports `on`, or shows no explicit setting at all. A failing result reports `off`.
      remediation:
        - id: cli
          desc: |
            To restore server cipher preference using the CLI:

            1. Set `ssl_prefer_server_ciphers` to `on` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*ssl_prefer_server_ciphers.*/ssl_prefer_server_ciphers = on/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW ssl_prefer_server_ciphers;"
            ```
        - id: script
          desc: |
            To restore server cipher preference using a bash script:

            1. Replace an explicit `off` with `on`, or append the directive when none is present.
            2. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            if grep -qE "^\s*#?\s*ssl_prefer_server_ciphers" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*ssl_prefer_server_ciphers.*|ssl_prefer_server_ciphers = on|" "$PGCONF"
            else
              printf "ssl_prefer_server_ciphers = on\n" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW ssl_prefer_server_ciphers;'"
            ```
        - id: ansible
          desc: |
            To restore server cipher preference using Ansible:

            1. Set `ssl_prefer_server_ciphers` to `on` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Prefer PostgreSQL server cipher ordering
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Set ssl_prefer_server_ciphers
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*ssl_prefer_server_ciphers'
                    line: "ssl_prefer_server_ciphers = on"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-tls-client-ca-configured
    title: Ensure ssl_ca_file is set when client certificate authentication is used
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      postgresql.hba.rules.none(authMethod.downcase == "cert") || postgresql.conf.sslCaFile != empty
    docs:
      desc: |
        This check verifies that a certificate authority bundle is configured whenever clients are authenticated by certificate.

        `ssl_ca_file` in `postgresql.conf` names the trust anchor the server validates presented client certificates against. The check looks at `pg_hba.conf` first: if no rule uses the `cert` method, it passes, because a password-authenticated deployment has no use for the bundle. If a `cert` rule exists, the bundle must be set. A reload applies the new path.

        **Why this matters**

        Certificate authentication without a trust anchor is a rule that cannot do its job. The server has nothing to build a chain to, so the rule that appears on paper to be the strongest authentication in the file is the weakest thing in it, and nobody reviewing the configuration notices, because the method name reads correctly.

        The consequence is that an attacker who can reach a matching address does not need a credential the operator issued. They generate their own key pair, sign a certificate naming the role they want, and present it. The rule matches, the identity is unverified, and they hold a session as that role with whatever privileges it carries.

        The bundle is also where revocation lives. When a client key is lost, the authority is what lets you stop accepting the certificates it signed; without one there is nothing to revoke against and no way to cut off the holder.

        Point the directive at the issuing authority for your client certificates only, not at the system-wide root store, or every certificate any public authority ever issued becomes acceptable to the server.
      audit: |
        ### Audit via CLI

        1. Determine whether any authentication rule uses the `cert` method:

        ```bash
        sudo -u postgres psql -c "SELECT type, database, user_name, address, auth_method FROM pg_hba_file_rules WHERE auth_method = 'cert';"
        ```

        2. Read the configured authority bundle:

        ```bash
        sudo -u postgres psql -c "SHOW ssl_ca_file;"
        ```

        3. Inspect the bundle contents when one is configured:

        ```bash
        sudo openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca.crt | openssl pkcs7 -print_certs -noout
        ```

        A passing result either reports no `cert` rules, or reports a populated `ssl_ca_file` whose contents list the expected issuing authority. A failing result shows `cert` rules alongside an empty `ssl_ca_file`.
      remediation:
        - id: cli
          desc: |
            To configure a client certificate authority using the CLI:

            1. Install the issuing authority bundle where the server account can read it.
            2. Set `ssl_ca_file` in `postgresql.conf`.
            3. Reload PostgreSQL and confirm the effective value.

            ```bash
            sudo install -o postgres -g postgres -m 0644 ca.crt /etc/ssl/certs/postgresql-ca.crt
            sudo -u postgres sed -i "s|^#*\s*ssl_ca_file.*|ssl_ca_file = '/etc/ssl/certs/postgresql-ca.crt'|" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW ssl_ca_file;"
            ```
        - id: script
          desc: |
            To configure a client certificate authority using a bash script:

            1. Verify the authority bundle is present and parseable.
            2. Set `ssl_ca_file`, replacing any existing value.
            3. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            CA_FILE="/etc/ssl/certs/postgresql-ca.crt"

            if ! openssl crl2pkcs7 -nocrl -certfile "$CA_FILE" >/dev/null 2>&1; then
              echo "authority bundle missing or unparseable: $CA_FILE" >&2
              exit 1
            fi

            chown postgres:postgres "$CA_FILE"
            chmod 0644 "$CA_FILE"

            if grep -qE "^\s*#?\s*ssl_ca_file" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*ssl_ca_file.*|ssl_ca_file = '${CA_FILE}'|" "$PGCONF"
            else
              printf "ssl_ca_file = '%s'\n" "$CA_FILE" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW ssl_ca_file;'"
            ```
        - id: ansible
          desc: |
            To configure a client certificate authority using Ansible:

            1. Place the authority bundle with ownership the server can read.
            2. Set `ssl_ca_file` in `postgresql.conf`.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Configure the PostgreSQL client certificate authority
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_ca_file: /etc/ssl/certs/postgresql-ca.crt
              tasks:
                - name: Install the authority bundle
                  ansible.builtin.copy:
                    src: ca.crt
                    dest: "{{ postgresql_ca_file }}"
                    owner: postgres
                    group: postgres
                    mode: "0644"

                - name: Set ssl_ca_file
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*ssl_ca_file'
                    line: "ssl_ca_file = '{{ postgresql_ca_file }}'"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-password-encryption-scram
    title: Ensure password_encryption is set to scram-sha-256
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      postgresql.conf.passwordEncryption.downcase == "scram-sha-256"
    docs:
      desc: |
        This check verifies that new and changed passwords are stored as salted challenge-response verifiers rather than as legacy hashes.

        `password_encryption` in `postgresql.conf` decides the format used when a password is set. The check requires `scram-sha-256`. A reload applies it, but only to passwords set afterwards; verifiers already stored are not converted.

        **Why this matters**

        The legacy `md5` scheme salts the hash with the role name alone, so the value stored in `pg_authid` is not a hint about the password, it is a password equivalent. An attacker who reads that catalog, through a backup file, a replica they attached to, a `SELECT` as a role with the right attributes, or a stolen data directory, can authenticate as that role without ever recovering the password. The stored value goes straight into the protocol exchange.

        Salting by role name also means the salt is predictable and shared. A table built once for the role name `postgres` applies to every PostgreSQL cluster in the world, so the attacker who dumps a catalog does not even need to crack anything unique.

        A challenge-response verifier removes both properties. It cannot be replayed at the protocol level, its salt is random per password, and it is produced with iterated hashing, so bulk offline guessing against a catalog dump costs far more than it returns.

        Set the directive first, then reset each role's password so its verifier is rewritten, and check the catalog afterwards for roles whose stored value is still in the old format. Those roles keep working, and keep the exposure, until their passwords are set again.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW password_encryption;"
        ```

        2. Identify roles whose stored verifier is still the legacy format:

        ```bash
        sudo -u postgres psql -c "SELECT rolname FROM pg_authid WHERE rolpassword LIKE 'md5%';"
        ```

        A passing result reports `scram-sha-256` and returns no rows for the second query. A failing result reports `md5`, or reports `scram-sha-256` while roles still carry `md5` verifiers that need a password reset.
      remediation:
        - id: cli
          desc: |
            To require SCRAM password storage using the CLI:

            1. Set `password_encryption` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Reset each affected role's password so its verifier is rewritten in the new format.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*password_encryption.*/password_encryption = scram-sha-256/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "\password app_user"
            sudo -u postgres psql -c "SELECT rolname FROM pg_authid WHERE rolpassword LIKE 'md5%';"
            ```
        - id: script
          desc: |
            To require SCRAM password storage using a bash script:

            1. Set the directive, replacing any existing value.
            2. Reload PostgreSQL.
            3. Report every role that still holds a legacy verifier so its password can be rotated.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            if grep -qE "^\s*#?\s*password_encryption" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*password_encryption.*|password_encryption = scram-sha-256|" "$PGCONF"
            else
              printf "password_encryption = scram-sha-256\n" >>"$PGCONF"
            fi

            systemctl reload postgresql

            echo "roles still holding a legacy md5 verifier:"
            su -s /bin/sh postgres -c \
              "psql -tAc \"SELECT rolname FROM pg_authid WHERE rolpassword LIKE 'md5%';\""
            ```
        - id: ansible
          desc: |
            To require SCRAM password storage using Ansible:

            1. Set `password_encryption` in `postgresql.conf`.
            2. Notify a handler that reloads the server.
            3. Report roles that still carry a legacy verifier so passwords can be rotated.

            ```yaml
            - name: Require SCRAM password storage in PostgreSQL
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Set password_encryption
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*password_encryption'
                    line: "password_encryption = scram-sha-256"
                    state: present
                  notify: Reload postgresql

                - name: Flush handlers so the new setting applies
                  ansible.builtin.meta: flush_handlers

                - name: Find roles still holding a legacy verifier
                  become: true
                  become_user: postgres
                  ansible.builtin.command:
                    cmd: psql -tAc "SELECT rolname FROM pg_authid WHERE rolpassword LIKE 'md5%';"
                  changed_when: false
                  register: legacy_roles

                - name: Report roles needing a password reset
                  ansible.builtin.debug:
                    msg: "Reset the password for: {{ legacy_roles.stdout_lines }}"
                  when: legacy_roles.stdout_lines | length > 0
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-hba-no-trust-auth
    title: Ensure no pg_hba.conf rule uses the trust authentication method
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      postgresql.hba.rules != empty
      postgresql.hba.rules.none(authMethod.downcase == "trust")
    docs:
      desc: |
        This check verifies that no host-based authentication rule accepts a connection without asking for a credential.

        Each line in `pg_hba.conf` names a connection type, a database, a role, a client address, and a method. This check requires that rules were parsed at all, so an unreadable or missing file is reported instead of passing quietly, and that none of them uses the `trust` method.

        **Why this matters**

        A `trust` rule grants whatever role the client asks for, with no password, no certificate, and no operating system identity check. Anyone who matches the rule's address becomes that role on request. When the rule matches `postgres`, they own the cluster: they read and alter every table, create roles for later, and read files on the host through server-side functions available to a superuser.

        The path in is short. An attacker with any route to the port, a compromised container on the same network, an application server they already hold, or an exposed address, connects and is inside. There is no failed login to alert on, because nothing failed.

        Local rules are not safer. A `trust` rule scoped to the Unix socket hands the database to every account on the host, so a foothold in an unrelated service running there escalates into the database without another credential.

        Installation scripts and container entrypoints write a `trust` rule so the first connection can create roles before a password exists, and that bootstrap line survives into production far more often than it is removed. Replace it with a challenge-response method for network rules and with operating system identity for local socket rules, then reload.
      audit: |
        ### Audit via CLI

        1. List every rule the server parsed, together with any parse errors:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address, auth_method, error FROM pg_hba_file_rules ORDER BY line_number;"
        ```

        2. Isolate the rules that require no credential:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address FROM pg_hba_file_rules WHERE auth_method = 'trust';"
        ```

        A passing result returns no rows for the second query. A failing result lists one or more rules, and the reported `line_number` identifies the line to change.
      remediation:
        - id: cli
          desc: |
            To remove trust authentication using the CLI:

            1. Set a password for every role that will authenticate with one.
            2. Replace each `trust` method with `scram-sha-256` for network rules, or `peer` for local socket rules.
            3. Reload PostgreSQL and confirm no `trust` rules remain.

            ```bash
            sudo -u postgres psql -c "\password postgres"
            sudo sed -i -E "s/^(local\s+\S+\s+\S+\s+)trust\s*$/\1peer/" /etc/postgresql/16/main/pg_hba.conf
            sudo sed -i -E "s/^(host\S*\s+\S+\s+\S+\s+\S+\s+)trust\s*$/\1scram-sha-256/" /etc/postgresql/16/main/pg_hba.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT count(*) FROM pg_hba_file_rules WHERE auth_method = 'trust';"
            ```
        - id: script
          desc: |
            To remove trust authentication using a bash script:

            1. Back up `pg_hba.conf` before rewriting it.
            2. Convert local `trust` rules to `peer` and network `trust` rules to `scram-sha-256`.
            3. Reload PostgreSQL and fail loudly if any `trust` rule survives.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA="/etc/postgresql/16/main/pg_hba.conf"

            cp -a "$HBA" "${HBA}.bak"

            sed -i -E "s/^(local[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+)trust[[:space:]]*$/\1peer/" "$HBA"
            sed -i -E "s/^(host\S*[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+)trust[[:space:]]*$/\1scram-sha-256/" "$HBA"

            if grep -qE "^[^#]*[[:space:]]trust([[:space:]]|$)" "$HBA"; then
              echo "trust rules remain in $HBA; review them manually" >&2
              exit 1
            fi

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To remove trust authentication using Ansible:

            1. Back up `pg_hba.conf`.
            2. Rewrite local and network `trust` rules with credential-based methods.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Remove trust authentication from PostgreSQL
              hosts: postgresql
              become: true
              vars:
                postgresql_hba: /etc/postgresql/16/main/pg_hba.conf
              tasks:
                - name: Back up pg_hba.conf
                  ansible.builtin.copy:
                    src: "{{ postgresql_hba }}"
                    dest: "{{ postgresql_hba }}.bak"
                    remote_src: true
                    mode: "0640"

                - name: Convert local trust rules to peer
                  ansible.builtin.replace:
                    path: "{{ postgresql_hba }}"
                    regexp: '^(local\s+\S+\s+\S+\s+)trust\s*$'
                    replace: '\1peer'
                  notify: Reload postgresql

                - name: Convert network trust rules to scram-sha-256
                  ansible.builtin.replace:
                    path: "{{ postgresql_hba }}"
                    regexp: '^(host\S*\s+\S+\s+\S+\s+\S+\s+)trust\s*$'
                    replace: '\1scram-sha-256'
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-hba-no-plaintext-password-auth
    title: Ensure no pg_hba.conf rule uses the password authentication method
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      postgresql.hba.rules != empty
      postgresql.hba.rules.none(authMethod.downcase == "password")
    docs:
      desc: |
        This check verifies that no host-based authentication rule accepts a password sent in the clear.

        The `password` method in `pg_hba.conf` has the client transmit the password itself to the server. The similarly named challenge-response method exchanges proofs instead, so the password never crosses the connection. The check requires that rules were parsed and that none of them selects the cleartext method.

        **Why this matters**

        A single captured packet is the whole credential. An attacker on the path, on a mirrored switch port, in a compromised load balancer, or on a router between two data centers, reads the password as it is sent and then connects as that role from anywhere the rules allow. Nothing about the intrusion looks anomalous afterwards, because they authenticate the way the application does.

        The damage rarely stops at the database. Database passwords are reused in deployment scripts, in other environments of the same service, and sometimes by the human who chose them, so the captured value gets tried elsewhere immediately.

        Having TLS enabled is not a defense here. A rule that permits the cleartext method is still matched by a client that connects through a `host` rule without requesting encryption, and clients do that by accident whenever a connection string omits the setting. Removing the method closes the path outright rather than depending on every client to ask for protection.

        Confirm that stored verifiers are already in the `scram-sha-256` format before changing the rules, then rewrite the method and reload. A role whose verifier is still in the legacy format cannot complete the stronger exchange and will be locked out until its password is set again.
      audit: |
        ### Audit via CLI

        1. Isolate rules that accept a cleartext password:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address FROM pg_hba_file_rules WHERE auth_method = 'password';"
        ```

        2. Confirm which method active sessions actually used:

        ```bash
        sudo -u postgres psql -c "SELECT usename, ssl, client_addr FROM pg_stat_ssl JOIN pg_stat_activity USING (pid);"
        ```

        A passing result returns no rows for the first query. A failing result lists rules whose `auth_method` is `password`.
      remediation:
        - id: cli
          desc: |
            To replace cleartext password authentication using the CLI:

            1. Confirm `password_encryption` is `scram-sha-256` so verifiers exist in the right format.
            2. Replace the `password` method with `scram-sha-256` in `pg_hba.conf`.
            3. Reload PostgreSQL and confirm no such rules remain.

            ```bash
            sudo -u postgres psql -c "SHOW password_encryption;"
            sudo sed -i -E "s/^([^#].*[[:space:]])password([[:space:]]*)$/\1scram-sha-256\2/" \
              /etc/postgresql/16/main/pg_hba.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT count(*) FROM pg_hba_file_rules WHERE auth_method = 'password';"
            ```
        - id: script
          desc: |
            To replace cleartext password authentication using a bash script:

            1. Back up `pg_hba.conf`.
            2. Rewrite the `password` method as `scram-sha-256`.
            3. Reload PostgreSQL and verify the rewrite removed every occurrence.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA="/etc/postgresql/16/main/pg_hba.conf"

            cp -a "$HBA" "${HBA}.bak"
            sed -i -E "s/^([^#].*[[:space:]])password([[:space:]]*)$/\1scram-sha-256\2/" "$HBA"

            if grep -qE "^[^#]*[[:space:]]password([[:space:]]|$)" "$HBA"; then
              echo "cleartext password rules remain in $HBA; review them manually" >&2
              exit 1
            fi

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To replace cleartext password authentication using Ansible:

            1. Rewrite the `password` method as `scram-sha-256`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Replace cleartext password authentication in PostgreSQL
              hosts: postgresql
              become: true
              vars:
                postgresql_hba: /etc/postgresql/16/main/pg_hba.conf
              tasks:
                - name: Convert password rules to scram-sha-256
                  ansible.builtin.replace:
                    path: "{{ postgresql_hba }}"
                    regexp: '^([^#].*\s)password(\s*)$'
                    replace: '\1scram-sha-256\2'
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-hba-no-md5-auth
    title: Ensure no pg_hba.conf rule uses the md5 authentication method
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      postgresql.hba.rules != empty
      postgresql.hba.rules.none(authMethod.downcase == "md5")
    docs:
      desc: |
        This check verifies that no host-based authentication rule still selects the legacy password exchange.

        The `md5` method in `pg_hba.conf` authenticates against a verifier salted with the role name alone. The check requires that rules were parsed and that none of them names this method, so authentication happens through `scram-sha-256` instead.

        **Why this matters**

        The value stored in `pg_authid` under the old scheme is replayable. It is not a hint about the password, it is what the protocol exchange consumes, so an attacker who reads the catalog through a stolen backup, a data directory copy, or a query run as a privileged role authenticates as that role immediately, without cracking anything.

        Because the salt is the role name, the work is also reusable. Precomputed tables built once for a common name such as `postgres` apply to every cluster that uses it, so a dump from one environment shortens the attack on another.

        A rule left at the old method looks harmless on a cluster that has already migrated its passwords, since that method also accepts the newer verifiers. It is still the weaker exchange whenever a role's stored value remains in the legacy format, and it keeps that path open indefinitely.

        Sequence the change carefully. Set the storage format, reset the password of every role whose verifier is still legacy, and only then rewrite the rules and reload. A role that has not been reset cannot complete the stronger exchange, so changing the rules first locks it out. A companion check in this policy covers the storage format itself.
      audit: |
        ### Audit via CLI

        1. Isolate rules still set to the legacy method:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address FROM pg_hba_file_rules WHERE auth_method = 'md5';"
        ```

        2. Confirm no role still holds a legacy verifier, which would break after the rule change:

        ```bash
        sudo -u postgres psql -c "SELECT rolname FROM pg_authid WHERE rolpassword LIKE 'md5%';"
        ```

        A passing result returns no rows for the first query. A failing result lists rules whose `auth_method` is `md5`.
      remediation:
        - id: cli
          desc: |
            To move authentication rules to SCRAM using the CLI:

            1. Set `password_encryption` to `scram-sha-256` and reload, so that every password set from now on is stored in the new format.
            2. Reset any role that still holds a legacy verifier, because a `scram-sha-256` rule cannot authenticate one.
            3. Replace the `md5` method with `scram-sha-256` in `pg_hba.conf`.
            4. Reload PostgreSQL and confirm no `md5` rules remain.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*password_encryption.*/password_encryption = scram-sha-256/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT rolname FROM pg_authid WHERE rolpassword LIKE 'md5%';"
            sudo -u postgres psql -c "\password app_user"
            sudo sed -i -E "s/^([^#].*[[:space:]])md5([[:space:]]*)$/\1scram-sha-256\2/" \
              /etc/postgresql/16/main/pg_hba.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT count(*) FROM pg_hba_file_rules WHERE auth_method = 'md5';"
            ```
        - id: script
          desc: |
            To move authentication rules to SCRAM using a bash script:

            1. Refuse to proceed while any role still holds a legacy verifier, because those roles would lose access.
            2. Rewrite the `md5` method as `scram-sha-256`.
            3. Reload PostgreSQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA="/etc/postgresql/16/main/pg_hba.conf"

            legacy=$(su -s /bin/sh postgres -c \
              "psql -tAc \"SELECT count(*) FROM pg_authid WHERE rolpassword LIKE 'md5%';\"")

            if [ "$legacy" -gt 0 ]; then
              echo "$legacy role(s) still hold an md5 verifier; reset their passwords first" >&2
              exit 1
            fi

            cp -a "$HBA" "${HBA}.bak"
            sed -i -E "s/^([^#].*[[:space:]])md5([[:space:]]*)$/\1scram-sha-256\2/" "$HBA"

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To move authentication rules to SCRAM using Ansible:

            1. Verify no role still holds a legacy verifier.
            2. Rewrite the `md5` method as `scram-sha-256`.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Move PostgreSQL authentication rules to SCRAM
              hosts: postgresql
              become: true
              vars:
                postgresql_hba: /etc/postgresql/16/main/pg_hba.conf
              tasks:
                - name: Count roles still holding a legacy verifier
                  become: true
                  become_user: postgres
                  ansible.builtin.command:
                    cmd: psql -tAc "SELECT count(*) FROM pg_authid WHERE rolpassword LIKE 'md5%';"
                  changed_when: false
                  register: legacy_count

                - name: Fail while legacy verifiers remain
                  ansible.builtin.fail:
                    msg: "Reset passwords for {{ legacy_count.stdout | trim }} role(s) before changing the rules."
                  when: legacy_count.stdout | trim | int > 0

                - name: Convert md5 rules to scram-sha-256
                  ansible.builtin.replace:
                    path: "{{ postgresql_hba }}"
                    regexp: '^([^#].*\s)md5(\s*)$'
                    replace: '\1scram-sha-256\2'
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-hba-no-unrestricted-client-addresses
    title: Ensure no pg_hba.conf rule accepts connections from any address
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      postgresql.hba.rules != empty
      postgresql.hba.rules.none(address == "0.0.0.0/0" || address == "::/0" || address.downcase == "all")
    docs:
      desc: |
        This check verifies that every host-based authentication rule names the networks it serves rather than matching every client address.

        The address column of a rule in `pg_hba.conf` is the first thing the server evaluates. The check requires that rules were parsed and that none of them uses `0.0.0.0/0`, `::/0`, or `all`, each of which matches any host that can route to the server.

        **Why this matters**

        A wildcard address turns the authentication method into the only barrier, and methods fail in ways addresses do not. A weak password, a credential committed to a repository, or a legacy method still permitted somewhere in the file is enough, and the attacker only needs to reach the port. With a scoped rule they never get to make the attempt: the connection is refused before any credential is offered, and the failure is recorded with their source address.

        That difference matters most during password guessing. Credential stuffing runs against every role name it can find; scoping the rule means those attempts come from addresses that match nothing, so they are rejected at the rule and never touch a verifier.

        Address scoping is also the control that survives a mistake elsewhere. Firewall rules, security groups, and load balancer listeners change on their own schedules, and a rule set that names the application subnets keeps an accidentally opened port from becoming an accessible database.

        Name the subnets that host the application tier, the replication peers, and the administrative jump hosts, one rule per network, and remember that the first matching rule wins, so a broad rule placed above a narrow one makes the narrow one unreachable.
      audit: |
        ### Audit via CLI

        1. List rules whose client address matches everything:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address, auth_method FROM pg_hba_file_rules WHERE address IN ('0.0.0.0/0', '::/0', 'all');"
        ```

        2. Review the full ordered rule set, because the first matching rule wins:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address, auth_method FROM pg_hba_file_rules ORDER BY line_number;"
        ```

        A passing result returns no rows for the first query. A failing result lists rules that accept every address.
      remediation:
        - id: cli
          desc: |
            To scope authentication rules to known networks using the CLI:

            1. Identify the subnets that legitimately connect to the database.
            2. Replace the wildcard address with those ranges, adding one rule per network.
            3. Reload PostgreSQL and confirm no wildcard rules remain.

            ```bash
            sudo sed -i -E "s#^(host\S*\s+\S+\s+\S+\s+)(0\.0\.0\.0/0|::/0|all)(\s+)#\110.0.0.0/24\3#" \
              /etc/postgresql/16/main/pg_hba.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT count(*) FROM pg_hba_file_rules WHERE address IN ('0.0.0.0/0', '::/0', 'all');"
            ```
        - id: script
          desc: |
            To scope authentication rules to known networks using a bash script:

            1. Define the allowed client networks.
            2. Replace wildcard addresses with the first allowed network and append rules for the remainder.
            3. Reload PostgreSQL and fail if any wildcard remains.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA="/etc/postgresql/16/main/pg_hba.conf"
            NETWORKS=("10.0.0.0/24" "10.0.1.0/24")

            cp -a "$HBA" "${HBA}.bak"

            sed -i -E "s#^(host\S*[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+)(0\.0\.0\.0/0|::/0|all)([[:space:]]+)#\1${NETWORKS[0]}\3#" "$HBA"

            for net in "${NETWORKS[@]:1}"; do
              printf "hostssl all all %s scram-sha-256\n" "$net" >>"$HBA"
            done

            if grep -qE "^host\S*[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+(0\.0\.0\.0/0|::/0|all)([[:space:]]|$)" "$HBA"; then
              echo "wildcard client addresses remain in $HBA; review them manually" >&2
              exit 1
            fi

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To scope authentication rules to known networks using Ansible:

            1. Remove rules that match every address.
            2. Add one rule per allowed network.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Scope PostgreSQL authentication rules to known networks
              hosts: postgresql
              become: true
              vars:
                postgresql_hba: /etc/postgresql/16/main/pg_hba.conf
                postgresql_client_networks:
                  - 10.0.0.0/24
                  - 10.0.1.0/24
              tasks:
                - name: Remove rules matching every address
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_hba }}"
                    regexp: '^host\S*\s+\S+\s+\S+\s+(0\.0\.0\.0/0|::/0|all)\s+'
                    state: absent
                  notify: Reload postgresql

                - name: Allow only the named client networks
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_hba }}"
                    line: "hostssl all all {{ item }} scram-sha-256"
                    state: present
                  loop: "{{ postgresql_client_networks }}"
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-hba-remote-connections-require-tls
    title: Ensure remote connections are only accepted through hostssl rules
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      postgresql.hba.rules != empty
      postgresql.hba.rules.where(address != "" && address.downcase != "samehost").none(type.downcase == "host" || type.downcase == "hostnossl")
    docs:
      desc: |
        This check verifies that every rule carrying a remote client address demands an encrypted connection.

        `pg_hba.conf` distinguishes three network connection types. A `hostssl` rule matches only encrypted sessions, a `hostnossl` rule matches only unencrypted ones, and a `host` rule matches either. The check requires that rules were parsed and that no rule with a remote address uses the permissive or the plaintext type. Rules for the local socket are outside its scope, since those never cross a network.

        **Why this matters**

        Turning the `ssl` directive on makes encryption available; it does not make it mandatory. A `host` rule admits a client that never asked for TLS, and clients omit it constantly: a connection string copied without the setting, a driver whose default changed between releases, a retry path that falls back on handshake failure. Every one of those sessions carries its credential and its result rows in the clear, and neither end reports a problem.

        An attacker uses that gap deliberately. Sitting on the path, they interfere with the TLS handshake until the client falls back to an unencrypted attempt, and because the rule accepts it the server completes the session. They then read the authentication exchange and the traffic, and reuse the credential from their own host.

        A `hostnossl` rule is worse, because it accepts only unencrypted sessions and so guarantees the exposure for anything that matches it.

        Verify that TLS is working before converting the rules, since an encrypted-only rule refuses every client the moment the certificate is missing or expired. Local socket rules continue to work unchanged and need no certificate.
      audit: |
        ### Audit via CLI

        1. List remote rules that do not require TLS:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address, auth_method FROM pg_hba_file_rules WHERE type IN ('host', 'hostnossl') AND address IS NOT NULL;"
        ```

        2. Confirm current sessions are encrypted:

        ```bash
        sudo -u postgres psql -c "SELECT client_addr, usename, ssl FROM pg_stat_ssl JOIN pg_stat_activity USING (pid) WHERE client_addr IS NOT NULL;"
        ```

        A passing result returns no rows for the first query, and every remote session in the second reports `t` in the `ssl` column. A failing result lists `host` or `hostnossl` rules that carry a client address.
      remediation:
        - id: cli
          desc: |
            To require TLS for remote connections using the CLI:

            1. Confirm TLS is enabled and working, because `hostssl` rules reject every client once TLS is unavailable.
            2. Change remote `host` and `hostnossl` rules to `hostssl`.
            3. Reload PostgreSQL and confirm no unencrypted remote rules remain.

            ```bash
            sudo -u postgres psql -c "SHOW ssl;"
            sudo sed -i -E "s/^host(nossl)?(\s+\S+\s+\S+\s+\S+\s+)/hostssl\2/" \
              /etc/postgresql/16/main/pg_hba.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT count(*) FROM pg_hba_file_rules WHERE type IN ('host', 'hostnossl') AND address IS NOT NULL;"
            ```
        - id: script
          desc: |
            To require TLS for remote connections using a bash script:

            1. Refuse to proceed while TLS is off, because converting the rules would lock out every remote client.
            2. Convert remote `host` and `hostnossl` rules to `hostssl`.
            3. Reload PostgreSQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA="/etc/postgresql/16/main/pg_hba.conf"

            ssl_state=$(su -s /bin/sh postgres -c "psql -tAc 'SHOW ssl;'")
            if [ "$ssl_state" != "on" ]; then
              echo "TLS is $ssl_state; enable ssl before requiring hostssl rules" >&2
              exit 1
            fi

            cp -a "$HBA" "${HBA}.bak"
            sed -i -E "s/^host(nossl)?([[:space:]]+\S+[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+)/hostssl\2/" "$HBA"

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To require TLS for remote connections using Ansible:

            1. Verify TLS is enabled before changing the rules.
            2. Convert remote rules to `hostssl`.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Require TLS for remote PostgreSQL connections
              hosts: postgresql
              become: true
              vars:
                postgresql_hba: /etc/postgresql/16/main/pg_hba.conf
              tasks:
                - name: Read the effective ssl setting
                  become: true
                  become_user: postgres
                  ansible.builtin.command:
                    cmd: psql -tAc "SHOW ssl;"
                  changed_when: false
                  register: ssl_state

                - name: Fail when TLS is not enabled
                  ansible.builtin.fail:
                    msg: "Enable the ssl directive before converting rules to hostssl."
                  when: ssl_state.stdout | trim != "on"

                - name: Convert remote rules to hostssl
                  ansible.builtin.replace:
                    path: "{{ postgresql_hba }}"
                    regexp: '^host(nossl)?(\s+\S+\s+\S+\s+\S+\s+)'
                    replace: 'hostssl\2'
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-hba-replication-restricted
    title: Ensure replication rules name specific roles and client addresses
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      postgresql.hba.rules.where(database.downcase == "replication").none(address == "0.0.0.0/0" || address == "::/0" || user.downcase == "all")
    docs:
      desc: |
        This check verifies that rules granting the special `replication` connection name a specific role and a specific client address.

        Replication rules live in the same file as ordinary client rules but are matched by their database column. The check fails when such a rule accepts any address or when its role column matches every role, and passes when the rule names one replication role and the addresses of the standby servers.

        **Why this matters**

        A replication connection streams the write-ahead log, and the log carries the contents of every table in the cluster. Object-level grants do not filter it, so a role that would be refused a `SELECT` on a table still receives every row of that table through the stream. One successful replication connection is a full copy of the database, taken continuously, from a code path that looks like normal operation.

        An attacker who matches a permissive replication rule needs only a credential that the rule's role column accepts. They attach a standby of their own from anywhere that routes to the port, let it catch up, and then read the tables at leisure on hardware the operator does not control. Nothing in the primary's ordinary query logs shows the tables being read, because they are not being queried.

        Standby addresses are known and stable, which is why there is no operational reason for a rule here to accept arbitrary clients.

        Create a role that holds only the replication attribute, use it for nothing else, and write one rule per standby naming its address. Where standbys are provisioned dynamically, scope the rule to the subnet they are created in rather than opening it to everything.
      audit: |
        ### Audit via CLI

        1. List the replication rules and how they are scoped:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, user_name, address, auth_method FROM pg_hba_file_rules WHERE 'replication' = ANY (database);"
        ```

        2. Review the roles that carry the replication attribute:

        ```bash
        sudo -u postgres psql -c "SELECT rolname FROM pg_roles WHERE rolreplication;"
        ```

        3. Review the standby connections that currently exist:

        ```bash
        sudo -u postgres psql -c "SELECT usename, client_addr, state FROM pg_stat_replication;"
        ```

        A passing result shows replication rules naming a specific role and a host-scoped address. A failing result shows a rule whose user is `all` or whose address is `0.0.0.0/0` or `::/0`.
      remediation:
        - id: cli
          desc: |
            To restrict replication access using the CLI:

            1. Create a dedicated role that holds only the `REPLICATION` attribute.
            2. Replace the permissive replication rule with one naming that role and the standby address.
            3. Reload PostgreSQL and confirm the rule set.

            ```bash
            sudo -u postgres psql -c "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'changeme';"
            sudo sed -i -E "/^host\S*\s+replication\s+/d" /etc/postgresql/16/main/pg_hba.conf
            echo "hostssl replication replicator 10.0.0.5/32 scram-sha-256 clientcert=verify-full" \
              | sudo tee -a /etc/postgresql/16/main/pg_hba.conf >/dev/null
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT line_number, user_name, address FROM pg_hba_file_rules WHERE 'replication' = ANY (database);"
            ```
        - id: script
          desc: |
            To restrict replication access using a bash script:

            1. Define the replication role and the standby addresses.
            2. Remove existing replication rules and write one rule per standby.
            3. Reload PostgreSQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA="/etc/postgresql/16/main/pg_hba.conf"
            ROLE="replicator"
            STANDBYS=("10.0.0.5/32" "10.0.0.6/32")

            cp -a "$HBA" "${HBA}.bak"
            sed -i -E "/^host\S*[[:space:]]+replication[[:space:]]+/d" "$HBA"

            for host in "${STANDBYS[@]}"; do
              printf "hostssl replication %s %s scram-sha-256 clientcert=verify-full\n" \
                "$ROLE" "$host" >>"$HBA"
            done

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To restrict replication access using Ansible:

            1. Remove permissive replication rules.
            2. Add one narrowly scoped rule per standby.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Restrict PostgreSQL replication access
              hosts: postgresql
              become: true
              vars:
                postgresql_hba: /etc/postgresql/16/main/pg_hba.conf
                postgresql_replication_role: replicator
                postgresql_standbys:
                  - 10.0.0.5/32
                  - 10.0.0.6/32
              tasks:
                - name: Remove existing replication rules
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_hba }}"
                    regexp: '^host\S*\s+replication\s+'
                    state: absent
                  notify: Reload postgresql

                - name: Allow only the named standbys
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_hba }}"
                    line: >-
                      hostssl replication {{ postgresql_replication_role }}
                      {{ item }} scram-sha-256 clientcert=verify-full
                    state: present
                  loop: "{{ postgresql_standbys }}"
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-hba-cert-auth-requires-verify-full
    title: Ensure cert authentication rules set clientcert to verify-full
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      postgresql.hba.rules.where(authMethod.downcase == "cert").all(options["clientcert"] == "verify-full")
    docs:
      desc: |
        This check verifies that certificate authentication ties each certificate to the specific role it may connect as.

        Rules in `pg_hba.conf` that use the `cert` method carry a `clientcert` option. This check requires `clientcert=verify-full` on every such rule. With `verify-ca` the server confirms only that the presented certificate chains to the configured authority; `verify-full` additionally requires the certificate's common name to match the role being requested.

        **Why this matters**

        Chain validation alone answers the wrong question. It establishes that the authority issued the certificate, not that the holder is the party the rule is about, so any certificate that authority has ever signed satisfies the rule regardless of the identity it names.

        Internal authorities sign a great deal. The same one typically issues certificates for web servers, service meshes, monitoring agents, and developer laptops. An attacker who takes any one of those keys, from a host far less protected than the database, presents it and asks to connect as the role of their choosing. The chain validates, the rule matches, and they hold a session as a privileged role without ever touching a database credential.

        Binding the common name closes that. A certificate issued for one service authenticates as that service only, so compromising a low-value host yields access to whatever that host already had and nothing more.

        Confirm before changing the rules that each client certificate's common name matches the role that client connects as, or configure an identity map to translate between them. A mismatch is rejected, so a rollout that skips this step disconnects working clients.
      audit: |
        ### Audit via CLI

        1. List certificate authentication rules and their options:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, database, user_name, address, options FROM pg_hba_file_rules WHERE auth_method = 'cert';"
        ```

        2. Confirm the authority bundle used to validate client certificates:

        ```bash
        sudo -u postgres psql -c "SHOW ssl_ca_file;"
        ```

        A passing result shows `clientcert=verify-full` in the `options` column of every `cert` rule. A failing result shows an empty `options` column or `clientcert=verify-ca`.
      remediation:
        - id: cli
          desc: |
            To require full client certificate verification using the CLI:

            1. Confirm each client certificate's common name matches the role it connects as.
            2. Add or change `clientcert=verify-full` on every `cert` rule.
            3. Reload PostgreSQL and confirm the options.

            ```bash
            sudo sed -i -E "s/^(host\S*\s+\S+\s+\S+\s+\S+\s+cert)(\s+clientcert=\S+)?\s*$/\1 clientcert=verify-full/" \
              /etc/postgresql/16/main/pg_hba.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT line_number, options FROM pg_hba_file_rules WHERE auth_method = 'cert';"
            ```
        - id: script
          desc: |
            To require full client certificate verification using a bash script:

            1. Back up `pg_hba.conf`.
            2. Normalize every `cert` rule so it ends with `clientcert=verify-full`.
            3. Reload PostgreSQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA="/etc/postgresql/16/main/pg_hba.conf"

            cp -a "$HBA" "${HBA}.bak"
            sed -i -E "s/^(host\S*[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+\S+[[:space:]]+cert)([[:space:]]+clientcert=\S+)?[[:space:]]*$/\1 clientcert=verify-full/" "$HBA"

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To require full client certificate verification using Ansible:

            1. Normalize every `cert` rule to set `clientcert=verify-full`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Require full client certificate verification in PostgreSQL
              hosts: postgresql
              become: true
              vars:
                postgresql_hba: /etc/postgresql/16/main/pg_hba.conf
              tasks:
                - name: Set clientcert=verify-full on cert rules
                  ansible.builtin.replace:
                    path: "{{ postgresql_hba }}"
                    regexp: '^(host\S*\s+\S+\s+\S+\s+\S+\s+cert)(\s+clientcert=\S+)?\s*$'
                    replace: '\1 clientcert=verify-full'
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-ident-no-superuser-mappings
    title: Ensure pg_ident.conf does not map external identities to superuser roles
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      postgresql.ident.mappings.none(pgUsername.downcase == "postgres")
    docs:
      desc: |
        This check verifies that no external identity is mapped directly onto the cluster superuser.

        `pg_ident.conf` translates an authenticated operating system account, Kerberos principal, or certificate common name into a PostgreSQL role, and it is consulted by the `ident`, `peer`, `gss`, and `cert` methods. The check fails when any mapping resolves to the `postgres` role.

        **Why this matters**

        Such a mapping makes control of the external identity equal to ownership of the cluster. Whoever holds that operating system account, that ticket, or that certificate connects as a superuser with no further credential, so the security of the database becomes the security of the weakest system that issues the identity.

        For a local account mapping, that system is the host itself. An attacker who reaches any code execution as the mapped user, through a vulnerable service running under it, a writable script it executes from cron, or a stolen key in its home directory, is a superuser in the database on the next connection. From there they read every table, install a function that runs commands as the server account, and add a role of their own so they keep access after the original hole is closed.

        Superuser sessions are also unattributable. Several administrators mapped onto the same role produce log lines that name that role, so an investigation cannot tell which person or which process acted.

        Map administrators onto named roles carrying only the privileges their work needs, and let escalation be a deliberate, logged step rather than the default state of every session.
      audit: |
        ### Audit via CLI

        1. Read the mappings as written on disk:

        ```bash
        sudo -u postgres grep -vE "^\s*(#|$)" /etc/postgresql/16/main/pg_ident.conf
        ```

        2. On PostgreSQL 15 and later, read the mappings the server parsed:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, map_name, sys_name, pg_username, error FROM pg_ident_file_mappings ORDER BY line_number;"
        ```

        3. Confirm which roles actually hold superuser authority:

        ```bash
        sudo -u postgres psql -c "SELECT rolname FROM pg_roles WHERE rolsuper;"
        ```

        A passing result shows no mapping whose PostgreSQL role is `postgres`. A failing result shows one or more mappings targeting the superuser.
      remediation:
        - id: cli
          desc: |
            To remove superuser identity mappings using the CLI:

            1. Create a named role for each administrator and grant only the privileges they need.
            2. Repoint the mapping at that role instead of `postgres`.
            3. Reload PostgreSQL and confirm the mappings.

            ```bash
            sudo -u postgres psql -c "CREATE ROLE dba_alice LOGIN;"
            sudo -u postgres psql -c "GRANT pg_read_all_data, pg_monitor TO dba_alice;"
            sudo sed -i -E "s/^(\S+\s+\S+\s+)postgres\s*$/\1dba_alice/" /etc/postgresql/16/main/pg_ident.conf
            sudo systemctl reload postgresql
            sudo -u postgres grep -vE "^\s*(#|$)" /etc/postgresql/16/main/pg_ident.conf
            ```
        - id: script
          desc: |
            To remove superuser identity mappings using a bash script:

            1. Back up `pg_ident.conf`.
            2. Report every mapping that targets the superuser so it can be repointed deliberately.
            3. Fail rather than guessing which role should replace it.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            IDENT="/etc/postgresql/16/main/pg_ident.conf"

            cp -a "$IDENT" "${IDENT}.bak"

            if grep -qE "^[^#]*[[:space:]]postgres[[:space:]]*$" "$IDENT"; then
              echo "mappings targeting the postgres superuser:" >&2
              grep -nE "^[^#]*[[:space:]]postgres[[:space:]]*$" "$IDENT" >&2
              echo "repoint each mapping at a named role, then reload postgresql" >&2
              exit 1
            fi

            echo "no superuser mappings present in $IDENT"
            ```
        - id: ansible
          desc: |
            To remove superuser identity mappings using Ansible:

            1. Create the named administrative role.
            2. Repoint mappings that target `postgres` at that role.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Remove PostgreSQL superuser identity mappings
              hosts: postgresql
              become: true
              vars:
                postgresql_ident: /etc/postgresql/16/main/pg_ident.conf
                postgresql_admin_role: dba_alice
              tasks:
                - name: Create the named administrative role
                  become: true
                  become_user: postgres
                  ansible.builtin.command:
                    cmd: >-
                      psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ postgresql_admin_role }}'"
                  changed_when: false
                  register: role_exists

                - name: Add the role when it is missing
                  become: true
                  become_user: postgres
                  ansible.builtin.command:
                    cmd: psql -c "CREATE ROLE {{ postgresql_admin_role }} LOGIN;"
                  when: role_exists.stdout | trim == ""

                - name: Repoint superuser mappings at the named role
                  ansible.builtin.replace:
                    path: "{{ postgresql_ident }}"
                    regexp: '^(\S+\s+\S+\s+)postgres\s*$'
                    replace: '\1{{ postgresql_admin_role }}'
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-ident-no-catch-all-mappings
    title: Ensure pg_ident.conf does not use catch-all system username patterns
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-4-i-information-access-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      postgresql.ident.mappings.none(systemUsername == /\.\*/ || systemUsername == /\.\+/)
    docs:
      desc: |
        This check verifies that identity mappings enumerate the external accounts they accept instead of matching all of them with a pattern.

        A system username in `pg_ident.conf` that begins with a slash is treated as a regular expression, so an entry such as `/^(.*)$` matches every authenticated identity and grants each one the mapped PostgreSQL role. The check fails on patterns of that shape and passes when each mapping names a specific identity.

        **Why this matters**

        A catch-all removes the boundary the map exists to enforce. The authentication method establishes that the connecting party is who they claim to be; the map is supposed to decide which of those parties may act as which role. Match everything and the second decision disappears, so proving any identity at all is enough to hold the mapped role.

        That converts account creation into database access. An attacker who can add a local account on the host, or who compromises a service account nobody associated with the database, connects and is granted the role. On a certificate-based deployment the same pattern accepts every certificate the trusted authority ever issued, including ones minted for unrelated systems.

        Broad patterns also capture more than their author intended. A regular expression written to match a naming convention matches every future account that happens to fit it, so access is granted by a hostname convention or a username prefix rather than by a decision anyone made.

        Write one mapping per identity so the file is a reviewable list of who may assume which role. Where a pattern is genuinely necessary, anchor it tightly to a prefix that only the intended accounts can hold, and revisit it whenever the account naming convention changes.
      audit: |
        ### Audit via CLI

        1. Read the mappings and look for regular expression patterns:

        ```bash
        sudo -u postgres grep -vE "^\s*(#|$)" /etc/postgresql/16/main/pg_ident.conf
        ```

        2. On PostgreSQL 15 and later, read the parsed mappings:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, map_name, sys_name, pg_username FROM pg_ident_file_mappings ORDER BY line_number;"
        ```

        3. Identify which authentication rules consult a map:

        ```bash
        sudo -u postgres psql -c "SELECT line_number, type, address, auth_method, options FROM pg_hba_file_rules WHERE options::text LIKE '%map=%';"
        ```

        A passing result shows literal system usernames, or narrowly anchored patterns that match a known set. A failing result shows a pattern containing `.*` or `.+`.
      remediation:
        - id: cli
          desc: |
            To replace catch-all identity mappings using the CLI:

            1. Enumerate the external identities that legitimately need database access.
            2. Remove the catch-all pattern and write one explicit mapping per identity.
            3. Reload PostgreSQL and confirm the mappings.

            ```bash
            sudo sed -i -E "/^\S+\s+\/.*(\.\*|\.\+)/d" /etc/postgresql/16/main/pg_ident.conf
            printf "mymap alice alice_pg\nmymap bob bob_pg\n" \
              | sudo tee -a /etc/postgresql/16/main/pg_ident.conf >/dev/null
            sudo systemctl reload postgresql
            sudo -u postgres grep -vE "^\s*(#|$)" /etc/postgresql/16/main/pg_ident.conf
            ```
        - id: script
          desc: |
            To replace catch-all identity mappings using a bash script:

            1. Define the map name and the explicit identity pairs.
            2. Remove catch-all patterns and write the explicit mappings.
            3. Reload PostgreSQL.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            IDENT="/etc/postgresql/16/main/pg_ident.conf"
            MAP_NAME="mymap"
            declare -A MAPPINGS=([alice]=alice_pg [bob]=bob_pg)

            cp -a "$IDENT" "${IDENT}.bak"
            sed -i -E "/^\S+[[:space:]]+\/.*(\.\*|\.\+)/d" "$IDENT"

            for sys_user in "${!MAPPINGS[@]}"; do
              printf "%s %s %s\n" "$MAP_NAME" "$sys_user" "${MAPPINGS[$sys_user]}" >>"$IDENT"
            done

            systemctl reload postgresql
            ```
        - id: ansible
          desc: |
            To replace catch-all identity mappings using Ansible:

            1. Remove mappings whose system username is a catch-all pattern.
            2. Add one explicit mapping per identity.
            3. Notify a handler that reloads the server.

            ```yaml
            - name: Replace catch-all PostgreSQL identity mappings
              hosts: postgresql
              become: true
              vars:
                postgresql_ident: /etc/postgresql/16/main/pg_ident.conf
                postgresql_map_name: mymap
                postgresql_ident_mappings:
                  - { sys_name: alice, pg_username: alice_pg }
                  - { sys_name: bob, pg_username: bob_pg }
              tasks:
                - name: Remove catch-all patterns
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_ident }}"
                    regexp: '^\S+\s+/.*(\.\*|\.\+)'
                    state: absent
                  notify: Reload postgresql

                - name: Add explicit mappings
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_ident }}"
                    line: "{{ postgresql_map_name }} {{ item.sys_name }} {{ item.pg_username }}"
                    state: present
                  loop: "{{ postgresql_ident_mappings }}"
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-db-user-namespace-disabled
    title: Ensure db_user_namespace is not enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      postgresql.conf.params["db_user_namespace"] == empty || postgresql.conf.params["db_user_namespace"].downcase == "off"
    docs:
      desc: |
        This check verifies that role names mean the same thing regardless of which database a client selects.

        `db_user_namespace` in `postgresql.conf` enables per-database usernames written as `user@dbname`. When it is on, the server strips the suffix and rewrites the client-supplied name before authentication runs. The feature is off by default, so the check treats an absent directive as compliant and fails only when it has been turned on.

        **Why this matters**

        The rewrite happens before rule matching, so the role a rule applies to depends on the database the client asked for. The same connection string resolves to different roles against different databases, which means reading the authentication file no longer tells you who can connect as what. An attacker probing the server manipulates one half of the pair to reach a name that a permissive rule matches, and the reviewer who wrote that rule never considered the combination.

        Recorded usernames become ambiguous in the same way. A log line names the rewritten role, so during an investigation the identity in the record does not correspond to the name the client actually presented, and correlating database activity with application logs stops working exactly when it is needed.

        The mechanism also interacts poorly with challenge-response authentication, because the client has to know whether to include the suffix when computing its response, and getting that wrong produces authentication failures that look like the wrong password rather than a configuration problem.

        The feature exists for backward compatibility and is not recommended for new deployments. Confirm no role name depends on the suffixed form before turning it off, then set the directive and reload.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW db_user_namespace;"
        ```

        2. Confirm whether the directive is set anywhere in the configuration:

        ```bash
        sudo -u postgres grep -rE "^\s*db_user_namespace" /etc/postgresql/16/main/
        ```

        A passing result reports `off`, or shows no explicit setting. A failing result reports `on`.
      remediation:
        - id: cli
          desc: |
            To disable per-database usernames using the CLI:

            1. Confirm no role names contain an `@` suffix that depends on the feature.
            2. Set `db_user_namespace` to `off` in `postgresql.conf`.
            3. Reload PostgreSQL and confirm the effective value.

            ```bash
            sudo -u postgres psql -c "SELECT rolname FROM pg_roles WHERE rolname LIKE '%@%';"
            sudo -u postgres sed -i "s/^#*\s*db_user_namespace.*/db_user_namespace = off/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW db_user_namespace;"
            ```
        - id: script
          desc: |
            To disable per-database usernames using a bash script:

            1. Refuse to proceed while roles depend on the suffixed naming.
            2. Set the directive to `off`.
            3. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            suffixed=$(su -s /bin/sh postgres -c \
              "psql -tAc \"SELECT count(*) FROM pg_roles WHERE rolname LIKE '%@%';\"")

            if [ "$suffixed" -gt 0 ]; then
              echo "$suffixed role(s) use per-database naming; rename them before disabling" >&2
              exit 1
            fi

            if grep -qE "^\s*#?\s*db_user_namespace" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*db_user_namespace.*|db_user_namespace = off|" "$PGCONF"
            else
              printf "db_user_namespace = off\n" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW db_user_namespace;'"
            ```
        - id: ansible
          desc: |
            To disable per-database usernames using Ansible:

            1. Set `db_user_namespace` to `off` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Disable PostgreSQL per-database usernames
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Set db_user_namespace to off
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*db_user_namespace'
                    line: "db_user_namespace = off"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-logging-collector-enabled
    title: Ensure logging_collector is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.loggingCollector == true
    docs:
      desc: |
        This check verifies that the server captures its own messages into log files it manages.

        `logging_collector` in `postgresql.conf` starts a dedicated process that receives server messages and writes them to files. The check requires it to be on. The setting is read at startup, so it needs a restart rather than a reload.

        **Why this matters**

        Without the collector, messages go to the process standard error stream, and where they end up depends entirely on how the service was started. Under some unit files they land in the journal, under others in a file nobody rotates, and inside many container images they go to a stream that is discarded when the container is replaced. The result is that a cluster can be attacked repeatedly and produce no durable record of it.

        That gap is the attacker's advantage rather than an inconvenience. Failed authentications, connections from unexpected addresses, and the statements that created a new superuser role all still happen; they leave nothing behind for anyone to find. An investigation that begins after the fact then has no way to establish when access started or what was touched.

        The collector is also what makes the rest of the logging configuration real. `log_file_mode`, `log_rotation_age`, and `log_filename` only take effect when PostgreSQL owns the files, so log protection and rotation cannot be applied until the collector is running.

        Where a container platform deliberately harvests the standard error stream into a durable, protected pipeline, that is a reasonable alternative; confirm that the collection actually persists and is access-controlled before treating it as one.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW logging_collector;"
        ```

        2. Confirm the server is writing to a log file and where it lives:

        ```bash
        sudo -u postgres psql -c "SELECT pg_current_logfile();"
        ```

        A passing result reports `on` and returns a log file path. A failing result reports `off`, and `pg_current_logfile()` returns an empty value.
      remediation:
        - id: cli
          desc: |
            To enable the logging collector using the CLI:

            1. Set `logging_collector` in `postgresql.conf`.
            2. Restart PostgreSQL, because this setting cannot be applied with a reload.
            3. Confirm the server is writing to a log file.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*logging_collector.*/logging_collector = on/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl restart postgresql
            sudo -u postgres psql -c "SELECT pg_current_logfile();"
            ```
        - id: script
          desc: |
            To enable the logging collector using a bash script:

            1. Set the directive, replacing any existing value.
            2. Restart PostgreSQL.
            3. Report the active log file so the change can be confirmed.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            if grep -qE "^\s*#?\s*logging_collector" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*logging_collector.*|logging_collector = on|" "$PGCONF"
            else
              printf "logging_collector = on\n" >>"$PGCONF"
            fi

            systemctl restart postgresql
            su -s /bin/sh postgres -c "psql -tAc 'SELECT pg_current_logfile();'"
            ```
        - id: ansible
          desc: |
            To enable the logging collector using Ansible:

            1. Set `logging_collector` in `postgresql.conf`.
            2. Notify a handler that restarts the server, because a reload is not sufficient.

            ```yaml
            - name: Enable the PostgreSQL logging collector
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Set logging_collector to on
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*logging_collector'
                    line: "logging_collector = on"
                    state: present
                  notify: Restart postgresql
              handlers:
                - name: Restart postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: restarted
            ```

  - uid: mondoo-postgresql-security-log-destination-configured
    title: Ensure log_destination uses a structured or centralized format
    impact: 55
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.logDestination == /csvlog|jsonlog|syslog/
    docs:
      desc: |
        This check verifies that server messages are emitted in a form a log pipeline can parse or are forwarded off the host.

        `log_destination` in `postgresql.conf` selects the output format. The check requires the value to include `csvlog`, `jsonlog`, or `syslog` rather than only the default freeform `stderr` text. A reload applies the change.

        **Why this matters**

        Freeform text is written for a person reading one line at a time. Message wording and field boundaries vary by event type and change between releases, so detection rules built on text matching miss events after an upgrade and match the wrong ones in the meantime. The events that matter most, a burst of failed authentications or a connection from an address that has never appeared before, are exactly the ones a fragile pattern drops.

        Structured output removes the guesswork by emitting one record per event with stable fields, so a rule matches on the role, the client address, and the error code instead of on a sentence.

        Forwarding matters for a different reason. Logs that only exist on the database host are within reach of an attacker who reached that host. Clearing or editing them is a routine step once a foothold is established, and it works: the evidence of how they arrived is in the same file they can now write to. Records already sent to a collector are outside their control and survive the loss of the machine.

        Choose the destination your pipeline actually consumes, and keep a local copy alongside the forwarded one so a collector outage does not leave a hole in the record.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW log_destination;"
        ```

        2. Confirm records are arriving in the configured format:

        ```bash
        sudo -u postgres psql -c "SELECT pg_current_logfile('csvlog');"
        ```

        A passing result includes `csvlog`, `jsonlog`, or `syslog`. A failing result reports only `stderr`.
      remediation:
        - id: cli
          desc: |
            To configure a structured log destination using the CLI:

            1. Set `log_destination` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Confirm the structured log file is being written.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*log_destination.*/log_destination = 'csvlog'/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SELECT pg_current_logfile('csvlog');"
            ```
        - id: script
          desc: |
            To configure a structured log destination using a bash script:

            1. Choose the destination your log pipeline consumes.
            2. Set the directive, replacing any existing value.
            3. Reload PostgreSQL and report the active structured log file.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            DESTINATION="csvlog"

            if grep -qE "^\s*#?\s*log_destination" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*log_destination.*|log_destination = '${DESTINATION}'|" "$PGCONF"
            else
              printf "log_destination = '%s'\n" "$DESTINATION" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -tAc \"SELECT pg_current_logfile('${DESTINATION}');\""
            ```
        - id: ansible
          desc: |
            To configure a structured log destination using Ansible:

            1. Set `log_destination` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Configure a structured PostgreSQL log destination
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_log_destination: csvlog
              tasks:
                - name: Set log_destination
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*log_destination'
                    line: "log_destination = '{{ postgresql_log_destination }}'"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-log-connections-enabled
    title: Ensure log_connections is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.logConnections == true
    docs:
      desc: |
        This check verifies that every successful connection to the cluster is recorded.

        `log_connections` in `postgresql.conf` makes the server write a record for each session as it is established, naming the authenticated role, the database, and the client address. PostgreSQL leaves it off, so the check fails on the default. A reload applies it.

        **Why this matters**

        With it off, a cluster can be reached again and again without leaving any trace of who arrived. An attacker who has obtained a credential, from a configuration file on a compromised application host, a repository, or a backup, connects with a normal client, does what they came for, and disconnects. Nothing distinguishes their session from the application's, because nothing recorded either one.

        Connection records are what make the abnormal visible. A production database is contacted by a small, stable set of addresses; a session from a workstation subnet, from a container that should not talk to it, or at three in the morning stands out immediately against that baseline. Without the records there is no baseline and no deviation to notice.

        They also bound an incident. When a compromise is discovered later, the first question is when the attacker's access began and which roles they used, and connection records answer it directly. Without them, responders cannot distinguish a week of access from a month.

        The volume is modest, one line per session, though an application that opens a connection per request rather than pooling will generate a great deal of it; fix the pooling rather than turn off the record.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW log_connections;"
        ```

        2. Confirm connection records are actually being written:

        ```bash
        sudo grep -c "connection authorized" "$(sudo -u postgres psql -tAc 'SELECT pg_current_logfile();')"
        ```

        A passing result reports `on` and a nonzero count of authorization records. A failing result reports `off`.
      remediation:
        - id: cli
          desc: |
            To record connections using the CLI:

            1. Set `log_connections` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*log_connections.*/log_connections = on/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW log_connections;"
            ```
        - id: script
          desc: |
            To record connections using a bash script:

            1. Set the directive, replacing any existing value.
            2. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            if grep -qE "^\s*#?\s*log_connections" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*log_connections.*|log_connections = on|" "$PGCONF"
            else
              printf "log_connections = on\n" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW log_connections;'"
            ```
        - id: ansible
          desc: |
            To record connections using Ansible:

            1. Set `log_connections` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Record PostgreSQL connections
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Set log_connections to on
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*log_connections'
                    line: "log_connections = on"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-log-disconnections-enabled
    title: Ensure log_disconnections is enabled
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.logDisconnections == true
    docs:
      desc: |
        This check verifies that the end of each session is recorded along with how long it lasted.

        `log_disconnections` in `postgresql.conf` writes a record when a session closes, including its duration. It is off by default. Paired with the connection record, it closes the session out so the log shows both when an identity arrived and how long it held access. A reload applies it.

        **Why this matters**

        Duration is one of the most informative signals a database log carries, and it exists only when the close is recorded. A pooled application connection lives for hours in a predictable pattern; a session that connects, runs a handful of statements, and vanishes in four seconds looks nothing like it, and neither does one that stays open for two days while rows are pulled out in small batches to stay under a rate alarm. Both are visible against the normal shape of the workload, and both are invisible when only the open is logged.

        Without the close, responders also cannot say when access ended. They know an attacker connected at a point in time and have no way to bound what happened afterwards, which forces them to treat everything since as suspect and widens the scope of the incident far beyond what actually occurred.

        Complete session records make concurrency reconstructable as well, so it is possible to establish which identities held sessions at the moment a table was altered or a role was created.

        Enable it alongside the connection record; each is far less useful on its own than the pair is together.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW log_disconnections;"
        ```

        2. Confirm disconnection records with session duration are present:

        ```bash
        sudo grep -c "disconnection: session time" "$(sudo -u postgres psql -tAc 'SELECT pg_current_logfile();')"
        ```

        A passing result reports `on` and a nonzero count of disconnection records. A failing result reports `off`.
      remediation:
        - id: cli
          desc: |
            To record disconnections using the CLI:

            1. Set `log_disconnections` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*log_disconnections.*/log_disconnections = on/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW log_disconnections;"
            ```
        - id: script
          desc: |
            To record disconnections using a bash script:

            1. Set the directive, replacing any existing value.
            2. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            if grep -qE "^\s*#?\s*log_disconnections" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*log_disconnections.*|log_disconnections = on|" "$PGCONF"
            else
              printf "log_disconnections = on\n" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW log_disconnections;'"
            ```
        - id: ansible
          desc: |
            To record disconnections using Ansible:

            1. Set `log_disconnections` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Record PostgreSQL disconnections
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Set log_disconnections to on
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*log_disconnections'
                    line: "log_disconnections = on"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-log-statement-captures-ddl
    title: Ensure log_statement records at least data definition statements
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.logStatement.downcase == "ddl" || postgresql.conf.logStatement.downcase == "mod" || postgresql.conf.logStatement.downcase == "all"
    docs:
      desc: |
        This check verifies that statements which change the schema or the privilege structure are recorded with their text.

        `log_statement` in `postgresql.conf` selects which statement classes are logged. PostgreSQL defaults to `none`. This check requires `ddl`, `mod`, or `all`. The `ddl` level captures data definition statements including `CREATE`, `ALTER`, `DROP`, and `GRANT`; `mod` adds data-modifying statements; `all` records everything at a substantially higher volume. A reload applies the change.

        **Why this matters**

        At the default, an attacker who reaches the database can restructure it silently. They run `CREATE ROLE` with a password only they know and grant it membership in a privileged group, so they keep access after the credential they arrived with is rotated. They install a trigger or a function that re-creates that role whenever it is deleted. They drop a table or alter a constraint to hide what they took. None of it leaves a record of the statement text.

        Privilege changes are the ones that matter most. A `GRANT` is a single short statement that permanently widens what an identity may do, and it is indistinguishable from legitimate administration unless the text and the time are in the log.

        The same records make recovery possible. After an incident, the difference between knowing exactly which objects were altered and having to compare the schema against a backup is the difference between an afternoon and a week.

        Choose the level your retention can hold. Recording every statement on a busy cluster produces an enormous volume and often captures parameter values you would rather not store, so record at least data definition and go further only where the traffic justifies it.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW log_statement;"
        ```

        2. Confirm statement records are present in the log:

        ```bash
        sudo grep -c "statement:" "$(sudo -u postgres psql -tAc 'SELECT pg_current_logfile();')"
        ```

        A passing result reports `ddl`, `mod`, or `all`. A failing result reports `none`.
      remediation:
        - id: cli
          desc: |
            To record schema changing statements using the CLI:

            1. Set `log_statement` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*log_statement.*/log_statement = 'ddl'/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW log_statement;"
            ```
        - id: script
          desc: |
            To record schema changing statements using a bash script:

            1. Choose the statement class to record based on retention capacity.
            2. Set the directive, replacing any existing value.
            3. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            LEVEL="ddl"

            if grep -qE "^\s*#?\s*log_statement" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*log_statement.*|log_statement = '${LEVEL}'|" "$PGCONF"
            else
              printf "log_statement = '%s'\n" "$LEVEL" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW log_statement;'"
            ```
        - id: ansible
          desc: |
            To record schema changing statements using Ansible:

            1. Set `log_statement` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Record PostgreSQL schema changing statements
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_log_statement: ddl
              tasks:
                - name: Set log_statement
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*log_statement'
                    line: "log_statement = '{{ postgresql_log_statement }}'"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-log-line-prefix-includes-context
    title: Ensure log_line_prefix records timestamp, user, and database
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.params["log_line_prefix"] != empty
      postgresql.conf.params["log_line_prefix"] == /%m/
      postgresql.conf.params["log_line_prefix"] == /%u/
      postgresql.conf.params["log_line_prefix"] == /%d/
    docs:
      desc: |
        This check verifies that every log line identifies when it was written, which role produced it, and which database it concerns.

        `log_line_prefix` in `postgresql.conf` is prepended to every message the server writes. The check requires the value to be set and to include the timestamp with milliseconds as `%m`, the connecting role as `%u`, and the database as `%d`. A reload applies the change.

        **Why this matters**

        Without those fields the log says what happened but not who did it. A line recording a dropped table, a failed authentication, or a permission error is an observation with no subject, so an investigation can establish that something occurred and can go no further. The events are present and useless at the same time, which is worse than an obvious gap because it looks like coverage.

        Attribution is what turns a record into evidence. Repeated authentication failures against one role tell you a credential is being guessed only when the role is named; the same lines without it are indistinguishable from an application misconfiguration.

        Timestamp precision decides whether events can be ordered. Several statements within the same second are common on an active cluster, and second-granularity stamps leave their sequence ambiguous exactly when the sequence is the question, such as whether a privilege was granted before or after the statement that used it.

        Add `%h` for the client host and `%p` for the process identifier as well. The process identifier is what ties the separate lines of one session together, and the client host is what lets a database event be lined up against records from the network and the application.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW log_line_prefix;"
        ```

        2. Inspect recent lines to confirm the fields are populated:

        ```bash
        sudo tail -n 20 "$(sudo -u postgres psql -tAc 'SELECT pg_current_logfile();')"
        ```

        A passing result contains `%m`, `%u`, and `%d`. A failing result omits any of them, or is unset so the server uses a minimal prefix.
      remediation:
        - id: cli
          desc: |
            To record session context in every log line using the CLI:

            1. Set `log_line_prefix` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*log_line_prefix.*/log_line_prefix = '%m [%p] %q%u@%d %h '/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW log_line_prefix;"
            ```
        - id: script
          desc: |
            To record session context in every log line using a bash script:

            1. Define a prefix carrying timestamp, process, role, database, and client host.
            2. Set the directive, replacing any existing value.
            3. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            PREFIX='%m [%p] %q%u@%d %h '

            if grep -qE "^\s*#?\s*log_line_prefix" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*log_line_prefix.*|log_line_prefix = '${PREFIX}'|" "$PGCONF"
            else
              printf "log_line_prefix = '%s'\n" "$PREFIX" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW log_line_prefix;'"
            ```
        - id: ansible
          desc: |
            To record session context in every log line using Ansible:

            1. Set `log_line_prefix` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Record session context in PostgreSQL log lines
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_log_line_prefix: "%m [%p] %q%u@%d %h "
              tasks:
                - name: Set log_line_prefix
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*log_line_prefix'
                    line: "log_line_prefix = '{{ postgresql_log_line_prefix }}'"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-log-error-verbosity-not-terse
    title: Ensure log_error_verbosity is not set to terse
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.params["log_error_verbosity"] == empty || postgresql.conf.params["log_error_verbosity"].downcase != "terse"
    docs:
      desc: |
        This check verifies that logged errors keep the fields that explain them.

        `log_error_verbosity` in `postgresql.conf` controls how much of an error is written. The `terse` value strips the detail, hint, and context fields and leaves only the primary message. PostgreSQL uses `default`, so the check treats an absent directive as compliant and fails only on the reduced setting. A reload restores the detail.

        **Why this matters**

        The stripped fields are the ones that identify what actually failed. The primary message says a syntax error occurred or a constraint was violated; the detail says which constraint and which values, and the context names the function and the statement that raised it. Without them a log of errors records that the database is unhappy without recording why, and every entry has to be reproduced before it means anything.

        That gap costs most during an intrusion. Injection attempts against an application generate a characteristic run of errors, malformed literals, type mismatches, references to objects that do not exist, and the diagnostic fields are what distinguish that pattern from a bug in a deployment that went out the same afternoon. Reduced to a bare message, the two look identical, so the probing is filed as noise while it continues.

        The same detail is what makes an error tractable at all after the fact, since the failing statement is often long gone and cannot be run again against the same data.

        Leave the setting alone unless log volume genuinely demands it, and if it does, reduce the statement logging level rather than the error detail.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW log_error_verbosity;"
        ```

        2. Confirm logged errors carry their detail fields:

        ```bash
        sudo grep -A2 "ERROR:" "$(sudo -u postgres psql -tAc 'SELECT pg_current_logfile();')" | tail -n 20
        ```

        A passing result reports `default` or `verbose`, or shows no explicit setting. A failing result reports `terse`.
      remediation:
        - id: cli
          desc: |
            To restore error detail in logs using the CLI:

            1. Set `log_error_verbosity` in `postgresql.conf`.
            2. Reload PostgreSQL.
            3. Confirm the effective value.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*log_error_verbosity.*/log_error_verbosity = default/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW log_error_verbosity;"
            ```
        - id: script
          desc: |
            To restore error detail in logs using a bash script:

            1. Set the directive, replacing any existing value.
            2. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            if grep -qE "^\s*#?\s*log_error_verbosity" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*log_error_verbosity.*|log_error_verbosity = default|" "$PGCONF"
            else
              printf "log_error_verbosity = default\n" >>"$PGCONF"
            fi

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW log_error_verbosity;'"
            ```
        - id: ansible
          desc: |
            To restore error detail in logs using Ansible:

            1. Set `log_error_verbosity` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Restore PostgreSQL error detail in logs
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Set log_error_verbosity
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*log_error_verbosity'
                    line: "log_error_verbosity = default"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-log-file-mode-restricted
    title: Ensure log_file_mode restricts log files to the server account
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-02
      compliance/dora: dora-art-10
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-3-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.params["log_file_mode"] == empty || postgresql.conf.params["log_file_mode"] == /^0?600$/
    docs:
      desc: |
        This check verifies that log files the server writes are readable only by the account that runs it.

        `log_file_mode` in `postgresql.conf` sets the permission bits applied to each new log file. PostgreSQL uses `0600`, so the check treats an absent directive as compliant and fails when the mode has been widened to allow group or world access. A reload applies the mode to files created afterwards; files already on disk keep the mode they were created with.

        **Why this matters**

        Logs are valuable precisely because of what they contain, and that makes the files themselves sensitive. With `log_statement` recording data definition, they hold role names, group memberships, granted privileges, and the shape of the schema. With `log_line_prefix` populated they hold client addresses and database names, and error detail routinely includes column values from the statement that failed.

        A world-readable log therefore hands a local attacker a map. An unprivileged account on the host, or a compromised unrelated service running there, reads which roles exist, which of them are privileged, which networks connect, and which tables are worth reaching, all without touching the database or producing a single failed login.

        Occasionally the logs give up more than a map. Statements that embed a password in a role definition, connection strings written into a function body, and application errors that echo parameter values all end up in the file verbatim.

        Restrict access to the server account and to the log collection agent, and correct the permissions on files written before the change, since the directive does not go back and fix them.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW log_file_mode;"
        ```

        2. Confirm the permissions actually applied to the log files:

        ```bash
        sudo ls -l "$(sudo -u postgres psql -tAc 'SELECT pg_current_logfile();')"
        ```

        A passing result reports `0600`, or shows no explicit setting, and the log files show `-rw-------`. A failing result reports a wider mode such as `0640` or `0644`.
      remediation:
        - id: cli
          desc: |
            To restrict log file permissions using the CLI:

            1. Set `log_file_mode` in `postgresql.conf`.
            2. Reload PostgreSQL so new log files use the mode.
            3. Tighten the permissions on existing log files.

            ```bash
            sudo -u postgres sed -i "s/^#*\s*log_file_mode.*/log_file_mode = 0600/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo find /var/log/postgresql -type f -name "*.log" -exec chmod 0600 {} +
            ```
        - id: script
          desc: |
            To restrict log file permissions using a bash script:

            1. Set the directive, replacing any existing value.
            2. Reload PostgreSQL.
            3. Correct the permissions on log files already written.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"
            LOG_DIR="/var/log/postgresql"

            if grep -qE "^\s*#?\s*log_file_mode" "$PGCONF"; then
              sed -i "s|^\s*#\?\s*log_file_mode.*|log_file_mode = 0600|" "$PGCONF"
            else
              printf "log_file_mode = 0600\n" >>"$PGCONF"
            fi

            systemctl reload postgresql

            if [ -d "$LOG_DIR" ]; then
              find "$LOG_DIR" -type f -name "*.log" -exec chmod 0600 {} +
            fi
            ```
        - id: ansible
          desc: |
            To restrict log file permissions using Ansible:

            1. Set `log_file_mode` in `postgresql.conf`.
            2. Notify a handler that reloads the server.
            3. Correct permissions on existing log files.

            ```yaml
            - name: Restrict PostgreSQL log file permissions
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_log_dir: /var/log/postgresql
              tasks:
                - name: Set log_file_mode
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*log_file_mode'
                    line: "log_file_mode = 0600"
                    state: present
                  notify: Reload postgresql

                - name: Find existing log files
                  ansible.builtin.find:
                    paths: "{{ postgresql_log_dir }}"
                    patterns: "*.log"
                  register: existing_logs

                - name: Restrict existing log files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    mode: "0600"
                  loop: "{{ existing_logs.files }}"
                  loop_control:
                    label: "{{ item.path }}"
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```

  - uid: mondoo-postgresql-security-pgaudit-extension-enabled
    title: Ensure pgaudit is loaded through shared_preload_libraries
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      postgresql.conf.sharedPreloadLibraries.any(_ == "pgaudit")
    docs:
      desc: |
        This check verifies that object-level auditing is loaded into the server.

        The `pgaudit` extension has to be listed in `shared_preload_libraries` in `postgresql.conf` so it is loaded when the server starts. The check fails when it is absent from that list. Because the library is preloaded, adding it requires a restart rather than a reload, and the extension must also be created in each database it should audit.

        **Why this matters**

        The built-in `log_statement` setting records statement text, but it cannot tell you which objects a statement touched, and it does not record reads at all at any level short of logging every statement on the server. Reads are what an attacker who is stealing data actually does. A credential that is used exactly as intended, running `SELECT` against tables it holds a grant on, produces nothing at all in a configuration that only logs schema changes.

        Object-level auditing closes that. Reads of the specific tables that hold regulated or high-value data are recorded with the role, the object, and the statement, so bulk extraction stands out against the volume an application normally issues, and a query that walks a customer table row by row leaves a trail even though every individual statement was authorized.

        The entries are also emitted in a consistent, parseable shape rather than as freeform text, which is what makes alerting on them practical.

        Scope the auditing to the objects that warrant it. Auditing everything on a busy cluster produces a volume nobody retains, and the records that matter get rotated away with the rest.
      audit: |
        ### Audit via CLI

        1. Read the effective preload list from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW shared_preload_libraries;"
        ```

        2. Confirm the extension is installed in the database:

        ```bash
        sudo -u postgres psql -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'pgaudit';"
        ```

        3. Review what the extension is configured to record:

        ```bash
        sudo -u postgres psql -c "SHOW pgaudit.log;"
        ```

        A passing result lists `pgaudit` in the preload list. A failing result omits it, in which case the extension cannot be active regardless of any other setting.
      remediation:
        - id: cli
          desc: |
            To enable pgaudit using the CLI:

            1. Install the extension package matching the server version.
            2. Read the libraries already preloaded, so adding `pgaudit` does not drop them.
            3. Append the preload list and the audit classes to `postgresql.conf`, where the last value for a setting is the one that applies.
            4. Restart the server and create the extension.

            ```bash
            sudo apt-get install -y postgresql-16-pgaudit
            libraries=$(sudo -u postgres psql -tAc "SHOW shared_preload_libraries;")
            sudo -u postgres tee -a /etc/postgresql/16/main/postgresql.conf >/dev/null <<EOF
            shared_preload_libraries = '${libraries:+$libraries,}pgaudit'
            pgaudit.log = 'ddl, role, write'
            EOF
            sudo systemctl restart postgresql
            sudo -u postgres psql -c "CREATE EXTENSION IF NOT EXISTS pgaudit;"
            sudo -u postgres psql -c "SHOW shared_preload_libraries;"
            ```
        - id: script
          desc: |
            To enable pgaudit using a bash script:

            1. Preserve any libraries already listed instead of overwriting them.
            2. Restart the server so the library loads.
            3. Create the extension and confirm it is present.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGCONF="/etc/postgresql/16/main/postgresql.conf"

            current=$(su -s /bin/sh postgres -c "psql -tAc 'SHOW shared_preload_libraries;'" | tr -d ' ')

            if printf '%s' "$current" | tr ',' '\n' | grep -qx "pgaudit"; then
              echo "pgaudit already present in shared_preload_libraries"
            else
              if [ -n "$current" ]; then
                libraries="${current},pgaudit"
              else
                libraries="pgaudit"
              fi

              if grep -qE "^\s*#?\s*shared_preload_libraries" "$PGCONF"; then
                sed -i "s|^\s*#\?\s*shared_preload_libraries.*|shared_preload_libraries = '${libraries}'|" "$PGCONF"
              else
                printf "shared_preload_libraries = '%s'\n" "$libraries" >>"$PGCONF"
              fi

              systemctl restart postgresql
            fi

            su -s /bin/sh postgres -c "psql -c 'CREATE EXTENSION IF NOT EXISTS pgaudit;'"
            ```
        - id: ansible
          desc: |
            To enable pgaudit using Ansible:

            1. Install the extension package.
            2. Add the library to `shared_preload_libraries` and restart the server.
            3. Create the extension in the target database.

            ```yaml
            - name: Enable pgaudit for PostgreSQL
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
                postgresql_preload_libraries: pgaudit
              tasks:
                - name: Install the pgaudit package
                  ansible.builtin.package:
                    name: postgresql-16-pgaudit
                    state: present

                - name: Add pgaudit to shared_preload_libraries
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*#?\s*shared_preload_libraries'
                    line: "shared_preload_libraries = '{{ postgresql_preload_libraries }}'"
                    state: present
                  notify: Restart postgresql

                - name: Flush handlers so the library is loaded
                  ansible.builtin.meta: flush_handlers

                - name: Create the extension
                  become: true
                  become_user: postgres
                  ansible.builtin.command:
                    cmd: psql -c "CREATE EXTENSION IF NOT EXISTS pgaudit;"
                  register: create_extension
                  changed_when: "'CREATE EXTENSION' in create_extension.stdout"
              handlers:
                - name: Restart postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: restarted
            ```

  - uid: mondoo-postgresql-security-conf-files-restricted-permissions
    title: Ensure postgresql.conf and its includes are not group or world accessible
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      postgresql.conf.files != empty
      postgresql.conf.files.all(permissions.group_writeable == false && permissions.other_readable == false && permissions.other_writeable == false)
    docs:
      desc: |
        This check verifies that the server's configuration files are not readable or writable by other accounts on the host.

        It evaluates `postgresql.conf` together with every fragment pulled in by `include`, `include_if_exists`, and `include_dir`, and fails when any of them is group-writable or world-readable or world-writable. PostgreSQL does not enforce permissions on these files the way it does on TLS key material, so a widened mode produces no warning at startup.

        **Why this matters**

        Read access is reconnaissance. The files record the addresses the server listens on, where the data directory lives, where the private key and certificate sit, which authentication and identity files are in use, and where logs are written. A local account that can read them knows exactly which file to target next, and whether a target is worth the effort, without generating a single connection attempt.

        Write access is control of the database. An account that can edit a fragment points the server at an authentication file of its own on the next reload, and that file can grant unauthenticated superuser access. The change is a few characters in a file the attacker already had permission to write, and the reload may be triggered by ordinary configuration management rather than by them.

        Fragments are the part that gets missed. Configuration management tooling writes drop-in files under a `conf.d` directory with whatever default the module carries, so a fragment ends up world-readable while the main file is correctly locked down, which is why this check evaluates every contributing file rather than only the entry point.
      audit: |
        ### Audit via CLI

        1. List every file that contributes to the configuration:

        ```bash
        sudo -u postgres psql -c "SELECT DISTINCT sourcefile FROM pg_settings WHERE sourcefile IS NOT NULL;"
        ```

        2. Inspect the permissions on the main file and any include directory:

        ```bash
        sudo ls -l /etc/postgresql/16/main/postgresql.conf
        sudo ls -lR /etc/postgresql/16/main/conf.d/
        ```

        A passing result shows each file owned by the server account with no group write bit and no world access, which is `-rw-------` or `-rw-r-----`. A failing result shows a mode such as `-rw-r--r--` on the main file or on any fragment.
      remediation:
        - id: cli
          desc: |
            To restrict configuration file permissions using the CLI:

            1. Set ownership to the server account on the main file and any include directory.
            2. Remove group write and world access from every contributing file.
            3. Confirm the resulting permissions.

            ```bash
            sudo chown -R postgres:postgres /etc/postgresql/16/main/
            sudo chmod 0600 /etc/postgresql/16/main/postgresql.conf
            sudo find /etc/postgresql/16/main/conf.d -type f -name "*.conf" -exec chmod 0600 {} +
            sudo ls -l /etc/postgresql/16/main/postgresql.conf
            ```
        - id: script
          desc: |
            To restrict configuration file permissions using a bash script:

            1. Locate the main configuration file and its include directory.
            2. Apply ownership and mode to the main file and every fragment.
            3. Report any file that still allows group or world access.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGDIR="/etc/postgresql/16/main"
            PGCONF="${PGDIR}/postgresql.conf"

            chown postgres:postgres "$PGCONF"
            chmod 0600 "$PGCONF"

            if [ -d "${PGDIR}/conf.d" ]; then
              chown -R postgres:postgres "${PGDIR}/conf.d"
              find "${PGDIR}/conf.d" -type f -name "*.conf" -exec chmod 0600 {} +
            fi

            remaining=$(find "$PGDIR" -name "*.conf" -perm /0077 -print)
            if [ -n "$remaining" ]; then
              echo "files still allowing group or world access:" >&2
              printf '%s\n' "$remaining" >&2
              exit 1
            fi
            ```
        - id: ansible
          desc: |
            To restrict configuration file permissions using Ansible:

            1. Set ownership and mode on the main configuration file.
            2. Apply the same protection to every include fragment.

            ```yaml
            - name: Restrict PostgreSQL configuration file permissions
              hosts: postgresql
              become: true
              vars:
                postgresql_dir: /etc/postgresql/16/main
              tasks:
                - name: Protect the main configuration file
                  ansible.builtin.file:
                    path: "{{ postgresql_dir }}/postgresql.conf"
                    owner: postgres
                    group: postgres
                    mode: "0600"

                - name: Find include fragments
                  ansible.builtin.find:
                    paths: "{{ postgresql_dir }}/conf.d"
                    patterns: "*.conf"
                  register: conf_fragments
                  failed_when: false

                - name: Protect include fragments
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: postgres
                    group: postgres
                    mode: "0600"
                  loop: "{{ conf_fragments.files | default([]) }}"
                  loop_control:
                    label: "{{ item.path }}"
            ```

  - uid: mondoo-postgresql-security-hba-file-restricted-permissions
    title: Ensure pg_hba.conf is not group or world accessible
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      postgresql.hba.file.permissions.group_writeable == false
      postgresql.hba.file.permissions.other_readable == false
      postgresql.hba.file.permissions.other_writeable == false
    docs:
      desc: |
        This check verifies that the host-based authentication file is readable only by the account that runs the server.

        `pg_hba.conf` is the cluster's complete access policy: which roles may connect, from which networks, over which connection types, and with which authentication method. The check fails when the file is group-writable, world-readable, or world-writable.

        **Why this matters**

        Read access alone is a reconnaissance win. The file states which network ranges are trusted, which roles are reachable from where, and which rules still use a weaker method, so a local attacker learns the cheapest way in and pursues that one instead of guessing. It also tells them which rules will not match, so their attempts are confined to paths that could work and are less likely to trip a threshold.

        Write access is equivalent to owning the database. One added line that grants unauthenticated access to the superuser role takes effect on the next reload, and reloads happen for unrelated reasons all the time: a certificate renewal, a configuration management run, a log rotation hook. The attacker does not have to trigger it themselves, and afterwards they connect as a superuser with no credential and no failed attempt in the log.

        That path is also short. Any local foothold, a vulnerable service running under a group that shares access to the file, an over-permissive deployment account, or a backup directory that copied the file with default permissions, is enough.

        Set ownership to the server account with access restricted to it, and resolve the path from the running server rather than assuming a distribution default, since the location is itself configurable.
      audit: |
        ### Audit via CLI

        1. Locate the file the server is actually using:

        ```bash
        sudo -u postgres psql -c "SHOW hba_file;"
        ```

        2. Inspect its ownership and permissions:

        ```bash
        sudo ls -l "$(sudo -u postgres psql -tAc 'SHOW hba_file;')"
        ```

        A passing result shows the file owned by the server account with no group write bit and no world access, which is `-rw-------` or `-rw-r-----`. A failing result shows a mode such as `-rw-r--r--` or `-rw-rw-r--`.
      remediation:
        - id: cli
          desc: |
            To restrict the authentication file permissions using the CLI:

            1. Read the path the server uses so the correct file is changed.
            2. Set ownership to the server account and remove group and world access.
            3. Confirm the resulting permissions.

            ```bash
            HBA=$(sudo -u postgres psql -tAc 'SHOW hba_file;')
            sudo chown postgres:postgres "$HBA"
            sudo chmod 0600 "$HBA"
            sudo ls -l "$HBA"
            ```
        - id: script
          desc: |
            To restrict the authentication file permissions using a bash script:

            1. Resolve the active file path from the server rather than assuming a location.
            2. Apply ownership and mode.
            3. Verify no group or world bits remain.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            HBA=$(su -s /bin/sh postgres -c "psql -tAc 'SHOW hba_file;'")

            if [ ! -f "$HBA" ]; then
              echo "could not resolve pg_hba.conf path: $HBA" >&2
              exit 1
            fi

            chown postgres:postgres "$HBA"
            chmod 0600 "$HBA"

            if find "$HBA" -perm /0077 | grep -q .; then
              echo "group or world access remains on $HBA" >&2
              exit 1
            fi

            ls -l "$HBA"
            ```
        - id: ansible
          desc: |
            To restrict the authentication file permissions using Ansible:

            1. Resolve the active file path from the server.
            2. Set ownership and mode on that file.

            ```yaml
            - name: Restrict PostgreSQL pg_hba.conf permissions
              hosts: postgresql
              become: true
              tasks:
                - name: Resolve the active hba_file path
                  become: true
                  become_user: postgres
                  ansible.builtin.command:
                    cmd: psql -tAc "SHOW hba_file;"
                  changed_when: false
                  register: hba_path

                - name: Protect pg_hba.conf
                  ansible.builtin.file:
                    path: "{{ hba_path.stdout | trim }}"
                    owner: postgres
                    group: postgres
                    mode: "0600"
            ```

  - uid: mondoo-postgresql-security-local-preload-libraries-empty
    title: Ensure local_preload_libraries does not load unexpected libraries
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      postgresql.conf.params["local_preload_libraries"] == empty
    docs:
      desc: |
        This check verifies that the server does not carry a cluster-wide list of libraries to load into ordinary client backends.

        `local_preload_libraries` in `postgresql.conf` names shared libraries loaded into a backend process when a session starts. Unlike `shared_preload_libraries`, it can also be set by an unprivileged role for its own session. The check requires the server-wide value to be empty. A reload applies the change.

        **Why this matters**

        A library loaded into a backend runs inside the server process with the privileges of the account that owns the cluster. That is not the privileges of the connecting role, it is read and write access to the data directory, to the TLS private key, and to anything else that account can reach on the host, plus the ability to make network connections outward from the database host.

        Because the setting does not require superuser, it is a recognized route for turning a foothold on the host into code execution inside the database. An attacker who can write a shared object into the plugin directory, through a deployment account, a writable path, or a package they persuaded an operator to install, gets it loaded on the next connection made by any role. A value already present in the server configuration makes that easier still, since it establishes the load path as normal and the addition of one more name attracts no attention.

        Keep the server-wide list empty so that any library loaded into a backend is deliberate. Extensions belong in the preload list an administrator controls, where they are visible, reviewed, and applied at startup rather than per session.
      audit: |
        ### Audit via CLI

        1. Read the effective value from a running server:

        ```bash
        sudo -u postgres psql -c "SHOW local_preload_libraries;"
        ```

        2. Confirm the directive is not set anywhere in the configuration:

        ```bash
        sudo -u postgres grep -rE "^\s*local_preload_libraries" /etc/postgresql/16/main/
        ```

        3. Review the libraries that are deliberately preloaded server-wide:

        ```bash
        sudo -u postgres psql -c "SHOW shared_preload_libraries;"
        ```

        A passing result reports an empty value and no explicit setting in the configuration. A failing result names one or more libraries.
      remediation:
        - id: cli
          desc: |
            To clear the local preload list using the CLI:

            1. Confirm which libraries are named and whether any are genuinely required.
            2. Move any required extension into `shared_preload_libraries` and clear the local directive.
            3. Reload PostgreSQL and confirm the effective value.

            ```bash
            sudo -u postgres psql -c "SHOW local_preload_libraries;"
            sudo -u postgres sed -i "s/^\s*local_preload_libraries.*/local_preload_libraries = ''/" \
              /etc/postgresql/16/main/postgresql.conf
            sudo systemctl reload postgresql
            sudo -u postgres psql -c "SHOW local_preload_libraries;"
            ```
        - id: script
          desc: |
            To clear the local preload list using a bash script:

            1. Report the current value so a required library is not removed silently.
            2. Clear the directive across the main file and any include fragments.
            3. Reload PostgreSQL and report the effective value.

            ```bash
            #!/usr/bin/env bash
            set -euo pipefail

            PGDIR="/etc/postgresql/16/main"

            current=$(su -s /bin/sh postgres -c "psql -tAc 'SHOW local_preload_libraries;'")
            if [ -n "$current" ]; then
              echo "clearing local_preload_libraries, currently: $current"
            fi

            find "$PGDIR" -name "*.conf" -type f -exec \
              sed -i "s|^\s*local_preload_libraries.*|local_preload_libraries = ''|" {} +

            systemctl reload postgresql
            su -s /bin/sh postgres -c "psql -c 'SHOW local_preload_libraries;'"
            ```
        - id: ansible
          desc: |
            To clear the local preload list using Ansible:

            1. Clear `local_preload_libraries` in `postgresql.conf`.
            2. Notify a handler that reloads the server.

            ```yaml
            - name: Clear the PostgreSQL local preload library list
              hosts: postgresql
              become: true
              vars:
                postgresql_conf: /etc/postgresql/16/main/postgresql.conf
              tasks:
                - name: Clear local_preload_libraries
                  ansible.builtin.lineinfile:
                    path: "{{ postgresql_conf }}"
                    regexp: '^\s*local_preload_libraries'
                    line: "local_preload_libraries = ''"
                    state: present
                  notify: Reload postgresql
              handlers:
                - name: Reload postgresql
                  ansible.builtin.service:
                    name: postgresql
                    state: reloaded
            ```
