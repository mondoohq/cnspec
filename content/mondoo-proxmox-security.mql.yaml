  # Cluster & Migration
  # =================================================================

  - uid: mondoo-proxmox-security-corosync-is-encrypted
    title: Ensure Corosync cluster communication is encrypted
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a11
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    refs:
      - title: CWE-319 Cleartext Transmission of Sensitive Information
        url: https://cwe.mitre.org/data/definitions/319.html
    mql: |
      file("/etc/pve/corosync.conf").content.contains("transport: knet") ||
      file("/etc/pve/corosync.conf").content.contains("secauth: on")
    docs:
      desc: |
        This check verifies that cluster membership traffic runs over an authenticated, encrypted transport.

        Corosync configuration lives in `/etc/pve/corosync.conf`. The check passes when the `totem` block declares `transport: knet`, the default since Proxmox VE 6, or the legacy `secauth: on`. The knet transport takes its protection from the `crypto_cipher` and `crypto_hash` settings alongside it, which Proxmox writes as aes256 and sha256 when it creates a cluster.

        **Why this matters**

        Corosync carries membership and quorum, which is the mechanism that decides which nodes are alive and therefore which node may run a given guest. An attacker who can inject messages into that conversation is not eavesdropping on data, they are voting. They can convince a node that it has lost quorum, which makes it stop its guests, or partition the cluster so that two nodes each believe the other is dead and both start the same VM against the same disk, corrupting it beyond repair.

        Reading the traffic is useful to them as well. It reveals the node inventory, the ring addresses, and the timing of cluster events, which is the map you would want before attacking the management plane.

        Because corosync traffic often rides a dedicated, physically separate network, it is easy to treat that network as trusted and skip the cryptography. That assumption fails the moment anything else lands on the same VLAN, including a guest whose interface was left untagged or unfiltered.

        Editing `corosync.conf` on a live cluster is the riskiest operation in this policy. A malformed file, a stale `config_version`, or a node that fails to reload drops quorum and freezes the cluster. Change it only while the cluster is healthy and quorate, keep a backup, and confirm every node reloaded cleanly before you walk away.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -E 'transport:|secauth:|crypto_' /etc/pve/corosync.conf
        ```

        A passing result shows `transport: knet` or `secauth: on` within the `totem` block; a failing result shows neither, indicating unencrypted cluster communication.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit a working copy outside `/etc/pve`, then activate it in a
            single step so the cluster never sees a partial configuration.

            **Quorum-loss warning:** Overwriting the live
            `/etc/pve/corosync.conf` is the riskiest operation in this policy.
            A bad edit, a stale `config_version`, or a node that fails to reload
            can drop quorum and freeze the cluster. Only do this while the
            cluster is healthy and quorate. Confirm quorum first with
            `pvecm status` (or `corosync-cfgtool -s`), make the change, then
            re-run `corosync-cfgtool -s` on each node to confirm every link is
            connected and corosync reloaded cleanly. If quorum drops, restore
            the backup with `cp /root/corosync.conf.bak /etc/pve/corosync.conf`.

            ```bash
            cp /etc/pve/corosync.conf /root/corosync.conf.bak
            cp /etc/pve/corosync.conf /root/corosync.conf.new

            # Confirm the cluster is quorate before changing anything.
            corosync-cfgtool -s

            # Edit /root/corosync.conf.new. Inside the totem { } block ensure:
            #   transport: knet
            #   crypto_cipher: aes256
            #   crypto_hash: sha256
            # and increment config_version by 1.

            cp /root/corosync.conf.new /etc/pve/corosync.conf

            # Verify every node reloaded and links are connected.
            corosync-cfgtool -s
            ```

            The file replicates automatically across the cluster and corosync
            reloads when it sees the higher config_version. If a node does not
            come back, roll back from `/root/corosync.conf.bak`.
        - id: bash
          desc: |
            **Using a Bash Script**

            Patch a working copy of `corosync.conf`, bump `config_version`,
            and activate the result with one copy. Run on a single node.

            **Quorum-loss warning:** This rewrites the live
            `/etc/pve/corosync.conf` and can drop cluster quorum if the result
            is wrong. Run it only on a healthy, quorate cluster. The script
            keeps a backup at `/root/corosync.conf.bak`; if quorum drops after
            the change, restore it with
            `cp /root/corosync.conf.bak /etc/pve/corosync.conf`. After it runs,
            confirm every node with `corosync-cfgtool -s`:

            ```bash
            #!/bin/bash
            set -e

            src=/etc/pve/corosync.conf
            work=/root/corosync.conf.new

            cp "$src" /root/corosync.conf.bak
            cp "$src" "$work"

            current=$(awk '/^[[:space:]]*config_version:/ {print $2}' "$work")
            next=$((current + 1))

            python3 - "$work" "$next" <<'PY'
            import re, sys
            path, next_ver = sys.argv[1], sys.argv[2]
            with open(path) as fh:
                text = fh.read()
            for key, value in (('transport', 'knet'), ('crypto_cipher', 'aes256'), ('crypto_hash', 'sha256')):
                if re.search(rf'^\s*{key}:', text, re.M):
                    text = re.sub(rf'^\s*{key}:.*$', f'  {key}: {value}', text, flags=re.M)
                else:
                    text = re.sub(r'(totem\s*\{)', rf'\1\n  {key}: {value}', text, count=1)
            text = re.sub(r'^(\s*)config_version:.*$', rf'\g<1>config_version: {next_ver}', text, flags=re.M)
            with open(path, 'w') as fh:
                fh.write(text)
            PY

            cp "$work" "$src"
            echo "Updated config_version to $next; corosync reloads and replicates the change."
            echo "Verify every node reloaded and links are connected:"
            corosync-cfgtool -s
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stage the change in a working copy and
            activate it in one step (run once against any node).

            **Quorum-loss warning:** This task overwrites the live
            `/etc/pve/corosync.conf` on a running cluster, which can drop quorum
            if the result is invalid. Run it only against a healthy, quorate
            cluster, and after the run confirm each node with
            `corosync-cfgtool -s`. The playbook saves a backup at
            `/root/corosync.conf.bak` so you can roll back with
            `cp /root/corosync.conf.bak /etc/pve/corosync.conf` if a node fails
            to rejoin:

            ```yaml
            ---
            - name: Enforce Corosync knet encryption
              hosts: proxmox[0]
              become: true

              tasks:
                - name: Back up the live corosync.conf for rollback
                  ansible.builtin.copy:
                    src: /etc/pve/corosync.conf
                    dest: /root/corosync.conf.bak
                    remote_src: true

                - name: Stage a working copy of corosync.conf
                  ansible.builtin.copy:
                    src: /etc/pve/corosync.conf
                    dest: /root/corosync.conf.new
                    remote_src: true

                - name: Read current config_version
                  ansible.builtin.shell: awk '/^\s*config_version:/ {print $2}' /root/corosync.conf.new
                  register: config_version
                  changed_when: false

                - name: Set encrypted knet transport in the working copy
                  ansible.builtin.lineinfile:
                    path: /root/corosync.conf.new
                    regexp: '^\s*transport:'
                    line: '  transport: knet'
                    insertafter: 'totem \{'

                - name: Set crypto cipher in the working copy
                  ansible.builtin.lineinfile:
                    path: /root/corosync.conf.new
                    regexp: '^\s*crypto_cipher:'
                    line: '  crypto_cipher: aes256'
                    insertafter: '^\s*transport:'

                - name: Set crypto hash in the working copy
                  ansible.builtin.lineinfile:
                    path: /root/corosync.conf.new
                    regexp: '^\s*crypto_hash:'
                    line: '  crypto_hash: sha256'
                    insertafter: '^\s*crypto_cipher:'

                - name: Bump config_version in the working copy
                  ansible.builtin.replace:
                    path: /root/corosync.conf.new
                    regexp: '^(\s*config_version:\s*).*$'
                    replace: '\g<1>{{ (config_version.stdout | int) + 1 }}'

                - name: Activate the new configuration in one step
                  ansible.builtin.command: cp /root/corosync.conf.new /etc/pve/corosync.conf
                  changed_when: true
            ```

  - uid: mondoo-proxmox-security-migration-is-encrypted
    title: Ensure live migration traffic is encrypted
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a11
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    refs:
      - title: CWE-319 Cleartext Transmission of Sensitive Information
        url: https://cwe.mitre.org/data/definitions/319.html
    mql: |
      file("/etc/pve/datacenter.cfg").content.contains("type=secure") ||
      file("/etc/pve/datacenter.cfg").content.contains("migration: secure")
    docs:
      desc: |
        This check verifies that live migration sends guest memory through an encrypted tunnel.

        The setting lives in `/etc/pve/datacenter.cfg` as `migration: type=secure` and is applied under Datacenter, then Options, then Migration Settings, or with `pvesh set /cluster/options --migration type=secure`. Proxmox VE 8 and later default to secure when the value is absent, but earlier releases do not, so setting it explicitly makes the behavior identical everywhere.

        **Why this matters**

        A live migration streams the entire contents of a guest's RAM from one node to another while the guest keeps running. That memory holds whatever the workload is holding: private keys in use by a web server, database contents in the page cache, session tokens, decrypted credentials, and the guest's own disk encryption keys. Insecure migration sends all of it over TCP in the clear.

        Anyone with a capture point on the migration network therefore gets a complete memory image of a live production system without touching the guest, without authenticating to anything, and without leaving a trace in the guest's logs. Migrations are also predictable events, triggered by maintenance and by cluster rebalancing, so an attacker who is already positioned on that segment only has to wait.

        Insecure mode exists because it is faster, and it is commonly enabled to speed up evacuating a node during maintenance and then left that way. The performance argument also assumes the migration network is isolated, which stops being true as soon as a guest interface is placed on it by mistake.

        Secure migration tunnels the stream over SSH, which costs CPU on both nodes. Where that cost matters, spend it anyway and give migration its own physically separate network rather than turning the encryption off.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Open **Datacenter**, then select the **Options** panel.
        3. Review the **Migration Settings** entry and confirm the type is set to **secure**.

        A passing result shows the migration type set to secure; a failing result shows it set to insecure or left unset.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        pvesh get /cluster/options --output-format json | grep -i migration
        ```

        A passing result shows the migration type reported as `secure`; a failing result shows `insecure` or no explicit migration type.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Force secure migration cluster-wide:

            ```bash
            pvesh set /cluster/options --migration type=secure
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Set the option and verify the resulting datacenter configuration:

            ```bash
            #!/bin/bash
            set -e

            pvesh set /cluster/options --migration type=secure
            grep -E '^migration:' /etc/pve/datacenter.cfg
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to enforce secure migration:

            ```yaml
            ---
            - name: Enforce encrypted live migration
              hosts: proxmox
              become: true
              run_once: true

              tasks:
                - name: Set migration type to secure
                  ansible.builtin.command: pvesh set /cluster/options --migration type=secure
                  changed_when: true
            ```

  # =================================================================
  # Network Segmentation
  # =================================================================

  - uid: mondoo-proxmox-security-vlans-are-in-use
    title: Ensure VLAN segmentation is used
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-06
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-7
    refs:
      - title: CWE-923 Improper Restriction of Communication Channel
        url: https://cwe.mitre.org/data/definitions/923.html
      - title: BSI SYS.1.5 Virtualisation
        url: https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Grundschutz/IT-GS-Kompendium/IT_Grundschutz_Kompendium_Edition2023.pdf
    mql: |
      files.find(from: "/etc/pve/qemu-server", regex: "[0-9]+.conf$", type: "file").list.any(
        file(_.path).content.contains("tag=")
      ) ||
      files.find(from: "/etc/pve/lxc", regex: "[0-9]+.conf$", type: "file").list.any(
        file(_.path).content.contains("tag=")
      )
    docs:
      desc: |
        This check verifies that guest network interfaces are placed on tagged VLANs rather than all sharing one flat segment.

        A VLAN tag appears as `tag=<vlan>` on a `netN:` line in a guest configuration under `/etc/pve/qemu-server` or `/etc/pve/lxc`, and as the VLAN Tag field on the network device in the guest's Hardware or Network panel. It is set with `qm set` or `pct set` while keeping the existing bridge, MAC address, and firewall flag intact, and it requires the underlying bridge to be VLAN-aware in `/etc/network/interfaces`.

        **Why this matters**

        Untagged guests all land in the same broadcast domain on the bridge, which puts every workload on the node at layer 2 with every other one. That means a compromised guest does not need to route anywhere to reach its neighbors: it ARPs for them and talks to them directly. It can also poison those ARP caches and put itself in the middle of traffic between two other guests, and it sees their broadcast and multicast traffic, which leaks hostnames, service discovery announcements, and often authentication chatter.

        The blast radius is what makes it serious on a hypervisor. Development and production workloads, a public-facing web server and the database it is not supposed to be able to reach directly, and workloads belonging to different tenants all sit on the same wire. One compromised guest is a foothold adjacent to everything else the node runs.

        Tagging puts a boundary the bridge itself enforces between those groups, so reaching another segment requires passing through a router where policy can be applied.

        Tagging alone does not filter anything within a segment; pair it with the per-interface firewall that companion checks in this policy cover. And plan the change carefully, since moving a running guest to a tagged interface breaks its connectivity until the corresponding VLAN exists on the physical switch.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Select a VM or container in the resource tree, then open its **Hardware** or **Network** panel.
        3. Review each network device and confirm a **VLAN Tag** is assigned where segmentation is intended.

        A passing result shows guest network devices carrying VLAN tags; a failing result shows guests with no VLAN tags applied.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -lE 'tag=[0-9]+' /etc/pve/qemu-server/[0-9]*.conf /etc/pve/lxc/[0-9]*.conf
        ```

        A passing result lists guest config files that include a `tag=` value; a failing result returns no output, indicating no VLAN segmentation is in use.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Read the current interface definition first, then re-set it with
            all existing values kept and `tag=<vlan>` appended. Reusing the
            existing MAC address is essential, because a new MAC disrupts the
            guest's network configuration:

            ```bash
            qm config <vmid> | grep '^net'
            qm set <vmid> --net0 virtio=<current-mac>,bridge=vmbr0,firewall=1,tag=<vlan>

            pct config <ctid> | grep '^net'
            pct set <ctid> --net0 name=eth0,bridge=vmbr0,hwaddr=<current-mac>,firewall=1,tag=<vlan>
            ```

            Make sure the underlying bridge is configured as VLAN-aware in
            `/etc/network/interfaces`.
        - id: bash
          desc: |
            **Using a Bash Script**

            Print every untagged VM and container interface so an operator can
            assign the correct VLAN per workload:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            echo "Untagged VM interfaces:"
            for conf in /etc/pve/qemu-server/[0-9]*.conf; do
              vmid=$(basename "$conf" .conf)
              while IFS= read -r line; do
                if [[ "$line" != *tag=* ]]; then
                  echo "  VM $vmid: $line"
                fi
              done < <(grep '^net[0-9]\+:' "$conf")
            done

            echo "Untagged container interfaces:"
            for conf in /etc/pve/lxc/[0-9]*.conf; do
              ctid=$(basename "$conf" .conf)
              while IFS= read -r line; do
                if [[ "$line" != *tag=* ]]; then
                  echo "  CT $ctid: $line"
                fi
              done < <(grep '^net[0-9]\+:' "$conf")
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to append a VLAN tag to a specific guest
            interface while keeping every existing setting, including the MAC
            address. Apply it per workload with the VLAN ID that matches your
            network design:

            ```yaml
            ---
            - name: Apply a VLAN tag to a Proxmox guest interface
              hosts: proxmox
              become: true
              vars:
                vmid: 100
                interface: net0
                vlan_tag: 20

              tasks:
                - name: Append the VLAN tag to the existing interface settings
                  ansible.builtin.shell: |
                    set -e
                    spec=$(qm config {{ vmid }} | awk -F': ' '/^{{ interface }}:/ {print $2}')
                    case "$spec" in
                      *tag=*) exit 0 ;;
                    esac
                    qm set {{ vmid }} --{{ interface }} "$spec,tag={{ vlan_tag }}"
                  changed_when: true
            ```

  # =================================================================
  # Storage & Backup Encryption
  # =================================================================

  - uid: mondoo-proxmox-security-pbs-encryption-is-enabled
    title: Ensure backup archives are encrypted at rest
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a28
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-171: nist-sp-800-171--3-8-9
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    refs:
      - title: CWE-311 Missing Encryption of Sensitive Data
        url: https://cwe.mitre.org/data/definitions/311.html
      - title: Proxmox Backup Server Encryption
        url: https://pbs.proxmox.com/docs/backup-client.html#encryption
    mql: |
      proxmox.storages.all( backups == empty || backups.all( encrypted == true ) )
    docs:
      desc: |
        This check verifies that the backup archives actually present on each storage were written encrypted.

        It inspects the encryption state of the backup volumes themselves rather than only confirming that a key is configured, because a key added to a storage today does nothing for the archives written before it. Attach a client-side key with `pvesm set <storage> --encryption-key autogen`, which writes it to `/etc/pve/priv/storage/<storage>.enc` without a passphrase so unattended jobs can use it. A storage holding no backup archives passes, since there is nothing unencrypted to find.

        **Why this matters**

        A backup archive is a complete copy of a guest: its disks, its configuration, and for a snapshot with memory, its RAM. Everything the running workload protects with access controls is present in that file as ordinary bytes. Whoever can read the datastore reads the database, the private keys, and the credential files of every guest that has ever been backed up, without needing any access to the running systems.

        Datastores are unusually exposed for something holding that much. They are frequently on a different host, at a different site, on shared or rented storage, or replicated offsite, which multiplies the number of administrators, providers, and physical locations that could reach the raw files. An attacker who cannot get into a hardened production cluster will happily settle for the backup server that copies it every night.

        Encrypting client-side means the PVE node encrypts before the data leaves it, so the datastore and everyone with access to it hold ciphertext only.

        The key becomes the single point of failure the moment you enable this. Back up every key under `/etc/pve/priv/storage/` to somewhere outside the cluster, and configure a master key as a companion check in this policy requires, so losing one key does not cost you the restore.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Open **Datacenter**, then expand a node and select the backup storage.
        3. Open the **Backups** tab and review the **Encrypted** column for the listed archives.

        A passing result shows every archive marked as encrypted; a failing result shows at least one archive that is not.

        ### Audit via CLI

        Run the command on a cluster node to list every backup archive on every storage together with its encryption state:

        ```bash
        node=$(hostname)
        for s in $(pvesm status --content backup | awk 'NR > 1 {print $1}'); do
          pvesh get "/nodes/$node/storage/$s/content" --content backup --output-format json |
            jq -r --arg s "$s" '.[] | "\($s) \(.volid) encrypted=\(.encrypted // false)"'
        done
        ```

        A passing result reports `encrypted=true` for every archive; a failing result reports an archive with `encrypted=false`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Let Proxmox generate and attach a client-side encryption key for
            the PBS storage. The key is created without a passphrase, which is
            required for unattended backups, and stored at
            `/etc/pve/priv/storage/<storage>.enc`:

            ```bash
            pvesm set <storage> --encryption-key autogen
            ```

            Back up the generated key file somewhere safe. Without the key,
            existing backups are unrecoverable.
        - id: bash
          desc: |
            **Using a Bash Script**

            Generate and attach an encryption key for every PBS storage that
            does not have one:

            ```bash
            #!/bin/bash
            set -e

            while IFS= read -r storage; do
              key="/etc/pve/priv/storage/${storage}.enc"
              if [ -s "$key" ]; then
                echo "$storage already has an encryption key at $key"
                continue
              fi
              echo "Generating encryption key for storage $storage"
              pvesm set "$storage" --encryption-key autogen
            done < <(awk '/^pbs:/ {print $2}' /etc/pve/storage.cfg)

            echo "Back up every key under /etc/pve/priv/storage/ offline; without a key its backups are unrecoverable."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to ensure every PBS storage has an
            encryption key generated by Proxmox itself:

            ```yaml
            ---
            - name: Ensure PBS storages use client-side encryption
              hosts: proxmox
              become: true

              tasks:
                - name: Read PBS storage IDs
                  ansible.builtin.shell: awk '/^pbs:/ {print $2}' /etc/pve/storage.cfg
                  register: pbs_storages
                  changed_when: false

                - name: Generate an encryption key per storage when missing
                  ansible.builtin.shell: |
                    set -e
                    key=/etc/pve/priv/storage/{{ item }}.enc
                    if [ ! -s "$key" ]; then
                      pvesm set {{ item }} --encryption-key autogen
                    fi
                  loop: "{{ pbs_storages.stdout_lines }}"
            ```

  - uid: mondoo-proxmox-security-pbs-master-key-is-configured
    title: Ensure PBS master key is configured
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a28
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-20
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      file("/etc/pve/storage.cfg").content.contains("pbs:") == false ||
      files.find(from: "/etc/pve/priv/storage", regex: ".master.pem$", type: "file").list.length > 0
    docs:
      desc: |
        This check verifies that every attached Proxmox Backup Server datastore has a master key registered.

        When a PBS storage is defined in `/etc/pve/storage.cfg`, its master public key is stored as `/etc/pve/priv/storage/<storage-id>.master.pem` and is set from the storage's Encryption settings or with `pvesm set <storage> --master-pubkey`. The key pair is created by `proxmox-backup-client key create-master-key`; the public half stays on the cluster and the private half belongs in offline storage. A cluster with no PBS storage configured passes, since there is nothing to protect.

        **Why this matters**

        Client-side backup encryption is done with a key held on the PVE node. If that key is lost, the encrypted backups are mathematically unrecoverable, and the situations that destroy the key are exactly the situations where you need the backups: a node whose root filesystem is gone, a cluster rebuilt from scratch, or ransomware that encrypted or wiped `/etc/pve/priv` along with everything else.

        Ransomware operators specifically target backup infrastructure and the credentials that reach it, because a victim who can restore does not pay. A backup set that only the compromised cluster can decrypt provides no leverage against that; deleting one key on a host they already own destroys every restore point at once.

        The master key breaks that dependency. Each backup's encryption key is additionally wrapped to the master public key, so an operator holding the offline private half can decrypt any archive without the original client key and without the cluster that made it.

        The control only works if the private half genuinely lives offline. Generating the pair and leaving the private key on the node it protects satisfies the file check while providing none of the recovery value, so move it to offline custody, delete it from the node, and test a restore from it before you rely on it.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Open **Datacenter**, then select **Storage** and choose the Proxmox Backup Server entry.
        3. Review the **Encryption** settings and confirm a master public key is configured.

        A passing result shows a master key assigned to every PBS storage; a failing result shows a PBS storage with no master key.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        for s in $(awk '/^pbs:/ {print $2}' /etc/pve/storage.cfg); do test -s "/etc/pve/priv/storage/$s.master.pem" && echo "$s: master key set" || echo "$s: NO MASTER KEY"; done
        ```

        A passing result reports an existing `.master.pem` file for every PBS storage; a failing result reports a PBS storage with no master key file.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Create a master key pair and attach the public half. The key files
            are written to the current directory.

            The `proxmox-backup-client` command is not installed on a base PVE
            node. Install it first with
            `apt-get update && apt-get install -y proxmox-backup-client`, or
            create the master key on the PBS host and copy only the public half
            to the PVE node:

            ```bash
            cd /root || exit
            proxmox-backup-client key create-master-key
            pvesm set <storage> --master-pubkey /root/master-public.pem
            ```

            Move `/root/master-private.pem` to offline storage and then delete
            it from the node. It is required to recover encrypted backups.
        - id: bash
          desc: |
            **Using a Bash Script**

            Generate the master key pair once and install the public half on
            every PBS storage that lacks one. The private key is kept on disk
            until the operator moves it offline:

            ```bash
            #!/bin/bash
            set -e

            keydir=/root/pbs-master-key
            mkdir -p "$keydir"
            chmod 0700 "$keydir"

            if [ ! -s "$keydir/master-public.pem" ]; then
              (cd "$keydir" && proxmox-backup-client key create-master-key)
            fi

            while IFS= read -r storage; do
              dest="/etc/pve/priv/storage/${storage}.master.pem"
              if [ -s "$dest" ]; then
                echo "$storage already has a master pubkey at $dest"
                continue
              fi
              pvesm set "$storage" --master-pubkey "$keydir/master-public.pem"
              echo "Installed master pubkey for $storage"
            done < <(awk '/^pbs:/ {print $2}' /etc/pve/storage.cfg)

            echo
            echo "Move $keydir/master-private.pem to offline storage and then delete it from this node."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to register a previously generated master
            public key with every PBS storage. The corresponding private key
            must already live offline; it is never created by Ansible. The
            `pvesm` command writes the key into `/etc/pve/priv/storage/` with
            the correct ownership itself:

            ```yaml
            ---
            - name: Attach PBS master public key to every PBS storage
              hosts: proxmox
              become: true
              vars:
                master_pubkey_path: /root/master-public.pem

              tasks:
                - name: Read PBS storage IDs
                  ansible.builtin.shell: awk '/^pbs:/ {print $2}' /etc/pve/storage.cfg
                  register: pbs_storages
                  changed_when: false

                - name: Register master public key with each PBS storage
                  ansible.builtin.command: >-
                    pvesm set {{ item }} --master-pubkey {{ master_pubkey_path }}
                  loop: "{{ pbs_storages.stdout_lines }}"
                  changed_when: true
            ```

