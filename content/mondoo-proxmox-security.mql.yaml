policies:
  - uid: mondoo-proxmox-security
    name: Mondoo Proxmox VE Security
    version: 1.1.5
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: linux,debian,proxmox
    authors:
      - name: Nico Pfeifer
        email: 99395643+langen1x@users.noreply.github.com
    require:
      - provider: os
      - provider: proxmox
    summary: Secure Proxmox Virtual Environment hypervisor, VM, and container configurations
    docs:
      desc: |
        The Mondoo Proxmox VE Security policy identifies critical misconfigurations on Proxmox Virtual Environment hypervisors that could leave your virtualization platform vulnerable to attackers. This policy helps organizations detect and remediate hardening gaps before they can be exploited, reducing the likelihood of unauthorized hypervisor access, VM and container escape, lateral movement across guests, and disruption of every workload running on the host.

        This policy runs alongside the [Mondoo Linux Security](mondoo-linux-security.mql.yaml) policy, which covers the underlying Debian OS hardening. Checks already covered by the Linux baseline are not duplicated here.

        This policy provides security checks across key Proxmox VE areas:

        - **Proxmox access control**: Two-factor authentication, Administrator role assignment, `user.cfg` permissions, Proxmox-adapted SSH root login
        - **Account security**: Empty password detection, UID 0 account validation
        - **Proxmox firewall**: Cluster firewall enablement, default DROP policy, per-node firewall, rule presence
        - **TLS certificates**: Self-signed certificate detection, expiration monitoring
        - **LXC container security**: Unprivileged containers, nesting, AppArmor, per-interface firewall, mknod and FUSE restrictions, resource limits
        - **QEMU/KVM VM security**: Spectre and Meltdown mitigations, per-interface firewall, raw QEMU argument restrictions
        - **Cluster and migration**: Corosync encryption, live migration encryption
        - **Network segmentation**: VLAN usage across VMs and containers
        - **Storage and backup encryption**: Proxmox Backup Server encryption, master key configuration
        - **Proxmox-specific hardening**: KSM disable, PCI ACS override prevention, IOMMU, auditd watches on `/etc/pve/`
        - **ANSSI-BP-028 kernel hardening**: Unprivileged BPF, `kexec_load`, `perf_event_paranoid`, TTY line discipline autoload, TCP RFC 1337, user namespaces
        - **Password policy**: `login.defs` extensions including PASS_MAX_DAYS, PASS_MIN_DAYS, and ENCRYPT_METHOD
        - **Cron security**: Permissions on `/etc/crontab`, `/etc/cron.d`, `/etc/cron.hourly`

        ## References

        - [CIS Debian Linux Benchmark](https://www.cisecurity.org/benchmark/debian_linux)
        - [ANSSI-BP-028 Linux Hardening Guide](https://cyber.gouv.fr/sites/default/files/document/linux_configuration-en-v2.0.pdf)
        - [BSI SYS.1.5 Virtualisation](https://www.bsi.bund.de/)
        - [Proxmox VE Administration Guide](https://pve.proxmox.com/pve-docs/pve-admin-guide.html)
        - [Proxmox VE Firewall Documentation](https://pve.proxmox.com/wiki/Firewall)

        Learn more about scanning Proxmox VE in the [cnspec Proxmox VE documentation](https://mondoo.com/docs/cnspec/cloud/proxmox).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    scoring_system: highest impact

    groups:
      - title: "Proxmox Access Control"
        filters: |
          file("/etc/pve/datacenter.cfg").exists
        checks:
          - uid: mondoo-proxmox-security-tfa-is-configured
          - uid: mondoo-proxmox-security-admin-role-is-not-overused
          - uid: mondoo-proxmox-security-user-cfg-permissions
          - uid: mondoo-proxmox-security-ssh-root-login-is-key-only
          - uid: mondoo-proxmox-security-ssh-password-auth-is-disabled

      - title: "Account Security"
        filters: |
          file("/etc/shadow").exists
        checks:
          - uid: mondoo-proxmox-security-no-uid-zero-aside-from-root
          - uid: mondoo-proxmox-security-no-empty-passwords

      - title: "Proxmox Firewall"
        filters: |
          file("/etc/pve/datacenter.cfg").exists
        checks:
          - uid: mondoo-proxmox-security-cluster-firewall-is-enabled
          - uid: mondoo-proxmox-security-firewall-default-policy-is-drop
          - uid: mondoo-proxmox-security-node-firewall-is-enabled
          - uid: mondoo-proxmox-security-firewall-has-rules

      - title: "Proxmox TLS Certificates"
        filters: |
          file("/etc/pve/local/pve-ssl.pem").exists
        checks:
          - uid: mondoo-proxmox-security-cert-is-not-selfsigned
          - uid: mondoo-proxmox-security-cert-is-not-expiring

      - title: "LXC Container Security"
        filters: |
          file("/etc/pve/lxc").exists
        checks:
          - uid: mondoo-proxmox-security-ct-all-unprivileged
          - uid: mondoo-proxmox-security-ct-nesting-is-disabled
          - uid: mondoo-proxmox-security-ct-apparmor-is-enforced
          - uid: mondoo-proxmox-security-ct-firewall-is-enabled
          - uid: mondoo-proxmox-security-ct-no-mknod
          - uid: mondoo-proxmox-security-ct-no-fuse
          - uid: mondoo-proxmox-security-ct-memory-limit-is-set

      - title: "QEMU/KVM VM Security"
        filters: |
          file("/etc/pve/qemu-server").exists
        checks:
          - uid: mondoo-proxmox-security-vm-spectre-mitigations
          - uid: mondoo-proxmox-security-vm-firewall-is-enabled
          - uid: mondoo-proxmox-security-vm-no-raw-qemu-args

      - title: "Cluster & Migration"
        filters: |
          file("/etc/pve/corosync.conf").exists
        checks:
          - uid: mondoo-proxmox-security-corosync-is-encrypted
          - uid: mondoo-proxmox-security-migration-is-encrypted

      - title: "Network Segmentation"
        filters: |
          file("/etc/pve/qemu-server").exists || file("/etc/pve/lxc").exists
        checks:
          - uid: mondoo-proxmox-security-vlans-are-in-use

      - title: "Storage & Backup Encryption"
        filters: |
          file("/etc/pve/storage.cfg").exists
        checks:
          - uid: mondoo-proxmox-security-pbs-master-key-is-configured

      # Checks in this group read the Proxmox VE API rather than the node
      # filesystem, so they run against a `cnspec scan proxmox` asset instead
      # of the Debian host that every other group in this policy targets.
      - title: "Proxmox API Backup Encryption"
        filters: |
          asset.platform == "proxmox"
        checks:
          - uid: mondoo-proxmox-security-pbs-encryption-is-enabled

      - title: "Proxmox-specific Hardening"
        filters: |
          file("/etc/pve/datacenter.cfg").exists
        checks:
          - uid: mondoo-proxmox-security-ksm-is-disabled
          - uid: mondoo-proxmox-security-no-pci-acs-override
          - uid: mondoo-proxmox-security-iommu-is-enabled
          - uid: mondoo-proxmox-security-auditd-watches-pve-directory
          - uid: mondoo-proxmox-security-update-repo-is-configured
          - uid: mondoo-proxmox-security-automatic-updates-are-enabled

      - title: "ANSSI-BP-028 Kernel Hardening"
        filters: |
          file("/etc/pve/datacenter.cfg").exists
        checks:
          - uid: mondoo-proxmox-security-unprivileged-bpf-disabled
          - uid: mondoo-proxmox-security-kexec-load-disabled
          - uid: mondoo-proxmox-security-perf-event-paranoid
          - uid: mondoo-proxmox-security-tty-ldisc-autoload-disabled
          - uid: mondoo-proxmox-security-tcp-rfc1337-enabled
          - uid: mondoo-proxmox-security-user-namespace-unprivileged

      - title: "Password Policy"
        filters: |
          file("/etc/login.defs").exists
        checks:
          - uid: mondoo-proxmox-security-login-defs-pass-max-days
          - uid: mondoo-proxmox-security-login-defs-pass-min-days
          - uid: mondoo-proxmox-security-login-defs-encrypt-method

      - title: "Cron Security"
        filters: |
          file("/etc/crontab").exists
        checks:
          - uid: mondoo-proxmox-security-crontab-permissions
          - uid: mondoo-proxmox-security-cron-d-permissions
          - uid: mondoo-proxmox-security-cron-hourly-permissions

queries:
  # =================================================================
  # Proxmox Access Control
  # =================================================================

  - uid: mondoo-proxmox-security-tfa-is-configured
    title: Ensure two-factor authentication is configured
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a5
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-4-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    refs:
      - title: CWE-308 Use of Single-factor Authentication
        url: https://cwe.mitre.org/data/definitions/308.html
      - title: Proxmox VE Two-Factor Authentication
        url: https://pve.proxmox.com/wiki/User_Management#pveum_tfa_auth
    mql: |
      file("/etc/pve/priv/tfa.cfg") {
        exists
        size > 10
      }
    docs:
      desc: |
        This check verifies that at least one administrator has enrolled a second authentication factor on the cluster.

        Proxmox VE records enrolled factors in `/etc/pve/priv/tfa.cfg`, a file on the cluster filesystem that every node shares. An administrator enrolls one under Datacenter, then Permissions, then Two Factor, choosing TOTP, WebAuthn, or a YubiKey, and a realm can be set to require a factor under Datacenter, then Permissions, then Realms. The check passes when `tfa.cfg` exists and holds more than 10 bytes, the point at which a real enrollment is present rather than an empty placeholder.

        **Why this matters**

        A fresh install accepts a password alone. Whoever holds one administrator password reaches the web interface on port 8006 and, from there, the console of every VM and container in the cluster. They can attach an installer ISO to a guest and boot it, open a root shell on the node through the built-in shell, read any guest disk directly from the host, or delete the backups that would let you recover. The guests believe they are isolated from one another; the person holding that password is standing on the other side of that boundary looking at all of them at once.

        Password-only management is also the first thing an automated credential-stuffing run finds. The interface answers from any network that can route to the node, so a password that leaked from an unrelated service gets tried here within hours of appearing in a dump.

        Enrolling one administrator satisfies this check without protecting the rest. Pair it with a realm-level requirement so every account must enroll before it can authenticate, and store recovery keys somewhere that does not depend on the cluster still being reachable.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. Go to Datacenter, then Permissions, then Two Factor.
        3. Confirm that administrative users have an enrolled TOTP, WebAuthn, or YubiKey factor.
        4. Go to Datacenter, then Permissions, then Realms, open each realm, and confirm a required TFA type is set.

        A passing result shows enrolled second factors for administrators and a TFA requirement on the realm; a failing result shows no enrolled factors and no realm-level TFA enforcement.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        test -s /etc/pve/priv/tfa.cfg && wc -c /etc/pve/priv/tfa.cfg
        ```

        A passing result shows the file exists with more than 10 bytes of content; an empty or missing file means no two-factor authentication is configured.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Require a time-based one-time password factor on each authentication
            realm so every user must enrol a token at their next login.

            **Verify the command surface for your PVE 8.x version first.** The
            realm-level `--tfa type=oath` form and the per-user TFA verbs have
            changed across Proxmox VE releases. Before applying, confirm the
            exact flags and subcommands for your version with
            `pveum realm modify --help` and `pveum user --help` (and check the
            `/access/tfa` API path with `pvesh ls /access/tfa`). Substitute the
            verified commands for the examples below if they differ:

            ```bash
            pveum realm modify pam --tfa type=oath
            pveum realm modify pve --tfa type=oath
            ```

            Realm enforcement alone does not create any token. Each user must
            enrol a factor, which writes an entry to `/etc/pve/priv/tfa.cfg`.
            Enrolment is done in the web interface: open Datacenter, then
            Permissions, then Two Factor, select Add, then TOTP, and scan the
            QR code with an authenticator app. To list enrolled factors, use the
            verb confirmed for your PVE 8.x version (for example query the TFA
            API with `pvesh get /access/tfa`):

            ```bash
            pvesh get /access/tfa
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Enforce TOTP enrolment on every authentication realm and verify the
            resulting `tfa.cfg`:

            ```bash
            #!/bin/bash
            set -e

            while IFS= read -r realm; do
              echo "Requiring TOTP enrolment on realm $realm"
              pveum realm modify "$realm" --tfa type=oath
            done < <(pveum realm list --output-format json | jq -r '.[].realm')

            if [ ! -s /etc/pve/priv/tfa.cfg ]; then
              echo "WARNING: /etc/pve/priv/tfa.cfg is empty - users must still enrol TFA tokens in the web interface" >&2
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to require TOTP enrolment on every realm.
            Users must still enrol their individual tokens in the web interface:

            ```yaml
            ---
            - name: Enforce two-factor authentication on Proxmox realms
              hosts: proxmox
              become: true

              tasks:
                - name: List Proxmox realms
                  ansible.builtin.command: pveum realm list --output-format json
                  register: pve_realms
                  changed_when: false

                - name: Require TOTP enrolment on each realm
                  ansible.builtin.command: "pveum realm modify {{ item.realm }} --tfa type=oath"
                  loop: "{{ pve_realms.stdout | from_json }}"
                  loop_control:
                    label: "{{ item.realm }}"
            ```

  - uid: mondoo-proxmox-security-admin-role-is-not-overused
    title: Ensure the Administrator role is assigned sparingly
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a12
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    refs:
      - title: CWE-269 Improper Privilege Management
        url: https://cwe.mitre.org/data/definitions/269.html
      - title: Proxmox VE User Management
        url: https://pve.proxmox.com/wiki/User_Management
    mql: |
      file("/etc/pve/user.cfg").content.lines.where(_ == /Administrator/).length <= 3
    docs:
      desc: |
        This check verifies that no more than three access control entries grant the built-in Administrator role.

        The cluster access control list lives in `/etc/pve/user.cfg` and is printed by `pveum acl list`. The Administrator role carries every privilege at whatever path it is granted on, and granted at `/` that is the entire datacenter. This check counts the entries in `user.cfg` that name the role and passes when at most three exist, treating a handful of deliberate break-glass grants as acceptable and a long list as drift.

        **Why this matters**

        Each Administrator grant is a complete copy of the cluster. Someone who takes over one of those accounts can create a user in any realm, revoke everyone else's access, attach another tenant's guest disk to a VM they control and read it, run commands on the node through the web shell, and delete the backup jobs that would undo the damage. There is no smaller blast radius to fall back to, because the role does not stop at a node, a pool, or a storage.

        Broad grants also destroy attribution. When ten people hold the same unrestricted role, a deleted VM or a loosened firewall rule cannot be traced to a person without reading task logs by hand, and a misused account looks exactly like ordinary work.

        Scoped roles cover nearly every real job. PVEVMAdmin on a pool path lets an operator run guests without touching storage or users, PVEDatastoreAdmin covers backup and storage work, and PVEAuditor gives read-only visibility for monitoring and audit. Move each principal to the narrowest role that fits, delete the Administrator entry at `/`, and keep the remaining grants few enough that every one of them has a named owner.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. Go to Datacenter, then Permissions.
        3. Review each access control entry and note which principals hold the Administrator role.

        A passing result shows the Administrator role assigned to a small number of trusted principals; a failing result shows the role granted broadly where scoped roles would suffice.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        pveum acl list
        ```

        A passing result lists at most a few entries that grant the Administrator role; a failing result shows many subjects holding it instead of least-privilege roles.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            List existing ACL entries and the principals that hold the
            `Administrator` role:

            ```bash
            pveum acl list
            grep -E '[:,]Administrator[,:]' /etc/pve/user.cfg
            ```

            Replace `Administrator` with a least-privilege role for a given
            subject by deleting the over-broad ACL and re-adding a scoped role:

            ```bash
            pveum acl delete / --users <user>@<realm> --roles Administrator
            pveum acl modify /vms --users <user>@<realm> --roles PVEVMAdmin
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Print every ACL entry that grants `Administrator` so an operator can
            review and downgrade them:

            ```bash
            #!/bin/bash
            set -e

            echo "Subjects holding the Administrator role:"
            grep -E '[:,]Administrator[,:]' /etc/pve/user.cfg || echo "  (none)"

            cat <<'EOF'

            Review each entry above. For every subject that does not need full
            cluster-wide control, delete the Administrator ACL and replace it
            with a scoped role such as PVEVMAdmin, PVEDatastoreAdmin, or PVEAuditor:

              pveum acl delete <path> --users <user>@<realm> --roles Administrator
              pveum acl modify <scoped-path> --users <user>@<realm> --roles <scoped-role>
            EOF
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to revoke the `Administrator` role from a
            specific user and grant a scoped replacement:

            ```yaml
            ---
            - name: Reduce Proxmox Administrator role usage
              hosts: proxmox
              become: true
              vars:
                pve_user: "alice@pve"
                pve_scope: "/vms"
                pve_scoped_role: "PVEVMAdmin"

              tasks:
                - name: Revoke Administrator on the cluster root
                  ansible.builtin.command: "pveum acl delete / --users {{ pve_user }} --roles Administrator"
                  register: revoke
                  changed_when: revoke.rc == 0
                  failed_when: revoke.rc not in [0, 2]

                - name: Grant a scoped role instead
                  ansible.builtin.command: "pveum acl modify {{ pve_scope }} --users {{ pve_user }} --roles {{ pve_scoped_role }}"
            ```

  - uid: mondoo-proxmox-security-user-cfg-permissions
    title: Ensure /etc/pve/user.cfg is not world-readable
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    refs:
      - title: CWE-732 Incorrect Permission Assignment for Critical Resource
        url: https://cwe.mitre.org/data/definitions/732.html
    mql: |
      mount.list.one(path == "/etc/pve")
      file("/etc/pve/user.cfg") {
        permissions.other_readable == false
      }
    docs:
      desc: |
        This check verifies that the cluster user database is readable only by root and the Proxmox API service.

        `/etc/pve/user.cfg` enumerates every user, group, API token, and access control entry in the cluster. It lives on the Proxmox cluster filesystem mounted at `/etc/pve`, which owns the file root:www-data with mode 0640 and does not allow those permissions to be changed. The check confirms both that `/etc/pve` is a cluster filesystem mount and that `user.cfg` grants no read bit to other.

        **Why this matters**

        Because the cluster filesystem enforces the mode itself, a failing result almost always means something more serious than a loose permission: `/etc/pve` is not mounted, the pve-cluster service is down, and the scanner is reading a plain directory on the root filesystem. A node in that state is not participating in the cluster, its configuration is stale, and the copy of `user.cfg` sitting underneath the mount point can be edited by anyone with root on that one host without the change ever replicating or being noticed.

        Where the file genuinely is world-readable, any local account, including one belonging to a compromised service, reads the identity model of the whole cluster: which principals exist, which realm each authenticates against, which hold Administrator, and which API tokens have been issued. That turns a foothold in an unprivileged service account into a target list, and the attacker goes after the specific accounts whose compromise gives them the hypervisor rather than guessing.

        Fix it by restoring the cluster filesystem with `systemctl enable --now pve-cluster` and confirming with `findmnt /etc/pve` rather than by running chmod, which the mount will not honor.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        stat -c '%U:%G %a' /etc/pve/user.cfg
        ```

        A passing result shows ownership root:www-data and a mode such as 640 with no read bit for other; a failing result shows a mode whose final digit grants read access, for example 644.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            The Proxmox cluster filesystem mounted at `/etc/pve` enforces
            ownership root:www-data and mode 0640 on `user.cfg` and does not
            allow those permissions to be changed. A failing result therefore
            means `/etc/pve` is not mounted by the cluster filesystem and the
            scanner saw a plain directory on the root filesystem. Restore the
            cluster filesystem service:

            ```bash
            findmnt /etc/pve
            systemctl enable --now pve-cluster
            stat -c '%U:%G %a' /etc/pve/user.cfg
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Verify the cluster filesystem is mounted and start it when it is not:

            ```bash
            #!/bin/bash
            set -e

            if findmnt /etc/pve >/dev/null; then
              echo "/etc/pve is mounted by pmxcfs; permissions are enforced as root:www-data 0640."
              exit 0
            fi

            echo "/etc/pve is not a pmxcfs mount; starting pve-cluster"
            systemctl enable --now pve-cluster
            findmnt /etc/pve
            stat -c '%U:%G %a %n' /etc/pve/user.cfg
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to ensure the cluster filesystem service
            is running, which enforces the correct permissions on `user.cfg`:

            ```yaml
            ---
            - name: Ensure the Proxmox cluster filesystem is mounted
              hosts: proxmox
              become: true

              tasks:
                - name: Ensure pve-cluster is enabled and running
                  ansible.builtin.systemd:
                    name: pve-cluster
                    state: started
                    enabled: true

                - name: Verify /etc/pve is a pmxcfs mount
                  ansible.builtin.command: findmnt /etc/pve
                  changed_when: false
            ```

  - uid: mondoo-proxmox-security-ssh-root-login-is-key-only
    title: Ensure SSH root login is key-only (Proxmox-adapted)
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a5
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    refs:
      - title: CWE-522 Insufficiently Protected Credentials
        url: https://cwe.mitre.org/data/definitions/522.html
      - title: Proxmox VE Cluster SSH Requirements
        url: https://pve.proxmox.com/wiki/Cluster_Manager#_preparation
    mql: |
      sshd.config.params["PermitRootLogin"].in(["prohibit-password", "without-password", "forced-commands-only"])
    docs:
      desc: |
        This check verifies that root can log in over SSH with a key but never with a password.

        Proxmox VE uses root SSH between nodes for cluster operations and live migration, so the Linux baseline value of `PermitRootLogin no` would break the cluster. The Proxmox-adapted requirement is `PermitRootLogin prohibit-password` in `/etc/ssh/sshd_config`, and the check also accepts the older synonym `without-password` and the stricter `forced-commands-only`. Set the value, validate with `sshd -t`, and reload the service; confirm a working root key first or you will lock yourself out.

        **Why this matters**

        With password login permitted, root on a Proxmox node is the single most valuable password in the environment and it is exposed to anything that can reach port 22. Automated guessing runs against root continuously, and there is no account lockout by default, so the attacker gets unlimited attempts against a target whose username they already know.

        One successful guess is total. Root on a node reads `/etc/pve/priv`, which holds the cluster authentication key and any storage encryption keys; it reads and writes every guest disk on local storage directly; it starts a shell inside any container with `pct enter`; and because the cluster filesystem replicates, a configuration change made there propagates to the other nodes. The guests never see any of this happen.

        Key-only root access keeps corosync, migration, and node management working exactly as before while removing the guessable path entirely. Pair it with a companion check in this policy that disables password authentication for all accounts, since `prohibit-password` constrains root alone.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        sshd -T | grep -i permitrootlogin
        ```

        A passing result shows permitrootlogin set to prohibit-password, without-password, or forced-commands-only; a failing result shows yes, which allows password-based root login.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Set `PermitRootLogin prohibit-password` and reload sshd. Make sure
            you have a working SSH key for root before reloading or you will
            lock yourself out:

            ```bash
            sed -i -E 's|^[#[:space:]]*PermitRootLogin[[:space:]].*|PermitRootLogin prohibit-password|' /etc/ssh/sshd_config
            grep -q '^PermitRootLogin' /etc/ssh/sshd_config || echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config
            sshd -t
            systemctl reload ssh
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Enforce `PermitRootLogin prohibit-password`, validate the resulting
            config, and reload sshd:

            ```bash
            #!/bin/bash
            set -e

            config=/etc/ssh/sshd_config
            if grep -qE '^[#[:space:]]*PermitRootLogin' "$config"; then
              sed -i -E 's|^[#[:space:]]*PermitRootLogin[[:space:]].*|PermitRootLogin prohibit-password|' "$config"
            else
              echo 'PermitRootLogin prohibit-password' >> "$config"
            fi

            sshd -t
            systemctl reload ssh
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set `PermitRootLogin prohibit-password`
            and reload sshd:

            ```yaml
            ---
            - name: Set Proxmox-compatible SSH root login policy
              hosts: proxmox
              become: true

              tasks:
                - name: Set PermitRootLogin to prohibit-password
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '^[#\s]*PermitRootLogin\s+'
                    line: 'PermitRootLogin prohibit-password'
                    validate: '/usr/sbin/sshd -t -f %s'
                  notify: Reload sshd

              handlers:
                - name: Reload sshd
                  ansible.builtin.service:
                    name: ssh
                    state: reloaded
            ```

  - uid: mondoo-proxmox-security-ssh-password-auth-is-disabled
    title: Ensure SSH password authentication is disabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a5
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    refs:
      - title: CWE-521 Weak Password Requirements
        url: https://cwe.mitre.org/data/definitions/521.html
    mql: |
      sshd.config.params["PasswordAuthentication"] == "no"
    docs:
      desc: |
        This check verifies that the SSH daemon rejects password logins for every account, not just root.

        Debian-based systems ship with password authentication on, and Proxmox VE inherits that default. The requirement is `PasswordAuthentication no` in `/etc/ssh/sshd_config`, applied with a reload of the service after `sshd -t` validates the file. Confirm that every administrator has a working key installed before reloading.

        **Why this matters**

        An SSH service that accepts passwords answers guesses from anywhere it is reachable, at whatever rate the attacker chooses. Usernames on a Proxmox node are not secret: root exists, and the service accounts created by installed packages are predictable. A password reused from a breach elsewhere, or one weak enough to appear in a wordlist, is tried and works on the first pass.

        A shell on the node is a shell underneath every guest. From there an attacker copies the disk image of any VM on local storage, enters any container, reads the cluster private keys under `/etc/pve/priv`, and adds their own key to `authorized_keys` so the access survives a password change. Nothing in the guest operating systems detects this, because the compromise happened at a layer they cannot see.

        Turning password authentication off leaves key-based login as the only route, and a key cannot be guessed or phished the way a password can. Keep console or IPMI access available for recovery before you make the change, since a node with no valid keys and no passwords is reachable only from its physical or out-of-band console.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        sshd -T | grep -i passwordauthentication
        ```

        A passing result shows passwordauthentication no; a failing result shows passwordauthentication yes.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Disable password authentication and reload sshd. Verify SSH key
            login works for every administrator before reloading:

            ```bash
            sed -i -E 's|^[#[:space:]]*PasswordAuthentication[[:space:]].*|PasswordAuthentication no|' /etc/ssh/sshd_config
            grep -q '^PasswordAuthentication' /etc/ssh/sshd_config || echo 'PasswordAuthentication no' >> /etc/ssh/sshd_config
            sshd -t
            systemctl reload ssh
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Set `PasswordAuthentication no` and reload sshd after validating the config:

            ```bash
            #!/bin/bash
            set -e

            config=/etc/ssh/sshd_config
            if grep -qE '^[#[:space:]]*PasswordAuthentication' "$config"; then
              sed -i -E 's|^[#[:space:]]*PasswordAuthentication[[:space:]].*|PasswordAuthentication no|' "$config"
            else
              echo 'PasswordAuthentication no' >> "$config"
            fi

            sshd -t
            systemctl reload ssh
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to disable SSH password authentication:

            ```yaml
            ---
            - name: Disable SSH password authentication
              hosts: proxmox
              become: true

              tasks:
                - name: Set PasswordAuthentication to no
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '^[#\s]*PasswordAuthentication\s+'
                    line: 'PasswordAuthentication no'
                    validate: '/usr/sbin/sshd -t -f %s'
                  notify: Reload sshd

              handlers:
                - name: Reload sshd
                  ansible.builtin.service:
                    name: ssh
                    state: reloaded
            ```

  # =================================================================
  # Account Security
  # =================================================================

  - uid: mondoo-proxmox-security-no-uid-zero-aside-from-root
    title: Ensure root is the only UID 0 account
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-i-access-control-unique-user-identification
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    refs:
      - title: CWE-250 Execution with Unnecessary Privileges
        url: https://cwe.mitre.org/data/definitions/250.html
    mql: |
      users.where(uid == 0).list.all(name == "root")
    docs:
      desc: |
        This check verifies that root is the only account on the node with UID 0.

        UID 0 is what the kernel checks, not the account name. Any entry in `/etc/passwd` whose third field is 0 has full superuser authority regardless of what it is called, and a clean Proxmox node has exactly one such entry. Review the accounts with `awk -F: '($3 == 0) {print $1}' /etc/passwd`, then reassign an offender with `usermod -u <new-uid>` or remove it with `userdel`.

        **Why this matters**

        A second UID 0 account is one of the oldest and quietest persistence mechanisms there is. An attacker who reaches root once adds an innocuous-looking account, gives it UID 0, and then logs in through the front door afterward. Nothing about the login looks unusual: the account has its own name, its own password or key, and its own home directory, and it survives a root password rotation because it is not root's password that gates it.

        On a hypervisor that means continued access to every guest. The account can read and copy VM disks, enter containers, and edit the cluster configuration under `/etc/pve`, and because it is a distinct identity, revoking root's key does nothing to it.

        It also breaks accountability in the other direction. Once two names map to the same authority, log lines and audit records attribute privileged actions to whichever name was used, and reconstructing who actually did something requires correlating sessions rather than reading a single field.

        A duplicate UID 0 is occasionally created by accident during a migration or an automation script rather than by an attacker. Confirm which case you are in before deleting anything, because removing a live service account can break the workloads that depend on it.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        awk -F: '($3 == 0) {print $1}' /etc/passwd
        ```

        A passing result lists only root; a failing result lists any additional account name with UID 0.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Identify offending accounts and reassign or delete them:

            ```bash
            awk -F: '($3 == 0 && $1 != "root") {print $1}' /etc/passwd

            # Reassign to an unused UID:
            usermod -u <new-uid> <username>
            chown -R <new-uid> /home/<username>

            # Or remove the account entirely if it is unused:
            userdel <username>
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Locate every non-root UID 0 account and prompt an operator to
            reassign or delete each one:

            ```bash
            #!/bin/bash
            set -e

            mapfile -t offenders < <(awk -F: '($3 == 0 && $1 != "root") {print $1}' /etc/passwd)
            if [ ${#offenders[@]} -eq 0 ]; then
              echo "No non-root UID 0 accounts found."
              exit 0
            fi

            echo "Non-root UID 0 accounts detected:"
            printf '  - %s\n' "${offenders[@]}"
            echo
            echo "Run 'usermod -u <new-uid> <name>' to reassign or 'userdel <name>' to remove."
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to fail when any non-root UID 0 account
            exists, so the runbook stops before any user is removed by mistake:

            ```yaml
            ---
            - name: Detect non-root UID 0 accounts
              hosts: proxmox
              become: true

              tasks:
                - name: Find non-root UID 0 accounts
                  ansible.builtin.shell: |
                    set -o pipefail
                    awk -F: '$3 == 0 && $1 != "root" {print $1}' /etc/passwd
                  register: uid_zero_accounts
                  changed_when: false

                - name: Fail if non-root UID 0 accounts exist
                  ansible.builtin.fail:
                    msg: "Non-root UID 0 accounts found: {{ uid_zero_accounts.stdout_lines }} - reassign or remove them"
                  when: uid_zero_accounts.stdout_lines | length > 0
            ```

  - uid: mondoo-proxmox-security-no-empty-passwords
    title: Ensure no password field is empty in /etc/shadow
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    refs:
      - title: CWE-258 Empty Password in Configuration File
        url: https://cwe.mitre.org/data/definitions/258.html
    mql: |
      file("/etc/shadow").content.lines.none(_ == /^[^:]+::/)
    docs:
      desc: |
        This check verifies that no account in `/etc/shadow` has an empty password field.

        The second colon-separated field of each line in `/etc/shadow` holds the password hash. When that field is empty, PAM treats the account as having no password at all and authenticates it with nothing supplied. Find affected accounts with `awk -F: '($2 == "") {print $1}' /etc/shadow` and lock each with `passwd -l`, or set a real password if the account is genuinely in use.

        **Why this matters**

        An empty hash is not a weak credential, it is the absence of one. Anything that consults PAM accepts the login: a console session, `su` from another account, and depending on the SSH configuration a remote session as well. An attacker who already has an unprivileged shell on the node, perhaps through a compromised service, uses `su` to step straight into the empty-password account without needing to guess anything, and if that account has sudo rights or belongs to a privileged group the step lands on root.

        On a Proxmox node the destination matters as much as the ease. A local session on the host is a session beneath every VM and container it runs, with direct access to guest disks on local storage and to the cluster configuration and keys under `/etc/pve`.

        Empty password fields usually arrive by accident, from an automated account creation that never set a hash or from a restore that truncated the file. Check whether each affected account is meant to exist before locking it, because some system accounts are intentionally non-login and should carry a locked hash such as an exclamation mark rather than nothing at all.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        awk -F: '($2 == "") {print $1}' /etc/shadow
        ```

        A passing result prints nothing; a failing result prints the name of any account whose password field is empty.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Identify accounts with an empty password field and lock them:

            ```bash
            awk -F: '($2 == "") {print $1}' /etc/shadow

            for user in $(awk -F: '($2 == "") {print $1}' /etc/shadow); do
              passwd -l "$user"
            done
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Lock every account whose `/etc/shadow` password field is empty:

            ```bash
            #!/bin/bash
            set -e

            mapfile -t empty < <(awk -F: '($2 == "") {print $1}' /etc/shadow)
            if [ ${#empty[@]} -eq 0 ]; then
              echo "No accounts with empty passwords."
              exit 0
            fi

            for user in "${empty[@]}"; do
              echo "Locking account: $user"
              passwd -l "$user"
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to lock every account that has an empty
            `/etc/shadow` password field:

            ```yaml
            ---
            - name: Lock accounts with empty passwords
              hosts: proxmox
              become: true

              tasks:
                - name: Find accounts with empty password fields
                  ansible.builtin.shell: |
                    set -o pipefail
                    awk -F: '($2 == "") {print $1}' /etc/shadow
                  register: empty_password_accounts
                  changed_when: false

                - name: Lock each empty-password account
                  ansible.builtin.user:
                    name: "{{ item }}"
                    password_lock: true
                  loop: "{{ empty_password_accounts.stdout_lines }}"
                  when: empty_password_accounts.stdout_lines | length > 0
            ```

  # =================================================================
  # Proxmox Firewall
  # =================================================================

  - uid: mondoo-proxmox-security-cluster-firewall-is-enabled
    title: Ensure cluster firewall is enabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    refs:
      - title: CWE-693 Protection Mechanism Failure
        url: https://cwe.mitre.org/data/definitions/693.html
      - title: Proxmox VE Firewall
        url: https://pve.proxmox.com/wiki/Firewall
    mql: |
      file("/etc/pve/firewall/cluster.fw") {
        exists
        content.lines.any(_ == /^enable:\s*1/)
      }
    docs:
      desc: |
        This check verifies that the datacenter-wide firewall is switched on.

        Proxmox VE keeps the cluster firewall configuration in `/etc/pve/firewall/cluster.fw`, and the master switch is the line `enable: 1` in its options section. It is set under Datacenter, then Firewall, then Options in the web interface, or with `pvesh set /cluster/firewall/options --enable 1`. Until it is on, nothing below it filters anything: node rules, per-VM rules, and per-container rules are all stored and all inert.

        **Why this matters**

        That inertness is the trap. Operators write per-guest rules, see them listed in the interface, and reasonably assume traffic is being filtered. With the datacenter switch off, every one of those rules is decoration, and the node's management surface is open to anything that can route to it: the web interface on port 8006, SSH, the corosync ports, and whatever the guests themselves expose.

        The management surface is the one that matters most. An attacker who reaches the web interface or SSH from an untrusted network is one credential away from the console of every guest, and a compromised guest on a flat network can reach its neighbors and the host's own services with nothing in the path to stop it.

        Enabling the firewall is disruptive if done carelessly. It blocks inbound traffic with only a built-in exception for the web interface and SSH from the local subnet, so administrators on any other network are cut off. Create enabled allow rules for your real management network first, keep an existing session open while you make the change, and have console or IPMI access ready in case the rules are wrong.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. Go to Datacenter, then Firewall, then Options.
        3. Confirm that Firewall is set to Yes.

        A passing result shows the cluster firewall enabled; a failing result shows it disabled.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        pvesh get /cluster/firewall/options --output-format json
        ```

        A passing result shows enable set to 1; a failing result shows enable set to 0 or absent.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Create enabled allow rules for your management networks first.
            Enabling the cluster firewall blocks inbound traffic to all hosts,
            with a built-in exception for the web UI and SSH from the local
            subnet only, so administrators on other networks are cut off
            without these rules.

            **Lockout warning:** Replace the `10.0.0.0/24` placeholder below
            with the real CIDR of the network you administer the cluster from
            before you run these commands. If you allow the wrong source and
            then enable the firewall, you lose web UI and SSH access to every
            node. Keep an existing session open until you confirm the new
            rules work.

            ```bash
            # Replace 10.0.0.0/24 with YOUR management network CIDR.
            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 22 \
              --source 10.0.0.0/24 --enable 1 --comment "Allow SSH from management"
            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 8006 \
              --source 10.0.0.0/24 --enable 1 --comment "Allow PVE Web UI from management"

            pvesh set /cluster/firewall/options --enable 1
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Seed enabled management allow rules, then enable the cluster
            firewall and verify it is active. Pass your real management CIDR as
            the first argument; the `10.0.0.0/24` default is only a placeholder
            and will lock out administrators on other networks if left
            unchanged:

            ```bash
            #!/bin/bash
            set -e

            mgmt_net="${1:-10.0.0.0/24}"

            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 22 \
              --source "$mgmt_net" --enable 1 --comment "Allow SSH from management"
            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 8006 \
              --source "$mgmt_net" --enable 1 --comment "Allow PVE Web UI from management"

            pvesh set /cluster/firewall/options --enable 1
            pvesh get /cluster/firewall/options --output-format json | jq '.enable'
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to create enabled management allow rules
            and then enable the cluster firewall:

            ```yaml
            ---
            - name: Enable Proxmox cluster firewall
              hosts: proxmox
              become: true
              run_once: true
              vars:
                management_cidr: "10.0.0.0/24"

              tasks:
                - name: Allow SSH from management network
                  ansible.builtin.command: >-
                    pvesh create /cluster/firewall/rules
                    --type in --action ACCEPT --proto tcp --dport 22
                    --source {{ management_cidr }} --enable 1
                    --comment "Allow SSH from management"
                  register: ssh_rule
                  changed_when: ssh_rule.rc == 0
                  failed_when: ssh_rule.rc not in [0, 2]

                - name: Allow PVE Web UI from management network
                  ansible.builtin.command: >-
                    pvesh create /cluster/firewall/rules
                    --type in --action ACCEPT --proto tcp --dport 8006
                    --source {{ management_cidr }} --enable 1
                    --comment "Allow PVE Web UI from management"
                  register: gui_rule
                  changed_when: gui_rule.rc == 0
                  failed_when: gui_rule.rc not in [0, 2]

                - name: Enable cluster firewall via pvesh
                  ansible.builtin.command: pvesh set /cluster/firewall/options --enable 1
                  changed_when: true
            ```

  - uid: mondoo-proxmox-security-firewall-default-policy-is-drop
    title: Ensure firewall default input policy is DROP
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    refs:
      - title: CWE-284 Improper Access Control
        url: https://cwe.mitre.org/data/definitions/284.html
    mql: |
      file("/etc/pve/firewall/cluster.fw") {
        exists
        content.lines.any(_ == /^policy_in:\s*DROP/)
      }
    docs:
      desc: |
        This check verifies that the cluster firewall drops inbound traffic that no rule explicitly permits.

        The default input policy is the line `policy_in: DROP` in `/etc/pve/firewall/cluster.fw`, set under Datacenter, then Firewall, then Options, or with `pvesh set /cluster/firewall/options --policy_in DROP`. The alternative, ACCEPT, inverts the model: everything is permitted unless a rule blocks it.

        **Why this matters**

        With an ACCEPT default, the firewall protects only what someone remembered to write a rule for. Every service the node starts is reachable the moment it binds, which on a hypervisor means the web interface, SSH, corosync, the storage daemons, and anything a package pulls in during an upgrade. A service that appears in a future release is exposed the day it is installed, without anyone deciding that it should be.

        That is how a management plane ends up reachable from a network nobody intended. An attacker scanning the subnet finds port 8006 answering, and from a successful login there they hold the console of every VM and container on the cluster and can read guest disks straight off host storage. The guests have no visibility into any of it.

        A DROP default reverses the burden. Nothing is reachable until someone writes a rule saying it should be, so the exposed surface equals the reviewed surface and stays that way across upgrades.

        This is the most dangerous change in this policy to apply carelessly. Once the policy is DROP, anything not covered by an enabled allow rule is silently discarded, including your own session. Create and verify the management allow rules first, keep a working session open through the switch, and make sure you can reach the node console or IPMI if you get it wrong.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. Go to Datacenter, then Firewall, then Options.
        3. Confirm that Input Policy is set to DROP.

        A passing result shows the input policy set to DROP; a failing result shows ACCEPT.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        pvesh get /cluster/firewall/options --output-format json
        ```

        A passing result shows policy_in set to DROP; a failing result shows policy_in set to ACCEPT or absent.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Create enabled allow rules for management traffic first, then set
            the default input policy to `DROP`. Setting `DROP` without enabled
            allow rules cuts off SSH and web UI access from non-local networks.

            **Lockout warning:** This is the most dangerous firewall change in
            this policy. Once the input policy is `DROP`, anything not covered
            by an enabled allow rule is silently dropped, including your own
            management session. Replace the `10.0.0.0/24` placeholder below
            with the real CIDR of the network you administer the cluster from,
            confirm the allow rules are present and enabled, and keep a working
            session open until you have verified access still works after the
            switch to `DROP`. If you are locked out, you must recover through
            the node console or IPMI.

            ```bash
            # Replace 10.0.0.0/24 with YOUR management network CIDR.
            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 22 \
              --source 10.0.0.0/24 --enable 1 --comment "Allow SSH from management"
            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 8006 \
              --source 10.0.0.0/24 --enable 1 --comment "Allow PVE Web UI from management"

            pvesh set /cluster/firewall/options --policy_in DROP
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Add explicit, enabled allow rules for management traffic, then flip
            the default policy to `DROP`. Pass your real management CIDR as the
            first argument; the `10.0.0.0/24` default is only a placeholder and
            will lock out administrators on other networks once the policy is
            `DROP`:

            ```bash
            #!/bin/bash
            set -e

            mgmt_net="${1:-10.0.0.0/24}"

            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 22 \
              --source "$mgmt_net" --enable 1 --comment "Allow SSH from management"
            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 8006 \
              --source "$mgmt_net" --enable 1 --comment "Allow PVE Web UI from management"

            pvesh set /cluster/firewall/options --policy_in DROP
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set the default input policy to `DROP`
            after creating enabled management allow rules:

            ```yaml
            ---
            - name: Set Proxmox cluster firewall default-deny inbound
              hosts: proxmox
              become: true
              run_once: true
              vars:
                management_cidr: "10.0.0.0/24"

              tasks:
                - name: Allow SSH from management network
                  ansible.builtin.command: >-
                    pvesh create /cluster/firewall/rules
                    --type in --action ACCEPT --proto tcp --dport 22
                    --source {{ management_cidr }} --enable 1
                    --comment "Allow SSH from management"
                  register: ssh_rule
                  changed_when: ssh_rule.rc == 0
                  failed_when: ssh_rule.rc not in [0, 2]

                - name: Allow PVE Web UI from management network
                  ansible.builtin.command: >-
                    pvesh create /cluster/firewall/rules
                    --type in --action ACCEPT --proto tcp --dport 8006
                    --source {{ management_cidr }} --enable 1
                    --comment "Allow PVE Web UI from management"
                  register: gui_rule
                  changed_when: gui_rule.rc == 0
                  failed_when: gui_rule.rc not in [0, 2]

                - name: Set default input policy to DROP
                  ansible.builtin.command: pvesh set /cluster/firewall/options --policy_in DROP
                  changed_when: true
            ```

  - uid: mondoo-proxmox-security-node-firewall-is-enabled
    title: Ensure host firewall is enabled on each node
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      files.find(from: "/etc/pve/nodes", regex: "host.fw$", type: "file").list.all(
        file(_.path).content.lines.any(_ == /^enable:\s*1/)
      )
    docs:
      desc: |
        This check verifies that every node in the cluster has its own host firewall switched on.

        Each node keeps its firewall options in `/etc/pve/nodes/<node>/host.fw`, and the switch is the line `enable: 1`. It is set per node under the node's Firewall, then Options panel, or with `pvesh set /nodes/<node>/firewall/options --enable 1`. This check reads every `host.fw` in the cluster and requires the setting on all of them, because enabling it on one node says nothing about the others.

        **Why this matters**

        A cluster is only as reachable as its most open member. Nodes are added at different times, sometimes by different people, and the one that joined during an incident or a capacity crunch is the one whose firewall was never turned on. It accepts inbound traffic that its peers drop, which means an attacker probing the management network finds one host answering on ports the rest refuse.

        That host is a full entry point, not a partial one. Its web interface and SSH front the same cluster as every other node, its local storage holds real guest disks, and the cluster filesystem replicates whatever configuration change is made there to everyone else. A guest compromised on the unprotected node also reaches further, since the traffic it emits is unfiltered at the host level.

        Uneven firewall state is hard to notice from the interface, because each node's setting is displayed on its own page rather than side by side. Check it across the cluster in one pass and enable it everywhere, and re-check after adding a node, since a new member starts with the firewall off.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. For each node, select it, then go to Firewall, then Options.
        3. Confirm that Firewall is set to Yes.

        A passing result shows the firewall enabled on every node; a failing result shows it disabled on one or more nodes.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        for node in $(pvesh get /nodes --output-format json | jq -r '.[].node'); do echo -n "$node: "; pvesh get /nodes/$node/firewall/options --output-format json | jq '.enable'; done
        ```

        A passing result shows enable set to 1 for every node; a failing result shows 0 or null for any node.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Enable the host firewall on every node in the cluster:

            ```bash
            for node in $(pvesh get /nodes --output-format json | jq -r '.[].node'); do
              pvesh set "/nodes/$node/firewall/options" --enable 1
            done
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Enable the host firewall on each cluster node and verify the
            resulting state:

            ```bash
            #!/bin/bash
            set -e

            for node in $(pvesh get /nodes --output-format json | jq -r '.[].node'); do
              echo "Enabling host firewall on $node"
              pvesh set "/nodes/$node/firewall/options" --enable 1
              pvesh get "/nodes/$node/firewall/options" --output-format json | jq '{node: "'"$node"'", enable: .enable}'
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to enable the host firewall on every node:

            ```yaml
            ---
            - name: Enable Proxmox per-node host firewall
              hosts: proxmox
              become: true

              tasks:
                - name: Enable host firewall on this node
                  ansible.builtin.command: "pvesh set /nodes/{{ ansible_hostname }}/firewall/options --enable 1"
                  changed_when: true
            ```

  - uid: mondoo-proxmox-security-firewall-has-rules
    title: Ensure at least one firewall rule is configured
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      file("/etc/pve/firewall/cluster.fw") {
        exists
        content.lines.any(_ == /^(IN|OUT|GROUP)/)
      }
    docs:
      desc: |
        This check verifies that the cluster firewall has at least one rule or security group defined.

        Rules live in `/etc/pve/firewall/cluster.fw` as lines beginning with IN, OUT, or GROUP, and are created under Datacenter, then Firewall, or with `pvesh create /cluster/firewall/rules`. A rule created without `--enable 1` is stored disabled and filters nothing, so count enabled rules rather than lines when you review the result.

        **Why this matters**

        An empty rule set means the firewall carries no intent of its own. Whatever happens to inbound traffic is whatever the default policy does, and nobody has written down which services are supposed to be reachable and from where. If the default is ACCEPT the node is open; if a companion check in this policy has moved it to DROP, the node is closed so completely that administrators on any network other than the local subnet lose access.

        Neither outcome is a decision. The point of a rule set is that reaching the web interface on port 8006 or SSH becomes an explicit, reviewable statement about a named source network, so that a reviewer can look at the configuration and say what should be able to reach the hypervisor. Without that, a change in the surrounding network silently changes the exposure of the cluster and no one notices.

        A populated rule set is also what makes the per-guest firewall usable. Security groups defined at the datacenter level are what individual VM and container interfaces attach to, so an empty cluster configuration usually means the per-guest rules are empty too, and the isolation between guests that the hypervisor is supposed to enforce is not being enforced anywhere.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. Go to Datacenter, then Firewall.
        3. Confirm that the Rules and Security Group lists contain at least one defined rule.

        A passing result shows one or more configured rules; a failing result shows an empty rule set.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        pvesh get /cluster/firewall/rules --output-format json | jq 'length'
        ```

        A passing result shows a count greater than 0; a failing result shows 0.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Create at least one explicit, enabled rule. Rules created without
            `--enable 1` are stored disabled and do not filter traffic. Adjust
            to match your environment:

            ```bash
            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 22 \
              --source 10.0.0.0/24 --enable 1 --comment "Allow SSH from management"

            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 8006 \
              --source 10.0.0.0/24 --enable 1 --comment "Allow PVE Web UI from management"
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Seed a baseline of enabled rules if none exists:

            ```bash
            #!/bin/bash
            set -e

            mgmt_net="${1:-10.0.0.0/24}"

            existing=$(pvesh get /cluster/firewall/rules --output-format json | jq 'length')
            if [ "$existing" -gt 0 ]; then
              echo "Cluster firewall already has $existing rule(s); leaving alone."
              exit 0
            fi

            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 22 \
              --source "$mgmt_net" --enable 1 --comment "Allow SSH from management"

            pvesh create /cluster/firewall/rules \
              --type in --action ACCEPT --proto tcp --dport 8006 \
              --source "$mgmt_net" --enable 1 --comment "Allow PVE Web UI from management"
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to create enabled baseline cluster
            firewall rules:

            ```yaml
            ---
            - name: Seed Proxmox cluster firewall rules
              hosts: proxmox
              become: true
              run_once: true
              vars:
                management_cidr: "10.0.0.0/24"

              tasks:
                - name: Allow SSH from management network
                  ansible.builtin.command: >-
                    pvesh create /cluster/firewall/rules
                    --type in --action ACCEPT --proto tcp --dport 22
                    --source {{ management_cidr }} --enable 1
                    --comment "Allow SSH from management"
                  register: ssh_rule
                  changed_when: ssh_rule.rc == 0
                  failed_when: ssh_rule.rc not in [0, 2]

                - name: Allow PVE Web UI from management network
                  ansible.builtin.command: >-
                    pvesh create /cluster/firewall/rules
                    --type in --action ACCEPT --proto tcp --dport 8006
                    --source {{ management_cidr }} --enable 1
                    --comment "Allow PVE Web UI from management"
                  register: gui_rule
                  changed_when: gui_rule.rc == 0
                  failed_when: gui_rule.rc not in [0, 2]
            ```

  # =================================================================
  # Proxmox TLS Certificates
  # =================================================================

  - uid: mondoo-proxmox-security-cert-is-not-selfsigned
    title: Ensure PVE uses a trusted TLS certificate (not cluster-internal CA)
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a26
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    refs:
      - title: CWE-295 Improper Certificate Validation
        url: https://cwe.mitre.org/data/definitions/295.html
      - title: Proxmox VE Certificate Management
        url: https://pve.proxmox.com/wiki/Certificate_Management
    mql: |
      file("/etc/pve/local/pveproxy-ssl.pem").exists
      command("openssl x509 -in /etc/pve/local/pveproxy-ssl.pem -noout -issuer").stdout.contains("Proxmox Virtual Environment") == false
    docs:
      desc: |
        This check verifies that the web interface presents a certificate issued by a trusted authority rather than by the cluster's own internal CA.

        A default install serves a certificate signed by an internal CA whose issuer contains the string Proxmox Virtual Environment. A custom certificate is installed as `/etc/pve/local/pveproxy-ssl.pem`, either uploaded under the node's System, then Certificates panel, or ordered automatically with `pvenode acme cert order` after registering an ACME account and setting the domain. The check requires that file to exist and its issuer not to be the internal CA.

        **Why this matters**

        Nobody trusts the internal CA, so every operator meets a full-page browser warning on the way to the management interface and learns to click through it. That habit is the vulnerability. Once clicking through is routine, an attacker who can position themselves on the path between an administrator and port 8006, through DNS poisoning, ARP spoofing, or a hostile network, presents their own certificate and gets the same reflexive click. They capture the administrator's password as it is typed, and with it the console of every guest on the cluster.

        The same warning also blocks automation cleanly, which pushes teams toward the worse fix. Backup scripts, monitoring, and Terraform runs fail on the untrusted chain, and the usual response is to disable verification entirely, which means those credentialed API sessions can be intercepted with no warning at all.

        A publicly trusted certificate makes the warning meaningful again: it appears only when something is actually wrong. Nodes that are unreachable from the internet cannot use HTTP-based ACME validation, so use a DNS-01 plugin or issue from an internal CA that your fleet already trusts, and make sure the renewal is automated so a companion check in this policy on expiry never fires.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. For a node, go to System, then Certificates.
        3. Inspect the certificate used for the API/web service and review its issuer.

        A passing result shows an issuer from a trusted public CA; a failing result shows an issuer of Proxmox Virtual Environment.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        openssl x509 -in /etc/pve/local/pve-ssl.pem -noout -issuer
        ```

        A passing result shows an issuer that does not contain Proxmox Virtual Environment; a failing result shows that string in the issuer.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Register an ACME account and order a Let's Encrypt certificate for
            this node, then restart the API proxy so it serves the new
            certificate:

            ```bash
            pvenode acme account register default <email>
            pvenode config set --acme domains=<fqdn>
            pvenode acme cert order
            systemctl restart pveproxy
            ```

            `--acme` takes a property string, so several domains are given as a
            semicolon-separated list. The per-domain form
            `pvenode config set --acmedomain0 <fqdn>` sets the same
            configuration one domain at a time and additionally accepts an
            `alias` and a validation `plugin`.
        - id: bash
          desc: |
            **Using a Bash Script**

            Drive the ACME workflow end to end:

            ```bash
            #!/bin/bash
            set -e

            email="${1:?usage: $0 <email> <fqdn>}"
            fqdn="${2:?usage: $0 <email> <fqdn>}"

            if ! pvenode acme account info default >/dev/null 2>&1; then
              pvenode acme account register default "$email"
            fi

            pvenode config set --acme "domains=$fqdn"
            pvenode acme cert order
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to register an ACME account and order a
            certificate per node:

            ```yaml
            ---
            - name: Issue ACME TLS certificate for Proxmox nodes
              hosts: proxmox
              become: true
              vars:
                acme_email: "ops@example.com"
                acme_fqdn: "{{ ansible_fqdn }}"

              tasks:
                - name: Register the default ACME account (idempotent)
                  ansible.builtin.shell: |
                    set -e
                    if ! pvenode acme account info default >/dev/null 2>&1; then
                      pvenode acme account register default "{{ acme_email }}"
                    fi
                  register: register_acct
                  changed_when: "'registered' in register_acct.stdout"

                - name: Configure ACME domains for this node
                  ansible.builtin.command: "pvenode config set --acme domains={{ acme_fqdn }}"

                - name: Order the TLS certificate
                  ansible.builtin.command: pvenode acme cert order
                  changed_when: true
            ```

  - uid: mondoo-proxmox-security-cert-is-not-expiring
    title: Ensure TLS certificate does not expire within 30 days
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a26
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    refs:
      - title: CWE-298 Improper Validation of Certificate Expiration
        url: https://cwe.mitre.org/data/definitions/298.html
    mql: |
      command("openssl x509 -in /etc/pve/local/pve-ssl.pem -checkend 2592000 -noout >/dev/null 2>&1 && echo valid || echo expiring").stdout.trim == "valid"
    docs:
      desc: |
        This check verifies that the node TLS certificate has more than 30 days of validity remaining.

        The certificate the API and web interface present is `/etc/pve/local/pve-ssl.pem`, and its remaining life is tested with `openssl x509 -checkend 2592000`, which is 30 days expressed in seconds. The cluster-CA-issued node certificate is regenerated with `pvecm updatecerts --force` followed by a restart of pveproxy; an ACME certificate is renewed with `pvenode acme cert renew --force`.

        **Why this matters**

        Certificate expiry on a hypervisor does not degrade gracefully. When it passes, the web interface stops loading, API clients refuse the connection, and the tooling that depends on that API stops with it: backup jobs that call the node, monitoring, and any automation that provisions or migrates guests. The guests keep running, but the ability to manage them, snapshot them, or move them off a failing node is gone until someone with shell access fixes the certificate.

        The failure also lands at the worst possible moment, because nothing warns you first. Expiry is discovered when a connection fails, which is often during an unrelated incident when the management interface is exactly what you need.

        Under pressure, the fastest workaround is to turn off certificate verification in the client, and that setting tends to stay off long after the certificate is renewed. From then on the API session is interceptable without any indication, which is a far worse position than the outage that prompted it.

        A 30-day window is a renewal buffer, not an alert threshold. Treat a failing result as work to schedule, and automate renewal so it does not recur; a companion check in this policy covers whether the certificate comes from a trusted authority in the first place.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. For a node, go to System, then Certificates.
        3. Review the valid-until date of the active API/web certificate.

        A passing result shows an expiry date more than 30 days away; a failing result shows expiry within 30 days or already passed.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        openssl x509 -in /etc/pve/local/pve-ssl.pem -checkend 2592000 -noout && echo valid || echo expiring
        ```

        A passing result prints valid; a failing result prints expiring.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Regenerate the cluster-CA-issued node certificate, which is the
            certificate this check inspects, and restart the API proxy:

            ```bash
            pvecm updatecerts --force
            systemctl restart pveproxy
            ```

            If the node also serves an ACME certificate that is close to
            expiry, renew it as well. `--force` renews even when expiry is more
            than 30 days away:

            ```bash
            pvenode acme cert renew --force
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Regenerate the node certificate when it is within 30 days of
            expiry, and renew any ACME certificate in the same window:

            ```bash
            #!/bin/bash
            set -e

            cert=/etc/pve/local/pve-ssl.pem

            if openssl x509 -in "$cert" -checkend 2592000 -noout >/dev/null 2>&1; then
              echo "Node certificate not yet within the renewal window."
            else
              echo "Node certificate expires within 30 days; regenerating via the cluster CA"
              pvecm updatecerts --force
              systemctl restart pveproxy
            fi

            proxy_cert=/etc/pve/local/pveproxy-ssl.pem
            if [ -s "$proxy_cert" ] && ! openssl x509 -in "$proxy_cert" -checkend 2592000 -noout >/dev/null 2>&1; then
              echo "Custom certificate expires within 30 days; renewing via ACME"
              pvenode acme cert renew --force
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to regenerate the node certificate when
            it is within 30 days of expiry:

            ```yaml
            ---
            - name: Renew expiring Proxmox TLS certificate
              hosts: proxmox
              become: true

              tasks:
                - name: Check whether pve-ssl.pem is within 30 days of expiry
                  ansible.builtin.command: openssl x509 -in /etc/pve/local/pve-ssl.pem -checkend 2592000 -noout
                  register: cert_check
                  failed_when: false
                  changed_when: false

                - name: Regenerate the node certificate via the cluster CA
                  ansible.builtin.command: pvecm updatecerts --force
                  when: cert_check.rc != 0
                  changed_when: true

                - name: Restart pveproxy to pick up the new certificate
                  ansible.builtin.systemd:
                    name: pveproxy
                    state: restarted
                  when: cert_check.rc != 0
            ```

  # =================================================================
  # LXC Container Security
  # =================================================================

  - uid: mondoo-proxmox-security-ct-all-unprivileged
    title: Ensure all LXC containers are unprivileged
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a22
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-3
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-3
    refs:
      - title: CWE-250 Execution with Unnecessary Privileges
        url: https://cwe.mitre.org/data/definitions/250.html
      - title: Proxmox VE Linux Container Security
        url: https://pve.proxmox.com/wiki/Linux_Container#_security_considerations
      - title: NIST SP 800-190 Container Security
        url: https://csrc.nist.gov/publications/detail/sp/800-190/final
    mql: |
      files.find(from: "/etc/pve/lxc", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.contains("unprivileged: 1")
      )
    docs:
      desc: |
        This check verifies that every LXC container on the node is unprivileged.

        A container is unprivileged only when its configuration file under `/etc/pve/lxc` contains the line `unprivileged: 1`. There is no in-place conversion: a privileged container must be backed up with `vzdump` and restored with `pct restore ... --unprivileged 1`. In the web interface the setting appears as Unprivileged container under the container's Options panel, and it is fixed at creation time.

        **Why this matters**

        In a privileged container, root inside the container is root on the host. The user namespace is not shifted, so UID 0 in the guest is UID 0 outside it, and the only thing standing between the two is the set of dropped capabilities, the AppArmor profile, and the seccomp filter. Every one of those is a software control on a shared kernel, and each has been bypassed before. A container escape in that configuration is not a step toward host compromise, it is host compromise, with immediate access to every other guest's disk and to the cluster keys under `/etc/pve`.

        The default works against you. A container config that omits the directive is privileged, so a container created by an older script, restored from an old backup, or built by a template that predates the default runs privileged without anyone choosing that.

        An unprivileged container maps its root to an unprivileged host UID, so the same escape lands as a normal user with no access to anything that matters.

        A few workloads genuinely need privileged mode, typically those that mount filesystems or manage devices from inside the container. Where that is unavoidable, treat the container as an extension of the host rather than an isolated guest: apply the same access controls and patching to it, and do not place untrusted workloads beside it.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. For each container, select it, then go to Options.
        3. Confirm that Unprivileged container is set to Yes.

        A passing result shows every container marked unprivileged; a failing result shows one or more privileged containers.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        for conf in /etc/pve/lxc/[0-9]*.conf; do grep -q '^unprivileged: 1' "$conf" || echo "privileged: $conf"; done
        ```

        A passing result prints nothing; a failing result names each container config that lacks unprivileged: 1.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Recreate any privileged container as unprivileged. There is no
            in-place conversion - back up, then restore with `--unprivileged 1`:

            ```bash
            vzdump <ctid> --storage local --compress zstd
            pct restore <new-ctid> /var/lib/vz/dump/vzdump-lxc-<ctid>-*.tar.zst \
              --unprivileged 1 --storage local-lvm
            pct start <new-ctid>
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Print the IDs of every privileged container so an operator can
            schedule recreation. The script is intentionally non-destructive:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/lxc/[0-9]*.conf; do
              ctid=$(basename "$conf" .conf)
              if ! grep -q '^unprivileged: 1' "$conf"; then
                echo "Container $ctid is privileged. Recreate it with:"
                echo "  vzdump $ctid --storage local --compress zstd"
                echo "  pct restore <new-ctid> <backup> --unprivileged 1 --storage <storage>"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to fail the run when any privileged
            container is detected, so the conversion can be scheduled
            explicitly per container:

            ```yaml
            ---
            - name: Detect privileged Proxmox LXC containers
              hosts: proxmox
              become: true

              tasks:
                - name: Find LXC config files
                  ansible.builtin.find:
                    paths: /etc/pve/lxc
                    patterns: "*.conf"
                  register: lxc_confs

                - name: Identify privileged containers
                  ansible.builtin.shell: |
                    if ! grep -q '^unprivileged: 1' "{{ item.path }}"; then
                      basename "{{ item.path }}" .conf
                    fi
                  loop: "{{ lxc_confs.files }}"
                  register: privileged_check
                  changed_when: false

                - name: Fail when any container is privileged
                  ansible.builtin.fail:
                    msg: "Privileged container detected: {{ item.stdout }} - back up and re-restore with --unprivileged 1"
                  loop: "{{ privileged_check.results }}"
                  when: item.stdout | length > 0
            ```

  - uid: mondoo-proxmox-security-ct-nesting-is-disabled
    title: Ensure container nesting is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a22
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    refs:
      - title: CWE-653 Improper Isolation or Compartmentalization
        url: https://cwe.mitre.org/data/definitions/653.html
    mql: |
      files.find(from: "/etc/pve/lxc", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.contains("nesting=1") == false
      )
    docs:
      desc: |
        This check verifies that no LXC container has the nesting feature enabled.

        Nesting appears as `nesting=1` on the `features:` line of a container configuration in `/etc/pve/lxc`, and as the Nesting checkbox under the container's Options, then Features panel. It is removed with `pct set <ctid> --features` listing the remaining features, or `pct set <ctid> --delete features` when nesting was the only one, followed by a restart of the container.

        **Why this matters**

        Nesting exists so that a container can run containers of its own, typically Docker or a second layer of LXC. To make that work, Proxmox relaxes the confinement: the guest gets a more permissive AppArmor profile, additional procfs and sysfs paths become writable inside it, and it may create its own user and mount namespaces. Each of those is a piece of kernel surface that the workload can now reach directly.

        On a shared kernel that surface is the boundary. A process inside the container that finds a flaw in a mount or namespace path it should never have been able to touch is attacking the same kernel that runs every other guest on the node, and success there gets it to the host rather than to a sandbox. The nested layer also hides activity from the outside: what runs inside the inner container does not appear in the node's process view the way a directly hosted workload does.

        Most workloads never need it. Where a team genuinely wants to run containers inside a container, the safer arrangement is usually a VM, which puts a hardware-enforced boundary rather than a relaxed profile between the nested workload and the host. If nesting must stay on for a specific container, keep it unprivileged and treat it as lower-trust than its neighbors.
      audit: |
        ### Audit via Web UI

        1. Log in to the Proxmox VE web interface.
        2. For each container, select it, then go to Options, then Features.
        3. Confirm that Nesting is not enabled.

        A passing result shows nesting disabled on every container; a failing result shows it enabled on one or more.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -l 'nesting=1' /etc/pve/lxc/[0-9]*.conf
        ```

        A passing result prints nothing; a failing result names each container config whose features line includes nesting=1.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Inspect the current feature list, then remove the option entirely
            when nesting was the only feature, or re-set the list without
            `nesting=1`. Restart the container to apply the change:

            ```bash
            pct config <ctid> | grep '^features:'

            # nesting was the only feature:
            pct set <ctid> --delete features

            # other features must be kept, for example keyctl:
            pct set <ctid> --features keyctl=1

            pct reboot <ctid>
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Rebuild the feature list of every container without `nesting=1`,
            using the supported `pct` interface:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/lxc/[0-9]*.conf; do
              ctid=$(basename "$conf" .conf)
              features=$(awk -F': ' '/^features:/ {print $2}' "$conf")
              case ",$features," in
                *,nesting=1,*) ;;
                *) continue ;;
              esac
              new=$(printf '%s\n' "$features" | tr ',' '\n' | grep -v '^nesting=1$' | paste -sd, -)
              if [ -z "$new" ]; then
                pct set "$ctid" --delete features
              else
                pct set "$ctid" --features "$new"
              fi
              echo "Removed nesting=1 from container $ctid; restart it to apply"
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to find every LXC config that enables
            nesting and rewrite the `features:` line without it:

            ```yaml
            ---
            - name: Disable nesting on Proxmox LXC containers
              hosts: proxmox
              become: true

              tasks:
                - name: Find LXC config files
                  ansible.builtin.find:
                    paths: /etc/pve/lxc
                    patterns: "*.conf"
                    contains: 'nesting=1'
                  register: nested_confs

                - name: Strip ",nesting=1" when it follows another feature
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '(^features:.*),nesting=1\b'
                    replace: '\1'
                  loop: "{{ nested_confs.files }}"

                - name: Strip "nesting=1," when it leads the features list
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '^(features:\s*)nesting=1,'
                    replace: '\1'
                  loop: "{{ nested_confs.files }}"

                - name: Remove an empty features line if nesting=1 was the only feature
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^features:\s*nesting=1\s*$'
                    state: absent
                  loop: "{{ nested_confs.files }}"
            ```

  - uid: mondoo-proxmox-security-ct-apparmor-is-enforced
    title: Ensure containers do not disable AppArmor
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a22
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    refs:
      - title: CWE-653 Improper Isolation or Compartmentalization
        url: https://cwe.mitre.org/data/definitions/653.html
    mql: |
      files.find(from: "/etc/pve/lxc", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.contains("apparmor.profile: unconfined") == false
      )
    docs:
      desc: |
        This check verifies that no LXC container runs with its AppArmor profile turned off.

        Proxmox applies a default AppArmor profile to every container. A configuration line reading `lxc.apparmor.profile: unconfined` in the container's file under `/etc/pve/lxc` removes it entirely. There is no web interface control for this, because it is a raw LXC directive added by hand; remove the line from the config and restart the container with `pct reboot`.

        **Why this matters**

        The AppArmor profile is one of the few controls that actually holds a container to the syscalls and paths it needs. It blocks writes into the host's procfs and sysfs, restricts mounts to a vetted set of filesystem types, and refuses the operations that container escapes are built out of. Unconfined does not weaken that, it deletes it, and what remains is the capability set and seccomp filter alone.

        In a privileged container, unconfined is close to giving the workload the host. Even in an unprivileged one it hands a process a much wider path to attack the kernel that every other guest on the node shares, and the payoff for succeeding is the host itself and, through it, the disks of neighboring guests.

        The change is quiet, which is what makes it worth checking for. The directive is one line in a config file, usually added while debugging a container that failed to mount something, and it survives reboots and migrations with nothing in the interface showing that this container is confined differently from the rest.

        If a container needs an operation the default profile denies, write a narrow custom profile for it rather than removing confinement, so that the exception is explicit and reviewable.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -l '^lxc.apparmor.profile:[[:space:]]*unconfined' /etc/pve/lxc/[0-9]*.conf
        ```

        A passing result prints nothing; a failing result names each container config that sets the AppArmor profile to unconfined.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Edit each `/etc/pve/lxc/<ctid>.conf` and delete any line that sets
            `lxc.apparmor.profile: unconfined`, then restart the container:

            ```bash
            sed -i '/^lxc\.apparmor\.profile:[[:space:]]*unconfined$/d' /etc/pve/lxc/<ctid>.conf
            pct reboot <ctid>
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Strip the unconfined profile directive from every container config
            and restart the affected containers:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/lxc/[0-9]*.conf; do
              ctid=$(basename "$conf" .conf)
              if grep -q '^lxc\.apparmor\.profile:[[:space:]]*unconfined' "$conf"; then
                sed -i '/^lxc\.apparmor\.profile:[[:space:]]*unconfined$/d' "$conf"
                echo "Restored AppArmor profile on container $ctid"
                pct reboot "$ctid" || true
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to remove `lxc.apparmor.profile:
            unconfined` from any container config:

            ```yaml
            ---
            - name: Re-enable AppArmor on Proxmox LXC containers
              hosts: proxmox
              become: true

              tasks:
                - name: Find LXC config files that disable AppArmor
                  ansible.builtin.find:
                    paths: /etc/pve/lxc
                    patterns: "*.conf"
                    contains: '^lxc\.apparmor\.profile:\s*unconfined'
                    use_regex: true
                  register: apparmor_confs

                - name: Remove unconfined AppArmor directive
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^lxc\.apparmor\.profile:\s*unconfined$'
                    state: absent
                  loop: "{{ apparmor_confs.files }}"
            ```

  - uid: mondoo-proxmox-security-ct-firewall-is-enabled
    title: Ensure container network interfaces have firewall enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      files.find(from: "/etc/pve/lxc", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.lines.where(_ == /^net[0-9]+:/).all(_.contains("firewall=1"))
      )
    docs:
      desc: |
        This check verifies that every container network interface has per-interface filtering turned on.

        Each `netN:` line in a container configuration under `/etc/pve/lxc` carries a `firewall=1` flag, shown as the Firewall checkbox on the device in the container's Network panel. Proxmox attaches its filter chain to a guest interface only when that flag is present. Re-set the interface with `pct set <ctid> -<netN>` keeping the existing bridge, name, MAC address, and VLAN tag, and adding `firewall=1`.

        **Why this matters**

        Without the flag, the interface is not merely unfiltered by its own rules; it is outside the enforcement path entirely. Cluster rules, node rules, and the container's own rule tab all fail to apply to it, so a rule set that looks correct in the interface has no effect on that guest's traffic.

        That is where lateral movement comes from. A container running an exposed application gets compromised, and instead of being confined to the ports its rules allow, it reaches every other guest on the bridge, the node's own management ports, the storage network, and any management interface that happens to share a VLAN. The other guests see a peer on their own segment, which is exactly what the firewall was supposed to prevent.

        Mixed state across containers is the usual condition rather than a rare one, because the flag defaults off on interfaces added through some automation paths and is easy to drop when re-setting an interface for an unrelated reason.

        Enabling the flag alone changes nothing unless the cluster firewall is on and rules exist; companion checks in this policy cover both. Enable filtering here so those rules have somewhere to land, and verify connectivity for the workload afterward, since traffic the rules do not permit now actually stops.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Select a container in the resource tree, then open its **Network** panel.
        3. Inspect each network device and confirm the **Firewall** column or device dialog shows the firewall enabled.

        A passing result shows every container network device with the firewall enabled; a failing result shows one or more devices with the firewall disabled.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        for c in /etc/pve/lxc/[0-9]*.conf; do echo "== $c =="; grep '^net[0-9]*:' "$c"; done
        ```

        A passing result shows `firewall=1` on every `netN` line; a failing result shows a `netN` line without `firewall=1` or with `firewall=0`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Re-set every interface with `firewall=1`. Replace `<ctid>` and
            `<netN>` with real values, and keep all of the other parameters
            (bridge, hwaddr, name, ip, vlan tag) intact:

            ```bash
            pct config <ctid> | grep '^net'
            pct set <ctid> -<netN> name=eth0,bridge=vmbr0,hwaddr=...,firewall=1
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Iterate over every container interface and re-issue `pct set` with
            `firewall=1` appended:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/lxc/[0-9]*.conf; do
              ctid=$(basename "$conf" .conf)
              while IFS= read -r line; do
                netname=${line%%:*}
                spec=${line#*: }
                if [[ "$spec" != *firewall=1* ]]; then
                  if [[ "$spec" == *firewall=0* ]]; then
                    new=${spec//firewall=0/firewall=1}
                  else
                    new="$spec,firewall=1"
                  fi
                  echo "Enabling firewall on container $ctid $netname"
                  pct set "$ctid" "-$netname" "$new"
                fi
              done < <(grep '^net[0-9]\+:' "$conf")
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to add `firewall=1` to every LXC `netN`
            line that is missing it:

            ```yaml
            ---
            - name: Enable per-interface firewall on Proxmox LXC containers
              hosts: proxmox
              become: true

              tasks:
                - name: Find LXC config files
                  ansible.builtin.find:
                    paths: /etc/pve/lxc
                    patterns: "*.conf"
                  register: lxc_confs

                - name: Replace firewall=0 with firewall=1
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '(^net\d+:.*?)firewall=0'
                    replace: '\1firewall=1'
                  loop: "{{ lxc_confs.files }}"

                - name: Append firewall=1 to interfaces missing the directive
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '^(net\d+:(?!.*firewall=).*)$'
                    replace: '\1,firewall=1'
                  loop: "{{ lxc_confs.files }}"
            ```

  - uid: mondoo-proxmox-security-ct-no-mknod
    title: Ensure containers do not allow mknod
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      files.find(from: "/etc/pve/lxc", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.contains("mknod=1") == false
      )
    docs:
      desc: |
        This check verifies that no LXC container is granted the `mknod` feature.

        The feature appears as `mknod=1` on the `features:` line of a container configuration in `/etc/pve/lxc`, and in the Features row of the container's Options panel. Proxmox leaves it off by default. Remove it with `pct set <ctid> --features` listing whatever should remain, or `pct set <ctid> --delete features` if it was the only one, then restart the container.

        **Why this matters**

        The feature lets processes inside the container create device nodes. A device node is a handle to a kernel driver, so being able to make one is being able to open a conversation with parts of the kernel that the container was never meant to reach. The classic escalation is to create a block device node matching the host's underlying disk and then read or write it directly, which reaches other guests' data without ever touching their filesystems, and to create character device nodes that talk to drivers with a weaker security history than the core syscall surface.

        Unprivileged containers restrict which nodes can actually be used, but the feature still widens what the workload can attempt against a kernel that every guest on the node shares. Combined with a privileged container or an unconfined AppArmor profile, it becomes a direct path from inside the guest to the host.

        Almost nothing needs it. Workloads that appear to require device creation usually need one specific device passed in from the host instead, which is done by binding that device into the container explicitly and leaves the rest of the device namespace out of reach. Prefer that arrangement, and where the feature genuinely must stay on, keep the container unprivileged and confined.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Select a container in the resource tree, then open its **Options** panel.
        3. Review the **Features** row and confirm `mknod` is not listed.

        A passing result shows the **Features** value without `mknod`; a failing result shows `mknod=1` among the enabled features.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -l 'mknod=1' /etc/pve/lxc/[0-9]*.conf
        ```

        A passing result returns no output; a failing result lists container config files that enable `mknod=1`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Inspect the current feature list, then remove the option entirely
            when mknod was the only feature, or re-set the list without
            `mknod=1`. Restart the container to apply the change:

            ```bash
            pct config <ctid> | grep '^features:'

            # mknod was the only feature:
            pct set <ctid> --delete features

            # other features must be kept, for example keyctl:
            pct set <ctid> --features keyctl=1

            pct reboot <ctid>
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Rebuild the feature list of every container without `mknod=1`,
            using the supported `pct` interface:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/lxc/[0-9]*.conf; do
              ctid=$(basename "$conf" .conf)
              features=$(awk -F': ' '/^features:/ {print $2}' "$conf")
              case ",$features," in
                *,mknod=1,*) ;;
                *) continue ;;
              esac
              new=$(printf '%s\n' "$features" | tr ',' '\n' | grep -v '^mknod=1$' | paste -sd, -)
              if [ -z "$new" ]; then
                pct set "$ctid" --delete features
              else
                pct set "$ctid" --features "$new"
              fi
              echo "Removed mknod=1 from container $ctid; restart it to apply"
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to remove `mknod=1` from container
            feature lists:

            ```yaml
            ---
            - name: Disable mknod on Proxmox LXC containers
              hosts: proxmox
              become: true

              tasks:
                - name: Find LXC config files with mknod enabled
                  ansible.builtin.find:
                    paths: /etc/pve/lxc
                    patterns: "*.conf"
                    contains: 'mknod=1'
                  register: mknod_confs

                - name: Strip ",mknod=1" when it follows another feature
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '(^features:.*),mknod=1\b'
                    replace: '\1'
                  loop: "{{ mknod_confs.files }}"

                - name: Strip "mknod=1," when it leads the features list
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '^(features:\s*)mknod=1,'
                    replace: '\1'
                  loop: "{{ mknod_confs.files }}"

                - name: Remove an empty features line if mknod=1 was the only feature
                  ansible.builtin.lineinfile:
                    path: "{{ item.path }}"
                    regexp: '^features:\s*mknod=1\s*$'
                    state: absent
                  loop: "{{ mknod_confs.files }}"
            ```

  - uid: mondoo-proxmox-security-ct-no-fuse
    title: Ensure containers do not allow FUSE mounts
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
