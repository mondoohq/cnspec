  - uid: mondoo-proxmox-security-ct-memory-limit-is-set
    title: Ensure all containers have a memory limit
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-02
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-6
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-4
      compliance/nist-csf-2: nist-csf-2-pr-ir-04
      compliance/nist-sp-800-171: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: false
    refs:
      - title: CWE-400 Uncontrolled Resource Consumption
        url: https://cwe.mitre.org/data/definitions/400.html
    mql: |
      files.find(from: "/etc/pve/lxc", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.lines.any(_ == /^memory:/)
      )
    docs:
      desc: |
        This check verifies that every LXC container has an explicit memory cap.

        The cap is the `memory:` line, expressed in MiB, in the container's configuration under `/etc/pve/lxc`. It is set from the container's Resources panel or with `pct set <ctid> --memory 1024`. A container whose config carries no such line has no limit of its own and can allocate until the host runs out.

        **Why this matters**

        Memory on a hypervisor is a shared, finite resource with no natural backstop. An uncapped container that leaks or is deliberately driven to allocate consumes the node's free memory, and once it is exhausted the kernel out-of-memory killer starts choosing victims. It does not choose the container that caused the problem; it chooses by a score that frequently lands on large, well-behaved neighbors. A single misbehaving guest can therefore take down the QEMU process of an unrelated VM, or a cluster service on the node, without ever escaping its own container.

        That is availability damage that a guest can inflict from inside its own boundary. When the workloads on a node belong to different teams or tenants, it is also a denial of service that one of them can aim at the others, deliberately or not, with nothing more than a memory allocation loop.

        The node's own management path degrades in the same event. When memory pressure reaches the host, the tools you need to diagnose and stop the offender are competing for the memory it is consuming.

        Size the limit from the workload's real usage with headroom, not from what is available, and set a swap value deliberately as well. A cap that is too tight relocates the out-of-memory kill inside the container, which is the correct place for it but still an outage for that workload.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Select a container in the resource tree, then open its **Resources** panel.
        3. Confirm the **Memory** entry shows a defined value rather than being unset.

        A passing result shows a configured memory value for every container; a failing result shows a container with no memory limit assigned.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        for c in /etc/pve/lxc/[0-9]*.conf; do grep -q '^memory:' "$c" || echo "no memory limit: $c"; done
        ```

        A passing result returns no output; a failing result lists container config files that lack a `memory:` directive.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Set an appropriate memory limit per container (in MiB):

            ```bash
            pct set <ctid> --memory 1024
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Apply a default memory cap of 1 GiB to every container that has no
            limit configured:

            ```bash
            #!/bin/bash
            set -e

            default_memory_mib=${1:-1024}

            shopt -s nullglob
            for conf in /etc/pve/lxc/[0-9]*.conf; do
              ctid=$(basename "$conf" .conf)
              if ! grep -q '^memory:' "$conf"; then
                echo "Setting memory=${default_memory_mib} on container $ctid"
                pct set "$ctid" --memory "$default_memory_mib"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to apply a default memory limit to any
            container that does not have one:

            ```yaml
            ---
            - name: Enforce memory limits on Proxmox LXC containers
              hosts: proxmox
              become: true
              vars:
                default_memory_mib: 1024

              tasks:
                - name: Find LXC config files
                  ansible.builtin.find:
                    paths: /etc/pve/lxc
                    patterns: "*.conf"
                  register: lxc_confs

                - name: Detect missing memory directive
                  ansible.builtin.shell: |
                    grep -q '^memory:' "{{ item.path }}" || basename "{{ item.path }}" .conf
                  loop: "{{ lxc_confs.files }}"
                  register: missing_memory
                  changed_when: false

                - name: Apply default memory limit
                  ansible.builtin.command: "pct set {{ item.stdout }} --memory {{ default_memory_mib }}"
                  loop: "{{ missing_memory.results }}"
                  when: item.stdout | length > 0
            ```

  # =================================================================
  # QEMU/KVM VM Security
  # =================================================================

  - uid: mondoo-proxmox-security-vm-spectre-mitigations
    title: Ensure VMs have Spectre/Meltdown CPU mitigations
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a23
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-5
    refs:
      - title: CVE-2017-5753 Spectre Variant 1
        url: https://nvd.nist.gov/vuln/detail/CVE-2017-5753
      - title: CVE-2017-5715 Spectre Variant 2
        url: https://nvd.nist.gov/vuln/detail/CVE-2017-5715
      - title: CVE-2018-3639 Speculative Store Bypass
        url: https://nvd.nist.gov/vuln/detail/CVE-2018-3639
    mql: |
      files.find(from: "/etc/pve/qemu-server", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.lines.where(_ == /^cpu:/).all(
          _ == /[,=;]\+?spec-ctrl\b/ || _ == /[,=;]\+?ssbd\b/
        )
      )
    docs:
      desc: |
        This check verifies that each VM's CPU configuration exposes the speculative-execution mitigation features the guest needs to defend itself.

        The `cpu:` line of a VM configuration under `/etc/pve/qemu-server` carries the CPU model and any extra flags. This check requires `+spec-ctrl` or `+ssbd` to be present, which is set from the VM's Hardware, then Processors entry, or with `qm set <vmid> --cpu '<existing-cpu-type>,flags=+spec-ctrl;+ssbd'`. Read the VM's current CPU type first and keep it; the flags are additions, not a replacement, and the VM needs a clean shutdown and start rather than a reset to pick them up.

        **Why this matters**

        Spectre-class attacks work by training the processor's speculative machinery and then reading the traces it leaves in the cache, which allows code in one context to recover memory it was never permitted to read. Guest kernels defend against this, but only when they can see that the hardware offers the controls to do so. Those controls are advertised through CPU feature bits, and a virtualized CPU shows the guest only the bits the hypervisor exposes.

        Omit them and the guest kernel concludes the processor has no mitigation support and disables its own defenses. The workload then runs unprotected on hardware that is perfectly capable of protecting it, and neither the guest's administrator nor the platform's shows anything wrong. On a node hosting workloads from different teams or customers, the memory that can leak includes theirs.

        `+spec-ctrl` exposes the indirect branch controls and `+ssbd` the speculative store bypass disable; a CPU model of `host` passes them through implicitly, but an explicit model such as `x86-64-v2-AES` or `kvm64` does not.

        Enabling mitigations costs measurable performance, which is exactly why they get left off. Take that trade-off deliberately, and where a workload cannot afford it, keep that VM off nodes that host anything it does not already trust.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Select a VM in the resource tree, then open its **Hardware** panel.
        3. Open the **Processors** entry and review the configured CPU type and extra flags for `+spec-ctrl` or `+ssbd`.

        A passing result shows the CPU configuration including `+spec-ctrl` or `+ssbd`; a failing result shows a CPU configuration without either mitigation flag.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        for c in /etc/pve/qemu-server/[0-9]*.conf; do echo "== $c =="; grep '^cpu:' "$c"; done
        ```

        A passing result shows every `cpu:` line containing `+spec-ctrl` or `+ssbd`; a failing result shows a `cpu:` line missing both flags.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Append the mitigation flags to the VM's existing CPU type. Quote
            the value so the shell does not split it at the semicolon, and
            restart the VM cleanly for the change to take effect.

            First read the VM's current `cpu:` value, then substitute it for
            `<existing-cpu-type>` below. Do not paste `kvm64` blindly; that would
            overwrite a `host` or custom CPU type the VM already uses. If the
            VM has no `cpu:` line it defaults to `kvm64`, so use `kvm64` only in
            that case:

            ```bash
            # Read the VM's current CPU type and copy the value after "cpu:".
            qm config <vmid> | grep '^cpu:'

            # Replace <existing-cpu-type> with that value (for example host, x86-64-v2-AES, or kvm64).
            qm set <vmid> --cpu '<existing-cpu-type>,flags=+spec-ctrl;+ssbd'
            qm shutdown <vmid>
            qm start <vmid>
            ```

            Keep the CPU type the VM already uses and only add the flags. Use
            `host` only when all cluster nodes share the same CPU model.
        - id: bash
          desc: |
            **Using a Bash Script**

            Append the mitigation flags to every VM while preserving the
            configured CPU type:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/qemu-server/[0-9]*.conf; do
              vmid=$(basename "$conf" .conf)
              cpu_spec=$(awk -F': ' '/^cpu:/ {print $2}' "$conf")
              case "$cpu_spec" in
                *spec-ctrl*|*ssbd*) continue ;;
              esac
              if [ -z "$cpu_spec" ]; then
                new="kvm64,flags=+spec-ctrl;+ssbd"
              elif [ "${cpu_spec#*flags=}" != "$cpu_spec" ]; then
                new=${cpu_spec/flags=/flags=+spec-ctrl;+ssbd;}
              else
                new="$cpu_spec,flags=+spec-ctrl;+ssbd"
              fi
              echo "Setting CPU mitigations on VM $vmid"
              qm set "$vmid" --cpu "$new"
              echo "Restart VM $vmid cleanly to apply: qm shutdown $vmid && qm start $vmid"
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to add the mitigation flags while keeping
            each VM's configured CPU type:

            ```yaml
            ---
            - name: Apply Spectre/Meltdown mitigations to Proxmox VMs
              hosts: proxmox
              become: true

              tasks:
                - name: Find QEMU VM config files
                  ansible.builtin.find:
                    paths: /etc/pve/qemu-server
                    patterns: "*.conf"
                  register: vm_confs

                - name: Add mitigation flags while keeping the configured CPU type
                  ansible.builtin.shell: |
                    set -e
                    vmid=$(basename "{{ item.path }}" .conf)
                    cpu_spec=$(awk -F': ' '/^cpu:/ {print $2}' "{{ item.path }}")
                    case "$cpu_spec" in
                      *spec-ctrl*|*ssbd*) exit 0 ;;
                    esac
                    if [ -z "$cpu_spec" ]; then
                      new="kvm64,flags=+spec-ctrl;+ssbd"
                    elif [ "${cpu_spec#*flags=}" != "$cpu_spec" ]; then
                      new=$(printf '%s' "$cpu_spec" | sed 's/flags=/flags=+spec-ctrl;+ssbd;/')
                    else
                      new="$cpu_spec,flags=+spec-ctrl;+ssbd"
                    fi
                    qm set "$vmid" --cpu "$new"
                  loop: "{{ vm_confs.files }}"
                  changed_when: true
            ```

  - uid: mondoo-proxmox-security-vm-firewall-is-enabled
    title: Ensure VM network interfaces have firewall enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a4
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      files.find(from: "/etc/pve/qemu-server", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.lines.where(_ == /^net[0-9]+:/).all(_.contains("firewall=1"))
      )
    docs:
      desc: |
        This check verifies that every VM network interface has per-interface filtering turned on.

        Each `netN:` line in a VM configuration under `/etc/pve/qemu-server` carries a `firewall=1` flag, shown as the Firewall checkbox on each Network Device in the VM's Hardware panel. Proxmox inserts its filter chain in front of a guest interface only when the flag is set. Re-set the interface with `qm set <vmid> -<netN>`, keeping the existing model, bridge, MAC address, and VLAN tag intact and adding the flag.

        **Why this matters**

        Without the flag the interface sits outside the enforcement path completely. The datacenter rules, the node rules, and the VM's own firewall tab all fail to apply to its traffic, so a configuration that reads correctly in the interface filters nothing. Operators looking at the VM's rule list have no indication that the rules are inert.

        The consequence shows up during an incident. A VM running an internet-facing application is compromised, and instead of being held to the ports its rules allow, it can reach every other guest on the bridge, the host's management ports, the storage and migration networks, and any device that shares the segment. To its neighbors it looks like a legitimate peer on their own network, which is exactly the situation the per-guest firewall exists to prevent.

        The flag defaults off on interfaces created through some automation paths and is easy to lose when re-setting an interface for an unrelated reason, so mixed state across a fleet is common rather than exceptional.

        Setting it has no effect unless the datacenter firewall is enabled and rules exist; companion checks in this policy cover both of those. Enable filtering so those rules have an attachment point, and verify the workload afterward, since traffic the rules do not permit now genuinely stops.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Select a VM in the resource tree, then open its **Hardware** panel.
        3. Open each **Network Device** entry and confirm the **Firewall** checkbox is selected.

        A passing result shows every VM network device with the firewall enabled; a failing result shows one or more devices with the firewall disabled.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        for c in /etc/pve/qemu-server/[0-9]*.conf; do echo "== $c =="; grep '^net[0-9]*:' "$c"; done
        ```

        A passing result shows `firewall=1` on every `netN` line; a failing result shows a `netN` line without `firewall=1` or with `firewall=0`.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Re-set each VM interface with `firewall=1`. Keep all of the other
            parameters (model, bridge, MAC, VLAN tag) intact:

            ```bash
            qm config <vmid> | grep '^net'
            qm set <vmid> -<netN> virtio=...,bridge=vmbr0,firewall=1
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Add `firewall=1` to every VM interface that is missing it:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/qemu-server/[0-9]*.conf; do
              vmid=$(basename "$conf" .conf)
              while IFS= read -r line; do
                netname=${line%%:*}
                spec=${line#*: }
                if [[ "$spec" != *firewall=1* ]]; then
                  if [[ "$spec" == *firewall=0* ]]; then
                    new=${spec//firewall=0/firewall=1}
                  else
                    new="$spec,firewall=1"
                  fi
                  echo "Enabling firewall on VM $vmid $netname"
                  qm set "$vmid" "-$netname" "$new"
                fi
              done < <(grep '^net[0-9]\+:' "$conf")
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to enforce `firewall=1` on every VM
            `netN` line:

            ```yaml
            ---
            - name: Enable per-interface firewall on Proxmox VMs
              hosts: proxmox
              become: true

              tasks:
                - name: Find QEMU VM config files
                  ansible.builtin.find:
                    paths: /etc/pve/qemu-server
                    patterns: "*.conf"
                  register: vm_confs

                - name: Replace firewall=0 with firewall=1
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '(^net\d+:.*?)firewall=0'
                    replace: '\1firewall=1'
                  loop: "{{ vm_confs.files }}"

                - name: Append firewall=1 to interfaces missing the directive
                  ansible.builtin.replace:
                    path: "{{ item.path }}"
                    regexp: '^(net\d+:(?!.*firewall=).*)$'
                    replace: '\1,firewall=1'
                  loop: "{{ vm_confs.files }}"
            ```

  - uid: mondoo-proxmox-security-vm-no-raw-qemu-args
    title: Ensure VMs do not use raw QEMU arguments
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    refs:
      - title: CWE-94 Improper Control of Generation of Code
        url: https://cwe.mitre.org/data/definitions/94.html
    mql: |
      files.find(from: "/etc/pve/qemu-server", regex: "[0-9]+.conf$", type: "file").list.all(
        file(_.path).content.lines.none(_ == /^args:/)
      )
    docs:
      desc: |
        This check verifies that no VM passes raw arguments straight to the QEMU process.

        The `args:` line in a VM configuration under `/etc/pve/qemu-server` is appended verbatim to the QEMU command line. Proxmox exposes it only as a manual override and does not parse or validate its contents. Remove it with `qm set <vmid> --delete args`, then shut the VM down and start it again so the process is rebuilt without the flags.

        **Why this matters**

        Everything Proxmox does to keep a guest inside its boundary is expressed as QEMU command-line arguments, and raw arguments are appended after the generated ones. That gives whoever wrote the line the ability to overrule the platform: to attach a host block device the VM was never assigned, to add a chardev or a network backend that reaches out of the intended segment, to enable a device model with a poor security history, or to turn off a hardening option the platform sets by default. None of it appears anywhere in the web interface, and none of it is checked when the VM is migrated to another node.

        The result is a VM whose actual isolation does not match what the configuration appears to say. A reviewer reading the Hardware panel sees a normal guest; the running process has capabilities that were never approved. If the guest is compromised, the extra device or backend is what it uses to reach the host or a neighboring VM.

        Raw arguments are usually added in good faith for a device or option Proxmox does not model, and sometimes there is no alternative. When that is the case, record what the line does and why, review it whenever the cluster is upgraded, since the generated arguments change between releases, and keep the VM off nodes hosting workloads it is not already trusted beside.
      audit: |
        ### Audit via Web UI

        1. Sign in to the Proxmox VE web interface.
        2. Select a VM in the resource tree, then open its **Options** panel.
        3. Confirm there is no value set under the raw QEMU arguments entry, since the web UI exposes `args:` only as a manual override.

        A passing result shows no raw QEMU arguments configured; a failing result shows an `args:` value present in the VM configuration.

        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -l '^args:' /etc/pve/qemu-server/[0-9]*.conf
        ```

        A passing result returns no output; a failing result lists VM config files that contain an `args:` directive.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Remove the `args:` directive, then restart the VM cleanly so the
            change takes effect:

            ```bash
            qm set <vmid> --delete args
            qm shutdown <vmid>
            qm start <vmid>
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Print every VM that uses raw QEMU arguments and remove the
            `args:` directive from each. Run on a host where you have already
            audited the existing `args:` lines:

            ```bash
            #!/bin/bash
            set -e

            shopt -s nullglob
            for conf in /etc/pve/qemu-server/[0-9]*.conf; do
              vmid=$(basename "$conf" .conf)
              if grep -q '^args:' "$conf"; then
                echo "VM $vmid uses raw QEMU args:"
                grep '^args:' "$conf"
                echo "  -> running 'qm set $vmid --delete args'"
                qm set "$vmid" --delete args
                echo "  -> restart VM $vmid cleanly to apply: qm shutdown $vmid && qm start $vmid"
              fi
            done
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to remove `args:` from every VM config:

            ```yaml
            ---
            - name: Remove raw QEMU args from Proxmox VMs
              hosts: proxmox
              become: true

              tasks:
                - name: Find VM configs that contain raw args
                  ansible.builtin.find:
                    paths: /etc/pve/qemu-server
                    patterns: "*.conf"
                    contains: '^args:'
                    use_regex: true
                  register: arg_confs

                - name: Delete args via qm set --delete args
                  ansible.builtin.command: "qm set {{ item.path | basename | regex_replace('\\.conf$', '') }} --delete args"
                  loop: "{{ arg_confs.files }}"
                  changed_when: true
            ```

