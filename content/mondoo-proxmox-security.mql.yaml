        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to remove `fuse=1` from container
            feature lists:

            ```yaml
            ---
            - name: Disable FUSE on Proxmox LXC containers
              hosts: proxmox
              become: true

              tasks:
                - name: Find LXC config files with FUSE enabled
                  ansible.builtin.find:
                    paths: /etc/pve/lxc
                    patterns: "*.conf"
                    contains: 'fuse=1'
                  register: fuse_confs

