  # Proxmox-specific Hardening
  # =================================================================

  - uid: mondoo-proxmox-security-ksm-is-disabled
    title: Ensure Kernel Samepage Merging (KSM) is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a23
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ds-10
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-4
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    refs:
      - title: CWE-200 Exposure of Sensitive Information
        url: https://cwe.mitre.org/data/definitions/200.html
      - title: Side-channel attacks on KSM
        url: https://www.usenix.org/system/files/conference/usenixsecurity15/sec15-paper-razavi.pdf
    mql: |
      file("/sys/kernel/mm/ksm/run").content.trim == "0"
    docs:
      desc: |
        This check verifies that Kernel Samepage Merging is not running on the hypervisor.

        KSM scans guest memory for identical pages and collapses them into one shared, copy-on-write copy so that similar VMs consume less RAM. Its runtime state is `/sys/kernel/mm/ksm/run`, which this check requires to hold `0`. Writing `2` unmerges pages that are already shared and `0` leaves it stopped; on Proxmox the `ksmtuned` service is what turns it back on, so disable that unit as well or the setting returns at boot.

        **Why this matters**

        Merging is a cross-VM operation, and it leaves a timing signature. When a page is shared, the first write to it triggers a copy-on-write fault that takes measurably longer than a write to a private page. A VM can exploit that: it fills a page with a guess at what another guest holds, waits for the merge, then times a write. A slow write means the guess was right and some other VM on this host has that exact page.

        That turns into real disclosure. The technique has been used to determine which operating system and software versions a neighboring VM runs, to detect whether a specific file or library is loaded there, and in careful conditions to recover secrets a byte at a time. None of it requires escaping the VM or touching the network; the attacking guest stays entirely within its own boundary and still learns about its neighbors, which is precisely the isolation the hypervisor is supposed to provide.

        The memory saved is real, particularly on nodes running many similar VMs, and that is why KSM gets enabled. Weigh it against what the workloads are worth: on a node where all guests belong to one trust domain the trade may be acceptable, and on a node hosting different teams or customers it is not.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        cat /sys/kernel/mm/ksm/run
        systemctl is-enabled ksmtuned ksm 2>/dev/null
        ```

        A passing result shows `/sys/kernel/mm/ksm/run` reporting `0`; a failing result shows a non-zero value or the `ksmtuned` or `ksm` units enabled to re-activate it on boot.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Stop the KSM services so they cannot re-enable merging, unmerge
            all currently shared pages, and leave KSM stopped.

            On most Proxmox installs only `ksmtuned.service` exists; a bare
            `ksm.service` may be absent, so the `systemctl` calls below tolerate
            a missing unit with `2>/dev/null || true`. The authoritative control
            is writing to `/sys/kernel/mm/ksm/run`: writing `2` unmerges already
            shared pages, and `0` leaves KSM stopped:

            ```bash
            systemctl stop ksmtuned ksm 2>/dev/null || true
            systemctl disable ksmtuned ksm 2>/dev/null || true
            echo 2 > /sys/kernel/mm/ksm/run
            echo 0 > /sys/kernel/mm/ksm/run
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Disable KSM at runtime and on boot, including unmerging pages that
            are already shared. The script is idempotent:

            ```bash
            #!/bin/bash
            set -e

            for unit in ksmtuned ksm; do
              if systemctl list-unit-files | awk '{print $1}' | grep -qx "${unit}.service"; then
                systemctl stop "$unit" || true
                systemctl disable "$unit" || true
              fi
            done

            echo 2 > /sys/kernel/mm/ksm/run
            echo 0 > /sys/kernel/mm/ksm/run

            cat /sys/kernel/mm/ksm/run
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to stop and disable KSM and unmerge
            already-shared pages:

            ```yaml
            ---
            - name: Disable Kernel Samepage Merging on Proxmox hosts
              hosts: proxmox
              become: true

              tasks:
                - name: Stop and disable KSM systemd units
                  ansible.builtin.systemd:
                    name: "{{ item }}"
                    state: stopped
                    enabled: false
                  loop:
                    - ksmtuned
                    - ksm
                  failed_when: false

                - name: Unmerge shared pages and stop KSM
                  ansible.builtin.shell: |
                    set -e
                    echo 2 > /sys/kernel/mm/ksm/run
                    echo 0 > /sys/kernel/mm/ksm/run
                  changed_when: true
            ```

  - uid: mondoo-proxmox-security-no-pci-acs-override
    title: Ensure PCI ACS override is not enabled
    impact: 90
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a23
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-4
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-4
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    refs:
      - title: CWE-284 Improper Access Control
        url: https://cwe.mitre.org/data/definitions/284.html
      - title: Proxmox PCI Passthrough IOMMU Groups
        url: https://pve.proxmox.com/wiki/PCI_Passthrough#_verify_iommu_isolation
    mql: |
      file("/proc/cmdline").content.contains("pcie_acs_override") == false
    docs:
      desc: |
        This check verifies that the kernel is not booted with the `pcie_acs_override` parameter.

        The parameter appears on the running kernel command line in `/proc/cmdline` and is persisted in `/etc/default/grub` or `/etc/kernel/cmdline`. It tells the kernel to pretend PCI devices support Access Control Services when the hardware does not, which splits large IOMMU groups into smaller ones so that individual devices can be passed through to VMs. Remove it from both files, then run `update-grub` or `proxmox-boot-tool refresh` and reboot.

        **Why this matters**

        IOMMU groups are not an administrative convenience, they are the hardware's statement about which devices can be isolated from one another. Devices land in the same group when the PCIe topology between them cannot enforce separation, typically because a switch or root port does not implement ACS and will route a transaction between two downstream devices without it ever reaching the IOMMU.

        The override does not add the missing capability, it suppresses the kernel's objection to its absence. A device passed to a guest under a faked group can then issue DMA that reaches memory belonging to another VM or to the host itself, because nothing in the path is actually checking. A guest with a passed-through device it fully controls, or a device with attackable firmware, uses that to read or write memory outside its own VM. The victim guest has no visibility into it whatsoever, and no software control on the host can prevent it.

        The parameter is usually added by someone trying to pass a GPU or NIC through on consumer hardware where the vendor did not implement ACS, and then forgotten when the machine moves into production.

        If passthrough is required, use hardware whose groups genuinely separate the device. Where the override cannot be avoided, treat every guest on that node as sharing one trust domain with the host.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -o 'pcie_acs_override[^ ]*' /proc/cmdline /etc/default/grub /etc/kernel/cmdline 2>/dev/null
        ```

        A passing result returns no output, confirming the override is absent from the running kernel command line and the persisted boot configuration; a failing result shows a `pcie_acs_override` entry.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Remove `pcie_acs_override=...` from the kernel command line, then
            rebuild the bootloader and reboot:

            ```bash
            sed -i -E 's/[[:space:]]*pcie_acs_override=[^[:space:]"]+//g' /etc/default/grub
            sed -i -E 's/[[:space:]]*pcie_acs_override=[^[:space:]"]+//g' /etc/kernel/cmdline 2>/dev/null || true
            update-grub
            command -v proxmox-boot-tool >/dev/null && proxmox-boot-tool refresh
            echo 'Reboot required for the change to take effect.'
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Strip the override from every place Proxmox might persist kernel
            arguments and refresh the boot loader:

            ```bash
            #!/bin/bash
            set -e

            files=(/etc/default/grub /etc/kernel/cmdline)
            changed=0
            for f in "${files[@]}"; do
              [ -f "$f" ] || continue
              if grep -q 'pcie_acs_override' "$f"; then
                sed -i -E 's/[[:space:]]*pcie_acs_override=[^[:space:]"]+//g' "$f"
                echo "Removed pcie_acs_override from $f"
                changed=1
              fi
            done

            if [ "$changed" -eq 1 ]; then
              if command -v update-grub >/dev/null; then
                update-grub
              fi
              if command -v proxmox-boot-tool >/dev/null; then
                proxmox-boot-tool refresh
              fi
              echo "Reboot required for the change to take effect."
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to strip the override from grub and the
            Proxmox kernel cmdline file:

            ```yaml
            ---
            - name: Remove pcie_acs_override from kernel cmdline
              hosts: proxmox
              become: true

              tasks:
                - name: Strip pcie_acs_override from /etc/default/grub
                  ansible.builtin.replace:
                    path: /etc/default/grub
                    regexp: '\s*pcie_acs_override=[^\s"]+'
                    replace: ''
                  notify: Refresh boot loader

                - name: Strip pcie_acs_override from /etc/kernel/cmdline
                  ansible.builtin.replace:
                    path: /etc/kernel/cmdline
                    regexp: '\s*pcie_acs_override=[^\s"]+'
                    replace: ''
                  failed_when: false
                  notify: Refresh boot loader

              handlers:
                - name: Refresh boot loader
                  ansible.builtin.shell: |
                    set -e
                    if command -v update-grub >/dev/null; then update-grub; fi
                    if command -v proxmox-boot-tool >/dev/null; then proxmox-boot-tool refresh; fi
            ```

  - uid: mondoo-proxmox-security-iommu-is-enabled
    title: Ensure IOMMU is enabled for PCI passthrough isolation
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a23
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-4
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-4
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-3
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      file("/proc/cmdline").content.contains("intel_iommu=on") ||
      file("/proc/cmdline").content.contains("amd_iommu=on") ||
      file("/proc/cmdline").content.contains("iommu=pt")
    docs:
      desc: |
        This check verifies that the kernel is booted with the IOMMU turned on.

        The check looks for `intel_iommu=on`, `amd_iommu=on`, or `iommu=pt` on the running kernel command line in `/proc/cmdline`. The parameter is added to `/etc/default/grub` for a GRUB boot or `/etc/kernel/cmdline` for the systemd-boot layout Proxmox uses with ZFS on UEFI, then applied with `update-grub` or `proxmox-boot-tool refresh` and a reboot. It must also be enabled in the system firmware, where it is usually labeled VT-d or AMD-Vi.

        **Why this matters**

        A PCI device that performs DMA writes directly into physical memory without the CPU mediating it. The IOMMU is the hardware unit that sits in that path and translates addresses, so that a device can only reach the memory its owner is permitted to touch. Without it, a device assigned to a VM is not confined to that VM at all: its DMA reaches host RAM and the memory of every other guest on the node, and no hypervisor software control intervenes, because the transaction never passes through software.

        That matters most where a device is under guest control. A VM with a passed-through GPU or NIC programs that device's descriptors and can therefore aim its DMA anywhere, reading another tenant's memory or writing into the host kernel to take it over. Malicious or compromised device firmware on any add-in card does the same thing without a guest being involved.

        The IOMMU is also what makes the group boundaries meaningful that a companion check in this policy protects from being faked.

        Enabling it can expose firmware bugs on older hardware and change device behavior, so test on one node before rolling it out. Where no passthrough is in use the exposure is smaller, but the setting is still the difference between an add-in card being confined and having the run of system memory.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        grep -oE '(intel_iommu=on|amd_iommu=on|iommu=pt)' /proc/cmdline
        ```

        A passing result shows at least one IOMMU flag on the running kernel command line; a failing result returns no output, indicating IOMMU is not enabled.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Add the appropriate IOMMU flag to the kernel command line. For an
            Intel system booting with GRUB:

            ```bash
            sed -i -E 's|^(GRUB_CMDLINE_LINUX_DEFAULT=")(.*)"$|\1\2 intel_iommu=on iommu=pt"|' /etc/default/grub
            update-grub
            echo 'Reboot required for the change to take effect.'
            ```

            For an Intel system booting with systemd-boot, which Proxmox uses
            for ZFS root on UEFI, the arguments live in `/etc/kernel/cmdline`:

            ```bash
            sed -i 's|$| intel_iommu=on iommu=pt|' /etc/kernel/cmdline
            proxmox-boot-tool refresh
            echo 'Reboot required for the change to take effect.'
            ```

            For AMD, replace `intel_iommu=on` with `amd_iommu=on`.
        - id: bash
          desc: |
            **Using a Bash Script**

            Detect the CPU vendor, append the right flag to both possible boot
            configurations, and refresh the boot loader:

            ```bash
            #!/bin/bash
            set -e

            vendor=$(awk -F: '/vendor_id/ {print $2; exit}' /proc/cpuinfo | tr -d ' ')
            case "$vendor" in
              GenuineIntel) flag="intel_iommu=on iommu=pt";;
              AuthenticAMD) flag="amd_iommu=on iommu=pt";;
              *) echo "Unknown CPU vendor: $vendor" >&2; exit 1;;
            esac

            changed=0

            if [ -f /etc/default/grub ] && ! grep -qE 'intel_iommu=on|amd_iommu=on' /etc/default/grub; then
              sed -i -E "s|^(GRUB_CMDLINE_LINUX_DEFAULT=\")(.*)\"$|\\1\\2 ${flag}\"|" /etc/default/grub
              changed=1
            fi

            if [ -f /etc/kernel/cmdline ] && ! grep -qE 'intel_iommu=on|amd_iommu=on' /etc/kernel/cmdline; then
              sed -i "s|\$| ${flag}|" /etc/kernel/cmdline
              changed=1
            fi

            if [ "$changed" -eq 1 ]; then
              if command -v update-grub >/dev/null; then update-grub; fi
              if command -v proxmox-boot-tool >/dev/null; then proxmox-boot-tool refresh; fi
              echo "Reboot required for IOMMU change to take effect."
            fi
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to add the right IOMMU flag to both GRUB
            and systemd-boot configurations based on CPU vendor:

            ```yaml
            ---
            - name: Enable IOMMU on Proxmox hosts
              hosts: proxmox
              become: true

              tasks:
                - name: Determine CPU vendor
                  ansible.builtin.shell: |
                    awk -F: '/vendor_id/ {print $2; exit}' /proc/cpuinfo | tr -d ' '
                  register: cpu_vendor
                  changed_when: false

                - name: Set IOMMU flag fact
                  ansible.builtin.set_fact:
                    iommu_flag: >-
                      {{ 'intel_iommu=on iommu=pt' if cpu_vendor.stdout == 'GenuineIntel'
                         else 'amd_iommu=on iommu=pt' }}

                - name: Add IOMMU flag to GRUB_CMDLINE_LINUX_DEFAULT
                  ansible.builtin.replace:
                    path: /etc/default/grub
                    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!{{ iommu_flag }}).)*)"$'
                    replace: '\1 {{ iommu_flag }}"'
                  register: grub_change
                  failed_when: false

                - name: Add IOMMU flag to /etc/kernel/cmdline for systemd-boot
                  ansible.builtin.replace:
                    path: /etc/kernel/cmdline
                    regexp: '^((?:(?!{{ iommu_flag }}).)*)$'
                    replace: '\1 {{ iommu_flag }}'
                  register: cmdline_change
                  failed_when: false

                - name: Refresh boot loader if anything changed
                  ansible.builtin.shell: |
                    set -e
                    if command -v update-grub >/dev/null; then update-grub; fi
                    if command -v proxmox-boot-tool >/dev/null; then proxmox-boot-tool refresh; fi
                  when: (grub_change.changed | default(false)) or (cmdline_change.changed | default(false))
            ```

  - uid: mondoo-proxmox-security-auditd-watches-pve-directory
    title: Ensure audit rules monitor /etc/pve/ changes
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-4
    props:
      - uid: mondooProxmoxSecurityAuditFiles
        title: Return the content from all /etc/audit/rules.d and /etc/audit/audit.rules
        mql: |
          mondooProxmoxSecurityAuditFiles = files.find(from: "/etc/audit/rules.d", regex: '.*\.rules$', type: "file").list.map(path) + ["/etc/audit/audit.rules"]
          return mondooProxmoxSecurityAuditFiles.where(file(_).exists).map(file(_).content.lines.where(_ == /^[^#]/))
    mql: |
      props.mondooProxmoxSecurityAuditFiles.any(_.any(_ == /^\s*-w\s+\/etc\/pve/))
    docs:
      desc: |
        This check verifies that the audit subsystem records changes to the cluster configuration tree.

        The rule is a watch on `/etc/pve/`, typically written as `-w /etc/pve/ -p wa -k pve-config` in a file under `/etc/audit/rules.d/`, loaded with `augenrules --load`, and confirmed with `auditctl -l`. The `wa` permissions record writes and attribute changes, and the key makes the events searchable afterward.

        **Why this matters**

        `/etc/pve/` is where the cluster keeps everything that decides who may do what and how guests are isolated: the user and access control database, the firewall rules, storage definitions, every VM and container configuration, and the private keys under `priv`. Changing a file there changes the security posture of the whole cluster, and because the cluster filesystem replicates, the change lands on every node.

        An attacker who reaches root on one node works here rather than anywhere noisier. Adding an Administrator entry to the access control list, giving themselves an API token, removing an AppArmor confinement line from a container, adding `args:` to a VM, or clearing a firewall rule are all one-line edits that leave a running cluster looking entirely normal. Without a watch, the only record is the file's modification time, which they can adjust, and the difference between an authorized change and a hostile one becomes unrecoverable after the fact.

        The watch does not prevent the edit; root can also stop auditd. Its value is that the events are written as they happen and, if the audit log is shipped off the node, they land somewhere the attacker does not control before they can be removed.

        Expect volume: Proxmox itself writes into this tree constantly, so tune what you keep and forward, and pair the rule with alerting on the changes that matter rather than reviewing the log by hand.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        auditctl -l | grep '/etc/pve'
        ```

        The check passes when a watch rule covering `/etc/pve/` is listed; it fails when no matching rule is returned.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Add an audit rule and reload the audit subsystem:

            ```bash
            cat > /etc/audit/rules.d/pve.rules <<'EOF'
            -w /etc/pve/ -p wa -k pve-config
            EOF
            augenrules --load
            systemctl restart auditd
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Install auditd if needed, drop the rule, and reload:

            ```bash
            #!/bin/bash
            set -e

            if ! command -v auditctl >/dev/null; then
              apt-get update
              apt-get install -y auditd
            fi

            install -d -m 0750 /etc/audit/rules.d
            cat > /etc/audit/rules.d/pve.rules <<'EOF'
            -w /etc/pve/ -p wa -k pve-config
            EOF

            augenrules --load
            systemctl restart auditd
            auditctl -l | grep '/etc/pve'
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to install the rule and reload auditd:

            ```yaml
            ---
            - name: Audit /etc/pve/ for unexpected changes
              hosts: proxmox
              become: true

              tasks:
                - name: Ensure auditd is installed
                  ansible.builtin.apt:
                    name: auditd
                    state: present
                    update_cache: true

                - name: Install /etc/pve/ watch rule
                  ansible.builtin.copy:
                    dest: /etc/audit/rules.d/pve.rules
                    owner: root
                    group: root
                    mode: '0640'
                    content: |
                      -w /etc/pve/ -p wa -k pve-config
                  notify: Reload audit rules

              handlers:
                - name: Reload audit rules
                  ansible.builtin.shell: augenrules --load && systemctl restart auditd
            ```

  - uid: mondoo-proxmox-security-update-repo-is-configured
    title: Ensure a PVE update repository is configured
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      file("/etc/apt/sources.list.d/pve-enterprise.list").exists ||
      file("/etc/apt/sources.list.d/pve-no-subscription.list").exists ||
      file("/etc/apt/sources.list.d/pve-enterprise.sources").exists ||
      file("/etc/apt/sources.list.d/proxmox.sources").exists
    docs:
      desc: |
        This check verifies that the node has a Proxmox VE package repository configured.

        The repository is defined in `/etc/apt/sources.list.d/`, as `pve-enterprise.list` or `pve-no-subscription.list` in the one-line format used through Proxmox VE 8, or as `pve-enterprise.sources` or `proxmox.sources` in the deb822 format used from Proxmox VE 9. The enterprise repository requires an active subscription; the no-subscription repository does not. A node needs one of them.

        **Why this matters**

        The packages that make this machine a hypervisor are not in Debian. The kernel with the Proxmox patch set, QEMU, the LXC toolchain, the cluster filesystem, and the API proxy that serves the web interface all come from a Proxmox repository. Without one, `apt-get upgrade` reports the system as up to date while every one of those components stays frozen at whatever version was installed.

        The gap this leaves is the worst kind. Hypervisor vulnerabilities are the ones that break the boundary between guests, and QEMU device emulation flaws in particular have repeatedly allowed code in a guest to execute on the host. Those advisories are public the day they ship, so an attacker who has compromised any guest on an unpatched node has a documented, dated escape path to the host and, through it, to every other guest.

        A node in this state also drifts away from its peers, so a live migration lands a guest on a host with a different QEMU version and behaves differently, which turns patch management into an availability problem as well.

        Whichever repository you use, keep it the same across every node so the cluster stays on one package stream, and pair it with a companion check in this policy that makes security updates apply automatically.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        cat /etc/apt/sources.list.d/pve-enterprise.list /etc/apt/sources.list.d/pve-no-subscription.list 2>/dev/null
        ```

        The check passes when either file exists with a `deb` line for the PVE repository; it fails when neither file is present.
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Configure either the enterprise repository, which requires a
            subscription, or the no-subscription repository. On Proxmox VE 8
            use the one-line list format:

            ```bash
            codename=$(awk -F= '$1 == "VERSION_CODENAME" {print $2}' /etc/os-release)

            cat > /etc/apt/sources.list.d/pve-no-subscription.list <<EOF
            deb http://download.proxmox.com/debian/pve $codename pve-no-subscription
            EOF

            apt-get update
            ```

            On Proxmox VE 9 and later use the deb822 format:

            ```bash
            codename=$(awk -F= '$1 == "VERSION_CODENAME" {print $2}' /etc/os-release)

            cat > /etc/apt/sources.list.d/proxmox.sources <<EOF
            Types: deb
            URIs: http://download.proxmox.com/debian/pve
            Suites: $codename
            Components: pve-no-subscription
            Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
            EOF

            apt-get update
            ```

            For the enterprise repository, use
            `https://enterprise.proxmox.com/debian/pve` with component
            `pve-enterprise` and the file name `pve-enterprise.list` or
            `pve-enterprise.sources` respectively.
        - id: bash
          desc: |
            **Using a Bash Script**

            Add a repository if none is present, choosing the format that
            matches the installed release. Pass `enterprise` or
            `no-subscription` as the first argument:

            ```bash
            #!/bin/bash
            set -e

            mode=${1:-no-subscription}
            codename=$(awk -F= '$1 == "VERSION_CODENAME" {print $2}' /etc/os-release)

            if compgen -G '/etc/apt/sources.list.d/pve-*' >/dev/null || [ -f /etc/apt/sources.list.d/proxmox.sources ]; then
              echo "A PVE repository is already configured."
              exit 0
            fi

            if [ "$codename" = bookworm ]; then
              if [ "$mode" = enterprise ]; then
                cat > /etc/apt/sources.list.d/pve-enterprise.list <<EOF
            deb https://enterprise.proxmox.com/debian/pve $codename pve-enterprise
            EOF
              else
                cat > /etc/apt/sources.list.d/pve-no-subscription.list <<EOF
            deb http://download.proxmox.com/debian/pve $codename pve-no-subscription
            EOF
              fi
            else
              if [ "$mode" = enterprise ]; then
                cat > /etc/apt/sources.list.d/pve-enterprise.sources <<EOF
            Types: deb
            URIs: https://enterprise.proxmox.com/debian/pve
            Suites: $codename
            Components: pve-enterprise
            Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
            EOF
              else
                cat > /etc/apt/sources.list.d/proxmox.sources <<EOF
            Types: deb
            URIs: http://download.proxmox.com/debian/pve
            Suites: $codename
            Components: pve-no-subscription
            Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
            EOF
              fi
            fi

            apt-get update
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to install the no-subscription repository
            when no PVE repository is present, in the format matching the
            installed release:

            ```yaml
            ---
            - name: Ensure a Proxmox VE apt repository is configured
              hosts: proxmox
              become: true

              tasks:
                - name: Get Debian codename
                  ansible.builtin.shell: awk -F= '$1 == "VERSION_CODENAME" {print $2}' /etc/os-release
                  register: codename
                  changed_when: false

                - name: Detect existing PVE repository files
                  ansible.builtin.find:
                    paths: /etc/apt/sources.list.d
                    patterns:
                      - "pve-*.list"
                      - "pve-*.sources"
                      - "proxmox.sources"
                  register: repo_files

                - name: Write one-line repo on Proxmox VE 8
                  ansible.builtin.copy:
                    dest: /etc/apt/sources.list.d/pve-no-subscription.list
                    mode: '0644'
                    content: |
                      deb http://download.proxmox.com/debian/pve {{ codename.stdout }} pve-no-subscription
                  when:
                    - repo_files.matched == 0
                    - codename.stdout == 'bookworm'

                - name: Write deb822 repo on Proxmox VE 9 and later
                  ansible.builtin.copy:
                    dest: /etc/apt/sources.list.d/proxmox.sources
                    mode: '0644'
                    content: |
                      Types: deb
                      URIs: http://download.proxmox.com/debian/pve
                      Suites: {{ codename.stdout }}
                      Components: pve-no-subscription
                      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
                  when:
                    - repo_files.matched == 0
                    - codename.stdout != 'bookworm'

                - name: Refresh apt cache
                  ansible.builtin.apt:
                    update_cache: true
            ```

  - uid: mondoo-proxmox-security-automatic-updates-are-enabled
    title: Ensure unattended-upgrades is installed
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      package("unattended-upgrades").installed
    docs:
      desc: |
        This check verifies that the `unattended-upgrades` package is installed so security updates apply without waiting for a person.

        The package is installed with apt and configured through `/etc/apt/apt.conf.d/20auto-upgrades`, where `APT::Periodic::Update-Package-Lists` and `APT::Periodic::Unattended-Upgrade` are both set to `1`. Confirm it is running with `systemctl is-enabled unattended-upgrades` as well, since installing the package without enabling the periodic settings changes nothing.

        **Why this matters**

        The interval between a fix being published and being installed is the window an attacker works in, and for a hypervisor that window is measured against exploits that already exist. Advisories describe the flaw precisely enough for working exploit code to appear within days, and the components on this host that receive those advisories include QEMU, the kernel, and the API proxy that fronts the web interface.

        Manual patching does not keep that window short in practice. It depends on someone reading the advisory, deciding it applies, and finding a maintenance slot, and hypervisor nodes are exactly the machines people postpone touching because rebooting them moves guests around. The node that is most disruptive to patch is the one whose compromise reaches the most workloads.

        Automatic updates take the routine security fixes off that critical path so the backlog is limited to changes that genuinely need coordination.

        Unattended upgrades restart services, which briefly interrupts the API and can disturb a guest if a component it depends on is replaced, and a kernel update needs a reboot that the mechanism will not perform on its own. Configure the reboot window deliberately, exclude packages you must stage by hand, and stagger nodes so the whole cluster does not update at the same moment. This check confirms the package is present, not that a reboot policy exists, so verify the kernel is actually current afterward.
      audit: |
        ### Audit via CLI

        Run the command on a cluster node:

        ```bash
        dpkg-query -W -f='${Status}\n' unattended-upgrades
        ```

        The check passes when the status reports `install ok installed`; it fails when the package is not installed.

        To confirm the service is active, also run:

        ```bash
        systemctl is-enabled unattended-upgrades
        ```
      remediation:
        - id: cli
          desc: |
            **Using the CLI**

            Install and enable unattended-upgrades:

            ```bash
            apt-get update
            apt-get install -y unattended-upgrades
            dpkg-reconfigure -f noninteractive unattended-upgrades
            ```
        - id: bash
          desc: |
            **Using a Bash Script**

            Idempotently install and enable unattended-upgrades:

            ```bash
            #!/bin/bash
            set -e

            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y unattended-upgrades

            cat > /etc/apt/apt.conf.d/20auto-upgrades <<'EOF'
            APT::Periodic::Update-Package-Lists "1";
            APT::Periodic::Unattended-Upgrade "1";
            EOF

            systemctl enable --now unattended-upgrades
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to install and enable unattended-upgrades:

            ```yaml
            ---
            - name: Enable unattended security upgrades on Proxmox hosts
              hosts: proxmox
              become: true

              tasks:
                - name: Install unattended-upgrades
                  ansible.builtin.apt:
                    name: unattended-upgrades
                    state: present
                    update_cache: true

                - name: Enable periodic update / upgrade
                  ansible.builtin.copy:
                    dest: /etc/apt/apt.conf.d/20auto-upgrades
                    owner: root
                    group: root
                    mode: '0644'
                    content: |
                      APT::Periodic::Update-Package-Lists "1";
                      APT::Periodic::Unattended-Upgrade "1";

                - name: Ensure unattended-upgrades service is running
                  ansible.builtin.systemd:
                    name: unattended-upgrades
                    state: started
                    enabled: true
            ```

