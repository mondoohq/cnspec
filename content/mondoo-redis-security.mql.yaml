policies:
  - uid: mondoo-redis-security
    name: Mondoo Redis Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: redisdb
    require:
      - provider: redisdb
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Harden Redis and Valkey authentication, network exposure, and transport encryption
    docs:
      desc: |
        The Mondoo Redis Security policy connects to a running Redis or Valkey server and assesses its effective, runtime state. It reads the server's live `INFO` output, its `CONFIG GET` parameters, and the access-control users from `ACL LIST`, so the checks reflect the configuration the server is actually enforcing rather than a file on disk.

        This policy provides security checks across three areas:
        - Authentication strength, enforced through access-control (ACL) passwords
        - Network exposure, governed by protected mode
        - Transport encryption for client connections via TLS

        Left with a passwordless default user, protected mode off, and no TLS, a Redis or Valkey server on a reachable network hands full read and write access to anyone who can open a socket to its port, with every command and credential crossing the wire in cleartext.

        Learn more about scanning databases in the [cnspec documentation](https://mondoo.com/docs/cnspec).
    groups:
      - title: Transport Encryption
        filters: asset.platform == "redisdb"
        checks:
          - uid: mondoo-redis-security-tls-enabled
      - title: Authentication
        filters: asset.platform == "redisdb"
        checks:
          - uid: mondoo-redis-security-authentication-required
      - title: Network Surface Area
        filters: asset.platform == "redisdb"
        checks:
          - uid: mondoo-redis-security-protected-mode-enabled
    scoring_system: highest impact
queries:
  - uid: mondoo-redis-security-tls-enabled
    filters: asset.platform == "redisdb"
    title: Ensure Redis enables TLS for client connections
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      redisdb.instance.tlsEnabled == true
    docs:
      desc: |
        This check verifies that the server has a TLS listener bound so clients can connect over an encrypted channel.

        TLS is configured in `redis.conf` by setting a nonzero TLS port and pointing the server at a certificate, a private key, and a certificate authority file that only the Redis account can read. Operators normally disable the plaintext listener at the same time by setting the ordinary port to zero. The certificate files must be present before the listener can bind, so this is a restart rather than a runtime change, and a value set with `CONFIG SET` is lost unless `CONFIG REWRITE` persists it.

        **Why this matters**

        Without a TLS listener, the protocol runs in cleartext and Redis makes no attempt to hide anything. The password presented with `AUTH` is sent as an argument in the same plain form as every other command, so a single captured packet gives an attacker the credential outright, with no hash to crack and no exchange to replay.

        Everything after that is equally readable. Keys, values, and the commands themselves cross the network in the clear, and Redis is usually holding exactly the material worth reading: session identifiers, cached user records, queued jobs, and rate-limit state. An attacker with a copy of the traffic collects live session tokens and replays them against the application without ever touching Redis again.

        A cleartext connection also lets an active attacker write. They can inject a command into an established session, so a stream they can reach is a stream they can modify.

        Configure the clients to verify the server certificate as well. Encryption without verification stops a passive listener but not someone who terminates the connection themselves and passes the traffic through.
      audit: |-
        ### Audit via redis-cli

        1. Read the configured TLS port:

           ```bash
           redis-cli CONFIG GET tls-port
           ```

        If `tls-port` is a nonzero value, TLS is enabled and the check passes. If it is `0`, TLS is disabled and the check fails.
      remediation:
        - id: config
          desc: |-
            To enable TLS in the server configuration:

            1. Provide a server certificate, private key, and CA certificate readable only by the Redis user.
            2. In `redis.conf`, enable the TLS listener, disable the plaintext port, and point at the certificate files:

               ```ini
               tls-port 6379
               port 0
               tls-cert-file /etc/redis/tls/redis.crt
               tls-key-file /etc/redis/tls/redis.key
               tls-ca-cert-file /etc/redis/tls/ca.crt
               ```
            3. Restart the server so the TLS listener is bound.
        - id: cli
          desc: |-
            TLS cannot be bootstrapped purely at runtime, because the certificate and key files must be present and the listener must be bound before clients connect. Set the TLS parameters in `redis.conf` as shown in the configuration remediation, then apply them with a reload:

            ```bash
            redis-cli CONFIG SET tls-port 6379
            redis-cli CONFIG SET port 0
            ```

            If the certificate files were not already loaded at startup, restart the server so the new TLS listener takes effect.
    refs:
      - url: https://redis.io/docs/latest/operate/oss_and_stack/management/security/encryption/
        title: Redis TLS
  - uid: mondoo-redis-security-authentication-required
    filters: asset.platform == "redisdb"
    title: Ensure every enabled Redis user requires a password
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      redisdb.instance.users.where(enabled == true).all(nopass == false)
    docs:
      desc: |
        This check verifies that every enabled access-control user has to present a password.

        Access-control users are defined by `user` directives in `redis.conf` or in the external ACL file, and each carries flags describing its rules. The `nopass` flag means the user authenticates with anything at all. The check fails when any enabled user carries it, including the built-in `default` user, which is where it usually appears. A password set at runtime is not persisted unless `CONFIG REWRITE` writes the configuration back out.

        **Why this matters**

        An enabled user with that flag makes network reachability the only requirement. There is nothing to guess, nothing to steal, and no failed attempt for anyone to notice: a client opens a socket and is authenticated.

        The `default` user is the one that matters, because a client that sends no credentials is treated as that user, and its shipped rule set is `~* +@all`, meaning every key and every command. So an attacker who reaches the port reads and rewrites the entire keyspace, flushes it, and reaches the administrative commands as well. They read the configuration to learn where the data files are written, use the server's own persistence commands to write a file of their choosing to a path they control, and turn a cache into code execution on the host.

        Because the flag lives on the user rather than on the network, no firewall change repairs it. Any workload that can route to the port inherits full control.

        Give every enabled user a password and remove the flag, or disable the users that are not needed. Combine that with protected mode and an explicit bind list so the server does not answer clients it was never meant to serve.
      audit: |-
        ### Audit via redis-cli

        1. List the configured access-control users and their flags:

           ```bash
           redis-cli ACL LIST
           ```

        If no enabled user line contains the `nopass` flag, the check passes. If any enabled user is marked `nopass`, the check fails.
      remediation:
        - id: config
          desc: |-
            To require a password for every enabled user in the server configuration:

            1. In the ACL file (or the `user` directives in `redis.conf`), give each enabled user a password and remove the `nopass` flag. For the built-in default user:

               ```conf
               user default on >STRONGPASS ~* +@all
               ```
            2. Restart the server or reload the ACLs so the new rules take effect.
        - id: cli
          desc: |-
            To set a password on an enabled user at runtime and persist it, replace `nopass` by assigning a password and then rewrite the configuration:

            ```bash
            redis-cli ACL SETUSER default on '>STRONGPASS' && redis-cli CONFIG REWRITE
            ```
    refs:
      - url: https://redis.io/docs/latest/operate/oss_and_stack/management/security/acl/
        title: Redis ACL
  - uid: mondoo-redis-security-protected-mode-enabled
    filters: asset.platform == "redisdb"
    title: Ensure Redis protected mode is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-b-protection
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      redisdb.instance.protectedMode == true
    docs:
      desc: |
        This check verifies that the server's last-resort guard against answering anonymous remote clients is left in place.

        Protected mode is set in `redis.conf` and also with `CONFIG SET`, where a `CONFIG REWRITE` is needed to make the change survive a restart. When it is on and the server has neither a password nor an explicit `bind` list, connections from anything other than the loopback interface are refused with an explanatory error. It is on by default, and the check fails only when it has been turned off.

        **Why this matters**

        The guard exists because of what happened without it. Redis has no authentication until an operator configures some, and for years the default configuration answered every interface, which put tens of thousands of unauthenticated instances on the public internet. Automated campaigns swept them continuously, and reaching one meant reading the entire keyspace, so session tokens, cached credentials, and personal records were collected wholesale, and the same access was used to write attacker-controlled content into the data directory and take the host.

        Protected mode is what stops a freshly started or half-configured server from repeating that. It catches exactly the combination that produces the incident, a server listening beyond loopback with no credential set, and refuses the remote client rather than serving it.

        Turning it off removes the safety net at the moment it would have mattered, because it only ever engages when the other controls are missing. A server with a password and a narrow bind list is unaffected by it either way, so switching it off buys nothing and costs the one protection that covers a mistake in the other two.

        Leave it on and rely on a password and an explicit bind list as the actual controls.
      audit: |-
        ### Audit via redis-cli

        1. Read the protected-mode setting:

           ```bash
           redis-cli CONFIG GET protected-mode
           ```

        If the value is `yes`, protected mode is enabled and the check passes. If it is `no`, the check fails.
      remediation:
        - id: config
          desc: |-
            To enable protected mode in the server configuration:

            1. In `redis.conf`, set:

               ```ini
               protected-mode yes
               ```
            2. Restart the server so the setting takes effect.
        - id: cli
          desc: |-
            To enable protected mode at runtime and persist it to the configuration file:

            ```bash
            redis-cli CONFIG SET protected-mode yes && redis-cli CONFIG REWRITE
            ```
    refs:
      - url: https://redis.io/docs/latest/operate/oss_and_stack/management/security/
        title: Redis security
