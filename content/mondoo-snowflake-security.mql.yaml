  - uid: mondoo-snowflake-security-external-access-integrations-scoped
    title: Ensure external access integrations are scoped to network rules
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-2
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-snowflake-security-external-access-integrations-scoped-snowflake
        tags:
          mondoo.com/filter-title: Snowflake
          mondoo.com/filter-icon: snowflake
    docs:
      desc: |
        This check verifies that outbound network access from user-defined code is confined to approved destinations.

        An external access integration is what permits a user-defined function or stored procedure to make outbound connections. Its `ALLOWED_NETWORK_RULES` property binds it to egress network rules, each created with `CREATE NETWORK RULE ... MODE = EGRESS` and enumerating the host and port destinations that are permitted. This check requires every enabled external access integration to name at least one allowed network rule, since an integration that names none constrains nothing.

        **Why this matters**

        Code running inside Snowflake through an unconstrained integration can open a connection to any host it chooses. That is a general-purpose egress channel sitting inside the data platform: a stored procedure can select from a table and post the rows to an endpoint the attacker controls, running on the warehouse, at warehouse throughput, on whatever schedule a task gives it.

        Unlike an unload, this path leaves no record naming a destination. `COPY_HISTORY` shows where a `COPY INTO` wrote; an outbound HTTP call from a procedure body shows up as the procedure having run. Investigating it after the fact means reading the code, which a companion check in this policy keeps hidden from unprivileged roles for good reasons of its own.

        Named network rules make the destination list explicit and reviewable. They turn the question of what the account may talk to from something buried in function bodies into an object an administrator can enumerate, diff, and approve.

        Keep rules narrow and per workload rather than sharing one broad rule across every integration, and grant usage on each integration only to the roles that run the code needing it.
      audit: |
        ### Audit via Snowsight

        1. Sign in to Snowsight as a user with the ACCOUNTADMIN role.
        2. Open a SQL worksheet.
        3. List the integrations and inspect each one:

            ```sql
            SHOW EXTERNAL ACCESS INTEGRATIONS;
            DESC INTEGRATION <integration_name>;
            ```

        A passing result shows a non-empty `ALLOWED_NETWORK_RULES` property for every enabled integration; a failing result shows an enabled integration whose `ALLOWED_NETWORK_RULES` is empty.

        ### Audit via SQL

        Run the same commands with SnowSQL or the Snowflake CLI:

        ```sql
        SHOW EXTERNAL ACCESS INTEGRATIONS;
        DESC INTEGRATION <integration_name>;
        ```

        A passing result shows `ALLOWED_NETWORK_RULES` populated for each integration where `enabled` is true; a failing result shows at least one enabled integration with no allowed network rules.
      remediation:
        - id: console
          desc: |
            **Using a Snowsight worksheet**

            External access integrations are managed through SQL. Run the following as `ACCOUNTADMIN` in a Snowsight worksheet.

            1. Create an egress network rule describing the exact destinations the workload needs:

                ```sql
                CREATE OR REPLACE NETWORK RULE my_db.my_schema.egress_rule
                  MODE = EGRESS
                  TYPE = HOST_PORT
                  VALUE_LIST = ('api.example.com:443');
                ```

            2. Bind the rule to the integration and re-enable it:

                ```sql
                ALTER EXTERNAL ACCESS INTEGRATION <integration_name>
                  SET ALLOWED_NETWORK_RULES = (my_db.my_schema.egress_rule);
                ```
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            1. Find integrations that are enabled but not scoped to any network rule:

                ```sql
                SHOW EXTERNAL ACCESS INTEGRATIONS;
                DESC INTEGRATION <integration_name>;
                ```

            2. Create an egress network rule and attach it to the integration so its outbound traffic is constrained:

                ```sql
                CREATE OR REPLACE NETWORK RULE my_db.my_schema.egress_rule
                  MODE = EGRESS
                  TYPE = HOST_PORT
                  VALUE_LIST = ('api.example.com:443');

                ALTER EXTERNAL ACCESS INTEGRATION <integration_name>
                  SET ALLOWED_NETWORK_RULES = (my_db.my_schema.egress_rule);
                ```

            3. Re-run `DESC INTEGRATION <integration_name>` and confirm `ALLOWED_NETWORK_RULES` is populated.
        - id: terraform
          desc: |
            The `snowflakedb/snowflake` provider has no resource type for external access integrations. Define the egress rule with `snowflake_network_rule`, then create the integration that references it with `snowflake_execute`, which is the provider's supported way to run DDL it does not model:

            ```hcl
            resource "snowflake_network_rule" "egress" {
              database   = "SECURITY"
              schema     = "NETWORK"
              name       = "EGRESS_RULE"
              type       = "HOST_PORT"
              mode       = "EGRESS"
              value_list = ["api.example.com:443"]
            }

            resource "snowflake_execute" "external_access_integration" {
              execute = <<-SQL
                CREATE OR REPLACE EXTERNAL ACCESS INTEGRATION MY_EAI
                  ALLOWED_NETWORK_RULES = (${snowflake_network_rule.egress.fully_qualified_name})
                  ENABLED = TRUE
              SQL
              revert  = "DROP EXTERNAL ACCESS INTEGRATION IF EXISTS MY_EAI"
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/sql-reference/sql/create-external-access-integration
        title: CREATE EXTERNAL ACCESS INTEGRATION
  - uid: mondoo-snowflake-security-api-integrations-restrict-prefixes
    title: Ensure API integrations restrict allowed URL prefixes
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-2
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-snowflake-security-api-integrations-restrict-prefixes-snowflake
        tags:
          mondoo.com/filter-title: Snowflake
          mondoo.com/filter-icon: snowflake
      - uid: mondoo-snowflake-security-api-integrations-restrict-prefixes-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-api-integrations-restrict-prefixes-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-api-integrations-restrict-prefixes-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that external functions can only call endpoints the account has approved.

        An API integration holds the cloud credentials Snowflake uses to invoke external functions through a proxy service such as AWS API Gateway or Azure API Management. Its `API_ALLOWED_PREFIXES` property lists the URL prefixes that external functions bound to it may call, set with `CREATE API INTEGRATION` or `ALTER API INTEGRATION <name> SET API_ALLOWED_PREFIXES = (...)`. This check requires every enabled API integration to list at least one prefix.

        **Why this matters**

        The integration carries a cloud IAM role, and an external function invoked through it inherits whatever that role can do at the proxy. The prefix list is the difference between "call this one gateway stage" and "call anything this account's gateway fronts". With the list empty, the choice of target moves to whoever can create an external function.

        That is a concrete escalation, not a theoretical one. An attacker who can define an external function on an unconstrained integration points it at an internal or administrative endpoint behind the same gateway, and Snowflake makes the call for them using the integration's credentials from Snowflake's own network, which is frequently an address the gateway trusts more than the attacker's.

        Explicit prefixes also document the account's outbound dependencies. When the list is a handful of named gateway paths, an addition during review is visible; when it is empty, there is nothing to review.

        Include the full resource path in each prefix rather than a bare host, because gateway stages on the same host commonly front unrelated services, and remove prefixes for functions and endpoints that have been retired.
      audit: |
        ### Audit via Snowsight

        1. Sign in to Snowsight as a user with the ACCOUNTADMIN role.
        2. Open a SQL worksheet.
        3. List the integrations and inspect each one:

            ```sql
            SHOW API INTEGRATIONS;
            DESC INTEGRATION <integration_name>;
            ```

        A passing result shows a non-empty `API_ALLOWED_PREFIXES` property for every enabled integration; a failing result shows an enabled integration whose `API_ALLOWED_PREFIXES` is empty.

        ### Audit via SQL

        Run the same commands with SnowSQL or the Snowflake CLI:

        ```sql
        SHOW API INTEGRATIONS;
        DESC INTEGRATION <integration_name>;
        ```

        A passing result shows `API_ALLOWED_PREFIXES` populated for each integration where `enabled` is true; a failing result shows at least one enabled integration with no allowed prefixes.
      remediation:
        - id: console
          desc: |
            **Using a Snowsight worksheet**

            API integrations are managed through SQL. Run the following as `ACCOUNTADMIN` in a Snowsight worksheet.

            1. Inspect the integration to see its current prefixes:

                ```sql
                DESC INTEGRATION <integration_name>;
                ```

            2. Restrict it to the specific gateway URLs the external functions need:

                ```sql
                ALTER API INTEGRATION <integration_name>
                  SET API_ALLOWED_PREFIXES = ('https://my-account.execute-api.us-east-1.amazonaws.com/prod/');
                ```
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            1. Find integrations that are enabled but do not restrict allowed prefixes:

                ```sql
                SHOW API INTEGRATIONS;
                DESC INTEGRATION <integration_name>;
                ```

            2. Set `API_ALLOWED_PREFIXES` to the specific endpoints each external function calls:

                ```sql
                ALTER API INTEGRATION <integration_name>
                  SET API_ALLOWED_PREFIXES = ('https://my-account.execute-api.us-east-1.amazonaws.com/prod/');
                ```

            3. Re-run `DESC INTEGRATION <integration_name>` and confirm `API_ALLOWED_PREFIXES` is populated.
        - id: terraform
          desc: |
            With the `snowflakedb/snowflake` provider, set `api_allowed_prefixes` to the specific gateway URLs on every `snowflake_api_integration` resource:

            ```hcl
            resource "snowflake_api_integration" "api" {
              name                 = "MY_API_INTEGRATION"
              api_provider         = "aws_api_gateway"
              api_aws_role_arn     = "arn:aws:iam::123456789012:role/my-snowflake-role"
              api_allowed_prefixes = ["https://my-account.execute-api.us-east-1.amazonaws.com/prod/"]
              enabled              = true
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/sql-reference/sql/create-api-integration
        title: CREATE API INTEGRATION
  - uid: mondoo-snowflake-security-storage-integrations-restrict-locations
    title: Ensure storage integrations restrict allowed locations
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
