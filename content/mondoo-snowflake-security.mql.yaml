      - uid: mondoo-snowflake-security-no-accountadmin-default-role-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no active user's sessions start with account-wide administrative privilege.

        Every Snowflake user has a default role, set with `ALTER USER <name> SET DEFAULT_ROLE = <role>` and reported as the `default_role` column of `SHOW USERS`. It is the role that every new session, worksheet, driver connection, and scheduled job assumes unless something explicitly calls `USE ROLE`. This check requires that role to be something other than ACCOUNTADMIN on every enabled user.

        **Why this matters**

        The default role decides what happens by accident. A `DROP DATABASE` run against the wrong context, a `DELETE` with a broken predicate, or a script executed by someone who forgot which connection they were on all run with whatever role the session started in. Under ACCOUNTADMIN there is nothing in the account those statements cannot reach.

        It also decides what an attacker inherits for free. A hijacked session, a stolen driver token, a compromised BI tool that connects as the user, or a malicious notebook all adopt the default role. When that role is ACCOUNTADMIN, the intrusion is complete at the moment of access and there is no escalation step for anyone to detect.

        Making elevation deliberate is what gives the control teeth. When an administrator types `USE ROLE ACCOUNTADMIN` for the few operations that require it, privileged actions stand out in `QUERY_HISTORY` instead of every statement that person ran all day carrying the same top-level role.

        Set each default to the least-privileged role covering the person's daily work, such as a team role or SYSADMIN, and keep the ACCOUNTADMIN grants themselves rare, which a companion check in this policy verifies.
      audit: |
        ### Audit via Snowsight

        1. Sign in to Snowsight as a user with the ACCOUNTADMIN or SECURITYADMIN role.
        2. Go to **Governance & security** » **Users & roles**.
        3. Sort or filter the user list by **Default role** and review the entries.

        A passing result shows no active user with a default role of `ACCOUNTADMIN`; a failing result shows one or more active users whose default role is `ACCOUNTADMIN`.

        ### Audit via SQL

        Run the query in a Snowsight worksheet or with SnowSQL:

        ```sql
        SHOW USERS;
        ```

        A passing result shows no row where `disabled` is false and `default_role` equals `ACCOUNTADMIN`; a failing result shows at least one such row.
      remediation:
        - id: console
          desc: |
            **Using Snowsight**

            1. In Snowsight, go to **Governance & security** » **Users & roles**.
            2. Find users whose default role is `ACCOUNTADMIN`.
            3. Open each user, expand **Advanced User Options**, change **Default role** to a least-privilege role such as `SYSADMIN` or a project-specific role, and save.
            4. Users can still `USE ROLE ACCOUNTADMIN` when explicit elevation is needed; this only changes which role is active at login.
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` or `SECURITYADMIN` in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            1. Identify users whose default role is `ACCOUNTADMIN`:

                ```sql
                SELECT NAME, DEFAULT_ROLE
                FROM SNOWFLAKE.ACCOUNT_USAGE.USERS
                WHERE DEFAULT_ROLE = 'ACCOUNTADMIN'
                  AND DISABLED = FALSE;
                ```

                `ACCOUNT_USAGE` views can lag the live state by up to about 3 hours. For an authoritative snapshot, run `SHOW USERS;` and inspect the `default_role` column.

            2. For each affected user, change their default role to the least-privilege role they need day-to-day, such as `SYSADMIN`, `SECURITYADMIN`, or a custom role:

                ```sql
                ALTER USER <user_name> SET DEFAULT_ROLE = SYSADMIN;
                ```

            3. The user can still `USE ROLE ACCOUNTADMIN` when explicit elevation is needed; this only changes which role is active at login.
        - id: terraform
          desc: |
            With the `snowflakedb/snowflake` provider, set `default_role` on each `snowflake_user` resource to a least-privilege role such as `SYSADMIN`. Never set it to `ACCOUNTADMIN`:

            ```hcl
            resource "snowflake_user" "analyst" {
              name         = "ANALYST"
              default_role = "SYSADMIN"
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/user-guide/security-access-control-overview
        title: Snowflake access control best practices
  - uid: mondoo-snowflake-security-password-policy-complexity-configured
    title: Ensure password policies enforce character complexity requirements
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-g
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    variants:
      - uid: mondoo-snowflake-security-password-policy-complexity-configured-snowflake
        tags:
          mondoo.com/filter-title: Snowflake
          mondoo.com/filter-icon: snowflake
      - uid: mondoo-snowflake-security-password-policy-complexity-configured-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-password-policy-complexity-configured-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-password-policy-complexity-configured-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that passwords must combine several character types.

        A password policy governs composition through `PASSWORD_MIN_UPPER_CASE_CHARS`, `PASSWORD_MIN_LOWER_CASE_CHARS`, `PASSWORD_MIN_NUMERIC_CHARS`, and `PASSWORD_MIN_SPECIAL_CHARS`, set on the policy created with `CREATE PASSWORD POLICY` and put into force with `ALTER ACCOUNT SET PASSWORD POLICY <name>`. This check requires each of the four to be at least 1. Snowflake asks for an uppercase letter, a lowercase letter, and a digit by default but does not require a special character.

        **Why this matters**

        Where no special character is required, the practical keyspace collapses to the shape people actually produce: a capitalized word followed by digits. Rule-based cracking is built around that shape. The standard rule sets shipped with password-cracking tools capitalize the first letter, append a year, and substitute a zero for an o, so a password that satisfies three of the four requirements and nothing more is recovered in the same pass as the raw dictionary word underneath it.

        The same predictability is what makes credential reuse work. A password of that shape for a Snowflake account is usually the password for several consumer sites too, and one of those breaches is what puts it in the dump an attacker replays.

        Complexity is the smaller half of password strength, and standards disagree about it. NIST SP 800-63B now advises against composition rules on the grounds that they push users toward predictable substitutions, while CIS benchmarks and PCI DSS still require them. Treat the length minimum as the control that does the real work and complexity as a floor under the worst choices.

        Neither helps against a password that was phished or stolen intact, so keep MFA mandatory alongside both.
      audit: |
        ### Audit via SQL

        Run the query in a Snowsight worksheet or with SnowSQL:

        ```sql
        SHOW PASSWORD POLICIES;
        ```

        For the policy attached to the account, run `DESC PASSWORD POLICY <policy_name>`: a passing result shows `PASSWORD_MIN_UPPER_CASE_CHARS`, `PASSWORD_MIN_LOWER_CASE_CHARS`, `PASSWORD_MIN_NUMERIC_CHARS`, and `PASSWORD_MIN_SPECIAL_CHARS` all set to 1 or greater, while a failing result shows any of them at 0 or no password policy configured.
      remediation:
        # No console remediation: Snowsight has no password policy editor. Password policies are schema-level objects managed entirely through SQL; use the SQL method in a Snowsight worksheet.
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            > **Important:** A Snowflake account attaches **at most one** password policy. Prefer `ALTER PASSWORD POLICY` on the existing policy. Do not blindly `CREATE OR REPLACE`, because that overwrites settings other policy checks may have already configured.

            1. Find the policy currently attached to the account:

                ```sql
                SHOW PASSWORD POLICIES;
                SHOW PARAMETERS LIKE 'PASSWORD_POLICY' IN ACCOUNT;
                ```

            2. Update the existing policy:

                ```sql
                ALTER PASSWORD POLICY <policy_name> SET
                  PASSWORD_MIN_UPPER_CASE_CHARS = 1
                  PASSWORD_MIN_LOWER_CASE_CHARS = 1
                  PASSWORD_MIN_NUMERIC_CHARS    = 1
                  PASSWORD_MIN_SPECIAL_CHARS    = 1;
                ```

            3. If no policy is attached yet, create one and attach it. Subsequent password-policy checks should `ALTER` this same policy:

                ```sql
                CREATE PASSWORD POLICY IF NOT EXISTS <policy_name>
                  PASSWORD_MIN_UPPER_CASE_CHARS = 1
                  PASSWORD_MIN_LOWER_CASE_CHARS = 1
                  PASSWORD_MIN_NUMERIC_CHARS    = 1
                  PASSWORD_MIN_SPECIAL_CHARS    = 1;
                ALTER ACCOUNT SET PASSWORD POLICY <policy_name>;
                ```
        - id: terraform
          desc: |
            With the `snowflakedb/snowflake` provider, set each character-class minimum to at least `1` on the `snowflake_password_policy` resource, then attach the policy to the account. Both resources are preview features, so enable them in the provider configuration first:

            ```hcl
            provider "snowflake" {
              preview_features_enabled = [
                "snowflake_password_policy_resource",
                "snowflake_account_password_policy_attachment_resource",
              ]
            }

            resource "snowflake_password_policy" "account" {
              database             = "SECURITY"
              schema               = "POLICIES"
              name                 = "ACCOUNT_PASSWORD_POLICY"
              min_upper_case_chars = 1
              min_lower_case_chars = 1
              min_numeric_chars    = 1
              min_special_chars    = 1
            }

            resource "snowflake_account_password_policy_attachment" "account" {
              password_policy = snowflake_password_policy.account.fully_qualified_name
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/sql-reference/sql/create-password-policy
        title: Snowflake password policy documentation
  - uid: mondoo-snowflake-security-password-policy-max-age-configured
    title: Ensure password policies enforce a maximum password age
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-g
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-9
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    variants:
      - uid: mondoo-snowflake-security-password-policy-max-age-configured-snowflake
        tags:
          mondoo.com/filter-title: Snowflake
          mondoo.com/filter-icon: snowflake
      - uid: mondoo-snowflake-security-password-policy-max-age-configured-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-password-policy-max-age-configured-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-password-policy-max-age-configured-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that passwords expire rather than remaining valid forever.

        `PASSWORD_MAX_AGE_DAYS` on a password policy sets how many days a password stays usable before Snowflake forces a change. A value of 0 disables expiry entirely. The parameter is set on the policy created with `CREATE PASSWORD POLICY` and put into force with `ALTER ACCOUNT SET PASSWORD POLICY <name>`. This check requires every password policy to set a non-zero value of 90 days or less.

        **Why this matters**

        Most Snowflake credential compromise is silent. An infostealer scrapes a browser profile or a credential file, the password goes into a log, and the log is bundled and sold months later. Nobody at the affected organization has any indication that anything happened. Expiry is what puts a ceiling on how long that quietly stolen password keeps working, independent of whether anyone ever notices the theft.

        A password with no expiry also outlives the circumstances it was issued under. It survives the departure of the colleague who helped set it up, the laptop that was reimaged, the contractor engagement that ended, and the shared credential that was supposed to be temporary. Each of those is a copy that is still valid years later.

        Expiry has costs and is not universally recommended: NIST SP 800-63B argues against arbitrary periodic rotation and asks for forced change on evidence of compromise instead, because frequent rotation drives users toward incremental passwords. The requirement persists because CIS benchmarks and PCI DSS still mandate it, and because for a data warehouse the alternative of relying on compromise detection is weak.

        Pair rotation with password history so each change produces a genuinely new secret, and with MFA so an intercepted password is not sufficient on its own. Both are verified by companion checks in this policy.
      audit: |
        ### Audit via SQL

        Run the query in a Snowsight worksheet or with SnowSQL:

        ```sql
        SHOW PASSWORD POLICIES;
        ```

        For the policy attached to the account, run `DESC PASSWORD POLICY <policy_name>`: a passing result shows `PASSWORD_MAX_AGE_DAYS` between 1 and 90, while a failing result shows 0, a value above 90, or no password policy configured.
      remediation:
        # No console remediation: Snowsight has no password policy editor. Password policies are schema-level objects managed entirely through SQL; use the SQL method in a Snowsight worksheet.
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            > **Important:** A Snowflake account attaches **at most one** password policy. Prefer `ALTER PASSWORD POLICY` on the existing policy. Do not blindly `CREATE OR REPLACE`, because that overwrites settings other policy checks may have already configured.

            1. Find the policy currently attached to the account:

                ```sql
                SHOW PASSWORD POLICIES;
                SHOW PARAMETERS LIKE 'PASSWORD_POLICY' IN ACCOUNT;
                ```

            2. Update the existing policy:

                ```sql
                ALTER PASSWORD POLICY <policy_name> SET PASSWORD_MAX_AGE_DAYS = 90;
                ```

            3. If no policy is attached yet, create one and attach it. Subsequent password-policy checks should `ALTER` this same policy:

                ```sql
                CREATE PASSWORD POLICY IF NOT EXISTS <policy_name>
                  PASSWORD_MAX_AGE_DAYS = 90;
                ALTER ACCOUNT SET PASSWORD POLICY <policy_name>;
                ```
        - id: terraform
          desc: |
            With the `snowflakedb/snowflake` provider, set `max_age_days` to a value between 1 and 90 on the `snowflake_password_policy` resource, then attach the policy to the account. Both resources are preview features, so enable them in the provider configuration first:

            ```hcl
            provider "snowflake" {
              preview_features_enabled = [
                "snowflake_password_policy_resource",
                "snowflake_account_password_policy_attachment_resource",
              ]
            }

            resource "snowflake_password_policy" "account" {
              database     = "SECURITY"
              schema       = "POLICIES"
              name         = "ACCOUNT_PASSWORD_POLICY"
              max_age_days = 90
            }

            resource "snowflake_account_password_policy_attachment" "account" {
              password_policy = snowflake_password_policy.account.fully_qualified_name
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/sql-reference/sql/create-password-policy
        title: Snowflake password policy documentation
  - uid: mondoo-snowflake-security-password-policy-history-configured
    title: Ensure password policies enforce password history
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-g
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-7
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
