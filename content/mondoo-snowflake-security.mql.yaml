        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-storage-integrations-restrict-locations-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that storage integrations confine stages to specific cloud storage locations.

        A storage integration's `STORAGE_ALLOWED_LOCATIONS` property lists the bucket and prefix URLs that stages built on it may read from and write to, set with `CREATE STORAGE INTEGRATION` or `ALTER STORAGE INTEGRATION <name> SET STORAGE_ALLOWED_LOCATIONS = (...)`. A single `*` entry permits every location the integration's cloud role can reach. This check requires every enabled storage integration to list at least one location and to contain no wildcard.

        **Why this matters**

        The integration is the trust boundary for data leaving the warehouse. A stage built on an unrestricted one can unload query results to any bucket the underlying cloud IAM role can write, and that role is often scoped broadly because it was created once and reused for everything. The reachable surface is then the cloud account, not the two buckets anyone intended.

        The wildcard is the more dangerous of the two failures because it reports as configured. A reviewer opening the integration sees a populated allowed-locations list and moves on, when in fact the list places no ceiling on anything. An empty list at least looks unfinished.

        Restriction at the integration is also what stops a legitimate-looking stage from being an exfiltration path. Anyone with the privilege to create stages can point one at a destination of their choosing; the allowed-locations list is what decides whether Snowflake will actually write there.

        Scope the cloud IAM role as well, since `STORAGE_ALLOWED_LOCATIONS` restricts Snowflake while the IAM policy restricts everything. Use `STORAGE_BLOCKED_LOCATIONS` for sub-paths that must stay unreachable inside an otherwise allowed prefix, and revisit the list as storage layouts change.
      audit: |
        ### Audit via Snowsight

        1. Sign in to Snowsight as a user with the ACCOUNTADMIN role.
        2. Open a SQL worksheet.
        3. List the integrations and inspect each one:

            ```sql
            SHOW STORAGE INTEGRATIONS;
            DESC INTEGRATION <integration_name>;
            ```

        A passing result shows a non-empty `STORAGE_ALLOWED_LOCATIONS` property with no `*` entry for every enabled integration; a failing result shows an enabled integration whose allowed locations are empty or include `*`.

        ### Audit via SQL

        Run the same commands with SnowSQL or the Snowflake CLI:

        ```sql
        SHOW STORAGE INTEGRATIONS;
        DESC INTEGRATION <integration_name>;
        ```

        A passing result shows `STORAGE_ALLOWED_LOCATIONS` populated with specific paths for each enabled integration; a failing result shows an empty list or a `*` wildcard entry.
      remediation:
        - id: console
          desc: |
            **Using a Snowsight worksheet**

            Storage integrations are managed through SQL. Run the following as `ACCOUNTADMIN` in a Snowsight worksheet.

            1. Inspect the integration to see its current locations:

                ```sql
                DESC INTEGRATION <integration_name>;
                ```

            2. Restrict it to the specific storage paths your workloads use, replacing any `*` wildcard:

                ```sql
                ALTER STORAGE INTEGRATION <integration_name>
                  SET STORAGE_ALLOWED_LOCATIONS = ('s3://my-bucket/path/');
                ```
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            1. Find integrations that are enabled but unrestricted or wildcarded:

                ```sql
                SHOW STORAGE INTEGRATIONS;
                DESC INTEGRATION <integration_name>;
                ```

            2. Set `STORAGE_ALLOWED_LOCATIONS` to the exact bucket or container paths each workload uses, and remove any `*` entry:

                ```sql
                ALTER STORAGE INTEGRATION <integration_name>
                  SET STORAGE_ALLOWED_LOCATIONS = ('s3://my-bucket/path/');
                ```

            3. Re-run `DESC INTEGRATION <integration_name>` and confirm the locations are specific and contain no `*`.
        - id: terraform
          desc: |
            With the `snowflakedb/snowflake` provider, set `storage_allowed_locations` to specific storage paths on every `snowflake_storage_integration` resource. Never use the `*` wildcard:

            ```hcl
            resource "snowflake_storage_integration" "storage" {
              name                      = "MY_STORAGE_INTEGRATION"
              storage_provider          = "S3"
              storage_aws_role_arn      = "arn:aws:iam::123456789012:role/my-snowflake-role"
              storage_allowed_locations = ["s3://my-bucket/path/"]
              enabled                   = true
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/sql-reference/sql/create-storage-integration
        title: CREATE STORAGE INTEGRATION
