          mondoo.com/filter-title: Snowflake
          mondoo.com/filter-icon: snowflake
      - uid: mondoo-snowflake-security-password-policy-history-configured-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-password-policy-history-configured-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-password-policy-history-configured-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that users cannot return to a password they have recently used.

        `PASSWORD_HISTORY` on a password policy sets how many previous passwords Snowflake remembers and refuses to accept again. Snowflake defaults it to 0, which remembers none. The parameter is set on the policy created with `CREATE PASSWORD POLICY` and put into force with `ALTER ACCOUNT SET PASSWORD POLICY <name>`. This check requires every password policy to remember at least five.

        **Why this matters**

        Without history, rotation is a formality. A user prompted to change their password sets it back to the one they have always used, or alternates between two, and the maximum-age requirement is satisfied on paper while the secret never actually changes. Every day of exposure the rotation was supposed to end continues.

        That matters most in the case rotation exists for. When a password has leaked into a breach dump and the organization forces a change, an attacker holding the old value simply retries it a few weeks later. History is what makes the forced change a real invalidation rather than a pause.

        Recycling is also what an attacker predicts. Someone who has one historical password for a user can usually guess the next few, because the sequence is the same base word with a rising number, and history at least prevents the exact reuse at the end of that pattern.

        Five entries is a common baseline and works alongside the maximum-age requirement rather than replacing it: history without expiry never forces a change, and expiry without history never forces a different secret. A companion check in this policy verifies the maximum age.
      audit: |
        ### Audit via SQL

        Run the query in a Snowsight worksheet or with SnowSQL:

        ```sql
        SHOW PASSWORD POLICIES;
        ```

        For the policy attached to the account, run `DESC PASSWORD POLICY <policy_name>`: a passing result shows `PASSWORD_HISTORY` of 5 or greater, while a failing result shows a lower value or no password policy configured.
      remediation:
        # No console remediation: Snowsight has no password policy editor. Password policies are schema-level objects managed entirely through SQL; use the SQL method in a Snowsight worksheet.
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            > **Important:** A Snowflake account attaches **at most one** password policy. Prefer `ALTER PASSWORD POLICY` on the existing policy. Do not blindly `CREATE OR REPLACE`, because that overwrites settings other policy checks may have already configured.

            1. Find the policy currently attached to the account:

                ```sql
                SHOW PASSWORD POLICIES;
                SHOW PARAMETERS LIKE 'PASSWORD_POLICY' IN ACCOUNT;
                ```

            2. Update the existing policy:

                ```sql
                ALTER PASSWORD POLICY <policy_name> SET PASSWORD_HISTORY = 5;
                ```

            3. If no policy is attached yet, create one and attach it. Subsequent password-policy checks should `ALTER` this same policy:

                ```sql
                CREATE PASSWORD POLICY IF NOT EXISTS <policy_name>
                  PASSWORD_HISTORY = 5;
                ALTER ACCOUNT SET PASSWORD POLICY <policy_name>;
                ```
        - id: terraform
          desc: |
            With the `snowflakedb/snowflake` provider, set `history` to at least `5` on the `snowflake_password_policy` resource, then attach the policy to the account. Both resources are preview features, so enable them in the provider configuration first:

            ```hcl
            provider "snowflake" {
              preview_features_enabled = [
                "snowflake_password_policy_resource",
                "snowflake_account_password_policy_attachment_resource",
              ]
            }

            resource "snowflake_password_policy" "account" {
              database = "SECURITY"
              schema   = "POLICIES"
              name     = "ACCOUNT_PASSWORD_POLICY"
              history  = 5
            }

            resource "snowflake_account_password_policy_attachment" "account" {
              password_policy = snowflake_password_policy.account.fully_qualified_name
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/sql-reference/sql/create-password-policy
        title: Snowflake password policy documentation
  - uid: mondoo-snowflake-security-databases-retention-configured
    title: Ensure databases have Time Travel retention configured
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-13
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ip-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc9-1-1
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-snowflake-security-databases-retention-configured-snowflake
        tags:
          mondoo.com/filter-title: Snowflake
          mondoo.com/filter-icon: snowflake
      - uid: mondoo-snowflake-security-databases-retention-configured-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-databases-retention-configured-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-snowflake-security-databases-retention-configured-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that databases keep enough history to recover data that is deleted or overwritten.

        Time Travel is governed by `DATA_RETENTION_TIME_IN_DAYS`, set with `CREATE DATABASE ... DATA_RETENTION_TIME_IN_DAYS = <n>` or `ALTER DATABASE <name> SET DATA_RETENTION_TIME_IN_DAYS = <n>`, and inherited from the account default when unset. A value of 0 turns Time Travel off. This check requires a value above 0 on every database created in the account. Databases mounted from a share are excluded because their retention is controlled by the provider account, not by yours.

        **Why this matters**

        With retention at 0, destruction is immediate and final. `DROP TABLE` and `UNDROP TABLE` stop being a pair, `DELETE` cannot be reversed, and an `INSERT OVERWRITE` that a pipeline bug pointed at the wrong target has no prior version to restore from. Recovery then means whatever copy exists outside Snowflake, which for a warehouse fed by streaming and transformed in place is frequently nothing.

        That is a control against attackers as much as against mistakes. Extortion against data platforms works either by taking the data or by taking it away, and a compromised role with DELETE and DROP privileges can do enormous, permanent damage in a few statements if there is no history behind them.

        Retention is also the investigation surface. Querying a table `AT` or `BEFORE` a timestamp is how you establish what a row contained before a suspicious update, which records existed before a bulk delete, and when the change actually happened. Without it the evidence disappears at the same moment as the data.

        Retention consumes storage, so a deliberate 0 on scratch or staging databases that are rebuilt from source each night is defensible. Set a non-zero account default so new databases inherit protection, and use longer windows, up to 90 days on Enterprise edition, for databases holding regulated or irreplaceable data.
      audit: |
        ### Audit via SQL

        Run the query in a Snowsight worksheet or with SnowSQL:

        ```sql
        SHOW DATABASES;
        ```

        A passing result shows a `retention_time` greater than 0 for every locally created database; a failing result shows at least one such database with a `retention_time` of 0. Databases imported from shares are excluded because their retention cannot be changed.
      remediation:
        # No console remediation: Snowsight's database editor supports only renaming and comments; Time Travel retention is set with SQL. Use the SQL method in a Snowsight worksheet.
        - id: sql
          desc: |
            Run as `ACCOUNTADMIN` or the database owner in a Snowsight worksheet, via SnowSQL, or with the Snowflake CLI.

            On Standard edition the maximum retention is 1 day, so use `1` there. Enterprise edition and above support up to `90`; production workloads on those editions typically want `7` or higher to give incident response a useful restore window. Transient databases support at most 1 day regardless of edition. Imported databases from shares cannot be altered and are excluded below.

            1. Find local databases below the desired retention threshold:

                ```sql
                SHOW DATABASES;
                SELECT DATABASE_NAME, RETENTION_TIME, TYPE
                FROM SNOWFLAKE.ACCOUNT_USAGE.DATABASES
                WHERE DELETED IS NULL
                  AND TYPE = 'STANDARD'
                  AND RETENTION_TIME < 1;
                ```

            2. Raise retention on each affected database. Use `1` on Standard edition and for transient databases:

                ```sql
                ALTER DATABASE <database_name> SET DATA_RETENTION_TIME_IN_DAYS = 7;
                ```

            3. Raise the account-level default so newly created databases inherit the safer value:

                ```sql
                ALTER ACCOUNT SET DATA_RETENTION_TIME_IN_DAYS = 7;
                ```
        - id: terraform
          desc: |
            With the `snowflakedb/snowflake` provider, set `data_retention_time_in_days` to a non-zero value on every `snowflake_database` resource. Use `1` on Standard edition; Enterprise edition and above support up to `90`:

            ```hcl
            resource "snowflake_database" "analytics" {
              name                        = "ANALYTICS"
              data_retention_time_in_days = 7
            }
            ```
    refs:
      - url: https://docs.snowflake.com/en/user-guide/data-time-travel
        title: Snowflake Time Travel documentation
