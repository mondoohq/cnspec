policies:
  - uid: mondoo-snowflake-security
    name: Mondoo Snowflake Security
    version: 2.0.3
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: snowflake,saas
      mondoo.com/icon: snowflake
    require:
      - provider: snowflake
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Snowflake accounts, users, and access controls
    docs:
      desc: |
        The Mondoo Snowflake Security policy identifies critical misconfigurations in Snowflake accounts that could expose sensitive data and analytics workloads to attackers. This policy helps organizations detect and remediate weaknesses before they can be exploited, reducing the likelihood of unauthorized data access, credential theft, and abuse of privileged roles in your data warehouse.

        This policy provides security checks across key Snowflake areas:

        - Identity and access management
        - Authentication policies and multi-factor authentication enforcement
        - Password and key-pair authentication policies
        - Network access controls and network policies
        - Privileged role management for ACCOUNTADMIN, SECURITYADMIN, and SYSADMIN
        - Session management and single sign-on integrity
        - Data egress controls for stages, integrations, and functions
        - Cortex AI access, inference data residency, agent and MCP server tools, and AI spend limits

        Learn more about scanning Snowflake in the [cnspec Snowflake documentation](https://mondoo.com/docs/cnspec/databases/snowflake).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Identity and Access Management
        checks:
          - uid: mondoo-snowflake-security-mfa-enabled-for-active-users
          - uid: mondoo-snowflake-security-accountadmin-role-limited
          - uid: mondoo-snowflake-security-no-users-pending-password-change
          - uid: mondoo-snowflake-security-no-accountadmin-default-role
          - uid: mondoo-snowflake-security-service-users-no-password
          - uid: mondoo-snowflake-security-no-legacy-service-users
          - uid: mondoo-snowflake-security-no-dormant-active-users
          - uid: mondoo-snowflake-security-no-never-logged-in-active-users
          - uid: mondoo-snowflake-security-tasks-not-owned-by-privileged-role
      - title: Authentication and MFA
        checks:
          - uid: mondoo-snowflake-security-authentication-policy-mfa-required
          - uid: mondoo-snowflake-security-authentication-policy-no-single-factor-password
          - uid: mondoo-snowflake-security-no-active-mfa-bypass
      - title: Password Policies
        checks:
          - uid: mondoo-snowflake-security-password-policy-minimum-length
          - uid: mondoo-snowflake-security-password-policy-lockout-configured
          - uid: mondoo-snowflake-security-password-policy-complexity-configured
          - uid: mondoo-snowflake-security-password-policy-max-age-configured
          - uid: mondoo-snowflake-security-password-policy-history-configured
      - title: Network Access Controls
        checks:
          - uid: mondoo-snowflake-security-network-policies-configured
