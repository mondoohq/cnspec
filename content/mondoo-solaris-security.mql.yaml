          title: "svcadm - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the multicast DNS and DNS Service Discovery daemon is not enabled.

        The `mdnsd` daemon listens on UDP port 5353, answers multicast DNS queries from any host on the local link, and advertises the services registered on the host. It is managed by SMF as `svc:/network/dns/multicast:default`. That instance must be disabled, or not installed.

        **Why this matters**

        Multicast DNS answers anyone on the local network without authentication. A host running it announces its name and the services it offers, which gives an attacker on the same segment an inventory of targets without a single port scan.

        Because answers are unauthenticated, another host on the link can also answer queries for names it does not own and redirect clients that resolve names through `mdns` in the name service switch.

        Servers have no use for zero configuration discovery. Workstations that discover printers or shares on the local network may legitimately need it, and there the service should stay limited to trusted networks.
      audit: |
        1. List the SMF instances of the multicast DNS service:

           ```bash
           svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/dns/multicast:'
           ```

        2. Read the state in the first column of each line.

        The check passes when the command prints nothing, because no instance is installed, or when every line shows `disabled`, `uninitialized`, or `incomplete`. An `incomplete` instance is only named by another manifest and has no package installed. Any other state, including `online`, `offline`, and `maintenance`, counts as enabled and fails.
      remediation:
        - id: cli
          desc: |
            To disable the multicast DNS service using the SMF command line:

            1. List the installed instances with `svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/dns/multicast:'`. If nothing is printed, no change is needed.
            2. Disable each instance that is not already `disabled`. Without `-t` the change persists across reboots, and `-s` waits until the instance reaches the disabled state.
            3. Confirm that every instance now reports `disabled`.

            ```bash
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/dns/multicast:'
            svcadm disable -s svc:/network/dns/multicast:default
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/dns/multicast:'
            ```
        - id: sh
          desc: |
            To disable every installed instance of the multicast DNS service using a shell script:

            1. Save the script and run it as root.
            2. The script reads all SMF instances and persistently disables each matching instance that is not already disabled. It makes no change when the multicast DNS service is not installed.

            ```sh
            #!/bin/sh
            set -e

            svcs -aH -o state,fmri | while read -r state fmri; do
              case "$fmri" in
                svc:/network/dns/multicast:*)
                  case "$state" in
                    disabled | uninitialized | incomplete) ;;
                    *) svcadm disable -s "$fmri" ;;
                  esac
                  ;;
              esac
            done
            ```
        - id: ansible
          desc: |
            To disable every installed instance of the multicast DNS service using Ansible:

            1. List the SMF instances on the host.
            2. Disable and stop each instance whose FMRI matches. `ansible.builtin.service` drives `svcadm` on Solaris, and `enabled: false` makes the change persistent. Hosts without the multicast DNS service installed get no change.

            ```yaml
            ---
            - name: Disable the multicast DNS service
              hosts: all
              become: true
              tasks:
                - name: List SMF service instances
                  ansible.builtin.command: svcs -aH -o state,fmri
                  register: smf_instances
                  changed_when: false

                - name: Disable and stop multicast DNS service instances
                  ansible.builtin.service:
                    name: "{{ item }}"
                    state: stopped
                    enabled: false
                  vars:
                    installed_fmris: "{{ smf_instances.stdout_lines | reject('match', '^incomplete ') | map('split') | map('last') | list }}"
                  loop: "{{ installed_fmris | select('match', '^svc:/network/dns/multicast:') | list }}"
            ```

  - uid: mondoo-solaris-security-graphical-login-is-not-enabled
    title: Ensure the graphical login manager is not enabled
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: false
    mql: |
      services.where(name == /^svc:\/application\/graphical-login\//).all(enabled == false)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/gdm-8.html
          title: "gdm - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/svcadm-8.html
          title: "svcadm - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that no graphical login manager is enabled.

        The GNOME Display Manager, `gdm`, starts the X server and presents a graphical login screen on the console. It is managed by SMF as `svc:/application/graphical-login/gdm:default`. Every instance under `svc:/application/graphical-login/` must be disabled, or absent. SMF lists the gdm instance in the `incomplete` state when another package's manifest refers to it but GDM itself is not installed. That instance cannot run and passes.

        **Why this matters**

        A server is administered over SSH and does not need a desktop. The display manager starts the X server and the greeter with elevated privileges and pulls in the whole desktop session stack, which is a large body of code that runs on the host whether or not anyone uses it. Privilege escalation flaws in X servers and display managers are a recurring class of vulnerability, and each one turns a local foothold into root.

        A display manager can also accept remote XDMCP sessions if configured to, which sends the login and the session unencrypted.

        Workstations and hosts that are used at their console legitimately need graphical login. On those, keep XDMCP disabled.
      audit: |
        1. List the SMF instances of the graphical login manager:

           ```bash
           svcs -a | /usr/xpg4/bin/grep -E 'svc:/application/graphical-login/'
           ```

        2. Read the state in the first column of each line.

        The check passes when the command prints nothing, because no instance is installed, or when every line shows `disabled`, `uninitialized`, or `incomplete`. An `incomplete` instance is only named by another manifest and has no package installed. Any other state, including `online`, `offline`, and `maintenance`, counts as enabled and fails.
      remediation:
        - id: cli
          desc: |
            To disable the graphical login manager using the SMF command line:

            1. List the installed instances with `svcs -a | /usr/xpg4/bin/grep -E 'svc:/application/graphical-login/'`. If nothing is printed, no change is needed.
            2. Disable each instance that is not already `disabled`. Without `-t` the change persists across reboots.
            3. Confirm that every instance now reports `disabled`.

            ```bash
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/application/graphical-login/'
            svcadm disable svc:/application/graphical-login/gdm:default
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/application/graphical-login/'
            ```
        - id: sh
          desc: |
            To disable every installed instance of the graphical login manager using a shell script:

            1. Save the script and run it as root.
            2. The script reads all SMF instances and persistently disables each matching instance that is not already disabled. It makes no change when the graphical login manager is not installed.

            ```sh
            #!/bin/sh
            set -e

            svcs -aH -o state,fmri | while read -r state fmri; do
              case "$fmri" in
                svc:/application/graphical-login/*)
                  case "$state" in
                    disabled | uninitialized | incomplete) ;;
                    *) svcadm disable "$fmri" ;;
                  esac
                  ;;
              esac
            done
            ```
        - id: ansible
          desc: |
            To disable every installed instance of the graphical login manager using Ansible:

            1. List the SMF instances on the host.
            2. Disable and stop each instance whose FMRI matches. `ansible.builtin.service` drives `svcadm` on Solaris, and `enabled: false` makes the change persistent. Hosts without the graphical login manager installed get no change.

            ```yaml
            ---
            - name: Disable the graphical login manager
              hosts: all
              become: true
              tasks:
                - name: List SMF service instances
                  ansible.builtin.command: svcs -aH -o state,fmri
                  register: smf_instances
                  changed_when: false

                - name: Disable and stop graphical login manager instances
                  ansible.builtin.service:
                    name: "{{ item }}"
                    state: stopped
                    enabled: false
                  vars:
                    installed_fmris: "{{ smf_instances.stdout_lines | reject('match', '^incomplete ') | map('split') | map('last') | list }}"
                  loop: "{{ installed_fmris | select('match', '^svc:/application/graphical-login/') | list }}"
            ```

  - uid: mondoo-solaris-security-rpcbind-is-local-only
    title: Ensure rpcbind does not accept remote clients
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-3-2
    mql: |
      service("svc:/network/rpc/bind:default").enabled == false || command("svcprop -p config/local_only svc:/network/rpc/bind:default").stdout.trim == "true"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/rpcbind-8.html
          title: "rpcbind - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/svccfg-8.html
          title: "svccfg - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the RPC port mapper refuses requests from remote clients.

        `rpcbind` maps RPC program numbers to the ports their servers listen on, on TCP and UDP port 111. It is managed by SMF as `svc:/network/rpc/bind:default`, and the SMF property `config/local_only` decides whether remote clients may use it. The property must be `true`, which is the Solaris default, or the service must be disabled.

        **Why this matters**

        A remotely reachable `rpcbind` answers anyone who asks with the full list of RPC services on the host and the ports they use, as `rpcinfo -p` shows. An attacker uses that list to find NFS, NIS, and other RPC daemons that a port scan of well-known ports would miss, and then targets each one directly.

        The port mapper's UDP service also returns responses many times larger than the request, which makes an exposed `rpcbind` a common reflector in amplification attacks against third parties.

        Many local services depend on `rpcbind`, so restricting it to local clients is preferred over disabling it. A host that serves NFS version 3 or NIS to other systems needs remote access to `rpcbind`, and there the check does not apply; restrict which networks can reach port 111 instead.
      audit: |
        1. Check whether the service is enabled:

           ```bash
           svcs -H -o state svc:/network/rpc/bind:default
           ```

        2. Read the remote access property:

           ```bash
           svcprop -p config/local_only svc:/network/rpc/bind:default
           ```

        The check passes when step 1 prints `disabled` or when step 2 prints `true`. It fails when the service is in any other state and the property is `false`.
      remediation:
        - id: cli
          desc: |
            To restrict rpcbind to local clients using the SMF command line:

            1. Set the `config/local_only` property to `true`.
            2. Refresh the instance so it reads the new value.
            3. Restart the instance so it stops accepting remote connections.
            4. Confirm the property now reads `true`.

            ```bash
            svccfg -s svc:/network/rpc/bind setprop config/local_only = true
            svcadm refresh svc:/network/rpc/bind:default
            svcadm restart svc:/network/rpc/bind:default
            svcprop -p config/local_only svc:/network/rpc/bind:default
            ```
        - id: sh
          desc: |
            To restrict rpcbind to local clients using a shell script:

            1. Save the script and run it as root.
            2. The script sets `config/local_only` only when it is not already `true`, refreshes the instance, and restarts it when it is online.

            ```sh
            #!/bin/sh
            set -e

            fmri=svc:/network/rpc/bind:default

            if [ "$(svcprop -p config/local_only "$fmri")" != "true" ]; then
              svccfg -s svc:/network/rpc/bind setprop config/local_only = true
              svcadm refresh "$fmri"
              if [ "$(svcs -H -o state "$fmri")" = "online" ]; then
                svcadm restart "$fmri"
              fi
            fi
            ```
        - id: ansible
          desc: |
            To restrict rpcbind to local clients using Ansible:

            1. Read the current `config/local_only` value with `svcprop`.
            2. Set it with `svccfg` only when it is not `true`; no Ansible module manages SMF properties.
            3. Refresh the instance, and restart it when it is online, through handlers that run only after a change.

            ```yaml
            ---
            - name: Restrict rpcbind to local clients
              hosts: all
              become: true
              tasks:
                - name: Read the rpcbind local_only property
                  ansible.builtin.command: svcprop -p config/local_only svc:/network/rpc/bind:default
                  register: rpcbind_local_only
                  changed_when: false

                - name: Set the rpcbind local_only property to true
                  ansible.builtin.command: svccfg -s svc:/network/rpc/bind setprop config/local_only = true
                  when: rpcbind_local_only.stdout | trim != 'true'
                  changed_when: true
                  notify:
                    - Refresh rpcbind
                    - Restart rpcbind

              handlers:
                - name: Refresh rpcbind
                  ansible.builtin.command: svcadm refresh svc:/network/rpc/bind:default
                  changed_when: true

                - name: Restart rpcbind
                  ansible.builtin.command: svcadm restart svc:/network/rpc/bind:default
                  changed_when: true
            ```

  - uid: mondoo-solaris-security-mail-transfer-agent-is-local-only
    title: Ensure the mail transfer agent accepts only local connections
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-3-2
    mql: |
      service("svc:/network/smtp:sendmail").enabled == false || command("svcprop -p config/local_only svc:/network/smtp:sendmail").stdout.trim == "true"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/sendmail-8.html
          title: "sendmail - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/svccfg-8.html
          title: "svccfg - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the mail transfer agent does not accept SMTP connections from remote hosts.

        On Solaris 11.4 the mail transfer agent is sendmail, managed by SMF as `svc:/network/smtp:sendmail`. The SMF property `config/local_only` decides whether sendmail listens for remote connections on TCP port 25 or only on the loopback interface. The property must be `true`, which is the Solaris default, or the instance must be disabled or not installed. Local programs can still submit mail and sendmail still delivers it onward.

        **Why this matters**

        A mail server listening on the network accepts connections from anyone who can reach port 25. An attacker probes it for open relaying, which lets spam and phishing go out under the host's address and reputation, and uses the SMTP dialogue to confirm which local user names exist.

        The listener also exposes the mail transfer agent's parser to every remote sender, and sendmail has a long history of remotely exploitable vulnerabilities in that code.

        A host whose role is to receive mail from other systems legitimately needs remote SMTP access. Hosts that only send their own system mail, which is nearly every server, do not.
      audit: |
        1. Check whether the instance is installed and enabled:

           ```bash
           svcs -H -o state svc:/network/smtp:sendmail
           ```

        2. If the instance exists and is not disabled, read the remote access property:

           ```bash
           svcprop -p config/local_only svc:/network/smtp:sendmail
           ```

        The check passes when step 1 reports that the pattern does not match any instances, when it prints `disabled`, or when step 2 prints `true`. It fails when the instance is in any other state and the property is `false`.
      remediation:
        - id: cli
          desc: |
            To restrict sendmail to local clients using the SMF command line:

            1. Set the `config/local_only` property to `true`.
            2. Refresh the instance so it reads the new value.
            3. Restart the instance so it stops accepting remote connections.
            4. Confirm the property now reads `true`.

            ```bash
            svccfg -s svc:/network/smtp:sendmail setprop config/local_only = true
            svcadm refresh svc:/network/smtp:sendmail
            svcadm restart svc:/network/smtp:sendmail
            svcprop -p config/local_only svc:/network/smtp:sendmail
            ```
        - id: sh
          desc: |
            To restrict sendmail to local clients using a shell script:

            1. Save the script and run it as root.
            2. The script sets `config/local_only` only when it is not already `true`, refreshes the instance, and restarts it when it is online. It makes no change when the instance is not installed.

            ```sh
            #!/bin/sh
            set -e

            fmri=svc:/network/smtp:sendmail
            if ! svcs -H -o state "$fmri" >/dev/null 2>&1; then
              exit 0
            fi

            if [ "$(svcprop -p config/local_only "$fmri")" != "true" ]; then
              svccfg -s svc:/network/smtp:sendmail setprop config/local_only = true
              svcadm refresh "$fmri"
              if [ "$(svcs -H -o state "$fmri")" = "online" ]; then
                svcadm restart "$fmri"
              fi
            fi
            ```
        - id: ansible
          desc: |
            To restrict sendmail to local clients using Ansible:

            1. Read the current `config/local_only` value with `svcprop`.
            2. Set it with `svccfg` only when it is not `true`; no Ansible module manages SMF properties.
            3. Refresh the instance, and restart it when it is online, through handlers that run only after a change.

            ```yaml
            ---
            - name: Restrict sendmail to local clients
              hosts: all
              become: true
              tasks:
                - name: Read the sendmail instance state
                  ansible.builtin.command: svcs -H -o state svc:/network/smtp:sendmail
                  register: mail_state
                  changed_when: false
                  failed_when: false

                - name: Read the sendmail local_only property
                  ansible.builtin.command: svcprop -p config/local_only svc:/network/smtp:sendmail
                  register: mail_local_only
                  changed_when: false
                  when: mail_state.rc == 0

                - name: Set the sendmail local_only property to true
                  ansible.builtin.command: svccfg -s svc:/network/smtp:sendmail setprop config/local_only = true
                  when:
                    - mail_state.rc == 0
                    - mail_local_only.stdout | trim != 'true'
                  changed_when: true
                  notify:
                    - Refresh sendmail
                    - Restart sendmail

              handlers:
                - name: Refresh sendmail
                  ansible.builtin.command: svcadm refresh svc:/network/smtp:sendmail
                  changed_when: true

                - name: Restart sendmail
                  ansible.builtin.command: svcadm restart svc:/network/smtp:sendmail
                  changed_when: true
                  when: mail_state.stdout | trim == 'online'
            ```
  - uid: mondoo-solaris-security-permissions-on-sshd-config-are-configured
    title: Ensure permissions on /etc/ssh/sshd_config are configured
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      file("/etc/ssh/sshd_config") {
        user.name == "root"
        permissions.user_executable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/sshd-config-5.html
          title: "sshd_config - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/smf-stencil-5.html
          title: "smf_stencil - man pages section 5: File Formats"
      desc: |
        This check verifies that the SSH server configuration can be changed only by root.

        `/etc/ssh/sshd_config` decides who may log in over SSH, how they authenticate, and which forwarding and cryptography `sshd` allows. The file must be owned by `root`, must not be executable by its owner, and must not be writable or executable by its group or by other users. Oracle Solaris 11.4 installs it as `root:sys` with mode `0644`, which passes. Where SMF generates the file from the `sshd_stencil` property group of `svc:/network/ssh:default`, the `sshd_stencil/owner`, `sshd_stencil/group`, and `sshd_stencil/mode` properties set the owner and mode again on every refresh.

        **Why this matters**

        A local user who can write to this file controls the SSH server. They can set `PermitRootLogin yes`, or point `AuthorizedKeysFile` at a file they own and then log in as any account with their own key. `sshd` applies the change at its next refresh or at the next boot, without any further privilege.

        The file holds no secrets, so the check does not require it to be unreadable. The Solaris default leaves it world readable.
      audit: |
        1. Print the owner and mode of the file:

           ```bash
           ls -l /etc/ssh/sshd_config
           ```

        2. Where SMF generates the file, print the owner, group, and mode that each refresh applies:

           ```bash
           svcprop -p sshd_stencil svc:/network/ssh:default
           ```

        The check passes when the owner is `root`, the owner execute bit is not set, and the group and other permissions contain no `w` or `x`, as with mode `0644` owned by `root`. It fails for any other owner, or when the owner can execute the file or group or other can write to or execute it.
      remediation:
        - id: cli
          desc: |
            To restrict `/etc/ssh/sshd_config` to root using the CLI:

            1. Set the owner, group, and mode of the file to the Solaris defaults.
            2. Check whether SMF generates the file. If `sshd_stencil/disabled` is `false`, set the stencil properties to the same values so the next refresh keeps them, then refresh the service.

            ```bash
            chown root:sys /etc/ssh/sshd_config
            chmod 0644 /etc/ssh/sshd_config

            svcprop -p sshd_stencil/disabled svc:/network/ssh:default

            # When it prints false:
            svccfg -s svc:/network/ssh:default setprop sshd_stencil/owner = astring: root
            svccfg -s svc:/network/ssh:default setprop sshd_stencil/group = astring: sys
            svccfg -s svc:/network/ssh:default setprop sshd_stencil/mode = astring: 0644
            svcadm refresh svc:/network/ssh:default
            ```
        - id: sh
          desc: |
            To restrict `/etc/ssh/sshd_config` to root using a shell script:

            1. Save the script and run it as root.
            2. The script sets the owner and mode of the file, and where SMF generates the file it also sets the matching stencil properties and refreshes the service.
            3. Running it again makes no further change.

            ```sh
            #!/bin/sh
            set -e

            FMRI=svc:/network/ssh:default
            SSHD_CONFIG=/etc/ssh/sshd_config

            chown root:sys "$SSHD_CONFIG"
            chmod 0644 "$SSHD_CONFIG"

            # When SMF generates sshd_config, the stencil properties set the owner,
            # group, and mode again on every refresh, so they have to match.
            if [ "$(svcprop -p sshd_stencil/disabled "$FMRI" 2>/dev/null || true)" = "false" ]; then
              changed=0
              for setting in owner=root group=sys mode=0644; do
                prop=${setting%%=*}
                value=${setting#*=}
                if [ "$(svcprop -p "sshd_stencil/$prop" "$FMRI")" != "$value" ]; then
                  svccfg -s "$FMRI" setprop "sshd_stencil/$prop" = astring: "$value"
                  changed=1
                fi
              done
              if [ "$changed" -eq 1 ]; then
                svcadm refresh "$FMRI"
              fi
            fi

            echo "Ownership and mode of $SSHD_CONFIG configured."
            ```
        - id: ansible
          desc: |
            To restrict `/etc/ssh/sshd_config` to root using Ansible:

            1. Save the playbook and run it against the Solaris hosts.
            2. The playbook sets the owner and mode of the file, and where SMF generates the file it also sets the matching stencil properties and refreshes the service.

            ```yaml
            ---
            - name: Restrict sshd_config to root
              hosts: all
              become: true

              vars:
                sshd_stencil_settings:
                  - prop: owner
                    value: root
                  - prop: group
                    value: sys
                  - prop: mode
                    value: '0644'

              tasks:
                - name: Set owner and mode of sshd_config
                  ansible.builtin.file:
                    path: /etc/ssh/sshd_config
                    owner: root
                    group: sys
                    mode: '0644'

                - name: Check whether SMF generates sshd_config
                  ansible.builtin.command: svcprop -p sshd_stencil/disabled svc:/network/ssh:default
                  register: sshd_stencil
                  changed_when: false
                  failed_when: false

                - name: Read the stencil owner, group, and mode
                  ansible.builtin.command: svcprop -p sshd_stencil/{{ item.prop }} svc:/network/ssh:default
                  loop: "{{ sshd_stencil_settings }}"
                  register: sshd_stencil_current
                  changed_when: false
                  when: sshd_stencil.stdout == 'false'

                - name: Set the stencil owner, group, and mode
                  ansible.builtin.command:
                    argv:
                      - svccfg
                      - -s
                      - svc:/network/ssh:default
                      - setprop
                      - "sshd_stencil/{{ item.item.prop }}"
                      - "="
                      - "astring:"
                      - "{{ item.item.value }}"
                  loop: "{{ sshd_stencil_current.results }}"
                  when:
                    - sshd_stencil.stdout == 'false'
                    - item.stdout != item.item.value
                  changed_when: true
                  notify: Refresh the SSH service

              handlers:
                - name: Refresh the SSH service
                  ansible.builtin.service:
                    name: svc:/network/ssh:default
                    state: reloaded
            ```
  - uid: mondoo-solaris-security-permissions-on-ssh-private-host-key-files-are-configured
    title: Ensure permissions on SSH private host key files are configured
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      files.find(from: "/etc/ssh", type: "file").where(path == /ssh_host_.*key$/).list {
        path
        user.name == "root"
        permissions.user_executable == false
        permissions.group_readable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_readable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/sshd-8.html
          title: "sshd - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/sshd-config-5.html
          title: "sshd_config - man pages section 5: File Formats"
      desc: |
        This check verifies that the SSH server's private host keys can be read only by root.

        The private host keys in `/etc/ssh`, such as `ssh_host_ed25519_key`, `ssh_host_ecdsa_key`, and `ssh_host_rsa_key`, prove the server's identity to every client that connects. The start method of `svc:/network/ssh:default` creates any missing key with `ssh-keygen` when the service property `sysconfig/generate_hostkeys` is `true`, which is the default. Every file below `/etc/ssh` whose name starts with `ssh_host_` and ends in `key` must be owned by `root` and have mode `0600` or stricter, with no execute bit for the owner and no permissions for group or other.

        **Why this matters**

        Anyone who can read a private host key can impersonate the server. An attacker on the network path between a client and this host presents the stolen key, `ssh` shows no host key warning because the key is the one it already trusts, and the attacker captures the passwords users type and the commands they run. Copying the key leaves no trace, and it stays useful until the key is replaced and every client has learned the new one.

        `sshd` also refuses to load a private host key that group or other can read, so a loose mode can stop the service from accepting connections after its next restart.
      audit: |
        1. List every private host key file below `/etc/ssh`:

           ```bash
           find /etc/ssh -type f -name 'ssh_host_*key' -exec ls -l {} +
           ```

        The check passes when every file listed is owned by `root` and has mode `0600` or `0400`. It fails when any file has another owner, an owner execute bit, or any permission for group or other.
      remediation:
        - id: cli
          desc: |
            To restrict the SSH private host keys to root using the CLI:

            1. Set the owner of every private host key file to root.
            2. Remove every permission for group and other and the owner execute bit.
            3. If a key was readable by other users, treat it as exposed. Delete the key pair, restart the service so its start method generates a new one, and distribute the new public key to clients.

            ```bash
            find /etc/ssh -type f -name 'ssh_host_*key' -exec chown root {} +
            find /etc/ssh -type f -name 'ssh_host_*key' -exec chmod 0600 {} +

            # Only when a key has to be replaced:
            rm /etc/ssh/ssh_host_rsa_key /etc/ssh/ssh_host_rsa_key.pub
            svcadm restart svc:/network/ssh:default
            ```
        - id: sh
          desc: |
            To restrict the SSH private host keys to root using a shell script:

            1. Save the script and run it as root.
            2. The pattern `ssh_host_*key` matches only private keys, because the public keys end in `.pub`.

            ```sh
            #!/bin/sh
            set -e

            find /etc/ssh -type f -name 'ssh_host_*key' -exec chown root {} +
            find /etc/ssh -type f -name 'ssh_host_*key' -exec chmod 0600 {} +

            echo "SSH private host key permissions configured."
            ```
        - id: ansible
          desc: |
            To restrict the SSH private host keys to root using Ansible:

            1. Save the playbook and run it against the Solaris hosts.
            2. The `find` task matches only private keys, because the public keys end in `.pub`.

            ```yaml
            ---
            - name: Restrict SSH private host keys to root
              hosts: all
              become: true

              tasks:
                - name: Find SSH private host key files
                  ansible.builtin.find:
                    paths: /etc/ssh
                    patterns: 'ssh_host_*key'
                    file_type: file
                    recurse: true
                  register: ssh_private_keys

                - name: Set owner and mode of SSH private host key files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    mode: '0600'
                  loop: "{{ ssh_private_keys.files }}"
            ```
  - uid: mondoo-solaris-security-permissions-on-ssh-public-host-key-files-are-configured
    title: Ensure permissions on SSH public host key files are configured
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      files.find(from: "/etc/ssh", type: "file").where(path == /ssh_host_.*key\.pub$/).list {
        path
        permissions.user_executable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/sshd-8.html
          title: "sshd - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/sshd-config-5.html
          title: "sshd_config - man pages section 5: File Formats"
      desc: |
        This check verifies that the SSH server's public host keys can be changed only by their owner.

        Each private host key in `/etc/ssh` has a public half next to it, such as `ssh_host_ed25519_key.pub`. Administrators copy these files into the `/etc/ssh/ssh_known_hosts` files of client systems, and publish their fingerprints, so that clients can recognize the server. Every file below `/etc/ssh` whose name starts with `ssh_host_` and ends in `key.pub` must not be executable by anyone and must not be writable by group or other. The Solaris default is `0644`, owned by `root`, which passes.

        **Why this matters**

        A public key is meant to be read, so the risk is replacement, not disclosure. A user who can write to one of these files can put their own key in it. The next time an administrator distributes host keys from this server to client `ssh_known_hosts` files, the clients trust the attacker's key for this host, and the attacker can then impersonate the server to them without a host key warning.
      audit: |
        1. List every public host key file below `/etc/ssh`:

           ```bash
           find /etc/ssh -type f -name 'ssh_host_*key.pub' -exec ls -l {} +
           ```

        The check passes when no listed file has an execute bit and none is writable by group or other, as with mode `0644`. It fails when any file grants execute permission, or write permission to group or other.
      remediation:
        - id: cli
          desc: |
            To restrict the SSH public host keys using the CLI:

            1. Set the owner of every public host key file to root.
            2. Set the mode to `0644`, which keeps the files readable and removes every write and execute permission except the owner's write.

            ```bash
            find /etc/ssh -type f -name 'ssh_host_*key.pub' -exec chown root {} +
            find /etc/ssh -type f -name 'ssh_host_*key.pub' -exec chmod 0644 {} +
            ```
        - id: sh
          desc: |
            To restrict the SSH public host keys using a shell script:

            1. Save the script and run it as root.
            2. Running it again makes no further change.

            ```sh
            #!/bin/sh
            set -e

            find /etc/ssh -type f -name 'ssh_host_*key.pub' -exec chown root {} +
            find /etc/ssh -type f -name 'ssh_host_*key.pub' -exec chmod 0644 {} +

            echo "SSH public host key permissions configured."
            ```
        - id: ansible
          desc: |
            To restrict the SSH public host keys using Ansible:

            1. Save the playbook and run it against the Solaris hosts.
            2. The playbook sets every public host key file to `root` with mode `0644`.

            ```yaml
            ---
            - name: Restrict SSH public host keys
              hosts: all
              become: true

              tasks:
                - name: Find SSH public host key files
                  ansible.builtin.find:
                    paths: /etc/ssh
                    patterns: 'ssh_host_*key.pub'
                    file_type: file
                    recurse: true
                  register: ssh_public_keys

                - name: Set owner and mode of SSH public host key files
                  ansible.builtin.file:
                    path: "{{ item.path }}"
                    owner: root
                    mode: '0644'
                  loop: "{{ ssh_public_keys.files }}"
            ```
  - uid: mondoo-solaris-security-ssh-root-login-is-disabled
    title: Ensure SSH root login is disabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-i-access-control-unique-user-identification
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-2
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      sshd.config.params["PermitRootLogin"] == "no"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/sshd-config-5.html
          title: "sshd_config - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/smf-stencil-5.html
          title: "smf_stencil - man pages section 5: File Formats"
      desc: |
        This check verifies that the SSH server refuses logins as root.

        `PermitRootLogin` decides whether `sshd` accepts a login as root and with which authentication methods. The check requires `PermitRootLogin no`. The OpenSSH default is `prohibit-password`, which still accepts root logins with a public key, so the directive has to be written in the file. Oracle Cloud images of Solaris 11.4 set it through the SMF property `config/PermitRootLogin` of `svc:/network/ssh:default`.

        **Why this matters**

        Solaris 11.4 installs root as a role, shown as `type=role` in `/etc/user_attr`, and `pam_roles` refuses a direct login to a role. Administrators log in as themselves and then assume root, so the Solaris audit trail records the person behind every privileged command. With any `PermitRootLogin` value other than `no`, the role is the only barrier. Once root is turned back into a normal account with `rolemod -K type=normal root`, a key in `/root/.ssh/authorized_keys` or a guessed root password gives a remote root shell, and the audit records name only root.

        Hosts managed by tools that log in as root should give those tools a dedicated account with an RBAC rights profile instead.
      audit: |
        1. Print the directive from the main configuration file and from any drop-in file it includes:

           ```bash
           /usr/xpg4/bin/grep -n -i -E '^[[:space:]]*PermitRootLogin[[:space:]=]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null
           ```

        2. Print the `Match` and `Include` lines of the main file:

           ```bash
           /usr/xpg4/bin/grep -n -i -E '^[[:space:]]*(Match|Include)[[:space:]]' /etc/ssh/sshd_config
           ```

        3. OpenSSH uses the first value it reads, and a line after a `Match` line applies only to that `Match` block. On Solaris 11.4 the `Include` line sits at the end of `/etc/ssh/sshd_config`, so a line in the main file above any `Match` line takes precedence over the drop-in files.

        The check passes when the first applicable line reads `PermitRootLogin no`. It fails when that line has any other value, or when no line is printed.

        Do not audit this with `sshd -T`. It prints the OpenSSH built-in default for a directive that is absent from the file, while the check requires the directive to be written in the file.
      remediation:
        - id: cli
          desc: |
            To disable SSH root login using the CLI:

            1. Check whether SMF generates `/etc/ssh/sshd_config`. Oracle Cloud images of Solaris 11.4 set `sshd_stencil/disabled` to `false`, and the file then starts with a warning that it was generated from SMF data. In that case the file is rewritten from the `config` property group of `svc:/network/ssh:default` on every refresh, and a hand edit is lost.
            2. If the command prints `false`, set the SMF property and refresh the service. The refresh rewrites the file and signals `sshd` to reread it.
            3. Otherwise, edit `/etc/ssh/sshd_config` as root. Put this line above any `Match` line and above the `Include` line, and delete or change any other uncommented line for the same keyword that comes before the first `Match` line:

               ```text
               PermitRootLogin no
               ```

            4. Validate the file with `sshd -t`, then refresh the service. Keep the current session open until a new login succeeds.

            ```bash
            svcprop -p sshd_stencil/disabled svc:/network/ssh:default

            # When it prints false:
            svccfg -s svc:/network/ssh:default setprop config/PermitRootLogin = astring: no
            svcadm refresh svc:/network/ssh:default

            # When it prints true or reports no such property:
            vi /etc/ssh/sshd_config
            /usr/lib/ssh/sshd -t && svcadm refresh svc:/network/ssh:default
            ```
        - id: sh
          desc: |
            To disable SSH root login using a shell script:

            1. Save the script and run it as root.
            2. On hosts where SMF generates the file, the script sets the SMF property and refreshes the service. Elsewhere it moves the directive to the top of `/etc/ssh/sshd_config`, drops other global lines for the same keyword, validates the result with `sshd -t`, and writes it back without changing the file's owner or mode.
            3. Running it again makes no further change.

            ```sh
            #!/bin/sh
            set -e

            FMRI=svc:/network/ssh:default
            SSHD_CONFIG=/etc/ssh/sshd_config
            changed=0

            set_smf() {
              if [ "$(svcprop -p "config/$1" "$FMRI" 2>/dev/null || true)" != "$3" ]; then
                svccfg -s "$FMRI" setprop "config/$1" = "$2:" "$3"
                changed=1
              fi
            }

            # When SMF generates sshd_config, the file is rewritten from the config
            # property group on every refresh, so the value has to be set in SMF.
            if [ "$(svcprop -p sshd_stencil/disabled "$FMRI" 2>/dev/null || true)" = "false" ]; then
              set_smf PermitRootLogin astring no
              if [ "$changed" -eq 1 ]; then
                svcadm refresh "$FMRI"
              fi
              echo "SSH root login disabled."
              exit 0
            fi

            WORK=$(mktemp /tmp/sshd_config.XXXXXX)
            NEXT=$(mktemp /tmp/sshd_config.XXXXXX)
            trap 'rm -f "$WORK" "$NEXT"' EXIT
            cp "$SSHD_CONFIG" "$WORK"

            # Print the directive as the first line and drop any other line for the
            # same keyword before the first Match line. OpenSSH uses the first value
            # it reads, and a line after a Match line applies only to that block.
            set_file() {
              nawk -v line="$1" '
                BEGIN { split(line, d, " "); key = tolower(d[1]); print line; global = 1 }
                { split($1, f, "="); kw = tolower(f[1]) }
                kw == "match" { global = 0 }
                global && kw == key { next }
                { print }
              ' "$WORK" > "$NEXT"
              cat "$NEXT" > "$WORK"
            }

            set_file "PermitRootLogin no"

            if cmp -s "$WORK" "$SSHD_CONFIG"; then
              echo "SSH root login disabled."
              exit 0
            fi

            /usr/lib/ssh/sshd -t -f "$WORK"
            cat "$WORK" > "$SSHD_CONFIG"
            svcadm refresh "$FMRI"
            echo "SSH root login disabled."
            ```
        - id: ansible
          desc: |
            To disable SSH root login using Ansible:

            1. Save the playbook and run it against the Solaris hosts.
            2. The playbook sets the SMF property where SMF generates `/etc/ssh/sshd_config`, and edits the file everywhere else. The `validate` option runs `sshd -t` against the edited copy, and Ansible writes the file only if that copy passes.
            3. The handler refreshes `svc:/network/ssh:default`, which rewrites a generated file and signals `sshd` to reread its configuration.

            ```yaml
            ---
            - name: Disable SSH root login
              hosts: all
              become: true

              vars:
                sshd_settings:
                  - key: PermitRootLogin
                    type: astring
                    smf_value: 'no'
                    file_value: 'no'

              tasks:
                - name: Check whether SMF generates sshd_config
                  ansible.builtin.command: svcprop -p sshd_stencil/disabled svc:/network/ssh:default
                  register: sshd_stencil
                  changed_when: false
                  failed_when: false

                - name: Read the current SMF values
                  ansible.builtin.command: svcprop -p config/{{ item.key }} svc:/network/ssh:default
                  loop: "{{ sshd_settings }}"
                  register: sshd_smf
                  changed_when: false
                  failed_when: false
                  when: sshd_stencil.stdout == 'false'

                - name: Set the SMF values
                  ansible.builtin.command:
                    argv:
                      - svccfg
                      - -s
                      - svc:/network/ssh:default
                      - setprop
                      - "config/{{ item.item.key }}"
                      - "="
                      - "{{ item.item.type }}:"
                      - "{{ item.item.smf_value }}"
                  loop: "{{ sshd_smf.results }}"
                  when:
                    - sshd_stencil.stdout == 'false'
                    - item.stdout != item.item.smf_value
                  changed_when: true
                  notify: Refresh the SSH service

                - name: Set the directives at the top of sshd_config
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '(?i)^\s*{{ item.key }}\s'
                    line: "{{ item.key }} {{ item.file_value }}"
                    insertbefore: BOF
                    firstmatch: true
                    validate: /usr/lib/ssh/sshd -t -f %s
                  loop: "{{ sshd_settings }}"
                  when: sshd_stencil.stdout != 'false'
                  notify: Refresh the SSH service

              handlers:
                - name: Refresh the SSH service
                  ansible.builtin.service:
                    name: svc:/network/ssh:default
                    state: reloaded
            ```
  - uid: mondoo-solaris-security-ssh-permitemptypasswords-is-disabled
    title: Ensure SSH PermitEmptyPasswords is disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      sshd.config.params["PermitEmptyPasswords"] == "no"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/sshd-config-5.html
          title: "sshd_config - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/smf-stencil-5.html
          title: "smf_stencil - man pages section 5: File Formats"
      desc: |
        This check verifies that the SSH server refuses password logins to accounts that have an empty password.

        `PermitEmptyPasswords` decides whether `sshd` lets an account whose password field in `/etc/shadow` is empty log in with password authentication. With `no`, `sshd` passes `PAM_DISALLOW_NULL_AUTHTOK` to `pam_authenticate`, so the PAM stack rejects an empty password. The check requires the line `PermitEmptyPasswords no`. The Solaris stencil writes it only as a comment unless the SMF property `config/PermitEmptyPasswords` is set.

        **Why this matters**

        An account ends up with an empty password field when an administrator runs `passwd -d` on it or a provisioning script writes `/etc/shadow` directly. If `sshd` accepted such an account, anyone who knows or guesses its name would get a shell over the network without any secret. Service and test accounts are the usual case, and their names are easy to guess.

        OpenSSH refuses empty passwords by default, but writing the directive keeps the refusal in `sshd` itself, independent of later changes to `PasswordAuthentication` or to the PAM configuration in `/etc/pam.d`.
      audit: |
        1. Print the directive from the main configuration file and from any drop-in file it includes:

           ```bash
           /usr/xpg4/bin/grep -n -i -E '^[[:space:]]*PermitEmptyPasswords[[:space:]=]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null
           ```

        2. Print the `Match` and `Include` lines of the main file:

           ```bash
           /usr/xpg4/bin/grep -n -i -E '^[[:space:]]*(Match|Include)[[:space:]]' /etc/ssh/sshd_config
           ```

        3. OpenSSH uses the first value it reads, and a line after a `Match` line applies only to that `Match` block. On Solaris 11.4 the `Include` line sits at the end of `/etc/ssh/sshd_config`, so a line in the main file above any `Match` line takes precedence over the drop-in files.

        The check passes when the first applicable line reads `PermitEmptyPasswords no`. It fails when that line reads `yes`, or when no line is printed.

        Do not audit this with `sshd -T`. It prints the OpenSSH built-in default for a directive that is absent from the file, while the check requires the directive to be written in the file.
      remediation:
        - id: cli
          desc: |
            To refuse SSH logins with empty passwords using the CLI:

            1. Check whether SMF generates `/etc/ssh/sshd_config`. Oracle Cloud images of Solaris 11.4 set `sshd_stencil/disabled` to `false`, and the file then starts with a warning that it was generated from SMF data. In that case the file is rewritten from the `config` property group of `svc:/network/ssh:default` on every refresh, and a hand edit is lost.
            2. If the command prints `false`, set the SMF property and refresh the service. The refresh rewrites the file and signals `sshd` to reread it.
            3. Otherwise, edit `/etc/ssh/sshd_config` as root. Put this line above any `Match` line and above the `Include` line, and delete or change any other uncommented line for the same keyword that comes before the first `Match` line:

               ```text
               PermitEmptyPasswords no
               ```

            4. Validate the file with `sshd -t`, then refresh the service. Keep the current session open until a new login succeeds.

            ```bash
            svcprop -p sshd_stencil/disabled svc:/network/ssh:default

            # When it prints false:
            svccfg -s svc:/network/ssh:default setprop config/PermitEmptyPasswords = boolean: false
            svcadm refresh svc:/network/ssh:default

            # When it prints true or reports no such property:
            vi /etc/ssh/sshd_config
            /usr/lib/ssh/sshd -t && svcadm refresh svc:/network/ssh:default
            ```
        - id: sh
          desc: |
            To refuse SSH logins with empty passwords using a shell script:

            1. Save the script and run it as root.
            2. On hosts where SMF generates the file, the script sets the SMF property and refreshes the service. Elsewhere it moves the directive to the top of `/etc/ssh/sshd_config`, drops other global lines for the same keyword, validates the result with `sshd -t`, and writes it back without changing the file's owner or mode.
            3. Running it again makes no further change.

            ```sh
            #!/bin/sh
            set -e

            FMRI=svc:/network/ssh:default
            SSHD_CONFIG=/etc/ssh/sshd_config
            changed=0

            set_smf() {
              if [ "$(svcprop -p "config/$1" "$FMRI" 2>/dev/null || true)" != "$3" ]; then
                svccfg -s "$FMRI" setprop "config/$1" = "$2:" "$3"
                changed=1
              fi
            }

            # When SMF generates sshd_config, the file is rewritten from the config
            # property group on every refresh, so the value has to be set in SMF.
            if [ "$(svcprop -p sshd_stencil/disabled "$FMRI" 2>/dev/null || true)" = "false" ]; then
              set_smf PermitEmptyPasswords boolean false
              if [ "$changed" -eq 1 ]; then
                svcadm refresh "$FMRI"
              fi
              echo "SSH PermitEmptyPasswords set to no."
              exit 0
            fi

            WORK=$(mktemp /tmp/sshd_config.XXXXXX)
            NEXT=$(mktemp /tmp/sshd_config.XXXXXX)
            trap 'rm -f "$WORK" "$NEXT"' EXIT
            cp "$SSHD_CONFIG" "$WORK"

            # Print the directive as the first line and drop any other line for the
            # same keyword before the first Match line. OpenSSH uses the first value
            # it reads, and a line after a Match line applies only to that block.
            set_file() {
              nawk -v line="$1" '
                BEGIN { split(line, d, " "); key = tolower(d[1]); print line; global = 1 }
                { split($1, f, "="); kw = tolower(f[1]) }
                kw == "match" { global = 0 }
                global && kw == key { next }
                { print }
              ' "$WORK" > "$NEXT"
              cat "$NEXT" > "$WORK"
            }

            set_file "PermitEmptyPasswords no"

            if cmp -s "$WORK" "$SSHD_CONFIG"; then
              echo "SSH PermitEmptyPasswords set to no."
              exit 0
            fi

            /usr/lib/ssh/sshd -t -f "$WORK"
            cat "$WORK" > "$SSHD_CONFIG"
            svcadm refresh "$FMRI"
            echo "SSH PermitEmptyPasswords set to no."
            ```
        - id: ansible
          desc: |
            To refuse SSH logins with empty passwords using Ansible:

            1. Save the playbook and run it against the Solaris hosts.
            2. The playbook sets the SMF property where SMF generates `/etc/ssh/sshd_config`, and edits the file everywhere else. The `validate` option runs `sshd -t` against the edited copy, and Ansible writes the file only if that copy passes.
            3. The handler refreshes `svc:/network/ssh:default`, which rewrites a generated file and signals `sshd` to reread its configuration.

            ```yaml
            ---
            - name: Refuse SSH logins with empty passwords
              hosts: all
              become: true

              vars:
                sshd_settings:
                  - key: PermitEmptyPasswords
                    type: boolean
                    smf_value: 'false'
                    file_value: 'no'

              tasks:
                - name: Check whether SMF generates sshd_config
                  ansible.builtin.command: svcprop -p sshd_stencil/disabled svc:/network/ssh:default
                  register: sshd_stencil
                  changed_when: false
                  failed_when: false

                - name: Read the current SMF values
                  ansible.builtin.command: svcprop -p config/{{ item.key }} svc:/network/ssh:default
                  loop: "{{ sshd_settings }}"
                  register: sshd_smf
                  changed_when: false
                  failed_when: false
                  when: sshd_stencil.stdout == 'false'

                - name: Set the SMF values
                  ansible.builtin.command:
                    argv:
                      - svccfg
                      - -s
                      - svc:/network/ssh:default
                      - setprop
                      - "config/{{ item.item.key }}"
                      - "="
                      - "{{ item.item.type }}:"
                      - "{{ item.item.smf_value }}"
                  loop: "{{ sshd_smf.results }}"
                  when:
                    - sshd_stencil.stdout == 'false'
                    - item.stdout != item.item.smf_value
                  changed_when: true
                  notify: Refresh the SSH service

                - name: Set the directives at the top of sshd_config
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '(?i)^\s*{{ item.key }}\s'
                    line: "{{ item.key }} {{ item.file_value }}"
                    insertbefore: BOF
                    firstmatch: true
                    validate: /usr/lib/ssh/sshd -t -f %s
                  loop: "{{ sshd_settings }}"
                  when: sshd_stencil.stdout != 'false'
                  notify: Refresh the SSH service

              handlers:
                - name: Refresh the SSH service
                  ansible.builtin.service:
                    name: svc:/network/ssh:default
                    state: reloaded
            ```
