    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/group-5.html
          title: "group - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/grpck-8.html
          title: "grpck - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that every group name in `/etc/group` appears only once.

        Each entry in `/etc/group` starts with the group name, followed by its GID and member list. No two entries may share a name.

        **Why this matters**

        Tools that look up a group by name use the first matching entry. When a name appears twice, `chgrp`, `newgrp`, and administrators granting access by name act on the first entry, while members listed only on the second entry hold a different GID. Access granted to the group by name then reaches the wrong set of users, or fails to reach the users it was meant for.

        A second entry with a familiar name is also an easy place to hide a membership. A reviewer who reads the first `staff` entry sees the expected members and misses a privileged GID granted through the second. Duplicates come from manual edits or from merging files from another host.
      audit: |
        1. List the group names that appear more than once:

           ```bash
           awk -F: '{ print $1 }' /etc/group | sort | uniq -d
           ```

        The check passes when the command prints nothing. Any name it prints appears more than once and fails the check.
      remediation:
        - id: cli
          desc: |
            To remove duplicate group names using the command line:

            1. List the duplicated names, then show every entry for each one with its GID and members, replacing `<group>` with a reported name.
            2. Back up `/etc/group`, then edit it and leave one entry per name. If both entries describe the same group, merge their member lists into one entry and delete the other. If they are different groups, rename one to a unique name.
            3. Run `grpck` to confirm the file is still well formed, then run the first command again and confirm it prints nothing.

            ```bash
            awk -F: '{ print $1 }' /etc/group | sort | uniq -d
            grep '^<group>:' /etc/group
            cp -p /etc/group /etc/group.bak
            grpck
            ```
        - id: sh
          desc: |
            To detect duplicate group names using a shell script:

            1. Run the script as root.
            2. It reports each duplicated name and exits with an error. It does not edit `/etc/group`, because merging or renaming groups is a human decision. Apply the CLI steps to each reported name.

            ```sh
            #!/bin/sh
            set -e

            DUPES=$(awk -F: '{ print $1 }' /etc/group | sort | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "Duplicate group names found:" >&2
              echo "$DUPES" >&2
              exit 1
            fi

            echo "No duplicate group names found."
            ```
        - id: ansible
          desc: |
            To detect duplicate group names using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. It fails on any host where a group name appears more than once. Apply the CLI steps to each reported name.

            ```yaml
            ---
            - name: Detect duplicate group names
              hosts: all
              become: true
              tasks:
                - name: Find group names that appear more than once
                  ansible.builtin.shell: "set -o pipefail; awk -F: '{ print $1 }' /etc/group | sort | uniq -d"
                  register: duplicate_groups
                  changed_when: false

                - name: Fail when duplicate group names exist
                  ansible.builtin.fail:
                    msg: "Duplicate group names found: {{ duplicate_groups.stdout_lines | join(', ') }}"
                  when: duplicate_groups.stdout_lines | length > 0
            ```
  - uid: mondoo-solaris-security-permissions-on-etc-passwd-are-configured
    title: Ensure permissions on /etc/passwd are configured
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      file("/etc/passwd") {
        user.name == "root"
        permissions.user_executable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/passwd-5.html
          title: "passwd - man pages section 5: File Formats"
      desc: |
        This check verifies that only root can modify the local user account database.

        `/etc/passwd` maps every login name to its UID, primary group, home directory, and shell. It must be owned by root, and neither its group nor other users may write or execute it, which mode `0644` satisfies. Every user must still be able to read it, because name and UID lookups depend on it. Oracle Solaris 11.4 ships it as `root:root` with mode `0644`. The group owner is not assessed.

        **Why this matters**

        Anyone who can write `/etc/passwd` controls identity on the host. Changing their own UID to `0` makes them the superuser, changing another account's shell or home directory hijacks that account's next login, and adding an entry creates a new account.

        The file holds no password hashes on Solaris, since those live in `/etc/shadow`, so world read access is expected and safe.
      audit: |
        1. Show the owner and mode:

           ```bash
           ls -l /etc/passwd
           ```

        The check passes when the owner is `root` and the mode is `-rw-r--r--` or more restrictive. It fails when the owner is another account, when group or others can write, or when any execute bit is set.
      remediation:
        - id: cli
          desc: |
            To restrict `/etc/passwd` using the command line:

            1. Set the owner to root.
            2. Set the mode to `0644`.
            3. Confirm the result.

            ```bash
            chown root /etc/passwd
            chmod 0644 /etc/passwd
            ls -l /etc/passwd
            ```
        - id: sh
          desc: |
            To restrict `/etc/passwd` using a shell script:

            1. Run the script as root. Setting the same owner and mode again is harmless, so it can run repeatedly.

            ```sh
            #!/bin/sh
            set -e

            chown root /etc/passwd
            chmod 0644 /etc/passwd

            echo "Set owner root and mode 0644 on /etc/passwd."
            ```
        - id: ansible
          desc: |
            To restrict `/etc/passwd` using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task sets the owner and mode and leaves the group owner unchanged.

            ```yaml
            ---
            - name: Restrict /etc/passwd
              hosts: all
              become: true
              tasks:
                - name: Set owner and mode on /etc/passwd
                  ansible.builtin.file:
                    path: /etc/passwd
                    owner: root
                    mode: '0644'
            ```
  - uid: mondoo-solaris-security-permissions-on-etc-shadow-are-configured
    title: Ensure permissions on /etc/shadow are configured
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
