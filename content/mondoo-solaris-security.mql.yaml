policies:
  - uid: mondoo-solaris-security
    name: Mondoo Oracle Solaris Security
    version: 1.0.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: solaris
      mondoo.com/icon: solaris
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Oracle Solaris 11.4 security extensions, network stack, services, SSH, accounts, and auditing
    docs:
      desc: |
        The Mondoo Oracle Solaris Security policy identifies misconfigurations on Oracle Solaris 11.4 systems that could leave servers open to attackers. It helps organizations find and fix hardening gaps before they lead to unauthorized access, privilege escalation, lateral movement, or undetected compromise of Solaris infrastructure.

        This policy provides security checks across key Oracle Solaris areas:

        - Security extensions and core dump handling
        - IP stack properties managed with `ipadm`
        - Legacy and unnecessary SMF network services
        - SSH server hardening
        - RBAC root role, login, and password policy
        - Permissions on sensitive system files
        - Solaris auditing and system logging
        - IPS package signature and publisher configuration
        - Firewall, time synchronization, and privilege escalation controls

        Learn more about scanning Oracle Solaris in the [cnspec documentation](https://mondoo.com/docs/cnspec).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Kernel and Process Hardening
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-aslr-is-enabled-for-all-binaries
          - uid: mondoo-solaris-security-nxstack-is-enabled-for-all-binaries
          - uid: mondoo-solaris-security-nxheap-is-enabled
          - uid: mondoo-solaris-security-setid-core-dumps-are-disabled
      - title: Network Stack
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-ip-forwarding-is-disabled
          - uid: mondoo-solaris-security-source-routing-is-disabled
          - uid: mondoo-solaris-security-icmp-redirects-are-ignored
          - uid: mondoo-solaris-security-icmp-redirects-are-not-sent
          - uid: mondoo-solaris-security-broadcast-and-multicast-echo-requests-are-ignored
          - uid: mondoo-solaris-security-icmp-timestamp-and-address-mask-broadcasts-are-ignored
          - uid: mondoo-solaris-security-directed-broadcasts-are-not-forwarded
          - uid: mondoo-solaris-security-tcp-strong-iss-is-enabled
          - uid: mondoo-solaris-security-strong-host-model-is-enabled
      - title: Network Services
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-telnet-server-is-not-enabled
          - uid: mondoo-solaris-security-ftp-server-is-not-enabled
          - uid: mondoo-solaris-security-r-services-are-not-enabled
          - uid: mondoo-solaris-security-finger-server-is-not-enabled
          - uid: mondoo-solaris-security-tftp-server-is-not-enabled
          - uid: mondoo-solaris-security-nfs-server-is-not-enabled
          - uid: mondoo-solaris-security-nis-server-is-not-enabled
          - uid: mondoo-solaris-security-smb-server-is-not-enabled
          - uid: mondoo-solaris-security-snmp-server-is-not-enabled
          - uid: mondoo-solaris-security-multicast-dns-is-not-enabled
          - uid: mondoo-solaris-security-graphical-login-is-not-enabled
          - uid: mondoo-solaris-security-rpcbind-is-local-only
          - uid: mondoo-solaris-security-mail-transfer-agent-is-local-only
      - title: SSH Server Configuration
        filters: |
          asset.platform == "solaris" &&
          file("/etc/ssh/sshd_config").exists
        checks:
          - uid: mondoo-solaris-security-permissions-on-sshd-config-are-configured
          - uid: mondoo-solaris-security-permissions-on-ssh-private-host-key-files-are-configured
          - uid: mondoo-solaris-security-permissions-on-ssh-public-host-key-files-are-configured
          - uid: mondoo-solaris-security-ssh-root-login-is-disabled
          - uid: mondoo-solaris-security-ssh-permitemptypasswords-is-disabled
          - uid: mondoo-solaris-security-ssh-hostbasedauthentication-is-disabled
          - uid: mondoo-solaris-security-ssh-permituserenvironment-is-disabled
          - uid: mondoo-solaris-security-ssh-ignorerhosts-is-enabled
          - uid: mondoo-solaris-security-ssh-maxauthtries-is-set-to-4-or-less
          - uid: mondoo-solaris-security-ssh-logingracetime-is-configured
          - uid: mondoo-solaris-security-ssh-loglevel-is-appropriate
          - uid: mondoo-solaris-security-ssh-idle-timeout-interval-is-configured
          - uid: mondoo-solaris-security-ssh-disableforwarding-is-enabled
          - uid: mondoo-solaris-security-only-strong-ciphers-are-used
          - uid: mondoo-solaris-security-only-strong-mac-algorithms-are-used
          - uid: mondoo-solaris-security-only-strong-kex-algorithms-are-used
      - title: Accounts and Authentication
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-root-is-a-role
          - uid: mondoo-solaris-security-root-login-is-restricted-to-the-console
          - uid: mondoo-solaris-security-login-retries-are-limited
          - uid: mondoo-solaris-security-failed-logins-are-logged
          - uid: mondoo-solaris-security-default-umask-is-restrictive
          - uid: mondoo-solaris-security-account-lockout-is-enabled
          - uid: mondoo-solaris-security-passwords-use-a-strong-hashing-algorithm
          - uid: mondoo-solaris-security-password-minimum-length-is-14-or-more
          - uid: mondoo-solaris-security-password-dictionary-check-is-enabled
          - uid: mondoo-solaris-security-no-accounts-have-empty-passwords
          - uid: mondoo-solaris-security-root-is-the-only-uid-0-account
          - uid: mondoo-solaris-security-no-duplicate-uids-exist
          - uid: mondoo-solaris-security-no-duplicate-gids-exist
          - uid: mondoo-solaris-security-no-duplicate-user-names-exist
          - uid: mondoo-solaris-security-no-duplicate-group-names-exist
      - title: Sensitive Files
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-permissions-on-etc-passwd-are-configured
          - uid: mondoo-solaris-security-permissions-on-etc-shadow-are-configured
          - uid: mondoo-solaris-security-permissions-on-etc-group-are-configured
          - uid: mondoo-solaris-security-cron-and-at-are-restricted-to-authorized-users
      - title: Auditing and Logging
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-auditing-is-enabled
          - uid: mondoo-solaris-security-login-and-logout-events-are-audited
          - uid: mondoo-solaris-security-audit-policy-records-command-arguments
          - uid: mondoo-solaris-security-system-logging-is-enabled
          - uid: mondoo-solaris-security-syslog-does-not-accept-remote-messages
      - title: Software Integrity
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-package-signature-verification-is-enabled
          - uid: mondoo-solaris-security-package-publishers-use-https
      - title: Firewall and Time Synchronization
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-firewall-is-enabled
          - uid: mondoo-solaris-security-time-synchronization-is-enabled
      - title: Privilege Escalation
        filters: |
          asset.platform == "solaris"
        checks:
          - uid: mondoo-solaris-security-sudo-nopasswd-is-not-configured
    scoring_system: highest impact
queries:
  - uid: mondoo-solaris-security-aslr-is-enabled-for-all-binaries
    title: Ensure address space layout randomization is enabled for all binaries
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-16
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      command("sxadm status -p -o status aslr").stdout.trim == "enabled.all"
    docs:
      refs:
        - url: https://docs.oracle.com/en/operating-systems/solaris/oracle-solaris/11.4/secure-sys-dev/randomizing-the-layout-of-the-address-space.html
          title: Randomizing the Layout of the Address Space
        - url: https://docs.oracle.com/en/operating-systems/solaris/oracle-solaris/11.4/secure-sys-dev/protecting-against-malware-with-security-extensions.html
          title: Protecting Against Malware With Security Extensions
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/sxadm-8.html
          title: 'sxadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that address space layout randomization is applied to every process on the system, not only to binaries that request it.

        ASLR places the stack, the brk-based heap, shared libraries, and the memory mappings of position-independent executables at different addresses each time a program starts. Oracle Solaris manages it as the `aslr` security extension with `sxadm`. The extension's `model` property decides its scope: `tagged-files` randomizes only binaries built with the `-z sx=aslr` linker tag, and `all` randomizes every process. Solaris 11.4 ships with `tagged-files`. The check requires the status `enabled.all`, which `sxadm enable -c model=all aslr` sets.

        **Why this matters**

        A memory corruption exploit needs to know where its target code and data live. Return-oriented programming chains jump to gadgets at fixed offsets inside libraries, and a stack or heap overflow that overwrites a pointer needs a predictable address to redirect it to. Without randomization those addresses are identical on every run and every host with the same build, so an exploit developed in a lab works unchanged in production.

        Under the `tagged-files` model, Oracle-delivered binaries that carry the tag are randomized, but third-party daemons, in-house applications, and older binaries built without the tag run with a fixed layout. Those are often the network-facing services an attacker reaches first.

        Some third-party binaries assume fixed load addresses and crash or misbehave under `model=all`. Exempt such a binary rather than leaving the whole system on `tagged-files`: tag it with `elfedit -e 'dyn:sunw_sx aslr disable'`, which `sxadm` honors under `model=all`, or start it through `sxadm exec -s aslr=disable`. Do not edit Oracle-delivered binaries, because `pkg verify` reports them as modified.
      audit: |
        1. Display the ASLR status in parseable form:

            ```sh
            sxadm status -p -o status aslr
            ```

        2. If the output is `enabled.all`, the check passes. Any other value fails, including `enabled.tagged-files`, the Solaris 11.4 default, and `disabled`.

        The setting is per zone. Run the command in each zone you assess.
      remediation:
        - id: cli
          desc: |
            To enable ASLR for all binaries using the command line:

            1. As root, set the `aslr` extension to the `all` model.
            2. Confirm that the status is `enabled.all`.
            3. Restart long-running services or reboot, because randomization applies only to processes started after the change.

            ```bash
            sxadm enable -c model=all aslr
            sxadm status -p -o status aslr
            ```
        - id: sh
          desc: |
            To enable ASLR for all binaries using a shell script:

            1. Save the script and run it as root in each zone.
            2. Restart long-running services or reboot so they start with a randomized layout.

            ```sh
            #!/bin/sh
            set -e

            if [ "$(sxadm status -p -o status aslr)" != "enabled.all" ]; then
              sxadm enable -c model=all aslr
            fi

            sxadm status -p -o status aslr
            ```
        - id: ansible
          desc: |
            To enable ASLR for all binaries using Ansible:

            1. Add the following playbook. No Ansible module manages `sxadm`, so the playbook reads the status first and only runs `sxadm enable` when it differs.
            2. Run the playbook against the Solaris hosts.
            3. Restart long-running services or reboot so they start with a randomized layout.

            ```yaml
            ---
            - name: Enable ASLR for all binaries
              hosts: all
              become: true

              tasks:
                - name: Read the ASLR status
                  ansible.builtin.command: sxadm status -p -o status aslr
                  register: aslr_status
                  changed_when: false

                - name: Enable ASLR with the all model
                  ansible.builtin.command: sxadm enable -c model=all aslr
                  when: aslr_status.stdout | trim != 'enabled.all'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-nxstack-is-enabled-for-all-binaries
    title: Ensure the non-executable stack is enabled for all binaries
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-16
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      command("sxadm status -p -o status nxstack").stdout.trim == "enabled.all"
    docs:
      refs:
        - url: https://docs.oracle.com/en/operating-systems/solaris/oracle-solaris/11.4/secure-sys-dev/protecting-the-process-heap-and-executable-stacks-from-compromise.html
          title: Protecting the Process Heap and Executable Stacks From Compromise
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/sxadm-8.html
          title: 'sxadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that process stacks are non-executable for every process on the system.

        Oracle Solaris manages stack execute protection as the `nxstack` security extension with `sxadm`. With the `all` model, no process can execute code from its stack, and an attempt to do so delivers `SIGSEGV`. 64-bit processes always have non-executable stacks, so the setting mainly governs 32-bit processes. Solaris 11.4 ships `nxstack` with the `all` model, and the check requires the status `enabled.all`. It replaces the deprecated `noexec_user_stack` variable in `/etc/system`.

        **Why this matters**

        The classic stack buffer overflow copies attacker-supplied machine code into a stack buffer and overwrites the saved return address to jump into it. An executable stack lets that shellcode run directly. With `nxstack` enforced, the jump faults, and the attacker has to fall back to harder code-reuse techniques that ASLR then frustrates.

        A status other than `enabled.all` means someone changed the shipped default, typically to accommodate a legacy 32-bit program. Very few programs legitimately execute from the stack. Where one does, exempt that binary with `sxadm exec -s nxstack=disable` or a linker tag instead of weakening the whole system.
      audit: |
        1. Display the non-executable stack status in parseable form:

            ```sh
            sxadm status -p -o status nxstack
            ```

        2. If the output is `enabled.all`, the check passes. Any other value fails, including `enabled.tagged-files` and `disabled`.

        The setting is per zone. Run the command in each zone you assess.
      remediation:
        - id: cli
          desc: |
            To enable the non-executable stack for all binaries using the command line:

            1. As root, set the `nxstack` extension to the `all` model.
            2. Confirm that the status is `enabled.all`.
            3. Restart long-running services or reboot, because the protection applies to processes started after the change.

            ```bash
            sxadm enable -c model=all nxstack
            sxadm status -p -o status nxstack
            ```
        - id: sh
          desc: |
            To enable the non-executable stack for all binaries using a shell script:

            1. Save the script and run it as root in each zone.
            2. Restart long-running services or reboot so they start protected.

            ```sh
            #!/bin/sh
            set -e

            if [ "$(sxadm status -p -o status nxstack)" != "enabled.all" ]; then
              sxadm enable -c model=all nxstack
            fi

            sxadm status -p -o status nxstack
            ```
        - id: ansible
          desc: |
            To enable the non-executable stack for all binaries using Ansible:

            1. Add the following playbook. No Ansible module manages `sxadm`, so the playbook reads the status first and only runs `sxadm enable` when it differs.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Enable the non-executable stack for all binaries
              hosts: all
              become: true

              tasks:
                - name: Read the nxstack status
                  ansible.builtin.command: sxadm status -p -o status nxstack
                  register: nxstack_status
                  changed_when: false

                - name: Enable nxstack with the all model
                  ansible.builtin.command: sxadm enable -c model=all nxstack
                  when: nxstack_status.stdout | trim != 'enabled.all'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-nxheap-is-enabled
    title: Ensure the non-executable heap is enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-16
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-5
    mql: |
      command("sxadm status -p -o status nxheap").stdout.trim == /^enabled\./
    docs:
      refs:
        - url: https://docs.oracle.com/en/operating-systems/solaris/oracle-solaris/11.4/secure-sys-dev/protecting-the-process-heap-and-executable-stacks-from-compromise.html
          title: Protecting the Process Heap and Executable Stacks From Compromise
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/sxadm-8.html
          title: 'sxadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that heap execute protection is enabled, so that memory a process allocates for data cannot be executed as code.

        Oracle Solaris manages it as the `nxheap` security extension with `sxadm`. Solaris 11.4 ships `nxheap` enabled with the `tagged-files` model, which protects every binary built with the `-z sx=nxheap` linker tag, including many Oracle-delivered daemons such as `sshd`. The check passes for any enabled model, `tagged-files` or `all`, and fails only when the extension is disabled.

        **Why this matters**

        Heap overflows and use-after-free bugs let an attacker place controlled bytes in heap memory and redirect execution to them. When the heap is executable, those bytes run as shellcode. With `nxheap` in force the jump faults, which turns a code execution bug into a crash and forces the attacker toward code-reuse techniques that ASLR makes unreliable.

        Disabling `nxheap` system-wide removes that protection from every tagged service at once, usually to accommodate one program that generates code at runtime. Exempt that program instead with `sxadm exec -s nxheap=disable`. Moving to `model=all` gives broader coverage but can break interpreters and JIT runtimes that execute from the heap, so test it before rolling it out.
      audit: |
        1. Display the non-executable heap status in parseable form:

            ```sh
            sxadm status -p -o status nxheap
            ```

        2. If the output starts with `enabled.`, such as `enabled.tagged-files` or `enabled.all`, the check passes. If it is `disabled`, the check fails.

        The setting is per zone. Run the command in each zone you assess.
      remediation:
        - id: cli
          desc: |
            To enable the non-executable heap using the command line:

            1. As root, enable the `nxheap` extension. Without a model it follows the system default, `tagged-files`.
            2. Confirm that the status starts with `enabled.`.
            3. Restart long-running services or reboot so they start protected.

            ```bash
            sxadm enable nxheap
            sxadm status -p -o status nxheap
            ```
        - id: sh
          desc: |
            To enable the non-executable heap using a shell script:

            1. Save the script and run it as root in each zone.
            2. Restart long-running services or reboot so they start protected.

            ```sh
            #!/bin/sh
            set -e

            case "$(sxadm status -p -o status nxheap)" in
              enabled.*) ;;
              *) sxadm enable nxheap ;;
            esac

            sxadm status -p -o status nxheap
            ```
        - id: ansible
          desc: |
            To enable the non-executable heap using Ansible:

            1. Add the following playbook. No Ansible module manages `sxadm`, so the playbook reads the status first and only runs `sxadm enable` when the extension is disabled.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Enable the non-executable heap
              hosts: all
              become: true

              tasks:
                - name: Read the nxheap status
                  ansible.builtin.command: sxadm status -p -o status nxheap
                  register: nxheap_status
                  changed_when: false

                - name: Enable nxheap
                  ansible.builtin.command: sxadm enable nxheap
                  when: not nxheap_status.stdout | trim is match('enabled[.]')
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-setid-core-dumps-are-disabled
    title: Ensure core dumps of setuid and setgid processes are disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      command("coreadm").stdout.lines.any(_.trim == "global setid core dumps: disabled")
      command("coreadm").stdout.lines.any(_.trim == "per-process setid core dumps: disabled")
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E61000/tscore-4.html
          title: Administering Your Core File Specifications - Troubleshooting System Administration Issues in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/coreadm-8.html
          title: 'coreadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that processes running with setuid or setgid privileges never write their memory to a core file.

        A setid process is one that is or has been setuid or setgid since its last `exec`, or that started with superuser privileges and dropped them. `coreadm` controls whether such processes may dump core, separately for the global core file pattern and for the per-process pattern. The settings are stored in the `svc:/system/coreadm:default` service. Both `global setid core dumps` and `per-process setid core dumps` must report `disabled`, which is the Solaris 11.4 default.

        **Why this matters**

        A setid program reads data the invoking user is not allowed to see. `passwd` and `su` hold password hashes from `/etc/shadow`, and `ssh-keysign` holds the host private key. If such a process crashes and dumps core, that memory lands on disk. An unprivileged user can often trigger the crash deliberately, and a core file outlives the process, gets swept into backups, support bundles, and crash analysis uploads, and is readable by anyone who later gains access to the directory.

        The per-process pattern is set by the user who owns the process, so enabling per-process setid dumps lets that user choose where the privileged memory image is written.

        Enable setid core dumps only to debug a specific crash in a setid program, using the global pattern pointed at a directory only root can read, and disable them again afterwards.
      audit: |
        1. Display the core file configuration:

            ```sh
            coreadm
            ```

        2. Find the `global setid core dumps` and `per-process setid core dumps` lines.
        3. If both read `disabled`, the check passes. If either reads `enabled`, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable setid core dumps using the command line:

            1. As root, or as a user with the Maintenance and Repair rights profile, disable both setid options. `coreadm` stores the change in its SMF service, so it persists across reboots.
            2. Confirm both lines read `disabled`.

            ```bash
            coreadm -d global-setid -d proc-setid
            coreadm | grep 'setid core dumps'
            ```
        - id: sh
          desc: |
            To disable setid core dumps using a shell script:

            1. Save the script and run it as root. Disabling an option that is already disabled changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            coreadm -d global-setid -d proc-setid
            coreadm | grep 'setid core dumps'
            ```
        - id: ansible
          desc: |
            To disable setid core dumps using Ansible:

            1. Add the following playbook. No Ansible module manages `coreadm`, so the playbook reads the configuration first and only runs `coreadm -d` when an option is enabled.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Disable setid core dumps
              hosts: all
              become: true

              tasks:
                - name: Read the core file configuration
                  ansible.builtin.command: coreadm
                  register: coreadm_config
                  changed_when: false

                - name: Disable global and per-process setid core dumps
                  ansible.builtin.command: coreadm -d global-setid -d proc-setid
                  when: >-
                    'global setid core dumps: enabled' in coreadm_config.stdout or
                    'per-process setid core dumps: enabled' in coreadm_config.stdout
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-ip-forwarding-is-disabled
    title: Ensure IPv4 and IPv6 forwarding are disabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p forwarding ipv4").stdout.trim == "off"
      command("ipadm show-prop -c -o current -p forwarding ipv6").stdout.trim == "off"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that the host does not route packets between networks.

        IP forwarding lets the kernel pass a packet that arrives on one interface, addressed to some other host, out through another interface. Oracle Solaris controls it with the `forwarding` protocol property, set separately for `ipv4` and `ipv6` with `ipadm`. Both must be `off`, which is the Solaris 11.4 default.

        **Why this matters**

        A multihomed server that forwards packets is a router whether or not anyone intended it. An attacker who compromises a workload on one network, or simply points a static route at the server, can reach hosts on the other networks the server is attached to. That bypasses the firewall and segmentation the network design relies on, because the traffic never crosses the device that enforces them.

        Do not apply this to a host that routes by design. Gateways, firewalls, VPN endpoints, and global zones that route traffic for exclusive-IP zones or kernel zones through virtual NICs stop passing traffic between networks as soon as forwarding is off.
      audit: |
        1. Display the current forwarding values:

            ```sh
            ipadm show-prop -c -o current -p forwarding ipv4
            ipadm show-prop -c -o current -p forwarding ipv6
            ```

        2. If both commands print `off`, the check passes. If either prints `on`, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable IPv4 and IPv6 forwarding using the command line:

            1. Confirm the host is not meant to route traffic.
            2. As root, or as a user with the Network Management rights profile, set `forwarding` to `off` for both protocols. Without `-t` the change is persistent.
            3. Verify the current values.

            ```bash
            ipadm set-prop -p forwarding=off ipv4
            ipadm set-prop -p forwarding=off ipv6
            ipadm show-prop -p forwarding ipv4
            ipadm show-prop -p forwarding ipv6
            ```
        - id: sh
          desc: |
            To disable IPv4 and IPv6 forwarding using a shell script:

            1. Confirm the host is not meant to route traffic.
            2. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            for proto in ipv4 ipv6; do
              ipadm set-prop -p forwarding=off "$proto"
              printf '%s forwarding: %s\n' "$proto" \
                "$(ipadm show-prop -c -o current -p forwarding "$proto")"
            done
            ```
        - id: ansible
          desc: |
            To disable IPv4 and IPv6 forwarding using Ansible:

            1. Confirm the hosts are not meant to route traffic.
            2. Add the following playbook. The `community.network.ipadm_prop` module is deprecated and unmaintained, so the playbook calls `ipadm` directly and only sets a value when the current or persistent value differs.
            3. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Disable IPv4 and IPv6 forwarding
              hosts: all
              become: true

              tasks:
                - name: Read the current and persistent forwarding values
                  ansible.builtin.command: "ipadm show-prop -c -o current,persistent -p forwarding {{ item }}"
                  loop:
                    - ipv4
                    - ipv6
                  register: forwarding_values
                  changed_when: false

                - name: Set forwarding to off
                  ansible.builtin.command: "ipadm set-prop -p forwarding=off {{ item.item }}"
                  loop: "{{ forwarding_values.results }}"
                  loop_control:
                    label: "{{ item.item }}"
                  when: item.stdout | trim != 'off:off'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-source-routing-is-disabled
    title: Ensure source-routed packets are not forwarded or honored for TCP replies
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p _forward_src_routed ipv4").stdout.trim == "0"
      command("ipadm show-prop -c -o current -p _forward_src_routed ipv6").stdout.trim == "0"
      command("ipadm show-prop -c -o current -p _rev_src_routes tcp").stdout.trim == "0"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/netdefaults-1.html
          title: How to Reset Network Parameters to Secure Values - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that the host ignores the route a packet's sender asks for, both when forwarding packets and when replying to TCP connections.

        A source-routed packet carries a list of hops chosen by its sender rather than by the network's routing tables. Oracle Solaris controls the handling with three private `ipadm` protocol properties, which Oracle documents for hardening: `_forward_src_routed` for `ipv4` and `ipv6` decides whether such packets are forwarded, and `_rev_src_routes` for `tcp` decides whether TCP sends its replies back along the reversed source route of an incoming connection. All three must be `0`, which is the Solaris 11.4 default.

        **Why this matters**

        Source routing hands path selection to whoever crafts the packet. Forwarded source-routed packets can be steered around firewalls and through internal segments that ordinary routing would never expose. On the TCP side, reversing the source route lets an attacker who spoofs a trusted address list their own host as a hop, so the replies come back to them and they can complete a connection that address-based trust would otherwise reject.

        Oracle notes that `_rev_src_routes` may be set to `1` briefly for network diagnostics. Return it to `0` once the diagnosis is complete.
      audit: |
        1. Display the current values of the three properties:

            ```sh
            ipadm show-prop -c -o current -p _forward_src_routed ipv4
            ipadm show-prop -c -o current -p _forward_src_routed ipv6
            ipadm show-prop -c -o current -p _rev_src_routes tcp
            ```

        2. If all three commands print `0`, the check passes. If any prints `1`, the check fails.
      remediation:
        - id: cli
          desc: |
            To disable source routing using the command line:

            1. As root, or as a user with the Network Management rights profile, set the three properties to `0`. Without `-t` the change is persistent.
            2. Verify the current values.

            ```bash
            ipadm set-prop -p _forward_src_routed=0 ipv4
            ipadm set-prop -p _forward_src_routed=0 ipv6
            ipadm set-prop -p _rev_src_routes=0 tcp
            ipadm show-prop -p _forward_src_routed ipv4
            ipadm show-prop -p _forward_src_routed ipv6
            ipadm show-prop -p _rev_src_routes tcp
            ```
        - id: sh
          desc: |
            To disable source routing using a shell script:

            1. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            for proto in ipv4 ipv6; do
              ipadm set-prop -p _forward_src_routed=0 "$proto"
            done
            ipadm set-prop -p _rev_src_routes=0 tcp

            ipadm show-prop -p _forward_src_routed ipv4
            ipadm show-prop -p _forward_src_routed ipv6
            ipadm show-prop -p _rev_src_routes tcp
            ```
        - id: ansible
          desc: |
            To disable source routing using Ansible:

            1. Add the following playbook. The `community.network.ipadm_prop` module is deprecated and unmaintained, so the playbook calls `ipadm` directly and only sets a value when the current or persistent value differs.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Disable source routing
              hosts: all
              become: true

              vars:
                source_routing_props:
                  - protocol: ipv4
                    property: _forward_src_routed
                  - protocol: ipv6
                    property: _forward_src_routed
                  - protocol: tcp
                    property: _rev_src_routes

              tasks:
                - name: Read the current and persistent values
                  ansible.builtin.command: "ipadm show-prop -c -o current,persistent -p {{ item.property }} {{ item.protocol }}"
                  loop: "{{ source_routing_props }}"
                  register: source_routing_values
                  changed_when: false

                - name: Set each property to 0
                  ansible.builtin.command: "ipadm set-prop -p {{ item.item.property }}=0 {{ item.item.protocol }}"
                  loop: "{{ source_routing_values.results }}"
                  loop_control:
                    label: "{{ item.item.property }} {{ item.item.protocol }}"
                  when: item.stdout | trim != '0:0'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-icmp-redirects-are-ignored
    title: Ensure ICMP redirects are ignored
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p _ignore_redirect ipv4").stdout.trim == "1"
      command("ipadm show-prop -c -o current -p _ignore_redirect ipv6").stdout.trim == "1"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/icmp-1.html
          title: How to Prevent ICMP Redirects - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that the host does not let ICMP redirect messages change its routing table.

        Routers send ICMP redirects to tell a host that a better first hop exists for a destination, and by default Oracle Solaris installs the suggested route. The private `ipadm` property `_ignore_redirect`, which Oracle's network hardening procedure sets, turns that off. It must be `1` for both `ipv4` and `ipv6`. Solaris 11.4 ships it as `0`, so a default installation fails this check.

        **Why this matters**

        ICMP redirects are unauthenticated. Anyone on the local segment can forge one that names their own machine as the better gateway for a destination, such as the database server or the default route. The host then sends that traffic through the attacker, who can read, modify, or drop it in a man-in-the-middle position without touching any switch or router. Processing redirects also costs CPU, which a flood of them can exploit.

        On a well-designed network each segment has one gateway or a redundant gateway address, so ignoring redirects costs nothing. A segment that relies on redirects to steer hosts between several routers should configure the correct static routes before applying this.
      audit: |
        1. Display the current values:

            ```sh
            ipadm show-prop -c -o current -p _ignore_redirect ipv4
            ipadm show-prop -c -o current -p _ignore_redirect ipv6
            ```

        2. If both commands print `1`, the check passes. If either prints `0`, the check fails.
      remediation:
        - id: cli
          desc: |
            To ignore ICMP redirects using the command line:

            1. As root, or as a user with the Network Management rights profile, set `_ignore_redirect` to `1` for both protocols. Without `-t` the change is persistent.
            2. Verify the current values.

            ```bash
            ipadm set-prop -p _ignore_redirect=1 ipv4
            ipadm set-prop -p _ignore_redirect=1 ipv6
            ipadm show-prop -p _ignore_redirect ipv4
            ipadm show-prop -p _ignore_redirect ipv6
            ```
        - id: sh
          desc: |
            To ignore ICMP redirects using a shell script:

            1. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            for proto in ipv4 ipv6; do
              ipadm set-prop -p _ignore_redirect=1 "$proto"
              printf '%s _ignore_redirect: %s\n' "$proto" \
                "$(ipadm show-prop -c -o current -p _ignore_redirect "$proto")"
            done
            ```
        - id: ansible
          desc: |
            To ignore ICMP redirects using Ansible:

            1. Add the following playbook. The `community.network.ipadm_prop` module is deprecated and unmaintained, so the playbook calls `ipadm` directly and only sets a value when the current or persistent value differs.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Ignore ICMP redirects
              hosts: all
              become: true

              tasks:
                - name: Read the current and persistent _ignore_redirect values
                  ansible.builtin.command: "ipadm show-prop -c -o current,persistent -p _ignore_redirect {{ item }}"
                  loop:
                    - ipv4
                    - ipv6
                  register: ignore_redirect_values
                  changed_when: false

                - name: Set _ignore_redirect to 1
                  ansible.builtin.command: "ipadm set-prop -p _ignore_redirect=1 {{ item.item }}"
                  loop: "{{ ignore_redirect_values.results }}"
                  loop_control:
                    label: "{{ item.item }}"
                  when: item.stdout | trim != '1:1'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-icmp-redirects-are-not-sent
    title: Ensure ICMP redirects are not sent
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p _send_redirects ipv4").stdout.trim == "off"
      command("ipadm show-prop -c -o current -p _send_redirects ipv6").stdout.trim == "off"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/icmp-1.html
          title: How to Prevent ICMP Redirects - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that the host does not send ICMP redirect messages to other hosts.

        A host that forwards packets sends an ICMP redirect when it notices a sender could reach a destination through a better gateway on the same segment. Oracle Solaris controls this with the `send-redirects` protocol property for `ipv4` and `ipv6`, which `ipadm` also accepts under its older private name `_send_redirects`. Both must be `off`. Solaris 11.4 ships them `on`, so a default installation fails this check.

        **Why this matters**

        Redirects carry information from the host's routing table, so they reveal part of the network topology to anyone who provokes one. A server is not a router and has no business telling other hosts how to route. If the host is compromised, the same mechanism lets an attacker push routes onto neighbours that still accept redirects and pull their traffic through the compromised machine.

        Sending redirects only happens when the host forwards packets. A deliberate router that shares a segment with several gateways may legitimately need them, and it should be excluded from this check.
      audit: |
        1. Display the current values:

            ```sh
            ipadm show-prop -c -o current -p _send_redirects ipv4
            ipadm show-prop -c -o current -p _send_redirects ipv6
            ```

        2. If both commands print `off`, the check passes. If either prints `on`, the check fails.
      remediation:
        - id: cli
          desc: |
            To stop sending ICMP redirects using the command line:

            1. As root, or as a user with the Network Management rights profile, set `send-redirects` to `off` for both protocols. Without `-t` the change is persistent.
            2. Verify the current values.

            ```bash
            ipadm set-prop -p send-redirects=off ipv4
            ipadm set-prop -p send-redirects=off ipv6
            ipadm show-prop -p send-redirects ipv4
            ipadm show-prop -p send-redirects ipv6
            ```
        - id: sh
          desc: |
            To stop sending ICMP redirects using a shell script:

            1. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            for proto in ipv4 ipv6; do
              ipadm set-prop -p send-redirects=off "$proto"
              printf '%s send-redirects: %s\n' "$proto" \
                "$(ipadm show-prop -c -o current -p send-redirects "$proto")"
            done
            ```
        - id: ansible
          desc: |
            To stop sending ICMP redirects using Ansible:

            1. Add the following playbook. The `community.network.ipadm_prop` module is deprecated and unmaintained, so the playbook calls `ipadm` directly and only sets a value when the current or persistent value differs.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Stop sending ICMP redirects
              hosts: all
              become: true

              tasks:
                - name: Read the current and persistent send-redirects values
                  ansible.builtin.command: "ipadm show-prop -c -o current,persistent -p send-redirects {{ item }}"
                  loop:
                    - ipv4
                    - ipv6
                  register: send_redirects_values
                  changed_when: false

                - name: Set send-redirects to off
                  ansible.builtin.command: "ipadm set-prop -p send-redirects=off {{ item.item }}"
                  loop: "{{ send_redirects_values.results }}"
                  loop_control:
                    label: "{{ item.item }}"
                  when: item.stdout | trim != 'off:off'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-broadcast-and-multicast-echo-requests-are-ignored
    title: Ensure broadcast and multicast ICMP echo requests are ignored
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p _respond_to_echo_broadcast ip").stdout.trim == "0"
      command("ipadm show-prop -c -o current -p _respond_to_echo_multicast ipv4").stdout.trim == "0"
      command("ipadm show-prop -c -o current -p _respond_to_echo_multicast ipv6").stdout.trim == "0"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/netdisable-echo-1.html
          title: How to Disable Responses to Echo Requests - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that the host does not answer ping requests sent to a broadcast or multicast address.

        Oracle Solaris controls these replies with private `ipadm` properties that Oracle's network hardening procedure sets: `_respond_to_echo_broadcast` on the `ip` protocol, and `_respond_to_echo_multicast` on `ipv4` and `ipv6`. All three must be `0`. Solaris 11.4 ships them as `1`, so a default installation fails this check. Replies to ordinary unicast pings are not affected.

        **Why this matters**

        A single echo request sent to a broadcast or multicast address draws a reply from every host that answers. In a smurf attack the attacker spoofs the victim's address as the source, and every responding host on the segment floods the victim with replies, amplifying the attacker's bandwidth many times over. The same one-packet sweep also maps every live host on a segment for reconnaissance.

        Few tools rely on broadcast or multicast ping. Monitoring that discovers hosts this way should switch to unicast probes before this is applied.
      audit: |
        1. Display the current values:

            ```sh
            ipadm show-prop -c -o current -p _respond_to_echo_broadcast ip
            ipadm show-prop -c -o current -p _respond_to_echo_multicast ipv4
            ipadm show-prop -c -o current -p _respond_to_echo_multicast ipv6
            ```

        2. If all three commands print `0`, the check passes. If any prints `1`, the check fails.
      remediation:
        - id: cli
          desc: |
            To ignore broadcast and multicast echo requests using the command line:

            1. As root, or as a user with the Network Management rights profile, set the three properties to `0`. Without `-t` the change is persistent.
            2. Verify the current values.

            ```bash
            ipadm set-prop -p _respond_to_echo_broadcast=0 ip
            ipadm set-prop -p _respond_to_echo_multicast=0 ipv4
            ipadm set-prop -p _respond_to_echo_multicast=0 ipv6
            ipadm show-prop -p _respond_to_echo_broadcast ip
            ipadm show-prop -p _respond_to_echo_multicast ipv4
            ipadm show-prop -p _respond_to_echo_multicast ipv6
            ```
        - id: sh
          desc: |
            To ignore broadcast and multicast echo requests using a shell script:

            1. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            ipadm set-prop -p _respond_to_echo_broadcast=0 ip
            for proto in ipv4 ipv6; do
              ipadm set-prop -p _respond_to_echo_multicast=0 "$proto"
            done

            ipadm show-prop -p _respond_to_echo_broadcast ip
            ipadm show-prop -p _respond_to_echo_multicast ipv4
            ipadm show-prop -p _respond_to_echo_multicast ipv6
            ```
        - id: ansible
          desc: |
            To ignore broadcast and multicast echo requests using Ansible:

            1. Add the following playbook. The `community.network.ipadm_prop` module is deprecated, unmaintained, and does not accept the `ip` protocol, so the playbook calls `ipadm` directly and only sets a value when the current or persistent value differs.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Ignore broadcast and multicast echo requests
              hosts: all
              become: true

              vars:
                echo_props:
                  - protocol: ip
                    property: _respond_to_echo_broadcast
                  - protocol: ipv4
                    property: _respond_to_echo_multicast
                  - protocol: ipv6
                    property: _respond_to_echo_multicast

              tasks:
                - name: Read the current and persistent values
                  ansible.builtin.command: "ipadm show-prop -c -o current,persistent -p {{ item.property }} {{ item.protocol }}"
                  loop: "{{ echo_props }}"
                  register: echo_values
                  changed_when: false

                - name: Set each property to 0
                  ansible.builtin.command: "ipadm set-prop -p {{ item.item.property }}=0 {{ item.item.protocol }}"
                  loop: "{{ echo_values.results }}"
                  loop_control:
                    label: "{{ item.item.property }} {{ item.item.protocol }}"
                  when: item.stdout | trim != '0:0'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-icmp-timestamp-and-address-mask-broadcasts-are-ignored
    title: Ensure broadcast ICMP timestamp and address mask requests are ignored
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p _respond_to_timestamp_broadcast ip").stdout.trim == "0"
      command("ipadm show-prop -c -o current -p _respond_to_address_mask_broadcast ip").stdout.trim == "0"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/netdefaults-1.html
          title: How to Reset Network Parameters to Secure Values - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that the host does not answer ICMP timestamp or address mask requests sent to a broadcast address.

        Oracle Solaris controls these replies with the private `ipadm` properties `_respond_to_timestamp_broadcast` and `_respond_to_address_mask_broadcast` on the `ip` protocol. Oracle lists both among the network parameters to return to their secure values. Both must be `0`, which is the Solaris 11.4 default.

        **Why this matters**

        A timestamp reply discloses the host's clock, and an address mask reply discloses the subnet mask of the interface. Sent to a broadcast address, one request collects that information from every host on the segment at once, which helps an attacker map the network and fingerprint systems. Answering broadcasts also lets a spoofed request turn the segment into an amplifier against a victim, and each reply costs CPU on the responding host.

        Nothing in a modern network depends on broadcast timestamp or address mask queries. A value of `1` means someone changed the shipped default, and it should be set back.
      audit: |
        1. Display the current values:

            ```sh
            ipadm show-prop -c -o current -p _respond_to_timestamp_broadcast ip
            ipadm show-prop -c -o current -p _respond_to_address_mask_broadcast ip
            ```

        2. If both commands print `0`, the check passes. If either prints `1`, the check fails.
      remediation:
        - id: cli
          desc: |
            To ignore broadcast timestamp and address mask requests using the command line:

            1. As root, or as a user with the Network Management rights profile, set both properties to `0`. Without `-t` the change is persistent.
            2. Verify the current values.

            ```bash
            ipadm set-prop -p _respond_to_timestamp_broadcast=0 ip
            ipadm set-prop -p _respond_to_address_mask_broadcast=0 ip
            ipadm show-prop -p _respond_to_timestamp_broadcast ip
            ipadm show-prop -p _respond_to_address_mask_broadcast ip
            ```
        - id: sh
          desc: |
            To ignore broadcast timestamp and address mask requests using a shell script:

            1. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            for prop in _respond_to_timestamp_broadcast _respond_to_address_mask_broadcast; do
              ipadm set-prop -p "${prop}=0" ip
              printf '%s: %s\n' "$prop" "$(ipadm show-prop -c -o current -p "$prop" ip)"
            done
            ```
        - id: ansible
          desc: |
            To ignore broadcast timestamp and address mask requests using Ansible:

            1. Add the following playbook. The `community.network.ipadm_prop` module is deprecated, unmaintained, and does not accept the `ip` protocol, so the playbook calls `ipadm` directly and only sets a value when the current or persistent value differs.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Ignore broadcast timestamp and address mask requests
              hosts: all
              become: true

              tasks:
                - name: Read the current and persistent values
                  ansible.builtin.command: "ipadm show-prop -c -o current,persistent -p {{ item }} ip"
                  loop:
                    - _respond_to_timestamp_broadcast
                    - _respond_to_address_mask_broadcast
                  register: icmp_broadcast_values
                  changed_when: false

                - name: Set each property to 0
                  ansible.builtin.command: "ipadm set-prop -p {{ item.item }}=0 ip"
                  loop: "{{ icmp_broadcast_values.results }}"
                  loop_control:
                    label: "{{ item.item }}"
                  when: item.stdout | trim != '0:0'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-directed-broadcasts-are-not-forwarded
    title: Ensure directed broadcasts are not forwarded
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p _forward_directed_broadcasts ip").stdout.trim == "0"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/netbroadcast-packet-1.html
          title: How to Disable Broadcast Packet Forwarding - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that the host does not forward packets addressed to the broadcast address of another subnet.

        A directed broadcast is sent from outside a subnet to that subnet's broadcast address, and the last router delivers it to every host on the subnet. Oracle Solaris controls whether it relays such packets with the private `ipadm` property `_forward_directed_broadcasts` on the `ip` protocol, which Oracle's hardening procedure sets. It must be `0`, which is the Solaris 11.4 default.

        **Why this matters**

        Forwarded directed broadcasts are the delivery mechanism of smurf and fraggle amplification attacks. An attacker on a remote network sends one spoofed echo or UDP packet to the subnet's broadcast address, the forwarding host fans it out to every machine on the subnet, and their combined replies flood the victim whose address was spoofed. They also let a remote attacker sweep an internal subnet in one packet.

        The property only matters when the host forwards packets, but it should stay `0` on routers as well. Oracle notes that disabling it also stops broadcast pings across the router.
      audit: |
        1. Display the current value:

            ```sh
            ipadm show-prop -c -o current -p _forward_directed_broadcasts ip
            ```

        2. If the command prints `0`, the check passes. If it prints `1`, the check fails.
      remediation:
        - id: cli
          desc: |
            To stop forwarding directed broadcasts using the command line:

            1. As root, or as a user with the Network Management rights profile, set `_forward_directed_broadcasts` to `0`. Without `-t` the change is persistent.
            2. Verify the current value.

            ```bash
            ipadm set-prop -p _forward_directed_broadcasts=0 ip
            ipadm show-prop -p _forward_directed_broadcasts ip
            ```
        - id: sh
          desc: |
            To stop forwarding directed broadcasts using a shell script:

            1. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            ipadm set-prop -p _forward_directed_broadcasts=0 ip
            ipadm show-prop -p _forward_directed_broadcasts ip
            ```
        - id: ansible
          desc: |
            To stop forwarding directed broadcasts using Ansible:

            1. Add the following playbook. The `community.network.ipadm_prop` module is deprecated, unmaintained, and does not accept the `ip` protocol, so the playbook calls `ipadm` directly and only sets the value when the current or persistent value differs.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Stop forwarding directed broadcasts
              hosts: all
              become: true

              tasks:
                - name: Read the current and persistent value
                  ansible.builtin.command: ipadm show-prop -c -o current,persistent -p _forward_directed_broadcasts ip
                  register: directed_broadcasts_value
                  changed_when: false

                - name: Set _forward_directed_broadcasts to 0
                  ansible.builtin.command: ipadm set-prop -p _forward_directed_broadcasts=0 ip
                  when: directed_broadcasts_value.stdout | trim != '0:0'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-tcp-strong-iss-is-enabled
    title: Ensure TCP initial sequence numbers are generated per RFC 6528
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-23
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p _strong_iss tcp").stdout.trim == "2"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/netdefaults-1.html
          title: How to Reset Network Parameters to Secure Values - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that TCP initial sequence numbers are unpredictable to an off-path attacker.

        Every TCP connection starts from an initial sequence number, and the private `ipadm` property `_strong_iss` on the `tcp` protocol selects how Oracle Solaris generates it. `0` is plain sequential generation, `1` adds a random increment, and `2` derives a unique value per connection from a secret, as described in RFC 6528, Defending against Sequence Number Attacks. At boot, `svc:/network/initial:default` applies the `TCP_STRONG_ISS` value from `/etc/default/inetinit`. The running value must be `2`, which is the Solaris 11.4 default.

        **Why this matters**

        If an attacker can predict the sequence number the host will choose, they can complete a TCP handshake while spoofing a trusted source address without ever seeing the replies, and inject data into existing connections. That is the blind spoofing technique behind classic attacks on address-based trust, and it also enables forged resets that tear down long-lived sessions.

        There is no operational reason to run with a weaker setting. A value other than `2` means the property or `/etc/default/inetinit` was changed, and both should be set back.
      audit: |
        1. Display the running value:

            ```sh
            ipadm show-prop -c -o current -p _strong_iss tcp
            ```

        2. Display the value applied at boot:

            ```sh
            grep '^TCP_STRONG_ISS=' /etc/default/inetinit
            ```

        3. If the first command prints `2`, the check passes. Any other value fails. If the second command shows a value other than `2`, the running value reverts to it at the next boot.
      remediation:
        - id: cli
          desc: |
            To generate TCP initial sequence numbers per RFC 6528 using the command line:

            1. As root, edit `/etc/default/inetinit` with `pfedit` and set `TCP_STRONG_ISS=2`, so the value applied at boot is correct.
            2. Set the running value with `ipadm` so the change takes effect without a reboot.
            3. Verify the running value.

            ```bash
            pfedit /etc/default/inetinit
            # set the line: TCP_STRONG_ISS=2
            ipadm set-prop -p _strong_iss=2 tcp
            ipadm show-prop -p _strong_iss tcp
            ```
        - id: sh
          desc: |
            To generate TCP initial sequence numbers per RFC 6528 using a shell script:

            1. Save the script and run it as root. It rewrites `TCP_STRONG_ISS` in place, preserving the file's owner and mode, or appends it when absent, then sets the running value.

            ```sh
            #!/bin/sh
            set -e

            f=/etc/default/inetinit
            if grep '^TCP_STRONG_ISS=' "$f" >/dev/null; then
              tmp=$(mktemp)
              sed 's/^TCP_STRONG_ISS=.*/TCP_STRONG_ISS=2/' "$f" > "$tmp"
              cat "$tmp" > "$f"
              rm -f "$tmp"
            else
              echo 'TCP_STRONG_ISS=2' >> "$f"
            fi

            ipadm set-prop -p _strong_iss=2 tcp
            ipadm show-prop -p _strong_iss tcp
            ```
        - id: ansible
          desc: |
            To generate TCP initial sequence numbers per RFC 6528 using Ansible:

            1. Add the following playbook. It sets the boot value in `/etc/default/inetinit` and the running value with `ipadm`, which no maintained Ansible module manages.
            2. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Generate TCP initial sequence numbers per RFC 6528
              hosts: all
              become: true

              tasks:
                - name: Set TCP_STRONG_ISS in /etc/default/inetinit
                  ansible.builtin.lineinfile:
                    path: /etc/default/inetinit
                    regexp: '^TCP_STRONG_ISS='
                    line: TCP_STRONG_ISS=2

                - name: Read the running _strong_iss value
                  ansible.builtin.command: ipadm show-prop -c -o current -p _strong_iss tcp
                  register: strong_iss_value
                  changed_when: false

                - name: Set _strong_iss to 2
                  ansible.builtin.command: ipadm set-prop -p _strong_iss=2 tcp
                  when: strong_iss_value.stdout | trim != '2'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-strong-host-model-is-enabled
    title: Ensure the strong host model is enabled for IPv4 and IPv6
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      command("ipadm show-prop -c -o current -p hostmodel ipv4").stdout.trim == "strong"
      command("ipadm show-prop -c -o current -p hostmodel ipv6").stdout.trim == "strong"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/netstrict-multihome-1.html
          title: How to Set Strict Multihoming - Securing the Network in Oracle® Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ipadm-8.html
          title: 'ipadm - man pages section 8: System Administration Commands'
      desc: |
        This check verifies that a multihomed host only accepts packets on the interface that owns the destination address and only sends packets out of the interface that owns the source address.

        Oracle Solaris calls this strict multihoming and controls it with the `hostmodel` protocol property for `ipv4` and `ipv6`. It accepts `weak`, `src-priority`, and `strong`. Under `weak` the host accepts a packet for any of its addresses on any interface. `src-priority` prefers the interface that owns the source address when sending. `strong` binds both directions to the owning interface. The check requires `strong` for both protocols. Solaris 11.4 ships `weak`, so a default installation fails this check.

        **Why this matters**

        Under the weak host model, a server attached to a public network and an internal management network will accept a packet addressed to its internal address when it arrives on the public interface. An attacker on the public side who routes traffic for that internal address to the server reaches services bound to the management network, bypassing the segmentation the two interfaces were meant to provide. Oracle recommends the strong model for hosts that sit between domains, such as firewalls and VPN nodes.

        The strong model breaks asymmetric routing. On a multihomed host whose replies leave through a different interface than the requests arrived on, for example a host with a single default route through one interface that also serves addresses on another, or a host behind load balancers that route return traffic differently, connections fail once `strong` is set. Do not apply it to such hosts until routing is symmetric. `src-priority` is a weaker option for hosts that cannot meet that requirement, but it does not satisfy this check.
      audit: |
        1. Display the current host model:

            ```sh
            ipadm show-prop -c -o current -p hostmodel ipv4
            ipadm show-prop -c -o current -p hostmodel ipv6
            ```

        2. If both commands print `strong`, the check passes. If either prints `weak` or `src-priority`, the check fails.
      remediation:
        - id: cli
          desc: |
            To enable the strong host model using the command line:

            1. Confirm that every route out of the host leaves through the interface that owns the source address, so that no connection depends on asymmetric routing.
            2. As root, or as a user with the Network Management rights profile, set `hostmodel` to `strong` for both protocols. Without `-t` the change is persistent.
            3. Verify the current values.

            ```bash
            ipadm set-prop -p hostmodel=strong ipv4
            ipadm set-prop -p hostmodel=strong ipv6
            ipadm show-prop -p hostmodel ipv4
            ipadm show-prop -p hostmodel ipv6
            ```
        - id: sh
          desc: |
            To enable the strong host model using a shell script:

            1. Confirm that no connection on the host depends on asymmetric routing.
            2. Save the script and run it as root. Setting a property to the value it already has changes nothing, so the script is safe to rerun.

            ```sh
            #!/bin/sh
            set -e

            for proto in ipv4 ipv6; do
              ipadm set-prop -p hostmodel=strong "$proto"
              printf '%s hostmodel: %s\n' "$proto" \
                "$(ipadm show-prop -c -o current -p hostmodel "$proto")"
            done
            ```
        - id: ansible
          desc: |
            To enable the strong host model using Ansible:

            1. Confirm that no connection on the target hosts depends on asymmetric routing.
            2. Add the following playbook. The `community.network.ipadm_prop` module is deprecated and unmaintained, so the playbook calls `ipadm` directly and only sets a value when the current or persistent value differs.
            3. Run the playbook against the Solaris hosts.

            ```yaml
            ---
            - name: Enable the strong host model
              hosts: all
              become: true

              tasks:
                - name: Read the current and persistent hostmodel values
                  ansible.builtin.command: "ipadm show-prop -c -o current,persistent -p hostmodel {{ item }}"
                  loop:
                    - ipv4
                    - ipv6
                  register: hostmodel_values
                  changed_when: false

                - name: Set hostmodel to strong
                  ansible.builtin.command: "ipadm set-prop -p hostmodel=strong {{ item.item }}"
                  loop: "{{ hostmodel_values.results }}"
                  loop_control:
                    label: "{{ item.item }}"
                  when: item.stdout | trim != 'strong:strong'
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-telnet-server-is-not-enabled
    title: Ensure the telnet server is not enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-3-2
    mql: |
      services.where(name == /^svc:\/network\/telnet:/).all(enabled == false)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/in.telnetd-8.html
          title: "in.telnetd - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/svcadm-8.html
          title: "svcadm - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the telnet remote login server is not enabled.

        The telnet server, `in.telnetd`, is started by `inetd` for each connection to TCP port 23 and is managed by SMF as `svc:/network/telnet:default`. Every instance of that service must be disabled, or the service must not be installed at all.

        **Why this matters**

        Telnet sends the login name, the password, and every keystroke and line of output of the session across the network in cleartext. Anyone who can capture traffic on the path between client and server, on a shared segment, a compromised router, or a mirrored switch port, reads the credentials directly and reuses them. An attacker in the path can also inject commands into an established session, because the protocol has no integrity protection.

        SSH, which Solaris 11.4 installs and enables by default, provides the same interactive access over an encrypted and authenticated channel. There is no case on a networked server where telnet is needed alongside it.
      audit: |
        1. List the SMF instances of the telnet server:

           ```bash
           svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/telnet:'
           ```

        2. Read the state in the first column of each line.

        The check passes when the command prints nothing, because no instance is installed, or when every line shows `disabled`, `uninitialized`, or `incomplete`. An `incomplete` instance is only named by another manifest and has no package installed. Any other state, including `online`, `offline`, and `maintenance`, counts as enabled and fails.
      remediation:
        - id: cli
          desc: |
            To disable the telnet server using the SMF command line:

            1. List the installed instances with `svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/telnet:'`. If nothing is printed, no change is needed.
            2. Disable each instance that is not already `disabled`. Without `-t` the change persists across reboots, and `-s` waits until the instance reaches the disabled state.
            3. Confirm that every instance now reports `disabled`.

            ```bash
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/telnet:'
            svcadm disable -s svc:/network/telnet:default
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/telnet:'
            ```
        - id: sh
          desc: |
            To disable every installed instance of the telnet server using a shell script:

            1. Save the script and run it as root.
            2. The script reads all SMF instances and persistently disables each matching instance that is not already disabled. It makes no change when the telnet server is not installed.

            ```sh
            #!/bin/sh
            set -e

            svcs -aH -o state,fmri | while read -r state fmri; do
              case "$fmri" in
                svc:/network/telnet:*)
                  case "$state" in
                    disabled | uninitialized | incomplete) ;;
                    *) svcadm disable -s "$fmri" ;;
                  esac
                  ;;
              esac
            done
            ```
        - id: ansible
          desc: |
            To disable every installed instance of the telnet server using Ansible:

            1. List the SMF instances on the host.
            2. Disable and stop each instance whose FMRI matches. `ansible.builtin.service` drives `svcadm` on Solaris, and `enabled: false` makes the change persistent. Hosts without the telnet server installed get no change.

            ```yaml
            ---
            - name: Disable the telnet server
              hosts: all
              become: true
              tasks:
                - name: List SMF service instances
                  ansible.builtin.command: svcs -aH -o state,fmri
                  register: smf_instances
                  changed_when: false

                - name: Disable and stop telnet server instances
                  ansible.builtin.service:
                    name: "{{ item }}"
                    state: stopped
                    enabled: false
                  vars:
                    installed_fmris: "{{ smf_instances.stdout_lines | reject('match', '^incomplete ') | map('split') | map('last') | list }}"
                  loop: "{{ installed_fmris | select('match', '^svc:/network/telnet:') | list }}"
            ```

