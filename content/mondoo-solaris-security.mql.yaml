            3. Confirm that every instance now reports `disabled`.

            ```bash
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/(login:(rlogin|klogin|eklogin)|shell:(default|kshell)|rexec:)'
            svcadm disable -s svc:/network/login:rlogin
            svcadm disable -s svc:/network/login:klogin
            svcadm disable -s svc:/network/login:eklogin
            svcadm disable -s svc:/network/shell:default
            svcadm disable -s svc:/network/shell:kshell
            svcadm disable -s svc:/network/rexec:default
            svcs -a | /usr/xpg4/bin/grep -E 'svc:/network/(login:(rlogin|klogin|eklogin)|shell:(default|kshell)|rexec:)'
            ```
        - id: sh
          desc: |
            To disable every installed instance of the Berkeley r-services using a shell script:

            1. Save the script and run it as root.
            2. The script reads all SMF instances and persistently disables each matching instance that is not already disabled. It makes no change when the Berkeley r-services is not installed.

            ```sh
            #!/bin/sh
            set -e

            svcs -aH -o state,fmri | while read -r state fmri; do
              case "$fmri" in
                svc:/network/login:rlogin|svc:/network/login:klogin|svc:/network/login:eklogin|svc:/network/shell:default|svc:/network/shell:kshell|svc:/network/rexec:*)
                  case "$state" in
                    disabled | uninitialized | incomplete) ;;
                    *) svcadm disable -s "$fmri" ;;
