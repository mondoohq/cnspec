          desc: |
            To disable every installed instance of the TFTP server using a shell script:

            1. Save the script and run it as root.
            2. The script reads all SMF instances and persistently disables each matching instance that is not already disabled. It makes no change when the TFTP server is not installed.

            ```sh
            #!/bin/sh
            set -e

