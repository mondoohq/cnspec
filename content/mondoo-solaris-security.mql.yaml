        An NIS server is made up of several SMF services: `svc:/network/nis/server` runs `ypserv`, the map lookup server; `svc:/network/nis/passwd` runs `rpc.yppasswdd`, which accepts password changes from clients; `svc:/network/nis/xfr` runs `ypxfrd`, which transfers whole maps to other servers; and `svc:/network/nis/update` runs `rpc.ypupdated`. Every instance of these services must be disabled, or not installed. The NIS client services are not part of this check.

