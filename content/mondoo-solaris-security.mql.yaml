          title: "sshd_config - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E37838_01/html/E61025/openssh1.html
          title: OpenSSH Implementation of Secure Shell - Managing Secure Shell Access in Oracle Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/smf-stencil-5.html
          title: "smf_stencil - man pages section 5: File Formats"
      desc: |
        This check verifies that the SSH server protects the integrity of sessions only with SHA-2 based or 128-bit UMAC message authentication codes.

        `MACs` lists the message authentication code algorithms `sshd` will negotiate to detect tampering with packets. The check requires a `MACs` line in the file whose entries all come from `umac-128-etm@openssh.com`, `hmac-sha2-256-etm@openssh.com`, `hmac-sha2-512-etm@openssh.com`, `umac-128@openssh.com`, `hmac-sha2-256`, `hmac-sha2-512`. The OpenSSH 10.0 build in Solaris 11.4 also enables `hmac-sha1`, `hmac-sha1-etm@openssh.com`, `umac-64@openssh.com`, and `umac-64-etm@openssh.com` by default, so the check fails when the line is absent. The Solaris stencil writes the directive only when the SMF property `config/MACs` is set.

        **Why this matters**

        The MAC is what stops an attacker on the network path from altering or injecting packets in a session. `umac-64` produces 64-bit tags and `hmac-sha1-96` 96-bit tags, which give a forger far better odds than the 128-bit and longer tags on the allowed list, and the SHA-1 based MACs depend on a hash that is being retired. A client that offers only these algorithms would otherwise get a session protected by them. The `-etm` algorithms authenticate the ciphertext before decrypting it, which is why they come first in the list.

        Restricting the list can lock out old clients. Test connections from every system that needs access before applying it widely.
      audit: |
        1. Print the directive from the main configuration file and from any drop-in file it includes:

           ```bash
           /usr/xpg4/bin/grep -n -i -E '^[[:space:]]*MACs[[:space:]=]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null
           ```

        2. Print the `Match` and `Include` lines of the main file:

           ```bash
           /usr/xpg4/bin/grep -n -i -E '^[[:space:]]*(Match|Include)[[:space:]]' /etc/ssh/sshd_config
           ```

        3. OpenSSH uses the first value it reads, and a line after a `Match` line applies only to that `Match` block. On Solaris 11.4 the `Include` line sits at the end of `/etc/ssh/sshd_config`, so a line in the main file above any `Match` line takes precedence over the drop-in files.

        The check passes when the first applicable `MACs` line lists only algorithms from the allowed set. It fails when the line lists any other algorithm, or when no line is printed.

        Do not audit this with `sshd -T`. It prints the OpenSSH built-in default for a directive that is absent from the file, while the check requires the directive to be written in the file.
      remediation:
        - id: cli
          desc: |
            To restrict SSH to strong MAC algorithms using the CLI:

            1. Check whether SMF generates `/etc/ssh/sshd_config`. Oracle Cloud images of Solaris 11.4 set `sshd_stencil/disabled` to `false`, and the file then starts with a warning that it was generated from SMF data. In that case the file is rewritten from the `config` property group of `svc:/network/ssh:default` on every refresh, and a hand edit is lost.
            2. If the command prints `false`, set the SMF property and refresh the service. The refresh rewrites the file and signals `sshd` to reread it.
            3. Otherwise, edit `/etc/ssh/sshd_config` as root. Put this line above any `Match` line and above the `Include` line, and delete or change any other uncommented line for the same keyword that comes before the first `Match` line:

               ```text
               MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512
               ```

            4. Validate the file with `sshd -t`, then refresh the service. Keep the current session open until a new login succeeds.

            ```bash
            svcprop -p sshd_stencil/disabled svc:/network/ssh:default

            # When it prints false:
            svccfg -s svc:/network/ssh:default setprop config/MACs = astring: umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512
            svcadm refresh svc:/network/ssh:default

            # When it prints true or reports no such property:
            vi /etc/ssh/sshd_config
            /usr/lib/ssh/sshd -t && svcadm refresh svc:/network/ssh:default
            ```
        - id: sh
          desc: |
            To restrict SSH to strong MAC algorithms using a shell script:

            1. Save the script and run it as root.
            2. On hosts where SMF generates the file, the script sets the SMF property and refreshes the service. Elsewhere it moves the directive to the top of `/etc/ssh/sshd_config`, drops other global lines for the same keyword, validates the result with `sshd -t`, and writes it back without changing the file's owner or mode.
            3. Running it again makes no further change.

            ```sh
            #!/bin/sh
            set -e

            FMRI=svc:/network/ssh:default
            SSHD_CONFIG=/etc/ssh/sshd_config
            changed=0

            set_smf() {
              if [ "$(svcprop -p "config/$1" "$FMRI" 2>/dev/null || true)" != "$3" ]; then
                svccfg -s "$FMRI" setprop "config/$1" = "$2:" "$3"
                changed=1
              fi
            }

            # When SMF generates sshd_config, the file is rewritten from the config
            # property group on every refresh, so the value has to be set in SMF.
            if [ "$(svcprop -p sshd_stencil/disabled "$FMRI" 2>/dev/null || true)" = "false" ]; then
              set_smf MACs astring umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512
              if [ "$changed" -eq 1 ]; then
                svcadm refresh "$FMRI"
              fi
              echo "SSH MAC algorithms restricted."
              exit 0
            fi

            WORK=$(mktemp /tmp/sshd_config.XXXXXX)
            NEXT=$(mktemp /tmp/sshd_config.XXXXXX)
            trap 'rm -f "$WORK" "$NEXT"' EXIT
            cp "$SSHD_CONFIG" "$WORK"

            # Print the directive as the first line and drop any other line for the
            # same keyword before the first Match line. OpenSSH uses the first value
            # it reads, and a line after a Match line applies only to that block.
            set_file() {
              nawk -v line="$1" '
                BEGIN { split(line, d, " "); key = tolower(d[1]); print line; global = 1 }
                { split($1, f, "="); kw = tolower(f[1]) }
                kw == "match" { global = 0 }
                global && kw == key { next }
                { print }
              ' "$WORK" > "$NEXT"
              cat "$NEXT" > "$WORK"
            }

            set_file "MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512"

            if cmp -s "$WORK" "$SSHD_CONFIG"; then
              echo "SSH MAC algorithms restricted."
              exit 0
            fi

            /usr/lib/ssh/sshd -t -f "$WORK"
            cat "$WORK" > "$SSHD_CONFIG"
            svcadm refresh "$FMRI"
            echo "SSH MAC algorithms restricted."
            ```
        - id: ansible
          desc: |
            To restrict SSH to strong MAC algorithms using Ansible:

            1. Save the playbook and run it against the Solaris hosts.
            2. The playbook sets the SMF property where SMF generates `/etc/ssh/sshd_config`, and edits the file everywhere else. The `validate` option runs `sshd -t` against the edited copy, and Ansible writes the file only if that copy passes.
            3. The handler refreshes `svc:/network/ssh:default`, which rewrites a generated file and signals `sshd` to reread its configuration.

            ```yaml
            ---
            - name: Restrict SSH to strong MAC algorithms
              hosts: all
              become: true

              vars:
                sshd_algorithms:
                  - umac-128-etm@openssh.com
                  - hmac-sha2-256-etm@openssh.com
                  - hmac-sha2-512-etm@openssh.com
                  - umac-128@openssh.com
                  - hmac-sha2-256
                  - hmac-sha2-512
                sshd_settings:
                  - key: MACs
                    type: astring
                    smf_value: "{{ sshd_algorithms | join(',') }}"
                    file_value: "{{ sshd_algorithms | join(',') }}"

              tasks:
                - name: Check whether SMF generates sshd_config
                  ansible.builtin.command: svcprop -p sshd_stencil/disabled svc:/network/ssh:default
                  register: sshd_stencil
                  changed_when: false
                  failed_when: false

                - name: Read the current SMF values
                  ansible.builtin.command: svcprop -p config/{{ item.key }} svc:/network/ssh:default
                  loop: "{{ sshd_settings }}"
                  register: sshd_smf
                  changed_when: false
                  failed_when: false
                  when: sshd_stencil.stdout == 'false'

                - name: Set the SMF values
                  ansible.builtin.command:
                    argv:
                      - svccfg
                      - -s
                      - svc:/network/ssh:default
                      - setprop
                      - "config/{{ item.item.key }}"
                      - "="
                      - "{{ item.item.type }}:"
                      - "{{ item.item.smf_value }}"
                  loop: "{{ sshd_smf.results }}"
                  when:
                    - sshd_stencil.stdout == 'false'
                    - item.stdout != item.item.smf_value
                  changed_when: true
                  notify: Refresh the SSH service

                - name: Set the directives at the top of sshd_config
                  ansible.builtin.lineinfile:
                    path: /etc/ssh/sshd_config
                    regexp: '(?i)^\s*{{ item.key }}\s'
                    line: "{{ item.key }} {{ item.file_value }}"
                    insertbefore: BOF
                    firstmatch: true
                    validate: /usr/lib/ssh/sshd -t -f %s
                  loop: "{{ sshd_settings }}"
                  when: sshd_stencil.stdout != 'false'
                  notify: Refresh the SSH service

              handlers:
                - name: Refresh the SSH service
                  ansible.builtin.service:
                    name: svc:/network/ssh:default
                    state: reloaded
            ```
