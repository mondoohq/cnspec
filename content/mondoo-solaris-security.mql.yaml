      desc: |
        This check verifies that scheduling jobs with cron and at is limited to an explicit list of users.

        `crontab`, `at`, and `batch` consult `/etc/cron.d/cron.allow` and `/etc/cron.d/at.allow`. When an allow file exists, only the users named in it, one per line, may submit jobs, and the matching deny file is ignored. Both allow files must exist. Oracle Solaris 11.4 ships only `cron.deny` and `at.deny`, which block a few system accounts and let every other user schedule jobs.

        **Why this matters**

        A scheduled job is a persistence mechanism that survives logouts, password changes, and reboots. An attacker who compromises any ordinary account installs a crontab entry that re-opens a reverse shell every few minutes or re-plants a removed backdoor, and with a deny list every new or forgotten account can do this by default.

        An allow list inverts the default, so a newly created account cannot schedule anything until someone grants it. Name root in both files: once `cron.allow` exists, root is subject to it too and is refused `crontab` if it is not listed. Add every account that legitimately maintains its own crontab, which `/var/spool/cron/crontabs` shows.
      audit: |
        1. Check for both allow files and list who is allowed:

           ```bash
           ls -l /etc/cron.d/cron.allow /etc/cron.d/at.allow
           cat /etc/cron.d/cron.allow /etc/cron.d/at.allow
           ```

        2. As root, list the accounts that currently have a crontab:

           ```bash
           ls /var/spool/cron/crontabs
           ```

        The check passes when both allow files exist. It fails when either is missing, which leaves the deny file in charge and lets every unlisted user schedule jobs.
      remediation:
        - id: cli
          desc: |
            To restrict cron and at to authorized users using the command line:

            1. List the accounts that currently have a crontab, and decide which of them need to keep scheduling jobs.
            2. Create `/etc/cron.d/cron.allow` and `/etc/cron.d/at.allow` containing `root` and each of those accounts, one per line, replacing `<user>` as needed.
            3. Set the owner to root and the mode to `0644`, matching the shipped deny files.

            ```bash
            ls /var/spool/cron/crontabs
            echo root > /etc/cron.d/cron.allow
            echo root > /etc/cron.d/at.allow
            echo <user> >> /etc/cron.d/cron.allow
            chown root:root /etc/cron.d/cron.allow /etc/cron.d/at.allow
            chmod 0644 /etc/cron.d/cron.allow /etc/cron.d/at.allow
            ```
        - id: sh
          desc: |
            To restrict cron and at to authorized users using a shell script:

            1. Set `ALLOWED_USERS` to the accounts besides root that may schedule jobs, or leave it empty.
            2. Run the script as root. It creates each allow file only when it is missing, so an existing list is never overwritten.

            ```sh
            #!/bin/sh
            set -e

            ALLOWED_USERS="${ALLOWED_USERS:-}"

            for file in /etc/cron.d/cron.allow /etc/cron.d/at.allow; do
              if [ -f "$file" ]; then
                echo "$file already exists."
                continue
              fi
              echo root > "$file"
              for account in $ALLOWED_USERS; do
                echo "$account" >> "$file"
              done
              chown root:root "$file"
              chmod 0644 "$file"
              echo "Created $file."
            done
            ```
        - id: ansible
          desc: |
            To restrict cron and at to authorized users using Ansible:

            1. Set `job_allowed_users` to the accounts that may schedule jobs, keeping `root` in the list.
            2. Run the playbook. It writes both allow files with that list.

            ```yaml
            ---
            - name: Restrict cron and at to authorized users
              hosts: all
              become: true
              vars:
                job_allowed_users:
                  - root
              tasks:
                - name: Write the cron and at allow files
                  ansible.builtin.copy:
                    dest: "{{ item }}"
                    content: "{{ job_allowed_users | join('\n') }}\n"
                    owner: root
                    group: root
                    mode: '0644'
                  loop:
                    - /etc/cron.d/cron.allow
                    - /etc/cron.d/at.allow
            ```
  - uid: mondoo-solaris-security-auditing-is-enabled
    title: Ensure the audit service is enabled and auditing is active
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    filters: command("id -u").stdout.trim == 0
    mql: |
      service("svc:/system/auditd:default").running
      command("auditconfig -getcond").stdout.trim == "audit condition = auditing"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E61027/index.html
          title: Managing Auditing in Oracle Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/auditd-8.html
          title: "auditd - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/auditconfig-8.html
          title: "auditconfig - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the Solaris audit subsystem is running and recording events.

        Solaris auditing is carried out by the kernel and the audit daemon, which runs as the SMF service `svc:/system/auditd:default`. The daemon hands each audit record to its plugins, by default `audit_binfile`, which writes binary trails under `/var/audit`. The check requires the service to be online and `auditconfig -getcond` to report `audit condition = auditing`. Oracle Solaris 11.4 enables auditing out of the box, so a failure here means someone turned it off or the service dropped into maintenance.

        **Why this matters**

        The audit trail is the only record on a Solaris host that ties actions to the audit ID a user received at login. That ID survives `su`, role assumption, and `pfexec`, so it still names the person after they become root. Syslog does not carry that attribution.

        An intruder who gains root and stops `auditd` before working leaves nothing behind for an investigator to reconstruct: no record of which files were read, which accounts were changed, or which commands ran. A trail that is already gaps when the incident is noticed cannot be backfilled.

        The class selection, the audit policy, and where the trail is shipped are covered by the other audit checks. Auditing has to be running for any of them to matter.
      audit: |
        Run these commands as root or as a user with the Audit Review rights profile:

        1. Confirm the audit service is online:

           ```bash
           svcs -H -o state svc:/system/auditd:default
           ```

        2. Confirm the kernel reports that auditing is active:

           ```bash
           auditconfig -getcond
           ```

        The check passes when the service state is `online` and the second command prints `audit condition = auditing`. It fails when the service is `disabled`, `offline`, or `maintenance`, or when the condition is `noaudit` or `disabled`.
      remediation:
        - id: cli
          desc: |
            To turn on auditing using the CLI:

            1. Clear the service if it is in maintenance, then enable it and wait for it to come online.
            2. Confirm that the kernel reports auditing as active.

            ```bash
            svcadm clear svc:/system/auditd:default
            svcadm enable -s svc:/system/auditd:default
            auditconfig -getcond
            ```

            Skip the `svcadm clear` line when the service is not in maintenance. If the service will not stay online, read its log with `svcs -xv svc:/system/auditd:default` and check that the audit directory has free space.
        - id: sh
          desc: |
            To turn on auditing using a shell script:

            1. Save the script and run it as root.
            2. It clears a maintenance state, enables the audit service, and prints the audit condition.

            ```sh
            #!/bin/sh
            set -e

            FMRI=svc:/system/auditd:default

            state=$(svcs -H -o state "$FMRI")
            if [ "$state" = "maintenance" ]; then
              svcadm clear "$FMRI"
            fi
            if [ "$(svcs -H -o state "$FMRI")" != "online" ]; then
              svcadm enable -s "$FMRI"
            fi

            auditconfig -getcond
            ```
        - id: ansible
          desc: |
            To turn on auditing using Ansible:

            1. Save the playbook and run it against your Solaris hosts.
            2. The `service` module drives SMF on Solaris, so the FMRI is used as the service name.

            ```yaml
            ---
            - name: Ensure the audit service is enabled and auditing is active
              hosts: all
              become: true
              tasks:
                - name: Enable and start the audit daemon
                  ansible.builtin.service:
                    name: svc:/system/auditd:default
                    state: started
                    enabled: true
            ```
  - uid: mondoo-solaris-security-login-and-logout-events-are-audited
    title: Ensure login and logout events are audited
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-07
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    filters: command("id -u").stdout.trim == 0
    mql: |
      command("auditconfig -getflags").stdout.lines.where(_ == /^active /).all(_ == /\(0x[0-9a-f]*[13579bdf][0-9a-f]{3},/)
      command("auditconfig -getnaflags").stdout.lines.where(_ == /^active /).all(_ == /\(0x[0-9a-f]*[13579bdf][0-9a-f]{3},/)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E61027/index.html
          title: Managing Auditing in Oracle Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/auditconfig-8.html
          title: "auditconfig - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that successful and failed logins and logouts are written to the audit trail, for authenticated users and for attempts that cannot yet be tied to a user.

        Solaris decides which events to record through audit classes. The `lo` class holds the login and logout events for the console, SSH, `su`, role assumption, and screen unlock. Two settings must include it:

        - the default user preselection flags, shown by `auditconfig -getflags`, which apply to every user who logs in
        - the non-attributable flags, shown by `auditconfig -getnaflags`, which cover events that happen before a user is identified, such as a failed login with an unknown name

        Classes are often selected through a meta-class. On Solaris 11.4 the default user flags are the `sstore` meta-class plus `ua`, and both `sstore` and `cusa` contain `lo`. For that reason the check does not look for the letters `lo`. It reads the active line of each command and tests the bit for `lo`, which is `0x1000`, in the first preselection mask printed in parentheses. That mask is the success mask, so a selection of `-lo`, which audits failures only, does not pass.

        **Why this matters**

        Login records answer the first questions in any investigation: who got in, from where, when, and how many attempts it took. Without the `lo` class an attacker can guess passwords against SSH, get in, and leave, and the audit trail never shows the session existed.

        The non-attributable flags matter for the attempts that fail. A password spray against names that do not exist on the host, or a guess that fails before the user is resolved, is non-attributable. If `lo` is missing there, the reconnaissance that precedes a successful break-in is invisible.

        Per-user exceptions set with `usermod -K audit_flags=...` can still remove `lo` for an individual account. Review `/etc/user_attr` for such entries alongside this check.
      audit: |
        Run these commands as root or as a user with the Audit Review rights profile:

        1. Show the active default user flags and the active non-attributable flags:

           ```bash
           auditconfig -getflags | grep '^active'
           auditconfig -getnaflags | grep '^active'
           ```

        2. If a line names only meta-classes, list the classes with `auditconfig -lsclass` and look up each mask in the class definitions:

           ```bash
           /usr/xpg4/bin/grep -E ':(lo|sstore|cusa):' /etc/security/audit_class.system
           ```

        The check passes when both active lines cover `lo`. Either `lo` is named outright, or the first mask in parentheses has the `0x1000` bit set, which means the fourth hex digit from the right is odd. The Solaris 11.4 default `sstore,ua(0x200079000,0x200079000)` passes because that digit is `9`. The check fails when either line, for example `ua(0x40000,0x40000)` or `no(0x0,0x0)`, leaves the bit clear.
      remediation:
        - id: cli
          desc: |
            To add the login and logout class using the CLI:

            1. Read the currently configured flags so you can keep them.
            2. Set the default user flags to `lo` plus the existing classes.
            3. Set the non-attributable flags to include `lo`.
            4. Confirm the active lines.

            ```bash
            auditconfig -getflags
            auditconfig -setflags lo,sstore,ua
            auditconfig -setnaflags lo
            auditconfig -getflags
            auditconfig -getnaflags
            ```

            Replace `sstore,ua` with the classes the first command reported. Without `-t`, `auditconfig` updates both the persistent audit service configuration and the running kernel. Sessions already logged in keep the mask they started with, so the change applies from the next login.
        - id: sh
          desc: |
            To add the login and logout class using a shell script:

            1. Save the script and run it as root.
            2. It tests the success mask for the `0x1000` bit and adds `lo` in front of the configured classes only when the bit is missing.

            ```sh
            #!/bin/sh
            set -e

            # Succeeds when the success mask in an "active ..." line has the lo bit, 0x1000, set.
            has_lo() {
              mask=$(printf '%s\n' "$1" | sed -n "s/^active $2 = .*(0x\([0-9a-f]*\),.*/\1/p")
              digit=$(printf '%s\n' "$mask" | sed -n 's/.*\([0-9a-f]\)[0-9a-f][0-9a-f][0-9a-f]$/\1/p')
              case "$digit" in
                1|3|5|7|9|b|d|f) return 0 ;;
                *) return 1 ;;
              esac
            }

            flags=$(auditconfig -getflags)
            if ! has_lo "$flags" "user default audit flags"; then
              current=$(printf '%s\n' "$flags" | sed -n 's/^configured user default audit flags = \([^(]*\)(.*/\1/p')
              case "$current" in
                ""|no) auditconfig -setflags lo ;;
                *) auditconfig -setflags "lo,$current" ;;
              esac
            fi

            naflags=$(auditconfig -getnaflags)
            if ! has_lo "$naflags" "non-attributable audit flags"; then
              current=$(printf '%s\n' "$naflags" | sed -n 's/^configured non-attributable audit flags = \([^(]*\)(.*/\1/p')
              case "$current" in
                ""|no) auditconfig -setnaflags lo ;;
                *) auditconfig -setnaflags "lo,$current" ;;
              esac
            fi

            auditconfig -getflags
            auditconfig -getnaflags
            ```
        - id: ansible
          desc: |
            To add the login and logout class using Ansible:

            1. Save the playbook and run it against your Solaris hosts.
            2. Each flag set is changed only when its active success mask lacks the `lo` bit.

            ```yaml
            ---
            - name: Ensure login and logout events are audited
              hosts: all
              become: true
              vars:
                lo_mask_regex: '\(0x[0-9a-f]*[13579bdf][0-9a-f]{3},'
              tasks:
                - name: Read the default user audit flags
                  ansible.builtin.command: auditconfig -getflags
                  register: audit_user_flags
                  changed_when: false

                - name: Add the lo class to the default user audit flags
                  ansible.builtin.command: >-
                    auditconfig -setflags
                    lo,{{ audit_user_flags.stdout | regex_search('configured user default audit flags = ([^(]*)\(', '\1') | first }}
                  when: audit_user_flags.stdout is not search('active user default audit flags = .*' ~ lo_mask_regex)
                  changed_when: true

                - name: Read the non-attributable audit flags
                  ansible.builtin.command: auditconfig -getnaflags
                  register: audit_na_flags
                  changed_when: false

                - name: Add the lo class to the non-attributable audit flags
                  ansible.builtin.command: >-
                    auditconfig -setnaflags
                    lo,{{ audit_na_flags.stdout | regex_search('configured non-attributable audit flags = ([^(]*)\(', '\1') | first }}
                  when: audit_na_flags.stdout is not search('active non-attributable audit flags = .*' ~ lo_mask_regex)
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-audit-policy-records-command-arguments
    title: Ensure the audit policy records command arguments
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    filters: command("id -u").stdout.trim == 0
    mql: |
      command("auditconfig -getpolicy").stdout.lines.where(_ == /^active /).any(_ == /[= ,]argv(,|$)/)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E61027/index.html
          title: Managing Auditing in Oracle Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/auditconfig-8.html
          title: "auditconfig - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that audit records for program execution include the full command line.

        The kernel audit policy controls which optional tokens are added to records. With the `argv` policy, every `exec` record carries the arguments the program was started with, not only the path of the binary. The policy is set with `auditconfig -setpolicy` and the check requires `argv` in the active policy list. Oracle Solaris 11.4 ships with `argv` already active.

        **Why this matters**

        Without arguments, a record says that `/usr/bin/bash`, `/usr/bin/curl`, or `/usr/sbin/usermod` ran, which is true of every administrator every day. With them, the record shows `curl -o /tmp/x http://...`, `usermod -P "System Administrator" backdoor`, or a `bash -c` one-liner, which is what an investigator needs to tell routine work from an intrusion.

        Execution events are only recorded for users whose preselection includes a class that covers them, such as `ex` or `pe`. The `argv` policy adds detail to those records and does not by itself start recording executions.

        Arguments can contain secrets that a careless operator typed on the command line. Restrict read access to the audit trail accordingly. The related `arge` policy, which also records the environment, is not required here and records far more sensitive data.
      audit: |
        Run this command as root or as a user with the Audit Review rights profile:

        1. Show the active audit policy:

           ```bash
           auditconfig -getpolicy | grep '^active'
           ```

        The check passes when the list after `active audit policies =` contains `argv`, as in `argv,cnt,group,seq,zonename`. It fails when `argv` is absent.
      remediation:
        - id: cli
          desc: |
            To record command arguments using the CLI:

            1. Add `argv` to the audit policy. The `+` prefix keeps the existing policies.
            2. Confirm the active policy.

            ```bash
            auditconfig -setpolicy +argv
            auditconfig -getpolicy
            ```

            Without `-t`, the change applies to the running kernel and persists across reboots.
        - id: sh
          desc: |
            To record command arguments using a shell script:

            1. Save the script and run it as root.
            2. It adds `argv` only when the active policy does not already contain it.

            ```sh
            #!/bin/sh
            set -e

            if ! auditconfig -getpolicy | grep '^active' | /usr/xpg4/bin/grep -E '[= ,]argv(,|$)' > /dev/null; then
              auditconfig -setpolicy +argv
            fi

            auditconfig -getpolicy
            ```
        - id: ansible
          desc: |
            To record command arguments using Ansible:

            1. Save the playbook and run it against your Solaris hosts.
            2. The policy is changed only when `argv` is missing from the active line.

            ```yaml
            ---
            - name: Ensure the audit policy records command arguments
              hosts: all
              become: true
              tasks:
                - name: Read the audit policy
                  ansible.builtin.command: auditconfig -getpolicy
                  register: audit_policy
                  changed_when: false

                - name: Add the argv audit policy
                  ansible.builtin.command: auditconfig -setpolicy +argv
                  when: audit_policy.stdout is not search('^active audit policies = (.*,)?argv(,|$)', multiline=True)
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-system-logging-is-enabled
    title: Ensure a system logging service is running
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      services.where(name == /^svc:\/system\/system-log:/).any(running)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/syslogd-8.html
          title: "syslogd - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/rsyslogd-8.html
          title: "rsyslogd - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that a syslog daemon is running to collect system and application log messages.

        Solaris 11.4 provides two instances of the `svc:/system/system-log` service. The `default` instance runs the native `syslogd`, configured in `/etc/syslog.conf`. The `rsyslog` instance runs `rsyslogd`, configured in `/etc/rsyslog.conf`. Only one can be enabled at a time. The check passes when either instance is online.

        **Why this matters**

        Authentication messages from `sshd` and `login`, `sudo` usage, kernel warnings, and messages from SMF services all arrive through syslog and land in `/var/adm/messages` and related files. With no daemon running, those messages are dropped at the source and nothing is written. An attacker brute forcing SSH or abusing `sudo` then produces no log lines at all, and the host also stops forwarding to any central log server it was configured to use.

        Syslog complements the audit trail rather than replacing it. Audit records attribute actions to a user; syslog captures what daemons and the kernel report.
      audit: |
        Run this command:

        1. List the state of both system-log instances:

           ```bash
           svcs -H -o state,fmri 'svc:/system/system-log:*'
           ```

        The check passes when at least one instance, normally `svc:/system/system-log:default`, is `online`. It fails when every instance is `disabled`, `offline`, or `maintenance`.
      remediation:
        - id: cli
          desc: |
            To start the native syslog daemon using the CLI:

            1. Make sure the rsyslog instance is not enabled, because the two instances exclude each other.
            2. Enable the default instance and wait for it to come online.
            3. Confirm the state.

            ```bash
            svcadm disable -s svc:/system/system-log:rsyslog
            svcadm enable -s svc:/system/system-log:default
            svcs svc:/system/system-log
            ```

            If you use rsyslog instead, enable `svc:/system/system-log:rsyslog` and leave the default instance disabled.
        - id: sh
          desc: |
            To start a syslog daemon using a shell script:

            1. Save the script and run it as root.
            2. It does nothing when an instance is already online. Otherwise it disables rsyslog and starts the native `syslogd`.

            ```sh
            #!/bin/sh
            set -e

            DEFAULT=svc:/system/system-log:default
            RSYSLOG=svc:/system/system-log:rsyslog

            if svcs -H -o state 'svc:/system/system-log:*' | grep '^online' > /dev/null; then
              echo "A system-log instance is already online"
              exit 0
            fi

            # Only one system-log instance can run at a time.
            if svcs "$RSYSLOG" > /dev/null 2>&1; then
              svcadm disable -s "$RSYSLOG"
            fi
            if [ "$(svcs -H -o state "$DEFAULT")" = "maintenance" ]; then
              svcadm clear "$DEFAULT"
            fi
            svcadm enable -s "$DEFAULT"
            ```
        - id: ansible
          desc: |
            To start a syslog daemon using Ansible:

            1. Save the playbook and run it against your Solaris hosts.
            2. The default instance is started only when no system-log instance is online, so a host that runs rsyslog is left alone.

            ```yaml
            ---
            - name: Ensure a system logging service is running
              hosts: all
              become: true
              tasks:
                - name: Read the state of the system-log instances
                  ansible.builtin.command: svcs -H -o state svc:/system/system-log:*
                  register: system_log_states
                  changed_when: false

                - name: Enable and start the default syslogd instance
                  ansible.builtin.service:
                    name: svc:/system/system-log:default
                    state: started
                    enabled: true
                  when: system_log_states.stdout is not search('^online', multiline=True)
            ```
  - uid: mondoo-solaris-security-syslog-does-not-accept-remote-messages
    title: Ensure syslog does not accept remote messages
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-09
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-3-2
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      service("svc:/system/system-log:default").enabled == false || command("svcprop -p config/log_from_remote svc:/system/system-log:default").stdout.trim == "false"
      service("svc:/system/system-log:rsyslog").enabled == false || file("/etc/rsyslog.conf").content.lines.none(_ == /^\s*(\$ModLoad\s+im(udp|tcp)|\$(UDP|TCP)ServerRun|(module|input)\(.*"im(udp|tcp)")/)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/syslogd-8.html
          title: "syslogd - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/rsyslogd-8.html
          title: "rsyslogd - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the local syslog daemon does not listen for log messages from other hosts.

        For the native `syslogd`, remote reception is controlled by the SMF property `config/log_from_remote` on `svc:/system/system-log:default`, which must be `false`. That is the Solaris 11.4 default. For `rsyslogd`, reception requires loading the `imudp` or `imtcp` input module in `/etc/rsyslog.conf`, either with the legacy `$ModLoad` and `$UDPServerRun` or `$TCPServerRun` directives or with `module(load="imudp")` and `input(type="imudp" ...)` statements. The check requires none of those lines to be active in `/etc/rsyslog.conf`. Each half is only evaluated when its instance is enabled.

        **Why this matters**

        Syslog over UDP port 514 has no authentication. Any host that can reach the port can write a message with any hostname, facility, and program name, so an attacker can plant fake `sshd` or `sudo` entries to cast suspicion elsewhere, or bury real entries under noise. A flood of messages fills `/var` and causes later, genuine entries to be lost.

        The listener is also network-reachable code running as root that most hosts have no use for. Only a host deliberately set up as a central log collector should accept remote messages. On such a host this check is expected to fail, and the listener should be restricted to the sending hosts with the PF firewall.

        Only the main `/etc/rsyslog.conf` is inspected. Keep listener definitions out of files pulled in with `$IncludeConfig` as well, because rsyslog loads those too.
      audit: |
        Run these commands:

        1. Check which system-log instances are enabled:

           ```bash
           svcs -H -o state,fmri 'svc:/system/system-log:*'
           ```

        2. If the default instance is enabled, read the remote logging property:

           ```bash
           svcprop -p config/log_from_remote svc:/system/system-log:default
           ```

        3. If the rsyslog instance is enabled, look for active network input lines:

           ```bash
           /usr/xpg4/bin/grep -E -n '^[[:space:]]*([$]ModLoad[[:space:]]+im(udp|tcp)|[$](UDP|TCP)ServerRun|(module|input)[(].*"im(udp|tcp)")' /etc/rsyslog.conf
           ```

        The check passes when the property prints `false` and the search prints no lines for each enabled instance. It fails when `config/log_from_remote` is `true` on an enabled default instance, or when an enabled rsyslog instance has an uncommented `imudp` or `imtcp` line.
      remediation:
        - id: cli
          desc: |
            To stop accepting remote syslog messages using the CLI:

            1. Set `config/log_from_remote` to `false` on the native syslog instance, refresh it, and restart it.
            2. If you use rsyslog, edit `/etc/rsyslog.conf` and put `#` in front of every `$ModLoad imudp`, `$ModLoad imtcp`, `$UDPServerRun`, `$TCPServerRun`, `$InputTCPServerRun`, and `module` or `input` line that names `imudp` or `imtcp`.
            3. Restart rsyslog after editing.

            ```bash
            svccfg -s svc:/system/system-log:default setprop config/log_from_remote = boolean: false
            svcadm refresh svc:/system/system-log:default
            svcadm restart svc:/system/system-log:default
            vi /etc/rsyslog.conf
            svcadm restart svc:/system/system-log:rsyslog
            ```

            Run only the restart line for the instance that is online.
        - id: sh
          desc: |
            To stop accepting remote syslog messages using a shell script:

            1. Save the script and run it as root.
            2. It sets the syslogd property and comments out rsyslog listener lines, restarting only the instance that is online. The XPG4 versions of `grep` and `sed` are used because they understand POSIX character classes.

            ```sh
            #!/bin/sh
            set -e

            DEFAULT=svc:/system/system-log:default
            RSYSLOG=svc:/system/system-log:rsyslog
            CONF=/etc/rsyslog.conf

            if [ "$(svcprop -p config/log_from_remote "$DEFAULT")" != "false" ]; then
              svccfg -s "$DEFAULT" setprop config/log_from_remote = boolean: false
              svcadm refresh "$DEFAULT"
              if [ "$(svcs -H -o state "$DEFAULT")" = "online" ]; then
                svcadm restart "$DEFAULT"
              fi
            fi

            PATTERN='^[[:space:]]*([$]ModLoad[[:space:]]+im(udp|tcp)|[$](UDP|TCP)ServerRun|[$]InputTCPServerRun|(module|input)[(].*"im(udp|tcp)")'
            if [ -f "$CONF" ] && /usr/xpg4/bin/grep -E "$PATTERN" "$CONF" > /dev/null; then
              tmp=$(mktemp)
              /usr/xpg4/bin/sed \
                -e '/^[[:space:]]*[$]ModLoad[[:space:]][[:space:]]*imudp/s/^/#/' \
                -e '/^[[:space:]]*[$]ModLoad[[:space:]][[:space:]]*imtcp/s/^/#/' \
                -e '/^[[:space:]]*[$]UDPServerRun/s/^/#/' \
                -e '/^[[:space:]]*[$]TCPServerRun/s/^/#/' \
                -e '/^[[:space:]]*[$]InputTCPServerRun/s/^/#/' \
                -e '/^[[:space:]]*module(.*"imudp"/s/^/#/' \
                -e '/^[[:space:]]*module(.*"imtcp"/s/^/#/' \
                -e '/^[[:space:]]*input(.*"imudp"/s/^/#/' \
                -e '/^[[:space:]]*input(.*"imtcp"/s/^/#/' \
                "$CONF" > "$tmp"
              cat "$tmp" > "$CONF"
              rm -f "$tmp"
              if [ "$(svcs -H -o state "$RSYSLOG")" = "online" ]; then
                svcadm restart "$RSYSLOG"
              fi
            fi
            ```
        - id: ansible
          desc: |
            To stop accepting remote syslog messages using Ansible:

            1. Save the playbook and run it against your Solaris hosts.
            2. Handlers restart an instance only when it was online, so a disabled instance is not started by accident.

            ```yaml
            ---
            - name: Ensure syslog does not accept remote messages
              hosts: all
              become: true
              tasks:
                - name: Read the state of the system-log instances
                  ansible.builtin.command: svcs -H -o fmri,state svc:/system/system-log:*
                  register: system_log_states
                  changed_when: false

                - name: Read the syslogd remote logging property
                  ansible.builtin.command: svcprop -p config/log_from_remote svc:/system/system-log:default
                  register: log_from_remote
                  changed_when: false

                - name: Turn off remote logging in syslogd
                  ansible.builtin.command: "svccfg -s svc:/system/system-log:default setprop config/log_from_remote = boolean: false"
                  when: log_from_remote.stdout != "false"
                  changed_when: true
                  notify: Refresh syslogd

                - name: Check whether rsyslog is configured
                  ansible.builtin.stat:
                    path: /etc/rsyslog.conf
                  register: rsyslog_conf

                - name: Comment out rsyslog network listeners
                  ansible.builtin.replace:
                    path: /etc/rsyslog.conf
                    regexp: '^([ \t]*(\$ModLoad[ \t]+im(udp|tcp)|\$(UDP|TCP)ServerRun|\$InputTCPServerRun|(module|input)\(.*"im(udp|tcp)").*)$'
                    replace: '#\1'
                  when: rsyslog_conf.stat.exists
                  notify: Restart rsyslog

              handlers:
                - name: Refresh syslogd
                  ansible.builtin.command: svcadm refresh svc:/system/system-log:default
                  changed_when: true
                  notify: Restart syslogd

                - name: Restart syslogd
                  ansible.builtin.command: svcadm restart svc:/system/system-log:default
                  when: system_log_states.stdout is search('system-log:default[ \t]+online')
                  changed_when: true

                - name: Restart rsyslog
                  ansible.builtin.command: svcadm restart svc:/system/system-log:rsyslog
                  when: system_log_states.stdout is search('system-log:rsyslog[ \t]+online')
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-package-signature-verification-is-enabled
    title: Ensure package signature verification is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-19
      compliance/nis-2: nis-2-21-2-d
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-id-ra-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-14
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      command("pkg property -H signature-policy").stdout.trim == /\s(verify|require-signatures|require-names)$/
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/pkg-1.html
          title: "pkg - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E37838_01/html/E60979/index.html
          title: Updating Systems and Adding Software in Oracle Solaris 11.4
      desc: |
        This check verifies that the IPS package client checks the cryptographic signatures on package manifests before it installs or updates software.

        The image property `signature-policy` sets what `pkg` does with manifest signatures. It accepts `ignore`, `verify`, `require-signatures`, and `require-names`. The check accepts `verify`, which rejects any package whose signature is present but invalid and is the Solaris default, `require-signatures`, which also rejects unsigned packages, and `require-names`, which additionally requires the signing certificate to carry an approved common name. The property is read with `pkg property` and changed with `pkg set-property`.

        **Why this matters**

        Oracle signs the packages in the Solaris repositories, and the manifest lists a hash for every file the package delivers. With `signature-policy` set to `ignore`, a tampered manifest is accepted. Anyone who can alter the repository, a mirror, a caching proxy, or the network path can swap a binary in a package and have it installed as root on the next `pkg update`.

        Setting `ignore` is usually a workaround for a locally built package that is not signed. The correct fix for that is to sign the local package with `pkgsign` and add its certificate to the image, not to switch verification off for every publisher.

        Each publisher can additionally carry its own `signature-policy` set with `pkg set-publisher`, and the stricter of the image and publisher values applies.
      audit: |
        Run this command:

        1. Show the image signature policy:

           ```bash
           pkg property -H signature-policy
           ```

        The check passes when the value is `verify`, `require-signatures`, or `require-names`. It fails when the value is `ignore`.
      remediation:
        - id: cli
          desc: |
            To turn on package signature verification using the CLI:

            1. Set the image signature policy to `verify`, or to `require-signatures` if every publisher you use signs its packages.
            2. Confirm the new value.

            ```bash
            pkg set-property signature-policy verify
            pkg property signature-policy
            ```
        - id: sh
          desc: |
            To turn on package signature verification using a shell script:

            1. Save the script and run it as root.
            2. It leaves `verify` and `require-signatures` alone and sets any other value to `verify`.

            ```sh
            #!/bin/sh
            set -e

            policy=$(pkg property -H signature-policy | awk '{print $2}')
            case "$policy" in
              verify|require-signatures) echo "signature-policy is already $policy" ;;
              *) pkg set-property signature-policy verify ;;
            esac

            pkg property signature-policy
            ```
        - id: ansible
          desc: |
            To turn on package signature verification using Ansible:

            1. Save the playbook and run it against your Solaris hosts.
            2. The property is changed only when it holds a value other than `verify` or `require-signatures`.

            ```yaml
            ---
            - name: Ensure package signature verification is enabled
              hosts: all
              become: true
              tasks:
                - name: Read the image signature policy
                  ansible.builtin.command: pkg property -H signature-policy
                  register: signature_policy
                  changed_when: false

                - name: Set the image signature policy to verify
                  ansible.builtin.command: pkg set-property signature-policy verify
                  when: signature_policy.stdout is not search('\s(verify|require-signatures)$')
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-package-publishers-use-https
    title: Ensure package publisher origins use HTTPS or local files
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      command("pkg publisher -H -F tsv").stdout.lines.where(_ != empty).all(_.split("\t")[6] == /^(https|file):\/\//)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/pkg-1.html
          title: "pkg - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E37838_01/html/E60979/index.html
          title: Updating Systems and Adding Software in Oracle Solaris 11.4
      desc: |
        This check verifies that every IPS publisher origin and mirror is reached over an encrypted channel or from local storage.

        Each IPS publisher has one or more origins and optional mirrors, listed by `pkg publisher`. The check reads the URI of every row and requires it to start with `https://` or `file://`. A plain `http://` origin or mirror fails. Origins and mirrors are changed with `pkg set-publisher`.

        **Why this matters**

        Over plain HTTP, catalogs, manifests, and package files cross the network in clear text. An attacker in the network path can see exactly which packages and versions the host has and is about to install, and can serve an outdated catalog that withholds security fixes without breaking any signature. When signature checking is also relaxed, the same position lets the attacker substitute package content outright.

        HTTPS also authenticates the repository server. Oracle's support repositories require a client certificate and key, which are only usable over HTTPS, so an `http://` origin for them indicates a misconfiguration or a proxy that strips TLS.

        `file://` origins point at a repository on local or NFS storage and are accepted because no repository traffic crosses the network. An internal repository served with `pkg.depotd` should be put behind TLS before hosts are pointed at it.
      audit: |
        Run this command:

        1. List every publisher with its origin and mirror URIs:

           ```bash
           pkg publisher -H -F tsv | cut -f1,5,7
           ```

        The output shows the publisher, whether the row is an origin or a mirror, and the URI. The check passes when every URI starts with `https://` or `file://`. It fails when any row starts with `http://`.
      remediation:
        - id: cli
          desc: |
            To move a publisher to an HTTPS origin using the CLI:

            1. List the publishers and their URIs.
            2. For each `http://` origin, remove it with `-G` and add the HTTPS equivalent with `-g`. For a mirror, use `-M` and `-m` instead.
            3. Refresh the catalog to confirm the new origin answers.

            ```bash
            pkg publisher -H -F tsv | cut -f1,5,7
            pkg set-publisher -G http://pkg.example.com/solaris/ -g https://pkg.example.com/solaris/ solaris
            pkg refresh --full solaris
            ```

            Replace the example URIs and publisher name with your own. Confirm that the repository answers on HTTPS before you remove the old origin, because `pkg set-publisher` fails when it cannot reach the new one. Oracle support repositories also need the key and certificate passed with `-k` and `-c`.
        - id: sh
          desc: |
            To move publishers to HTTPS origins using a shell script:

            1. Save the script and run it as root.
            2. It rewrites every `http://` origin and mirror to the same location over `https://`. It assumes the repository server answers on HTTPS at the same path.

            ```sh
            #!/bin/sh
            set -e

            TAB=$(printf '\t')

            pkg publisher -H -F tsv | while IFS="$TAB" read -r pub _ _ _ type _ uri _; do
              case "$uri" in
                http://*)
                  new="https://${uri#http://}"
                  echo "Changing $type $uri of $pub to $new"
                  if [ "$type" = "origin" ]; then
                    pkg set-publisher -G "$uri" -g "$new" "$pub"
                  else
                    pkg set-publisher -M "$uri" -m "$new" "$pub"
                  fi
                  ;;
              esac
            done

            pkg publisher
            ```
        - id: ansible
          desc: |
            To move publishers to HTTPS origins using Ansible:

            1. Save the playbook and run it against your Solaris hosts.
            2. Only rows whose URI starts with `http://` are changed, and each is replaced by the same location over `https://`.

            ```yaml
            ---
            - name: Ensure package publisher origins use HTTPS
              hosts: all
              become: true
              tasks:
                - name: List publisher origins and mirrors
                  ansible.builtin.command: pkg publisher -H -F tsv
                  register: pkg_publishers
                  changed_when: false

                - name: Replace plain HTTP origins and mirrors with HTTPS
                  vars:
                    fields: "{{ item.split('\t') }}"
                    remove_flag: "{{ '-G' if fields[4] == 'origin' else '-M' }}"
                    add_flag: "{{ '-g' if fields[4] == 'origin' else '-m' }}"
                  ansible.builtin.command: >-
                    pkg set-publisher {{ remove_flag }} {{ fields[6] }}
                    {{ add_flag }} {{ fields[6] | regex_replace('^http://', 'https://') }}
                    {{ fields[0] }}
                  loop: "{{ pkg_publishers.stdout_lines | select('search', '\thttp://') | list }}"
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-firewall-is-enabled
    title: Ensure a firewall is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      services.where(name == "svc:/network/firewall:default" || name == "svc:/network/ipfilter:default").any(running)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E60993/index.html
          title: Securing the Network in Oracle Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/pfctl-8.html
          title: "pfctl - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37853/pf.conf-7.html
          title: "pf.conf - man pages section 7: Standards, Environments, Macros, Character Sets, and Miscellany"
      desc: |
        This check verifies that a host-based packet filter is running.

        Oracle Solaris 11.4 filters traffic with Packet Filter, delivered by the `network/firewall` package and run as the SMF service `svc:/network/firewall:default`. The service loads the rule file named by its `firewall/rules` property, which defaults to `/etc/firewall/pf.conf`. Earlier releases used IP Filter through `svc:/network/ipfilter:default`. The check passes when either service is online.

        **Why this matters**

        Many Solaris services listen on all interfaces once enabled, including `rpcbind`, the RPC services behind NFS, and the Remote Administration Daemon. Without a packet filter, every one of them is reachable by anything that can route to the host, and a single vulnerable listener or a service enabled by a package update becomes remotely exploitable. A host filter also blocks lateral movement from a compromised neighbor on the same subnet, which upstream network controls usually do not see.

        A running service does not by itself mean restrictive rules. The stock `/etc/firewall/pf.conf` only sets options and passes all traffic. The `/etc/firewall/pf_ssh_only.conf` sample, which blocks everything inbound except SSH, DHCP, and required ICMPv6, is a better starting point. Review the rules with `pfctl -s rules` after enabling the service.
      audit: |
        Run these commands:

        1. Check the state of the firewall services:

           ```bash
           svcs -H -o state,fmri svc:/network/firewall:default
           svcs -H -o state,fmri svc:/network/ipfilter:default
           ```

        2. As root, review the loaded rules:

           ```bash
           svcprop -p firewall/rules svc:/network/firewall:default
           pfctl -s rules
           ```

        The check passes when either service is `online`. It fails when neither is online. On Solaris 11.4 the IP Filter service does not exist, and `svcs` reports that the pattern matches no instances.
      remediation:
        - id: cli
          desc: |
            To turn on the Packet Filter firewall using the CLI:

            1. Install the firewall package if it is missing.
            2. Write rules that allow your management access, for example by starting from `/etc/firewall/pf_ssh_only.conf`, and validate them without loading.
            3. Point the service at the rule file and enable it.

            ```bash
            pkg install network/firewall
            cp /etc/firewall/pf_ssh_only.conf /etc/firewall/pf.conf
            pfctl -nf /etc/firewall/pf.conf
            svccfg -s svc:/network/firewall:default setprop firewall/rules = astring: /etc/firewall/pf.conf
            svcadm refresh svc:/network/firewall:default
            svcadm enable -s svc:/network/firewall:default
            ```

            `pkg install` exits with status 4 when the package is already installed. Make sure the rules permit the session you are working from before you enable the service.
        - id: sh
          desc: |
            To turn on the Packet Filter firewall using a shell script:

            1. Review the rule file named by `firewall/rules` first. The script validates it but does not write rules.
            2. Save the script and run it as root.

            ```sh
            #!/bin/sh
            set -e

            FMRI=svc:/network/firewall:default

            if ! svcs "$FMRI" > /dev/null 2>&1; then
              pkg install network/firewall
            fi

            RULES=$(svcprop -p firewall/rules "$FMRI")
            /usr/sbin/pfctl -nf "$RULES"

            if [ "$(svcs -H -o state "$FMRI")" = "maintenance" ]; then
              svcadm clear "$FMRI"
            fi
            if [ "$(svcs -H -o state "$FMRI")" != "online" ]; then
              svcadm enable -s "$FMRI"
            fi
            ```
        - id: ansible
          desc: |
            To turn on the Packet Filter firewall using Ansible:

            1. Deploy your rule file before this play runs.
            2. Save the playbook and run it against your Solaris hosts. It installs the package, validates the configured rules without loading them, and starts the service.

            ```yaml
            ---
            - name: Ensure a firewall is enabled
              hosts: all
              become: true
              tasks:
                - name: Install the Packet Filter firewall package
                  community.general.pkg5:
                    name: network/firewall
                    state: present

                - name: Read the configured firewall rules file
                  ansible.builtin.command: svcprop -p firewall/rules svc:/network/firewall:default
                  register: pf_rules
                  changed_when: false

                - name: Validate the firewall rules without loading them
                  ansible.builtin.command: /usr/sbin/pfctl -nf {{ pf_rules.stdout }}
                  changed_when: false

                - name: Enable and start the firewall service
                  ansible.builtin.service:
                    name: svc:/network/firewall:default
                    state: started
                    enabled: true
            ```
  - uid: mondoo-solaris-security-time-synchronization-is-enabled
    title: Ensure a time synchronization service is running
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a7
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-06
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-17
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-45
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-10-6-1
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      services.where(name == /^svc:\/network\/(ntp|chrony):default$/).any(running)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E37838_01/html/E61003/index.html
          title: Managing Clock Synchronization in Oracle Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/ntpd-8.html
          title: "ntpd - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the system clock is kept synchronized with a reference time source.

        Solaris 11.4 runs NTP as the SMF service `svc:/network/ntp:default`. The service reads the configuration file named by its `config/configfile` property, usually `/etc/inet/ntp.conf`. Oracle Cloud images point it at `/etc/inet/ntp.linklocal`, which uses the link-local time service at `169.254.169.254`. Some releases also offer chrony as `svc:/network/chrony:default`. The check passes when either service is online.

        **Why this matters**

        Every log line and audit record carries the local clock time. When clocks drift, events from this host cannot be lined up with those from firewalls, identity providers, and other servers, and an investigator can no longer establish the order in which an attacker moved. Skew also breaks protocols that depend on time: Kerberos rejects tickets once clocks differ by more than five minutes by default, and TLS certificate and one-time password validation fail or accept the wrong window.

        An attacker who can set the clock can make logs misleading or push expired credentials back into their validity period, so the time source should be one you control or trust. Within a zone, time comes from the global zone and the service does not need to run.
      audit: |
        Run these commands:

        1. Check the state of the NTP instances. On releases that include chrony, also check `svc:/network/chrony:default`.

           ```bash
           svcs -H -o state,fmri 'svc:/network/ntp:*'
           ```

        2. Confirm the daemon has a usable peer:

           ```bash
           ntpq -p
           ```

        The check passes when `svc:/network/ntp:default` or `svc:/network/chrony:default` is `online`. It fails when neither is online. A peer marked with `*` in `ntpq -p` output shows synchronization is working.
      remediation:
        - id: cli
          desc: |
            To turn on NTP using the CLI:

            1. Create `/etc/inet/ntp.conf` with at least one server line, unless the file named by `config/configfile` already holds a working configuration.
            2. Point the service at the file, refresh it, and enable it.
            3. Confirm the service is online and has a peer.

            ```bash
            printf 'server pool.ntp.org iburst\ndriftfile /var/ntp/ntp.drift\n' > /etc/inet/ntp.conf
            svccfg -s svc:/network/ntp:default setprop config/configfile = astring: /etc/inet/ntp.conf
            svcadm refresh svc:/network/ntp:default
            svcadm enable -s svc:/network/ntp:default
            ntpq -p
            ```

            Replace `pool.ntp.org` with your organization's time servers. `/etc/inet/ntp.client` is a fuller template you can copy instead.
        - id: sh
          desc: |
            To turn on NTP using a shell script:

            1. Set `NTP_SERVER` to your time source.
            2. Save the script and run it as root. It keeps an existing configuration and only writes `/etc/inet/ntp.conf` when the configured file is missing or empty.

            ```sh
            #!/bin/sh
            set -e

            # Replace with your organization's time source.
            NTP_SERVER=pool.ntp.org
            FMRI=svc:/network/ntp:default

            if svcs -H -o state "$FMRI" svc:/network/chrony:default 2> /dev/null | grep '^online' > /dev/null; then
              echo "A time synchronization service is already online"
              exit 0
            fi

            conf=$(svcprop -p config/configfile "$FMRI" 2> /dev/null || true)
            if [ -z "$conf" ] || [ ! -s "$conf" ]; then
              conf=/etc/inet/ntp.conf
              if [ ! -s "$conf" ]; then
                printf 'server %s iburst\ndriftfile /var/ntp/ntp.drift\n' "$NTP_SERVER" > "$conf"
                chmod 644 "$conf"
              fi
              svccfg -s "$FMRI" setprop config/configfile = astring: "$conf"
              svcadm refresh "$FMRI"
            fi

            if [ "$(svcs -H -o state "$FMRI")" = "maintenance" ]; then
              svcadm clear "$FMRI"
            fi
            svcadm enable -s "$FMRI"
            ```
        - id: ansible
          desc: |
            To turn on NTP using Ansible:

            1. Set `ntp_server` to your time source.
            2. Save the playbook and run it against your Solaris hosts. An existing configuration file is left in place.

            ```yaml
            ---
            - name: Ensure a time synchronization service is running
              hosts: all
              become: true
              vars:
                ntp_server: pool.ntp.org
              tasks:
                - name: Read the NTP configuration file property
                  ansible.builtin.command: svcprop -p config/configfile svc:/network/ntp:default
                  register: ntp_configfile
                  changed_when: false
                  failed_when: false

                - name: Check whether the configured NTP file exists
                  ansible.builtin.stat:
                    path: "{{ ntp_configfile.stdout | default('/etc/inet/ntp.conf', true) }}"
                  register: ntp_conf_stat

                - name: Create an NTP client configuration
                  ansible.builtin.copy:
                    dest: /etc/inet/ntp.conf
                    content: |
                      server {{ ntp_server }} iburst
                      driftfile /var/ntp/ntp.drift
                    owner: root
                    group: sys
                    mode: "0644"
                    force: false
                  when: not ntp_conf_stat.stat.exists

                - name: Point the NTP service at the new configuration
                  ansible.builtin.command: "svccfg -s svc:/network/ntp:default setprop config/configfile = astring: /etc/inet/ntp.conf"
                  when: not ntp_conf_stat.stat.exists
                  changed_when: true
                  notify: Refresh ntp

                - name: Enable and start the NTP service
                  ansible.builtin.service:
                    name: svc:/network/ntp:default
                    state: started
                    enabled: true

              handlers:
                - name: Refresh ntp
                  ansible.builtin.command: svcadm refresh svc:/network/ntp:default
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-sudo-nopasswd-is-not-configured
    title: Ensure NOPASSWD is not configured in sudoers
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-11
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    filters: command("id -u").stdout.trim == 0
    mql: |
      sudoers.userSpecs.none( tags.any( _.downcase == "nopasswd" ) )
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/sudoers-5.html
          title: "sudoers - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E37838_01/html/E61023/index.html
          title: Securing Users and Processes in Oracle Solaris 11.4
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/pfexec-1.html
          title: "pfexec - man pages section 1: User Commands"
      desc: |
        This check verifies that no sudo rule lets a user run commands as another user without re-entering a password.

        Solaris ships sudo as the `security/sudo` package. It reads `/etc/sudoers` and every file in `/etc/sudoers.d`, which the stock file includes with `@includedir /etc/sudoers.d`. The `NOPASSWD:` tag on a rule skips authentication for the commands that follow it. The check fails when any rule in those files carries the tag. Oracle Cloud images add `opc ALL=(ALL) NOPASSWD:ALL` in `/etc/sudoers.d/svc-system-config-user`, so the check fails on them as delivered.

        **Why this matters**

        With a password-free rule, the account's password stops protecting root. Anyone who gets a shell as that user through a stolen SSH key, a hijacked session, or code running under the account is root one command later. No prompt slows them down and no failed-password message is logged. `NOPASSWD:ALL` makes the user account equivalent to root for anyone who controls it.

        Requiring the password means a stolen key or session gives an attacker the user, not the system. An attacker then has to find a second credential, and a wrong guess appears in the logs.

        Solaris also has a native alternative in role-based access control. A role is assumed with `su` and always requires authentication. A rights profile assigned with `usermod -P` grants specific commands with specific privileges through `pfexec`, which limits what the account can do instead of handing over all of root. Automation accounts that genuinely cannot answer a prompt are better served by a rights profile limited to the commands they run than by `NOPASSWD:ALL`.

        Before removing the tag from an account that has no password, as `opc` has on Oracle Cloud images, set a password or assign a role, or that account loses its only route to root.
      audit: |
        Run these commands as root:

        1. Search every sudoers file for uncommented `NOPASSWD` tags:

           ```bash
           /usr/xpg4/bin/grep -E -n '^[^#]*NOPASSWD' /etc/sudoers /etc/sudoers.d/*
           ```

        2. Confirm the files parse cleanly, so the list above is the complete rule set:

           ```bash
           visudo -c
           ```

        The check passes when the search prints nothing. It fails when any rule contains `NOPASSWD:`, such as `opc ALL=(ALL) NOPASSWD:ALL`.
      remediation:
        - id: cli
          desc: |
            To require a password for sudo using the CLI:

            1. Make sure each affected user has a password with `passwd`, or give them an RBAC role or rights profile instead.
            2. Edit each file that contains `NOPASSWD:` with `visudo` and delete the tag, leaving the rest of the rule.
            3. Validate the configuration.

            ```bash
            passwd opc
            visudo -f /etc/sudoers.d/svc-system-config-user
            visudo -c
            ```

            In the editor, change `opc ALL=(ALL) NOPASSWD:ALL` to `opc ALL=(ALL) ALL`. Keep a root session open until you have confirmed that `sudo` still works for the account.
        - id: sh
          desc: |
            To require a password for sudo using a shell script:

            1. Save the script and run it as root.
            2. It refuses to run when invoked through sudo by an account without a password, because that account would lose access.
            3. It removes the tag from every rule, validates each edited file with `visudo` before writing it back, and keeps the original mode and owner.

            ```sh
            #!/bin/sh
            set -e

            # Refuse to run when the administrator invoking it through sudo has no
            # password, because that account would lose its only route to root.
            if [ -n "${SUDO_USER:-}" ]; then
              status=$(passwd -s "$SUDO_USER" | awk '{print $2}')
              if [ "$status" != "PS" ]; then
                echo "$SUDO_USER has no usable password. Set one with passwd or assign an RBAC role first." >&2
                exit 1
              fi
            fi

            for f in /etc/sudoers /etc/sudoers.d/*; do
              [ -f "$f" ] || continue
              if /usr/xpg4/bin/grep -E '^[^#]*NOPASSWD[[:space:]]*:' "$f" > /dev/null; then
                tmp=$(mktemp)
                /usr/xpg4/bin/sed '/^[[:space:]]*#/!s/NOPASSWD[[:space:]]*:[[:space:]]*//g' "$f" > "$tmp"
                if /usr/sbin/visudo -c -q -f "$tmp"; then
                  cat "$tmp" > "$f"
                else
                  echo "Edited copy of $f failed validation, leaving it unchanged" >&2
                fi
                rm -f "$tmp"
              fi
            done

            /usr/sbin/visudo -c
            ```
        - id: ansible
          desc: |
            To require a password for sudo using Ansible:

            1. Make sure the account Ansible connects as has a password and supply it with `--ask-become-pass`, or the next run cannot become root.
            2. Save the playbook and run it against your Solaris hosts. Every edit is validated with `visudo` before it is written.

            ```yaml
            ---
            - name: Ensure NOPASSWD is not configured in sudoers
              hosts: all
              become: true
              tasks:
                - name: Find sudoers drop-in files
                  ansible.builtin.find:
                    paths: /etc/sudoers.d
                    file_type: file
                  register: sudoers_dropins

                - name: Remove NOPASSWD tags from sudoers files
                  ansible.builtin.replace:
                    path: "{{ item }}"
                    regexp: '^([^#\n]*?)NOPASSWD[ \t]*:[ \t]*'
                    replace: '\1'
                    validate: /usr/sbin/visudo -c -f %s
                  loop: "{{ ['/etc/sudoers'] + (sudoers_dropins.files | map(attribute='path') | list) }}"
            ```
