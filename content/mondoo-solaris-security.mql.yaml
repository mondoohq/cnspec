      desc: |
        This check verifies that the NFS file sharing server is not enabled.

        The NFS server runs `nfsd` and `mountd` and exports the file systems shared with `share` or the ZFS `share.nfs` property. It is managed by SMF as `svc:/network/nfs/server:default`. That instance must be disabled, or not installed, on hosts that do not serve files over NFS. The NFS client is a separate service and is not affected.

        **Why this matters**

        With the default `sys` security mode, an NFS server accepts the user and group IDs that the client asserts in each request. Any host allowed to mount a share, or able to impersonate one, can therefore read and write files as any non-root user on that share by creating a local account with the matching UID. A share exported more widely than intended, or exported with `root=` access, hands those files, or root on them, to the network.

