  - uid: mondoo-solaris-security-root-is-a-role
    title: Ensure root is a role
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-i-access-control-unique-user-identification
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-2
      compliance/soc2-2017: soc2-control-cc6-3-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      command("userattr type root").stdout.trim == "role"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/user-attr-5.html
          title: "user_attr - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/usermod-8.html
          title: "usermod - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/su-8.html
          title: "su - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that nobody can log in directly as the superuser.

        Oracle Solaris can define `root` as an RBAC role instead of a normal account. A role cannot log in. An administrator logs in with a personal account and runs `su root`, which succeeds only when that account lists `root` in its `roles` attribute in `user_attr`. The account type is changed with `usermod` and `rolemod` and read with `userattr type root`, which must print `role`. Oracle Solaris 11.4 installs root as a role.

        **Why this matters**

        When root is a normal account, anyone who learns the root password can use it from any login service that accepts a password, and the login record shows only that root logged in. An attacker who guesses, phishes, or reuses that one password owns the host without first compromising a named account.

        With root as a role, the attacker also needs the password of an account that is assigned the role. Every assumption of root is logged by `su` and recorded by the Solaris audit service under the administrator's own audit ID, so every action taken as root traces back to a person.

        Some hosts are converted back to a normal root account because their recovery procedures depend on a direct root login. On those hosts, keep root logins confined to the console with the `CONSOLE` setting in `/etc/default/login`.
      audit: |
        1. Read the account type of root:

           ```bash
           userattr type root
           ```

        2. List the accounts that can assume the root role:

           ```bash
           grep 'roles=[^;]*root' /etc/user_attr
           ```

        The check passes when the first command prints `role`. It fails when it prints `normal` or nothing, which means root is an ordinary account that can log in directly.
      remediation:
        - id: cli
          desc: |
            To make root a role using the command line:

            1. Open a root shell and keep it open until the last step succeeds.
            2. Change root to a role, then assign the role to at least one administrator account. Replace `<admin>` with that account. The `+` adds root to the roles the account already holds.
            3. From a second session, log in as `<admin>` and run `su root` to confirm the role works. `su root` asks for the root role's password, so set one with `passwd root` first if the role has none.

            **Do not close the root shell before step 3 succeeds.** Once root is a role, nobody can log in as root directly, and only accounts assigned the role can become root. Closing the only root session before an administrator can assume the role locks you out of root.

            ```bash
            usermod -K type=role root
            usermod -R +root <admin>
            userattr type root
            roles <admin>
            ```
        - id: sh
          desc: |
            To make root a role using a shell script:

            1. Set `ADMIN_USER` to the administrator account that will assume root.
            2. Run the script as root from a session you keep open.
            3. From a second session, log in as that administrator and confirm `su root` works before closing the root session.

            ```sh
            #!/bin/sh
            set -e

            ADMIN_USER="${ADMIN_USER:?Set ADMIN_USER to the account that will assume root}"

            if ! getent passwd "$ADMIN_USER" > /dev/null; then
              echo "Account $ADMIN_USER does not exist." >&2
              exit 1
            fi

            if [ "$(userattr type root || true)" != "role" ]; then
              usermod -K type=role root
              echo "Changed root to a role."
            fi

            ROLES=$(userattr roles "$ADMIN_USER" || true)
            case ",$ROLES," in
              *,root,*)
                echo "$ADMIN_USER can already assume root."
                ;;
              *)
                usermod -R +root "$ADMIN_USER"
                echo "Assigned the root role to $ADMIN_USER."
                ;;
            esac
            ```
        - id: ansible
          desc: |
            To make root a role using Ansible:

            1. Set `root_role_admin` to the administrator account that will assume root.
            2. Run the playbook. It changes root to a role only when it is not one already and adds the role to the administrator without removing other roles.
            3. Log in as that administrator and confirm `su root` works.

            ```yaml
            ---
            - name: Make root a role
              hosts: all
              become: true
              vars:
                root_role_admin: admin
              tasks:
                - name: Read the root account type
                  ansible.builtin.command: userattr type root
                  register: root_type
                  changed_when: false
                  failed_when: root_type.rc not in [0, 1]

                - name: Read the roles assigned to the administrator
                  ansible.builtin.command: userattr roles {{ root_role_admin }}
                  register: admin_roles
                  changed_when: false
                  failed_when: admin_roles.rc not in [0, 1]

                - name: Change root to a role
                  ansible.builtin.command: usermod -K type=role root
                  when: root_type.stdout != 'role'
                  changed_when: true

                - name: Assign the root role to the administrator
                  ansible.builtin.command: usermod -R +root {{ root_role_admin }}
                  when: "'root' not in admin_roles.stdout.split(',')"
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-root-login-is-restricted-to-the-console
    title: Ensure root login is restricted to the console
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-3
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-12
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-2
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      parse.ini("/etc/default/login", "=").sections[""]["CONSOLE"] == "/dev/console"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/login-1.html
          title: "login - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/account-policy-8s.html
          title: "account-policy - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that a direct root login is accepted only at the system console.

        The `CONSOLE` setting in `/etc/default/login` names the only terminal device on which `login` admits root. With `CONSOLE=/dev/console`, root can log in on the console and on the enabled `/dev/vt/#` virtual terminals of that console, and `login` refuses root on every other terminal, including telnet and rlogin sessions. The line must read `CONSOLE=/dev/console`, which is how Oracle Solaris 11.4 ships the file.

        **Why this matters**

        Without `CONSOLE`, root can log in over any terminal service that `login` handles. An attacker who obtains the root password uses it from the network directly instead of needing physical or out-of-band console access, and a password-guessing attack against root can run from anywhere.

        `CONSOLE` governs `login` only. SSH has its own `PermitRootLogin` directive, and when root is a role nobody can log in as root at all, so this setting is the second barrier that still holds on a host where root has been turned back into a normal account. Remote execution through `rsh` is not covered by `CONSOLE`, so keep the `rsh` service disabled.
      audit: |
        1. Show the active `CONSOLE` line:

           ```bash
           grep '^CONSOLE=' /etc/default/login
           ```

        The check passes when the command prints `CONSOLE=/dev/console`. It fails when the line names another device or is missing or commented out, because `login` then accepts root on any terminal.
      remediation:
        - id: cli
          desc: |
            To restrict root logins to the console using the command line:

            1. Back up `/etc/default/login`.
            2. Set `CONSOLE=/dev/console`, replacing any existing active `CONSOLE` line or adding one if none exists. A text editor works as well as the commands below.
            3. Confirm the line. `login` reads the file at each login, so no restart is needed.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/default/login` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `login_policy/root_login_device` property to `/dev/console` with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/default/login /etc/default/login.bak
            grep -v '^CONSOLE=' /etc/default/login.bak > /etc/default/login.new
            echo 'CONSOLE=/dev/console' >> /etc/default/login.new
            cat /etc/default/login.new > /etc/default/login
            rm /etc/default/login.new
            grep '^CONSOLE=' /etc/default/login
            ```
        - id: sh
          desc: |
            To restrict root logins to the console using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it replaces the active `CONSOLE` line, or appends one, and keeps the file's owner and mode.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/default/login
            KEY=CONSOLE
            VALUE=/dev/console

            STENCIL=$(svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set login_policy/root_login_device with svccfg instead." >&2
              exit 1
            fi

            if grep "^$KEY=$VALUE\$" "$FILE" > /dev/null; then
              echo "$KEY=$VALUE is already set in $FILE."
              exit 0
            fi

            TMP=$(mktemp)
            awk -v k="$KEY" -v v="$VALUE" '
              index($0, k "=") == 1 { if (!done) print k "=" v; done = 1; next }
              { print }
              END { if (!done) print k "=" v }
            ' "$FILE" > "$TMP"
            cat "$TMP" > "$FILE"
            rm -f "$TMP"

            echo "Set $KEY=$VALUE in $FILE."
            ```
        - id: ansible
          desc: |
            To restrict root logins to the console using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task replaces an active `CONSOLE` line, or inserts one after the shipped comment, and leaves the file's owner and mode unchanged.

            ```yaml
            ---
            - name: Restrict root logins to the console
              hosts: all
              become: true
              tasks:
                - name: Set CONSOLE in /etc/default/login
                  ansible.builtin.lineinfile:
                    path: /etc/default/login
                    regexp: '^CONSOLE='
                    line: CONSOLE=/dev/console
                    insertafter: '^# Comment this line out to allow remote login by root'
            ```
  - uid: mondoo-solaris-security-login-retries-are-limited
    title: Ensure login retries are limited to 3 or fewer
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-4
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      parse.ini("/etc/default/login", "=").sections[""]["RETRIES"] != empty
      parse.ini("/etc/default/login", "=").sections[""]["RETRIES"] <= 3
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/login-1.html
          title: "login - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/policy.conf-5.html
          title: "policy.conf - man pages section 5: File Formats"
      desc: |
        This check verifies that the number of failed password attempts allowed per login session is limited to 3 or fewer.

        The `RETRIES` setting in `/etc/default/login` sets how many failed attempts `login` accepts before it exits. It is also the threshold at which an account is locked when account lockout is enabled with `LOCK_AFTER_RETRIES` in `/etc/security/policy.conf`. The line must be present and set to 3 or less. Oracle Solaris 11.4 ships it commented out, and `login` then uses its built-in default of 5, which fails this check.

        **Why this matters**

        Each failed attempt in a session is one more password an attacker can try before having to reconnect. A lower limit slows online guessing against console and terminal logins and, more importantly, sets a tight lockout threshold: with `LOCK_AFTER_RETRIES=YES` and `RETRIES=3`, an account is locked after three consecutive failures instead of five.

        A low threshold also makes it easier for someone to lock out a legitimate user on purpose. Roles such as root are exempt from lockout by default, so the limit cannot be used to deny administrators the root role.
      audit: |
        1. Show the active `RETRIES` line:

           ```bash
           grep '^RETRIES=' /etc/default/login
           ```

        The check passes when the command prints `RETRIES=` followed by a number of 3 or less. It fails when the value is higher, and it also fails when the line is missing or commented out, even though `login` then applies its default of 5.
      remediation:
        - id: cli
          desc: |
            To limit login retries using the command line:

            1. Back up `/etc/default/login`.
            2. Set `RETRIES=3`, replacing any existing active `RETRIES` line or adding one if none exists. A text editor works as well as the commands below.
            3. Confirm the line. `login` reads the file at each login, so no restart is needed.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/default/login` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `login_policy/retries` property to `3` with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/default/login /etc/default/login.bak
            grep -v '^RETRIES=' /etc/default/login.bak > /etc/default/login.new
            echo 'RETRIES=3' >> /etc/default/login.new
            cat /etc/default/login.new > /etc/default/login
            rm /etc/default/login.new
            grep '^RETRIES=' /etc/default/login
            ```
        - id: sh
          desc: |
            To limit login retries using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it replaces the active `RETRIES` line, or appends one, and keeps the file's owner and mode.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/default/login
            KEY=RETRIES
            VALUE=3

            STENCIL=$(svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set login_policy/retries with svccfg instead." >&2
              exit 1
            fi

            if grep "^$KEY=$VALUE\$" "$FILE" > /dev/null; then
              echo "$KEY=$VALUE is already set in $FILE."
              exit 0
            fi

            TMP=$(mktemp)
            awk -v k="$KEY" -v v="$VALUE" '
              index($0, k "=") == 1 { if (!done) print k "=" v; done = 1; next }
              { print }
              END { if (!done) print k "=" v }
            ' "$FILE" > "$TMP"
            cat "$TMP" > "$FILE"
            rm -f "$TMP"

            echo "Set $KEY=$VALUE in $FILE."
            ```
        - id: ansible
          desc: |
            To limit login retries using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task replaces an active `RETRIES` line, or inserts one after the shipped commented default, and leaves the file's owner and mode unchanged.

            ```yaml
            ---
            - name: Limit login retries
              hosts: all
              become: true
              tasks:
                - name: Set RETRIES in /etc/default/login
                  ansible.builtin.lineinfile:
                    path: /etc/default/login
                    regexp: '^RETRIES='
                    line: RETRIES=3
                    insertafter: '^#RETRIES='
            ```
  - uid: mondoo-solaris-security-failed-logins-are-logged
    title: Ensure every failed login attempt is logged
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-c-security-awareness-training-and-tools-log-in-monitoring
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1-4
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      parse.ini("/etc/default/login", "=").sections[""]["SYSLOG_FAILED_LOGINS"] == "0"
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/login-1.html
          title: "login - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/account-policy-8s.html
          title: "account-policy - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that every failed login attempt is written to the system log.

        The `SYSLOG_FAILED_LOGINS` setting in `/etc/default/login` is the number of failed attempts `login` tolerates before it logs a failure through syslog at the `notice` level of the `auth` facility. A value of `0` logs every failure. The line must read `SYSLOG_FAILED_LOGINS=0`. Oracle Solaris 11.4 ships it commented out, and `login` then logs only after 5 failures.

        **Why this matters**

        Password guessing usually shows up as a run of failures against one or several accounts. When `login` reports only after several failures, an attacker who stays under that count per session, or who guesses the password within the first few tries, leaves no failure record, and an investigator later cannot reconstruct which accounts were targeted or from which terminal.

        The shipped `/etc/syslog.conf` sends `auth.notice` only to the console, so pair this setting with a rule that writes `auth.notice` to a file such as `/var/adm/authlog` or forwards it to a log server. SSH logs its own authentication failures, controlled by `LogLevel` in `sshd_config`, so this setting covers console and terminal logins handled by `login`.
      audit: |
        1. Show the active `SYSLOG_FAILED_LOGINS` line:

           ```bash
           grep '^SYSLOG_FAILED_LOGINS=' /etc/default/login
           ```

        The check passes when the command prints `SYSLOG_FAILED_LOGINS=0`. It fails for any other value, and it also fails when the line is missing or commented out, because `login` then waits for 5 failures before logging.
      remediation:
        - id: cli
          desc: |
            To log every failed login attempt using the command line:

            1. Back up `/etc/default/login`.
            2. Set `SYSLOG_FAILED_LOGINS=0`, replacing any existing active line for that key or adding one if none exists. A text editor works as well as the commands below.
            3. Confirm the line. `login` reads the file at each login, so no restart is needed.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/default/login` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `login/log/syslog_failed_attempts` property to `0` with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/default/login /etc/default/login.bak
            grep -v '^SYSLOG_FAILED_LOGINS=' /etc/default/login.bak > /etc/default/login.new
            echo 'SYSLOG_FAILED_LOGINS=0' >> /etc/default/login.new
            cat /etc/default/login.new > /etc/default/login
            rm /etc/default/login.new
            grep '^SYSLOG_FAILED_LOGINS=' /etc/default/login
            ```
        - id: sh
          desc: |
            To log every failed login attempt using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it replaces the active `SYSLOG_FAILED_LOGINS` line, or appends one, and keeps the file's owner and mode.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/default/login
            KEY=SYSLOG_FAILED_LOGINS
            VALUE=0

            STENCIL=$(svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set login/log/syslog_failed_attempts with svccfg instead." >&2
              exit 1
            fi

            if grep "^$KEY=$VALUE\$" "$FILE" > /dev/null; then
              echo "$KEY=$VALUE is already set in $FILE."
              exit 0
            fi

            TMP=$(mktemp)
            awk -v k="$KEY" -v v="$VALUE" '
              index($0, k "=") == 1 { if (!done) print k "=" v; done = 1; next }
              { print }
              END { if (!done) print k "=" v }
            ' "$FILE" > "$TMP"
            cat "$TMP" > "$FILE"
            rm -f "$TMP"

            echo "Set $KEY=$VALUE in $FILE."
            ```
        - id: ansible
          desc: |
            To log every failed login attempt using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task replaces an active `SYSLOG_FAILED_LOGINS` line, or inserts one after the shipped commented default, and leaves the file's owner and mode unchanged.

            ```yaml
            ---
            - name: Log every failed login attempt
              hosts: all
              become: true
              tasks:
                - name: Set SYSLOG_FAILED_LOGINS in /etc/default/login
                  ansible.builtin.lineinfile:
                    path: /etc/default/login
                    regexp: '^SYSLOG_FAILED_LOGINS='
                    line: SYSLOG_FAILED_LOGINS=0
                    insertafter: '^#SYSLOG_FAILED_LOGINS='
            ```
  - uid: mondoo-solaris-security-default-umask-is-restrictive
    title: Ensure the default login umask is 027 or more restrictive
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      parse.ini("/etc/default/login", "=").sections[""]["UMASK"] == /^0*[0-7]?[2367]7$/
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/login-1.html
          title: "login - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/umask-1.html
          title: "umask - man pages section 1: User Commands"
      desc: |
        This check verifies that files created in a user's login session are not readable by other users by default.

        The `UMASK` setting in `/etc/default/login` sets the file creation mask of the initial shell for logins through `login` and SSH. The mask removes permissions from every file and directory the user creates. The value must deny write to the group and all access to others, such as `027` or `077`. Oracle Solaris 11.4 ships the line commented out, which leaves the inherited mask of `022`, so new files are readable by every user on the host.

        **Why this matters**

        With a mask of `022`, every report, export, configuration copy, or script output that a user or administrator writes is world readable unless they remember to restrict it. Another local account, including a compromised service account, then reads database dumps, copied keys, and application configuration with embedded credentials without any privilege escalation.

        A mask of `027` still lets members of the file's group read it, which shared project directories usually rely on. Use `077` where users do not share files through groups. Shell startup files such as `/etc/profile` and a user's own profile can override the login mask, so check them when files keep appearing world readable.
      audit: |
        1. Show the active `UMASK` line:

           ```bash
           grep '^UMASK=' /etc/default/login
           ```

        The check passes when the value denies group write and all access for others, such as `UMASK=027` or `UMASK=077`. It fails for values such as `022` or `002`, and it also fails when the line is missing or commented out.
      remediation:
        - id: cli
          desc: |
            To set a restrictive default umask using the command line:

            1. Back up `/etc/default/login`.
            2. Set `UMASK=027`, replacing any existing active `UMASK` line or adding one if none exists. A text editor works as well as the commands below.
            3. Confirm the line. The new mask applies to sessions started after the change.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/default/login` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `login/environment/umask` property to `027` with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/default/login /etc/default/login.bak
            grep -v '^UMASK=' /etc/default/login.bak > /etc/default/login.new
            echo 'UMASK=027' >> /etc/default/login.new
            cat /etc/default/login.new > /etc/default/login
            rm /etc/default/login.new
            grep '^UMASK=' /etc/default/login
            ```
        - id: sh
          desc: |
            To set a restrictive default umask using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it replaces the active `UMASK` line, or appends one, and keeps the file's owner and mode.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/default/login
            KEY=UMASK
            VALUE=027

            STENCIL=$(svcprop -p config/etc_default_login/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set login/environment/umask with svccfg instead." >&2
              exit 1
            fi

            if grep "^$KEY=$VALUE\$" "$FILE" > /dev/null; then
              echo "$KEY=$VALUE is already set in $FILE."
              exit 0
            fi

            TMP=$(mktemp)
            awk -v k="$KEY" -v v="$VALUE" '
              index($0, k "=") == 1 { if (!done) print k "=" v; done = 1; next }
              { print }
              END { if (!done) print k "=" v }
            ' "$FILE" > "$TMP"
            cat "$TMP" > "$FILE"
            rm -f "$TMP"

            echo "Set $KEY=$VALUE in $FILE."
            ```
        - id: ansible
          desc: |
            To set a restrictive default umask using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task replaces an active `UMASK` line, or inserts one after the shipped commented default, and leaves the file's owner and mode unchanged.

            ```yaml
            ---
            - name: Set a restrictive default umask
              hosts: all
              become: true
              tasks:
                - name: Set UMASK in /etc/default/login
                  ansible.builtin.lineinfile:
                    path: /etc/default/login
                    regexp: '^UMASK='
                    line: UMASK=027
                    insertafter: '^#UMASK='
            ```
  - uid: mondoo-solaris-security-account-lockout-is-enabled
    title: Ensure accounts are locked after repeated failed logins
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-4
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-2
    mql: |
      parse.ini("/etc/security/policy.conf", "=").sections[""]["LOCK_AFTER_RETRIES"] == /^yes$/i
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/policy.conf-5.html
          title: "policy.conf - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/user-attr-5.html
          title: "user_attr - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37853/pam-unix-auth-7.html
          title: "pam_unix_auth - man pages section 7: Standards, Environments, Macros, Character Sets, and Miscellany"
      desc: |
        This check verifies that local accounts are locked automatically after repeated failed login attempts.

        The `LOCK_AFTER_RETRIES` setting in `/etc/security/policy.conf` sets the system-wide default. When it is `YES`, a local account in `/etc/passwd` and `/etc/shadow` is locked once its count of consecutive failed logins reaches `RETRIES` from `/etc/default/login`, and stays locked until an administrator unlocks it with `passwd -u` or until `UNLOCK_AFTER` expires. The line must read `LOCK_AFTER_RETRIES=YES`. Oracle Solaris 11.4 ships it commented out, and the default is `NO`.

        **Why this matters**

        Without lockout, an attacker who can reach a password prompt keeps guessing indefinitely, reconnecting after each session ends, until a weak or reused password falls. Lockout caps the number of guesses per account at the `RETRIES` value no matter how many connections the attacker opens.

        The `lock_after_retries` attribute in `user_attr` overrides this default for individual accounts and roles, and it takes precedence. Roles such as root carry `lock_after_retries=no` by default so that nobody can lock administrators out of root, and accounts provisioned by cloud images may carry it too, so review `user_attr` for accounts that are exempt. Lockout also lets an attacker deliberately lock a known account, so pair it with `UNLOCK_AFTER` where that denial of service matters more than the extra guesses.
      audit: |
        1. Show the active `LOCK_AFTER_RETRIES` line:

           ```bash
           grep '^LOCK_AFTER_RETRIES=' /etc/security/policy.conf
           ```

        2. List the accounts that override the default:

           ```bash
           grep 'lock_after_retries' /etc/user_attr /etc/user_attr.d/*
           ```

        The check passes when the first command prints `LOCK_AFTER_RETRIES=YES`. It fails when the value is `NO`, and it also fails when the line is missing or commented out. The second command shows accounts that are exempt regardless of the default.
      remediation:
        - id: cli
          desc: |
            To enable account lockout using the command line:

            1. Back up `/etc/security/policy.conf`.
            2. Set `LOCK_AFTER_RETRIES=YES`, replacing any existing active line for that key or adding one if none exists. A text editor works as well as the commands below.
            3. For any normal user account that carries `lock_after_retries=no` but should not be exempt, set the attribute to `yes`, replacing `<user>` with that account. Leave roles such as root exempt.
            4. Confirm the setting. It applies to the next failed login, and existing sessions are not affected.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/security/policy.conf` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_security_policyconf/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `login_policy/lock_after_retries` property to `true` with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/security/policy.conf /etc/security/policy.conf.bak
            grep -v '^LOCK_AFTER_RETRIES=' /etc/security/policy.conf.bak > /etc/security/policy.conf.new
            echo 'LOCK_AFTER_RETRIES=YES' >> /etc/security/policy.conf.new
            cat /etc/security/policy.conf.new > /etc/security/policy.conf
            rm /etc/security/policy.conf.new
            usermod -K lock_after_retries=yes <user>
            grep '^LOCK_AFTER_RETRIES=' /etc/security/policy.conf
            ```
        - id: sh
          desc: |
            To enable account lockout using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it replaces the active `LOCK_AFTER_RETRIES` line, or appends one, and keeps the file's owner and mode.
            3. Review per-account overrides in `user_attr` afterward, because the script does not change them.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/security/policy.conf
            KEY=LOCK_AFTER_RETRIES
            VALUE=YES

            STENCIL=$(svcprop -p config/etc_security_policyconf/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set login_policy/lock_after_retries with svccfg instead." >&2
              exit 1
            fi

            if grep "^$KEY=$VALUE\$" "$FILE" > /dev/null; then
              echo "$KEY=$VALUE is already set in $FILE."
              exit 0
            fi

            TMP=$(mktemp)
            awk -v k="$KEY" -v v="$VALUE" '
              index($0, k "=") == 1 { if (!done) print k "=" v; done = 1; next }
              { print }
              END { if (!done) print k "=" v }
            ' "$FILE" > "$TMP"
            cat "$TMP" > "$FILE"
            rm -f "$TMP"

            echo "Set $KEY=$VALUE in $FILE."
            ```
        - id: ansible
          desc: |
            To enable account lockout using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task replaces an active `LOCK_AFTER_RETRIES` line, or inserts one after the shipped commented default, and leaves the file's owner and mode unchanged.
            3. Review per-account overrides in `user_attr` afterward, because the playbook does not change them.

            ```yaml
            ---
            - name: Enable account lockout
              hosts: all
              become: true
              tasks:
                - name: Set LOCK_AFTER_RETRIES in /etc/security/policy.conf
                  ansible.builtin.lineinfile:
                    path: /etc/security/policy.conf
                    regexp: '^LOCK_AFTER_RETRIES='
                    line: LOCK_AFTER_RETRIES=YES
                    insertafter: '^#LOCK_AFTER_RETRIES='
            ```
  - uid: mondoo-solaris-security-passwords-use-a-strong-hashing-algorithm
    title: Ensure passwords are hashed with a strong algorithm
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      parse.ini("/etc/security/policy.conf", "=").sections[""]["CRYPT_DEFAULT"].in(["2a", "5", "6"])
      parse.ini("/etc/security/policy.conf", "=").sections[""]["CRYPT_ALGORITHMS_ALLOW"].split(",").all(_.in(["2a", "5", "6"]))
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/policy.conf-5.html
          title: "policy.conf - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/crypt.conf-5.html
          title: "crypt.conf - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37853/crypt-unix-7.html
          title: "crypt_unix - man pages section 7: Standards, Environments, Macros, Character Sets, and Miscellany"
      desc: |
        This check verifies that new passwords are stored with a strong, salted, iterated hash and that weak hash algorithms cannot be chosen.

        `/etc/security/policy.conf` names the algorithms by the identifiers listed in `/etc/security/crypt.conf`. `CRYPT_DEFAULT` is the algorithm for new passwords and must be `5` for SHA-256 crypt, `6` for SHA-512 crypt, or `2a` for bcrypt. `CRYPT_ALGORITHMS_ALLOW` lists every algorithm a password may use and must be present and contain only those three. The legacy identifiers `__unix__` for DES crypt, and `1` and `md5` for the two MD5 crypt variants, must not appear. Oracle Solaris 11.4 ships `CRYPT_DEFAULT=5` and `CRYPT_ALGORITHMS_ALLOW=2a,5,6`.

        **Why this matters**

        An attacker who reads `/etc/shadow`, from a backup, a misconfigured file permission, or a compromised root process, cracks the hashes offline at whatever speed the algorithm allows. DES crypt uses only the first 8 characters of a password, and both DES crypt and MD5 crypt are cheap enough that a single GPU tests millions of candidates per second. SHA-256 and SHA-512 crypt with the 10,000 rounds configured in `crypt.conf`, and bcrypt, make each guess far more expensive.

        The setting applies when a password is set. Existing hashes are not rewritten, and a password that still uses an algorithm missing from `CRYPT_ALGORITHMS_ALLOW` is rehashed with `CRYPT_DEFAULT` at its next change. Find accounts that still carry a legacy hash and force a password change for them. `CRYPT_ALGORITHMS_ALLOW` and `CRYPT_ALGORITHMS_DEPRECATE` are mutually exclusive, so this check requires the allow list form.
      audit: |
        1. Show the active hashing lines:

           ```bash
           /usr/xpg4/bin/grep -E '^CRYPT_(DEFAULT|ALGORITHMS_ALLOW|ALGORITHMS_DEPRECATE)=' /etc/security/policy.conf
           ```

        2. As root, list accounts whose stored hash uses MD5 crypt or DES crypt:

           ```bash
           awk -F: '$2 ~ /^\$(1|md5)[$,]/ || length($2) == 13 { print $1 }' /etc/shadow
           ```

        The check passes when `CRYPT_DEFAULT` is `5`, `6`, or `2a` and `CRYPT_ALGORITHMS_ALLOW` is present and lists only `2a`, `5`, and `6`. It fails when either value names another algorithm, and it fails when `CRYPT_ALGORITHMS_ALLOW` is missing, including when `CRYPT_ALGORITHMS_DEPRECATE` is used instead. The second command does not affect the check; it lists accounts to move to the new algorithm.
      remediation:
        - id: cli
          desc: |
            To require a strong password hashing algorithm using the command line:

            1. Back up `/etc/security/policy.conf`.
            2. Remove any active `CRYPT_DEFAULT`, `CRYPT_ALGORITHMS_ALLOW`, and `CRYPT_ALGORITHMS_DEPRECATE` lines, then add `CRYPT_DEFAULT=6` and `CRYPT_ALGORITHMS_ALLOW=2a,5,6`. A text editor works as well as the commands below.
            3. Force a password change at next login for every account the audit lists with a legacy hash, replacing `<user>` with each account, so its password is rehashed with the new default.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/security/policy.conf` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_security_policyconf/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `password/crypt/default` and `password/crypt/algorithms_allow` properties with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/security/policy.conf /etc/security/policy.conf.bak
            /usr/xpg4/bin/grep -E -v '^CRYPT_(DEFAULT|ALGORITHMS_ALLOW|ALGORITHMS_DEPRECATE)=' /etc/security/policy.conf.bak > /etc/security/policy.conf.new
            echo 'CRYPT_ALGORITHMS_ALLOW=2a,5,6' >> /etc/security/policy.conf.new
            echo 'CRYPT_DEFAULT=6' >> /etc/security/policy.conf.new
            cat /etc/security/policy.conf.new > /etc/security/policy.conf
            rm /etc/security/policy.conf.new
            passwd -f <user>
            ```
        - id: sh
          desc: |
            To require a strong password hashing algorithm using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it sets `CRYPT_DEFAULT=6` and `CRYPT_ALGORITHMS_ALLOW=2a,5,6`, comments out an active `CRYPT_ALGORITHMS_DEPRECATE` line, and keeps the file's owner and mode.
            3. Force a password change with `passwd -f` for accounts that still carry a legacy hash.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/security/policy.conf

            STENCIL=$(svcprop -p config/etc_security_policyconf/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set password/crypt/default and password/crypt/algorithms_allow with svccfg instead." >&2
              exit 1
            fi

            TMP=$(mktemp)
            awk '
              index($0, "CRYPT_ALGORITHMS_DEPRECATE=") == 1 { print "#" $0; next }
              index($0, "CRYPT_ALGORITHMS_ALLOW=") == 1 { if (!allow) print "CRYPT_ALGORITHMS_ALLOW=2a,5,6"; allow = 1; next }
              index($0, "CRYPT_DEFAULT=") == 1 { if (!def) print "CRYPT_DEFAULT=6"; def = 1; next }
              { print }
              END {
                if (!allow) print "CRYPT_ALGORITHMS_ALLOW=2a,5,6"
                if (!def) print "CRYPT_DEFAULT=6"
              }
            ' "$FILE" > "$TMP"

            if cmp -s "$TMP" "$FILE"; then
              echo "$FILE already requires a strong hashing algorithm."
            else
              cat "$TMP" > "$FILE"
              echo "Set CRYPT_DEFAULT=6 and CRYPT_ALGORITHMS_ALLOW=2a,5,6 in $FILE."
            fi
            rm -f "$TMP"
            ```
        - id: ansible
          desc: |
            To require a strong password hashing algorithm using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The tasks remove an active `CRYPT_ALGORITHMS_DEPRECATE` line, set `CRYPT_ALGORITHMS_ALLOW` and `CRYPT_DEFAULT`, and leave the file's owner and mode unchanged.
            3. Force a password change with `passwd -f` for accounts that still carry a legacy hash.

            ```yaml
            ---
            - name: Require a strong password hashing algorithm
              hosts: all
              become: true
              tasks:
                - name: Remove CRYPT_ALGORITHMS_DEPRECATE from /etc/security/policy.conf
                  ansible.builtin.lineinfile:
                    path: /etc/security/policy.conf
                    regexp: '^CRYPT_ALGORITHMS_DEPRECATE='
                    state: absent

                - name: Set CRYPT_ALGORITHMS_ALLOW in /etc/security/policy.conf
                  ansible.builtin.lineinfile:
                    path: /etc/security/policy.conf
                    regexp: '^CRYPT_ALGORITHMS_ALLOW='
                    line: CRYPT_ALGORITHMS_ALLOW=2a,5,6

                - name: Set CRYPT_DEFAULT in /etc/security/policy.conf
                  ansible.builtin.lineinfile:
                    path: /etc/security/policy.conf
                    regexp: '^CRYPT_DEFAULT='
                    line: CRYPT_DEFAULT=6
            ```
  - uid: mondoo-solaris-security-password-minimum-length-is-14-or-more
    title: Ensure the minimum password length is 14 or more
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      parse.ini("/etc/default/passwd", "=").sections[""]["PASSLENGTH"] != empty
      parse.ini("/etc/default/passwd", "=").sections[""]["PASSLENGTH"] >= 14
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/passwd-1.html
          title: "passwd - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37853/pam-authtok-check-7.html
          title: "pam_authtok_check - man pages section 7: Standards, Environments, Macros, Character Sets, and Miscellany"
      desc: |
        This check verifies that new passwords must be at least 14 characters long.

        `passwd` and the `pam_authtok_check` module reject a new password shorter than `PASSLENGTH` in `/etc/default/passwd`. The line must be present and set to 14 or more. Oracle Solaris 11.4 ships it commented out, and the built-in minimum is then 8 characters.

        **Why this matters**

        Length is the property that most raises the cost of guessing a password, online or offline from a copy of `/etc/shadow`. Every added character multiplies the number of guesses an attacker must try, and the shipped minimum of 8 characters leaves many passwords within reach of an offline attack once `/etc/shadow` has been copied. A 14-character minimum pushes users toward passphrases that are both longer and easier to remember.

        The minimum applies when a password is set, so existing shorter passwords remain valid until they change. A minimum above 8 characters requires a hashing algorithm that uses the full password, so keep `CRYPT_DEFAULT` in `/etc/security/policy.conf` on SHA-256, SHA-512, or bcrypt, because DES crypt silently ignores everything after the eighth character. Accounts with the `solaris.passwd.nocheck` authorization bypass the rule.
      audit: |
        1. Show the active `PASSLENGTH` line:

           ```bash
           grep '^PASSLENGTH=' /etc/default/passwd
           ```

        The check passes when the command prints `PASSLENGTH=` followed by 14 or more. It fails when the value is lower, and it also fails when the line is missing or commented out, even though `passwd` then applies its built-in minimum of 8.
      remediation:
        - id: cli
          desc: |
            To require passwords of at least 14 characters using the command line:

            1. Back up `/etc/default/passwd`.
            2. Set `PASSLENGTH=14`, replacing any existing active `PASSLENGTH` line or adding one if none exists. A text editor works as well as the commands below.
            3. Confirm the line. `passwd` reads the file at each password change, so no restart is needed. Force a change with `passwd -f <user>` for accounts whose current password is shorter.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/default/passwd` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_default_passwd/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `password/complexity/passlength` property to `14` with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/default/passwd /etc/default/passwd.bak
            grep -v '^PASSLENGTH=' /etc/default/passwd.bak > /etc/default/passwd.new
            echo 'PASSLENGTH=14' >> /etc/default/passwd.new
            cat /etc/default/passwd.new > /etc/default/passwd
            rm /etc/default/passwd.new
            grep '^PASSLENGTH=' /etc/default/passwd
            ```
        - id: sh
          desc: |
            To require passwords of at least 14 characters using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it replaces the active `PASSLENGTH` line, or appends one, and keeps the file's owner and mode.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/default/passwd
            KEY=PASSLENGTH
            VALUE=14

            STENCIL=$(svcprop -p config/etc_default_passwd/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set password/complexity/passlength with svccfg instead." >&2
              exit 1
            fi

            if grep "^$KEY=$VALUE\$" "$FILE" > /dev/null; then
              echo "$KEY=$VALUE is already set in $FILE."
              exit 0
            fi

            TMP=$(mktemp)
            awk -v k="$KEY" -v v="$VALUE" '
              index($0, k "=") == 1 { if (!done) print k "=" v; done = 1; next }
              { print }
              END { if (!done) print k "=" v }
            ' "$FILE" > "$TMP"
            cat "$TMP" > "$FILE"
            rm -f "$TMP"

            echo "Set $KEY=$VALUE in $FILE."
            ```
        - id: ansible
          desc: |
            To require passwords of at least 14 characters using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task replaces an active `PASSLENGTH` line, or inserts one after the shipped commented default, and leaves the file's owner and mode unchanged.

            ```yaml
            ---
            - name: Require passwords of at least 14 characters
              hosts: all
              become: true
              tasks:
                - name: Set PASSLENGTH in /etc/default/passwd
                  ansible.builtin.lineinfile:
                    path: /etc/default/passwd
                    regexp: '^PASSLENGTH='
                    line: PASSLENGTH=14
                    insertafter: '^#PASSLENGTH='
            ```
  - uid: mondoo-solaris-security-password-dictionary-check-is-enabled
    title: Ensure new passwords are checked against a dictionary
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-d-security-awareness-training-and-tools-password-management
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-6
      compliance/soc2-2017: soc2-control-cc6-1-8
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      parse.ini("/etc/default/passwd", "=").sections[""]["DICTIONLIST"] != empty
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/passwd-1.html
          title: "passwd - man pages section 1: User Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/mkpwdict-8.html
          title: "mkpwdict - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that new passwords are rejected when they are based on a dictionary word.

        `DICTIONLIST` in `/etc/default/passwd` names one or more word lists. `passwd` and the `pam_authtok_check` module merge them into a lookup database in `DICTIONDBDIR`, which defaults to `/var/passwd`, and refuse any new password found in it. `mkpwdict` builds that database ahead of time. The line must be present with at least one word list. Oracle Solaris 11.4 ships `/usr/share/lib/dict/words` but leaves `DICTIONLIST` commented out, so no dictionary check runs.

        **Why this matters**

        Password cracking starts with word lists and simple variations of them, because that is what people choose when nothing stops them. A password that satisfies the length and character class rules can still be `Password1234` or a season and year, which falls in the first minutes of an online guessing run or an offline attack on `/etc/shadow`.

        Add an organization-specific list of product names, the company name, and known breached passwords to `DICTIONLIST` alongside the system dictionary for the most benefit. The check applies when a password is set, so existing passwords are not tested.
      audit: |
        1. Show the active dictionary lines:

           ```bash
           /usr/xpg4/bin/grep -E '^DICTION(LIST|DBDIR)=' /etc/default/passwd
           ```

        2. Confirm the dictionary database exists:

           ```bash
           ls -l /var/passwd
           ```

        The check passes when `DICTIONLIST=` is followed by at least one file. It fails when the line is missing, commented out, or empty. The database is created by `mkpwdict`, or by `passwd` at the next password change if it does not exist yet.
      remediation:
        - id: cli
          desc: |
            To enable the password dictionary check using the command line:

            1. Back up `/etc/default/passwd`.
            2. Set `DICTIONLIST=/usr/share/lib/dict/words`, replacing any existing active `DICTIONLIST` line or adding one if none exists. Append further word lists separated by commas.
            3. Build the dictionary database with `mkpwdict`, which reads `DICTIONLIST` and writes to `/var/passwd`.

            **If the account-policy service generates the file.** Oracle Solaris 11.4 can write `/etc/default/passwd` from the `svc:/system/account-policy:default` service. That is off by default, which `svcprop -p config/etc_default_passwd/disabled svc:/system/account-policy:default` confirms by printing `true`. If it prints `false`, a direct edit is overwritten, so set the `password/dictionary/word_list` property with `svccfg -s svc:/system/account-policy:default setprop` and run `svcadm refresh svc:/system/account-policy:default` instead.

            ```bash
            cp -p /etc/default/passwd /etc/default/passwd.bak
            grep -v '^DICTIONLIST=' /etc/default/passwd.bak > /etc/default/passwd.new
            echo 'DICTIONLIST=/usr/share/lib/dict/words' >> /etc/default/passwd.new
            cat /etc/default/passwd.new > /etc/default/passwd
            rm /etc/default/passwd.new
            mkpwdict
            ```
        - id: sh
          desc: |
            To enable the password dictionary check using a shell script:

            1. Run the script as root.
            2. It stops without changing anything when the account-policy service generates the file. Otherwise it sets `DICTIONLIST` when it is missing or empty, keeps the file's owner and mode, and builds the dictionary database.

            ```sh
            #!/bin/sh
            set -e

            FILE=/etc/default/passwd
            KEY=DICTIONLIST
            VALUE=/usr/share/lib/dict/words

            STENCIL=$(svcprop -p config/etc_default_passwd/disabled svc:/system/account-policy:default 2>/dev/null || true)
            if [ "$STENCIL" = "false" ]; then
              echo "svc:/system/account-policy:default generates $FILE. Set password/dictionary/word_list with svccfg instead." >&2
              exit 1
            fi

            if grep "^$KEY=." "$FILE" > /dev/null; then
              echo "$KEY is already set in $FILE."
            else
              TMP=$(mktemp)
              awk -v k="$KEY" -v v="$VALUE" '
                index($0, k "=") == 1 { if (!done) print k "=" v; done = 1; next }
                { print }
                END { if (!done) print k "=" v }
              ' "$FILE" > "$TMP"
              cat "$TMP" > "$FILE"
              rm -f "$TMP"
              echo "Set $KEY=$VALUE in $FILE."
            fi

            mkpwdict
            echo "Built the password dictionary database."
            ```
        - id: ansible
          desc: |
            To enable the password dictionary check using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The first task replaces an active `DICTIONLIST` line, or inserts one after the shipped commented default. The handler rebuilds the dictionary database whenever the list changes.

            ```yaml
            ---
            - name: Enable the password dictionary check
              hosts: all
              become: true
              tasks:
                - name: Set DICTIONLIST in /etc/default/passwd
                  ansible.builtin.lineinfile:
                    path: /etc/default/passwd
                    regexp: '^DICTIONLIST='
                    line: DICTIONLIST=/usr/share/lib/dict/words
                    insertafter: '^#DICTIONLIST='
                  notify: Build the password dictionary database

              handlers:
                - name: Build the password dictionary database
                  ansible.builtin.command: mkpwdict
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-no-accounts-have-empty-passwords
    title: Ensure no accounts have empty passwords
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    filters: command("id -u").stdout.trim == 0
    mql: |
      shadow.where(password == empty).list == empty
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/shadow-5.html
          title: "shadow - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E37839/passwd-1.html
          title: "passwd - man pages section 1: User Commands"
      desc: |
        This check verifies that every local account requires a password or cannot be used for password login at all.

        The second field of each entry in `/etc/shadow` holds the account's password hash, or a marker such as `*LK*` for a locked account or `NP` for an account that cannot log in with a password. An empty field means the account has no password at all, which is what `passwd -d` leaves behind. No entry may have an empty second field. `/etc/shadow` is readable only by root, so the check runs only in a root scan.

        **Why this matters**

        An account with no password authenticates anyone who types its name. An attacker on the console, or on any service that accepts an empty password, gets a shell as that account with no guessing at all, and from there probes for local privilege escalation.

        The shipped `PASSREQ=YES` in `/etc/default/login` stops `login` from admitting such an account, but that setting belongs to `login` alone, and other services decide for themselves. An account that runs only scheduled jobs or services should be set to no-login with `passwd -N`, which keeps its jobs running, rather than left with an empty password.
      audit: |
        1. As root, list the accounts whose password field is empty:

           ```bash
           awk -F: '$2 == "" { print $1 }' /etc/shadow
           ```

        The check passes when the command prints nothing. Any account it prints has an empty password and fails the check.
      remediation:
        - id: cli
          desc: |
            To remove empty passwords using the command line:

            1. As root, list the accounts with an empty password field.
            2. For each account a person uses, set a password with `passwd`, replacing `<user>` with the account.
            3. For each account that only runs jobs or services, mark it no-login with `passwd -N`. Use `passwd -l` instead to lock an account that is no longer needed; a locked account's cron and at jobs stop running.

            ```bash
            awk -F: '$2 == "" { print $1 }' /etc/shadow
            passwd <user>
            passwd -N <user>
            ```
        - id: sh
          desc: |
            To remove empty passwords using a shell script:

            1. Run the script as root.
            2. It marks every account with an empty password field as no-login with `passwd -N`, which closes the gap without locking the account or stopping its scheduled jobs. Set a real password afterward with `passwd` for any account a person needs to log in with.

            ```sh
            #!/bin/sh
            set -e

            EMPTY=$(awk -F: '$2 == "" { print $1 }' /etc/shadow)

            if [ -z "$EMPTY" ]; then
              echo "No accounts have an empty password."
              exit 0
            fi

            for account in $EMPTY; do
              passwd -N "$account"
              echo "Set $account to no-login."
            done
            ```
        - id: ansible
          desc: |
            To remove empty passwords using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. It finds accounts with an empty password field and marks each one no-login with `passwd -N`. Set a real password afterward for any account a person needs to log in with.

            ```yaml
            ---
            - name: Remove empty passwords
              hosts: all
              become: true
              tasks:
                - name: Find accounts with an empty password field
                  ansible.builtin.command: "awk -F: '$2 == \"\" { print $1 }' /etc/shadow"
                  register: empty_password_accounts
                  changed_when: false

                - name: Mark accounts with an empty password as no-login
                  ansible.builtin.command: passwd -N {{ item }}
                  loop: "{{ empty_password_accounts.stdout_lines }}"
                  changed_when: true
            ```
  - uid: mondoo-solaris-security-root-is-the-only-uid-0-account
    title: Ensure root is the only UID 0 account
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-i-access-control-unique-user-identification
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-2
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      users.where( uid == 0 ).all( name == "root" )
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/passwd-5.html
          title: "passwd - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/usermod-8.html
          title: "usermod - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that no account other than root holds superuser identity.

        The kernel grants full privilege to UID 0, whatever the account is called. Every entry in `/etc/passwd` with `0` in its third field is the superuser under another name. Only the `root` entry may have UID 0. Oracle Solaris 11.4 ships no other UID 0 account.

        **Why this matters**

        A second UID 0 account is a classic persistence mechanism. An attacker who briefly gains root adds an innocuous-looking entry with UID 0 and a password they know, and keeps full control after the original hole is closed. Because the account is not named root, it escapes reviews that look for root logins, it is not bound by root being a role, and it is not covered by the `CONSOLE` restriction, which applies to the name root.

        A shared UID 0 also removes accountability. Audit records and file ownership show UID 0, so actions taken through the second account cannot be told apart from root's. Administrators who need superuser rights should assume the root role or be granted rights profiles through RBAC instead.
      audit: |
        1. List every account with UID 0:

           ```bash
           awk -F: '$3 == 0 { print $1 }' /etc/passwd
           ```

        The check passes when the command prints only `root`. Any other name is a second superuser account and fails the check.
      remediation:
        - id: cli
          desc: |
            To remove extra UID 0 accounts using the command line:

            1. List every account with UID 0.
            2. Find out who created each extra account and why before changing it, because it may be an attacker's backdoor and the host may need investigation.
            3. Delete an account that has no legitimate purpose with `userdel`, or give one that is needed a unique, unprivileged UID with `usermod -u`, replacing `<name>` and `<new-uid>`. Grant it the rights it really needs through an RBAC rights profile instead of UID 0.

            ```bash
            awk -F: '$3 == 0 { print $1 }' /etc/passwd
            userdel <name>
            usermod -u <new-uid> <name>
            ```
        - id: sh
          desc: |
            To detect extra UID 0 accounts using a shell script:

            1. Run the script as root.
            2. It reports every account other than root that has UID 0 and exits with an error. It does not delete or renumber them, because that requires deciding whether each one is legitimate. Apply the CLI steps to each reported account.

            ```sh
            #!/bin/sh
            set -e

            EXTRA=$(awk -F: '$3 == 0 && $1 != "root" { print $1 }' /etc/passwd)

            if [ -n "$EXTRA" ]; then
              echo "Accounts other than root with UID 0:" >&2
              echo "$EXTRA" >&2
              exit 1
            fi

            echo "Only root has UID 0."
            ```
        - id: ansible
          desc: |
            To detect extra UID 0 accounts using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. It fails on any host that has an account other than root with UID 0. Apply the CLI steps to each reported account.

            ```yaml
            ---
            - name: Detect extra UID 0 accounts
              hosts: all
              become: true
              tasks:
                - name: Find accounts other than root with UID 0
                  ansible.builtin.command: "awk -F: '$3 == 0 && $1 != \"root\" { print $1 }' /etc/passwd"
                  register: uid0_accounts
                  changed_when: false

                - name: Fail when an account other than root has UID 0
                  ansible.builtin.fail:
                    msg: "Accounts other than root with UID 0: {{ uid0_accounts.stdout_lines | join(', ') }}"
                  when: uid0_accounts.stdout_lines | length > 0
            ```
  - uid: mondoo-solaris-security-no-duplicate-uids-exist
    title: Ensure no duplicate UIDs exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-i-access-control-unique-user-identification
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      users.list.duplicates(uid).none(uid != 0)
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/passwd-5.html
          title: "passwd - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/usermod-8.html
          title: "usermod - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that every account has its own user ID.

        Solaris identifies a user to the kernel by the numeric UID in the third field of `/etc/passwd`, not by the name. Every account other than root must have a UID that no other account shares. UID 0 is assessed separately by the check that root is the only UID 0 account.

        **Why this matters**

        Two accounts with the same UID are the same user to the kernel. Each can read, change, and delete the other's files, signal its processes, and use its cron jobs, regardless of the names on the accounts. An attacker who controls one account effectively controls the other.

        The audit trail is ambiguous too. Solaris audit records, `ls -l`, and process listings resolve the UID to whichever name comes first in `/etc/passwd`, so an investigator cannot tell which person acted. Duplicates usually come from manual edits to `/etc/passwd` or from `useradd -o`, which allows a non-unique UID on purpose.
      audit: |
        1. List the UIDs other than 0 that more than one account uses:

           ```bash
           awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d
           ```

        The check passes when the command prints nothing. Any UID it prints is shared by more than one account and fails the check.
      remediation:
        - id: cli
          desc: |
            To give every account a unique UID using the command line:

            1. List the duplicated UIDs, then the accounts that share each one, replacing `<uid>` with a reported UID.
            2. Choose which account keeps the UID, and assign the other a new, unused UID with `usermod -u`, replacing `<name>` and `<new-uid>`. Without `-o`, `usermod` refuses a UID that is already taken.
            3. Re-own that account's files. Changing a UID does not change files it already owns, so limit the change to the renumbered account's own directories, such as its home directory at `<home>`.

            **Do not re-own every file on the system that has the old UID.** The other account keeps that UID, and a system-wide `find / -user <uid>` cannot tell its files apart from those of the renumbered account.

            ```bash
            awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d
            awk -F: -v u=<uid> '$3 == u { print $1 }' /etc/passwd
            usermod -u <new-uid> <name>
            find <home> -user <uid> -exec chown -h <new-uid> {} +
            ```
        - id: sh
          desc: |
            To detect duplicate UIDs using a shell script:

            1. Run the script as root.
            2. It reports each duplicated UID with the accounts that share it and exits with an error. It does not renumber accounts, because choosing which one to change and re-owning its files must be done deliberately. Apply the CLI steps to each reported UID.

            ```sh
            #!/bin/sh
            set -e

            DUPES=$(awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "Duplicate UIDs found:" >&2
              for uid in $DUPES; do
                echo "  UID $uid: $(awk -F: -v u="$uid" '$3 == u { print $1 }' /etc/passwd | tr '\n' ' ')" >&2
              done
              exit 1
            fi

            echo "No duplicate UIDs found."
            ```
        - id: ansible
          desc: |
            To detect duplicate UIDs using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. It fails on any host where accounts other than root share a UID. Apply the CLI steps to each reported UID.

            ```yaml
            ---
            - name: Detect duplicate UIDs
              hosts: all
              become: true
              tasks:
                - name: Find UIDs shared by more than one account
                  ansible.builtin.shell: "set -o pipefail; awk -F: '$3 != 0 { print $3 }' /etc/passwd | sort -n | uniq -d"
                  register: duplicate_uids
                  changed_when: false

                - name: Fail when duplicate UIDs exist
                  ansible.builtin.fail:
                    msg: "Duplicate UIDs found: {{ duplicate_uids.stdout_lines | join(', ') }}"
                  when: duplicate_uids.stdout_lines | length > 0
            ```
  - uid: mondoo-solaris-security-no-duplicate-gids-exist
    title: Ensure no duplicate GIDs exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      groups.list.duplicates(gid).none()
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/group-5.html
          title: "group - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/grpck-8.html
          title: "grpck - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that every group has its own group ID.

        Solaris identifies a group to the kernel by the numeric GID in the third field of `/etc/group`, not by the name. No two entries may share a GID.

        **Why this matters**

        Group permissions on files and directories are stored as a GID. When two groups share one, every member of either group gets the group access granted to the other. A user added to a low-privilege group gains the access intended for a sensitive group, such as one that reads application secrets or audit logs, without anyone granting it.

        Listings and audit records resolve the GID to whichever name comes first in `/etc/group`, so a reviewer checking who can reach a file sees one group name and misses the members of the other. Duplicates usually come from manual edits or from `groupadd -o`, which allows a non-unique GID on purpose.
      audit: |
        1. List the GIDs that more than one group uses:

           ```bash
           awk -F: '{ print $3 }' /etc/group | sort -n | uniq -d
           ```

        The check passes when the command prints nothing. Any GID it prints is shared by more than one group and fails the check.
      remediation:
        - id: cli
          desc: |
            To give every group a unique GID using the command line:

            1. List the duplicated GIDs, then the groups that share each one, replacing `<gid>` with a reported GID.
            2. Choose which group keeps the GID, and assign the other a new, unused GID with `groupmod -g`, replacing `<group>` and `<new-gid>`.
            3. Re-group the files that belong to the renumbered group, limited to directories that group owns, such as `<directory>`. Users whose primary GID in `/etc/passwd` was the old GID stay in the group that kept it; move those who belong to the renumbered group with `usermod -g`.

            **Do not re-group every file on the system that has the old GID.** The other group keeps that GID, and a system-wide `find / -group <gid>` cannot tell its files apart from those of the renumbered group.

            ```bash
            awk -F: '{ print $3 }' /etc/group | sort -n | uniq -d
            awk -F: -v g=<gid> '$3 == g { print $1 }' /etc/group
            groupmod -g <new-gid> <group>
            find <directory> -group <gid> -exec chgrp -h <new-gid> {} +
            ```
        - id: sh
          desc: |
            To detect duplicate GIDs using a shell script:

            1. Run the script as root.
            2. It reports each duplicated GID with the groups that share it and exits with an error. It does not renumber groups, because choosing which one to change and re-grouping its files must be done deliberately. Apply the CLI steps to each reported GID.

            ```sh
            #!/bin/sh
            set -e

            DUPES=$(awk -F: '{ print $3 }' /etc/group | sort -n | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "Duplicate GIDs found:" >&2
              for gid in $DUPES; do
                echo "  GID $gid: $(awk -F: -v g="$gid" '$3 == g { print $1 }' /etc/group | tr '\n' ' ')" >&2
              done
              exit 1
            fi

            echo "No duplicate GIDs found."
            ```
        - id: ansible
          desc: |
            To detect duplicate GIDs using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. It fails on any host where groups share a GID. Apply the CLI steps to each reported GID.

            ```yaml
            ---
            - name: Detect duplicate GIDs
              hosts: all
              become: true
              tasks:
                - name: Find GIDs shared by more than one group
                  ansible.builtin.shell: "set -o pipefail; awk -F: '{ print $3 }' /etc/group | sort -n | uniq -d"
                  register: duplicate_gids
                  changed_when: false

                - name: Fail when duplicate GIDs exist
                  ansible.builtin.fail:
                    msg: "Duplicate GIDs found: {{ duplicate_gids.stdout_lines | join(', ') }}"
                  when: duplicate_gids.stdout_lines | length > 0
            ```
  - uid: mondoo-solaris-security-no-duplicate-user-names-exist
    title: Ensure no duplicate user names exist
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-i-access-control-unique-user-identification
      compliance/iso-27001-2022: iso-27001-2022-a-5-16
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-8-2-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      users.list.duplicates(name).none()
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/passwd-5.html
          title: "passwd - man pages section 5: File Formats"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/pwck-8.html
          title: "pwck - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that every login name in `/etc/passwd` appears only once.

        Each entry in `/etc/passwd` starts with the login name, and the matching entry in `/etc/shadow` carries its password. No two entries may share a name.

        **Why this matters**

        Name lookups return the first matching entry, so with two entries for one name, `login`, `su`, and the account tools act on the first one while the second stays in the file with its own UID, home directory, and shell. Whoever controls the second entry, or later swaps the order of the lines, changes which identity that name logs in as, and an administrator reviewing `/etc/passwd` by name sees the account they expect.

        Duplicate names also break the link to `/etc/shadow` and `user_attr`, which are keyed by name, so a password, lock state, or RBAC assignment can end up applying to a different UID than intended. Duplicates come from manual edits or from merging files from another host.
      audit: |
        1. List the login names that appear more than once:

           ```bash
           awk -F: '{ print $1 }' /etc/passwd | sort | uniq -d
           ```

        The check passes when the command prints nothing. Any name it prints appears more than once and fails the check.
      remediation:
        - id: cli
          desc: |
            To remove duplicate user names using the command line:

            1. List the duplicated names, then show every entry for each one, replacing `<name>` with a reported name.
            2. Compare the UID, home directory, and shell of the entries so the account that owns the files, cron jobs, and RBAC assignments keeps the name.
            3. Back up `/etc/passwd` and `/etc/shadow`, then edit both files and delete the entry that should not exist, or rename it to a unique name in both files.
            4. Run `pwck` to confirm the files are still well formed, then run the first command again and confirm it prints nothing.

            ```bash
            awk -F: '{ print $1 }' /etc/passwd | sort | uniq -d
            grep '^<name>:' /etc/passwd
            cp -p /etc/passwd /etc/passwd.bak
            cp -p /etc/shadow /etc/shadow.bak
            pwck
            ```
        - id: sh
          desc: |
            To detect duplicate user names using a shell script:

            1. Run the script as root.
            2. It reports each duplicated name and exits with an error. It does not edit the account files, because choosing which entry to keep is a human decision. Apply the CLI steps to each reported name.

            ```sh
            #!/bin/sh
            set -e

            DUPES=$(awk -F: '{ print $1 }' /etc/passwd | sort | uniq -d)

            if [ -n "$DUPES" ]; then
              echo "Duplicate user names found:" >&2
              echo "$DUPES" >&2
              exit 1
            fi

            echo "No duplicate user names found."
            ```
        - id: ansible
          desc: |
            To detect duplicate user names using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. It fails on any host where a login name appears more than once. Apply the CLI steps to each reported name.

            ```yaml
            ---
            - name: Detect duplicate user names
              hosts: all
              become: true
              tasks:
                - name: Find login names that appear more than once
                  ansible.builtin.shell: "set -o pipefail; awk -F: '{ print $1 }' /etc/passwd | sort | uniq -d"
                  register: duplicate_users
                  changed_when: false

                - name: Fail when duplicate user names exist
                  ansible.builtin.fail:
                    msg: "Duplicate user names found: {{ duplicate_users.stdout_lines | join(', ') }}"
                  when: duplicate_users.stdout_lines | length > 0
            ```
  - uid: mondoo-solaris-security-no-duplicate-group-names-exist
