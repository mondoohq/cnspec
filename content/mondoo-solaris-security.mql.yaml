    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/in.rlogind-8.html
          title: "in.rlogind - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/in.rshd-8.html
          title: "in.rshd - man pages section 8: System Administration Commands"
        - url: https://docs.oracle.com/cd/E88353_01/html/E72487/in.rexecd-8.html
          title: "in.rexecd - man pages section 8: System Administration Commands"
      desc: |
        This check verifies that the Berkeley remote access servers rlogin, rsh, and rexec are not enabled.

        These services are started by `inetd` and managed by SMF: `in.rlogind` as `svc:/network/login:rlogin`, `in.rshd` as `svc:/network/shell:default`, and `in.rexecd` as `svc:/network/rexec:default`. The Kerberos variants `svc:/network/login:klogin`, `svc:/network/login:eklogin`, and `svc:/network/shell:kshell` are included. Every one of these instances must be disabled, or not installed.

        **Why this matters**

        rlogin and rsh authenticate by trust rather than by password. The server believes the user name the client claims as long as the connection comes from a privileged source port on a host listed in `/etc/hosts.equiv` or the target user's `~/.rhosts`. An attacker who controls any trusted host, or who can spoof its address, runs commands as any user that trusts it, with no password at all. A single writable `.rhosts` file containing `+ +` opens an account to every host on the network.

        rexec does ask for a password, and sends it across the network in cleartext together with the command and its output. None of these protocols encrypts the session, so anything typed or displayed can be read and altered in transit.

        The Kerberos variants replace host trust with tickets but remain legacy protocols that SSH supersedes. SSH covers interactive login, remote command execution, and file copy, so there is no case where these servers should run next to it.
