      desc: |
        This check verifies that the SSH server closes sessions whose client has stopped responding.

        When no data has arrived from a client for `ClientAliveInterval` seconds, `sshd` sends a message through the encrypted channel that the client must answer. After `ClientAliveCountMax` unanswered messages it disconnects the client and ends the session. The check requires `ClientAliveInterval` from 1 to 300 and `ClientAliveCountMax` from 1 to 3, so a dead client is dropped within 15 minutes. The OpenSSH default interval is 0, which turns the mechanism off, and the Solaris stencil writes both directives only when the SMF properties `config/ClientAliveInterval` and `config/ClientAliveCountMax` are set.

        **Why this matters**

        A session whose client vanished, because a laptop went to sleep, a VPN dropped, or a terminal window was closed, otherwise stays open on the server. Its shell keeps any role or `su` privilege assumed in it, its forwarded ports keep listening, and it stays open until TCP keepalive gives up hours later. Closing it quickly leaves nothing behind for another user or process on the host to take over.

        These settings do not log out a user who is idle at a working client, because the client answers the messages automatically. For that, set `TMOUT` for the login shells in `/etc/profile`.
