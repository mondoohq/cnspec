                    regexp: '(?i)^\s*{{ item.key }}\s'
                    line: "{{ item.key }} {{ item.file_value }}"
                    insertbefore: BOF
                    firstmatch: true
                    validate: /usr/lib/ssh/sshd -t -f %s
                  loop: "{{ sshd_settings }}"
                  when: sshd_stencil.stdout != 'false'
                  notify: Refresh the SSH service

              handlers:
