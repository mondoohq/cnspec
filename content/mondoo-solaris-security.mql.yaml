              set_smf IgnoreRhosts boolean true
              if [ "$changed" -eq 1 ]; then
                svcadm refresh "$FMRI"
              fi
              echo "SSH IgnoreRhosts set to yes."
              exit 0
            fi

            WORK=$(mktemp /tmp/sshd_config.XXXXXX)
            NEXT=$(mktemp /tmp/sshd_config.XXXXXX)
            trap 'rm -f "$WORK" "$NEXT"' EXIT
            cp "$SSHD_CONFIG" "$WORK"

            # Print the directive as the first line and drop any other line for the
            # same keyword before the first Match line. OpenSSH uses the first value
            # it reads, and a line after a Match line applies only to that block.
            set_file() {
              nawk -v line="$1" '
                BEGIN { split(line, d, " "); key = tolower(d[1]); print line; global = 1 }
                { split($1, f, "="); kw = tolower(f[1]) }
                kw == "match" { global = 0 }
                global && kw == key { next }
                { print }
              ' "$WORK" > "$NEXT"
              cat "$NEXT" > "$WORK"
            }

            set_file "IgnoreRhosts yes"

