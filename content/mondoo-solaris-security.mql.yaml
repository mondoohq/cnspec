      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      file("/etc/shadow") {
        user.name == "root"
        permissions.user_executable == false
        permissions.group_readable == false
        permissions.group_writeable == false
        permissions.group_executable == false
        permissions.other_readable == false
        permissions.other_writeable == false
        permissions.other_executable == false
      }
    docs:
      refs:
        - url: https://docs.oracle.com/cd/E88353_01/html/E37852/shadow-5.html
          title: "shadow - man pages section 5: File Formats"
      desc: |
        This check verifies that only root can read or modify the password hashes of local accounts.

        `/etc/shadow` holds the password hash, lock state, and password aging data of every local account. It must be owned by root with no access for its group or other users and no execute bit, which mode `0400` satisfies. Oracle Solaris 11.4 ships it as `root:root` with mode `0400`, and the account tools and PAM modules read it with root privilege. The group owner is not assessed.

        **Why this matters**

        An attacker who can read `/etc/shadow` copies every password hash and cracks them offline, where no lockout or logging applies, at the full speed of their own hardware. Each recovered password works for that account and often for the same person's accounts on other systems.

        Write access is worse. An attacker who can write the file replaces root's or an administrator's hash with one of their own choosing, or clears a lock, and then logs in or assumes the role.
      audit: |
        1. Show the owner and mode:

           ```bash
           ls -l /etc/shadow
           ```

        The check passes when the owner is `root` and the mode is `-r--------` or `-rw-------`. It fails when the owner is another account, when group or others have any access, or when any execute bit is set.
      remediation:
        - id: cli
          desc: |
            To restrict `/etc/shadow` using the command line:

            1. Set the owner to root.
            2. Set the mode to `0400`, the mode Oracle Solaris ships.
            3. Confirm the result.

            ```bash
            chown root /etc/shadow
            chmod 0400 /etc/shadow
            ls -l /etc/shadow
            ```
        - id: sh
          desc: |
            To restrict `/etc/shadow` using a shell script:

            1. Run the script as root. Setting the same owner and mode again is harmless, so it can run repeatedly.

            ```sh
            #!/bin/sh
            set -e

            chown root /etc/shadow
            chmod 0400 /etc/shadow

            echo "Set owner root and mode 0400 on /etc/shadow."
            ```
        - id: ansible
          desc: |
            To restrict `/etc/shadow` using Ansible:

            1. Run the playbook against the Solaris hosts.
            2. The task sets the owner and mode and leaves the group owner unchanged.

            ```yaml
            ---
            - name: Restrict /etc/shadow
              hosts: all
              become: true
              tasks:
                - name: Set owner and mode on /etc/shadow
                  ansible.builtin.file:
                    path: /etc/shadow
                    owner: root
                    mode: '0400'
            ```
