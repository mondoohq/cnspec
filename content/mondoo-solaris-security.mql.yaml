            ---
            - name: Make SSH ignore per-user rhosts files
              hosts: all
              become: true

              vars:
                sshd_settings:
                  - key: IgnoreRhosts
                    type: boolean
                    smf_value: 'true'
                    file_value: 'yes'

              tasks:
                - name: Check whether SMF generates sshd_config
                  ansible.builtin.command: svcprop -p sshd_stencil/disabled svc:/network/ssh:default
                  register: sshd_stencil
                  changed_when: false
                  failed_when: false

