    docs:
      desc: |
        This check verifies that no STACKIT security group allows RDP from the entire internet.

        The check reads every ingress rule whose port range covers 3389 and requires that none of them uses the source `0.0.0.0/0` or `::/0`.

        **Why this matters**

        An exposed RDP port is the most reliable initial access vector in ransomware operations. Access brokers scan for it continuously, guess or buy credentials, and sell working access to groups who deploy the payload, which is why RDP appears at the start of so many incident timelines.

        The protocol makes this worse than the equivalent SSH exposure in two ways. RDP hands the attacker a full interactive desktop session rather than a shell, and Windows accounts are more often password-authenticated than key-authenticated, so guessing is a viable strategy rather than a futile one.

        RDP has also carried pre-authentication remote code execution vulnerabilities, notably the wormable class that prompted out-of-band patches for end-of-life Windows versions. A port exposed to the internet is exposed to those before any credential is involved.

        Restrict the source to specific administrative ranges, and prefer reaching Windows servers through a VPN or a bastion. Where RDP must be exposed, require network level authentication so that credentials are checked before a session is created.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Network** and select **Security Groups**.
        3. Review the ingress rules of each security group and look for any rule whose port range covers TCP port 3389 with a source of `0.0.0.0/0` or `::/0`.

        A passing project has no security group admitting RDP from the open internet. A failing project has at least one such rule.

        ### Audit via CLI

        1. List the security groups in the project:

        ```bash
        stackit security-group list --output-format json
        ```

        2. For each security group, list its rules:

        ```bash
        stackit security-group rule list --security-group-id <security-group-id> --output-format json
        ```

        A failing rule has `direction` set to `ingress`, a port range that includes 3389, and an IP range of `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the offending security group rule and restrict the RDP source CIDR to a bastion host or VPN range instead of `0.0.0.0/0`.
        - id: terraform
          desc: |
            Define the RDP ingress rule with a restricted `ip_range` (a bastion or admin CIDR) instead of `0.0.0.0/0` on the `stackit_security_group_rule` resource:

            ```hcl
            resource "stackit_security_group_rule" "rdp_restricted" {
              project_id        = var.project_id
              security_group_id = var.security_group_id
              direction         = "ingress"
              ether_type        = "IPv4"
              ip_range          = "10.0.0.0/8" # restrict to a bastion/admin range, not 0.0.0.0/0
              protocol = {
                name = "tcp"
              }
              port_range = {
                min = 3389
                max = 3389
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/network/network-security/
        title: STACKIT Documentation - Security Groups
  - uid: mondoo-stackit-security-network-no-public-rdp-stackit-project
    filters: asset.platform == "stackit-project"
