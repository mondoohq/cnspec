  - uid: mondoo-stackit-security-network-no-unrestricted-ingress
    title: Ensure no security group exposes all ports to the internet
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-network-no-unrestricted-ingress-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-network-no-unrestricted-ingress-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-network-no-unrestricted-ingress-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-network-no-unrestricted-ingress-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no STACKIT security group opens the entire port range to the entire internet.

        The check reads ingress rules sourced from `0.0.0.0/0` or `::/0` and fails any rule whose port range spans the whole space, from 1 or lower through 65535 or higher, including rules that leave the range unset.

        **Why this matters**

        An allow-all rule is not a firewall configuration, it is the absence of one. Every service on every attached instance becomes reachable from anywhere, including the ones nobody knows are listening.

        That last part is what makes this severe rather than merely broad. Instances run more listeners than their owners realize: management agents, metrics endpoints, orchestration daemons, database default ports, and services bound to all interfaces during development. An allow-all rule exposes all of them at once, and the inventory of what it exposed changes every time software is installed.

        Rules like this are usually temporary by intention. They are added to unblock a connectivity problem under time pressure, with the plan to narrow them later, and they survive because nothing breaks when they stay.

        Replace with rules that name the ports the workload actually serves and the sources it serves them to. If the rule exists because the required scope is unknown, find out by observing traffic rather than by permitting everything, since an allow-all rule guarantees the answer will never be needed.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Network** and select **Security Groups**.
        3. Review the ingress rules of each security group and look for any rule that combines a source of `0.0.0.0/0` or `::/0` with the full port range.

        A passing project scopes every world-open ingress rule to specific ports. A failing project has a rule that opens every port to the internet, which exposes all listening services on the attached servers.

        ### Audit via CLI

        1. List the security groups in the project:

        ```bash
        stackit security-group list --output-format json
        ```

        2. For each security group, list its rules:

        ```bash
        stackit security-group rule list --security-group-id <security-group-id> --output-format json
        ```

        A failing rule has `direction` set to `ingress`, an IP range of `0.0.0.0/0` or `::/0`, and either an unset port range or one spanning 1 to 65535.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, replace the broad rule with specific rules that open only the required ports to the smallest necessary source CIDRs.
        - id: terraform
          desc: |
            Replace any all-ports world-open rule with `stackit_security_group_rule` resources that scope each rule to a specific `port_range` and a restricted `ip_range`:

            ```hcl
            resource "stackit_security_group_rule" "https_restricted" {
              project_id        = var.project_id
              security_group_id = var.security_group_id
              direction         = "ingress"
              ether_type        = "IPv4"
              ip_range          = "10.0.0.0/8" # restrict to the smallest necessary CIDR, not 0.0.0.0/0
              protocol = {
                name = "tcp"
              }
              port_range = {
                min = 443 # open only the required port(s), not the full range
                max = 443
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/network/network-security/
        title: STACKIT Documentation - Security Groups
  - uid: mondoo-stackit-security-network-no-unrestricted-ingress-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.securityGroups.all(rules.where(direction == "ingress").where(ipRange == "0.0.0.0/0" || ipRange == "::/0").where(portRangeMin == null || portRangeMin <= 1).none(portRangeMax == null || portRangeMax >= 65535))
