  - uid: mondoo-stackit-security-network-alb-target-security-groups
    title: Ensure STACKIT application load balancers assign target security groups
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-network-alb-target-security-groups-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-network-alb-target-security-groups-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-network-alb-target-security-groups-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-network-alb-target-security-groups-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT application load balancers assign security groups to their targets.

        Target security group assignment is what lets the load balancer's own group be referenced in the rules protecting the instances behind it. The check reads each load balancer and requires that the assignment is not disabled.

        **Why this matters**

        The point of putting instances behind a load balancer is that the load balancer becomes the only thing that reaches them. That requires the backend instances to accept traffic from the load balancer specifically, which requires the load balancer to have an identity the backend rules can name.

        With the assignment disabled, that identity is missing, and the rules have to fall back on something else. In practice the something else is a broad CIDR range, or the whole internet, because whoever is writing the rule needs the health checks and forwarded requests to arrive and has no precise source to permit.

        The result is backend instances reachable directly, bypassing the load balancer entirely. Everything the load balancer was placed there to do, terminating TLS, distributing load, applying request handling, is optional for an attacker who can address the instances themselves.

        Leave the assignment enabled, then write backend ingress rules that reference the load balancer's security group rather than an address range. That way the path stays enforced as instances are added and removed.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Application Load Balancer** and select the load balancer.
        3. Confirm that automatic target security group assignment is still enabled.

        A passing load balancer leaves the assignment enabled, so its targets stay behind the managed security group. A failing load balancer has it disabled.

        ### Audit via CLI

        1. List the application load balancers in the project:

        ```bash
        stackit beta alb list --output-format json
        ```

        2. Describe each load balancer and inspect its target security group setting:

        ```bash
        stackit beta alb describe <load-balancer-name> --output-format json
        ```

        A passing load balancer reports target security group assignment as not disabled. A failing load balancer reports it as disabled.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the application load balancer and re-enable target security group assignment, or manually ensure the targets are protected by an equivalent security group.
        - id: terraform
          desc: |
            Keep automatic target security group assignment enabled by setting `disable_target_security_group_assignment = false` (the secure value) on the `stackit_application_load_balancer` resource:

            ```hcl
            resource "stackit_application_load_balancer" "example" {
              project_id = var.project_id
              region     = "eu01"
              name       = "example-alb"
              plan_id    = "p10"

              listeners = [{
                name     = "https"
                port     = 443
                protocol = "PROTOCOL_HTTPS"
                http = {
                  hosts = [{
                    host = "*"
                    rules = [{
                      target_pool = "example-target-pool"
                    }]
                  }]
                }
                https = {
                  certificate_config = {
                    certificate_ids = [var.certificate_id]
                  }
                }
              }]

              networks = [{
                network_id = var.network_id
                role       = "ROLE_LISTENERS_AND_TARGETS"
              }]

              target_pools = [{
                name        = "example-target-pool"
                target_port = 8443
                targets = [{
                  ip = var.target_ip
                }]
              }]

              options = {
                ephemeral_address = true
              }

              disable_target_security_group_assignment = false
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/network/load-balancing-and-content-delivery/application-load-balancer/
        title: STACKIT Documentation - Application Load Balancer
  - uid: mondoo-stackit-security-network-alb-target-security-groups-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.albLoadBalancers.all(disableTargetSecurityGroupAssignment == false)
  - uid: mondoo-stackit-security-network-alb-target-security-groups-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_application_load_balancer")
    mql: |
      terraform.resources("stackit_application_load_balancer").all(
        arguments["disable_target_security_group_assignment"] != true
      )
  - uid: mondoo-stackit-security-network-alb-target-security-groups-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_application_load_balancer")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_application_load_balancer").all(
        change.after["disable_target_security_group_assignment"] != true
      )
  - uid: mondoo-stackit-security-network-alb-target-security-groups-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_application_load_balancer")
    mql: |
      terraform.state.resources.where(type == "stackit_application_load_balancer").all(
        values["disable_target_security_group_assignment"] != true
      )
  # ----------------------------- STACKIT Object Storage -----------------------------
  - uid: mondoo-stackit-security-objectstorage-bucket-object-lock
    title: Ensure STACKIT Object Storage buckets have Object Lock enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-16
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-5-33
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-stackit-object-storage-bucket
        tags:
          mondoo.com/filter-title: STACKIT Object Storage Bucket
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT Object Storage buckets have Object Lock enabled.

        Object Lock applies write-once-read-many semantics: an object under a retention period cannot be overwritten or deleted until that period expires, and the platform enforces this regardless of the caller's permissions. It can only be enabled when the bucket is created. The check reads each bucket's Object Lock state.

        **Why this matters**

        Backups protect against losing data. Object Lock protects against someone deleting the backups, which is a different problem and the one that decides whether a ransomware incident is recoverable.

        Modern ransomware operations target backups first and deliberately. The playbook is to obtain credentials with storage permissions, enumerate the buckets, destroy or encrypt the backup copies, and only then encrypt production, because an organization that can restore does not pay. Ordinary access controls do not stop this, since the attacker is using legitimate permissions.

        Object Lock breaks that sequence by moving enforcement below the permission layer. An object under retention cannot be deleted by an administrator, by the account that created it, or by anyone holding any credential, because the storage platform itself refuses.

        The constraint is that Object Lock is a create-time property. Turning it on for an existing bucket is not possible; the bucket must be recreated and its contents migrated. Plan retention periods carefully as well, since data under retention cannot be removed early even when you want it gone.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Object Storage** and select the bucket.
        3. Confirm Object Lock is enabled on the bucket.

        A passing bucket has Object Lock enabled, so its objects are protected against overwrite and deletion. A failing bucket has it disabled. Object Lock can only be set when a bucket is created, so a failing bucket cannot be corrected in place.

        ### Audit via CLI

        1. List the buckets in the project:

        ```bash
        stackit object-storage bucket list --output-format json
        ```

        2. Describe each bucket and inspect its Object Lock state:

        ```bash
        stackit object-storage bucket describe <bucket-name> --output-format json
        ```

        A passing bucket reports Object Lock as enabled. A failing bucket reports it as disabled.
      remediation:
        - id: console
          desc: |
            Object Lock is set when a bucket is created. For an existing bucket without Object Lock, create a new bucket with Object Lock enabled and migrate the objects.
        - id: terraform
          desc: |
            Create the bucket with `object_lock = true` on the `stackit_objectstorage_bucket` resource. Object Lock can only be set at creation, so migrate objects from any non-locked bucket:

            ```hcl
            resource "stackit_objectstorage_bucket" "example" {
              project_id  = var.project_id
              name        = "secure-bucket"
              object_lock = true
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/storage/object-storage/
        title: STACKIT Documentation - Object Storage
  - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-stackit-object-storage-bucket
    filters: asset.platform == "stackit-object-storage-bucket"
    mql: |
      stackit.objectStorage.bucket.objectLockEnabled == true
  - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_objectstorage_bucket")
    mql: |
      terraform.resources("stackit_objectstorage_bucket").all(arguments["object_lock"] == true)
  - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_objectstorage_bucket").all(
        change.after["object_lock"] == true
      )
  - uid: mondoo-stackit-security-objectstorage-bucket-object-lock-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_objectstorage_bucket")
    mql: |
      terraform.state.resources.where(type == "stackit_objectstorage_bucket").all(
        values["object_lock"] == true
      )
