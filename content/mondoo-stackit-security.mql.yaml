  - uid: mondoo-stackit-security-db-sqlserver-backups
    title: Ensure SQLServer Flex instances have a backup schedule configured
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-13
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ip-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-stackit-security-db-sqlserver-backups-stackit-sqlserver-flex-instance
        tags:
          mondoo.com/filter-title: STACKIT SQLServer Flex Instance
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-db-sqlserver-backups-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-db-sqlserver-backups-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-db-sqlserver-backups-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT SQLServer Flex instances have a backup schedule configured.

        The backup schedule determines when the platform takes automated backups of the instance. The check reads that schedule and requires it to be set.

        **Why this matters**

        SQL Server instances typically hold the transactional record a business operates on: orders, payments, inventory, and customer data. Losing it is not a technical inconvenience but a business interruption, and in regulated contexts a compliance failure, since financial and personal records usually carry a statutory retention obligation that no amount of replication satisfies.

        The failures that require a backup are the ones replication cannot help with. A deployment that runs the wrong migration, an application defect writing bad rows, a deletion executed against production instead of staging, and ransomware reaching the instance through a compromised application server all produce valid writes that every replica receives.

        Recovery also depends on how far back the restore point goes. A corruption introduced during a release and discovered after the weekend needs a restore point from before the release, so retention has to be measured against how long problems take to surface rather than against how long backups feel worth keeping.

        Configure the schedule, then verify a restore actually completes and the data is usable. The first restore attempt should not happen during an incident.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **SQLServer Flex** and select the instance.
        3. Confirm a backup schedule is configured for the instance.

        A passing instance has a backup schedule set, giving it restore points to recover from. A failing instance has none.

        ### Audit via CLI

        1. Describe the instance and inspect its backup schedule:

        ```bash
        stackit beta sqlserverflex instance describe <instance-id> --output-format json
        ```

        A passing instance reports a cron backup schedule. A failing instance reports an empty one.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, configure a backup schedule for the SQLServer Flex instance with a frequency and retention that meet your recovery objectives.
        - id: terraform
          desc: |
            Set a cron `backup_schedule` on the `stackit_sqlserverflex_instance` resource so automated backups run on a defined cadence:

            ```hcl
            resource "stackit_sqlserverflex_instance" "example" {
              project_id      = var.project_id
              name            = "example-instance"
              acl             = ["10.0.0.0/8"]
              backup_schedule = "00 02 * * *" # daily at 02:00
              flavor = {
                cpu = 4
                ram = 16
              }
              storage = {
                class = "premium-perf2-stackit"
                size  = 5
              }
              version = 2022
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/databases/sqlserver-flex/
        title: STACKIT Documentation - SQLServer Flex
  - uid: mondoo-stackit-security-db-sqlserver-backups-stackit-sqlserver-flex-instance
    filters: asset.platform == "stackit-sqlserver-flex-instance"
    mql: |
      stackit.sqlServerFlex.instance.backupSchedule != ""
  # backup_schedule is optional on stackit_sqlserverflex_instance, unlike its required PostgreSQL
  # and MongoDB Flex counterparts, and the provider plans "0 0 * * *" when the argument is absent.
  # An omitted schedule is therefore a daily backup, not a missing one, so these variants compare
  # against "" rather than empty: null is the provider default and passes, and only an explicitly
  # blank schedule leaves the instance without one.
  - uid: mondoo-stackit-security-db-sqlserver-backups-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_sqlserverflex_instance")
    mql: |
      terraform.resources("stackit_sqlserverflex_instance").all(arguments["backup_schedule"] != "")
  - uid: mondoo-stackit-security-db-sqlserver-backups-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_sqlserverflex_instance")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_sqlserverflex_instance").all(
        change.after["backup_schedule"] != ""
      )
  - uid: mondoo-stackit-security-db-sqlserver-backups-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_sqlserverflex_instance")
    mql: |
      terraform.state.resources.where(type == "stackit_sqlserverflex_instance").all(
        values["backup_schedule"] != ""
      )
  - uid: mondoo-stackit-security-db-postgres-high-availability
    title: Ensure PostgreSQL Flex instances run with multiple replicas
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-11
      compliance/dora: dora-art-12
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-14
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-pt-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-36
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-stackit-security-db-postgres-high-availability-stackit-postgres-flex-instance
        tags:
          mondoo.com/filter-title: STACKIT PostgreSQL Flex Instance
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-db-postgres-high-availability-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-db-postgres-high-availability-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-db-postgres-high-availability-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT PostgreSQL Flex instances run with more than one replica.

        Replica count determines whether the instance is a single node or a group that can survive losing one. The check reads the configured replica count and requires at least two.

        **Why this matters**

        A single-node database is a single point of failure for every application behind it. When that node is lost or restarted, everything depending on it stops, and the outage lasts as long as recovery takes rather than as long as a failover takes.

        The routine cases matter more than the dramatic ones. Host maintenance, patching, and version upgrades all require the node to go away for a period, and on a single-node instance each of those is a planned outage that has to be scheduled, communicated, and absorbed. That is also why they get deferred, which is how database instances end up running old versions.

        Availability is a security property here, not only an operational one. A database that cannot be patched without an outage is a database that stays unpatched, and a service that cannot fail over is one an attacker can take down by disrupting a single node.

        Understand what this does not cover. Replicas protect against a node being lost; they replicate deletion and corruption faithfully to every member. Run multiple replicas and a backup schedule, since each answers a failure the other does not.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **PostgreSQL Flex** and select the instance.
        3. Review the instance's replica count.

        A passing instance runs two or more replicas, so it survives the loss of a node without an outage. A failing instance runs a single replica and has no automatic failover. A single replica can be a deliberate choice for development workloads, so weigh a failure against the role the instance plays.

        ### Audit via CLI

        1. Describe the instance and inspect its replica count:

        ```bash
        stackit postgresflex instance describe <instance-id> --output-format json
        ```

        A passing instance reports two or more replicas. A failing instance reports one.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, scale the PostgreSQL Flex instance to two or more replicas for production workloads.
        - id: terraform
          desc: |
            Set `replicas` to at least 2 on the `stackit_postgresflex_instance` resource, using 3 for a replicated, highly available setup. The provider deprecates `replicas` and removes it after February 2027, so plan the move to `flavor_id` with a flavor that already carries the replica count you need. The `stackit_postgresflex_flavors` data source lists the available flavors.

            ```hcl
            resource "stackit_postgresflex_instance" "example" {
              project_id      = var.project_id
              name            = "example-instance"
              acl             = ["10.0.0.0/8"]
              backup_schedule = "00 02 * * *"
              replicas        = 3 # >= 2 for high availability
              flavor = {
                cpu = 2
                ram = 4
              }
              storage = {
                class = "premium-perf2-stackit"
                size  = 5
              }
              version = 14
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/databases/postgresql-flex/
        title: STACKIT Documentation - PostgreSQL Flex
  - uid: mondoo-stackit-security-db-postgres-high-availability-stackit-postgres-flex-instance
    filters: asset.platform == "stackit-postgres-flex-instance"
    mql: |
      stackit.postgresFlex.instance.replicas >= 2
  - uid: mondoo-stackit-security-db-postgres-high-availability-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_postgresflex_instance")
    mql: |
      terraform.resources("stackit_postgresflex_instance").all(arguments["replicas"] >= 2)
  - uid: mondoo-stackit-security-db-postgres-high-availability-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_postgresflex_instance")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_postgresflex_instance").all(
        change.after["replicas"] >= 2
      )
  - uid: mondoo-stackit-security-db-postgres-high-availability-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_postgresflex_instance")
    mql: |
      terraform.state.resources.where(type == "stackit_postgresflex_instance").all(
        values["replicas"] >= 2
      )
