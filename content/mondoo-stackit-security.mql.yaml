          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT Kubernetes Engine clusters have Kubernetes version auto-update enabled.

        Auto-update lets the platform move the cluster to a newer supported Kubernetes version during its maintenance window. The check reads the cluster's maintenance configuration and requires the Kubernetes version auto-update flag to be enabled.

        **Why this matters**

        Kubernetes releases roughly three times a year and supports each version for about a year, which means a cluster that is not updating is on a fixed path toward running unsupported software. Once past support, it stops receiving security fixes entirely.

        Manual upgrades are the theoretical alternative and rarely the practical one. Each upgrade needs planning, a window, and someone confident enough to run it in production, and the longer it is deferred the more versions have to be crossed at once, which makes the next attempt more daunting than the last. Clusters commonly fall years behind by exactly this mechanism.

        The vulnerabilities left behind are not minor. Kubernetes has shipped fixes for container escapes, privilege escalation through the API server, and flaws in the components handling untrusted workload input, and each fix reaches a cluster only through a version upgrade.

        Enable auto-update and set a maintenance window when a disruption is tolerable. Pair it with workloads that survive node replacement, using pod disruption budgets and multiple replicas, so that a routine upgrade does not become an outage.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Kubernetes Engine (SKE)** and select the cluster.
        3. Open its maintenance settings and confirm automatic Kubernetes version updates are enabled.

        A passing cluster has automatic Kubernetes version updates enabled, so security fixes land during its maintenance window. A failing cluster has them disabled and will drift onto unsupported versions.

        ### Audit via CLI

        1. Describe the cluster and inspect its maintenance configuration:

        ```bash
        stackit ske cluster describe <cluster-name> --output-format json
        ```

        A passing cluster reports automatic Kubernetes version updates as enabled under its maintenance settings. A failing cluster reports them as disabled or absent.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the SKE cluster maintenance settings and enable automatic Kubernetes version updates, choosing an appropriate maintenance time window.
        - id: terraform
          desc: |
            Enable automatic Kubernetes version updates by setting `maintenance.enable_kubernetes_version_updates = true` on the `stackit_ske_cluster` resource:

            ```hcl
            resource "stackit_ske_cluster" "example" {
              project_id = var.project_id
              name       = "example"

              node_pools = [{
                name               = "example-pool"
                machine_type       = "c1.2"
                minimum            = 2
                maximum            = 3
                availability_zones = ["eu01-1"]
              }]

              maintenance = {
                enable_kubernetes_version_updates = true
                start                             = "01:00:00Z"
                end                               = "03:00:00Z"
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/runtime/kubernetes-engine/
        title: STACKIT Documentation - Kubernetes Engine (SKE)
  - uid: mondoo-stackit-security-ske-cluster-auto-update-stackit-ske-cluster
    filters: asset.platform == "stackit-ske-cluster"
    mql: |
      stackit.ske.cluster.maintenance['autoUpdate']['kubernetesVersion'] == true
  - uid: mondoo-stackit-security-ske-cluster-auto-update-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_ske_cluster")
    mql: |
      terraform.resources("stackit_ske_cluster").all(
        arguments["maintenance"]["enable_kubernetes_version_updates"] == true
      )
  - uid: mondoo-stackit-security-ske-cluster-auto-update-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_ske_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_ske_cluster").all(
        change.after["maintenance"]["enable_kubernetes_version_updates"] == true
      )
  - uid: mondoo-stackit-security-ske-cluster-auto-update-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_ske_cluster")
    mql: |
      terraform.state.resources.where(type == "stackit_ske_cluster").all(
        values["maintenance"]["enable_kubernetes_version_updates"] == true
      )
  - uid: mondoo-stackit-security-ske-apiserver-acl-enabled
    title: Ensure STACKIT SKE clusters restrict Kubernetes API server access
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-stackit-ske-cluster
        tags:
          mondoo.com/filter-title: STACKIT Kubernetes Cluster
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT Kubernetes Engine clusters restrict access to their Kubernetes API server.

        The check passes a cluster whose control plane access scope is set to the STACKIT network access mode, and otherwise requires that the API server ACL is enabled and that its allowed CIDR list contains neither `0.0.0.0/0` nor `::/0`.

        **Why this matters**

        The Kubernetes API server is the control plane for everything in the cluster. Anyone who can reach it and authenticate can schedule workloads, read every secret the cluster holds, and modify the objects that define how the cluster behaves.

        A publicly reachable API server puts that interface in front of continuous automated scanning. Authentication becomes the only barrier, and the credentials protecting it are more varied than they look: service account tokens mounted into pods, kubeconfig files on developer laptops, and tokens issued to CI systems all authenticate here, and any one of them leaking becomes remotely usable.

        Restricting network access changes the shape of the attack. An attacker who obtains a credential must also reach the API server from a permitted network, which means compromising something inside the environment first rather than proceeding directly from a leaked token.

        Restrict access to the networks administrators and CI systems connect from, or use the platform's private access mode where the cluster's own network reaches the control plane. Combine this with RBAC rather than relying on either alone.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Kubernetes Engine (SKE)** and select the cluster.
        3. Review the control-plane access scope. If the scope is `SNA`, the API server is private and no further review is needed. If the scope is `PUBLIC`, open the cluster's API-server ACL settings and confirm the ACL is enabled and its allowed ranges exclude `0.0.0.0/0` and `::/0`.

        A passing cluster either runs a private control plane or publishes one behind an enabled ACL whose allowed ranges exclude the open internet. A failing cluster publishes its API server with the ACL disabled, or with an allow-list that admits any address.

        ### Audit via CLI

        1. Describe the cluster and inspect its control-plane access scope and API-server ACL:

        ```bash
        stackit ske cluster describe <cluster-name> --output-format json
        ```

        A failing cluster reports a public control-plane access scope together with an ACL that is disabled or that lists `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, open the SKE cluster settings and enable the API-server ACL, then add the CIDR ranges that should be allowed to reach the Kubernetes API.
        - id: terraform
          desc: |
            Enable the API-server ACL and restrict it to known networks via the `extensions.acl` block on the `stackit_ske_cluster` resource:

            ```hcl
            resource "stackit_ske_cluster" "example" {
              project_id = var.project_id
              name       = "example"

              node_pools = [{
                name               = "example-pool"
                machine_type       = "c1.2"
                minimum            = 2
                maximum            = 3
                availability_zones = ["eu01-1"]
              }]

              extensions = {
                acl = {
                  enabled       = true
                  allowed_cidrs = ["10.0.0.0/8"] # restrict to your admin/VPN networks
                }
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/runtime/kubernetes-engine/
        title: STACKIT Documentation - Kubernetes Engine (SKE)
  - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-stackit-ske-cluster
    filters: asset.platform == "stackit-ske-cluster"
    mql: |
      stackit.ske.cluster.controlPlaneAccessScope == "SNA" ||
      stackit.ske.cluster.apiServerAclEnabled == true &&
      stackit.ske.cluster.apiServerAclAllowedCidrs.none(_ == "0.0.0.0/0" || _ == "::/0")
  - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_ske_cluster")
    mql: |
      terraform.resources("stackit_ske_cluster").all(
        arguments["network"]["control_plane"]["access_scope"] == "SNA" ||
        arguments["extensions"]["acl"]["enabled"] == true &&
        arguments["extensions"]["acl"]["allowed_cidrs"] != empty &&
        arguments["extensions"]["acl"]["allowed_cidrs"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_ske_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_ske_cluster").all(
        change.after["network"]["control_plane"]["access_scope"] == "SNA" ||
        change.after["extensions"]["acl"]["enabled"] == true &&
        change.after["extensions"]["acl"]["allowed_cidrs"] != empty &&
        change.after["extensions"]["acl"]["allowed_cidrs"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-ske-apiserver-acl-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_ske_cluster")
    mql: |
      terraform.state.resources.where(type == "stackit_ske_cluster").all(
        values["network"]["control_plane"]["access_scope"] == "SNA" ||
        values["extensions"]["acl"]["enabled"] == true &&
        values["extensions"]["acl"]["allowed_cidrs"] != empty &&
        values["extensions"]["acl"]["allowed_cidrs"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-ske-apiserver-acl-restricted
    title: Ensure STACKIT SKE API server ACL is not open to the internet
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-stackit-ske-cluster
        tags:
          mondoo.com/filter-title: STACKIT Kubernetes Cluster
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the STACKIT Kubernetes Engine API server allow-list does not include the entire internet.

        The check reads the cluster's allowed CIDR list and requires that it contains neither `0.0.0.0/0` nor `::/0`.

        **Why this matters**

        An allow-list containing `0.0.0.0/0` is an allow-list that permits everything, and it is worth treating separately from having no ACL at all because it looks like a control while functioning as its absence. A configuration review sees an ACL configured, an audit records access restrictions in place, and the API server is reachable from anywhere.

        That gap between appearance and effect is how these entries survive. They are added to resolve a connectivity problem, most often a CI system or an administrator whose source address was not known at the time, and once traffic flows nobody revisits the entry that made it flow.

        The exposure is the full weight of the Kubernetes control plane: workload scheduling, secret access, and cluster configuration, protected by credentials alone.

        Replace the entry with the specific ranges that need access. Where a source address is dynamic, route it through a fixed egress point such as a NAT gateway or a bastion rather than widening the list, and review the entries when the systems that needed them change.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Kubernetes Engine (SKE)** and select the cluster.
        3. Review the API-server ACL and confirm its allowed ranges do not include `0.0.0.0/0` or `::/0`.

        A passing cluster lists only specific administrative or VPN ranges. A failing cluster carries a world-open entry, which leaves the ACL configured in appearance while admitting every host on the internet.

        ### Audit via CLI

        1. Describe the cluster and inspect the allowed ranges of its API-server ACL:

        ```bash
        stackit ske cluster describe <cluster-name> --output-format json
        ```

        A failing cluster lists `0.0.0.0/0` or `::/0` among its allowed ranges.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the SKE cluster's API-server ACL and replace any `0.0.0.0/0` or `::/0` entry with the specific administrative or VPN CIDRs that require access.
        - id: terraform
          desc: |
            Set `extensions.acl.allowed_cidrs` on the `stackit_ske_cluster` resource to specific networks, excluding `0.0.0.0/0` and `::/0`:

            ```hcl
            resource "stackit_ske_cluster" "example" {
              project_id = var.project_id
              name       = "example"

              node_pools = [{
                name               = "example-pool"
                machine_type       = "c1.2"
                minimum            = 2
                maximum            = 3
                availability_zones = ["eu01-1"]
              }]

              extensions = {
                acl = {
                  enabled       = true
                  allowed_cidrs = ["10.0.0.0/8", "192.168.0.0/16"] # not 0.0.0.0/0
                }
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/runtime/kubernetes-engine/
        title: STACKIT Documentation - Kubernetes Engine (SKE)
  - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-stackit-ske-cluster
    filters: asset.platform == "stackit-ske-cluster"
    mql: |
      stackit.ske.cluster.apiServerAclAllowedCidrs.none(_ == "0.0.0.0/0" || _ == "::/0")
  - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_ske_cluster")
    mql: |
      terraform.resources("stackit_ske_cluster").where(
        arguments["extensions"]["acl"]["allowed_cidrs"] != empty
      ).all(
        arguments["extensions"]["acl"]["allowed_cidrs"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_ske_cluster")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_ske_cluster").where(
        change.after["extensions"]["acl"]["allowed_cidrs"] != empty
      ).all(
        change.after["extensions"]["acl"]["allowed_cidrs"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-ske-apiserver-acl-restricted-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_ske_cluster")
    mql: |
      terraform.state.resources.where(type == "stackit_ske_cluster").where(
        values["extensions"]["acl"]["allowed_cidrs"] != empty
      ).all(
        values["extensions"]["acl"]["allowed_cidrs"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  # ----------------------------- STACKIT Telemetry -----------------------------
  - uid: mondoo-stackit-security-telemetry-token-expiry-set
    title: Ensure STACKIT telemetry router access tokens have an expiry
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-stackit-security-telemetry-token-expiry-set-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-telemetry-token-expiry-set-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-telemetry-token-expiry-set-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-telemetry-token-expiry-set-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT telemetry router access tokens have an expiry set.

        The check reads every access token on every telemetry router and requires each to carry an expiry time rather than being open-ended.

        **Why this matters**

        Telemetry tokens authenticate the flow of observability data, and they are among the most widely distributed credentials in an environment. Every host, container, and application that ships metrics or logs holds one, which means the token is present in configuration management, container images, deployment manifests, and the environment of every running workload.

        That distribution is what makes an unbounded lifetime costly. A credential in that many places will eventually appear somewhere it should not, and without an expiry every one of those copies stays valid indefinitely.

        What a leaked token permits is worth being specific about. Write access to a telemetry pipeline allows an attacker to inject false data, which can hide activity by burying it or trigger a response by fabricating an incident. Where the token also reads, it exposes the operational picture of the environment: what runs, where, and how it behaves.

        Set an expiry and automate renewal through the same configuration management that distributes the token. A credential deployed automatically to many places can be rotated automatically to the same places, which is what makes a short lifetime practical.
      audit: |
        1. Sign in to the STACKIT Portal.
        2. Open **Telemetry Router** and select the router.
        3. Review its access tokens and confirm each one carries an expiry time.

        A passing router has an expiry on every access token. A failing router has a token that never expires, so a leak of that token stays usable until someone revokes it by hand.

        The STACKIT CLI has no telemetry router commands, so review the tokens in the STACKIT Portal.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, reissue telemetry router access tokens with a bounded validity period and remove any non-expiring tokens.
        - id: terraform
          desc: |
            Issue tokens with a bounded lifetime by setting `ttl` (in days) on the `stackit_telemetryrouter_access_token` resource:

            ```hcl
            resource "stackit_telemetryrouter_access_token" "example" {
              project_id   = var.project_id
              instance_id  = var.instance_id
              region       = "eu01"
              display_name = "example-access-token"
              ttl          = 30
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/logging-and-monitoring/telemetry-router/
        title: STACKIT Documentation - Telemetry Router
  - uid: mondoo-stackit-security-telemetry-token-expiry-set-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.telemetry.routers.all(accessTokens.all(expiresAt != null))
  - uid: mondoo-stackit-security-telemetry-token-expiry-set-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_telemetryrouter_access_token")
    mql: |
      terraform.resources("stackit_telemetryrouter_access_token").all(arguments["ttl"] != null)
  - uid: mondoo-stackit-security-telemetry-token-expiry-set-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_telemetryrouter_access_token")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_telemetryrouter_access_token").all(
        change.after["ttl"] != null
      )
  - uid: mondoo-stackit-security-telemetry-token-expiry-set-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_telemetryrouter_access_token")
    mql: |
      terraform.state.resources.where(type == "stackit_telemetryrouter_access_token").all(
        values["ttl"] != null
      )
  # No Terraform variant: whether a token has passed its expiry is a function of the current time, not
  # of the configuration. The Terraform surface is the ttl argument, which the expiry check covers.
  - uid: mondoo-stackit-security-telemetry-token-not-expired
    title: Ensure STACKIT telemetry router access tokens are not expired
    impact: 60
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: false
    mql: |
      stackit.telemetry.routers.all(accessTokens.all(expiresAt == null || expiresAt > time.now))
    docs:
      desc: |
        This check verifies that no STACKIT telemetry router access token has already passed its expiry date.

        The check reads every access token on every telemetry router and requires that any expiry present is in the future. Tokens with no expiry pass this check and are assessed by a companion check in this policy.

        **Why this matters**

        An expired token is a broken telemetry pipeline, and the specific danger is that nothing announces it. The systems shipping data continue to run, the agents keep attempting to send, and the dashboards keep displaying, showing older data or an absence that looks like quiet rather than failure.

        Absence of data is the hardest failure to notice, because it looks exactly like nothing happening. Alerts that depend on a threshold being crossed cannot fire when no data arrives to cross it, so the monitoring reports healthy precisely because it is blind.

        The consequences land during an incident. Investigating an event that occurred while the pipeline was down means working without the observability the environment was built to provide, and the gap is discovered at the moment it cannot be fixed retroactively.

        Remove or replace expired tokens rather than leaving them in place, and alert on approaching expiry rather than on expiry itself. A token that lapses at the wrong moment costs visibility exactly when it is most needed.
      audit: |
        1. Sign in to the STACKIT Portal.
        2. Open **Telemetry Router** and select the router.
        3. Review its access tokens and compare each expiry time against the current date.

        A passing router carries no token whose expiry has already passed. A failing router still holds an expired token, which clutters the credential list and can mask the active tokens during a review.

        The STACKIT CLI has no telemetry router commands, so review the tokens in the STACKIT Portal.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, delete expired telemetry router access tokens and reissue new ones where access is still required.
        # No Terraform remediation: whether a token is expired is a runtime, time-based state; keeping tokens non-expired means rotating them (recreating with a fresh ttl), an operational action rather than a configurable attribute.
    refs:
      - url: https://docs.stackit.cloud/products/logging-and-monitoring/telemetry-router/
        title: STACKIT Documentation - Telemetry Router
  # ----------------------------- STACKIT Model Serving -----------------------------
  - uid: mondoo-stackit-security-modelserving-token-expiry-set
    title: Ensure STACKIT Model Serving tokens have a bounded validity
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm06
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-stackit-security-modelserving-token-expiry-set-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-modelserving-token-expiry-set-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-modelserving-token-expiry-set-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-modelserving-token-expiry-set-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT Model Serving tokens have a validity end date set.

        The check reads every Model Serving token and requires each to carry a validity end date rather than being open-ended.

        **Why this matters**

        Model Serving tokens authenticate inference requests, and the exposure they carry is different from most API credentials in two ways.

        The first is cost. Inference is billed by use, and a leaked token is a directly monetizable one: it can be used, resold, or run continuously by whoever holds it, and the bill arrives before anyone notices the traffic. Unlike a leaked read credential, this one has an immediate market.

        The second is what passes through the endpoint. Inference requests carry the prompts an application sends, which routinely include customer data, internal documents, and business context. A token permitting requests may also permit an attacker to observe or influence what the model is asked and what it returns, which reaches into the application's behavior rather than only its data.

        These tokens also proliferate. They end up in application configuration, notebooks, test scripts, and developer environments, and each of those is a place a credential outlives the reason it was created.

        Set the shortest validity the consuming applications can accommodate, and automate renewal so that a short lifetime does not become an outage.
      audit: |
        1. Sign in to the STACKIT Portal.
        2. Open **Model Serving** and review the project's authentication tokens.
        3. Confirm each token carries a validity end date.

        A passing project has a validity end date on every Model Serving token. A failing project has a token that never expires, so a leak of that token grants inference access until someone revokes it by hand.

        The STACKIT CLI has no Model Serving commands, so review the tokens in the STACKIT Portal.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, reissue Model Serving tokens with a bounded validity period and remove any non-expiring tokens.
        - id: terraform
          desc: |
            Issue tokens with a bounded lifetime by setting `ttl_duration` on the `stackit_modelserving_token` resource (accepts Go-style durations such as `24h`, `5h30m`):

            ```hcl
            resource "stackit_modelserving_token" "example" {
              project_id   = var.project_id
              name         = "example-token"
              ttl_duration = "24h"
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/data-and-ai/ai-model-serving/
        title: STACKIT Documentation - Model Serving
  - uid: mondoo-stackit-security-modelserving-token-expiry-set-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.modelServing.tokens.all(validUntil != null)
  - uid: mondoo-stackit-security-modelserving-token-expiry-set-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_modelserving_token")
    mql: |
      terraform.resources("stackit_modelserving_token").all(arguments["ttl_duration"] != empty)
  - uid: mondoo-stackit-security-modelserving-token-expiry-set-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_modelserving_token")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_modelserving_token").all(
        change.after["ttl_duration"] != empty
      )
  - uid: mondoo-stackit-security-modelserving-token-expiry-set-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_modelserving_token")
    mql: |
      terraform.state.resources.where(type == "stackit_modelserving_token").all(
        values["ttl_duration"] != empty
      )
  # No Terraform variant: valid_until is reported by the AI Model Serving API after the token is issued.
  # The Terraform surface is the ttl_duration argument, which the expiry check covers.
  - uid: mondoo-stackit-security-modelserving-token-not-expired
    title: Ensure STACKIT Model Serving tokens are not expired
    impact: 60
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-llm-top-10-2025: owasp-llm-top-10-2025-llm06
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: false
    mql: |
      stackit.modelServing.tokens.all(validUntil == null || validUntil > time.now)
    docs:
      desc: |
        This check verifies that no STACKIT Model Serving token has already passed its validity end date.

        The check reads every Model Serving token and requires that any validity end date present is in the future. Tokens with no end date pass this check and are assessed by a companion check in this policy.

        **Why this matters**

        An expired token that is still present is a credential nobody is managing. It has already stopped working, so whatever created it either replaced it and left the old one behind, or stopped using it entirely and never said so.

        The cost is to review rather than to access. Anyone auditing which credentials exist and which applications hold them has to work through entries that no longer do anything, and the presence of unmanaged entries makes it likelier that a live token is misjudged as stale, or that a stale one is assumed live and left in place.

        Expired tokens also record something worth acting on. Each one marks an integration that lapsed, and the question of whether that integration was decommissioned deliberately or silently broke is usually worth an answer.

        Delete expired tokens as part of routine credential review, and alert before expiry rather than after. The goal is that the token list describes the integrations that actually exist, so that a credential appearing in it that nobody recognizes is a signal rather than noise.
      audit: |
        1. Sign in to the STACKIT Portal.
        2. Open **Model Serving** and review the project's authentication tokens.
        3. Compare each token's validity end date against the current date.

        A passing project carries no token whose validity has already lapsed. A failing project still holds an expired token, which clutters the credential list and can obscure the active tokens during a review.

        The STACKIT CLI has no Model Serving commands, so review the tokens in the STACKIT Portal.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, delete expired Model Serving tokens and reissue new ones where access is still required.
        # No Terraform remediation: whether a token is expired is a runtime, time-based state; keeping tokens non-expired means rotating them (recreating with a fresh ttl_duration), an operational action rather than a configurable attribute.
    refs:
      - url: https://docs.stackit.cloud/products/data-and-ai/ai-model-serving/
        title: STACKIT Documentation - Model Serving
  # ----------------------------- STACKIT Kubernetes (SKE) -----------------------------
  # No Terraform variant: the expiration dates for a cluster's Kubernetes version and node pool machine
  # images come from the SKE API's version catalog. The configuration names a version, and whether that
  # version has reached end of support changes without the configuration changing.
  - uid: mondoo-stackit-security-ske-not-end-of-support
    title: Ensure SKE clusters and node pools are within their support window
    impact: 80
    filters: asset.platform == "stackit-ske-cluster"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      stackit.ske.cluster.kubernetesExpirationDate == null || stackit.ske.cluster.kubernetesExpirationDate > time.now
      stackit.ske.cluster.nodePools.all(kubernetesExpirationDate == null || kubernetesExpirationDate > time.now)
      stackit.ske.cluster.nodePools.all(osExpirationDate == null || osExpirationDate > time.now)
    docs:
      desc: |
        This check verifies that STACKIT Kubernetes Engine clusters and their node pools are running Kubernetes versions that are still within their support window.

        The check reads the Kubernetes expiration date on the cluster and on each node pool, and requires that any date present is in the future. A version with no expiration date recorded passes.

        **Why this matters**

        Past the support window a Kubernetes version receives no further security fixes. Vulnerabilities discovered afterward are published with the fix for supported versions, which tells an attacker precisely what works against anything still running the old one.

        Node pools deserve their own attention and are the half more often missed. A control plane upgrade does not move the nodes, so a cluster can report a current Kubernetes version while its node pools run something older. The kubelet and container runtime on those nodes are where container escape vulnerabilities land, which makes an out-of-support node pool a more direct risk than an out-of-support control plane.

        Expiry also removes options at the worst moment. A version past support cannot always be upgraded directly to a current one, so recovery may require stepping through intermediate versions under time pressure, during an incident, on a cluster running production workloads.

        Track the expiration dates as scheduled work rather than as alerts, and enable version auto-update so the cluster advances without a decision each time.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Kubernetes Engine (SKE)** and select the cluster.
        3. Review the control-plane Kubernetes version and each node pool's Kubernetes and OS image versions, and compare them against STACKIT's version support schedule.

        A passing cluster runs a control-plane version and node images whose end-of-support dates are in the future. A failing cluster or node pool runs a version whose end-of-support date has already passed.

        ### Audit via CLI

        1. Describe the cluster and inspect its versions:

        ```bash
        stackit ske cluster describe <cluster-name> --output-format json
        ```

        Compare the reported control-plane and node-pool versions against STACKIT's published support schedule. A passing cluster reports versions still within support; a failing cluster reports a version past its end-of-support date.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, open the SKE cluster and upgrade the control plane to a supported Kubernetes version, then upgrade each node pool's Kubernetes and machine-image version to a supported release. Plan the upgrade before the end-of-support date rather than after it.
        # No Terraform remediation: the end-of-support date is runtime schedule metadata STACKIT reports per version, not a configurable attribute; staying in support means upgrading kubernetes_version and the node-pool image to a still-supported release, an operational action.
    refs:
      - url: https://docs.stackit.cloud/products/runtime/kubernetes-engine/
        title: STACKIT Documentation - Kubernetes Engine (SKE)
  # ----------------------------- STACKIT Identity & Access -----------------------------
  # No Terraform variant: stackit_service_account_federated_identity_provider declares assertions as
  # a required list and rejects one that carries no "aud" claim, so a provider without assertions is
  # not a configuration terraform will plan. The insecure state this check looks for cannot be
  # written in HCL, which is why the check stays on the API surface alone.
  - uid: mondoo-stackit-security-serviceaccount-federated-identity-scoped
    title: Ensure federated identity providers restrict tokens with assertions
    impact: 85
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      stackit.serviceAccounts.all(federatedIdentityProviders.all(assertions.length > 0))
    docs:
      desc: |
        This check verifies that STACKIT service account federated identity providers restrict which external tokens they will accept.

        Federated identity lets a workload authenticate with a token from an external issuer instead of holding a STACKIT credential. Assertions are the conditions an incoming token must satisfy before it is accepted. The check reads each federated identity provider and requires at least one assertion.

        **Why this matters**

        A federated identity provider configured without assertions trusts the issuer rather than a specific workload. Every token that issuer produces is accepted, which is far broader than intended in every realistic case.

        The CI example makes the scope concrete. Configuring a pipeline provider without assertions means any pipeline that issuer can produce a token for is authorized, which typically includes every repository in the organization, every branch, and every pull request. A contributor who opens a pull request against any of those repositories can then reach a service account intended for one deployment pipeline.

        That is exactly the position federation is supposed to improve on. It removes the long-lived stored credential, which is a real gain, and replaces it with a trust relationship that is only as narrow as its conditions.

        Constrain assertions to the specific subject the workload presents: the repository, the branch or environment, and where available the workflow. Verify the claims the issuer actually sends rather than assuming, since an assertion matching a claim that is never populated restricts nothing.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Service Accounts** and select the account.
        3. Review each federated identity provider and confirm it defines assertions (claim conditions) rather than trusting its issuer unconditionally.

        A passing service account has every federated identity provider defining at least one assertion. A failing service account has a provider with no assertions.

        ### Audit via CLI

        1. List the service accounts in the project:

        ```bash
        stackit service-account list --output-format json
        ```

        For each service account, review its federated identity providers in the STACKIT Portal or API and confirm each defines at least one assertion. A failing provider has an empty assertion list, meaning any token from its issuer is accepted.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, open the service account's federated identity providers and add assertions that pin accepted tokens to the specific subject, repository, or environment claims of the intended workload. Remove any provider that cannot be scoped to a known workload.
        - id: terraform
          desc: |
            Declare the provider's `assertions` on the `stackit_service_account_federated_identity_provider` resource, pinning the accepted audience and the subject of the intended workload:

            ```hcl
            resource "stackit_service_account_federated_identity_provider" "github" {
              project_id            = var.project_id
              service_account_email = var.service_account_email
              name                  = "github-actions"
              issuer                = "https://token.actions.githubusercontent.com"

              assertions = [
                {
                  item     = "aud"
                  operator = "equals"
                  value    = "https://token.actions.githubusercontent.com"
                },
                {
                  item     = "sub"
                  operator = "equals"
                  value    = "repo:example-org/example-repo:ref:refs/heads/main"
                },
              ]
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/iam/service-accounts/
        title: STACKIT Documentation - Service Accounts
  # ----------------------------- STACKIT Key Management -----------------------------
  # No Terraform variant: key versions are created by the KMS rotation API and stackit_kms_key declares
  # neither the versions nor a rotation interval, so the age of the active version has no HCL surface.
  - uid: mondoo-stackit-security-kms-key-recently-rotated
    title: Ensure KMS keys have an active version rotated within the last year
    impact: 50
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      stackit.kms.keys.all(versions.where(state == "active" && disabled == false).length == 0 || versions.where(state == "active" && disabled == false).any(createdAt > time.now - 365 * time.day))
    docs:
      desc: |
        This check verifies that every STACKIT KMS key has been rotated within the last year.

        Rotation creates a new key version and leaves earlier versions in place so existing ciphertext can still be decrypted, which means the age of the newest usable version is what shows whether rotation is still happening. The check requires at least one enabled, active version created within the past 365 days. A key with no enabled active versions passes, since there is no current version to age.

        **Why this matters**

        Rotation limits how much data is protected by any single piece of key material. A key version used for years accumulates ciphertext, so a compromise of that version exposes everything encrypted since it was created. Rotating on a schedule caps that quantity.

        It also bounds recovery time. When key material is suspected of exposure, retiring it means re-encrypting everything bound to it, and the volume of that work is a direct function of how long the version was in use. A key rotated annually presents a year of data; one never rotated presents all of it.

        Rotation is additionally a test that the process works. Organizations discover that an application hardcoded a key version, or that an integration cannot handle a new one, during a rotation rather than during an incident, and finding out on a planned schedule is considerably better.

        Enable automatic rotation where the platform supports it. Manual rotation is the kind of task that slips, and this check exists because it does.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Key Management Service** and select the key.
        3. Review the key's versions and confirm the newest enabled, active version was created within the last year.

        A passing key has an enabled, active version created less than a year ago. A failing key's most recent active version is older than a year, or it has no enabled active version at all.

        ### Audit via CLI

        1. List the key rings in the project:

        ```bash
        stackit kms keyring list --output-format json
        ```

        2. For each key ring, list its keys and inspect their versions:

        ```bash
        stackit kms key list --keyring-id <keyring-id> --output-format json
        ```

        For each key, confirm the newest active version's creation date is within the last year. A failing key's most recent active version is older than one year.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, open the key under **Key Management Service** and rotate it to create a fresh key version. Establish a rotation schedule so a new version is created at least once a year, and keep the older versions enabled only as long as they are needed to decrypt existing data.
        # No Terraform remediation: key-version age is runtime state produced by rotation over time; keeping a recent version means performing or scheduling a rotation, an operational action rather than a configurable attribute on the key resource.
    refs:
      - url: https://docs.stackit.cloud/products/security/key-management-service/
        title: STACKIT Documentation - Key Management Service
