    variants:
      - uid: mondoo-stackit-security-objectstorage-bucket-retention-stackit-object-storage-bucket
        tags:
          mondoo.com/filter-title: STACKIT Object Storage Bucket
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-objectstorage-bucket-retention-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-objectstorage-bucket-retention-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-objectstorage-bucket-retention-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT Object Storage buckets with Object Lock enabled also define a default retention period.

        The check passes a bucket that does not have Object Lock enabled, and for buckets that do, requires a default retention of at least one day.

        **Why this matters**

        Object Lock without a default retention period is a feature that is switched on and does nothing. Retention is applied per object, so unless the application setting each object explicitly requests a retention period, objects land in the bucket unprotected and deletable.

        That gap is invisible from the outside. The bucket reports Object Lock as enabled, a configuration review records it as enabled, and a compliance questionnaire is answered honestly in the affirmative, while every object in it can be deleted by anyone with permission to do so. The protection is discovered to be absent at the moment it is needed.

        A default retention closes it by applying automatically to every object written, so protection does not depend on each writer remembering to ask for it. Backup tools, log shippers, and archive jobs written without knowledge of Object Lock then get the protection anyway.

        Choose the period against the actual recovery requirement. Objects cannot be deleted before it expires, including by you, so a period set far longer than needed converts a storage bill into an obligation.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Object Storage** and select the bucket.
        3. For a bucket with Object Lock enabled, review its default retention settings and confirm a retention period of at least one day is configured.

        A passing bucket either has Object Lock disabled, in which case default retention does not apply, or has Object Lock enabled together with a default retention period greater than zero. A failing bucket has Object Lock enabled but no default retention, so new objects are only protected when retention is set on each object individually.

        ### Audit via CLI

        1. Identify which buckets have Object Lock enabled:

        ```bash
        stackit object-storage bucket describe <bucket-name> --output-format json
        ```

        The CLI reports whether Object Lock is enabled but exposes no command for the bucket's default retention, so confirm the retention period for each Object-Locked bucket in the STACKIT Portal.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, configure a default retention period (in days) and mode for the Object-Locked bucket so new objects inherit WORM protection.
        - id: terraform
          desc: |
            Declare a `stackit_objectstorage_default_retention` resource for the Object-Locked bucket, setting `days` to the retention window new objects should inherit and `mode` to the retention mode that matches the protection the data requires:

            ```hcl
            resource "stackit_objectstorage_compliance_lock" "example" {
              project_id = var.project_id
            }

            resource "stackit_objectstorage_bucket" "example" {
              depends_on  = [stackit_objectstorage_compliance_lock.example]
              project_id  = var.project_id
              name        = "secure-bucket"
              object_lock = true
            }

            resource "stackit_objectstorage_default_retention" "example" {
              project_id  = var.project_id
              bucket_name = stackit_objectstorage_bucket.example.name
              days        = 30
              mode        = "GOVERNANCE"
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/storage/object-storage/
        title: STACKIT Documentation - Object Storage
  - uid: mondoo-stackit-security-objectstorage-bucket-retention-stackit-object-storage-bucket
    filters: asset.platform == "stackit-object-storage-bucket"
    mql: |
      stackit.objectStorage.bucket.objectLockEnabled == false || stackit.objectStorage.bucket.defaultRetentionDays > 0
  - uid: mondoo-stackit-security-objectstorage-bucket-retention-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_objectstorage_bucket")
    mql: |
      terraform.resources("stackit_objectstorage_bucket").none(arguments["object_lock"] == true) ||
      terraform.resources("stackit_objectstorage_default_retention").any(arguments["days"] > 0)
  - uid: mondoo-stackit-security-objectstorage-bucket-retention-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_objectstorage_bucket")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_objectstorage_bucket").none(
        change.after["object_lock"] == true
      ) ||
      terraform.plan.resourceChanges.where(type == "stackit_objectstorage_default_retention").any(
        change.after["days"] > 0
      )
  - uid: mondoo-stackit-security-objectstorage-bucket-retention-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_objectstorage_bucket")
    mql: |
      terraform.state.resources.where(type == "stackit_objectstorage_bucket").none(
        values["object_lock"] == true
      ) ||
      terraform.state.resources.where(type == "stackit_objectstorage_default_retention").any(
        values["days"] > 0
      )
  # ----------------------------- STACKIT File Storage -----------------------------
  - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl
    title: Ensure STACKIT SFS resource pools restrict their mount IP allow-list
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT SFS resource pools do not allow mounts from the entire internet.

        The IP allow-list on a resource pool controls which addresses may mount the file systems it holds. The check reads that list and requires that it contains neither `0.0.0.0/0` nor `::/0`.

        **Why this matters**

        Shared file storage is reached over NFS, and NFS decides who you are by trusting the user and group IDs the client sends. There is no authentication in the protocol beyond a check that the connection came from a permitted address, which makes the allow-list the entire access control mechanism rather than one layer of it.

        An allow-list containing `0.0.0.0/0` therefore removes access control altogether. Anyone who can reach the service can mount the file system and present whatever identity they choose, so file permissions inside the share are set by the attacker rather than enforced against them.

        What sits on shared file storage makes this worse. Resource pools typically hold the data several systems need at once: application state, uploads, shared configuration, and frequently the backups of other systems.

        Restrict the list to the specific subnets where the clients that mount these file systems run. This is one of the few controls where the allow-list is not defense in depth but the only defense, so it deserves review whenever the client footprint changes.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **File Storage** and select the resource pool.
        3. Review the pool's IP allow-list and confirm it does not contain `0.0.0.0/0` or `::/0`.

        A passing resource pool lists only the specific subnets that must mount its shares. A failing resource pool admits the entire internet, so any host that can reach the endpoint can mount the shares it holds.

        ### Audit via CLI

        1. List the resource pools in the project and inspect their allow-lists:

        ```bash
        stackit beta sfs resource-pool list --output-format json
        ```

        A failing resource pool has `0.0.0.0/0` or `::/0` in its IP allow-list.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the SFS resource pool and restrict the IP allow-list to the specific subnets or hosts that must mount its shares.
        - id: terraform
          desc: |
            Set `ip_acl` on the `stackit_sfs_resource_pool` resource to the specific subnets that must mount the pool's shares, excluding `0.0.0.0/0` and `::/0`:

            ```hcl
            resource "stackit_sfs_resource_pool" "example" {
              project_id        = var.project_id
              name              = "secure-resourcepool"
              availability_zone = "eu01-m"
              performance_class = "Standard"
              size_gigabytes    = 512
              ip_acl = [
                "10.0.0.0/8",
                "192.168.100.0/24",
              ]
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/storage/file-storage/
        title: STACKIT Documentation - File Storage (SFS)
  - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.sfs.resourcePools.all(ipAcl.none(_ == "0.0.0.0/0" || _ == "::/0"))
  - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_sfs_resource_pool")
    mql: |
      terraform.resources("stackit_sfs_resource_pool").all(
        arguments["ip_acl"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_sfs_resource_pool")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_sfs_resource_pool").all(
        change.after["ip_acl"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_sfs_resource_pool")
    mql: |
      terraform.state.resources.where(type == "stackit_sfs_resource_pool").all(
        values["ip_acl"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-sfs-export-policy-restricted
    title: Ensure STACKIT SFS export policies do not allow world-open NFS access
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-sfs-export-policy-restricted-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-sfs-export-policy-restricted-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-sfs-export-policy-restricted-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-sfs-export-policy-restricted-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT SFS export policies do not grant NFS access to the entire internet.

        An export policy holds the rules that decide which clients may access an exported file system and how. The check reads every rule in every export policy and requires that no rule's IP allow-list contains `0.0.0.0/0` or `::/0`.

        **Why this matters**

        Export policies are the per-export half of SFS access control, and they are where a broad rule is easiest to introduce and hardest to notice. A resource pool's allow-list can be correct while an export policy attached to it grants far more, and the effective access is the wider of the two.

        The exposure is the same one NFS always presents: client-asserted identity. A permitted client presents any user and group ID it likes, so read access means read access to everything in the export and write access means the ability to place files, including files that another system will later execute.

        Rules accumulate. Export policies are edited when a new client needs access, and the quickest edit that works is a broad range. Each such edit is individually defensible and the aggregate is not, which is why the policy needs reviewing as a whole rather than per change.

        Scope each rule to the smallest client range that needs it, and prefer read-only rules wherever the client does not write.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **File Storage** and select **Export Policies**.
        3. Review each policy's rules and confirm no rule's IP allow-list contains `0.0.0.0/0` or `::/0`.

        A passing export policy scopes every rule to specific client CIDRs. A failing export policy has a rule open to the entire internet, which removes the network boundary protecting the share data.

        ### Audit via CLI

        1. List the export policies in the project and inspect the allow-list of every rule:

        ```bash
        stackit beta sfs export-policy list --output-format json
        ```

        A failing rule has `0.0.0.0/0` or `::/0` in its IP allow-list.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the export policy and replace any `0.0.0.0/0` rule with specific client CIDRs that require access.
        - id: terraform
          desc: |
            Scope each rule's `ip_acl` on the `stackit_sfs_export_policy` resource to specific client CIDRs, excluding `0.0.0.0/0` and `::/0`:

            ```hcl
            resource "stackit_sfs_export_policy" "example" {
              project_id = var.project_id
              name       = "secure-policy"
              rules = [
                {
                  order  = 1
                  ip_acl = ["10.0.0.0/8", "172.16.0.0/24"]
                }
              ]
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/storage/file-storage/
        title: STACKIT Documentation - File Storage (SFS)
  - uid: mondoo-stackit-security-sfs-export-policy-restricted-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.sfs.exportPolicies.all(rules.all(ipAcl.none(_ == "0.0.0.0/0" || _ == "::/0")))
  - uid: mondoo-stackit-security-sfs-export-policy-restricted-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_sfs_export_policy")
    mql: |
      terraform.resources("stackit_sfs_export_policy").where(arguments["rules"] != empty).all(
        arguments["rules"].all(_["ip_acl"].none(_ == "0.0.0.0/0" || _ == "::/0"))
      )
  - uid: mondoo-stackit-security-sfs-export-policy-restricted-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_sfs_export_policy")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_sfs_export_policy").where(
        change.after["rules"] != empty
      ).all(
        change.after["rules"].all(_["ip_acl"].none(_ == "0.0.0.0/0" || _ == "::/0"))
      )
  - uid: mondoo-stackit-security-sfs-export-policy-restricted-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_sfs_export_policy")
    mql: |
      terraform.state.resources.where(type == "stackit_sfs_export_policy").where(
        values["rules"] != empty
      ).all(
        values["rules"].all(_["ip_acl"].none(_ == "0.0.0.0/0" || _ == "::/0"))
      )
  - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy
    title: Ensure STACKIT SFS resource pools have a snapshot policy attached
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-bcr-08
      compliance/dora: dora-art-12
      compliance/hipaa: hipaa-security-ss164-308-a-7-ii-a-contingency-plan-data-backup-plan
      compliance/iso-27001-2022: iso-27001-2022-a-8-13
      compliance/nis-2: nis-2-21-2-c
      compliance/nist-csf-1: nist-csf-1-pr-ip-4
      compliance/nist-csf-2: nist-csf-2-pr-ds-11
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cp-9
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-3-1-2
    variants:
      - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT SFS resource pools have a snapshot policy attached.

        A snapshot policy takes point-in-time copies of the file systems in the pool on a schedule. The check reads each resource pool and requires that a snapshot policy is assigned.

        **Why this matters**

        Shared file storage is where a ransomware incident does the most damage, because it is reachable from several systems at once. Compromising any one client with write access is enough to encrypt data that all of the others depend on.

        Snapshots are what make that recoverable. They are taken by the storage platform rather than by a client, so an attacker operating through a mounted file system cannot reach them the way they can reach the files themselves, and restoring to a point before the encryption is a storage operation rather than a rebuild.

        The same mechanism covers the more common cases. Accidental deletion of a shared directory, an application that corrupts state on upgrade, and a script that runs against the wrong path are all routine, and shared storage multiplies their consequences because several systems lose the data together.

        A snapshot policy is not a backup strategy on its own, since snapshots live alongside the data they protect. Pair it with copies held elsewhere, and set the schedule and retention against how much work the organization can afford to lose.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **File Storage** and select the resource pool.
        3. Confirm a snapshot policy is attached to the pool.

        A passing resource pool has a snapshot policy attached, giving it point-in-time copies to restore from. A failing resource pool has none, so accidental deletion or corruption of its file data has no recovery path.

        ### Audit via CLI

        1. List the resource pools in the project and check whether each references a snapshot policy:

        ```bash
        stackit beta sfs resource-pool list --output-format json
        ```

        2. List the snapshot policies available in the project:

        ```bash
        stackit beta sfs snapshot-policy list --output-format json
        ```

        A passing resource pool reports a snapshot policy ID. A failing resource pool reports an empty one.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, attach a snapshot policy to the SFS resource pool with a schedule and retention appropriate for the data's recovery requirements.
        - id: terraform
          desc: |
            Attach a snapshot policy to the `stackit_sfs_resource_pool` resource by setting the `snapshot_policy` block with the policy `id`:

            ```hcl
            resource "stackit_sfs_resource_pool" "example" {
              project_id        = var.project_id
              name              = "resourcepool-with-snapshot"
              availability_zone = "eu01-m"
              performance_class = "Standard"
              size_gigabytes    = 512
              ip_acl            = ["10.0.0.0/8"]
              snapshot_policy = {
                id = var.snapshot_policy_id
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/storage/file-storage/
        title: STACKIT Documentation - File Storage (SFS)
  - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.sfs.resourcePools.all(snapshotPolicyId != "")
  - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_sfs_resource_pool")
    mql: |
      terraform.resources("stackit_sfs_resource_pool").all(
        arguments["snapshot_policy"]["id"] != empty
      )
  - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_sfs_resource_pool")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_sfs_resource_pool").all(
        change.after["snapshot_policy"]["id"] != empty
      )
  - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_sfs_resource_pool")
    mql: |
      terraform.state.resources.where(type == "stackit_sfs_resource_pool").all(
        values["snapshot_policy"]["id"] != empty
      )
