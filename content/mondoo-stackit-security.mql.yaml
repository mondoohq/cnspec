      - uid: mondoo-stackit-security-db-mongodb-high-availability-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-db-mongodb-high-availability-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT MongoDB Flex instances run with more than one replica.

        Replica count determines whether the instance is a standalone node or a replica set. The check reads the configured replica count and requires at least two.

        **Why this matters**

        MongoDB is designed around replica sets, and running standalone gives up guarantees the application layer may already assume it has. Elections, automatic failover, and read preferences all depend on there being more than one member, so a standalone instance is both a single point of failure and a different consistency story than the driver defaults expect.

        Operationally, the consequence is that every maintenance event is an outage. Version upgrades, host patching, and instance resizing all take the only node away, so each becomes a scheduled interruption rather than a rolling change, and each therefore gets postponed.

        That postponement is where the security cost appears. An instance that cannot be upgraded without downtime tends to stay on an old version, accumulating fixed vulnerabilities it never receives.

        Replicas do not remove the need for backups. A replica set copies a dropped collection to every member as reliably as it copies a legitimate write, so it protects against losing a node and not against losing data. Configure both.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **MongoDB Flex** and select the instance.
        3. Review the instance's replica count.

        A passing instance runs two or more replicas, so it survives the loss of a node without an outage. A failing instance runs a single replica and has no automatic failover. A single replica can be a deliberate choice for development workloads, so weigh a failure against the role the instance plays.

        ### Audit via CLI

        1. Describe the instance and inspect its replica count:

        ```bash
        stackit mongodbflex instance describe <instance-id> --output-format json
        ```

        A passing instance reports two or more replicas. A failing instance reports one.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, scale the MongoDB Flex instance to two or more replicas for production workloads.
        - id: terraform
          desc: |
            Set `replicas` to at least 2 (use 3 for a replica set) on the `stackit_mongodbflex_instance` resource:

            ```hcl
            resource "stackit_mongodbflex_instance" "example" {
              project_id      = var.project_id
              name            = "example-instance"
              acl             = ["10.0.0.0/8"]
              backup_schedule = "0 2 * * *"
              replicas        = 3 # >= 2 for high availability
              flavor = {
                cpu = 1
                ram = 4
              }
              storage = {
                class = "premium-perf2-mongodb"
                size  = 10
              }
              version = "7.0"
              options = {
                type                       = "Replica"
                point_in_time_window_hours = 30
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/databases/mongodb-flex/
        title: STACKIT Documentation - MongoDB Flex
  - uid: mondoo-stackit-security-db-mongodb-high-availability-stackit-mongodb-flex-instance
    filters: asset.platform == "stackit-mongodb-flex-instance"
    mql: |
      stackit.mongoDbFlex.instance.replicas >= 2
  - uid: mondoo-stackit-security-db-mongodb-high-availability-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_mongodbflex_instance")
    mql: |
      terraform.resources("stackit_mongodbflex_instance").all(arguments["replicas"] >= 2)
  - uid: mondoo-stackit-security-db-mongodb-high-availability-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_mongodbflex_instance")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_mongodbflex_instance").all(
        change.after["replicas"] >= 2
      )
  - uid: mondoo-stackit-security-db-mongodb-high-availability-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_mongodbflex_instance")
    mql: |
      terraform.state.resources.where(type == "stackit_mongodbflex_instance").all(
        values["replicas"] >= 2
      )
