policies:
  - uid: mondoo-stackit-security
    name: Mondoo STACKIT Security
    version: 1.2.1
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: stackit,cloud
    require:
      - provider: stackit
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure STACKIT compute, storage, databases, networking, and IAM
    docs:
      desc: |
        The Mondoo STACKIT Security policy identifies critical misconfigurations that could leave your STACKIT projects vulnerable to attackers. It helps organizations detect and remediate security risks before they can be exploited, reducing the likelihood of unauthorized access, data breaches, and operational disruptions.

        The policy runs directly against a STACKIT project and provides security checks across these services:

        - **Compute** — servers attached to security groups, block storage volume encryption
        - **Networking** — security groups (no public SSH/RDP/all-ports ingress), application load balancers
        - **Object Storage** — S3-compatible buckets (Object Lock and retention)
        - **File Storage (SFS)** — resource pool and NFS export-policy access controls, snapshot policy
        - **Managed Databases** — PostgreSQL Flex, MongoDB Flex, SQLServer Flex (network exposure, backups, high availability)
        - **Secrets Manager** — network exposure
        - **Identity & Access** — service account key and access-token expiry
        - **Key Management (KMS)** — key lifecycle and health
        - **Kubernetes Engine (SKE)** — cluster health and version auto-update
        - **Telemetry Router** and **AI Model Serving** — access-token lifecycle

        ## Scope and design

        The checks focus on controls an operator **can misconfigure** — network exposure, access-control lists, credential expiry, backups, and high availability. Where STACKIT enforces a control by default and exposes no setting to weaken it — for example mandatory **TLS 1.3** in transit and always-on **AES-256 encryption at rest** for managed databases and storage — the policy intentionally does not add a check, because there is no insecure state to detect. Per-group notes call out these platform guarantees so a passing scan is not mistaken for missing coverage.

        If you have questions, reach out to Mondoo at hello@mondoo.com.
    groups:
      - title: STACKIT Compute
        checks:
          - uid: mondoo-stackit-security-compute-server-has-security-group
          - uid: mondoo-stackit-security-compute-volume-encrypted
      - title: STACKIT Networking
        checks:
          - uid: mondoo-stackit-security-network-no-public-ssh
          - uid: mondoo-stackit-security-network-no-public-rdp
          - uid: mondoo-stackit-security-network-no-unrestricted-ingress
          - uid: mondoo-stackit-security-network-alb-target-security-groups
      - title: STACKIT Object Storage
        checks:
          - uid: mondoo-stackit-security-objectstorage-bucket-object-lock
          - uid: mondoo-stackit-security-objectstorage-bucket-retention
      - title: STACKIT File Storage
        checks:
          - uid: mondoo-stackit-security-sfs-resourcepool-restricted-ipacl
          - uid: mondoo-stackit-security-sfs-export-policy-restricted
          - uid: mondoo-stackit-security-sfs-resourcepool-snapshot-policy
      - title: STACKIT Managed Databases
        docs:
          desc: |
            These checks cover the STACKIT managed-database engines (PostgreSQL Flex, MongoDB Flex, and SQLServer Flex).

            **Why encryption and TLS are not checked here**

            Several controls that are configurable (and therefore checkable) on other clouds are *platform guarantees* on STACKIT, not user-tunable settings — so there is no insecure state to detect, and a check would always pass:

            - **Encryption in transit:** Connections are always encrypted with TLS 1.3 and signed certificates; unencrypted access is not possible.
            - **Encryption at rest:** Instance storage and backup storage are encrypted system-side with AES-256 by default.
            - **Automated backups:** The full instance is backed up automatically, and deletion is delayed (soft-delete) before permanent removal.

            These checks therefore focus on what an operator *can* misconfigure: network exposure (the access-control list), whether a backup schedule is set, and high availability (replica count).
        checks:
          - uid: mondoo-stackit-security-db-postgres-acl-restricted
          - uid: mondoo-stackit-security-db-postgres-backups
          - uid: mondoo-stackit-security-db-mongodb-acl-restricted
          - uid: mondoo-stackit-security-db-mongodb-backups
          - uid: mondoo-stackit-security-db-sqlserver-acl-restricted
          - uid: mondoo-stackit-security-db-sqlserver-backups
          - uid: mondoo-stackit-security-db-postgres-high-availability
          - uid: mondoo-stackit-security-db-mongodb-high-availability
          - uid: mondoo-stackit-security-db-sqlserver-high-availability
      - title: STACKIT Secrets Manager
        checks:
          - uid: mondoo-stackit-security-secretsmanager-acl-restricted
      - title: STACKIT Identity & Access
        checks:
          - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity
          - uid: mondoo-stackit-security-serviceaccount-token-bounded-validity
          - uid: mondoo-stackit-security-serviceaccount-federated-identity-scoped
      - title: STACKIT Key Management
        checks:
          - uid: mondoo-stackit-security-kms-key-not-pending-deletion
          - uid: mondoo-stackit-security-kms-key-healthy-state
          - uid: mondoo-stackit-security-kms-key-recently-rotated
      - title: STACKIT Kubernetes (SKE)
        checks:
          - uid: mondoo-stackit-security-ske-cluster-healthy
          - uid: mondoo-stackit-security-ske-cluster-auto-update
          - uid: mondoo-stackit-security-ske-apiserver-acl-enabled
          - uid: mondoo-stackit-security-ske-apiserver-acl-restricted
          - uid: mondoo-stackit-security-ske-not-end-of-support
      - title: STACKIT Telemetry
        checks:
          - uid: mondoo-stackit-security-telemetry-token-expiry-set
          - uid: mondoo-stackit-security-telemetry-token-not-expired
      - title: STACKIT Model Serving
        checks:
          - uid: mondoo-stackit-security-modelserving-token-expiry-set
          - uid: mondoo-stackit-security-modelserving-token-not-expired
queries:
  # ----------------------------- STACKIT Compute -----------------------------
  - uid: mondoo-stackit-security-compute-server-has-security-group
    title: Ensure STACKIT servers are attached to a security group
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-compute-server-has-security-group-stackit-server
        tags:
          mondoo.com/filter-title: STACKIT Server
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-compute-server-has-security-group-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-compute-server-has-security-group-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-compute-server-has-security-group-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every STACKIT server has at least one security group attached.

        A security group is the stateful packet filter STACKIT applies at the server's network interface. The check reads the security groups attached to each server and requires at least one.

        **Why this matters**

        A server with no security group has nothing filtering traffic at its interface. Whether anything reaches it then depends entirely on network placement, which is a property nobody reviews when they add a service to a machine.

        That produces exposure by accident rather than by decision. An application bound to all interfaces for local testing, a database started with its default listener, or a management agent installed alongside something else all become reachable, and none of those choices was made with the network in mind.

        Attaching a group also changes what happens next. Security groups are the object an operator reviews, an auditor reads, and a change is recorded against. A server without one is invisible to every one of those processes, so a later question about what may reach it has no answer beyond reading routing tables.

        Attach a group even when the intended answer is that nothing should reach the server. An explicit group denying inbound traffic states the intent and can be reviewed; the absence of a group states nothing.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Compute Engine** and select the server.
        3. Review the server's network interfaces and confirm at least one security group is attached.

        A passing server has one or more security groups attached. A failing server has no security group, so no instance-level filtering applies to its traffic.

        ### Audit via CLI

        1. Describe the server and inspect its attached security groups:

        ```bash
        stackit server describe <server-id> --output-format json
        ```

        A passing server reports a non-empty list of security groups. A failing server reports an empty list.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, open **Compute Engine** > **Servers**, select the server, and attach an appropriate security group under its network settings.
        - id: terraform
          desc: |
            Attach a security group to the server's network interface so instance-level filtering applies. With the `stackit` Terraform provider, set `security_group_ids` on a `stackit_network_interface` and reference that interface from the server:

            ```hcl
            resource "stackit_security_group" "example" {
              project_id = var.project_id
              name       = "example-sg"
              stateful   = true
            }

            resource "stackit_network_interface" "example" {
              project_id         = var.project_id
              network_id         = var.network_id
              security_group_ids = [stackit_security_group.example.security_group_id]
            }

            resource "stackit_server" "example" {
              project_id   = var.project_id
              name         = "example-server"
              machine_type = "g2i.1"
              boot_volume = {
                size        = 64
                source_type = "image"
                source_id   = var.image_id
              }
              network_interfaces = [stackit_network_interface.example.network_interface_id]
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/network/network-security/
        title: STACKIT Documentation - Security Groups
  - uid: mondoo-stackit-security-compute-server-has-security-group-stackit-server
    filters: asset.platform == "stackit-server"
    mql: |
      stackit.server.securityGroups.length > 0
  - uid: mondoo-stackit-security-compute-server-has-security-group-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_network_interface")
    mql: |
      terraform.resources("stackit_network_interface").all(
        arguments["security"] != false && arguments["security_group_ids"] != empty
      )
  - uid: mondoo-stackit-security-compute-server-has-security-group-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_network_interface")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_network_interface").all(
        change.after["security"] != false && change.after["security_group_ids"] != empty
      )
  - uid: mondoo-stackit-security-compute-server-has-security-group-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_network_interface")
    mql: |
      terraform.state.resources.where(type == "stackit_network_interface").all(
        values["security"] != false && values["security_group_ids"] != empty
      )
  # No Terraform variant: stackit_volume.encrypted is a read-only attribute. STACKIT encrypts every
  # volume with a platform-held key and Terraform reports the result rather than requesting it, so an
  # author cannot express the insecure state in HCL. encryption_parameters selects a customer-managed
  # key-encryption key, which is a different control from whether the volume is encrypted at all.
  - uid: mondoo-stackit-security-compute-volume-encrypted
    title: Ensure STACKIT block storage volumes are encrypted
    impact: 80
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      stackit.volumes.all(encrypted == true)
    docs:
      desc: |
        This check verifies that STACKIT block storage volumes are encrypted at rest.

        Encryption is selected when a volume is created and cannot be turned on afterward for an existing volume. The check reads each volume's encryption state and requires it to be enabled.

        **Why this matters**

        Volume encryption protects data from everyone who can reach the storage but not the running instance. That includes anyone recovering decommissioned media, anyone who obtains a copy of the backing storage, and anyone with access to the platform layer beneath the virtual machine.

        It also travels with the data. Snapshots and images taken from an encrypted volume stay encrypted, and those artifacts are the ones most likely to be copied between projects, shared with a support engagement, or left behind long after the instance is gone.

        For a European sovereign cloud, this control also carries regulatory weight. Encryption at rest is the technical measure most often cited under GDPR for reducing the consequences of a storage breach, and the distinction between an encrypted and an unencrypted volume can decide whether an incident is reportable.

        The constraint to plan around is that encryption is a create-time decision. An unencrypted volume must be replaced by creating an encrypted one and migrating the data, so this is a check to satisfy at provisioning rather than remediate later.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Compute Engine** and select **Volumes**.
        3. Review each volume and confirm it is encrypted.

        A passing project has every block storage volume encrypted. A failing project has at least one unencrypted volume.

        ### Audit via CLI

        1. List the volumes in the project:

        ```bash
        stackit volume list --output-format json
        ```

        2. Inspect the encryption state of each volume:

        ```bash
        stackit volume describe <volume-id> --output-format json
        ```

        A passing volume reports encryption as enabled. A failing volume reports it as disabled.
      remediation:
        - id: console
          desc: |
            Volume encryption is configured at creation time. For an unencrypted volume, create a new encrypted volume and migrate the data, then detach and delete the unencrypted volume.
        - id: terraform
          desc: |
            Create the volume with customer-managed encryption by supplying `encryption_parameters` (a STACKIT KMS key) on the `stackit_volume` resource. Encryption is set at creation, so migrate data from any unencrypted volume to a new encrypted one:

            ```hcl
            resource "stackit_volume" "example" {
              project_id        = var.project_id
              name              = "encrypted-volume"
              size              = 64
              availability_zone = "eu01-1"
              encryption_parameters = {
                kek_keyring_id  = var.kms_keyring_id
                kek_key_id      = var.kms_key_id
                kek_key_version = 1
                service_account = var.kms_service_account
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/storage/block-storage/
        title: STACKIT Documentation - Block Storage
  # ----------------------------- STACKIT Networking -----------------------------
  - uid: mondoo-stackit-security-network-no-public-ssh
    title: Ensure no security group exposes SSH (port 22) to the internet
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-network-no-public-ssh-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-network-no-public-ssh-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-network-no-public-ssh-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-network-no-public-ssh-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that no STACKIT security group allows SSH from the entire internet.

        The check reads every ingress rule whose port range covers 22 and requires that none of them uses the source `0.0.0.0/0` or `::/0`.

        **Why this matters**

        An SSH port open to the internet is found within minutes of being opened. Internet-wide scanning is continuous and automated, and the credential-guessing traffic that follows never stops.

        That turns every account on the machine into a target, and it means the host's security rests entirely on its own SSH configuration. Any weakness there, a password-authenticated account, a service account with a shell, a key left behind by a departed engineer, becomes remotely reachable rather than locally contained.

        The volume is a problem in itself. Continuous authentication failures fill logs, obscure genuine access attempts, and make it substantially harder to notice the one attempt that succeeded.

        Restrict the source to the specific ranges administrators connect from. Where access must be broad, put SSH behind a bastion host or a VPN so that exactly one hardened entry point is exposed rather than every server, and consider that the IPv6 rule matters as much as the IPv4 one since `::/0` is equally open and easier to overlook.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Network** and select **Security Groups**.
        3. Review the ingress rules of each security group and look for any rule whose port range covers TCP port 22 with a source of `0.0.0.0/0` or `::/0`.

        A passing project has no security group admitting SSH from the open internet. A failing project has at least one such rule.

        ### Audit via CLI

        1. List the security groups in the project:

        ```bash
        stackit security-group list --output-format json
        ```

        2. For each security group, list its rules:

        ```bash
        stackit security-group rule list --security-group-id <security-group-id> --output-format json
        ```

        A failing rule has `direction` set to `ingress`, a port range that includes 22, and an IP range of `0.0.0.0/0` or `::/0`.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the offending security group rule and restrict the SSH source CIDR to a bastion host, VPN range, or specific administrative network instead of `0.0.0.0/0`.
        - id: terraform
          desc: |
            Define the SSH ingress rule with a restricted `ip_range` (a bastion or admin CIDR) instead of `0.0.0.0/0` on the `stackit_security_group_rule` resource:

            ```hcl
            resource "stackit_security_group_rule" "ssh_restricted" {
              project_id        = var.project_id
              security_group_id = var.security_group_id
              direction         = "ingress"
              ether_type        = "IPv4"
              ip_range          = "10.0.0.0/8" # restrict to a bastion/admin range, not 0.0.0.0/0
              protocol = {
                name = "tcp"
              }
              port_range = {
                min = 22
                max = 22
              }
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/network/network-security/
        title: STACKIT Documentation - Security Groups
  - uid: mondoo-stackit-security-network-no-public-ssh-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.securityGroups.all(rules.where(direction == "ingress" && portRangeMin <= 22 && portRangeMax >= 22).none(ipRange == "0.0.0.0/0" || ipRange == "::/0"))
  - uid: mondoo-stackit-security-network-no-public-ssh-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_security_group_rule")
    mql: |
      terraform.resources("stackit_security_group_rule").where(
        arguments["direction"] == "ingress"
      ).where(
        arguments["ip_range"] == "0.0.0.0/0" || arguments["ip_range"] == "::/0"
      ).none(
        arguments["port_range"] == null ||
        arguments["port_range"]["min"] <= 22 && arguments["port_range"]["max"] >= 22
      )
  - uid: mondoo-stackit-security-network-no-public-ssh-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_security_group_rule")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_security_group_rule").where(
        change.after["direction"] == "ingress"
      ).where(
        change.after["ip_range"] == "0.0.0.0/0" || change.after["ip_range"] == "::/0"
      ).none(
        change.after["port_range"] == null ||
        change.after["port_range"]["min"] <= 22 && change.after["port_range"]["max"] >= 22
      )
  - uid: mondoo-stackit-security-network-no-public-ssh-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_security_group_rule")
    mql: |
      terraform.state.resources.where(type == "stackit_security_group_rule").where(
        values["direction"] == "ingress"
      ).where(
        values["ip_range"] == "0.0.0.0/0" || values["ip_range"] == "::/0"
      ).none(
        values["port_range"] == null ||
        values["port_range"]["min"] <= 22 && values["port_range"]["max"] >= 22
      )
  - uid: mondoo-stackit-security-network-no-public-rdp
