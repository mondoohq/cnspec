      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: vda-isa-5-3-1-2
    mql: |
      stackit.sqlServerFlex.instance.replicas >= 2
    docs:
      desc: |
        This check verifies that STACKIT SQLServer Flex instances run with more than one replica.

        Replica count determines whether the instance can survive losing a node. The check reads the configured replica count and requires at least two.

        **Why this matters**

        SQL Server instances usually sit under applications the business cannot run without, so the instance's availability is the application's availability. A single node makes every fault and every maintenance window a full stop.

        Patching is the case that matters most. SQL Server security updates require a restart, and on a single-node instance that restart is an outage someone has to schedule and justify. The predictable result is that updates are deferred, and a database holding transactional and personal data runs with known vulnerabilities because the maintenance window was inconvenient. Multiple replicas turn that into a rolling operation.

        Recovery time is the other half. Rebuilding a lost single node means restoring from backup and replaying to the failure point, measured in hours; failing over to an existing replica is measured in seconds.

        Replicas and backups solve different problems and neither substitutes. Replication copies a bad migration or a mistaken deletion to every replica immediately, so run both, and treat the replica count as protection against infrastructure failure only.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **SQLServer Flex** and select the instance.
        3. Review the instance's replica count, which follows from the edition the instance runs.

        A passing instance runs two or more replicas, so it survives the loss of a node without an outage. A failing instance runs a single replica and has no automatic failover. A single replica can be a deliberate choice for development workloads, so weigh a failure against the role the instance plays.

        ### Audit via CLI

        1. Describe the instance and inspect its replica count:

        ```bash
        stackit beta sqlserverflex instance describe <instance-id> --output-format json
        ```

        A passing instance reports two or more replicas. A failing instance reports one.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, scale the SQLServer Flex instance to two or more replicas for production workloads.
        # No Terraform remediation: on stackit_sqlserverflex_instance the `replicas` attribute is read-only and cannot be set directly — high availability is derived from the instance edition/flavor. Select an HA-capable edition via the console or API.
    refs:
      - url: https://docs.stackit.cloud/products/databases/sqlserver-flex/
        title: STACKIT Documentation - SQLServer Flex
  # ----------------------------- STACKIT Secrets Manager -----------------------------
  - uid: mondoo-stackit-security-secretsmanager-acl-restricted
    title: Ensure Secrets Manager instances do not allow access from the internet
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-stackit-security-secretsmanager-acl-restricted-stackit-secrets-manager-instance
        tags:
          mondoo.com/filter-title: STACKIT Secrets Manager Instance
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-secretsmanager-acl-restricted-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-secretsmanager-acl-restricted-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-secretsmanager-acl-restricted-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that STACKIT Secrets Manager instances do not accept connections from the entire internet.

        The instance ACL controls which source addresses may reach the secrets store. The check reads that list and requires that it contains neither `0.0.0.0/0` nor `::/0`.

        **Why this matters**

        A secrets manager is the highest-value target in an environment by construction. It holds the credentials for everything else, so reaching it is not one compromise but the key to all of them: database passwords, API keys, service account credentials, and the material that protects the rest of the estate.

        Exposing it to the internet removes the network boundary from a system whose entire purpose is to be the one thing that is hard to reach. Whatever authentication it enforces then stands alone against continuous automated attack, with no requirement for an attacker to first gain a position inside the network.

        The consequences of success are also unusually broad. Credentials taken from a secrets store are valid, current, and often long-lived, so an attacker who obtains them proceeds as a legitimate client of every system those credentials unlock, generating little that looks anomalous.

        Restrict the ACL to the specific subnets where the workloads that consume secrets run. Nothing else needs to reach it, and administrative access should arrive over a VPN or bastion rather than by broadening this list.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Secrets Manager** and select the instance.
        3. Review the instance's access control list and confirm it does not contain `0.0.0.0/0` or `::/0`.

        A passing instance restricts its ACL to the subnets that must reach the secrets API. A failing instance accepts connections from the entire internet, widening the attack surface around the credentials it stores.

        ### Audit via CLI

        1. Describe the instance and inspect its ACL:

        ```bash
        stackit secrets-manager instance describe <instance-id> --output-format json
        ```

        A failing instance lists `0.0.0.0/0` or `::/0` in its ACL.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, edit the Secrets Manager instance access control list and restrict it to the specific subnets or hosts that require access.
        - id: terraform
          desc: |
            Restrict the `acls` set (note the plural attribute name) on the `stackit_secretsmanager_instance` resource to the specific subnets that require access, excluding `0.0.0.0/0` and `::/0`:

            ```hcl
            resource "stackit_secretsmanager_instance" "example" {
              project_id = var.project_id
              name       = "example-instance"
              acls       = ["10.0.0.0/8", "192.168.0.0/16"] # not 0.0.0.0/0
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/products/security/secrets-manager/
        title: STACKIT Documentation - Secrets Manager
  - uid: mondoo-stackit-security-secretsmanager-acl-restricted-stackit-secrets-manager-instance
    filters: asset.platform == "stackit-secrets-manager-instance"
    mql: |
      stackit.secretsManager.instance.acls.none(_ == "0.0.0.0/0" || _ == "::/0")
  - uid: mondoo-stackit-security-secretsmanager-acl-restricted-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_secretsmanager_instance")
    mql: |
      terraform.resources("stackit_secretsmanager_instance").where(arguments["acls"] != empty).all(
        arguments["acls"].none(_ == "0.0.0.0/0" || _ == "::/0")
      )
  - uid: mondoo-stackit-security-secretsmanager-acl-restricted-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_secretsmanager_instance")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_secretsmanager_instance").where(
        change.after["acls"] != empty
      ).all(change.after["acls"].none(_ == "0.0.0.0/0" || _ == "::/0"))
  - uid: mondoo-stackit-security-secretsmanager-acl-restricted-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_secretsmanager_instance")
    mql: |
      terraform.state.resources.where(type == "stackit_secretsmanager_instance").where(
        values["acls"] != empty
      ).all(values["acls"].none(_ == "0.0.0.0/0" || _ == "::/0"))
  # ----------------------------- STACKIT Identity & Access -----------------------------
  - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity
    title: Ensure active service account keys have a bounded validity
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-stackit-project
        tags:
          mondoo.com/filter-title: STACKIT Project
          mondoo.com/filter-icon: stackit
      - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that active STACKIT service account keys have an expiry date.

        Service account keys authenticate automation to the STACKIT API. The check reads every key marked active and requires that each one has a validity end date set rather than being open-ended.

        **Why this matters**

        A key with no expiry works forever, which means a leaked key works forever. Keys leak in ways nobody notices at the time: committed to a repository, pasted into a ticket or a chat, captured in a CI log, left on a laptop that was later lost, or copied into a script that outlived its author.

        Without an expiry, none of those events has an end. The credential stays valid through every subsequent password rotation, offboarding, and incident review, because none of those processes touches a key stored in a system nobody remembers.

        An expiry converts an unbounded exposure into a bounded one. A leaked key stops working, whether or not anyone ever discovers it leaked, and the discovery rate for quietly leaked credentials is not high.

        The operational requirement is that expiry forces rotation, so it has to be planned rather than discovered. Automate the renewal, alert before expiry, and confirm the consuming systems can pick up a new key without manual intervention. An expiry that surprises production is a control that gets removed.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Service Accounts** and select the account.
        3. Review its keys and confirm every active key carries a validity end date.

        A passing project has an expiry on every active service account key. A failing project has an active key that never expires, so a leak of that key grants programmatic access until someone revokes it by hand.

        ### Audit via CLI

        1. List the service accounts in the project:

        ```bash
        stackit service-account list --output-format json
        ```

        2. For each service account, list its keys:

        ```bash
        stackit service-account key list --email <service-account-email> --output-format json
        ```

        A failing key is active and reports no validity end date.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, reissue service account keys with a bounded validity period and remove any active keys that never expire.
        - id: terraform
          desc: |
            Issue keys with a bounded lifetime by setting `ttl_days` on the `stackit_service_account_key` resource, and remove any non-expiring keys:

            ```hcl
            resource "stackit_service_account_key" "example" {
              project_id            = var.project_id
              service_account_email = var.service_account_email
              ttl_days              = 90
            }
            ```
    refs:
      - url: https://docs.stackit.cloud/platform/access-and-identity/service-accounts/
        title: STACKIT Documentation - Service Accounts
  - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-stackit-project
    filters: asset.platform == "stackit-project"
    mql: |
      stackit.serviceAccounts.all(keys.where(_['active'] == true).all(_['validUntil'] != null))
  - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "stackit_service_account_key")
    mql: |
      terraform.resources("stackit_service_account_key").all(arguments["ttl_days"] != null)
  - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "stackit_service_account_key")
    mql: |
      terraform.plan.resourceChanges.where(type == "stackit_service_account_key").all(
        change.after["ttl_days"] != null
      )
  - uid: mondoo-stackit-security-serviceaccount-key-bounded-validity-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "stackit_service_account_key")
    mql: |
      terraform.state.resources.where(type == "stackit_service_account_key").all(
        values["ttl_days"] != null
      )
  # No Terraform variant: the provider declares no service account access token resource. It reaches
  # service account credentials only through stackit_service_account_key, which the key validity check
  # covers, so an access token's lifetime is not expressible in HCL.
  - uid: mondoo-stackit-security-serviceaccount-token-bounded-validity
    title: Ensure active service account access tokens have a bounded validity
    impact: 70
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: false
    mql: |
      stackit.serviceAccounts.all(accessTokens.where(_['active'] == true).all(_['validUntil'] != null))
    docs:
      desc: |
        This check verifies that active STACKIT service account access tokens have an expiry date.

        Access tokens are bearer credentials for the STACKIT API. The check reads every token marked active and requires that each one has a validity end date set.

        **Why this matters**

        A bearer token is usable by whoever holds it, with no further proof required. There is no second factor, no source restriction, and no signature tying it to a particular caller, so possession is the whole of authentication.

        That makes the token's lifetime the only limit on the damage a copy can do. Tokens are exposed far more casually than keys, since they pass through environment variables, CI job configuration, container images, log output, and error reports, and any one of those can persist somewhere nobody thinks of as sensitive.

        Without an expiry, a token recovered from a two-year-old build log still works. With one, the same token is inert by the time anyone finds it, and the window in which a leak matters is bounded by a decision made in advance rather than by whether the leak is ever noticed.

        Set the shortest validity the workload can accommodate and automate renewal. Where a workload can use a short-lived token issued on demand instead of a stored long-lived one, prefer that, since the best expiry is one measured in minutes.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Service Accounts** and select the account.
        3. Review its access tokens and confirm every active token carries a validity end date.

        A passing project has an expiry on every active access token. A failing project has an active token that never expires, so a leak of that token grants programmatic access until someone revokes it by hand.

        ### Audit via CLI

        1. List the service accounts in the project:

        ```bash
        stackit service-account list --output-format json
        ```

        2. For each service account, list its access tokens:

        ```bash
        stackit service-account token list --email <service-account-email> --output-format json
        ```

        A failing token is active and reports no validity end date.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, reissue service account access tokens with a bounded validity period and remove any active tokens that never expire.
        # No Terraform remediation: the stackit Terraform provider has no service-account access-token resource (stackit_service_account manages only the account). Access tokens are created with a bounded validity via the console or API.
    refs:
      - url: https://docs.stackit.cloud/platform/access-and-identity/service-accounts/
        title: STACKIT Documentation - Service Accounts
  # ----------------------------- STACKIT Key Management -----------------------------
  # No Terraform variant: a key's deletion date is lifecycle state the KMS API reports, not an argument
  # on stackit_kms_key. Scheduling a key for deletion is a destroy in Terraform's model, which leaves
  # nothing in the configuration to read.
  - uid: mondoo-stackit-security-kms-key-not-pending-deletion
    title: Ensure STACKIT KMS keys are not scheduled for deletion
    impact: 60
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-11
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      stackit.kms.keys.all(deletionDate == null)
    docs:
      desc: |
        This check verifies that no STACKIT KMS key is scheduled for deletion.

        Scheduling a key for deletion starts a waiting period, after which the key material is destroyed permanently. The check reads each key's deletion date and requires that none is set.

        **Why this matters**

        Destroying a KMS key destroys the ability to decrypt everything encrypted under it. That is not a recoverable operation: the data still exists, and it is permanently unreadable, including the backups of it, since those are encrypted under the same key.

        The waiting period exists because this is the most consequential irreversible action in a cloud environment, and it is the only chance to catch a mistake. A key scheduled for deletion is either a decommissioning that someone verified, or an error nobody has noticed yet, and the difference has to be established before the window closes.

        The error case is easy to reach. Keys are scheduled during cleanup of what appears to be unused infrastructure, and a key's usage is not obvious from the key itself. A snapshot from last year, an archived bucket, or a backup nobody restores routinely can all depend on a key that looks idle.

        Treat a scheduled deletion as something to confirm rather than something to observe. Establish what the key protects, including backups and snapshots, and cancel the deletion if anything still depends on it. After the window there is no remedy.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Key Management Service** and select the key ring.
        3. Review its keys and confirm none carries a scheduled deletion date.

        A passing key has no deletion date set. A failing key is scheduled for deletion, and once that date passes any data still encrypted under it becomes unrecoverable.

        ### Audit via CLI

        1. List the key rings in the project:

        ```bash
        stackit kms keyring list --output-format json
        ```

        2. For each key ring, list its keys and inspect their deletion dates:

        ```bash
        stackit kms key list --keyring-id <keyring-id> --output-format json
        ```

        A failing key reports a deletion date.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, review keys with a scheduled deletion. If the deletion is unintended, cancel it; otherwise confirm no active data depends on the key before it is removed.
        # No Terraform remediation: scheduling or cancelling key deletion is an imperative KMS API action, not a configurable attribute on stackit_kms_key. Cancel an unintended deletion via the console or API.
    refs:
      - url: https://docs.stackit.cloud/products/security/kms/
        title: STACKIT Documentation - Key Management Service (KMS)
  # No Terraform variant: key state is reported by the KMS API and stackit_kms_key exposes no argument
  # that sets it.
  - uid: mondoo-stackit-security-kms-key-healthy-state
    title: Ensure STACKIT KMS keys are in a healthy state
    impact: 50
    filters: asset.platform == "stackit-project"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      stackit.kms.keys.none(state == "errors_exist" || state == "not_available")
    docs:
      desc: |
        This check verifies that STACKIT KMS keys are in a healthy state.

        The check reads each key's state and fails any key reporting errors or unavailability.

        **Why this matters**

        A key that is not healthy is a key that may not decrypt. Everything encrypted under it, live data, snapshots, and backups, depends on the platform being able to use it, and an unavailable key makes that data unreadable for as long as the condition lasts.

        The failure mode is unusually quiet. Systems holding open sessions or cached data keep working, so the problem surfaces at the next operation that actually needs the key, which is frequently a restart, a scaling event, or a restore. That means the discovery moment tends to coincide with an incident already in progress.

        An unhealthy key can also be a signal rather than a fault. A key in an error state may reflect a permissions change, a configuration error made during a cleanup, or an interrupted operation, and each of those is worth understanding rather than waiting out.

        Investigate rather than retry. Establish what the key protects and whether that data is currently readable, then resolve the underlying condition. If a key cannot be restored to health, the data encrypted under it needs re-encrypting under a working key while it is still readable.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Key Management Service** and select the key ring.
        3. Review the reported state of each key.

        A passing key reports a healthy state. A failing key reports `errors_exist` or `not_available` and cannot perform cryptographic operations, which breaks encryption and decryption for everything depending on it.

        ### Audit via CLI

        1. List the key rings in the project:

        ```bash
        stackit kms keyring list --output-format json
        ```

        2. For each key ring, list its keys and inspect their states:

        ```bash
        stackit kms key list --keyring-id <keyring-id> --output-format json
        ```

        A failing key reports a state of `errors_exist` or `not_available`.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, investigate the key's reported state under Key Management Service and remediate the underlying issue, or rotate to a healthy key.
        # No Terraform remediation: key health (errors_exist / not_available) is a runtime state of the key, not a configurable attribute on stackit_kms_key. Investigate and remediate via the console or API.
    refs:
      - url: https://docs.stackit.cloud/products/security/kms/
        title: STACKIT Documentation - Key Management Service (KMS)
  # ----------------------------- STACKIT Kubernetes (SKE) -----------------------------
  # No Terraform variant: cluster health is reported by the SKE API and stackit_ske_cluster exposes no
  # argument that sets it.
  - uid: mondoo-stackit-security-ske-cluster-healthy
    title: Ensure STACKIT SKE clusters are not in an unhealthy state
    impact: 40
    filters: asset.platform == "stackit-ske-cluster"
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      stackit.ske.cluster.status != "STATE_UNHEALTHY"
    docs:
      desc: |
        This check verifies that STACKIT Kubernetes Engine clusters are not in an unhealthy state.

        The check reads each cluster's status and fails any cluster reporting as unhealthy.

        **Why this matters**

        An unhealthy SKE cluster is one the platform cannot fully manage, and that has security consequences beyond the availability ones.

        Managed cluster operations stop being reliable in this state. Version upgrades, node pool replacement, and certificate rotation are the mechanisms by which a cluster receives security fixes, and a cluster that cannot complete them stops receiving them while continuing to run workloads. The longer the condition persists, the further behind it falls.

        The state also obscures what is happening inside. Unhealthy is a broad status covering control plane problems, node failures, and configuration errors, and while it persists it is difficult to distinguish a genuine infrastructure fault from workload behavior worth investigating. An attacker operating in a cluster that is already reporting problems has cover.

        Treat this as something to resolve rather than monitor. Establish the underlying cause, since the remedy differs completely between a failing node pool, an exhausted quota, and a control plane issue requiring platform support, and confirm afterward that pending upgrades have applied.
      audit: |
        ### Audit via Console

        1. Sign in to the STACKIT Portal.
        2. Open **Kubernetes Engine (SKE)** and select the cluster.
        3. Review the cluster's reported state.

        A passing cluster reports any state other than unhealthy, including hibernated, which is a valid operational state. A failing cluster reports `STATE_UNHEALTHY`, meaning it may not be applying updates or enforcing admission policy reliably.

        ### Audit via CLI

        1. Describe the cluster and inspect its status:

        ```bash
        stackit ske cluster describe <cluster-name> --output-format json
        ```

        A failing cluster reports a status of `STATE_UNHEALTHY`.
      remediation:
        - id: console
          desc: |
            In the STACKIT Portal, open the SKE cluster's status details, investigate the reported condition, and remediate the underlying issue (for example a failed maintenance or node-pool problem).
        # No Terraform remediation: cluster health (STATE_UNHEALTHY) is a runtime status reported by the SKE service, not a configurable attribute on stackit_ske_cluster. Investigate and remediate via the console or API.
    refs:
      - url: https://docs.stackit.cloud/products/runtime/kubernetes-engine/
        title: STACKIT Documentation - Kubernetes Engine (SKE)
  - uid: mondoo-stackit-security-ske-cluster-auto-update
    title: Ensure STACKIT SKE clusters enable Kubernetes version auto-update
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
