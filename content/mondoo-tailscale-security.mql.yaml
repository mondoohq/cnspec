  # No Terraform variants: this is an org-posture existence check (the tailnet has at least
  # one logstream of type "configuration"). A per-module variant gated on
  # tailscale_logstream_configuration being present would vacuously assert its own trigger
  # and would false-positive on modules that legitimately manage logstreams in a separate
  # root module. Same rationale as the GCP scc-notification-configs and VPC-SC existence
  # checks. The terraform remediation below still shows how to declare the resource.
  - uid: mondoo-tailscale-security-configuration-logstream-configured
    title: Ensure the tailnet exports the configuration audit log
    impact: 80
    filters: asset.platform == 'tailscale'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-de-cm-1
      compliance/nist-csf-2: nist-csf-2-de-cm-09
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-3-1
    mql: |
      tailscale.logstreams.one(logType == "configuration")
    docs:
      desc: |
        This check verifies that the tailnet exports its administrative audit trail off the platform, by requiring a configured log stream for the configuration log type.

        Tailscale records administrative activity in the configuration audit log: role changes, device and user approvals, ACL policy edits, auth key creation and revocation, and tailnet lock changes. Log streaming is set up on the **Logs** page of the admin console and delivers those events continuously to a destination such as a SIEM or an object store. This check requires that a stream for the configuration log exists.

        **Why this matters**

        Without an export, the record of who changed the tailnet lives only in the system whose administrators are the people the record is about. An attacker who reaches an Owner account can widen the ACL policy, issue a key, and enroll a node, and the evidence of all three stays inside a console they control, under a retention period they did not choose. Shipping audit events elsewhere is what makes the copy survive both the incident and the account that caused it.

        Detection is the second reason, and it needs the events to sit next to other data. A key created minutes after an unfamiliar sign-in, an ACL edit immediately following a role change, a burst of device approvals outside working hours: each is unremarkable alone and obvious in sequence, and the correlation only happens where identity, endpoint, and cloud audit data already live. That is the SIEM, not the Tailscale console.

        Incident reconstruction depends on the same export. Answering how a rogue node got onto the tailnet, when the policy stopped enforcing what people believed it enforced, and which credential was used requires a timeline reaching further back than in-product history, and reaching it from a system the responder trusts.

        A stream that exists but points at a destination nobody watches provides evidence after the fact and no detection before it, so pair this with alerting on the events that matter most: ACL changes, privileged role grants, and auth key creation. Note also that network flow logs are streamed separately, so a tailnet already sending those still needs the configuration stream enabled.
      audit: |
        ### Audit via Admin Console

        1. Sign in to the [Tailscale admin console](https://login.tailscale.com/admin).
        2. Open the [Logs page](https://login.tailscale.com/admin/logs).
        3. Under **Configuration audit logs**, confirm streaming is enabled with a destination such as Splunk, Elastic, Panther, Cribl, Datadog, Axiom, or S3.

        A passing tailnet shows an enabled configuration logstream with a destination URL or S3 bucket. A failing tailnet shows the section as **Not configured**.

        ### Audit via API

        1. Query the configuration logstream endpoint:

        ```bash
        curl -s -u "$TAILSCALE_API_KEY:" \
          "https://api.tailscale.com/api/v2/tailnet/<tailnet>/logging/configuration/stream"
        ```

        A passing tailnet returns a JSON body describing the destination. A failing tailnet returns HTTP 404 (or an empty object) indicating no logstream is configured for `configuration`.
      remediation:
        - id: console
          desc: |
            To configure the configuration audit log export from the admin console:

            1. Sign in to the [Tailscale admin console](https://login.tailscale.com/admin) and open the [Logs page](https://login.tailscale.com/admin/logs).
            2. Under **Configuration audit logs**, start streaming and choose a destination such as Splunk, Elastic, Panther, Cribl, Datadog, Axiom, or S3.
            3. Provide the destination endpoint plus the auth credential the destination requires, such as a token, basic auth, or an IAM access key or assumed role for S3.
            4. Save and confirm the test event lands in the receiver.
        - id: cli
          desc: |
            To configure the configuration audit log export via the Tailscale API. The exact body depends on the destination; the example below configures an S3 bucket using an assumed role:

            ```bash
            curl -s -u "$TAILSCALE_API_KEY:" \
              -H "Content-Type: application/json" \
              -X PUT "https://api.tailscale.com/api/v2/tailnet/<tailnet>/logging/configuration/stream" \
              --data '{
                "destinationType": "s3",
                "s3Bucket": "<bucket>",
                "s3Region": "<region>",
                "s3KeyPrefix": "tailscale-config/",
                "s3AuthenticationType": "rolearn",
                "s3RoleArn": "arn:aws:iam::<account>:role/<tailscale-export-role>",
                "s3ExternalId": "<external-id>"
              }'
            ```

            Verify the configuration with `GET .../logging/configuration/stream` and confirm new events appear in the destination.
        - id: terraform
          desc: |
            To declare the configuration audit log export in Terraform, use the `tailscale_logstream_configuration` resource with `log_type = "configuration"`. The example below sends to S3 using an assumed role; the resource also supports `splunk`, `elastic`, `panther`, `cribl`, `datadog`, and `axiom` destinations:

            ```hcl
            resource "tailscale_logstream_configuration" "config_audit" {
              log_type               = "configuration"
              destination_type       = "s3"
              s3_bucket              = "tailnet-audit-logs"
              s3_region              = "us-east-1"
              s3_key_prefix          = "tailscale-config/"
              s3_authentication_type = "rolearn"
              s3_role_arn            = "arn:aws:iam::123456789012:role/tailscale-export"
              s3_external_id         = var.tailscale_external_id
            }
            ```
    refs:
      - url: https://tailscale.com/kb/1255/log-streaming
        title: Tailscale log streaming
      - url: https://tailscale.com/kb/1156/audit-logs
        title: Tailscale audit logging
  - uid: mondoo-tailscale-security-webhooks-use-https
    title: Ensure tailnet webhook endpoints use HTTPS
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    variants:
      - uid: mondoo-tailscale-security-webhooks-use-https-tailscale
        tags:
          mondoo.com/filter-title: Tailscale Tailnet
          mondoo.com/filter-icon: tailscale
      - uid: mondoo-tailscale-security-webhooks-use-https-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-webhooks-use-https-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-webhooks-use-https-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that tailnet event notifications are delivered over an encrypted channel, by requiring every webhook endpoint URL to use the `https://` scheme.

        Webhooks are configured under **Settings > Webhooks** in the admin console, or through the `tailscale_webhook` resource, and Tailscale posts tailnet events to them: device approval requests, user role changes, ACL policy edits, key expiry notices, and node enrollment. This check requires that every endpoint URL begins with `https://`.

        **Why this matters**

        A webhook body is a live feed of who is joining the network, which machines exist, and how the tailnet's access rules are changing. Delivered over plain `http://`, every hop between Tailscale and the receiver can read it, which hands an attacker on the path a continuously updated inventory of user email addresses, device identifiers, operating systems, and administrative activity. That is reconnaissance material of a quality that normally requires an intrusion to obtain, gathered passively instead.

        Signing does not close the gap. Tailscale signs webhook payloads so a receiver can confirm they came from Tailscale, and that authentication is worth having, but a signature does not conceal the body. Confidentiality on the wire comes from the transport, and only `https://` provides it.

        The plaintext channel is an opening for interference as well. An attacker positioned on the path can drop the notification that would have alerted an administrator to an unexpected device approval, buying time on an enrollment they performed themselves.

        An endpoint on an internal network is not an exception worth making. The receiver is usually an internal automation service, and internal networks are exactly where an attacker who already holds one host does their listening. Point every receiver at an `https://` URL and verify the payload signature at the far end, so the events are both private and attributable.
      audit: |
        ### Audit via Admin Console

        1. Sign in to the [Tailscale admin console](https://login.tailscale.com/admin).
        2. Open **Settings** > **Webhooks** and review the **Endpoint URL** column for each subscription.

        A passing tailnet shows `https://` for every endpoint. A failing tailnet shows at least one endpoint with `http://`.

        ### Audit via API

        1. List the webhooks:

        ```bash
        curl -s -u "$TAILSCALE_API_KEY:" \
          "https://api.tailscale.com/api/v2/tailnet/<tailnet>/webhooks"
        ```

        A passing tailnet returns every entry with `endpointUrl` starting with `https://`. A failing tailnet returns at least one entry whose `endpointUrl` starts with `http://`.
      remediation:
        - id: console
          desc: |
            To switch a plaintext webhook to HTTPS from the admin console:

            1. Provision the receiver behind an HTTPS endpoint; if it lives behind an internal service, front it with a reverse proxy that terminates TLS using a certificate from a publicly trusted CA.
            2. Sign in to the [Tailscale admin console](https://login.tailscale.com/admin) and open **Settings** > **Webhooks**.
            3. Create a new webhook with the `https://` endpoint URL and the same event subscriptions as the old one. The endpoint URL of an existing webhook cannot be edited, so replacing the webhook is the supported path.
            4. Store the new webhook signing secret in the receiver and confirm a test event is accepted.
            5. Delete the old plaintext webhook.
        - id: cli
          desc: |
            To replace a plaintext webhook via the Tailscale API: a webhook's endpoint URL cannot be changed after creation, so create a replacement webhook that posts to the HTTPS endpoint, then delete the plaintext one.

            ```bash
            # Look up the plaintext webhook's id and subscriptions
            curl -s -u "$TAILSCALE_API_KEY:" \
              "https://api.tailscale.com/api/v2/tailnet/<tailnet>/webhooks"

            # Create the HTTPS replacement with the same subscriptions; the
            # response contains the new signing secret
            curl -s -u "$TAILSCALE_API_KEY:" \
              -H "Content-Type: application/json" \
              -X POST "https://api.tailscale.com/api/v2/tailnet/<tailnet>/webhooks" \
              --data '{
                "endpointUrl": "https://<receiver-host>/<path>",
                "subscriptions": ["nodeApproved", "nodeNeedsApproval"]
              }'

            # Store the secret in the receiver and verify delivery, then
            # delete the old plaintext webhook
            curl -s -u "$TAILSCALE_API_KEY:" \
              -X DELETE "https://api.tailscale.com/api/v2/webhooks/<old-endpoint-id>"
            ```
        - id: terraform
          desc: |
            To require HTTPS webhook endpoints in Terraform, set `endpoint_url` to an `https://` URL on the `tailscale_webhook` resource. Changing the URL forces replacement of the webhook and issues a new signing secret, which must be updated in the receiver:

            ```hcl
            resource "tailscale_webhook" "approvals" {
              endpoint_url  = "https://receiver.example.com/tailscale"
              subscriptions = ["nodeApproved", "nodeNeedsApproval"]
            }
            ```
    refs:
      - url: https://tailscale.com/kb/1213/webhooks
        title: Tailscale webhooks
  - uid: mondoo-tailscale-security-webhooks-use-https-tailscale
    filters: asset.platform == 'tailscale'
    mql: |
      tailscale.webhooks.all(endpointUrl == /^https:\/\//)
  - uid: mondoo-tailscale-security-webhooks-use-https-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "tailscale_webhook")
    mql: |
      terraform.resources("tailscale_webhook").all(arguments["endpoint_url"] == /^https:\/\//)
  - uid: mondoo-tailscale-security-webhooks-use-https-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "tailscale_webhook")
    mql: |
      terraform.plan.resourceChanges.where(type == "tailscale_webhook").all(change.after.endpoint_url == /^https:\/\//)
  - uid: mondoo-tailscale-security-webhooks-use-https-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "tailscale_webhook")
    mql: |
      terraform.state.resources.where(type == "tailscale_webhook").all(values.endpoint_url == /^https:\/\//)
