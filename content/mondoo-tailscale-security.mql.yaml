  - uid: mondoo-tailscale-security-devices-auto-updates-enabled
    title: Ensure devices have automatic Tailscale client updates enabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-1-ii-b-security-management-process-risk-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-2
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-tailscale-security-devices-auto-updates-enabled-tailscale
        tags:
          mondoo.com/filter-title: Tailscale Tailnet
          mondoo.com/filter-icon: tailscale
      - uid: mondoo-tailscale-security-devices-auto-updates-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-devices-auto-updates-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-devices-auto-updates-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the tailnet turns on automatic Tailscale client updates for the machines that support them.

        Automatic updates are a tailnet-wide default under **Settings > Device management** in the Tailscale admin console, recorded as `devices_auto_updates_on` in the `tailscale_tailnet_settings` resource. When it is on, eligible machines install new Tailscale client releases themselves rather than waiting for someone to push them. This check requires the setting to be enabled.

        **Why this matters**

        The interval between a client release that fixes a security defect and the moment the last machine installs it is a window in which the weakness is public and the fleet is still exposed. Manual patching stretches that window to the length of the slowest team's change process, and on a mesh network the slowest node is the one that counts, because every peer the ACL policy allows can reach it directly without crossing a firewall or a bastion where compensating controls might apply.

        Manual updating also fails unevenly, and it fails in the worst places. Interactive workstations get attention because people see the prompts. Headless machines do not, so subnet routers, exit nodes, and long-lived cloud instances drift furthest behind, and those are precisely the nodes whose compromise reaches past the tailnet into an on-premises range or a cloud account.

        Turning updates on shifts the default from opt-in patching to opt-out, which is what keeps the fleet current after the one-time sweep that follows an advisory.

        Machines whose Tailscale client comes from a distribution package manager or a golden image do not update themselves through this mechanism, so pair this setting with the companion check in this policy that flags machines with a pending client update, which is what shows whether the policy is actually reaching them.
      audit: |
        ### Audit via Admin Console

        1. Sign in to the Tailscale admin console at login.tailscale.com/admin.
        2. Open **Settings > Device management**.
        3. Review the auto-updates setting for the tailnet.

        A passing result shows automatic client updates enabled for the tailnet; a failing result shows auto-updates turned off.

        ### Audit via API

        Query the Tailscale API and inspect the result:

        ```bash
        curl -s -u "$TAILSCALE_API_KEY:" \
          "https://api.tailscale.com/api/v2/tailnet/<tailnet>/settings"
        ```

        A passing response shows `"devicesAutoUpdatesOn": true`; a failing response shows `"devicesAutoUpdatesOn": false`.
      remediation:
        - id: console
          desc: |
            **Using Tailscale Admin Console**

            1. Go to [Settings > Device management](https://login.tailscale.com/admin/settings/device-management) in the Tailscale admin console.
            2. Locate the **Auto-updates** setting.
            3. Enable automatic updates. When offered, apply the setting to existing devices as well as new ones so the whole fleet converges.
        - id: cli
          desc: |
            To enable tailnet-wide automatic client updates via the Tailscale API:

            ```bash
            curl -s -u "$TAILSCALE_API_KEY:" \
              -H "Content-Type: application/json" \
              -X PATCH "https://api.tailscale.com/api/v2/tailnet/<tailnet>/settings" \
              --data '{ "devicesAutoUpdatesOn": true }'
            ```
        - id: terraform
          desc: |
            To enable tailnet-wide automatic client updates in Terraform, set `devices_auto_updates_on = true` on the `tailscale_tailnet_settings` resource:

            ```hcl
            resource "tailscale_tailnet_settings" "example" {
              devices_auto_updates_on = true
            }
            ```
    refs:
      - url: https://tailscale.com/kb/1067/update
        title: Tailscale client auto-update documentation
