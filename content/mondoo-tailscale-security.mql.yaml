  - uid: mondoo-tailscale-security-devices-key-duration-capped
    title: Ensure tailnet device key duration is set to 180 days or less
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-12
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-1
    variants:
      - uid: mondoo-tailscale-security-devices-key-duration-capped-tailscale
        tags:
          mondoo.com/filter-title: Tailscale Tailnet
          mondoo.com/filter-icon: tailscale
      - uid: mondoo-tailscale-security-devices-key-duration-capped-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-devices-key-duration-capped-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-devices-key-duration-capped-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that node keys on the tailnet expire on a bounded schedule, with the tailnet-wide key duration set to a finite value of 180 days or less.

        The key duration is set under **Settings > Device management** in the Tailscale admin console and appears as `devices_key_duration_days` in the `tailscale_tailnet_settings` resource. It governs how long a machine's node key stays valid before the machine must sign in again through the identity provider, and a value of `0` means keys never expire. This check requires a duration greater than zero and no more than 180 days.

        **Why this matters**

        The key duration is the ceiling on how long a compromised or abandoned machine keeps its place on the tailnet. A node key is a bearer credential, so whoever holds it is that machine, and no password prompt stands between the key and the network. Extracted from a stolen laptop, recovered from a disk image, or lifted from a backup of a server's state directory, it keeps working until it expires. Setting the duration to a year, or leaving it at `0`, makes the answer to how long a leaked key works "until somebody happens to notice", which is not a control.

        Expiry is also what gives identity-provider decisions teeth. Suspending an account stops new sign-ins but does not reach out and disconnect machines already holding valid keys. Re-authentication is the moment the suspension is enforced, so the key duration sets how long an offboarded person's devices stay on the network after their account is closed.

        Shorter is not free. Every expiry is an interactive sign-in, and the machines with nobody sitting at them, such as subnet routers and CI runners, are the ones that break when a key lapses. The fix for those is tagged and ephemeral nodes, whose lifecycle is governed by `tagOwners` and short-lived auth keys, rather than raising the duration for the whole tailnet. Pair this with the companion check in this policy that flags individual machines with key expiry disabled, since a well-chosen duration does nothing for machines exempted from it.
      audit: |
        ### Audit via Admin Console

        1. Sign in to the Tailscale admin console at login.tailscale.com/admin.
        2. Open **Settings > Device management**.
        3. Review the device key duration setting.

        A passing result shows a device key duration of 180 days or less and greater than zero; a failing result shows a longer duration or expiry disabled.

        ### Audit via API

        Query the Tailscale API and inspect the result:

        ```bash
        curl -s -u "$TAILSCALE_API_KEY:" \
          "https://api.tailscale.com/api/v2/tailnet/<tailnet>/settings"
        ```

        A passing response shows `"devicesKeyDurationDays"` set to a value between 1 and 180; a failing response shows a value above 180 or 0.
      remediation:
        - id: console
          desc: |
            **Using Tailscale Admin Console**

            1. Go to [Settings > Device management](https://login.tailscale.com/admin/settings/device-management) in the Tailscale admin console.
            2. Locate the **Key expiry** setting.
            3. Set the expiry period to 180 days or less.

            The new period applies to existing device keys. Devices whose keys are already older than the new period expire immediately and their owners must re-authenticate, so announce the change before applying it.
        - id: cli
          desc: |
            To set the device key duration via the Tailscale API:

            ```bash
            curl -s -u "$TAILSCALE_API_KEY:" \
              -H "Content-Type: application/json" \
              -X PATCH "https://api.tailscale.com/api/v2/tailnet/<tailnet>/settings" \
              --data '{ "devicesKeyDurationDays": 90 }'
            ```
        - id: terraform
          desc: |
            To cap the device key duration in Terraform, set `devices_key_duration_days` on the `tailscale_tailnet_settings` resource to a value between 1 and 180:

            ```hcl
            resource "tailscale_tailnet_settings" "example" {
              devices_key_duration_days = 90
            }
            ```
    refs:
      - url: https://tailscale.com/kb/1028/key-expiry
        title: Tailscale key expiry documentation
  - uid: mondoo-tailscale-security-devices-key-duration-capped-tailscale
    filters: asset.platform == 'tailscale'
    mql: |
      tailscale.devicesKeyDurationDays > 0 && tailscale.devicesKeyDurationDays <= 180
  - uid: mondoo-tailscale-security-devices-key-duration-capped-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "tailscale_tailnet_settings")
    mql: |
      terraform.resources("tailscale_tailnet_settings").all(
        arguments["devices_key_duration_days"] > 0 && arguments["devices_key_duration_days"] <= 180
      )
  - uid: mondoo-tailscale-security-devices-key-duration-capped-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "tailscale_tailnet_settings")
    mql: |
      terraform.plan.resourceChanges.where(type == "tailscale_tailnet_settings").all(
        change.after.devices_key_duration_days > 0 && change.after.devices_key_duration_days <= 180
      )
  - uid: mondoo-tailscale-security-devices-key-duration-capped-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "tailscale_tailnet_settings")
    mql: |
      terraform.state.resources.where(type == "tailscale_tailnet_settings").all(
        values.devices_key_duration_days > 0 && values.devices_key_duration_days <= 180
      )
  # No Terraform variants: the ACL policy is a HuJSON/JSON string in tailscale_acl.acl.
  # Asserting "no rule with src ['*'] and dst ['*:*'] and action 'accept'" requires parsing
  # the string body and is highly sensitive to formatting, comments, variable interpolation,
  # heredoc vs jsonencode(), and module references. Inspecting the raw string risks false
  # positives and false negatives, so this check stays runtime-only. The terraform remediation
  # below still shows the safe shape.
  - uid: mondoo-tailscale-security-acl-no-allow-all
    title: Ensure tailnet ACL policy does not contain blanket allow-all rules
    impact: 90
    filters: asset.platform == 'tailscale'
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-22
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-4
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      tailscale.aclPolicy.acls.none(
        _['action'] == "accept" &&
        _['src'].contains("*") &&
        _['dst'].contains("*:*")
      )
    docs:
      desc: |
        This check verifies that the tailnet ACL policy provides real segmentation, by requiring that no rule accepts traffic from every source to every destination and port.

        The ACL policy file, edited under **Access controls** in the Tailscale admin console, is the only thing that limits which machines on a tailnet can talk to which. Tailscale ships a starter policy containing a single rule with a `src` of `*` and a `dst` of `*:*`, which lets everything reach everything, and it is meant to be replaced as soon as the tailnet holds more than a handful of machines. This check requires that no `accept` rule combines a wildcard source with a wildcard destination and port.

        **Why this matters**

        With a catch-all accept rule in place, the tailnet is one flat network in which every machine can reach every port of every other machine. One phished laptop, one compromised CI runner, or one vulnerable device in a branch office, and the attacker's next hop is the database, the Kubernetes API, the SSH port on every server, and the management interface of anything a subnet router advertises. There is no internal firewall to negotiate, because the tailnet's packet filter is the internal firewall and it has been told to allow everything.

        The failure mode is quiet in a way that is easy to miss. The catch-all does not conflict with the specific rules a team adds later. It simply makes them redundant. An operator can spend a quarter building careful tag-based and group-based rules, confirm each one works, and never notice that deleting them would change nothing, because the wildcard rule already permitted the traffic. Least-privilege intent and least-privilege enforcement diverge without a single error appearing anywhere.

        Wildcards remain useful in narrower positions. A destination of `*:*` restricted to a small administrative group, or a wildcard source restricted to one service port, is a deliberate rule with bounded reach, and this check does not object to either. What it rejects is the combination that removes every boundary at once. Replace it with rules that name specific sources, destinations, and ports, and use Tailscale's policy tests to confirm intended access still works before the change lands.
      audit: |
        ### Audit via Admin Console

        1. Sign in to the Tailscale admin console at login.tailscale.com/admin.
        2. Open the **Access controls** page and the policy file editor.
        3. Inspect the `acls` section for any entry with `src` of `["*"]`, `dst` of `["*:*"]`, and `action` of `"accept"`.

        A passing result shows no blanket allow-all entry in the policy file; a failing result shows at least one catch-all accept rule.

        ### Audit via API

        Query the Tailscale API and inspect the result:

        ```bash
        curl -s -u "$TAILSCALE_API_KEY:" \
          "https://api.tailscale.com/api/v2/tailnet/<tailnet>/acl"
        ```

        A passing response shows no `acls` entry combining `"action": "accept"` with a `*` source and a `*:*` destination; a failing response includes such a catch-all rule.
      remediation:
        - id: console
          desc: |
            **Using Tailscale Admin Console**

            1. Go to the [Tailscale admin console access controls](https://login.tailscale.com/admin/acls/file).
            2. Open the policy file editor.
            3. Before removing the catch-all, add explicit per-group, per-tag, or per-service rules that grant the access each group needs, including a rule preserving administrator access to managed machines.
            4. Remove or scope down any `acls` entry whose `src` is `["*"]`, `dst` is `["*:*"]`, and `action` is `"accept"`.
            5. Use the **Preview** feature and the policy `tests` block to confirm the intended access still works. ACL changes take effect immediately on every device, and an over-tightened policy can cut off the operators applying it.
            6. Save the policy.
        - id: cli
          desc: |
            To update the ACL policy via the Tailscale API:

            ```bash
            # Fetch the current policy; the ETag response header carries the version
            curl -s -i -u "$TAILSCALE_API_KEY:" \
              "https://api.tailscale.com/api/v2/tailnet/<tailnet>/acl"

            # Validate the edited policy without applying it
            curl -s -u "$TAILSCALE_API_KEY:" \
              -H "Content-Type: application/hujson" \
              -X POST "https://api.tailscale.com/api/v2/tailnet/<tailnet>/acl/validate" \
              --data-binary @policy.hujson

            # Apply it; If-Match prevents overwriting a concurrent edit
            curl -s -u "$TAILSCALE_API_KEY:" \
              -H "Content-Type: application/hujson" \
              -H 'If-Match: "<etag>"' \
              -X POST "https://api.tailscale.com/api/v2/tailnet/<tailnet>/acl" \
              --data-binary @policy.hujson
            ```
        - id: terraform
          desc: |
            To manage the tailnet ACL in Terraform, declare a `tailscale_acl` resource whose `acl` argument is least-privilege HuJSON with no `src = ["*"]` paired with `dst = ["*:*"]` at `action = "accept"`. Use `jsonencode` so the structure is easy to review in diffs:

            ```hcl
            resource "tailscale_acl" "policy" {
              acl = jsonencode({
                tagOwners = {
                  "tag:web" = ["group:platform"]
                  "tag:db"  = ["group:platform"]
                }
                acls = [
                  {
                    action = "accept"
                    src    = ["group:platform"]
                    dst    = ["tag:web:443"]
                  },
                  {
                    action = "accept"
                    src    = ["tag:web"]
                    dst    = ["tag:db:5432"]
                  },
                ]
              })
            }
            ```
    refs:
      - url: https://tailscale.com/kb/1018/acls
        title: Tailscale ACL policy documentation
      - url: https://tailscale.com/kb/1192/tailnet-policy
        title: Writing a tailnet policy file
