  - uid: mondoo-tailscale-security-authkeys-not-reusable
    title: Ensure active pre-auth keys are not marked reusable
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-10
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-1
    variants:
      - uid: mondoo-tailscale-security-authkeys-not-reusable-tailscale
        tags:
          mondoo.com/filter-title: Tailscale Tailnet
          mondoo.com/filter-icon: tailscale
      - uid: mondoo-tailscale-security-authkeys-not-reusable-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-authkeys-not-reusable-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-tailscale-security-authkeys-not-reusable-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that pre-auth keys enroll one machine each, by requiring that no active key is marked reusable.

        A pre-auth key created under **Settings > Keys** in the admin console, or through the `tailscale_tailnet_key` resource, can be marked **Reusable**, which lets it enroll any number of machines until it expires or is revoked. A single-use key is consumed by the first machine that presents it. This check requires that no key which is still valid and unrevoked carries the reusable flag.

        **Why this matters**

        Reusability decides what a leak is worth. A single-use key that ends up in a build log or a public repository buys an attacker one node on the tailnet, and if the legitimate machine already claimed it, none at all. A reusable key in the same place buys as many nodes as the attacker cares to enroll, for as long as the key stays valid, and each one arrives as an ordinary member of the network rather than as an intrusion attempt against its edge.

        The multiplication also defeats containment. Revoking a single-use key after an incident costs nothing, because it was already spent. Revoking a reusable key means first finding every legitimate pipeline that depends on it, which is why the revocation gets postponed while the exposure continues.

        Shared keys erase provenance as well. When twenty machines enrolled with the same credential, the enrollment record cannot distinguish the one that was not supposed to be there, and the investigation falls back to correlating timestamps and hostnames from whatever the machines themselves report.

        Reusable keys are usually reached for when many machines must join unattended. The pattern that solves the same problem safely is an OAuth client that mints a fresh single-use key per enrollment, combined with tagged, ephemeral nodes that remove themselves when the workload ends. Pair this with the companion check in this policy that requires every active key to carry a finite expiration.
      audit: |
        ### Audit via Admin Console

        1. Sign in to the [Tailscale admin console](https://login.tailscale.com/admin) and open **Settings** > **Keys**.
        2. For each active key (not revoked, not invalid), inspect the **Reusable** column.

        A passing tailnet shows **Reusable: No** on every active key. A failing tailnet shows at least one active key marked **Reusable: Yes**.

        ### Audit via API

        1. Pull each key's metadata:

        ```bash
        curl -s -u "$TAILSCALE_API_KEY:" \
          "https://api.tailscale.com/api/v2/tailnet/<tailnet>/keys/<key-id>"
        ```

        A passing key returns `capabilities.devices.create.reusable: false`. A failing key returns `capabilities.devices.create.reusable: true` while `invalid` is `false` and `revoked` is unset.
      remediation:
        - id: console
          desc: |
            To replace a reusable pre-auth key:

            1. Sign in to the [Tailscale admin console](https://login.tailscale.com/admin) and open **Settings** > **Keys**.
            2. Generate a replacement key with **Reusable** disabled, keeping the **Ephemeral** and **Pre-approved** options matched to the key being replaced. If the consuming workflow truly requires many enrollments, generate the new key per job from the CI pipeline using a short-lived API access token instead of issuing one reusable key.
            3. Update consumers to fetch a fresh single-use key per enrollment, then revoke the reusable key on the same page.
        - id: cli
          desc: |
            To create a single-use pre-auth key and retire the reusable one via the Tailscale API. Devices enrolled with an ephemeral key are removed automatically when they go offline, so set `ephemeral` to `true` only for short-lived workloads such as CI runners:

            ```bash
            curl -s -u "$TAILSCALE_API_KEY:" \
              -H "Content-Type: application/json" \
              -X POST "https://api.tailscale.com/api/v2/tailnet/<tailnet>/keys" \
              --data '{
                "capabilities": {
                  "devices": { "create": { "reusable": false, "ephemeral": false, "preauthorized": true, "tags": ["tag:ci"] } }
                },
                "expirySeconds": 86400
              }'

            curl -s -u "$TAILSCALE_API_KEY:" \
              -X DELETE "https://api.tailscale.com/api/v2/tailnet/<tailnet>/keys/<old-reusable-key-id>"
            ```
        - id: terraform
          desc: |
            To declare single-use pre-auth keys in Terraform, leave `reusable` at its default of `false` or set it explicitly on `tailscale_tailnet_key`. The failure case is `reusable = true`. Set `ephemeral` to `true` only for short-lived workloads whose devices should be removed automatically when offline:

            ```hcl
            resource "tailscale_tailnet_key" "ci_job" {
              reusable      = false
              ephemeral     = true
              preauthorized = true
              expiry        = 86400
              tags          = ["tag:ci"]
            }
            ```
    refs:
      - url: https://tailscale.com/kb/1085/auth-keys
        title: Tailscale auth keys
