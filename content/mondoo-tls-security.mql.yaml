        title: SSL/TLS Deployment Best Practices
  - uid: mondoo-tls-security-no-weak-block-cipher-modes
    title: Avoid weak block cipher modes
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1040
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: tls.cipherSuites.none(cbc)
    docs:
      desc: |
        This check verifies that the server offers no cipher suite using CBC mode, in any protocol version.

        CBC suites are the ones whose names end in a bare hash rather than a mode, such as `ECDHE-RSA-AES128-SHA`. Removing them means listing only AEAD suites in the server's cipher configuration, which is `SSLCipherSuite` in Apache, `ssl_ciphers` in Nginx, and `ssl-default-bind-ciphers` in HAProxy, with `ECDHE-ECDSA-AES128-GCM-SHA256` and `ECDHE-RSA-CHACHA20-POLY1305` as typical entries.

        **Why this matters**

        CBC in TLS encrypts first and authenticates second, so the server decrypts and strips padding from data it has not yet verified. Every attack on the mode works from that ordering. An attacker on the path who replays a modified record learns from the server's response whether the padding was well formed, and that single bit of feedback, repeated, recovers plaintext byte by byte. POODLE is that attack. Lucky13 is the same attack read from response timing when the server tries to hide the error, because the message authentication code is computed over a different number of blocks depending on what the padding claimed.

        BEAST exploits the same mode from the initialization vector side, using predictable chaining in TLS 1.0 to confirm guesses about a session cookie.

        The remedy is not to patch the timing but to stop offering the mode. An AEAD suite authenticates a record before decrypting anything, so a tampered record produces one indistinguishable failure and no oracle at all.

        Removing every CBC suite does cut off clients that cannot negotiate AEAD, which in practice means Internet Explorer 11 on Windows 7 and 8.1 with RSA certificates, Android 4.x, and default-configured Java 7. Review connection logs for CBC negotiation before making the change, and enable TLS 1.3, which has no CBC suite to offer.
      audit: |
        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -cipher ECDHE-RSA-AES128-SHA
        ```

        A handshake failure means the CBC cipher suite is rejected and the check passes, while a successful handshake means it is still accepted and the check fails.

        ### Audit via nmap

        Enumerate the server's supported ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when no CBC cipher suite appears in the output, and fails if any CBC suite is listed.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Use a cipher suite that only includes AEAD modes (GCM, ChaCha20-Poly1305) and excludes CBC:

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
                SSLHonorCipherOrder on
                ```

                CBC is vulnerable to BEAST, POODLE, and padding oracle attacks. GCM and ChaCha20-Poly1305 provide authenticated encryption.

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify CBC ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -i CBC
                ```

            **Compatibility:** Removing every CBC suite blocks clients that cannot negotiate AEAD suites, including Internet Explorer 11 on Windows 7 and 8.1 with RSA certificates, Android 4.x, and Java 7 with default settings. Review connection logs for CBC usage and plan a migration window before applying this change in production.

            **Note:** Enabling TLS 1.3 automatically enforces AEAD cipher usage.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Use a cipher suite that only includes AEAD modes:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
                ssl_prefer_server_ciphers on;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify CBC ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -i CBC
                ```

            **Compatibility:** Removing every CBC suite blocks clients that cannot negotiate AEAD suites, including Internet Explorer 11 on Windows 7 and 8.1 with RSA certificates, Android 4.x, and Java 7 with default settings. Review connection logs for CBC usage and plan a migration window before applying this change in production.

            **Note:** Enabling TLS 1.3 automatically enforces AEAD cipher usage.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Use a cipher suite that only includes AEAD modes:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify CBC ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -i CBC
                ```

            **Compatibility:** Removing every CBC suite blocks clients that cannot negotiate AEAD suites, including Internet Explorer 11 on Windows 7 and 8.1 with RSA certificates, Android 4.x, and Java 7 with default settings. Review connection logs for CBC usage and plan a migration window before applying this change in production.
