        title: SSL/TLS Deployment Best Practices
  - uid: mondoo-tls-security-no-export-cipher-suites
    title: Avoid export cipher suites
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1040
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      tls.cipherSuites.none(export)
    docs:
      desc: |
        This check verifies that the server refuses export-grade cipher suites, the deliberately weakened ciphers that 1990s United States export rules once required.

        Export suites cap the effective key at 40 or 56 bits and their names contain `EXPORT`. You exclude them from the server's cipher list with `!EXPORT` appended to `SSLCipherSuite` in Apache, to `ssl_ciphers` in Nginx, or to `ssl-default-bind-ciphers` in HAProxy. Everything the server offers should use 128-bit keys or stronger.

        **Why this matters**

        A 40-bit key falls to a rented pool of cloud instances in hours, and 56 bits is not meaningfully better. An attacker who records one session and wants its contents pays for the compute and reads it afterward.

        The sharper problem is that offering these suites endangers connections that never asked for them. FREAK works because a server that still carries export RSA suites will, when asked, sign an export-strength ephemeral key with its real certificate. An attacker on the path rewrites the client hello to request the export suite, the server complies, and the attacker factors the 512-bit modulus that servers commonly reuse across many connections. They then hold the session key for a handshake the client believed was strong.

        Logjam is the same shape against Diffie-Hellman. The attacker downgrades the negotiation to export-grade parameters and completes a one-time precomputation against the small standard prime that many servers share, which reduces each individual session to a cheap final step.

        Both attacks have been demonstrated against real deployments, and both are defeated by removing the suites rather than by relying on clients to refuse them. What the client prefers does not matter if the server will still agree.
      audit: |
        ### Audit via nmap

        Enumerate the cipher suites the server offers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        A passing result shows no cipher names containing EXPORT, while a failing result lists export-grade cipher suites, typically flagged with a failing letter grade.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Add `!EXPORT` to exclude export cipher suites:

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!EXPORT:!EXPORT40:!EXPORT56
                SSLHonorCipherOrder on
                ```

                Export cipher suites use intentionally weak 40-bit or 56-bit keys and are vulnerable to attacks like FREAK and Logjam.

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify export ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -i export
                ```
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Add `!EXPORT` to exclude export cipher suites:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!EXPORT';
                ssl_prefer_server_ciphers on;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify export ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -i export
                ```
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Add `!EXPORT` to exclude export cipher suites:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!EXPORT
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify export ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -i export
                ```
