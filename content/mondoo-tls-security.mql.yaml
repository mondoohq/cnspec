  - uid: mondoo-tls-security-cert-not-revoked
    title: Do not use revoked certificates
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1557
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-4
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.certificates {
        subject.commonName
        isRevoked != true
      }
    docs:
      desc: |
        This check verifies that no certificate the server presents has been revoked by the authority that issued it.

        Revocation status is published by the issuer through an OCSP responder or a certificate revocation list, and the check reads it for each certificate in the chain. No server setting clears a revoked status. The response is to generate a new private key, request a replacement certificate, and install it, which `certbot --nginx --force-renewal -d example.com` does in one step for an ACME-issued certificate.

        **Why this matters**

        Revocation almost always means the private key is believed to be in someone else's hands. It follows a stolen backup, a key committed to a repository, a compromised host, or a mis-issuance the authority had to withdraw. A revoked certificate still in service is therefore not a paperwork problem, it is a live incident in which an attacker may hold the key that authenticates your hostname.

        With that key, an attacker who can steer traffic toward themselves through DNS, a hijacked route, or a hostile local network terminates the connection and presents a certificate the client's own checks say is yours. Nothing in the handshake distinguishes them from you. They read credentials, they modify responses, and the browser shows the same lock it always did.

        Revocation only helps clients that check it, and many do not check reliably, so continuing to serve the revoked certificate maximizes the number of users still accepting it. Clients that do check refuse the connection outright, which means the deployment is broken for some users and silently unsafe for the rest.

        Never reissue onto the same key pair. A replacement certificate signed over a key an attacker already holds recreates the exposure the revocation was meant to end.
      audit: |
        ### Audit via openssl

        Request the certificate's revocation status during the handshake with the OCSP status extension:

        ```bash
        openssl s_client -connect example.com:443 -servername example.com -status </dev/null 2>/dev/null | grep -A5 "OCSP Response"
        ```

        A passing result shows a stapled response with a certificate status of good, while a failing result shows a status of revoked. When the server staples no response, query the OCSP responder named in the certificate directly, or check the CRL endpoint for certificates issued without an OCSP URL.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Confirm revocation status. If the certificate carries an OCSP responder URL, query it; if it does not, which includes all Let's Encrypt certificates issued since May 2025, check the CRL endpoint instead:

                ```bash
                cert=/etc/ssl/certs/yourdomain.com.crt
                ocsp=$(openssl x509 -in "$cert" -noout -ocsp_uri)
                if [ -n "$ocsp" ]; then
                  openssl ocsp -no_nonce -issuer /etc/ssl/certs/yourdomain.com.issuer.crt \
                    -cert "$cert" -url "$ocsp" -resp_text 2>&1 | grep -E "Cert Status|good|revoked"
                else
                  openssl x509 -in "$cert" -noout -ext crlDistributionPoints
                fi
                ```

                When only a CRL endpoint exists, download the listed CRL and search it for your certificate's serial number.

            2. If the cert is revoked, generate a fresh new private key and request a replacement from the CA. Never reuse a compromised key:

                ```bash
                openssl req -new -newkey rsa:2048 -nodes \
                  -keyout /etc/ssl/private/yourdomain.com.key \
                  -out    /etc/ssl/yourdomain.com.csr \
                  -subj   "/CN=yourdomain.com"
                ```

                Or for Let's Encrypt:

                ```bash
                certbot --apache --force-renewal -d yourdomain.com
                ```

            3. Install the new chain and reload Apache:

                ```apache
                SSLCertificateFile      /etc/ssl/certs/yourdomain.com.fullchain.pem
                SSLCertificateKeyFile   /etc/ssl/private/yourdomain.com.key
                ```

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS
                ```

            4. If your CA still publishes OCSP responders, turn on OCSP stapling so clients can confirm revocation status without a third-party round-trip. Stapling has no effect for certificates without an OCSP URL. `SSLStaplingCache` is a server-config directive and must sit in the global scope rather than inside the `<VirtualHost>` block you edited in step 3, otherwise Apache refuses to start with `SSLStaplingCache cannot occur within <VirtualHost> section`:

                ```apache
                # Global scope, outside every <VirtualHost>
                SSLUseStapling          on
                SSLStaplingCache        shmcb:/run/ocsp(128000)
                SSLStaplingResponderTimeout 5
                ```

            5. Investigate why the cert was revoked. If a private key compromise is suspected, audit access to the host and rotate any related secrets before bringing the new cert online.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Confirm revocation status. If the certificate carries an OCSP responder URL, query it; if it does not, which includes all Let's Encrypt certificates issued since May 2025, check the CRL endpoint instead:

                ```bash
                cert=/etc/ssl/certs/yourdomain.com.crt
                ocsp=$(openssl x509 -in "$cert" -noout -ocsp_uri)
                if [ -n "$ocsp" ]; then
                  openssl ocsp -no_nonce -issuer /etc/ssl/certs/yourdomain.com.issuer.crt \
                    -cert "$cert" -url "$ocsp" -resp_text 2>&1 | grep -E "Cert Status|good|revoked"
                else
                  openssl x509 -in "$cert" -noout -ext crlDistributionPoints
                fi
                ```

                When only a CRL endpoint exists, download the listed CRL and search it for your certificate's serial number.

            2. If the cert is revoked, generate a fresh new private key and request a replacement from the CA. Never reuse a compromised key:

                ```bash
                openssl req -new -newkey rsa:2048 -nodes \
                  -keyout /etc/ssl/private/yourdomain.com.key \
                  -out    /etc/ssl/yourdomain.com.csr \
                  -subj   "/CN=yourdomain.com"
                ```

                Or for Let's Encrypt:

                ```bash
                certbot --nginx --force-renewal -d yourdomain.com
                ```

            3. Install the new full chain and reload Nginx:

                ```nginx
                ssl_certificate     /etc/ssl/certs/yourdomain.com.fullchain.pem;
                ssl_certificate_key /etc/ssl/private/yourdomain.com.key;
                ```

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. If your CA still publishes OCSP responders, turn on OCSP stapling. The `ssl_trusted_certificate` file must contain the issuing CA so Nginx can validate the response. Stapling has no effect for certificates without an OCSP URL:

                ```nginx
                ssl_stapling          on;
                ssl_stapling_verify   on;
                ssl_trusted_certificate /etc/ssl/certs/yourdomain.com.issuer.crt;
                resolver              1.1.1.1 8.8.8.8 valid=300s;
                resolver_timeout      5s;
                ```

            5. Investigate why the cert was revoked. If a private key compromise is suspected, audit access to the host and rotate any related secrets before bringing the new cert online.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Confirm revocation status. If the certificate carries an OCSP responder URL, query it; if it does not, which includes all Let's Encrypt certificates issued since May 2025, check the CRL endpoint instead:

                ```bash
                cert=/etc/haproxy/certs/yourdomain.com.pem
                ocsp=$(openssl x509 -in "$cert" -noout -ocsp_uri)
                if [ -n "$ocsp" ]; then
                  openssl ocsp -no_nonce -issuer /etc/haproxy/certs/yourdomain.com.issuer.pem \
                    -cert "$cert" -url "$ocsp" -resp_text 2>&1 | grep -E "Cert Status|good|revoked"
                else
                  openssl x509 -in "$cert" -noout -ext crlDistributionPoints
                fi
                ```

                When only a CRL endpoint exists, download the listed CRL and search it for your certificate's serial number.

            2. If the cert is revoked, generate a fresh new private key and request a replacement from the CA. Never reuse a compromised key. For Let's Encrypt:

                ```bash
                certbot certonly --standalone --force-renewal -d yourdomain.com
                ```

            3. Rebuild HAProxy's combined PEM with the chain followed by the key, and reload:

                ```bash
                cat /etc/letsencrypt/live/yourdomain.com/fullchain.pem \
                    /etc/letsencrypt/live/yourdomain.com/privkey.pem \
                    > /etc/haproxy/certs/yourdomain.com.pem
                chmod 0600 /etc/haproxy/certs/yourdomain.com.pem
                haproxy -c -f /etc/haproxy/haproxy.cfg
                systemctl reload haproxy
                ```

            4. If your CA still publishes OCSP responders, enable OCSP stapling. On HAProxy 2.8 and newer, let HAProxy refresh the response automatically with `ocsp-update on` in a crt-list. On older releases, generate the sibling `.ocsp` file yourself and refresh it from a renew hook:

                ```bash
                openssl ocsp -no_nonce -respout /etc/haproxy/certs/yourdomain.com.pem.ocsp \
                  -issuer /etc/haproxy/certs/yourdomain.com.issuer.pem \
                  -cert /etc/haproxy/certs/yourdomain.com.pem \
                  -url "$(openssl x509 -in /etc/haproxy/certs/yourdomain.com.pem -noout -ocsp_uri)"
                systemctl reload haproxy
                ```

            5. Investigate why the cert was revoked. If a private key compromise is suspected, audit access to the host and rotate any related secrets before bringing the new cert online.
