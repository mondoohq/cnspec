        title: SSL/TLS Deployment Best Practices
  - uid: mondoo-tls-security-no-diffie-hellman-cipher-suites
    title: Avoid anonymous Diffie-Hellman suites
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1557
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      tls.cipherSuites.none(anonymous)
    docs:
      desc: |
        This check verifies that the server refuses anonymous Diffie-Hellman cipher suites, so every handshake authenticates the server before a key is agreed.

        An anonymous suite performs the key exchange with no certificate at all, and its name carries `ADH` or `DH_anon`. You exclude the family in the server's cipher list by appending `!ADH:!aNULL` to `SSLCipherSuite` in Apache, to `ssl_ciphers` in Nginx, or to `ssl-default-bind-ciphers` in HAProxy.

        **Why this matters**

        Encryption without authentication protects nothing against an attacker who is on the path rather than merely listening. If a client will accept an anonymous suite, an attacker sitting on the network answers the handshake themselves, agrees a key with the client, opens a second connection to the real server, and relays every request and response between the two. Both ends see a working encrypted session. The attacker sees the plaintext and can change it before passing it on.

        Ordinary interception needs a certificate the client will trust, which means compromising a certificate authority or getting a fraudulent issuance past the transparency logs. An anonymous suite removes that requirement completely. There is no certificate to forge because the protocol never asks for one, so the attack costs nothing beyond a position on the path.

        These suites exist for narrow cases where the parties authenticate at another layer, and no browser or ordinary client will negotiate them today. On an internet-facing server they are dead configuration, present because a default cipher string was never narrowed. Leaving them offered gives an attacker who can influence negotiation a route that skips the entire public key infrastructure the rest of your TLS setup rests on.
      audit: |
        ### Audit via nmap

        Enumerate the cipher suites the server offers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        A passing result shows no anonymous cipher names containing DH_anon or ADH, while a failing result lists anonymous Diffie-Hellman suites, which indicates unauthenticated key exchange is accepted.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Add `!ADH` and `!aNULL` to exclude anonymous Diffie-Hellman cipher suites:

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!ADH:!aNULL
                SSLHonorCipherOrder on
                ```

                Anonymous Diffie-Hellman (ADH) performs key exchange without server authentication, making it vulnerable to man-in-the-middle attacks.

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify anonymous DH ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "anon|ADH"
                ```
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Add `!ADH` and `!aNULL` to exclude anonymous Diffie-Hellman cipher suites:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!ADH:!aNULL';
                ssl_prefer_server_ciphers on;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify anonymous DH ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "anon|ADH"
                ```
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Add `!ADH` and `!aNULL` to exclude anonymous Diffie-Hellman cipher suites:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!ADH:!aNULL
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify anonymous DH ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "anon|ADH"
                ```
