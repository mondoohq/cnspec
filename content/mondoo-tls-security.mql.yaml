policies:
  - uid: mondoo-tls-security
    name: Mondoo TLS/SSL Security
    version: 1.8.0
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: host
    require:
      - provider: network
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure TLS/SSL certificates, ciphers, and protocols
    docs:
      desc: |
        The Mondoo TLS/SSL Security policy identifies weak or misconfigured TLS/SSL settings that could expose encrypted communications to interception, downgrade, and tampering. This policy helps organizations detect and remediate cryptographic weaknesses before attackers can exploit them in man-in-the-middle attacks to eavesdrop on sensitive data or inject malicious content into encrypted connections.

        This policy provides security checks across key TLS/SSL configuration areas:

        - TLS protocol versions and deprecation of insecure releases
        - Cipher suite strength and forward secrecy
        - Certificate validity, chain, and key strength
        - Key exchange mechanisms
        - Protection against known vulnerabilities such as BEAST, POODLE, and downgrade attacks

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Secure TLS/SSL connection
        filters: |
          asset.platform == 'host' && tls.params != empty
        checks:
          - uid: mondoo-tls-security-ciphers-include-aead-ciphers
          - uid: mondoo-tls-security-ciphers-include-pfs
          - uid: mondoo-tls-security-mitigate-beast
          - uid: mondoo-tls-security-no-diffie-hellman-cipher-suites
          - uid: mondoo-tls-security-no-export-cipher-suites
          - uid: mondoo-tls-security-no-null-cipher-suites
          - uid: mondoo-tls-security-no-old-cipher-suites
          - uid: mondoo-tls-security-no-rc4-ciphers
          - uid: mondoo-tls-security-no-rsa-key-exchange
          - uid: mondoo-tls-security-no-weak-block-cipher-modes
          - uid: mondoo-tls-security-no-weak-block-ciphers
          - uid: mondoo-tls-security-no-weak-tls-versions
          - uid: mondoo-tls-security-tls13-supported
          - uid: mondoo-tls-security-no-sni-certificate-leak
      - title: Valid TLS/SSL certificate
        filters: |
          asset.platform == 'host' && tls.params != empty
        checks:
          - uid: mondoo-tls-security-cert-domain-name-match
          - uid: mondoo-tls-security-cert-is-valid
          - uid: mondoo-tls-security-cert-no-cert-expired
          - uid: mondoo-tls-security-cert-no-certs-expired
          - uid: mondoo-tls-security-cert-no-weak-signature
          - uid: mondoo-tls-security-cert-not-revoked
          - uid: mondoo-tls-security-cert-not-self-signed
          - uid: mondoo-tls-security-cert-chain-verified
          - uid: mondoo-tls-security-cert-ocsp-configured
    scoring_system: highest impact
queries:
  - uid: mondoo-tls-security-cert-domain-name-match
    title: Certificate's domain name must match
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1557
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: owasp-asvs-5-12-2-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.certificateMatchesDomain
    docs:
      desc: |
        This check verifies that the certificate the server presents actually covers the hostname the client asked for, through the common name or a subject alternative name entry.

        Current clients match against the subject alternative name list only, so every hostname a service answers on has to appear there. You set it when the certificate is requested. `certbot --nginx -d example.com -d www.example.com` adds one name per flag, and a manually built certificate signing request needs each name listed in its SAN extension.

        **Why this matters**

        The hostname match is the step where TLS stops being encryption and becomes authentication. A certificate proves that its holder controls the names inside it, and nothing more. If a client accepted a valid certificate for some other name, an attacker holding any legitimate certificate for any domain they own could present it and terminate your users' sessions. Hostname verification is what makes that fail.

        The consequence of a mismatch, then, is not that the connection becomes insecure by itself, but that users are trained to make it insecure. Browsers show a warning page and users click through it, because they have learned the warning usually means a certificate somebody forgot to renew. Once clicking through is normal on your site, an attacker on the path presents a self-signed certificate for the same host and collects the same click, and from that point the session really is being read and rewritten.

        Non-browser clients fail differently and more usefully. Mobile applications, API callers, and job runners reject the connection outright, so a mismatch surfaces as an outage rather than as a warning, often in an integration nobody retested after the certificate changed.

        A mismatch is usually a deployment error, a certificate copied to the wrong host or a new hostname added to a service without being added to the certificate. Correcting it removes the misconfiguration and the training effect together.
      audit: |
        ### Audit via openssl

        Inspect the certificate the server returns for a given hostname with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -servername example.com 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName
        ```

        A passing result shows the requested hostname in the Common Name or in the Subject Alternative Name list, while a failing result shows a certificate whose names do not cover the hostname.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Confirm what the certificate currently covers:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -text \
                  | grep -EA1 "Subject:|Subject Alternative Name"
                ```

            2. Issue a certificate that lists every domain you serve in the Subject Alternative Name (SAN) extension. Certbot can request and install the cert directly into Apache:

                ```bash
                apt install certbot python3-certbot-apache       # Debian/Ubuntu
                yum install certbot python3-certbot-apache       # RHEL/CentOS
                certbot --apache -d yourdomain.com -d www.yourdomain.com
                ```

            3. Or, if you manage cert files manually, point Apache at the new chain and reload:

                ```apache
                SSLCertificateFile      /etc/letsencrypt/live/yourdomain.com/fullchain.pem
                SSLCertificateKeyFile   /etc/letsencrypt/live/yourdomain.com/privkey.pem
                ```

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS
                ```

            4. Verify the SAN list now includes your domain by re-running the OpenSSL command from step 1.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Confirm what the certificate currently covers:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -text \
                  | grep -EA1 "Subject:|Subject Alternative Name"
                ```

            2. Issue a certificate that lists every domain you serve in the Subject Alternative Name (SAN) extension. Certbot can request and install the cert directly into Nginx:

                ```bash
                apt install certbot python3-certbot-nginx        # Debian/Ubuntu
                yum install certbot python3-certbot-nginx        # RHEL/CentOS
                certbot --nginx -d yourdomain.com -d www.yourdomain.com
                ```

            3. Or, if you manage cert files manually, point Nginx at the new chain and reload:

                ```nginx
                ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
                ```

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify the SAN list now includes your domain by re-running the OpenSSL command from step 1.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Confirm what the certificate currently covers:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -text \
                  | grep -EA1 "Subject:|Subject Alternative Name"
                ```

            2. Issue a certificate that lists every domain you serve in the SAN extension. Certbot can issue a standalone cert for HAProxy:

                ```bash
                apt install certbot                              # Debian/Ubuntu
                yum install certbot                              # RHEL/CentOS
                certbot certonly --standalone -d yourdomain.com -d www.yourdomain.com
                ```

            3. HAProxy expects a single PEM file with the certificate chain followed by the private key. Build it and point `bind` at it:

                ```bash
                cat /etc/letsencrypt/live/yourdomain.com/fullchain.pem \
                    /etc/letsencrypt/live/yourdomain.com/privkey.pem \
                    > /etc/haproxy/certs/yourdomain.com.pem
                chmod 0600 /etc/haproxy/certs/yourdomain.com.pem
                ```

                ```haproxy
                frontend https-in
                    bind *:443 ssl crt /etc/haproxy/certs/yourdomain.com.pem
                ```

                ```bash
                haproxy -c -f /etc/haproxy/haproxy.cfg
                systemctl reload haproxy
                ```

            4. Verify the SAN list now includes your domain by re-running the OpenSSL command from step 1.
    refs:
      - url: https://www.ssllabs.com/projects/best-practices/
        title: SSL/TLS Deployment Best Practices
      - url: https://datatracker.ietf.org/doc/html/rfc8446
        title: TLS 1.3 RFC 8446
  - uid: mondoo-tls-security-cert-is-valid
    title: Certificate is valid
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-15
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: owasp-asvs-5-12-2-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.certificates.first {
        subject.commonName
        notBefore < time.now
        notAfter > time.now
        // 398 days is the strictest cap every currently trusted public cert can
        // satisfy: CA/Browser Forum ballot SC-081 lowered new issuance to 200
        // days in March 2026, but 398-day certs issued before that date stay
        // valid into 2027. Tighten to 200*time.day once those expire (after
        // April 2027), and to 100*time.day after the 200-day generation ages
        // out following the March 2027 issuance change.
        notAfter - notBefore < 398*time.day
      }
    docs:
      desc: |
        This check verifies that the leaf certificate is inside its validity window today and was issued for a total lifetime shorter than 398 days.

        The window is fixed at issuance and cannot be edited afterward, so the remedy is always to reissue. The check reads the notBefore and notAfter dates from the certificate the server presents and requires notBefore in the past, notAfter in the future, and fewer than 398 days between them. That ceiling reflects what publicly trusted issuance still allows: certificates issued from March 2026 are capped at 200 days, and the cap falls again to 100 days in March 2027, which makes automated issuance and renewal the only sustainable arrangement.

        **Why this matters**

        An expired or not-yet-valid certificate is an immediate outage. Every client rejects it, there is no partial degradation, and the failure arrives at the same moment for everyone. Browser users see a warning page, and the ones who click through are now in the habit of accepting whatever certificate is offered, including the one an attacker substitutes later.

        An overlong lifetime is a different problem. The lifetime is the maximum time a compromised key stays useful when revocation does not reach the client, and revocation frequently does not, because some clients fail open when they cannot fetch status and some never check at all. A key stolen from a server holding a five-year certificate lets an attacker impersonate that host for years, whereas a short-lived certificate expires the stolen credential on its own. That reasoning is behind the industry moving the cap down, and it is also why browsers reject anything issued for longer than the current limit regardless of what the authority was willing to sign.

        Automate renewal so the validity window is never the thing standing between you and an outage.
      audit: |
        ### Audit via openssl

        Inspect the certificate's validity dates with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -servername example.com 2>/dev/null | openssl x509 -noout -dates
        ```

        A passing result shows a notBefore date in the past, a notAfter date in the future, and a span between them under 398 days, while a failing result shows a window that is not yet open, already closed, or longer than 398 days.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Check the certificate's validity window and chain trust:

                ```bash
                openssl s_client -connect yourdomain.com:443 -servername yourdomain.com </dev/null 2>/dev/null \
                  | openssl x509 -noout -dates
                openssl s_client -connect yourdomain.com:443 </dev/null 2>&1 \
                  | grep "Verify return code"
                ```

            2. Issue a new certificate from a publicly trusted CA. CA/Browser Forum rules cap publicly trusted leaf certificates issued on or after March 15, 2026 at 200 days, and the cap drops to 100 days in March 2027, so automated issuance is the sustainable approach. For example, use Let's Encrypt via Certbot's Apache plugin:

                ```bash
                certbot --apache -d yourdomain.com -d www.yourdomain.com
                ```

            3. If you manage cert files manually, point Apache at the full chain, which is the server certificate followed by the intermediates:

                ```apache
                SSLCertificateFile      /etc/letsencrypt/live/yourdomain.com/fullchain.pem
                SSLCertificateKeyFile   /etc/letsencrypt/live/yourdomain.com/privkey.pem
                ```

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS
                ```

            4. Re-run the commands in step 1. The notBefore date must be in the past, the notAfter date in the future with a total span under 398 days, and `Verify return code: 0 (ok)` confirms the chain is trusted.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Check the certificate's validity window and chain trust:

                ```bash
                openssl s_client -connect yourdomain.com:443 -servername yourdomain.com </dev/null 2>/dev/null \
                  | openssl x509 -noout -dates
                openssl s_client -connect yourdomain.com:443 </dev/null 2>&1 \
                  | grep "Verify return code"
                ```

            2. Issue a new certificate from a publicly trusted CA. CA/Browser Forum rules cap publicly trusted leaf certificates issued on or after March 15, 2026 at 200 days, and the cap drops to 100 days in March 2027, so automated issuance is the sustainable approach. For example, use Let's Encrypt via Certbot's Nginx plugin:

                ```bash
                certbot --nginx -d yourdomain.com -d www.yourdomain.com
                ```

            3. If you manage cert files manually, point Nginx at the full chain:

                ```nginx
                ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
                ```

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Re-run the commands in step 1. The notBefore date must be in the past, the notAfter date in the future with a total span under 398 days, and `Verify return code: 0 (ok)` confirms the chain is trusted.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Check the certificate's validity window and chain trust:

                ```bash
                openssl s_client -connect yourdomain.com:443 -servername yourdomain.com </dev/null 2>/dev/null \
                  | openssl x509 -noout -dates
                openssl s_client -connect yourdomain.com:443 </dev/null 2>&1 \
                  | grep "Verify return code"
                ```

            2. Issue a new certificate from a publicly trusted CA. CA/Browser Forum rules cap publicly trusted leaf certificates issued on or after March 15, 2026 at 200 days, and the cap drops to 100 days in March 2027, so automated issuance is the sustainable approach. For example, use Let's Encrypt in standalone mode:

                ```bash
                certbot certonly --standalone -d yourdomain.com -d www.yourdomain.com
                ```

            3. HAProxy needs the chain followed by the private key in a single PEM:

                ```bash
                cat /etc/letsencrypt/live/yourdomain.com/fullchain.pem \
                    /etc/letsencrypt/live/yourdomain.com/privkey.pem \
                    > /etc/haproxy/certs/yourdomain.com.pem
                chmod 0600 /etc/haproxy/certs/yourdomain.com.pem
                ```

                ```haproxy
                frontend https-in
                    bind *:443 ssl crt /etc/haproxy/certs/yourdomain.com.pem
                ```

                ```bash
                haproxy -c -f /etc/haproxy/haproxy.cfg
                systemctl reload haproxy
                ```

            4. Re-run the commands in step 1. The notBefore date must be in the past, the notAfter date in the future with a total span under 398 days, and `Verify return code: 0 (ok)` confirms the chain is trusted.
