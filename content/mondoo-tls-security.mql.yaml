        title: SSL/TLS Deployment Best Practices
  - uid: mondoo-tls-security-no-weak-block-ciphers
    title: Avoid weak block ciphers
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1040
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: tls.cipherSuites.none(encryption == /des|rc2|idea/i)
    docs:
      desc: |
        This check verifies that the server offers no cipher suite built on DES, 3DES, RC2, or IDEA.

        These are the pre-AES block ciphers, and their suite names carry `DES-CBC3-SHA`, `RC2`, or `IDEA`. Exclude them from the server's cipher list with `!DES:!3DES:!RC2:!IDEA` appended to `SSLCipherSuite` in Apache, to `ssl_ciphers` in Nginx, or to `ssl-default-bind-ciphers` in HAProxy.

        **Why this matters**

        Single DES has a 56-bit key. Purpose-built hardware and rented cloud capacity recover one in hours for a few hundred dollars, so an attacker who captures a session encrypted this way decrypts it as a matter of budget rather than of skill.

        3DES survives the key length problem and fails on block size instead. Its 64-bit block means that after roughly 32 gigabytes sent under one key, a collision between ciphertext blocks becomes likely, and each collision reveals the exclusive-or of two plaintext blocks. Sweet32 turns that into a working attack: the attacker keeps a long-lived connection busy with requests from the victim's browser, waits for collisions to accumulate, and reads out the secret that repeats in every request, which is the session cookie.

        RC2 has published related-key attacks and a security margin nobody would accept for new work, and IDEA is obsolete, unmaintained in current libraries and offering nothing AES does not do better.

        None of these ciphers is needed by any client that will reach an internet-facing service today. Their presence in a cipher list is almost always inherited from a default string that was never trimmed. Replace them with AES-GCM or ChaCha20-Poly1305.
      audit: |
        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -cipher DES-CBC3-SHA
        ```

        A handshake failure means the weak block cipher is rejected and the check passes, while a successful handshake means it is still accepted and the check fails.

        ### Audit via nmap

        Enumerate the server's supported ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when no cipher containing DES, RC2, or IDEA appears in the output, and fails if any such cipher is listed.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Add exclusions for weak block ciphers:

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!DES:!3DES:!RC2:!IDEA
                SSLHonorCipherOrder on
                ```

                Why these ciphers are weak:
                - **DES**: Uses only a 56-bit key, easily brute-forced
                - **3DES**: Vulnerable to the Sweet32 attack
                - **RC2**: Outdated with known weaknesses
                - **IDEA**: Obsolete and no longer considered secure

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify weak ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "DES|RC2|IDEA"
                ```
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Add exclusions for weak block ciphers:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!DES:!3DES:!RC2:!IDEA';
                ssl_prefer_server_ciphers on;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify weak ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "DES|RC2|IDEA"
                ```
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Add exclusions for weak block ciphers:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!DES:!3DES:!RC2:!IDEA
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify weak ciphers are disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "DES|RC2|IDEA"
                ```
