        title: SSL/TLS Deployment Best Practices
  - uid: mondoo-tls-security-no-weak-tls-versions
    title: Avoid weak SSL and TLS versions
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1557
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.versions.containsOnly(["tls1.2", "tls1.3"])
    docs:
      desc: |
        This check verifies that the server negotiates only TLS 1.2 and TLS 1.3, and refuses SSL 2.0, SSL 3.0, TLS 1.0, and TLS 1.1.

        The accepted versions come from a single directive: `SSLProtocol -all +TLSv1.2 +TLSv1.3` in Apache, `ssl_protocols TLSv1.2 TLSv1.3` in Nginx, `ssl-min-ver TLSv1.2` in HAProxy, and on an AWS Application Load Balancer the listener security policy, where `ELBSecurityPolicy-TLS13-1-2-2021-06` or newer offers only these two.

        **Why this matters**

        Each retired version carries a decryption attack its own design cannot close. SSL 3.0 falls to POODLE, where an attacker on the path replays a modified record and recovers a byte of the session cookie every few hundred attempts, because SSL 3.0 padding is not covered by the message authentication code. TLS 1.0 falls to BEAST, where predictable block chaining lets the attacker confirm guesses about the same cookie. TLS 1.1 is not individually broken but carries the same construction set and no authenticated encryption.

        Leaving an old version enabled does not merely serve old clients, it exposes current ones. Version negotiation starts with the client proposing its best and the server answering, and an attacker who controls the path edits that proposal downward. A browser that would have used TLS 1.3 completes the handshake on TLS 1.0 instead, and the attacker then runs the attack that version permits. The floor you configure is the floor for everybody, not only for the stragglers.

        Raising it does cut off genuinely old clients: Android 4.3 and earlier, Internet Explorer 10 and earlier, default-configured Java 7, and many embedded and point-of-sale devices. Review connection logs for legacy protocol use and plan a migration window before applying the change in production. A minimum of TLS 1.2 is also the floor that current industry baselines require.
      audit: |
        ### Audit via nmap

        Enumerate the protocol versions the server accepts:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        A passing result lists only TLSv1.2 and TLSv1.3 sections, while a failing result shows SSLv2, SSLv3, TLSv1.0, or TLSv1.1 sections in the output.

        ### Audit via openssl

        Test whether the server accepts a specific weak protocol version with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -tls1_1
        ```

        A passing result is a failed handshake, while a failing result completes the handshake, which confirms TLS 1.1 is still accepted.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Add or modify the `SSLProtocol` directive to disable weak protocols:

                ```apache
                SSLProtocol -all +TLSv1.2 +TLSv1.3
                ```

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify the configuration:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1   # Should fail
                openssl s_client -connect yourdomain.com:443 -tls1_2 # Should succeed
                ```

            **Compatibility:** Disabling TLS 1.0 and TLS 1.1 blocks legacy clients such as Android 4.3 and earlier, Internet Explorer 10 and earlier, Java 7 and earlier with default settings, and many older embedded or point-of-sale devices. Review connection logs for legacy protocol usage and plan a migration window before applying this change in production.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file under `/etc/nginx/sites-available/`).

            2. Inside the `server` block (or `http` block for global settings), add or modify:

                ```nginx
                ssl_protocols TLSv1.2 TLSv1.3;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify the configuration:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1   # Should fail
                openssl s_client -connect yourdomain.com:443 -tls1_2 # Should succeed
                ```

            **Compatibility:** Disabling TLS 1.0 and TLS 1.1 blocks legacy clients such as Android 4.3 and earlier, Internet Explorer 10 and earlier, Java 7 and earlier with default settings, and many older embedded or point-of-sale devices. Review connection logs for legacy protocol usage and plan a migration window before applying this change in production.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. In the `global` section, add:

                ```haproxy
                ssl-default-bind-options ssl-min-ver TLSv1.2
                ```

                `ssl-default-bind-options` is a `global` keyword and sets the default for every `bind` line. To raise the floor on one frontend instead, put the `ssl-min-ver` option directly on that `bind` line:

                ```haproxy
                frontend https-in
                    bind *:443 ssl crt /etc/haproxy/certs/yourdomain.com.pem ssl-min-ver TLSv1.2
                ```

                The two keywords are not interchangeable. `ssl-default-bind-options` on a `bind` line makes HAProxy refuse to start with `unknown keyword 'ssl-default-bind-options'`.

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            **Compatibility:** Disabling TLS 1.0 and TLS 1.1 blocks legacy clients such as Android 4.3 and earlier, Internet Explorer 10 and earlier, Java 7 and earlier with default settings, and many older embedded or point-of-sale devices. Review connection logs for legacy protocol usage and plan a migration window before applying this change in production.
        - id: aws-alb
          desc: |
            **Using AWS Application Load Balancer**

            1. Open the AWS Management Console and navigate to EC2 > Load Balancers.

            2. Select your Application Load Balancer and go to the Listeners tab.

            3. Edit the HTTPS listener and change the Security Policy to `ELBSecurityPolicy-TLS13-1-2-2021-06` or a newer policy that only supports TLS 1.2 and TLS 1.3.

            4. Save the changes. The update takes effect immediately without requiring a restart.

            **Using AWS CLI:**

            ```bash
            aws elbv2 modify-listener --listener-arn <listener-arn> \
              --ssl-policy ELBSecurityPolicy-TLS13-1-2-2021-06
            ```

            **Compatibility:** Disabling TLS 1.0 and TLS 1.1 blocks legacy clients such as Android 4.3 and earlier, Internet Explorer 10 and earlier, Java 7 and earlier with default settings, and many older embedded or point-of-sale devices. Review connection logs for legacy protocol usage and plan a migration window before applying this change in production.
        - id: iis
          desc: |
            **Using IIS (Windows Server)**

            **Option 1: Using IIS Crypto (Recommended)**

            1. Download and run IIS Crypto from Nartac Software (https://www.nartac.com/Products/IISCrypto).

            2. Click "Best Practices" or manually uncheck SSL 2.0, SSL 3.0, TLS 1.0, and TLS 1.1.

            3. Ensure TLS 1.2 and TLS 1.3 are checked.

            4. Click "Apply" and reboot the server.

            **Option 2: Manual Registry Configuration**

            1. Open Registry Editor (`regedit.exe`) as Administrator.

            2. Navigate to `HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\`.

            3. For each protocol to disable (SSL 2.0, SSL 3.0, TLS 1.0, TLS 1.1), create the following structure:

                ```text
                [Protocol Name]\Server\Enabled = 0 (DWORD)
                [Protocol Name]\Server\DisabledByDefault = 1 (DWORD)
                [Protocol Name]\Client\Enabled = 0 (DWORD)
                [Protocol Name]\Client\DisabledByDefault = 1 (DWORD)
                ```

            4. Restart the server:

                ```powershell
                Restart-Computer
                ```

            **Compatibility:** Disabling TLS 1.0 and TLS 1.1 blocks legacy clients such as Android 4.3 and earlier, Internet Explorer 10 and earlier, Java 7 and earlier with default settings, and many older embedded or point-of-sale devices. Review connection logs for legacy protocol usage and plan a migration window before applying this change in production.
