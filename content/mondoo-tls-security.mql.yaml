      - url: https://www.ssllabs.com/projects/best-practices/
        title: SSL/TLS Deployment Best Practices
  - uid: mondoo-tls-security-cert-no-cert-expired
    title: Certificate is not near expiration or expired
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-17
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: owasp-asvs-5-12-2-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.certificates.first.subject.commonName
      switch {
        case tls.certificates.first.expiresIn.days > 30: score(100);
        case tls.certificates.first.expiresIn.days > 21: score(50);
        case tls.certificates.first.expiresIn.days > 14: score(20);
        case tls.certificates.first.expiresIn.days > 7: score(9);
        default: score(0);
      }
    docs:
      desc: |
        This check verifies that the leaf certificate has enough validity left that renewal is still a planned activity rather than an incident.

        Scoring degrades as expiry approaches instead of flipping at a single line. More than 30 days remaining scores full marks, more than 21 days scores half, more than 14 days scores lower still, more than 7 days lower again, and 7 days or fewer scores zero. Renewal is the fix, and it belongs to whatever issues the certificate: `certbot renew` driven by the `certbot.timer` systemd unit, a cloud certificate manager, or cert-manager in a cluster.

        **Why this matters**

        Certificate expiry is one of the few outages that arrives on a published schedule and still takes services down. When the date passes, every client refuses the connection at once. Browsers show a warning page, mobile applications and API callers fail outright, and health checks that speak TLS start failing alongside the traffic they were meant to watch, which removes the signal you would have used to diagnose it.

        The security consequence follows from how people respond. An expiry is handled under time pressure, often at night, frequently by whoever is on call rather than by whoever owns the certificate. Keys get generated in a hurry and left in a home directory, private keys get copied between hosts over channels nobody would approve in daylight, and verification steps get skipped. Users, meanwhile, are being shown a certificate warning on your domain and told by support to click through it, which is exactly the behavior an attacker on the path needs in order to substitute their own certificate later.

        The graded scoring exists so the work lands in the first band rather than the last. Treat any score below full marks as the renewal ticket, not as a warning to acknowledge.
      audit: |
        ### Audit via openssl

        Check how much validity remains on the leaf certificate with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -servername example.com 2>/dev/null | openssl x509 -noout -enddate
        ```

        A passing result shows a notAfter date comfortably more than 30 days in the future, while a failing result shows a date that is near or already past.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Check the certificate's expiration date:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -enddate
                ```

            2. Renew now, then load the new cert. With Certbot's Apache plugin:

                ```bash
                certbot renew --deploy-hook "systemctl reload apache2"
                ```

                Or, after renewing manually, reload Apache so it picks up the new files:

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS
                ```

            3. Make renewal automatic. Certbot ships a `certbot.timer` systemd unit that runs `certbot renew` twice daily; ensure it is enabled:

                ```bash
                systemctl enable --now certbot.timer
                systemctl list-timers certbot.timer
                ```

            4. Watch for expiry. Set up monitoring (Nagios/Zabbix/Prometheus blackbox exporter, or a cloud certificate manager) and alert at 30/14/7 days remaining.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Check the certificate's expiration date:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -enddate
                ```

            2. Renew now, then load the new cert. With Certbot's Nginx plugin:

                ```bash
                certbot renew --deploy-hook "systemctl reload nginx"
                ```

                Or, after renewing manually, reload Nginx so it picks up the new files:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            3. Make renewal automatic. Certbot ships a `certbot.timer` systemd unit that runs `certbot renew` twice daily; ensure it is enabled:

                ```bash
                systemctl enable --now certbot.timer
                systemctl list-timers certbot.timer
                ```

            4. Watch for expiry. Set up monitoring (Nagios/Zabbix/Prometheus blackbox exporter, or a cloud certificate manager) and alert at 30/14/7 days remaining.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Check the certificate's expiration date:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -enddate
                ```

            2. Renew the leaf cert and rebuild HAProxy's combined PEM (chain + key). With Certbot in `--standalone` mode, use a deploy hook to recombine and reload:

                ```bash
                certbot renew --deploy-hook '/usr/local/sbin/haproxy-reload.sh'
                ```

                Where `/usr/local/sbin/haproxy-reload.sh` (chmod 0755) does:

                ```bash
                #!/bin/bash
                set -e
                cat /etc/letsencrypt/live/yourdomain.com/fullchain.pem \
                    /etc/letsencrypt/live/yourdomain.com/privkey.pem \
                    > /etc/haproxy/certs/yourdomain.com.pem
                chmod 0600 /etc/haproxy/certs/yourdomain.com.pem
                systemctl reload haproxy
                ```

            3. Make renewal automatic. Ensure Certbot's systemd timer is enabled so the deploy hook fires before expiry:

                ```bash
                systemctl enable --now certbot.timer
                ```

            4. Watch for expiry. Set up monitoring (Nagios/Zabbix/Prometheus blackbox exporter, or a cloud certificate manager) and alert at 30/14/7 days remaining.
    refs:
      - url: https://www.ssllabs.com/projects/best-practices/
        title: SSL/TLS Deployment Best Practices
  - uid: mondoo-tls-security-cert-no-certs-expired
    title: None of the certificates (intermediate or root) have expired
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-17
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: owasp-asvs-5-12-2-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.certificates {
        subject.commonName
        expiresIn.days > 0
      }
    docs:
      desc: |
        This check verifies that every certificate the server presents is still inside its validity period, not only the leaf but each intermediate in the chain it sends.

        The chain is a file you assemble and point the server at: `SSLCertificateFile` in Apache, `ssl_certificate` in Nginx, and the combined PEM named on HAProxy's `bind` line, each holding the leaf followed by its intermediates. An expired intermediate is fixed by fetching the current bundle from the certificate authority and rebuilding that file, not by renewing the leaf.

        **Why this matters**

        Client validation walks the whole chain, so an expired intermediate fails the connection exactly as an expired leaf would, even though the leaf itself may have months left. The outage is wider, because one intermediate typically signs every certificate an organization holds from that authority, so a single expiry takes down every service presenting it at the same moment.

        It is also the failure your automation does not catch. Renewal tooling watches the leaf date and renews on schedule, and monitoring built around that tooling inherits the same blind spot. The chain file, meanwhile, was written by hand during the original deployment and has not been touched since, so nothing tracks the dates inside it. The result is an outage on a certificate nobody knew they owned.

        Diagnosis is slower for the same reason. The leaf looks fine to anyone who checks it, the server log shows a handshake failure without naming which certificate caused it, and clients disagree with each other because some carry the expiring intermediate in their own trust store and validate a shorter path.

        An attacker gains from the confusion rather than from the expiry itself, since a support instruction to bypass the warning applies to whatever certificate is presented afterward.
      audit: |
        ### Audit via openssl

        Inspect every certificate the server presents in its chain with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -servername example.com -showcerts 2>/dev/null | openssl crl2pkcs7 -nocrl -certfile /dev/stdin | openssl pkcs7 -print_certs -noout
        ```

        A passing result shows valid date ranges for the leaf and every intermediate and root certificate, while a failing result shows any certificate in the chain whose notAfter date has passed.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. List every certificate the server presents and find the expired ones:

                ```bash
                certdir=$(mktemp -d)
                openssl s_client -connect yourdomain.com:443 -showcerts </dev/null 2>/dev/null \
                  | awk '/BEGIN CERT/,/END CERT/' \
                  | csplit --quiet --prefix="$certdir/cert-" -z - '/BEGIN CERT/' '{*}'
                for f in "$certdir"/cert-*; do
                  openssl x509 -in "$f" -noout -subject -enddate
                done
                ```

            2. Pull current intermediates from your CA. For Let's Encrypt, run `certbot renew --force-renewal` to refresh `/etc/letsencrypt/live/yourdomain.com/fullchain.pem`. Use force renewal only to replace an outdated chain, because repeated runs count against CA rate limits. For other CAs, download the current intermediate bundle from the CA's support site and rebuild your chain file with the leaf first.

            3. Point Apache at the refreshed chain and reload:

                ```apache
                SSLCertificateFile      /etc/letsencrypt/live/yourdomain.com/fullchain.pem
                SSLCertificateKeyFile   /etc/letsencrypt/live/yourdomain.com/privkey.pem
                ```

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS
                ```

            4. Re-run the iteration in step 1. Every `notAfter` date must now be in the future.
        - id: nginx
          desc: |
            **Using Nginx**

            1. List every certificate the server presents and find the expired ones:

                ```bash
                certdir=$(mktemp -d)
                openssl s_client -connect yourdomain.com:443 -showcerts </dev/null 2>/dev/null \
                  | awk '/BEGIN CERT/,/END CERT/' \
                  | csplit --quiet --prefix="$certdir/cert-" -z - '/BEGIN CERT/' '{*}'
                for f in "$certdir"/cert-*; do
                  openssl x509 -in "$f" -noout -subject -enddate
                done
                ```

            2. Pull current intermediates from your CA. For Let's Encrypt, run `certbot renew --force-renewal` to refresh `/etc/letsencrypt/live/yourdomain.com/fullchain.pem`. Use force renewal only to replace an outdated chain, because repeated runs count against CA rate limits. For other CAs, download the current intermediate bundle from the CA's support site and rebuild your chain file with the leaf first.

            3. Point Nginx at the refreshed chain. The `ssl_certificate` file must contain the full chain, leaf followed by intermediates:

                ```nginx
                ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
                ```

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Re-run the iteration in step 1. Every `notAfter` date must now be in the future.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. List every certificate the server presents and find the expired ones:

                ```bash
                certdir=$(mktemp -d)
                openssl s_client -connect yourdomain.com:443 -showcerts </dev/null 2>/dev/null \
                  | awk '/BEGIN CERT/,/END CERT/' \
                  | csplit --quiet --prefix="$certdir/cert-" -z - '/BEGIN CERT/' '{*}'
                for f in "$certdir"/cert-*; do
                  openssl x509 -in "$f" -noout -subject -enddate
                done
                ```

            2. Pull current intermediates from your CA. For Let's Encrypt, run `certbot renew --force-renewal` to refresh `/etc/letsencrypt/live/yourdomain.com/fullchain.pem`. Use force renewal only to replace an outdated chain, because repeated runs count against CA rate limits. For other CAs, download the current intermediate bundle from the CA's support site and rebuild your chain file with the leaf first.

            3. Rebuild HAProxy's combined PEM with the chain followed by the key, and reload:

                ```bash
                cat /etc/letsencrypt/live/yourdomain.com/fullchain.pem \
                    /etc/letsencrypt/live/yourdomain.com/privkey.pem \
                    > /etc/haproxy/certs/yourdomain.com.pem
                chmod 0600 /etc/haproxy/certs/yourdomain.com.pem
                haproxy -c -f /etc/haproxy/haproxy.cfg
                systemctl reload haproxy
                ```

            4. Re-run the iteration in step 1. Every `notAfter` date must now be in the future.
