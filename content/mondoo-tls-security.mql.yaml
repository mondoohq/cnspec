      compliance/mitre-attack: mitre-attack-t1040
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: tls.cipherSuites.none(keyExchange == "RSA")
    docs:
      desc: |
        This check verifies that the server offers no cipher suite that uses static RSA key exchange.

        In those suites, named `TLS_RSA_WITH_...` in the registry and written `AES128-GCM-SHA256` in OpenSSL syntax, the client picks the session secret and encrypts it to the public key in the server's certificate. Exclude them from the cipher list with `!kRSA` in Apache's `SSLCipherSuite`, or by listing only ECDHE and DHE suites in Nginx's `ssl_ciphers` and HAProxy's `ssl-default-bind-ciphers`. Note the distinction from `ECDHE-RSA-AES128-GCM-SHA256`, which uses RSA only to sign the handshake and is fine to keep.

        **Why this matters**

        Because the session secret crosses the wire encrypted to a key that lives for years, every session negotiated this way is decryptable by whoever eventually holds that key. An attacker records the traffic today with no ability to read it, keeps the capture, and waits. The key surfaces later from a stolen server backup, a private key checked into a repository, a memory disclosure bug in the TLS stack, or the compromise of the host itself. On that day the whole archive decrypts in bulk, including sessions from long before the attacker had any access.

        A single key compromise therefore has unbounded retrospective scope. With ephemeral key exchange, the same compromise lets an attacker impersonate the server going forward, which is serious but bounded and detectable. With static RSA it also hands them the history.

        The protocol designers reached the same conclusion and removed static RSA key exchange from TLS 1.3 entirely, leaving ephemeral exchange as the only option.
      audit: |
        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -cipher AES128-GCM-SHA256
        ```

        A handshake failure means the RSA key exchange suite is rejected and the check passes, while a successful handshake means it is still accepted and the check fails.

        ### Audit via nmap

        Enumerate the server's supported ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when no TLS_RSA cipher suite appears in the output, and fails if any RSA key exchange suite is listed.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Use cipher suites with ECDHE or DHE key exchange and exclude RSA key exchange with `!kRSA`:

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:!kRSA
                SSLHonorCipherOrder on
                ```

                Note: `ECDHE-RSA-*` uses RSA for authentication only (with forward secrecy), while `TLS_RSA_*` uses RSA for key exchange (no forward secrecy).

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify RSA key exchange is disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -E "TLS_RSA"
                ```
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Use cipher suites with ECDHE or DHE key exchange only:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
                ssl_prefer_server_ciphers on;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify RSA key exchange is disabled:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -E "TLS_RSA"
                ```

            **Note:** TLS 1.3 only supports forward secrecy by design.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Use cipher suites with ECDHE or DHE key exchange only:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify RSA key exchange is disabled using SSL Labs or:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -E "TLS_RSA"
                ```
    refs:
      - url: https://www.ssllabs.com/projects/best-practices/
        title: SSL/TLS Deployment Best Practices
      - url: https://datatracker.ietf.org/doc/html/rfc8446
        title: TLS 1.3 RFC 8446
  - uid: mondoo-tls-security-no-old-cipher-suites
    title: Avoid draft ChaCha20-Poly1305 cipher suites
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: tls.ciphers.none( /^old/i )
    docs:
      desc: |
        This check verifies that the server does not offer the draft ChaCha20-Poly1305 cipher suites that predate the standardized ones.

        Three suite identifiers were assigned to the pre-standard construction: `0xCC13`, `0xCC14`, and `0xCC15`. They come from implementations written against the ChaCha20-Poly1305 internet drafts before RFC 7905 fixed the design in 2016, and in practice they appear only on OpenSSL 1.0.2 builds carrying the early ChaCha20 patch. No cipher string removes them individually. The fix is to upgrade the TLS library and the server package linked against it, then set a current cipher list containing `ECDHE-ECDSA-CHACHA20-POLY1305` and `ECDHE-RSA-CHACHA20-POLY1305`.

        **Why this matters**

        The draft suites themselves are not the prize. What they reveal is that this host runs a TLS stack frozen before 2016, and an attacker reads that off a single handshake with no authentication and no noisy probing. That library predates years of published vulnerabilities in the same code, so the finding is really an inventory result. A scanner recording the suites offered by every host on the internet has already filed this one as running a known-old OpenSSL, and exploit selection follows from there.

        The construction also differs from the standardized one in how the nonce is built, and it never received the review the final design did. Any weakness found in it will not be fixed, because nobody maintains the drafts.

        No client benefits from keeping them. Every current client negotiates the RFC 7905 suites, so the draft identifiers add fingerprinting value for an attacker and nothing at all for your users. Removing them by upgrading also brings the fixes that the same upgrade carries for everything else in the library.

        Once the library is current, narrow the cipher list to suites that pair authenticated encryption with forward secrecy and SHA-256 or stronger hashing, so the standardized ChaCha20-Poly1305 suites are the only ones on offer under that name.
      audit: |
        ### Audit via nmap

        Enumerate the server's supported ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when no draft ChaCha20-Poly1305 suite with the ID 0xCC13, 0xCC14, or 0xCC15 appears in the output, and fails if any of them is listed.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. The legacy cipher suites this finding reports are draft ChaCha20-Poly1305 suites with the IDs 0xCC13, 0xCC14, and 0xCC15. They are only offered by TLS stacks that predate the standardization of ChaCha20-Poly1305 in RFC 7905, typically OpenSSL 1.0.2 builds with the early ChaCha20 patch. Check which OpenSSL release Apache is linked against:

                ```bash
                apachectl -V | grep -i ssl
                openssl version
                ```

            2. Upgrade OpenSSL and Apache to current distribution packages so the standard RFC 7905 suites replace the draft IDs:

                ```bash
                apt update && apt upgrade openssl apache2   # Debian/Ubuntu
                yum update openssl httpd                    # RHEL/CentOS
                ```

            3. Set a modern cipher configuration and restart Apache:

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
                SSLHonorCipherOrder on
                SSLProtocol -all +TLSv1.2 +TLSv1.3
                ```

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify the server's ChaCha20-Poly1305 suites are now the standard `TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256` family rather than draft variants:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com
                ```
        - id: nginx
          desc: |
            **Using Nginx**

            1. The legacy cipher suites this finding reports are draft ChaCha20-Poly1305 suites with the IDs 0xCC13, 0xCC14, and 0xCC15. They are only offered by TLS stacks that predate the standardization of ChaCha20-Poly1305 in RFC 7905, typically OpenSSL 1.0.2 builds with the early ChaCha20 patch. Check which OpenSSL release Nginx is linked against:

                ```bash
                nginx -V 2>&1 | grep -io "built with [^ ]* [^ ]*"
                openssl version
                ```

            2. Upgrade OpenSSL and Nginx to current distribution packages so the standard RFC 7905 suites replace the draft IDs:

                ```bash
                apt update && apt upgrade openssl nginx   # Debian/Ubuntu
                yum update openssl nginx                  # RHEL/CentOS
                ```

            3. Set a modern cipher configuration and reload Nginx:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
                ssl_prefer_server_ciphers on;
                ssl_protocols TLSv1.2 TLSv1.3;
                ```

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify the server's ChaCha20-Poly1305 suites are now the standard `TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256` family rather than draft variants:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com
                ```
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. The legacy cipher suites this finding reports are draft ChaCha20-Poly1305 suites with the IDs 0xCC13, 0xCC14, and 0xCC15. They are only offered by TLS stacks that predate the standardization of ChaCha20-Poly1305 in RFC 7905, typically OpenSSL 1.0.2 builds with the early ChaCha20 patch. Check which OpenSSL release HAProxy is linked against:

                ```bash
                haproxy -vv | grep -i openssl
                ```

            2. Upgrade OpenSSL and HAProxy to current distribution packages so the standard RFC 7905 suites replace the draft IDs:

                ```bash
                apt update && apt upgrade openssl haproxy   # Debian/Ubuntu
                yum update openssl haproxy                  # RHEL/CentOS
                ```

            3. Set a modern cipher configuration and restart HAProxy:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
                ssl-default-bind-options ssl-min-ver TLSv1.2
                ```

                ```bash
                systemctl restart haproxy
                ```

            4. Verify the server's ChaCha20-Poly1305 suites are now the standard `TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256` family rather than draft variants:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com
                ```
    refs:
      - url: https://www.ssllabs.com/projects/best-practices/
        title: SSL/TLS Deployment Best Practices
      - url: https://datatracker.ietf.org/doc/html/rfc8446
        title: TLS 1.3 RFC 8446
  - uid: mondoo-tls-security-ciphers-include-aead-ciphers
    title: Preferred ciphers must include AEAD ciphers
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-13
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: tls.cipherSuites.any(aead)
    docs:
      desc: |
        This check verifies that the server offers at least one authenticated encryption cipher suite, so a client can negotiate a cipher that protects integrity as well as confidentiality.

        AEAD suites encrypt a record and authenticate it in a single operation. The families that qualify are AES-GCM, ChaCha20-Poly1305, and AES-CCM. You choose them in the server's cipher list, which is `SSLCipherSuite` in Apache, `ssl_ciphers` in Nginx, and `ssl-default-bind-ciphers` in HAProxy. The check passes as soon as one offered suite is AEAD, so a list carrying `ECDHE-RSA-AES128-GCM-SHA256` alongside older entries already satisfies it.

        **Why this matters**

        With no AEAD suite in the list, every client falls back to a CBC suite with a bolted-on message authentication code, and those constructions leak. An attacker on the network path who can trigger repeated requests recovers plaintext a byte at a time through the padding oracle that CBC record processing exposes, which is how POODLE and Lucky13 read session cookies out of an otherwise encrypted stream. Nothing about the certificate or the key size prevents that, because the weakness is in the record layer.

        An AEAD suite closes the oracle. A record that has been altered fails authentication before any padding is examined, so there is no error to time and no oracle to query, and the attacker's probes return the same indistinguishable failure regardless of what they guessed.

        Offer both AES-GCM and ChaCha20-Poly1305. AES-GCM runs on the AES instructions present in modern server and desktop processors, while ChaCha20-Poly1305 is faster on phones and embedded clients that lack them, so carrying both keeps throughput high without narrowing who can connect.

        TLS 1.3 negotiates only AEAD suites, so enabling it satisfies this requirement on every connection it serves. A server that still offers TLS 1.2 needs the AEAD suites named explicitly in its cipher list as well.
      audit: |
        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -cipher ECDHE-RSA-AES128-GCM-SHA256
        ```

        A successful handshake means an AEAD cipher suite is accepted and the check passes, while a handshake failure means no AEAD suite is offered and the check fails.

        ### Audit via nmap

        Enumerate the server's supported ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when at least one cipher containing GCM, CCM, or ChaCha20-Poly1305 appears in the output, and fails if none are listed.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Configure cipher suites that include AEAD ciphers (GCM, ChaCha20-Poly1305):

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
                SSLHonorCipherOrder on
                ```

                AEAD cipher suites provide both confidentiality and integrity protection:
                - **AES-GCM**: Hardware-accelerated on most modern CPUs
                - **ChaCha20-Poly1305**: Excellent on devices without AES acceleration

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify AEAD ciphers are available:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "GCM|CHACHA|CCM"
                ```

            **Note:** TLS 1.3 only supports AEAD cipher suites by design.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Configure cipher suites that include AEAD ciphers:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
                ssl_prefer_server_ciphers on;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify AEAD ciphers are available:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "GCM|CHACHA|CCM"
                ```

            **Note:** TLS 1.3 only supports AEAD cipher suites by design.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Configure cipher suites that include AEAD ciphers:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify AEAD ciphers are available:

                ```bash
                nmap --script ssl-enum-ciphers -p 443 yourdomain.com | grep -iE "GCM|CHACHA|CCM"
                ```
    refs:
      - url: https://www.ssllabs.com/projects/best-practices/
        title: SSL/TLS Deployment Best Practices
      - url: https://datatracker.ietf.org/doc/html/rfc8446
        title: TLS 1.3 RFC 8446
  - uid: mondoo-tls-security-ciphers-include-pfs
    title: Preferred ciphers must include perfect forward secrecy (PFS)
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1040
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-12
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: tls.cipherSuites.any(forwardSecrecy)
    docs:
      desc: |
        This check verifies that the server offers at least one cipher suite whose key exchange is ephemeral, so the session key cannot be recovered later from the server's long-term private key.

        Forward secrecy comes from ECDHE or DHE key exchange, where both sides derive a fresh key for each connection and discard it when the connection ends. You select those suites in the server's cipher list, which is `SSLCipherSuite` in Apache, `ssl_ciphers` in Nginx, and `ssl-default-bind-ciphers` in HAProxy. Where DHE is used, pair it with a generated parameter file of at least 2048 bits, pointed at by `ssl_dhparam` in Nginx.

        **Why this matters**

        Without forward secrecy the session key is encrypted to the server's RSA key and sent across the wire, so whoever later obtains that private key can decrypt every session they recorded. An attacker does not need to break any cryptography today. They capture the traffic now, at a transit provider, on a compromised switch, or on a hostile network the client is sitting on, and store it. The key arrives afterward through a server compromise, a stolen backup, a private key committed to a repository, or a memory disclosure bug that reads it out of process memory. At that moment the entire archive opens at once, including the credentials and tokens inside it.

        With ECDHE the recorded traffic stays closed. The private key signs the handshake but never encrypts the session key, so compromising it lets an attacker impersonate the server from that point forward and nothing more. Yesterday's captures remain unreadable.

        The same reasoning drives the store-now-decrypt-later concern about future advances in cryptanalysis, since only sessions whose keys were transmitted are exposed in retrospect.

        TLS 1.3 removed non-forward-secret key exchange from the protocol, so enabling it guarantees this property on every connection it serves.
      audit: |
        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -cipher ECDHE-RSA-AES128-GCM-SHA256
        ```

        A successful handshake means a forward-secret cipher suite is accepted and the check passes, while a handshake failure means no ECDHE or DHE suite is offered and the check fails.

        ### Audit via nmap

        Enumerate the server's supported ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when at least one ECDHE or DHE cipher suite appears in the output, and fails if no forward-secret suite is listed.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Configure cipher suites that use ECDHE or DHE for forward secrecy:

                ```apache
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
                SSLHonorCipherOrder on
                ```

                If using DHE, generate a strong DH parameter (2048-bit minimum):

                ```bash
                openssl dhparam -out /etc/ssl/dhparam.pem 2048
                ```

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify PFS is enabled using SSL Labs (look for "Forward Secrecy: Yes").

            **Note:** TLS 1.3 only supports forward secrecy by design.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Configure cipher suites that use ECDHE or DHE for forward secrecy:

                ```nginx
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
                ssl_prefer_server_ciphers on;
                ```

            3. If using DHE, generate and configure a strong DH parameter:

                ```bash
                openssl dhparam -out /etc/ssl/dhparam.pem 2048
                ```

                Then add to your Nginx config:

                ```nginx
                ssl_dhparam /etc/ssl/dhparam.pem;
                ```

            4. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            5. Verify PFS is enabled using SSL Labs (look for "Forward Secrecy: Yes").
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Configure cipher suites that use ECDHE or DHE for forward secrecy:

                ```haproxy
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify PFS is enabled using SSL Labs (look for "Forward Secrecy: Yes").

            **Note:** TLS 1.3 only supports forward secrecy by design.
    refs:
      - url: https://www.ssllabs.com/projects/best-practices/
        title: SSL/TLS Deployment Best Practices
      - url: https://datatracker.ietf.org/doc/html/rfc8446
        title: TLS 1.3 RFC 8446
  - uid: mondoo-tls-security-mitigate-beast
    title: Mitigate BEAST attacks on the server-side
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1557
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |-
      switch {
        case tls.versions.containsOnly(["tls1.2", "tls1.3"]):
          score(100);
        case tls.cipherSuites.none(nullCipher || anonymous || export || cbc || encryption == /des|rc2|idea/i):
          score(80);
        default:
          score(0);
      }
    docs:
      desc: |
        This check verifies that the server cannot be pushed into the TLS 1.0 CBC record construction that the BEAST attack depends on.

        BEAST, short for Browser Exploit Against SSL/TLS, targets the way TLS 1.0 chains cipher blocks. The check scores full marks when the server negotiates only TLS 1.2 and TLS 1.3, and partial credit when older versions remain reachable but the cipher list carries no CBC, NULL, anonymous, export, DES, RC2, or IDEA suite. Both states are set in the server configuration: `SSLProtocol -all +TLSv1.2 +TLSv1.3` with `SSLCipherSuite` in Apache, `ssl_protocols TLSv1.2 TLSv1.3` with `ssl_ciphers` in Nginx, and `ssl-min-ver TLSv1.2` in HAProxy.

        **Why this matters**

        TLS 1.0 uses the last ciphertext block of one record as the initialization vector for the next, and an attacker on the network path can observe it. Combined with script running in the victim's browser, that predictability becomes a working decryption. The attacker gets the browser to issue requests that place a chosen byte next to the secret they want, watches which guess produces a matching ciphertext block, and walks the session cookie out one byte at a time. The cookie is then replayed to sign in as that user, with no password ever needed.

        The flaw is in the protocol rather than in any one implementation, so no configuration of TLS 1.0 removes it. Disabling TLS 1.0 and TLS 1.1 is the fix. TLS 1.2 chooses a fresh initialization vector for each record, and TLS 1.3 admits only authenticated encryption.

        Do not reach for RC4 as the workaround, which was the common advice at the time. RC4 avoids CBC entirely but has keystream biases that recover plaintext from captured traffic on their own, so that trade swaps one practical decryption for another.
      audit: |
        ### Audit via nmap

        Enumerate the server's supported protocols and ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when the output lists only TLSv1.2 and TLSv1.3 sections, and fails when a TLSv1.0 section with CBC ciphers appears.

        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -tls1
        ```

        The check passes when this TLS 1.0 handshake is refused, and fails when the connection completes successfully.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            The recommended approach to mitigate BEAST is to disable TLS 1.0 and TLS 1.1 entirely.

            1. Open your Apache SSL configuration file (typically `/etc/httpd/conf.d/ssl.conf` or `/etc/apache2/sites-available/default-ssl.conf`).

            2. Configure protocols and cipher suites:

                ```apache
                SSLProtocol -all +TLSv1.2 +TLSv1.3
                SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
                SSLHonorCipherOrder on
                ```

                TLS 1.2 uses a different IV selection mechanism that prevents BEAST. TLS 1.3 only supports AEAD ciphers which are not vulnerable.

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify TLS 1.0/1.1 are disabled:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1   # Should fail
                openssl s_client -connect yourdomain.com:443 -tls1_2 # Should succeed
                ```

            **Important:** Do not use RC4 as a BEAST mitigation. RC4 has severe cryptographic weaknesses.
        - id: nginx
          desc: |
            **Using Nginx**

            The recommended approach to mitigate BEAST is to disable TLS 1.0 and TLS 1.1 entirely.

            1. Open your Nginx configuration file (typically `/etc/nginx/nginx.conf` or a site-specific file).

            2. Configure protocols and cipher suites:

                ```nginx
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
                ssl_prefer_server_ciphers on;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify TLS 1.0/1.1 are disabled:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1   # Should fail
                openssl s_client -connect yourdomain.com:443 -tls1_2 # Should succeed
                ```

            **Important:** Do not use RC4 as a BEAST mitigation. RC4 has severe cryptographic weaknesses.
        - id: haproxy
          desc: |
            **Using HAProxy**

            The recommended approach to mitigate BEAST is to disable TLS 1.0 and TLS 1.1 entirely.

            1. Open your HAProxy configuration file (typically `/etc/haproxy/haproxy.cfg`).

            2. Configure protocols and cipher suites:

                ```haproxy
                ssl-default-bind-options ssl-min-ver TLSv1.2
                ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify TLS 1.0/1.1 are disabled:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1   # Should fail
                openssl s_client -connect yourdomain.com:443 -tls1_2 # Should succeed
                ```

            **Important:** Do not use RC4 as a BEAST mitigation. RC4 has severe cryptographic weaknesses.
    refs:
      - url: https://kb.vmware.com/s/article/2008784
        title: VMware mitigation of CVE-2011-3389 (BEAST) for web server administrators
  - uid: mondoo-tls-security-cert-chain-verified
    title: Ensure the certificate chain is verified and trusted
    impact: 95
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/mitre-attack: mitre-attack-t1557
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: owasp-asvs-5-12-2-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.certificates.first.isVerified == true
    docs:
      desc: |
        This check verifies that the certificate chain the server presents validates to a trusted root, which `openssl s_client` reports as `Verify return code: 0`.

        Verification fails on the chain rather than on the leaf, and it fails for a small set of causes: a missing intermediate, certificates sent out of order, an expired intermediate or root, or a root that clients do not carry. The chain is the file the server points at, `SSLCertificateFile` in Apache, `ssl_certificate` in Nginx, and the combined PEM on HAProxy's `bind` line, and it must hold the leaf first followed by every intermediate. An ACME `fullchain.pem` is already in that order.

        **Why this matters**

        A chain that does not verify means clients cannot establish that they are talking to you rather than to someone standing in the path. That is the property TLS exists to provide, and once it is gone, the encryption is protecting a conversation with an unidentified party.

        What follows depends on the client, and every outcome is bad. Browsers show a warning page, users click through it, and thereby learn to click through the next one, including the one an attacker's certificate produces. Some libraries and command-line tools fail open, or get configured with verification switched off to get past the error, which removes certificate checking for that caller permanently. Others fail closed and take an integration down.

        Missing intermediates are the most common cause and the most deceptive, because browsers often paper over them. Several fetch the missing certificate themselves or carry a cached copy from another site, so the deployment looks healthy on a laptop while failing for every mobile application and API caller that does no such fetching.

        Re-verify the chain after every renewal or rotation. Authorities change intermediates, and a chain that verified last year can stop verifying without the leaf changing at all.
      audit: |
        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -showcerts
        ```

        The check passes when the output reports `Verify return code: 0 (ok)` with a complete certificate list, and fails when the verify return code is non-zero or intermediates are missing.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Check chain verification status from outside the server:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>&1 | grep "Verify return code"
                ```

                Common causes of failure: missing intermediates, wrong chain order (leaf must come first), expired intermediate or root, root CA not in the client trust store.

            2. Build the correct chain file (leaf first, then intermediates — root is optional):

                ```bash
                cat /etc/ssl/certs/yourdomain.com.crt \
                    /etc/ssl/certs/yourdomain.com.intermediate.crt \
                    > /etc/ssl/certs/yourdomain.com.fullchain.pem
                ```

                Let's Encrypt callers can skip this — `fullchain.pem` is already the right format.

            3. Point Apache at the full chain. On Apache 2.4.8+ `SSLCertificateFile` accepts a chain file; older releases use `SSLCertificateChainFile` for the intermediates only:

                ```apache
                SSLCertificateFile      /etc/ssl/certs/yourdomain.com.fullchain.pem
                SSLCertificateKeyFile   /etc/ssl/private/yourdomain.com.key
                ```

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS
                ```

            4. Verify the chain locally. Pass the intermediates as untrusted chain material and the leaf as the target, because `openssl verify` only validates the first certificate in a file:

                ```bash
                openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
                  -untrusted /etc/ssl/certs/yourdomain.com.intermediate.crt \
                  /etc/ssl/certs/yourdomain.com.crt
                ```

                Then re-run the verification from step 1. `Verify return code: 0 (ok)` confirms success.
        - id: nginx
          desc: |
            **Using Nginx**

            1. Check chain verification status from outside the server:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>&1 | grep "Verify return code"
                ```

                Common causes of failure: missing intermediates, wrong chain order (leaf must come first), expired intermediate or root, root CA not in the client trust store.

            2. Build the correct chain file (leaf first, then intermediates):

                ```bash
                cat /etc/ssl/certs/yourdomain.com.crt \
                    /etc/ssl/certs/yourdomain.com.intermediate.crt \
                    > /etc/ssl/certs/yourdomain.com.fullchain.pem
                ```

                Let's Encrypt callers can skip this — `fullchain.pem` is already the right format.

            3. **Nginx requires the full chain in `ssl_certificate`** (it doesn't have a separate "chain file" directive). Point it at the file:

                ```nginx
                ssl_certificate     /etc/ssl/certs/yourdomain.com.fullchain.pem;
                ssl_certificate_key /etc/ssl/private/yourdomain.com.key;
                ```

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify the chain locally. Pass the intermediates as untrusted chain material and the leaf as the target, because `openssl verify` only validates the first certificate in a file:

                ```bash
                openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
                  -untrusted /etc/ssl/certs/yourdomain.com.intermediate.crt \
                  /etc/ssl/certs/yourdomain.com.crt
                ```

                Then re-run the verification from step 1. `Verify return code: 0 (ok)` confirms success.
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Check chain verification status from outside the server:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>&1 | grep "Verify return code"
                ```

                Common causes of failure: missing intermediates, wrong chain order, expired intermediate or root, root CA not in the client trust store.

            2. HAProxy's `bind … ssl crt <file>` expects a single PEM with leaf + intermediates + private key, in that order:

                ```bash
                cat /etc/letsencrypt/live/yourdomain.com/fullchain.pem \
                    /etc/letsencrypt/live/yourdomain.com/privkey.pem \
                    > /etc/haproxy/certs/yourdomain.com.pem
                chmod 0600 /etc/haproxy/certs/yourdomain.com.pem
                ```

                Or, for a non-Certbot deployment:

                ```bash
                cat /etc/ssl/certs/yourdomain.com.crt \
                    /etc/ssl/certs/yourdomain.com.intermediate.crt \
                    /etc/ssl/private/yourdomain.com.key \
                    > /etc/haproxy/certs/yourdomain.com.pem
                chmod 0600 /etc/haproxy/certs/yourdomain.com.pem
                ```

            3. Reload HAProxy:

                ```haproxy
                frontend https-in
                    bind *:443 ssl crt /etc/haproxy/certs/yourdomain.com.pem
                ```

                ```bash
                haproxy -c -f /etc/haproxy/haproxy.cfg
                systemctl reload haproxy
                ```

            4. Verify the chain locally using the separate leaf and chain files rather than the combined PEM, because `openssl verify` only validates the first certificate in a file:

                ```bash
                openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
                  -untrusted /etc/letsencrypt/live/yourdomain.com/chain.pem \
                  /etc/letsencrypt/live/yourdomain.com/cert.pem
                ```

                Then re-run the verification from step 1. `Verify return code: 0 (ok)` confirms success.
    refs:
      - url: https://www.openssl.org/docs/man1.1.1/man1/verify.html
        title: OpenSSL certificate chain verification
  - uid: mondoo-tls-security-tls13-supported
    title: Ensure TLS 1.3 is supported
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.versions.contains("tls1.3")
    docs:
      desc: |
        This check verifies that the server offers TLS 1.3 alongside TLS 1.2, so clients that support it negotiate the newer protocol.

        TLS 1.3 needs a recent TLS library and a server build linked against it: Apache 2.4.36 or later, Nginx 1.13.0 or later, or HAProxy 1.9.1 or later, each with OpenSSL 1.1.1 or later. Once that is in place, it is enabled by naming it in the same directive that sets the protocol floor, `SSLProtocol -all +TLSv1.2 +TLSv1.3` in Apache and `ssl_protocols TLSv1.2 TLSv1.3` in Nginx. In HAProxy, remove anything that caps the ceiling below it, such as `ssl-max-ver TLSv1.2` or `no-tlsv13` on a bind line.

        **Why this matters**

        TLS 1.3 removes the options an attacker relies on. Every one of its key exchanges is ephemeral, so recorded traffic cannot be opened later with a stolen server key. Every one of its cipher suites is authenticated encryption, so the padding oracle and timing attacks that work against CBC have no suite left to attack. Renegotiation, compression, and static RSA key exchange are gone from the protocol, which retires the attacks built on each of them rather than requiring you to disable them one at a time.

        More of the handshake is encrypted as well. In TLS 1.2 an observer reads the server certificate straight off the wire and learns which site behind a shared address a client is visiting. In TLS 1.3 that certificate is encrypted, so a passive observer sees considerably less about who is talking to what.

        The handshake also completes in one round trip instead of two, which shortens the unprotected window at the start of a connection and makes the change easier to justify on performance grounds.

        Keep TLS 1.2 enabled for clients that cannot do TLS 1.3, and keep TLS 1.0 and TLS 1.1 disabled.
      audit: |
        ### Audit via nmap

        Enumerate the server's supported protocols and ciphers:

        ```bash
        nmap --script ssl-enum-ciphers -p 443 example.com
        ```

        The check passes when the output includes a TLSv1.3 section, and fails when no TLSv1.3 section is listed.

        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -tls1_3
        ```

        The check passes when the TLS 1.3 handshake completes and reports `Protocol: TLSv1.3`, and fails when the connection is refused.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Ensure you are running Apache 2.4.36+ with OpenSSL 1.1.1+.

            2. Open your Apache SSL configuration file and enable TLS 1.3:

                ```apache
                SSLProtocol -all +TLSv1.2 +TLSv1.3
                ```

            3. Save the file and restart Apache:

                ```bash
                systemctl restart apache2   # Debian/Ubuntu
                systemctl restart httpd     # RHEL/CentOS
                ```

            4. Verify TLS 1.3 is supported:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1_3
                ```
        - id: nginx
          desc: |
            **Using Nginx**

            1. Ensure you are running Nginx 1.13.0+ with OpenSSL 1.1.1+.

            2. Open your Nginx configuration file and enable TLS 1.3:

                ```nginx
                ssl_protocols TLSv1.2 TLSv1.3;
                ```

            3. Save the file and reload Nginx:

                ```bash
                nginx -t && systemctl reload nginx
                ```

            4. Verify TLS 1.3 is supported:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1_3
                ```
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Ensure you are running HAProxy 1.9.1+ built against OpenSSL 1.1.1+. With that combination TLS 1.3 is offered by default:

                ```bash
                haproxy -vv | grep -i openssl
                ```

            2. Open your HAProxy configuration file and remove anything that caps the protocol below TLS 1.3, such as `ssl-max-ver TLSv1.2` or `no-tlsv13` on `bind` lines or in `ssl-default-bind-options`. Then set a floor of TLS 1.2 and the TLS 1.3 cipher suites:

                ```haproxy
                ssl-default-bind-options ssl-min-ver TLSv1.2
                ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
                ```

            3. Save the file and restart HAProxy:

                ```bash
                systemctl restart haproxy
                ```

            4. Verify TLS 1.3 is supported:

                ```bash
                openssl s_client -connect yourdomain.com:443 -tls1_3
                ```
    refs:
      - url: https://datatracker.ietf.org/doc/html/rfc8446
        title: TLS 1.3 RFC 8446
  # The uid still says "ocsp" for continuity: renaming a shipped uid would break
  # existing exceptions and the framework maps that reference it. The assertion is
  # revocation availability by either mechanism, as the title and docs describe.
  - uid: mondoo-tls-security-cert-ocsp-configured
    title: Ensure the certificate publishes OCSP or CRL revocation information
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-13
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: owasp-asvs-5-12-1-4
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      tls.certificates.first.ocspServer != empty || tls.certificates.first.crlDistributionPoints != empty
    docs:
      desc: |
        This check verifies that the leaf certificate tells clients where to check whether it has been revoked, by carrying an OCSP responder URL in its Authority Information Access extension, a CRL distribution point, or both. Either one satisfies the check.

        This is a property of the certificate, set by the issuer, so no server directive adds it. A certificate with neither is almost always self-signed or issued by an internal authority, and the fix is to reissue from a publicly trusted one. Where an OCSP responder is present, stapling is worthwhile hardening on top of it: `ssl_stapling on` with `ssl_stapling_verify on` in Nginx, or `SSLUseStapling on` in Apache's global scope.

        **Why this matters**

        Revocation is the only way to withdraw trust in a certificate before it expires on its own. If the certificate publishes no way to check, then a key stolen from your server stays valid to every client for the whole remaining lifetime, and the incident response to a compromised key is to wait. An attacker holding that key impersonates the hostname for as long as the certificate lives, and nothing you do reaches the clients.

        Even where revocation data exists, clients differ. Some fail open when they cannot reach the responder and accept the certificate anyway. That is the argument for stapling, which delivers a fresh signed status inside the handshake so the client never needs to reach the responder at all.

        Both mechanisms count here deliberately, because the industry has moved from OCSP toward revocation lists. Let's Encrypt stopped putting OCSP URLs in its certificates in May 2025 and shut its responders down that August, on the grounds that a responder learns which site each visitor is browsing. Its certificates carry a CRL distribution point instead, so demanding OCSP specifically would fail a large share of correctly configured modern certificates.
      audit: |
        ### Audit via openssl

        Check both revocation mechanisms. The certificate needs at least one of them.

        1. Look for an OCSP responder URL:

            ```bash
            openssl s_client -connect example.com:443 -servername example.com </dev/null 2>/dev/null \
              | openssl x509 -noout -ocsp_uri
            ```

        2. Look for a CRL distribution point:

            ```bash
            openssl s_client -connect example.com:443 -servername example.com </dev/null 2>/dev/null \
              | openssl x509 -noout -text \
              | grep -A4 "CRL Distribution Points"
            ```

        The check passes when either command returns a URL. It fails only when both return nothing, meaning the certificate publishes no way to check its revocation status at all.

        An empty result from step 1 alone is expected for certificates from a CA that has retired OCSP, such as Let's Encrypt, and is not a finding on its own.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            This check fails only when the certificate publishes neither an OCSP responder nor a CRL distribution point, which is rare for a publicly trusted certificate. Confirm which mechanism is present before changing anything:

            1. Check for both mechanisms:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -ocsp_uri

                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -text \
                  | grep -A4 "CRL Distribution Points"
                ```

            2. If both are empty, the certificate itself is the problem and no server setting will fix it. Reissue from a publicly trusted CA. A self-signed or internally issued certificate is the usual cause. Note that an empty OCSP result with a populated CRL is fine and satisfies this check.

            3. If an OCSP responder *is* present, enabling stapling is worthwhile hardening: the server delivers a fresh signed status so clients never contact the responder, removing the latency and the privacy leak. `SSLUseStapling` and `SSLStaplingCache` must live in the global scope, not per-vhost:

                ```apache
                SSLUseStapling          on
                SSLStaplingCache        shmcb:/run/ocsp(128000)
                SSLStaplingResponderTimeout 5
                SSLStaplingReturnResponderErrors off
                ```

            4. Reload and verify:

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS

                openssl s_client -connect yourdomain.com:443 -status </dev/null 2>&1 \
                  | grep -A5 "OCSP Response"
                ```

                A `Cert Status: good` line confirms stapling is working. Nothing to verify here if the CA publishes no OCSP responder.
        - id: nginx
          desc: |
            **Using Nginx**

            This check fails only when the certificate publishes neither an OCSP responder nor a CRL distribution point, which is rare for a publicly trusted certificate. Confirm which mechanism is present before changing anything:

            1. Check for both mechanisms:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -ocsp_uri

                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -text \
                  | grep -A4 "CRL Distribution Points"
                ```

            2. If both are empty, reissue the certificate from a publicly trusted CA. No Nginx directive can add revocation information the CA did not put in the certificate. An empty OCSP result with a populated CRL is fine and satisfies this check.

            3. If an OCSP responder *is* present, enable stapling. `ssl_trusted_certificate` must point at a file containing the issuing CA so Nginx can validate the response:

                ```nginx
                ssl_stapling          on;
                ssl_stapling_verify   on;
                ssl_trusted_certificate /etc/ssl/certs/yourdomain.com.issuer.crt;
                resolver              1.1.1.1 8.8.8.8 valid=300s;
                resolver_timeout      5s;
                ```

            4. Reload and verify:

                ```bash
                nginx -t && systemctl reload nginx

                openssl s_client -connect yourdomain.com:443 -status </dev/null 2>&1 \
                  | grep -A5 "OCSP Response"
                ```

                A `Cert Status: good` line confirms stapling is working.
        - id: haproxy
          desc: |
            **Using HAProxy**

            This check fails only when the certificate publishes neither an OCSP responder nor a CRL distribution point, which is rare for a publicly trusted certificate.

            1. Check for both mechanisms:

                ```bash
                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -ocsp_uri

                openssl s_client -connect yourdomain.com:443 </dev/null 2>/dev/null \
                  | openssl x509 -noout -text \
                  | grep -A4 "CRL Distribution Points"
                ```

            2. If both are empty, reissue the certificate from a publicly trusted CA. An empty OCSP result with a populated CRL is fine and satisfies this check.

            3. If an OCSP responder *is* present, HAProxy serves a stapled response from a `.ocsp` file placed alongside the certificate rather than fetching it itself. Fetch and refresh it on a schedule:

                ```bash
                openssl ocsp \
                  -issuer /etc/haproxy/certs/issuer.pem \
                  -cert /etc/haproxy/certs/yourdomain.com.pem \
                  -url "$(openssl x509 -in /etc/haproxy/certs/yourdomain.com.pem -noout -ocsp_uri)" \
                  -respout /etc/haproxy/certs/yourdomain.com.pem.ocsp \
                  -no_nonce
                ```

            4. Reload HAProxy and verify:

                ```bash
                haproxy -c -f /etc/haproxy/haproxy.cfg
                systemctl reload haproxy

                openssl s_client -connect yourdomain.com:443 -status </dev/null 2>&1 \
                  | grep -A5 "OCSP Response"
                ```

                Because the response expires, refresh the `.ocsp` file from cron or a timer; a stale file causes clients to see an expired status.
    refs:
      - url: https://datatracker.ietf.org/doc/html/rfc6960
        title: OCSP RFC 6960
  - uid: mondoo-tls-security-no-sni-certificate-leak
    title: Ensure non-SNI connections do not expose a different certificate
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-15
      compliance/owasp-asvs-5: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      if (tls.nonSniCertificates.length > 0) {
        tls.nonSniCertificates.first.subject.commonName == tls.certificates.first.subject.commonName
      }
    docs:
      desc: |
        This check verifies that a client connecting without Server Name Indication receives the same certificate as a client that supplies the hostname.

        The default certificate is whichever one the server picks when the handshake carries no name. Apache uses the first `<VirtualHost *:443>` it parses, Nginx uses the `server` block marked `default_server`, and HAProxy uses the first certificate on the `bind` line or the first entry of its `crt-list`. The check compares the common name of the certificate served without a name against the one served with it, and fails when they differ.

        **Why this matters**

        The default certificate is the one an attacker gets for free. Scanning an address range and connecting to every host on port 443 without a name is a single unauthenticated pass, and it returns whatever certificate each server treats as its default. When that certificate belongs to an internal service, its common name and subject alternative names hand over hostnames the operator never published: an admin panel, a staging environment, a monitoring endpoint, or a wildcard covering an internal domain. Those names become the target list for the next stage, and none of them was reachable through public DNS.

        The same response maps co-tenancy. A default certificate naming a different organization tells an attacker which sites share this address, which is useful for picking the weakest one and for working out what a compromise of that host would reach.

        The certificate served by default is also frequently an older or internally issued one that nobody rotates, so it may carry a weaker key or signature than the certificate the public site presents.

        Point the default at the same public certificate the primary site uses, or configure the server to refuse handshakes that carry no name at all, which Nginx does with `ssl_reject_handshake on`.
      audit: |
        ### Audit via openssl

        Inspect the server's TLS configuration with the OpenSSL client:

        ```bash
        openssl s_client -connect example.com:443 -showcerts
        ```

        First connect without `-servername` to capture the default certificate, then connect again with `-servername example.com` to capture the SNI certificate.

        The check passes when both connections return a certificate with the same Common Name, and fails when the non-SNI connection returns a different certificate.
      remediation:
        - id: apache
          desc: |
            **Using Apache**

            1. Compare what is served with and without SNI:

                ```bash
                openssl s_client -connect yourdomain.com:443                              </dev/null 2>/dev/null | openssl x509 -noout -subject
                openssl s_client -connect yourdomain.com:443 -servername yourdomain.com   </dev/null 2>/dev/null | openssl x509 -noout -subject
                ```

                If the two subjects differ, an internal-only cert is leaking via the non-SNI path.

            2. Apache serves the **first** `<VirtualHost *:443>` it parses when no SNI is supplied. Make sure that vhost references the public cert your primary domain expects. For example, in `/etc/apache2/sites-enabled/`:

                ```apache
                # 000-yourdomain.com.conf — must sort before any internal vhost
                <VirtualHost *:443>
                    ServerName              yourdomain.com
                    SSLEngine               on
                    SSLCertificateFile      /etc/letsencrypt/live/yourdomain.com/fullchain.pem
                    SSLCertificateKeyFile   /etc/letsencrypt/live/yourdomain.com/privkey.pem
                </VirtualHost>
                ```

            3. Reload Apache and re-run the comparison in step 1 — both subjects should now match.

                ```bash
                apachectl configtest
                systemctl reload apache2   # Debian/Ubuntu
                systemctl reload httpd     # RHEL/CentOS
                ```
        - id: nginx
          desc: |
            **Using Nginx**

            1. Compare what is served with and without SNI:

                ```bash
                openssl s_client -connect yourdomain.com:443                              </dev/null 2>/dev/null | openssl x509 -noout -subject
                openssl s_client -connect yourdomain.com:443 -servername yourdomain.com   </dev/null 2>/dev/null | openssl x509 -noout -subject
                ```

                If the two subjects differ, an internal-only cert is leaking via the non-SNI path.

            2. Mark a single, public-facing `server` block as the `default_server` for port 443. That cert is served whenever SNI is absent:

                ```nginx
                server {
                    listen      443 ssl default_server;
                    server_name yourdomain.com;

                    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
                }
                ```

            3. **Or** reject non-SNI connections outright (Nginx 1.19.4+):

                ```nginx
                server {
                    listen              443 ssl default_server;
                    ssl_reject_handshake on;
                }
                ```

            4. Reload Nginx and re-run the comparison in step 1:

                ```bash
                nginx -t && systemctl reload nginx
                ```
        - id: haproxy
          desc: |
            **Using HAProxy**

            1. Compare what is served with and without SNI:

                ```bash
                openssl s_client -connect yourdomain.com:443                              </dev/null 2>/dev/null | openssl x509 -noout -subject
                openssl s_client -connect yourdomain.com:443 -servername yourdomain.com   </dev/null 2>/dev/null | openssl x509 -noout -subject
                ```

                If the two subjects differ, an internal-only cert is leaking via the non-SNI path.

            2. HAProxy uses the **first** cert listed on the `bind` line as the default when SNI is absent. Either put the public-facing cert first, or use `crt-list` so the default is explicit:

                ```haproxy
                # /etc/haproxy/crt-list.txt
                /etc/haproxy/certs/yourdomain.com.pem !*.internal.example.com
                /etc/haproxy/certs/internal.pem        *.internal.example.com
                ```

                ```haproxy
                frontend https-in
                    bind *:443 ssl crt-list /etc/haproxy/crt-list.txt
                ```

            3. Reload HAProxy and re-run the comparison in step 1:

                ```bash
                haproxy -c -f /etc/haproxy/haproxy.cfg
                systemctl reload haproxy
                ```
    refs:
      - url: https://datatracker.ietf.org/doc/html/rfc6066
        title: TLS Server Name Indication (SNI) RFC 6066
