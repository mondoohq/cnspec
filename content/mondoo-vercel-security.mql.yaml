policies:
  - uid: mondoo-vercel-security
    name: Mondoo Vercel Security
    version: 1.1.1
    license: BUSL-1.1
    tags:
      mondoo.com/category: security
      mondoo.com/platform: vercel,saas
    require:
      - provider: vercel
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    summary: Secure Vercel projects and teams by enforcing deployment protection, firewall, secret hygiene, and credential controls
    docs:
      desc: |
        The Mondoo Vercel Security policy identifies misconfigurations in Vercel teams and projects that could expose non-production deployments, source code, and application data, or leave the account reachable through stale credentials. This policy helps organizations detect and remediate weaknesses before they can be exploited, reducing the likelihood of unauthorized deployment access, secret leakage, and takeover of unverified or expiring domains.

        This policy provides security checks across key Vercel areas:

        - Deployment protection (Vercel Authentication, password protection, Trusted IPs)
        - Build and source controls (Git fork protection, source visibility, runtime version)
        - Environment variable and secret hygiene
        - Web Application Firewall configuration
        - API token lifecycle
        - Storage, domain, and TLS certificate posture

        **A note on scanning scope**

        The provider discovers two kinds of assets: **Vercel Team** assets carry account-wide posture (API tokens, storage stores, domains, and certificates), and **Vercel Project** assets carry per-project deployment and build settings. Each check applies to the asset kind that owns the setting, so team-scoped and project-scoped findings appear against the corresponding asset.

        **A note on API authentication**

        The audit and command-line examples in this policy authenticate to the Vercel REST API with a bearer token, written as `curl -H "Authorization: Bearer $VERCEL_TOKEN"`. Team-scoped endpoints additionally take a `teamId` query parameter. The `vercel` CLI reads the same token from `vercel login` and is used where it exposes the setting directly. Create and scope tokens from **Account Settings > Tokens** in the Vercel dashboard.

        Learn more about scanning Vercel in the [cnspec documentation](https://mondoo.com/docs/cnspec).

        Have suggestions for new checks in this policy? Visit our [cnspec repository](https://github.com/mondoohq/cnspec).
    groups:
      - title: Vercel Deployment Protection
        checks:
          - uid: mondoo-vercel-security-project-preview-deployments-authenticated
          - uid: mondoo-vercel-security-project-password-protection-enabled
          - uid: mondoo-vercel-security-project-trusted-ips-enforced
          - uid: mondoo-vercel-security-project-trusted-ips-allowlist-configured
          - uid: mondoo-vercel-security-project-no-protection-bypass
      - title: Vercel Build and Source
        checks:
          - uid: mondoo-vercel-security-project-git-fork-protection-enabled
          - uid: mondoo-vercel-security-project-source-not-public
          - uid: mondoo-vercel-security-project-supported-node-version
      - title: Vercel Environment Variables
        checks:
          - uid: mondoo-vercel-security-project-no-plaintext-env-vars
      - title: Vercel Web Application Firewall
        checks:
          - uid: mondoo-vercel-security-project-firewall-enabled
          - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow
      - title: Vercel API Tokens
        checks:
          - uid: mondoo-vercel-security-tokens-have-expiration
          - uid: mondoo-vercel-security-tokens-not-stale
      - title: Vercel Storage
        checks:
          - uid: mondoo-vercel-security-stores-no-public-blob
      - title: Vercel Domains and Certificates
        checks:
          - uid: mondoo-vercel-security-certificates-auto-renew
          - uid: mondoo-vercel-security-domains-verified
          - uid: mondoo-vercel-security-domains-auto-renew
      - title: Vercel Team Governance
        checks:
          - uid: mondoo-vercel-security-team-strict-protection-settings
          - uid: mondoo-vercel-security-team-shared-env-vars-not-plaintext
    scoring_system: highest impact
queries:
  # ---------------------------------------------------------------------------
  # Deployment protection
  # ---------------------------------------------------------------------------
  - uid: mondoo-vercel-security-project-preview-deployments-authenticated
    title: Ensure Vercel Authentication protects the project's deployments
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-vercel-security-project-preview-deployments-authenticated-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-preview-deployments-authenticated-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-preview-deployments-authenticated-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-preview-deployments-authenticated-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Vercel Authentication is enabled for the project, so that loading any of its deployments requires signing in to Vercel first.

        Vercel Authentication, which Vercel also calls SSO protection, puts a Vercel login in front of a deployment URL. It is administered under **Settings > Deployment Protection** in the project, and the REST API exposes it as the project's `ssoProtection` object. The check requires that object to be present with a `deploymentType`, which is what Vercel records once protection is turned on for either **Standard Protection** or **All Deployments**. A null value means every generated deployment URL, including preview builds of unreleased features, is reachable by anyone who has the link.

        **Why this matters**

        Preview URLs leak easily. They are posted into pull requests, chat threads, and CI logs as a matter of routine, and once one escapes that circle it can be crawled and indexed by search engines, because nothing about an open deployment tells a crawler to stay away.

        Pre-production code is exactly the code least ready to be public. Preview builds carry unreleased features, debug output, verbose error pages, and test data that has not been hardened, and they are frequently wired to production-like backends. An attacker who reads a preview build learns what is coming, and often reaches data the released application never exposes.

        Link secrecy is not access control. A long, hard-to-guess URL is an obscurity measure, not a security boundary; only authentication decides who can load the deployment. Requiring a Vercel login forces every viewer to prove an identity before anything renders.

        Scope the protection to the deployments that need it. Standard protection gates previews while leaving production public, which is right for a public site; choose all deployments when production must stay private as well. A project whose whole purpose is to serve anonymous traffic, such as a marketing site, is the case where this should not be applied, and it should be exempted deliberately rather than left unprotected by default. Where reviewers do not hold Vercel accounts, pair this with password protection instead of turning authentication off.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > Deployment Protection**.
        3. Review the **Vercel Authentication** section.

        A passing result shows Vercel Authentication enabled for the project's deployments; a failing result shows it turned off.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.ssoProtection'
        ```

        A passing response returns a non-null `ssoProtection` object with a `deploymentType`; a failing response returns `null`.
      remediation:
        - id: console
          desc: |
            To require authentication for the project's deployments using the Vercel dashboard:

            1. Open the project and go to **Settings > Deployment Protection**.
            2. In the **Vercel Authentication** section, enable protection.
            3. Choose the deployment scope: **Standard Protection**, or **All Deployments** when production must also be gated.
            4. Save the changes.
        - id: api
          desc: |
            To enable Vercel Authentication through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
              --data '{ "ssoProtection": { "deploymentType": "prod_deployment_urls_and_all_previews" } }'
            ```
        - id: terraform
          desc: |
            To require authentication in Terraform, set the `vercel_authentication` block on the `vercel_project` resource:

            ```hcl
            resource "vercel_project" "example" {
              name = "example"

              vercel_authentication = {
                deployment_type = "standard_protection_new"
              }
            }
            ```
    refs:
      - url: https://vercel.com/docs/security/deployment-protection
        title: Vercel deployment protection documentation

  - uid: mondoo-vercel-security-project-preview-deployments-authenticated-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.ssoProtectionDeploymentType != empty
  # vercel_authentication is optional and computed, and Vercel turns Standard Protection on for
  # new projects, so an omitted argument leaves protection in force and passes. The failing state
  # is the explicit deployment_type = "none", which is how the provider spells turning it off.
  - uid: mondoo-vercel-security-project-preview-deployments-authenticated-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_project")
    mql: |
      terraform.resources("vercel_project").all(arguments["vercel_authentication"] == empty || arguments["vercel_authentication"]["deployment_type"] != "none")
  - uid: mondoo-vercel-security-project-preview-deployments-authenticated-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_project")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_project").all(change.after["vercel_authentication"] == empty || change.after["vercel_authentication"]["deployment_type"] != "none")
  - uid: mondoo-vercel-security-project-preview-deployments-authenticated-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_project")
    mql: |
      terraform.state.resources.where(type == "vercel_project").all(values["vercel_authentication"] == empty || values["vercel_authentication"]["deployment_type"] != "none")
  - uid: mondoo-vercel-security-project-password-protection-enabled
    title: Ensure password protection is enabled for the project's deployments
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-14
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-6-3
      compliance/vda-isa-5: vda-isa-5-4-1-2
    variants:
      - uid: mondoo-vercel-security-project-password-protection-enabled-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-password-protection-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-password-protection-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-password-protection-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that password protection is enabled for the project, so that viewing a deployment requires entering a shared password.

        Password protection gates a deployment behind a single shared secret rather than a Vercel identity. Enable it under **Settings > Deployment Protection** in the project, where you set the password and the deployment scope; the REST API exposes it as the project's `passwordProtection` object, and the check requires that object to be present rather than null.

        **Why this matters**

        Not every viewer has a Vercel account. External reviewers, agency partners, and stakeholders outside the team cannot pass Vercel Authentication, and the usual workaround is to leave the deployment open to everyone holding the link. A shared password gates those viewers without granting any of them access to the team itself.

        It also layers defense in depth on top of Vercel Authentication. A link shared more widely than intended still lands on a password prompt, so a forwarded URL, a pasted screenshot, or a stale bookmark does not become an open door into the deployment.

        Staging content is what this most often protects. Unreleased campaigns, pricing changes, and staging environments stay out of public and crawler reach while they are still drafts, which matters commercially as well as technically.

        A shared password is a shared secret, so treat it as one. Rotate it periodically, and immediately after anyone who held it leaves or after any suspected exposure, because there is no per-person revocation for a value everyone uses. Where every viewer does have a Vercel account, make Vercel Authentication the primary gate and keep the password as the second barrier rather than the only one.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > Deployment Protection**.
        3. Review the **Password Protection** section.

        A passing result shows password protection enabled; a failing result shows it turned off.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.passwordProtection'
        ```

        A passing response returns a non-null `passwordProtection` object; a failing response returns `null`.
      remediation:
        - id: console
          desc: |
            To enable password protection using the Vercel dashboard:

            1. Open the project and go to **Settings > Deployment Protection**.
            2. In the **Password Protection** section, enable protection.
            3. Set a strong shared password and choose the deployment scope.
            4. Save the changes.
        - id: api
          desc: |
            To enable password protection through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
              --data '{ "passwordProtection": { "deploymentType": "preview", "password": "<strong-password>" } }'
            ```
        - id: terraform
          desc: |
            To enable password protection in Terraform, set the `password_protection` block on the `vercel_project` resource:

            ```hcl
            resource "vercel_project" "example" {
              name = "example"

              password_protection = {
                deployment_type = "standard_protection_new"
                password        = var.preview_password
              }
            }
            ```
    refs:
      - url: https://vercel.com/docs/security/deployment-protection
        title: Vercel deployment protection documentation

  - uid: mondoo-vercel-security-project-password-protection-enabled-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.passwordProtectionDeploymentType != empty
  # password_protection is optional and not computed, so Vercel leaves it off unless the author
  # declares it. An absent argument is an unprotected project and fails.
  - uid: mondoo-vercel-security-project-password-protection-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_project")
    mql: |
      terraform.resources("vercel_project").all(arguments["password_protection"] != empty)
  - uid: mondoo-vercel-security-project-password-protection-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_project")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_project").all(change.after["password_protection"] != empty)
  - uid: mondoo-vercel-security-project-password-protection-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_project")
    mql: |
      terraform.state.resources.where(type == "vercel_project").all(values["password_protection"] != empty)
  - uid: mondoo-vercel-security-project-trusted-ips-enforced
    title: Ensure Trusted IPs protection is enforced rather than optional
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-vercel-security-project-trusted-ips-enforced-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-trusted-ips-enforced-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-trusted-ips-enforced-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-trusted-ips-enforced-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that when Trusted IPs protection is configured for the project, it is set to the mode that requires a trusted address rather than the mode that merely offers one.

        Trusted IPs restricts which source networks may reach a project's deployments. It is configured under **Settings > Deployment Protection** in the project, and the REST API exposes the enforcement mode as `trustedIps.protectionMode`. The check accepts a null value, meaning Trusted IPs is not configured at all, and it accepts `additional`, the mode in which a trusted IP is required alongside whatever other protection is in force. It fails on `exclusive`, the optional mode. The Terraform provider spells the required mode `trusted_ip_required` on the `trusted_ips` block of `vercel_project`.

        **Why this matters**

        An optional allowlist is not a boundary. In the optional mode a request from outside the trusted ranges still reaches the deployment by satisfying another protection method, and a request from inside them is admitted on its address alone without satisfying any other. Both directions weaken the control: the restriction you configured constrains nobody, while an address match quietly becomes a credential.

        Network restrictions only reduce exposure when requests from outside them are rejected outright. The whole value of naming a set of trusted networks is that everything else is refused. Make the match optional and the allowlist degrades into a record of who you expected rather than a limit on who arrives.

        Required mode confines reach to the networks you deliberately trust, which is what least privilege means for a deployment. Office ranges, VPN egress addresses, and CI runners get in; the rest of the internet does not.

        Keep the trusted ranges current, because office and VPN egress addresses change and CI providers rotate their pools. A stale range either locks out the people who need access or leaves a network trusted long after it stopped being yours. This check passes when Trusted IPs is not configured at all, since such a project relies on Vercel Authentication or password protection instead; where the audience is a fixed set of networks, configure it and set it to the required mode.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > Deployment Protection**.
        3. Review the **Trusted IPs** section and its enforcement mode.

        A passing result shows Trusted IPs disabled or set to require a trusted IP; a failing result shows it set to the optional mode.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.trustedIps.protectionMode'
        ```

        A passing response returns `null` or `"additional"` (Trusted IPs required alongside any other protection); a failing response returns `"exclusive"` (a matching IP alone bypasses protection).
      remediation:
        - id: console
          desc: |
            To enforce Trusted IPs using the Vercel dashboard:

            1. Open the project and go to **Settings > Deployment Protection**.
            2. In the **Trusted IPs** section, set the enforcement mode to require a trusted IP.
            3. Confirm the allowlisted address ranges are correct.
            4. Save the changes.
        - id: api
          desc: |
            To set Trusted IPs to required mode through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
              --data '{ "trustedIps": { "deploymentType": "all", "protectionMode": "additional", "addresses": [ { "value": "203.0.113.0/24" } ] } }'
            ```
        - id: terraform
          desc: |
            To enforce Trusted IPs in Terraform, set `protection_mode` on the `trusted_ips` block of the `vercel_project` resource:

            ```hcl
            resource "vercel_project" "example" {
              name = "example"

              trusted_ips = {
                deployment_type = "all_deployments"
                protection_mode = "trusted_ip_required"
                addresses = [
                  { value = "203.0.113.0/24" }
                ]
              }
            }
            ```
    refs:
      - url: https://vercel.com/docs/security/deployment-protection/methods-to-protect-deployments/trusted-ips
        title: Vercel Trusted IPs documentation

  - uid: mondoo-vercel-security-project-trusted-ips-enforced-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.trustedIpsProtectionMode == empty || vercel.project.trustedIpsProtectionMode == "additional"
  # The provider names the two modes trusted_ip_required and trusted_ip_optional, which the API
  # returns as additional and exclusive. A project with no trusted_ips argument is out of scope,
  # and an omitted protection_mode leaves the required mode in force.
  - uid: mondoo-vercel-security-project-trusted-ips-enforced-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_project")
    mql: |
      terraform.resources("vercel_project").all(arguments["trusted_ips"] == empty || arguments["trusted_ips"]["protection_mode"] != "trusted_ip_optional")
  - uid: mondoo-vercel-security-project-trusted-ips-enforced-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_project")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_project").all(change.after["trusted_ips"] == empty || change.after["trusted_ips"]["protection_mode"] != "trusted_ip_optional")
  - uid: mondoo-vercel-security-project-trusted-ips-enforced-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_project")
    mql: |
      terraform.state.resources.where(type == "vercel_project").all(values["trusted_ips"] == empty || values["trusted_ips"]["protection_mode"] != "trusted_ip_optional")
  # No Terraform variants: the provider requires trusted_ips.addresses to hold at least one
  # entry, so terraform plan rejects a configuration that turns Trusted IPs on with an empty
  # allowlist. The state this check exists to catch can be reached through the API but cannot be
  # declared in HCL, and a variant would pass on every configuration that plans at all.
  - uid: mondoo-vercel-security-project-trusted-ips-allowlist-configured
    filters: asset.platform == "vercel-project"
    title: Ensure a Trusted IPs allowlist is set when the protection is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    mql: |
      vercel.project.trustedIpsProtectionMode == empty || vercel.project.trustedIpsAddresses != empty
    docs:
      desc: |
        This check verifies that when Trusted IPs protection is enabled for the project, the allowlist actually names at least one address range.

        The allowlist is the set of CIDR ranges permitted to reach protected deployments. It is maintained under **Settings > Deployment Protection** in the project and returned by the REST API as `trustedIps.addresses`. The check passes when `trustedIps.protectionMode` is null, meaning the protection is off, or when the address list holds at least one entry. It fails when the protection is configured while that list is empty.

        **Why this matters**

        An empty allowlist is not a control. Trusted IPs limits reach only when the list names the networks permitted to connect. With nothing in it, the feature either blocks all traffic or, depending on how the rest of the protection is configured, enforces nothing at all, and neither outcome is what the person who enabled it intended.

        A misconfiguration of this shape hides as protection. A settings overview or a compliance screenshot shows Trusted IPs enabled and reads as a network restriction in place, while the enforcement behind it is empty. That gap survives review precisely because the toggle looks correct.

        Every network permitted to reach protected deployments should be declared deliberately. Populate the list with the specific CIDR ranges that need access, label each one with what it is, and keep the entries scoped to current office, VPN, and CI networks so the list stays a statement about who should reach the deployments today rather than an accumulation of everyone who ever did.

        If the project does not need a network restriction, turn Trusted IPs off rather than leaving it enabled and empty. An unconfigured protection is at least honest about enforcing nothing, and this check passes on it.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > Deployment Protection**.
        3. In the **Trusted IPs** section, review the configured address ranges.

        A passing result shows Trusted IPs disabled, or enabled with one or more address ranges; a failing result shows it enabled with no ranges.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.trustedIps.addresses'
        ```

        A passing response returns `null` when disabled, or a non-empty array; a failing response returns an empty array while `trustedIps` is set.
      remediation:
        - id: console
          desc: |
            To populate the Trusted IPs allowlist using the Vercel dashboard:

            1. Open the project and go to **Settings > Deployment Protection**.
            2. In the **Trusted IPs** section, add each CIDR range that must reach protected deployments.
            3. Save the changes.
        - id: api
          desc: |
            To set the Trusted IPs allowlist through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
              --data '{ "trustedIps": { "deploymentType": "all", "protectionMode": "additional", "addresses": [ { "value": "203.0.113.0/24", "note": "office" } ] } }'
            ```
        - id: terraform
          desc: |
            To declare the allowlist in Terraform, populate `addresses` on the `trusted_ips` block of the `vercel_project` resource:

            ```hcl
            resource "vercel_project" "example" {
              name = "example"

              trusted_ips = {
                deployment_type = "all_deployments"
                protection_mode = "trusted_ip_required"
                addresses = [
                  { value = "203.0.113.0/24", note = "office" },
                  { value = "198.51.100.10/32", note = "ci" }
                ]
              }
            }
            ```
    refs:
      - url: https://vercel.com/docs/security/deployment-protection/methods-to-protect-deployments/trusted-ips
        title: Vercel Trusted IPs documentation

  - uid: mondoo-vercel-security-project-git-fork-protection-enabled
    title: Ensure Git fork protection is enabled for the project
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ais-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-25
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-ps-06
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc8-1-2
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-vercel-security-project-git-fork-protection-enabled-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-git-fork-protection-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-git-fork-protection-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-git-fork-protection-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the project requires authorization before it builds a pull request opened from a forked repository.

        Fork protection holds deployments from forks until a maintainer approves them. Vercel labels it **Fork Protection** under **Settings > Git** in the project, the REST API exposes it as `gitForkProtection`, and the Terraform provider sets it as `git_fork_protection` on `vercel_project`. The check requires the value to be true.

        **Why this matters**

        On Vercel a Git push is a deploy, so without fork protection anyone who can open a pull request can cause the project's build to run. That build executes the code in the fork with the project's environment variables available to it, which hands an outside contributor arbitrary code execution inside your build with your secrets in reach.

        Exfiltration from there is trivial. One added line in a build script can print the environment to the build log or POST the environment variables to an attacker-controlled endpoint, and the deployment then succeeds normally, so nothing about the run looks wrong. Tokens taken this way stay valid until somebody notices and rotates them.

        On a public repository the pool of potential contributors is unbounded. That is the point of a public repository, and it is precisely why the build must not trust the contents of a fork. Fork protection restores the review step, so a maintainer decides that this particular change is safe to build before it runs.

        Pair it with scoping the secrets themselves. Keep sensitive environment variables out of the preview environment that fork builds run in, so an approval mistake costs a preview-scoped value rather than production access. A project on a private repository where every contributor already has write access gains less from the setting, but leaving it enabled costs only a click per external contribution.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > Git**.
        3. Review the **Fork Protection** setting, which holds deployments from forked repositories until they are authorized.

        A passing result shows fork protection enabled; a failing result shows it disabled.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.gitForkProtection'
        ```

        A passing response returns `true`; a failing response returns `false`.
      remediation:
        - id: console
          desc: |
            To enable fork protection using the Vercel dashboard:

            1. Open the project and go to **Settings > Git**.
            2. Enable **Fork Protection** so pull requests from forks require authorization before they deploy.
            3. Save the changes.
        - id: api
          desc: |
            To enable fork protection through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
              --data '{ "gitForkProtection": true }'
            ```
        - id: terraform
          desc: |
            To enable fork protection in Terraform, set `git_fork_protection` on the `vercel_project` resource:

            ```hcl
            resource "vercel_project" "example" {
              name                = "example"
              git_fork_protection = true
            }
            ```
    refs:
      - url: https://vercel.com/docs/git
        title: Vercel Git integration documentation

  - uid: mondoo-vercel-security-project-git-fork-protection-enabled-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.gitForkProtection == true
  # git_fork_protection defaults to true, so the Terraform forms assert != false: an omitted
  # argument keeps fork protection on and passes, and only an explicit false fails.
  - uid: mondoo-vercel-security-project-git-fork-protection-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_project")
    mql: |
      terraform.resources("vercel_project").all(arguments["git_fork_protection"] != false)
  - uid: mondoo-vercel-security-project-git-fork-protection-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_project")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_project").all(change.after["git_fork_protection"] != false)
  - uid: mondoo-vercel-security-project-git-fork-protection-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_project")
    mql: |
      terraform.state.resources.where(type == "vercel_project").all(values["git_fork_protection"] != false)
  # No Terraform variants: vercel_project still accepts public_source, but the provider marks
  # it deprecated and states the feature has been removed from Vercel and the attribute no
  # longer has any effect. A variant would assert an argument that changes nothing.
  - uid: mondoo-vercel-security-project-source-not-public
    filters: asset.platform == "vercel-project"
    title: Ensure the project's deployment source is not publicly viewable
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-17
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-4
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ds-5
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-22
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-22
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-12
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      vercel.project.publicSource == false
    docs:
      desc: |
        This check verifies that the project's build source is not exposed through the public deployment inspector.

        The deployment inspector shows a deployment's source, build output, and logs. Vercel labels the visibility setting **Publicly viewable source** under **Settings > General** in the project, the REST API exposes it as `publicSource`, and the Terraform provider sets it as `public_source` on `vercel_project`. When it is on, anyone holding a deployment URL can open the inspector for that deployment and read all three. The check requires the value to be false.

        **Why this matters**

        Source and logs are where secrets end up in practice. Build source and output frequently contain tokens, internal endpoints, and configuration that were never meant to leave the team, and build logs print values nobody expected an outsider to read. Public source turns all of it into a URL that needs no credentials.

        Readable source also hands an attacker a map. Route definitions, undocumented endpoints, feature flags, and client-side checks that the server does not repeat all become visible, so probing the application stops being guesswork and becomes reading. Finding the weak point is the expensive part of an attack, and this removes that cost.

        The setting exists for open collaboration, not for privacy. It is the right choice for a demo or an open source project whose code is already public, and the wrong default for a private application. Repository visibility and inspector visibility are configured independently, so a private repository can still be serving a public inspector without anyone having chosen that.

        Turning it off is not a substitute for keeping secrets out of builds. Review what the build emits regardless, since those same logs remain readable by everyone with team access and by anyone who later flips the setting back on.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > General**.
        3. Review the **Publicly viewable source** setting for the deployment inspector.

        A passing result shows public source disabled; a failing result shows it enabled.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.publicSource'
        ```

        A passing response returns `false` or `null`; a failing response returns `true`.
      remediation:
        - id: console
          desc: |
            To make the deployment source private using the Vercel dashboard:

            1. Open the project and go to **Settings > General**.
            2. Disable **Publicly viewable source**.
            3. Save the changes.
        - id: api
          desc: |
            To disable public source through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
              --data '{ "publicSource": false }'
            ```
        - id: terraform
          desc: |
            To keep the source private in Terraform, set `public_source` to `false` on the `vercel_project` resource:

            ```hcl
            resource "vercel_project" "example" {
              name          = "example"
              public_source = false
            }
            ```
    refs:
      - url: https://vercel.com/docs/deployments/inspect-deployment
        title: Vercel deployment inspector documentation

  - uid: mondoo-vercel-security-project-supported-node-version
    title: Ensure the project builds on a supported Node.js version
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-tvm-01
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-1-ii-b-security-management-process-risk-management
      compliance/iso-27001-2022: iso-27001-2022-a-8-8
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-12
      compliance/nist-csf-2: nist-csf-2-pr-ps-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sa-22
      compliance/nist-sp-800-171: nist-sp-800-171--3-14-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a03
      compliance/pci-dss-4: pcidss-requirement-6-3-3
      compliance/soc2-2017: soc2-control-cc7-1-5
      compliance/vda-isa-5: vda-isa-5-5-2-5
    variants:
      - uid: mondoo-vercel-security-project-supported-node-version-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-supported-node-version-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-supported-node-version-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-supported-node-version-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the project is not pinned to a Node.js major version that has reached end of life.

        The runtime is selected as **Node.js Version** under **Settings > General** in the project, exposed as `nodeVersion` on the REST API and as `node_version` on the `vercel_project` Terraform resource. The check fails when the value is `14.x`, `16.x`, or `18.x`, each of which is past its end-of-life date, and passes when the field is unset, in which case the project builds on the platform default.

        **Why this matters**

        An end-of-life runtime receives no further security fixes. Once a Node.js major line leaves maintenance, vulnerabilities found in the runtime itself, in the TLS library it bundles, or in its HTTP parsing stay unpatched for everyone still pinned to it, and the published advisories tell an attacker exactly what to try.

        Serverless functions inherit whatever the runtime carries, so this is not confined to build time. Every request the project serves executes on the selected runtime, which makes a vulnerable runtime a vulnerable request path for the whole application rather than a build-only concern.

        Delay compounds the cost. Each release the project sits out widens the jump it eventually has to make, and a migration across several major versions at once, together with the dependency upgrades that come with it, is far riskier than moving one line at a time.

        Track the Node.js release schedule and plan each move ahead of the end-of-life date rather than after it, then redeploy so the new runtime takes effect, since the setting applies to the next build rather than retroactively. Note that the check names specific expired versions, so a version that leaves maintenance after this policy was written will keep passing until that list is updated.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > General**.
        3. Review the **Node.js Version** setting.

        A passing result shows a supported Node.js major version; a failing result shows an end-of-life version such as 14.x, 16.x, or 18.x.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.nodeVersion'
        ```

        A passing response returns a supported version; a failing response returns an end-of-life version.
      remediation:
        - id: console
          desc: |
            To upgrade the Node.js version using the Vercel dashboard:

            1. Open the project and go to **Settings > General**.
            2. Set **Node.js Version** to a supported major version.
            3. Redeploy the project so the new runtime takes effect.
        - id: api
          desc: |
            To set the Node.js version through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
              --data '{ "nodeVersion": "22.x" }'
            ```
        - id: terraform
          desc: |
            To pin a supported runtime in Terraform, set `node_version` on the `vercel_project` resource:

            ```hcl
            resource "vercel_project" "example" {
              name         = "example"
              node_version = "22.x"
            }
            ```
    refs:
      - url: https://vercel.com/docs/functions/runtimes/node-js
        title: Vercel Node.js runtime documentation

  - uid: mondoo-vercel-security-project-supported-node-version-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.nodeVersion == empty || ["14.x", "16.x", "18.x"].contains(vercel.project.nodeVersion) == false
  # An omitted node_version reads as null, and null matches none of the three end-of-life
  # values, so a project that builds on the platform default passes.
  - uid: mondoo-vercel-security-project-supported-node-version-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_project")
    mql: |
      terraform.resources("vercel_project").all(arguments["node_version"] != "14.x" && arguments["node_version"] != "16.x" && arguments["node_version"] != "18.x")
  - uid: mondoo-vercel-security-project-supported-node-version-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_project")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_project").all(change.after["node_version"] != "14.x" && change.after["node_version"] != "16.x" && change.after["node_version"] != "18.x")
  - uid: mondoo-vercel-security-project-supported-node-version-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_project")
    mql: |
      terraform.state.resources.where(type == "vercel_project").all(values["node_version"] != "14.x" && values["node_version"] != "16.x" && values["node_version"] != "18.x")
  # ---------------------------------------------------------------------------
  # Environment variables
  # ---------------------------------------------------------------------------
  # No Terraform variants: vercel_project_environment_variable exposes only a sensitive
  # boolean, not the type enum this check reads, and the provider never creates a plaintext
  # variable. A variant would either pass vacuously or assert a stricter control than the
  # runtime check, which accepts encrypted as well as sensitive.
  - uid: mondoo-vercel-security-project-no-plaintext-env-vars
    filters: asset.platform == "vercel-project"
    title: Ensure environment variables are not stored in plaintext
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-8-3-2
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      vercel.project.environmentVariables.all(type != "plain")
    docs:
      desc: |
        This check verifies that the project stores no environment variable with the plaintext type.

        Vercel records a type on every environment variable, shown under **Settings > Environment Variables** in the project, listed by `vercel env ls`, and returned as `type` by the REST API. A variable of the `plain` type is stored and returned in clear text, so its value is readable by anyone with project access and is exposed in API responses. The check requires every variable on the project to use a protected type instead: encrypted, sensitive, or secret.

        **Why this matters**

        A plaintext value is readable by everyone who can read the project. That includes every team member with project access, every token scoped to the project, and anything that has ever called the environment variable endpoint, which in practice means CI systems and local tooling as well as people.

        Secrets stored that way spread far beyond their intended audience. Database URLs, API keys, and third-party tokens are exactly the values that end up as plaintext, because plaintext is the path of least resistance at creation time, and once a value can be retrieved it gets copied into local environment files, support tickets, and screenshots.

        The protected types close the read path rather than the write path. A sensitive or secret variable can still be set and injected into builds and functions, but its value cannot be read back afterward, so a compromised account or a leaked read-scoped token no longer yields the secret itself.

        Plaintext remains the correct type for values that are genuinely public, such as a public API base URL or a feature flag name, and hiding those buys nothing. Treat any secret that was stored as plaintext as already compromised: convert the variable and rotate the underlying credential, because converting alone does not undo the reads that already happened.
      audit: |
        ### Audit via CLI

        1. Ensure the `vercel` CLI is authenticated with `vercel login`.
        2. Pull the project's environment variables and inspect their types:

        ```bash
        vercel env ls
        ```

        A passing result lists no variables of the plaintext type; a failing result shows one or more plaintext entries.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>/env?teamId=<team-id>" \
          | jq '.envs[] | select(.type == "plain") | .key'
        ```

        A passing response returns nothing; a failing response lists the keys stored as plaintext.
      remediation:
        - id: console
          desc: |
            To convert plaintext variables using the Vercel dashboard:

            1. Open the project and go to **Settings > Environment Variables**.
            2. Remove each plaintext secret and re-add it as a **Sensitive** variable.
            3. Rotate any secret that was previously stored as plaintext, since its value may have been exposed.
        - id: cli
          desc: |
            To replace a plaintext variable with a sensitive one using the `vercel` CLI, remove it and re-add it with the `--sensitive` flag:

            ```bash
            # Remove the plaintext variable from the environment it targets
            vercel env rm DATABASE_URL production --yes

            # Re-add it as a sensitive variable
            vercel env add DATABASE_URL production --sensitive --value "<secret>"
            ```
        - id: terraform
          desc: |
            To store a secret with a protected type in Terraform, set `sensitive = true` on the `vercel_project_environment_variable` resource:

            ```hcl
            resource "vercel_project_environment_variable" "database_url" {
              project_id = vercel_project.example.id
              key        = "DATABASE_URL"
              value      = var.database_url
              target     = ["production"]
              sensitive  = true
            }
            ```
    refs:
      - url: https://vercel.com/docs/environment-variables/sensitive-environment-variables
        title: Vercel sensitive environment variables documentation

  # ---------------------------------------------------------------------------
  # Web Application Firewall
  # ---------------------------------------------------------------------------
  - uid: mondoo-vercel-security-project-firewall-enabled
    title: Ensure the project's Web Application Firewall is enabled
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-09
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: false
      compliance/nist-csf-1: nist-csf-1-pr-pt-4
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-6-4-2
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-vercel-security-project-firewall-enabled-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-firewall-enabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-firewall-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-firewall-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the Vercel Web Application Firewall is enabled for the project.

        The WAF is Vercel's request-filtering layer in front of a project's deployments. It is administered from the project's **Firewall** tab in the dashboard and exposed as `firewallEnabled` on the firewall configuration API, and the Terraform provider sets it as `enabled` on `vercel_firewall_config`. The check requires the value to be true, because custom rules, managed rulesets, and IP rules are evaluated only while the firewall is on.

        **Why this matters**

        Rules that are not evaluated do nothing. A project can carry a carefully written rule set and still filter no traffic at all, because the master switch governs whether any of it runs. That failure mode is quiet: the rules are still listed, still look correct, and still read as protection during a review.

        With no filtering, application-layer traffic arrives at the deployment unmodified. Injection attempts, credential stuffing, scrapers, and automated vulnerability scanners reach the functions directly, where the only thing between them and the application is the application's own input handling.

        Filtering at the edge also bounds cost, not only risk. A request blocked before it reaches a function is a request that never invokes one, which matters when the traffic is a bot flood rather than a targeted attack.

        Enabling the firewall is the first step rather than the whole control. Turn on the managed rulesets, including the OWASP ruleset, for baseline coverage, and add custom rules for the paths specific to the application. Where the false-positive rate is unknown, start a rule in a logging or challenge action and move it to deny once the traffic is understood.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to the **Firewall** tab.
        3. Review whether the firewall is enabled.

        A passing result shows the firewall enabled; a failing result shows it disabled.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v1/security/firewall/config/active?projectId=<project-id>&teamId=<team-id>" \
          | jq '.firewallEnabled'
        ```

        A passing response returns `true`; a failing response returns `false`.
      remediation:
        - id: console
          desc: |
            To enable the firewall using the Vercel dashboard:

            1. Open the project and go to the **Firewall** tab.
            2. Enable the Web Application Firewall.
            3. Review and enable the managed rulesets you want to enforce.
        - id: api
          desc: |
            To enable the firewall through the REST API:

            ```bash
            curl -s -X PUT -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v1/security/firewall/config?projectId=<project-id>&teamId=<team-id>" \
              --data '{ "firewallEnabled": true }'
            ```
        - id: terraform
          desc: |
            To enable the firewall in Terraform, set `enabled` on the `vercel_firewall_config` resource:

            ```hcl
            resource "vercel_firewall_config" "example" {
              project_id = vercel_project.example.id
              enabled    = true
            }
            ```
    refs:
      - url: https://vercel.com/docs/vercel-firewall/vercel-waf
        title: Vercel Web Application Firewall documentation

  - uid: mondoo-vercel-security-project-firewall-enabled-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.firewall.enabled == true
  # enabled defaults to true on vercel_firewall_config, so the Terraform forms assert != false
  # and only an explicit false fails.
  - uid: mondoo-vercel-security-project-firewall-enabled-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_firewall_config")
    mql: |
      terraform.resources("vercel_firewall_config").all(arguments["enabled"] != false)
  - uid: mondoo-vercel-security-project-firewall-enabled-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_firewall_config")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_firewall_config").all(change.after["enabled"] != false)
  - uid: mondoo-vercel-security-project-firewall-enabled-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_firewall_config")
    mql: |
      terraform.state.resources.where(type == "vercel_firewall_config").all(values["enabled"] != false)
  - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow
    title: Ensure no firewall IP or bypass rule allows all source addresses
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-1
      compliance/vda-isa-5: vda-isa-5-5-2-7
    variants:
      - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the project's firewall carries no IP rule and no system bypass rule matching every source address.

        IP rules and system bypass rules are managed on the project's **Firewall** tab in the dashboard and returned by the firewall configuration API. The check fails on any IP rule whose action is `allow` at `0.0.0.0/0` or `::/0`, and on any system bypass rule whose action is `bypass` at those same addresses. The IP rule actions the Terraform provider accepts on `vercel_firewall_config` are `bypass`, `log`, `challenge`, and `deny`, so an exception that skips filtering is a `bypass` rule and belongs on a narrow range.

        **Why this matters**

        An allow rule covering an entire address family waves through all traffic from it, and it can take precedence over the deny rules and managed rulesets configured alongside it. The firewall is still enabled and still evaluating, and it still admits everyone.

        A system bypass rule is stronger still. It short-circuits rule evaluation entirely for the traffic it matches, so a bypass entry at `0.0.0.0/0` or `::/0` exempts every client from filtering no matter how carefully the rest of the firewall is written. A single entry neutralizes the whole configuration.

        Both hide as scoped exceptions. In a rule list an entry reads as a specific carve-out for a partner or a monitoring service, and only the address column distinguishes a narrow exception from one matching the entire internet. Reviewers read the intent and skim past the mask.

        The practical loss is the firewall's ability to act on source address at all. Blocking a known-bad client, rate limiting an abusive network, or denying a region stops working the moment an allow-all or bypass-all rule sits above those rules.

        Replace blanket entries with the specific ranges that genuinely need to skip filtering, such as an uptime monitor's published addresses or a payment provider's callback ranges. Note that `0.0.0.0/0` and `::/0` cover separate address families, so removing one while leaving the other still exempts every client that reaches the deployment over that protocol.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to the **Firewall** tab.
        3. Review the IP rules for any allow entry covering all addresses, and review the system bypass rules for any bypass entry covering all addresses.

        A passing result shows no allow rule and no bypass rule matching `0.0.0.0/0` or `::/0`; a failing result shows such a rule.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v1/security/firewall/config/active?projectId=<project-id>&teamId=<team-id>" \
          | jq '.ips[] | select(.action == "allow" and (.ip == "0.0.0.0/0" or .ip == "::/0"))'
        ```

        A passing response returns nothing; a failing response returns the offending rule.
      remediation:
        - id: console
          desc: |
            To remove a broad allow or bypass rule using the Vercel dashboard:

            1. Open the project and go to the **Firewall** tab.
            2. Locate any IP allow rule matching `0.0.0.0/0` or `::/0`, and any system bypass rule matching `0.0.0.0/0` or `::/0`.
            3. Delete the rule, or narrow it to the specific ranges that genuinely need to bypass filtering.
        - id: api
          desc: |
            To remove a broad IP allow rule through the REST API, delete it by its rule identifier:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v1/security/firewall/config?projectId=<project-id>&teamId=<team-id>" \
              --data '{ "action": "ip.remove", "id": "<ip-rule-id>" }'
            ```
        - id: terraform
          desc: |
            To scope firewall IP rules in Terraform, declare only the specific ranges on the `vercel_firewall_config` resource and omit any all-addresses entry. The IP rule actions the provider accepts are `bypass`, `log`, `challenge`, and `deny`, so an exception that skips filtering is a `bypass` rule bound to a narrow range:

            ```hcl
            resource "vercel_firewall_config" "example" {
              project_id = vercel_project.example.id
              enabled    = true

              ip_rules {
                rule {
                  action   = "bypass"
                  ip       = "203.0.113.0/24"
                  hostname = "*"
                }
              }
            }
            ```
    refs:
      - url: https://vercel.com/docs/vercel-firewall/vercel-waf/ip-blocking
        title: Vercel firewall IP rules documentation

  - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.firewall.ipRules.none(action == "allow" && ip == "0.0.0.0/0")
      vercel.project.firewall.ipRules.none(action == "allow" && ip == "::/0")
      vercel.project.firewall.bypassRules.none(action == "bypass" && ip == "0.0.0.0/0")
      vercel.project.firewall.bypassRules.none(action == "bypass" && ip == "::/0")
  # The provider's ip_rules take bypass, log, challenge, or deny, with no allow action: bypass is
  # the action that lets a source past the firewall, so it is what the runtime allow rule maps to.
  # vercel_firewall_bypass is the declarative form of a system bypass rule.
  - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_firewall_config")
    mql: |
      terraform.resources("vercel_firewall_config").all(blocks.where(type == "ip_rules").all(blocks.where(type == "rule").none(arguments["action"] == "bypass" && arguments["ip"] == "0.0.0.0/0")))
      terraform.resources("vercel_firewall_config").all(blocks.where(type == "ip_rules").all(blocks.where(type == "rule").none(arguments["action"] == "bypass" && arguments["ip"] == "::/0")))
      terraform.resources("vercel_firewall_bypass").none(arguments["source_ip"] == "0.0.0.0/0")
      terraform.resources("vercel_firewall_bypass").none(arguments["source_ip"] == "::/0")
  - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_firewall_config")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_firewall_config").all(change.after["ip_rules"] == empty || change.after["ip_rules"]["rule"].none(_["action"] == "bypass" && _["ip"] == "0.0.0.0/0"))
      terraform.plan.resourceChanges.where(type == "vercel_firewall_config").all(change.after["ip_rules"] == empty || change.after["ip_rules"]["rule"].none(_["action"] == "bypass" && _["ip"] == "::/0"))
      terraform.plan.resourceChanges.where(type == "vercel_firewall_bypass").none(change.after["source_ip"] == "0.0.0.0/0")
      terraform.plan.resourceChanges.where(type == "vercel_firewall_bypass").none(change.after["source_ip"] == "::/0")
  - uid: mondoo-vercel-security-project-firewall-no-broad-ip-allow-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_firewall_config")
    mql: |
      terraform.state.resources.where(type == "vercel_firewall_config").all(values["ip_rules"] == empty || values["ip_rules"]["rule"].none(_["action"] == "bypass" && _["ip"] == "0.0.0.0/0"))
      terraform.state.resources.where(type == "vercel_firewall_config").all(values["ip_rules"] == empty || values["ip_rules"]["rule"].none(_["action"] == "bypass" && _["ip"] == "::/0"))
      terraform.state.resources.where(type == "vercel_firewall_bypass").none(values["source_ip"] == "0.0.0.0/0")
      terraform.state.resources.where(type == "vercel_firewall_bypass").none(values["source_ip"] == "::/0")
  # ---------------------------------------------------------------------------
  # API tokens (team-scoped posture)
  # ---------------------------------------------------------------------------
  - uid: mondoo-vercel-security-tokens-have-expiration
    title: Ensure Vercel API tokens have an expiration date
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-17
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-6-3
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-1
    variants:
      - uid: mondoo-vercel-security-tokens-have-expiration-vercel-team
        tags:
          mondoo.com/filter-title: Vercel Team
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-tokens-have-expiration-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-tokens-have-expiration-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-tokens-have-expiration-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that every API token owned by the authenticated account carries an expiration date.

        Tokens are created and reviewed under **Account Settings > Tokens** in the Vercel dashboard, where the expiration is chosen at creation time. The REST API returns it as `expiresAt` on each token, and the Terraform provider sets it as `expires_at` on `vercel_user_token`, as a Unix timestamp in milliseconds. The check fails on any token whose expiration is null, meaning the token never expires.

        **Why this matters**

        A non-expiring token is a permanent credential. If it leaks into a commit, a build log, a CI job's environment, or a laptop backup, it grants access for as long as nobody notices, and noticing requires somebody to go looking rather than the credential simply lapsing on its own.

        Permanent tokens also spread. A credential with no end date is copied into scripts, pipelines, container images, and developer machines over months and years, so by the time it is questioned nobody can enumerate where it lives. Revoking it then becomes a service-disruption decision instead of a cleanup task, which is how permanent tokens survive review after review.

        Without an expiry there is nothing prompting rotation. Expiration dates are what turn credential rotation into a scheduled, rehearsed operation rather than a step performed under pressure during an incident.

        Give every token the shortest lifetime its consumer can work with, and rotate before expiry rather than after, so automation never depends on a permanent credential and the rotation path stays exercised. Where a long-lived integration genuinely needs continuous access, a short-lived token refreshed by automation is still safer than one that never ends.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Go to **Account Settings > Tokens**.
        3. Review the expiration shown for each token.

        A passing result shows an expiration date on every token; a failing result shows one or more tokens that never expire.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v5/user/tokens" \
          | jq '.tokens[] | select(.expiresAt == null) | .name'
        ```

        A passing response returns nothing; a failing response lists the names of tokens with no expiration.
      remediation:
        - id: console
          desc: |
            To replace a non-expiring token using the Vercel dashboard:

            1. Go to **Account Settings > Tokens**.
            2. Create a new token and choose an explicit expiration.
            3. Update the consumers to use the new token.
            4. Delete the old non-expiring token.
        - id: cli
          desc: |
            To revoke a non-expiring token using the `vercel` CLI, list the tokens to find its ID and remove it, then recreate it with an expiration through the dashboard:

            ```bash
            # Find the token's ID
            vercel tokens ls

            # Revoke the non-expiring token
            vercel tokens remove <token-id>
            ```
        - id: terraform
          desc: |
            To manage a token with an explicit lifetime in Terraform, set `expires_at` on the `vercel_user_token` resource. The value is a Unix timestamp in milliseconds, so pick the shortest lifetime the consumer can work with and move it forward on each rotation:

            ```hcl
            resource "vercel_user_token" "ci_deployments" {
              name       = "ci-deployments"
              expires_at = 1798761600000
            }
            ```
    refs:
      - url: https://vercel.com/docs/rest-api/reference/welcome/api-scopes
        title: Vercel access token documentation

  - uid: mondoo-vercel-security-tokens-have-expiration-vercel-team
    filters: asset.platform == "vercel-team"
    mql: |
      vercel.accessTokens.none(expiresAt == empty)
  # expires_at is optional on vercel_user_token, so an omitted argument mints a token that never
  # expires and fails. The provider takes a Unix timestamp in milliseconds.
  - uid: mondoo-vercel-security-tokens-have-expiration-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_user_token")
    mql: |
      terraform.resources("vercel_user_token").all(arguments["expires_at"] != empty)
  - uid: mondoo-vercel-security-tokens-have-expiration-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_user_token")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_user_token").all(change.after["expires_at"] != empty)
  - uid: mondoo-vercel-security-tokens-have-expiration-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_user_token")
    mql: |
      terraform.state.resources.where(type == "vercel_user_token").all(values["expires_at"] != empty)
  # No Terraform variants: staleness is derived from when a token was last used, which is
  # activity Vercel records rather than configuration an author declares.
  - uid: mondoo-vercel-security-tokens-not-stale
    filters: asset.platform == "vercel-team"
    title: Ensure unused Vercel API tokens are removed
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-08
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-18
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-2-6
      compliance/soc2-2017: soc2-control-cc6-2-3
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      vercel.accessTokens.all(lastUsedAt != empty && time.now - lastUsedAt < 90 * time.day || lastUsedAt == empty && time.now - createdAt < 90 * time.day)
    docs:
      desc: |
        This check verifies that the account holds no stale API tokens.

        Token activity is shown under **Account Settings > Tokens** in the Vercel dashboard, listed by `vercel tokens ls`, and returned by the REST API as the token's last activity time alongside its creation time. The check treats a token as stale in two cases: it was last used more than 90 days ago, or it has never been used at all and was created more than 90 days ago. Either way the fix is to remove it with `vercel tokens remove`.

        **Why this matters**

        An unused token is an unwatched token. Nobody is checking a credential that nothing depends on, so if somebody else is using it the activity blends into a history no one reads, and the abuse continues for as long as the token lives.

        Abandoned tokens outlive their purpose. Credentials issued for a decommissioned integration, a one-off migration, or an engineer who has since left keep granting exactly the access they always did, long after the reason for issuing them ended. Nothing about the token records that its purpose expired.

        Every credential that exists is a credential that can leak. Pruning the idle ones shrinks the set of secrets in circulation, and it keeps the remaining list short enough that an unfamiliar entry stands out rather than disappearing among dozens.

        A token created recently and not yet used is not stale, which is why a never-used token is measured against its creation date instead of failing immediately. Before deleting, confirm nothing depends on the token, since a low-frequency job such as a quarterly report can legitimately go months between uses. Where that is the case, record the token's owner and purpose so the next review does not have to rediscover them.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Go to **Account Settings > Tokens**.
        3. Review the last-used time shown for each token.

        A passing result shows every token used within the last 90 days; a failing result shows tokens idle for more than 90 days or never used since well before then.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v5/user/tokens" \
          | jq '.tokens[] | {name, activeAt, createdAt}'
        ```

        A passing response shows a recent `activeAt` for each token; a failing response shows tokens whose last activity is old or absent.
      remediation:
        - id: console
          desc: |
            To remove stale tokens using the Vercel dashboard:

            1. Go to **Account Settings > Tokens**.
            2. Identify tokens with no recent use.
            3. Delete each token that is no longer needed after confirming nothing depends on it.
        - id: cli
          desc: |
            To delete a stale token using the `vercel` CLI, list the tokens and remove the unused one by its ID:

            ```bash
            vercel tokens ls
            vercel tokens remove <token-id>
            ```
        # No Terraform remediation: the fix is to stop a token existing, and the
        # vercel_user_token resource expresses that by being deleted rather than by
        # carrying an attribute a snippet could show.
    refs:
      - url: https://vercel.com/docs/rest-api/reference/welcome/api-scopes
        title: Vercel access token documentation

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  - uid: mondoo-vercel-security-stores-no-public-blob
    title: Ensure Blob stores are not publicly accessible
    impact: 85
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-dsp-17
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ds-5
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-3
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-22
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-1-4-4
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-vercel-security-stores-no-public-blob-vercel-team
        tags:
          mondoo.com/filter-title: Vercel Team
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-stores-no-public-blob-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-stores-no-public-blob-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-stores-no-public-blob-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the team has no Vercel Blob store configured for public access.

        Blob stores are listed under the team's **Storage** tab in the dashboard and by `vercel blob list-stores`, and the storage API returns each one with a type of `blob` and an `access` level. The Terraform provider sets it as `access` on `vercel_blob_store`. The check fails on any Blob store whose access is `public`, which serves every object it holds to anyone with the URL and no authentication at all.

        **Why this matters**

        A public object needs no credentials, only a URL, and URLs travel. They appear in page source, in email, in shared documents, and in browser history, and they keep working after the person who received one has left, because there is no session or token to revoke and Blob URLs are easy to enumerate or leak.

        Sensitive data reaches these stores by accident more often than by decision. User uploads, generated exports, invoices, and support attachments are written to whatever store the application was pointed at, and a store originally chosen for public assets ends up holding private files as the application grows.

        Exposure is silent by design. When access is public there is no per-request authorization to evaluate, so there is nothing to deny, nothing to log, and no signal that separates an attacker enumerating objects from ordinary traffic. The first indication of a leak is usually external.

        Keep stores private and serve objects through signed, time-limited URLs, which gives every download an expiry and an authorization point. A genuinely public store is a reasonable choice for static assets already served to everyone; if you keep one, separate it from the store that receives user content, and audit its contents to confirm that everything in it was meant to be public.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Go to the team's **Storage** tab.
        3. Open each Blob store and review its access level.

        A passing result shows every Blob store set to private; a failing result shows one or more Blob stores set to public.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v1/storage/stores?teamId=<team-id>" \
          | jq '.stores[] | select(.type == "blob" and .access == "public") | .name'
        ```

        A passing response returns nothing; a failing response lists the public Blob stores.
      remediation:
        - id: console
          desc: |
            To make a Blob store private using the Vercel dashboard:

            1. Go to the team's **Storage** tab and open the Blob store.
            2. Change its access level to private.
            3. Update any consumer that relied on public URLs to use signed URLs instead.
        - id: cli
          desc: |
            To review Blob stores using the `vercel` CLI, then change a store's access level from the dashboard. Blob store access is set through the dashboard and the Blob SDK:

            ```bash
            # List all Blob stores for the team
            vercel blob list-stores

            # Inspect a specific store
            vercel blob get-store <store-id>
            ```
        - id: terraform
          desc: |
            To keep a Blob store private in Terraform, set `access` to `private` on the `vercel_blob_store` resource:

            ```hcl
            resource "vercel_blob_store" "assets" {
              name   = "assets"
              access = "private"
            }
            ```
    refs:
      - url: https://vercel.com/docs/vercel-blob
        title: Vercel Blob documentation

  - uid: mondoo-vercel-security-stores-no-public-blob-vercel-team
    filters: asset.platform == "vercel-team"
    mql: |
      vercel.team.stores.where(storeType == "blob").none(access == "public")
  # access defaults to public on vercel_blob_store, so an omitted argument creates a store that
  # serves every object it holds to anyone with the URL. The Terraform forms require the explicit
  # private value rather than accepting an absent one.
  - uid: mondoo-vercel-security-stores-no-public-blob-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_blob_store")
    mql: |
      terraform.resources("vercel_blob_store").all(arguments["access"] == "private")
  - uid: mondoo-vercel-security-stores-no-public-blob-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_blob_store")
    mql: |
      terraform.plan.resourceChanges.where(type == "vercel_blob_store").all(change.after["access"] == "private")
  - uid: mondoo-vercel-security-stores-no-public-blob-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_blob_store")
    mql: |
      terraform.state.resources.where(type == "vercel_blob_store").all(values["access"] == "private")
  # ---------------------------------------------------------------------------
  # Domains and certificates
  # ---------------------------------------------------------------------------
  # No Terraform variants: vercel_custom_certificate uploads a certificate the team renews
  # itself and carries no auto-renew argument, and the certificates Vercel issues and renews
  # have no resource at all.
  - uid: mondoo-vercel-security-certificates-auto-renew
    filters: asset.platform == "vercel-team"
    title: Ensure TLS certificates renew automatically
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-2-ii-transmission-security-encryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-17
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      vercel.team.certificates.none(autoRenew == false)
    docs:
      desc: |
        This check verifies that every TLS certificate issued for the team's domains is set to renew automatically.

        Certificates are listed by `vercel certs ls` and shown per domain under the team's **Domains** tab in the dashboard, and each carries an `autoRenew` setting. The check fails on any certificate where that setting is false, meaning Vercel will not reissue it before it expires.

        **Why this matters**

        An expired certificate takes the site down over HTTPS. Browsers refuse the connection outright and present an interstitial instead of the application, so a lapsed certificate is a full outage across every domain it covers, arriving on a date nobody was watching.

        Manual renewal fails the way all calendar-driven work fails. It depends on one person remembering one date, and certificates outlive the team structures meant to track them, so the step is missed during a handover, a holiday, or a reorganization rather than through carelessness.

        The security cost outlasts the outage. A TLS warning that users are told to click through teaches them that warnings are noise, and a workforce trained to bypass certificate errors will bypass a genuine interception exactly the same way.

        Let Vercel reissue certificates for the domains it manages, and monitor expiry dates independently so that a renewal which fails, usually because DNS or domain configuration changed underneath it, is caught while there is still time to fix it. A certificate uploaded by hand for a domain served elsewhere is the case where this legitimately does not apply, and those need their own renewal automation rather than a permanent exception.
      audit: |
        ### Audit via CLI

        1. Ensure the `vercel` CLI is authenticated with `vercel login`.
        2. List the team's certificates and review their renewal state:

        ```bash
        vercel certs ls
        ```

        A passing result shows every certificate set to renew automatically; a failing result shows certificates without auto-renewal.

        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open a domain under the team's **Domains** tab and review its certificate.

        A passing result shows automatic renewal enabled; a failing result shows it disabled.
      remediation:
        - id: console
          desc: |
            To restore automatic renewal using the Vercel dashboard:

            1. Go to the team's **Domains** tab and open the affected domain.
            2. Ensure the domain's DNS and configuration allow Vercel to manage its certificate.
            3. Let Vercel reissue an auto-renewing certificate for the domain.
        - id: cli
          desc: |
            To issue a Vercel-managed certificate that renews automatically, find the stale certificate, remove it, and let Vercel reissue one:

            ```bash
            # Find the certificate's ID
            vercel certs ls

            # Remove the certificate that does not renew
            vercel certs rm <cert-id>

            # Let Vercel issue a managed certificate for the domain
            vercel certs issue <domain>
            ```
        # No Terraform remediation: TLS certificates are issued and auto-renewed by
        # Vercel for configured domains; the vercel Terraform provider does not expose
        # a certificate renewal resource.
    refs:
      - url: https://vercel.com/docs/domains/working-with-ssl
        title: Vercel SSL certificate documentation

  # No Terraform variants: verified is read-only on vercel_project_domain. Verification is
  # completed by publishing DNS records and is state Vercel reports, not state HCL sets.
  - uid: mondoo-vercel-security-domains-verified
    filters: asset.platform == "vercel-team"
    title: Ensure all team domains are verified
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-5-9
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-1
      compliance/vda-isa-5: false
    mql: |
      vercel.team.domains.none(verified == false)
    docs:
      desc: |
        This check verifies that every domain registered to the team has completed ownership verification.

        Domains are listed by `vercel domains ls` and under the team's **Domains** tab in the dashboard, and the REST API returns a `verified` flag on each one. Verification is completed by adding the DNS records that `vercel domains inspect` reports and then running `vercel domains verify`. The check fails on any domain that is still unverified.

        **Why this matters**

        An unverified domain is one whose control Vercel has not been able to confirm. Routing and certificate issuance for it are not fully established, so the domain may be serving nothing, serving the wrong project, or failing TLS, and the team's own configuration cannot be trusted to describe what is actually live.

        Dangling domain configurations are a well-worn path to subdomain takeover. A name that points at Vercel but has never been claimed there can be added and verified by whoever completes the handshake first, and an attacker who does so serves content from your name, collects cookies scoped to it, and passes any domain validation that relies on it.

        A long-unverified entry is usually evidence of something abandoned. A migration that stalled, a domain moved to another provider, or a project deleted without cleaning up its hostnames all leave the same trace, and each is a loose end that outlives the person who created it.

        Complete verification for the domains the team intends to keep, and delete the entries for domains it no longer controls or plans to use. A domain added moments ago and waiting on DNS propagation will fail this check briefly, which is expected; one that has been unverified for weeks is not waiting on propagation, it is an unfinished setup.
      audit: |
        ### Audit via CLI

        1. Ensure the `vercel` CLI is authenticated with `vercel login`.
        2. List the team's domains and review their verification state:

        ```bash
        vercel domains ls
        ```

        A passing result shows every domain verified; a failing result shows one or more domains marked unverified.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v5/domains?teamId=<team-id>" \
          | jq '.domains[] | select(.verified == false) | .name'
        ```

        A passing response returns nothing; a failing response lists the unverified domains.
      remediation:
        - id: console
          desc: |
            To verify a domain using the Vercel dashboard:

            1. Go to the team's **Domains** tab and open the unverified domain.
            2. Add the verification DNS records shown for the domain at your DNS provider.
            3. Trigger verification once the records propagate.
        - id: cli
          desc: |
            To inspect and verify a domain through the `vercel` CLI:

            ```bash
            # Show the verification challenge and DNS configuration
            vercel domains inspect <domain>

            # Complete verification once the records have propagated
            vercel domains verify <domain>
            ```

            Add the DNS records the inspect command reports at your DNS provider, then run the verify command to complete the handshake.
        # No Terraform remediation: domain ownership verification is a DNS-record and
        # dashboard workflow tied to the registrar; the vercel Terraform provider does
        # not manage the verification handshake for a team domain.
    refs:
      - url: https://vercel.com/docs/domains/working-with-domains/add-a-domain
        title: Vercel domain verification documentation

  # No Terraform variants: the provider has no resource for registering a domain through
  # Vercel, so the renewal setting on a purchased domain cannot be declared.
  - uid: mondoo-vercel-security-domains-auto-renew
    filters: asset.platform == "vercel-team"
    title: Ensure purchased domains renew automatically
    impact: 65
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: false
      compliance/nist-csf-2: nist-csf-2-id-am-08
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: false
      compliance/pci-dss-4: false
      compliance/soc2-2017: soc2-control-cc6-1-1
      compliance/vda-isa-5: false
    mql: |
      vercel.team.domains.where(boughtAt != empty).none(renewAutomatically == false)
    docs:
      desc: |
        This check verifies that every domain purchased through Vercel is set to renew automatically.

        The check looks only at registered domains, meaning the ones the REST API returns with a `boughtAt` timestamp, and it fails when `renewAutomatically` is false on any of them. The setting is administered per domain under the team's **Domains** tab in the dashboard, and `vercel domains inspect` reports the current state.

        **Why this matters**

        A domain that lapses becomes available to anyone. Expiry is not a quiet internal event: dropped names are tracked and registered within minutes by speculators, and there is no mechanism to reclaim one afterward beyond negotiating with whoever now holds it.

        Whoever registers it inherits everything attached to the name. Inbound links, bookmarks, OAuth redirect URIs, mail addressed to the domain, and any residual DNS trust now belong to a third party, who can serve content as you, receive password resets sent to addresses at the domain, and pass domain-validated certificate issuance for it.

        Renewal deadlines are missed by exactly the organizations least able to absorb it. Manual renewal requires somebody to act before a date that recurs once a year or less, and the domains most likely to be forgotten are the older, peripheral ones that nonetheless still resolve and still carry trust.

        Enable automatic renewal and keep a valid payment method on file, since auto-renewal fails silently when the card on file has expired and the outcome is indistinguishable from never having enabled it. Domains registered elsewhere and only pointed at Vercel fall outside this check, and they need the same renewal guarantee at their own registrar.
      audit: |
        ### Audit via CLI

        1. Ensure the `vercel` CLI is authenticated with `vercel login`.
        2. List the team's domains and review the renewal setting for purchased domains:

        ```bash
        vercel domains ls
        ```

        A passing result shows every purchased domain set to renew automatically; a failing result shows a purchased domain with auto-renewal off.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v5/domains?teamId=<team-id>" \
          | jq '.domains[] | select(.boughtAt != null and .renewAutomatically == false) | .name'
        ```

        A passing response returns nothing; a failing response lists purchased domains without auto-renewal.
      remediation:
        - id: console
          desc: |
            To enable auto-renewal using the Vercel dashboard:

            1. Go to the team's **Domains** tab and open the purchased domain.
            2. Enable automatic renewal for the domain.
            3. Confirm a valid payment method is on file so the renewal can complete.
        - id: cli
          desc: |
            To review a purchased domain's registration and renewal state through the `vercel` CLI:

            ```bash
            vercel domains inspect <domain>
            ```

            Enable automatic renewal from the dashboard if the command reports it is off.
        # No Terraform remediation: domain registration and auto-renewal are billing
        # operations on domains purchased through Vercel; the vercel Terraform provider
        # does not manage domain registration lifecycle.
    refs:
      - url: https://vercel.com/docs/domains/working-with-domains/renew-a-domain
        title: Vercel domain renewal documentation

  # ---------------------------------------------------------------------------
  # Deployment-protection bypass
  # ---------------------------------------------------------------------------
  - uid: mondoo-vercel-security-project-no-protection-bypass
    title: Ensure projects have no deployment-protection bypass secrets
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    variants:
      - uid: mondoo-vercel-security-project-no-protection-bypass-vercel-project
        tags:
          mondoo.com/filter-title: Vercel Project
          mondoo.com/filter-icon: vercel
      - uid: mondoo-vercel-security-project-no-protection-bypass-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-no-protection-bypass-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vercel-security-project-no-protection-bypass-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that the project carries no deployment-protection bypass secrets.

        Protection Bypass for Automation issues a secret that lets any request presenting it reach the project's deployments without satisfying Vercel Authentication, password protection, or Trusted IPs. Registered secrets appear under **Settings > Deployment Protection** in the project, in the **Protection Bypass for Automation** section, and the REST API returns them in the project's `protectionBypass` object. The check requires the count of registered secrets to be zero.

        **Why this matters**

        A bypass secret defeats the deployment protection configured on the project. A request carrying it skips authentication entirely, so whichever protection method the team chose no longer gates who can load a deployment. The secret does.

        Bypass secrets are long-lived by default. They do not expire on their own, so once issued one grants access until somebody revokes it deliberately, and they live wherever the automation that uses them lives, typically a CI configuration or a synthetic monitoring tool, which is where secret hygiene is weakest.

        The blast radius is the whole project rather than a single URL. A bypass is registered against the project, so it covers production and preview deployments alike and every hostname the project serves, which makes a leaked bypass equivalent to turning protection off for all of them at once.

        Automation does sometimes need unauthenticated access, for end-to-end tests or uptime probes against protected previews. Where that is genuinely the case, keep the number of outstanding secrets minimal, rotate them on a schedule, and store them as sensitive credentials rather than plain configuration. Where it is not, revoke them, because a bypass left over from an experiment is indistinguishable from one still in use.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Open the project, then go to **Settings > Deployment Protection**.
        3. Review the **Protection Bypass for Automation** section for registered bypass secrets.

        A passing result shows no bypass secrets registered on the project; a failing result shows one or more active bypasses.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v9/projects/<project-id>?teamId=<team-id>" \
          | jq '.protectionBypass | length'
        ```

        A passing response reports `0`; any higher number is the count of protection-bypass secrets registered on the project.
      remediation:
        - id: console
          desc: |
            To remove deployment-protection bypass secrets using the Vercel dashboard:

            1. Open the project and go to **Settings > Deployment Protection**.
            2. In **Protection Bypass for Automation**, delete any bypass secret that is no longer required.
            3. For any automation that still needs access, prefer a scoped, rotated credential over a standing bypass.
        - id: api
          desc: |
            To revoke a bypass secret on the project through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v1/projects/<project-id>/protection-bypass?teamId=<team-id>" \
              --data '{ "revoke": { "secret": "<bypass-secret>", "regenerate": false } }'
            ```
        # No Terraform remediation: the fix is to stop a bypass existing, and the
        # vercel_project_protection_bypass resource expresses that by being deleted
        # rather than by carrying an attribute a snippet could show. Bypasses created
        # outside Terraform are revoked through the dashboard or the REST API.
    refs:
      - url: https://vercel.com/docs/security/deployment-protection/methods-to-bypass-deployment-protection/protection-bypass-automation
        title: Vercel protection bypass for automation documentation

  - uid: mondoo-vercel-security-project-no-protection-bypass-vercel-project
    filters: asset.platform == "vercel-project"
    mql: |
      vercel.project.protectionBypassCount == 0
  # vercel_project_protection_bypass is the declarative form of a Protection Bypass for
  # Automation secret, so a configuration that declares one registers a bypass. The filters select
  # on vercel_project, the resource being protected, so a project with no bypass passes rather
  # than dropping out of scope.
  - uid: mondoo-vercel-security-project-no-protection-bypass-terraform-hcl
    filters: asset.platform == "terraform-hcl" && terraform.resources.contains(nameLabel == "vercel_project")
    mql: |
      terraform.resources("vercel_project_protection_bypass").length == 0
  - uid: mondoo-vercel-security-project-no-protection-bypass-terraform-plan
    filters: asset.platform == "terraform-plan" && terraform.plan.resourceChanges.contains(type == "vercel_project")
    mql: |
      terraform.plan.resourceChanges.none(type == "vercel_project_protection_bypass")
  - uid: mondoo-vercel-security-project-no-protection-bypass-terraform-state
    filters: asset.platform == "terraform-state" && terraform.state.resources.contains(type == "vercel_project")
    mql: |
      terraform.state.resources.none(type == "vercel_project_protection_bypass")
  # ---------------------------------------------------------------------------
  # Team governance and shared secrets
  # ---------------------------------------------------------------------------
  # No Terraform variants: these read team-wide account settings exposed only
  # through the Vercel API; the runtime check has no Terraform asset analog.
  - uid: mondoo-vercel-security-team-strict-protection-settings
    filters: asset.platform == "vercel-team"
    title: Ensure protection setting changes require the team owner role
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      vercel.team.strictDeploymentProtectionSettings == true
      vercel.team.strictPasswordProtectionSettings == true
    docs:
      desc: |
        This check verifies that the team requires the owner role to change deployment protection and password protection settings.

        Both restrictions live under **Team Settings > Security & Privacy** in the Vercel dashboard, and the teams API returns them as `strictDeploymentProtectionSettings` and `strictPasswordProtectionSettings`. The check requires both to be true, so that changing either protection is an owner-only action.

        **Why this matters**

        A protection is only as strong as the least privileged account that can switch it off. With strict settings disabled, any team member can disable Vercel Authentication or remove a password from a project, so a single compromised session, a phished contractor, or an ordinary mistake made while debugging exposes deployments the organization believes are gated.

        Restricting the change to owners narrows the set of accounts that can lower protection and makes the action accountable. The people who can weaken the control become a short, known list rather than everyone with project access, and loosening protection becomes a request that has to be made rather than something quietly performed.

        This is the setting the other deployment protection checks rest on. Vercel Authentication, password protection, and Trusted IPs each hold only while nobody can silently turn them off, so without owner-only enforcement a passing protection check describes the configuration at scan time rather than a guarantee about tomorrow.

        Keep the owner set itself small, for the same reason: the restriction moves risk into the owner role rather than eliminating it, and a team where most members are owners has enabled the setting without changing who can weaken protection. A team that deliberately delegates deployment protection to project maintainers should expect this check to fail and record that as an accepted exception.
      audit: |
        ### Audit via Dashboard

        1. Sign in to the Vercel dashboard at vercel.com.
        2. Go to **Team Settings > Security & Privacy**.
        3. Review whether changing deployment protection and password protection is restricted to the owner role.

        A passing result shows both restrictions enabled; a failing result shows either one allowing non-owners to change protection.

        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v2/teams/<team-id>" \
          | jq '{strictDeploymentProtectionSettings, strictPasswordProtectionSettings}'
        ```

        A passing response shows both fields set to `true`; a failing response shows either set to `false`.
      remediation:
        - id: console
          desc: |
            To restrict protection changes to owners using the Vercel dashboard:

            1. Go to **Team Settings > Security & Privacy**.
            2. Enable the option requiring the owner role to change deployment protection.
            3. Enable the option requiring the owner role to change password protection.
            4. Save the changes.
        - id: api
          desc: |
            To require the owner role for protection changes through the REST API:

            ```bash
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v2/teams/<team-id>" \
              --data '{ "strictDeploymentProtectionSettings": { "enabled": true }, "strictPasswordProtectionSettings": { "enabled": true } }'
            ```
        # No Terraform remediation: vercel_team_config manages team configuration but
        # exposes neither strict deployment-protection nor strict password-protection
        # settings, so they are set via the API or dashboard.
    refs:
      - url: https://vercel.com/docs/security/deployment-protection
        title: Vercel deployment protection documentation

  # No Terraform variants: vercel_shared_environment_variable exposes only a sensitive
  # boolean rather than the type enum this check reads, and the provider never creates a
  # plaintext shared variable.
  - uid: mondoo-vercel-security-team-shared-env-vars-not-plaintext
    filters: asset.platform == "vercel-team"
    title: Ensure shared environment variables are not stored in plaintext
    impact: 75
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: false
      compliance/dora: false
      compliance/hipaa: false
      compliance/iso-27001-2022: false
      compliance/nis-2: false
      compliance/nist-csf-1: false
      compliance/nist-csf-2: false
      compliance/nist-sp-800-53-rev5: false
      compliance/nist-sp-800-171: false
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: false
      compliance/soc2-2017: false
      compliance/vda-isa-5: false
    mql: |
      vercel.team.sharedEnvironmentVariables.all(type != "plain")
    docs:
      desc: |
        This check verifies that the team stores no shared environment variable with the plaintext type.

        Shared environment variables are defined once at the team level under **Team Settings > Environment Variables** and injected into the projects they target. Each carries a type, and a value of `plain` is stored and returned in clear text through the API and the dashboard. The check requires every shared variable to use a protected type instead, encrypted or sensitive, which the Terraform provider expresses as `sensitive = true` on `vercel_shared_environment_variable`.

        **Why this matters**

        A plaintext shared variable is readable in clear text by anyone who can read the team, including through the API. That audience is larger than the audience for a project variable by definition, because team-scoped visibility is the entire reason shared variables exist.

        Team scope multiplies the consequences of the leak. A shared variable is injected into many projects at once, so a plaintext secret is exposed across every project it targets rather than just one, and the credential behind it usually guards something central such as a payment provider, an observability backend, or a database all of those projects reach.

        The protected types prevent the stored value from being read back after it is set. It can still be injected into builds and functions, so nothing about the deployment changes; what changes is that a leaked read-scoped token or a compromised member account no longer yields the secret itself.

        Plaintext stays appropriate for shared values that are genuinely public, such as a public asset host or a region name, and those are often exactly what shared variables were created for. Any secret that has been stored as plaintext should be rotated as well as converted, since converting the variable does not invalidate a value that may already have been read.
      audit: |
        ### Audit via API

        ```bash
        curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v1/env?teamId=<team-id>" \
          | jq '.data[]? // .[]? | select(.type == "plain") | .key'
        ```

        A passing response returns nothing; a failing response lists the shared variable keys stored as plaintext.
      remediation:
        - id: console
          desc: |
            To convert plaintext shared variables using the Vercel dashboard:

            1. Go to **Team Settings > Environment Variables** (Shared Environment Variables).
            2. Remove each plaintext secret and re-add it as a **Sensitive** or **Encrypted** shared variable.
            3. Rotate any secret that was previously stored as plaintext, since its value may have been exposed.
        - id: api
          desc: |
            To recreate a shared variable with a protected type through the REST API, add it as a sensitive variable:

            ```bash
            curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v1/env?teamId=<team-id>" \
              --data '{ "type": "sensitive", "target": ["production"], "evs": [ { "key": "API_TOKEN", "value": "<secret>" } ] }'
            ```
        - id: terraform
          desc: |
            To store a shared secret with a protected type in Terraform, set `sensitive = true` on the `vercel_shared_environment_variable` resource:

            ```hcl
            resource "vercel_shared_environment_variable" "api_token" {
              key       = "API_TOKEN"
              value     = var.api_token
              target    = ["production"]
              sensitive = true

              project_ids = [vercel_project.example.id]
            }
            ```
    refs:
      - url: https://vercel.com/docs/environment-variables/shared-environment-variables
        title: Vercel shared environment variables documentation
