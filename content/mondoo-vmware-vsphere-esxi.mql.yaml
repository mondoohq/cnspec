        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-esxi-security-baseline-ensure-the-vswitch-mac-address-change-policy-is-set-to-reject-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that MAC address changes are rejected on every standard vSwitch on the host.

        This policy governs whether a guest may change the effective MAC address of its virtual adapter to something other than the address ESXi assigned it. Set it in the vSphere Client under Configure, Networking, Virtual switches, editing Security and setting MAC address changes to Reject, or on the host with `esxcli network vswitch standard policy security set`. It is a separate control from forged transmits, which a companion check in this policy covers.

        **Why this matters**

        Where forged transmits controls what a guest may put in the source field of frames it sends, this policy controls what the switch will deliver to it. A guest that changes its effective address is asking the vSwitch to hand it traffic destined for that address, so an attacker who takes over a low-value virtual machine reassigns its adapter to the address of a machine on the same segment and starts receiving that machine's inbound traffic.

        The target sees an intermittent fault rather than an attack, because some of its traffic stops arriving. The attacker sees session cookies, credentials, and database traffic belonging to a workload they never had to compromise, and they got there without leaving the guest they already owned.

        The same technique defeats anything that trusts a MAC address as an identity, including network access control and address-based licensing.

        Microsoft clustering, layer 2 bridges, and some licensing arrangements genuinely require the change. Give those machines their own port group with an explicit override rather than relaxing the policy on the vSwitch that everything else shares.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the host, then select `Configure` and expand `Networking`.
        2. Select `Virtual switches` and select `Edit` on each standard vSwitch.
        3. Under `Security`, confirm `MAC address changes` is set to `Reject`.

        ### Audit via the ESXi shell

        1. Connect to the ESXi host with SSH.
        2. Read the security policy of each standard vSwitch:

           ```bash
           esxcli network vswitch standard policy security get -v <vSwitch-name>
           ```

        The host passes when `Allow MAC Address Change` is `false` on every standard vSwitch. A value of `true` is a failing result.
      remediation:
        - id: vsphere-client
          desc: |
            To set the MAC Address Change policy to reject using the vSphere Client:

            1. From the vSphere Client, select the host.
            2. Select `Configure`, then expand `Networking`.
            3. Select `Virtual switches`, then select `Edit`.
            4. Select `Security`.
            5. Set `MAC address changes` to `Reject` in the dropdown.
            6. Select `OK`.

            **Impact:**

            This will prevent VMs from changing their effective MAC address. It will affect applications that require this functionality, such as Microsoft Clustering, which requires systems to effectively share a MAC address. This will affect how a layer 2 bridge will operate. This will also affect applications that require a specific MAC address for licensing. An exception should be made for the port groups that these applications are connected to.
        - id: cli
          desc: |
            To set the MAC Address Change policy to reject using the ESXi shell:

            ```bash
            esxcli network vswitch standard policy security set -v vSwitch2 -m false
            ```

            Replace `vSwitch2` with the target switch and run the command for each standard vSwitch on the host. List them with `esxcli network vswitch standard list`. Distributed switches and any per-port-group security overrides are configured separately and are not changed by this command.
        - id: terraform
          desc: |
            To reject MAC address changes on a standard vSwitch using Terraform, set `allow_mac_changes` to `false` on the `vsphere_host_virtual_switch` resource:

            ```hcl
            resource "vsphere_host_virtual_switch" "switch" {
              name           = "vSwitch2"
              host_system_id = data.vsphere_host.host.id

              network_adapters = ["vmnic0", "vmnic1"]
              active_nics      = ["vmnic0", "vmnic1"]

              allow_promiscuous      = false
              allow_mac_changes      = false
              allow_forged_transmits = false
            }
            ```
