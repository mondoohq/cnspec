    docs:
      desc: |
        This check verifies that promiscuous mode is rejected on every standard vSwitch on the host.

        Promiscuous mode decides whether a virtual adapter receives every frame passing through the switch rather than only the frames addressed to it. Set the policy in the vSphere Client under Configure, Networking, Virtual switches, editing Security and setting Promiscuous mode to Reject, or on the host with `esxcli network vswitch standard policy security set`.

        **Why this matters**

        A vSwitch with promiscuous mode allowed turns every guest on it into a potential network tap. An attacker who compromises the least important virtual machine on the segment puts its adapter into promiscuous mode and reads the traffic of every other machine sharing that switch, including workloads with far stronger defenses that they were never able to break into.

        What they collect is whatever those machines send in the clear on an internal segment, which is usually more than the design assumed: database connections, replication traffic, internal service calls, session tokens, and health check endpoints that carry credentials. It is entirely passive, so nothing on the other machines logs it, no connection is initiated, and there is no failed attempt to notice.

        This is the control that keeps virtual machines sharing a host from being able to see each other's traffic just because they share hardware, which is the property tenants assume they are getting.

        Intrusion detection sensors and packet capture appliances do need it. Put those on a dedicated port group with an explicit override, scoped to the segment they are meant to monitor, rather than allowing promiscuous mode on the vSwitch as a whole.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the host, then select `Configure` and expand `Networking`.
        2. Select `Virtual switches` and select `Edit` on each standard vSwitch.
        3. Under `Security`, confirm `Promiscuous mode` is set to `Reject`.

        ### Audit via the ESXi shell

        1. Connect to the ESXi host with SSH.
        2. Read the security policy of each standard vSwitch:

           ```bash
           esxcli network vswitch standard policy security get -v <vSwitch-name>
           ```

        The host passes when `Allow Promiscuous` is `false` on every standard vSwitch. A value of `true` is a failing result.
      remediation:
        - id: vsphere-client
          desc: |
            To set the Promiscuous Mode policy to reject using the vSphere Client:

            1. From the vSphere Client, select the host.
            2. Select `Configure`, then expand `Networking`.
            3. Select `Virtual switches`, then select `Edit`.
            4. Select `Security`.
            5. Set `Promiscuous mode` to `Reject` in the dropdown.
            6. Select `OK`.

            **Impact:**

            There might be a legitimate reason to enable promiscuous mode for debugging, monitoring, or troubleshooting reasons. Security devices might require the ability to see all packets on a vSwitch. An exception should be made for the dvPortgroups that these applications are connected to in order to allow for full-time visibility to the traffic on that dvPortgroup.
        - id: cli
          desc: |
            To set the Promiscuous Mode policy to reject using the ESXi shell:

            ```bash
            esxcli network vswitch standard policy security set -v vSwitch2 -p false
            ```

            Replace `vSwitch2` with the target switch and run the command for each standard vSwitch on the host. List them with `esxcli network vswitch standard list`. Distributed switches and any per-port-group security overrides are configured separately and are not changed by this command.
        - id: terraform
          desc: |
            To reject promiscuous mode on a standard vSwitch using Terraform, set `allow_promiscuous` to `false` on the `vsphere_host_virtual_switch` resource:

            ```hcl
            resource "vsphere_host_virtual_switch" "switch" {
              name           = "vSwitch2"
              host_system_id = data.vsphere_host.host.id

              network_adapters = ["vmnic0", "vmnic1"]
              active_nics      = ["vmnic0", "vmnic1"]

              allow_promiscuous      = false
              allow_mac_changes      = false
              allow_forged_transmits = false
            }
            ```
  # No Terraform variants: the vsphere Terraform provider does not manage ESXi host UEFI Secure Boot firmware state.
  - uid: mondoo-vmware-vsphere-esxi-security-baseline-ensure-uefi-secure-boot-is-enabled-on-the-esxi-host
    filters: asset.platform == "vmware-esxi"
    title: Ensure UEFI Secure Boot is enabled on the ESXi host
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a22
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-7
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-8
      compliance/nist-csf-2: nist-csf-2-pr-ps-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-4
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      vsphere.host.secureBootEnabled == true
    docs:
      desc: |
        This check verifies that the ESXi host boots with UEFI Secure Boot active.

        Secure Boot has the platform firmware validate the bootloader's signature, the bootloader validate the VMkernel, and the VMkernel validate every installed bundle, so each stage refuses to hand control to something it cannot verify. Confirm the state on the host with `/usr/lib/vmware/secureboot/bin/secureBoot.py -s`. Enabling it means the server firmware is set to boot in UEFI mode rather than legacy BIOS, and the host is checked for compatibility with `/usr/lib/vmware/secureboot/bin/secureBoot.py -c` before the change.

        **Why this matters**

        The hypervisor is the layer every workload on the host depends on, so an attacker who reaches it wants to stay. Modifying the boot path is how that is done, because code that loads before the VMkernel is outside anything the VMkernel or any guest can inspect. Such an implant survives reboots, survives patching the guests, and survives rebuilding the virtual machines entirely, since none of those touch the layer it lives in.

        Secure Boot removes that persistence. A modified bootloader or an unsigned module means the host refuses to start rather than starting compromised, which turns a silent, durable foothold into a visible failure someone has to investigate.

        The prerequisites are strict, and a host with any improperly signed bundle installed will not boot once Secure Boot is on. Resolve unsigned modules first, which a companion check in this policy identifies, then convert hosts one at a time with the console reachable, rather than enabling it across a cluster in one pass.
      audit: |-
        ### Audit via the ESXi shell

        1. Connect to the ESXi host with SSH.
        2. Check whether Secure Boot is active:

           ```bash
           /usr/lib/vmware/secureboot/bin/secureBoot.py -s
           ```

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Read the Secure Boot state of each host:

           ```powershell
           Get-VMHost | Select-Object Name, @{N='SecureBoot';E={(Get-View $_.ExtensionData.ConfigManager.BootDeviceSystem -ErrorAction SilentlyContinue)}}
           ```

        The host passes when UEFI Secure Boot reports as enabled. A host booting in legacy BIOS mode, or with Secure Boot disabled, is a failing result.
      remediation:
        - id: cli
          desc: |
            To enable UEFI Secure Boot using the ESXi shell and server firmware (the host must boot in UEFI mode and all installed VIBs must be properly signed):

            1. Confirm the host is configured to boot in UEFI mode (not legacy BIOS) in the server firmware.
            2. Validate that the current ESXi installation is Secure Boot compatible:

               ```bash
               /usr/lib/vmware/secureboot/bin/secureBoot.py -c
               ```

            3. Place the host in maintenance mode and migrate or shut down all running virtual machines.
            4. Reboot the host, enter the firmware setup, and enable `Secure Boot`.
            5. Boot ESXi and confirm Secure Boot is active:

               ```bash
               /usr/lib/vmware/secureboot/bin/secureBoot.py -s
               ```

            **Impact:**

            If any installed VIB is unsigned or improperly signed, the host will fail to boot with Secure Boot enabled. Resolve unsigned modules first (see "Ensure all loaded ESXi kernel modules are signed").
        # No Terraform remediation: UEFI Secure Boot is platform firmware configuration with no Terraform resource.
    refs:
      - url: https://docs.vmware.com/en/VMware-vSphere/8.0/vsphere-security/GUID-5D5EE0D1-2596-43D7-95C8-0B29733191D9.html
        title: UEFI Secure Boot for ESXi Hosts
