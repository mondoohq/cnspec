      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      vsphere.datacenters.all(
        clusters.where(vsan != null).all(
          vsan.encryptionEnabled == true
        )
      )
    docs:
      desc: |
        This check verifies that data-at-rest encryption is enabled on every vSAN-enabled cluster.

        vSAN data-at-rest encryption encrypts everything written to the vSAN datastore, including guest data, swap, and metadata, using keys from a configured key provider. Enable it in the vSphere Client by selecting the cluster and using Configure, vSAN, Services, then editing the Data-At-Rest Encryption service and selecting the key provider. A key provider must exist first under Configure and Key Providers. Enabling it triggers a rolling reformat of the disk groups, so plan for the resynchronization it causes.

        **Why this matters**

        vSAN stores data on drives inside the hosts themselves, which means the drives are physically handled far more often than an array in a locked cabinet. They are swapped on failure, returned to a vendor under warranty, pulled during a hardware refresh, and eventually disposed of. Every one of those drives holds fragments of guest disks written in the clear if the cluster is unencrypted, and a single recovered drive yields whatever objects happened to live on it.

        Encryption ties readability to the key provider instead of to possession of the hardware, which is what makes a failed drive returnable and a decommissioned host disposable.

        It also gives a clean end to data lifecycle. Retiring the key renders what the cluster stored unrecoverable without touching any of the drives.

        Losing the key provider means losing the data, so treat provider availability and key backup as part of the design. Note that this is a separate control from data-in-transit encryption, which a companion check in this policy covers.
      audit: |
        ### Audit via the vSphere Client

        1. Select the cluster and choose **Configure** > **vSAN** > **Services**.
        2. Expand the **Data-At-Rest Encryption** section.
        3. Confirm encryption is enabled and a key provider is assigned.

        The check passes when every vSAN-enabled cluster reports data-at-rest encryption as enabled. It fails for any vSAN cluster with data-at-rest encryption disabled.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-Cluster | Get-VsanClusterConfiguration | Select-Object Cluster, EncryptionEnabled
        ```

        The check passes when every vSAN-enabled cluster returns `EncryptionEnabled` as `True`. It fails for any cluster returning `False`.
      remediation:
        - id: vsphere-client
          desc: |
            To enable vSAN data-at-rest encryption using the vSphere Client:

            A key provider must be configured in vCenter Server first, either the Native Key Provider or a registered key server.

            **Enabling encryption on an existing Original Storage Architecture cluster triggers a rolling reformat of every disk group.** vSAN rewrites the data on each host in turn, which adds resynchronization load for the duration, so schedule the change for a quiet period.

            **On a vSAN 8 Express Storage Architecture cluster, data-at-rest encryption has to be enabled when the cluster is created.** Check the documentation for your vSAN release before planning an in-place change, since an unencrypted cluster of that type may need to be rebuilt.

            1. Confirm a key provider is listed under `vCenter` > `Configure` > `Key Providers`.
            2. Select the cluster and choose `Configure` > `vSAN` > `Services`.
            3. Edit the `Data-At-Rest Encryption` service and enable it.
            4. Select the key provider and apply the change.
        - id: powershell
          desc: |
            To enable vSAN data-at-rest encryption using PowerCLI:

            A key provider must be configured in vCenter Server first.

            **Enabling encryption on an existing Original Storage Architecture cluster triggers a rolling reformat of every disk group.** vSAN rewrites the data on each host in turn, which adds resynchronization load for the duration, so schedule the change for a quiet period.

            **On a vSAN 8 Express Storage Architecture cluster, data-at-rest encryption has to be enabled when the cluster is created.** Check the documentation for your vSAN release before planning an in-place change, since an unencrypted cluster of that type may need to be rebuilt.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Enable encryption with `Start-VsanEncryptionConfiguration`. Replace `<key-provider-name>` with the key provider name shown under `Key Providers` in vCenter Server, and `<cluster-name>` with the name of the vSAN cluster. `-Confirm:$false` suppresses the confirmation prompt:

               ```powershell
               $keyProvider = Get-KeyProvider -Name "<key-provider-name>"
               Get-Cluster -Name "<cluster-name>" | Start-VsanEncryptionConfiguration -EncryptionEnabled $true -KeyProvider $keyProvider -Confirm:$false
               ```

               Add `-EraseDisksBeforeUse $true` to also wipe residual data from the storage devices, which lengthens the reformat.
        # No Terraform remediation: the vsphere_compute_cluster resource exposes vsan_dit_encryption_enabled for data-in-transit only and has no data-at-rest encryption argument; at-rest encryption is bound to a vCenter key provider that the resource cannot reference.
