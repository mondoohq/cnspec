    docs:
      desc: |
        This check verifies that each virtual machine rotates its log at a bounded size.

        The `log.rotateSize` parameter sets the size in bytes at which a machine's log is rotated, and this check requires `1024000`. Set it under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or write it with `New-AdvancedSetting` from PowerCLI. An absent parameter is a failing result, since a machine with no configured rotation size lets a single file grow without a bound anyone chose.

        **Why this matters**

        The log is written by the host to the datastore holding the virtual machine, and a guest can influence how fast it fills. Noisy device activity or repeated failed operations from inside a machine generate entries, so an unbounded file is a way for one workload to consume shared storage, and a full datastore stops the virtual machines that share it from powering on or growing their disks.

        A bounded rotation size also keeps the record usable. Investigators reach for these files after an incident, and a single enormous file is slower to move, slower to search, and more likely to be truncated by whatever tooling handles it.

        Pair this with the companion check that fixes the number of rotated files, since size and count together determine both the storage a machine's logs can consume and the window of history they preserve. As with that check, do not satisfy this by disabling logging; the point is to keep the record and make it manageable.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `log.rotateSize` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'log.rotateSize'
        ```

        The check passes only when the parameter is present and set to `1024000` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To limit the VM log file size using the vSphere Client, set the advanced parameter `log.rotateSize` to `1024000`. The value rotates the virtual machine log when it reaches 1,024,000 bytes. The check passes only when the parameter is present with exactly `1024000`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `log.rotateSize` is already listed, enter `1024000` in its `Value` field and confirm the change. Otherwise, enter `log.rotateSize` as the attribute name and `1024000` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **Do not disable logging to satisfy this check.** Disabling VM logging removes the audit and troubleshooting record the check is meant to preserve, makes incident investigation and vendor support far harder, and weakens security visibility. Keep logging enabled and tune the rotation count and size instead.
        - id: powershell
          desc: |
            To limit the VM log file size using PowerCLI, set `log.rotateSize` to `1024000` on each virtual machine. The value rotates the virtual machine log when it reaches 1,024,000 bytes. The check passes only when the parameter is present with exactly `1024000`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "log.rotateSize" -Value 1024000 -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **Do not disable logging to satisfy this check.** Disabling VM logging removes the audit and troubleshooting record the check is meant to preserve, makes incident investigation and vendor support far harder, and weakens security visibility. Keep logging enabled and tune the rotation count and size instead.
        - id: terraform
          desc: |
            To limit the VM log file size with Terraform, set `log.rotateSize` to `1024000` in the `extra_config` map of the `vsphere_virtual_machine` resource. The value rotates the virtual machine log when it reaches 1,024,000 bytes. The check requires exactly `1024000`.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "log.rotateSize" = 1024000
              }
            }
            ```

            **Do not disable logging to satisfy this check.** Disabling VM logging removes the audit and troubleshooting record the check is meant to preserve, makes incident investigation and vendor support far harder, and weakens security visibility. Keep logging enabled and tune the rotation count and size instead.
