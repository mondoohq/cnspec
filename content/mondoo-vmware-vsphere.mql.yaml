    docs:
      desc: |
        This check verifies that guest access to the BIOS Boot Specification interface is disabled on each virtual machine.

        The BIOS Boot Specification lets software enumerate and reorder the bootable devices the virtual firmware knows about. Setting `isolation.bios.bbs.disable` to `TRUE` stops the guest from reaching that interface through VMware Tools, leaving boot order under the control of the virtual machine's own boot options in vCenter. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. An absent parameter is a failing result.

        **Why this matters**

        Boot order decides which code runs before any operating system control exists. An attacker with execution inside a guest who can influence it arranges for the next reboot to come up from attached media or a network source of their choosing instead of the system disk. What starts then is not the hardened operating system with its disk encryption and endpoint agent; it is an environment where the virtual disk is a block device with no access control on it, and where credential stores are read directly.

        That persists across the reboot the defender uses to recover, which is what makes boot-path tampering worth an attacker's effort in the first place.

        Disabling the interface is one layer. The stronger control is UEFI firmware with Secure Boot, covered by a companion check in this policy, which validates the signature of what actually loads rather than only limiting who may reorder the list.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.bios.bbs.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.bios.bbs.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable BIOS BBS using the vSphere Client, set the advanced parameter `isolation.bios.bbs.disable` to `TRUE`. With it set, the guest can no longer reach the BIOS Boot Specification interface through VMware Tools to reorder boot devices. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.bios.bbs.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.bios.bbs.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To disable BIOS BBS using PowerCLI, set `isolation.bios.bbs.disable` to `TRUE` on each virtual machine. With it set, the guest can no longer reach the BIOS Boot Specification interface through VMware Tools to reorder boot devices. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.bios.bbs.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
