        - id: powershell
          desc: |
            To disable the Guest Host Interaction Launch Menu feature using PowerCLI, set `isolation.tools.ghi.launchmenu.change` to `TRUE` on each virtual machine. With it set, the guest can no longer modify the guest and host interaction launch menu. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

