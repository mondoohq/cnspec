    docs:
      desc: |
        This check verifies that Unity active state reporting is disabled on each virtual machine.

        Unity is the VMware Tools mode that presents individual guest application windows on a host desktop instead of inside a single console window. The active-state handler is the part that tracks whether Unity is currently in use. Setting `isolation.tools.unityActive.disable` to `TRUE` disables it. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent.

        **Why this matters**

        Unity is a whole subsystem for shuttling window geometry, contents, and input events across the boundary between a guest and the software running it, which makes it one of the larger pieces of host-side code a guest can drive. Handlers in that subsystem take structures the guest fills in, and they run in the VMX process, which holds the memory of every virtual machine on the ESXi host. An attacker with code in one guest is reaching for exactly this kind of interface when they try to break out of it.

        Server workloads never enter Unity, so the handler answers nothing useful and only widens what a compromised guest can call.

        This is one of several Unity parameters, and disabling one does not disable the others. Apply the full set together, ideally in the templates new machines are cloned from, so a machine is not left with most of the subsystem closed and one handler still open.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.unityActive.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.unityActive.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the Unity Active feature using the vSphere Client, set the advanced parameter `isolation.tools.unityActive.disable` to `TRUE`. With it set, the Unity active-state handler is turned off. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.unityActive.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.unityActive.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **Some automated tools and processes may stop working after this change.**
        - id: powershell
          desc: |
            To disable the Unity Active feature using PowerCLI, set `isolation.tools.unityActive.disable` to `TRUE` on each virtual machine. With it set, the Unity active-state handler is turned off. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.unityActive.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **Some automated tools and processes may stop working after this change.**
        - id: terraform
          desc: |
            To disable the Unity Active feature with Terraform, set `isolation.tools.unityActive.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the Unity active-state handler is turned off. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
