    docs:
      desc: |
        This check verifies that a guest operating system cannot edit or disconnect its own virtual devices.

        VMware Tools exposes controls that let a user inside the guest change how attached hardware is configured and disconnect it outright, including network adapters, disks, and removable media. Setting `isolation.device.edit.disable` to `TRUE` blocks those requests at the VMX process, so virtual hardware changes have to come from vCenter. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI.

        **Why this matters**

        The first thing an attacker wants after landing in a guest is to stop being watched. If the guest can disconnect its own network adapter, they drop the interface that carries endpoint agent and log traffic to the collector, finish their work unobserved, and reconnect it afterward. Nothing in the guest logs the change, because the change happened below the guest operating system.

        The same control is an availability lever. Detaching the adapter or the disk of a virtual machine takes that service offline, and doing it from inside a guest an attacker already owns is far quieter than doing it from vCenter, where the action would be attributed to an account.

        Locking device edits does not stop a legitimate hardware change; it moves the change to vCenter, where the privilege model and the task log already apply. Pair this with the companion check in this policy that blocks guest-initiated device connection, since editing and connecting are separately gated.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.device.edit.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.device.edit.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To prevent unauthorized device modifications and disconnections using the vSphere Client, set the advanced parameter `isolation.device.edit.disable` to `TRUE`. With it set, a user inside the guest can no longer edit or disconnect virtual devices through VMware Tools, so hardware changes have to come from vCenter. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.device.edit.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.device.edit.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To prevent unauthorized device modifications and disconnections using PowerCLI, set `isolation.device.edit.disable` to `TRUE` on each virtual machine. With it set, a user inside the guest can no longer edit or disconnect virtual devices through VMware Tools, so hardware changes have to come from vCenter. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
