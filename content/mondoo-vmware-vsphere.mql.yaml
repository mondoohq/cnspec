        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Unity window contents transfer is disabled on each virtual machine.

        This handler is the one that actually moves pixels. In Unity mode the rendered contents of guest application windows are handed outward so they can be drawn on the presenting desktop. Setting `isolation.tools.unity.windowContents.disable` to `TRUE` stops that transfer. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. An absent parameter is a failing result.

        **Why this matters**

        Of everything in the Unity family, this is the handler that carries the data itself rather than metadata about it. What leaves the guest is a live image of what is on its screens, which is to say the records the application has open, the credentials being typed into a form, and the contents of any console session running inside it. That crosses the boundary continuously, with nothing in the guest recording that it happened.

        The transfer path is also large, hot, host-side code driven by guest-supplied buffers, which is the shape of code that virtual machine escapes are written against. The process handling it serves every virtual machine on the ESXi host.

        No server workload renders to a host desktop, so there is nothing to lose by disabling it. Apply it with the other Unity parameters in this policy, since blocking the contents transfer while leaving the mode reachable still exposes the rest of the subsystem to a compromised guest.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.unity.windowContents.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.unity.windowContents.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the Unity Window Contents feature using the vSphere Client, set the advanced parameter `isolation.tools.unity.windowContents.disable` to `TRUE`. With it set, the rendered contents of guest application windows are no longer handed outward. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.unity.windowContents.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.unity.windowContents.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **Some automated tools and processes may stop working after this change.**
        - id: powershell
          desc: |
            To disable the Unity Window Contents feature using PowerCLI, set `isolation.tools.unity.windowContents.disable` to `TRUE` on each virtual machine. With it set, the rendered contents of guest application windows are no longer handed outward. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.unity.windowContents.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **Some automated tools and processes may stop working after this change.**
        - id: terraform
          desc: |
            To disable the Unity Window Contents feature with Terraform, set `isolation.tools.unity.windowContents.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the rendered contents of guest application windows are no longer handed outward. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.unity.windowContents.disable" = "true"
              }
            }
            ```

            **Some automated tools and processes may stop working after this change.**
