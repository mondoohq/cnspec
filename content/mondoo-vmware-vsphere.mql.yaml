  - uid: mondoo-vmware-vsphere-security-baseline-ensure-unnecessary-cddvd-devices-are-disconnected
    filters: asset.platform == "vmware-vsphere"
    title: Ensure unnecessary CD/DVD devices are disconnected
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-41
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      vsphere.datacenters.all( vms.all( properties['config']['hardware']['device'].where ( _['deviceInfo']['label'].contains('CD') ).all( _['connectable']['connected'] == false ) ) )
      vsphere.datacenters.all( vms.all( properties['config']['hardware']['device'].where ( _['deviceInfo']['label'].contains('CD') ).all( _['connectable']['startConnected'] == false ) ) )
    docs:
      desc: |
        This check verifies that virtual CD/DVD drives are disconnected and not set to connect when the virtual machine powers on.

        A CD/DVD drive is nearly always added for installation or provisioning and then forgotten, still pointing at an ISO on a shared datastore or at a client device. On the Virtual Hardware tab of Edit Settings each drive carries a Connected checkbox and a Connect At Power On checkbox, and this check requires both to be clear on every drive. PowerCLI reports the same state through `Get-CDDrive`, and `Remove-CDDrive` removes the device entirely once the virtual machine is powered off.

        **Why this matters**

        A connected drive is a live file path from a datastore into a running guest. An attacker who can write to that datastore, or who can replace the ISO the drive points at, has a way to place content inside a virtual machine they have no login for. If the guest auto-mounts and auto-runs removable media, that content executes without anyone typing anything.

        Connected bootable media is also a way to change what the machine is. A guest that reboots with an attacker-supplied ISO attached can be steered into a rescue environment where the disk is mounted without the operating system's access controls, and local credential stores are read straight off it.

        Removing unused drives is preferable to merely disconnecting them, because a disconnected drive can be reconnected later by anyone with the privilege. Keep a drive only where an application genuinely reads from optical media, and point it at a controlled ISO rather than a client device.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, locate each `CD/DVD drive` entry.
        3. Confirm the `Connected` and `Connect At Power On` checkboxes are cleared.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-CDDrive | Select-Object Parent, ConnectionState
        ```

        The check passes when every CD/DVD drive is disconnected and not set to connect at power on. It fails for any VM with a CD/DVD drive that is connected or configured to connect at power on.
      remediation:
        - id: vsphere-client
          desc: |
            To remove or disconnect CD/DVD drives using the vSphere Client:

            The check passes when every CD/DVD drive has both `Connected` and `Connect At Power On` cleared, and a virtual machine without one passes too. Removing the device is the stronger fix, because a disconnected device can be reconnected later by anyone with the privilege.

            **Removing the CD/DVD drive can get in the way of installing and upgrading VMware Tools.** Keep a disconnected drive on virtual machines where Tools is maintained from mounted media.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. On the `Virtual Hardware` tab, locate each `CD/DVD drive` entry.
            4. Remove the device, or clear `Connect At Power On` so that it stays disconnected when the virtual machine starts.
            5. Select `OK`, then power the VM back on.
        - id: powershell
          desc: |
            To remove CD/DVD drives using PowerCLI:

            A virtual machine with no CD/DVD drive passes the check.

            **The command removes every CD/DVD drive from every powered-off virtual machine it reaches.** Removing the device requires the virtual machine to be powered off, so narrow `Get-VM` to the machines that should lose the device.

            **Removing the CD/DVD drive can get in the way of installing and upgrading VMware Tools.** Keep a disconnected drive on virtual machines where Tools is maintained from mounted media.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Remove every CD/DVD drive from the powered-off virtual machines. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Confirm:$false` suppresses the confirmation prompt for each device:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | Get-CDDrive | Remove-CDDrive -Confirm:$false
               ```

               To keep a drive on a machine but leave it empty and disconnected at power on, run this instead:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | Get-CDDrive | Set-CDDrive -NoMedia -StartConnected:$false -Confirm:$false
               ```

            3. Power the virtual machines back on.
