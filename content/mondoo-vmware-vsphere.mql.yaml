      desc: |
        This check verifies that each virtual machine boots with EFI firmware and UEFI Secure Boot enabled.

        Secure Boot has the virtual firmware validate the signature of the bootloader, and the bootloader in turn validate the kernel and its drivers, so unsigned code and code signed by an untrusted authority is refused before it runs. Both conditions are read from the virtual machine's boot options in the vSphere Client under Edit Settings, VM Options, Boot Options, where Firmware must be set to EFI and the Secure Boot checkbox must be selected.

        **Why this matters**

        An attacker who reaches administrative privilege inside a guest wants to survive the rebuild. The durable way to do that is to modify what loads before the operating system does, because code at that layer runs ahead of the endpoint agent, ahead of the integrity checks, and ahead of anything an investigator will inspect from within the running system. A bootkit installed that way stays through reboots, through patching, and through most incident response.

        Secure Boot removes that option by refusing to execute the modified component at all. The machine fails to start rather than starting compromised, which is a far better outcome than the alternative and a far more visible one.

        Converting an existing virtual machine from BIOS to EFI firmware can leave the installed guest operating system unbootable, so this belongs in the build process for new machines rather than as a bulk change to running ones. Enable it in templates, and stage conversions of existing workloads with a tested rollback.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Boot Options`.
        3. Confirm `Firmware` is set to `EFI` and the `Secure Boot` checkbox is selected.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Select-Object Name, @{N='Firmware';E={$_.ExtensionData.Config.Firmware}}, @{N='SecureBoot';E={$_.ExtensionData.Config.BootOptions.EfiSecureBootEnabled}}
        ```

        The check passes when every virtual machine reports `efi` firmware and Secure Boot enabled. It fails for any VM that uses BIOS firmware or has Secure Boot disabled.
      remediation:
        - id: vsphere-client
          desc: |
            To enable UEFI Secure Boot using the vSphere Client:

            The check requires both `EFI` firmware and Secure Boot on every virtual machine.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. Select the `VM Options` tab and expand `Boot Options`.
            4. Set `Firmware` to `EFI` if it is not already.
            5. Select the `Secure Boot` checkbox.
            6. Select `OK`, then power the VM back on.

            **Changing firmware from BIOS to EFI on an existing VM may make the installed guest OS unbootable.** Verify guest OS compatibility before converting existing virtual machines.
        - id: terraform
          desc: |
            To enable UEFI Secure Boot with Terraform, set `firmware` to `"efi"` and `efi_secure_boot_enabled` to `true` on the `vsphere_virtual_machine` resource.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine when `firmware` or `efi_secure_boot_enabled` changes, and forces a power off if the guest has not shut down within `shutdown_wait_timeout`, three minutes by default.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              firmware                = "efi"
              efi_secure_boot_enabled = true
            }
            ```

            **Changing firmware from BIOS to EFI on an existing VM may make the installed guest OS unbootable.** Verify guest OS compatibility before applying this change to existing virtual machines.
