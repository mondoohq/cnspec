    docs:
      desc: |
        This check verifies that the guest cannot exchange trash folder state with the host.

        The trash folder state handler is part of the desktop integration in VMware Tools, reporting the state of the guest's recycle bin or trash so that a host-side desktop can reflect it. Setting `isolation.tools.trashFolderState.disable` to `TRUE` stops the guest from participating. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent, since the handler is reachable unless something disables it.

        **Why this matters**

        The value of this control is not the trash folder; it is that the handler is one more entry point into the VMX process that a guest can reach. Every enabled handler is host-side code parsing structures a compromised guest chooses, and the VMX process is where the memory of that host's virtual machines lives. The set of enabled handlers is the guest-to-hypervisor attack surface, so the ones no workload calls should be closed.

        Where it does work as designed, it leaks a small amount of guest activity outward, describing what a user inside the machine deleted and when to software running outside the machine's own boundary.

        Server workloads have no host desktop to synchronize with, so nothing is lost by disabling it. Apply this alongside the other desktop integration parameters in this policy rather than individually, since they are useful as a set and an estate that disabled only some of them still exposes the rest.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.trashFolderState.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.trashFolderState.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the Trash Folder State feature using the vSphere Client:

            1. Select the VM then select `Actions` followed by `Edit Settings`.
            2. Select `VM Options` tab then expand `Advanced`.
            3. Select `EDIT CONFIGURATION`.
            4. Select `ADD CONFIGURATION PARAMS` then input `isolation.tools.trashFolderState.disable` with a value of `TRUE`.
            5. Select `OK`, then `OK` again.

            **Impact:**

            Some automated tools and processes may cease to function.
        - id: powershell
          desc: |
            This requires VMware PowerCLI. First connect to vCenter Server with `Connect-VIServer`:

            ```powershell
            Connect-VIServer -Server <vcenter-fqdn>
            ```

            To disable the Trash Folder State feature using PowerCLI, run the following command for each VM:

            ```powershell
            Get-VM | New-AdvancedSetting -Name "isolation.tools.trashFolderState.disable" -value $true -Force
            ```
        - id: terraform
          desc: |
            To enforce this setting with Terraform, set the advanced configuration key on the `vsphere_virtual_machine` resource:

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.trashFolderState.disable" = "true"
              }
            }
            ```
  - uid: mondoo-vmware-vsphere-security-baseline-ensure-uefi-secure-boot-is-enabled-for-virtual-machines
    title: Ensure UEFI Secure Boot is enabled for virtual machines
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
