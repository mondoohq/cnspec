    docs:
      desc: |
        This check verifies that each virtual machine caps how much information its guest may write into the VMX configuration file.

        VMware Tools lets a guest publish name and value pairs back to the hypervisor, and those values land in the virtual machine's VMX configuration file on the datastore. The `tools.setInfo.sizeLimit` parameter bounds how much data the guest can push through that channel. Set it in the vSphere Client under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION with a value of `1048576`, which is 1 MB, or write the same value with `New-AdvancedSetting` in PowerCLI.

        **Why this matters**

        Without the limit, code inside one guest decides how large a host-side file becomes. An attacker who has any execution inside a low-value virtual machine loops on the guest info channel and writes until the shared datastore is full. Every other virtual machine backed by that datastore then fails to power on, cannot grow a thin-provisioned disk, and stalls on its next write. One tenant has taken down the neighbors it was supposed to be isolated from without ever leaving its own guest.

        A VMX file inflated this way is also fragile. It holds the hardware layout and runtime state the hypervisor needs to start the machine, so truncation or corruption costs the virtual machine its configuration, and the bloated file is then copied into every backup and snapshot taken of it.

        The 1 MB cap is generous for legitimate use, since normal VMware Tools reporting stays far below it. Raise it only for a workload with a documented need to publish more, and record that decision alongside the exception.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `tools.setInfo.sizeLimit` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'tools.setInfo.sizeLimit'
        ```

        The check passes only when the parameter is present and set to `1048576` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To limit informational messages from the VM to the VMX file using the vSphere Client, set the advanced parameter `tools.setInfo.sizeLimit` to `1048576`. The value caps the name and value data a guest can write into the VMX file through VMware Tools at 1 MB. The check passes only when the parameter is present with exactly `1048576`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `tools.setInfo.sizeLimit` is already listed, enter `1048576` in its `Value` field and confirm the change. Otherwise, enter `tools.setInfo.sizeLimit` as the attribute name and `1048576` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To limit informational messages from the VM to the VMX file using PowerCLI, set `tools.setInfo.sizeLimit` to `1048576` on each virtual machine. The value caps the name and value data a guest can write into the VMX file through VMware Tools at 1 MB. The check passes only when the parameter is present with exactly `1048576`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "tools.setInfo.sizeLimit" -Value 1048576 -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To limit informational messages from the VM to the VMX file with Terraform, set `tools.setInfo.sizeLimit` to `1048576` in the `extra_config` map of the `vsphere_virtual_machine` resource. The value caps the name and value data a guest can write into the VMX file through VMware Tools at 1 MB. The check requires exactly `1048576`.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "tools.setInfo.sizeLimit" = 1048576
              }
            }
            ```
