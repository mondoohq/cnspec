            **Confirm no workload depends on the device.** Licence dongles and hardware security modules are the usual cases.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. On the `Virtual Hardware` tab, locate each `USB` entry.
            4. Remove the device, or clear `Connect At Power On` so that it stays disconnected when the virtual machine starts.
            5. Select `OK`, then power the VM back on.
        - id: powershell
          desc: |
            To remove USB devices using PowerCLI:

            A virtual machine with no USB device passes the check.

            **The command removes every USB device from every powered-off virtual machine it reaches.** Removing the device requires the virtual machine to be powered off, so narrow `Get-VM` to the machines that should lose the device.

            **Confirm no workload depends on the device.** Licence dongles and hardware security modules are the usual cases.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Remove every USB device from the powered-off virtual machines. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Confirm:$false` suppresses the confirmation prompt for each device:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | Get-UsbDevice | Remove-UsbDevice -Confirm:$false
               ```

            3. Power the virtual machines back on.
