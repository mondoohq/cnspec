      vsphere.datacenters.all( vms.all( properties['config']['hardware']['device'].where( _['deviceInfo']['label'].contains('Floppy') ).all( _['connectable']['startConnected'] == false ) ) )
    docs:
      desc: |
        This check verifies that virtual floppy drives are disconnected and not set to connect when the virtual machine powers on.

        Floppy devices survive in virtual machine templates long after any workload needs them, usually because a driver injection step during a Windows installation required one. Each drive appears on the Virtual Hardware tab of Edit Settings with Connected and Connect At Power On checkboxes, and this check requires both to be clear. `Get-FloppyDrive` lists them from PowerCLI and `Remove-FloppyDrive` removes the device once the virtual machine is powered off.

        **Why this matters**

        A connected floppy device is backed by an image file on a datastore or by a device on the client, so it is a writable path from outside the guest into a machine an attacker may not otherwise be able to log into. Anyone who can replace that image controls the contents the guest sees, and legacy guest software that reads the device does so with no signature checking at all.

        The device also affects boot. A machine with attached floppy media can be steered into booting from it, which puts an attacker on the console of an environment where the virtual disk is just a block device with no operating system enforcing permissions on it.

        Practically no modern workload needs the device, so the right end state is removal rather than disconnection. Removing it also shortens the hardware inventory an operator has to reason about when reviewing a virtual machine, which makes a genuinely unusual device stand out.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, locate each `Floppy drive` entry.
        3. Confirm the `Connected` and `Connect At Power On` checkboxes are cleared.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-FloppyDrive | Select-Object Parent, ConnectionState
        ```

        The check passes when every floppy drive is disconnected and not set to connect at power on. It fails for any VM with a floppy drive that is connected or configured to connect at power on.
      remediation:
        - id: vsphere-client
          desc: |
            To remove or disconnect floppy drives using the vSphere Client:

            The check passes when every floppy drive has both `Connected` and `Connect At Power On` cleared, and a virtual machine without one passes too. Removing the device is the stronger fix, because a disconnected device can be reconnected later by anyone with the privilege.

            **Confirm no guest still reads from the floppy device.** Some legacy driver installation steps use one.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. On the `Virtual Hardware` tab, locate each `Floppy drive` entry.
            4. Remove the device, or clear `Connect At Power On` so that it stays disconnected when the virtual machine starts.
            5. Select `OK`, then power the VM back on.
        - id: powershell
          desc: |
            To remove floppy drives using PowerCLI:

            A virtual machine with no floppy drive passes the check.

            **The command removes every floppy drive from every powered-off virtual machine it reaches.** Removing the device requires the virtual machine to be powered off, so narrow `Get-VM` to the machines that should lose the device.

            **Confirm no guest still reads from the floppy device.** Some legacy driver installation steps use one.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Remove every floppy drive from the powered-off virtual machines. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Confirm:$false` suppresses the confirmation prompt for each device:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | Get-FloppyDrive | Remove-FloppyDrive -Confirm:$false
               ```

            3. Power the virtual machines back on.
