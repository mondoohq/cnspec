        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `mks.enable3d` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'mks.enable3d'
        ```

        The check passes only when the parameter is present and set to `FALSE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable hardware-based 3D acceleration using the vSphere Client, set the advanced parameter `mks.enable3d` to `FALSE`. With it set to `FALSE`, the virtual graphics device is no longer backed by physical GPU capability on the host. The check passes only when the parameter is present with the value `FALSE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `mks.enable3d` is already listed, enter `FALSE` in its `Value` field and confirm the change. Otherwise, enter `mks.enable3d` as the attribute name and `FALSE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **GPU-accelerated and virtual desktop workloads may need 3D acceleration.** Confirm a virtual machine does not rely on it before applying the change.
