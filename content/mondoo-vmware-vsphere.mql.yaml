    docs:
      desc: |
        This check verifies that the memory scheduler is not reporting fabricated sampling statistics to a virtual machine.

        The `isolation.tools.memSchedFakeSampleStats.disable` parameter, set to `TRUE`, stops the VMX process from feeding synthetic memory scheduler sample data through the VMware Tools interface. The mechanism exists for testing and debugging the balloon driver and the sampling that estimates a guest's working set. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent as well as when it holds another value.

        **Why this matters**

        Memory sampling drives real decisions. It tells the hypervisor how much of a virtual machine's assigned memory is genuinely in use, which in turn drives ballooning, swapping, and the admission decisions a cluster makes when it places workloads. Feeding that machinery fabricated numbers makes the host act on a picture of memory pressure that does not exist, and the resulting swap activity lands on virtual machines that were behaving correctly.

        Fabricated telemetry is also a way to hide. Memory growth is one of the observable signals of a runaway or malicious process inside a guest, and an interface that lets the reported figures diverge from reality removes that signal from the monitoring and capacity systems that consume it.

        Nothing in production needs a debugging aid enabled. Set the parameter in the templates that new virtual machines are cloned from so that the state is inherited rather than remediated on each machine after the fact.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.memSchedFakeSampleStats.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.memSchedFakeSampleStats.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the memSchedFakeSampleStats feature using the vSphere Client:

            1. Select the VM then select `Actions` followed by `Edit Settings`.
            2. Select `VM Options` tab then expand `Advanced`.
            3. Select `EDIT CONFIGURATION`.
            4. Select `ADD CONFIGURATION PARAMS` then input `isolation.tools.memSchedFakeSampleStats.disable` with a value of `TRUE`.
            5. Select `OK`, then `OK` again.

            **Impact:**

            Some automated tools and processes may cease to function.
        - id: powershell
          desc: |
            This requires VMware PowerCLI. First connect to vCenter Server with `Connect-VIServer`:

            ```powershell
            Connect-VIServer -Server <vcenter-fqdn>
            ```

            To disable the memSchedFakeSampleStats feature using PowerCLI, run the following command for each VM:

            ```powershell
            Get-VM | New-AdvancedSetting -Name "isolation.tools.memSchedFakeSampleStats.disable" -value $true -Force
            ```
        - id: terraform
          desc: |
            To enforce this setting with Terraform, set the advanced configuration key on the `vsphere_virtual_machine` resource:

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.memSchedFakeSampleStats.disable" = "true"
              }
            }
            ```
  # No Terraform variants: the vsphere_virtual_machine disk block exposes no disk-mode or independent-nonpersistent argument.
  - uid: mondoo-vmware-vsphere-security-baseline-ensure-nonpersistent-disks-are-limited
    filters: asset.platform == "vmware-vsphere"
    title: Ensure nonpersistent disks are limited
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a23
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      vsphere.datacenters.all(
        vms.all(
          properties['config']['hardware']['device'].where(
            _['backing']['fileName'].contains('vmdk') ).all(
              _['backing']['diskMode'] != 'independent_nonpersistent'
            )
          )
        )
    docs:
      desc: |
        This check verifies that no virtual machine has a disk running in independent nonpersistent mode.

        A disk in that mode discards every write when the machine powers off, returning to the state it had at power on. The mode is read from Disk Mode on each hard disk in Edit Settings, and PowerCLI reports the same thing as a persistence of IndependentNonPersistent through `Get-HardDisk`. Changing it requires the machine to be powered off, after which `Set-HardDisk` moves the disk to persistent mode.

        **Why this matters**

        A nonpersistent disk destroys evidence on a schedule the attacker controls. Everything an intrusion leaves behind on that machine, the authentication records, the shell history, the dropped tooling, the log lines the endpoint agent wrote, is gone the moment the machine restarts, and restarting a virtual machine is not a privileged act. An investigator arriving afterward finds a clean system and no way to establish what happened, and any indicator of compromise that existed only on that disk is unrecoverable.

        The same behavior loses ordinary operational state. Configuration changes made after provisioning, application data, and rotated credentials all revert, which produces failures that are hard to attribute because the machine looks correct immediately after each reboot.

        Nonpersistent mode has legitimate uses in kiosks, lab images, and deliberately disposable workloads. Where it is intentional, make sure the logs from those machines are shipped off the host to a central collector as they are produced, so that the record survives even though the disk does not.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, expand each `Hard disk` entry.
        3. Review the `Disk Mode` field for each virtual disk.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-HardDisk | Select-Object Parent, Name, Persistence
        ```

        The check passes when no virtual disk uses independent nonpersistent mode. It fails for any VM that has a disk reported as `IndependentNonPersistent`.
      remediation:
        - id: powershell
          desc: |
            This requires VMware PowerCLI. First connect to vCenter Server with `Connect-VIServer`:

            ```powershell
            Connect-VIServer -Server <vcenter-fqdn>
            ```

            To convert nonpersistent disks to persistent mode using PowerCLI, run the following command. The VM must be powered off before changing disk persistence:

            ```powershell
            Get-VM | Get-HardDisk | Where-Object { $_.Persistence -eq "IndependentNonPersistent" } | Set-HardDisk -Persistence Persistent
            ```
        # No Terraform remediation: the vsphere_virtual_machine disk block exposes no disk-mode or independent-nonpersistent argument.
    refs:
      - url: https://docs.vmware.com/en/VMware-vSphere/8.0/vsphere-security/GUID-20D8B362-E96F-4F78-B7C3-660C7C2F773D.html
        title: VMware vSphere Security Guide
