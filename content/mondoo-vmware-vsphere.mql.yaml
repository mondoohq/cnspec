      - uid: mondoo-vmware-vsphere-security-baseline-ensure-autologon-is-disabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a guest operating system cannot be signed in automatically through the VMware Tools guest and host interaction interface.

        VMware Tools exposes a call that lets the host request an automatic logon inside the guest, which desktop virtualization products use to bring a user straight to a session. Setting `isolation.tools.ghi.autologon.disable` to `TRUE` refuses that request at the VMX process. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. This check fails when the parameter is absent as well as when it is set to any other value.

        **Why this matters**

        An automatic logon means a working, credentialed session exists on the guest console without anyone proving who they are. Anyone who can open the remote console for that virtual machine inherits it, and console access is a permission held by more people than the guest's own administrator group. The attacker never touches a password, so nothing in the guest authentication log marks the moment they arrived.

        The account behind an automatic logon is also rarely a minimal one. It is usually the account the application was installed under, with standing rights to the data the machine exists to serve, which is exactly what the attacker inherits.

        Disabling the feature costs nothing on server workloads, which have no reason to sign anyone in unattended. Where a desktop product genuinely relies on it, keep that use on a separate pool with its own console permissions rather than leaving the capability enabled across the general estate.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.ghi.autologon.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.ghi.autologon.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable Autologon using the vSphere Client, set the advanced parameter `isolation.tools.ghi.autologon.disable` to `TRUE`. With it set, the VMX process refuses a request to sign a user in to the guest automatically. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.ghi.autologon.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.ghi.autologon.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To disable Autologon using PowerCLI, set `isolation.tools.ghi.autologon.disable` to `TRUE` on each virtual machine. With it set, the VMX process refuses a request to sign a user in to the guest automatically. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.ghi.autologon.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To disable Autologon with Terraform, set `isolation.tools.ghi.autologon.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the VMX process refuses a request to sign a user in to the guest automatically. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.ghi.autologon.disable" = "true"
              }
            }
            ```
    refs:
      - url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/vsphere-security.html
        title: vSphere Security
