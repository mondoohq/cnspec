  - uid: mondoo-vmware-vsphere-security-baseline-ensure-unnecessary-usb-devices-are-disconnected
    filters: asset.platform == "vmware-vsphere"
    title: Ensure unnecessary USB devices are disconnected
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-2
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-41
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      vsphere.datacenters.all( vms.all( properties['config']['hardware']['device'].where ( _['deviceInfo']['label'].contains('USB') ).all( _['connectable']['connected'] == false || _['connectable']['connected'] == null ) ) )
      vsphere.datacenters.all( vms.all( properties['config']['hardware']['device'].where ( _['deviceInfo']['label'].contains('USB') ).all( _['connectable']['startConnected'] == false || _['connectable']['startConnected'] == null ) ) )
    docs:
      desc: |
        This check verifies that USB devices are disconnected and not set to connect when the virtual machine powers on.

        USB pass-through attaches a physical device plugged into the ESXi host, or a device on the client running the remote console, to a guest. The devices appear on the Virtual Hardware tab of Edit Settings with Connected and Connect At Power On checkboxes, and this check requires both to be clear. `Get-UsbDevice` lists them from PowerCLI and `Remove-UsbDevice` detaches them once the virtual machine is powered off. A virtual machine with no USB devices satisfies the check.

        **Why this matters**

        A connected USB device is removable storage inside a server workload. It carries data out of the guest with no proxy, no data loss inspection, and no record in vCenter of what moved, and it carries content in the same way, which is how autorun payloads and unsigned drivers reach machines that are otherwise well isolated from user endpoints.

        Client-side pass-through extends that to the operator's own laptop. The device is physically nowhere near the datacenter, yet the guest treats it as locally attached, so the trust boundary now runs through whatever the operator plugged in that morning.

        Very few server workloads need USB. Licence dongles and hardware security modules are the usual real cases; for those, use host-side attachment on a specific host, keep the virtual machine pinned there, and note the exemption. Everything else should have the device removed rather than left attached and merely disconnected.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, locate each `USB` device entry.
        3. Confirm the `Connected` and `Connect At Power On` checkboxes are cleared.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-UsbDevice
        ```

        The check passes when no USB device is connected or set to connect at power on, or when no USB devices are defined. It fails for any VM with a USB device that is connected or configured to connect at power on.
      remediation:
        - id: powershell
          desc: |
            This requires VMware PowerCLI. First connect to vCenter Server with `Connect-VIServer`:

            ```powershell
            Connect-VIServer -Server <vcenter-fqdn>
            ```

            To remove all USB devices from VMs using PowerCLI, run the following command:

            ```powershell
            Get-VM | Get-UsbDevice | Remove-UsbDevice -Confirm:$false
            ```

            The VM will need to be powered off for this change to take effect.
        # No Terraform remediation: the vsphere_virtual_machine resource has no USB device block or connection-state attribute.
  - uid: mondoo-vmware-vsphere-security-baseline-ensure-virtual-disk-shrinking-is-disabled
    title: Ensure virtual disk shrinking is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a23
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    variants:
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-virtual-disk-shrinking-is-disabled-vsphere
        tags:
          mondoo.com/filter-title: VMware vSphere
          mondoo.com/filter-icon: vmware
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-virtual-disk-shrinking-is-disabled-terraform-hcl
        tags:
          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-virtual-disk-shrinking-is-disabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-virtual-disk-shrinking-is-disabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that guest-initiated virtual disk shrinking is disabled on each virtual machine.

        VMware Tools offers a shrink operation that reclaims unused space in a virtual disk, and it can be started from inside the guest. Setting `isolation.tools.diskShrink.disable` to `TRUE` refuses those requests. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent, because the operation is available unless something disables it.

        **Why this matters**

        Shrinking is a long, heavily I/O-bound rewrite of the disk, and it is available to a user inside the guest who does not need to be an administrator. That makes it a denial-of-service primitive that requires almost no privilege: whoever holds it can saturate the datastore's I/O path from inside a single guest, and the machines sharing that datastore, which are not the attacker's machines, slow down or stall.

        The disk being rewritten is also unavailable while the operation runs, so the workload that owns it goes down as well, and repeated cycles leave the file fragmented in ways that degrade it afterward.

        Storage reclamation is a legitimate need, but it belongs to the administrator who can see the datastore's total load rather than to a user inside one guest. Where space needs to be recovered, do it from the hypervisor side during a maintenance window; the setting only removes the guest's ability to start it unilaterally.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.diskShrink.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.diskShrink.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable virtual disk shrinking using the vSphere Client:

            1. Select the VM then select `Actions` followed by `Edit Settings`.
            2. Select `VM Options` tab then expand `Advanced`.
            3. Select `EDIT CONFIGURATION`.
            4. Select `ADD CONFIGURATION PARAMS` then input `isolation.tools.diskShrink.disable` with a value of `TRUE`.
            5. Select `OK`, then `OK` again.

            **Impact:**

            Inability to shrink virtual machine disks in the event that a datastore runs out of space.
        - id: powershell
          desc: |
            This requires VMware PowerCLI. First connect to vCenter Server with `Connect-VIServer`:

            ```powershell
            Connect-VIServer -Server <vcenter-fqdn>
            ```

            To disable virtual disk shrinking using PowerCLI, run the following command for each VM:

            ```powershell
            Get-VM | New-AdvancedSetting -Name "isolation.tools.diskShrink.disable" -value $true -Force
            ```
        - id: terraform
          desc: |
            To enforce this setting with Terraform, set the advanced configuration key on the `vsphere_virtual_machine` resource:

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.diskShrink.disable" = "true"
              }
            }
            ```
