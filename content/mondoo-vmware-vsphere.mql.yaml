          mondoo.com/filter-title: Terraform HCL
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-vsan-data-in-transit-encryption-is-enabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-vsan-data-in-transit-encryption-is-enabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that data-in-transit encryption is enabled on every vSAN-enabled cluster.

        vSAN writes each object to more than one host, so guest data is constantly crossing the vSAN network between hosts as writes are mirrored and as objects are resynchronized after a failure. Data-in-transit encryption protects that traffic. Enable it in the vSphere Client by selecting the cluster and using Configure, vSAN, Services, then editing the Data-In-Transit Encryption service. It manages its own keys and needs no external key provider, and the rekey interval is set in the same place.

        **Why this matters**

        Without it, an attacker who gets onto the vSAN network segment reads guest disk contents off the wire as they are replicated. They do not need credentials on any virtual machine, on vCenter, or on a host; they need a port on the storage fabric. The vSAN network is often treated as an internal, trusted segment carried on shared physical switches, which makes that a realistic position for someone who has compromised any other system on the same fabric.

        The same position allows modification, not just reading. Encrypted transport protects replica and resynchronization traffic from being altered on the path between hosts.

        Enabling data-at-rest encryption does not enable this, and enabling this does not encrypt what is stored; they are independent controls covering different exposures, and a cluster needs both. Because encryption and decryption run on the hosts, benchmark a representative workload before enabling it across a latency-sensitive cluster.
      audit: |
        ### Audit via the vSphere Client

        1. Select the cluster and choose **Configure** > **vSAN** > **Services**.
        2. Expand the **Data-In-Transit Encryption** section.
        3. Confirm data-in-transit encryption is enabled.

        The check passes when every vSAN-enabled cluster reports data-in-transit encryption as enabled. It fails for any vSAN cluster with it disabled.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-Cluster | Get-VsanClusterConfiguration | Select-Object Cluster, DataInTransitEncryptionEnabled
        ```

        The check passes when every vSAN-enabled cluster returns `DataInTransitEncryptionEnabled` as `True`. It fails for any cluster returning `False`.
      remediation:
        - id: vsphere-client
          desc: |
            To enable vSAN data-in-transit encryption using the vSphere Client:

            1. Select the cluster and choose `Configure` > `vSAN` > `Services`.
            2. Edit the `Data-In-Transit Encryption` service and enable it.
            3. Optionally set the rekey interval, then apply the change.

            Data-in-transit encryption does not require an external key provider; vSAN manages the keys internally.
        - id: powershell
          desc: |
            This requires VMware PowerCLI. First connect to vCenter Server with `Connect-VIServer`:

            ```powershell
            Connect-VIServer -Server <vcenter-fqdn>
            ```

            To enable vSAN data-in-transit encryption using PowerCLI:

            ```powershell
            Get-Cluster -Name "CLUSTER_NAME" |
              Set-VsanClusterConfiguration -DataInTransitEncryptionEnabled $true
            ```
    refs:
      - url: https://docs.vmware.com/en/VMware-vSphere/8.0/vsan-security/GUID-D8E5550C-8C0A-43AB-A3C9-4F4F0F0D6C9C.html
        title: Using Data-in-Transit Encryption in vSAN
