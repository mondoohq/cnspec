      - uid: mondoo-vmware-vsphere-security-baseline-ensure-unity-interlock-is-disabled-terraform-plan
        tags:
          mondoo.com/filter-title: Terraform Plan
          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-unity-interlock-is-disabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that Unity interlock operations are disabled on each virtual machine.

        The interlock is the part of Unity that coordinates window operations between the guest and the software presenting them, sequencing the requests that move, raise, and resize application windows across the boundary. Setting `isolation.tools.unityInterlockOperation.disable` to `TRUE` turns those operations off. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. An absent parameter is a failing result.

        **Why this matters**

        Coordination protocols are stateful, and stateful host-side code driven by guest-supplied sequences is a productive place to look for memory corruption. That is the concern here: not what the interlock does when used correctly, but that it is reachable at all from inside a guest, and that the process implementing it serves every virtual machine on the host. An attacker who breaks it does not gain a better position in the guest they already own; they gain the hypervisor and, through it, the other tenants.

        Where the feature works as intended, it lets a guest influence window behavior in the environment presenting it, blurring which side of the boundary an interaction belongs to.

        There is no host desktop on ESXi for these operations to coordinate with, so disabling them removes reachable code without removing capability. Do it together with the other Unity parameters in this policy and record it in the template, since the subsystem is only meaningfully closed when all of its entry points are.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.unityInterlockOperation.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.unityInterlockOperation.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the Unity Interlock feature using the vSphere Client, set the advanced parameter `isolation.tools.unityInterlockOperation.disable` to `TRUE`. With it set, the Unity operations that move, raise, and resize guest windows across the boundary are turned off. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.unityInterlockOperation.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.unityInterlockOperation.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **Some automated tools and processes may stop working after this change.**
        - id: powershell
          desc: |
            To disable the Unity Interlock feature using PowerCLI, set `isolation.tools.unityInterlockOperation.disable` to `TRUE` on each virtual machine. With it set, the Unity operations that move, raise, and resize guest windows across the boundary are turned off. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.unityInterlockOperation.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **Some automated tools and processes may stop working after this change.**
        - id: terraform
          desc: |
            To disable the Unity Interlock feature with Terraform, set `isolation.tools.unityInterlockOperation.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the Unity operations that move, raise, and resize guest windows across the boundary are turned off. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.unityInterlockOperation.disable" = "true"
              }
            }
            ```

            **Some automated tools and processes may stop working after this change.**
