            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.ghi.protocolhandler.info.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.ghi.protocolhandler.info.disable` as the attribute name and `TRUE` as the value, then select `Add`.
