    docs:
      desc: |
        This check verifies that the guest cannot set console GUI options on each virtual machine.

        The `isolation.tools.setGUIOptions.enable` parameter controls whether a guest may change options of the console interface presenting it. This is the one parameter in the family that is required to be `FALSE` rather than `TRUE`, because it names an enable rather than a disable. Set it under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or write it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent as well as when it is set to anything other than false.

        **Why this matters**

        Console GUI options govern the behavior of the interface an administrator uses to interact with the machine, including how copy, paste, and device controls behave in that session. Letting the guest set them inverts the relationship: the workload is configuring the tool used to manage it, and the person on the other side has no indication that the machine changed what their interface will do.

        An attacker who owns the guest uses that to re-enable a transfer path an administrator had disabled, or to make console interaction behave in a way that helps them, and the change persists for the next operator who connects.

        Note the polarity when remediating, because setting this one to the value used by the neighboring parameters leaves the capability enabled rather than disabled. Verify the effective value after the change instead of assuming the pattern from the surrounding settings holds.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.setGUIOptions.enable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.setGUIOptions.enable'
        ```

        The check passes only when the parameter is present and set to `FALSE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable VM Console GUI Options using the vSphere Client, set the advanced parameter `isolation.tools.setGUIOptions.enable` to `FALSE`. With it set to `FALSE`, the guest can no longer change options of the console interface presenting it. The check passes only when the parameter is present with the value `FALSE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.setGUIOptions.enable` is already listed, enter `FALSE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.setGUIOptions.enable` as the attribute name and `FALSE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To disable VM Console GUI Options using PowerCLI, set `isolation.tools.setGUIOptions.enable` to `FALSE` on each virtual machine. With it set to `FALSE`, the guest can no longer change options of the console interface presenting it. The check passes only when the parameter is present with the value `FALSE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.setGUIOptions.enable" -Value $false -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To disable VM Console GUI Options with Terraform, set `isolation.tools.setGUIOptions.enable` to `"false"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set to `FALSE`, the guest can no longer change options of the console interface presenting it. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.setGUIOptions.enable" = "false"
              }
            }
            ```
