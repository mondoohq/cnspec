  - uid: mondoo-vmware-vsphere-security-baseline-ensure-unnecessary-parallel-ports-are-disconnected
    filters: asset.platform == "vmware-vsphere"
    title: Ensure unnecessary parallel ports are disconnected
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-41
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      vsphere.datacenters.all( vms.all( properties['config']['hardware']['device'].where ( _['deviceInfo']['label'].contains('Parallel') ).all( _['connectable']['connected'] == false ) ) )
      vsphere.datacenters.all( vms.all( properties['config']['hardware']['device'].where ( _['deviceInfo']['label'].contains('Parallel') ).all( _['connectable']['startConnected'] == false ) ) )
    docs:
      desc: |
        This check verifies that virtual parallel ports are disconnected and not set to connect when the virtual machine powers on.

        A virtual parallel port is backed by a file on a datastore or by a physical port on the host, and it appears on the Virtual Hardware tab of Edit Settings with Connected and Connect At Power On checkboxes. This check requires both to be clear on every port, and a virtual machine with no parallel port at all satisfies it. Removing the device takes a reconfigure call, which PowerCLI issues through the VM configuration spec while the machine is powered off.

        **Why this matters**

        When the port is backed by a file, everything the guest writes to it lands in that file on shared storage, and everything placed in the file is readable from inside the guest. That is an unlogged, bidirectional path between a virtual machine and a datastore that other machines and other administrators can reach, and it exists outside the network controls that would normally govern data leaving a workload.

        When the port is backed by host hardware, the guest is talking to a physical device on the hypervisor. The point of running the workload in a virtual machine was that it could not do that.

        Legacy applications tied to licence dongles or industrial equipment are the realistic exception. Where one exists, keep the port on a dedicated virtual machine, back it explicitly rather than leaving the backing to whatever the template inherited, and record the exemption instead of leaving stray ports across the estate.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, locate each `Parallel port` entry.
        3. Confirm the `Connected` and `Connect At Power On` checkboxes are cleared.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | ForEach-Object { $_.ExtensionData.Config.Hardware.Device } | Where-Object { $_ -is [VMware.Vim.VirtualParallelPort] }
        ```

        The check passes when every parallel port is disconnected and not set to connect at power on, or when no parallel ports are defined. It fails for any VM with a parallel port that is connected or configured to connect at power on.
      remediation:
        - id: vsphere-client
          desc: |
            To remove or disconnect parallel ports using the vSphere Client:

            The check passes when every parallel port has both `Connected` and `Connect At Power On` cleared, and a virtual machine without one passes too. Removing the device is the stronger fix, because a disconnected device can be reconnected later by anyone with the privilege.

            **Confirm no legacy application depends on the port.** Licence dongles and industrial equipment are the usual cases.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. On the `Virtual Hardware` tab, locate each `Parallel port` entry.
            4. Remove the device, or clear `Connect At Power On` so that it stays disconnected when the virtual machine starts.
            5. Select `OK`, then power the VM back on.
        - id: powershell
          desc: |
            To remove parallel ports using PowerCLI:

            A virtual machine with no parallel port passes the check.

            **The command removes every parallel port from every powered-off virtual machine it reaches.** Removing the device requires the virtual machine to be powered off, so narrow `Get-VM` to the machines that should lose the device.

            **Confirm no legacy application depends on the port.** Licence dongles and industrial equipment are the usual cases.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Remove every parallel port from the powered-off virtual machines. PowerCLI has no cmdlet for this device, so the script sends a reconfigure request for each one. The `Where-Object` filter skips virtual machines that are still running, so run the script again after powering those off:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | ForEach-Object {
                 $vm = $_
                 $vm.ExtensionData.Config.Hardware.Device |
                   Where-Object { $_ -is [VMware.Vim.VirtualParallelPort] } |
                   ForEach-Object {
                     $spec = New-Object VMware.Vim.VirtualMachineConfigSpec
                     $change = New-Object VMware.Vim.VirtualDeviceConfigSpec
                     $change.Operation = 'remove'
                     $change.Device = $_
                     $spec.DeviceChange = @($change)
                     $vm.ExtensionData.ReconfigVM_Task($spec)
                   }
               }
               ```

            3. Power the virtual machines back on.
