          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that a guest cannot request the display and disk topology information the host holds about it.

        The topology request handler reports layout details of the backing devices back into the guest through VMware Tools. Setting `isolation.tools.dispTopoRequest.disable` to `TRUE` refuses those requests at the VMX process. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent, since the handler answers unless something disables it.

        **Why this matters**

        Virtualization works by giving a guest an abstract view of hardware it does not own. A handler that reports the real topology underneath punches a hole in that abstraction, and what comes through is reconnaissance: sector sizes, alignment, and layout characteristics that identify the storage platform the host is sitting on. An attacker who has landed in a guest uses that to work out what the datacenter is built from before choosing what to attack next, and they get it without sending a single packet.

        The handler is also code in the VMX process operating on guest-supplied requests, and the VMX process serves every virtual machine on the ESXi host. Removing handlers no workload uses is the cheapest way to shrink that surface.

        Very little inside a guest has a reason to ask. Where a storage or backup agent turns out to depend on the information, verify that dependency against the vendor rather than leaving the handler enabled across the whole estate to satisfy one product.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.dispTopoRequest.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.dispTopoRequest.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the Request Disk Topology feature using the vSphere Client, set the advanced parameter `isolation.tools.dispTopoRequest.disable` to `TRUE`. With it set, the VMX process refuses topology requests from the guest. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.dispTopoRequest.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.dispTopoRequest.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **Some automated tools and processes may stop working after this change.**
        - id: powershell
          desc: |
            To disable the Request Disk Topology feature using PowerCLI, set `isolation.tools.dispTopoRequest.disable` to `TRUE` on each virtual machine. With it set, the VMX process refuses topology requests from the guest. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

