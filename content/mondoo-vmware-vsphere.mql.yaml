    docs:
      desc: |
        This check verifies that each virtual machine keeps a defined number of rotated log files.

        The `log.keepOld` parameter sets how many rotated copies of a machine's log are retained on the datastore alongside it, and this check requires a value of `10`. Set it under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or write it with `New-AdvancedSetting` from PowerCLI. An absent parameter fails the check, because the retention then depends on the platform default rather than on a decision anyone made.

        **Why this matters**

        The virtual machine log is the record of what the hypervisor did with the machine: power operations, device changes, reconfigurations, migrations, and the guest interaction the other checks in this policy govern. It is written by the host, which means it survives a guest an attacker has fully compromised and cleaned up inside.

        Retention decides whether that record still exists when it is needed. Too few files, and a burst of routine events rotates the interesting period away before anyone notices there was an incident, which is a result an attacker can produce on purpose by generating noise. Too many, and the files accumulate across thousands of machines on shared datastores.

        Ten rotated files is the balance this baseline settles on, alongside the companion check that bounds the size of each one. Do not meet this control by turning logging off. That removes the record entirely and leaves both incident response and vendor support with nothing to work from.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `log.keepOld` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'log.keepOld'
        ```

        The check passes only when the parameter is present and set to `10` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To set the number of retained VM log files to `10` using the vSphere Client, set the advanced parameter `log.keepOld` to `10`. The value keeps ten rotated copies of the virtual machine log on the datastore. The check passes only when the parameter is present with exactly `10`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `log.keepOld` is already listed, enter `10` in its `Value` field and confirm the change. Otherwise, enter `log.keepOld` as the attribute name and `10` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **Do not disable logging to satisfy this check.** Disabling VM logging removes the audit and troubleshooting record the check is meant to preserve, makes incident investigation and vendor support far harder, and weakens security visibility. Keep logging enabled and tune the rotation count and size instead.
        - id: powershell
          desc: |
            To set the number of retained VM log files to `10` using PowerCLI, set `log.keepOld` to `10` on each virtual machine. The value keeps ten rotated copies of the virtual machine log on the datastore. The check passes only when the parameter is present with exactly `10`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "log.keepOld" -Value 10 -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **Do not disable logging to satisfy this check.** Disabling VM logging removes the audit and troubleshooting record the check is meant to preserve, makes incident investigation and vendor support far harder, and weakens security visibility. Keep logging enabled and tune the rotation count and size instead.
        - id: terraform
          desc: |
            To set the number of retained VM log files to `10` with Terraform, set `log.keepOld` to `10` in the `extra_config` map of the `vsphere_virtual_machine` resource. The value keeps ten rotated copies of the virtual machine log on the datastore. The check requires exactly `10`.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
