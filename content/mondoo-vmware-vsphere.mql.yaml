    docs:
      desc: |
        This check verifies that the guest cannot query the host's drag-and-drop protocol version.

        VMware Tools carries a set of remote procedure calls between the guest and the VMX process that runs on the ESXi host, and the drag-and-drop version handler is one of them. Setting `isolation.tools.vmxDnDVersionGet.disable` to `TRUE` removes the handler from the set a guest can invoke. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent as well as when it holds another value.

        **Why this matters**

        Every one of these handlers is code that runs in the VMX process, on the host, on input a guest controls. That is the surface a virtual machine escape is written against, and drag-and-drop handling in particular has a history of parsing guest-supplied structures. An attacker who owns a guest cannot reach the hypervisor over the network, but they can reach it through this interface, which is precisely why it is worth shutting the parts nobody uses.

        The version query is also reconnaissance. It tells code inside the guest which VMware build it is running on, which narrows the choice of which escape to attempt before making any noisy attempt at all.

        Nothing in a server workload needs drag and drop, since there is no host desktop to drag anything to. Some management tooling that automates guest interaction touches this interface, so verify such tooling still works after applying the change to a template.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.vmxDnDVersionGet.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.vmxDnDVersionGet.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the Drag and Drop Version Get feature using the vSphere Client, set the advanced parameter `isolation.tools.vmxDnDVersionGet.disable` to `TRUE`. With it set, the guest can no longer query the drag-and-drop protocol version from the VMX process. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.vmxDnDVersionGet.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.vmxDnDVersionGet.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **Some automated tools and processes may stop working after this change.**
        - id: powershell
          desc: |
            To disable the Drag and Drop Version Get feature using PowerCLI, set `isolation.tools.vmxDnDVersionGet.disable` to `TRUE` on each virtual machine. With it set, the guest can no longer query the drag-and-drop protocol version from the VMX process. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
