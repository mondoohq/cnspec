    docs:
      desc: |
        This check verifies that a guest operating system cannot connect virtual devices to itself.

        By default a user inside a guest can use VMware Tools to attach devices the virtual machine's hardware list already defines, such as a CD/DVD drive backed by a datastore ISO or a network adapter an administrator deliberately left disconnected. Setting `isolation.device.connectable.disable` to `TRUE` removes that ability and leaves device connection to whoever holds the corresponding vCenter privilege. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI.

        **Why this matters**

        Guest privilege and vCenter privilege are meant to be separate, and this parameter is what keeps them that way for virtual hardware. Someone who has compromised a low-value guest should not be able to change that guest's hardware, but without the setting they can. They reconnect the network adapter an administrator disconnected to keep the machine off the production segment, and the workload they now control is on that segment. Or they connect the CD/DVD drive to an ISO sitting on the shared datastore and read its contents from inside the guest.

        The absent parameter is as much a failure as an explicit false, because the platform permits the connection when nothing says otherwise. The check treats a missing key that way for exactly that reason.

        Where an application really does require an operator inside the guest to attach media, drive the attachment through vCenter instead, so that the action is authorized and logged in the same place as the rest of the virtual machine's lifecycle.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.device.connectable.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.device.connectable.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To prevent unauthorized device connections using the vSphere Client, set the advanced parameter `isolation.device.connectable.disable` to `TRUE`. With it set, a user inside the guest can no longer connect virtual devices through VMware Tools, which leaves device connection to vCenter users who hold the privilege. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.device.connectable.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.device.connectable.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To prevent unauthorized device connections using PowerCLI, set `isolation.device.connectable.disable` to `TRUE` on each virtual machine. With it set, a user inside the guest can no longer connect virtual devices through VMware Tools, which leaves device connection to vCenter users who hold the privilege. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.device.connectable.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To prevent unauthorized device connections with Terraform, set `isolation.device.connectable.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, a user inside the guest can no longer connect virtual devices through VMware Tools, which leaves device connection to vCenter users who hold the privilege. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.device.connectable.disable" = "true"
              }
            }
            ```
