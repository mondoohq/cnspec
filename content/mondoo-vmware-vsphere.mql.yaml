    docs:
      desc: |
        This check verifies that the Host Guest File System server is not registered for any virtual machine.

        The Host Guest File System, or HGFS, is the transport that shared folders and several file transfer APIs use to move files between a guest and the host. Setting `isolation.tools.hgfsServerSet.disable` to `TRUE` stops the guest from registering its HGFS server with the host. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. An absent parameter fails the check.

        **Why this matters**

        HGFS is a file server whose protocol is spoken across the virtualization boundary, and it has been implicated in guest to host escapes precisely because a file server parses a great deal of attacker-shaped input. An attacker with code in a guest speaks it at the host side, and a defect there yields execution in the VMX process, which holds the memory of every virtual machine on that ESXi host.

        Where the transport works as designed, it still moves files between a guest and the host without appearing in the guest's own audit log or in the network controls that would govern any other file transfer out of that workload.

        Disabling registration also disables the tooling that rides on this transport, including some file operations through the guest APIs and the automatic upgrade path for VMware Tools. Confirm which of those a given estate depends on and move them to a mechanism with its own authentication before applying the setting broadly.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.hgfsServerSet.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.hgfsServerSet.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable the Host Guest File System Server using the vSphere Client, set the advanced parameter `isolation.tools.hgfsServerSet.disable` to `TRUE`. With it set, the guest can no longer register its Host Guest File System server with the host. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.hgfsServerSet.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.hgfsServerSet.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **File transfers that depend on HGFS stop working.** APIs that move files to and from the guest operating system through HGFS, such as some VIX commands and the VMware Tools automatic upgrade utility, no longer function.
        - id: powershell
          desc: |
            To disable the Host Guest File System Server using PowerCLI, set `isolation.tools.hgfsServerSet.disable` to `TRUE` on each virtual machine. With it set, the guest can no longer register its Host Guest File System server with the host. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.hgfsServerSet.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **File transfers that depend on HGFS stop working.** APIs that move files to and from the guest operating system through HGFS, such as some VIX commands and the VMware Tools automatic upgrade utility, no longer function.
        - id: terraform
          desc: |
            To disable the Host Guest File System Server with Terraform, set `isolation.tools.hgfsServerSet.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the guest can no longer register its Host Guest File System server with the host. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.hgfsServerSet.disable" = "true"
              }
            }
            ```

            **File transfers that depend on HGFS stop working.** APIs that move files to and from the guest operating system through HGFS, such as some VIX commands and the VMware Tools automatic upgrade utility, no longer function.
