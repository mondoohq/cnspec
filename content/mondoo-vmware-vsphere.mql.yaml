        tags:
          mondoo.com/filter-title: VMware vSphere
          mondoo.com/filter-icon: vmware
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-uefi-secure-boot-is-enabled-for-virtual-machines-terraform-hcl
