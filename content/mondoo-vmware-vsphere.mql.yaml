    docs:
      desc: |
        This check verifies that pasting into the VM console is disabled on each virtual machine.

        Paste is the inbound half of the console clipboard link, carrying whatever is on the operator's own clipboard into the guest. Setting `isolation.tools.paste.disable` to `TRUE` refuses it. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent, and it is gated separately from the outbound copy direction.

        **Why this matters**

        Paste puts content that originated outside the datacenter into a privileged session inside it. The console session is usually running as root or as a domain administrator, and whatever arrives is executed the moment the operator presses return, with no package manager, no signature check, and no record of where the text came from.

        That is the mechanism behind clipboard hijacking: malware on the operator's own workstation replaces what they copied with a command of its own, and the operator pastes it into a production shell without reading it closely. The organization's server hardening is irrelevant, because the command was typed by an authorized administrator.

        It also brings data the wrong way, letting content from a lower trust environment land inside a regulated workload with no record of the transfer.

        Operators rely on paste heavily, so removing it needs a replacement. Provide a supported way to get configuration and scripts onto a host, and apply the companion copy check as well, since disabling one direction leaves the other open.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.paste.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.paste.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable VM Console Paste operations using the vSphere Client, set the advanced parameter `isolation.tools.paste.disable` to `TRUE`. With it set, the clipboard of the machine running the remote console can no longer be pasted into the guest. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.paste.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.paste.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To disable VM Console Paste operations using PowerCLI, set `isolation.tools.paste.disable` to `TRUE` on each virtual machine. With it set, the clipboard of the machine running the remote console can no longer be pasted into the guest. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.paste.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To disable VM Console Paste operations with Terraform, set `isolation.tools.paste.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the clipboard of the machine running the remote console can no longer be pasted into the guest. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.paste.disable" = "true"
              }
            }
            ```
