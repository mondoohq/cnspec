    docs:
      desc: |
        This check verifies that virtual serial ports are disconnected and not set to connect when the virtual machine powers on.

        A virtual serial port can be backed by a file on a datastore, by a named pipe on the host, by a physical port, or by a network socket that reaches across the management network. It appears on the Virtual Hardware tab of Edit Settings with Connected and Connect At Power On checkboxes, and this check requires both to be clear on every port. A virtual machine with no serial port defined satisfies it.

        **Why this matters**

        The network-backed form is the one that matters most. A serial port configured over a socket gives anything that can reach that address a raw console-grade channel into or out of the guest, with no authentication of its own and no record in vCenter of what crossed it. An attacker inside a guest uses it as a covert egress path that no firewall rule on the guest's virtual adapter will see, because the traffic never touches that adapter.

        The pipe-backed and file-backed forms are quieter but similar: they let a guest exchange data with the host or with a datastore other machines can read, outside every control built for network traffic.

        Serial ports are legitimately used for kernel debugging, appliance consoles, and some clustering products. Where one is required, back it deliberately, restrict what can reach the backing endpoint, and exempt that virtual machine rather than leaving ports connected across the estate by inheritance from a template.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, locate each `Serial port` entry.
        3. Confirm the `Connected` and `Connect At Power On` checkboxes are cleared.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | ForEach-Object { $_.ExtensionData.Config.Hardware.Device } | Where-Object { $_ -is [VMware.Vim.VirtualSerialPort] }
        ```

        The check passes when every serial port is disconnected and not set to connect at power on, or when no serial ports are defined. It fails for any VM with a serial port that is connected or configured to connect at power on.
      remediation:
        - id: vsphere-client
          desc: |
            To remove or disconnect serial ports using the vSphere Client:

            The check passes when every serial port has both `Connected` and `Connect At Power On` cleared, and a virtual machine without one passes too. Removing the device is the stronger fix, because a disconnected device can be reconnected later by anyone with the privilege.

            **Confirm no workload depends on the port.** Kernel debugging, appliance consoles, and some clustering products use serial ports.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. On the `Virtual Hardware` tab, locate each `Serial port` entry.
            4. Remove the device, or clear `Connect At Power On` so that it stays disconnected when the virtual machine starts.
            5. Select `OK`, then power the VM back on.
        - id: powershell
          desc: |
            To remove serial ports using PowerCLI:

            A virtual machine with no serial port passes the check.

            **The command removes every serial port from every powered-off virtual machine it reaches.** Removing the device requires the virtual machine to be powered off, so narrow `Get-VM` to the machines that should lose the device.

            **Confirm no workload depends on the port.** Kernel debugging, appliance consoles, and some clustering products use serial ports.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Remove every serial port from the powered-off virtual machines. PowerCLI has no cmdlet for this device, so the script sends a reconfigure request for each one. The `Where-Object` filter skips virtual machines that are still running, so run the script again after powering those off:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | ForEach-Object {
                 $vm = $_
                 $vm.ExtensionData.Config.Hardware.Device |
                   Where-Object { $_ -is [VMware.Vim.VirtualSerialPort] } |
                   ForEach-Object {
                     $spec = New-Object VMware.Vim.VirtualMachineConfigSpec
                     $change = New-Object VMware.Vim.VirtualDeviceConfigSpec
                     $change.Operation = 'remove'
                     $change.Device = $_
                     $spec.DeviceChange = @($change)
                     $vm.ExtensionData.ReconfigVM_Task($spec)
                   }
               }
               ```

            3. Power the virtual machines back on.
