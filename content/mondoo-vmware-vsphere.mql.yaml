          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-vm-console-copy-operations-are-disabled-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that copying out of the VM console is disabled on each virtual machine.

        When copy and paste is enabled, the clipboard of the guest and the clipboard of the machine running the remote console are joined, so text selected inside the guest becomes available on the operator's own desktop. Setting `isolation.tools.copy.disable` to `TRUE` breaks that link in the outbound direction. Add the parameter under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or set it with `New-AdvancedSetting` from PowerCLI. The check fails when the parameter is absent.

        **Why this matters**

        Console clipboard traffic is data leaving a workload along a route none of the controls built for that purpose can see. It does not cross the guest's virtual network adapter, so no firewall rule applies, no proxy inspects it, and no data loss tooling on the network records it. A database extract, a private key, or a block of customer records copied out of a console arrives on an operator laptop with no trace on either side.

        That makes it attractive both to an insider with legitimate console access and to an attacker who has taken over an administrator's session, since it is the quietest available way to move data off a machine that is otherwise well contained.

        The cost is real: operators lose a convenience they use constantly. Pair the change with a supported file transfer path so that moving data out of a guest remains possible through a route that authenticates and records it, and apply the companion paste check as well, since the two directions are gated separately.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `isolation.tools.copy.disable` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'isolation.tools.copy.disable'
        ```

        The check passes only when the parameter is present and set to `TRUE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To disable VM Console Copy operations using the vSphere Client, set the advanced parameter `isolation.tools.copy.disable` to `TRUE`. With it set, text copied inside the guest no longer reaches the clipboard of the machine running the remote console. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `isolation.tools.copy.disable` is already listed, enter `TRUE` in its `Value` field and confirm the change. Otherwise, enter `isolation.tools.copy.disable` as the attribute name and `TRUE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To disable VM Console Copy operations using PowerCLI, set `isolation.tools.copy.disable` to `TRUE` on each virtual machine. With it set, text copied inside the guest no longer reaches the clipboard of the machine running the remote console. The check passes only when the parameter is present with the value `TRUE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.copy.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To disable VM Console Copy operations with Terraform, set `isolation.tools.copy.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, text copied inside the guest no longer reaches the clipboard of the machine running the remote console. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "isolation.tools.copy.disable" = "true"
              }
            }
            ```
