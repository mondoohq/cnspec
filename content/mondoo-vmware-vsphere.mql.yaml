               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "isolation.tools.vmxDnDVersionGet.disable" -Value $true -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **Some automated tools and processes may stop working after this change.**
        - id: terraform
          desc: |
            To disable the Drag and Drop Version Get feature with Terraform, set `isolation.tools.vmxDnDVersionGet.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the guest can no longer query the drag-and-drop protocol version from the VMX process. The map holds strings, and the check accepts either letter case.

