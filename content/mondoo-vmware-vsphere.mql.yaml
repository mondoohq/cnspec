          desc: |
            To disable the Guest Host Interaction Launch Menu feature with Terraform, set `isolation.tools.ghi.launchmenu.change` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, the guest can no longer modify the guest and host interaction launch menu. The map holds strings, and the check accepts either letter case.

