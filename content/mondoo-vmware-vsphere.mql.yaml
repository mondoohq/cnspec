          mondoo.com/filter-icon: terraform
      - uid: mondoo-vmware-vsphere-security-baseline-ensure-only-one-remote-console-connection-is-permitted-to-a-vm-at-any-time-terraform-state
        tags:
          mondoo.com/filter-title: Terraform State
          mondoo.com/filter-icon: terraform
    docs:
      desc: |
        This check verifies that each virtual machine accepts only one remote console session at a time.

        The VM remote console delivers display, keyboard, and mouse access to a guest as though the operator were standing at its screen, ahead of anything the guest itself enforces. The `RemoteDisplay.maxConnections` parameter sets how many console sessions the VMX process will serve at once. Add it with a value of `1` in the vSphere Client under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION, or set it with `New-AdvancedSetting` from PowerCLI.

        **Why this matters**

        When more than one session is permitted, an attacker who holds console permission on a virtual machine can attach silently to a console an administrator is already using. They watch the administrator type a domain password into the guest, then keep the session open after the administrator disconnects. The guest sees no second login because there is no second login; both sessions drive the same virtual keyboard and see the same framebuffer.

        The same property makes concurrent access an operational hazard. A second operator moving the mouse or sending keystrokes during a maintenance window corrupts what the first one is doing, and the resulting audit trail ties the activity to a virtual machine rather than to a person.

        Capping the console at one connection turns attaching into a visible act, because the second session is refused while the first is live. Pair the limit with tight console permissions in vCenter, since it governs how many people can watch at once and not who is entitled to connect in the first place.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `RemoteDisplay.maxConnections` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'RemoteDisplay.maxConnections'
        ```

        The check passes only when the parameter is present and set to `1` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To limit a VM to one remote console connection using the vSphere Client, set the advanced parameter `RemoteDisplay.maxConnections` to `1`. The value caps the number of console sessions the VMX process serves at once, so a second person cannot watch an open session. The check passes only when the parameter is present with exactly `1`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `RemoteDisplay.maxConnections` is already listed, enter `1` in its `Value` field and confirm the change. Otherwise, enter `RemoteDisplay.maxConnections` as the attribute name and `1` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.

            **A single allowed session can lock other operators out of the console.** While one session is open, or while a disconnected session persists, nobody else can open the console. Products such as VMware Cloud Director may require a higher value.
        - id: powershell
          desc: |
            To limit a VM to one remote console connection using PowerCLI, set `RemoteDisplay.maxConnections` to `1` on each virtual machine. The value caps the number of console sessions the VMX process serves at once, so a second person cannot watch an open session. The check passes only when the parameter is present with exactly `1`. An absent parameter or any other value fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "RemoteDisplay.maxConnections" -Value 1 -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.

            **A single allowed session can lock other operators out of the console.** While one session is open, or while a disconnected session persists, nobody else can open the console. Products such as VMware Cloud Director may require a higher value.
        - id: terraform
          desc: |
            To limit a VM to one remote console connection with Terraform, set `RemoteDisplay.maxConnections` to `1` in the `extra_config` map of the `vsphere_virtual_machine` resource. The value caps the number of console sessions the VMX process serves at once, so a second person cannot watch an open session. The check requires exactly `1`.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "RemoteDisplay.maxConnections" = 1
              }
            }
            ```

            **A single allowed session can lock other operators out of the console.** While one session is open, or while a disconnected session persists, nobody else can open the console. Products such as VMware Cloud Director may require a higher value.
  # No Terraform variants: the vsphere_virtual_machine resource exposes PCI passthrough only as a pci_device_id list, with no advanced-setting key to assert against.
  - uid: mondoo-vmware-vsphere-security-baseline-ensure-pci-and-pcie-device-passthrough-is-disabled
    filters: asset.platform == "vmware-vsphere"
    title: Ensure PCI and PCIe device pass-through is disabled
    impact: 60
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-pt-3
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-41
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-4
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      vsphere.datacenters.all( vms.all( advancedSettings.none( key.contains('pciPassthru') ) ) )
    docs:
      desc: |
        This check verifies that no virtual machine has PCI or PCIe device pass-through configured.

        Pass-through assigns a physical PCI device to a single guest, and that guest then drives the hardware directly with the hypervisor out of the data path. vSphere records the assignment as advanced parameters whose names begin with `pciPassthru`, alongside a PCI device entry on the Virtual Hardware tab of Edit Settings. The check reads the advanced parameters of every virtual machine and fails when any such key is defined. Clearing it means removing both the parameters and the PCI device entries in the vSphere Client.

        **Why this matters**

        A pass-through device is DMA-capable hardware handed to guest code. An attacker who reaches kernel execution inside that guest programs the device to read and write host physical memory outside the ranges the virtual machine owns, which is the classic route out of a guest and into the hypervisor. From the hypervisor, every other guest on the host is readable, and the isolation the other tenants depend on was never enforced along that path.

        Pass-through also strands the workload. The virtual machine cannot be live-migrated, cannot be restarted by high availability, and cannot be snapshotted in the usual way, so it accumulates uptime and misses the maintenance windows that would have patched it.

        Some workloads genuinely need direct hardware, GPU compute and certain appliances among them. Keep those on dedicated hosts with an IOMMU enforcing device isolation, treat the guest as though it sat on the host trust boundary, and record the exemption rather than leaving pass-through scattered across general-purpose clusters.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, review the device list for any `PCI device` entries.
        3. Select the `VM Options` tab, expand `Advanced`, and select `EDIT CONFIGURATION`. Confirm no parameters whose name contains `pciPassthru` are defined.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'pciPassthru*'
        ```

        The check passes when no virtual machine has any `pciPassthru` advanced parameter defined. It fails for any VM where the command returns one or more matching parameters.
      remediation:
        - id: vsphere-client
          desc: |
            To remove PCI and PCIe device pass-through using the vSphere Client:

            The check fails while any advanced parameter whose name contains `pciPassthru` is defined, so both the `PCI device` entries and those parameters have to go.

            **The guest loses access to the physical device.** GPU, network, and other pass-through hardware stops being available to the workload, so confirm the virtual machine does not need it before removing it.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. On the `Virtual Hardware` tab, remove each `PCI device` entry.
            4. Select `OK`, then power the VM back on.

            The vSphere Client cannot delete an advanced parameter entry. Remove any remaining `pciPassthru` parameters with the PowerCLI method.
        - id: powershell
          desc: |
            To remove PCI and PCIe device pass-through using PowerCLI:

            The check fails while any advanced parameter whose name contains `pciPassthru` is defined, so remove both the pass-through devices and those parameters.

            **The guest loses access to the physical device.** GPU, network, and other pass-through hardware stops being available to the workload, so confirm the virtual machine does not need it before removing it.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Power off the virtual machine, then remove its pass-through devices, replacing `<vm-name>` with its name. `-Confirm:$false` suppresses the confirmation prompt:

               ```powershell
               Get-VM -Name <vm-name> | Get-PassthroughDevice | Remove-PassthroughDevice -Confirm:$false
               ```

            3. Remove every remaining advanced parameter whose name starts with `pciPassthru`:

               ```powershell
               Get-VM -Name <vm-name> | Get-AdvancedSetting -Name "pciPassthru*" | Remove-AdvancedSetting -Confirm:$false
               ```

            4. Power the virtual machine back on.
        # No Terraform remediation: the vsphere_virtual_machine resource exposes PCI passthrough only as a pci_device_id list, with no advanced-setting key to assert against.
