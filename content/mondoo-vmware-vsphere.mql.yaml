    docs:
      desc: |
        This check verifies that each virtual machine has a virtual Trusted Platform Module attached.

        A vTPM is a software implementation of a TPM 2.0 device presented to the guest, giving it a sealed store for keys and a place to record boot measurements. Adding one requires the virtual machine to use EFI firmware and requires a key provider configured in vCenter under Configure and Key Providers, either the Native Key Provider or a registered external key server. With the machine powered off, add the device through Edit Settings and ADD NEW DEVICE, choosing Trusted Platform Module.

        **Why this matters**

        Without a vTPM, the guest's own protections fall back on secrets held in ordinary memory or on disk. Full disk encryption in the guest has to keep its key somewhere the operating system can read at boot, so an attacker who obtains a copy of the virtual disk, from a backup, a snapshot, or a datastore they can read, recovers the key from the image and decrypts everything on it offline. The encryption was never protecting the data against the person holding the files.

        A vTPM changes that arithmetic. The key is sealed to the module, the module's own state is protected by the key provider, and a copied disk is not enough to unlock it. It is also the prerequisite for measured boot and remote attestation, so a guest can prove what it booted rather than assert it.

        Adding a vTPM binds the virtual machine to the key provider, so plan key provider availability and backup before rolling this out, since a machine whose provider is unreachable will not power on.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. On the `Virtual Hardware` tab, review the list of devices.
        3. Confirm a `Trusted Platform Module` device is listed.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-VTpm
        ```

        The check passes when every virtual machine has a vTPM device present. It fails for any VM that returns no Trusted Platform Module device.
      remediation:
        - id: vsphere-client
          desc: |
            To add a vTPM using the vSphere Client:

            A vTPM needs a key provider configured in vCenter Server, either the Native Key Provider or a registered key server, and the virtual machine must use EFI firmware.

            1. Confirm a key provider is listed under `vCenter` → `Configure` → `Key Providers`.
            2. Power off the virtual machine.
            3. Right-click the VM and select `Edit Settings`.
            4. Select `ADD NEW DEVICE`, then choose `Trusted Platform Module`.
            5. Select `OK`, then power the VM back on.
        - id: powershell
          desc: |
            To add a vTPM using PowerCLI:

            A vTPM needs a key provider configured in vCenter Server, and the virtual machine must use EFI firmware and be powered off.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add the vTPM, replacing `<vm-name>` with the name of the powered-off virtual machine:

               ```powershell
               Get-VM -Name <vm-name> | New-VTpm
               ```

            3. Power the virtual machine back on.
        - id: terraform
          desc: |
            To attach a vTPM with Terraform, add a `vtpm` block to the `vsphere_virtual_machine` resource. The VM must use EFI firmware and a key provider must be configured in vCenter Server.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine when `vtpm` or `firmware` changes, and forces a power off if the guest has not shut down within `shutdown_wait_timeout`, three minutes by default.

            **Switching an existing virtual machine from BIOS to EFI firmware can leave the guest operating system unbootable.** Verify the guest supports EFI before changing `firmware` on a machine that already exists.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              firmware = "efi"

              vtpm {}
            }
            ```
    refs:
