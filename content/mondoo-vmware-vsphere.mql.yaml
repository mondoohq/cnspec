    docs:
      desc: |
        This check verifies that Virtualization-Based Security is enabled on each virtual machine.

        VBS is a Windows feature that uses hardware virtualization to hold sensitive security functions in a memory region the guest kernel itself cannot reach. For a guest to use it, vSphere has to expose the required virtualization extensions, which is what the Enable checkbox next to Virtualization Based Security on the VM Options tab of Edit Settings does. The machine must be powered off, must use EFI firmware with Secure Boot, and the feature must then be turned on inside the Windows guest as well.

        **Why this matters**

        The attack this defeats is credential theft after a compromise. An attacker who reaches administrative privilege on a Windows machine reads cached credentials and Kerberos tickets straight out of the memory of the authentication process, then replays them against every other system that trusts them. That is how a single compromised server becomes a domain, and it works because the attacker and the secrets are in the same address space.

        VBS moves those secrets into an isolated region enforced by the hypervisor, so kernel-level code in the guest cannot read them. It also enforces code integrity for the guest kernel, which blocks the unsigned drivers that attackers load to reach that memory in the first place.

        Enabling the exposure in vSphere is only half the control, since the guest must be configured to use it. Verify Credential Guard is actually running inside Windows after the change rather than treating the vSphere checkbox as the finished state.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab.
        3. Confirm the `Enable` checkbox next to `Virtualization Based Security` is selected.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Select-Object Name, @{N='VBSEnabled';E={$_.ExtensionData.Config.Flags.VbsEnabled}}
        ```

        The check passes when every virtual machine reports VBS as enabled. It fails for any VM where Virtualization-Based Security is disabled.
      remediation:
        - id: vsphere-client
          desc: |
            To enable Virtualization-Based Security using the vSphere Client:

            Enabling VBS requires the virtual machine to use EFI firmware with Secure Boot, hardware virtualization exposed to the guest, and a supported Windows guest OS.

            1. Power off the virtual machine.
            2. Right-click the VM and select `Edit Settings`.
            3. On the `VM Options` tab, select the `Enable` checkbox next to `Virtualization Based Security`.
            4. Select `OK`, then power the VM back on.
            5. In the Windows guest, enable VBS and Credential Guard via Group Policy or the Windows security settings.
        - id: terraform
          desc: |
            To enable Virtualization-Based Security with Terraform, set the `vbs_enabled` argument on the `vsphere_virtual_machine` resource. The provider requires `firmware` to be `"efi"` and `efi_secure_boot_enabled`, `nested_hv_enabled`, and `vvtd_enabled` to be `true` alongside it.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine when `vbs_enabled`, `firmware`, or the related arguments change, and forces a power off if the guest has not shut down within `shutdown_wait_timeout`, three minutes by default.

            **Switching an existing virtual machine from BIOS to EFI firmware can leave the guest operating system unbootable.** Verify the guest supports EFI before changing `firmware` on a machine that already exists.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              firmware                = "efi"
              efi_secure_boot_enabled = true
              nested_hv_enabled       = true
              vvtd_enabled            = true
              vbs_enabled             = true
            }
            ```
    refs:
      - url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/vsphere-security/securing-windows-guest-operating-systems-with-virtual-based-security.html
        title: Securing Windows Guest Operating Systems with Virtualization-based Security
  - uid: mondoo-vmware-vsphere-security-baseline-ensure-vm-console-copy-operations-are-disabled
    title: Ensure VM Console Copy operations are disabled
    impact: 60
    tags:
