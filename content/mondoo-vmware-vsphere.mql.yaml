  # No Terraform variants: vCenter RBAC permission assignments are management-plane state with no stable single Terraform resource to assert against (the vsphere provider's vsphere_entity_permissions is per-entity), so this check runs against the live vCenter only.
  - uid: mondoo-vmware-vsphere-security-baseline-admin-role-assigned-to-groups
    filters: asset.platform == "vmware-vsphere"
    title: Ensure the vCenter Administrator role is granted only to groups
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-05
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      vsphere.permissions.where( role.name == "Admin" ).all( group == true )
    docs:
      desc: |
        This check verifies that the vCenter Administrator role is granted to groups rather than to individual user accounts.

        Every permission in vCenter binds a principal to a role on an inventory object, and the principal can be a user or a group. This check reads the permissions that carry the Administrator role and requires each to name a group. Review them in the vSphere Client under Administration, Access Control, Global Permissions, along with the Permissions tab of individual inventory objects, and grant the role to a directory group whose membership is managed in the identity provider instead.

        **Why this matters**

        vCenter Administrator is the highest privilege in the environment. It can read and modify every virtual machine, attach their disks elsewhere, and change the hosts running them, so a compromise of any account holding it is a compromise of every workload at once.

        Direct user grants are how that privilege quietly spreads. They are made during an incident or a project, scattered across inventory objects rather than held in one place, and never removed. When the person leaves, disabling their directory account is assumed to be enough, but a permission bound to a principal that still resolves, or to a local account outside the directory, keeps working. Nobody notices, because nobody enumerates every object's permission list.

        Group-based grants collapse that to one question: who is in the group. Offboarding revokes access everywhere it was inherited, and an access review has one list to read. Keep the group small, exclude break-glass accounts deliberately, and check the per-object permissions as well as the global ones, since a stray grant deep in the inventory is exactly what this control exists to find.
      audit: |-
        ### Audit via the vSphere Client

        1. From the vSphere Client, go to **Administration** > **Access Control** > **Global Permissions**, and also review per-object permissions in the inventory.
        2. For each permission whose assigned role is **Administrator**, note whether the principal is a user or a group.

        If every Administrator assignment is granted to a group, the check passes. If any Administrator assignment is granted directly to a user, the check fails.

        ### Audit via PowerCLI

        1. List Administrator permissions and their principal type:

           ```powershell
           Get-VIPermission | Where-Object { $_.Role -eq 'Admin' } |
             Select-Object Principal, IsGroup, Entity
           ```

        If `IsGroup` is `True` for every returned row, the check passes; any row with `IsGroup` `False` fails the check.
      remediation:
        - id: console
          desc: |
            To move Administrator access from individual users to a group using the vSphere Client:

            Every permission that grants the Administrator role has to name a group, so each direct user grant is replaced by a grant to a directory group whose membership is managed in the identity provider.

            **Do not remove the Administrator permissions held by vCenter solution users.** Accounts such as `vpxd`, `vpxd-extension`, and `vsphere-webclient` in the vCenter Single Sign-On domain need the Administrator role, and vCenter tasks such as enabling vSphere HA fail without it.

            **Confirm the group grant works before removing any user grant.** Sign in as a member of the group and check its administrator access first, so removing a direct grant cannot lock you out.

            1. Create a directory group for vCenter administrators, or identify an existing one, and add the appropriate users to it in your identity provider.
            2. In the vSphere Client, go to **Administration** > **Access Control** > **Global Permissions**, or to the **Permissions** tab of the inventory object that carries the user grant.
            3. Add a permission assigning the **Administrator** role to the group.
            4. Sign in as a member of the group and confirm it has administrator access.
            5. Remove each individual user's direct **Administrator** permission.
        - id: powershell
          desc: |
            To replace a user's Administrator permission with a group assignment using PowerCLI:

            **Do not remove the Administrator permissions held by vCenter solution users.** Accounts such as `vpxd`, `vpxd-extension`, and `vsphere-webclient` in the vCenter Single Sign-On domain need the Administrator role, and vCenter tasks such as enabling vSphere HA fail without it.

            **Confirm the group grant works before removing any user grant.** Sign in as a member of the group and check its administrator access first, so removing a direct grant cannot lock you out.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Grant the Administrator role to the group on the root folder of the inventory, propagating to every object below it. Replace `<admin-group>` with the directory group in `DOMAIN\group` form, such as `EXAMPLE\vcenter-admins`:

               ```powershell
               New-VIPermission -Entity (Get-Folder -NoRecursion) -Principal "<admin-group>" -Role Admin -Propagate:$true
               ```

            3. After confirming a member of the group has administrator access, remove the user's direct Administrator permissions. Replace `<user-name>` with the user in `DOMAIN\user` form. `-Confirm:$false` suppresses the confirmation prompt:

               ```powershell
               Get-VIPermission -Principal "<user-name>" | Where-Object { $_.Role -eq 'Admin' } | Remove-VIPermission -Confirm:$false
               ```
        # No Terraform remediation: vCenter RBAC assignment governance has no single Terraform resource; use the vSphere Client or PowerCLI.
    refs:
      - url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/vsphere-security.html
        title: vSphere Security
  # No Terraform variants: the vCenter Single Sign-On lockout policy is a management-plane security setting with no Terraform resource in the vsphere provider, so this check runs against the live vCenter only.
  - uid: mondoo-vmware-vsphere-security-baseline-sso-lockout-policy-enforced
    filters: asset.platform == "vmware-vsphere"
    title: Ensure the vCenter SSO account lockout policy is enforced
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-308-a-5-ii-c-log-in-monitoring
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-4
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      vsphere.ssoLockoutPolicy.maxFailedAttempts >= 1 && vsphere.ssoLockoutPolicy.maxFailedAttempts <= 5
    docs:
      desc: |
        This check verifies that the vCenter Single Sign-On lockout policy locks an account after a small, non-zero number of failed sign-in attempts.

        The policy lives in the vSphere Client under Administration, Single Sign On, Configuration, Local Accounts, Lockout Policy, and the field that matters is the maximum number of failed login attempts. This check requires a value between 1 and 5. A value of 0 means unlimited attempts, and a high value means an attacker exhausts a large password list before anything stops them, so both fail. The same policy also sets the interval failures are counted over and how long the lock lasts, and both should be set deliberately.

        **Why this matters**

        The SSO domain is the root of trust for the whole environment. An account that authenticates there can reach vCenter, and vCenter can reach every virtual machine on every host it manages, so password guessing against SSO is guessing at the keys to the entire estate rather than to one system.

        Online guessing is cheap and quiet when nothing stops it. An attacker with a list of common passwords and a valid username works through it at whatever rate the service will answer, and without a lockout the only limit is patience. A threshold of five failures makes that impractical and, just as importantly, turns the attempt into a visible event: repeated lockouts on an administrator account are one of the clearest signals available that someone is working on the environment.

        Set the unlock time so that legitimate operators recover on their own, and make sure service accounts using SSO have their credentials rotated properly, since a stale credential in an automated job is the usual cause of unexplained lockouts.
      audit: |-
        ### Audit via the vSphere Client

        1. From the vSphere Client, go to **Administration** > **Single Sign On** > **Configuration** > **Local Accounts** > **Lockout Policy**.
        2. Review **Maximum number of failed login attempts**.

        If the maximum failed login attempts is between 1 and 5, the check passes. If it is 0 (unlimited) or greater than 5, the check fails.

        ### Audit via PowerCLI

        1. Connect to the SSO admin server and read the lockout policy:

           ```powershell
           Connect-SsoAdminServer -Server vcenter.example.com -Credential (Get-Credential)
           Get-SsoLockoutPolicy | Select-Object MaxFailedAttempts
           ```

        If `MaxFailedAttempts` is between 1 and 5, the check passes; otherwise it fails.
      remediation:
        - id: console
          desc: |
            To set the SSO lockout policy using the vSphere Client:

            The check passes when **Maximum number of failed login attempts** is between `1` and `5`. A value of `0` means unlimited attempts and fails, as does any value above `5`.

            1. Go to **Administration** > **Single Sign On** > **Configuration** > **Local Accounts** > **Lockout Policy** and click **Edit**.
            2. Set **Maximum number of failed login attempts** to a value from `1` to `5`, such as `5`.
            3. Set **Time interval between failures**, the window in which failures are counted, and **Unlock time**, how long a locked account stays locked, then save.
        - id: powershell
          desc: |
            To set the SSO lockout policy using PowerCLI:

            The `Connect-SsoAdminServer`, `Get-SsoLockoutPolicy`, and `Set-SsoLockoutPolicy` cmdlets come from the `VMware.vSphere.SsoAdmin` module, which is published separately from PowerCLI. `-MaxFailedAttempts` must be between `1` and `5` to pass the check. A value of `0` means unlimited attempts and fails.

            1. Install the module:

               ```powershell
               Install-Module -Name VMware.vSphere.SsoAdmin -Scope CurrentUser
               ```

            2. Connect to vCenter Single Sign-On, replacing `<vcenter-fqdn>` with the host name of your vCenter Server. `Get-Credential` prompts for an SSO administrator account such as `administrator@vsphere.local`:

               ```powershell
               Connect-SsoAdminServer -Server <vcenter-fqdn> -Credential (Get-Credential)
               ```

            3. Set the maximum number of failed attempts:

               ```powershell
               Get-SsoLockoutPolicy | Set-SsoLockoutPolicy -MaxFailedAttempts 5
               ```
        # No Terraform remediation: the vCenter SSO lockout policy has no Terraform resource; use the vSphere Client or PowerCLI.
    refs:
      - url: https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/vsphere-authentication.html
        title: vSphere Authentication
