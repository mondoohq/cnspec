  # No Terraform variants: the vsphere_virtual_machine resource has no encryption argument; VM encryption is applied through a storage policy, not the VM resource.
  - uid: mondoo-vmware-vsphere-security-baseline-ensure-virtual-machine-encryption-is-enabled
    filters: asset.platform == "vmware-vsphere"
    title: Ensure virtual machine encryption is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a28
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-iv-access-control-encryption-and-decryption
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-1
      compliance/nist-csf-2: nist-csf-2-pr-ds-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-28
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-16
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-3-5-1
      compliance/soc2-2017: soc2-control-cc6-1-10
      compliance/vda-isa-5: vda-isa-5-5-1-1
    mql: |
      vsphere.datacenters.all( vms.all( encrypted == true ) )
    docs:
      desc: |
        This check verifies that each virtual machine is encrypted.

        With VM encryption enabled, vSphere encrypts the virtual disks, the configuration files, and the swap and suspend files using a key supplied by a configured key provider, so the files that make up the machine are unreadable without the provider. It is applied through a storage policy: in the vSphere Client, with the machine powered off, use VM Policies and Edit VM Storage Policies, then select the VM Encryption Policy. A key provider, either the Native Key Provider or a registered external key server, must exist first under Configure and Key Providers.

        **Why this matters**

        A virtual machine is a set of files on shared storage, and everyone who can read that storage can read those files. That set is larger than the set of people who can log into the guest: it includes storage administrators, backup operators, anyone with access to a replica at a second site, and anyone who obtains a decommissioned array. Without encryption, copying the files is equivalent to having root on the workload, because the disk can be mounted elsewhere and read at leisure with none of the guest's access controls in the way.

        Encryption moves the boundary to the key provider. Copying files gains nothing without a key the provider will only release to an authorized host.

        Encrypted machines cannot run on a host that cannot reach the key provider, which constrains migration and disaster recovery, and a lost key provider means lost data. Make provider availability and key backup part of the rollout rather than an afterthought.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose the `Summary` tab.
        2. Review the `VM Hardware` panel, or open `Edit Settings` and expand `Encryption` on the `VM Options` tab.
        3. Confirm the virtual machine is encrypted and assigned an encryption storage policy.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Select-Object Name, @{N='Encrypted';E={$_.ExtensionData.Config.KeyId -ne $null}}
        ```

        The check passes when every virtual machine reports as encrypted. It fails for any VM that has no encryption key assigned.
      remediation:
        - id: vsphere-client
          desc: |
            To encrypt a virtual machine using the vSphere Client:

            Encryption is applied through an encryption storage policy and needs a key provider configured in vCenter Server, either the Native Key Provider or a registered key server.

            **The virtual machine must be powered off and have no snapshots, and encrypting it needs at least twice the datastore space it currently uses.** Consolidate or delete snapshots before you start.

            1. Confirm a key provider is listed under `vCenter` → `Configure` → `Key Providers`.
            2. Power off the virtual machine.
            3. Right-click the VM and select `VM Policies` → `Edit VM Storage Policies`.
            4. From the `VM storage policy` drop-down, select `VM Encryption Policy` or another encryption storage policy.
            5. Select `OK`, then power the VM back on.

            **Encrypted virtual machines cannot be migrated to hosts that lack access to the key provider.** Some operations, such as content-based deduplication, are not available for encrypted VMs.
        - id: powershell
          desc: |
            To encrypt a virtual machine using PowerCLI:

            Encryption is applied through an encryption storage policy and needs a key provider configured in vCenter Server.

            **The virtual machine must be powered off and have no snapshots, and encrypting it needs at least twice the datastore space it currently uses.** Consolidate or delete snapshots before you start.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Encrypt the virtual machine with the bundled `VM Encryption Policy`. Replace `<key-provider-name>` with the key provider name shown under `Key Providers` in vCenter Server, and `<vm-name>` with the name of the powered-off virtual machine. `-Confirm:$false` suppresses the confirmation prompt:

               ```powershell
               $keyProvider = Get-KeyProvider -Name "<key-provider-name>"
               $policy = Get-SpbmStoragePolicy -Name "VM Encryption Policy"
               Get-VM -Name <vm-name> | Set-VM -StoragePolicy $policy -KeyProvider $keyProvider -Confirm:$false
               ```

            3. Power the virtual machine back on.

            **Encrypted virtual machines cannot be migrated to hosts that lack access to the key provider.** Some operations, such as content-based deduplication, are not available for encrypted VMs.
        # No Terraform remediation: the vsphere_virtual_machine resource has no encryption argument; VM encryption is applied through a storage policy, not the VM resource.
