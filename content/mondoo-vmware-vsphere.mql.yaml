               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To prevent unauthorized device modifications and disconnections with Terraform, set `isolation.device.edit.disable` to `"true"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set, a user inside the guest can no longer edit or disconnect virtual devices through VMware Tools, so hardware changes have to come from vCenter. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

