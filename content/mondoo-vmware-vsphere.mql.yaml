    docs:
      desc: |
        This check verifies that host information is not published into each virtual machine.

        The guest library in VMware Tools can report details about the ESXi host a machine is running on, including its identity, CPU model, memory capacity, and current utilization. The `tools.guestlib.enableHostInfo` parameter controls that, and this check requires it to be `FALSE`. Set it under Edit Settings, VM Options, Advanced, EDIT CONFIGURATION in the vSphere Client, or write it with `New-AdvancedSetting` from PowerCLI. An absent parameter is a failing result.

        **Why this matters**

        An attacker who lands in a low-value guest has to work out where they are before they can decide what to attack. This interface answers that for them, from inside the machine, with no scanning and nothing to detect: which host they are on, how large it is, what generation of hardware it runs, and how loaded it is. Combined across several compromised guests, that maps the cluster and identifies which hosts carry the workloads worth pursuing.

        In a multi-tenant environment it is worse than reconnaissance. Host utilization figures reveal the behavior of the neighboring tenants sharing the hardware, since load that one tenant did not generate came from someone else, and that is a side channel a customer should not have.

        The information is occasionally used by licence managers and by capacity agents inside guests. Confirm which of those an estate actually depends on and grant the exception to those machines, rather than leaving host details readable from every guest by default.
      audit: |-
        ### Audit via the vSphere Client

        1. Select the virtual machine and choose `Actions` followed by `Edit Settings`.
        2. Select the `VM Options` tab and expand `Advanced`.
        3. Select `EDIT CONFIGURATION`.
        4. Locate the `tools.guestlib.enableHostInfo` parameter and read its value.

        ### Audit via PowerCLI

        1. Connect to vCenter Server with `Connect-VIServer`.
        2. Run the following command:

        ```powershell
        Get-VM | Get-AdvancedSetting -Name 'tools.guestlib.enableHostInfo'
        ```

        The check passes only when the parameter is present and set to `FALSE` for every virtual machine. It fails if the parameter is absent or set to any other value.
      remediation:
        - id: vsphere-client
          desc: |
            To prevent host information from being sent to guests using the vSphere Client, set the advanced parameter `tools.guestlib.enableHostInfo` to `FALSE`. With it set to `FALSE`, the VMware Tools guest library no longer reports details about the ESXi host to the guest. The check passes only when the parameter is present with the value `FALSE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change.

            1. Power off the virtual machine.
            2. Right-click the virtual machine and select `Edit Settings`.
            3. Select the `Advanced Parameters` tab.
            4. If `tools.guestlib.enableHostInfo` is already listed, enter `FALSE` in its `Value` field and confirm the change. Otherwise, enter `tools.guestlib.enableHostInfo` as the attribute name and `FALSE` as the value, then select `Add`.
            5. Select `OK`, then power the virtual machine back on.
        - id: powershell
          desc: |
            To prevent host information from being sent to guests using PowerCLI, set `tools.guestlib.enableHostInfo` to `FALSE` on each virtual machine. With it set to `FALSE`, the VMware Tools guest library no longer reports details about the ESXi host to the guest. The check passes only when the parameter is present with the value `FALSE`, in any letter case. An absent parameter fails.

            **This requires downtime.** Most advanced parameters cannot be set while a virtual machine is powered on, so each virtual machine has to be powered off to apply the change. Power off the virtual machines in a maintenance window before running the command.

            1. Connect to vCenter Server, replacing `<vcenter-fqdn>` with the host name of your vCenter Server:

               ```powershell
               Connect-VIServer -Server <vcenter-fqdn>
               ```

            2. Add or overwrite the parameter on every powered-off virtual machine. The `Where-Object` filter skips virtual machines that are still running, so run the command again after powering those off. `-Force` overwrites an existing value, and `-Confirm:$false` suppresses the confirmation prompt for each virtual machine:

               ```powershell
               Get-VM | Where-Object PowerState -eq 'PoweredOff' | New-AdvancedSetting -Name "tools.guestlib.enableHostInfo" -Value $false -Force -Confirm:$false
               ```

            3. Power the virtual machines back on.
        - id: terraform
          desc: |
            To prevent host information from being sent to guests with Terraform, set `tools.guestlib.enableHostInfo` to `"false"` in the `extra_config` map of the `vsphere_virtual_machine` resource. With it set to `FALSE`, the VMware Tools guest library no longer reports details about the ESXi host to the guest. The map holds strings, and the check accepts either letter case.

            **Applying this change restarts the virtual machine.** The provider reboots a virtual machine whenever `extra_config` changes. It waits for the guest to shut down and forces a power off if the guest has not stopped within `shutdown_wait_timeout`, three minutes by default, so apply it in a maintenance window.

            ```hcl
            resource "vsphere_virtual_machine" "vm" {
              name             = "example-vm"
              resource_pool_id = data.vsphere_resource_pool.pool.id
              # ...

              extra_config = {
                "tools.guestlib.enableHostInfo" = "false"
              }
            }
            ```
