        Events recorded include 4698 through 4702 for scheduled task creation, deletion, enabling, disabling, and update.

        **Why this matters**

        Scheduled tasks are among the most heavily used persistence mechanisms on Windows. A task survives reboots, runs on a schedule or at a trigger without anyone logging in, can execute as SYSTEM, and looks entirely ordinary among the many legitimate tasks a Windows installation already has.

