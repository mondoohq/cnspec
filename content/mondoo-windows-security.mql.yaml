        This check verifies that the **User Account Management** audit subcategory is set to **Success and Failure**.

        The subcategory records the full lifecycle of user accounts, including creation, deletion, enabling, disabling, renaming, password changes and resets, and lockouts. The check reads the effective audit policy for the subcategory.

        Events recorded include 4720 for account creation, 4722 and 4725 for enabling and disabling, 4723 and 4724 for password change and reset, 4726 for deletion, 4738 for modification, and 4781 for a rename.

        **Why this matters**

        Creating an account is the most durable form of persistence available to an attacker. Unlike a running process or a scheduled task, an account survives reboots, patching, and the remediation of whatever was originally exploited, and on a system with many service accounts a new one attracts little attention.

        These events are what make the creation visible at the time it happens, naming both the new account and the account that created it. That second field is what turns one finding into a chain, since it identifies the credential the attacker was already using.

