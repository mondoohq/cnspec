queries:
  - uid: mondoo-windows-security-2.2.19-l1-ensure-debug-programs-is-empty
    title: Ensure 'Debug programs' is not set
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      secpol.privilegerights['SeDebugPrivilege'] == empty
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/user-rights-assignment
          title: Windows User Rights Assignment
      desc: |
        This check verifies that no account holds the Debug programs privilege.

        `SeDebugPrivilege` allows a process to attach to any other process on the system, including processes owned by other users and by the operating system itself. The check reads the privilege rights assignment, which must be empty.

        **Why this matters**

        This privilege bypasses process isolation entirely, and process isolation is the boundary most other protections depend on.

        Its most consequential use is against LSASS, the process that holds credentials in memory. An account with this privilege can open LSASS and read out password hashes, Kerberos tickets, and in some configurations cleartext passwords, for every account that has authenticated on the machine since it started. That is the standard credential theft technique on Windows, and this privilege is what makes it possible.

        It also allows arbitrary code to be injected into any running process, so an attacker can execute inside a trusted application and inherit its identity and its network access.

        Developers do not need it. Debugging a process you own works without it; the privilege is required only for attaching to processes owned by others, which is a system-level operation.

        Administrators can grant it to themselves when a genuine need arises, and that grant is recorded by the authorization policy change auditing this policy also configures. Leaving it permanently assigned is what should not happen.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Local Policies** > **User Rights Assignment**.
        3. Locate **Debug programs** and review the assigned accounts.

        The system passes when **Debug programs** lists no accounts. It fails if any user or group is assigned.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the `SeDebugPrivilege` entry.

        The system passes when `SeDebugPrivilege` has no accounts assigned. It fails if any account is listed.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To configure this setting using Group Policy:

            1. Open the Group Policy Management Console (GPMC).
            2. Edit the appropriate Group Policy Object (GPO) that applies to your target computers.
            3. Navigate to:
                `Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > User Rights Assignment`
            4. In the right pane, find and double-click **Debug programs**.
            5. Remove all users and groups from the list so that it is empty.
            6. Click **OK** to save your changes.
            7. Close the Group Policy Management Editor.
            8. Run `gpupdate /force` on the target computers or wait for the next policy refresh cycle for the changes to take effect.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("SeDebugPrivilege = \S+", "SeDebugPrivilege = ") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use `secedit` to remove the Debug programs privilege assignment.

            ```yaml
            - name: Ensure 'Debug programs' is not set
              hosts: windows
              tasks:
                - name: Export current security policy
                  ansible.windows.win_command:
                    cmd: secedit /export /cfg C:\Windows\Temp\secpol-export.cfg

                - name: Remove SeDebugPrivilege assignment
                  ansible.windows.win_powershell:
                    script: |
                      (Get-Content C:\Windows\Temp\secpol-export.cfg) -replace 'SeDebugPrivilege = \S+', 'SeDebugPrivilege = ' | Out-File C:\Windows\Temp\secpol-import.cfg -Encoding Unicode

                - name: Import updated security policy
                  ansible.windows.win_command:
                    cmd: >-
                      secedit /configure /db C:\Windows\Temp\secpol-db.sdb
                      /cfg C:\Windows\Temp\secpol-import.cfg

                - name: Force group policy update
                  ansible.windows.win_command:
                    cmd: gpupdate /force

                - name: Clean up temporary files
                  ansible.windows.win_file:
                    path: "{{ item }}"
                    state: absent
                  loop:
                    - C:\Windows\Temp\secpol-export.cfg
                    - C:\Windows\Temp\secpol-import.cfg
                    - C:\Windows\Temp\secpol-db.sdb
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to remove every account from the Debug programs user right. The `:clear` action strips all accounts currently holding the privilege:

            ```ruby
            windows_user_privilege 'Debug programs' do
              privilege 'SeDebugPrivilege'
              action :clear
            end
            ```
  - uid: mondoo-windows-security-additional-LSA-protection
    title: Ensure additional LSA protection is enabled
    impact: 100
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'RunAsPPL' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/
          title: Windows Security Documentation
      desc: |
        This check verifies that LSASS runs as a protected process, so that other processes cannot read its memory.

        The check reads `RunAsPPL` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `1`.

        **Why this matters**

        LSASS holds the credentials of every account that has authenticated on the machine since it last booted: password hashes, Kerberos tickets, and depending on configuration, plaintext passwords. It is the single richest target on a Windows system, and reading its memory is the standard way an attacker converts local administrator access into credentials that work on other machines.

        Protected process light changes what it takes to do that. The kernel refuses handle requests for read and write access to a protected process from ordinary processes, including those running as SYSTEM, so the usual credential dumping tools fail even with full administrative privileges.

        Defeating it requires signed kernel-level code, which is a substantially higher bar than running a tool as administrator, and one that leaves considerably more evidence.

        Confirm compatibility before enabling. Security products and smart card providers that load into LSASS must be signed appropriately, and an unsigned one will stop loading. Microsoft documents an audit mode that reports which modules would be blocked, and it is worth running first.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `RunAsPPL` value.

        The system passes when `RunAsPPL` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'RunAsPPL'
           ```

        The system passes when `RunAsPPL` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To enable LSA protection via Group Policy:

            1. Open the Group Policy Management Console (GPMC).
            2. Create a new GPO linked at the domain level or to the organizational unit containing your computer accounts, or select an existing GPO.
            3. Right-click the GPO and select "Edit" to open the Group Policy Management Editor.
            4. Navigate to `Computer Configuration > Preferences > Windows Settings`.
            5. Right-click "Registry," point to "New," and select "Registry Item."
            6. In the "New Registry Properties" dialog:
                - Set "Hive" to `HKEY_LOCAL_MACHINE`.
                - Set "Key Path" to `SYSTEM\CurrentControlSet\Control\Lsa`.
                - Set "Value name" to `RunAsPPL`.
                - Set "Value type" to `REG_DWORD`.
                - Set "Value data" to `1`.
            7. Select "OK" to save the configuration.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'RunAsPPL'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to enable LSA protection:

            ```yaml
            ---
            - name: Enable additional LSA protection
              hosts: windows
              tasks:
                - name: Set RunAsPPL to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: RunAsPPL
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            This setting takes effect after the next restart. Use this Chef Infra recipe code to set the `RunAsPPL` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'RunAsPPL',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-always-prompt-for-password-upon-connection-is-set-to-enabled
    title: Ensure 'Always prompt for password upon connection' is set to 'Enabled'
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      windows.rdp.alwaysPromptForPassword
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop always asks for a password at connection time rather than accepting one supplied automatically by the client.

        The check reads the Remote Desktop always-prompt-for-password setting, which must be enabled.

        **Why this matters**

        Without this, the Remote Desktop client can pass a stored credential to the server and the session opens with no prompt. The convenience is real and so is the consequence: anyone who reaches the client machine reaches the server, because the credential travels with the client rather than being supplied by the person.

        That is what turns one compromised workstation into access to the servers its user administers. An attacker who lands on the workstation does not need to capture a password, phish it, or crack it; they open the saved connection and are authenticated.

        Requiring the prompt puts a credential the attacker does not have between them and the server. It also restores accountability, since the person connecting has demonstrated knowledge of the password rather than inheriting a session from whatever the client had stored.

        This works alongside the setting that prevents passwords being saved in the first place. The two address the same exposure from opposite ends, and both are worth having.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `fPromptForPassword` value.

        The system passes when `fPromptForPassword` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fPromptForPassword'
           ```

        The system passes when `fPromptForPassword` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Security\\Always prompt for password upon connection
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In the Microsoft Windows Vista Administrative Templates, this setting was named _Always prompt client for password upon connection_, but it was renamed starting with the Windows Server 2008 (non-R2) Administrative Templates.

            **Impact:**

            Users cannot automatically log on to Remote Desktop Services by supplying their passwords in the Remote Desktop Connection client. They will be prompted for a password to log on.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'fPromptForPassword'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Always prompt for password upon RDP connection
              hosts: windows
              tasks:
                - name: Set fPromptForPassword to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
                    name: fPromptForPassword
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `fPromptForPassword` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' do
              values [{
                name: 'fPromptForPassword',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-application-control-event-log-behavior-when-the-log-file-reaches-its-maximum
    title: "Ensure 'Application: Control Event Log max size behavior' is disabled"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      windows.eventlog(name: "Application").overwriteAsNeeded == true
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the Application event log keeps recording when it reaches its maximum size, overwriting the oldest events rather than stopping.

        The check reads the overwrite behavior of the Application log, which must be set to overwrite events as needed.

        **Why this matters**

        The alternative to overwriting is that logging stops. When the log is configured to archive or to refuse overwriting, a full log means new events are simply not recorded until an administrator intervenes, and nothing prominent announces that this has happened.

        That failure mode is worse than losing old events, because it is silent and it is triggerable. An attacker who wants to stop being recorded does not need to touch the logging configuration; they only need to generate enough events to fill the log, which failed logon attempts alone will do. Everything they do afterward is unlogged, on a system that appears to be logging normally.

        The Application log matters here because application crashes and failures are frequently the first visible symptom of exploitation, and they are recorded nowhere else.

        Overwriting keeps the log continuously recording. Retention is then a question of sizing the log adequately, which a companion check covers, and forwarding events to a collector so that history survives beyond what the local file holds.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\EventLog\Application`.
        3. Inspect the `Retention` value.

        The system passes when `Retention` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Application' -Name 'Retention'
           ```

        The system passes when `Retention` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Event Log Service\\Application\\Control Event Log behavior when the log file reaches its maximum size
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `EventLog.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was initially named _Retain old events_, but it was renamed starting with the Windows 8.0 & Server 2012 (non-R2) Administrative Templates.

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Application'
            $Name         = 'Retention'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Control Application Event Log behavior at max size
              hosts: windows
              tasks:
                - name: Set Retention to 0 (Disabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Policies\Microsoft\Windows\EventLog\Application
                    name: Retention
                    data: "0"
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `Retention` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\Software\Policies\Microsoft\Windows\EventLog\Application' do
              values [{
                name: 'Retention',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-application-specify-the-maximum-log-file-size-kb-is-set-to-enabled-32768
    title: "Ensure Application log file size is set to 32,768 KB or greater"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      windows.eventlog(name: "Application").maxSizeKB >= 32768
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the Application event log is large enough to hold a useful amount of history.

        The check reads the maximum size of the Application log, which must be at least 32,768 KB, or 32 MB.

        **Why this matters**

        Log size determines how far back an investigation can see. The Windows default is small enough that a busy server overwrites a day or less, and intrusions are typically discovered weeks after they begin.

        The Application log holds the record of applications crashing and failing. That matters for security because exploitation attempts that do not succeed still produce crashes, so a pattern of faults in a network-facing service is frequently the first evidence that someone is working on it. Those events are the ones an attacker's unsuccessful attempts generate, and they are lost first when the log is undersized.

        A small log is also trivially flushed. An attacker who wants recent history gone can generate enough application events to roll the window past whatever they did.

        32 MB is a floor rather than a target. Size the log to the machine's actual event rate, and forward events to a central collector so that retention does not depend on local disk at all.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\EventLog\Application`.
        3. Inspect the `MaxSize` value.

        The system passes when `MaxSize` is `32768` or greater. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Application' -Name 'MaxSize'
           ```

        The system passes when `MaxSize` is `32768` or greater. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: 32,768 or greater`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Event Log Service\\Application\\Specify the maximum log file size (KB)
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `EventLog.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was initially named _Maximum Log Size (KB)_, but it was renamed starting with the Windows 8.0 & Server 2012 (non-R2) Administrative Templates.

            **Impact:**

            When event logs fill to capacity, they will stop recording information unless the retention method for each is set so that the computer will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent data, you can configure the retention method so that older events are overwritten as needed.

            The consequence of this configuration is that older events will be removed from the logs. Attackers can take advantage of such a configuration, because they can generate a large number of extraneous events to overwrite any evidence of their attack. These risks can be somewhat reduced if you automate the archival and backup of event log data.

            Ideally, all specifically monitored events should be sent to a server that uses Microsoft System Center Operations Manager (SCOM) or some other automated monitoring tool. Such a configuration is particularly important because an attacker who successfully compromises a server could clear the Security log. If all events are sent to a monitoring server, then you will be able to gather forensic information about the attacker's activities.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Application'
            $Name         = 'MaxSize'
            $Value        = '32768'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set Application Event Log maximum size
              hosts: windows
              tasks:
                - name: Set MaxSize to 32768 KB or greater
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Policies\Microsoft\Windows\EventLog\Application
                    name: MaxSize
                    data: 32768
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `MaxSize` registry value that backs this policy to `32768`:

            ```ruby
            registry_key 'HKLM\Software\Policies\Microsoft\Windows\EventLog\Application' do
              values [{
                name: 'MaxSize',
                type: :dword,
                data: 32768,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-apply-uac-restrictions-to-local-accounts-on-network-logons-is-set-to-enabled
    title: Ensure UAC restrictions apply to local accounts on network logons
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-2
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-5
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-3-1
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: 'LocalAccountTokenFilterPolicy' ).data == 0
    docs:
      refs:
        - url: https://www.microsoft.com/en-us/download/details.aspx?id=36036
          title: Mitigating Pass-the-Hash (PtH) and Other Credential Theft Attacks
      desc: |-
        This check verifies that User Account Control restrictions apply to local accounts authenticating over the network.

        The check reads `LocalAccountTokenFilterPolicy` under `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System`, which must be `0`, meaning the restriction is in force.

        **Why this matters**

        This setting is the main obstacle to lateral movement using local administrator accounts.

        Local accounts frequently share a password across many machines, because they were built from a common image or provisioned by the same process. An attacker who recovers one local administrator hash therefore holds a credential that works on every machine sharing it, and pass-the-hash requires no knowledge of the password itself.

        With the restriction in force, a local account authenticating over the network receives a filtered token without administrative rights. The credential still authenticates, but it cannot be used to administer the remote machine, which breaks the chain between recovering one hash and taking control of everything that shares it.

        The domain administrator path is unaffected, so this does not interfere with legitimate centralized administration. Only local accounts arriving over the network are filtered.

        Note that the built-in Administrator account with the well-known relative identifier 500 is exempt from filtering by default, which is a strong reason to keep it disabled and to deploy the Local Administrator Password Solution so that local passwords differ per machine.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System`.
        3. Inspect the `LocalAccountTokenFilterPolicy` value.

        The system passes when `LocalAccountTokenFilterPolicy` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'LocalAccountTokenFilterPolicy'
           ```

        The system passes when `LocalAccountTokenFilterPolicy` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\MS Security Guide\\Apply UAC restrictions to local accounts on network logons
            ```

            **Note:**
            This Group Policy path does not exist by default. An additional Group Policy template ( `SecGuide.admx/adml` ) is required - it is available from Microsoft at
            [this link](https://techcommunity.microsoft.com/t5/Microsoft-Security-Baselines/Security-baseline-FINAL-for-Windows-10-v1903-and-Windows-Server/ba-p/701084).

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
            $Name         = 'LocalAccountTokenFilterPolicy'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Apply UAC restrictions to local accounts on network logons
              hosts: windows
              tasks:
                - name: Set LocalAccountTokenFilterPolicy to 0 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
                    name: LocalAccountTokenFilterPolicy
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `LocalAccountTokenFilterPolicy` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' do
              values [{
                name: 'LocalAccountTokenFilterPolicy',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-audit-account-lockout-is-set-to-include-failure
    title: Ensure 'Audit Account Lockout' is set to include 'Failure'
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    filters: |
      asset.platform == "windows"
    mql: |
      windows.auditPolicy.subcategory(name: "Account Lockout").failure
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the **Account Lockout** audit subcategory is set to **Failure**.

        The subcategory records logon attempts that were refused because the account is locked out. The check reads the effective audit policy for the subcategory.

        Events recorded include 4625 with a lockout status, and 4740 recording the lockout itself.

        **Why this matters**

        A lockout means someone already exhausted the account's failed-attempt threshold. These events are the direct evidence of password guessing against a named account, and because they fire after the lockout rather than during the attempts, each one represents an attack that already ran to completion.

        The pattern matters more than any single event. A handful of lockouts spread across many accounts within a short window is password spraying, where an attacker tries one common password against every account rather than many passwords against one, specifically to stay under per-account thresholds. That signature is invisible in any other log.

        Lockouts are also a denial of service in their own right. An attacker who knows valid usernames can lock out an entire department deliberately, and without these events the help desk sees a wave of unexplained lockouts with no way to tell an attack from a misconfigured service account.
      audit: |
        ### Audit via the Group Policy editor

        1. Press **Windows + R**, type `gpedit.msc`, and press **Enter**.
        2. Navigate to **Computer Configuration** > **Windows Settings** > **Security Settings** > **Advanced Audit Policy Configuration** > **Audit Policies**.
        3. Locate the **Account Lockout** subcategory and review its configured value.

        The system passes when **Account Lockout** is configured to at least **Failure**. It fails if it is set differently or left unconfigured.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Display the effective setting for the subcategory:

           ```cmd
           auditpol /get /subcategory:{0CCE9217-69AE-11D9-BED3-505054503030}
           ```

        The system passes when the reported setting includes at least **Failure**. It fails if it does not.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to include `Failure`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Advanced Audit Policy Configuration\\Audit Policies\\Logon/Logoff\\Audit Account Lockout
            ```

            **Impact:**

            If no audit settings are configured, or if audit settings are too lax on the computers in your organization, security incidents might not be detected or not enough evidence will be available for network forensic analysis after security incidents occur. However, if audit settings are too severe, critically important entries in the Security log may be obscured by all of the meaningless entries and computer performance and the available amount of data storage may be seriously affected. Companies that operate in certain regulated industries may have legal obligations to log certain events or activities.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            Auditpol /set /subcategory:"{0CCE9217-69AE-11D9-BED3-505054503030}" /success:disable /failure:enable
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Configure the audit policy using the `auditpol` command.

            ```yaml
            - name: Set Audit Account Lockout policy
              hosts: windows
              tasks:
                - name: Set audit policy via auditpol
                  ansible.windows.win_command:
                    cmd: >-
                      Auditpol /set /subcategory:"{0CCE9217-69AE-11D9-BED3-505054503030}"
                      /success:disable /failure:enable
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to audit failure events for the `Account Lockout` subcategory:

            ```ruby
            windows_audit_policy 'Audit Account Lockout' do
              subcategory 'Account Lockout'
              success false
              failure true
              action :set
            end
            ```
