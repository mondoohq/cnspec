    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the **Detailed File Share** audit subcategory is set to **Failure**.

        The subcategory records access attempts against individual files and folders within a network share. The related File Share subcategory records access to the share itself; this one records what happened inside it. The check reads the effective audit policy for the subcategory.

        Events recorded include 5145 for a detailed network share object access check.

        **Why this matters**

        Failure events here are an enumeration signal. An attacker who has reached a share walks it looking for anything readable, and most of what they touch is denied. That produces a burst of failures from one account against many paths in a short time, which is a pattern no legitimate user generates.

        Recording only failures is deliberate. Success events for every file access on a file server would be enormous, to the point of harming the system and burying everything else. The failures are comparatively rare and carry most of the detection value.

        The events name the specific object and the account, so they also answer what an intruder was looking for, which frequently tells an investigator what they were after and whether they found it elsewhere.
      audit: |
        ### Audit via the Group Policy editor

        1. Press **Windows + R**, type `gpedit.msc`, and press **Enter**.
        2. Navigate to **Computer Configuration** > **Windows Settings** > **Security Settings** > **Advanced Audit Policy Configuration** > **Audit Policies**.
        3. Locate the **Detailed File Share** subcategory and review its configured value.

        The system passes when **Detailed File Share** is configured to at least **Failure**. It fails if it is set differently or left unconfigured.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Display the effective setting for the subcategory:

           ```cmd
           auditpol /get /subcategory:{0CCE9244-69AE-11D9-BED3-505054503030}
           ```

        The system passes when the reported setting includes at least **Failure**. It fails if it does not.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

