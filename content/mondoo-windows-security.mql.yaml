  - uid: mondoo-windows-security-configure-smb-v1-client-driver-is-set-to-enabled-disable-driver-recommended
    title: "Ensure SMB v1 client driver is disabled"
    impact: 100
    # Applicability stays in `filters` — it is the mechanism built for it, and it
    # keeps the previous reporting exactly: a host with no SMB v1 client driver is
    # not-applicable and is not reported at all (an `if` guard in the query would
    # instead surface it as "skipped"). What changed is only the COST: the previous
    # filter was `windows.optionalFeatures.where(name == "SMB1Protocol")...`, which
    # forced `Get-WindowsOptionalFeature -Online -FeatureName *` — a DISM image
    # enumeration — on EVERY asset just to decide this cheap registry read applies.
    # This reads the same key the check reads. The guard cannot simply be dropped:
    # a missing property yields `data = null`, and `null == 4` evaluates to false,
    # so an unguarded check would report a FALSE failure wherever SMB v1 was never
    # installed.
    #
    # The two conditions are joined with `&&`, NOT written on separate lines: each
    # statement in a filter block compiles to its own entrypoint (mqlc.go), so
    # newline-separated conditions are resolved independently and the platform check
    # would NOT gate the registry read.
    filters: |
      asset.family.contains('windows') && registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\mrxsmb10', name: 'Start' ).exists
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\mrxsmb10', name: 'Start' ).data == 4
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-security
          title: SMB Security Enhancements
      desc: |-
        This check verifies that the SMBv1 client driver is disabled, so the machine cannot connect outbound using SMB version 1.

        `mrxsmb10` is the driver that implements SMBv1 on the client side. The check reads its `Start` value under `HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10`, which must be `4`, meaning the driver is disabled and will not load.

        **Why this matters**

        SMBv1 is a protocol from 1983 that Microsoft has formally deprecated and removed from default installations. It has no support for the encryption, pre-authentication integrity, or secure dialect negotiation that later versions provide.

        The client side matters as much as the server side, and it is the half more often overlooked. A client willing to speak SMBv1 can be downgraded to it: an attacker positioned on the network answers a connection attempt by negotiating version 1, and the session proceeds without integrity protection, at which point the traffic can be read and modified and the authentication exchange harvested for relay.

        SMBv1 also carries the vulnerability class that produced EternalBlue, and the worms built on it caused some of the most damaging incidents on record. Those spread client to server, so any machine still able to speak the protocol extends the reachable surface.

        Confirm nothing depends on SMBv1 before disabling it. The usual dependencies are appliances such as older network scanners and storage devices, and legacy line-of-business applications.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\mrxsmb10`.
        3. Inspect the `Start` value.

        The system passes when `Start` is set to `4`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10' -Name 'Start'
           ```

        The system passes when `Start` is set to `4`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: Disable driver (recommended)`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\MS Security Guide\\Configure SMB v1 client driver
            ```

            **Note:**
            This Group Policy path does not exist by default. An additional Group Policy template ( `SecGuide.admx/adml` ) is required - it is available from Microsoft at [this link](https://techcommunity.microsoft.com/t5/Microsoft-Security-Baselines/Security-baseline-FINAL-for-Windows-10-v1903-and-Windows-Server/ba-p/701084)

            **Impact:**

            Some legacy OSes such as Windows XP and Server 2003, along with older applications and appliances, may no longer be able to communicate with the system once SMBv1 is disabled. We recommend careful testing be performed to determine the impact prior to configuring this as a widespread control, and where possible, remediate any incompatibilities found with the vendor of the incompatible system. Microsoft is also maintaining a thorough (although not comprehensive) list of known SMBv1 incompatibilities at this link: [SMB1 Product Clearinghouse \| Storage at Microsoft](https://blogs.technet.microsoft.com/filecab/2017/06/01/smb1-product-clearinghouse/)
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10'
            $Name         = 'Start'
            $Value        = '4'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable SMB v1 client driver
              hosts: windows
              tasks:
                - name: Set mrxsmb10 Start to 4 (Disable driver)
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10
                    name: Start
                    data: 4
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            This setting takes effect after the next restart. Use this Chef Infra recipe code to set the `Start` registry value that backs this policy to `4`:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10' do
              values [{
                name: 'Start',
                type: :dword,
                data: 4,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-configure-smb-v1-server-is-set-to-disabled
    title: Ensure 'Configure SMB v1 server' is set to 'Disabled'
    impact: 100
    # Same rationale as the SMB v1 client-driver check above: the guard stays in
    # `filters` (preserving not-applicable reporting) but reads the key the check
    # already reads instead of running a DISM enumeration on every asset. Keeping a
    # guard at all matters here: an absent `SMB1` value does not by itself prove the
    # SMB v1 server is off, so not-applicable is more honest than a blanket pass.
    # `&&` rather than separate lines: filter statements compile to independent
    # entrypoints, so a newline-separated platform check would not gate the registry read.
    filters: |
      asset.family.contains('windows') && registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: 'SMB1' ).exists
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
