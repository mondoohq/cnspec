  - uid: mondoo-windows-security-security-control-event-log-behavior-when-the-log-file-reaches-its-maximum-size
    title: "Ensure 'Security: Control Event Log max size behavior' is disabled"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      windows.eventlog(name: "Security").overwriteAsNeeded == true
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the Security event log keeps recording when it reaches its maximum size, overwriting the oldest events rather than stopping.

        The check reads the overwrite behavior of the Security log, which must be set to overwrite events as needed.

        **Why this matters**

        The alternative to overwriting is that logging stops. When the log is configured to archive or to refuse overwriting, a full log means new events are simply not recorded until an administrator intervenes, and nothing prominent announces that this has happened.

        That failure mode is worse than losing old events, because it is silent and it is triggerable. An attacker who wants to stop being recorded does not need to touch the logging configuration; they only need to generate enough events to fill the log, which failed logon attempts alone will do. Everything they do afterward is unlogged, on a system that appears to be logging normally.

        The Security log is the one that matters most, since it holds the logon, privilege, and account management events that every investigation depends on. It is also the easiest to fill deliberately, because unauthenticated logon failures are recorded here.

        Overwriting keeps the log continuously recording. Retention is then a question of sizing the log adequately, which a companion check covers, and forwarding events to a collector so that history survives beyond what the local file holds.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\EventLog\Security`.
        3. Inspect the `Retention` value.

        The system passes when `Retention` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Security' -Name 'Retention'
           ```

        The system passes when `Retention` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Event Log Service\\Security\\Control Event Log behavior when the log file reaches its maximum size
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `EventLog.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was initially named _Retain old events_, but it was renamed starting with the Windows 8.0 & Server 2012 (non-R2) Administrative Templates.

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Security'
            $Name         = 'Retention'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set Security Event Log max size behavior
              hosts: windows
              tasks:
                - name: Set Retention to 0
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Policies\Microsoft\Windows\EventLog\Security
                    name: Retention
                    data: "0"
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `Retention` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\Software\Policies\Microsoft\Windows\EventLog\Security' do
              values [{
                name: 'Retention',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
