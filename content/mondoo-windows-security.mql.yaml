      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-6
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc6-8-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      windows.rdp.secureRpcRequired
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that the Remote Desktop service requires secure RPC for its management interface.

        The check reads the Remote Desktop secure RPC setting, which must be enabled.

        **Why this matters**

        Remote Desktop exposes an RPC interface used to query and manage sessions. Requiring secure RPC means every call to that interface must be encrypted and the caller authenticated.

        Without it the interface accepts unsecured requests. The information available through it is exactly what an attacker wants when planning lateral movement: which sessions exist on the machine, which accounts own them, and which are currently disconnected. A disconnected session belonging to an administrator is a specific and valuable target, since reconnecting to it inherits that administrator's context.

        Unencrypted RPC also means the contents of those exchanges can be read by anyone on the network path, and unauthenticated calls cannot be attributed to anyone in the logs.

        Requiring secure RPC ensures the management interface has the same protection as the session traffic itself. Every supported Windows client supports it, so the compatibility cost is limited to genuinely obsolete systems.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `fEncryptRPCTraffic` value.

        The system passes when `fEncryptRPCTraffic` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fEncryptRPCTraffic'
           ```

        The system passes when `fEncryptRPCTraffic` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Security\\Require secure RPC communication
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Impact:**

            Remote Desktop Services accepts requests from RPC clients that support secure requests, and does not allow unsecured communication with untrusted clients.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'fEncryptRPCTraffic'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```yaml
