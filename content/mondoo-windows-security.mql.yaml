      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa', name: 'restrictremotesam' ).data == 'O:BAG:BAD:(A;;RC;;;BA)'
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that only Administrators may query the Security Accounts Manager remotely.

        The check reads `restrictremotesam` under `HKLM\SYSTEM\CurrentControlSet\Control\Lsa`, which must be the security descriptor `O:BAG:BAD:(A;;RC;;;BA)`, granting read access to the built-in Administrators group alone.

        **Why this matters**

        Remote SAM queries answer the question "who are the local administrators on that machine", for any machine, from anywhere on the network, using any valid account.

        That single capability is what makes large-scale lateral movement planning possible. Attack tooling queries every machine in the domain, builds a graph of which accounts administer which hosts, and identifies the shortest path from a compromised workstation to a domain administrator. The queries are ordinary directory traffic and typically pass unnoticed, and the resulting map turns a blind search into a targeted route.

        Restricting the calls to Administrators removes that capability from every unprivileged account. An attacker with a foothold on a workstation can no longer survey the estate without first escalating, which forces them into noisier actions earlier.

        Note that some legitimate tools query SAM remotely, including certain security and inventory products. Where one is in use, add its service account to the security descriptor rather than leaving the interface open to every authenticated user. This setting requires Windows 10 1607 or Server 2016 and above.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa`.
        3. Inspect the `restrictremotesam` value.

        The system passes when `restrictremotesam` is set to `O:BAG:BAD:(A;;RC;;;BA)`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'restrictremotesam'
           ```

        The system passes when `restrictremotesam` is set to `O:BAG:BAD:(A;;RC;;;BA)`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Administrators: Remote Access: Allow`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Restrict clients allowed to make remote calls to SAM
            ```

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            The SDDL `O:BAG:BAD:(A;;RC;;;BA)` grants remote SAM read access only to the local Administrators group and denies it to everyone else. If you run Microsoft Defender for Identity, add its service account to this SDDL before you apply the change, otherwise its lateral-movement detection loses the remote SAM visibility it depends on.

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
            $Name         = 'restrictremotesam'
            $Value        = 'O:BAG:BAD:(A;;RC;;;BA)'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType String -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            The SDDL `O:BAG:BAD:(A;;RC;;;BA)` grants remote SAM read access only to the local Administrators group and denies it to everyone else. If you run Microsoft Defender for Identity, add its service account to this SDDL before you apply the change, otherwise its lateral-movement detection loses the remote SAM visibility it depends on.

            ```yaml
            - name: Restrict remote calls to SAM to Administrators
              hosts: windows
              tasks:
                - name: Set restrictremotesam to allow only Administrators
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
                    name: restrictremotesam
                    data: "O:BAG:BAD:(A;;RC;;;BA)"
                    type: string
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `restrictremotesam` registry value that backs this policy to `O:BAG:BAD:(A;;RC;;;BA)`:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'restrictremotesam',
                type: :string,
                data: 'O:BAG:BAD:(A;;RC;;;BA)',
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-shares-that-can-be-accessed-anonymously-is-set-to-none
    title: "Ensure no shares can be accessed anonymously"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters', name: 'NullSessionShares' ).data == empty
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that no share is configured for anonymous access.

        The check reads `NullSessionShares` under `HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters`, which must be empty.

        **Why this matters**

        A share listed here is readable by a connection that has presented no credentials. Every access control decision inside that share is then made for an anonymous caller, which is not what any permission on its contents was written to anticipate.

        The exposure is difficult to notice afterward, because the share's own permissions look correct. Someone reviewing the access control list sees the groups that were granted access and no indication that an unauthenticated path exists alongside them.

        Anonymous shares also provide an attacker with a foothold that requires no credentials at all. Reading is the immediate concern, but where the share is writable the position is considerably worse, since files placed there may be executed by whatever process consumes them.

        The correct value is empty. Where an application genuinely requires anonymous access to a specific share, list that single share, confirm its contents are appropriate for unauthenticated readers, and revisit it when the application is next updated.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters`.
        3. Inspect the `NullSessionShares` value.

        The system passes when `NullSessionShares` lists no shares, and also when the value is absent, because an absent value grants no anonymous access. It fails when any share is listed.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters' -Name 'NullSessionShares'
           ```

        The system passes when `NullSessionShares` lists no shares, and also when the value is absent, because an absent value grants no anonymous access. It fails when any share is listed.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `<blank>`, which represents None:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Shares that can be accessed anonymously
            ```

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
            $Name         = 'NullSessionShares'
            $Value        = @()

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType MultiString -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Clear shares that can be accessed anonymously
              hosts: windows
              tasks:
                - name: Set NullSessionShares to empty
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
                    name: NullSessionShares
                    data: []
                    type: multistring
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to clear the list of shares that can be reached without authentication:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters' do
              values [{
                name: 'NullSessionShares',
                type: :multi_string,
                data: [],
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-sharing-and-security-model-for-local-accounts-is-set-to-classic
    title: "Ensure local accounts use Classic sharing and security model"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'ForceGuest' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that network logons using local accounts authenticate as themselves rather than being mapped to Guest.

        The check reads `ForceGuest` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `0`, selecting the Classic model.

        **Why this matters**

        Under the Guest-only model, every network logon that presents a local account is treated as the Guest account regardless of which account was supplied and whether the password was correct.

        That destroys two things at once. Access control stops working as intended, because a resource granted to a specific local account is reached by anyone, while a resource denied to Guest is unreachable by the account that was supposed to have it. And accountability disappears entirely, since every remote action is attributed to Guest and the logs cannot distinguish one connection from another.

        The security posture depends heavily on the Guest account being disabled, which makes an unrelated setting load-bearing for all local-account network access in a way nobody would expect from reading either one.

        The Classic model authenticates each account as itself, so permissions apply as written and the logs name the account that connected. It is the correct choice on any system where local accounts are used for network access.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `ForceGuest` value.

        The system passes when `ForceGuest` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'ForceGuest'
           ```

        The system passes when `ForceGuest` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Classic - local users authenticate as themselves`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Sharing and security model for local accounts
            ```

            **Impact:**

            None - this is the default configuration for domain-joined computers.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'ForceGuest'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set network access sharing model to Classic
              hosts: windows
              tasks:
                - name: Set ForceGuest to 0 (Classic)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: ForceGuest
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `ForceGuest` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'ForceGuest',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-security-allow-local-system-to-use-computer-identity-for-ntlm
    title: "Ensure Local System uses computer identity for NTLM"
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'UseMachineId' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that services running as Local System authenticate to remote resources using the computer's own identity rather than anonymously.

        The check reads `UseMachineId` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `1`.

        **Why this matters**

        When a Local System service connects to another machine and NTLM is used, it needs an identity to present. Without this setting it presents none, and the connection is anonymous.

        That produces failures that are hard to diagnose and workarounds that are worse than the problem. The remote resource refuses an anonymous caller, the service breaks, and the resolution frequently chosen is to loosen anonymous access on the remote machine, which is precisely the exposure the network access settings in this policy exist to close.

        Using the computer account instead gives the connection a real, authenticated identity. That identity can be granted permissions specifically, appears in the remote machine's security log so the access is attributable, and can be removed if the machine is decommissioned or compromised.

        It is also the difference between an access path that can be reasoned about and one that cannot. Anonymous connections are indistinguishable from one another; a computer account names the source.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `UseMachineId` value.

        The system passes when `UseMachineId` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'UseMachineId'
           ```

        The system passes when `UseMachineId` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Allow Local System to use computer identity for NTLM
            ```

            **Impact:**

            Services running as Local System that use Negotiate when reverting to NTLM authentication will use the computer identity. This might cause some authentication requests between Windows operating systems to fail and log an error.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'UseMachineId'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Allow Local System to use computer identity for NTLM
              hosts: windows
              tasks:
                - name: Set UseMachineId to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: UseMachineId
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `UseMachineId` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'UseMachineId',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-security-allow-localsystem-null-session-fallback-is-set-to-disabled
    title: "Ensure LocalSystem NULL session fallback is disabled"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\MSV1_0', name: 'AllowNullSessionFallback' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that NTLM authentication for Local System cannot fall back to a null session.

        The check reads `AllowNullSessionFallback` under `HKLM\System\CurrentControlSet\Control\Lsa\MSV1_0`, which must be `0`.

        **Why this matters**

        A fallback is a security decision made automatically at the moment something goes wrong, and this one falls back to no authentication at all.

        When it is permitted, a Local System service whose NTLM authentication does not complete continues as an anonymous null session rather than failing. The session that results has no identity, so it cannot be attributed in any log, and it carries none of the session security that NTLMv2 provides, meaning the traffic has neither signing nor sealing and can be read and modified by anyone on the path.

        The dangerous property is that this happens silently. From the application's perspective the connection worked, so nothing reports that a protected session was replaced by an unprotected anonymous one, and an attacker who can induce the authentication failure gets to choose when it happens.

        Disabling the fallback means authentication either succeeds properly or fails visibly, which is the correct behavior for a security decision that would otherwise be made by default in the attacker's favor.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\MSV1_0`.
        3. Inspect the `AllowNullSessionFallback` value.

        The system passes when `AllowNullSessionFallback` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa\MSV1_0' -Name 'AllowNullSessionFallback'
           ```

        The system passes when `AllowNullSessionFallback` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Allow LocalSystem NULL session fallback
            ```

            **Impact:**

            None - this is the default behavior. Any applications that require NULL sessions for LocalSystem will not work as designed.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa\MSV1_0'
            $Name         = 'AllowNullSessionFallback'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Ensure LocalSystem NULL session fallback is disabled
              hosts: windows
              tasks:
                - name: Set AllowNullSessionFallback to 0
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa\MSV1_0
                    name: AllowNullSessionFallback
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `AllowNullSessionFallback` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa\MSV1_0' do
              values [{
                name: 'AllowNullSessionFallback',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
