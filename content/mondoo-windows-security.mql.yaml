  - uid: mondoo-windows-security-turn-off-multicast-name-resolution-is-set-to-enabled
    title: Ensure 'Turn off multicast name resolution' is set to 'Enabled'
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient', name: 'EnableMulticast' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |
        This check verifies that Link-Local Multicast Name Resolution is turned off.

        LLMNR is the fallback Windows uses when DNS cannot resolve a name: it asks every machine on the local segment whether the name belongs to them. The check reads `EnableMulticast` under `HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient`, which must be `0`.

        **Why this matters**

        LLMNR has no authentication. A machine that asks the network to resolve a name accepts the first reply it receives, from whoever sends it.

        That makes it the most productive credential harvesting technique on internal networks. An attacker runs a listener that answers every LLMNR query in the affirmative. Windows generates these queries constantly, from mistyped share names, from stale drive mappings, from proxy autodiscovery, and from applications looking for hosts that no longer exist. Each one that the attacker answers causes the client to connect and attempt NTLM authentication, delivering a challenge and response that can be cracked offline or relayed directly to another machine.

        The attacker needs no credentials, no vulnerability, and no prior foothold beyond a network connection, and the technique typically yields credentials within minutes on a network of any size.

        Disable LLMNR alongside setting NetBIOS to P-node, since the two protocols provide the same attack through different channels and turning off only one leaves the path open.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient`.
        3. Inspect the `EnableMulticast` value.

        The system passes when `EnableMulticast` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name 'EnableMulticast'
           ```

        The system passes when `EnableMulticast` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Network\\DNS Client\\Turn off multicast name resolution
            ```

            **Note:**
            This Group Policy path may not exist by default. It is provided by the Group Policy template `DnsClient.admx/adml`
            that is included with the Microsoft Windows 8.0 & Server 2012 (non-R2) Administrative Templates (or newer).

            **Impact:**

            In the event DNS is unavailable a system will be unable to request it from other systems on the same subnet.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
            $Name         = 'EnableMulticast'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable multicast name resolution
              hosts: windows
              tasks:
                - name: Set EnableMulticast to 0
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
                    name: EnableMulticast
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `EnableMulticast` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' do
              values [{
                name: 'EnableMulticast',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-wdigest-authentication-is-set-to-disabled
    title: Ensure 'WDigest Authentication' is set to 'Disabled'
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest', name: 'UseLogonCredential' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/
          title: Windows Security Documentation
      desc: |-
        This check verifies that WDigest authentication does not keep plaintext credentials in memory.

        The check reads `UseLogonCredential` under `HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest`, which must be `0`.

        **Why this matters**

        WDigest is a legacy authentication protocol that requires the user's actual password rather than a hash. To support it, Windows kept a plaintext copy of every logged-on user's password in LSASS memory.

        The consequence is direct. An attacker who reaches LSASS on a machine with this enabled does not obtain hashes to crack; they obtain passwords. Every account that has logged on since the machine booted is exposed in cleartext, which includes any administrator who connected to troubleshoot something, and a plaintext password works everywhere immediately, including on systems where hash-based attacks would not.

        This single setting is the difference between a compromised server yielding material that must be cracked and one yielding a working credential set.

        Modern Windows disables the plaintext caching by default, but the value is explicitly re-enabled by some legacy applications and by attackers themselves, who set it and wait for the next administrator logon to harvest a password. That is why verifying it is set to `0` matters even on current operating systems.

        Nothing in a modern environment requires WDigest. Pair this with LSA protection to make the memory harder to reach in the first place.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest`.
        3. Inspect the `UseLogonCredential` value.

        The system passes when `UseLogonCredential` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' -Name 'UseLogonCredential'
           ```

        The system passes when `UseLogonCredential` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\MS Security Guide\\WDigest Authentication (disabling may require KB2871997)
            ```

            **Note:**
            This Group Policy path does not exist by default. An additional Group Policy template ( `SecGuide.admx/adml` ) is required - it is available from Microsoft at [this link](https://blogs.technet.microsoft.com/secguide/2018/11/20/security-baseline-final-for-windows-10-v1809-and-windows-server-2019/)

            **Impact:**

            None - this is also the default configuration for Windows 8.1 and newer.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
            $Name         = 'UseLogonCredential'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to disable WDigest authentication:

            ```yaml
            ---
            - name: Disable WDigest Authentication
              hosts: windows
              tasks:
                - name: Set WDigest UseLogonCredential to 0 (Disabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest
                    name: UseLogonCredential
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `UseLogonCredential` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' do
              values [{
                name: 'UseLogonCredential',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
