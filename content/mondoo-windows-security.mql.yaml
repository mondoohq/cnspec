      desc: |-
        This check verifies that, when acting as a client, the machine requires NTLMv2 session security and 128-bit encryption for NTLM-authenticated sessions.

        The check reads `NTLMMinClientSec` under `HKLM\System\CurrentControlSet\Control\Lsa\MSV1_0`, which must be `537395200`. That value combines the requirement for NTLMv2 session security with the requirement for 128-bit encryption.

        **Why this matters**

        Session security is negotiated between the two ends, and the result is the weakest option both will accept. That makes the client's minimum as load-bearing as the server's.

        The specific risk on the client side is the downgrade. An attacker who can influence the connection, either by standing on the network path or by inducing the client to connect to a machine they control, offers only weak session security. A client with no minimum accepts it, and the session proceeds without signing or with weak encryption, at which point its contents can be read and modified.

        That position is also what makes relay attacks possible, since an unsigned session is one an attacker can insert themselves into and forward elsewhere.

        Setting the client minimum means the client refuses rather than accommodates. A connection that cannot be protected properly fails visibly instead of continuing in a weakened state that nothing reports.

        Set the matching server value as well; the two together ensure protection regardless of which role the machine is playing.
