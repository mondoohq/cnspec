  - uid: mondoo-windows-security-audit-force-audit-policy-subcategory-settings-windows-vista-or-later-to-override
    title: "Ensure audit policy subcategory settings override category settings"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'SCENoApplyLegacyAuditPolicy' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the advanced audit policy subcategories take precedence over the legacy audit categories.

        Windows carries two audit configuration systems: nine broad legacy categories, and the granular subcategories that every other audit check in this policy configures. Where both are present, one must win. The check reads `SCENoApplyLegacyAuditPolicy` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `1`.

        **Why this matters**

        This is the setting that decides whether the rest of the audit configuration is real.

        With it disabled, a legacy category policy arriving from any Group Policy Object overwrites the subcategory settings wholesale. The granular configuration is replaced by the broad one, which is both far noisier and missing the subcategories that carry the most value, and nothing reports that a replacement occurred.

        The result is the worst kind of failure: an audit policy that reads as correct in the configuration and does not match what the system is recording. An administrator inspecting Group Policy sees the intended subcategories; the machine is running something else. That divergence typically surfaces only during an investigation, at the point where the missing events are needed.

        Setting the override to enabled is a prerequisite for every other audit subcategory check here, not an independent hardening step.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `SCENoApplyLegacyAuditPolicy` value.

        The system passes when `SCENoApplyLegacyAuditPolicy` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'SCENoApplyLegacyAuditPolicy'
           ```

        The system passes when `SCENoApplyLegacyAuditPolicy` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category settings
            ```

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'SCENoApplyLegacyAuditPolicy'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Force audit policy subcategory settings to override
              hosts: windows
              tasks:
                - name: Set SCENoApplyLegacyAuditPolicy to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: SCENoApplyLegacyAuditPolicy
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `SCENoApplyLegacyAuditPolicy` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'SCENoApplyLegacyAuditPolicy',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
