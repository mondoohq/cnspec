  - uid: mondoo-windows-security-setup-control-event-log-behavior-when-the-log-file-reaches-its-maximum-size
    title: "Ensure 'Setup: Control Event Log max size behavior' is disabled"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-9
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      windows.eventlog(name: "Setup").overwriteAsNeeded == true
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the Setup event log keeps recording when it reaches its maximum size, overwriting the oldest events rather than stopping.

        The check reads the overwrite behavior of the Setup log, which must be set to overwrite events as needed.

        **Why this matters**

        The alternative to overwriting is that logging stops. When the log is configured to archive or to refuse overwriting, a full log means new events are simply not recorded until an administrator intervenes, and nothing prominent announces that this has happened.

        That failure mode is worse than losing old events, because it is silent and it is triggerable. An attacker who wants to stop being recorded does not need to touch the logging configuration; they only need to generate enough events to fill the log, which failed logon attempts alone will do. Everything they do afterward is unlogged, on a system that appears to be logging normally.

        The Setup log records servicing and role installation, which is what establishes whether a change to the machine's software was expected.

        Overwriting keeps the log continuously recording. Retention is then a question of sizing the log adequately, which a companion check covers, and forwarding events to a collector so that history survives beyond what the local file holds.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\EventLog\Setup`.
        3. Inspect the `Retention` value.

        The system passes when `Retention` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Setup' -Name 'Retention'
           ```

        The system passes when `Retention` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Event Log Service\\Setup\\Control Event Log behavior when the log file reaches its maximum size
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `EventLog.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was initially named _Retain old events_, but it was renamed starting with the Windows 8.0 & Server 2012 (non-R2) Administrative Templates.

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Setup'
            $Name         = 'Retention'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set Setup Event Log max size behavior
              hosts: windows
              tasks:
                - name: Set Retention to 0
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Policies\Microsoft\Windows\EventLog\Setup
                    name: Retention
                    data: "0"
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `Retention` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\Software\Policies\Microsoft\Windows\EventLog\Setup' do
              values [{
                name: 'Retention',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-setup-specify-the-maximum-log-file-size-kb-is-set-to-enabled-32768
    title: "Ensure Setup log file size is set to 32,768 KB or greater"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      windows.eventlog(name: "Setup").maxSizeKB >= 32768
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the Setup event log is large enough to hold a useful amount of history.

        The check reads the maximum size of the Setup log, which must be at least 32,768 KB, or 32 MB.

        **Why this matters**

        The Setup log records operating system servicing: updates applied, roles and features installed, and the outcome of each.

        Its investigative value is that it establishes what changed on the machine and when. A role or feature appearing that nobody requested is a meaningful finding, since installing a feature is a straightforward way for an attacker to obtain capability that already exists in the operating system rather than bringing a tool that antivirus might recognize.

        It also answers the patching question directly. When an investigation needs to know whether a machine was vulnerable at a given date, this log holds the record of which updates were applied and when they went on.

        Volume here is low, so 32 MB covers a long period on most systems. The cost of the setting is negligible and the record it preserves is one that cannot be reconstructed from anywhere else.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\EventLog\Setup`.
        3. Inspect the `MaxSize` value.

        The system passes when `MaxSize` is `32768` or greater. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Setup' -Name 'MaxSize'
           ```

        The system passes when `MaxSize` is `32768` or greater. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: 32,768 or greater`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Event Log Service\\Setup\\Specify the maximum log file size (KB)
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `EventLog.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was initially named _Maximum Log Size (KB)_, but it was renamed starting with the Windows 8.0 & Server 2012 (non-R2) Administrative Templates.

            **Impact:**

            When event logs fill to capacity, they will stop recording information unless the retention method for each is set so that the computer will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent data, you can configure the retention method so that older events are overwritten as needed.

            The consequence of this configuration is that older events will be removed from the logs. Attackers can take advantage of such a configuration, because they can generate a large number of extraneous events to overwrite any evidence of their attack. These risks can be somewhat reduced if you automate the archival and backup of event log data.

            Ideally, all specifically monitored events should be sent to a server that uses Microsoft System Center Operations Manager (SCOM) or some other automated monitoring tool. Such a configuration is particularly important because an attacker who successfully compromises a server could clear the Security log. If all events are sent to a monitoring server, then you will be able to gather forensic information about the attacker's activities.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Setup'
            $Name         = 'MaxSize'
            $Value        = '32768'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Ensure Setup log file size is set to 32,768 KB or greater
              hosts: windows
              tasks:
                - name: Set MaxSize to 32768 or greater
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Policies\Microsoft\Windows\EventLog\Setup
                    name: MaxSize
                    data: 32768
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `MaxSize` registry value that backs this policy to `32768`:

            ```ruby
            registry_key 'HKLM\Software\Policies\Microsoft\Windows\EventLog\Setup' do
              values [{
                name: 'MaxSize',
                type: :dword,
                data: 32768,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-store-passwords-using-reversible-encryption-is-set-to-disabled
    title: Ensure 'Store passwords using reversible encryption' is set to 'Disabled'
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      secpol.systemaccess['ClearTextPassword'] == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that Windows does not store passwords in a form that can be decrypted back to the original text.

        The check reads the `ClearTextPassword` system access setting, which must be `0`.

        **Why this matters**

        Reversible encryption is storing the password itself. The name describes the property exactly: what is stored can be turned back into the plaintext, and the key required to do so is present on the system.

        That defeats the entire purpose of password hashing. A hash cannot be reversed, so an attacker who obtains one must attack it, which costs time proportional to the password's strength and may not succeed. Reversibly encrypted passwords cost nothing: the attacker obtains the store, decrypts it, and has every password in cleartext regardless of how long or well chosen any of them were.

        Password reuse then extends the damage well past this system, because a plaintext password works everywhere the person used it, immediately and without any cracking effort.

        The setting exists only for legacy authentication protocols such as CHAP and digest authentication in older applications. Any application still requiring it should be replaced, and where one cannot be, the exception should be scoped to the specific accounts it needs rather than applied as a domain-wide policy.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Account Policies** and locate **Store passwords using reversible encryption**.
        3. Review the configured value.

        The system passes when **Store passwords using reversible encryption** is set to `0`. It fails if it is set differently.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the **Store passwords using reversible encryption** setting.

        The system passes when the exported policy shows that **Store passwords using reversible encryption** is set to `0`. It fails if it is set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Store passwords using reversible encryption
            ```

            **Impact:**

            If your organization uses either the CHAP authentication protocol through remote access or IAS services or Digest Authentication in IIS, you must configure this policy setting to Enabled. This setting is extremely dangerous to apply through Group Policy on a user-by-user basis, because it requires the appropriate user account object to be opened in Active Directory Users and Computers.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("ClearTextPassword = \d+", "ClearTextPassword = 0") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use `secedit` to disable storing passwords with reversible encryption.

            ```yaml
            - name: Set reversible encryption policy
              hosts: windows
              tasks:
                - name: Export current security policy
                  ansible.windows.win_command:
                    cmd: secedit /export /cfg C:\Windows\Temp\secpol-export.cfg

                - name: Set ClearTextPassword to 0
                  ansible.windows.win_powershell:
                    script: |
                      (Get-Content C:\Windows\Temp\secpol-export.cfg) -replace 'ClearTextPassword = \d+', 'ClearTextPassword = 0' | Out-File C:\Windows\Temp\secpol-import.cfg -Encoding Unicode

                - name: Import updated security policy
                  ansible.windows.win_command:
                    cmd: >-
                      secedit /configure /db C:\Windows\Temp\secpol-db.sdb
                      /cfg C:\Windows\Temp\secpol-import.cfg

                - name: Force group policy update
                  ansible.windows.win_command:
                    cmd: gpupdate /force

                - name: Clean up temporary files
                  ansible.windows.win_file:
                    path: "{{ item }}"
                    state: absent
                  loop:
                    - C:\Windows\Temp\secpol-export.cfg
                    - C:\Windows\Temp\secpol-import.cfg
                    - C:\Windows\Temp\secpol-db.sdb
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            On a domain member, apply this through the Default Domain Policy GPO instead, because a local change is overwritten when Group Policy refreshes. Use this Chef Infra recipe code to stop passwords being stored with reversible encryption, which is equivalent to storing them in plaintext:

            ```ruby
            windows_security_policy 'ClearTextPassword' do
              secvalue '0'
              action :set
            end
            ```
