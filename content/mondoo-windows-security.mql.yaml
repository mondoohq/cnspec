        This check verifies that the Security event log is large enough to hold a useful amount of history.

        The check reads the maximum size of the Security log, which must be at least 196,608 KB, or 192 MB.

        **Why this matters**

        The Security log is the primary record of who did what on a Windows system. It holds logons and logon failures, privilege use, account and group management, process creation, and every other event the audit policy in this policy configures.

        It is also by far the highest volume of the four logs, which is why its floor is six times the others. Process creation auditing alone generates an event for every program that runs, and sensitive privilege use adds one for every administrative logon. A log sized for the default audit policy will not hold a day of the policy this file configures.

        The consequence of undersizing is silent and specific: the audit settings are all correct, the events are all generated, and the oldest of them are discarded before anyone looks. An investigation then finds the audit policy configured exactly as intended and no records from the period in question.

        192 MB is a floor. Size to the observed event rate and forward to a collector, which is the only way history survives an attacker with administrative access to this machine.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\EventLog\Security`.
        3. Inspect the `MaxSize` value.

        The system passes when `MaxSize` is `196608` or greater. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Security' -Name 'MaxSize'
           ```

        The system passes when `MaxSize` is `196608` or greater. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: 196,608 or greater`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Event Log Service\\Security\\Specify the maximum log file size (KB)
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `EventLog.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was initially named _Maximum Log Size (KB)_, but it was renamed starting with the Windows 8.0 & Server 2012 (non-R2) Administrative Templates.

            **Impact:**

            When event logs fill to capacity, they will stop recording information unless the retention method for each is set so that the computer will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent data, you can configure the retention method so that older events are overwritten as needed.

            The consequence of this configuration is that older events will be removed from the logs. Attackers can take advantage of such a configuration, because they can generate a large number of extraneous events to overwrite any evidence of their attack. These risks can be somewhat reduced if you automate the archival and backup of event log data.

            Ideally, all specifically monitored events should be sent to a server that uses Microsoft System Center Operations Manager (SCOM) or some other automated monitoring tool. Such a configuration is particularly important because an attacker who successfully compromises a server could clear the Security log. If all events are sent to a monitoring server, then you will be able to gather forensic information about the attacker's activities.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\Software\Policies\Microsoft\Windows\EventLog\Security'
            $Name         = 'MaxSize'
            $Value        = '196608'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set Security log file minimum size
              hosts: windows
              tasks:
                - name: Set MaxSize to 196608 or greater
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Policies\Microsoft\Windows\EventLog\Security
                    name: MaxSize
                    data: 196608
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `MaxSize` registry value that backs this policy to `196608`:

            ```ruby
            registry_key 'HKLM\Software\Policies\Microsoft\Windows\EventLog\Security' do
              values [{
                name: 'MaxSize',
                type: :dword,
                data: 196608,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-set-client-connection-encryption-level-is-set-to-enabled-high-level
    title: "Ensure RDP client connection encryption is set to High Level"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      windows.rdp.minEncryptionLevel == 3
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop encrypts session traffic at the high level, using 128-bit encryption in both directions.

        The check reads the Remote Desktop minimum encryption level, which must be `3`, corresponding to High.

        **Why this matters**

        A Remote Desktop session carries the screen, the keyboard, and the clipboard. That means it carries every password typed inside the session, every document displayed, and everything copied between the client and the server.

        Lower encryption levels protect this weakly or asymmetrically. The Low setting encrypts only data sent from the client to the server, leaving everything the server sends back, which is the entire screen, exposed to anyone on the network path. Client Compatible negotiates down to whatever the client offers, which means an attacker who influences the negotiation chooses the weakest option both ends will accept.

        High requires 128-bit encryption in both directions and refuses clients that cannot manage it, so the protection does not depend on the client's preferences or on what an attacker can persuade the connection to agree to.

        Every supported Windows client supports 128-bit encryption. Combine this with the TLS security layer, which authenticates the server, since encryption without authentication still permits an interceptor to be the party you encrypt to.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `MinEncryptionLevel` value.

        The system passes when `MinEncryptionLevel` is set to `3`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'MinEncryptionLevel'
           ```

        The system passes when `MinEncryptionLevel` is set to `3`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: High Level`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Security\\Set client connection encryption level
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'MinEncryptionLevel'
            $Value        = '3'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```yaml
            - name: Ensure RDP client connection encryption is set to High Level
              hosts: windows
              tasks:
                - name: Set MinEncryptionLevel to 3
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
                    name: MinEncryptionLevel
                    data: 3
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `MinEncryptionLevel` registry value that backs this policy to `3`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' do
              values [{
                name: 'MinEncryptionLevel',
                type: :dword,
                data: 3,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-set-time-limit-for-active-but-idle-remote-desktop-services-sessions-is-set
    title: "Ensure idle RDS sessions time out in 15 minutes or less"
    impact: 50
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    filters: asset.family.contains('windows')
    props:
      - uid: mondooWindowsSecurityMaxIdleTime
        title: Maximum idle time for Remote Desktop Services sessions in milliseconds
        mql: |
          900000
    mql: |
      windows.rdp.maxIdleTimeMs <= props.mondooWindowsSecurityMaxIdleTime
      windows.rdp.maxIdleTimeMs != 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop disconnects sessions that have been idle beyond a time limit.

        The check reads the Remote Desktop idle session time limit, which must be set to the value carried by this policy's property and must not be `0`, since zero means no limit.

        **Why this matters**

        An idle Remote Desktop session is an authenticated session with nobody using it. It holds the user's logon token, their open applications, their mapped drives, and their access to everything the account can reach.

        The exposure is on the client side. Anyone who reaches the unattended workstation where the session is displayed has the session, with no authentication step in between and nothing in the logs to distinguish them from the person who opened it. On a shared or public workstation that is a straightforward path to whatever the server holds.

        Idle sessions also accumulate on session hosts and jump servers, consuming licenses and memory until the host degrades.

        Disconnecting on idle ends the exposure without ending the work: applications continue running in the disconnected session and the user reconnects by authenticating again. Pair this with the disconnected session time limit, which decides how long that disconnected session survives before it is logged off entirely.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `MaxIdleTime` value.

        The system passes when `MaxIdleTime` is 900000 milliseconds or less, which is the 15-minute default. It fails if the value is missing or higher.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'MaxIdleTime'
           ```

        The system passes when `MaxIdleTime` is 900000 milliseconds or less, which is the 15-minute default. It fails if the value is missing or higher.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: 15 minutes or less, but not Never (0)`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Session Time Limits\\Set time limit for active but idle Remote Desktop Services sessions
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was named _Set time limit for active but idle Terminal Services sessions_, but it was renamed starting with the Windows 7 & Server 2008 R2 Administrative Templates.

            **Impact:**

            Remote Desktop Services will automatically disconnect active but idle sessions after 15 minutes (or the specified amount of time). The user receives a warning two minutes before the session disconnects, which allows the user to press a key or move the mouse to keep the session active. Note that idle session time limits do not apply to console sessions.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'MaxIdleTime'
            $Value        = '900000'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Ensure idle RDS sessions time out in 15 minutes or less
              hosts: windows
              tasks:
                - name: Set MaxIdleTime to 900000 ms (15 minutes)
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
                    name: MaxIdleTime
                    data: 900000
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `MaxIdleTime` registry value that backs this policy to `900000`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' do
              values [{
                name: 'MaxIdleTime',
                type: :dword,
                data: 900000,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-set-time-limit-for-disconnected-sessions-is-set-to-enabled-1-minute
