  - uid: mondoo-windows-security-audit-shut-down-system-immediately-if-unable-to-log-security-audits
    title: "Ensure 'Audit: Shut down if unable to log audits' is disabled"
    impact: 30
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-log-08
      compliance/dora: dora-art-10
      compliance/hipaa: hipaa-security-ss164-312-b-audit-controls
      compliance/iso-27001-2022: iso-27001-2022-a-8-15
      compliance/nis-2: nis-2-21-2-b
      compliance/nist-csf-1: nist-csf-1-pr-pt-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-04
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-au-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-3-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a09
      compliance/pci-dss-4: pcidss-requirement-10-2-1
      compliance/soc2-2017: soc2-control-cc7-2-1
      compliance/vda-isa-5: vda-isa-5-5-2-4
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\LSA', name: 'CrashOnAuditFail' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the system does not halt when it can no longer write security audit events.

        Windows can be configured to stop the machine outright the moment the security log cannot accept a new event. The check reads `CrashOnAuditFail` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `0`, meaning the behavior is disabled.

        **Why this matters**

        This is the one audit setting in this policy where the secure-sounding option is the wrong one, and it is worth being explicit about why.

        Enabling it means a full security log stops the server. Not degrades it, stops it: the system halts and only an administrator can bring it back, after clearing the log manually. That converts a logging problem into an outage of whatever the machine was running.

        It also hands an attacker a trivial denial of service. Generating audit events is easy, and failed logon attempts alone will do it. Anyone who can reach an authentication endpoint can fill the log deliberately and take the host down, without credentials and without exploiting anything. On a domain controller that reaches well beyond the one machine.

        The availability cost is real and the security benefit is not, since the goal is that audit events are not lost, and that is achieved by sizing the log adequately, retaining rather than overwriting, and forwarding events to a collector. Those controls address the same concern without giving an unauthenticated attacker a switch that turns the server off.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\LSA`.
        3. Inspect the `CrashOnAuditFail` value.

        The system passes when `CrashOnAuditFail` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\LSA' -Name 'CrashOnAuditFail'
           ```

        The system passes when `CrashOnAuditFail` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Audit: Shut down system immediately if unable to log security audits
            ```

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\LSA'
            $Name         = 'CrashOnAuditFail'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable shutdown on audit failure
              hosts: windows
              tasks:
                - name: Set CrashOnAuditFail to 0 (Disabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\LSA
                    name: CrashOnAuditFail
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `CrashOnAuditFail` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\LSA' do
              values [{
                name: 'CrashOnAuditFail',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
