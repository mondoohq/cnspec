      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      windows.rdp.maxDisconnectionTimeMs == 60000
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop ends disconnected sessions after one minute rather than leaving them running.

        The check reads the Remote Desktop disconnected session time limit, which must be 60,000 milliseconds.

        **Why this matters**

        A disconnected session is still a logged-on session. The account's token, its applications, and its access all persist on the server; only the display is gone.

        That makes disconnected sessions a target in their own right. An attacker with any access to the machine can reconnect to a session left by someone else and inherit their context directly, with no password and no authentication event to show for it. A disconnected administrator session is the most valuable thing on a jump host for exactly this reason, and reconnection does not generate the logon event that would normally mark privileged access.

        Sessions reach this state constantly and by accident, since closing the client window disconnects rather than logs off.

        A one minute limit means the session is fully logged off almost immediately, so the window in which it can be hijacked is negligible. The cost is that unsaved work in a disconnected session is lost, which is why the idle limit should disconnect well before anyone walks away, rather than relying on this limit to be generous.
      audit: |
