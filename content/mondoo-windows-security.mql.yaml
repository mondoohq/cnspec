                - name: Set fEncryptRPCTraffic to 1
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services
                    name: fEncryptRPCTraffic
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

