    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop deletes each session's temporary folders when the session ends.

        The check reads the Remote Desktop temporary folder retention setting, which must be configured so that temporary folders are deleted on exit.

        **Why this matters**

        Temporary folders accumulate whatever a session worked with. Documents opened from a share, files extracted from archives, printer spool data, and material written by applications during the session all land there, and much of it is more sensitive than anything the user deliberately saved.

        If the folders persist, that content remains on the server after the session ends. On a multi-user server such as a jump host or a session host, the next person to connect may be able to read what the last person was working on, and an attacker who obtains any session on the machine gets the accumulated residue of everyone who used it before them.

        Retention also grows without bound. Session temporary folders that are never cleaned fill the disk over time, which on a session host means an outage.

        Deleting them at session exit keeps each session's material confined to that session, which is what a per-session temporary folder is for.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `DeleteTempDirsOnExit` value.

        The system passes when `DeleteTempDirsOnExit` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'DeleteTempDirsOnExit'
           ```

        The system passes when `DeleteTempDirsOnExit` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Temporary Folders\\Do not delete temp folders upon exit
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In older Microsoft Windows Administrative Templates, this setting was named _Do not delete temp folder upon exit_, but it was renamed starting with the Windows 8.0 & Server 2012 (non-R2) Administrative Templates.

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'DeleteTempDirsOnExit'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Delete temp folders upon exit for RDP
              hosts: windows
              tasks:
                - name: Set DeleteTempDirsOnExit to 1 (Disabled - delete temp folders)
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
                    name: DeleteTempDirsOnExit
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `DeleteTempDirsOnExit` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' do
              values [{
                name: 'DeleteTempDirsOnExit',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-enable-structured-exception-handling-overwrite-protection-sehop-is-set-to-enabled
    title: Ensure SEHOP is enabled
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ccc-06
      compliance/dora: dora-art-9
      compliance/hipaa: false
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ip-1
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\kernel', name: 'DisableExceptionChainValidation' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/
          title: Windows Security Documentation
      desc: |-
        This check verifies that Structured Exception Handling Overwrite Protection is enabled.

        SEHOP validates the chain of exception handlers before dispatching to one, so a chain that has been tampered with is rejected rather than followed. The check reads `DisableExceptionChainValidation` under `HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel`, which must be `0`, meaning validation is not disabled.

        **Why this matters**

        Structured exception handling keeps a linked list of handler records on the stack. A stack buffer overflow can reach those records, and an attacker who overwrites one points it at code of their choosing. Triggering any exception afterward makes the operating system call that address for them.

        The technique is valuable to an attacker because it sidesteps stack canaries. A canary is checked when a function returns, but exception dispatch does not go through a normal return, so the overwritten handler is invoked before the check ever happens.

        SEHOP closes that by walking the handler chain and confirming it is intact and terminates correctly before dispatching. A chain an attacker has modified fails validation and the process is terminated instead of executing their code.

        The protection is system-wide, requires no application changes, and its cost is negligible. Very old applications that build exception chains in unusual ways can be affected, which is rare enough to handle as a specific exception.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\kernel`.
        3. Inspect the `DisableExceptionChainValidation` value.

        The system passes when `DisableExceptionChainValidation` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel' -Name 'DisableExceptionChainValidation'
           ```

        The system passes when `DisableExceptionChainValidation` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\MS Security Guide\\Enable Structured Exception Handling Overwrite Protection (SEHOP)
            ```

            **Note:**
            This Group Policy path does not exist by default. An additional Group Policy template ( `SecGuide.admx/adml` ) is required - it is available from Microsoft at [this link](https://techcommunity.microsoft.com/t5/Microsoft-Security-Baselines/Security-baseline-FINAL-for-Windows-10-v1903-and-Windows-Server/ba-p/701084)

            More information is available at [How to enable Structured Exception Handling Overwrite Protection (SEHOP) in Windows operating systems](https://support.microsoft.com/en-us/help/956607/how-to-enable-structured-exception-handling-overwrite-protection-sehop)

            **Impact:**

            After you enable SEHOP, existing versions of Cygwin, Skype, and Armadillo-protected applications may not work correctly.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
            $Name         = 'DisableExceptionChainValidation'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Enable SEHOP
              hosts: windows
              tasks:
                - name: Set DisableExceptionChainValidation to 0 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel
                    name: DisableExceptionChainValidation
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            This setting takes effect after the next restart. Use this Chef Infra recipe code to set the `DisableExceptionChainValidation` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel' do
              values [{
                name: 'DisableExceptionChainValidation',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-enforce-password-history-is-set-to-24-or-more-passwords
    title: Ensure 'Enforce password history' is set to '24 or more password(s)'
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      secpol.systemaccess['PasswordHistorySize'] >= 24
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that Windows remembers at least 24 previous passwords and refuses to let an account reuse one.

        The check reads the `PasswordHistorySize` system access setting, which must be `24` or higher.

        **Why this matters**

        Without history, a maximum password age accomplishes nothing. A user required to change their password sets a new one and then changes it straight back, or alternates between two, and the rotation requirement is satisfied while the credential never actually changes.

        That matters most in the case rotation exists for. When a password has been exposed without anyone knowing, the forced change is the only thing that invalidates it, and reuse of the old value hands the attacker their access back.

        The depth of 24 is chosen against the minimum password age rather than arbitrarily. With a minimum age of one day, cycling through 24 entries to return to a favored password takes 24 days, by which point the effort exceeds the convenience. A shallow history is defeated in an afternoon by changing the password repeatedly in one sitting, which is precisely why the two settings are specified together.

        History is enforced on the hash, so a password that differs only in case or by an appended character is a genuinely different entry. Pair it with complexity and length requirements to constrain how predictable that variation can be.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Account Policies** and locate **Enforce password history**.
        3. Review the configured value.

        The system passes when **Enforce password history** is `24` or greater. It fails if it is set differently.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the **Enforce password history** setting.

        The system passes when the exported policy shows that **Enforce password history** is `24` or greater. It fails if it is set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `24 or more password(s)`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Enforce password history
            ```

            **Impact:**

            The major impact of this configuration is that users must create a new password every time they are required to change their old one. If users are required to change their passwords to new unique values, there is an increased risk of users who write their passwords somewhere so that they do not forget them. Another risk is that users may create passwords that change incrementally (for example, password01, password02, and so on) to facilitate memorization but make them easier to guess. Also, an excessively low value for the Minimum password age setting will likely increase administrative overhead, because users who forget their passwords might ask the help desk to reset them frequently.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            On a domain member this account policy is enforced by the Default Domain Policy GPO. A local `secedit` change is overwritten the next time Group Policy refreshes, so make this change in the domain GPO for domain-joined systems. The `Out-File` command writes the import file as Unicode, which `secedit` requires; verify the encoding if you adapt the script.

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("PasswordHistorySize = \d+", "PasswordHistorySize = 24") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Enforce password history of 24 passwords
              hosts: windows
              tasks:
                - name: Set PasswordHistorySize to 24
                  community.windows.win_security_policy:
                    section: System Access
                    key: PasswordHistorySize
                    value: 24
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            On a domain member, apply this through the Default Domain Policy GPO instead, because a local change is overwritten when Group Policy refreshes. Use this Chef Infra recipe code to remember the last 24 passwords so they cannot be reused:

            ```ruby
            windows_security_policy 'PasswordHistorySize' do
              secvalue '24'
              action :set
            end
            ```
  - uid: mondoo-windows-security-maximum-password-age-is-set-to-365-or-fewer-days-but-not-0
    title: Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      secpol.systemaccess['MaximumPasswordAge'] <= 365
      secpol.systemaccess['MaximumPasswordAge'] > 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that passwords expire within a year and that expiry is not switched off.

        The check reads the `MaximumPasswordAge` system access setting, which must be `365` or fewer days and greater than `0`. A value of `0` means passwords never expire.

        **Why this matters**

        The value of routine expiry is bounded, and it is worth being honest about that. Current NIST guidance advises against short rotation periods, because they push users toward predictable variations and toward writing passwords down, and modern practice favors length, screening against breached password lists, and multi-factor authentication instead.

        Where expiry still earns its place is as a backstop for exposure that nobody detected. Credentials leak through reuse on a breached third-party site, through a phishing page, or through a machine that was compromised and cleaned without anyone realizing a password was taken. In each case the credential stays valid indefinitely unless something forces a change.

        That is why the check rejects `0` specifically. Never-expiring passwords on ordinary user accounts mean a credential stolen years ago still works today, and nobody will ever discover that from the account itself.

        A year is a deliberately long ceiling that avoids the behaviors short rotation encourages while still bounding the life of a quietly stolen password. Service accounts that cannot rotate on a schedule should use managed service accounts rather than being exempted.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Account Policies** and locate **Maximum password age**.
        3. Review the configured value.

        The system passes when **Maximum password age** is `365` or less. It fails if it is set differently.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the **Maximum password age** setting.

        The system passes when the exported policy shows that **Maximum password age** is `365` or less. It fails if it is set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `365 or fewer days, but not 0`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Maximum password age
            ```

            **Impact:**

            If the Maximum password age setting is too low, users are required to change their passwords very often. Such a configuration can reduce security in the organization, because users might write their passwords in an insecure location or lose them. If the value for this policy setting is too high, the level of security within an organization is reduced because it allows potential attackers more time in which to discover user passwords or to use compromised accounts.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            On a domain member this account policy is enforced by the Default Domain Policy GPO. A local `secedit` change is overwritten the next time Group Policy refreshes, so make this change in the domain GPO for domain-joined systems. The `Out-File` command writes the import file as Unicode, which `secedit` requires; verify the encoding if you adapt the script.

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("MaximumPasswordAge = -?\d+", "MaximumPasswordAge = 365") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set maximum password age to 365 days
              hosts: windows
              tasks:
                - name: Set MaximumPasswordAge to 365
                  community.windows.win_security_policy:
                    section: System Access
                    key: MaximumPasswordAge
                    value: 365
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            On a domain member, apply this through the Default Domain Policy GPO instead, because a local change is overwritten when Group Policy refreshes. A value of `0` means the password never expires, which fails this check. Use this Chef Infra recipe code to expire passwords after 365 days:

            ```ruby
            windows_security_policy 'MaximumPasswordAge' do
              secvalue '365'
              action :set
            end
            ```
  - uid: mondoo-windows-security-minimum-password-age-is-set-to-1-or-more-days
    title: Ensure 'Minimum password age' is set to '1 or more day(s)'
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      secpol.systemaccess['MinimumPasswordAge'] >= 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that a password must be at least one day old before it can be changed again.

        The check reads the `MinimumPasswordAge` system access setting, which must be `1` or more days.

        **Why this matters**

        This setting exists for one reason: without it, password history can be defeated in a few minutes.

        A user who wants to keep their existing password, when required to change it, simply changes it as many times as the history depth requires and then sets it back to the original. With a history of 24 that is 25 password changes, which takes a couple of minutes in a loop and leaves the account with exactly the credential the rotation was meant to replace.

        A minimum age of one day makes that sequence take 25 days instead, at which point nobody bothers and the history setting does what it was configured to do.

        The two settings are a single control expressed in two places. History alone is trivially bypassed, and minimum age alone constrains nothing.

        The cost is that a user who genuinely wants to change their password twice in a day must ask an administrator, since an administrative reset is not subject to the minimum age. That is a reasonable trade for making password history real.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Account Policies** and locate **Minimum password age**.
        3. Review the configured value.

        The system passes when **Minimum password age** is `1` or greater. It fails if it is set differently.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the **Minimum password age** setting.

        The system passes when the exported policy shows that **Minimum password age** is `1` or greater. It fails if it is set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `1 or more day(s)`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Minimum password age
            ```

            **Impact:**

            If an administrator sets a password for a user but wants that user to change the password when the user first logs on, the administrator must select the User must change password at next logon check box, or the user will not be able to change the password until the next day.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            On a domain member this account policy is enforced by the Default Domain Policy GPO. A local `secedit` change is overwritten the next time Group Policy refreshes, so make this change in the domain GPO for domain-joined systems. The `Out-File` command writes the import file as Unicode, which `secedit` requires; verify the encoding if you adapt the script.

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("MinimumPasswordAge = \d+", "MinimumPasswordAge = 1") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set minimum password age to 1 day
              hosts: windows
              tasks:
                - name: Set MinimumPasswordAge to 1
                  community.windows.win_security_policy:
                    section: System Access
                    key: MinimumPasswordAge
                    value: 1
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            On a domain member, apply this through the Default Domain Policy GPO instead, because a local change is overwritten when Group Policy refreshes. Use this Chef Infra recipe code to stop a password from being changed again within a day, which is what makes the history requirement effective:

            ```ruby
            windows_security_policy 'MinimumPasswordAge' do
              secvalue '1'
              action :set
            end
            ```
  - uid: mondoo-windows-security-minimum-password-length-is-set-to-14-or-more-characters
    title: Ensure 'Minimum password length' is set to '14 or more character(s)'
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    filters: asset.family.contains('windows')
    props:
      - uid: mondooWindowsSecurityMinimumPasswordLength
        title: Define the minimum password length
        mql: |
          14
    mql: |
      secpol.systemaccess['MinimumPasswordLength'] >= props.mondooWindowsSecurityMinimumPasswordLength
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that Windows requires passwords of at least 14 characters.

        The check reads the `MinimumPasswordLength` system access setting, which must be at least the value carried by this policy's property, defaulting to `14`.

        **Why this matters**

        Length is the property that determines how long a password survives an offline attack, and it dominates every other rule. Each additional character multiplies the search space, while complexity requirements mostly change which predictable substitutions users make.

        The attack this defends against is offline rather than at the logon prompt. An attacker who obtains the password hashes, whether from the local SAM, from a domain controller, or from a Kerberoasting attack against a service account, cracks them at whatever rate their hardware allows. There is no lockout, no rate limit, and no record of the attempts. Modern graphics hardware works through the entire space of short passwords in hours.

        Fourteen characters is also the boundary at which the LAN Manager hash stops being relevant, since that algorithm splits passwords into two seven-character halves. A password of 15 characters or more cannot produce a valid LM hash at all.

        Encourage passphrases rather than layering complexity onto something short. Four unrelated words comfortably exceed the requirement and are easier to remember than a shorter password with substitutions.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Account Policies** and locate **Minimum password length**.
        3. Review the configured value.

        The system passes when **Minimum password length** meets the configured minimum. It fails if it is set differently.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the **Minimum password length** setting.

        The system passes when the exported policy shows that **Minimum password length** meets the configured minimum. It fails if it is set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `14 or more character(s)`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Minimum password length
            ```

            **Impact:**

            Requirements for extremely long passwords can actually decrease the security of an organization, because users might leave the information in an insecure location or lose it. If very long passwords are required, mistyped passwords could cause account lockouts and increase the volume of help desk calls. If your organization has issues with forgotten passwords due to password length requirements, consider teaching your users about passphrases, which are often easier to remember and, due to the larger number of character combinations, much harder to discover.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Note:**
            This check compares the configured minimum length against the `mondooWindowsSecurityMinimumPasswordLength` property, which defaults to 14. If you raise that property, set the same value in the command below so the configured policy matches the value the check requires. On a domain member, apply this through the Default Domain Policy GPO, because a local `secedit` change is overwritten when Group Policy refreshes. The `Out-File` command writes the import file as Unicode, which `secedit` requires.

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("MinimumPasswordLength = \d+", "MinimumPasswordLength = 14") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to set minimum password length. The value must match the `mondooWindowsSecurityMinimumPasswordLength` property, which defaults to 14. If you raise that property, set the same value here.

            ```yaml
            ---
            - name: Set minimum password length to 14 characters
              hosts: windows
              tasks:
                - name: Set minimum password length via secedit
                  community.windows.win_security_policy:
                    section: System Access
                    key: MinimumPasswordLength
                    value: 14
            ```

            Note: The `win_security_policy` module ships in the `community.windows` collection, so install it with `ansible-galaxy collection install community.windows`. Alternatively, use the `ansible.windows.win_shell` module with `secedit` commands.
        - id: chef
          desc: |
            **Using Chef Infra**

            On a domain member, apply this through the Default Domain Policy GPO instead, because a local change is overwritten when Group Policy refreshes. This check compares against the `mondooWindowsSecurityMinimumPasswordLength` property, which defaults to 14, so raise the value below to match if you raise that property. Use this Chef Infra recipe code to require passwords of at least 14 characters:

            ```ruby
            windows_security_policy 'MinimumPasswordLength' do
              secvalue '14'
              action :set
            end
            ```
  - uid: mondoo-windows-security-netbt-nodetype-configuration-is-set-to-enabled-p-node-recommended
    title: "Ensure NetBT NodeType is set to P-node"
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-03
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-20
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ac-5
      compliance/nist-csf-2: nist-csf-2-pr-ir-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a02
      compliance/pci-dss-4: pcidss-requirement-1-3-1
      compliance/soc2-2017: soc2-control-cc6-6-4
      compliance/vda-isa-5: vda-isa-5-5-2-6
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetBT\Parameters', name: 'NodeType' ).data == 2
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that NetBIOS over TCP/IP resolves names by querying a WINS server only, without falling back to broadcast.

        The check reads `NodeType` under `HKLM\SYSTEM\CurrentControlSet\Services\NetBT\Parameters`, which must be `2`, selecting P-node.

        **Why this matters**

        Broadcast name resolution asks the entire local network "who is this name" and believes the first answer. There is no authentication in the response, so whoever replies fastest wins.

        That is the basis of NetBIOS name service poisoning, one of the most reliable techniques available on an internal network. An attacker runs a tool that answers every broadcast query affirmatively. A workstation looking for a mistyped or unavailable server name receives the attacker's address, connects, and attempts to authenticate, handing over an NTLM exchange that the attacker cracks offline or relays to another machine to authenticate as that user.

        None of this requires a vulnerability or any prior access beyond being on the same network segment, and the queries that trigger it are generated constantly by ordinary Windows behavior.

        P-node stops the fallback: a name either resolves through WINS or does not resolve at all. Apply this alongside disabling multicast name resolution, since LLMNR is the same attack through a different protocol, and consider disabling NetBIOS over TCP/IP entirely where nothing requires it.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetBT\Parameters`.
        3. Inspect the `NodeType` value.

        The system passes when `NodeType` is set to `2`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters' -Name 'NodeType'
           ```

        The system passes when `NodeType` is set to `2`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: P-node (recommended)`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\MS Security Guide\\NetBT NodeType configuration
            ```

            **Note:**
            This change does not take effect until the computer has been restarted.

            **Note #2:**
            This Group Policy path does not exist by default. An additional Group Policy template ( `SecGuide.admx/adml` ) is required - it is available from Microsoft at [this link](https://techcommunity.microsoft.com/t5/Microsoft-Security-Baselines/Security-baseline-FINAL-for-Windows-10-v1903-and-Windows-Server/ba-p/701084). Please note that this setting is **only**
            available in the _Security baseline (FINAL) for Windows 10 v1903 and Windows Server v1903_
            (or newer) release of `SecGuide.admx/adml`, so if you previously downloaded this template, you may need to update it from a newer Microsoft baseline to get this new _NetBT NodeType configuration_
            setting.

            **Impact:**

            NetBIOS name resolution queries will require a defined and available WINS server for external NetBIOS name resolution. If a WINS server is not defined or not reachable, and the desired hostname is not defined in the local cache, local LMHOSTS or HOSTS files, NetBIOS name resolution will fail.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
            $Name         = 'NodeType'
            $Value        = '2'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Configure NetBT NodeType to P-node
              hosts: windows
              tasks:
                - name: Set NodeType to 2 (P-node)
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters
                    name: NodeType
                    data: 2
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `NodeType` registry value that backs this policy to `2`:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Services\NetBT\Parameters' do
              values [{
                name: 'NodeType',
                type: :dword,
                data: 2,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-allow-anonymous-sidname-translation-is-set-to-disabled
    title: "Ensure anonymous SID/Name translation is disabled"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      secpol.systemaccess['LSAAnonymousNameLookup'] == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that an unauthenticated user cannot ask the system to translate a security identifier into an account name.

        The check reads the `LSAAnonymousNameLookup` system access setting, which must be `0`.

        **Why this matters**

        SIDs are predictable in a way that account names are not. Every Windows domain has an administrator account whose SID ends in `-500` and well-known groups at fixed relative identifiers, regardless of what those objects have been renamed to.

        Anonymous translation turns that predictability into a name. An attacker with no credentials submits the domain SID with `-500` appended and receives the current name of the administrator account, which defeats the common practice of renaming it. Walking the relative identifier space from `1000` upward enumerates every user and group in the domain, again without authenticating.

        That produces a complete target list before any attack begins, and the traffic looks like ordinary directory activity rather than a scan.

        Disabling the translation removes an unauthenticated capability that legitimate clients do not need, since authenticated users can still resolve SIDs normally. The exception worth checking is trust relationships with older Windows NT-era systems, which are rare enough to treat as a specific exemption.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Account Policies** and locate **Network access: Allow anonymous SID/Name translation**.
        3. Review the configured value.

        The system passes when **Network access: Allow anonymous SID/Name translation** is set to `0`. It fails if it is set differently.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the **Network access: Allow anonymous SID/Name translation** setting.

        The system passes when the exported policy shows that **Network access: Allow anonymous SID/Name translation** is set to `0`. It fails if it is set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Allow anonymous SID/Name translation
            ```

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            On a domain member this account policy is enforced by the Default Domain Policy GPO. A local `secedit` change is overwritten the next time Group Policy refreshes, so make this change in the domain GPO for domain-joined systems. The `Out-File` command writes the import file as Unicode, which `secedit` requires; verify the encoding if you adapt the script.

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("LSAAnonymousNameLookup = \d+", "LSAAnonymousNameLookup = 0") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable anonymous SID/Name translation
              hosts: windows
              tasks:
                - name: Set LSAAnonymousNameLookup to 0 (Disabled)
                  community.windows.win_security_policy:
                    section: System Access
                    key: LSAAnonymousNameLookup
                    value: 0
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            On a domain member, apply this through the Default Domain Policy GPO instead, because a local change is overwritten when Group Policy refreshes. Use this Chef Infra recipe code to stop anonymous callers translating SIDs into account names:

            ```ruby
            windows_security_policy 'LSAAnonymousNameLookup' do
              secvalue '0'
              action :set
            end
            ```
  - uid: mondoo-windows-security-network-access-do-not-allow-anonymous-enumeration-of-sam-accounts
    title: "Ensure anonymous enumeration of SAM accounts is not allowed"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'RestrictAnonymousSAM' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that an anonymous connection cannot enumerate the local account database.

        The check reads `RestrictAnonymousSAM` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `1`.

        **Why this matters**

        Windows historically allowed a connection with no credentials, known as a null session, to query the Security Accounts Manager and receive a list of the local accounts.

        The value of that list to an attacker is that it removes guesswork from every subsequent step. Password spraying works when the attacker knows real usernames, since attempts against accounts that do not exist waste attempts and generate distinctive failures. Knowing which accounts exist, which are disabled, and which are members of the local Administrators group turns a broad attack into a narrow one aimed at a handful of names.

        The enumeration itself is unauthenticated, so it precedes anything a logging or lockout control would catch, and it leaves little trace beyond a connection.

        Restricting it means an attacker must first obtain valid credentials in order to learn which accounts exist, which reverses the order they would prefer to work in and forces the noisy step to come first.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `RestrictAnonymousSAM` value.

        The system passes when `RestrictAnonymousSAM` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'RestrictAnonymousSAM'
           ```

        The system passes when `RestrictAnonymousSAM` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Do not allow anonymous enumeration of SAM accounts
            ```

            **Impact:**

            None on supported systems. This is the default behavior on current versions of Windows.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'RestrictAnonymousSAM'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable anonymous enumeration of SAM accounts
              hosts: windows
              tasks:
                - name: Set RestrictAnonymousSAM to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: RestrictAnonymousSAM
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `RestrictAnonymousSAM` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'RestrictAnonymousSAM',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-do-not-allow-anonymous-enumeration-of-sam-accounts-and-shares
    title: "Ensure anonymous enumeration of SAM accounts and shares is blocked"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'RestrictAnonymous' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that an anonymous connection cannot enumerate either the local accounts or the shares on the system.

        The check reads `RestrictAnonymous` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `1`. This extends the account restriction to cover share enumeration as well.

        **Why this matters**

        Share enumeration tells an attacker where the data is. A list of share names frequently describes the contents directly, with names identifying finance, human resources, backups, or software distribution, and it identifies which servers hold material worth taking before any of them is touched.

        It also reveals the estate's structure. Shares used for software deployment or logon scripts are writable by more accounts than their owners usually realize, and a share used to distribute software to many machines is a route to all of them.

        Because the enumeration is anonymous, this reconnaissance happens before authentication, so none of the controls that depend on identifying a user apply to it.

        Restricting both accounts and shares closes the pair of questions an attacker asks first: who is here, and what do they have. Verify legacy application compatibility before applying this on domain controllers, where older systems occasionally depend on anonymous access.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `RestrictAnonymous` value.

        The system passes when `RestrictAnonymous` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'RestrictAnonymous'
           ```

        The system passes when `RestrictAnonymous` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Do not allow anonymous enumeration of SAM accounts and shares
            ```

            **Impact:**

            Users who access file and print servers anonymously will be unable to list the shared network resources on those servers; the users will have to authenticate before they can view the lists of shared folders and printers. However, even with this policy setting enabled, anonymous users will have access to resources with permissions that explicitly include the built-in group, `ANONYMOUS LOGON`.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'RestrictAnonymous'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable anonymous enumeration of SAM accounts and shares
              hosts: windows
              tasks:
                - name: Set RestrictAnonymous to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: RestrictAnonymous
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `RestrictAnonymous` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'RestrictAnonymous',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-do-not-allow-storage-of-passwords-and-credentials-for-network-auth
    title: "Ensure network credential and password storage is disabled"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'DisableDomainCreds' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that Windows does not save passwords and credentials for network authentication in Credential Manager.

        The check reads `DisableDomainCreds` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `1`.

        **Why this matters**

        Credential Manager is the vault behind the "remember my credentials" checkbox. What it stores is recoverable, not merely cached: the credentials are protected by the user's own logon secret, so any code running as that user can decrypt them.

        That is the whole problem. An attacker who reaches a session, through malware, a stolen laptop, or a compromised application, does not need to escalate privilege to read the vault. They inherit every credential the user ever chose to save, and those are typically the interesting ones: file server access, database connections, administrative credentials for other machines.

        The effect is to convert one compromised workstation into credentials for everything that workstation's user reaches. It is a primary mechanism by which an initial foothold becomes lateral movement, and readily available tooling automates the extraction.

        Disabling storage means credentials are entered when needed and not retained. That is a real usability cost, which is why the setting belongs on servers and administrative workstations first. Where saved credentials are genuinely required, a managed secrets platform provides them without leaving recoverable copies in every user session.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `DisableDomainCreds` value.

        The system passes when `DisableDomainCreds` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'DisableDomainCreds'
           ```

        The system passes when `DisableDomainCreds` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Do not allow storage of passwords and credentials for network authentication
            ```

            **Impact:**

            Credential Manager will not store passwords and credentials on the computer. Users will be forced to enter passwords whenever they log on to their Passport account or other network resources that aren't accessible to their domain account. Testing has shown that clients running Windows Vista or Windows Server 2008 will be unable to connect to Distributed File System (DFS) shares in untrusted domains. Enabling this setting also makes it impossible to specify alternate credentials for scheduled tasks, this can cause a variety of problems. For example, some third party backup products will no longer work. This policy setting should have no impact on users who access network resources that are configured to allow access with their Active Directory-based domain account.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'DisableDomainCreds'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable storage of passwords and credentials
              hosts: windows
              tasks:
                - name: Set DisableDomainCreds to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: DisableDomainCreds
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `DisableDomainCreds` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'DisableDomainCreds',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-let-everyone-permissions-apply-to-anonymous-users-is-set-to-disabled
    title: "Ensure Everyone permissions do not apply to anonymous users"
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'EveryoneIncludesAnonymous' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that anonymous connections do not receive the permissions granted to the Everyone group.

        The check reads `EveryoneIncludesAnonymous` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `0`.

        **Why this matters**

        Everyone is used widely and casually. It appears on shares created quickly, on folders where someone wanted to stop troubleshooting a permissions problem, and in the default access control lists of a number of applications. The universal assumption behind those grants is that Everyone means every authenticated user.

        When anonymous connections are included in Everyone, that assumption is wrong across the entire system at once. Every resource granting Everyone read access becomes readable without credentials, and every resource granting write access becomes writable. The permissions themselves look unchanged, so a review of any individual resource finds nothing wrong.

        The scale is what makes this severe. This is not one exposure but a change in meaning applied to every access control entry that names Everyone, on a machine where nobody granted access with anonymous users in mind.

        Keeping the setting disabled preserves the distinction between an authenticated user and an unauthenticated connection, which is the distinction every one of those grants assumed.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `EveryoneIncludesAnonymous` value.

        The system passes when `EveryoneIncludesAnonymous` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'EveryoneIncludesAnonymous'
           ```

        The system passes when `EveryoneIncludesAnonymous` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Let Everyone permissions apply to anonymous users
            ```

            **Impact:**

            None - this is the default behavior.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'EveryoneIncludesAnonymous'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable Everyone permissions for anonymous users
              hosts: windows
              tasks:
                - name: Set EveryoneIncludesAnonymous to 0 (Disabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: EveryoneIncludesAnonymous
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `EveryoneIncludesAnonymous` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'EveryoneIncludesAnonymous',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-named-pipes-that-can-be-accessed-anonymously-is-set-to-none
    title: "Ensure no Named Pipes can be accessed anonymously"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    variants:
      - uid: mondoo-windows-security-network-access-named-pipes-that-can-be-accessed-anonymously-is-set-to-none-dc
        tags:
          mondoo.com/filter-title: "Windows Domain Controller"
          mondoo.com/filter-icon: "windows"
      - uid: mondoo-windows-security-network-access-named-pipes-that-can-be-accessed-anonymously-is-set-to-none-ms
        tags:
          mondoo.com/filter-title: "Windows Member Server"
          mondoo.com/filter-icon: "windows"
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that no named pipes are configured for anonymous access.

        Named pipes are an interprocess communication mechanism that Windows also exposes over SMB, and a pipe listed in this setting can be opened by a connection that has not authenticated. The recommended state is an empty list.

        **Why this matters**

        A named pipe is an endpoint into a running service. Opening one anonymously means reaching that service's protocol handler without presenting credentials, so whatever the service does on receipt of a request happens for an unauthenticated caller.

        Historically the pipes listed here supported browser and spooler functionality on networks that no longer exist. The exposure they leave is that the service parses attacker-controlled input before any authentication decision, which is precisely the position from which the most serious Windows vulnerabilities have been exploited, the print spooler among them.

        Anonymous pipe access is also a reconnaissance path. Reaching a pipe confirms that the service behind it is present and running, which identifies the machine's role without an authenticated query.

        The correct configuration is an empty list, so that every pipe requires an authenticated session. Where an application documents a specific pipe as needing anonymous access, add that one pipe rather than accepting a default list assembled for compatibility with systems that are long retired.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters`.
        3. Inspect the `NullSessionPipes` value.

        On a member server the system passes when `NullSessionPipes` is empty. On a domain controller it passes when the value contains only the required entries. It fails if any other named pipe is listed.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters' -Name 'NullSessionPipes'
           ```

        The system passes when `NullSessionPipes` is empty on a member server, or contains only the required entries on a domain controller. It fails if any other named pipe is listed.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            On member servers, set the following UI path to `<blank>`, which represents None. On domain controllers, configure the list to contain only `LSARPC`, `NETLOGON`, and `SAMR`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Named Pipes that can be accessed anonymously
            ```

            **Impact:**

            This configuration will disable null session access over named pipes, and applications that rely on this feature or on unauthenticated access to named pipes will no longer function.

            **Warning:**

            Do not clear this list on a domain controller. Domain controllers require the `LSARPC`, `NETLOGON`, and `SAMR` pipes to support legacy authentication operations.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
            $Name         = 'NullSessionPipes'

            # WARNING: Do not clear this list on a domain controller. Domain
            # controllers require the LSARPC, NETLOGON, and SAMR pipes for
            # legacy authentication. The branch below selects the correct value
            # automatically based on the product type, so verify the detected
            # role before applying the change.

            # ProductType 2 indicates a domain controller; anything else is a
            # member server or workstation.
            $ProductType = (Get-CimInstance -ClassName Win32_OperatingSystem).ProductType

            If ($ProductType -eq 2) {
                # Domain controllers: allow only the required pipes
                $Value = @('LSARPC','NETLOGON','SAMR')
            } Else {
                # Member servers and workstations: allow no anonymous pipes
                $Value = @()
            }

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType MultiString -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            Do not clear this list on a domain controller. Domain controllers require the `LSARPC`, `NETLOGON`, and `SAMR` pipes for legacy authentication. The first task below reads the product type so the following two tasks can branch on it, where `2` identifies a domain controller.

            ```yaml
            - name: Configure Named Pipes that can be accessed anonymously
              hosts: windows
              tasks:
                - name: Read the operating system product type
                  ansible.windows.win_powershell:
                    script: (Get-CimInstance -ClassName Win32_OperatingSystem).ProductType
                  changed_when: false
                  register: product_type

                - name: Clear NullSessionPipes on member servers and workstations
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
                    name: NullSessionPipes
                    data: []
                    type: multistring
                  when: product_type.output[0] != 2

                - name: Allow only required pipes on domain controllers
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
                    name: NullSessionPipes
                    data:
                      - LSARPC
                      - NETLOGON
                      - SAMR
                    type: multistring
                  when: product_type.output[0] == 2
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            **Warning: do not clear this list on a domain controller.** Domain controllers require the `LSARPC`, `NETLOGON`, and `SAMR` pipes for legacy authentication. Use this Chef Infra recipe code, which selects the correct value from the raw `ProductType` that Ohai collects, where `2` identifies a domain controller:

            ```ruby
            null_session_pipes = if node['kernel']['os_info']['product_type'] == 2
                                   %w(LSARPC NETLOGON SAMR)
                                 else
                                   []
                                 end

            registry_key 'HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters' do
              values [{
                name: 'NullSessionPipes',
                type: :multi_string,
                data: null_session_pipes,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-restrict-anonymous-access-to-named-pipes-and-shares
    title: "Ensure anonymous access to Named Pipes and Shares is restricted"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-1-access-control
      compliance/iso-27001-2022: iso-27001-2022-a-8-3
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-4
      compliance/nist-csf-2: nist-csf-2-pr-aa-05
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ac-14
      compliance/nist-sp-800-171: nist-sp-800-171--3-1-1
      compliance/owasp-top-10-2025: owasp-top-10-2025-a01
      compliance/pci-dss-4: pcidss-requirement-7-2-1
      compliance/soc2-2017: soc2-control-cc6-1-3
      compliance/vda-isa-5: vda-isa-5-4-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters', name: 'RestrictNullSessAccess' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that anonymous access is restricted to the named pipes and shares explicitly listed as permitted, rather than being available broadly.

        The check reads `RestrictNullSessAccess` under `HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters`, which must be `1`.

        **Why this matters**

        This setting is what makes the null session pipe and share lists act as allowlists. With it disabled, those lists stop being a boundary, and anonymous connections can reach pipes and shares that were never nominated for anonymous access.

        The consequence is that the two related settings become decorative. An administrator who has carefully emptied the anonymous pipes and shares lists has achieved nothing while this value is `0`, and nothing about the configuration indicates that, because the lists themselves read as correct.

        What it exposes is the same set of concerns those lists exist to manage: unauthenticated access to service endpoints and to share contents, on a machine where the access control on both assumes a caller who has authenticated.

        Enable it together with the empty pipe and share lists. The three settings are one control expressed in three places, and any one of them left at the permissive value undoes the other two.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters`.
        3. Inspect the `RestrictNullSessAccess` value.

        The system passes when `RestrictNullSessAccess` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters' -Name 'RestrictNullSessAccess'
           ```

        The system passes when `RestrictNullSessAccess` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network access: Restrict anonymous access to Named Pipes and Shares
            ```

            **Impact:**

            None - this is the default behavior. If you choose to enable this setting and are supporting Windows NT 4.0 domains, you should check if any of the named pipes are required to maintain trust relationships between the domains, and then add the pipe to the **Network access: Named pipes that can be accessed anonymously**
            list:

            - COMNAP: SNA session access
            - COMNODE: SNA session access
            - SQL\\QUERY: SQL instance access
            - SPOOLSS: Spooler service
            - LLSRPC: License Logging service
            - NETLOGON: Net Logon service
            - LSARPC: LSA access
            - SAMR: Remote access to SAM objects
            - BROWSER: Computer Browser service

            Previous to the release of Windows Server 2003 with Service Pack 1 (SP1) these named pipes were allowed anonymous access by default, but with the increased hardening in Windows Server 2003 with SP1 these pipes must be explicitly added if needed.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
            $Name         = 'RestrictNullSessAccess'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Restrict anonymous access to Named Pipes and Shares
              hosts: windows
              tasks:
                - name: Set RestrictNullSessAccess to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
                    name: RestrictNullSessAccess
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `RestrictNullSessAccess` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters' do
              values [{
                name: 'RestrictNullSessAccess',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-access-restrict-clients-allowed-to-make-remote-calls-to-sam
    title: "Ensure remote SAM access is restricted to Administrators only"
    impact: 80
