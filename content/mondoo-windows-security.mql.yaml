        This check verifies that the **Special Logon** audit subcategory is set to **Success**.

        The subcategory records logons that are assigned administrative-equivalent privileges, and the use of accounts that are members of special groups. The check reads the effective audit policy for the subcategory.

        Events recorded include 4672 for special privileges assigned to a new logon, and 4964 for a special group being assigned.

        **Why this matters**

        This subcategory answers a question the general logon events do not: which of these sessions was privileged.

        A machine produces a great many logon events, most of them routine service and network authentication. Event 4672 fires only for sessions that receive sensitive privileges, which effectively marks every administrative logon on the system. Filtering to those events reduces a large volume of authentication activity to the handful of sessions that could actually do damage.

        That is what makes it practical to review privileged access at all. An administrative logon at an unusual hour, from an unusual source, or to a machine that account has no business touching, is visible here without wading through everything else.

        The special groups facility extends this to any group an organization chooses to designate, so that use of a sensitive service account can be tracked the same way.
