  - uid: mondoo-windows-security-password-must-meet-complexity-requirements-is-set-to-enabled
    title: Ensure 'Password must meet complexity requirements' is set to 'Enabled'
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      secpol.systemaccess['PasswordComplexity'] == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that Windows enforces password complexity requirements.

        The check reads the `PasswordComplexity` system access setting, which must be `1`. Complexity requires characters from at least three of four categories, forbids the password containing the account name, and blocks passwords shorter than six characters.

        **Why this matters**

        Complexity rules are frequently criticized, and the criticism is largely fair: requiring a capital letter, a digit, and a symbol reliably produces `Password1!` rather than a strong password, and current NIST guidance recommends length and breach screening over composition rules.

        Two parts of the Windows implementation still earn their place. The rule that a password may not contain the account name or a substantial part of the user's display name blocks a genuinely common and genuinely weak pattern, and it is one that an attacker with a user list tries first.

        The composition requirement raises the floor rather than the ceiling. It does not make a determined user's password strong, but it does eliminate the worst passwords, which are short, purely alphabetic, and drawn from a small dictionary.

        Treat this as a floor beneath the length requirement, not as the main control. Where the environment supports it, a banned password list screening against known-breached credentials does far more than composition rules, and it addresses the weakness that `Password1!` represents.
      audit: |
        ### Audit via Local Security Policy

        1. Press **Windows + R**, type `secpol.msc`, and press **Enter**.
        2. Navigate to **Account Policies** and locate **Password must meet complexity requirements**.
        3. Review the configured value.

        The system passes when **Password must meet complexity requirements** is set to `1`. It fails if it is set differently.

        ### Audit via the command line

        1. Open an elevated command prompt.
        2. Export the effective security policy:

           ```cmd
           secedit /export /cfg %TEMP%\secpol.cfg
           ```

        3. Open the exported file and review the **Password must meet complexity requirements** setting.

        The system passes when the exported policy shows that **Password must meet complexity requirements** is set to `1`. It fails if it is set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Password must meet complexity requirements
            ```

            **Impact:**

            If the default password complexity configuration is retained, additional help desk calls for locked-out accounts could occur because users might not be accustomed to passwords that contain non-alphabetic characters. However, all users should be able to comply with the complexity requirement with minimal difficulty.

            If your organization has more stringent security requirements, you can create a custom version of the Passfilt.dll file that allows the use of arbitrarily complex password strength rules. For example, a custom password filter might require the use of non-upper row characters. (Upper row characters are those that require you to hold down the SHIFT key and press any of the digits between 1 and 0.) A custom password filter might also perform a dictionary check to verify that the proposed password does not contain common dictionary words or fragments.

            Also, the use of ALT key character combinations can greatly enhance the complexity of a password. However, such stringent password requirements can result in unhappy users and an extremely busy help desk. Alternatively, your organization could consider a requirement for all administrator passwords to use ALT characters in the 0128 - 0159 range. (ALT characters outside of this range can represent standard alphanumeric characters that would not add additional complexity to the password.)
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $Temp = [System.Environment]::GetEnvironmentVariable('TEMP','Machine')
            secedit /export /cfg $Temp\secpol-export.cfg
            (gc $Temp\secpol-export.cfg) -replace("PasswordComplexity = \d+", "PasswordComplexity = 1") | Out-File $Temp\secpol-import.cfg -Encoding Unicode
            secedit /import /db $Temp\secpol-db.sdb /cfg $Temp\secpol-import.cfg
            secedit /configure /db $Temp\secpol-db.sdb
            gpupdate /force
            Remove-Item -Path $Temp\secpol-export.cfg -Force
            Remove-Item -Path $Temp\secpol-import.cfg -Force
            Remove-Item -Path $Temp\secpol-db.sdb -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use `secedit` to enable password complexity requirements.

            ```yaml
            - name: Set password complexity requirements
              hosts: windows
              tasks:
                - name: Export current security policy
                  ansible.windows.win_command:
                    cmd: secedit /export /cfg C:\Windows\Temp\secpol-export.cfg

                - name: Set PasswordComplexity to 1
                  ansible.windows.win_powershell:
                    script: |
                      (Get-Content C:\Windows\Temp\secpol-export.cfg) -replace 'PasswordComplexity = \d+', 'PasswordComplexity = 1' | Out-File C:\Windows\Temp\secpol-import.cfg -Encoding Unicode

                - name: Import updated security policy
                  ansible.windows.win_command:
                    cmd: >-
                      secedit /configure /db C:\Windows\Temp\secpol-db.sdb
                      /cfg C:\Windows\Temp\secpol-import.cfg

                - name: Force group policy update
                  ansible.windows.win_command:
                    cmd: gpupdate /force

                - name: Clean up temporary files
                  ansible.windows.win_file:
                    path: "{{ item }}"
                    state: absent
                  loop:
                    - C:\Windows\Temp\secpol-export.cfg
                    - C:\Windows\Temp\secpol-import.cfg
                    - C:\Windows\Temp\secpol-db.sdb
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            On a domain member, apply this through the Default Domain Policy GPO instead, because a local change is overwritten when Group Policy refreshes. Use this Chef Infra recipe code to require passwords that meet the complexity requirements:

            ```ruby
            windows_security_policy 'PasswordComplexity' do
              secvalue '1'
              action :set
            end
            ```
  - uid: mondoo-windows-security-relax-minimum-password-length-limits-is-set-to-enabled
    title: Ensure 'Relax minimum password length limits' is set to 'Enabled'
    impact: 60
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-7
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-9
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SAM', name: 'RelaxMinimumPasswordLengthLimits' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-policies
          title: Windows Account Policies
      desc: |-
        This check verifies that Windows permits a minimum password length greater than 14 characters to be configured.

        Without this setting, the minimum password length policy is capped at 14 and longer values cannot be applied. The check reads `RelaxMinimumPasswordLengthLimits` under `HKLM\System\CurrentControlSet\Control\SAM`, which must be `1`.

        **Why this matters**

        This setting does not itself require longer passwords. It removes a limit that would otherwise prevent an administrator from requiring them, which makes it a prerequisite rather than a control.

        That distinction matters because of how the limit fails. An administrator who sets a minimum length of 20 on a system without this setting does not receive an error that the value was refused; the policy simply does not take effect as written. The configuration reads as requiring 20 characters and the system enforces 14, and nothing surfaces the difference.

        The underlying reason to want longer passwords is that 14 characters is no longer a comfortable margin against offline cracking with current hardware, particularly for service accounts and administrative accounts whose hashes are worth pursuing.

        Enable this on systems where a longer minimum is intended, then set the minimum itself. Enabling it alone changes nothing about what passwords the system accepts.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SAM`.
        3. Inspect the `RelaxMinimumPasswordLengthLimits` value.

        The system passes when `RelaxMinimumPasswordLengthLimits` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\SAM' -Name 'RelaxMinimumPasswordLengthLimits'
           ```

        The system passes when `RelaxMinimumPasswordLengthLimits` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Relax minimum password length limits
            ```

            **Note:**
            This setting is only available within the built-in OS security template of Windows 10 Release 2004 (or newer), and is not available via older versions of the OS, or via downloadable Administrative Templates (ADMX/ADML). Therefore, you _must_
            use a Windows 10 Release 2004 computer (or newer) to view or edit this setting with the Group Policy Management Console (GPMC) or Group Policy Management Editor (GPME).

            **Impact:**

            The _Minimum password length_
            setting may be configured higher than 14 characters.

            If very long passwords are required, mistyped passwords could cause account lockouts and increase the volume of help desk calls. If your organization has issues with forgotten passwords due to password length requirements, consider teaching your users about passphrases, which are often easier to remember and, due to the larger number of character combinations, much harder to discover.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\SAM'
            $Name         = 'RelaxMinimumPasswordLengthLimits'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
