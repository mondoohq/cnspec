          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that the Remote Desktop client cannot save passwords.

        The check reads the Remote Desktop password saving setting, which must be set to prevent saving.

        **Why this matters**

        A saved Remote Desktop password is stored in Credential Manager, where it is protected by the user's own logon secret. That means anything running as that user can decrypt it, which includes malware in the session and an attacker who has taken over the machine.

        The credentials saved this way are usually the valuable ones. People save connections they use often, and for an administrator that is the set of servers they administer, frequently with privileged accounts. Compromising the workstation therefore yields not one credential but the administrator's whole working set.

        Readily available tooling extracts these automatically, and it requires no privilege escalation, because the credentials were encrypted to the user whose session the attacker already occupies.

        Preventing saving means the password is entered per connection and not retained. Where connecting repeatedly is a genuine burden, the answer is a privileged access workstation and a checkout process for administrative credentials, not a stored copy on a general-purpose machine.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `DisablePasswordSaving` value.

        The system passes when `DisablePasswordSaving` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'DisablePasswordSaving'
           ```

        The system passes when `DisablePasswordSaving` is set to `1`. It fails if the value is missing or set differently.
