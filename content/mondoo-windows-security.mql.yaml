        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the **Other Policy Change Events** audit subcategory is set to **Failure**.

        The subcategory records policy change activity outside the main categories, including cryptographic provider operations and Group Policy application errors. The check reads the effective audit policy for the subcategory.

        Events recorded include 5063 through 5071 for cryptographic operations, and 6144 and 6145 for Group Policy errors.

        **Why this matters**

        Only failures are collected, because the success events in this subcategory are high volume and carry little meaning on their own.

        Group Policy application failures are the practical value. A machine that fails to apply policy keeps running with whatever configuration it last had, which means every hardening setting delivered through Group Policy, including the audit settings this policy checks, may silently not be in effect. The machine reports as compliant in the directory and is not.

        Cryptographic operation failures form the second group. Repeated failures in a provider indicate either a genuine fault in certificate or key handling, which breaks authentication and TLS in ways that are hard to diagnose from the application side, or an attempt to use key material in a way the provider refused.

        Both classes are conditions where something is quietly not working, which is why they are worth surfacing.
      audit: |
        ### Audit via the Group Policy editor

        1. Press **Windows + R**, type `gpedit.msc`, and press **Enter**.
        2. Navigate to **Computer Configuration** > **Windows Settings** > **Security Settings** > **Advanced Audit Policy Configuration** > **Audit Policies**.
        3. Locate the **Other Policy Change Events** subcategory and review its configured value.

