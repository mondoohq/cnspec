      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-cm-6
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a04
      compliance/pci-dss-4: pcidss-requirement-2-2-1
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      windows.rdp.securityLayer == 2
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop connections use TLS as their security layer rather than the legacy RDP native protocol.

        The check reads the Remote Desktop security layer setting, which must be `2`, selecting SSL and TLS. A value of `0` selects native RDP security and `1` negotiates between the two.

        **Why this matters**

        The security layer decides how the server proves its identity to the client and how the session is protected.

        Native RDP security does not authenticate the server in any meaningful way. A client connecting to a machine that has interposed itself on the network cannot tell the difference, which makes interception straightforward: the attacker terminates the connection, presents themselves as the server, and relays to the real one while reading everything that passes, including the credentials entered at the logon screen.

        TLS uses a certificate to authenticate the server before the session begins, which is what makes that substitution detectable. It also brings the session under a modern, reviewed cryptographic implementation rather than the proprietary scheme RDP shipped with.

        Negotiate is not sufficient, because an attacker who controls the negotiation selects the weaker option. Requiring TLS removes the choice.

        Note that the protection depends on the certificate being trusted. A self-signed certificate leaves users clicking through a warning that is the only signal an interception attempt would produce.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `SecurityLayer` value.

        The system passes when `SecurityLayer` is set to `2`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'SecurityLayer'
           ```

        The system passes when `SecurityLayer` is set to `2`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled: SSL`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Security\\Require use of specific security layer for remote (RDP) connections
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Impact:**

            TLS 1.0 will be required to authenticate to the RD Session Host server. If TLS is not supported, the connection fails.

            **Note:**
            By default, this setting will use a self-signed certificate for RDP connections. If your organization has established the use of a Public Key Infrastructure (PKI) for SSL/TLS encryption, then we recommend that you also configure the _Server authentication certificate template_setting to instruct RDP to use a certificate from your PKI instead of a self-signed one. Note that the certificate template used for this purpose must have “Client Authentication” configured as an Intended Purpose. Note also that a valid, non-expired certificate using the specified template must already be installed on the workstation for it to work.

            **Note #2:**
            Some third party two-factor authentication solutions, such as RSA Authentication Agent, can be negatively affected by this setting, as the SSL/TLS security layer will expect the user's Windows password upon initial connection attempt (before the RDP logon screen), and once successfully authenticated, pass the credential along to that Windows session on the RDP host (to complete the login). If a two-factor agent is present and expecting a different credential at the RDP logon screen, this initial connection may result in a failed logon attempt, and also effectively cause a “double logon” requirement for each and every new RDP session.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'SecurityLayer'
            $Value        = '2'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```yaml
            - name: Ensure RDP connections use SSL security layer
              hosts: windows
              tasks:
                - name: Set SecurityLayer to 2
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
                    name: SecurityLayer
                    data: 2
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `SecurityLayer` registry value that backs this policy to `2`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' do
              values [{
                name: 'SecurityLayer',
                type: :dword,
                data: 2,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-require-user-authentication-for-remote-connections-by-using-network-level-a
    title: Ensure Network Level Authentication is required for RDP
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-cek-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-e-1-transmission
      compliance/iso-27001-2022: iso-27001-2022-a-8-24
      compliance/nis-2: nis-2-21-2-h
      compliance/nist-csf-1: nist-csf-1-pr-ds-2
      compliance/nist-csf-2: nist-csf-2-pr-ds-02
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-sc-8
      compliance/nist-sp-800-171: nist-sp-800-171--3-13-8
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-4-2-1
      compliance/soc2-2017: soc2-control-cc6-7-2
      compliance/vda-isa-5: vda-isa-5-5-1-2
    mql: |
      windows.rdp.networkLevelAuthentication
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop requires Network Level Authentication, so that a user authenticates before a session is created on the server.

        The check reads the Remote Desktop Network Level Authentication setting, which must be enabled.

        **Why this matters**

        Without Network Level Authentication, the server builds a full session and presents a graphical logon screen to anyone who connects. Authentication happens inside that session, which means substantial server-side code runs on behalf of a caller who has proved nothing.

        That pre-authentication surface is where the most serious Remote Desktop vulnerabilities have been found. BlueKeep, which was wormable and prompted out-of-band patches for end-of-life Windows versions, was exploitable precisely because the vulnerable code ran before authentication. Network Level Authentication mitigated it, on unpatched systems, by requiring credentials before that code was reachable.

        It also removes a denial of service. Each unauthenticated connection consumes a session's worth of memory and processing, so an attacker can exhaust a server simply by connecting repeatedly without ever logging in.

        Every supported Windows client supports Network Level Authentication. Enabling it is one of the highest-value settings available for any host that accepts Remote Desktop connections.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `UserAuthentication` value.

        The system passes when `UserAuthentication` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'UserAuthentication'
           ```

        The system passes when `UserAuthentication` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Security\\Require user authentication for remote connections by using Network Level Authentication
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Note #2:**
            In the Microsoft Windows Vista Administrative Templates, this setting was initially named _Require user authentication using RDP 6.0 for remote connections_, but it was renamed starting with the Windows Server 2008 (non-R2) Administrative Templates.

            **Impact:**

            Only client computers that support Network Level Authentication can connect to the RD Session Host server.

            **Note:**
            Some third party two-factor authentication solutions, such as RSA Authentication Agent, can be negatively affected by this setting, as Network Level Authentication will expect the user's Windows password upon initial connection attempt (before the RDP logon screen), and once successfully authenticated, pass the credential along to that Windows session on the RDP host (to complete the login). If a two-factor agent is present and expecting a different credential at the RDP logon screen, this initial connection may result in a failed logon attempt, and also effectively cause a “double logon” requirement for each and every new RDP session.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'UserAuthentication'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            This change affects how Remote Desktop accepts connections and takes effect on new sessions. Verify that your RDP clients support the required security settings before you enforce it, because an incompatible client can be unable to reconnect and an administrator working over RDP can be locked out. Apply the change during a maintenance window and confirm access from a separate session before disconnecting.

            ```yaml
            - name: Ensure Network Level Authentication is required for RDP
              hosts: windows
              tasks:
                - name: Set UserAuthentication to 1
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
                    name: UserAuthentication
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `UserAuthentication` registry value that backs this policy to `1`:

            ```ruby
