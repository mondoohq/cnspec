      asset.platform == "windows"
    mql: |
      windows.auditPolicy.subcategory(name: "Logoff").success
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the **Logoff** audit subcategory is set to **Success**.

        The subcategory records the end of a logon session. The check reads the effective audit policy for the subcategory.

        Events recorded include 4634 for an account logoff and 4647 for a user-initiated logoff.

        **Why this matters**

        A logon event on its own gives a start time and no end. Pairing it with a logoff produces a session with a duration, which is what makes activity attributable to a specific person during a specific window.

        That matters whenever more than one account touches a machine. Assigning an action observed at a point in time to whoever was logged in requires knowing who was still logged in, and without logoff events every session appears open-ended.

        Sessions that never close are also a finding in their own right. An interactive session that stays open for weeks is either an unattended console, which is a physical access risk, or a session an intruder is holding.

        The events are low volume, since they occur once per session, and they roughly double the investigative value of the logon events this policy also collects.
      audit: |
        ### Audit via the Group Policy editor

        1. Press **Windows + R**, type `gpedit.msc`, and press **Enter**.
        2. Navigate to **Computer Configuration** > **Windows Settings** > **Security Settings** > **Advanced Audit Policy Configuration** > **Audit Policies**.
        3. Locate the **Logoff** subcategory and review its configured value.

