  - uid: mondoo-windows-security-memory-integrity-hvci-enabled
    filters: |
      asset.family.contains('windows')
    title: Ensure Memory Integrity (HVCI) is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      [1, 2].contains( windows.deviceGuard.hypervisorEnforcedCodeIntegrity )
    docs:
      desc: |-
        This check verifies that memory integrity, also called Hypervisor-Enforced Code Integrity, is enabled.

        Memory integrity uses hardware virtualization to run the code integrity check in a container the operating system itself cannot modify, so kernel code is validated by a component an attacker with kernel access cannot reach. The check reads the Device Guard configuration and requires that hypervisor-enforced code integrity is enabled.

        **Why this matters**

        Kernel code runs with complete control of the machine. A malicious driver can hide processes and files from every tool an administrator would use, intercept credentials, and disable security software from below, which is why loading one is a goal worth substantial effort to an attacker.

        Ordinary driver signature enforcement is performed by the kernel, which means an attacker who already has kernel access can switch it off. Memory integrity moves that decision into a virtualization-based container that the kernel cannot write to, so the enforcement survives the compromise it is meant to contain.

        It also blocks the bring-your-own-vulnerable-driver technique, in which an attacker loads a legitimately signed but flawed driver specifically to exploit it and gain kernel execution, since the vulnerable driver can be blocked at the integrity layer.

        Compatibility is the constraint. Older drivers that allocate memory as both writable and executable will not load. Microsoft provides a readiness scan, and it is worth running before enabling this on existing systems.
      audit: |-
        ### Audit via Group Policy

        1. Open the Local Group Policy Editor (`gpedit.msc`).
        2. Navigate to **Computer Configuration** > **Administrative Templates** > **System** > **Device Guard** > **Turn on Virtualization Based Security**.
        3. Confirm the policy is **Enabled** and that **Virtualization Based Protection of Code Integrity** is set to **Enabled with UEFI lock** or **Enabled without lock**.

        ### Audit via PowerShell

        1. Read the Device Guard policy value that the Group Policy setting writes:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard' -Name 'HypervisorEnforcedCodeIntegrity'
           ```

        The system passes when `HypervisorEnforcedCodeIntegrity` is `1` for enabled with UEFI lock, or `2` for enabled without lock. It fails when the value is missing or set to `0`.

        2. Confirm that the configured policy is in effect on the running system:

           ```powershell
           (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).SecurityServicesRunning
           ```

        A returned service list that includes `2` confirms Memory Integrity is running. A configured policy that is not yet running usually means the system has not been restarted, or the hardware does not support Virtualization-Based Security.
      remediation:
        - id: grouppolicy
          desc: |-
            To enable Memory Integrity using Group Policy:

            1. Open the Group Policy Editor and go to **Computer Configuration** > **Administrative Templates** > **System** > **Device Guard** > **Turn on Virtualization Based Security**.
            2. Set the policy to **Enabled**.
            3. Set **Select Platform Security Level** to **Secure Boot**.
            4. Set **Virtualization Based Protection of Code Integrity** to **Enabled with UEFI lock**.
            5. Apply the policy and restart the system.
        - id: powershell
          desc: |-
            Memory Integrity rides on Virtualization-Based Security, so turning it on means enabling VBS as well. Set all three Device Guard policy values under `HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard`, which is the key the Group Policy setting above writes, then restart:

            ```powershell
            $p = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
            New-Item -Path $p -Force | Out-Null
            New-ItemProperty -Path $p -Name 'EnableVirtualizationBasedSecurity' -Value 1 -PropertyType DWord -Force
            New-ItemProperty -Path $p -Name 'RequirePlatformSecurityFeatures' -Value 1 -PropertyType DWord -Force
            New-ItemProperty -Path $p -Name 'HypervisorEnforcedCodeIntegrity' -Value 1 -PropertyType DWord -Force
            ```

            `HypervisorEnforcedCodeIntegrity` takes `1` for enabled with UEFI lock and `2` for enabled without lock. Choose `2` if you need to be able to turn Memory Integrity back off remotely. `RequirePlatformSecurityFeatures` takes `1` for Secure Boot and `3` for Secure Boot with DMA protection; `3` leaves VBS off entirely on hardware without an IOMMU.
        - id: ansible
          desc: |-
            To enable Memory Integrity with Ansible, set the three Device Guard policy values that the Group Policy setting writes:

            ```yaml
            - name: Enable Virtualization Based Security
              ansible.windows.win_regedit:
                path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
                name: EnableVirtualizationBasedSecurity
                data: 1
                type: dword
              notify: reboot

            - name: Require Secure Boot as the platform security level
              ansible.windows.win_regedit:
                path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
                name: RequirePlatformSecurityFeatures
                data: 1
                type: dword
              notify: reboot

            - name: Enable HVCI (Memory Integrity)
              ansible.windows.win_regedit:
                path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
                name: HypervisorEnforcedCodeIntegrity
                data: 1
                type: dword
              notify: reboot
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            This setting takes effect after the next restart. Use this Chef Infra recipe code to set the Device Guard policy values that back this policy, including the Virtualization-Based Security values Memory Integrity depends on:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard' do
              values [
                { name: 'EnableVirtualizationBasedSecurity', type: :dword, data: 1 },
                { name: 'RequirePlatformSecurityFeatures', type: :dword, data: 1 },
                { name: 'HypervisorEnforcedCodeIntegrity', type: :dword, data: 1 },
              ]
              recursive true
              action :create
            end
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity
        title: Enable memory integrity
  - uid: mondoo-windows-security-credential-guard-enabled
    filters: |
      asset.family.contains('windows')
    title: Ensure Credential Guard is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-a-2-i-authorization
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-i
      compliance/nist-csf-1: nist-csf-1-pr-ac-1
      compliance/nist-csf-2: nist-csf-2-pr-aa-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-5
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-10
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-1
    mql: |
      [1, 2].contains( windows.deviceGuard.credentialGuardConfig )
    docs:
      desc: |-
        This check verifies that Windows Defender Credential Guard is enabled.

        Credential Guard moves derived credentials out of LSASS into a virtualization-based container that the operating system cannot read, even with kernel privileges. The check reads the Device Guard configuration and requires that Credential Guard is enabled.

        **Why this matters**

        Credential theft from memory is the mechanism behind most lateral movement on Windows. An attacker with administrative access to one machine reads LSASS, obtains NTLM hashes and Kerberos ticket-granting tickets for everyone who has logged on, and uses them to authenticate elsewhere without ever knowing a password.

        Credential Guard breaks that at the root. The secrets are held by an isolated process running under the hypervisor, in memory the normal operating system has no access to. Authentication still works, because the isolated process performs the cryptographic operations on request, but the material itself never enters a space an attacker can read.

        The practical effect is that compromising a machine stops automatically yielding credentials for other machines. That is the property that turns a single compromised host into a domain-wide incident, and this is the control that removes it.

        It requires virtualization-based security and UEFI, and it blocks legacy protocols that need the credentials themselves, including NTLMv1, unconstrained Kerberos delegation, and WDigest. Those should be retired regardless.
      audit: |-
        ### Audit via Group Policy

        1. Open the Local Group Policy Editor (`gpedit.msc`).
        2. Navigate to **Computer Configuration** > **Administrative Templates** > **System** > **Device Guard** > **Turn on Virtualization Based Security**.
        3. Confirm **Credential Guard Configuration** is set to **Enabled with UEFI lock** or **Enabled without lock**.

        ### Audit via PowerShell

        1. Read the Device Guard policy value that the Group Policy setting writes:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard' -Name 'LsaCfgFlags'
           ```

        The system passes when `LsaCfgFlags` is `1` for enabled with UEFI lock, or `2` for enabled without lock. It fails when the value is missing or set to `0`.

        2. Confirm that the configured policy is in effect on the running system:

           ```powershell
           (Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard).SecurityServicesRunning
           ```

        A returned service list that includes `1` confirms Credential Guard is running. A configured policy that is not yet running usually means the system has not been restarted, or the hardware does not support Virtualization-Based Security.
      remediation:
        - id: grouppolicy
          desc: |-
            To enable Credential Guard using Group Policy:

            1. Open the Group Policy Editor and go to **Computer Configuration** > **Administrative Templates** > **System** > **Device Guard** > **Turn on Virtualization Based Security**.
            2. Set the policy to **Enabled**.
            3. Set **Select Platform Security Level** to **Secure Boot**.
            4. Set **Credential Guard Configuration** to **Enabled with UEFI lock**.
            5. Apply the policy and restart the system.
        - id: powershell
          desc: |-
            Credential Guard rides on Virtualization-Based Security, so turning it on means enabling VBS as well. Set all three Device Guard policy values under `HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard`, which is the key the Group Policy setting above writes, then restart:

            ```powershell
            $p = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard'
            New-Item -Path $p -Force | Out-Null
            New-ItemProperty -Path $p -Name 'EnableVirtualizationBasedSecurity' -Value 1 -PropertyType DWord -Force
            New-ItemProperty -Path $p -Name 'RequirePlatformSecurityFeatures' -Value 1 -PropertyType DWord -Force
            New-ItemProperty -Path $p -Name 'LsaCfgFlags' -Value 1 -PropertyType DWord -Force
            ```

            `LsaCfgFlags` takes `1` for enabled with UEFI lock and `2` for enabled without lock. Choose `2` if you need to be able to turn Credential Guard back off remotely, because a UEFI lock can only be cleared from the firmware. Enable Credential Guard before the device joins a domain; if it is turned on afterwards, the user and device secrets may already have been exposed.
        - id: ansible
          desc: |-
            To enable Credential Guard with Ansible, set the three Device Guard policy values that the Group Policy setting writes:

            ```yaml
            - name: Enable Virtualization Based Security
              ansible.windows.win_regedit:
                path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
                name: EnableVirtualizationBasedSecurity
                data: 1
                type: dword
              notify: reboot

            - name: Require Secure Boot as the platform security level
              ansible.windows.win_regedit:
                path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
                name: RequirePlatformSecurityFeatures
                data: 1
                type: dword
              notify: reboot

            - name: Enable Credential Guard
              ansible.windows.win_regedit:
                path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
                name: LsaCfgFlags
                data: 1
                type: dword
              notify: reboot
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            This setting takes effect after the next restart. Use this Chef Infra recipe code to set the Device Guard policy values that back this policy, including the Virtualization-Based Security values Credential Guard depends on:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard' do
              values [
                { name: 'EnableVirtualizationBasedSecurity', type: :dword, data: 1 },
                { name: 'RequirePlatformSecurityFeatures', type: :dword, data: 1 },
                { name: 'LsaCfgFlags', type: :dword, data: 1 },
              ]
              recursive true
              action :create
            end
            ```
    refs:
      - url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/configure
        title: Configure Credential Guard
  # No Group Policy / PowerShell / Ansible remediation: Secure Boot is a UEFI firmware setting that cannot be toggled from the running OS; it is enabled in firmware (or the hypervisor for a VM), so only a manual firmware method applies.
  - uid: mondoo-windows-security-secure-boot-enabled
    filters: |
      asset.family.contains('windows')
    title: Ensure Secure Boot is enabled
    impact: 70
    tags:
      compliance/bsi-sys-1-5: bsi-sys-1-5-a3
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-ivs-04
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-c-1-integrity
      compliance/iso-27001-2022: iso-27001-2022-a-8-9
      compliance/nis-2: nis-2-21-2-e
      compliance/nist-csf-1: nist-csf-1-pr-ds-6
      compliance/nist-csf-2: nist-csf-2-pr-ps-01
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-si-7
      compliance/nist-sp-800-171: nist-sp-800-171--3-4-2
      compliance/owasp-top-10-2025: owasp-top-10-2025-a08
      compliance/pci-dss-4: pcidss-requirement-2-2-6
      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-3
    mql: |
      machine.secureboot.enabled == true
    docs:
      desc: |-
        This check verifies that UEFI Secure Boot is enabled, so the firmware validates the signature of the bootloader and kernel before running them.

        The check reads the machine's Secure Boot state, which must be enabled.

        **Why this matters**

        Secure Boot establishes the first link in the chain of trust. Firmware verifies the bootloader, the bootloader verifies the kernel, and the kernel verifies drivers, so every stage is checked by one that has already been validated.

        Without it, that chain starts with something unverified. An attacker who can write to the boot path installs a bootkit, which loads before Windows and therefore before any security software, driver signing enforcement, or logging exists to observe it. Code positioned there can disable protections as the operating system initializes and remain invisible to everything running afterward, because everything running afterward depends on components it controls.

        That persistence also survives the usual remediation. Reinstalling the operating system does not remove code living in the boot path, so a machine that appears rebuilt is still compromised.

        Secure Boot is also a prerequisite for the protections above it. Credential Guard and memory integrity both depend on a verified boot path, since a compromised bootloader can undermine the hypervisor those features rely on.
      audit: |-
        ### Audit via PowerShell

        1. Query the Secure Boot state:

           ```powershell
           Confirm-SecureBootUEFI
           ```

        If the command returns `True`, Secure Boot is enabled and the check passes. If it returns `False`, or reports that the system is in setup mode, the check fails. (On BIOS/legacy-boot systems the cmdlet raises an error, indicating Secure Boot is not in effect.)
      remediation:
        - id: gui
          desc: |-
            To enable Secure Boot in UEFI firmware:

            1. Restart the system and enter the UEFI firmware setup (typically by pressing a key such as F2, F10, or Del during boot).
            2. Locate the **Secure Boot** option, usually under a **Boot** or **Security** menu.
            3. Ensure the system is in **UEFI** boot mode (not Legacy/CSM), then set **Secure Boot** to **Enabled**.
            4. Save changes and exit. For a virtual machine, enable Secure Boot in the hypervisor's firmware/boot settings instead.
        # No Group Policy / PowerShell / Ansible remediation: Secure Boot is enabled in UEFI firmware and cannot be turned on from the running operating system.
        # No Chef Infra remediation: Secure Boot is a UEFI firmware setting changed before the operating system loads, so no converge step can reach it.
    refs:
      - url: https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/oem-secure-boot
        title: Secure Boot
