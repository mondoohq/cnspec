        Events recorded include 4778 and 4779 for session reconnect and disconnect, 4800 and 4801 for workstation lock and unlock, and 4649 for a detected replay attack.

        **Why this matters**

        The Remote Desktop events are the reason to enable this. Reconnecting to an existing disconnected session does not generate a new logon event, so an attacker who takes over a session another user left disconnected produces nothing in the Logon subcategory at all. Events 4778 and 4779 are the only record of it.

