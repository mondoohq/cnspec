      desc: |-
        This check verifies that the **System Integrity** audit subcategory is set to **Success and Failure**.

        The subcategory records violations of the integrity of the security subsystem, including code integrity failures, audit queue exhaustion, and invalid use of local procedure call ports. The check reads the effective audit policy for the subcategory.

        Events recorded include 5038 for an invalid image hash, 4612 for audit queue exhaustion, 4615 for invalid LPC port use, and 6281 for invalid page hashes.

        **Why this matters**

        The code integrity events are the significant ones. Event 5038 fires when the hash of an image file does not match its signature, which means a driver or system binary has been modified since it was signed. On a healthy system this does not happen, and when it does the explanations are disk corruption or deliberate tampering.

        That matters most for drivers, since a driver runs in the kernel and can hide processes, files, and network connections from every tool an administrator would use to investigate. A code integrity failure is frequently the only warning that something is attempting to load at that level.

        The audit queue exhaustion event is a second concern of its own kind: it means events were generated faster than they could be written, so records were dropped. Any gap in the audit trail matters, and this event is what distinguishes a gap caused by load from a gap caused by someone turning auditing off.
