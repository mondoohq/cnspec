      desc: |-
        This check verifies that Remote Desktop does not map the client's drives into the remote session.

        The check reads the Remote Desktop drive redirection setting, which must be set to disallow redirection.

        **Why this matters**

        Drive redirection is the most consequential of the redirection settings, because it makes the client's local filesystem a mounted drive inside the server session, readable and writable in both directions.

        Outbound, that is an unmonitored exfiltration path. A user or an attacker in the session copies files from the server to the client's drive, and nothing on the network sees a file transfer, because the data travels inside the Remote Desktop protocol stream alongside the screen updates.

        Inbound is equally serious. It lets an attacker bring tooling onto the server directly from their own machine, bypassing the application allowlists, download restrictions, and mail and web filtering that would otherwise stand between a payload and a server.

        The client in this relationship is frequently the less trusted machine. A jump server exists to be a controlled boundary, and drive redirection puts a hole straight through it.

        Where files genuinely need to move, use a managed transfer path that authenticates, logs, and can be inspected.
