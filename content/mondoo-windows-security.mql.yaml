      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\pku2u', name: 'AllowOnlineID' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that the machine does not accept PKU2U authentication requests from online identities.

        PKU2U is the protocol that lets two devices authenticate each other directly using online identities, without a domain controller or a shared directory. The check reads `AllowOnlineID` under `HKLM\System\CurrentControlSet\Control\Lsa\pku2u`, which must be `0`.

        **Why this matters**

        PKU2U creates an authentication path that bypasses the domain entirely. Two machines establish trust between themselves, with no domain controller involved, which means none of the controls that operate at the domain level apply to it: no Group Policy authentication settings, no domain account lockout, no central authentication logging.

        That makes it useful for moving between machines without touching the systems an organization monitors. Authentication that never reaches a domain controller does not appear in the place defenders look for authentication.

        The feature exists for peer-to-peer scenarios, principally sharing between devices that are not domain-joined. On a domain-joined server or workstation there is no reason for it, since every authentication should be going through the domain.

        Disabling it removes an alternative trust path that provides nothing on a managed machine and that is invisible to domain-level monitoring.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\pku2u`.
        3. Inspect the `AllowOnlineID` value.

        The system passes when `AllowOnlineID` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa\pku2u' -Name 'AllowOnlineID'
           ```

        The system passes when `AllowOnlineID` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network Security: Allow PKU2U authentication requests to this computer to use online identities
            ```

            **Impact:**

            None - this is the default configuration for domain-joined computers.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa\pku2u'
            $Name         = 'AllowOnlineID'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable PKU2U online identity authentication
              hosts: windows
              tasks:
                - name: Set AllowOnlineID to 0
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa\pku2u
                    name: AllowOnlineID
                    data: 0
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `AllowOnlineID` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa\pku2u' do
              values [{
                name: 'AllowOnlineID',
                type: :dword,
                data: 0,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-security-configure-encryption-types-allowed-for-kerberos-is-set-to-aes12
    title: "Ensure Kerberos encryption types are limited to AES and newer"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters', name: 'SupportedEncryptionTypes' ).data == 2147483640
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that Kerberos uses only AES encryption, with the legacy DES and RC4 types removed.

        The check reads `SupportedEncryptionTypes` under `HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters`, which must be `2147483640`. That value selects AES128, AES256, and future encryption types while clearing the bits for DES and RC4.

        **Why this matters**

        Removing RC4 is what defeats Kerberoasting, one of the most productive attacks against Active Directory.

        The attack works like this. Any authenticated user may request a service ticket for any service account, and Kerberos returns that ticket encrypted with a key derived from the service account's password. When the ticket is encrypted with RC4, the key is the account's NTLM hash, and the attacker takes the ticket away and cracks it offline at whatever rate their hardware allows. There is no failed logon, no lockout, and no rate limit, because from the domain's point of view nothing failed. Service accounts frequently have old passwords that were never rotated, which is why this succeeds so often.

        AES-encrypted tickets use a key derived through a much slower function with a per-account salt, which makes the same offline attack impractical rather than routine.

        DES was broken long ago and should never be present.

        Test before applying. Older applications and appliances, and trusts with legacy domains, sometimes still require RC4, and each of those is worth identifying and fixing rather than leaving the weakness in place estate-wide.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters`.
        3. Inspect the `SupportedEncryptionTypes` value.

        The system passes when `SupportedEncryptionTypes` is set to `2147483640`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters' -Name 'SupportedEncryptionTypes'
           ```

        The system passes when `SupportedEncryptionTypes` is set to `2147483640`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `AES128_HMAC_SHA1, AES256_HMAC_SHA1, Future encryption types`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Configure encryption types allowed for Kerberos
            ```

            **Impact:**

            If not selected, the encryption type will not be allowed. This setting may affect compatibility with client computers or services and applications. Multiple selections are permitted.

            **Note:**
            Some legacy applications and OSes may still require `RC4_HMAC_MD5`
            \- we recommend you test in your environment and verify whether you can safely remove it.

            **Note #2:**
            Windows Vista and below allow DES for Kerberos by default, but later OS versions do not.

            **Note #3:**
            Some prerequisites might need to be met on Domain Controllers to support Kerberos AES 128 and 256 bit encryption types, as well as enabling support for Kerberos AES 128 and 256 bit on user accounts (in account options) for this recommendation to work correctly.

            **Note #4:**
            If your organization uses Azure Files, please note that Microsoft did not introduce AES 256 Kerberos encryption support for it until AD DS authentication module v0.2.2. Please see this link for more information:

            [Azure Files on-premises AD DS Authentication support for AES 256 Kerberos encryption \| Microsoft Docs](https://learn.microsoft.com/en-us/azure/storage/files/storage-troubleshoot-windows-file-connection-problems#azure-files-on-premises-ad-ds-authentication-support-for-aes-256-kerberos-encryption)
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            The value `2147483640` is a bitmask that enables AES128_HMAC_SHA1 (8), AES256_HMAC_SHA1 (16), and the reserved future encryption types (2147483616). It excludes the legacy DES and RC4 types. Before you enforce this, confirm that your domain controllers and user accounts support AES Kerberos encryption, because removing RC4 while a dependency remains can break Kerberos authentication. Test in a pilot group first.

            ```powershell
            $RegistryPath = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
            $Name         = 'SupportedEncryptionTypes'
            $Value        = '2147483640'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            The value `2147483640` is a bitmask that enables AES128_HMAC_SHA1 (8), AES256_HMAC_SHA1 (16), and the reserved future encryption types (2147483616). It excludes the legacy DES and RC4 types. Before you enforce this, confirm that your domain controllers and user accounts support AES Kerberos encryption, because removing RC4 while a dependency remains can break Kerberos authentication. Test in a pilot group first.

            ```yaml
            - name: Limit Kerberos encryption types to AES and newer
              hosts: windows
              tasks:
                - name: Set SupportedEncryptionTypes to 2147483640
                  ansible.windows.win_regedit:
                    path: HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters
                    name: SupportedEncryptionTypes
                    data: 2147483640
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `SupportedEncryptionTypes` registry value that backs this policy to `2147483640`:

            ```ruby
            registry_key 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters' do
              values [{
                name: 'SupportedEncryptionTypes',
                type: :dword,
                data: 2147483640,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-security-do-not-store-lan-manager-hash-value-on-next-password-change
    title: "Ensure LAN Manager hash value is not stored on password change"
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'NoLMHash' ).data == 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that Windows does not store the LAN Manager hash of passwords.

        The check reads `NoLMHash` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `1`. The change takes effect for each account at its next password change.

        **Why this matters**

        The LM hash is not a modern password hash and does not resist attack in any meaningful way. Its construction dates from the 1980s and has three fatal properties: the password is converted to uppercase before hashing, so case is discarded entirely; it is split into two seven-character halves hashed independently, so a fourteen-character password is attacked as two seven-character passwords rather than one long one; and there is no salt, so precomputed tables apply directly.

        The practical effect is that any password stored as an LM hash falls in minutes on ordinary hardware, regardless of how carefully it was chosen. A user who selects a strong fourteen-character password receives no benefit from it.

        Because the hash sits alongside the NT hash in the same account database, an attacker who obtains either obtains both, and they will attack the weak one.

        Setting this value stops the LM hash being stored going forward. Existing hashes remain until each account's password is changed, so a password reset cycle is needed to clear them from an estate that has been running without it.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `NoLMHash` value.

        The system passes when `NoLMHash` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'NoLMHash'
           ```

        The system passes when `NoLMHash` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Do not store LAN Manager hash value on next password change
            ```

            **Impact:**

            None - this is the default behavior. Earlier operating systems such as Windows 95, Windows 98, and Windows ME as well as some third-party applications will fail.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'NoLMHash'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable LAN Manager hash storage
              hosts: windows
              tasks:
                - name: Set NoLMHash to 1
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: NoLMHash
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `NoLMHash` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'NoLMHash',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-security-lan-manager-authentication-level-is-set-to-send-ntlmv2-response
    title: "Ensure LAN Manager auth is set to NTLMv2 only, refuse LM/NTLM"
    impact: 90
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa', name: 'LmCompatibilityLevel' ).data == 5
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that the machine sends only NTLMv2 responses and refuses LM and NTLMv1 authentication entirely.

        The check reads `LmCompatibilityLevel` under `HKLM\System\CurrentControlSet\Control\Lsa`, which must be `5`. That level sends NTLMv2 only and, as a server, rejects both LM and NTLMv1.

        **Why this matters**

        LM and NTLMv1 are broken in ways that cannot be configured around.

        An NTLMv1 challenge and response pair can be captured from the network and converted to the account's NT hash by anyone willing to run the computation, because the algorithm splits the key into pieces small enough to attack independently. The password itself is not needed afterward: the hash is sufficient to authenticate. LM is weaker still.

        That turns any position on the network path into credential theft. An attacker who can induce a machine to authenticate to them, which coercion techniques make straightforward, captures a response and derives a credential that works elsewhere.

        Level `5` matters in both directions. Sending only NTLMv2 protects this machine's own credentials in transit; refusing LM and NTLMv1 as a server prevents an attacker from downgrading a client to the weaker protocol and harvesting its response.

        Verify that no remaining system requires the older protocols before applying this. Where one does, that system is the problem to solve.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa`.
        3. Inspect the `LmCompatibilityLevel` value.

        The system passes when `LmCompatibilityLevel` is set to `5`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa' -Name 'LmCompatibilityLevel'
           ```

        The system passes when `LmCompatibilityLevel` is set to `5`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to: `Send NTLMv2 response only. Refuse LM & NTLM`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: LAN Manager authentication level
            ```

            **Impact:**

            Clients use NTLMv2 authentication only and use NTLMv2 session security if the server supports it; Domain Controllers refuse LM and NTLM (accept only NTLMv2 authentication). Clients that do not support NTLMv2 authentication will not be able to authenticate in the domain and access domain resources by using LM and NTLM.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Warning:**

            Setting `LmCompatibilityLevel` to `5` refuses LM and NTLM authentication and accepts only NTLMv2. This can break authentication for legacy clients and applications across the domain. Test the change in a pilot group first and confirm that no systems still depend on LM or NTLM before you enforce it broadly.

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa'
            $Name         = 'LmCompatibilityLevel'
            $Value        = '5'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Warning:**

            Setting `LmCompatibilityLevel` to `5` refuses LM and NTLM authentication and accepts only NTLMv2. This can break authentication for legacy clients and applications across the domain. Test the change in a pilot group first and confirm that no systems still depend on LM or NTLM before you enforce it broadly.

            ```yaml
            - name: Set LAN Manager authentication to NTLMv2 only
              hosts: windows
              tasks:
                - name: Set LmCompatibilityLevel to 5
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa
                    name: LmCompatibilityLevel
                    data: 5
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `LmCompatibilityLevel` registry value that backs this policy to `5`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa' do
              values [{
                name: 'LmCompatibilityLevel',
                type: :dword,
                data: 5,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-security-ldap-client-signing-requirements-is-set-to-negotiate-signing
    title: "Ensure LDAP client signing is set to 'Negotiate signing' or higher"
    impact: 40
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LDAP', name: 'LDAPClientIntegrity' ).data >= 1
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that the LDAP client requests signing on directory connections rather than accepting an unsigned session.

        The check reads `LDAPClientIntegrity` under `HKLM\System\CurrentControlSet\Services\LDAP`, which must be `1` or higher, meaning signing is negotiated or required.

        **Why this matters**

        LDAP carries authentication data and directory queries, and an unsigned LDAP session has no integrity protection. An attacker on the network path can modify both the queries and the responses in transit.

        Modifying responses is the interesting direction. Applications ask the directory questions whose answers become authorization decisions: which groups a user belongs to, whether an account is enabled, what a user's attributes are. An attacker who can rewrite those answers controls the decision that follows, without needing to compromise either endpoint.

        Unsigned LDAP is also the enabling condition for relay attacks against Active Directory. An attacker who coerces a machine into authenticating to them forwards that authentication to a domain controller over LDAP, and where the session is unsigned the domain controller accepts it. That has been used to grant domain-wide privileges, and signing is what breaks the chain.

        Negotiate signing is the compatible setting and is a floor rather than a target. Require signing is stronger and appropriate once it is confirmed that every client can negotiate it.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LDAP`.
        3. Inspect the `LDAPClientIntegrity` value.

        The system passes when `LDAPClientIntegrity` is `1` or greater. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Services\LDAP' -Name 'LDAPClientIntegrity'
           ```

        The system passes when `LDAPClientIntegrity` is `1` or greater. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Negotiate signing` (configuring to `Require signing`
            also conforms to the benchmark):

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: LDAP client signing requirements
            ```

            **Impact:**

            None - this is the default behavior. However, if you choose instead to configure the server to _require_LDAP signatures then you must also configure the client.
            If you do not configure the client it will not be able to communicate with the server, which could cause many features to fail, including user authentication,
            Group Policy, and logon scripts, because the caller will be told that the LDAP BIND command request failed.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Services\LDAP'
            $Name         = 'LDAPClientIntegrity'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Set LDAP client signing requirements
              hosts: windows
              tasks:
                - name: Set LDAPClientIntegrity to 1 or greater
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Services\LDAP
                    name: LDAPClientIntegrity
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `LDAPClientIntegrity` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Services\LDAP' do
              values [{
                name: 'LDAPClientIntegrity',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
  - uid: mondoo-windows-security-network-security-minimum-session-security-for-ntlm-ssp-based-servers-is-set-to-ntlmv2
    title: "Ensure NTLM SSP server requires NTLMv2 and 128-bit encryption"
    impact: 80
    tags:
      compliance/bsi-sys-1-5: false
      compliance/csa-cloud-controls-matrix-4: cloud-controls-matrix-4-iam-02
      compliance/dora: dora-art-9
      compliance/hipaa: hipaa-security-ss164-312-d-person-or-entity-authentication
      compliance/iso-27001-2022: iso-27001-2022-a-8-5
      compliance/nis-2: nis-2-21-2-j
      compliance/nist-csf-1: nist-csf-1-pr-ac-7
      compliance/nist-csf-2: nist-csf-2-pr-aa-03
      compliance/nist-sp-800-53-rev5: nist-sp-800-53-rev5-ia-2
      compliance/nist-sp-800-171: nist-sp-800-171--3-5-3
      compliance/owasp-top-10-2025: owasp-top-10-2025-a07
      compliance/pci-dss-4: pcidss-requirement-8-3-1
      compliance/soc2-2017: soc2-control-cc6-1-4
      compliance/vda-isa-5: vda-isa-5-4-1-3
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\MSV1_0', name: 'NTLMMinServerSec' ).data == 537395200
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/
          title: Windows Firewall
      desc: |-
        This check verifies that, when acting as a server, the machine requires NTLMv2 session security and 128-bit encryption for NTLM-authenticated sessions.

        The check reads `NTLMMinServerSec` under `HKLM\System\CurrentControlSet\Control\Lsa\MSV1_0`, which must be `537395200`. That value combines the requirement for NTLMv2 session security with the requirement for 128-bit encryption.

        **Why this matters**

        Authenticating with NTLMv2 and protecting the session afterward are two separate things, and this setting governs the second.

        Without it, a client can complete NTLMv2 authentication and then negotiate a session with weak or absent signing and encryption. Everything exchanged after the credential check travels without integrity protection, so an attacker on the path can read the contents and modify them in flight. The authentication was strong and the conversation it protected was not.

        The absence of signing in particular is what makes relay attacks work. A session an attacker can modify is a session they can insert themselves into, which is the mechanism behind the NTLM relay techniques used routinely against Windows estates.

        Requiring both NTLMv2 session security and 128-bit encryption ensures that a connection which authenticated properly is also protected properly. Set the matching client value as well, since a session is only as protected as the weaker of the two ends will accept.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\MSV1_0`.
        3. Inspect the `NTLMMinServerSec` value.

        The system passes when `NTLMMinServerSec` is set to `537395200`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Lsa\MSV1_0' -Name 'NTLMMinServerSec'
           ```

        The system passes when `NTLMMinServerSec` is set to `537395200`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Require NTLMv2 session security, Require 128-bit encryption`:

            ```text
            Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\Security Options\\Network security: Minimum session security for NTLM SSP based (including secure RPC) servers
            ```

            **Impact:**

            NTLM connections will fail if NTLMv2 protocol and strong encryption (128-bit) are not **both**
            negotiated. Server applications that are enforcing these settings will be unable to communicate with older servers that do not support them.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            **Note:**

            The value `537395200` is a bitmask that combines `NTLMv2 session security required` (0x00080000) and `128-bit encryption required` (0x20000000). It maps to the policy state `Require NTLMv2 session security, Require 128-bit encryption`.

            ```powershell
            $RegistryPath = 'HKLM:\System\CurrentControlSet\Control\Lsa\MSV1_0'
            $Name         = 'NTLMMinServerSec'
            $Value        = '537395200'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            **Note:**

            The value `537395200` is a bitmask that combines `NTLMv2 session security required` (0x00080000) and `128-bit encryption required` (0x20000000). It maps to the policy state `Require NTLMv2 session security, Require 128-bit encryption`.

            ```yaml
            - name: Set NTLM SSP server minimum security
              hosts: windows
              tasks:
                - name: Set NTLMMinServerSec to 537395200
                  ansible.windows.win_regedit:
                    path: HKLM:\System\CurrentControlSet\Control\Lsa\MSV1_0
                    name: NTLMMinServerSec
                    data: 537395200
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `NTLMMinServerSec` registry value that backs this policy to `537395200`:

            ```ruby
            registry_key 'HKLM\System\CurrentControlSet\Control\Lsa\MSV1_0' do
              values [{
                name: 'NTLMMinServerSec',
                type: :dword,
                data: 537395200,
              }]
              recursive true
              action :create
            end
            ```
