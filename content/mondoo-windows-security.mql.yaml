      windows.rdp.comPortRedirectionDisabled
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/rds-plan-secure
          title: Secure Remote Desktop Services
      desc: |-
        This check verifies that Remote Desktop does not map the client's COM ports into the remote session.

        The check reads the Remote Desktop COM port redirection setting, which must be set to disallow redirection.

        **Why this matters**

        COM port redirection makes serial devices attached to the client available to applications running on the server. Almost nothing in a modern environment needs this, which is the main argument against leaving it on: it is a channel nobody uses and nobody watches.

        The device redirection channels are worth closing as a group. Each is an additional interface between an untrusted client machine and a server session, carrying data that the server's device handling code parses, and that code was written for locally attached hardware rather than for input arriving from a machine an attacker may control.

        An unused redirection channel is also a covert transfer path. Data moved through a serial channel is not something a data loss prevention product or a file audit is positioned to observe.

        Disable the redirection types the environment does not use, and enable specific ones deliberately where an application genuinely requires them.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services`.
        3. Inspect the `fDisableCcm` value.

        The system passes when `fDisableCcm` is set to `1`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fDisableCcm'
           ```

        The system passes when `fDisableCcm` is set to `1`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Enabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Device and Resource Redirection\\Do not allow COM port redirection
            ```

            **Note:**
            This Group Policy path is provided by the Group Policy template `TerminalServer.admx/adml` that is included with all versions of the Microsoft Windows Administrative Templates.

            **Impact:**

            Users in a Remote Desktop Services session will not be able to redirect server data to local (client) COM ports.
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
            $Name         = 'fDisableCcm'
            $Value        = '1'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            ```yaml
            - name: Disable COM port redirection for RDP
              hosts: windows
              tasks:
                - name: Set fDisableCcm to 1 (Enabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
                    name: fDisableCcm
                    data: 1
                    type: dword
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `fDisableCcm` registry value that backs this policy to `1`:

            ```ruby
            registry_key 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' do
              values [{
                name: 'fDisableCcm',
                type: :dword,
                data: 1,
              }]
              recursive true
              action :create
            end
            ```
