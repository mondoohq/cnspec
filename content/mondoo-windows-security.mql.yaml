      asset.platform == "windows"
    mql: |
      windows.auditPolicy.subcategory(name: "Sensitive Privilege Use").success
      windows.auditPolicy.subcategory(name: "Sensitive Privilege Use").failure
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-security-audit-policies
          title: Windows Security Audit Policies
      desc: |-
        This check verifies that the **Sensitive Privilege Use** audit subcategory is set to **Success and Failure**.

        The subcategory records the use of sensitive privileges, which include acting as part of the operating system, backing up and restoring files, creating a token object, debugging programs, loading and unloading device drivers, managing auditing and the security log, taking ownership of objects, and impersonating a client after authentication. The check reads the effective audit policy for the subcategory.

        Events recorded include 4672 for special privileges assigned at logon, 4673 for a privileged service call, and 4674 for an operation on a privileged object.

        **Why this matters**

        These privileges bypass ordinary access control rather than operating within it. `SeBackupPrivilege` reads any file regardless of its permissions, `SeTakeOwnershipPrivilege` seizes any object, `SeDebugPrivilege` opens any process including LSASS, and `SeLoadDriverPrivilege` places code in the kernel. Each is a route to complete control, used by design.

        Auditing their use records the act of bypassing, which is exactly what an attacker with administrative credentials does and what no file-level auditing would show. Reading a protected file through `SeBackupPrivilege` looks like nothing at the object layer.

        Event 4672 fires when a logon session receives these privileges, which effectively marks every administrative logon and is one of the most useful single events for spotting privileged access.

        This subcategory generates substantial volume, which is why this policy also checks that the security log is sized to hold it.
