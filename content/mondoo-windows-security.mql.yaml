      compliance/soc2-2017: soc2-control-cc7-1-1
      compliance/vda-isa-5: vda-isa-5-5-2-1
    mql: |
      registrykey.property( path: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: 'SMB1' ).data == 0
    docs:
      refs:
        - url: https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-security
          title: SMB Security Enhancements
      desc: |-
        This check verifies that the SMBv1 server is disabled, so the machine does not accept inbound connections using SMB version 1.

        The check reads the `SMB1` value under `HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters`, which must be `0`.

        **Why this matters**

        An SMBv1 listener is the single most exploited service in the history of Windows. The vulnerabilities behind EternalBlue were in this code path, and the worms that used them, WannaCry and NotPetya, spread across entire estates in hours and caused losses measured in billions.

        The protocol's design is the deeper problem, independent of any specific vulnerability. SMBv1 has no message signing worth the name, no encryption, and no protection for the dialect negotiation itself, which means a session can be intercepted and modified by anyone on the path. It also permits NTLMv1 authentication, whose exchange can be captured and cracked or relayed to another machine.

        Disabling the server does not affect clients using SMBv2 or SMBv3, which every supported Windows version and every current NAS and Samba release speaks.

        Check for dependencies before disabling. Older multifunction printers scanning to a share, embedded appliances, and legacy applications that hardcode SMBv1 are the usual cases, and each is better addressed by replacing or updating the device than by leaving the protocol enabled estate-wide.
      audit: |
        ### Audit via Registry Editor

        1. Press **Windows + R**, type `regedit`, and press **Enter**.
        2. Navigate to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters`.
        3. Inspect the `SMB1` value.

        The system passes when `SMB1` is set to `0`. It fails if the value is missing or set differently.

        ### Audit via PowerShell

        1. Open an elevated PowerShell session.
        2. Read the value:

           ```powershell
           Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name 'SMB1'
           ```

        The system passes when `SMB1` is set to `0`. It fails if the value is missing or set differently.
      remediation:
        - id: grouppolicy
          desc: |
            **Using Group Policy**

            To establish the recommended configuration via GP, set the following UI path to `Disabled`:

            ```text
            Computer Configuration\\Policies\\Administrative Templates\\MS Security Guide\\Configure SMB v1 server
            ```

            **Note:**
            This Group Policy path does not exist by default. An additional Group Policy template ( `SecGuide.admx/adml` ) is required - it is available from Microsoft at [this link](https://techcommunity.microsoft.com/t5/Microsoft-Security-Baselines/Security-baseline-FINAL-for-Windows-10-v1903-and-Windows-Server/ba-p/701084)

            **Impact:**

            Some legacy OSes such as Windows XP and Server 2003, along with older applications and appliances, may no longer be able to communicate with the system once SMBv1 is disabled. We recommend careful testing be performed to determine the impact prior to configuring this as a widespread control, and where possible, remediate any incompatibilities found with the vendor of the incompatible system. Microsoft is also maintaining a thorough (although not comprehensive) list of known SMBv1 incompatibilities at this link: [SMB1 Product Clearinghouse \| Storage at Microsoft](https://blogs.technet.microsoft.com/filecab/2017/06/01/smb1-product-clearinghouse/)
        - id: powershell
          desc: |
            **Using PowerShell**

            To establish the recommended configuration via PowerShell, run the following commands:

            ```powershell
            $RegistryPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
            $Name         = 'SMB1'
            $Value        = '0'

            # Create the key if it does not exist
            If (-NOT (Test-Path $RegistryPath)) {
                New-Item -Path $RegistryPath -Force | Out-Null
            }

            # Now set the value
            New-ItemProperty -Path $RegistryPath -Name $Name -Value $Value -PropertyType DWORD -Force
            ```
        - id: ansible
          desc: |
            **Using Ansible**

            Use this Ansible playbook to disable SMB v1 server:

            ```yaml
            ---
            - name: Disable SMB v1 server
              hosts: windows
              tasks:
                - name: Set SMB1 to 0 (Disabled)
                  ansible.windows.win_regedit:
                    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
                    name: SMB1
                    data: 0
                    type: dword

                - name: Disable SMB1 Windows Feature
                  ansible.windows.win_optional_feature:
                    name: SMB1Protocol
                    state: absent
            ```
        - id: chef
          desc: |
            **Using Chef Infra**

            Use this Chef Infra recipe code to set the `SMB1` registry value that backs this policy to `0`:

            ```ruby
            registry_key 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' do
              values [{
                name: 'SMB1',
                type: :dword,
                data: 0,
              }]
