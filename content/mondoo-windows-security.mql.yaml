        This check verifies that the **Security Group Management** audit subcategory is set to **Success**.

        The subcategory records the creation, modification, and deletion of security groups, and the addition and removal of their members. The check reads the effective audit policy for the subcategory.

        Events recorded include 4727 through 4737 for global groups, 4754 through 4764 for universal groups, and 4799 for enumeration of a local group.

        **Why this matters**

        Group membership is how privilege is granted on Windows, so this subcategory records privilege being granted and revoked.

        The events that matter most are additions to the groups that confer administrative control: local Administrators, Domain Admins, Enterprise Admins, Backup Operators, and Account Operators. An attacker who has escalated once uses exactly this mechanism to keep that access, because membership in a privileged group survives reboots, password resets, and the removal of whatever they originally exploited.

        The record is also what catches the add-use-remove pattern. An attacker who adds an account to a privileged group, uses it, and removes it leaves a directory that looks untouched afterward. The pair of events showing the addition and the removal is the only surviving evidence.

        Group deletion events matter for a different reason, since removing a group can silently strip access that other controls depend on.
