        The check reads the Remote Desktop Plug and Play device redirection setting, which must be set to disallow redirection.

        **Why this matters**

        Plug and Play redirection allows devices attached to the client, including cameras, media players, and portable storage that presents as a PnP device, to appear inside the server session.

        The device driver stack is the concern. Redirection causes the server to handle device descriptors and data originating from a machine the server does not control, in code paths written on the assumption that hardware is physically attached and therefore at least as trusted as the machine itself. A malicious or malformed device on the client side reaches that code across the network.

        It also reopens the storage path that drive redirection closes. Storage that enumerates as a Plug and Play device can carry files into and out of the session regardless of the drive redirection setting.

        Disable it unless a specific application requires a specific device class, in which case enable that class narrowly rather than permitting redirection generally.
