      desc: |-
        This check verifies that the **Application Group Management** audit subcategory is set to **Success and Failure**.

        The subcategory records the creation, modification, and deletion of application groups used by Authorization Manager. The check reads the effective audit policy for the subcategory.

        Events recorded include 4783 through 4789 for group creation, modification, and deletion.

        **Why this matters**

        Application groups are an authorization mechanism separate from Windows security groups. Where an application uses them, membership in one grants access to application functions, so changes to them are privilege changes that no review of Windows group membership would surface.

        The value of auditing them on a typical server is that the events should essentially never appear. Authorization Manager is not used by most environments, so any activity here is either an application nobody documented or something manipulating an authorization store, and both are worth a look.

        Where the events are absent because the feature is unused, the setting costs nothing. Where they are present, they are the only record of a set of permissions that exists outside the usual access review.
