packs:
  - uid: mondoo-asset-inventory-aws
    name: AWS Asset Inventory Pack
    version: 1.4.0
    license: BUSL-1.1
    require:
      - provider: aws
    authors:
      - name: Mondoo, Inc
        email: hello@mondoo.com
    tags:
      mondoo.com/platform: aws,cloud
      mondoo.com/category: best-practices
    summary: Inventory AWS accounts, EC2, S3, IAM, and more
    docs:
      desc: |
        Inventories an AWS account: IAM users, groups, roles, and policies; VPCs and subnets; EC2, EBS, RDS, S3, EKS, and Lambda resources; and load balancers, Elastic IPs, ACM certificates, CloudTrail trails, and WAF web ACLs.

        Enable this query pack in [Mondoo Platform](https://mondoo.com/platform) to automatically inventory your AWS accounts, or scan an account manually with cnspec:

        ```bash
        cnspec scan aws -f mondoo-aws-inventory.mql.yaml
        ```
    groups:
      - uid: mondoo-asset-inventory-aws-general-group
        title: AWS General
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-account-id
          - uid: mondoo-asset-inventory-aws-enabled-regions
      - uid: mondoo-asset-inventory-aws-iam-group
        title: AWS IAM
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-iam-users
          - uid: mondoo-asset-inventory-aws-iam-groups
          - uid: mondoo-asset-inventory-aws-iam-roles
          - uid: mondoo-asset-inventory-aws-iam-policies
          - uid: mondoo-asset-inventory-aws-iam-role-permissions
      - uid: mondoo-asset-inventory-aws-vpc-group
        title: AWS VPC
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-vpcs
          - uid: mondoo-asset-inventory-aws-vpc-subnets
      - uid: mondoo-asset-inventory-aws-ec2-group
        title: Amazon EC2
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-ec2-security-groups
          - uid: mondoo-asset-inventory-aws-ec2-security-group-rules
          - uid: mondoo-asset-inventory-aws-ec2-volumes
          - uid: mondoo-asset-inventory-aws-ec2-retrieve-all-data
          - uid: mondoo-asset-inventory-aws-ec2-instances-exposure
          - uid: mondoo-asset-inventory-aws-ec2-instance-profiles
          - uid: mondoo-asset-inventory-aws-eips
      - uid: mondoo-asset-inventory-aws-elb-group
        title: Elastic Load Balancing
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-elb-loadbalancers
      - uid: mondoo-asset-inventory-aws-rds-group
        title: Amazon RDS
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-rds-dbclusters-all-data
          - uid: mondoo-asset-inventory-aws-rds-dbinstances-all-data
          - uid: mondoo-asset-inventory-aws-rds-dbinstances-network
          - uid: mondoo-asset-inventory-aws-rds-dbcluster-maintenance
          - uid: mondoo-asset-inventory-aws-rds-dbcluster-recommendations
          - uid: mondoo-asset-inventory-aws-rds-dbinstance-maintenance
          - uid: mondoo-asset-inventory-aws-rds-dbinstance-recommendations
      - uid: mondoo-asset-inventory-aws-s3-group
        title: Amazon S3 Bucket
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-s3-retrieve-all-data
          - uid: mondoo-asset-inventory-aws-s3-bucket-access
      - uid: mondoo-asset-inventory-aws-eks-group
        title: Amazon EKS Cluster
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-eks-clusters
          - uid: mondoo-asset-inventory-aws-eks-cluster-access
      - uid: mondoo-asset-inventory-aws-lambda-group
        title: AWS Lambda Function
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-lambda
      - uid: mondoo-asset-inventory-aws-access-analyzer-group
        title: IAM Access Analyzer
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-access-analyzer
      - uid: mondoo-asset-inventory-aws-acm-group
        title: AWS Certificate Manager
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-acm-certificates
      - uid: mondoo-asset-inventory-aws-cloudtrail-group
        title: AWS CloudTrail
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-cloudtrail-trails
      - uid: mondoo-asset-inventory-aws-waf-group
        title: AWS WAF
        filters: asset.runtime == "aws"
        queries:
          - uid: mondoo-asset-inventory-aws-waf-acls

queries:
  - uid: mondoo-asset-inventory-aws-account-id
    filters: asset.platform == "aws"
    title: AWS account ID
    docs:
      desc: |
        Returns the unique AWS account identifier for the scanned account.
    mql: |
      aws.account.id

  - uid: mondoo-asset-inventory-aws-enabled-regions
    title: Regions enabled in the AWS account
    filters: asset.platform == "aws"
    docs:
      desc: |
        Lists the AWS regions enabled in the account.
    mql: |
      aws { regions }

  - uid: mondoo-asset-inventory-aws-vpcs
    title: VPCs
    docs:
      desc: |
        Returns configuration data for the account's VPCs.
    variants:
      - uid: mondoo-asset-inventory-aws-vpcs-all
      - uid: mondoo-asset-inventory-aws-vpcs-single
  - uid: mondoo-asset-inventory-aws-vpcs-all
    filters: asset.platform == "aws"
    mql: |
      aws.vpcs
  - uid: mondoo-asset-inventory-aws-vpcs-single
    filters: asset.platform == "aws-vpc"
    mql: |
      aws.vpc

  - uid: mondoo-asset-inventory-aws-vpc-subnets
    title: VPC subnets and route tables
    docs:
      desc: |
        Lists VPC subnets with whether they auto-assign public IPs and their route
        table routes (including internet-gateway routes), so public vs. private
        subnet placement can be determined for internet-exposure analysis.
    variants:
      - uid: mondoo-asset-inventory-aws-vpc-subnets-all
      - uid: mondoo-asset-inventory-aws-vpc-subnets-single
  - uid: mondoo-asset-inventory-aws-vpc-subnets-all
    filters: asset.platform == "aws"
    mql: |
      aws.vpcs {
        id
        subnets {
          id
          mapPublicIpOnLaunch
          routeTable {
            id
            routeEntries { destinationCidrBlock gatewayId natGateway state }
          }
        }
      }
  - uid: mondoo-asset-inventory-aws-vpc-subnets-single
    filters: asset.platform == "aws-vpc"
    mql: |
      aws.vpc {
        id
        subnets {
          id
          mapPublicIpOnLaunch
          routeTable {
            id
            routeEntries { destinationCidrBlock gatewayId natGateway state }
          }
        }
      }

  - uid: mondoo-asset-inventory-aws-iam-users
    title: IAM users
    docs:
      desc: |
        Lists the account's IAM users.
    variants:
      - uid: mondoo-asset-inventory-aws-iam-users-all
      - uid: mondoo-asset-inventory-aws-iam-users-single
  - uid: mondoo-asset-inventory-aws-iam-users-all
    filters: asset.platform == "aws"
    mql: |
      aws.iam.users
  - uid: mondoo-asset-inventory-aws-iam-users-single
    filters: asset.platform == "aws-iam-user"
    mql: |
      aws.iam.user

  - uid: mondoo-asset-inventory-aws-iam-groups
    title: IAM groups
    docs:
      desc: |
        Lists the account's IAM groups.
    variants:
      - uid: mondoo-asset-inventory-aws-iam-groups-all
      - uid: mondoo-asset-inventory-aws-iam-groups-single
  - uid: mondoo-asset-inventory-aws-iam-groups-all
    filters: asset.platform == "aws"
    mql: |
      aws.iam.groups
  - uid: mondoo-asset-inventory-aws-iam-groups-single
    filters: asset.platform == "aws-iam-group"
    mql: |
      aws.iam.group

  - uid: mondoo-asset-inventory-aws-iam-roles
    title: IAM roles
    docs:
      desc: |
        Lists the account's IAM roles.
    variants:
      - uid: mondoo-asset-inventory-aws-iam-roles-all
  - uid: mondoo-asset-inventory-aws-iam-roles-all
    filters: asset.platform == "aws"
    mql: |
      aws.iam.roles

  - uid: mondoo-asset-inventory-aws-iam-policies
    title: Attached IAM policies
    filters: asset.platform == "aws"
    docs:
      desc: |
        Lists IAM policies currently attached to a user, group, or role.
    mql: aws.iam.policies.where( attachmentCount > 0 )

  - uid: mondoo-asset-inventory-aws-iam-role-permissions
    title: IAM roles with attached policy permissions
    docs:
      desc: |
        Lists every customer-managed IAM role with the statements of its
        attached and inline policies, its trust posture, and the EC2 instances
        that assume it through an instance profile.

        This is the permissions half of an attack path. Exposure inventories say
        which workloads the internet can reach; this query says what those
        workloads may do once compromised. Wildcard flags are computed per
        policy so a reviewer can separate a genuinely over-broad role from an
        AWS managed service policy that legitimately uses `*` resources.

        Join `usedByInstances` to the EC2 instance exposure query to reach
        instance roles, and join the ARN to the Kubernetes inventory pack's
        service account annotations or to the EKS Pod Identity associations to
        reach pod roles.

        Scoped to the AWS account scan, with no `-single` variant, because
        roles are not discovered as standalone assets.
    variants:
      - uid: mondoo-asset-inventory-aws-iam-role-permissions-all
  - uid: mondoo-asset-inventory-aws-iam-role-permissions-all
    filters: asset.platform == "aws"
    mql: |
      aws.iam.roles.where(isServiceLinked == false) {
        arn
        name
        path
        lastUsedAt
        assumableByPublic
        assumableByExternalAccounts
        permissionsBoundary { arn }
        usedByInstances { instanceId }
        attachedPolicies {
          arn
          name
          hasWildcardAllow
          statements { effect actions resources hasWildcardAction hasWildcardResource }
        }
        inlinePolicyDetails {
          name
          hasWildcardAllow
          statements { effect actions resources hasWildcardAction hasWildcardResource }
        }
      }

  - uid: mondoo-asset-inventory-aws-ec2-security-groups
    title: EC2 Security Groups
    docs:
      desc: |
        Lists the account's EC2 security groups.
    variants:
      - uid: mondoo-asset-inventory-aws-ec2-security-groups-all
      - uid: mondoo-asset-inventory-aws-ec2-security-groups-single
  - uid: mondoo-asset-inventory-aws-ec2-security-groups-all
    filters: asset.platform == "aws"
    mql: |
      aws.ec2.securityGroups
  - uid: mondoo-asset-inventory-aws-ec2-security-groups-single
    filters: asset.platform == "aws-security-group"
    mql: |
      aws.ec2.securitygroup

  - uid: mondoo-asset-inventory-aws-ec2-security-group-rules
    title: Security group ingress rules and attachments
    docs:
      desc: |
        Lists every security group with its ingress rules, resolved to
        protocol, port range, and source, and with the EC2 instances that
        carry the group.

        The plain security group inventory above names the groups; this query
        adds the rules, which is what network reachability analysis needs. Each
        rule reports whether its source includes the public internet, and
        cross-group rules name the peer group and account so east-west paths,
        such as a load balancer group admitting traffic into a database group,
        stay traceable.

        Join `instances` to the EC2 instance exposure query and the group ID to
        the load balancer and RDS network queries to see which resources a rule
        actually opens.
    variants:
      - uid: mondoo-asset-inventory-aws-ec2-security-group-rules-all
      - uid: mondoo-asset-inventory-aws-ec2-security-group-rules-single
  - uid: mondoo-asset-inventory-aws-ec2-security-group-rules-all
    filters: asset.platform == "aws"
    mql: |
      aws.ec2.securityGroups {
        id
        name
        region
        vpc { id }
        isUnused
        instances { instanceId }
        ipPermissions {
          ipProtocol
          fromPort
          toPort
          ipRanges
          ipv6Ranges
          includesPublicSource
          peers { groupId accountId }
        }
      }
  - uid: mondoo-asset-inventory-aws-ec2-security-group-rules-single
    filters: asset.platform == "aws-security-group"
    mql: |
      aws.ec2.securitygroup {
        id
        name
        region
        vpc { id }
        isUnused
        instances { instanceId }
        ipPermissions {
          ipProtocol
          fromPort
          toPort
          ipRanges
          ipv6Ranges
          includesPublicSource
          peers { groupId accountId }
        }
      }

  - uid: mondoo-asset-inventory-aws-ec2-volumes
    title: EBS volumes
    docs:
      desc: |
        Lists the account's EBS volumes.
    variants:
      - uid: mondoo-asset-inventory-aws-ec2-volumes-all
      - uid: mondoo-asset-inventory-aws-ec2-volumes-single
  - uid: mondoo-asset-inventory-aws-ec2-volumes-all
    filters: asset.platform == "aws"
    mql: |
      aws.ec2.volumes
  - uid: mondoo-asset-inventory-aws-ec2-volumes-single
    filters: asset.platform == "aws-ebs-volume"
    mql: |
      aws.ec2.volume

  - uid: mondoo-asset-inventory-aws-ec2-retrieve-all-data
    title: Running EC2 instances
    docs:
      desc: |
        Lists all running EC2 instances (excluding terminated) with their configuration details.
    variants:
      - uid: mondoo-asset-inventory-aws-ec2-retrieve-all-data-all
      - uid: mondoo-asset-inventory-aws-ec2-retrieve-all-data-single
  - uid: mondoo-asset-inventory-aws-ec2-retrieve-all-data-all
    filters: asset.platform == "aws"
    mql: |
      aws.ec2.instances.where(state != "terminated")
  - uid: mondoo-asset-inventory-aws-ec2-retrieve-all-data-single
    filters:
      - mql: asset.platform == "aws-ec2-instance"
      - mql: aws.ec2.instance.state != "terminated"
    mql: |
      aws.ec2.instance

  - uid: mondoo-asset-inventory-aws-ec2-instances-exposure
    title: EC2 instance internet exposure
    docs:
      desc: |
        For every non-terminated EC2 instance, returns its internet-exposure
        analysis: whether it is reachable from the internet, whether it has a
        public IP, whether it sits in a public subnet, the security-group ingress
        rules that open it, and any internet-facing load balancers that front it.

        Scoped to the AWS account scan, with no `-single` variant, because the
        `internetFacingLoadBalancers` field requires enumerating the account's
        load balancers and target groups.
    variants:
      - uid: mondoo-asset-inventory-aws-ec2-instances-exposure-all
  - uid: mondoo-asset-inventory-aws-ec2-instances-exposure-all
    filters: asset.platform == "aws"
    mql: |
      aws.ec2.instances.where(state != "terminated") {
        instanceId
        publicIp
        privateIp
        state
        vpc { id }
        subnet { id mapPublicIpOnLaunch }
        securityGroups { id }
        exposure {
          internetReachable
          hasPublicIp
          inPublicSubnet
          securityGroupAllowsIngress
          networkAclAllowsIngress
          openIngressRules { ipProtocol fromPort toPort ipRanges ipv6Ranges }
          internetFacingLoadBalancers { arn name dnsName }
        }
      }

  - uid: mondoo-asset-inventory-aws-ec2-instance-profiles
    title: EC2 instance IAM profiles
    docs:
      desc: |
        Maps every non-terminated EC2 instance to the IAM instance profile it
        runs under and the roles that profile carries.

        An instance's credentials are the roles of its instance profile, so this
        is the link between a host, including a Kubernetes node, and the AWS
        permissions anything running on that host can exercise. Join the role
        ARN to the `IAM roles with attached policy permissions` query for the
        statements, and the instance ID to the EC2 instance exposure query and
        the Kubernetes inventory pack's node provider IDs for the exposure side.

        Scoped to the AWS account scan, with no `-single` variant, matching the
        instance exposure query above.
    variants:
      - uid: mondoo-asset-inventory-aws-ec2-instance-profiles-all
  - uid: mondoo-asset-inventory-aws-ec2-instance-profiles-all
    filters: asset.platform == "aws"
    mql: |
      aws.ec2.instances.where(state != "terminated") {
        instanceId
        region
        iamInstanceProfile {
          arn
          instanceProfileName
          iamRoles { arn name }
        }
      }

  - uid: mondoo-asset-inventory-aws-eips
    title: Elastic IP addresses
    docs:
      desc: |
        Lists Elastic IP addresses and the instance or network interface they
        are associated with, mapping externally routable public IPs to resources.

        Elastic IPs are enumerated only at the account level, since there is no
        standalone `aws-eip` asset platform, so this query has no `-single`
        variant, matching the ACM and Access Analyzer queries above.
    variants:
      - uid: mondoo-asset-inventory-aws-eips-all
  - uid: mondoo-asset-inventory-aws-eips-all
    filters: asset.platform == "aws"
    mql: |
      aws.ec2.eips {
        publicIp
        attached
        privateIpAddress
        networkInterfaceId
        region
        instance { instanceId }
      }

  - uid: mondoo-asset-inventory-aws-elb-loadbalancers
    title: Load balancers (ALB/NLB/GWLB)
    docs:
      desc: |
        Lists Elastic Load Balancers with their scheme (internet-facing vs.
        internal), listeners, security groups, internet-exposure breakdown, and the
        targets they route to (EC2 instances / Lambda functions / registered IP
        addresses, plus registered instances for classic load balancers).

        Scoped to the AWS account scan (no `-single` variant): target groups and
        their registered targets are enumerated account-wide.

        `ipTargets` matters for container workloads. An `ip`-type target group
        registers pod or task IP addresses rather than instances, so `ec2Targets`
        is empty and the load balancer appears to route nowhere even though it
        fronts live workloads. The registered IPs join to the pod IPs collected by
        the Kubernetes inventory pack, which resolve to a node and its cloud
        instance, so the hosts behind an internet-facing load balancer stay
        attributable.
    variants:
      - uid: mondoo-asset-inventory-aws-elb-loadbalancers-all
  - uid: mondoo-asset-inventory-aws-elb-loadbalancers-all
    filters: asset.platform == "aws"
    mql: |
      aws.elb.loadBalancers {
        arn
        name
        scheme
        elbType
        dnsName
        region
        securityGroups { id }
        listeners { port protocol }
        targetGroups {
          arn
          targetType
          port
          ec2Targets { instanceId }
          lambdaTargets { name }
          ipTargets
        }
        instances { instanceId }
        exposure { internetReachable publiclyAccessible securityGroupAllowsIngress }
      }

  - uid: mondoo-asset-inventory-aws-rds-dbclusters-all-data
    title: RDS database clusters configuration
    docs:
      desc: |
        Lists all RDS database clusters with their configuration for inventory and security review.
    variants:
      - uid: mondoo-asset-inventory-aws-rds-dbclusters-all-data-all
  - uid: mondoo-asset-inventory-aws-rds-dbclusters-all-data-all
    filters: asset.platform == "aws"
    mql: |
      aws.rds.clusters

  - uid: mondoo-asset-inventory-aws-rds-dbinstances-all-data
    title: RDS database instances
    docs:
      desc: |
        Lists all RDS database instances with their configuration for inventory and security review.
    variants:
      - uid: mondoo-asset-inventory-aws-rds-dbinstances-all-data-all
      - uid: mondoo-asset-inventory-aws-rds-dbinstances-all-data-single
  - uid: mondoo-asset-inventory-aws-rds-dbinstances-all-data-all
    filters: asset.platform == "aws"
    mql: |
      aws.rds.instances
  - uid: mondoo-asset-inventory-aws-rds-dbinstances-all-data-single
    filters: asset.platform == "aws-rds-dbinstance"
    mql: |
      aws.rds.dbinstance

  - uid: mondoo-asset-inventory-aws-rds-dbinstances-network
    title: RDS instance network placement and exposure
    docs:
      desc: |
        Reports where each RDS instance sits on the network and who can reach
        it: endpoint and port, public accessibility, security groups, subnets
        with their VPC, the internet-exposure analysis, IAM authentication, and
        storage encryption, plus the instance tags.

        The configuration inventory above identifies the instance; this query
        is what a data-store reachability review needs. The security group IDs
        join to the `Security group ingress rules and attachments` query, so a
        rule that admits an application security group into the database group
        connects an internet-exposed workload to the database it can reach.
        Tags carry the ownership and environment metadata used for business
        priority.
    variants:
      - uid: mondoo-asset-inventory-aws-rds-dbinstances-network-all
      - uid: mondoo-asset-inventory-aws-rds-dbinstances-network-single
  - uid: mondoo-asset-inventory-aws-rds-dbinstances-network-all
    filters: asset.platform == "aws"
    mql: |
      aws.rds.instances {
        id
        arn
        region
        engine
        endpoint
        port
        publiclyAccessible
        iamDatabaseAuthentication
        storageEncrypted
        dbClusterIdentifier
        securityGroups { id name }
        subnets { id isPublic }
        exposure {
          internetReachable
          publiclyAccessible
          securityGroupAllowsIngress
          openIngressRules { ipProtocol fromPort toPort ipRanges ipv6Ranges }
        }
        tags
      }
  - uid: mondoo-asset-inventory-aws-rds-dbinstances-network-single
    filters: asset.platform == "aws-rds-dbinstance"
    mql: |
      aws.rds.dbinstance {
        id
        arn
        region
        engine
        endpoint
        port
        publiclyAccessible
        iamDatabaseAuthentication
        storageEncrypted
        dbClusterIdentifier
        securityGroups { id name }
        subnets { id isPublic }
        exposure {
          internetReachable
          publiclyAccessible
          securityGroupAllowsIngress
          openIngressRules { ipProtocol fromPort toPort ipRanges ipv6Ranges }
        }
        tags
      }

  - uid: mondoo-asset-inventory-aws-rds-dbcluster-maintenance
    title: RDS database cluster pending maintenance
    filters: asset.platform == "aws"
    docs:
      desc: |
        Lists pending maintenance actions for every RDS database cluster, including the action type, scheduling state, and automatic or forced application dates.
    mql: |
      aws.rds.clusters {
        id
        arn
        region
        pendingMaintenanceActions {
          action
          description
          autoAppliedAfterDate
          currentApplyDate
          forcedApplyDate
          optInStatus
        }
      }

  - uid: mondoo-asset-inventory-aws-rds-dbcluster-recommendations
    title: RDS database cluster recommendations
    filters: asset.platform == "aws"
    docs:
      desc: |
        Lists Amazon RDS recommendations for every database cluster, including security findings, severity, lifecycle status, and recommended remediation actions.
    mql: |
      aws.rds.clusters {
        id
        arn
        region
        recommendations {
          id
          typeId
          category
          severity
          status
          createdAt
          updatedAt
          detection
          recommendation
          description
          reason
          impact
          actions {
            id
            title
            description
            operation
            parameters
            applyModes
            status
            contextAttributes
          }
        }
      }

  - uid: mondoo-asset-inventory-aws-rds-dbinstance-maintenance
    title: RDS database instance pending maintenance
    filters: asset.platform == "aws"
    docs:
      desc: |
        Lists pending maintenance actions for every RDS database instance, including the action type, scheduling state, and automatic or forced application dates.
    mql: |
      aws.rds.instances {
        id
        arn
        region
        pendingMaintenanceActions {
          action
          description
          autoAppliedAfterDate
          currentApplyDate
          forcedApplyDate
          optInStatus
        }
      }

  - uid: mondoo-asset-inventory-aws-rds-dbinstance-recommendations
    title: RDS database instance recommendations
    filters: asset.platform == "aws"
    docs:
      desc: |
        Lists Amazon RDS recommendations for every database instance, including security findings, severity, lifecycle status, and recommended remediation actions.
    mql: |
      aws.rds.instances {
        id
        arn
        region
        recommendations {
          id
          typeId
          category
          severity
          status
          createdAt
