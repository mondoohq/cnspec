packs:
  - uid: mondoo-cloudflare-inventory
    name: Cloudflare Inventory Pack
    version: 1.1.0
    license: BUSL-1.1
    require:
      - provider: cloudflare
    authors:
      - name: Mondoo, Inc
        email: hello@mondoo.com
    tags:
      mondoo.com/platform: cloudflare,cloud,saas
      mondoo.com/category: best-practices
    summary: Inventory Cloudflare zones, DNS, certificates, Workers, R2, Stream, and Zero Trust
    docs:
      desc: |
        Collects Cloudflare inventory. Zone assets report zone details, settings, nameservers, DNS records, and certificates. Account assets report account settings, Workers, Pages, R2 buckets, Stream inputs and videos, and Cloudflare One applications and identity providers.

        ## Scan a Cloudflare account and its zones

        ```bash
        cnspec scan cloudflare --token <access_token> --discover all -f mondoo-cloudflare-inventory.mql.yaml
        ```
    groups:
      - title: Zone Inventory
        filters: asset.platform == "cloudflare-zone"
        queries:
          - uid: mondoo-cloudflare-inventory-zones
          - uid: mondoo-cloudflare-inventory-zone-settings
          - uid: mondoo-cloudflare-inventory-zone-nameservers
      - title: DNS Records
        filters: asset.platform == "cloudflare-zone"
        queries:
          - uid: mondoo-cloudflare-inventory-dns-records
          - uid: mondoo-cloudflare-inventory-dns-proxied-records
      - title: Certificate Inventory
        filters: asset.platform == "cloudflare-zone"
        queries:
          - uid: mondoo-cloudflare-inventory-custom-certificates
          - uid: mondoo-cloudflare-inventory-certificate-packs
      - title: Account Inventory
        filters: asset.platform == "cloudflare-account"
        queries:
          - uid: mondoo-cloudflare-inventory-accounts
          - uid: mondoo-cloudflare-inventory-account-settings
      - title: Workers Inventory
        filters: asset.platform == "cloudflare-account"
        queries:
          - uid: mondoo-cloudflare-inventory-workers
          - uid: mondoo-cloudflare-inventory-pages
      - title: R2 Storage Inventory
        filters: asset.platform == "cloudflare-account"
        queries:
          - uid: mondoo-cloudflare-inventory-r2-buckets
      - title: Stream Inventory
        filters: asset.platform == "cloudflare-account"
        queries:
          - uid: mondoo-cloudflare-inventory-live-inputs
          - uid: mondoo-cloudflare-inventory-videos
      - title: Cloudflare One Inventory
        filters: asset.platform == "cloudflare-account"
        queries:
          - uid: mondoo-cloudflare-inventory-one-apps
          - uid: mondoo-cloudflare-inventory-one-idps

queries:
  - uid: mondoo-cloudflare-inventory-zones
    title: Zone details
    docs:
      desc: Zone status, type, timestamps, account, and owner.
    mql: |
      cloudflare.zone {
        id
        name
        status
        paused
        type
        createdOn
        modifiedOn
        account {
          id
          name
        }
        owner {
          id
          name
          ownerType
        }
      }

  - uid: mondoo-cloudflare-inventory-zone-settings
    title: Zone security settings
    docs:
      desc: SSL mode, TLS versions, HSTS, WAF, and security level.
    mql: |
      cloudflare.zone {
        name
        settings {
          ssl
          alwaysUseHttps
          minTlsVersion
          tls13
          automaticHttpsRewrites
          hstsEnabled
          hstsMaxAge
          securityLevel
          waf
          browserCheck
          opportunisticEncryption
          emailObfuscation
          hotlinkProtection
          serverSideExcludes
        }
      }

  - uid: mondoo-cloudflare-inventory-zone-nameservers
    title: Zone nameservers
    docs:
      desc: Assigned Cloudflare nameservers and the original ones.
    mql: |
      cloudflare.zone {
        name
        nameServers
        originalNameServers
      }

  - uid: mondoo-cloudflare-inventory-dns-records
    title: DNS records
    docs:
      desc: Record type, content, TTL, proxy status, and tags.
    mql: |
      cloudflare.zone {
        name
        dns.records {
          name
          type
          content
          ttl
          proxied
          proxiable
          comment
          tags
          createdOn
          modifiedOn
        }
      }

  - uid: mondoo-cloudflare-inventory-dns-proxied-records
    title: Proxied DNS records
    docs:
      desc: Records routed through the Cloudflare proxy.
    mql: |
      cloudflare.zone {
        name
        dns.records.where(proxied == true) {
          name
          type
          content
          ttl
        }
      }

  - uid: mondoo-cloudflare-inventory-custom-certificates
    title: Custom SSL certificates
    docs:
      desc: Uploaded certificates with hosts, issuer, and expiry.
    mql: |
      cloudflare.zone {
        name
        customCertificates {
          id
          hosts
          issuer
          signature
          status
          bundleMethod
          expiresAt
          uploadedAt
          modifiedAt
          priority
        }
      }

  - uid: mondoo-cloudflare-inventory-certificate-packs
    title: Certificate packs
    docs:
      desc: Cloudflare-issued certificates, validation, and CA.
    mql: |
      cloudflare.zone {
        name
        certificatePacks {
          id
          type
          hosts
          status
          validationMethod
          validityDays
          certificateAuthority
        }
      }

  - uid: mondoo-cloudflare-inventory-accounts
    title: Account details
    docs:
      desc: Account ID, name, type, and creation date.
    mql: |
      cloudflare.account {
        id
        name
        type
        createdOn
      }

  - uid: mondoo-cloudflare-inventory-account-settings
    title: Account settings
    docs:
      desc: Account-wide two-factor authentication enforcement.
    mql: |
      cloudflare.account {
        name
        settings {
          enforceTwoFactor
        }
      }

  - uid: mondoo-cloudflare-inventory-workers
    title: Workers
    docs:
      desc: Worker scripts with deployment, placement, and logging.
    mql: |
      cloudflare.account {
        name
        workers.workers {
          id
          size
          deploymentId
          placementMode
          lastDeployedFrom
          logPush
          observabilityEnabled
          createdOn
          modifiedOn
        }
      }

  - uid: mondoo-cloudflare-inventory-pages
    title: Pages deployments
    docs:
      desc: Pages projects with environment, URL, and branch.
    mql: |
      cloudflare.account {
        name
        workers.pages {
          shortId
          projectName
          environment
          url
          aliases
          productionBranch
          createdOn
          modifiedOn
        }
      }

  - uid: mondoo-cloudflare-inventory-r2-buckets
    title: R2 buckets
    docs:
      desc: Buckets with location, creation date, and public access.
    mql: |
      cloudflare.account {
        name
        r2.buckets {
          name
          location
          createdOn
          publicAccessEnabled
          publicAccessDomain
        }
      }

  - uid: mondoo-cloudflare-inventory-live-inputs
    title: Stream live inputs
    docs:
      desc: Live inputs and their recording retention.
    mql: |
      cloudflare.account {
        name
        liveInputs {
          uid
          name
          deleteRecordingAfterDays
        }
      }

  - uid: mondoo-cloudflare-inventory-videos
    title: Stream videos
    docs:
      desc: Videos with size, readiness, and signed-URL requirement.
    mql: |
      cloudflare.account {
        name
        videos {
          uid
          name
          creator
          duration
          height
          width
          size
          ready
          requireSignedUrls
          dash
          hls
          uploaded
        }
      }

  - uid: mondoo-cloudflare-inventory-one-apps
    title: Cloudflare One Access applications
    docs:
      desc: Access apps with domain, IdPs, session, cookies, CORS.
    mql: |
      cloudflare.account {
        name
        one.apps {
          id
          name
          domain
          type
          allowedIdentityProviders
          autoRedirectToIdentity
          appLauncherVisible
          sessionDuration
          enableBindingCookie
          httpOnlyCookieAttribute
          sameSiteCookieAttribute
          serviceAuth401Redirect
          corsHeaders {
            allowAllHeaders
            allowAllMethods
            allowAllOrigins
            allowCredentials
            allowedHeaders
            allowedMethods
            allowedOrigins
            maxAge
          }
          createdAt
          updatedAt
        }
      }

  - uid: mondoo-cloudflare-inventory-one-idps
    title: Cloudflare One identity providers
    docs:
      desc: Identity providers by name, type, and SCIM status.
    mql: |
      cloudflare.account {
        name
        one.identityProviders {
          id
          name
          type
          scimEnabled
        }
      }
