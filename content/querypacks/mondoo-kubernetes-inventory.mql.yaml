packs:
  - uid: mondoo-kubernetes-inventory
    name: Kubernetes Inventory Pack
    version: 1.5.0
    license: BUSL-1.1
    require:
      - provider: k8s
    authors:
      - name: Mondoo, Inc
        email: hello@mondoo.com
    tags:
      mondoo.com/platform: kubernetes
      mondoo.com/category: best-practices
    summary: Inventory Kubernetes cluster resources and workloads
    docs:
      desc: |
        Inventories a Kubernetes cluster: server version, namespaces, nodes, RBAC roles and bindings, quotas, limit ranges, storage, autoscalers, and workload resources such as pods, deployments, jobs, and ingresses.

        Enable this query pack in [Mondoo Platform](https://mondoo.com/platform) to automatically inventory your clusters, or scan a cluster manually with cnspec:

        ```bash
        cnspec scan k8s -f mondoo-kubernetes-inventory.mql.yaml
        ```
    groups:
      - title: Cluster inventory
        filters: asset.platform == "k8s-cluster"
        queries:
          - uid: k8s-cluster-version
            title: Kubernetes cluster version
            docs:
              desc: Reports the Kubernetes API server version for cluster identification.
            mql: |
              k8s.serverVersion
          - uid: k8s-cluster-namespaces
            title: Kubernetes cluster namespaces
            docs:
              desc: Lists all namespaces in the Kubernetes cluster.
            mql: |
              k8s.namespaces
          - uid: k8s-cluster-nodes
            title: Cluster nodes
            docs:
              desc: Lists all nodes in the Kubernetes cluster with their status.
            mql: |
              k8s.nodes
          - uid: k8s-cluster-node-instances
            title: Cluster node cloud provider IDs
            docs:
              desc: |
                Maps each node name to its cloud provider ID, linking Kubernetes
                nodes to the underlying cloud instances for internet-exposure
                attribution.
            mql: |
              k8s.nodes { name providerID }
          - uid: k8s-cluster-pod-nodes
            title: Pod-to-node placement
            docs:
              desc: |
                Maps each pod to the node it runs on, tracing workloads behind an
                internet-facing ingress or load balancer down to a specific node
                and, via the node provider ID, the underlying cloud instance.

                The pod IP is included so that the registered targets of an
                ip-type cloud load balancer target group (see the AWS inventory
                pack's `ipTargets`) resolve to a pod, and from there to a node
                and its cloud instance, without relying on Service or Ingress
                relations.
            mql: |
              k8s.pods { namespace name nodeName podIP }
          - uid: k8s-cluster-internet-exposed-pod-nodes
            title: Nodes hosting internet-exposed workloads
            docs:
              desc: |
                Lists every pod that a Service, Ingress, or Gateway routes to from
                the public internet, together with the node it runs on and that
                node's cloud provider ID.

                This is the load-balancer half of host internet exposure. A node
                can have no public IP, sit in a private subnet, and carry no
                security group that admits `0.0.0.0/0`, yet still serve internet
                traffic because an internet-facing load balancer forwards to a pod
                scheduled on it. Cloud-side instance exposure analysis cannot see
                that path: with `ip`-type target groups the registered targets are
                pod IPs, so the instance is never a load balancer target. Each
                entry names the exposing object and the reason, so a reviewer can
                tell deliberate exposure from accidental.

                Join `nodeName` to the `Cluster node cloud provider IDs` query in
                this group to reach the cloud instance. The pod's own `node`
                relation is deliberately not used here: nodes are cluster-scoped,
                so it resolves to null on namespace-scoped assets and manifest
                scans, whereas `nodeName` is always set for a scheduled pod.

                Join the `containerStatuses` image IDs to container image assets
                to reach the images an exposed pod is actually serving traffic
                with. The IDs are kubelet-resolved, so they carry the running
                image's digest even when the pod spec references a mutable tag,
                and they cover only the pod's serving containers: init and
                ephemeral containers ran or debug on the pod but do not serve,
                so they are deliberately not part of the exposure surface. The
                platform folds these digests into the "runs an internet-exposed
                workload" risk factor on the matching container image assets,
                which prioritizes the CVEs found in those images.
            mql: |
              k8s.pods.where(exposures.any(internetExposed == true)) {
                namespace
                name
                nodeName
                podIP
                containerStatuses {
                  imageId
                }
                exposures {
                  sourceKind
                  sourceRef
                  namespace
                  name
                  internetExposed
                  exposureReason
                  addresses
                  ports
                  protocols
                }
              }
          - uid: k8s-cluster-internet-exposed-image-digests
            title: Serving-container images of internet-exposed pods
            docs:
              desc: |
                The kubelet-resolved image IDs of the serving containers of
                every internet-exposed pod, as a minimal projection. This is
                the platform's read surface for attributing workload exposure
                to container image assets ("runs an internet-exposed
                workload"): keeping it separate from the full exposed-pod
                inventory above means the exposure fold decodes only image IDs
                instead of the entire exposure projection, and the two queries
                can evolve independently without breaking the fold's datapoint
                lookup. Init and ephemeral containers do not serve traffic and
                are deliberately not included.
            mql: |
              k8s.pods.where(exposures.any(internetExposed == true)) {
                containerStatuses {
                  imageId
                }
              }
          - uid: k8s-cluster-clusterroles
            title: Cluster RBAC ClusterRoles
            docs:
              desc: Lists all cluster-wide RBAC ClusterRoles for permission auditing.
            mql: |
              k8s.clusterroles
          - uid: k8s-cluster-roles
            title: RBAC Roles
            docs:
              desc: Lists all namespace-scoped RBAC Roles for permission auditing.
            mql: |
              k8s.roles
          - uid: k8s-cluster-clusterrolebindings
            title: RBAC cluster-rolebindings
            docs:
              desc: Lists all ClusterRoleBindings that grant cluster-wide permissions.
            mql: |
              k8s.clusterrolebindings
          - uid: k8s-cluster-rolebindings
            title: RBAC rolebindings
            docs:
              desc: Lists all namespace-scoped RoleBindings for permission auditing.
            mql: |
              k8s.rolebindings
          - uid: k8s-cluster-resource-quotas
            title: Resource quotas
            docs:
              desc: Lists all ResourceQuotas across namespaces for capacity planning and governance.
            mql: |
              k8s.resourceQuotas
          - uid: k8s-cluster-limit-ranges
            title: Limit ranges
            docs:
              desc: Lists all LimitRanges across namespaces for default resource constraint visibility.
            mql: |
              k8s.limitRanges
          - uid: k8s-cluster-persistent-volumes
            title: Persistent volumes
            docs:
              desc: Lists all PersistentVolumes in the cluster for storage auditing.
            mql: |
              k8s.persistentVolumes
          - uid: k8s-cluster-hpas
            title: Horizontal pod autoscalers
            docs:
              desc: Lists all HorizontalPodAutoscalers for scaling configuration visibility.
            mql: |
              k8s.horizontalPodAutoscalers
          - uid: k8s-network-exposures
            title: Network exposures
            docs:
              desc: Lists normalized Kubernetes network exposure evidence from Services, Ingresses, Gateway API routes, and available network intent integrations.
            mql: |
              k8s.networkExposures {
                sourceKind
                sourceRef
                namespace
                name
                addresses
                ports
                protocols
                internetExposed
                exposureReason
                networkClassifications
                metadataClassification
                owner
                vrf
                network
                routes
                policyCoverage
                confidence
              }
          - uid: k8s-gateway-api-inventory
            title: Gateway API exposure inventory
            docs:
              desc: Lists normalized Gateway API gateway and route exposure evidence without requiring optional Gateway API CRDs to be installed.
            mql: |
              k8s.networkExposures.where(
                sourceKind == "Gateway" ||
                sourceKind == "HTTPRoute" ||
                sourceKind == "GRPCRoute" ||
                sourceKind == "TLSRoute" ||
                sourceKind == "TCPRoute" ||
                sourceKind == "UDPRoute"
              ) {
                sourceKind
                sourceRef
                namespace
                name
                addresses
                ports
                protocols
                internetExposed
                exposureReason
                networkClassifications
                routes
                confidence
              }
          - uid: k8s-egress-routes
            title: Egress routes
            docs:
              desc: Lists normalized egress route intent and observed route summaries from HBN and compatible network integrations.
            mql: |
              k8s.egressRoutes {
                sourceRef
                vrf
                network
                destinations
                cidrs
                publicCidrs
                nat
                nodeStatuses
                bgpPeerings
                classification
                metadataClassification
                owner
                confidence
              }
          - uid: k8s-egress-nats
            title: Egress NAT
            docs:
              desc: Lists normalized egress NAT intent and observed NAT summaries from HBN and compatible network integrations.
            mql: |
              k8s.egressNats {
                sourceRef
                vrf
                network
                addresses
                cidrs
                publicCidrs
                nodeStatuses
                classification
                metadataClassification
                owner
              }
          - uid: k8s-network-policy-coverage
            title: Network policy coverage
            docs:
              desc: Lists normalized NetworkPolicy, AdminNetworkPolicy, BaselineAdminNetworkPolicy, MultiNetworkPolicy, Calico, and Cilium coverage summaries across primary and secondary interfaces.
            mql: |
              k8s.networkPolicyCoverages {
                workloadRef
                policyRef
                namespace
                podSelector
                interfaces
                nativeNetworkPolicies
                adminNetworkPolicies
                multiNetworkPolicies
                calicoPolicies
                ciliumPolicies
                defaultDenyIngress
                defaultDenyEgress
                adminDefaultDenyIngress
                adminDefaultDenyEgress
                secondaryInterfaceIngressCovered
                secondaryInterfaceEgressCovered
                coverageGaps
              }
      - title: Pods inventory
        filters: asset.platform == "k8s-pod"
        queries:
          - uid: k8s-pod
            title: Pod information
            docs:
              desc: Returns the pod's full spec and status.
            mql: |
              k8s.pod
          - uid: k8s-pod-container
            title: Container information
            docs:
              desc: Lists all containers in the pod with their configuration.
            mql: |
              k8s.pod.containers
      - title: Deployments inventory
        filters: asset.platform == "k8s-deployment"
        queries:
          - uid: k8s-deployment
            title: Deployment information
            docs:
              desc: Returns each deployment's spec and status.
            mql: |
              k8s.deployments
          - uid: k8s-deployment-container
            title: Container information
            docs:
              desc: Lists all containers defined in the deployment with their configuration.
            mql: |
              k8s.deployment.containers { * }
      - title: CronJobs inventory
        filters: asset.platform == "k8s-cronjob"
        queries:
          - uid: k8s-cronjob
            title: CronJob information
            docs:
              desc: Returns the CronJob's schedule, job template, spec, and status.
            mql: |
              k8s.cronjob { * }
          - uid: k8s-cronjob-container
            title: Container information
            docs:
              desc: Lists all containers defined in the CronJob with their configuration.
            mql: |
              k8s.cronjob.containers { * }
      - title: Jobs inventory
        filters: asset.platform == "k8s-job"
        queries:
          - uid: k8s-job
            title: Job information
            docs:
              desc: Returns the Job's spec and status.
            mql: |
              k8s.job { * }
          - uid: k8s-job-container
            title: Container information
            docs:
              desc: Lists all containers defined in the Job with their configuration.
            mql: |
              k8s.job.containers { * }
      - title: DaemonSets inventory
        filters: asset.platform == "k8s-daemonset"
        queries:
          - uid: k8s-daemonset
            title: DaemonSet information
            docs:
              desc: Returns the DaemonSet's spec and status.
            mql: |
              k8s.daemonset { * }
          - uid: k8s-daemonset-container
            title: Container information
            docs:
              desc: Lists all containers defined in the DaemonSet with their configuration.
            mql: |
              k8s.daemonset.containers { * }
      - title: StatefulSets inventory
        filters: asset.platform == "k8s-statefulset"
        queries:
          - uid: k8s-statefulset
            title: StatefulSet information
            docs:
              desc: Returns the StatefulSet's spec and status.
            mql: |
              k8s.statefulset { * }
          - uid: k8s-statefulset-container
            title: Container information
            docs:
              desc: Lists all containers defined in the StatefulSet with their configuration.
            mql: |
              k8s.statefulset.containers { * }
      - title: ReplicaSets inventory
        filters: asset.platform == "k8s-replicaset"
        queries:
          - uid: k8s-replicaset
            title: ReplicaSet information
            docs:
              desc: Returns the ReplicaSet's spec and status.
            mql: |
              k8s.replicaset { * }
          - uid: k8s-replicaset-container
            title: Container information
            docs:
              desc: Lists all containers defined in the ReplicaSet with their configuration.
            mql: |
              k8s.replicaset.containers { * }
      - title: Ingresses inventory
        filters: asset.platform == "k8s-ingress"
        queries:
          - uid: k8s-ingress
            title: Ingress information
            docs:
              desc: Returns the Ingress rules and backend service configuration.
            mql: |
              k8s.ingress { * }
      - title: Services inventory
        filters: asset.platform == "k8s-service"
        queries:
          - uid: k8s-service
            title: Service information
            docs:
              desc: |
                Returns the Service type, selector, ports, load balancer addresses,
                the pods it routes to, and its network exposures.

                Ingress alone does not describe the full public surface of a
                cluster. A `type: LoadBalancer` Service provisions its own cloud
                load balancer with no Ingress object involved, so without this
                query those workloads, and the nodes they run on, cannot be tied
                back to the load balancer that publishes them.
            mql: |
              k8s.service { * }
