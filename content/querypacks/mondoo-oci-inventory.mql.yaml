packs:
  - uid: mondoo-asset-inventory-oci
    name: OCI Asset Inventory Pack
    version: 1.0.0
    license: BUSL-1.1
    require:
      - provider: oci
    authors:
      - name: Mondoo, Inc
        email: hello@mondoo.com
    tags:
      mondoo.com/platform: oci,cloud
      mondoo.com/category: best-practices
    summary: Inventory OCI tenancies, compute, networking, and storage
    docs:
      desc: |
        Inventories an Oracle Cloud Infrastructure (OCI) tenancy: regions and compartments, identity and access management, compute instances and images, virtual cloud networks, and object storage.

        Enable this query pack in [Mondoo Platform](https://mondoo.com/platform) to automatically inventory your OCI tenancy, or scan it manually with cnspec. Manual scans use the API key configured in your OCI CLI config file at `~/.oci/config`:

        ```bash
        cnspec scan oci -f mondoo-oci-inventory.mql.yaml
        ```
    groups:
      - uid: mondoo-asset-inventory-oci-general-group
        title: OCI General
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-tenancy-info
          - uid: mondoo-asset-inventory-oci-regions
          - uid: mondoo-asset-inventory-oci-compartments
      - uid: mondoo-asset-inventory-oci-iam-group
        title: Identity and Access Management
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-iam-users
          - uid: mondoo-asset-inventory-oci-iam-groups
          - uid: mondoo-asset-inventory-oci-iam-policies
      - uid: mondoo-asset-inventory-oci-compute-group
        title: Compute
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-compute-instances
          - uid: mondoo-asset-inventory-oci-compute-images
      - uid: mondoo-asset-inventory-oci-object-storage-group
        title: Object Storage
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-object-storage-namespace
          - uid: mondoo-asset-inventory-oci-object-storage-buckets
      - uid: mondoo-asset-inventory-oci-network-group
        title: Networking
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-network-vcns
          - uid: mondoo-asset-inventory-oci-network-security-lists
          - uid: mondoo-asset-inventory-oci-network-subnets
          - uid: mondoo-asset-inventory-oci-network-route-tables
          - uid: mondoo-asset-inventory-oci-network-internet-gateways
          - uid: mondoo-asset-inventory-oci-network-nat-gateways
          - uid: mondoo-asset-inventory-oci-network-security-groups
          - uid: mondoo-asset-inventory-oci-network-drgs
      - uid: mondoo-asset-inventory-oci-database-group
        title: Database
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-database-autonomous
          - uid: mondoo-asset-inventory-oci-database-db-systems
          - uid: mondoo-asset-inventory-oci-database-backups
          - uid: mondoo-asset-inventory-oci-database-autonomous-backups
      - uid: mondoo-asset-inventory-oci-load-balancing-group
        title: Load Balancing
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-load-balancers
      - uid: mondoo-asset-inventory-oci-kms-vault-group
        title: Key Management and Vault
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-kms-vaults
          - uid: mondoo-asset-inventory-oci-vault-secrets
          - uid: mondoo-asset-inventory-oci-certificates
          - uid: mondoo-asset-inventory-oci-certificate-authorities
      - uid: mondoo-asset-inventory-oci-oke-group
        title: Kubernetes (OKE)
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-oke-clusters
      - uid: mondoo-asset-inventory-oci-functions-containers-group
        title: Functions and Containers
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-functions-applications
          - uid: mondoo-asset-inventory-oci-container-instances
      - uid: mondoo-asset-inventory-oci-file-storage-group
        title: File Storage
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-file-systems
      - uid: mondoo-asset-inventory-oci-bastion-group
        title: Bastion
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-bastions
      - uid: mondoo-asset-inventory-oci-logging-monitoring-group
        title: Logging and Monitoring
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-log-groups
          - uid: mondoo-asset-inventory-oci-monitoring-alarms
          - uid: mondoo-asset-inventory-oci-events-rules
          - uid: mondoo-asset-inventory-oci-ons-topics
      - uid: mondoo-asset-inventory-oci-security-posture-group
        title: Security Posture
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-cloud-guard-targets
          - uid: mondoo-asset-inventory-oci-vss-host-scan-recipes
          - uid: mondoo-asset-inventory-oci-vss-container-scan-recipes
          - uid: mondoo-asset-inventory-oci-data-safe-security-assessments
          - uid: mondoo-asset-inventory-oci-data-safe-user-assessments
          - uid: mondoo-asset-inventory-oci-data-safe-target-databases
      - uid: mondoo-asset-inventory-oci-web-security-group
        title: Web Security
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-waf-policies
          - uid: mondoo-asset-inventory-oci-waf-firewalls
          - uid: mondoo-asset-inventory-oci-network-firewalls
          - uid: mondoo-asset-inventory-oci-network-firewall-policies
          - uid: mondoo-asset-inventory-oci-apigateway-gateways
          - uid: mondoo-asset-inventory-oci-apigateway-deployments
      - uid: mondoo-asset-inventory-oci-redis-group
        title: Redis
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-redis-clusters
      - uid: mondoo-asset-inventory-oci-ai-group
        title: AI Services
        filters: asset.runtime == "oci"
        queries:
          - uid: mondoo-asset-inventory-oci-ai-generative-endpoints
          - uid: mondoo-asset-inventory-oci-ai-generative-models
          - uid: mondoo-asset-inventory-oci-ai-data-science-projects

queries:
  # --- General ---
  - uid: mondoo-asset-inventory-oci-tenancy-info
    title: OCI tenancy information
    filters: asset.platform == "oci"
    docs:
      desc: |
        Returns the OCI tenancy name, ID, and description.
    mql: |
      oci.tenancy {
        id
        name
        description
      }

  - uid: mondoo-asset-inventory-oci-regions
    title: OCI subscribed regions
    filters: asset.platform == "oci"
    docs:
      desc: Subscribed regions with status and home-region flag.
    mql: |
      oci.regions {
        id
        name
        isHomeRegion
        status
      }

  - uid: mondoo-asset-inventory-oci-compartments
    title: OCI compartments
    filters: asset.platform == "oci"
    docs:
      desc: Tenancy compartments with name, description, and state.
    mql: |
      oci.compartments {
        id
        name
        description
        state
      }

  # --- Identity and Access Management ---
  - uid: mondoo-asset-inventory-oci-iam-users
    title: IAM users
    filters: asset.platform == "oci"
    docs:
      desc: IAM users with state, MFA activation, and last login.
    mql: |
      oci.identity.users {
        id
        name
        email
        emailVerified
        state
        mfaActivated
        created
        lastLogin
        capabilities
      }

  - uid: mondoo-asset-inventory-oci-iam-groups
    title: IAM groups
    filters: asset.platform == "oci"
    docs:
      desc: IAM groups with description, state, and creation time.
    mql: |
      oci.identity.groups {
        id
        name
        description
        state
        created
      }

  - uid: mondoo-asset-inventory-oci-iam-policies
    title: IAM policies
    filters: asset.platform == "oci"
    docs:
      desc: |
        Lists the IAM policies with their permission statements.
    mql: |
      oci.identity.policies {
        id
        name
        description
        state
        statements
      }

  # --- Compute ---
  - uid: mondoo-asset-inventory-oci-compute-instances
    title: Compute instances
    filters: asset.platform == "oci"
    docs:
      desc: Compute instances with shape, state, and domains.
    mql: |
      oci.compute.instances {
        id
        name
        state
        shape
        availabilityDomain
        faultDomain
        created
        freeformTags
      }

  - uid: mondoo-asset-inventory-oci-compute-images
    title: Compute images
    filters: asset.platform == "oci"
    docs:
      desc: Compute images with operating system, version, and size.
    mql: |
      oci.compute.images {
        id
        name
        state
        operatingSystem
        operatingSystemVersion
        sizeInMBs
        created
      }

  # --- Object Storage ---
  - uid: mondoo-asset-inventory-oci-object-storage-namespace
    title: Object Storage namespace
    filters: asset.platform == "oci"
    docs:
      desc: |
        Returns the tenancy Object Storage namespace.
    mql: |
      oci.objectStorage.namespace

  - uid: mondoo-asset-inventory-oci-object-storage-buckets
    title: Object Storage buckets
    filters: asset.platform == "oci"
    docs:
      desc: Buckets with public access, tier, versioning, and KMS key.
    mql: |
      oci.objectStorage.buckets {
        name
        ocid
        publicAccessType
        storageTier
        versioning
        objectEventsEnabled
        replicationEnabled
        isReadOnly
        kmsKeyId
        approximateCount
        approximateSize
        created
      }

  # --- Networking ---
  - uid: mondoo-asset-inventory-oci-network-vcns
    title: Virtual Cloud Networks
    filters: asset.platform == "oci"
    docs:
      desc: Virtual cloud networks with CIDR blocks and DNS settings.
    mql: |
      oci.network.vcns {
        id
        name
        state
        cidrBlocks
        dnsLabel
        vcnDomainName
        created
      }

  - uid: mondoo-asset-inventory-oci-network-security-lists
    title: VCN security lists
    filters: asset.platform == "oci"
    docs:
      desc: VCN security lists with their ingress and egress rules.
    mql: |
      oci.network.securityLists {
        id
        name
        state
        vcn { id }
        ingressRules {
          protocol
          source
          sourceType
          destinationPortMin
          destinationPortMax
          stateless
          description
        }
        egressRules {
          protocol
          destination
          destinationType
          destinationPortMin
          destinationPortMax
          stateless
          description
        }
        created
      }

  - uid: mondoo-asset-inventory-oci-network-subnets
    title: VCN subnets
    filters: asset.platform == "oci"
    docs:
      desc: VCN subnets with CIDR, domain, and public IP restrictions.
    mql: |
      oci.network.subnets {
        id
        name
        state
        cidrBlock
        availabilityDomain
        prohibitPublicIpOnVnic
        prohibitInternetIngress
        dnsLabel
        created
      }

  - uid: mondoo-asset-inventory-oci-network-route-tables
    title: VCN route tables
    filters: asset.platform == "oci"
    docs:
      desc: |
        Lists the VCN route tables with their route rules.
    mql: |
      oci.network.routeTables {
        id
        name
        state
        routeRules
        created
      }

  - uid: mondoo-asset-inventory-oci-network-internet-gateways
    title: Internet gateways
    filters: asset.platform == "oci"
    docs:
      desc: |
        Lists the VCN internet gateways and whether each is enabled.
    mql: |
      oci.network.internetGateways {
        id
        name
        state
        isEnabled
        created
      }

  - uid: mondoo-asset-inventory-oci-network-nat-gateways
    title: NAT gateways
    filters: asset.platform == "oci"
    docs:
      desc: NAT gateways with their public IP and block status.
    mql: |
      oci.network.natGateways {
        id
        name
        state
        blockTraffic
        natIp
        created
      }

  - uid: mondoo-asset-inventory-oci-network-security-groups
    title: Network security groups
    filters: asset.platform == "oci"
    docs:
      desc: Network security groups with ingress and egress rules.
    mql: |
      oci.network.networkSecurityGroups {
        id
        name
        state
        hasStatelessRules
        ingressRules {
          protocol
          source
          sourceType
          destinationPortMin
          destinationPortMax
          stateless
          description
        }
        egressRules {
          protocol
          destination
          destinationType
          destinationPortMin
          destinationPortMax
          stateless
          description
        }
        created
      }

  - uid: mondoo-asset-inventory-oci-network-drgs
    title: Dynamic routing gateways
    filters: asset.platform == "oci"
    docs:
      desc: Dynamic routing gateways with state and creation time.
    mql: |
      oci.network.drgs {
        id
        name
        state
        created
      }

  # --- Database ---
  - uid: mondoo-asset-inventory-oci-database-autonomous
    title: Autonomous databases
    filters: asset.platform == "oci"
    docs:
      desc: Autonomous Databases with workload, CPUs, and license.
    mql: |
      oci.database.autonomousDatabases {
        id
        name
        state
        dbName
        dbVersion
        dbWorkload
        cpuCoreCount
        licenseModel
        isDedicated
        isFreeTier
        created
      }

  - uid: mondoo-asset-inventory-oci-database-db-systems
    title: DB systems
    filters: asset.platform == "oci"
    docs:
      desc: DB systems with shape, edition, version, and node count.
    mql: |
      oci.database.dbSystems {
        id
        name
        state
        shape
        databaseEdition
        version
        cpuCoreCount
        nodeCount
        licenseModel
        availabilityDomain
        created
      }

  - uid: mondoo-asset-inventory-oci-database-backups
    title: Database backups
    filters: asset.platform == "oci"
    docs:
      desc: Database backups with type, edition, size, and timing.
    mql: |
      oci.database.backups {
        id
        name
        state
        type
        databaseEdition
        databaseSizeInGBs
        timeStarted
        timeEnded
      }

  - uid: mondoo-asset-inventory-oci-database-autonomous-backups
    title: Autonomous database backups
    filters: asset.platform == "oci"
    docs:
      desc: Autonomous Database backups with type, size, and origin.
    mql: |
      oci.database.autonomousDatabaseBackups {
        id
        name
        state
        type
        isAutomatic
        sizeInTBs
        timeStarted
        timeEnded
      }

  # --- Load Balancing ---
  - uid: mondoo-asset-inventory-oci-load-balancers
    title: Load balancers
    filters: asset.platform == "oci"
    docs:
      desc: Load balancers with shape, IPs, and delete protection.
    mql: |
      oci.loadBalancer.loadBalancers {
        id
        name
        state
        shape
        isPrivate
        ipAddresses
        isDeleteProtectionEnabled
        created
      }

  # --- Key Management and Vault ---
  - uid: mondoo-asset-inventory-oci-kms-vaults
    title: KMS vaults
    filters: asset.platform == "oci"
    docs:
      desc: Key Management vaults, whose keys are in the keys field.
    mql: |
      oci.kms.vaults {
        id
        name
        state
        vaultType
        managementEndpoint
        created
      }

  - uid: mondoo-asset-inventory-oci-vault-secrets
    title: Vault secrets
    filters: asset.platform == "oci"
    docs:
      desc: Vault secrets with rotation configuration and status.
    mql: |
      oci.vault.secrets {
        id
        name
        state
        description
        isAutoGenerationEnabled
        isScheduledRotationEnabled
        rotationStatus
        created
      }

  - uid: mondoo-asset-inventory-oci-certificates
    title: Certificates
    filters: asset.platform == "oci"
    docs:
      desc: Managed certificates with algorithms and validity window.
    mql: |
      oci.certificates.certificates {
        id
        name
        state
        configType
        keyAlgorithm
        signatureAlgorithm
        subject
        autoRenewalEnabled
        validityNotAfter
        created
      }

  - uid: mondoo-asset-inventory-oci-certificate-authorities
    title: Certificate authorities
    filters: asset.platform == "oci"
    docs:
      desc: Certificate authorities with algorithm and validity.
    mql: |
      oci.certificates.certificateAuthorities {
        id
        name
        state
        configType
        kind
        signingAlgorithm
        subject
        validityNotAfter
        created
      }

  # --- Kubernetes (OKE) ---
  - uid: mondoo-asset-inventory-oci-oke-clusters
    title: OKE clusters
    filters: asset.platform == "oci"
    docs:
      desc: OKE clusters with version, endpoint exposure, and policy.
    mql: |
      oci.oke.clusters {
        id
        name
        state
        kubernetesVersion
        type
        isPublicEndpointEnabled
        isPodSecurityPolicyEnabled
        isImagePolicyEnabled
        created
      }

  # --- Functions and Containers ---
  - uid: mondoo-asset-inventory-oci-functions-applications
    title: Functions applications
    filters: asset.platform == "oci"
    docs:
      desc: Functions applications with shape and syslog URL.
    mql: |
      oci.functions.applications {
        id
        name
        state
        shape
        syslogUrl
        created
        timeUpdated
      }

  - uid: mondoo-asset-inventory-oci-container-instances
    title: Container instances
    filters: asset.platform == "oci"
    docs:
      desc: Container instances with shape, domains, and restarts.
    mql: |
      oci.containerInstances.instances {
        id
        name
        state
        shape
        availabilityDomain
        faultDomain
        containerCount
        containerRestartPolicy
        created
      }

  # --- File Storage ---
  - uid: mondoo-asset-inventory-oci-file-systems
    title: File systems
    filters: asset.platform == "oci"
    docs:
      desc: File Storage systems with domain, size, and clone flag.
    mql: |
      oci.fileStorage.fileSystems {
        id
        name
        state
        availabilityDomain
        meteredBytes
        isCloneParent
        created
      }

  # --- Bastion ---
  - uid: mondoo-asset-inventory-oci-bastions
    title: Bastions
    filters: asset.platform == "oci"
    docs:
      desc: |
        Lists the bastions with their type and DNS proxy status.
    mql: |
      oci.bastion.bastions {
        id
        name
        state
        bastionType
        dnsProxyStatus
        created
      }

  # --- Logging and Monitoring ---
  - uid: mondoo-asset-inventory-oci-log-groups
    title: Log groups
    filters: asset.platform == "oci"
    docs:
      desc: Logging log groups, whose logs are in the logs field.
    mql: |
      oci.logging.logGroups {
        id
        name
        state
        description
        created
      }

  - uid: mondoo-asset-inventory-oci-monitoring-alarms
    title: Monitoring alarms
    filters: asset.platform == "oci"
    docs:
      desc: Alarms with metric namespace, severity, and query.
    mql: |
      oci.monitoring.alarms {
        id
        name
        state
        namespace
        severity
        isEnabled
        query
      }

  - uid: mondoo-asset-inventory-oci-events-rules
    title: Events rules
    filters: asset.platform == "oci"
    docs:
      desc: Events service rules with condition and enabled status.
    mql: |
      oci.events.rules {
        id
        name
        state
        description
        isEnabled
        condition
        created
      }

  - uid: mondoo-asset-inventory-oci-ons-topics
    title: Notification topics
    filters: asset.platform == "oci"
    docs:
      desc: Notifications topics with their description and state.
    mql: |
      oci.ons.topics {
        id
        name
        state
        description
        created
      }

  # --- Security Posture ---
  - uid: mondoo-asset-inventory-oci-cloud-guard-targets
    title: Cloud Guard targets
    filters: asset.platform == "oci"
    docs:
      desc: Cloud Guard targets with resource and recipe counts.
    mql: |
      oci.cloudGuard.targets {
        id
        name
        state
        targetResourceType
        targetResourceId
        recipeCount
        created
      }

  - uid: mondoo-asset-inventory-oci-vss-host-scan-recipes
    title: Host scan recipes
    filters: asset.platform == "oci"
    docs:
      desc: Host scan recipes with agent, port, and CIS settings.
    mql: |
      oci.vulnerabilityScanning.hostScanRecipes {
        id
        name
        state
        agentScanLevel
        portScanLevel
        cisBenchmarkScanLevel
        applicationScanEnabled
        scheduleType
        created
      }

  - uid: mondoo-asset-inventory-oci-vss-container-scan-recipes
    title: Container scan recipes
    filters: asset.platform == "oci"
    docs:
      desc: Container scan recipes with scan level and image count.
    mql: |
      oci.vulnerabilityScanning.containerScanRecipes {
        id
        name
        state
        scanLevel
        imageCount
        created
      }

  - uid: mondoo-asset-inventory-oci-data-safe-security-assessments
    title: Data Safe security assessments
    filters: asset.platform == "oci"
    docs:
      desc: Data Safe security assessments with type and baseline.
    mql: |
      oci.dataSafe.securityAssessments {
        id
        displayName
        lifecycleState
        type
        isBaseline
        isDeviatedFromBaseline
        region
        created
      }

  - uid: mondoo-asset-inventory-oci-data-safe-user-assessments
    title: Data Safe user assessments
    filters: asset.platform == "oci"
    docs:
      desc: Data Safe user assessments with type and baseline.
    mql: |
      oci.dataSafe.userAssessments {
        id
        displayName
        lifecycleState
        type
        isBaseline
        isDeviatedFromBaseline
        region
        created
      }

  - uid: mondoo-asset-inventory-oci-data-safe-target-databases
    title: Data Safe target databases
    filters: asset.platform == "oci"
    docs:
      desc: Data Safe target databases with type and region.
    mql: |
      oci.dataSafe.targetDatabases {
        id
        displayName
        lifecycleState
        databaseType
        infrastructureType
        region
        created
      }

  # --- Web Security ---
  - uid: mondoo-asset-inventory-oci-waf-policies
    title: WAF policies
    filters: asset.platform == "oci"
    docs:
      desc: Web Application Firewall policies with state and updates.
    mql: |
      oci.waf.policies {
        id
        name
        state
        created
        timeUpdated
      }

  - uid: mondoo-asset-inventory-oci-waf-firewalls
    title: WAF firewalls
    filters: asset.platform == "oci"
    docs:
      desc: Web Application Firewall firewalls with state and updates.
    mql: |
      oci.waf.firewalls {
        id
        name
        state
        created
        timeUpdated
      }

  - uid: mondoo-asset-inventory-oci-network-firewalls
    title: Network firewalls
    filters: asset.platform == "oci"
    docs:
      desc: Network firewalls with shape, addresses, and health.
    mql: |
      oci.networkFirewall.firewalls {
        id
        name
        state
        shape
        ipv4Address
        ipv6Address
        healthStatus
        created
      }

  - uid: mondoo-asset-inventory-oci-network-firewall-policies
    title: Network firewall policies
    filters: asset.platform == "oci"
    docs:
      desc: Network firewall policies and their attached firewalls.
    mql: |
      oci.networkFirewall.policies {
        id
        name
        state
        description
        attachedFirewallCount
        created
      }

  - uid: mondoo-asset-inventory-oci-apigateway-gateways
    title: API gateways
    filters: asset.platform == "oci"
    docs:
      desc: API gateways with endpoint type, hostname, and IP mode.
    mql: |
      oci.apigateway.gateways {
        id
        name
        state
        endpointType
        hostname
        ipMode
        hasResponseCache
        created
      }

  - uid: mondoo-asset-inventory-oci-apigateway-deployments
    title: API gateway deployments
