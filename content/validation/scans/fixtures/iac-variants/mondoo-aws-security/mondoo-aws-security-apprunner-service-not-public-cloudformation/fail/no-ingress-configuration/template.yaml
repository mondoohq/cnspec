AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: egress-only-api
      SourceConfiguration:
        ImageRepository:
          ImageIdentifier: 111122223333.dkr.ecr.us-east-1.amazonaws.com/api:latest
          ImageRepositoryType: ECR
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: arn:aws:apprunner:us-east-1:111122223333:vpcconnector/vpc-conn/1/abc
