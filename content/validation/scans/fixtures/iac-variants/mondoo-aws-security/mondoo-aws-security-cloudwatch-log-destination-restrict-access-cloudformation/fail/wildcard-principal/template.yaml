AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Destination:
    Type: AWS::Logs::Destination
    Properties:
      DestinationName: central-logs
      RoleArn: arn:aws:iam::111122223333:role/CWLtoKinesisRole
      TargetArn: arn:aws:kinesis:us-east-1:111122223333:stream/central
      DestinationPolicy: |
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"*"},"Action":"logs:PutSubscriptionFilter","Resource":"arn:aws:logs:us-east-1:111122223333:destination:central-logs"}]}
