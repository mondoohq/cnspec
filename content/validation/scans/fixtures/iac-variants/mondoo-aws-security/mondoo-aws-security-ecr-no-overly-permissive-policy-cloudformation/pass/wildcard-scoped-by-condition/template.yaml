AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: api
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrgPull
            Effect: Allow
            Principal: "*"
            Action:
              - ecr:BatchGetImage
            Condition:
              StringEquals:
                aws:PrincipalOrgID: o-abcde12345
