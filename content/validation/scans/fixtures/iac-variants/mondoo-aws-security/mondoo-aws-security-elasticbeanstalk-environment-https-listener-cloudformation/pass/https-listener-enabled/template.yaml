AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Environment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: storefront
      EnvironmentName: storefront-prod
      SolutionStackName: 64bit Amazon Linux 2023 v6.0.0 running Node.js 20
      OptionSettings:
        - Namespace: aws:elbv2:listener:443
          OptionName: ListenerEnabled
          Value: "true"
        - Namespace: aws:elbv2:listener:443
          OptionName: SSLCertificateArns
          Value: arn:aws:acm:us-east-1:111122223333:certificate/abc
