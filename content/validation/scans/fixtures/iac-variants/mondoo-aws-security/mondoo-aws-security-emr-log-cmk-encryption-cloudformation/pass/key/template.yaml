AWSTemplateFormatVersion: "2010-09-09"
Resources:
  EMRCluster:
    Type: AWS::EMR::Cluster
    Properties:
      Name: analytics-cluster
      ReleaseLabel: emr-7.0.0
      JobFlowRole: EMR_EC2_DefaultRole
      ServiceRole: EMR_DefaultRole
      LogUri: s3://my-emr-logs/cluster-logs/
      LogEncryptionKmsKeyId: arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
      Instances:
        Ec2SubnetId: subnet-0abc1234def567890
        MasterInstanceGroup:
          InstanceCount: 1
          InstanceType: m5.xlarge
