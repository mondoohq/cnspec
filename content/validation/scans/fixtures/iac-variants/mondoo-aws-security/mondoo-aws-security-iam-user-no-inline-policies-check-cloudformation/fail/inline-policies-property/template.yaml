AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Analyst:
    Type: AWS::IAM::User
    Properties:
      UserName: analyst
      Policies:
        - PolicyName: direct-grant
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::example-reports/quarterly.csv
