AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Analysts:
    Type: AWS::IAM::Group
    Properties:
      GroupName: analysts
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
  Analyst:
    Type: AWS::IAM::User
    Properties:
      UserName: analyst
      Groups:
        - !Ref Analysts
