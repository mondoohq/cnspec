AWSTemplateFormatVersion: "2010-09-09"
Resources:
  PermissionSet:
    Type: AWS::SSO::PermissionSet
    Properties:
      Name: Bespoke
      InstanceArn: arn:aws:sso:::instance/ssoins-1111111111111111
      InlinePolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource: arn:aws:s3:::example-bucket/*
