AWSTemplateFormatVersion: "2010-09-09"
Resources:
  AppDataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Application data key
      EnableKeyRotation: true
      RotationPeriodInDays: 365
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::123456789012:root
            Action: "kms:*"
            Resource: "*"
