AWSTemplateFormatVersion: "2010-09-09"
Resources:
  ConsoleUser:
    Type: AWS::IAM::User
    Properties:
      UserName: analyst
      LoginProfile:
        Password: PlaceholderRotatedOnFirstLogin1!
        PasswordResetRequired: true
  DenySomething:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: deny-kms
      Users:
        - !Ref ConsoleUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Action:
              - kms:Decrypt
            Resource: "*"
