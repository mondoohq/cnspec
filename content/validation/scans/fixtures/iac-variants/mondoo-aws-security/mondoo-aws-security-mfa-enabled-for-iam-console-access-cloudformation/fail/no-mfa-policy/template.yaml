AWSTemplateFormatVersion: "2010-09-09"
Resources:
  ConsoleUser:
    Type: AWS::IAM::User
    Properties:
      UserName: analyst
      LoginProfile:
        Password: PlaceholderRotatedOnFirstLogin1!
        PasswordResetRequired: true
  ReadOnly:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: read-only
      Users:
        - !Ref ConsoleUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
            Resource: arn:aws:s3:::example-reports/quarterly.csv
