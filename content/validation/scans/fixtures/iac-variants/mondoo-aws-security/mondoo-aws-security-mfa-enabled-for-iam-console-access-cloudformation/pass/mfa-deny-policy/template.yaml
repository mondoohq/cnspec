AWSTemplateFormatVersion: "2010-09-09"
Resources:
  ConsoleUser:
    Type: AWS::IAM::User
    Properties:
      UserName: analyst
      LoginProfile:
        Password: PlaceholderRotatedOnFirstLogin1!
        PasswordResetRequired: true
  EnforceMfa:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: enforce-mfa
      Users:
        - !Ref ConsoleUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyAllExceptWithoutMFA
            Effect: Deny
            NotAction:
              - iam:CreateVirtualMFADevice
              - iam:EnableMFADevice
              - iam:ListMFADevices
            Resource: "*"
            Condition:
              BoolIfExists:
                aws:MultiFactorAuthPresent: "false"
