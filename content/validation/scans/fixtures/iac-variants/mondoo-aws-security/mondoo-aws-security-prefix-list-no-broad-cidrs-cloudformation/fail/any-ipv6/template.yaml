AWSTemplateFormatVersion: "2010-09-09"
Resources:
  PrefixList:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: partner-ranges-v6
      AddressFamily: IPv6
      MaxEntries: 10
      Entries:
        - Cidr: "2001:db8::/32"
          Description: Partner A
        - Cidr: "::/0"
          Description: Anywhere v6
