AWSTemplateFormatVersion: "2010-09-09"
Resources:
  SignedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: example.com.
  UnsignedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: example.net.
  Signing:
    Type: AWS::Route53::DNSSEC
    Properties:
      HostedZoneId: !Ref SignedZone
