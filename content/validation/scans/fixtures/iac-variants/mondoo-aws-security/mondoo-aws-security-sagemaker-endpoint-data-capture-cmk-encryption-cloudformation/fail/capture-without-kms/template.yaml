AWSTemplateFormatVersion: "2010-09-09"
Resources:
  EndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - ModelName: fraud-model
          VariantName: AllTraffic
          InitialInstanceCount: 1
          InstanceType: ml.m5.large
      DataCaptureConfig:
        EnableCapture: true
        InitialSamplingPercentage: 20
        DestinationS3Uri: s3://example-capture/fraud
        CaptureOptions:
          - CaptureMode: Input
