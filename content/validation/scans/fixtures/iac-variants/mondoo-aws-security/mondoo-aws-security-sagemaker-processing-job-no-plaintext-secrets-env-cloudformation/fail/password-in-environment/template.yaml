AWSTemplateFormatVersion: "2010-09-09"
Resources:
  Job:
    Type: AWS::SageMaker::ProcessingJob
    Properties:
      ProcessingJobName: nightly-preprocess
      AppSpecification:
        ImageUri: 111122223333.dkr.ecr.us-east-1.amazonaws.com/preprocess:latest
      ProcessingResources:
        ClusterConfig:
          InstanceCount: 1
          InstanceType: ml.m5.large
          VolumeSizeInGB: 30
      RoleArn: arn:aws:iam::111122223333:role/SageMakerProcessing
      Environment:
        DB_PASSWORD: hunter2-example
