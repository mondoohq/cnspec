AWSTemplateFormatVersion: "2010-09-09"
# A rule opening only display :0 does not span 5900-5903. The check must still
# match it, so the port test has to be an overlap and not a containment.
Resources:
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VNC display zero open to the internet
      VpcId: vpc-0abc1234def567890
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5900
          ToPort: 5900
          CidrIp: 0.0.0.0/0
