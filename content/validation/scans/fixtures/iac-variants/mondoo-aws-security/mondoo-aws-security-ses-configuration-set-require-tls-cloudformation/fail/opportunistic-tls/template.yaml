AWSTemplateFormatVersion: "2010-09-09"
Resources:
  # OPTIONAL means SES falls back to plaintext whenever the receiving MTA does
  # not offer STARTTLS, silently downgrading mail in transit.
  TransactionalSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: transactional
      DeliveryOptions:
        TlsPolicy: OPTIONAL
