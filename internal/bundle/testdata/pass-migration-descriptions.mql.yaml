policies:
- uid: example-bench
  name: Example Benchmark
  version: 2.0.0
  tags:
    mondoo.com/category: compliance
    mondoo.com/platform: linux
  require:
  - provider: os
  authors:
  - name: Mondoo, Inc.
    email: hello@mondoo.com
  docs:
    desc: An example benchmark whose controls changed between two releases.
  groups:
  - uid: example-bench-1
    title: Configure the example system
    filters: asset.family.contains("linux")
    checks:
    - uid: example-bench-1-3
  scoring_system: highest impact
queries:
- uid: example-bench-1-3
  title: Ensure /etc/passwd exists
  impact: 30
  mql: |
    file("/etc/passwd").exists
  docs:
    desc: The passwd file lists the local users.
    audit: Run `ls /etc/passwd` and confirm the file exists.
    remediation:
    - id: cli
      desc: Restore /etc/passwd from a backup.
migration_groups:
- title: Example Benchmark 1.0.0 to 2.0.0
  description: Release 2.0.0 of the benchmark renumbered one control and removed another.
  refs:
  - title: Example Benchmark 2.0.0 release notes
    url: https://example.com/benchmark/2.0.0/release-notes
  conditions:
    source_policy:
      uid: example-bench
      version: 1.0.0
    target_policy:
      uid: example-bench
      version: 2.0.0
  stages:
  - title: Changes in 2.0.0
    query_migrations:
    - action: MODIFY
      reason: renumbered
      description: The control moved from 1.1 to 1.3 without other changes.
      source:
        uid: example-bench-1-1
      target:
        uid: example-bench-1-3
    - action: REMOVE
      reason: removed_upstream
      description: Release 2.0.0 of the benchmark removed this recommendation.
      refs:
      - title: Benchmark ticket 1234
        url: https://example.com/tickets/1234
      source:
        uid: example-bench-1-2
