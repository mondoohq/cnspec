# An overlay: it imports a policy that lives outside this bundle and adjusts
# one of that policy's checks. The linter has no Library and no cross-file
# context, so it cannot see either the imported policy or the check being
# adjusted - and must not invent errors about them.
# See mondoohq/server#20175.
policies:
  - uid: overlay-import-example
    name: Overlay import example
    version: 1.0.0
    tags:
      mondoo.com/category: security
      mondoo.com/platform: aws,cloud
    require:
      - provider: aws
    groups:
      - type: import
        policies:
          - mrn: //policy.api.mondoo.app/policies/mondoo-aws-security
      - type: override
        title: corrected checks
        filters:
          - mql: asset.platform == "terraform-plan"
        checks:
          # replaces the implementation
          - uid: mondoo-aws-security-kms-key-no-public-access-terraform-plan
            impact: 10
            action: modify
            mql: |
              true
          # adjusts nothing but the impact
          - uid: mondoo-aws-security-s3-bucket-no-public-access
            action: modify
            impact: 20
