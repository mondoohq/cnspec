policies:
  - uid: example-risk-factors
    name: Example Risk Factors
    version: 1.0.0
    tags:
      mondoo.com/category: security
      mondoo.com/platform: linux
    require:
      - provider: os
    authors:
      - name: Mondoo, Inc.
        email: hello@mondoo.com
    docs:
      desc: A policy that only defines risk factors.
    risk_factors:
      - uid: example-sshd-running
        title: SSH service running
        docs:
          active: The SSH service is running and reachable.
          inactive: The SSH service is not running.
        magnitude: 0.4
        is_absolute: false
        filters:
          - mql: asset.family.contains('linux')
        checks:
          - uid: example-sshd-running-check
            mql: service('sshd').running
