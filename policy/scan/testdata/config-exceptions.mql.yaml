# Checks that exceptions from config files (ADR-0006) act on. Every check but
# passing-check fails on any asset.
policies:
  - uid: config-exceptions
    name: Config exceptions
    version: 1.0.0
    groups:
      - filters: true == true
        checks:
          - uid: passing-check
            title: Passes
            mql: true == true
          - uid: accepted-check
            title: Fails, risk accepted
            mql: asset.name == "not-this-asset-1"
          - uid: disabled-check
            title: Fails, disabled
            mql: asset.name == "not-this-asset-2"
          - uid: expired-check
            title: Fails, exception expired
            mql: asset.name == "not-this-asset-3"
