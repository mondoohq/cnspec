# Which parts of the OCSF schema cnspec emits.
#
# The Go types in types.gen.go and enums.gen.go are generated from this file plus
# the compiled schemas in schemas/. Attribute names, Go types, optionality, enum
# constants and doc comments all come from the schema, so they cannot drift from
# it; this file only decides what is *in* the output.
#
# Keep it a subset. A generated type set covering all of OCSF is unusable here:
# the object graph is recursive and a full compliance_finding is over 7,000
# Parquet columns, against 24 for the set below.
#
# Attributes are emitted in the order listed. Generation fails if an attribute
# does not exist in any supported version; one that exists in only some versions
# is emitted with a note saying which.

classes:
  compliance_finding:
    go: ComplianceFinding
    attributes:
      - activity_id
      - activity_name
      - category_uid
      - category_name
      - class_uid
      - class_name
      - type_uid
      - type_name
      - time
      - severity_id
      - severity
      - status_id
      - status
      - status_code
      - status_detail
      - message
      - metadata
      - unmapped
      - compliance
      - finding_info
      - remediation
      - resources
      - device
      - cloud

  detection_finding:
    go: DetectionFinding
    attributes:
      - activity_id
      - activity_name
      - category_uid
      - category_name
      - class_uid
      - class_name
      - type_uid
      - type_name
      - time
      - severity_id
      - severity
      - status_id
      - status
      - status_code
      - status_detail
      - message
      - metadata
      - unmapped
      - finding_info
      - risk_score
      - risk_level_id
      - risk_level
      - impact_id
      - impact
      - impact_score
      - remediation
      - resources
      - device
      - cloud

  vulnerability_finding:
    go: VulnerabilityFinding
    attributes:
      - activity_id
      - activity_name
      - category_uid
      - category_name
      - class_uid
      - class_name
      - type_uid
      - type_name
      - time
      - severity_id
      - severity
      - status_id
      - status
      - status_code
      - message
      - metadata
      - unmapped
      - finding_info
      - vulnerabilities
      - resources
      - device
      - cloud

  inventory_info:
    go: InventoryInfo
    attributes:
      - activity_id
      - activity_name
      - category_uid
      - category_name
      - class_uid
      - class_name
      - type_uid
      - type_name
      - time
      - severity_id
      - severity
      - message
      - metadata
      - unmapped
      - device
      - cloud

objects:
  metadata: [version, product, log_name, log_provider, logged_time, profiles, event_code, labels]
  product: [name, vendor_name, version, url_string]
  finding_info:
    [uid, title, desc, created_time, first_seen_time, modified_time, product_uid, src_url, types,
     data_sources, analytic]
  analytic: [type_id, type, name, uid, desc, category, version]
  compliance:
    [standards, control, requirements, status, status_id, status_code, status_detail, status_details, category, desc]
  resource_details: [uid, name, type, labels, cloud_partition, region, namespace, version]
  remediation: [desc, references]
  cloud: [provider, account, region, zone, project_uid]
  account: [uid, name, type]
  device: [type_id, type, uid, name, hostname, domain, region, os, hw_info]
  os: [name, type_id, type, version, build]
  device_hw_info: [cpu_type, cpu_info_list]
  cpu_info: [cpu_architecture]
  vulnerability:
    [title, desc, severity, cve, advisory, affected_packages, references, is_fix_available,
     first_seen_time, last_seen_time, vendor_name, remediation]
  advisory: [uid, title, desc, references]
  cve: [uid, title, desc, created_time, modified_time, cvss, references]
  cvss: [version, base_score, severity, vector_string]
  affected_package: [name, version, architecture, purl, fixed_in_version, package_manager]

# Go types that differ from what the schema type implies.
overrides:
  # OCSF types unmapped as a free-form object. A map keeps it queryable in
  # Athena and Parquet, where a JSON blob would not be.
  unmapped: map[string]string
