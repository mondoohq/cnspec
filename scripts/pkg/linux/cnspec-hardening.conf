# Opt-in hardened systemd settings for the cnspec service.
#
# This file has no effect where the package installs it. To activate it:
#
#   mkdir -p /etc/systemd/system/cnspec.service.d
#   cp /usr/share/cnspec/systemd/hardening.conf \
#      /etc/systemd/system/cnspec.service.d/50-cnspec-hardening.conf
#   systemctl daemon-reload
#   systemctl restart cnspec
#
# To change a value, do not edit the copy. Put your own settings in a file
# that sorts after it in the same directory, for example 90-local.conf.

[Service]
# If the host runs out of memory, the kernel kills cnspec before other workloads.
OOMScoreAdjust=500

# Hard memory ceiling for cnspec and everything it starts; above it the kernel kills the scan.
MemoryMax=2G

# Tells the Go runtime to free memory more aggressively as each process approaches this size.
Environment=GOMEMLIMIT=1500MiB

# At most half of one CPU core for cnspec and everything it starts, on any host size.
CPUQuota=50%

# Runs Go code on one thread at a time, which matches the half-core CPU limit.
Environment=GOMAXPROCS=1

# Gives cnspec a fifth of the default CPU share when other services compete for CPU.
CPUWeight=20

# On stop, or after the main process dies, kills every process the service left behind.
KillMode=mixed

# Prevents cnspec and its child processes from gaining privileges through setuid programs.
NoNewPrivileges=yes

# Prevents switching the process to a legacy execution mode.
LockPersonality=yes

# Prevents realtime scheduling, which could take a CPU away from the rest of the host.
RestrictRealtime=yes

# Prevents creating files with the setuid or setgid bit.
RestrictSUIDSGID=yes

# Prevents changing the system or hardware clock (ignored with a warning before systemd 245).
ProtectClock=yes

# Allows only the host's native system-call interface, not 32-bit compatibility calls.
SystemCallArchitectures=native
